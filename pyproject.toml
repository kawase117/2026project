[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    "db",
    "eda/output",
    "Heatmap",
    "document",
    "backtest",
    ".claude",
]

[tool.ruff.lint]
# 安全網のみ（既存コードを壊さない最小セット）: 構文エラー・未定義名・重複引数
select = ["E9", "F63", "F7", "F82", "F821"]

[tool.ruff.format]
quote-style = "preserve"
