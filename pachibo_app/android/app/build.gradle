apply plugin: 'com.android.application'

android {
    namespace 'jp.local.pachiboledger'
    compileSdk 36
    defaultConfig {
        applicationId 'jp.local.pachiboledger'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'jp.local.pachiboledger.BackupVerification'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
