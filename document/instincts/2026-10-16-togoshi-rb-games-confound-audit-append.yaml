# AT_RB_AUDIT.csv を全体再生成すると、新ホールのデータが混ざって他ホールの判定が変わる。新ホールの行だけを追記する

## 背景
2026-10-16、戸越銀座をDBに追加したあと `python -m backtest.at_rb_audit` を実行すると、全ホールの行が書き直された。ホール間のばらつき(across_ratio)に新ホールが加わるため、他ホール4件の判定が変わった: 楽園蒲田のからくりサーカス・禁書目録2が A→B、ARROW池上のやじきたが A→X、平和島のやじきたが B→A。これらは既存の分析で「判別可能」として使われている。上書きすると、過去に出した結論の前提が静かに変わる。台日数の更新で全行のdaysも動くため、差分が大きく見えて変更の中身が追いにくい。

## アクション
- 新ホールを足すときは、まず書き込まずに実行(`audit(collect_days(), load_at_specs())`)して、新ホールの行(hall==新ホール)だけを取り出す。
- 既存の `AT_RB_AUDIT.csv` を読み、新ホール行を `concat` して書く(他ホールは変えない)。
- 全体再生成をする場合は、旧ファイルとマージして verdict・column が変わった行を一覧にし、使われている機種(楽園など)への影響を確認してから書く。
- `load_specs(hall=...)` は `across_inconsistent=True` の機種を使わないので、判定が A→B になると、その機種のAT機判定が消える点に注意。

## 例
戸越銀座の追記: 既存489行 + 戸越60行(A=17、B=13、X=30)=549行。元のまま追記なので、`git diff` は +60行・削除0。全体再生成だと +307/-237行で、4件の判定が変わった。
