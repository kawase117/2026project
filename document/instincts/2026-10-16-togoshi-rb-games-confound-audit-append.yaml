# RBの偏り(z)は回転数が多いほど高く見える。曜日・日付で比べるときは、生の値と回転数統制後を並べて示す

## 背景
2026-10-16、BIGディッパー戸越銀座のRB判別可能機種で、機種ごとのプールRB率からの標準化残差を曜日別に見ると、日曜が最大(ANOVA p=0.001)で、土日−平日は +0.12(日単位 p=0.003)と出た。しかし行を回転数の四分位で分けると、zは -0.65(約2,200G)→ -0.38 → 0.00 → +0.61(約7,900G)と単調に上がり、日平均Gと日平均zの相関は0.56だった。RBが出た台は続けて回されるため、回転数が多いのはRBが出た結果でもある。回転数で統制した回帰(z ~ 土日 + log回転数)では土日の係数は -0.117(p=0.0006)と逆転し、同じ回転数なら土日の方がRBは出ていなかった。直近3か月だけの現象で、その前の3期間では再現しなかった。

ただし回転数は、設定の高さの結果でもあり、客の集中の原因でもある媒介変数である(`2026-10-02-rakuen-d7-tail7-jug-setting-tilt.yaml` の訂正)。統制すると設定の効果を過小評価しうるので、統制後の値だけで「効果なし」とは言えない。

## アクション
- RB(またはAT初当り)の偏りを、曜日・日付・イベント日で比べるときは、先に「日平均Gと日平均zの相関」を確認する。高ければ、生のzだけで曜日の差を結論にしない。
- 生の値と、回転数で統制した値(`z ~ 軸 + log(games)`、日単位でクラスター。または回転数帯の中での比較)を**両方並べて示す**。
- 統制すると符号が逆転するような差(今回の土日)は、「高設定が入る」の根拠にしない。再現するまで watching。

## 例
戸越銀座の直近3か月(ジャグラー・BT・A+AT、約5,800行): 生の土日−平日 +0.12(p=0.003)、回転数統制後 -0.12(p=0.0006)。その前の3期間では土日−平日が 0.002 / 0.096 / -0.013 で再現しなかった。
