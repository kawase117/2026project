# ゾロ目台（末尾11/22/33...99）は末尾別に効果が大きく異なる

## 背景
末尾同じだが、ゾロ目台（末尾2桁が同じ数字）とそれ以外で差枚期待値を比較した。
結果は末尾に大きく依存：
- 末尾0: ゾロ目 +173.80枚 優位
- 末尾5: ゾロ目 +123.66枚 優位
- 末尾9: ゾロ目 +119.52枚 優位
- 末尾6: ゾロ目 +91.33枚 優位
- 末尾1-4: ゾロ目 +11～68枚（弱い優位）
- 末尾7: ゾロ目 -59.36枚 **劣位**
- 末尾8: ゾロ目 -90.55枚 **劣位**

## アクション
同じ末尾で2台選べるなら、必ずゾロ目台を優先するべき（末尾0,5,9,6は特に）。
ただし末尾7,8はクラスター効果の影響で、ゾロ目台も避けるべき。
- 2041 vs 2011 なら 2011（末尾1でゾロ目）が優位
- 2047 vs 2041 なら 2041（末尾1、非ゾロ目）が 2047 より優位（クラスター効果）

## 例
```
末尾0: ゾロ目=00,10,20,30...が +173.80枚期待
末尾5: ゾロ目=55,15,25,35...が +123.66枚期待
末尾7,8: ゾロ目も非ゾロ目もどちらも避ける
```

