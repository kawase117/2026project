# ゾロ目台（11/22/33...99）と非ゾロ目の末尾同じ台は物理的に隣接配置

## 背景
パチスロ機の物理的配置：
- 1100（末尾00=ゾロ目）と 1099（末尾9=非ゾロ目）は隣り合っている
- 2211（末尾11=ゾロ目）と 2210（末尾10=非ゾロ目）は隣り合っている
- つまり、ゾロ目台には自動的に「同じ末尾の非ゾロ目と隣接」という物理的特性がある

ホール側がこれを意図的に活用している可能性：
- ゾロ目台に高設定を集中投入 → 客が「この末尾狙い」と気付く
- 非ゾロ目（隣台）に低設定 → コントラスト演出
- または逆にゾロ目は避ける戦略も考えられる

## アクション
末尾グループを狙うとき、ゾロ目＋隣接の非ゾロ目の関係を理解する：
- ゾロ目優位の末尾（0,1,5,9,6）: ゾロ目に座る
- ゾロ目劣位の末尾（7,8）: 隣接の非ゾロ目（77番隣の76,78等）を検討
- 3（最弱とされる）: ゾロ目なら中位レベルに改善

これはニブイチイベント・並びイベント時の台選びに有用。

## 例
```
# 末尾0の場合（ゾロ目優位）
10,20,30,...,100,110... の中から
00（ゾロ目）を最優先。次点で隣接の非ゾロ目（99, 01など）

# 末尾7の場合（ゾロ目劣位）
17,27,37,...,107,117... の中から
ゾロ目の77を避けて、隣接の76,78を狙う

# 末尾3の場合（最弱だが、ゾロ目なら改善）
13,23,33,...,103,113... の中から
ゾロ目の33はもともと最弱だが、
その他の末尾3よりはマシ。
ただし末尾1や5には及ばない。
```

