# 末尾7,8はクラスター配置（同じ設定を複数台に入れる戦略）のため、ゾロ目台の個別優位が隠れる

## 背景
末尾7,8の差枚期待値：
- 末尾7: ゾロ目 -59.36枚、非ゾロ目でも弱い → 全体的に低設定傾向
- 末尾8: ゾロ目 -90.55枚、非ゾロ目でも弱い → 全体的に低設定傾向

推測される背景：
ホール側は「複数台同時展開」を重視する場合、
末尾7,8の同じ設定複数台をグループで投入する。
このクラスター戦略では、個別台（ゾロ目 vs 非ゾロ目）の差は意味がない。
ホールは「末尾7,8は低設定クラスタ」と戦略的に決めている可能性が高い。

一方、末尾0,1,5,9,6では：
ゾロ目とそれ以外で差が出ている → ホール側が個別台レベルで選別している

## アクション
末尾7,8に関しては：
- ゾロ目台を狙う優位性がない（クラスター効果で個別差が無い）
- 端的に「末尾7,8は全体的に避ける」が正解
- ゾロ目かどうかは関係なく、この末尾グループ自体を避けるべき

末尾0,1,5,9,6 に対してのみゾロ目戦略が有効。

## 例
```
# クラスター効果の確認方法
末尾7の全台の期待差枚: 平均 -50～-70枚
末尾7のゾロ目（77番）: -59枚
末尾7の非ゾロ目（70,71,72...): -40～-70枚

ばらつきはあるが、全体的に低い。
→ ホール側が「末尾7は低設定戦略」と決定している可能性

# 末尾0との対比
末尾0の全台: 期待 +30～+50枚（平均）
末尾0のゾロ目（00番）: +173.80枚（圧倒的優位）
末尾0の非ゾロ目（01,02...): +10～+80枚

ゾロ目との大きな差がある。
→ ホール側が「末尾0のゾロ目台は最高設定候補」と認識している
```

