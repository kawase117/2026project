# ゾロ目効果は曜日・イベント日によって大きく変動（末尾別に異なるパターン）

## 背景
同じ末尾のゾロ目台でも、狙うべき日と避けるべき日が明確に異なる。
例：末尾1 の場合
- 日曜日: ゾロ目 +493枚（11番などが最高設定入る確率高い）
- 月曜日: ゾロ目 +68枚（弱い優位）
- 土曜日: ゾロ目 +245枚（強い優位）

同じ末尾0 でも：
- 土日: ゾロ目 +485, +667枚（圧倒的優位）
- 平日: ゾロ目 +50～150枚（弱い優位）

末尾55・00・22 は月曜日でゾロ目優位が明確。
末尾55・66・42・11・00 は火曜日で優位、ただし88は避けるべき。

## アクション
イベント日・曜日ごとに狙う末尾ゾロ目を明確に変える：
- 週末（土日）: 末尾0,1,5のゾロ目を積極的に狙う
- 月曜日: 末尾00, 22, 55のゾロ目を優先
- 火曜日: 末尾55, 66, 42, 11のゾロ目を優先、末尾88は避ける
- 末尾7,8: いかなる曜日でも非優位

## 例
```
# 土曜日の立ち回り
狙う順: 末尾0(+485), 末尾1(+245), 末尾5, 末尾9
避ける: 末尾7, 末尾8

# 月曜日の立ち回り
狙う順: 末尾00(優位), 末尾22(優位), 末尾55(優位), その他
避ける: 末尾7, 末尾8, and 末尾1-4(弱い)

# 日曜日の立ち回り
狙う順: 末尾1(+667!), 末尾0(+485), 末尾5, 末尾9
```

