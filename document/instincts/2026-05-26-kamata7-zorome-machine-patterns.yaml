# 蒲田7はゾロ目効果の曜日変動から、曜日・イベント別に高設定配置戦略を使い分けている

## 背景
同じ末尾のゾロ目台でも曜日で期待値が大きく変わる事実から、
ホール側は「どの末尾グループにいつ高設定を入れるか」を戦略的に選別していることが分かる。

観察：
- 月曜日（給料日前）: 末尾00, 22, 55に集中投入可能性（ゾロ目優位が明確）
- 火曜日: 末尾55, 66, 42, 11に分散投入、88は避ける
- 週末（土日）: 末尾0,1の全台に高設定（イベント的なビッグチャンス演出）
- 末尾7,8: いかなる曜日でも低設定クラスタ（確定戦略）

これは、ホールが単なる「ランダム配置」ではなく、
「曜日・イベント別に狙いやすい末尾を変える」という戦略を採用していることを示唆。

## アクション
客側（パチスロプレイヤー）は以下の戦略を組む：
1. **月曜日**: 末尾00/22/55のゾロ目台に集中
2. **火曜日**: 末尾55/66/42/11を優先、88は完全スルー
3. **週末**（ニブイチイベント等）: 末尾0,1のどの台でも高チャンス（ゾロ目なら最高）
4. **毎日**: 末尾7,8は避ける
5. **末尾3**: 最弱だが、ゾロ目なら改善。ニブイチ等で末尾3のゾロ目を試す価値あり

## 例
```python
# 曜日別立ち回り戦略（蒲田7の末尾ゾロ目パターン）

weekday_priority = {
    "月": ["末尾00", "末尾22", "末尾55"],      # 給料日前
    "火": ["末尾55", "末尾66", "末尾42", "末尾11"],  # ただし88は避ける
    "水": ["末尾0", "末尾5", "末尾9"],         # 中盤
    "木": ["末尾0", "末尾5", "末尾9"],
    "金": ["末尾1", "末尾5", "末尾9"],         # 週末ムード
    "土": ["末尾0", "末尾1"],                  # イベント濃厚、最高チャンス
    "日": ["末尾0", "末尾1"],                  # イベント濃厚、最高チャンス
}

avoid = ["末尾7", "末尾8"]  # 常に避ける
```

