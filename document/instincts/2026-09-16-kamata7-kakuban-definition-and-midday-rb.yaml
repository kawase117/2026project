# 蒲田7の火曜「角◯」はセクション両端から数えた角番（min or max）。通路角番で採点するとAT側を取り逃す

## 背景
999999Q9Q（GALAXYウスイのメガなな速報）が火曜の翌未明に公表する角番は、
2026-09-16 時点で5火曜分（7/14 AT4・ノーマル7 / 7/28 AT7・N3 / 8/4 AT8・N4 /
8/18 AT6・N3 / 8/25 AT5・N8）が残っている。

この10件を正解ラベルとして、台差枚から同日同機種平均を引いた残差の角番別平均を作り、
公表角番が何位に来るかを定義ごとに比較した（4台以上設置の機種、鉄台2026除外、n>=8の角番）。

| 定義 | AT の平均順位 | ノーマルの平均順位 |
|---|---|---|
| rank_from_aisle（通路角番） | 5.6 | 1.6 |
| rank_from_min | 2.2 | 1.0 |
| rank_from_max | 2.6 | 1.0 |
| **min or max（角N = rank_from_min==N OR rank_from_max==N）** | **1.0（5/5が1位）** | **1.0（5/5が1位）** |

候補が10個ある中で10件すべて1位なので、偶然ではない。
[[kakuban-physical-position-null-result-multi-method]] が「角番（入口・通路からの距離）は
差枚と無相関」という null を出していたのは、通路基準で測っていたためと説明がつく。
角番そのものが無効だったのではなく、数え方が違っていた。

⚠️ 4定義の中から選んだ in-sample の結果。9/22 以降の火曜で out-of-sample を確認すること。

## アクション
1. 蒲田7の角◯の採点・推定は **min or max 定義**で行う（蒲田1と同じ扱い）。
   位置効果のEDAで rank_from_aisle を使うのは従来どおりで、用途を分ける。
2. AT等（機種名に ジャグラー/ハナハナ/ハナビ を含まない）とノーマルは必ず分けて集計する。
   公表8火曜で AT とノーマルの角番が一致した日は0。混ぜると片方を取り逃す。
3. 速報が出なかった日は、機種内で角番ラベルを500回シャッフルする並べ替え検定を付けて
   「推定できたか」を明示する。p>0.3 なら推定不能として扱い、当てずっぽうを記録に残さない。
4. 過去の答え合わせで使った「AT 平均1.9/9」等のベースラインは定義が記録されていないので、
   min or max 定義で取り直してから比較に使う。

## 例
2026-09-15（火）は速報が投稿されず採点不能。min or max 定義でDBのみから推定すると:
- ノーマル: 角3 n=26 残差+587 機種内上位半分73%（p=0.012）→ 推定できる
- AT等: 角5 n=63 残差+447 上位半分49%（p=0.388）、3Fでは角9と同値 → 推定不能
実装と数値は backtest/announce/kamata7__20260915__999999Q9Q.scoring.json の
segment_analysis_without_sokuho に凍結。

