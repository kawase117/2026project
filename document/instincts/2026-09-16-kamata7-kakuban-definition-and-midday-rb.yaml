# 途中データの単台RB・機種平均で、並びや機種を否定しない（勝ち台選抜と試行不足で符号が変わる）

## 背景
2026-09-15 楽園蒲田、site777 16時台（差枚が読めるのは2,000G以上の119台のみ、平均約1,300G）での判断と、
翌日のフルデイ実績の食い違い。

| 16時の判断 | 最終実績 |
|---|---|
| 北斗3115（3,200G・RB8=1/400、店内中央値）は並。3116と同率なら p=0.018 → 「3116の単品」 | 3115 7,288G RB23=1/316（過去390台日の上位23%）+3,810。3114-3116 は凍結ルールの並びブロック +2,953 で成立 |
| リコリコは8台中7台勝ちで「今日いちばん機種に入っている」 | 22台平均 -97、勝ち11台。16時の7/8は2,000G到達台だけの選抜 |
| カバネリ海門・東京喰種は弱い（機種平均マイナス） | カバネリ +66、東京喰種 +873（勝ち15/31） |

ユーザーは現場で「3台だけ異常に回されている」「北斗は初当たりで設定差が出る」として並びを主張し、
そちらが正しかった。

## アクション
1. 途中データのp値は「まだ分からない」と言うのに使い、並び・機種の**否定**には使わない。
2. 否定するなら、同じ島で高回転3連が普段から起きているか（例: 9/14 の同島は高回転3連が全台マイナス）を
   フルデイのDBで確かめてからにする。
3. 途中データの機種平均・勝率は、2,000G到達という勝ち台選抜が入っていることを必ず明記する。
   機種の採否は閉店後のDBで行う。
4. 回転数の集中（島の中で数台だけ高回転・同機種の他台は低回転）と現場観測を、
   途中のボーナス確率より上に置く。[[feedback-narabi-detect-by-games-too]] と同じ向き。

## 例
NG（16時）: 「3115はRB 1/400で並。並びではなく3116の単品」
OK（16時）: 「3116はRB上位1%で確実。3114・3115はまだ試行が足りず、並びかどうかは閉店後に判定」
