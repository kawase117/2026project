# 楽園の「3台並び◯か所」は媒体の数え方なら通常日でも20か所を超える。箇所数ではなく台別の材料で採否する

## Core claim
取材媒体・kawasakislot の「3台並び候補」は緩い数え方で、楽園蒲田では通常日でもその本数が出る。
「3台並び×20ヶ所以上」が媒体の報告で成立しても、予告の的中の証拠にならない。
一方、当方の strict 検出（narabi.py、全台がホール中央値超え・平均+1800）は回転数に出ている並びを落とす。
**箇所数ではなく、候補ごとに回転数3連とRB確率で採否を付け、支持できた本数を数える。**

## Evidence
- 20260914 楽園蒲田（三大天 初、抽選約150人）: 報告 22か所（新館1F5/新館2F3/本館1F4/本館2F4/本館3F6）、strict 検出 7か所
- 報告を再現する緩いルール（同一section連番3台、合計+1500〜3000以上かつ2台以上プラス等）は報告と17〜19か所重なり、9/14 は21〜31か所。
  同ルールの 20260601 以降102日で中央値 18〜34か所、9/14 以上の日が 35〜62%
- 22候補を台別に見ると 強い7・部分4・弱い11。報告には中央台 -2000（吉宗 1008-1010）や1台がG比0.4〜0.8の組も含まれる
- strict が落とした実在の並び: モンキー 3126-3128（-142 / +8000 / +191、3台ともG比3.0〜3.9・自台30日比2.3〜2.4、島の他9台は316〜2,693G）、
  カバネリ 3109-3111（中央 -476 で中央値条件を落とす、G比2.7〜3.4）、再導入1台機種 2017-2019（自台比4.0/6.6/3.6、星矢は -2523 で56確定の伝聞）
- 回転数だけでも偽陽性が出る: キングハナハナ 3169-3171 は G比2.1〜2.8 の3連だが設定5以上事後 46%/30%/3%（事前 設定1=55%）

## Interpretation
- 並びの証拠は差枚より回転数（打ち手が降りなかった）に出る。中心台の大勝ちで差枚ブロックが成立しているだけの組もある
- 999999Q9Q（蒲田1・蒲田7）でも同じ構造（報告の本数は当方 strict の2〜3倍）が確認されており、発信者ごとの換算が要る

## Action
1. 並びの箇所数を宣言する予告は、凍結時に「strict の本数」「緩いルールの本数とそのベースライン」の両方を記録する手順にする。媒体の本数だけで的中と呼ばない
2. 答え合わせでは、候補（報告の画像＋当方の検出）ごとに次を付ける:
   - 回転数: 3台ともホール平均G比>=2.0 かつ 自台30日比>=1.5、両隣は低回転か
   - ノーマル機: backtest/bonus_specs.py judge の事後に現実的な事前（設定1=55%）を掛け直した設定5以上確率
   - 当日入替・再導入の台は設定不問に回るので回転数では判定しない
   - section をまたぐ3連は物理的に並びではない
3. 採点は「材料で支持できた本数」を主にし、報告本数・strict 本数は併記に留める
4. 楽園以外のホールでは緩いルールのベースラインを別に測る（ホール横断で流用しない）
5. 手順の実例は backtest/announce/rakuen__20260914__minnade777judge.scoring.json の external_report_crosscheck / games_based_narabi

