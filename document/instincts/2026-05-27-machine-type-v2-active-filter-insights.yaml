# Layer 0 の win_rate 閾値は 75% が最適（蒲田7）

## 背景

Layer 0（機種×日付ごとに win_rate >= threshold を予測）の閾値を
50〜80% でグリッドサーチした結果、coverage_score = lift@1 × sqrt(base_rate) で評価：

| 閾値 | AUC   | lift@1 | base_rate | coverage_score |
|------|-------|--------|-----------|----------------|
| 70%  | 0.703 | 4.39x  | 6.5%      | 1.115          |
| 75%  | 0.733 | 5.06x  | 5.6%      | 1.197 （最大） |
| 80%  | 0.700 | 3.02x  | 3.5%      | 0.549 （旧設定）|

旧設定 80% は base_rate が 3.5% と低すぎて Layer 1 との結合効果が限定的だった。

## アクション

蒲田7では `--layer0-winrate-threshold 75` を採用。
新ホール・新期間では coverage_score でスイープして最適値を選択する。

## 例

```bash
python -m ml.machine_type.v2.run_machine_type_v2 \
  --layer0-winrate-threshold 75 \
  --combined-lambda 0.1 \
  --step-days 1 --eval-days 90
```

