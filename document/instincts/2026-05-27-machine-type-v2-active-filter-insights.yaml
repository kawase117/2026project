# walk-forward ループには必ず進捗レポートを実装する

## 背景

機種別予測（run_machine_type_v2.py）に進捗表示が実装されておらず、
処理時間の予測ができない問題があった。
末尾予測パイプラインには実装済みのため、全パイプラインで統一する。

## アクション

時間のかかるループには必ず以下のパターンを使用する：

```python
import time
start_time = time.time()
total = len(eval_dates)
print(f"開始: {total} ステップ")

for i, pred_date in enumerate(eval_dates, 1):
    # ... 処理 ...
    elapsed = time.time() - start_time
    remaining = (elapsed / i) * (total - i)
    print(
        f"\r[{i:>4}/{total}] {100*i/total:5.1f}%  "
        f"経過:{elapsed:6.1f}s  残り:{remaining:6.1f}s  ({pred_date})",
        end="", flush=True,
    )

print()
print(f"完了: {time.time() - start_time:.1f}s")
```

入れ子ループは外側のループにのみ実装すれば十分。

## 例

```
開始: 90 ステップ
[  45/ 90]  50.0%  経過:  127.3s  残り:  127.3s  (2026-03-10)
完了: 254.6s
```

