# min_train_days は訓練ウィンドウサイズではなく足切り閾値

## 背景

`--min-train-days=120` という設定を「訓練期間が120日」と誤解していた。
実際のコードでは以下のように動作する：

```python
start_idx = max(min_train_days, total_dates - eval_days)
```

蒲田7（322日）で eval_days=90 の場合：
- start_idx = max(120, 322-90) = max(120, 232) = 232
- 実際の訓練期間：232〜321日（平均 276日）

min_train_days=120 は「機種やセグメントの日数が120日未満ならスキップ」という
足切り条件であり、訓練に使う期間の上限ではない。

## アクション

walk-forward の実際の訓練期間は `total_dates - eval_days` 〜 `total_dates - 1`。
「訓練が短すぎる」仮説を立てる場合は eval_days（評価期間を短くして訓練に回す）を調整する。

## 例

```
DB=322日, eval_days=90 の場合：
  最初の評価日: 訓練 232日
  最後の評価日: 訓練 321日
  → 平均訓練 276日（十分な量）

訓練を増やしたい場合は eval_days=60 に変更：
  最初の評価日: 訓練 262日
```

