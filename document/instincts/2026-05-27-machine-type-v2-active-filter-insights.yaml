# 2F_N の is_top3 は base_rate が低すぎて学習困難

## 背景

蒲田7の 2F_N（AT系・2F）の現状：
- アクティブ機種: 34機種（引退済み 29 を除く）
- is_top3 の base_rate: 3/34 ≈ 8.8%（学習帯域 10〜30% を下回る）
- holdout lift@3=0.52（ランダム以下、予測が逆効果）

tune 期では lift@3=1.18 だが holdout では 0.52 と大幅に乖離。
ホールが期間途中で 2F_N の設定パターンを変えた可能性がある。

## アクション

対策の優先順：
1. アクティブ機種フィルター（引退済み 29 機種を除去）
2. 120日以上の履歴を持つ機種のみに絞る（台数減 → base_rate 上昇）
3. is_top5 への切り替え検討（base_rate 5/34=14.7%）

改善まで 2F_N の予測結果は割引いて参照すること。

## 例

```
機種数別 is_top3 base_rate：
  34機種（現状）:           3/34 = 8.8%  ← 学習困難
  28機種（60日フィルター）:  3/28 = 10.7%
  20機種（120日フィルター）: 3/20 = 15.0%  ← 学習帯域に近づく
```

