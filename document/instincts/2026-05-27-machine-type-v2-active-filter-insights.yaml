# Layer 1 フィルターは「稼働状況」のみ、成績では絞らない

## 背景

2F_N の学習対象を絞り込む際に fleet_diff（平均差枚×台数）や avg_diff でフィルターする
案が出たが、それは誤り。Layer 1 が予測するのは「その日のセグメント内相対順位」であり、
平均的に負けている機種でも「高設定が入る日」は上位になる。
その日を予測できれば実運用上の価値がある。

蒲田7の 2F_N 例：
- 全期間ユニーク機種 63、最新日アクティブ 34、引退済み 29
- 引退済み 29 機種が学習ノイズとして混入していた

## アクション

フィルター条件は以下の2つのみ：
1. 最新日（DBの最終日）にアクティブな機種
2. 履歴日数が N 日以上（推奨 60日、新台ノイズ排除のみ）

除外してはいけないもの：
- 平均差枚がマイナスの機種
- 勝率が低い機種
- 台数が少ない機種（ただし長期稼働が条件）

## 例

```python
# ✅ 正しいフィルター
latest_date = raw["date"].max()
active_machines = set(raw[raw["date"] == latest_date]["machine_name"])
machine_day_counts = raw.groupby("machine_name")["date"].nunique()
qualified = set(machine_day_counts[machine_day_counts >= 60].index)
target = active_machines & qualified

# ❌ やってはいけない
target = target[target["avg_diff"] > 0]  # 成績フィルターはNG
```

