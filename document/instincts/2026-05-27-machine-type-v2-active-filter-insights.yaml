# rich特徴量（100+）は baseline6 より性能が低い（過学習）

## 背景

machine_type_common.add_machine_type_features() が生成する 100+ 特徴量を
Layer 1 に適用したところ、baseline6（6特徴量）より性能が悪化した。

tune 結果：
- baseline6:         combined_hit@1=0.333, AUC=0.649
- rich_no_ranktrend: combined_hit@1=0.217, AUC=0.618
- rich_all:          combined_hit@1=0.283, AUC=0.615

Layer 1 の訓練期間が 200〜300 日程度では 100+ 特徴量は過学習する。

## アクション

新特徴量は 1〜3 本ずつ追加して個別に効果を検証する。
一括投入は禁止。

現在の baseline6 特徴量：
- weekday_prior_top1_rate
- prior_top1_rate
- day_of_month / day_of_week_num / is_weekend
- lag1_rank_pct

## 例

```
OK: games_vs_segment_mean_7d を 1 本追加して再評価
NG: add_machine_type_features() を全部投入
```

