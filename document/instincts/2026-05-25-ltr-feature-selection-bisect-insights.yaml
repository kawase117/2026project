# A/Bテストで hit@2 が同一なら「v2比では無効」と診断する（ゼロ重要度ではない）

## 背景（2026-05-26 訂正）
digit_lag_v3a（cluster_right/left_diff のみ）と
digit_lag_v3b（weekday_roll4_total_diff_coins のみ）を walk-forward で比較した結果、
両者が全 expert でほぼ同一の hit@2 を出力した。

【元の診断】「ゼロ重要度」→ **部分的に誤り**

ceiling_effect フレームワークによる再評価（2026-05-26）:
- v3a vs v1：sig_imp=11、sig_wrs=0 → CONDITIONAL+（v1 より有意に改善）
- v3b vs v1：sig_imp=11、sig_wrs=0 → CONDITIONAL+（v1 より有意に改善）
- v3a vs v2_withinexpert：sig_imp=0、sig_wrs=0 → CONDITIONAL（差なし）
- v3b vs v2_withinexpert：sig_imp=0、sig_wrs=0 → CONDITIONAL（差なし）

「ゼロ重要度」ではなく「v1 を超える力はあるが v2 を超えられない」が正しい診断。
元の評価が hit@2=99%+ の天井効果環境で行われており、v1 比の差が検知できなかったことが原因。

## 修正アクション
hit@2 同一パターンが出たら **v2_withinexpert を基準に再評価する**:
- vs v1 で CONDITIONAL+ でも vs v2 で sig_imp=0 なら「v2 代替不可」と判定
- 採用可否の最終判断には ceiling_effect フレームワークの BH 補正テストを使う

## 例
v3a vs v1: sig_imp=11 ← 改善あり（v1 を超える力はある）
v3a vs v2: sig_imp=0  ← v2 越えられず（v2 が天井）
結論: v3a は v2 に追加しても効果なし。v2_withinexpert を維持する。

