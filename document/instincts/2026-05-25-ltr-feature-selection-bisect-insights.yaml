# 同曜日直近N回rolling平均はweekday_prior_top2_rateと役割重複かつノイズ大

## 背景
`weekday_roll4_total_diff_coins`（同曜日直近4回の total_diff_coins 平均）を追加したが
walk-forward で feature importance ≈ 0 だった。

原因:
1. 既存の `weekday_prior_top2_rate` が同曜日の is_top_2 拡張累積平均を計算済み
2. N=4 では平均28日分のサンプルしかなく分散が大きい（roll7 の4〜6倍不安定）
3. total_diff_coins の weekday rolling は is_top_2 の weekday rolling と高相関

## アクション
同曜日パターンを捕捉したい場合:
- `weekday_prior_top2_rate`（既存）を使う
- `weekday_delta_from_mean = weekday_prior_top2_rate - prior_top2_rate`（既存）を使う
新たに同曜日rolling平均を追加しても XGBoost は既存特徴量を優先する。

## 例
追加した特徴量: weekday_roll4_total_diff_coins（N=4、サンプル約4週分）
既存特徴量:    weekday_prior_top2_rate（拡張平均、サンプル全期間）
→ 後者の方が安定したシグナル → 前者は冗長
