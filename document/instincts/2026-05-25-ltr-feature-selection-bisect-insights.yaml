# NDCG損失での相対値特徴量（z-norm/pctrank）は v1 比では有効だが v2 比では無効

## 背景（2026-05-26 訂正）
XGBRanker の `rank:ndcg` 損失はグループ内順位を最適化するため、
理論的には絶対値より within-group 相対値特徴量（z-norm, pctrank）が有効と予測した。

**実測結果（ceiling_effect フレームワーク、2026-05-26）:**

| variant | vs v1 decision | v1 sig_imp | vs v2 decision | v2 sig_imp |
|---------|---------------|-----------|----------------|-----------|
| v4_znorm（z-norm + pctrank） | CONDITIONAL+ | 14 | CONDITIONAL | 0 |
| v4a_znorm_only | CONDITIONAL+ | 16 | CONDITIONAL | 0 |
| v4b_pctrank_only | CONDITIONAL+ | 12 | CONDITIONAL | 0 |

v1（絶対値特徴量）との比較では有意に改善するが、
v2_withinexpert との比較では sig_imp=0 / sig_wrs=0 と差が検出されない。

**解釈**: v2_withinexpert の「is_top_2 をエキスパート内で計算する」設計が
グループ内相対情報を学習ターゲット側で既に与えており、
特徴量側の相対変換の追加効果が消える。

## 修正アクション
NDCG ベース LTR で z-norm / pctrank 特徴量を追加検討するときは:
1. ベースラインが v1（グローバル is_top_2）なら効果あり（16 sig_imp まで）
2. ベースラインが v2_withinexpert（エキスパート内 is_top_2）なら効果なし
3. is_top_2 のスコープを先に正しく設定することが相対特徴量より重要

## 例
v4a_znorm_only vs v1: sig_imp=16 ← 有効に見える
v4a_znorm_only vs v2: sig_imp=0  ← v2 があれば不要
→ 相対特徴量を追加するより is_top_2 スコープの設計を先に正す

