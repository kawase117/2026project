# 隣接末尾のroll差分特徴量はXGBoostが既存lagから暗黙的に学習済みで冗長

## 背景
`cluster_right_diff = roll7(digit+1) - roll7(digit)` を追加したが、
XGBoost は walk-forward で当該特徴量に実質ゼロの importance を割り当てた。

理由の推測:
- モデルは各 entity_key の lag/roll を独立に受け取っている
- 学習時に「末尾6が強い日に末尾7・8も強い」という交互作用を
  tree の分岐として暗黙的に学習できる
- right/left_diff という明示的な差分は既に学習済みの情報の二重表現になる

## アクション
隣接末尾の差分特徴量は「モデルが自力で学べる交互作用」として追加しない。
モデルが学べないのは「グループ外の情報」「時間的に遠い情報」「欠損が多い情報」のみ。
hall-digit-level lag（aggregate_mode 内で計算）はこれに該当するため有効（MI rank1 = 0.01237）。

## 例
効果なし: cluster_right_diff（隣接末尾との roll7 差分）→ feature importance ≈ 0
効果あり: lag7_hall_digit_diff（ホール横断の末尾別 7日前実績）→ MI rank1 = 0.01237

