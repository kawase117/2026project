# 蒲田7 2F_A (BT機) には角番位置効果が存在しない

## 背景
kamata_kakuban_temporal_species_eda.py による機種別検証（Analysis S）。
kamata7_2F_A は BT機のみで構成される。

| 年 | middle-corner gap | kruskal_p |
|---|---:|---|
| 2025 | +9.0 | 0.5（有意でない） |
| 2026 | -12.7 | 0.4（有意でない） |

機種別でも BT の gap = -1.8（kruskal_p=0.9）で完全に有意差なし。

## アクション
- 蒲田7 2F の BT 機には「中間台を選ぶ」戦略を適用しない
- ML 特徴量として `kakuban_bin` を 2F_A セグメントに追加しない
- 2F_A の次の分析軸は機種名・DD・曜日の単純集計から探索すべき

## 例
kamata7_2F_A_species_summary.csv:
  BT: middle_minus_corner=-1.8, kruskal_q=0.9 → 採用しない

