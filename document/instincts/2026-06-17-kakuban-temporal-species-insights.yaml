# 2F_A の machine_type_segment に bt_flag を含める（2026-06-17 修正済み）

## 背景
元のコードは jug_flag | hana_flag のみで A タイプを判定していたため、
蒲田7 2F の BT 機が全て N に分類されて `kamata7_2F_A: rows=0` になっていた。

修正箇所（314行目付近）:
```python
is_a = (merged["jug_flag"] == 1) | (merged["hana_flag"] == 1)
if spec.floor == "2F":
    is_a = is_a | (merged["bt_flag"] == 1)
merged["machine_type_segment"] = np.where(is_a, "A", "N")
```
修正後: kamata7_2F_A = 11,898 eligible rows に回復。

## アクション
- `kamata_corner_mirror_analysis.py`（363行目）にも同じバグが残っている。未修正。
- インポートしている 4 スクリプト（kamata7_x_kakuban_eda, kamata7_kakuban_rl_eda,
  kamata7_kakuban_dd_cross_eda, kamata7_kakuban_colsize_eda）は 2F_A 分の出力が変わるため、
  過去結果の再実行が必要

## 例
修正前: kamata7_2F_A eligible_rows=0
修正後: kamata7_2F_A eligible_rows=11,898
