# 蒲田7 3F_A の中間台優位は時系列で安定・強化傾向

## 背景
kamata_kakuban_temporal_species_eda.py による年別検証結果。
セクション残差法（section_mean 除去後）で kakuban_bin（corner/middle/deep_end）を比較。

| 年 | middle-corner gap | kruskal_p |
|---|---:|---|
| 2025 | +64.6 | <0.001 |
| 2026 | +80.0 | <0.001 |

gap が縮小せず拡大しており、ML 特徴量として最も信頼できるセグメント。

## アクション
- `kakuban_bin`（corner=1-4 / middle=5-11 / deep_end=12+）を 蒲田7 3F_A の特徴量として採用する
- 経年で gap が増加している点は「ホール側の設定戦略が固定化している」証拠と解釈してよい
- 2027年以降も年別モニタリングを継続し、縮小トレンドが現れたら特徴量の重みを下げる

## 例
Analysis T 結果（kamata7_3F_A_temporal_summary.csv）:
- 2025: corner=-28.2, middle=+36.4, deep_end=-34.2 → gap=+64.6
- 2026: corner=-35.0, middle=+45.0, deep_end=-37.6 → gap=+80.0

