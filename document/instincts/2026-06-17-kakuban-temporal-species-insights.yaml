# 蒲田7 3F_N の中間台優位は有意だが 2025→2026 で大幅縮小

## 背景
Analysis T 年別結果（kamata7_3F_N）:

| 年 | middle-corner gap | kruskal_p |
|---|---:|---|
| 2025 | +183.9 | <0.001 |
| 2026 | +63.0 | 0.1（境界域） |

gap が 183.9 → 63.0 と 66% 縮小。2026年は有意水準 0.1 まで落ちている。
ホール側が AT 機の設定配置ルールを変えた可能性がある。

## アクション
- 現時点では kakuban_bin 特徴量を 3F_N にも採用するが、信頼度は 3F_A より低く設定
- 2026年下半期のデータが追加されたら再検証し、gap がさらに縮小していれば特徴量から除外
- ウォークフォワードで 2025 学習→2026 予測の精度低下が出た場合は特徴量を疑うこと

## 例
監視基準:
  2025: gap=183.9（安全域）
  2026: gap=63.0（警戒域）
  次回更新後に gap < 30 なら特徴量除外を検討

