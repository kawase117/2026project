# G数激減はホール全体の稼働水準低下を反映している可能性が高い

## 背景
台3273（マイジャグラーV）のDD=19における2026年1-3月のG数が 829〜2975 に激減（2025年は 6000〜9000）。
ただし2026年4-5月には 5878/7829 に回復している。
マイジャグラーは最人気クラスの機種であり、撤去・機種交換とは基本的に無縁。
したがって「台固有の廃止」ではなく「その時期のホール全体の稼働水準の低下」が原因と考えるのが自然。
G数が少ない日は設定が低くて客が早抜けした可能性もあるが、いずれにせよ分析上の信頼性は低い。

## アクション
- DD別 or 曜日別の集計でスパイクを見つけたら、必ず年月別の G数推移も確認する
- `mean_games < 3000` の（DD × 台）組み合わせは分析の信頼性が低い。除外か重み付け低減を検討
- G数激減を「台廃止・機種変更」と即断しない。ホール全体の月次稼働推移と照合して判断する
- 過去データで計算したスパイクを ML 学習に使う前に、G数も含めた時系列で有効期限を確認する

## 例
台3273（マイジャグラーV）DD=19 の時系列:
- 2025/07: games=8147, diff=+4800（高設定確実）
- 2025/10: games=9336, diff=+1500（有効）
- 2026/01-03: games=829〜2975, diff=0〜-200（G数激減 → ホール稼働低下期と推定）
- 2026/04-05: games=5878〜7829（回復 → 機種交換ではなかったことが確認できる）
