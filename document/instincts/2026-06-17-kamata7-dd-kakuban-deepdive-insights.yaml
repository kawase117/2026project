# スパイクは必ず「分解→台特定→時系列」の3ステップで検証する

## 背景
蒲田7の DD=19 × kakuban=8 でセクション残差 +364 のスパイクが検出された。
単純に「DD=19に角番8台を狙え」と結論づけると誤り。
スパイクには必ず「全体効果の混入」「特定台への偏り」「時系列での消滅」のいずれかが潜んでいる。

## アクション
スパイクを発見したら以下の3ステップを必ず踏む：

**Step 1: 分解（主効果 vs 交互作用）**
- 「DDが全体的に強い日か？」を全台平均で確認
- 「当該 kakuban が全DD通じて強いのか？」を全DD平均で確認
- 主効果の掛け合わせで説明できるなら「偽交互作用」として棄却

**Step 2: 台特定**
- スパイクに寄与している台番号を groupby machine_number で特定
- 特定の1台が引っ張っていれば「台固有の設定傾向」として分離

**Step 3: 時系列検証**
- その台の該当DD別成績を年月順に並べる
- games_normalized を必ず確認。G数激減は「もはや打たれていない」シグナル
- 特定年の前半に集中して後半〜翌年で消滅 → ML特徴量として無効と判断

## 例
DD=19 × kakuban=8 (kamata7_3F_A) → mean_residual +364 のスパイク

Step 1: DD=19の全体平均=+150（DD=1の+515より低い中程度）、kakuban=8の全DD平均=+253 → 主効果で説明可能
Step 2: 台3273（マイジャグV）が mean_diff=+1555 を引っ張っていた
Step 3: 2025/07-10月は diff=+4800/+4400/+2100/+1500、2026年入って games=829-2975 に激減
→ 「2025年前半限定の高設定台」と確定。ML特徴量として不採用。

