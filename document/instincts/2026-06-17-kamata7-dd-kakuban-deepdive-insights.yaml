# 蒲田7 3F_A: 中間台（kakuban 5-11）が全DD通じて優位

## 背景
蒲田7の3F_Aセグメント（ジャグラー/ハナハナ系）を全342日・全DDで集計した結果、
セクション端台（kakuban=1: +80, kakuban=22: +67）に対して
中間台（kakuban 5-11）が +247〜+269 と明確に優位。
セクション残差分析でも kakuban=1 は q<0.001 で有意に弱いことが確認済み。

## アクション
- 蒲田7 3F でジャグ/ハナハナを狙うなら、セクション内の端台（両角）を避け
  kakuban 5-11 の台を優先する
- ML特徴量として `kakuban_bin`（1-4 / 5-11 / 12+）の3値分類が有効候補
- kakuban=1 の弱さは両端から見ても成立（rank_from_min=1 かつ rank_from_max が大きい台が特に弱い）

## 例
kakuban別全DD平均差枚（3F_A, 全342日）:
- kakuban 9: +269（最強）
- kakuban 6,5,7,8,11: +248〜+268（中間群）
- kakuban 1: +80（最弱）
- kakuban 22: +67（最弱）

