# 蒲田7では DD × kakuban の線形トレンドは存在しない

## 背景
Spearman 相関で全セグメント×全kakuban の (dd, residual) を検証した結果、
有意なペアはゼロ（最強でも r=-0.067, q=0.617）。
DD を連続変数として角番効果を説明することはできない。
DDビン×kakuban の Kruskal は全ビンで有意だが top_kakuban がビンごとにランダムに変わるため
ルール化不可能。

## アクション
- `dd × kakuban` 型の線形特徴量は蒲田7では採用しない
- DDビン（1-6/7-12/13-18/19-24/25-31）×kakuban_bin の交互作用項を試すなら
  必ずホールドアウトで過学習確認すること
- 実用的な次の一手は「kakuban_bin 単体」の非線形効果をモデルに入れること

## 例
Analysis D2 結果: 全 kakuban で Spearman q > 0.6 → 採用しない
Analysis D3: DDビン別 Kruskal は全ビン有意だが top_kakuban=20/15/6/20/7 とバラバラ
→ 月の特定時期に特定角番が有利というルールは蒲田7には存在しない

