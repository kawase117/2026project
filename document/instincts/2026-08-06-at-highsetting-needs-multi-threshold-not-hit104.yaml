# ハーフ456のATに104超率を使うと偽陰性になる。98/100超と分布シフトで見る

## Core claim
蒲田7はハーフ456（対象の半分に設定4〜6を投入、4多め）と言われる。**設定4は機械割104%に
届かないことが多いため、104超率の単一フラグはATの主力である設定4を丸ごと取りこぼす。**
AT機の高設定投入は (a) 98/100/102/104/108 の多点閾値、(b) 機械割のMann-Whitney分布シフト、
(c) 当日ホール中央値超え率で測る。ハーフ456が真なら対象群は中央値超えが50%を超える。

## Evidence
- n_observations: 1日（2026-08-05、蒲田7 AT機517台、鉄台2026除外）
- data scope: single-hall（マルハンメガシティ2000-蒲田7）
- metric scope: 機械割の多点閾値・Mann-Whitney・ホール中央値超え率
- result summary: @999999Q9Q が事後報告した「AT機＝末尾②」を検証。当日AT機械割中央値91.5%。
  - 104超: 33.3%(17/51) vs 他末尾31.3%  OR1.10  **p=0.441（効果なしに見える）**
  - 108超: 29.4% vs 26.6%  p=0.389
  - 102超: 37.3% vs 33.5%  p=0.346
  - **100超: 51.0%(26/51) vs 35.8%  OR1.86  p=0.026**
  - **98超: 56.9%(29/51) vs 37.3%  OR2.21  p=0.006**
  - **Mann-Whitney片側 p=0.002**（機械割中央値 100.6 vs 90.0）
  - **ホール中央値(91.5)超え: 68.6% vs 48.1%**
  - 対照: 同日の JUG∧末尾6 は RB二項事後で 9/14=64.3% vs 29.5%、OR4.30、p=0.011

## Interpretation
- 効果が98〜100超に集中し、**102以上で完全に消えるのが設定4主体の署名**。設定6主体なら
  104超・108超で差が出るはずで出ていない。ハーフ456・4多めという言説と数値が整合する
- 100超が51.0%というのは文字通り「ハーフ」。ホール中央値超え68.6%と併せて、
  51台の分布全体が上にずれている。少数の大勝ちの寄せ集めではない
  （平均差枚+857という数字だけでは両者を区別できない）
- `2026-08-01-answer-check-metric-hit104-over-mean-diff`（平均差枚でなく104超率で採点する）は
  主張として生きているが、**ATの末尾・角番検定には限定条件が付く**。104超率単独は設定4に対して
  検出力が足りない。この instinct はその限定であって、元の主張を閉じるものではない
- 蒲田1のHANA(末尾あたり1-2台)・OKI(1台)、蒲田7のHANA(1-2台)・OKI(1台)は台数が足りず
  セグメントとして機能しない。両ホールとも**実質 JUG vs AT の2分割が上限**
- 同じ日でも JUG は RB二項事後（`ml/experiments/jug_rb_setting_prediction/config.py` の
  `JUGGLER_FAMILY_SPECS`）で判定できる。セグメントで判定指標を変えること
- 単日 n=51台の観察。ハーフ456という前提自体が言説であり、この閾値パターンが他日・他ホールで
  再現するかは未検証

## Action
1. AT機の高設定判定に104超率の単一フラグを使わない。98/100/102/104/108 の多点閾値を並べ、
   どの閾値帯に効果が集中するかを見る（98〜100集中＝設定4主体、104〜108＝設定5-6主体）
2. 群全体の分布シフトを Mann-Whitney で検定し、当日ホール中央値超え率を併記する。
   ハーフ456なら対象群は50%超が期待値
3. ATの平均差枚を末尾・角番効果の判定に使わない。分布全体のずれか少数の大勝ちかを区別できない
4. JUGは RB確率の二項事後で判定する。セグメントごとに指標を変える
5. 蒲田7の鉄台（台番号2026）は末尾・角番の検定から除外する

