title: みとやの daily_hall_summary フラグは全行 NULL — date 文字列から直接導出する

## 背景
みとやスロスのDBでは daily_hall_summary の day_of_week, last_digit, weekday_nth,
is_strong_zorome が 514 行すべて NULL。
これらに依存した特徴量計算は全て 0/NaN になってしまう。

## アクション
日付属性は date 文字列（YYYYMMDD）から Python で直接計算する。
daily_hall_summary は avg_diff_per_machine（is_hall_plus 判定用）のみ利用する。

## 例
```python
df["date"] = pd.to_datetime(df["date"], format="%Y%m%d")
df["day_of_week"] = df["date"].dt.strftime("%a")
df["dd"] = df["date"].dt.day
df["mm"] = df["date"].dt.month
df["is_mm_dd"] = (df["mm"] == df["dd"]).astype(int)
```

