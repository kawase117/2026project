title: 位置特徴量はグループ集計後のパイプラインでは aggregation 経由で追加する

## 背景
tail_ltr_mitoya_wf.py は aggregate_mode_mitoya でマシン行を (last_digit × date) グループに集計してから
walk-forward を走らせる。FeatureBuilder.build_features(use_position_features=True) は
マシン行レベルで section_encoded / physical_corner を追加するが、集計後のDataFrameには
マシン行が存在しないため機能しない。

## アクション
1. build_base_rows_mitoya() でマシンレベルの section_rank / is_strong_section を計算
2. aggregate_mode_mitoya() の .agg() に mean_section_rank / mean_physical_corner / pct_strong_section を追加
3. get_numeric_features(df) が自動採用するため、特別な設定不要
4. --use-position-features フラグで ON/OFF を切り替える場合は、集計後の列を drop する形で制御

## 例
```python
# build_base_rows_mitoya 内
work["section_rank"] = work["section"].map(SECTION_RANK).fillna(0).astype(int)
work["is_strong_section"] = (work["section_rank"].between(1, 5)).astype(int)

# aggregate_mode_mitoya の .agg() 末尾
mean_section_rank=("section_rank", lambda s: float(s.mean())),
mean_physical_corner=("physical_corner", lambda s: float(s[s > 0].mean()) if (s > 0).any() else 0.0),
pct_strong_section=("is_strong_section", lambda s: float(s.mean())),
```

