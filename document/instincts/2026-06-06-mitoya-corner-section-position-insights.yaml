title: みとやの列強弱は主に機種タイプの代理変数だが、独立した位置効果もある

## 背景
Kruskal-Wallis 検定で Section の epsilon_sq=0.012900（セクション修正後）。
断面分析では「強いセクション = AT機（東京喰種など）のセクション」という
機種タイプとの共線関係が強い。
ただし within-type 分析（"other" タイプ固定）で epsilon_sq=0.003797 が確認され、
機種タイプを超えた独立の位置効果が存在する。
弱セクション（692以降）はバラエティ相当の島。強セクション（574-590）はAT機の島。

## アクション
Section 特徴量は機種タイプ特徴量と併用し、feature importance で独立効果を確認する。
アブレーション実験（section_encoded あり/なし）で純粋な位置効果を分離する。

## 例
Section BEST: 574-590 (AT機「東京喰種」)
Section WORST: 701-711 (バラエティ)
rank_from_min epsilon_sq: 0.000478 (角番効果弱い)
section epsilon_sq: 0.012900 (列効果は意味あり)

