title: 台番号の連続範囲は物理的な島（列）とは一致しない

## 背景
みとやスロスの初期実装では台番号を等分割した10セクションを定義していたが、
これは単なる数値グループであり物理的な島の配置とは無関係だった。
例: 523-556 は実際には 523-539 と 540-556 の別々の島で構成されていた。
XY座標（通路の向き・列の方向）を考慮しないと、異なる島の台が同セクションに混在する。

## アクション
Section は必ずドメイン知識（実際の島の物理配置）に基づいて定義する。
座標情報がない場合はユーザーに手動確認を求める。
みとや正しいセクション定義（18島）:
(501-522), (523-539), (540-556), (557-573), (574-590), (591-607),
(608-623), (624-640), (641-657), (658-674), (675-691), (692-700),
(701-711), (712-722), (723-733), (734-744), (745-755), (805-815)

## 例
誤: 501-556 を1セクションとして扱う（実際は2つの異なる島）
正: 501-522, 523-539 を別セクションとして分ける

