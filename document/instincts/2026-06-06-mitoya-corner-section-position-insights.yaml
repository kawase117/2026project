title: 物理的に正しいセクション定義はKW effect sizeを約61%改善する

## 背景
みとやの初期10セクション（数値グループ）→ 修正18セクション（物理島）への変更で
Kruskal-Wallis の epsilon_sq が 0.008010 → 0.012900（+61%）に改善した。
間違った集計単位では統計的シグナルが希薄化する典型例。

## アクション
ML特徴量追加前にドメイン知識でグループ定義の妥当性を必ず確認する。
グループ定義変更後は必ず統計検定を再実行してシグナルの変化を確認する。
epsilon_sq > 0.01 を「意味ある効果」の目安とする（ML特徴量として採用検討）。

## 例
rank_from_min epsilon_sq: 0.000478 (弱い → 単独採用は疑問)
section (修正前) epsilon_sq: 0.008010
section (修正後) epsilon_sq: 0.012900 → 採用する価値あり
