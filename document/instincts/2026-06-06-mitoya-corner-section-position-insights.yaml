title: 物理的な角番は min(rank_from_min, rank_from_max) で計算する

## 背景
パチスロホールでは台番号が島の中で交互方向に並ぶことが多い。
例: 1,2,3...N (順方向) / 20,19,18...N+1 (逆方向)
この場合、rank_from_min だけでは物理的な角からの距離を正しく表せない。

## アクション
physical_corner = min(rank_from_min, rank_from_max) を使う。
両値が > 0 のときのみ有効とし、それ以外は -1（不明）とする。

## 例
```python
valid = (rank_from_min > 0) & (rank_from_max > 0)
df["physical_corner"] = -1
df.loc[valid, "physical_corner"] = np.minimum(rank_from_min[valid], rank_from_max[valid]).astype(int)
df["physical_corner_valid"] = (df["physical_corner"] > 0).astype(int)
```

