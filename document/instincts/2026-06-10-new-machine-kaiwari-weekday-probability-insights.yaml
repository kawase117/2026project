# 新台0-7日のavg_kaiwari/avg_diffだけでなく、day0デルタと専有/共通機種の差も合わせて見ないとホール戦略を見誤る

## 背景
全9ホールの新台0-7日レポート(games_normalized>=200, debut_date>db_start, day_index 0-7, n=6577)を
読み込んだところ、avg_kaiwariのホール順位(金時102.0 > みとや101.8 > ARROW101.4 > ... > 楽園96.6)は
新台優遇度の単純な指標にはなるが、それだけでは「いつ・どの機種に」優遇が乗るかは分からない。
day0デルタ(初日 vs day1-7)を見ると、ザシティは初日が最も高くday1-7は全てマイナス
(最大-10.3)の「初日型」、金時はday7に向けて+23.2まで上昇する「終盤型」など、
ホールごとに優遇のタイミングが正反対になっている。
また専有機種(exclusive) vs 共通機種(shared)の比較では、ほとんどのホールで共通機種の方が
avg_kaiwariが高く、特に金時の専有新台は壊滅的(avg_kaiwari 82.3, win_rate 12.0%)で、
専有新台には設定を入れない可能性がある。同一機種(鉄拳6など)でもホール間でavg_kaiwariの
range_kaiwariが60ポイント超あり、機種そのものよりホールの方が支配的要因。

## アクション
新台0-7日レポートの数値を引用・解釈する際は、必ず
(1) avg_kaiwariのホール順位だけでなくday0デルタ(day_delta.csv)でタイミングの型(初日型/終盤型)を確認、
(2) exclusive/sharedの比較で「専有新台に設定を入れるホールか」を確認、
(3) 同一機種のホール間range(common4/common42_comparison.csv)で機種要因とホール要因を切り分ける。
これらを欠いた「avg_kaiwariが高い=新台優遇」という単純な結論は、戦略のタイミングや
専有/共通の違いを見落とす。

## 例
ザシティ: day0 kaiwari最高、day1-7は全てマイナス(初日型)。
金時: day0-6は横ばい、day7で+23.2の急伸(終盤型)。
金時 専有新台: avg_kaiwari 82.3, win_rate 12.0%(共通機種103.0と乖離)。
鉄拳6(4ホール共通導入): kaiwari範囲83.7〜150.8(range 67.1)。

