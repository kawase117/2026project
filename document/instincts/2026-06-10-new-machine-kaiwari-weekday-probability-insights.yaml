# dt.day_name(locale='en_US')ベースの曜日集計はWindows環境で再現性が崩れる可能性がある

## 背景
過去セッションで「新台0-7日では月曜が突出して強い(avg_kaiwari 102.3, win_rate 45.3%, hit104 36.7%)」
という結論が出ていたが、同条件・同n(6577)で`dt.dayofweek`ベースに再実装して再現したところ、
Mon=99.9/39.9%/31.8%、OtherWeekday=98.4/37.9%/30.6%となり、方向性は同じだが効果量が
大幅に小さかった(kaiwari差+1.5pt vs 報告+3.2pt、win_rate差+2.0pt vs 報告+6.1pt)。
一方Weekendの値はほぼ完全一致(98.6/39.0/30.4 vs 98.6/39.1/30.4)。
Mon/OtherWeekdayのみズレていることから、元コードの`dt.day_name(locale='en_US')`が
Windows環境でロケール依存の挙動になり曜日マッピングが一部崩れていた可能性が高い。
さらにホール別に見るとレイトギャップは月曜が逆にOtherWeekdayより-5.1低く、
「月曜が強い」は全ホール共通則ではない(6/9ホールのみ月曜>その他)。

## アクション
曜日別集計は`dt.dayofweek`(0=Mon...6=Sun)の整数ベースで行い、`day_name(locale=...)`は
Windows環境では避ける。過去セッションの「曜日効果」「DAYX効果」の数値は、再利用前に
同条件で再現できるか必ず検証する。また全ホール合算の効果量を「一般則」として
DAYX解釈に使う前に、ホール別のlift方向が一致しているか確認する(本件は6/9のみ一致、
レイトギャップは逆方向)。

## 例
eda/new_machine_weekday_bias_check.py で dt.dayofweek ベースに再実装し、
n=6577（既存レポートのbaselineと一致）で再現。weekday_group別
(Mon/Weekend/OtherWeekday)のavg_kaiwari, win_rate_pct, hit104_pctと
ホール別Mon_minus_Other/Weekend_minus_Otherを出力して一般化可否を確認する設計。

