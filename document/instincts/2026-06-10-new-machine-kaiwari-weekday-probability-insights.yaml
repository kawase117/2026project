# avg_kaiwariとhit閾値出現率だけで「設定の山」を推定するのは危険、total_probability_decimalで裏取りすべき

## 背景
ARROW/みとやはavg_kaiwariがhit104/108/112出現率に対して相対的に低く、「メリハリ(1or6)型」かと
仮説を立てたが、machine_detailed_results.total_probability_decimal（実測ボーナス確率、1/fraction）を
kaiwariバケット(<104/104-112/>=112)別に集計したところ、結果は逆転した。
ARROWはmid_to_high_ratio(=104-112→>=112の確率増分 / <104→>=112の総増分)が0.37〜0.49と
全ホール中最小で、最も「滑らかな段階配分」に近い。逆に金時・ザシティ・蒲田一はratio0.7前後で
ジャンプが大きく「1or6型」に近い。kaiwariは「設定」と「試行のブレ」が混ざった結果指標であり、
出現率の高低だけから設定配分の形を断定すると誤る。

## アクション
ホールの設定投入パターン（1or6型 vs 3-6満遍なく型）を議論する際は、必ず
total_probability_decimal / bb_probability_decimal をkaiwariバケット別に集計し、
mid_to_high_ratioのようなステップ比較で裏取りする。さらに機種カテゴリ
(machine_master.jug_flag/hana_flag/oki_flag/bt_flag)で層別しないと、
ホール間の機種構成差（確率レンジが2倍近く違う）が交絡する。新台0-7日データでは
「AT機・その他」が全体の約78%を占めるため、まずこのカテゴリに絞って比較するのが現実的。

## 例
新台0-7日(games_normalized>=200, debut_date>db_start, day_index 0-7)で
category=='AT機・その他'に絞り、kaiwari_bucket別avg_total_probability_decimalの
(104-112→>=112)と(<104→104-112)の差分比をホール別に比較する。
ARROW=0.49(最小), みとや=0.72, 金時=0.70, ザシティ=0.68, 蒲田一=0.66。

