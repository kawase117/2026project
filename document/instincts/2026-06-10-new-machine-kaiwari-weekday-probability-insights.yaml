# avg_kaiwariの順位と「高設定出現率(hit104/108/112)」の順位はズレる。ハイリスク・ハイリターン型ホールの検出に使える

## 背景
新台0-7日(n=6577)でhit104/108/112(kaiwari>=104/108/112の割合)をホール別に集計したところ、
avg_kaiwari最高の金時(102.0)はhit104では3位(31.7%、みとや35.0%・ARROW37.3%より低い)だが、
hit112では全ホール最高(21.7%)になった。逆にレイトギャップはhit104が28.0%(中位)なのに
hit112は14.8%で全ホール最低、「広く浅く」型。
day_index別では全体平均kaiwariはday0(初日)がやや高い程度だが、hit104出現率は
day6(33.5%)が最も高く、day2(29.6%)が最も低い。avg_kaiwariの山と出現率の山は必ずしも一致しない。
ホール×day_index別では、金時day7のhit112が30.8%(突出)、ザシティday1のhit112が25.2%
(同ホール内で突出)など、avg_kaiwariのday0デルタ分析と整合する特異点が見つかった。

## アクション
ホールの新台優遇度・設定投入の「形」を議論する際は、avg_kaiwariの順位だけでなく
hit104/108/112のような閾値別出現率を併記する。avg_kaiwari高×hit112高の組み合わせは
「ハイリスク・ハイリターン(メリハリ)型」、avg_kaiwari中×hit104高×hit112低は
「広く浅く型」という形で分類できる。day_index別の山もavg_kaiwariベースとhit閾値ベースで
ズレることがあるため、両方確認してから「DAYXが強い」と結論づける。

## 例
金時: avg_kaiwari 102.0(1位), hit104 31.7%(3位), hit112 21.7%(1位) →ハイリスク・ハイリターン型。
レイトギャップ: avg_kaiwari 98.5, hit104 28.0%, hit112 14.8%(最低) →広く浅く型。
全体day_index別hit104: day6=33.5%(最高) vs day2=29.6%(最低)、avg_kaiwariの山(day0)とは別。

