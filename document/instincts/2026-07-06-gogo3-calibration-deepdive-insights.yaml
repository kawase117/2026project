# サブカテゴリ分解後の「1件だけ有意」は、検定数からの期待偶然数と比較してから判断する

## 背景
GOGO3のイベント日DiD検定で、4ホールの主検定は全て非有意だったが、
下位カテゴリ(7のつく日/1のつく日/ゾロ目/強ゾロ目)に分解した約16件の
副検定のうち、蒲田7×1のつく日の1件だけがCIで有意(CI下限+0.07、
ほぼゼロに接する水準)だった。16件を95%CIで検定すれば、真に帰無でも
平均0.8件(16×5%)は偶然有意になる計算であり、観測された「1件」は
この期待値とほぼ一致するため、独立した再現なしに「発見」と扱わなかった。

## アクション
- 主検定が非有意でサブカテゴリに分解して再検定する場合、実施した検定の
  総数を数え、期待される偶然のヒット数(検定数×有意水準)を計算する
- 観測されたヒット数が期待値とほぼ一致する場合、そのヒットを単独の発見として
  採用せず、独立データでの再現を条件にする
- CIの片側がゼロにわずかに接している程度(本件のCI下限+0.07のような)は、
  特に多重比較後の解釈で慎重に扱う

## 例
蒲田7×1のつく日のDiD(+0.52pp, CI[+0.07,+0.95], n=42)は単独では有意に見えるが、
約16件の副検定中1件という出現率は多重比較の期待偶然数(0.8件)とほぼ一致するため、
「発見」ではなく「多重比較のノイズ」として最終レポートから除外した。
