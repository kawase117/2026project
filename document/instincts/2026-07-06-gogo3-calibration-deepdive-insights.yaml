# 「特定日の単純差」ではなく「ホール全体からの乖離(DiD)」を見ないと交絡が混じる

## 背景
「GOGO3はイベント日に優遇されるか」を検証する際、単純に
「GOGO3のイベント日平均−GOGO3の非イベント日平均」だけを見ると、
「イベント日はホール全体が良くなりがち」という交絡が混入する。
差分の差(DiD) = (GOGO3のイベント日−非イベント日の差) − (全機種のイベント日−非イベント日の差)
を計算することで、「GOGO3だけがホール平均以上に動いているか」を直接測れる。
実際、単純差では蒲田7+0.20pp・ヒロキ+0.57ppだったが、DiDでは
蒲田7−0.08pp・ヒロキ+0.40ppとなり、両者の乖離具合から交絡の大きさが分かった。

## アクション
- 「特定のセグメントが特定条件下でどう動くか」を検証する際、そのセグメント単独の
  条件別平均差だけでなく、比較対象全体(ホール平均等)の同じ条件別平均差も計算し、
  差分の差(DiD)で交絡を除去する
- DiDの方が単純差より理論的に正しい指標だが、両方併記して交絡の大きさ自体も
  報告する（交絡が大きいこと自体が意味のある情報になる）

## 例
GOGO3のイベント日効果はDiDで見ると4ホール全てCIが0を跨ぎ、有意差なしと判定。
単純差だけで判断していたら「GOGO3はイベント日に優遇される」と誤って
結論していた可能性がある。

