# DBの既存フラグ列は、セッションで確立した概念と同じ意味とは限らない。件数を必ず先に確認する

## 背景
`daily_hall_summary.is_any_event`を使ってイベント日分析を計画したが、
実装前チェックで対象日数が4ホールとも11-15日しかないことが判明した。
これは本セッションで一貫して使ってきた「イベント日」（7のつく日・1のつく日・
ゾロ目・強ゾロ目・月末、全日数の約3割）とは別の、もっと狭い定義
（hall_anniversary等の稀な特別日のみ）だったと考えられる。DBの列名が
似ていても、既存の分析パイプライン(stage3_features.py)で使っている
自作の計算式とは別物だった。

## アクション
- DBの既存フラグ列を使う前に、その列の実際の該当日数・該当率を必ず先に
  確認する。想定していた頻度と大きく異なれば、定義が違うと疑う
- セッション内で既に確立した計算式(カレンダー由来のロジック等)がある場合は、
  DBのフラグ列に頼らず、同じ計算式を再実装する方が確実
- 実装前チェックでこの種の件数確認をする習慣は有効だった。事前チェックの
  結果、統計力不足に気づけたことで、実装後に無駄な検証をせずに済んだ

## 例
`is_any_event`(11-15日)ではなく、`stage3_features.py`の`_add_event_flag`と
同じカレンダー計算式(day in [1,7,11,17,21,27,30] | day==22 | 強ゾロ目 | 月末)を
date列から再実装したところ、7のつく日単独で35-54日、1のつく日単独で42-65日と
検定に十分な件数が確保できた。

