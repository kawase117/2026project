# 尤度の識別力が弱いカテゴリは、事後推定が事前分布に引っ張られて実現値からズレやすい

## 背景
ジャグラー機種別のe_payout(モデル通貨)キャリブレーション診断で、GOGO3系統だけ
全9ホールで系統的にプラス方向(実現値より高く見積もる)にズレていた。原因を
検証したところ、GOGO3のRB確率は設定1→6の拡がり比が1.445倍と、他系統
(MYV 1.788, IMEX 1.725, HAPPY8 1.688等)より明確に狭いことが分かった。
RBは日々のデータで最も情報量の多い信号だが、GOGO3はこの識別力が弱いため、
1日分の観測データが事後分布を「その日の真の設定」へ引き戻す力が弱く、
既に高く偏った事前分布(GOGO3は本当に優遇されているため)に引っ張られやすい。
「本物の優遇(A)」と「識別力の弱さ(B)」が組み合わさることで、系統的なプラス乖離が
生まれる、という一貫した説明になった。

## アクション
- 特定のカテゴリだけモデルの事後推定が実現値からズレる場合、そのカテゴリの
  尤度(観測データ)がどれだけ候補間を識別できるか(確率の拡がり・分散)を確認する
- 識別力が弱いカテゴリでは、事後推定は「そのカテゴリの平均的な傾向(事前分布)」を
  強く反映してしまう。個別の観測日についての推定値は信用度を下げて扱う
- スペック表の誤り(値そのものの記載ミス)と、識別力の構造的な弱さ(値は正しいが
  差が小さい)は別の原因なので、切り分けて検証する

## 例
GOGO3のRB確率拡がり比1.445は8系統中最も狭い。この構造的弱さが、蒲田7で
確認済みの「GOGO3への本物の優遇」と組み合わさり、e_payoutの系統的な
プラス乖離(+0.7〜+1.3pp、全9ホール共通)を説明した。

