# 末尾3の低さはAT系が引き下げており、A型（ジャグラー等）末尾3は平均以上

## 背景
digit3_profile_report.csv（section=digit3_by_machine_type）より:

| 機種タイプ | mean_diff | std_diff | 台数比率 |
|-----------|-----------|----------|---------|
| AT系      | 84.9      | 3233     | 65.6%   |
| A型       | 243.0     | 1321     | 25.7%   |
| BT        | 203.3     | 1552     |  8.6%   |

全体の65.6%を占めるAT系の末尾3が mean=84.9・std=3233 と非常に不安定で、
全体平均（135.8）を引き下げている。
A型（ジャグラー・ハナハナ等）の末尾3は mean=243.0 と全末尾平均（約182）を超える。

## アクション
末尾3を「低設定末尾」として一括に扱うのは誤り。AT系に限定した場合だけ成立する。
機種タイプを掛け合わせた特徴量（last_digit=3 AND bt_flag=0 AND jug_flag=0）を
AT系LTRの特徴量として追加することを検討する。

## 例
NG: 末尾3 → 全体的に低い → スコア下げる
OK: 末尾3 かつ AT系 → 低い（mean=84.9）→ スコア下げる
OK: 末尾3 かつ A型  → 平均以上（mean=243.0）→ スコアに影響させない

