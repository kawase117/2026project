# 末尾3は平常時最低・high anomaly日に集中投入される可能性がある

## 背景
蒲田七の digit3_profile_report.csv より:
- 全末尾 mean_diff: 末尾3 = 135.8（全末尾中最下位。次点は末尾1=176.0）
- high anomaly 日（5日間）の末尾別 mean_diff: 末尾3 = 851.8（全末尾中1位、2位の末尾5=725.6を大きく上回る）
- 末尾3の ACF 有意lagはlag2のみ（全末尾最少）
- Kruskal post-hoc で末尾3が全4有意ペアに登場（最大乖離: 3 vs 8, p=0.0016）

これらは「平常時は低設定多め・anomaly日に集中投入」という二極化パターンで説明できる。
二極化がACFの自己相関を弱め、Kruskalで他末尾と孤立させている可能性が高い。

## アクション
末尾3の rolling平均特徴量は信頼度が低い（通常時の低値と anomaly日の高値が混在）。
MLに組み込む場合は「直近のhigh anomaly発生フラグ × last_digit=3」の交互作用として扱う方が有効かもしれない。
ただしhigh anomaly日5件のみのため統計的根拠は弱く、仮説段階。

## 例
通常平均: last_digit=3 → mean_diff=135.8（全末尾最低）
high anomaly日平均: last_digit=3 → mean_diff=851.8（全末尾最高、通常の6.3倍）

