# 「7」が店名に入るホールでは、末尾7周辺（6・8・9）への設定集中が有効な集客戦略

## 背景（ユーザー仮説）
蒲田七（店名に「7」を含む）ではスロットユーザーが朝一台選びで末尾7を優先する傾向がある。
ホール側はこれを逆手に取り、「末尾7の客が座った台は高設定ではないが、隣や周辺（6・8・9）に高設定を入れる」
という「出玉感の演出」戦略を採る可能性がある。

また、「3台並び（7の3つ離れ）」という視点では末尾3が7から最も離れた位置にあるため
「7狙いの客に気づかれにくい」配置として末尾3は低設定に使いやすい。

土曜日のweekday_digit_cross: 末尾6 mean=307.8が全曜日・全末尾で最高値。
これは「土曜×末尾6 = 7の隣に設定を入れる演出」仮説と整合する。

## アクション
- 末尾6の土曜フラグを特徴量候補として記録する（土曜×last_digit=6）
- 末尾7自体の実績を別途確認する（高い期待に対して実績が低ければ仮説補強）
- 信頼度0.65: ユーザー仮説であり、複数の曜日・期間で検証が必要

## 例
土曜 mean_diff:
- 末尾6: 307.8（全曜日・全末尾で最高）
- 末尾7: 224.3（期待ほど高くない可能性）
- 末尾3: 119.8（低い = 7から遠く、ホールが低設定を入れやすい位置）
