# ダイデータ由来のDBは、特定の台のRBだけが数日連続で0になる欠損がある。評価前に必ず除く

## 背景
2026-10-14、みとやのディスクアップ745の設定推定で、10/4のRBが5,729Gで0回と出た。ユーザーが「設定1でも少なすぎる、データエラーでは」と指摘し、確認すると745は9/28〜10/4の7日連続(9/2にも1日)でRB=0、BBは10〜33回あり、RB列だけが欠けていた。他の台のRB=0は通常の範囲で、745だけの欠損だった。見逃して集計すると、通常日の745は「設定1の可能性95%」(正しくは設定1〜2が6割・4割)と出て、E10の結論も逆向きに歪んだ。

## アクション
- RB確率で台を評価する前に、`rb_count==0` かつ `games_normalized>=2000` かつ `bb_count>=6` の台日を欠損疑いとして除く(RBが本当に0になる確率は2,000G以上でほぼゼロ)。
- 連続日で同じ台に出たら、その期間のRBを使わず、BBだけ(RB欠損日)で更新するか、その日を外す。
- 他の機種(ジャグラー、BT機)でも同じ検出を回し、欠損台がないか洗い出す。欠損の原因(ダイデータの列ずれ・一時停止)は未確認。

## 例
745番: 9/28〜10/4はRB=0・BB 10〜33。除外後のE10は9日で1/412(設定5が64%)、通常日は79日で1/494(設定1〜2)。
