# みとやの「朝一×2」定型ツイートの日は、12日連続でホール全体が強かったが、13日目(10/14)で崩れた

## 背景
ユーザーが着目した定型は、翌日のホール平均差枚が12日(5/14、6/4、6/14、6/24、7/4、7/14、7/24、8/4、8/14、9/4、9/24、10/4)すべてでプラス(約+150/台、通常日-12)だった。これに基づき10/14を「強い日」と予測したが、結果は-152/台・勝率34%(回転数は4,155Gと多い)で外れた。12日は選ばれた日に偏っていた可能性がある。周年系の日(自店の7/10=+955、グループ他店7日平均+124、10/12=-78)とは別の概念で、ユーザーも別と明言している。

## アクション
- 定型ツイートが出ても、ホール全体が強いと断定しない。台の根拠は、午後のRB推移(確度の高い順)を優先する。
- 周年系は自店(7/10)とグループ他店を分け、定型日とも混ぜない。
- 定型日の評価は、13日目(10/14)を含めた13日で再集計する。

## 例
10/14: 午後のスキャンで上がった682(ネオアイム、最終+4,517)、723・726(ミスター)は最終まで残り、午前の本命だったマイVの664・673・649は午後に平均へ戻った。
