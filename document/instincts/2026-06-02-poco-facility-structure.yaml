# 機種名の表記揺れ対応が最優先

## 背景
ぽこで使用される機種名は、DB 内の正式な機種名と大きく異なる。
正規化なしに照合すると、実際には一致する機種でも「0%的中」と判定される。

### 既知の表記揺れ例:
- `スーパーブラックジャック` ↔ `SBJ` ↔ `スパブラ`
- `ミスタージャグラー` ↔ `ミスター`
- `北斗の拳転生2` ↔ `北斗転生2` ↔ `北斗`（曖昧）
- `デビルメイクライ` ↔ `デビメイ`

## アクション（実装順序）

### 優先度 HIGH:
1. **DB機種名の全リスト抽出**
   ```sql
   SELECT DISTINCT machine_name FROM machine_detailed_results
   ORDER BY machine_name;
   ```

2. **ぽこで出現した全機種名の抽出**
   - poco_data_extracted.csv の全 content フィールドをパース
   - 出現した機種名リストを作成

3. **マッピングテーブル作成**（手動ペアリング or 部分文字列マッチング）
   - Levenshtein 距離で類似度を計算し、手動確認

