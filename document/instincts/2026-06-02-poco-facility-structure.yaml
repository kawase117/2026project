# ぽこ仕掛け内容の構造（曜日・末尾・機種の3層構造）

## 背景
ぽこの「仕掛け内容」欄には、店側が投入した高設定台の配置戦略が以下の3層で記載されている。

例：`水曜日→末尾：ノーマル末尾1・3、AT末尾2・8、全→SBJ`

分解すると：
1. **曜日仕掛け（Layer 1）**: `水曜日`
   - 「この曜日に高設定を投入」という大枠の戦略

2. **末尾仕掛け（Layer 2）**: `末尾：ノーマル末尾1・3、AT末尾2・8`
   - 台番号末尾による配置パターン
   - タイプ別に異なる末尾を指定（ノーマル機は末尾1・3、AT機は末尾2・8）
   - この数字が「実際の答え」（DB記録との比較対象）

3. **機種仕掛け（Layer 3）**: `全→SBJ`
   - 「全台の中で SBJ が高設定」という機種レベルの情報
   - 「全」は「ホール全体から見たときに」という意味
   - 「機種ハーフ」と記載される場合もある（ATが半分設定の意味か）

## 重要な留意点

- **表記揺れが激しい**:
  - `SBJ` = `スーパーブラックジャック`
  - `デビルメイクライ` = `デビメイ` など
  - DB内の正確な機種名とマッピング必須

- **機種名の略形**:
  - ジャグラー系: `ミスタージャグラー` → `ミスター`
  - 北斗系: `スマスロ北斗の拳` と `北斗の拳転生2` を区別

## アクション

### Step 1: 機種名の正規化テーブル作成
1. DBの `machine_detailed_results` から全機種名を抽出
2. ぽこで使用される別称をマッピング

### Step 2: 抽出ロジックの改善
1. 「曜日層」「末尾層」「機種層」を分離抽出
2. 各層ごとに検証ロジックを実装

### Step 3: 的中率の多角化
1. **機種の的中率**: 仕掛け機種が DB の高差枚機種に含まれるか
2. **末尾の的中率**: 仕掛け末尾が DB の高差枚末尾に含まれるか
3. **曜日の的中率**: 曜日層の有効性（別途分析）

