# 「基準台＋方向」指定は水平方向(x)のズレを意味することが多い

## 背景
楽園蒲田店 本館3F の末尾ブロック修正で、ユーザーの指示
「3200の真下に3254、そこから左に3255・3256と続く」を、
最初は「3200との垂直方向の隙間（行間ギャップ）を詰める」指示だと誤解し、
該当3台だけをy方向にシフトする修正を行った。

結果はユーザーから「修正方法が全く異なります。接するように直すのでは
ありません。水平方向指定の話です」と明確に否定された。

実際の意図は：
- 3254 は 3200 と同じ x 座標（真下）に固定する「アンカー」
- 3255, 3256, 3257 はそこから「左方向」へ連番で並べる（x座標を-1ずつ）
- 別の行では 3253 がアンカーで、左方向に 3252→3251→3250 と続く
- 既存コードでは逆方向（アンカーから右へ連番）になっていたのが根本原因

つまり「Aの真下にBがあり、そこから左にC・Dと続く」という指示は、
**A=固定アンカー（x座標基準点）、B=Aと同じx、C/D=Bからの相対方向（左/右）**
という「アンカー＋連番方向」の仕様であり、行間の隙間（y方向）の話ではない。

## アクション
1. 「Xの真下にYがあり、そこから左/右にZ・Wと続く」という指示を受けたら、
   まず「YのX座標をXに合わせる（垂直方向の整列）」＋「Z,W,...はYから指定方向に
   連番でx座標をずらす」という**水平方向の並び**の指示として解釈する
2. 「詰める」「接する」など隙間を埋める指示と「真下」「左右に続く」という
   並び順の指示は別物。曖昧な場合は両方の解釈をASCIIプレビューで提示してから
   進めるか、先に「垂直方向(隙間)の話か、水平方向(並び順)の話か」を一言確認する
3. 修正前に preview_ascii.py で現在の配置を確認し、修正後も同じツールで
   差分（どのセルがどう動いたか）を提示してからユーザーに確認を求める
4. 1回の指示で複数の解釈が成立しうる場合、安易に「垂直方向」側の解釈で
   実装を進めない（過去に「全くダメですね」という強い否定を招いた経緯あり）

## 例
誤った修正（y方向シフト）:
```python
# 3254/3253/3262 を3200の真下(x9)に縦一列で配置 ← 誤り
add_run(rows, floor, [3254, 3253, 3262], 9, 29, 0, 1, section=(3250, 3266))
```

正しい修正（x方向のアンカー＋連番方向）:
```python
# 上段：3200の真下(x9)に3254、左へ3255→3256→3257
add_run(rows, floor, [3254, 3255, 3256, 3257], 9, 31, -1, 0, section=(3250, 3266))
# 下段：3200の真下(x9)に3253、左へ3252→3251→3250
add_run(rows, floor, [3253, 3252, 3251, 3250], 9, 32, -1, 0, section=(3250, 3266))
```
