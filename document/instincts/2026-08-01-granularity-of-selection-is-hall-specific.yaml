# 「機種を選ぶ」か「台を選ぶ」かはホールの属性。流用してはいけない

## Core claim
全9ホールで同一の枠組み（直近21日で学習→翌日買う、総和ベース採点、n台>=9で機種を足切り）を
ウォークフォワードした結果、**有効な選択粒度がホールごとに正反対**だった。
楽園で確立した「機種は選べ、台は選ぶな」はホール横断の法則ではない。

## Evidence
- data scope: 9ホール個別（プールなし）、直近90日から学習・直近60日を採点、各ホールの最終日ロスターに限定
- metric scope: 選択台集合の総和ベース機械割 − 同日同カテゴリ非選択台の総和ベース機械割(pp)

**機種型（R2が正・R1が負〜ゼロ）**

| ホール | R2 k=2 or 3 | R1 k=5 |
|---|---|---|
| みとや | **+3.53 [+2.10,+4.96]** 勝率73% | -1.85 [-5.98,+2.27] |
| 楽園 | **+2.51 [+1.27,+3.75]** 勝率73% | -0.57 [-5.00,+3.87] |
| ヒロキ | +1.59 [+0.20,+2.98] | -4.29 [-10.56,+1.97] |
| レイトギャップ | +1.38 [+0.05,+2.70] | -1.22 [-6.12,+3.68] |

**台型（R1が正・R2がゼロ）**

| ホール | R2 k=3 | R1 k=5 |
|---|---|---|
| 蒲田7 | +0.27 [-1.37,+1.90] | **+6.75 [+2.21,+11.29]** 勝率60% |

**どちらも検出できない**: 蒲田1（R1 +4.09 [-3.01,+11.19]、R2 ≈0）、ARROW（両方ゼロ〜負）、
金時（両方0跨ぎ）、ザシティ（n台>=9の機種が2つしかなく R2 は実質二択）

## ⚠️ 蒲田7の台粒度は、ほぼ全て鉄台2026の寄与だった
鉄台（machine_number 2026）を選択から除くと効果が消える。

| 設定 | 2026含む | 2026除外 |
|---|---|---|
| win=14 k=5 | +9.00 [+4.29,+13.72] | +4.95 [-0.05,+9.94] |
| win=21 k=5 | +6.75 [+2.21,+11.29] | +1.91 [-2.96,+6.78] |
| win=30 k=10 | +3.48 [+0.44,+6.53] | +0.36 [-2.81,+3.52] |
| win=14 k=20 | +4.28 [+1.86,+6.71] | **+2.70 [+0.21,+5.18]**（唯一生存） |

つまり蒲田7は「台の過去成績が翌日を予測する」のではなく、
**「常に優遇される1台を知っている」**が正しい記述。20260731時点で2026は
甲鉄城のカバネリ 海門決戦、直近21日で hit104率 85.7%・平均+4,947枚。
広く取る（k=20）なら鉄台抜きでも +2.7pp が残るが、k を絞るほど鉄台依存になる。
`briefing_common` の注記どおり「鉄台は検定では除外必須・台選びでは除外してはならない」の実例。

## DD1（毎月1日）の同月内リフト — これもホールごとに正反対
| ホール | リフトpp | 95%CI | プラス率 |
|---|---|---|---|
| 蒲田1 | **+1.180** | [+0.358,+2.003] | 68.4% |
| ARROW | **+0.905** | [+0.217,+1.594] | 77.8% |
| 蒲田7 | +0.390 | [-0.584,+1.365] | 58.3% |
| 楽園 | +0.362 | [-0.081,+0.805] | 68.4% |
| 金時 | -0.209 | [-1.179,+0.760] | 52.6% |
| ヒロキ | -0.389 | [-1.135,+0.357] | 42.1% |
| ザシティ | **-0.850** | [-1.650,-0.049] | 31.6% |
| レイトギャップ | **-0.854** | [-1.452,-0.256] | 18.8% |
| みとや | **-1.012** | [-1.646,-0.378] | 26.3% |

- **ARROW の DD1 は `HALL_EVENT_DIGITS` に未登録**（登録は {8,18,28,11,22}）。有意に正なので要追加検討
- 蒲田7 は DD1 が登録済みイベントDDだが +0.39 非有意。「1のつく日」の効果は DD1 単独では薄い
- みとや・レイトギャップ・ザシティの DD1 は**有意にマイナス＝回収日**。避けるべき日

## Action
1. 新しいホールで台選びを始めるとき、**まず粒度をウォークフォワードで決める**。
   他ホールで効いた粒度を初期値として流用しない（[[feedback-no-cross-hall-pooling]]）
2. 蒲田7で「台選びが効く」と言うときは必ず鉄台2026の寄与を分離して述べる。
   k を絞った推奨は実質「2026を打て」であり、予測力の主張ではない
3. 機種粒度を使うホール（みとや・楽園・ヒロキ・レイトギャップ）では n台>=9 で足切りする
4. DD1 の扱いはホール別。みとや・レイトギャップ・ザシティでは DD1 に行かない
5. ザシティ(128台)・金時(148台)は n台>=9 の機種が2つしかなく、機種粒度の分析自体が成立しない。
   「効果なし」ではなく**検定不能**として扱う（[[feedback-statistical-certainty-calibration]]）

