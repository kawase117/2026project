# 集計単位の統合/分割は直感でなく leave-group-out 相関の3階層テストで決める

## 背景
楽園のsectionは背中合わせ2列を1つに統合していた欠陥が見つかり63列に分割したが、
「まとめることで物理配置ではない真の設定投入単位が見えるのでは」という対立仮説が
出た（ユーザー指摘）。これをleave-island-out残差の相関で検定した。単純な同日×同機種
残差は、その機種が島内を独占していると残差の総和が構造的にゼロになり機械的な
負相関を作るため、ベースラインから対象の島を除外する必要があった。3階層の物差し
（(1)同じ列を半分に割った半分どうし=上限、(2)同一島の列どうし=対象、(3)別の島の
列どうし=下限）で測ると、対象は上限の1/3程度、かつ個別ペアで見ると日数の多い
ペアほどゼロに近くばらつき、一律の統合は支持されなかった。

## アクション
集計単位の統合/分割を決めるときは直感や「業務上こう動いているはず」という
推測だけで決めない。leave-target-out（対象グループをベースラインから除外）した
残差で、(1)真に同一単位のときの上限、(2)対象ペア、(3)無関係な下限、の3つを
並べて測る。対象が上限に近ければ統合、下限に近ければ分割維持。個別ペアのばらつきも
必ず確認し、統合値の平均だけで判断しない（少数の外れペアが平均を引き上げていないか）。

## 例
```python
# 対象グループXをベースラインから除いて残差を作る（機械的な負相関を回避）
resid = value - baseline_excluding(X)
corr_same_group = corr(daily(resid, half_a), daily(resid, half_b))   # 上限
corr_target      = corr(daily(resid, col_a), daily(resid, col_b))     # 対象
corr_unrelated    = corr(daily(resid, other_a), daily(resid, other_b)) # 下限
```

