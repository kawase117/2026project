# 機種の異常値を扱う前に eda/at_semantics_validator.py の AT_SPECS を確認する。独自の物理限界判定より先に既存資産を見る

## 背景
ゴッドイーター リザレクションとスマスロ北斗の拳のボーナス確率がホール間で
食い違って見えたため、「台番号への物理的な結線ミス」という仮説を立てて
1ラウンド分の検証（台番号の連続日数・機種入替をまたぐ継続性の検定）を
丸ごと消費した。実際には eda/at_semantics_validator.py に両機種の公式スペック
（AT_SPECS、1geki.jp出典）が既に登録されており、ホール×列(bb/rb)の適合検証も
既に実行済みだった（ゴッドイーターは rb=at がPASS、bb=at がfail、という
判定が既に出ていた）。これを先に見ていれば、台番号仮説の検証は不要だった。

## アクション
機種名でボーナス/AT確率が異常に見えたら、まず `grep 機種名 eda/at_semantics_validator.py`
でAT_SPECSに登録済みか確認し、登録済みならそのファイルを実行して該当機種の
判定行（PASS/fail、採用列）を見る。登録されていない機種だけが真に未検証。
独自の物理限界仮説（台番号の物理故障等）を立てる前に、既存の検証器・過去の
instinct・spawn済みツールを検索する一手間を必ず挟む。

