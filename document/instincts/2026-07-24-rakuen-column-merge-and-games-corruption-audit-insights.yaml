# 単一の物理限界閾値をカテゴリ横断で適用すると大量の偽陽性が出る。AT機とジャグ/ハナ/沖スロはボーナス確率が2桁違う

## 背景
本セッションで2回、同じ失敗パターンが起きた。(1) 機械割>200%かつdiff>1000で
「破損」を検出→14,554行のうち89%がAT機で、AT機のボーナス/AT当選確率(1/15〜150)は
ジャグ/ハナ/沖スロ(1/300+)と2桁違うため単に正常な高分散日だった。(2) ボーナス確率
>1/20で再検出→3,415行のうち89.3%が同じくAT機の誤検出。低天井系（ジャグ・ハナ・
沖スロ）に絞ると真の異常候補は364行(0.024%)まで減り、台番号の連続日数も最大2日で
物理故障の証拠もなかった。いずれも「1つの閾値を全カテゴリに当てはめる」ことが
原因で、カテゴリ別に閾値を分けるか機種内標準化を使えば防げた。

## アクション
異常値・破損データを検出するときは、AT機とジャグ/ハナ/沖スロを同じ閾値で
判定しない（当選確率が2桁違うため）。カテゴリ別に閾値を導出するか、機種内で
標準化した値（z-score）で判定する。さらに機種固有のスペック検証器
（eda/at_semantics_validator.pyのAT_SPECS）が既にあるなら、独自に閾値を
発明する前にまずそれを確認する（see: check-existing-per-machine-spec-validator）。

## 例
```python
# NG: 全カテゴリに同一の物理限界を適用
corrupt = df[(df.payout > 2.0) & (df.diff > 1000)]  # AT機を大量に誤検出

# OK: カテゴリ別、または機種内標準化で判定
corrupt = df[df.bonus_rate > CATEGORY_LIMITS[df.cat]]  # カテゴリごとの物理上限
# または AT_SPECS 等の既存スペック検証器を先に確認する
```

