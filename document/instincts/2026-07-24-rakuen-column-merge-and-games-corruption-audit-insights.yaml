# ホール間の確率食い違いは「別の信号を集計している」だけでなく「片方の列が単に未使用/重複記録」という単純な形もある

## 背景
ゴッドイーター リザレクションでbb+rb合算のボーナス確率がホール間で最大9倍
食い違い、「ホールごとに違う当選種別をbb/rbに記録している」という複雑な
仮説を立てた。実際にrb_countを単独で見ると全9ホールが1/334〜540とスペック
範囲にほぼ収まって一致し、bb_countだけが原因だった：5ホールでbb_countは
ほぼゼロ（未使用列）、残り4ホール（蒲田7・蒲田1・金時・雑色）ではbb_countが
rb_countとほぼ同値（AT初当りを重複記録）。bb+rbを合算すると後者4ホールだけ
分母が実質2倍になり、確率が約2倍に見かけ上膨らんでいた。「ホールごとに違う
信号」という前提が誤りで、正しくは「一部ホールで片方の列が重複記録」という
より単純な機械的原因だった。

## アクション
bb_count/rb_countがスペックと食い違う機種を見つけたら、まず両方を単独で
ホール別に見る（合算する前に）。片方の列だけが全ホールでスペックに一致するなら、
もう片方は「意味が違う」のではなく「単に壊れている/未使用/重複」である
可能性が高い。この場合の対処は該当列を無視するだけで済み、ホールごとに
別の集計対象へ再マッピングするような複雑な対応は不要。

## 例
```python
# ホールをまたいで合算せず、まず列ごと・ホールごとに単独確認する
for col in ["bb_count", "rb_count"]:
    rate_by_hall = df.groupby("hall").apply(
        lambda s: s.games_normalized.sum() / max(s[col].sum(), 1))
    print(col, rate_by_hall)   # 片方だけが全ホールで揃うか確認
```
