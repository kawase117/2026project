# 設定の判別可否は、機種の種別(AT機・BT機)からではなく、スペック表(find_spec)を引いて答える

## 背景
2026-10-16、楽園3135(スマスロ サンダーV)で、ユーザーが「BB中のバラけ目が出たのでほぼ設定5・6」と申告した。私は台データ(440G、BB1・RB1)を見て「サンダーVはボーナス確率で判別できる機種ではない」と断言したが、これは確認せずに書いた誤りだった。ユーザーに「サンダーはボーナス確率で判別できます」と指摘された。

`backtest.bonus_specs.find_spec('スマスロ サンダーV', load_specs(hall=...))` を引くと、種別はBT・ノーマル、`judgeable: true`、設定は1・2・5・6の4設定(出所は実機解析値 2026-07-06)だった。BB確率は設定1が1/278、設定6が1/264、RB確率は設定1が1/434、設定6が1/314で、RB確率の最大比は1.38倍。判別はできるが、設定間の差が小さく、絞り込む力は弱い機種だった。

## アクション
- 「判別できない」と言う前に、`find_spec` で `judgeable` と設定別のBB・RB確率を確認する。AT機・BT機・スマスロというだけで判別不能と決めない。`scraper/realtime/estimate.py` の `RB_JUDGEABLE_AT` は北斗だけで、ランキングの対象と、スペック表上の判別可否は別。
- 「できる」「できない」の二択で答えず、判別力を数字で言う(RB確率の最大比、必要な回転数)。比が小さい機種は「判別できるが絞れない」と書く。
- 判別可否を断定した説明は、既存の判別可否の記述(`feedback_some_at_machines_are_rb_judgeable`)と食い違わないか確かめてから出す。

## 例
```python
from backtest.bonus_specs import load_specs, find_spec, posterior
sp = find_spec('スマスロ サンダーV', load_specs(hall='楽園蒲田店'))
sp['judgeable']                      # True
posterior(sp, 772, 2, 3)             # {1: 0.22, 2: 0.24, 5: 0.27, 6: 0.28} -> 5以上は0.54で五分五分
```

