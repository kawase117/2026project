# 予測器の的中率は、「当てるべき正解が存在する割合」で層別して評価する。除外の基準は評価窓より前のデータで決める

## 背景
2026-10-17、台帳のジャグラー候補(10/13〜10/16、9ホール、29ホール日、候補137台)の成績は、平均差枚が+54に対して同日の他のジャグラーが+16(差+38)、勝率が38.0%対38.4%で、無作為と区別できなかった(標準誤差は約±100枚)。

ユーザーから「事前に自信のないホールを外したらどうか。雑色や金時は、そもそも高設定が存在せず、正解がない可能性がある」と提案された。10/12までのデータで、ホール別の「ジャグラーの設定5以上の割合」を機種別EMで推定すると、蒲田7が12.3%、楽園が11.9%、みとやが7.4%(マイVだけなら13.8%)、金時東口が5.2%、雑色が4.7%、蒲田1が4.1%、平和島が3.6%、ARROWが2.8%、金時京急が2.6%、ヒロキ東口が1.5%だった。この割合の高い側(楽園・みとや、7ホール日)は差+158(勝率32%対35%)、低い側(16ホール日)は差−30。どちらも誤差の中だが、低い側は正解が存在しないので、当たらなくて当然だった。

## アクション
- 台単位の予測器を評価するときは、先にホールごとに「正解(高設定)が存在する割合」を推定し、その割合で層別して成績を出す。割合が数%のホールでは、候補10台に混ざる高設定の期待が0.5台未満で、的中率の低さは予測器の失敗とは言えない。
- 絞り込み・除外の基準は、**評価窓より前のデータだけ**で決める(今回は10/12まで)。結果を見てから除外すると、選択バイアスになる。基準は台帳(仮説台帳 `jug-cand-high-share-halls`)に事前登録する。
- 割合は機種でも違う(みとやは全ジャグラーで7.4%、マイVだけなら13.8%)。ホール単位だけで絞らず、機種でも層別する。
- 割合の推定は3,000G以上の台日に絞るので、回った台に偏り、高めに出る。絶対値ではなくホール間の順位を使う。
- 「高設定が存在する」ことと「候補で当てられる」ことは別。存在する割合が高いホールでも、候補が正解を当てる力は別に測る。

## 例
```text
ホール別の設定5以上の推定割合(8/16〜10/12、3,000G以上): 蒲田7 12.3% / 楽園 11.9% / みとや 7.4% / ... / ヒロキ東口 1.5%
候補10台に混ざる高設定の期待台数 = 10 × 割合 -> 割合4%なら0.4台。ここでの的中率は無作為と区別できなくて当然。
```

