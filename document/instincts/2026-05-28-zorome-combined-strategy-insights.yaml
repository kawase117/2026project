# correction 閾値は ±150 が最適操作点

## 背景
combined_strategy_simulation で threshold を 0/50/100/150/200/300/400 とスイープした結果、
threshold=150 で diff Y-X と Cohen's d が同時にピークを示した（∩型曲線）。

- threshold=0  : coverage=72.1%, diff=+167.0, d=0.255, p=0.144
- threshold=100 : coverage=54.1%, diff=+210.5, d=0.284, p=0.208
- threshold=150 : coverage=52.5%, diff=+229.0, d=0.307, p=0.144  ← ピーク
- threshold=200 : coverage=50.8%, diff=+217.3, d=0.288, p=0.202
- threshold=300 : coverage=37.7%, diff=+120.7, d=0.175, p=0.622  ← 急落

150未満は signal が薄い日も含み効果を希薄化する。
150超は参加日数が急減し、ノイズが優位になる。

## アクション
- correction > +150 → ゾロ目台（XX番台）を最優先
- correction < -150 → ゾロ目台を避ける（同末尾の非ゾロ目台から選ぶ）
- -150 ≤ correction ≤ +150 → signal が薄い。ゾロ目にこだわらない
- 参加率は約 50% になる（週3〜4日行動する場合、1〜2日はスキップ扱い）

## 例
```
曜日=水曜, target_digit=7, correction=+320 → ゾロ目台（77番台）を最優先
曜日=水曜, target_digit=9, correction=-87  → 閾値未満。末尾9の全台から選ぶ
曜日=月曜, target_digit=3, correction=-200 → ゾロ目台33を避け非ゾロ目台から選ぶ
```

