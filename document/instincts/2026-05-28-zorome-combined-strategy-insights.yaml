# threshold と coverage は単調減少、効果量（d）は ∩ 型

## 背景
threshold スイープ結果：
- threshold が上がると coverage は単調に低下
- Cohen's d は threshold=150 でピークの ∩ 型
- threshold=300 以上で d が急落（サンプル23日以下 → ノイズ優位）

## アクション
新しいホールで threshold sweep を実施するときの解釈方針：
1. d のピークが現れる threshold を確認（ホールによって異なる可能性）
2. coverage が 40% 未満になる threshold は避ける（サンプル不足）
3. d のピーク値が 0.2 未満 → ゾロ目効果が弱い（このホールでは採用しない）
4. d のピーク値が 0.3 以上かつ coverage ≥ 40% → 採用を検討

## 例
```
判定基準:
  d >= 0.3 かつ coverage >= 40% → 採用
  d < 0.2 または coverage < 30% → 採用しない
  d >= 0.3 かつ coverage < 30%  → 要判断（参加機会が少なすぎる）

蒲田7の結果:
  threshold=150: d=0.307, coverage=52.5% → 採用基準を満たす（ただし初年度ホールの制約あり）
```

