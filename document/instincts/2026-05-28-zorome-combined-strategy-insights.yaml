# 統合戦略の期待値は ML精度 × correction 信号強度の積

## 背景
combined_strategy_simulation の結果：
- ゾロ目単体シミュレーション（B-A）: +286 枚/機（61日）
- 統合戦略（Y-X, threshold=0）: +167 枚/機（44参加日）
- 統合戦略（Y-X, threshold=150）: +229 枚/機（32参加日）

Y > X の恩恵は「MLの末尾予測が正しかった日」にのみ発生する。
ML の予測 miss_rate が 30〜40% あれば、有効日は 60〜70% に限定される。

## アクション
- correction > 150 の日に参加判断
- ML の最信頼エキスパートの rank1 末尾を確認し、そのゾロ目台に座る
- ML予測が複数エキスパートで割れる日（合意なし）は参加見送りも選択肢
- 「correction が強い日 = ML予測も正確」という保証はないので過信しない

## 例
```
期待値の上限（理論値）:
  ゾロ目効果 +229 枚 × ML精度 70% ≈ +160 枚/日（補正後期待値）

ML予測が外れた場合: +229 が消失 → ランダム選択と同等かそれ以下
→ 複数エキスパートが同じ末尾を指す日に絞ると期待値向上の可能性
```

