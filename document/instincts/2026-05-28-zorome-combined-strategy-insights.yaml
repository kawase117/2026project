# correction の符号と絶対値で台選択を決める（冗長な条件を書かない）

## 背景
「|correction| > 150 かつ correction > 0」という記述は正しいが冗長で誤解を招く。
correction > +150 と書けば絶対値条件も符号条件も同時に満たす。
「|correction| > 150 かつ correction < 0」は correction < -150 と等価。

## アクション
正しい条件分岐（3択）：
- `correction > +150` → ゾロ目台を最優先
- `correction < -150` → ゾロ目台を避ける
- `-150 ≤ correction ≤ +150` → どちらでもよい

「|correction| > 150」は閾値確認に使う表現だが、
方向（正負）は別途 correction の符号で判断する。
一文に混在させると矛盾・冗長が生じる。

## 例
```python
# 正しい実装（明確な3択）
if correction > 150:
    action = "prefer_zorome"
elif correction < -150:
    action = "avoid_zorome"
else:
    action = "neutral"

# 避けるべき書き方（冗長・誤解招く）
if abs(correction) > 150 and correction > 0:   # ← 冗長
    ...
if abs(correction) > 150 and correction < 0:   # ← 冗長
    ...
```

