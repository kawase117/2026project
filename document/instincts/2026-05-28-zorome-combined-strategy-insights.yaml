# オープン初年度ホールは correction テーブルの signal が未成熟

## 背景
蒲田7はオープン日が 2025/7/7（データ約10ヶ月）。
threshold=150 の有効性を蒲田7のデータのみで統計的に確認することは困難。
また初年度はホール側の設定投入パターンが試行錯誤中で不安定な可能性がある。

## アクション
- 初年度ホールでは threshold=150 の知識を「仮説レベル」として扱う
- まず既存の古いホール（2年以上のデータあり）で threshold sweep を実施し有効性を確認
- 有効性が確認できたホールの知識を初年度ホールへ転用する
- 2年目以降（データ400日以上）で蒲田7の threshold を再校正する

## 例
```
転用手順:
1. 老舗ホール（例: みとや大森町）で threshold sweep を実行
2. d のピーク threshold と coverage を確認
3. 蒲田7でも同じ threshold を暫定採用
4. 蒲田7のデータが溜まったら（2026年後半〜）再スイープで校正
```

