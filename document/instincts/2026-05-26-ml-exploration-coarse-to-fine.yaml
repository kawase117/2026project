# ML探索は粗く網羅的→細かく限定的の段階的絞り込みを原則

## 背景
制限されたリソース（計算時間、実験反復数）の中で、
探索空間全体を効率的にカバーするため、
段階的な絞り込み戦略が必須。
無計画に細かい最適化から始めると、
全体像を見落とし、局所最適解に陥る。

pachinko-analyzer Phase 5-6 での実証：
- Phase 5（粗い探索）: 全ホール統合 vs ホール別別々モデル vs 機種別グループ化
  → 「機種別グループ化が最適」と判定
- Phase 6A（細かい探索）: 機種別グループ内で特徴量追加（digit_lag, total_diff_coins_deficit）
  → digit_lag_v1-v2, catboost_gpu_wf による段階最適化
- Phase 6B（微調整）: ハイパーパラメータ（lambda, learning_rate等）の精密調整

## アクション
常に以下の順序で探索する：

### Step 1: グループ化戦略（粗い探索）
複数の候補グループ化を同時に試す：
- 全ホール統合
- ホール別別々モデル
- 機種別グループ化
- 末尾別グループ化
- 曜日別グループ化

各々で AUC/NDCG などのベースラインを比較。最適グループ化を確定。

### Step 2: 特徴量追加（中程度の探索）
確定したグループ化の下で、候補特徴量を段階的に追加：
- 元々の特徴量セット（baseline）
- + lag 特徴量（[2,6,7,14]など）
- + ホール固有差分（total_diff_coins_deficit）
- + 機種内の相互作用

各レイヤーで walk-forward 実測で効果測定。
有効な特徴量だけを次に進める。

### Step 3: ハイパーパラメータ微調整（細かい探索）
最適特徴量セット下で、lambda/learning_rate/tree_depth などを精密探索。
グリッドサーチまたはランダムサーチで最高性能を目指す。

## 重要な原則

1. **各段階で 1 つの変数だけ変える**
   - グループ化 → 特徴量 → ハイパラ の順序を守る
   - 複数を同時に変えると、どちらが効いているか不明になる

2. **必ず walk-forward で検証する**
   - CV AUC だけでは不十分（過学習、特徴量選択バイアス）
   - 予測スパンなども同時に確認

3. **ベースラインを明示して保管**
   - 各段階のベストモデルを記録
   - 改善前後で統計有意性を確認

4. **逆効果の特徴量は即座に棄却**
   - univariate cv_auc < 0.50 は危険シグナル
   - walk-forward で改善なし → 採用しない

## 例

```python
# pachinko-analyzer での実装例

# === Phase 5: グループ化戦略（粗い）===
grouping_strategies = [
    "all_halls_unified",          # AUC 0.540
    "hall_specific",              # AUC 0.564 ← best
    "machine_type_grouped",       # AUC 0.565 ← best
    "last_digit_grouped",         # AUC 0.528
    "weekday_grouped",            # AUC 0.485
]
# → 機種別（machine_type_grouped）を確定

# === Phase 6A: 特徴量追加（中程度）===
# baseline: AUC 0.565
features_v1 = baseline_features
# → digit_lag_v1: AUC 0.571 ✓ 改善
features_v2 = baseline_features + digit_lag + total_diff_coins_deficit
# → digit_lag_v2: AUC 0.579 ✓ さらに改善
features_v3 = features_v2 + machine_type_interaction
# → digit_lag_v3: AUC 0.576 ✗ 過学習、採用しない

# 最終採用: digit_lag_v2 (features_v2)

# === Phase 6B: ハイパラ微調整（細かい）===
best_params = {
    "lambda": 1.25,              # grid search: [0.5, 0.75, 1.0, 1.25, 1.5]
    "learning_rate": 0.01,       # grid search: [0.005, 0.01, 0.02]
    "max_depth": 4,              # grid search: [3, 4, 5]
    "subsample": 0.8,
}
# → final AUC: 0.583 ✓ 最高性能
```

