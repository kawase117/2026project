# EDA forward selection 結果 ≠ XGBRanker walk-forward での有効性

## 背景
EDA（univariate 相互作用分析）と ML（walk-forward 実測）の異なる観点：

EDA forward selection では：
- 各特徴量単独の相互作用を評価
- 「他の特徴量との相乗効果」を含む

ML walk-forward では：
- モデル最適化後の実測 AUC/NDCG で評価
- 過学習・特徴量選択バイアスをカバー

**具体例（pachinko-analyzer digit_lag_v5）**:
- EDA で lag15 が forward selection rank2 に選出（D3モデルが微増）
- ただし univariate cv_auc=0.4984（< 0.50, 負のシグナル）
- walk-forward で digit_lag_v5 を試験 → 2F_N hit@2 -0.0069 で劣化
- 結論: EDA の「相互作用込み効果」が XGBRanker では再現されず

## アクション
特徴量採択の最終判定は必ず walk-forward 実測で行う：

1. **univariate cv_auc で最初の篩（ふるい）**
   - cv_auc > 0.50: 候補として保持
   - cv_auc <= 0.50: 危険シグナル、採用非推奨

2. **EDA forward selection は「候補スクリーニング」のみ**
   - 有望な特徴量のショートリストを作成
   - 最終採択ではない

3. **walk-forward で改善確認**
   - ベースライン vs 新特徴量の統計有意性を測定
   - 複数回実行して安定性を確認
   - 一貫性のない改善は採用しない

4. **ドメイン知識の相乗効果を確認**
   - 「この特徴量は理論的に有効なはず」という期待は検証対象
   - 実測が反映するまで採用しない

## 例
```python
# 特徴量採択の決定フロー

feature_lag15 = {
    "eda_forward_rank": 2,           # 有望に見える
    "univariate_cv_auc": 0.4984,    # < 0.50 → 危険シグナル ⚠️
    "eda_interaction_effect": "+3%", # 相互作用あり（局所的）
}

# === Step 1: 篩 ===
if univariate_cv_auc < 0.50:
    print("危険シグナル。walk-forward で厳密に検証")
    # → walk-forward 実行

# === Step 2: walk-forward 結果 ===
wf_result = {
    "2F_N hit@2_delta": -0.0069,     # 劣化 ✗
    "3F_A hit@2_delta": -0.0045,     # 劣化 ✗
    "consistency": "negative",        # 一貫して悪い
}

# === Step 3: 判定 ===
if wf_result["consistency"] == "negative":
    decision = "採用しない（EDA forward selection 無視）"
else:
    decision = "採用"
```

