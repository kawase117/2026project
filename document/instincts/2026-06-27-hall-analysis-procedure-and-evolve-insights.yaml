# 1セグメント50台未満は検定力不足で偽シグナルを生む

## 背景
蒲田7の3F_R_N（74台）でさえbootstrap検出力=0.503（境界）で「シグナルが存在しないとは断定しない」レベル。
みとやのバラエティ島（20台）を独立セグメントとして分析すると、少数台依存のアーティファクトが頻発する。

## アクション
- 50台未満のセグメントは隣接セグメントと統合するか、分析対象から除外
- A機が全体の10%未満（例: 2F A機が15台しかない）なら、A/N分割しない
- 小規模ホール（100台未満）ではセグメント数を2-3に抑える

## 例
| ホール規模 | 推奨セグメント数 |
|-----------|---------------|
| 100台未満 | 2-3（A/Nのみ or フロアのみ） |
| 100-300台 | 3-4（フロア×A/N） |
| 300台+ | 4-6（フロア×LR×A/N、LR有効な場合のみ） |
