# 蒲田7の結論は移植禁止、手順のみ移植する

## 背景
蒲田7と蒲田1（同系列マルハン）で曜日効果が完全に逆転している実証例がある:
- 蒲田7: 水曜最強(+1.5pp) / 金曜最弱(-4.2pp)
- 蒲田1: 火曜最強(+3.4pp) / 水曜弱い(-2.0pp)
末尾、DD、イベント日の法則もすべてホール固有。

## アクション
移植可能なもの: 分析手順（KW検定→耐久性検証→theory.md作成）、アンチパターンの検出方法、3フェーズモデルの方向（新台→テコ入れ→定番の改善方向）
移植禁止なもの: 「末尾d8が強い」「水曜がイベント日」「角番5-11が最強」等の具体的な結論

## 例
| 項目 | 移植可否 | 理由 |
|------|---------|------|
| 角番中間台優位の方向 | △条件付き | 島サイズで最強角番が変わる |
| 曜日パターン | ✗禁止 | ホール間で逆転する |
| イベント日定義 | ✗禁止 | event_digitsがホール固有 |
| 3フェーズ単調改善 | ○方向のみ | 全9ホールで確認済み |

