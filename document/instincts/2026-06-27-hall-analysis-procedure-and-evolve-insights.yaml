# ドメイン特化プロジェクトではinstinct evolveの自動クラスタリングは不十分 — 手動分析が必要

## 背景
2026-06-27 instinct-cli.py evolve --generate を実行。460 instinctsに対してスキル候補0件、
コマンド候補1件（文字化けで無効）。パチンコドメインの専門用語が多く、汎用的なテキスト類似度では
意味のあるクラスタが形成されない。

## アクション
1. domain列でグルーピング（python3スクリプトで集計）
2. 5件以上×平均confidence≥0.85のドメインを進化候補として抽出
3. キーワード検索で横断的なクラスタ（walkforward/debut/lookahead等）を手動で特定
4. 既存の進化済みスキルとの重複を確認してから新規作成/更新を判断

## 例
手動分析結果: ml-evaluation(52件), pachinko-analysis(50件), ml-feature-engineering(44件)等のクラスタを発見。
walkforward(43件), debut-lifecycle(25件), lookahead-prevention(16件)の横断クラスタを特定し、
5つのスキルを新規作成/更新。

