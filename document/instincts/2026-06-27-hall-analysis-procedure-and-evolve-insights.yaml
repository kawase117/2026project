# 角番定義はε²で3種比較して選ぶ — 定義を間違えると効果が5倍変わる

## 背景
みとや大森町店で rank_from_aisle のε²=0.002482 vs rank_from_min のε²=0.000488 で5.1倍の差。
台番号の並び方向が島ごとに交互に逆転するホール（みとやなど）では、rank_from_minだけでは通路からの距離を正しく表せない。

## アクション
1. 座標CSVがあれば、各セクション内の台番号×X座標の相関で正順/逆順を判定
2. 座標CSVがなければ、rank_from_min/max両方でKW検定し、ε²が大きい方を採用
3. 交互配置が判明したら hall_config.json の reversed_sections に登録 → rank_from_aisle が自動計算される

## 例
```python
for rank_col in ['rank_from_min', 'rank_from_max', 'rank_from_aisle']:
    stat, p = kruskal(*[seg_df[seg_df[rank_col]==k]['diff_coins_normalized'] for k in seg_df[rank_col].unique()])
    epsilon_sq = stat / (len(seg_df) - 1)
    print(f"{rank_col}: ε²={epsilon_sq:.6f}")
```

