# セグメント決定は全ての分析に先行する — 後回しにすると全結果が汚染される

## 背景
蒲田7で全体集計のA機Top3(d3/d4)とN機Top3(d6/d8)が逆相関(ρ=-0.418)になるSimpson's Paradoxが発生。
セグメント未分割の状態で「末尾Xが強い」と主張しても、フロア/機種タイプ/セクションサイズの交絡で無意味になる。

## アクション
1. フロア分割（複数フロアなら必須）
2. A/N分割（機種名でジャグラー/ハナハナを判定。A機<10%なら分割しない）
3. セクションサイズ確認（small≤8/medium9-14/large15+）
4. LR分割は安易に入れない（蒲田7でF値=0.03、section_sizeの1/1000）
5. 1セグメント50台未満は統計的に危険

## 例
蒲田7: 2F_L_N/2F_R_N/3F_L_A/3F_L_N/3F_R_A/3F_R_N の6セグメント
みとや: section列がそのまま物理的な島単位

