# 2026-07-26 実地観察4件（統計未検証・感覚ベース）

## Core claim
2026-07-26の来店結果から、ユーザーが4つの店側行動パターンを観察した。いずれもn=1〜2日の
実地観察であり、DBでの統計検証は未実施。将来のEDAで裏取りするための仮説として記録する。

## Evidence
- n_observations: 各観察n=1〜2日（統計的判定不能）
- data scope: hall-specific（4ホールにまたがる別々の観察）
- metric scope: other（実地観察、DB未突合の部分あり）
- result summary: 下記4観察

### 観察1: ヒロキ系列の連動投入疑い
- ヒロキ東口のマイジャグラーVが2026-07-25・26と2日連続で「全（全台系）」投入
  （DB確認済み: 26日はDD26 26台 payout109.8%・平均+2,559枚/台。25日は本セッション未確認）
- ユーザー観察によれば、DBを持たないヒロキ西口でも同日にモンキーターンVが「全」だった模様（伝聞、DB照合不可）
- ヒロキ東口のDD26モンキーターンVも当日+3.61pp的中（既存instinct参照）

### 観察2: 蒲田7ヴァルヴレイヴへの予算集中
- 蒲田7が2026-07-26にヴァルヴレイヴ・ヴァルヴレイヴ2を「全」投入したとユーザーが観察
- 同日、本セッションが事前推薦した位置ルール（端番5-6・通路角番5等）はほぼ全滅
  （端番1島端が+1.39pp、通路角番1が+1.54ppとむしろ回避推奨側が勝った）
- ユーザー仮説: ヴァルヴレイヴへの予算集中が他セクションの投入を薄めた（機種バンク予算のゼロサム）

### 観察3: レイトギャップ マギレコの先バレ
- 2026-07-26のマギアレコード（933-936, DD26効果+11.54pp/CI[+3.64,+18.99]）投入について、
  前日から店内で「先バレ」（設定が入るという事前情報）があったとユーザーが把握
- 情報源が公式リークか噂かは不明。継続的な月次パターン（毎月26日に同様の投入）である可能性と、
  今回限りの単発リークである可能性の両方が残る

### 観察4: 楽園の名前マッチング×繰越し投入
- 前日（2026-07-25と推定）、楽園は「総取りゼロ」イベントで、名前が一致する「Re:ゼロ」に設定投入
- ユーザーは同じく「ゼロ」を含む「番長Zero」に座ったが、この日は設定なし
- 翌日（2026-07-26）に番長ZEROへ設定投入があったとユーザーが観察
- → 「前日ハズレた名前マッチング候補に、翌日改めて投入する」繰越し戦略の可能性

## Interpretation
- 観察1は「ホール横断の共通法則はほぼ存在しない」という既存原則（[[feedback-no-cross-hall-pooling]]）
  と緊張関係にあるが、対象は「無関係チェーン間」ではなく「同一資本の姉妹店（東口/西口）」なので
  性質が異なる。西口のDBがなく検証不能な点は明記しておく
- 観察2は蒲田7の既存知見「AT一般の非定常性はラインナップ由来（方針レジームでなく機種構成が駆動）」
  と整合的。位置ルールが機能しない日は「機種バンクへの予算集中」を疑う価値がある
- 観察3が事実なら、DD26効果として測定した+11.54ppは「ホールの日付戦略」だけでなく
  「情報漏洩に基づく行動」を一部含んでいた可能性がある。ただし12日間の履歴で一貫して正の効果
  だったことは、単発リークだけでは説明しにくく、継続的な投入方針の存在を示唆する
- 観察4は既存のイベント日定義（DD軸・強ゾロ目軸）では捉えられない新しい軸
  （機種名とイベント名の意味的マッチング×投入タイミングのズレ）で、これまでの楽園分析
  （`rakuen_theory.md`）にはない視点

## Action
- 将来のEDAで以下を検証:
  1. ヒロキ西口のDBを取得できれば、東口との同日投入相関を測定
  2. 蒲田7で「特定機種バンクへの投入集中日」に位置ルールの効果が消えるか、
     複数日で再現するか検証（機種構成除外後の位置効果を比較）
  3. レイトギャップのDD26投入が本当に月次で安定しているか（既存の12日データは既に
     3期間で頑健と確認済み）。先バレの有無を切り分ける手段は現状ない
  4. 楽園のイベント名×機種名の意味マッチングと、投入タイミングの前日ズレを
     過去の全イベント日で機械的に洗い出す（イベント名と設定投入機種のペアをリスト化する必要）
- 現時点では統計判定材料が不足しているため、いずれも「ウォッチ対象」に留め、
  単独では運用判断の根拠にしない

