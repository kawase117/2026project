# 括弧内のコンテンツ抽出：全体の戦略ラベルではなく括弧内の機種名のみをマッピング

## 背景
ぽこデータに複数の括弧パターン：括弧外の「X にまつわる」は説明的ラベル、マッピング対象は括弧内の機種名のみ。

## アクション
1. 括弧内を個別トークンに分解
2. 各トークンを独立にマッピング：
   - `3台設置` → 動的DB検索（その日の3台機種を取得）
   - `ゴージャグ3` → PATCH_FOUND で `ゴーゴージャグラー3` にマッピング
   - `キンハナ30等多数` → `キングハナハナ-30`（「等多数」は削除）

