# PATCH_DELETE 誤分類：複合戦略情報が削除対象として誤登録される

## 背景
ぽこデータの PATCH_DELETE リストに登録された項目のうち、複数の項目が実は有効な機種情報（複合戦略）を含んでいたことが判明。

例：
- `ハナハナ天膳` → 当日稼働しているハナハナ機種全 + 天膳全
- `ゾンサガ` → ゾンビランドサガ（機種名）
- `カイジ` → 回胴黙示録カイジ 狂宴（機種名）
- `ハッピー` → ハッピージャグラー（機種名）

## アクション
1. `poco_data_extracted_full.csv` を参照データとして使用（v4ではなく）
2. PATCH_DELETE の全項目を個別に検証
3. 削除すべき項目（ノイズ）と保持すべき項目（機種情報）を分類
4. deleted_log 監査ログで DELETE 実行を追跡

## 例
```python
# deleted_log により DELETE 実行の可視化
if deleted_log:
    for k, v in sorted(deleted_log.items(), key=lambda x: -x[1]):
        print(f"[{k}] {v}回 → 削除")
```

