# OCRエラーは元データ（MDファイル）で修正：パイプライン PATCH_FOUND より優先

## 背景
OCRミスは複数存在：
- 20260405: `密告` → `吉宗` のOCRエラー
- 20260514: `ミク` → `ミリゴ`（ミリオンゴッド‐神々の軌跡‐）のOCRエラー

パイプラインの PATCH_FOUND で対応するのではなく、元のMDファイルを直接修正することで、以降のデータ抽出時に正確な情報が保証される。

## アクション
1. `docs/ぽこデータ抽出/*.md` の該当行を検索：`grep -n "密告\|ミク" *.md`
2. 各行の実際の内容を確認
3. MDファイルで直接修正
4. パイプライン再実行（PATCH_FOUND には追加しない）

## 例
```md
# 修正前
| **5日(金)** | ... | **+21,900** / 全→密告、ニブ→ファンキー |

# 修正後
| **5日(金)** | ... | **+21,900** / 全→吉宗、ニブ→ファンキー |
```

