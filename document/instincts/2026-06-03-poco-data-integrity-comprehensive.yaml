# 未照合検出の盲点：DELETE 登録された項目は unmapped カウンターに加算されない

## 背景
PATCH_DELETE に登録されている機種は unmapped にカウントされずに即削除。結果として誤 DELETE 登録を検出不可。

## アクション
1. deleted_log を常時出力（監査ログ）
2. DELETE 実行数が多い場合は個別検証
3. 「出現回数 > 0 なのに未照合リストにない」パターンを疑う
