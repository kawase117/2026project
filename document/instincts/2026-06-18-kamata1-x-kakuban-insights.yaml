# 蒲田1 2F_A の X角番 --- x_kk=8（奥から8列目）が有意に弱い

## 背景
kamata1_x_kakuban_eda（2026-06-18実施）。

有意シグナル（q<0.05）は x_kk=8 のみ（1位置）
  x_kk=8  q=0.014, mean=-27, median=-200, n=9583, support=20列

median が-200 と負かつ mean も負 → アウトライア駆動ではなく構造的シグナル。
support=20列（35 X列中）で広くカバーされており信頼性高い。

2F_A は全体的に mean_abs_mean_residual=18.9 と低く（2F_N=75.5 と比べて）、
X角番の効果が 2F_N より小さい。有意位置も 1 位置のみ。

## セクション角番との独立性
spearman_r = +0.089（弱い正相関）→ 独立情報として使える。
X角番=8 回避の上で島角番フィルタ（kakuban=1 回避など）を重ねることが可能。

## アクション
蒲田1 2F ジャグ系を選ぶとき:
通路から8列目（x_kk=8）の台は避けること（median=-200, q=0.014, support=20列）。
他の X角番位置は現時点で有意差なし（前列も弱い傾向はあるが非有意）。

