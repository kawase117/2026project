# 蒲田1 2F_N の X角番 --- x_kk=2（2列目）と x_kk=1（最前列）の両方が有意に弱い

## 背景
kamata1_x_kakuban_eda（2026-06-18実施）。
X角番（x_kakuban）= 同一X列内での通路側から何番目か。

有意シグナル（q<0.05）
  x_kk=2  q=3.5e-4, mean=-13, median=-476, n=16160, support=34列  最弱（最強シグナル）
  x_kk=1  q=4.1e-3, mean=-5,  median=-445, n=16681, support=35列  最前列も弱い
  x_kk=6  q=0.017,  mean=-16, median=-340, n=11081, support=29列  6列目も弱い
  x_kk=8  q=0.002,  mean=+46, median=-300, n=5922,  support=14列  meanが正だがmedianが大きく負（アウトライア駆動、除外）

median が大きくマイナスなのは x_kk=2 が最悪（-476）、x_kk=1 も深くマイナス（-445）。
両者とも n が大きく（16000件以上）support が全 X列にわたる（34〜35列中）ため、構造的シグナルとして信頼性高い。

## 蒲田7との比較
蒲田7 2F_N は x_kk=1（最前列）が弱いシグナル（q=3.9e-3）。
蒲田1 2F_N は x_kk=1 に加えて x_kk=2（2列目）が更に弱い。
通路側から前2列をまとめて回避する戦略が有効。

## セクション角番との独立性
spearman_r = -0.104（弱い負相関）→ X角番と島角番は独立情報として使える。
X角番でフィルタした上で、島角番フィルタ（コーナー回避）を重ねることが可能。

## アクション
蒲田1 2F AT系を選ぶとき:
通路から1列目（x_kk=1）と2列目（x_kk=2）の台は避ける（median=-445〜-476、n充分）。
6列目（x_kk=6）も弱い傾向あり、他候補がある場合は避けること。
8列目（x_kk=8）は mean が正に見えるが median が-300 でアウトライア駆動なので優先しない。
この回避ルールは全日（通常日・イベント日）に適用してよい。

