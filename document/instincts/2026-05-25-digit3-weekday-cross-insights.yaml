# 土曜は末尾6が307.8で断然1位。2位末尾2（266）と40枚以上の差

## 背景
weekday_digit_cross_report.csv の土曜行（上位・下位抜粋）:

| rank | digit | mean_diff |
|------|-------|-----------|
|  1   |   6   |  307.8    |
|  2   |   2   |  266.1    |
|  3   |   8   |  230.2    |
|  4   |   7   |  224.3    |
|  9   |   3   |  119.8    |
| 10   |   1   |   91.6    |

土曜は末尾1(91.6)と末尾3(119.8)が特に弱く、末尾6が独走している。
instinct [[2fn-cluster-678-dominant-across-weekdays]] の土曜2F_N mean=326.9（delta=84.3）と整合。

## アクション
土曜の台選択優先順位: 末尾6 >> 末尾2 > 末尾8,7,4 > (末尾1,3は避ける)
ML特徴量: `is_saturday AND is_digit_6` を土曜の最強シグナルとして採用。
全機種横断での知見のため、2F_N限定の [[2fn-cluster-678-dominant-across-weekdays]] と
組み合わせると精度がさらに上がる。

## 例
土曜末尾6(307.8) vs 土曜末尾1(91.6): 差分216枚。
末尾選択だけで高設定有無に匹敵する収益差が生じる水準。

