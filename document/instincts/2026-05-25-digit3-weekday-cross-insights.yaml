# 末尾3は通常日最下位・high anomaly日断然1位という二極分布

## 背景
high_anomaly_digit_dist.csv（high anomaly日5日間）vs 全体平均:

| digit | anomaly日 mean_diff | 全体 mean_diff  | 変化率  |
|-------|--------------------|-----------------||---------|
|   3   |        851.8       |  135.8（最下位） | +527%   |
|   5   |        725.6       |  176.8          | +310%   |
|   6   |        681.9       |  233.5（通常1位）| +192%   |
|   1   |        173.8       |  176.0          |   -1%   |

末尾3のみ「通常最下位→anomaly日最高」という逆転が発生。
末尾1は anomaly日でも低い（173.8）。
末尾3の anomaly感受性は末尾6の3倍近い。

## アクション
末尾3は「high anomaly検出フラグ」と組み合わせたとき最も有効なシグナルになる。
通常日の末尾3への投資は避け、「全台高設定日（Layer A）」が見込まれる日のみ末尾3を評価する。

ML設計: `is_digit_3 AND is_predicted_anomaly_day` を強い高設定シグナルとして候補化。
anomaly_detection が walk-forward に未統合であれば、past anomaly rate を
rolling特徴量として間接的に組み込む。

## 例
全末尾変化率: 末尾3: 135.8 → 851.8（+527%）vs 末尾6: 233.5 → 681.9（+192%）
末尾3の anomaly感受性が末尾6の3倍近い。
参照: [[digit3-low-normal-high-on-anomaly]]（既存instinct）

