# 末尾3の弱さはAT系（66%）に完全に起因。A型・BTでは末尾3は正常水準

## 背景
digit3_profile_report.csv（蒲田七全期間）の機種タイプ別内訳:

| machine_type | mean_diff | n_rows | 構成比 |
|-------------|-----------|--------|--------|
| AT系        |  84.9     | 14,913 |  66%   |
| A型         | 242.9     |  5,851 |  26%   |
| BT          | 203.3     |  1,956 |   8%   |
| 合計        | 135.8     | 22,720 | 100%   |

全末尾中で末尾3の全体mean_diff=135.8は最下位（2位末尾1=176.0に40枚差）。
しかしA型(242.9)・BT(203.3)に絞ると末尾3は他末尾と遜色ない水準。

## アクション
末尾3を特徴量として使う際の分岐:
- AT系（3F_N相当）の末尾3: 積極的に避ける
- A型（3F_A/2F_A相当）の末尾3: 他末尾と同等に扱う
- BT（2F_A相当）の末尾3: 同様に他末尾と同等

ML特徴量では `is_digit_3 AND is_at_series` を弱設定シグナルとして設計できる。
`is_digit_3 AND is_atype` は除外対象にしない（243枚はむしろ高水準）。

## 例
floor_atype_overall_digit.csv: 3F_N末尾3のmean_diff=-94.4（全グループ全末尾中最大のマイナス）
AT系かつ3F機種が末尾3のマイナスを作っている主因。
digit3_profile の AT系 mean=84.9 はAT系全フロア平均。3F_N限定ではさらに低い。

