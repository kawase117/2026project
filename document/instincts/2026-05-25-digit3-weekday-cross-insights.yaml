# 火曜のみ末尾3が3位（270.4）、金曜は全曜日×全末尾中ワースト（50.2）

## 背景
weekday_digit_cross_report.csv の末尾3の曜日別順位:

| 曜日 | 末尾3 mean_diff | 順位/10 |
|------|----------------|---------|
| 月   |  168.2         |  8位    |
| 火   |  270.4         |  3位    |
| 水   |  101.6         | 10位    |
| 木   |  118.0         | 10位    |
| 金   |   50.2         | 10位    |
| 土   |  119.8         |  9位    |
| 日   |  121.9         | 10位    |

火曜(270.4)は同曜日1位=末尾6(295.6)と25枚差で、末尾3として唯一の「強い曜日」。
金曜の末尾3(50.2)は全曜日×全末尾(70組)の中でワースト水準。

火曜末尾3が強い理由の確認済み説明（anomaly_detection_report.csv 照合済み）:
- high anomaly日（5日）の曜日内訳: 土3・木1・日1 → 火曜は0件
- 「high anomaly日が火曜に集中」仮説は否定済み
- 正しい説明: 3F_N の火曜クラスタ = 2-3-4（delta=40.4）に末尾3が包含される
  → AT系機種（末尾3の66%を占める）が火曜に末尾2-3-4へ集中するため
    全機種横断の集計でも火曜末尾3が上位に浮上する
  参照: [[3fn-low-base-but-strong-cluster-signal]]

## アクション
末尾3を火曜に限り positive シグナルとして評価してよい（特に3F_N機種で有効）。
金曜の末尾3(50.2)は最強の negative シグナルとして扱う。

ML特徴量候補:
- `is_tuesday AND is_digit_3` → conditional positive（3F_N機種で特に有効）
- `is_friday AND is_digit_3` → strong negative

## 例
火曜末尾3(270.4) vs 金曜末尾3(50.2): 差分220枚。
同一末尾でも曜日で高/低設定が逆転するレベルの差が存在する。
火曜の3F_N クラスタ2-3-4 → 末尾3が「クラスタ内」になる唯一の曜日。
