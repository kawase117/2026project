# 2F_N x イベント日 --- kakuban=5,11 がプレミアム、kakuban=20 が反転

## 背景
kamata7_2F_N_kakuban_event.csv を解読（2026-06-18実施）。
イベント日定義は DD in {1,7,11,17,21,27,30} + 末日（n=85日/342日中）。

有意シグナル（q 未満 0.05）の要約
  kakuban=11: event_mean=+468, non_event=+173, premium=+295, q=0.042, n=3114 records
  kakuban=5:  event_mean=+420, non_event=+229, premium=+191, q=0.047, n=3957 records
  kakuban=20: event_mean=-277, non_event=+483, reversal=-761, q=0.047, n=170（小サンプル注意）

## アクション
イベント日に蒲田7 2F AT系を狙う場合:
kakuban=11（section_min+10）を最優先候補とする（+295 premium, n充分）。
kakuban=5（section_min+4）を次点候補とする（+191 premium, n充分）。
kakuban=20（大型列の奥端）はイベント日に特に回避する（-761 reversal、ただし小サンプル）。

非イベント日の kakuban 戦略は変わらない。[[rl-split-beats-na-split-for-q5-kakuban-strategy]] も引き続き適用。

