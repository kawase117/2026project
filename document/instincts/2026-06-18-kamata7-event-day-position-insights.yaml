# 3F_A x イベント日 --- 全セクション底上げ（+165 global uplift）、section 3265-3280 が最強

## 背景
kamata7_3F_A_kakuban_event.csv + 全セクション Mann-Whitney 検定（2026-06-18実施）。

全体効果
  非イベント加重平均=+174 → イベント=+339 → 差=+165（約2倍の bottom up）
  kakuban 単位でも 11 位置（kakuban=1,2,3,7,8,10,12,13,14,15,16）が全て有意（q<0.05）

セクション別 event premium（p<0.01 のもの）
  section 3265-3280  event=+425, non_event=+144, premium=+281, p=4.3e-8 （最強）
  section 3310-3324  premium=+189, p=3.2e-4
  section 3325-3340  premium=+152, p=1.7e-3
  section 3131-3143  premium=+167, p=1.9e-3
  section 3117-3130  premium=+182, p=2.9e-3
  section 3144-3155  premium=+193, p=6.8e-3

section 3265-3280 詳細
  16台横一列（X=23〜38, Y=9）、全台マイジャグラーV（2026-06-16時点）
  3F右エリア（X は 23 以上）
  n=78日×16台=1248レコード（games=200以上フィルタ）

## アクション
イベント日に蒲田7 3F ジャグ系を訪問する場合:
section 3265-3280（台番号 3265〜3280）を最優先確認する（p=4.3e-8, premium=+281）。
次点は section 3310-3324、section 3144-3155（event_mean=+432）。
コーナー（kakuban=1）もイベント日は+285に上昇するが全体平均+339より低い → 中間台優先は維持。

非イベント日との切り替え方針
  非イベント日: DD×角番 EDA に従い kakuban 中間帯を狙う
  イベント日: section 3265-3280 最優先 → その後 3F_A を広く狙う

