# 蒲田7 X角番 × DD クロスは全4セグメントで帰無

## 背景
全4セグメント（2F_A, 2F_N, 3F_A, 3F_N）で Kruskal-Wallis + BH補正を実施した結果
（2026-06-18実施）。

最小 q 値まとめ
  2F_N min_q=0.071（DD1-6 × x_kk=12 が +220、最も有望だが閾値未達）
  3F_N min_q=0.135
  2F_A min_q=0.089
  3F_A min_q=0.236

全セグメント全 DD ビンで q ≥ 0.071（閾値 0.05 未達）。
X角番の全期間有意シグナル（2F_N x_kk=1 q=3.9e-3 など）はDD条件付けで検出力を失う。
DDビン分割による多重検定補正が吸収してしまうため。

## アクション
X角番はDD軸との組み合わせ戦略には使えない。
X角番（2F_N x_kk=1 回避等）は全期間の傾向として使い、DD選択とは独立に適用する。
[[x-kakuban-front-machine-negative-2fn]] はDD非依存なので維持。

