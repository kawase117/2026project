# みとやの新台導入日は、同日の他機種に対する上乗せが定型日にしか出ない

## Core claim
みとやの新台は初日の差枚がプラスだが、同日の他の非ジャグラー機種と比べると上乗せは平均で出ない。上乗せが出るのは、導入日が定型日DD{1,4,7,14,17,24,27,30}と重なったときだけ。

## 6月の知見との関係
[[hall-firstday-kaiwari-ranking-arrow-mitoya-top]](2026-06-10)は「新台初日の機械割はみとや・ARROWが全ホールで最上位」。これはホール間比較で、今回の結果と矛盾しない。みとやは新台初日の水準が高いが、同日の他機種も高いので、新台であることの上乗せは平均で小さい。supersedesはしない。比較の基準が違う。

## Evidence
db/みとや大森町店.db、2025-01〜2026-10-18、導入3台以上の非ジャグラー84件(基準: 同日の他の非ジャグラー機種):
- 初日の差枚は同日の他機種より+56(95%CI −295〜+428、中央値−100)。
- 導入日が定型日: +484(24件)。それ以外: −115(60件)。
- ジャグラーの新台は期間内に1件(ネオアイムEX、2025-09-01=DD1)のみ。

10/19(非定型日)のマイジャグラーⅥ導入: Ⅵ18台+509・RB1/325、同日のマイV16台+339・RB1/321。差枚は上だがRBは同じ(1日・1店)。

## 判断が変わる点
- 非定型日の新台は、導入だけを理由に推さない。定型日と重なる日は推す側に寄せる。
- ジャグラーの新台はRBで当日判定する(標本は1件)。
- ユーザー申告「店が期待する新台は設定を強く入れる」は未検証のwatching。期待の代理指標(台数・島の位置・予告での名指し)で層別して検証する。
