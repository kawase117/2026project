# 機種平均が当たりでも、中央値と外れ値除外を並べてから判定する

## Core claim
機種の平均差枚は、大勝ち1〜2台で決まることがある。平均だけで「機種に投入された」と判定すると、台単位では負けている機種を当たりにしてしまう。
答え合わせでは、機種ごとに平均・中央値・上位2台を除いた平均を並べる。

## Evidence
2026-10-19 蒲田7 戦国乙女5(24台): 平均+671、中央値−950、2069(+18,400)と2068(+6,600)を除くと平均−405。プラス台は9台だけ。
同日のホール全体は平均+19、中央値−200。

## 判断が変わる点
- 中央値がホール中央値より下なら、「機種への投入」ではなく「少数台への投入」と書く。
- 予告の「メイン機種に列仕掛け」の的中は、上位の台番号が並びになっているかで見る。平均では見ない。

