# C6(末尾0/5/9/6に+100)はC5(DD別末尾avg_diff)と完全重複

## 背景
C6の定義は「末尾0/5/9/6に固定+100ボーナス」。これは本来のis_zorome（台番号末尾2桁一致）
ではなく、単なる特定末尾へのボーナス。C5がDD別末尾avg_diffを既に計算しているため、
C6はC5に含まれる情報の劣化版（固定値 vs データ駆動値）に過ぎない。
6/21評価でC6のr=-0.006（唯一の逆相関）はこの冗長性の帰結。

## アクション
- C6を廃止してC5のウェイトに統合する（5%+5%→10%）
- ゾロ目効果を入れるなら、本来のis_zorome（台番号末尾2桁一致）に基づく設計にする
- 固定ボーナスはデータ駆動の特徴量に常に劣後する

## 例
```
現行C6: 末尾∈{0,5,9,6} → +100（固定、根拠不明）
C5: DD21末尾8=+361, 末尾5=+84（データ駆動、DD別）
→ C5がC6の情報を包含しており、C6は冗長
```

