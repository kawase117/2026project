# TOP50プール選択は有効だが、個別台の順位予測は不可能

## 背景
6/21評価結果:
- TOP50 avg_diff=+408 vs 全体-136（+544の優位性）
- TOP50機械割107.1% vs 全体98.9%（+8.2pp）
- Spearman rho=0.124（p<0.001、有意）
- しかしhit@10=0/10、hit@50=7/50（14%）
- 実績TOP10は全てが予測300-690位

実績TOP10は+8000〜+14400のAT機1日爆発であり、構造スコアでは捕捉不可能。
このモデルの正しい使い方は「TOP50から選べば期待値プラス」であり「1位を当てる」ではない。

## アクション
- 評価指標としてhit@Kだけでなく、TOP50プールのavg_diff/WR/機械割を使う
- 「当たり/外れ」の判定は差枚順位一致ではなく、プラス期待値の達成で行う
- AT機の1日バリアンスは原理的に予測不可能であることを前提にする

## 例
```
6/21実績:
  TOP50: avg=+408, WR=42%, 機械割=107.1% → プール選択としてOK
  hit@10: 0/10 → 順位予測としてNG
  実績1位(+14,400)の予測順位: 343位 → AT爆発は構造で捕まらない
```

