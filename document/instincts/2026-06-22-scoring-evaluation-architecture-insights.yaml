# hist_avgは全コンポーネント中最強の相関だが10%しか配分されていない

## 背景
6/21評価: hist_avg r=0.137（最強）vs composite r=0.093 vs C1 r=0.067
166日WFでもhist_hit104が3F_R_Nで1.14、2F_L_Nで1.09と上位コンポーネント。
一方、現行モデルではhist_avgは10%のtiebreaker扱い。

ただしhist_avgは「過去の良台は未来も良い」という仮定であり、
設定変更が入ると無効化される。また鉄台（常に高設定）の影響を受けやすい。
ウェイト引き上げは3層アーキテクチャの第2層（ranking）の文脈で検討すべき。

## アクション
- 3層アーキテクチャでは第2層のrelative ranking特徴量としてhist関連を重用する
- 現行モデルのウェイト微調整（10%→20%等）は3層移行前の暫定措置としてはあり
- hist_hit_an（A=104%/N=106%閾値）との使い分けを明確にする

## 例
```
コンポーネント相関（6/21、全台）:
  hist_avg: r=0.137 ← 最強
  composite: r=0.093
  C1: r=0.067
  C4: r=0.061
  C5: r=0.046
  C2: r=0.043
  C3: r=0.027
  C6: r=-0.006 ← 逆相関
```

