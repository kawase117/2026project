# 2F_R_Nは全コンポーネントに無反応（lift≈1.0）

## 背景
166日Walk-forward検証で2F_R_Nは全5コンポーネントのliftが0.98-1.01の範囲:
- c1=1.00, c2=1.01, c4=0.98, c5=1.00, hist_hit104=1.00
6/21実戦でも2F_R_N台はTOP50に9台入ったがavg=+222と低水準。

考えられる原因:
- 2Fフロア右側は機種配置が均一で差別化特徴量が乏しい
- セグメント内の設定投入パターンがランダムに近い
- サンプル数不足で弱いシグナルが埋もれている

## アクション
- 2F_R_Nに対してコンポーネントウェイトを調整しても効果がない
- 3層アーキテクチャでは第1層gateで2F_R_Nの活性/非活性を判定し、非活性日は推薦しない
- 活性日でもrankingは均等ウェイト（≒ランダム）で運用する
- 新しい特徴量（機種別、設置期間等）がないかCatBoost shadow modeで探索する

## 例
```
2F_R_N Component Lift (166日WF):
  c1: 1.00  c2: 1.01  c4: 0.98  c5: 1.00  hist_hit104: 1.00
  → 全てノイズレベル。ウェイト調整は無効。
  → gate判定 + 均等ランダム + ML探索 の3段階で対応
```
