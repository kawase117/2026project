# 6コンポーネント固定ウェイト→3層アーキテクチャへの移行が確定

## 背景
166日WF検証（segment-component-effectiveness-map）と6/21実戦評価の両方が、
6コンポーネント固定ウェイトモデルの限界を示した:
- 全セグメント共通ウェイトは次善策（WF検証）
- 2F_R_Nは全コンポーネント≈1.0で何をやっても効かない（WF検証）
- C5の全体liftはセグメント選択効果の混入（WF検証）
- hit@Kが壊滅的だがTOP50プールEVはプラス（6/21実戦）

3者（ユーザー・Claude・Codex）で合意済みの3層アーキテクチャ:
第1層gate（absolute活性判定）→ 第2層ranking（relative台順位）→ 第3層delivery（運用出力）

gate_v6aが有効確認済み、gate_v6b_ruleの追加改善は小幅（前回セッション）。
次は第2層rankingの改善フェーズ。

## アクション
- 現行6コンポーネントモデルは暫定運用として継続可能（TOP50プールEVはプラス）
- 新規開発は3層アーキテクチャに集中する
- 第1層: gate_v6a + hist_hit_an をベースに
- 第2層: セグメント別ウェイトまたはCatBoost shadow mode
- 第3層: AT優先Top10 + Backup + Context A

## 例
```
移行ロードマップ:
  現在: 6コンポーネント固定ウェイト（暫定運用）
  Phase A: gate_v6a第1層を本番化（完了）
  Phase B: 第2層ranking改善（着手中）
  Phase C: 第3層delivery実装
  Phase D: MLをshadow modeで並走開始
```

