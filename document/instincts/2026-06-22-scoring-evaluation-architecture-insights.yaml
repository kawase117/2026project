# N=1日の結果でウェイトを変更するのは統計的に無意味

## 背景
6/21予測評価でC3(DD)のr=0.027が最低、hist_avgのr=0.137が最高だった。
しかしこれはDD21（イベント日・日曜日）という特定条件下の1日の結果であり、
DDのサンプル数不足（歴史的に11日）やAT機の1日バリアンスに大きく左右される。
1日のコンポーネント相関でウェイトを動かすと、過学習と同じ構造の誤りを犯す。

## アクション
- ウェイト変更はwalk-forward backtestの複数日結果に基づいて行う
- 1日の結果はインサイトとして記録するが、パラメータ変更の根拠にしない
- 構造的な設計欠陥（冗長コンポーネント、サンプル不足）の発見には使える

## 例
```
NG: 6/21でC3のr=0.027だったからウェイトを20%→10%に下げる
OK: 166日WFでC3のliftが全セグメントで≈1.0だったからウェイトを再検討する
```

