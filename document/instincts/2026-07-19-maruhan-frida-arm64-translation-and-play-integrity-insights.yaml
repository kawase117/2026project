# ARM変換(ndk_translation)はAPI 34以降のgoogle_apis x86_64イメージでのみ有効

## 背景
API 33 (r17) google_apis x86_64は abilist=x86_64のみ、native.bridge=0で、arm64専用アプリは
INSTALL_FAILED_NO_MATCHING_ABIS で弾かれる。API 34 (r14) は abilist=x86_64,arm64-v8a、
native.bridge=libndk_translation.so が有効で、同じarm64専用アプリがそのまま起動できた。
2026-06-17時点のInstinct(android-user-cert-app-trust等)で頓挫していた壁はこれで解消。

## アクション
- arm64専用の商用APKをエミュで動かすときは API 34以降の google_apis(Play無し, root可) x86_64
  イメージを選ぶ。API 33以下は変換非搭載と判断し時間を使わない。
- 確認コマンド: `adb shell getprop ro.product.cpu.abilist` に arm64-v8a が出るか、
  `adb shell getprop ro.dalvik.vm.native.bridge` が libndk_translation.so か。

## 例
```
API33 r17: abilist=x86_64            → arm64 split install失敗
API34 r14: abilist=x86_64,arm64-v8a  → 同一APKが起動成功
```

