# Frida(server/gadget)はARM変換レイヤーと根本的に非互換

## 背景
x86_64エミュ上でarm64アプリを動かすため libndk_translation で変換実行させると、
Fridaは3つとも失敗する:
1. x86_64 frida-server は変換実行中のarm64プロセスにアタッチ不可("need Gadget"エラー)。
2. arm64 frida-server はエミュのシェルからstandalone実行不可(変換はアプリ内libのみ対象、
   単体実行ファイルは "No such file or directory" で拒否される)。
3. objectionでarm64 frida-gadgetをAPKに埋め込み再署名して起動しても、
   `libndk_translation.so (RunKernelSyscall)` 内でSIGABRT。バックトレース:
   `libc.so(syscall) <- libndk_translation.so(RunKernelSyscall) <- gadget`
これはアプリの保護機構ではなく、FridaのランタイムコードとARM→x86トランスレータの
非互換が原因(fatal signal 6)。

## アクション
- ARM変換エミュ上でFridaを使う計画は立てない。エミュでピンニング回避するなら
  Frida不使用の静的パッチ(apktoolでnetwork_security_config編集→再署名→user CA登録)しかない。
- Fridaが必須なら root化arm64実機(ネイティブフル速度、変換レイヤー無し)に切り替える。

## 例
```
frida-server(x86_64) -> "need Gadget to attach on jailed Android"
frida-server(arm64) standalone実行 -> "su: failed to exec ... No such file or directory"
gadget埋め込み起動 -> Fatal signal 6 (SIGABRT) in libndk_translation::RunKernelSyscall
```

