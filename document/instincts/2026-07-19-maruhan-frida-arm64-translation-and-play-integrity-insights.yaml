# Google Play Integrity(StandardIntegrity)アテステーションはcatch-22構造で再署名アプリを恒久的に締め出す

## 背景
マルハンアプリの逆解析(jadx)で判明した認証チェーン: 台データ系エンドポイントは
`Auth-Key`ヘッダを必須とし、その値は `auth_segment_v12`(サーバーが発行するauth_key)から
生成される。`auth_segment_v12`は `checkAppIntegrity` APIが返すが、これはアプリが
Google Play StandardIntegrityトークンを取得しサーバーがGoogleと照合して合格した場合のみ
発行される。
root化/エミュ/再署名/Frida計装のいずれもIntegrity verdictを不合格にするため
auth_segment_v12が取得できず、Auth-Key生成が恒久的に失敗する(実測: 10種類の
トークン配置を全て試したが全滅、かつ再署名した本物のアプリ自身も同じ401)。
一方、Integrityが通る正規端末では逆に傍受(root化/ピンニング回避)ができない。
これは「静的キー(android_auth_key)は通るが、Auth-Key必須のエンドポイントだけ通らない」
という形で観測される。

## アクション
- 特定エンドポイントのみ401/認証エラーで、他の公開系エンドポイントは通る場合、
  Play Integrity(またはSafetyNet)ゲートの存在を疑う。dexで
  `play/core/integrity`または`StandardIntegrityManager`を grep すれば確認できる。
- このゲートが確認できたら、再署名・root環境での突破は時間を投資しても不可能と判断し、
  深追いしない。回避策(トークン配置変更、追加ヘッダ推測)を試す前にこの構造を確認すること。
- 代替: 別データ源(Web版、提携サイト等)を探す、または対象を自動化対象から除外する。

## 例
```java
// 認証チェーンの核心(jadxデコンパイル結果)
Auth-Key = ApiSec.generateAuth(署名, auth_segment_v12)  // auth_segment_v12がnullなら結果もnull
auth_segment_v12 <- checkAppIntegrity(StandardIntegrityToken).data.auth_key  // root/エミュ/再署名で不合格
```
