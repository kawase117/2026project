# objection patchapkはPOSIX形式PATHが必須、かつgadgetをlib/arm64(誤)に置くバグがある

## 背景
- objectionがaapt/apktool/zipalign/apksignerをPATHから探す際、`C:/...`形式(コロン含む)
  だとWindowsパスがコロンで分断され見つからない。`/c/...`のPOSIX形式でPATHを通す必要がある。
- objectionはaapt単体(aapt.exe)も要求する(aapt2だけでは "Unable to find aapt" になる)。
  build-tools配下のaapt.exeをコピーして専用binディレクトリに集約すると解決した。
- apktool/apksignerはjarなのでbatラッパー(`java -jar ...`)が必要。printf でバックスラッシュ
  混じりのパスを組むと壊れる(`jbr\bin`→`jbrin`のような欠落)。Writeツールで直接書くこと。
- objection patchapk --architecture arm64 は成功するが、埋め込んだ
  `libfrida-gadget.so` を `lib/arm64/`(誤) に置く。正しいABIディレクトリは `lib/arm64-v8a/`。
  修正しないと起動時に `UnsatisfiedLinkError: dlopen failed: library "libfrida-gadget.so" not found`。

## アクション
1. PATHはPOSIX形式(`/c/...`)で通す。
2. aapt.exe/aapt2.exe/zipalign.exeを1つのbinディレクトリにコピーし、apktool.bat/apksigner.bat
   ラッパー(java -jar呼び出し)をWriteで作成してそこに置く。
3. objection patchapk実行後、zip内の `lib/arm64/libfrida-gadget.so` を `lib/arm64-v8a/` に
   Pythonのzipfileでリネームしてから zipalign→apksigner再署名。
4. App Bundle(分割APK)は先にAPKEditorで universal APK に統合してからpatchapkに渡す。

## 例
```python
# gadgetパス修正の要点
WRONG = "lib/arm64/libfrida-gadget.so"
RIGHT = "lib/arm64-v8a/libfrida-gadget.so"
```

