# apktoolでnetwork_config.xmlのpin-setを削除しbase-configで全ドメイン信頼にすればFrida不要で傍受できる

## 背景
NSCのpin-set(SHA-256公開鍵ピン)はOkHttp CertificatePinnerと独立してTLSチェーン検証時に働く。
Fridaが使えない環境(ARM変換エミュ等)でも、apktoolでAPKをデコードし
`res/xml/network_config.xml` を「domain-config + pin-set」から
「base-config + trust-anchors(system,user)」に書き換え→再ビルド→zipalign→
デバッグ鍵で再署名→mitmproxyのCA証明書をユーザー証明書ストア
(`/data/misc/user/0/cacerts-added/<subject_hash_old>.0`、system:system所有・644・restorecon要)
にインストールすれば、TLS復号に成功する。

## アクション
- ピンニングアプリの静的解析・トラフィック解析だけが目的なら、Frida/実機を用意する前に
  この静的パッチ+mitmproxy CA登録を試す。再署名で足りることが多い。
- 証明書ハッシュ計算: `openssl x509 -inform PEM -subject_hash_old -in ca.pem -noout`
- APIのバージョンチェック(サーバー側でrequired_version等を強制)に引っかかる場合は
  mitmproxyアドオン(response()フックでJSON書き換え)で回避できる。

## 例
```xml
<!-- 書き換え後のnetwork_config.xml -->
<network-security-config>
  <base-config cleartextTrafficPermitted="true">
    <trust-anchors>
      <certificates src="system" />
      <certificates src="user" />
    </trust-anchors>
  </base-config>
</network-security-config>
```

