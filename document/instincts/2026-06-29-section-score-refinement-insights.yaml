# A系の閾値を104%以下に下げてもセクションスコアは改善しない

## 背景
A系閾値を100-104%でグリッドサーチしたが下げるほどrhoが低下。
A=104でrho_all=+0.195、A=102で+0.003。rho_A_onlyは閾値にほぼ依存しない。
A系閾値を下げるとA系hit_flag率が上がり、N系との差が縮まって識別力が落ちる。

## アクション
- A系閾値は104%のまま変更しない
- N系閾値は106→104に変更する（rho +0.174→+0.195）

## 例
  A=104,N=104: rho=+0.195, rho_A=+0.157
  A=102,N=104: rho=+0.003, rho_A=+0.131

