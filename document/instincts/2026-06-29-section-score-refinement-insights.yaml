# みとやの座標ファイルのsection列は既に横列分離済みでsection×y分割は不要

## 背景
mitoya_theoryの instinct (mitoya-section-y-split-correct-granularity) では
「section×yの複合キーを分析単位として使用する」と指示している。
しかしこれは machine_layout テーブルの旧定義への注意であり、
Heatmap/mitoya_omorimachi_floor_coordinates.csv の section 列は既に横列が分離されている。

実データ確認:
- 横列セクション（501-691）: 各sectionは単一のy値を持ち、16-22台
- 縦列セクション（692-755）: 各sectionが複数y値にまたがるが、各y値に1台のみ
- 805-815: 単一y値、11台

section×yで分割すると縦列セクションが1台ずつ76グループに分裂し、分析不能になる。
座標ファイルの18セクション定義をそのまま使うのが正しい。

## アクション
- mitoya_omorimachi_floor_coordinates.csvのsection列をそのまま使う
- section×y分割は適用しない
- machine_layoutテーブルを直接使う場合のみsection×y分割が必要

## 例
座標ファイルのsection:
  501-522_y36: 22台（横列、単一y）→ そのままでOK
  692-700: 9台（縦列、y=3〜y=13）→ section_yにすると1台ずつ9グループに分裂
  section×y分割: 18セクション → 76グループ（大半が1台）
