# AT機（N系）はA系より構造的に104%超え頻度が高い

## 背景
蒲田7のセクションスコア上位15セクションは全てN-only（AT機のみ）。
Section score vs A-type ratio: rho=-0.636（強い負の相関）。
A-onlyセクション avg score=29.7%、N-onlyセクション avg score=35.4%。

原因: AT機は大当たり1回で差枚が数千枚振れるため、1日の出力率が104%を超える頻度が高い。
A系は設定6でも機械割107-109%で低めに運用されるため、104%超え頻度がN系より低い。
これは設定の良し悪しではなく、機種のノイズ特性の違い。

ただしN-only内でもA-only内でもSpearmanが有意（N: +0.120, A: +0.160）なので、
機種構成を超えたセクション間の差（ホールの設定投入戦略差）は存在する。

## アクション
- セクションスコアでA系とN系を直接比較してはならない（スケールが違う）
- A系セクションがスコア下位に集まるのは構造的な理由であり、「A系セクションが弱い」とは限らない
- A系の評価には別閾値（102%等）を検討する価値があるが、セクションスコアレベルでは104%が最適だった

## 例
蒲田7セクションスコア（最終日）:
  Top5: 3209-3217(42.1%, N), 2230-2246(41.8%, N), 2155-2164(40.9%, N), ...
  A-only avg: 29.7%
  N-only avg: 35.4%
  差: -5.7pp（設定差ではなくノイズ特性差）

