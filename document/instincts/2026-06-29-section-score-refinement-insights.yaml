# 窓幅60dが1台あたり差枚で最強だが、rhoは全窓幅でほぼ同じ

## 背景
窓幅60-300日でsection_avg_histのパフォーマンスを系統的に比較した（60日walk-forward, Top5x5）。
rhoは全窓幅で+0.185〜+0.201の範囲に収まり、窓幅への依存はほぼない。
一方diff/台は短窓ほど高い: 60d=+570, 90d=+440, 120d以降=+288〜+345。
hit率も60d=42.7%, 90d=40.6%で、120d以降は37-40%に落ちる。

rhoが変わらずdiff/台が下がる理由:
セクション順位は長期固定効果で安定しているが、短い窓の方が
「現在の設定投入パターン」に近い推定値を出せるため、Stage 2の台選び精度が上がる。

120dの谷（rho=+0.185, diff=+296）は年末年始データの影響ではなく（除外しても変わらず）、
ノイズと判断。機種入替もこの期間で7台（1%）のみで影響なし。

## アクション
- diff/台を最大化するなら60d窓が最適
- 安定性を重視するなら90d窓（現行）を維持
- 60dの優位性がeval期間を変えても再現するか追加検証してから変更する
- 120d以上に伸ばしても改善しない

## 例
窓幅別パフォーマンス（Top5x5, 60日walk-forward）:
  60d:  rho=+0.193, hit=42.7%, diff/台=+570, win=78.3%
  90d:  rho=+0.195, hit=40.6%, diff/台=+440, win=78.3%
  120d: rho=+0.185, hit=37.2%, diff/台=+296, win=70.0%
  270d: rho=+0.197, hit=40.6%, diff/台=+329, win=70.0%
  300d: rho=+0.201, hit=40.0%, diff/台=+288, win=66.7%

