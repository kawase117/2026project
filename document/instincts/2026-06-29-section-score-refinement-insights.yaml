# イベント/非イベント分割スコアリングは有効ではない

## 背景
イベント日限定のsection_avg_hist（event_only）とadaptive（イベント日→event_blend, 非イベント日→nonevent_blend）を
90日/180日/270日窓で検証した。

全窓幅でevent_onlyのrhoはbase_only（全日平均）を下回る:
  90d: event_only rho=+0.119 vs base_only +0.174
  180d: event_only rho=+0.118 vs base_only +0.163
  270d: event_only rho=+0.154 vs base_only +0.172

270日窓で改善が見られたが（+0.119→+0.154）、base_onlyを超えるには至らない。
窓拡張でイベント日のサンプルが増えても、base_only（全日平均）の方が安定。

adaptiveモード（イベント日と非イベント日で自動切替）も改善せず、全窓幅でbase_only以下。

原因: セクションスコアは固定効果の検出であり、イベント日と非イベント日で
ホールがセクション単位の設定投入パターンを変えている証拠がない。

## アクション
- イベント/非イベント分割は入れない
- 窓幅拡張よりも窓幅短縮（60-90d）の方が有効
- DD補正（alpha）、曜日補正（beta）、イベント分割の全てが無効→セクションスコアはDD/曜日/イベントに依存しない

## 例
270日窓（最もevent_onlyに有利な条件）:
  base_only:   rho=+0.172, lift=1.247, diff/台=+412
  event_only:  rho=+0.154, lift=1.217, diff/台=+442
  adaptive:    rho=+0.165, lift=1.214, diff/台=+385
  → event_onlyは差枚でやや勝つがrhoで劣る。adaptiveは両方で劣る

