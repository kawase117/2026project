# セクションスコア改善: N系閾値104統一+曜日補正β=0.1で+23.6%改善

## 背景
predict_section.pyのセクションスコアを2軸で改善検証した（60日walk-forward）。

実験A: A系閾値を下げても改善しない。N系の閾値を106→104に変えるとrho +0.174→+0.195。
実験B: DD補正は無効。曜日補正β=0.1でlift 1.126→1.161。
Part 3結合: rho=+0.197, lift=1.168x, 累積+521,300枚（現行+421,800枚、+23.6%改善）。
イベント日でのliftが特に大きい（1.071→1.212）。

## アクション
- predict_section.pyにN系閾値104と曜日補正β=0.1を組み込む
- A系閾値変更は不要、DD補正は入れない

## 例
  baseline: A=104,N=106,α=0,β=0 → rho=+0.174, lift=1.126x, cum=+421,800
  combined: A=104,N=104,α=0,β=0.1 → rho=+0.197, lift=1.168x, cum=+521,300

