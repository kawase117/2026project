# セクションスコアは「予測」ではなく「固定効果の検出」

## 背景
蒲田7: Top5セクションは60日中ほぼ固定（最頻85%、日次overlap 3.4/5）。
DD/イベントで選ばれるセクションに差がない。上位はN-only独占（rho=-0.636 vs A比率）。
みとや: Top3が100%/95%/95%で完全固定。

セクションスコアは「今日どのセクションが熱いか」ではなく「長期的に成績の良いセクション」を検出しているだけ。
ただしN-only内・A-only内でもSpearmanが有意なので、機種構成だけでは説明できないホールの設定投入戦略差が存在する。

## アクション
- 改善余地はセクション選択よりセクション内の台選び（Stage 2）の方が大きい
- DD/曜日で動的にセクション選択を変える方向は有望ではない

