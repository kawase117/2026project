# DD補正は無効、曜日補正はβ=0.1でわずかに有効

## 背景
DD補正: alpha>0で常に劣化。各DDは90日中3回程度でサンプル不足。
曜日補正: beta=0.1でlift +3.5pp、差枚+64,900枚。イベント日/非イベント日で安定。
各曜日は90日中12-13回あり曜日パターンを捉えられる。

## アクション
- DD補正は入れない（alpha=0固定）
- 曜日補正はβ=0.1を採用

## 例
  (α=0,β=0): lift=1.126, cum=+421,800
  (α=0,β=0.1): lift=1.161, cum=+486,700
  (α=0.1,β=0): lift=1.098 ← DD補正で劣化

