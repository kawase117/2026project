title: 端番(rank_from_min)プールEDAはセグメントが小さいと単一台の効果を「位置効果」と誤認する
confidence: 0.9
domain: statistical-methodology
source: session-observation
project_id: 2026project
project_name: pachinko-analyzer
trigger: "端番(rank_from_min/max)ベースのプールEDAで特定の端番位置が強い/弱いという結果が出たとき"

# 端番クロス集計は複数島をまたいで同一rankを合算するが、島数が少ないと実質1台の履歴になる

## 背景
蒲田1 2F_N_R_Large（セグメント全体でn=18台のみ）のDD=11×端番クロス集計で
端番20が mean=+2565, median=+3099と突出したため「端番20という位置に構造的シグナルがある」と
一次評価したが、実際に座標データ(`Heatmap/2F_floor_coordinates_kamata1.csv`)で
このセグメント内でrank_from_min=20に到達する島が何個あるか確認したところ、
2001-2020島（1島のみ）しか存在せず、該当台は2020番1台だけだった。
つまりこの「端番20の効果」はプールされた複数島の平均ではなく、2020番という
単一物理スロットの履歴そのものであり、「端番20という位置が一般に強い」という
一般化はできない（他の20台編成の島=2236-2255・2282-2301のrank20台=2255,2301は
それぞれ-200,-350とむしろマイナスだった）。

## アクション
- 端番クロス集計で特定rankが突出した場合、必ず座標データで「そのrank値に到達する島(section)が
  何個あるか」を確認する。1島しかなければ「端番の一般効果」ではなく「特定台固有の効果」として扱う。
- 複数の同サイズ島が存在する場合のみ、rank位置の一般化された効果として信頼してよい。
- 単一台固有の効果と判明した場合でも、その台が過去に何度も機種変更されているのに
  同じ日付パターンが再現するなら「物理スロットへの設定投入バイアス」として一定の価値はあるが、
  ホール全体の法則としては提示しない（[[dd-robust-history-does-not-guarantee-single-day-outcome]]参照）。

## 例
蒲田1 2001-2020島の2020番: 全DD median=-800（普段は弱い台）だがDD=11のみ median=+3150(n=18)、
かつ18ヶ月間に機種が8回変わっても再現していた。同じセグメント内の隣接台2019番は
DD=11 mean=+756だがmedian=-700で、mean/median逆符号（外れ値駆動）の典型パターンだった。

