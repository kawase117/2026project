id: dd-robust-history-does-not-guarantee-single-day-outcome
title: 18ヶ月機種変遷を跨いだ頑健なDD効果でも単日実績では平気で外れる
confidence: 0.92
domain: statistical-methodology
source: session-observation
project_id: 2026project
project_name: pachinko-analyzer
trigger: "過去データで頑健と評価したシグナル(n>=15程度、機種変遷を跨いで再現)を根拠に単日の最有力推薦を1点に絞ろうとするとき"

# 頑健な履歴シグナルでも単日予測では平気で外れる。最有力候補への一極集中は避けるべき

## 背景
蒲田1 2020番（DD=11 median=+3150, n=18, 18ヶ月間に機種8回変更を跨いで再現）を
「島固有の構造的シグナルで信頼できる」と評価し、DD=11(2026-07-11)の最有力推薦とした。
DB更新後に実績を確認したところ、2020番の実際の結果は-2100と大きく外れた。
同様に、他のセグメントで「最有力」と評価したA系2244(kakuban9土曜ボーナス)も-1600と外れた一方、
「次点」に格下げしていたN系section2099-2109の2101番が+10500という最大の当たりになった。
弱いシグナルとして控えめに評価した端番19 A系ペア(2254,2300)はどちらも+100と小さいが
予測通りプラスで着地し、不採用と判定した3台(2019,2255,2301)は全て実際にマイナスだった。
「自信を持って強気に推した1位候補」が外れ、「弱いが実在する」「次点」評価の候補が当たるという
結果は、履歴の頑健性(n数・機種変遷を跨いだ再現性)が単日的中率を保証しないことを示している。

## アクション
- 過去データでどれだけ頑健な効果（n>=15、複数機種変遷を跨いで再現等）が見つかっても、
  単日の推薦を1台の最有力候補に集中させない。複数の確信度層（最有力/次点/弱いが実在）に
  分散して提示し、実際の当落は月次移動平均で評価する
  （既存ルール「単日の当たり外れでモデルを評価しない」の裏返しとして
  「単日で最有力候補が外れてもモデル自体を過度に疑わない」も同時に成り立つ）。
- 答え合わせの際は「最有力が当たったか」だけでなく「推薦セット全体の平均」「不採用判定が
  正しく機能したか」も合わせて確認する。今回は不採用判定(2019,2255,2301)が3/3正しく機能しており、
  除外ロジックの精度は選択ロジックより高かった。

## 例
2026-07-11実績: 推薦14台の平均差枚は+121（ほぼゼロ、2101の+10500 1台に支えられている）。
最有力2244(-1600)・2020(-2100)は外れ、次点2101(+10500)が的中、弱シグナル2254/2300(各+100)は
予測通り、不採用3台(2019:-300, 2255:-1300, 2301:-200)は全て正しくマイナスだった。

