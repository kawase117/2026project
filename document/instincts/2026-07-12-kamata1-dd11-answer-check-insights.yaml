# 既存スクリプトの出力を鵜呑みにすると確定インスティンクトと矛盾する

## 背景
`eda/kamata1_composite_recommend.py`の`_compute_eda()`は`SEGMENTS`定義の4種
（2F_A, 2F_A_Mid, 2F_N_L_nonMid, 2F_N_R_Large）すべてに同一ロジックでDD×角番(rank_from_min)の
mean_residualクロス集計を適用し、単純にmean_residual降順でTOP50を出す。
しかし`kamata1-identity-a-specialized-hall`（既存確定知見）は「N系はDD軸で全日非有意
（イベント日 MWU p=0.136）、DDによる選択は根拠なし」と明記しており、
`dashboard/config/hall_configs/kamata1.yaml`の`warnings`にも
「DD は A 系のみ有効。N 系で DD を使うとほぼフラットに落ちる」と明記済みだった。
実際にDD=11で試すと、2F_N_L_nonMid/2F_N_R_Largeの上位がTOP50の1〜7位を占めており、
これらは全てN系のためDD根拠としては無効な推薦だった。

## アクション
- `kamata1_composite_recommend.py`の出力を使う場合、機種のA/N型を必ず確認し、
  N系エントリのmean_residualはDD根拠としては無視する（seg_key列で判別可能）。
- 蒲田1でDD軸を使った台選びはA系（ジャグ/ハナハナ）限定とし、N系はセクション×カクバン
  （`kamata1-2fn-event-section-hotspot`等）で判断する。
- スクリプト自体を修正するなら、SEGMENTS定義のN系2種にはDD集計をスキップし、
  代わりにセクション別premium表を出力するよう分離すべき（今回は未修正、次回検討）。

## 例
DD=11のkamata1_2F_N_L_nonMid: kakuban=8で mean_residual=+747, n=116という高い値が出るが、
これはN系でありDD軸自体が無効なため、選択根拠にしてはならない。

