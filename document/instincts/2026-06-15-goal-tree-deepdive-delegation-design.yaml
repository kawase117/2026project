# ゴールツリー型の深掘り委任プロンプトは「既知事実→ブランチ→分岐条件→統計基準」の順で書く

## 背景
蒲田7/蒲田1の曜日×イベント日×空間軸EDAで、複数の有望な信号(section 2179-2186,
section 2236-2255, kakuban=1の不一致, tail=3/4/5の脆弱信号)が見つかった際、
これらを一括でCodexのgoalモードに委任するプロンプトを作成した。

良いプロンプトの構造は以下の4段階：
1. **既知の事実(起点)**: これまでの検証で確定した数値・q値・サンプルサイズを
   箇条書きで提示する。Codexが再調査せず前提として使えるようにする。
2. **ブランチ定義**: 各信号を独立したゴールとし、「目的」「手順」「分岐条件」を
   明示する。分岐条件は「Xが見つかった場合→Yの子ゴールを作成、見つからない場合→
   Zと結論して終了」というif-then形式で書く。
3. **統計的基準(全ブランチ共通)**: FDR補正、n_dates閾値、再現性判定(前半/後半
   両方でq<0.05かつ方向一致)など、既存スクリプトの慣習をそのまま継承させる。
   これを書かないとブランチごとに基準がブレる。
4. **出力・報告フォーマット**: 出力先ディレクトリ、各ゴールの/update_goal記録、
   最終summaryの形式、そして「迎合的に信号がある方向にバイアスしない」ことを
   明記する(本プロジェクトCLAUDE.mdの「迎合するな」ルールをCodex側にも継承させる)。

また、推論レベル(reasoning effort)の選定について：
- 判断・分岐(どの仮説を掘るか、原因をどう解釈するか)を含むブランチは「高」が適する
- 手順が完全に明示された機械的な再実行・グリッドサーチ的なブランチは「中」で十分
- 複数ブランチを一括投入する際、判断要素が薄いブランチだけ「中」に分けると
  コストを抑えられる

## アクション
- ゴールツリー委任プロンプトを書く前に、各ブランチの「分岐条件」をif-then形式で
  明示できるか確認する。分岐条件が曖昧なまま委任すると、Codexが恣意的に
  ブランチを選んでしまう。
- 統計基準(FDR, n閾値, 再現性定義)は既存スクリプトの実装と完全に一致させ、
  プロンプト内で明示的に再掲する。
- 「迎合するな」系のルールはプロジェクトのCLAUDE.mdに書かれていても、
  Codexへの委任プロンプト側にも明示的に1文入れる。
- 複数ブランチの推論レベルを一律にする前に、各ブランチが「判断系」か
  「機械的探索系」かを分類し、後者は「中」に落とすことを検討する。

## 例
section 2179-2186(再現性あり)の深掘りでは「曜日分解→特定曜日が突出した場合のみ
machine_number単位の子ゴールを作成」という分岐を明示。
tail=3/4/5(脆弱信号)の深掘りでは「kakuban/sectionとの交互作用で安定セルが
見つからなければノイズと結論して終了」という分岐を明示。
