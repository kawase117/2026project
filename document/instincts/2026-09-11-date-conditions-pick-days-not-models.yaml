# 日付条件は「行く日」を決めるのに使える。「打つ機種」を決めるのには使えない

## Core claim
2つの結論が同じ測定から出た。

**使える — 日の選択。** 判別可能機種（ノーマル/BT/A+AT）のボーナス確率で測ると、
**強ゾロ目（1/1, 2/2 … MM=DD）は8ホール中7でプラス**。わずか20日しかない条件で揃う。

**使えない — 機種の選択。** 条件日に機種ごとの反応差は確かに広がるが（同じ日数の
無作為な日付を対照にして48セル中21セルが有意）、**その内訳は繰り返さない。**
前半で見つけた機種×条件は後半でほぼ無相関で、ルールに足すと成績が下がる。

## Evidence
**ボーナス確率の上振れ（%）。判別可能機種のみ、自機種の非条件日が基準:**

| ホール | 強ゾロ目 | ゾロ目日 | 7のつく日 | 1のつく日 | 月末 | 土日 |
|---|---|---|---|---|---|---|
| ベルシティ雑色 | **+5.02** | -0.20 | -2.56 | -0.88 | -0.20 | **+2.07** |
| 蒲田7 | **+4.52** | -0.16 | **+1.20** | **+1.12** | **+1.86** | +0.07 |
| 蒲田1 | **+2.53** | +0.72 | **+1.27** | **+1.82** | **+2.38** | -0.25 |
| 楽園蒲田 | **+1.72** | **+1.36** | +0.32 | -0.02 | -0.74 | **-1.26** |
| みとや大森町 | **+1.58** | -0.22 | **+1.33** | -0.30 | +0.05 | -0.42 |
| ARROW池上 | **+1.38** | **+1.48** | -0.98 | -0.93 | +0.91 | -0.63 |
| ヒロキ東口 | **+1.25** | **+1.51** | -0.34 | +0.25 | **+1.15** | +0.77 |
| レイトギャップ平和島 | -0.83 | +0.26 | -0.21 | -0.64 | +0.82 | **-1.35** |

設定1→6 でボーナス確率は 15〜25% 上がるので、**+4% は設定1段階ぶん**に相当する。

**既知の知見が再現した。** 蒲田7の7のつく日・1のつく日・月末がすべてプラス
（[[kamata7-event-day-definition-fix]] の定義どおり）、楽園の土曜が -1.26%
（[[feedback-saturday-is-thin-after-traffic-control]] と一致）。
**既知が再現したということは測り方が機能しているということ**で、
その上で強ゾロ目が新しく出た。

**機種×条件が使えない証拠（3つとも同じ向き）:**

| 測り方 | 結果 |
|---|---|
| 前半→後半の持続（機種×曜日） | -0.09〜+0.16（機種そのものは 0.39〜0.47） |
| 前半→後半の持続（機種×日末尾） | -0.01〜+0.16 |
| ルールに足した効果（曜日） | **-79枚 [-150, -7]** |
| ルールに足した効果（日末尾） | **-88枚 [-159, -25]** |

条件を足すと窓の日数が 1/7〜1/10 に減り、その運を順位が拾う。
[[model-strength-persists-by-term-not-by-day]] で「窓を長くするほど良い」と分かった
のと同じ現象の裏返しである。

## Interpretation
- **日数の少ない条件を差枚で測ってはいけない。** 同日に差枚で測って
  「ゾロ目は判断できない」と結論しかけた。指標をボーナス確率に変えたら出た。
  20日でも回転数は数十万Gあるので、ボーナス回数には情報が残る
- **σ は効果の大きさではない。** 蒲田7の強ゾロ目 +17.6σ は「効果が大きい」ではなく
  「回転数が多くて精度が高い」。判断は lift(%) で行う
- 版権イベント日（[[project-ip-tiein-event-days]]）はこの測り方では捉えられない。
  周期の繰り返しではなく外から来る1回限りの出来事なので、別枠のまま

## 限界
- 対象は判別可能機種（設置の36%）のみ。AT機がどう動いているかは分からない
- 強ゾロ目は1ホールあたり15〜20日。効果の向きは揃っているが幅の推定は粗い
- 平和島だけ強ゾロ目が負。ホール共通の法則にしない（[[feedback-no-cross-hall-pooling]]）
- 機種×条件の「広がり」は実在する（48セル中21セル）。実在するが**推定できない**
  のであって、存在しないとは言っていない

## Action
- 日付条件は `backtest/date_conditions.py` で測る（`table` / `day`）。
  朝のチートシートの冒頭に「今日はこの店にとってどういう日か」として出る
- **月末を日付でハードコードしない。** `day >= 29` は2月末を取りこぼす。
  その月の実際の日数から取る。直したら蒲田1が +1.36% → +2.38% に改善した
  （取りこぼしが信号を薄めていた）
- 機種選択に日付条件を足さない。機種は60日窓の恒常的な厚みだけで選ぶ
- 「行く日」と「打つ機種」は別の問いとして扱う。混ぜると両方悪くなる
