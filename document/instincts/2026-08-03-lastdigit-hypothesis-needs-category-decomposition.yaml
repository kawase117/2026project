# 末尾仮説はカテゴリ別に分解しないと符号が消える／逆転する

## Core claim
ヒロキ東口 2026-08-02(日)の実測で、末尾2はAT一般が強く(+1,143枚/台, 機械割110.6%)、
末尾8はJUG/BTが強かった(+1,155枚/台・+838枚/台)。**カテゴリを混ぜて末尾の当たり外れを見ると、
ホールが実際に使っている「末尾×カテゴリ」の配分軸が相殺されて見えなくなる。**

## Evidence
- n_observations: 1日(20260802)、ヒロキ東口49台(末尾2+8) + 全9ホール通年の対照検定
- data scope: single-hall（ヒロキ東口、単日）+ 全9ホール（通年の固定効果検定、非有意）
- metric scope: games加重機械割・平均差枚（カテゴリ別クロス集計）
- result summary:
  - 末尾2: AT一般 n=24 機械割110.6% +1,143枚/台 vs JUG/BT はマイナス
  - 末尾8: JUG n=6 機械割106.1% +1,155枚/台、BT n=3 機械割104.6% +838枚/台 vs AT一般はほぼ横ばい+219枚/台
  - 末尾2+8のAT機49台中27台(55.1%)がマイナス。「ATを選べば取れる日」ではなかった
  - 対照: 全9ホール通年の「末尾==日(dd%10)」「末尾==月」固定効果は全ホールで非有意
    (例: ヒロキ末尾==日 gap +0.15pp [-0.32,+0.62]、末尾==月 -0.10pp [-0.62,+0.41])

## Interpretation
- 通年の固定効果検定が非有意でも、**個別日の配分が消えたわけではない**。ホールが末尾を
  日替わりで動かしている場合、通年平均は薄まってゼロに収束する。今回の非有意は
  「末尾に意味がない」ではなく「検定の粒度が粗すぎて日替わり配分を検出できない」の可能性が高い
- 単一の残差指標（カテゴリ混合）で「今日は末尾Xが弱い/強い」と判定すると、
  カテゴリごとに逆方向の効果が混ざって打ち消し合い、実際には強く効いている軸を見逃す
- MM基準（月の数字）とDD基準（日の数字）の末尾が、**別々のカテゴリに効いている**可能性がある
  （8/2ヒロキの例: MM=8→JUG/BT、DD=2→AT）。DD基準だけで末尾を選ぶ癖があると
  MM基準側の配分（今回で言えばJUG/BTの末尾8）を丸ごと見逃す

## Action
1. 末尾仮説を検定するときは、必ず**カテゴリ別にクロス集計**してから判断する。
   ホール全体やカテゴリ混合の残差平均だけで「効果なし」と結論しない
2. 通年の固定効果検定（末尾==日/月、gapが非有意）は「日替わり配分がない」ことの
   証明にはならない。日ごとの実測クロス集計で別途確認すること
3. MM末尾・DD末尾の両方を候補として残し、どちらか一方に絞らない。
   両方をカテゴリ別に見て、初めて「どの軸がどのカテゴリに効いているか」が分かる
4. 全9ホールでの「MM末尾×DD末尾×カテゴリ」の体系的スキャンは未実施。次回実施時は
   この分解を前提にした設計にすること

