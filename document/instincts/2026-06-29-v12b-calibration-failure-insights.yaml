# ホールの「好調台逆張り」仮説はデータで否定される

## 背景
過去成績が良い台の翌日パフォーマンスを検証した結果、逆張りの証拠は見つからなかった。
むしろ好調台は翌日もわずかに好調な傾向がある（慣性効果）。
- 30日trailing payout最低群(D0): 翌日104%+=32.3%
- 30日trailing payout最高群(D9): 翌日104%+=34.7% (+2.4pp)
- 前日104%超えの台: 翌日104%+=32.5%（非該当: 31.8%）
- 連続104%超えstreak>=4: 翌日104%+=33.2%（streak=0: 31.8%）

## アクション
- 「好調台を避ける」戦略には根拠がない
- スコア500+の低的中率（25.3%）はホールの逆張りではなくモデルのアーティファクト
- hist_metricの正の予測力と整合的：過去成績はそのまま未来予測に使える

## 例
30日trailing payout vs 翌日104%+率:
  D0 (avg=91.8%): 32.3%
  D5 (avg=99.5%): 30.7%
  D9 (avg=112.1%): 34.7%
  → 好調台ほど翌日も好調（+2.4pp）
