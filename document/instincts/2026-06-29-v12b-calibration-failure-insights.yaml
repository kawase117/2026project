# v12b compositeスコアにキャリブレーションが存在しない

## 背景
v12b_debut_multiplier_halfのcompositeスコアと実際の104%超え確率の対応関係を、60日間のwalk-forward評価（42,840行）で検証した。
スコア十分位別の104%超え率はD0=32.9%からD9=32.8%まで実質フラットで、スコアの高低が的中確率をほぼ予測しない。
ベースライン（ランダム選択）31.1%に対し、Top50のリフトは+1.6ppのみ。
スコア500以上はむしろ25.3%でベースライン以下（反予測的）。

## アクション
- compositeスコアのTop-N絞り込みに統計的根拠がないことを前提に推薦設計を行う
- スコアの絶対値による閾値フィルタも無効（単調増加しないため）
- 推薦を出す場合は、セグメント別のquota割り当てまたはセグメント内パーセンタイルでカバレッジを確保する
- キャリブレーション改善前に、スコア構造自体の見直し（v11重みの極端な集中など）が必要

## 例
スコア十分位と104%超え率（60日walk-forward）:
  D0 (avg=-171): 32.9%
  D5 (avg=+90):  31.0%
  D9 (avg=+273): 32.8%
  Baseline:      31.1%
Top50 coverage: 全104%+台の7.4%しか捕捉できていない

