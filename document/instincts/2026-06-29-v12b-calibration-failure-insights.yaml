# v11セグメント別重みの極端な集中がスコア歪みを生む

## 背景
SEGMENT_WEIGHTS_V11で3F_R_Nはc1=0.50, c4=0.50（2成分のみで100%）、2F_L_Nはc2=0.47（末尾が47%を支配）。
この極端な集中により、DD28×日曜のような特定コンテキストで東京喰種セクション（3209-3217）がTop5を独占する一方、2F_L_N（182台で最大セグメント）はTop50に3台しか入らない。
東京喰種3209-3217のDD24-28実績はavg_diff=-228（セグメント全体+32と比較してマイナス）にもかかわらず、モデルは最高スコアを付けている。

## アクション
- v11重みの集中度を確認してから使用する（2成分で100%は危険信号）
- 特定セクション・機種がTop-Nを支配する場合は重み設計を疑う
- セグメント間のスコアスケールの違いが推薦のカバレッジを破壊していないか検証する

## 例
v11 weights:
  3F_R_N: c1=0.50, c4=0.50 (c2/c3/c5/c6=0)
  2F_L_N: c1=0.34, c2=0.47 (c3=0.05, c4/c5/c6≈0)
結果: 東京喰種(avg_diff=-228)がスコア575で1位、2F_L_Nの182台中Top50に入ったのは3台のみ

