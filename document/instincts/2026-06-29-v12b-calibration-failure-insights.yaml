# 予測力を持つコンポーネントはhist_metricのみ（全9バリアント共通）

## 背景
v6aの6コンポーネント＋hist_metricを個別にSpearman相関で検証した結果:
- hist_metric: rho=+0.037, p<0.0001 (D0=28.9%→D9=35.0%, +6.1pp) — 唯一の実効的シグナル
- c2（角番距離）: rho=+0.015, p=0.002 — 有意だが効果量は小さい（+1.4pp）
- c5（末尾）: rho=-0.021, p<0.0001 — 反予測的（高スコアほど的中率低下）
- c1, c3, c4: 全て非有意（p>0.12）
- composite全体: 非有意（rho=-0.003, p=0.55）
また全9バリアント（v1〜v12b）のcompositeスコアで検証しても、全てSpearman rho≈0、p>0.27で非有意。
バリアントの進化はキャリブレーションを改善していない。

## アクション
- hist_metric（台個別の過去成績）をスコアリングの中核に据える
- c1〜c4の構造コンポーネントは3F_L_A以外で予測力がないため、全セグメント共通の重み設計は無効
- c5は害を与えている（反予測的）ため、除外または符号反転を検討する
- 構造コンポーネントの重みチューニングより、hist_metricの改善（窓幅、正規化、shrinkage）に投資すべき

## 例
グローバルSpearman (v6a, 60日, n=42,840):
  hist_metric: rho=+0.037 *** (D0=28.9%→D9=35.0%)
  c2:          rho=+0.015 **  (D0=30.8%→D9=32.2%)
  c5:          rho=-0.021 *** (D0=31.5%→D9=27.9%) ← 反予測的
  c1:          rho=-0.003 ns
  c3:          rho=-0.001 ns
  c4:          rho=-0.007 ns

