# Top-N絞り込みはキャリブレーション済みモデルでのみ正当化される

## 背景
Top50のhit率32.7%はベースライン31.1%と+1.6ppしか差がなく、Top50は全104%+台の7.4%しか捕捉しない。
セグメント別では3F_R_Aが0.8%、2F_L_Nが3.7%の捕捉率で、特定セグメントの高設定台を体系的に見逃している。
問題は「高スコア台が高設定でない」ことではなく、「低スコア台にも同程度の確率で高設定台が存在し、Top-Nで切ることで有用な情報が失われる」こと。

## アクション
- キャリブレーションが確立されるまで、Top-Nでの絞り込みは推薦の根拠として不十分
- 推薦出力はセグメントごとの上位台を含める設計にする（quota方式）
- またはスコアではなく、セグメント内パーセンタイル順位を使う
- ユーザーには「スコア順＝確度順ではない」ことを明示する

## 例
セグメント別Top50捕捉率:
  2F_L_N: Top50 share=12.4%, hits captured=3.7%
  3F_R_A: Top50 share=1.5%,  hits captured=0.8%
  2F_R_N: Top50 share=47.2%, hits captured=14.4%
Top200に広げても全体の28.5%しか捕捉できない

