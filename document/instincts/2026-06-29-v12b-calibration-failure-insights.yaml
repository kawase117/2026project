# 3F_L_Aだけがcompositeスコアで有意なキャリブレーションを持つ

## 背景
6セグメントのうち3F_L_Aのみがcomposite全体で有意（rho=+0.051, p=0.0001）。
Q0=22.7%→Q4=29.3%で、ベースライン27.1%に対し最上位群で+2.2pp、最下位群で-4.4ppの分離がある。
c1, c3, c4, hist_metricの4コンポーネントが全て正方向で有意に寄与している。
他5セグメント（2F_L_N, 2F_R_N, 3F_L_N, 3F_R_A, 3F_R_N）のcompositeは全て非有意。
hist_metricだけは3F_L_N(p=0.0001)と2F_R_N(p=0.045)でも個別に有意。

原因としてA系（ジャグラー/ハナハナ）は設定差が出力率に直結するためノイズが小さいが、
2F_L_N(n=10,920)が3F_L_A(n=5,760)の2倍のサンプルでも非有意であることから、
N系は「ノイズで隠れている」のではなく「日次出力率からは設定を読み取れない」可能性が高い。

## アクション
- A系とN系で予測戦略を根本的に分ける設計を検討する
- 3F_L_Aにはcompositeスコア（c1/c3/c4/hist）をそのまま適用できる
- N系にはhist_metricのみを使うか、日次でない別指標（複数日移動平均、G数トレンド等）を検討する
- 3F_R_Aも同じA系だが構造シグナルは非有意（n=5,520）— LR分割やセクション構成の違いが原因の可能性

## 例
セグメント別composite Spearman:
  3F_L_A: rho=+0.051, p=0.0001 *** ← 唯一有意
  3F_R_N: rho=+0.012, p=0.41 ns
  2F_L_N: rho=+0.008, p=0.42 ns
  2F_R_N: rho=-0.001, p=0.92 ns
  3F_L_N: rho=-0.009, p=0.51 ns
  3F_R_A: rho=-0.002, p=0.88 ns

