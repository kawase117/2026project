# DD7とDD30は両ホールで104%率が安定して高い

## 背景
蒲田七・蒲田一の両方でDD7(+3.1〜3.5pp)とDD30(+2.7pp)が
全体ベースラインを有意に上回る。DD25（給料日）は逆にフラット〜やや低い。
DD-Binに集約するとシグナルが消えるため、特定DDのピンポイント効果。

## アクション
DD別分析はbinに丸めず離散値のまま扱う。
DD7とDD30は両ホール共通の投入強化日として高信頼で扱える。
DD25（給料日仮説）は104%率では支持されない。

## 例
蒲田七: DD7=37.0%(+3.5pp, n=8528), DD30=36.2%(+2.7pp, n=7046)。
蒲田一: DD7=34.5%(+3.1pp, n=6448), DD1=34.4%(+3.0pp, n=6229)。
DD25: 蒲田七32.2%(-1.2pp), 蒲田一31.6%(+0.2pp) → シグナルなし。

