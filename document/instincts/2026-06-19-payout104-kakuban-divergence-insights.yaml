# 差枚と104%率の乖離が示す設定配分の手がかり

## 背景
角番ごとの差枚平均と104%率のランキングは必ずしも一致しない。
乖離パターンは2種類あり、それぞれ異なる設定配分仮説を示唆する。

## アクション
角番評価では差枚と104%率を並列で算出し、ランク乖離が3以上のセルを抽出する。
- パターンA（104%率高・差枚低）: 設定4集中（勝率は高いが爆発しない）。リスク回避型立ち回り向き。
- パターンB（差枚高・104%率低）: 設定6一点 or ヒキ強の大勝ちが平均を押し上げ。安定性は低い。
どちらか一方だけで角番を評価すると、実戦時の勝率と期待値で判断が食い違う。

## 例
K7_3F_L角番15: 104%率=32.4%(1位)、差枚=-90(ワースト級) → パターンA典型。
K7_3F_R角番20: 差枚=+435(1位)、104%率=30.8%(12位) → パターンB典型。

