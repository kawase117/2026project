# A型機の角番評価は104%率が差枚より適切

## 背景
3Fセグメント（主にA型機）では差枚Top3と104%率Top3の重複が1/3程度しかなく、
指標選択で結論が逆転するケースが多い。A型機は設定間の出玉差が小さいため、
少数の大勝ち・大負けに差枚平均が引っ張られやすい。

## アクション
A型機のセグメント（3F_A, 3F_L, 3F_R, 2F_A, 2F_A_Midなど）では
104%率を主指標、差枚を参考指標として扱う。
N型（AT/ART機）は両指標が一致する傾向が強いため、差枚でもOK。

## 例
K7_2F_N: Top3完全一致（3/3） → N型は差枚で十分。
K7_3F_L: Top3は1/3一致のみ → A型は104%率を優先すべき。
K1_N_L_nM: Top3完全一致（3/3） → N型の安定性が再確認。

