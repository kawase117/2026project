# DD-Binの差枚シグナルは「高設定台の数」ではなく「設定の質」の変化

## 背景
差枚平均ではDD-Bin（月初/月中/月末）で月初が+35〜+41のシグナルを示すが、
104%率に置き換えると差は+0.5〜0.7ppに縮小しほぼフラットになる。
104%以上の台の平均差枚（勝ち幅）を分解すると、月初は月中比で
蒲田一+192枚、蒲田七+57枚と勝ち台の質が高い。
P90（上位10%出玉）でも月初+3200 vs 月中+2900と同傾向。

## アクション
DD-Binの差枚シグナルを見たら、104%率（高設定台の数）と
104%超え台の勝ち幅（設定の質）に分解して解釈する。
- 104%率がフラット → 設定を入れる台の数は変わらない
- 勝ち幅が大きい → 設定4→6へのシフト（質の向上）
月初に行くメリットは「高設定を掴んだときのリターン増」であり、
「高設定台に座れる確率の向上」ではない。

## 例
蒲田一: 月初104%率=32.1%(+0.7pp) だが差枚=+113(+41)。
  104%台の勝ち幅: 月初+2935 vs 月中+2743 (+192枚)。
蒲田七: 月初104%率=33.9%(+0.5pp) だが差枚=+253(+35)。
  104%台の勝ち幅: 月初+3195 vs 月中+3138 (+57枚)。

