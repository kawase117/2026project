# 曜日シグナルはホール間で逆方向 — 汎用化不可

## 背景
蒲田七は水曜が最強(34.9%, +1.5pp)・金曜が最弱(29.2%, -4.2pp)。
蒲田一は火曜が最強(34.8%, +3.4pp)・水曜が弱い(29.5%, -2.0pp)。
同じマルハン系列でも完全に逆方向であり、曜日は汎用シグナルではない。

## アクション
曜日特徴量はホール別個別モデルでのみ使用する。
全ホール統合モデルに曜日を入れるとノイズになる可能性が高い。
蒲田七の金曜は-4.2ppと最大の負方向シグナルなので回避候補。

## 例
蒲田七 水曜=34.9% vs 蒲田一 水曜=29.5% → 差5.4pp、完全に逆。
蒲田七 火曜=30.8% vs 蒲田一 火曜=34.8% → 差4.0pp、これも逆。
