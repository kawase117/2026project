# 角番1は差枚・104%率の両方で全セグメント最弱〜下位

## 背景
差枚分析では既に角番1（入口最寄り）の不利が確認されていたが、
104%率でも全セグメントで最低〜下位であることが確認された。
指標を変えても結論が変わらないため、構造的なシグナルと判断できる。

## アクション
角番1は立ち回りで回避対象とする。
この結論は差枚ベースの過大評価バイアスによるものではなく、
104%率（二値）でも再現されたため、信頼度が高い。

## 例
K7_2F_N角番1: 104%率=34.2%(最低)、差枚=-20。
K7_3F_A角番1: 104%率=23.4%(最低)、差枚=-4。
K1_2F_A角番1: 104%率=28.0%(10位/20)、差枚=+98（中位だが104%率は低い）。

