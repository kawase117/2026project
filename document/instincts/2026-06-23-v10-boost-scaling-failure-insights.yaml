# クロスセグメントスケール歪みは繰り返し発生する構造的問題

## 背景
v8（動的セグメントウェイト）、v10a-c（曜日×角番ブースト）の両方で同じ失敗パターンが発生。
セグメント内では改善するが、セグメント間の相対スコアバランスが崩れ、Top50全体では悪化する。
v9b（blend α=0.5）はv6aのグローバルスコアと混合することでこの問題を部分的に回避。

## アクション
- compositeの計算をセグメント固有に変更する施策は、必ずクロスセグメントスケール検証を含めること
- 安全策: (1) blendでグローバルスコアと混合、(2) percentileでセグメント内順位に変換後に統合、(3) Top50選抜後のリランキングに限定
- c1への直接乗数適用は避ける — compositeスケールを直接歪ませる最も危険な方法

## 例
v8: セグメント別動的ウェイト → lift@50=1.215（v6a=1.250より大幅悪化）
v10a: c1曜日ブースト scale=1.0 → lift@50=1.243（同様に悪化）
v10d: c1曜日ブースト scale=0.25 → lift@50=1.246（縮小しても超えない）

