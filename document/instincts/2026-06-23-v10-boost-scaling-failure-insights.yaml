# 統計的有意≠予測有効：曜日×角番×セグメントブーストは全スケールでv6aに劣後

## 背景
残差法で3F_L_Aの曜日×角番交互作用が高度に有意（木q=1e-13、火q=2.6e-12）であることを確認。
これをc1に乗数ブーストとして実装（v10a: scale=1.0, v10d: scale=0.25, v10e: scale=0.50）。
結果: ブースト倍率を小さくするほどv6aに近づくが決して超えない単調関係。
- v6a: lift@50=1.2495
- v10d (scale=0.25): lift@50=1.2462
- v10e (scale=0.50): lift@50=1.2450
- v10a (scale=1.00): lift@50=1.2428
イベント日・非イベント日の両方で同傾向。scale→0でv6aに収束するだけ。

## アクション
- 残差分析でp<0.001でも、バックテストのlift改善に繋がるとは限らない
- 「有意な効果」と「予測に使えるほど大きな効果」は本質的に異なる概念
- c1への乗数ブーストは、対象セグメント内では改善しても、クロスセグメント順位を歪ませてTop50全体のliftを下げる
- 曜日×角番×セグメントの知見は、スコアリングファクターではなく定性的判断材料として使うのが妥当

## 例
3F_L_A セグメント内avg_diff: v10c=196.9 > v6a（改善）
Top50全体lift@50: v10c=1.226 < v6a=1.250（悪化）
→ セグメント内改善がTop50全体では逆効果

