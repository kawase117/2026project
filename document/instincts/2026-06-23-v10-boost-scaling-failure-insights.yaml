# スケール→0でベースラインに単調収束する場合、その施策自体が無効

## 背景
v10d(0.25), v10e(0.50), v10a(1.00)のlift@50はscaleに対して単調減少。
scale=0はv6aそのものであり、ブースト追加は常にマイナス方向。
これは「最適スケールが0より大きいどこかにある」のではなく「この施策自体がliftを下げる構造」を意味する。

## アクション
- scale sweepで単調収束パターンが出た場合、さらに細かいscaleを試す必要はない
- 施策の方向性自体を変更するべき（例: 乗数→加算、composite→リランキング、ファクター→フィルタ）
- 逆に、中間スケールにピークがある場合は最適値探索の価値がある

## 例
lift@50: v6a=1.2495 > v10d(0.25)=1.2462 > v10e(0.50)=1.2450 > v10a(1.0)=1.2428
→ 完全な単調減少 → この施策は打ち切り

