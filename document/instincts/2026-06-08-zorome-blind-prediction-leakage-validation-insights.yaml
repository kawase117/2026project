# 「ゾロ目の日は逆相関で動く」仮説の検証で、最初の再検証自体がリークしていた——同一日付のwalk-forward再評価では不十分

## 背景
6/6（月日ゾロ目の土曜）のブラインド予測でAUC=0.41という逆相関的結果が出たことから、「ゾロ目の日にはホールが逆パターンで動く法則性があるのでは」という仮説が立てられた。

これを検証するため最初に行ったのは「同一パイプラインでの walk-forward OOF 再評価」（過去9回の月日ゾロ目それぞれのAUCを算出）であり、結果はAUC平均0.72・全日とも0.5超——「仮説は棄却された」と一度報告した。

しかし、この再評価は **当日の実測 `games_normalized`（同日内オンリー特徴量、`.shift(1)`未処理）をそのままモデルに与えていた**。一方、6/6のブラインド予測では当日回転数が未知のため「過去の曜日別平均」で推定した値を使わざるを得なかった。両者は全く異なる制約条件での評価であり、比較に意味がなかった（ユーザー本人の指摘で発覚）。

学習データのみから回転数を推定し直して公正に再検証したところ、ゾロ目の日(AUC_blind平均0.5254)と非ゾロ目の日(0.5203)に統計的有意差はなく(p=0.62)、仮説は完全に棄却された。

## アクション
- フォワード/ブラインド予測で観測された異常を検証する際は、「同じ日付を再評価する」だけでは不十分。**元のブラインド予測が置かれていた制約条件（未知の同日特徴量を学習データのみから推定する、など）を寸分違わず再現した検証**でなければ、結論は無効になる
- 特に「同日内のみで観測される特徴量（このプロジェクトでは`games_normalized`）」が`BASE_FEATURES`に含まれている場合、それをそのまま使う再評価は本質的にリークしている——必ず特徴量ごとに「予測時点で既知か」を確認すること
- 自分が組んだ「再検証」自体がフェアかどうか、報告前に一段階引いて確認する習慣をつけること（このセッションでは、ユーザーの「リークしていませんか？」という一言がなければ誤った結論を確信度付きでYAMLに記録するところだった）

## 例
```python
# NG: 同一日付のwalk-forward再評価（実測値を使うため、ブラインド予測の代理にならない）
frame = build_machine_feature_frame(raw)  # games_normalizedは実測値のまま
auc = evaluate(model, frame[frame.date == target_date])

# OK: 元のブラインド予測と同じ制約（未知特徴量を学習データのみから推定）を再現
seat_dow_avg = train_raw.groupby(['machine_number','weekday'])['games_normalized'].mean()
frame_blind = frame.copy()
frame_blind['games_normalized'] = frame_blind.apply(lambda r: seat_dow_avg.get((r.machine_number, r.weekday), fallback), axis=1)
auc_blind = evaluate(model, frame_blind[frame_blind.date == target_date])
```

