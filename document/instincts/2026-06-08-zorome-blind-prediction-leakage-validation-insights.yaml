# 実測回転数ありなら日次AUC平均0.69、推定値に置き換えると0.52(ほぼランダム)まで信号が破壊される

## 背景
`BASE_FEATURES`の中で`games_normalized`（当日回転数）だけが`.shift(1)`によるラグ処理をされていない「同日内オンリー」特徴量であり、フォワード予測では必然的に推定値で代用するしかない。

過去247日のwalk-forward OOFで両条件を比較した結果：

- 実測回転数を使った場合: 日次AUC平均 = **0.6949**（std=0.0397、全日でAUC>0.5を維持）
- 学習データのみからの曜日別平均推定値に置き換えた場合: 日次AUC平均 = **0.5210**（std≈0.05、約32%の日でAUC<0.5に転落）
- 平均劣化幅 = +0.1746（約17ptの情報損失）

つまり、このモデルが本来持つ識別力（AUC≈0.69）のほとんどは、`games_normalized`の推定誤差というノイズに飲み込まれて消失する。

## アクション
- みとや大森町でのフォワード予測を実用化したいなら、**最優先課題は`games_normalized`への依存を断つこと**——(a) この特徴量を使わないモデルバリアントを別途学習・評価する、または(b) 推定精度を根本的に向上させる（曜日別平均では不十分なことが実証済み）
- 「ブラインド予測の精度が低い／不安定」という現象を見たら、まず「同日内オンリー特徴量への依存度」を疑うこと。`BASE_FEATURES`のうちラグ処理されていない特徴量をリストアップし、それぞれの推定可能性を評価することが改善の出発点になる
- 改善前の現状認識として、「合成行注入によるブラインド予測」は実用段階になく、確率閾値による選別判断の根拠としては使用しないこと

