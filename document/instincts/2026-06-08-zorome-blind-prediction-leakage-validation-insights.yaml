# 「ゾロ目の日にAUCが逆転した」現象は、実は同一手法で全日の約32%に発生する“通常運転”だった

## 背景
6/6（ゾロ目）のブラインド予測でAUC=0.41という逆相関が観測され、「ゾロ目特有の法則性では」という仮説が生まれた。

しかし公正な条件（学習データのみからの回転数推定）でみとや大森町の過去247日を再現したところ：

| 区分 | 該当日数 | AUC_blind平均 | 逆相関(AUC<0.5)になった日の割合 |
|---|---|---|---|
| 月日ゾロ目の日 | 9 | 0.5254 | 2/9 = 22.2% |
| 非ゾロ目の日 | 238 | 0.5203 | 77/238 = 32.4% |
| 全体 | 247 | 0.5210 | 79/247 = 32.0% |

Mann-Whitney検定でも両者に有意差なし(p=0.62)。**「ゾロ目の日に逆転する」のではなく、「このブラインド予測パイプラインは、どの日でも約3日に1日の割合で逆転する」が正しい説明だった**。劣化幅トップ5の日もすべて非ゾロ目日。

## アクション
- 単発の異常値（1日分のAUC逆転など）を見て「法則性の発見」と報告する前に、**その手法・パイプライン自体の通常の変動範囲（baseline noise rate）を必ず確認する**こと。今回のケースでは「逆転」は珍しい現象どころか、全日の3割で起きる通常運転だった
- 「n=1の劇的な観測」は強い印象を与えるが、それ単独では「属性Xに固有の法則」と「単なる手法のノイズの一表現」を区別できない。区別するには、同じ手法を他の多数の比較対象（このケースでは過去247日）に適用し、属性Xの該当群と非該当群の分布を統計的に比較する必要がある
- 「嬉しい発見」に飛びつく前に「この程度の振れ幅は、この手法では普通に起こり得るか？」と自問する一手間が、誤った確信度付きインサイトの記録を防ぐ

