# 予測→答え合わせサイクルで得た6つの方法論的教訓（2026-07-26答え合わせより）

## Core claim
2026-07-26の推薦を07-27に答え合わせした結果、ドメイン知見とは独立に「予測の作り方・
答え合わせの読み方」自体に一般化できる教訓が6件得られた。

## Evidence
- n_observations: 1サイクル（推薦→単日答え合わせ）
- data scope: all-hall（7ホール横断の予測・3ホールの機種/位置レベル推薦）
- metric scope: diff / payout%（機械割ベース）
- result summary:
  1. theory doc既存記載のある候補（マギアレコード・東京喰種・新ハナビ）は全的中。
     セッション内でその場発見した候補（ヴァルヴレイヴ2・かぐや様）は全外れ
  2. 効果量大・CI広の候補（ヴァルヴレイヴ2 +10.4pp CI[+3.15,+19.84]）は符号反転。
     効果量小・CI狭の候補（モンキーターンV +3.61pp CI[+1.52,+5.70]）はほぼ的中
  3. top1/top2除外検定（鉄台判定）で切った蒲田7セクション2023-2031が、
     当日は最強区画の一つだった（鉄台除外後も+1.01〜+1.39pp相当が残っていたのに切った）
  4. ホールランキングのSpearman順位相関はn=7で有意水準に届かない構造的な検出力不足
     （今回rho=+0.643, p=0.119）
  5. 36日分の蓄積データに基づく蒲田7角番・端番ルールが単日で一部反転
  6. split-half順位相関（奇数/偶数イベント日で台順位が一致するか）が
     「機種内で台を選べるか」の判定に有効に機能した（東京喰種24台でρ=-0.18等、
     一貫して低相関→台選び不可能と判定でき、実際に選択非依存の結果と整合）

## Interpretation
- 独立文献根拠 vs 当日発見の区別は、多重比較バイアスの強さの代理指標として機能する。
  当日発見候補は「良さそうに見えたから選ばれた」選択バイアスを常に含む
- 効果量とCI幅は独立の情報である。効果量だけを見て「強い候補」と判断せず、
  CI幅（＝サンプルの薄さ）を必ず確認する。広いCIの極端な点推定は
  winner's curse／regression-to-meanを疑う
- 「過去平均が特定台に牽引されているか」（鉄台検定）と「当日その区画が投入対象か」は
  別の問いである。前者の検定結果だけで後者を判断してはならない。鉄台除外後も
  プラスが残るなら、そのプラス自体が当日の投入判断材料になり得る（切り捨てる理由にならない）
- ホール単位のランキング検証はホール数が少ないため統計的に軽い。単日結果で
  ランキング手法の妥当性を判断せず、複数日蓄積後に評価する
- 蓄積データに基づく位置ルールの単日反転は、既存instinct
  single-day-answercheck-cannot-separate-signal-from-selection-failure（みとや）と
  同型の現象。ルール自体を疑う前に、反転の原因（機種バンク予算集中等の交絡）を先に探る
- split-half順位相関は台選びの可否を判定する軽量な追加ツールとして確立できる

## Action
- 次回の推薦作成時:
  - 候補ごとに「事前文献根拠あり／当日発見のみ」のラベルを明示し、確信度を分けて提示する
  - 効果量とCI幅を必ず併記し、CI幅が広い（サンプル薄い）候補は「上限値として読め」と明記する
  - 除外判定（鉄台検定等）を行う際は、「除外後もプラスが残るか」を確認し、
    残るなら切らずに弱い根拠として保持する
  - ホールランキングのSpearman相関は複数日分を貯めてから評価する（単日でp値を報告しない）
  - 位置ルールが単日で反転しても即座に否定せず、交絡要因（機種バンク予算集中等、
    2026-07-27-user-ground-truth-0726-fieldobs参照）を先に検討する
  - 機種内で台を選ぶ推薦をする前に、split-half順位相関（可能なら）で選択可能性を検定する

