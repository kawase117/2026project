- id: 2026-10-04-judge-items-complementary-double-count
  trigger: "ユニバリーコレアプリ(hanabi-reach / univari-colle)で新機種の設定判別の項目（machines/*.js の judge.items）を追加するとき。BB中・RB中・ボーナス中の役の確率表を項目に起こすとき。斜め風鈴と平行風鈴のように表裏の役を両方入れたくなったとき"
  confidence: 0.9
  domain: methodology
  source: session-observation
  project_id: 2026project
  project_name: hanabi-reach

  title: 設定判別の項目に、同じ試行を二分する役（補数の関係）を両方入れない

  core_claim: |
    設定判別は各項目を独立な二項分布とみなして対数尤度を足す。1回の試行で必ずどちらかが出る
    役（例：新ハナビのBB中 斜め風鈴1/11 と 平行風鈴1/1.10 は 0.0909+0.9091=1）を両方入れると、
    同じ試行の結果を2回数えることになり、信頼度が実際より高く出る。片方で情報は尽きている。

  evidence:
    n_observations: 1
    data_scope: 新ハナビ BB中698回（斜め72＋平行624＝696、ほぼ全数）
    metric_scope: 設定5以上の事後確率
    note: 平行風鈴の入力欄は2026-10-04に削除済み。判定がどれだけ動いていたかは未計測。

  action: |
    項目表を起こしたら、同じ母数の項目同士で設定ごとの確率(1/分母)を足して1になる組がないか確認する。
    あれば片方だけ残す。母数を逆算するアンカー役（斜め風鈴など）を残す。
    ついでに、母数が小さい項目（RB中1枚役144回など）は、設定間の相対差が大きくても、
    ゲーム数が伸びるまで信頼度の根拠にしすぎない。
