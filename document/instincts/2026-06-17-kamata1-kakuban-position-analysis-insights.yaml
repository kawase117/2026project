# 蒲田1 角番N番目の台番号はCSVのrank_from_min/rank_from_maxで抽出できる

## 背景
蒲田1のフロアレイアウトは `Heatmap/2F_floor_coordinates_kamata1.csv` に記録されており、
各台に `rank_from_min`（セクション先頭から何番目）と `rank_from_max`（セクション末尾から何番目）が付与されている。
「角番N」＝ rank_from_min==N OR rank_from_max==N で抽出できる。

## アクション
```python
rank_n = set()
with open('Heatmap/2F_floor_coordinates_kamata1.csv', encoding='utf-8') as f:
    reader = csv.DictReader(f)
    for row in reader:
        mn = int(row['machine_number'])
        if int(row['rank_from_min']) == N or int(row['rank_from_max']) == N:
            rank_n.add(mn)
```
セクション台数が 2N-1 以下の場合、同一台が rank_from_min==N かつ rank_from_max==N になる（中央台）。
12台セクション（2191-2202）では 2196が rank_from_min=6・rank_from_max=7、2197が逆になるため、
角番6と角番7の両リストに重複して入る点に注意。

## 例
- 角番6: 43台、角番7: 49台（2026/06/16時点のDBで稼働確認済み）
- 重複台: 2196・2197（セクション2191-2202の中間付近）

