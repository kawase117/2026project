# ジャグラー・ハナハナは machine_name の部分一致で判定できる

## 背景
蒲田1DBには多数の機種が混在しており、ジャグラー系・ハナハナ系を分離して分析する場面が多い。
機種名に「ジャグラー」または「ハナハナ」を含む文字列で確実に捕捉できる。

## アクション
```python
def is_jag_hana(name):
    return 'ジャグラー' in name or 'ハナハナ' in name
```

2026/06/16時点で該当する機種（稼働確認済み）:
- ジャグラー系: ウルトラミラクルジャグラー、ゴーゴージャグラー3、ジャグラーガールズ、
  ネオアイムジャグラーEX、ハッピージャグラーVIII、ファンキージャグラー2、マイジャグラーV、ミスタージャグラー
- ハナハナ系: キングハナハナ-30、スマート沖スロ ドラゴンハナハナ～閃光～

## 例
角番7のジャグ・ハナハナ台番号（2026/06/16稼働）:
2155, 2157, 2196, 2197, 2229, 2242, 2249, 2288, 2295, 2308, 2310, 2323, 2324

