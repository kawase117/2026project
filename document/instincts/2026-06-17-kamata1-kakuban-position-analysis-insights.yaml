# 2026/06/16 蒲田1は角番7ジャグ・ハナハナへの集中投資パターン

## 背景
2026/06/16の蒲田1データを分析した結果、角番6と角番7で明確な差が観測された。
ユーザーが「角番6と7の日」と仮定していたが、実際にはジャグラー・ハナハナへの投入に絞ると
角番7の優位性が顕著だった。

## アクション
角番N分析では以下の3グループを必ず比較する：
1. 全台
2. ジャグラー・ハナハナのみ（machine_nameに'ジャグラー'または'ハナハナ'を含む）
3. ジャグラー・ハナハナを除く

機械割の算出式: (games*3 + diff_coins) / (games*3) * 100

## 例
| グループ              | 台数 | 機械割    | ホール比    |
|---------------------|------|---------|-----------|
| ホール全体            | 336  | 103.84% | —         |
| 角番6 全台           | 41   | 103.90% | +0.06pp   |
| 角番6 ジャグ・ハナハナ | 13   | 100.66% | -3.18pp   |
| 角番7 全台           | 46   | 107.80% | +3.96pp   |
| 角番7 ジャグ・ハナハナ | 13   | 110.46% | +6.63pp   |

角番7ジャグ・ハナハナ13台中8台がプラス差枚、勝率69.2%。

