# みとや Branch F stable 機種 × Q5 の交差が最強シグナル

## 背景
mitoya_machine_category_axis_deepdive.py の Branch F で other 群 81 機種の X_DDS 効果を
Mann-Whitney U + split-half で検定。stable=12機種を特定。
Q5 リスト（直近3ヶ月 payout top quintile）と突き合わせると 4 機種が重複。

## アクション
X_DDS 日の優先順位：
1. **Q5 かつ Branch F stable** = 最強（2シグナル収束）
   - モンキーターンV: xdds=103.94%, delta=+5.83, p<0.001
   - 東京喰種: xdds=105.50%, delta=+4.84, p<0.001
