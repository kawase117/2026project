# ジャグラーは X_DDS 効果 stable だが実用対象外

## 背景
Branch E でジャグラー（jug）カテゴリも X_DDS 効果 +1.94pp かつ stable と判明した。
ただしユーザー方針：「差枚1000枚以上を80%確率で取れない限りジャグラーには座らない」。

## アクション
- ジャグラーの X_DDS 効果は記録に留める（統計的には有意）
- スクリーニングや推奨台ロジックからは **除外して構わない**
- もし将来「ジャグラー X_DDS 特定機種で差枚+1000枚以上を80%」の証拠が出たら再評価

## 例
みとや Branch E: jug xdds_payout=99.12%, delta=+1.94, stable=True
ただし絶対値として99%台であり、期待値はほぼ等価（1万G消化でも差枚+190程度）

