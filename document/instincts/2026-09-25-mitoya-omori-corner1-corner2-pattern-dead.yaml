# みとや大森町の角番効果は「消えた」のではなく「島によって残り方が違う」(ホール全体平均では見えない)

## Core claim
2026-06-07に確立した「通路側角番(rank_from_aisle=1)は中間の2〜4倍の成績」というパターンは、
2026-09-24のホール全体平均では再現しなかったが、島単位で見ると健在な島(バラエティ島)、
形を変えて残っている島(ネオアイム島=半分単位の優位)、無関係な個別台の強さに置き換わった島
(北斗島)が混在しており、「角番効果が死んだ」という結論はホール全体平均だけを見た誤診断だった。

## Evidence
- n_observations: 1日(2026-09-24)、ホール全体+3島の個別分析
- data scope: single-hall(みとや大森町店)
- metric scope: diff / bb_probability / rb_probability
- result summary:
  - ホール全体平均: aisle=1(角1)+253.9(n=18、過去水準+617/+637の半分未満)、aisle=2(角2)-949.7(マイナス)。
    最も強かったのはaisle=5(+1721.2)・aisle=11(+1419.9)・aisle=8(+923.4)・aisle=17(+978.6)
  - ネオアイムジャグラーEX島(675-691、17台): 角1-8(675-682、通路側前半)はG6800-8200・大半プラス、
    角9-17(683-691、奥側後半)はG数低め・大半マイナス。「片側半分がまとまって強い」構造に変質
  - 北斗の拳島(591-595、5台): 592のみBB1/66.5・RB1/305.4と両方高く+3792。594はBB1/53.6と
    異常に高いがRB1/428.8は悪く+3319 ― BB(AT当選)の短期偏りだけで説明でき低設定のマグレの
    疑いが強い。591/593/595はBB・RBともに悪い。角番の交互パターンではなく個別台の強さの問題
  - バラエティ島(745-755、11台): 745(角1、ディスクアップ、+4483)と755(角11、シンフォギア、+2042)の
    両端がプラス、中間9台は749以外マイナス。過去確立パターンがそのまま再現

## Interpretation
- ユーザーが「マイジャグの角1・角2が定番だったが有効でなくなっている」と感じた実感自体は正しい
  (マイジャグラーV角1の641,674は両方マイナス)が、これを「ホール全体で角番効果が消えた」に
  一般化するのは誤り。島の構造・機種・個別台のBB/RB組み合わせで見え方が全く異なる
- n=1日のみの検証。今回強かった島単位の構造(ネオアイム前半優位・バラエティ両端優位)が
  再現するかは継続確認が必要
- 差枚だけでは低設定のマグレ(594のようなBB偏り)を高設定と誤認するリスクがある。
  BB確率・RB確率を両方見て、両方高い台(592)と片方だけ高い台(594)を区別する

## Action
- みとや大森町の角番分析は、ホール全体平均に丸めず**島単位**で行う
- 差枚がプラスの台は必ずBB確率・RB確率の両方を確認し、片方だけ良い場合は「マグレの可能性」を
  明記する(BBのみ高い594のようなケース)
- 次回以降の答え合わせで、今回観測した3パターン(通路側前半優位/両端優位/個別台優位)が
  他の島でも再現するか、島ごとに蓄積する
- 角番分析は二値(角1 vs 奥側)ではなく、rank_from_aisle全域・島単位で見る
  (binary-categorization-hides-middle-positions instinctと同じ注意が必要)

