# 来店日の予測は「過去回の機種履歴」より「当日の予告で筆頭に名指しされた機種」を優先して読む

## Core claim
楽園蒲田のワロス来店日では、過去の来店日の成績が悪かった機種でも、その日の予告が**筆頭**（1/2⑤⑥の名指し、「12番以内ならこれ」）に挙げていれば出ている。過去回の機種履歴だけを根拠に「避ける」へ置くと、最大の当たり機種を逃す。標本は4例で、法則ではなく監視中の仮説。

## Evidence
筆頭の名指しとその日の機種平均差枚（楽園蒲田、ワロス来店日）：
- 8/27：転生の章2 +1,881（成立）、Lカバネリ −2（不成立）
- 9/23：ヴヴヴ2（1/2⑤⑥筆頭）+4,643（成立）
- 10/23：SAO2（1/2⑤⑥筆頭）+6,449、12台中9台が+2,000以上（成立）。SAO2は7/25・8/27・9/23には演者寄せの添え物で、−1,567/−646/−829と3回とも負けていた。10/23の予測はこの履歴を理由に避ける側へ置いて外した。
- 総差枚は4回ともプラス（+14,980〜+238,795）。10/23は+215,269で、予測文書の想定（+15k〜+100k）を超えた。

## アクション
1. 予告本文から「筆頭」の名指しを先に抜き出し、「次点」「高頻度対象」「演者寄せ」と区別する。
2. 筆頭の機種を過去回の機種履歴だけで「避ける」に置かない。台数が多い機種は1回の仕掛けで平均が大きく動く。
3. 筆頭が複数ある日（転生とカバネリなど）は、両方を候補に残す（8/27は片方だけ成立）。
4. 次回以降の来店日に筆頭の名指しを台帳へ追記し、成立数を数える。5例以上で割れたら取り下げる。
5. 総差枚の想定は4回の幅（+15k〜+240k）で置く。+15k〜+100kと下に寄せない。

## 例
10/23の予測文書で、判断は「ヴヴヴ2を軸」、SAO2は「12番以内なら例外」と書いたが、避ける側に置いた。結果はSAO2が日平均+367に対し+6,449、ヴヴヴ2は+1,376（中央値は−857で2台が牽引）。

## 限界
- 標本は4例。筆頭に挙がった機種のうち、転生とカバネリは割れている。
- SAO2は3244と3245の差枚がどちらも+15,477で一致しており、入力の重複の可能性がある（元データ未確認）。この2台を外すとSAO2の10台平均は約+4,640に下がる。
- 日平均の約36%がSAO2の12台で、筆頭機種の効果はホール全体の高さと切り分けていない。

