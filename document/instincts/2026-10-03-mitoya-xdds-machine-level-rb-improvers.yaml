# みとやのX日は、台数と無関係に広く底上げされ、RB確率で改善が続く機種は少数に絞られる

## 背景
2026-10-03、みとや大森町店で、X_DDS日と、それ以外の日を、機種ごとに比べた(機械割とRB確率、曜日の混ざりを揃え、日ごとのブートストラップ)。
- **台数との関係は無い**: 機種ごとの機械割差の平均は、5台まで+1.64pt、6〜11台+2.33pt、12〜20台+1.55pt、21台以上+2.29pt(全期間)。台数と機械割差の相関0.04。直近3か月では、21台以上と5台以下の差が-0.11pt(区間-5.7〜+5.2pt)で、差があるとは言えない。平均は少数の突出した機種(ヨルムンガンド、ゴッドイーター、マギアレコード)に引っ張られ、中央値は台数帯を問わず+0.4〜+1.1pt。
- **回転数の増加は設定の根拠にならない**: X日の回転数は、ほぼ全機種でそれ以外の日の1.3〜1.8倍。機械割が上がらない機種(サンダーV、機械割差-0.4pt、RB確率比-3%、区間-13.7〜+8.7%)でも1.26〜1.36倍に増える。台数と回転数比の相関は-0.01。回転数が増え、かつ機械割(またはRB確率)も上がった機種だけを、設定の手がかりとして扱う。
- **RB確率がX日に上がる機種(曜日調整、直近3か月・4/27以降・全期間の順)**: ミスタージャグラー(5台)+8.0%、+5.7%、+6.4%(4/27以降と全期間はBH補正後も残る)、ジャグラーガールズ(6台)+7.9%、+5.8%、+4.7%、クレアの秘宝伝(BT)は4/27以降+11.3%(区間0.7〜21.1%)と全期間+6.9%、北斗(AT初当り、39台)は直近3か月+20.5%(区間-4.0〜+44.5%)で全期間+7.7%(補正後に残る)、戦国乙女4は全期間+7.6%。直近3か月だけでは、X日が12〜18日で、補正後に残る機種はない。大きさは、ジャグラーの設定1と6のRB確率の開き(約17%)の3分の1〜半分。
- 上がらない機種: サンダーV(全期間-3.1%、直近3か月-3.0%)、異世界かるてっと(直近3か月-14.6%、区間-30.4〜+11.2%)。いずれも区間が0をまたぎ、「悪化」の証拠ではなく「上がらない」まで。

## アクション
- みとやのX日は、台数の大小で機種を選ばない。
- 候補: ミスタージャグラー、ジャグラーガールズ、クレアの秘宝伝、北斗(候補)。上がらない側: サンダーV。
- 10月のX日(10/4、7、14、17、24、27)で、同じ機種のRB確率が+5%以上になるかで再判定する(ミスターとガールズ、台帳に事前登録予定)。
- 評価は、直近3か月を主にして、4/27以降と全期間を並べる(`hall-axis-scan`の期間ルール)。
- 関連: mitoya-old-theory-retest-corner-reversal-xdds。

## 例
ミスタージャグラーは、4/27以降でX日のRB確率が1/338、それ以外の日が1/352で、RB比+5.7%(区間+0.3〜+12.2%)。
