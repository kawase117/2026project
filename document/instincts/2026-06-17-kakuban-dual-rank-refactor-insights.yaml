Codex は後方互換補完ロジックを追加して解決したが、プロンプトに明記がなかったため試行が増えた。

## アクション
CSVスキーマ変更プロンプトには必ず以下を追記する:
「_read_coordinates は新列がない場合に section 内の machine_number 順から補完する
フォールバックを入れること。テスト用 fixture CSV は新列を持たない可能性がある。」

追記テンプレ:
```
_read_coordinates のフォールバック: rank_from_min / rank_from_max がCSVに存在しない場合は、
section 内で machine_number を昇順ソートしてその順位を rank_from_min とし、
逆順の順位を rank_from_max として補完する。テスト fixture 互換のため必須。
```

