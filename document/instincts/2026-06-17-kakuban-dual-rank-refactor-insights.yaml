| 角15 | 336.9 | 64.7 | +272 | 1.3e-6 |
| 角1 | 285.4 | 29.8 | +256 | 2.6e-5 |
| 角16 | 304.3 | 36.5 | +268 | 3.1e-4 |
| 角2 | 356.5 | 143.7 | +213 | 8.2e-4 |
| 角14 | 341.2 | 121.8 | +219 | 8.2e-4 |

角15・16は3Fセクション（多くが16〜22台）で「端から2番目」に相当する。

## アクション
- 蒲田7 3F Aタイプのイベント日は角1（コーナー）または角15前後を優先する
- 角1 = rank_from_min=1 OR rank_from_max=1 → そのセクションの両端台が候補
- 角15前後 = コーナーから15番目（= 端から2番目の台、コーナーの隣の隣）
- 物理解釈: ホール側がイベント日にコーナー台・その隣を目立つ位置として高設定を配置している可能性
- 有意でないポジション: 角9, 11, 18, 19, 20, 21, 22 → 中間・最深部は相対的に弱い

