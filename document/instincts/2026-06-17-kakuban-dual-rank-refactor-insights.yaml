# 角番は両端からの2値 — rank_from_min と rank_from_max を同時に保持する

## 背景
2026-06-17 セッションでユーザーより訂正。
旧実装（KAKUBAN_RULES）は「メイン通路＝台番号小側」と仮定して rank_from_min のみを角番とした。
正しくは「どちら側がメイン通路かはランダム」であり、各台は両端から数えた2つの角番を同時に持つ。
例: section 2001-2010 の台 2002 → 角番2（min側）かつ角番9（max側）。

## アクション
- 各台の角番は rank_from_min と rank_from_max の2カラムとして保持する
- 「角N台を選ぶ」= rank_from_min == N OR rank_from_max == N
- 集計時は _expand_dual_kakuban() で1台-日行を2行展開してから groupby する:
  ```python
  def _expand_dual_kakuban(frame):
      part_min = frame.copy(); part_min["kakuban"] = part_min["kakuban_min"]
      part_max = frame.copy(); part_max["kakuban"] = part_max["kakuban_max"]
      return pd.concat([part_min, part_max], ignore_index=True)
  ```
- min(rank_from_min, rank_from_max) の単純集約は補助的には使えるが、メイン分析では2行展開を使う
- 旧 KAKUBAN_RULES・_sort_rank・_resolve_kakuban_rule は廃止
- 座標CSV（Heatmap/*_floor_coordinates_*.csv）の rank_from_min / rank_from_max 列を直接使用

## 例
kamata_weekday_event_axis_eda.py の対応箇所:
```python
# _build_segment_frame 内
merged["kakuban_min"] = pd.to_numeric(merged["rank_from_min"], errors="coerce").astype("Int64")
merged["kakuban_max"] = pd.to_numeric(merged["rank_from_max"], errors="coerce").astype("Int64")

# メインループ内
if axis_name == "kakuban":
    ordered_frame = _expand_dual_kakuban(segment_frame)
else:
    ordered_frame = segment_frame.copy()
```

