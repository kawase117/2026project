# Section size effect is DD-independent -- no interaction term needed

## Background
ANOVA across 31 DDs found only 2 DDs (9 and 31) with significant section_size effect
(p<0.05). Medium island dominates at 101.76% vs small 101.17% / large 101.23% across
ALL DDs uniformly. The lack of significant interaction means section_size and DD
contribute independently to pay_rate.

## Action
Do NOT add section_size x DD interaction features to ML models. Use section_size and
DD as separate main effects. This reduces feature space without losing predictive power.
The medium island advantage (101.76% vs ~101.2%) is stable and does not depend on
which day of the month it is.

## Example
# Unnecessary: features["section_dd_interaction"] = section_size * dd
# Sufficient: features["section_size_group"] = "medium"  # main effect only
#             features["dd"] = 7  # main effect only

