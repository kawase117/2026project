# LR split has zero predictive value even at DD granularity

## Background
L=101.49% vs R=101.43% across all 31 DDs -- difference of 0.06pp. Heatmap shows no
DD-specific LR reversal pattern. This confirms the prior finding that LR split is
1000x weaker than section_size, and the DD dimension does not rescue it.

## Action
Exclude LR as a feature in ML models for Kamata7. Do not attempt DD x LR interaction
terms. The physical left/right position within a section carries no exploitable signal.

## Example
# Drop: features["lr_position"] = "L"  # noise, not signal
# Drop: features["dd_lr_interaction"] = dd * lr  # doubly useless

