# 3F_N is the hall's adjustment valve -- first to be cut, last to benefit

## Background
Segment hierarchy: 2F_N (101.97%) > 3F_A (101.45%) > 3F_N (100.50%). 2F_A is empty
(no A-type machines on 2F pass min_games filter). On good days (DD=7), 3F_N rises to
102.4%. On bad days (DD=1-4, 18-23), 3F_N drops below 100%. Month-end (DD=30) shows
2F_N at 103.9% but 3F_N at only 100.6% -- the hall concentrates investment in 2F.

## Action
When building per-segment models, treat 3F_N as having the worst signal-to-noise ratio.
Consider segment x DD interaction for 3F_N specifically since its DD sensitivity is
highest. For practical prediction, 2F_N is the most predictable segment.

## Example
# DD=7:  2F_N=103.1, 3F_A=102.0, 3F_N=102.4 (all up -- event effect)
# DD=30: 2F_N=103.9, 3F_A=102.3, 3F_N=100.6 (2F only -- selective investment)
# DD=29: 3F_N=99.2 (bottom -- pre-month-end squeeze)

