# Top5/Bottom5 DD asymmetry reveals hall investment calendar

## Background
Top5 DDs by pay_rate: {7(102.83), 30(101.73), 27(101.47), 17(100.73), 11(100.72)}.
All are event days or their neighbors. Bottom5: {23(98.56), 19(98.88), 29(98.91),
18(98.92), 20(99.21)}. All non-event, concentrated in DD 18-23 (pre-payday trough).
The spread is 4.27pp (102.83 - 98.56), which is substantial.

## Action
Use this asymmetry in two ways: (1) a continuous DD feature captures the full shape,
(2) a binary "trough_dd" flag for DD 18-23 may add value as a complementary signal
alongside the existing is_event_dd flag. The trough is as informative as the peaks.

## Example
# Top: DD=7 (102.83%), DD=30 (101.73%), DD=27 (101.47%)
# Bottom: DD=23 (98.56%), DD=19 (98.88%), DD=29 (98.91%)
# Trough zone: DD 18-23, all below 99.5%
