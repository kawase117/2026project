# DD 1-31 full spectrum is superior to early/mid/late banding

## Background
Compared DD banding (early/mid/late) vs DD 1-31 raw values. Fullspectrum reveals
spike patterns at DD=7,27,30 and valley at DD=18-23 that banding completely obscures.
Top5 DDs {7,30,27,17,11} all align with event day definitions. Bottom5 {23,19,29,18,20}
are all non-event days concentrated in the pre-payday trough.

## Action
Use DD as a raw integer feature (1-31) in ML models rather than banding into
early/mid/late. Consider cyclic encoding (sin/cos) if model requires it, but
preserve the full resolution. The is_event_dd flag remains useful as a complementary
binary feature.

## Example
# Bad: dd_band = "early" if dd <= 10 else "mid" if dd <= 20 else "late"
# Good: features["dd"] = date.day  # raw 1-31
# Also good: features["dd_sin"] = np.sin(2 * np.pi * dd / 31)

