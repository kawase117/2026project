# イベント日戦略の島サイズ依存パターン

## 背景
蒲田7 で DD（日付）ごとの peak rank を調査したところ、イベント日（1,4,7,11,14,17,21,22,25,28,30,31）と通常日での peak rank が異なる。特に島サイズに依存：

**large 島**:
- 2F: イベント日 9.25 vs 通常日 7.89 (差 +1.36) ← 外寄りシフト
- AT: イベント日 9.33 vs 通常日 7.26 (差 +2.07) ← 強い外寄りシフト

**medium 島**:
- 3F: イベント日 5.58 vs 通常日 7.16 (差 -1.57) ← 中央寄りシフト

**small 島**:
- イベント日が pay_rate で -0.44pp（逆に弱い）← 矛盾・要検証

## アクション
1. イベント日の定義を再検証（small島の逆転現象は異常）
2. large 島ではイベント日に外寄り（角9-13）に設定を集中
3. medium 島ではイベント日に中央寄り（角5-7）に設定を集中
4. 大島戦略に合わせた客のターゲット位置の予測

## 例
```
イベント日の戦略（推測）:
  large 島: 外寄り優遇 (+1.36～+2.07pp)
  medium 島: 中央優遇（3F/AT で -1.57pp）
  small 島: 特別な戦略不明
```

