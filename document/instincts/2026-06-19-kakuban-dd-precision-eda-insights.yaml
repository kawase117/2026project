# DD トレンドの予測困難性

## 背景
DD ごとに最強角番（peak rank）を調査したところ、変動が大きく単純な予測が困難であることが判明：

```
2F の例:
  DD 1 (イベント日): small=5, medium=5, large=13
  DD 2 (通常日):    small=2, medium=7, large=11  ← 大きく変わる
  DD 3 (通常日):    small=5, medium=6, large=9
```

イベント日マーク（★）との相関も弱い → 現在のイベント日定義が正確でない、または他の要因（曜日、給料日周期、ゾロ目、月初月末など）が優位である可能性。

## アクション
1. DD ベースの単純予測は避ける
2. DD を以下の軸で細分化：
   - 給料日周期（1日, 11日, 21日, 25日）
   - ゾロ目日（11日, 22日）
   - 週末（金土日）vs 平日
   - 月初（1-10日）vs 月中（11-20日）vs 月末（21-31日）
3. セクションサイズ×DD×セグメントの3軸での交互作用を検証

## 例
改善方針：
```
# 現在（困難）
peak_rank = func(DD)

# 改善案
peak_rank = func(DD_category, weekday, section_size, segment)
```

