# セクションサイズ別の最強角番分化

## 背景
蒲田7 の precision EDA で、島のサイズによって最強角番が異なることが判明：
- small (≤8台): 角5（機械割 100.80%）
- medium (≤14台): 角6（機械割 102.27% — 最強）
- large (>14台): 角11（機械割 101.88%）

つまり「角5-9 が最強」という前回の仮説は、セクションサイズを無視していた。大島では外寄り（角11-13）が相対的に強くなる。

## アクション
kakuban 分析では必ず `section_size_group` でストラティファイ（層別）する：
1. 全セグメント×セクションサイズの組み合わせで集計
2. セクション別の pay_rate / peak rank を比較
3. island ごとの rank_from_min 定義を物理レイアウトで検証

## 例
```
2F:
  small:  角5 最強 (100.80%)
  medium: 角6 最強 (102.27%)
  large:  角11 最強 (101.88%)
```

Output: `ml/analysis/results/kamata7_kakuban_dd_precision_eda/kamata7_peak_ranks_by_dd_sectionsize.csv`

