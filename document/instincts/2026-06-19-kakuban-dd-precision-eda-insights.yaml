# Groupby キーの型不一致（section_size vs section_size_group）

## 背景
Codex の実装で aggregated テーブルが全て空になった（eligible_rows = 0）。原因は `section_size`（数値：実際の機械数）と `section_size_group`（カテゴリ："small"/"medium"/"large"）を混同していたこと。`section_size.isin(["small","medium","large"])` は常に False を返す。

## アクション
EDA で section_size_group のようなカテゴリ化列を使う場合、以下を確認：
1. groupby キーとして使う列が「実値」か「カテゴリ」か明確にする
2. フィルタ条件に同じ列を使う（混合しない）
3. テストデータに使用する全カラムを含める（補助列を忘れやすい）

修正例：
```python
# ❌ 誤：section_size は数値
work = work[work["section_size"].isin(["small", "medium", "large"])]

# ✅ 正：section_size_group を使う
work = work[work["section_size_group"].isin(["small", "medium", "large"])]
```

## 例
`ml/analysis/kamata7_kakuban_dd_precision_eda.py` line 208, 227, 251, 301 で修正

