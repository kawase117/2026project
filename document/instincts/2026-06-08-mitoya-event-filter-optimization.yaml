# 「5・15・25日はジャグラーが熱い」という業界一般の経験則は、みとや大森町には当てはまらない（実証的に棄却）

## 背景
ユーザーが「もしかして5・15・25のDDでジャグラー104%超えが集中していませんか？5のつく日はジャグラーを遊技するホールが多い」という仮説を提示した。これは業界で広く語られる経験則の一種。

実際にみとやのジャグラー系6機種（マイジャグラーV、アイムジャグラーEX-TP/EX、ゴーゴージャグラー3、マイジャグラーM、ファンキージャグラー2）に絞り、`5,15,25` のDD と それ以外の通常日（イベント日除く）の機械割・104%超え率を比較したところ、差はわずか約0.4ptで、誤差範囲内だった。**仮説は明確に棄却**された。

これは前項の「店舗固有のイベント日は実データから逆引きすべき」の系として、「業界一般の経験則も、対象ホールの実データで検証せずに採用してはならない」ことを示す具体例である。みとやの真のイベント日は `{1,4,7,14,17,24,27,30}` であり、5/15/25とは無関係だった。

## アクション
- 「業界では一般的に〇〇と言われている」という仮説をユーザーやドメイン知識から受け取った場合も、必ず対象ホールの実データで検証してから採用・棄却を判断する。経験則は店舗間でばらつきが大きい（[[mitoya-event-day-definition-and-selection-bias-in-min-games-filter]] で確認した通り、イベント日自体も店舗固有）。
- 検証時は対象機種を明示的にフィルタし、「対象群 vs 対照群」の差分が±0.5pt程度に収まる場合は「効果なし」と判断してよい（このケースの差は0.4ptで、ノイズと区別できない）。
- 仮説が棄却された場合も、それ自体を記録する価値がある——将来同じ仮説が再提示された時に再検証する手間を省ける。

## 例
```python
juggler_machines = ['マイジャグラーV', 'アイムジャグラーEX-TP', 'ゴーゴージャグラー3', ...]
# 5,15,25 dd vs その他通常日（イベント日除外）で機械割・104%超え率を比較
# → 差は約0.4pt、統計的に意味のある差ではない → 仮説棄却
```
