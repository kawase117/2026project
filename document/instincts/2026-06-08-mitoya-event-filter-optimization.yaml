# みとや大森町：島（台番号レンジ）別のイベント効果は均一ではなく、最大5倍の差がある

## 背景
ユーザーから「みとやのセグメントは2F/3Fでも機種タイプでもなく、列・島で行う」という指示があり、台番号レンジに基づく島区分を定義した：
- `other`: machine_number < 641
- `main_jug`: 641 ≤ machine_number < 692
- `main_mix`: 692 ≤ machine_number < 832
- `bari`: machine_number ≥ 832

この区分でイベント日効果（104%超え率の event-normal 差分）を比較したところ、島ごとに大きく異なることが判明した：
- **other**: +1.7pt（最大の効果）
- **main_jug**: +1.3pt
- **main_mix**: -0.3pt（実質効果なし）

つまり「イベント日には店全体で高設定が増える」という単純な仮定は誤りで、特定の島（other, main_jug）に集中投入され、main_mix島はイベント日でも普段と変わらない可能性が高い。これは「島別サブモデル」というアプローチの統計的根拠となった。

## アクション
- ホール全体への一律施策（イベント日の高設定投入など）を仮定する前に、空間的セグメント（島・列・台番号レンジ）別に効果を分解して検証すること。効果が均一でない場合、全体平均は実態を覆い隠す。
- セグメント別に効果の大きさが異なる（このケースでmain_mixは事実上ゼロ）場合、ML学習はセグメント共通の単一モデルではなく、セグメント別サブモデル（このケースでは島別CatBoost）を検討する根拠になる。
- セグメント定義はホールごとに固有（みとやは「島・台番号レンジ」、他ホールは「フロア」や「機種タイプ」が有効な場合もある）。ユーザーのドメイン知識（実店舗のレイアウト理解）を最優先し、汎用的な区分（2F/3F等）を当てはめないこと。

## 例
```python
def assign_island(machine_num):
    if machine_num < 641:   return 'other'
    elif machine_num < 692: return 'main_jug'
    elif machine_num < 832: return 'main_mix'
    else:                   return 'bari'

# island別にイベント効果を分解 → main_mixは効果ゼロと判明、サブモデル分割の根拠に
for island in ['main_jug', 'main_mix', 'other']:
    effect = df_event[df_event.island==island].target_104.mean() - df_normal[df_normal.island==island].target_104.mean()
```

