# みとや大森町：イベント日定義の確定とmin_gamesフィルタが生む選択バイアスの実証

## 背景
ユーザーから「みとや大森町の個別台予測を機械割104%超え基準で深堀りしたい。アイデアは『3000G未満排除』と『イベント日限定』くらい」という相談を受けた。

調査の過程で2つの大きな誤りを発見・修正した。

1. **イベント日定義の誤り**：最初は一般的なパチスロ慣習（給料日25日・月初1日・ゾロ目11/22日など）から `{1, 11, 22, 25, 30, 31}` と推測したが、これは誤りだった。ユーザーの指摘で全期間データ（137,522行、2025-01-01〜2026-06-07）のDD別104%超え率を集計したところ、上位7日が `{1, 4, 7, 14, 17, 24, 27, 30}` で完全に一致した（このセットの104%超え率31.5% = 全DD中最高）。**店ごとのイベント日は推測ではなく、実データのDD別集計で逆引き確定すべき**。

2. **min_gamesフィルタによる選択バイアス**：「3000G以上」フィルタを通常日に適用すると、平日に3000G以上回る台はマイジャグラーV系統に極端に偏る（フィルタ後サンプルの76.1%がマイジャグラーV）。これにより通常日の見かけの機械割が98.51%→100.30%まで不自然に押し上げられ、「通常日でも勝てる」という誤った印象を生んでいた。
   - 無フィルタ：イベント日100.05% / 通常日98.51%（差 +1.54pt、自然な差）
   - 3000G+フィルタ：イベント日101.59% / 通常日100.30%（差 +1.29pt、ただし両方の絶対値が嵩上げされて見える）
   - フィルタ通過率の非対称性が証拠：イベント日69.8% vs 通常日45.2%

## アクション
- **店舗固有のイベント日は仮説ではなくデータから逆引きする**：DD（1〜31）ごとに「機械割104%超え率」または「平均差枚」を集計し、上位グループの顔ぶれが綺麗に分かれていれば、それがその店の実際のイベント日パターン。一般的なパチスロ慣習（給料日・ゾロ目など）をそのまま当てはめてはならない（店ごとに全く異なる）。
- **min_games等のフィルタを「条件A vs 条件B」の比較に使う際は、フィルタ通過率が両条件で同じ程度かを必ず確認する**。通過率が大きく異なる場合（例：69.8% vs 45.2%）、フィルタは比較対象を変質させており、結果に意味がない。
- **正しい比較のための非対称フィルタ戦略**：イベント日（自然に高G数台が多い）はフィルタなしで全数比較し、通常日（自然に低G数台が混在）には軽いフィルタ（このケースでは1500G+）をかけて「信頼できる稼働のみ」に揃える、という非対称な前処理が公平な比較を可能にする。同一フィルタを両条件に同じ閾値で適用することが「公平」とは限らない。
- **フィルタ後の機種構成を必ず確認する**：「フィルタ後に機械割が上振れした」場合、それが本当の効果なのか、特定の機種（このケースではマイジャグラーV）が選択的に生き残った結果なのかを、機種名TOP30・台番号TOP50などの構成分析で切り分ける。

## 例
```python
# NG: 両条件に同じ高閾値フィルタを適用 → 通過率の非対称性で比較が歪む
df_event = df[(df['is_event']==1) & (df['games_normalized']>=3000)]
df_normal = df[(df['is_event']==0) & (df['games_normalized']>=3000)]
# → イベント日通過率69.8% vs 通常日45.2%。後者は特定機種(マイジャグラーV 76%)に偏り、機械割が嵩上げされる

# OK: 非対称フィルタで「自然な構成」を保ったまま比較
df_event = df[df['is_event'] == 1]  # フィルタなし（全台、自然な構成のまま）
df_normal = df[(df['is_event']==0) & (df['games_normalized'] >= 1500)]  # 軽いフィルタで信頼性のみ担保
# 結果: event 31.5% / normal 30.1% (差+1.4pt) — 真の効果量
```

