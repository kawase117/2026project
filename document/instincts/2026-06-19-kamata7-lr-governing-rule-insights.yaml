# 角番効果は全域で有意、末尾効果はL側+3F_Rでのみ有意（2F_Rだけ角番単独支配）

## 背景
蒲田7のN機を対象に、4領域（2F/3F × L/R）で末尾(raw_digit)と角番(kakuban)の
Kruskal-Wallis検定を実施した結果:

| 領域  | 末尾p      | 角番p       | 支配ルール     |
|-------|-----------|------------|--------------|
| 2F_L  | 0.038 ✓   | 0.000002 ✓ | 末尾+角番 二重 |
| 2F_R  | 0.400 ×   | 0.00025 ✓  | 角番のみ      |
| 3F_L  | 0.00001 ✓ | 0.00002 ✓  | 末尾+角番 二重 |
| 3F_R  | 0.015 ✓   | 0.00002 ✓  | 末尾+角番 二重 |

角番はp<0.001で全領域共通の普遍的効果。
末尾は2F_R（p=0.400）でのみ完全に消失。他3領域は有意。

## アクション
- 2F_Rを打つ場合: 末尾は無視し、角番ポジション（角2/角N-1優先）のみで台選択する。
- 2F_L/3F_L/3F_Rを打つ場合: 末尾ランキングと角番ポジションの両方を参照して絞り込む。
- 3F_Lは末尾効果が最大（p=0.00001, range=444）。末尾選択の精度が最も効くフロア×サイド。

## 例
2F_Rで末尾d6を狙う戦略 → 無意味（p=0.400）。角N-1を狙う戦略 → 有効（p=0.00025）。
3F_Lで末尾d8を狙う戦略 → 非常に有効（p=0.00001）。角番との二重フィルタで精度最大化。

