# section内相対位置(pos_from_left/right)はraw_digitを改善しない — 末尾は位置の代理変数ではない

## 背景
仮説: R側で末尾効果が消えるのは、sectionごとの台番号開始位置がずれているため。
section内の相対位置（rank_from_min % 10 / rank_from_max % 10）で補正すれば回復するはず。

検証結果（N機、12パターン）:
- 2F_L: raw p=0.038 ✓ → pos_left p=0.652 ×（悪化）
- 2F_R: raw p=0.400 × → pos_left p=0.291 ×（改善せず）
- 3F_L: raw p=0.00001 ✓ → pos_left p=0.001 ✓（raw>left）
- 3F_R: raw p=0.015 ✓ → pos_left p=0.076 ×（悪化）

全4領域でraw_digitが最良または同等。pos_from_left/rightは改善ゼロ。
L側のSpearman ρ(raw, pos_left) = 0.345（弱相関）。
「L側で開始番号が揃っている」仮説も棄却。

結論: ホールは「島の何番目に置く」（位置ベース）ではなく、
「末尾Xの台に入れる」（台番号ベース）の戦略を採用している。
末尾が物理位置の代理変数ならpos補正で改善するはずだが、逆に悪化する。

## アクション
末尾分析ではraw_digit（machine_number % 10）をそのまま使う。
section内相対位置への変換は不要（悪化するだけ）。
ホールの設定投入ルールは台番号の末尾（下1桁）そのものに基づくと考えるべき。

## 例
2F_L: raw_digit p=0.038（有意）→ pos_from_left p=0.652（非有意に悪化）。
補正すると島ごとの開始番号差でシャッフルされ、台番号ベースの真のシグナルが壊れる。
3F_R: raw_digit p=0.015（有意）→ pos_from_left p=0.076（非有意に悪化）。
こちらもraw_digitが正しい分析軸。

