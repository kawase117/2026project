# 3F_Lが末尾シグナル最強（p=0.00001, range=444）— 末尾精度を活かすなら3F_L

## 背景
4領域の末尾効果の強さ比較:
| 領域  | H統計量 | p値       | effect_range | n      |
|-------|---------|----------|-------------|--------|
| 3F_L  | 38.5    | 0.00001  | 443.8       | 12,519 |
| 3F_R  | 20.5    | 0.015    | 212.2       | 42,625 |
| 2F_L  | 17.8    | 0.038    | 247.7       | 23,991 |
| 2F_R  | 9.4     | 0.400    | 134.4       | 93,024 |

3F_Lは H=38.5（他の2倍以上）、p=0.00001（他より3桁小さい）、range=444（最大差枚幅）。
末尾選択による差枚差が最も大きい領域。

3F_LにはA機とN機が混在（3F全体でA53%:N47%）。
N機のみでこの結果なので、A機を含めるとさらに構造が異なる可能性あり。

## アクション
末尾選択の精度を最大限に活かしたい場合、3F_Lを打つ。
3F_Lでは末尾ランキングの上位/下位で最大444の差枚差がある。
2F_Lでも248の差があるが、3F_Lの半分強。
2F_Rでは末尾による差は実質ゼロ（ランダムと同等）。

## 例
3F_L × 最適末尾: avg_diff差が最大444 → 年間100日通えば44,400の累積差
2F_R × 任意末尾: avg_diff差が最大134だが非有意 → 末尾選択に意味なし
末尾の「腕」を活かすなら3F_Lが圧倒的に有利。
