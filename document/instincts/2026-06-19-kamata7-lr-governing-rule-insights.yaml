# 末尾効果は「台番号ベース」の投入ルールを反映 — 物理配置ではなく番号管理

## 背景
section-relative digit分析の結果、2つの仮説を検証できた:
仮説A「末尾は物理位置の代理変数」→ 棄却（pos補正で悪化）
仮説B「ホールは台番号の末尾を見て設定を決める」→ 支持（raw_digitが最良）

これは運営実務の観点で合理的:
- ホール店員は台番号（例: 2156）で管理している
- 「末尾6の台に設定を入れる」という指示は簡潔で実行しやすい
- 物理位置（島の左から何番目）は台番号ほど明示的でなく、指示ミスが起きやすい
- 台番号管理はPOSシステムとも連動しており、業務フローに自然に組み込まれる

2F_Rだけ末尾効果が消える理由は:
- 2F_Rの台数が最多（93,024観測、全体の54%）で統計的に薄まりやすい
- または2F_Rでは別の管理単位（島番号、台グループ等）で決定している可能性

## アクション
末尾分析は必ずraw_digit（machine_number % 10）で実施する。
メカニズム解釈では「物理配置パターン」ではなく「番号管理パターン」として扱う。
ホール運営の台番号管理に基づく設定投入ルールの推定として位置づける。

## 例
「d6の台に設定を入れる」→ 2006, 2016, 2106, 2116, ... が全て対象
→ これらは島を跨いで分散しているが、末尾6という共通点で投入される
→ 物理位置はバラバラでもdigit効果として検出される
→ pos_from_leftに変換すると、この台番号ベースの一貫性が壊れて信号が消える

