# 2F_Rは蒲田7で唯一の「角番単独支配」領域 — 末尾は完全に無効

## 背景
2F_R（N機, n=93,024）での検定結果:
- raw_digit: H=9.4, p=0.400（非有意）
- pos_from_left: H=10.8, p=0.291（非有意）
- pos_from_right: H=14.3, p=0.114（非有意）
- kakuban: H=21.5, p=0.00025（有意）

3種類のdigit定義すべてで非有意。section内の相対位置に補正しても回復しない。
2F_Rでは末尾（台番号の下1桁）は設定投入と無関係。
角番（角1/角2/中間/角N-1/角N）だけが成績を左右する。

## アクション
2F_Rでの台選択は角番ポジションに集中する:
- 角2/角N-1を優先（先行instinctの角番ランキング参照）
- 末尾による絞り込みは一切行わない — ランダムと同等
- 2F_Rに行くと決めた時点で、末尾早見表は参照不要

## 例
2F_R × d6（N機末尾1位）を狙う → 2F_Rでは末尾効果なし、意味がない。
2F_R × 角N-1 を狙う → 角番効果あり（p=0.00025）、有効な戦略。
同じ2Fでも左側（2F_L）ならd6は有効（p=0.038）。打つ側で戦略を切り替える。

