# instinct汚染には2種類あり処置が異なる

## 背景
2026-05-31のリーク修正後、過去のinstinctを精査した結果、
汚染の種類によって処置が異なることが判明した（2026-06-01）。

種類1「MLモデル性能値が主体」→ contaminated/ へアーカイブ（無効化）
- AUC=0.8140、hit@2=98%、precision@2=83% 等の数値が核心
- リーク込みのモデルで計測されたため全て無効
- 例：phase9-10-breakthroughs.yaml、ml-2f-3f-strategy.yaml

種類2「実データ観察が主体」→ 警告注記を追加して保持
- diff_coins集計・曜日別パターン・台配置等の生データから得た観察
- リークはモデルの学習過程の問題であり、生データ集計には影響しない
- アクション項目がリーク前の文脈を参照している点のみ要注意
- 例：bt-digit-patterns.yaml、zorome-combined-strategy-insights.yaml

## アクション
新しいリーク修正後に過去のinstinctをレビューするとき：
1. 各instinctの核心的主張がモデル性能値か生データ観察かを判定
2. モデル性能値が核心 → contaminated/ フォルダへ移動
3. 生データ観察が核心 → LEAKAGE WARNING ヘッダーを追加して保持
4. 方法論・データ構造 → 汚染なし、そのまま保持

triage_contaminated_instincts.py でこの分類を自動実行できる。

