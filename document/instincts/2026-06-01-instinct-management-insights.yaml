# 無効化instinctはcontaminated/フォルダに移動して削除しない

## 背景
リーク修正後、MLモデル性能値が主体のinstinctを削除せずに移動を選択した。

削除しない理由：
1. 「なぜその戦略を採用したか」の歴史的経緯として残す
2. 将来リーク修正後の再検証で一部が復活する可能性がある
3. 削除すると「なぜ廃止したか」の記録が消える

## アクション
instinctを無効化するとき：
1. document/instincts/contaminated/ フォルダへ移動（削除しない）
2. ファイル先頭に無効化理由と日付を記載
3. triage_contaminated_instincts.py の ARCHIVE_FILES に追加

contaminated/ フォルダのファイルは /instinct-import では読み込まない（隔離済み）。

