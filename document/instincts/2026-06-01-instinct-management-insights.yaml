# 実データ観察はリーク修正の影響を受けない

## 背景
リーク（total_diff_coins_focus が特徴量に混入）はMLモデルの学習過程の問題。
生データの集計・観察には影響しない。

影響を受けない（有効）：
- 曜日別の平均 diff_coins（DBの生データから集計）
- 特定末尾の出現頻度・配置パターン
- ゾロ目日のホール全体差枚統計
- 機種別の稼働日数・平均差枚

影響を受ける（無効）：
- モデルが予測した hit@2・precision@2・AUC
- モデルが算出した特徴量重要度ランキング
- リーク込みモデルに基づいた戦略推奨

## アクション
過去の分析結果を再利用するとき：
「この数値はDBから直接集計されたか、それともモデルの出力か？」を確認する。
DBからの直接集計 → 有効
モデルの予測・評価指標 → リーク修正前なら無効

