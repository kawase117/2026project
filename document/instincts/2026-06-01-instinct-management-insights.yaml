# 「アプローチの再利用」と「発見の転用」は別物

## 背景
ユーザー指摘（2026-06-01）：
「同じアプローチで分かることもある。
 データ探索やホールではなく機種固有のクセなどは共通している可能性がある。」

## 転用の可否

OK（アプローチ・ツール）：
- signal_existence_plan.py などの分析スクリプト
- walk-forward の枠組み・統計検定手順
- uplift 評価の考え方

OK（機種固有のクセ）：
- 天井ゲーム数・ボーナス確率（メーカー仕様で全ホール共通）
- 特定機種の確率テーブル・天井システム

NG（ホール固有の発見）：
- 蒲田7の 2F_N 69.3% 支配、uplift 数値
- 蒲田7のカレンダールール無効という結論

## 判断基準
「この知見はメーカーが決めたことか、ホールが決めたことか？」
メーカーが決めた → 全ホール共通（転用可）
ホールが決めた → そのホール固有（転用不可）

