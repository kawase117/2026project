# 2F_R_A は DD別に有意シグナルがあるが全位置で median が負 --- アウトライア駆動のみ、実用価値限定

## 背景
kamata1_kakuban_rl_eda（2026-06-18実施）。
2F_R_A では 3 DD bin で有意

  DD 25-31  q=0.0005（最強）, top_kakuban=8
  DD 19-24  q=0.025,         top_kakuban=17
  DD 13-18  q=0.047,         top_kakuban=5

しかし DD 25-31 の全 kakuban 位置で mean>0 かつ median<0（例: kakuban=8 mean=+71, median=-134）。
アウトライア（稀な大当たり）が平均を押し上げているだけであり、median ベースの安定した優位ではない。

## アクション
2F_R_A の DD 別シグナルは統計的に有意だが median ベースの実用的シグナルとして使えない。
DD 軸で右エリアを選択する根拠はなく、通常のイベント日セクション選択（[[kamata1-2fa-event-near-universal-uplift]]）を優先する。

