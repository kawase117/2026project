# 蒲田1 2F_L_A × DD 19-24 では kakuban=6 と kakuban=8 が median 正で信頼性の高いシグナル

## 背景
kamata1_kakuban_rl_eda（2026-06-18実施）。
2F 左エリア（X<=17）を L、右エリア（X>=19）を R に分割して分析。
2F_L_A DD bin 19-24 が kruskal_q=0.0018（有意）、top_kakuban=10。

kakuban 別 mean/median/n（DD=19〜24 集計）
  kakuban=6   mean=+131, median=+86,  n=148  median 正で信頼性高
  kakuban=8   mean=+190, median=+46,  n=148  median 正で信頼性高
  kakuban=7   mean=+130, median=-6,   n=106  median 境界
  kakuban=10  mean=+216, median=-188, n=147  アウトライア駆動（mean/median 乖離）
  kakuban=1   mean=+6,   median=-200          コーナーは効果薄

kakuban=6 と kakuban=8 のみ median が正。kakuban=10 は mean が最大だが median が深くマイナスなのでアウトライア駆動。

## アクション
DD=19〜24 に蒲田1 2F 左エリア ジャグ系を訪問する場合:
kakuban=6 または kakuban=8 の台を最優先候補とする（median が正で信頼性あり）。
kakuban=10 は mean が高く見えるが median が負なので過信しないこと。
左エリアの対象: X<=17 の台（通路側から6番目と8番目）。

