# 2F_R_N DD 7-12 の kakuban=20 が median=+383（n=106）--- 小サンプルながら median 正で有望候補

## 背景
kamata1_kakuban_rl_eda（2026-06-18実施）。
2F_R_N DD bin 7-12: kruskal_q=0.021, top_kakuban=20。

kakuban 別 mean/median/n（DD=7〜12 集計）
  kakuban=20  mean=+598, median=+383, n=106  median 正の唯一の位置（ただし n 小）
  kakuban=6   mean=+271, median=-348, n=1510 アウトライア駆動
  kakuban=14  mean=+266, median=-167, n=208  アウトライア駆動

kakuban=20（最奥端）のみ median が正。他は全てアウトライア駆動。
n=106 は小サンプルなのでオーバーフィットのリスクあり。

2F_R_N DD 13-18（q=0.039）でも kakuban=13（mean=+241）が上位だが median=-135 でアウトライア駆動。

## アクション
DD=7〜12 に蒲田1 2F 右エリア AT系を狙う場合:
kakuban=20（最奥端）を参考候補として意識する（median=+383 だが n=106）。
n が小さいため過信は禁物。イベント日優先の台選択（[[kamata1-2fn-event-section-hotspot]]）を主軸とする。
2F_R_N の DD 別シグナルは全体的にアウトライア駆動であり、実運用への適用は慎重に。

