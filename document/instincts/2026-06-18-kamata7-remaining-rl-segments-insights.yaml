# 2F_R_N × DD13-18 × 角番13は弱い有意（q=0.041）— 補助参照にとどめる

## 背景
2026-06-18: kamata7_kakuban_rl_eda.py の 2F_R_N セグメント結果。
DDビン 13-18 のみ q=0.041 で有意。top_kakuban=13, mean_residual=+148。
cell_vs_rest では有意セルがゼロ（個別セルレベルでは有意でない）。

DDビン13-18内ランキング:
  kakuban=13: +148, kakuban=5: +120, kakuban=6: +120, kakuban=14: +115

## アクション
- 角番13は9セクション（2196-2212〜2330-2351）に分散しており構造的だが、
  隣接角番（5, 6, 14）との差が小さくシグナルの突出度が低い
