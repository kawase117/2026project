# N/A分割で連番検出率が1/7→3/7に改善（合算では信号が希釈される）

## 背景
全台合算で末尾TOP3の連番チェックを行うと、異なる起点を持つN機・A機の
シグナルが混ざり、連番パターンが検出されにくい。
N機（jug/hana/oki）とA機（AT系）を分けると検出率が向上した。

| 日付     | 合算判定 | N判定           | A判定          |
|----------|----------|-----------------|----------------|
| 20260425 | 非連番   | 非連番          | ★連番(起点=8)  |
| 20260509 | 非連番   | ★連番(起点=9)   | 非連番         |
| 20260418(K1) | 非連番 | ★連番(起点=2) | 非連番         |

## アクション
並び策略の不明日に対して逆算する場合は必ず N/A 分割で実施する。
```python
N_COND = '(mm.jug_flag=1 OR mm.hana_flag=1 OR mm.oki_flag=1)'
A_COND = '(mm.jug_flag=0 AND mm.hana_flag=0 AND mm.oki_flag=0 AND mm.bt_flag=0)'
```

