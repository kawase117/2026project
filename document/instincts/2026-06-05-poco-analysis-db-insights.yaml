# ぽこ分析DBは確定まで独立ファイル（poco_analysis.db）で設計する

## 背景
ぽこデータはテーブル粒度・特徴量設計・ML活用方法がまだ確定していない。
integrated.db に早期統合するとスキーマ変更が難しくなる。
poco_analysis.db として独立させ、設計確定後に結合方向で検討する。

## アクション
- `db/poco_analysis.db` を独立ファイルとして構築
- スキーマ変更が必要になっても integrated.db を汚染しない
- 確定した特徴量のみを後から integrated.db / ML パイプラインに移植

## テーブル構成
- `poco_announcements`: 日次×ホール（策略実績・推定トリプル）
- `poco_targets`: 日次×ホール×機種（発表機種の実績）

