# ぽこCSVの差枚はDBの合計差枚と同一：精度問題なし

## 背景
poco_data_v5.csv の `kamata7_diff` / `kamata1_diff` がアナスロデータと一致するか全期間検証した結果、
K7: 282件中1件不一致、K1: 210件中3件不一致（ほぼ完全一致）。
ぽこの差枚欄はアナスロDB（machine_detailed_results の SUM）を転記したものであり、
独立した測定値ではない。NaN（K7:46件、K1:118件）はDBから補完可能。

## アクション
- ぽこCSVのdiff列の精度を心配する必要はない
- NaNはDBのSUM(diff_coins_normalized)で補完（44/46件補完可能）
- `total_diff IS NULL` が残る日はDBにもデータなし（約17件）

## 例
```python
poco_diff = row['kamata7_diff']
total_diff = int(poco_diff) if pd.notna(poco_diff) else get_total_diff(conn, date)
```

