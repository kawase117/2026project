# 曜日仕掛け種別の実績ヒエラルキー（K7 全期間）

## 背景
poco_analysis.db 構築後の全期間集計（K7）。

| 仕掛け種別 | avg差枚 | 勝率  | 計算可否 |
|-----------|--------|-------|---------|
| 全台       | +2,598 | 79.9% | ✅（1件のみ）|
| 末尾ゾロ目 | +1,949 | 68.6% | ✅ |
| 末尾       | +700   | 49.5% | ✅ |
| 並び       | +338   | 43.6% | ✅ |
| 角・列・不明 | NULL   | -     | ❌ |

並びが末尾より低いのは「並び範囲に低設定台も含まれる」ためで、
「局所的高設定1点集中」の情報として解釈する。

## アクション
- `strategy_type` を順序特徴量: 全台 > ゾロ目 > 末尾 > 並び の順
- 角・列は `est_*_triple` で代替
- is_calculable=0 の行はNULL補完か除外
