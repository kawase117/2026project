# 「ジャグN、他M絡み」はN機・A機で別々の起点を持つ並び

## 背景
K1の「並び（ジャグ1、他5絡み）」はジャグラー系（N機）が末尾1起点、
それ以外（A機）が末尾5起点の並びを意味する。
パーサーが `末尾` プレフィックスを探すと取れないため専用パターンが必要。

## アクション
```python
# _extract_narabi_digits 内に追加
for m in re.finditer(r'(?:ジャグ|他)(\d)', s):
    digits.append(m.group(1))
```
strategy_digits には両方の数字を格納: "1,5|2"
パフォーマンス計算はN+A合算のwindowクエリで対応。

## 例
- 並び（ジャグ1、他5絡み）→ digits=['1','5'], window=2
- 並び（ジャグ6、他1絡み）→ digits=['6','1'], window=2

