# 並び策略は台番号±windowで計算可能（3台並び=±2）

## 背景
「並び」とは連番台に高設定を入れる戦略。末尾Nの3台並びは、
末尾Nの台番号Mを起点として[M-1,M,M+1]が範囲。
すなわち |machine_number - M| <= 2 がターゲット台集合になる。
- 3台並び → window = 2
- 4台並び → window = 3
- 5台並び → window = 4

## アクション
```sql
SELECT AVG(m.diff_coins_normalized)
FROM machine_detailed_results m
WHERE m.date = ?
AND EXISTS (
    SELECT 1 FROM machine_detailed_results anchor
    WHERE anchor.date = ?
      AND anchor.last_digit IN (?, ...)
      AND ABS(m.machine_number - anchor.machine_number) <= ?
)
```
strategy_digits 形式: "3|2"（数字|window）

## 例
「末尾3絡みの3台並び」: machine 3 → {1,2,3,4,5}、machine 13 → {11..15}
ユーザー確認: "3を含んだ前後2つが範囲となり、123、234、345が範囲となります"

