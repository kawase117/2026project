# 逆算トリプル推定の精度はpoco既知日で7/7（100%）検証済み

## 背景
全10連番トリプル（0,1,2 ～ 9,0,1）の中でavg_diffが最大のものを選ぶ逆算推定が
poco宣言の起点数字と一致するか、K7 並び既知7日で検証した結果：
N機・A機ともに7/7（100%）でpoco宣言数字がest_tripleに含まれていた。

| 日付     | poco宣言 | est_N     | est_A     |
|----------|----------|-----------|-----------|
| 20250712 | 6        | 5,6,7 ✅  | 4,5,6 ✅  |
| 20250802 | 7,1      | 7,8,9 ✅  | 1,2,3 ✅  |
| 20250906 | 1,7      | 9,0,1 ✅  | 7,8,9 ✅  |

## アクション
- `est_n_triple`, `est_a_triple` はML特徴量として積極的に使用可
- ぽこテキストに起点情報がない日（並び不明・角・列）でも代替特徴量として使用
- 639/656行（97.4%）で計算済み（17行はDBにデータなし）

## テーブル定義（poco_announcements に追加）
```sql
est_n_triple          TEXT,   -- e.g. "9,0,1"
est_n_triple_avg_diff REAL,
est_a_triple          TEXT,   -- e.g. "8,9,0"
est_a_triple_avg_diff REAL
```

