# Codex DesktopのagmsgはWindowsApps bashではなくGit Bashを明示する

## 背景
Kamata7 dashboard計画でClaude Codeとagmsg連携した際、Codex側で `bash ...`
をそのまま実行すると `C:\Users\apto117\AppData\Local\Microsoft\WindowsApps\bash.exe`
経由のWSL bashに流れ、`$HOME=/home/apto117` 側の別ストレージを見た。
その結果、Claude側では `Sent to codex in team main` と表示されているのに、
Codex側の `inbox.sh main codex` は空、`whoami.sh` は `not_joined=true available_teams=none`
になる状態が発生した。

## アクション
Codex Desktopからagmsgを使うときは、必ずGit Bashをフルパスで指定する。
受信確認は以下を標準形にする。

`& 'C:\Program Files\Git\bin\bash.exe' -lc 'cd /c/Users/apto117/Documents/pachinko-analyzer/src/2026project; ~/.agents/skills/agmsg/scripts/inbox.sh main codex'`

送信も同じGit Bash経路に固定する。`bash` だけを呼ばない。

## 例
正常確認:
- `command -v sqlite3` が `/c/Users/apto117/bin/sqlite3`
- `inbox.sh main codex` でClaudeからのメッセージが読める
- `whoami.sh "$(pwd)" codex` が `not_joined=true` にならない

