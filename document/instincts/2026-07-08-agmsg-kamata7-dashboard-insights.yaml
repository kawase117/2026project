# constants.pyの文字化け表示に引きずられて既存ラベルをASCII化しない

## 背景
Kamata7 Theoryページ登録時、PowerShell表示では `dashboard/config/constants.py`
がmojibakeして見え、最初にASCIIの有効定義へ置き換えた。しかしgit diffでは元ファイルが
日本語ラベルとemojiを持つ正常なUTF-8ファイルであることが分かり、既存UIラベルまで
変更してしまう不要差分になりかけた。

## アクション
`dashboard/config/constants.py` を編集するときは、端末表示のmojibakeだけで
ファイル全体をASCII化しない。git diffで実際の差分を確認し、既存ページ名・iconは保持して、
新規ページの `PAGES` / `PAGE_REGISTRY` 追加だけに留める。

## 例
悪い変更:
- `"ホール全体"` を `"Hall Overview"` に置換
- 既存emoji iconを数字に置換

良い変更:
- `{"icon": "K7", "title": "Kamata7 Theory", "key": "kamata7_theory"}` を追加
- 既存エントリは変更しない
