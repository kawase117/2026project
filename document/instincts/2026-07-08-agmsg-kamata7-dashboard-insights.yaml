# Claude=設計/仕様/テスト戦略、Codex=実装の役割分担を最初に明示する

## 背景
Kamata7 dashboard拡張では、初期状態でCodexからClaudeへの相談文が届いたか不明になり、
ユーザーが両画面を中継して状況確認した。通信経路をGit Bashに固定した後、
Claude側が「Claude=設計・仕様・テスト戦略、Codex=実装」と役割を明示し、
`document/plans/kamata7_dashboard_implementation_plan.md` を作成したことで流れが安定した。

## アクション
agmsgで協働を始める最初のメッセージに、必ず以下を含める。
- 依頼の対象ファイルまたは対象機能
- Claude側に期待する成果物: 設計、仕様、優先順位、テスト戦略
- Codex側の担当: 実装、検証、ルーティング登録、テスト
- 返信先agent名と、短いACK要求

長文の本依頼を送る前に `ACK test from codex. Please reply OK.` のような短い疎通確認を行う。

## 例
推奨メッセージ:
`ACK test from codex. Please reply OK. Then review Kamata7 dashboard priorities. Claude: design/spec/test strategy. Codex: implementation/verification.`

