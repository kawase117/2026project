# 蒲田7dashboard初期実装はTop5に絞り、GATED/debut/広範な機種DDは後回しにする

## 背景
蒲田7セオリーのdashboard化では、最初に全論点を対象にすると
GATED/NOGATE、debut age/regime、machine-specific DD/weekdayなど、
ライブ表示にはデータ品質・誤読リスクが高い項目まで混ざる。
Claudeレビューでは初期Top5として
Six physical segments、Event-day checks、DD by kakuban matrix、
Cooling zones、Refutation warning panelsが推奨された。
Codex実装ではこのTop5を `page_20_kamata7_theory.py` のタブ構成にまとめ、
実DB smokeで `rows=257400`, `filtered=239222`, `segment_rows=6`,
`matrix_shape=(31, 22)` を確認した。

## アクション
蒲田7セオリーdashboardを拡張するときは、まず以下の安全なTop5を優先する。
1. Six physical segments
2. Event-day checks
3. DD x kakuban matrix
4. Cooling zones
5. Refutation warning panels

GATED/NOGATEはライブ予測設計が別途必要、debut/regimeはデータ品質監査が前提、
machine-specific DD/weekdayはホワイトリスト化まで広範表示しない。

## 例
初期ページ構成:
- Coverage
- Events
- Segments
- DD x Kakuban
- Cooling
- Warnings

