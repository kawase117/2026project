# avg_diff微プラスの正体は5k+G日の少数スパイク

## 背景
鏡期間(2026-01~)の日別分析で、全体avg_diff +96の構造を分解。日の66%はマイナス（中央値-238）。5k+G日（全体の17%）だけがavg_diff +1,709で全体を引き上げている極端な二峰分布。

## アクション
セクションのavg_diffが微プラスの場合、平均値だけで判断せず必ずG数バケット別に分解する。低G数帯がプラスならリセット効果、高G数帯だけプラスなら散発的高設定、全帯域プラスなら真の上位セクション。

## 例
G数バケット別avg_diff: 0-500G=-252(勝率3.4%), 501-1k=-348, 1k-2k=-362, 2k-3k=-197, 3k-5k=+67, 5k+=+1,709(勝率75%)。低G数ほど負けており、リセット仮説は明確に否定された。

