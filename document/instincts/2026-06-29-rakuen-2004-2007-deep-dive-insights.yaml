# 楽園蒲田2004-2007は月曜が最強曜日

## 背景
曜日別分析で月曜がavg_diff +191.4, hit_rate 31.4%と他曜日を大きく引き離す。5k+バケットでも月曜はn=11でavg_diff +2,585と最高。台番号別でも2006月曜hit 38.7%で一貫。木曜が最弱(hit 21.2%)。週末は客付きでG数は伸びるが差枚効率は月曜の半分以下。

## アクション
楽園蒲田2004-2007を打つなら月曜を最優先。週末の5k+はG数が伸びるだけで差枚効率が低い（土曜+1,130 vs 月曜+2,585）。ただしn=11なのでサンプルサイズに注意。

## 例
5k+ bucket DOW: Mon +2,585(n=11) > Tue +2,112(n=6) > Wed +2,103(n=19) > Sun +1,759(n=31) > Sat +1,130(n=25)

