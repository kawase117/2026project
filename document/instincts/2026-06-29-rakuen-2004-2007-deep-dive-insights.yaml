# 楽園蒲田2004-2007はDD20/22/25/30に5k+日が集中

## 背景
5k+バケットのDD分布で、DD20(n=9, +3,572), DD22(n=10, +2,176), DD30(n=9, +1,916), DD25(n=7, +2,232)に集中。DD8とDD24は5k+がゼロ。DD30は16台日中9台が5k+(56.2%)だが、3/30一日で3台分を稼いでおりn=4日では統計的に不十分。

