# リセット vs 高設定の判別はG数バケット×差枚クロスで行う

## 背景
ユーザーが鏡期間の微プラスについて「リセットで出玉が良いだけでは」と指摘。G数バケット別差枚を算出したところ、低G数帯が全てマイナスでリセット仮説を定量的に否定できた。リセット恩恵なら0-500G帯がプラスになるはず。

## アクション
新機種・新セクションの評価時に「リセット恩恵か高設定か」の疑問が出たら、games_normalizedを[0-500, 501-1000, 1001-2000, 2001-3000, 3001-5000, 5001+]でバケット化し、各帯のavg_diffと勝率を算出する。低G帯プラス→リセット効果、高G帯のみプラス→散発高設定。

## 例
判別パターン:
- リセット型: 0-500G=+200, 1k-2k=+50, 5k+=+100 → 朝一で出て後は平均回帰
- 散発高設定型: 0-500G=-250, 5k+=+1700 → 大半の日は低設定、稀に高設定
- 真の上位セクション: 全帯域でプラス → 恒常的に高設定投入

