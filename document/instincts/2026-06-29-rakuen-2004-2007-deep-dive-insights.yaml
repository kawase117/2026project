# 楽園蒲田のイベントDD定義は未精査・使用禁止

## 背景
分析で使用したis_event_ddフラグはみとや由来の定義で、楽園に適合するか未検証。実際にイベントDD(avg_diff -53.1)が非イベントDD(+49.6)を下回る逆転現象が発生し、ユーザーから「楽園はまだ精査していないので無視」と指示。

## アクション
楽園蒲田のDD分析ではis_event_ddフラグを参照しない。楽園固有のイベントDD定義が確立されるまで、DDは番号単位の実績ベースでのみ評価する。

## 例
Event DD avg_diff=-53.1 vs Non-event +49.6 → 定義が適合していない証拠。DD14(event, -450.8), DD4(event, -215.9)など「イベント日なのに最弱」が多数。
