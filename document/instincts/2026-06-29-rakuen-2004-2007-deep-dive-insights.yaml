# 楽園2004-2007は新館2F平均と同等の普通セクション

## 背景
楽園蒲田新館2F台番号2004-2007（4台）の542日分データを分析。全期間avg_diff=+22.5は新館2F全体+25.3とほぼ同等、hit_rate 25.7% vs 26.5%。G数は2,212 vs 3,059と大幅に低く、客付きの悪いポジション。「上位セクション」ではない。

## アクション
楽園蒲田の台選択で2004-2007を優先セクションとして扱わない。他セクションとのwalk-forward比較で相対的な位置づけを確認してから判断する。

## 例
section avg_diff=+22.5, shinkan2F_other avg_diff=+25.3 → 差は誤差範囲。avg_games 2,212 vs 3,059で客付きも劣る。

