# 楽園の超太陽神の日は、通常日より強い形跡がない（10/25は10月で最も弱い日だった）

## Core claim
楽園蒲田店の超太陽神の日は、台帳の全日で見ても、同じ10月の通常日より平均差枚が高いとは言えない。「毎日仕掛け」の10月は、超太陽神の日とそうでない日の差も消えている。超太陽神の日であることだけを理由に、機種や台を推さない。

## Evidence
- n_observations: 超太陽神の日は台帳の全15日（6〜9月12日＋10月の3日）に、10/20・10/25を加えた期間。
- data scope: 楽園蒲田店、全台の日次平均差枚（`machine_detailed_results`）。
- result summary:
  - 6〜9月の超太陽神12日: 平均 −10/台、中央値 −21、台勝率33%。通常日（約110日）は平均 +70。
  - 10月の超太陽神4日（10/2・3・4・20）: 平均 +81/台。通常日（20日）は +71。差は10枚で、4日では区別できない。
  - 「過去5回すべてプラス」の確率: 10月の通常日も20日中15日がプラス（75%）で、5回連続になるのは約24%。集計の5日は、プラスが続きやすい期間を切り取っている。
  - 10/22（+154）と10/23（+367）は超太陽神の日でないのに、集計の5日のどれより高い。
  - 10/25（日・超太陽神の日）: 日平均 −72/台、10/18以降の8日で最低。名指しの軸は SAO2 だけ当たり（+711）、カバネリは31台で −941・勝率26%。
  - 10月の超太陽神5日の平均は約 +50 で、通常日（+71）を下回る。

## Interpretation
- 超太陽神の日は取材の名前であって、設定投入の量を示す指標としては機能していない。
- 10月は「毎日仕掛け」と公約され、日による差が小さく、上振れ・下振れは通常日のばらつきの範囲に入る。
- 同じ日付の取材（超太陽神・水星神・四星W）は独立した複数の証拠として数えない（既存の記録と同じ）。

## Action
- 超太陽神の日の予測では、機種の根拠を「超太陽神だから」にしない。直近の通常日の傾向と、機種別の履歴（超太陽神の日と通常日を並べた表）で決める。
- 「過去N回すべてプラス」には、通常日の勝ち越し率から計算した確率（約24%）を添える。
- 次の超太陽神の日は、日平均が通常日（直近20日）を上回ったかを確認する。標本が10日以上たまったら、超太陽神の日と通常日の差を検定し直す。

