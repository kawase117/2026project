# 台単位の翌日persistence検証は「設定が日毎に再ランダム化されるホール」では判定力そのものが無い

## 背景
`p_high_setting`(GMMソフトラベル)が`hit104`より情報量を持つかを検証するため、
`ml/experiments/label_redesign/persistence_validation.py`で台単位の翌日ペア(暦日連続日のみ)を
構築し、「今日のラベル→翌日のhit104/payout_rate」のAUC・相関を比較した。

蒲田7・蒲田1・みとやの3ホール全てで、`hit104`自身の翌日予測AUCが0.4936〜0.5038
（実質チャンスレベル）、`corr_hit104_vs_next_payout`もほぼゼロ（±0.003程度）だった。
つまりベースラインのラベルすら翌日をほとんど予測できておらず、
「今日→翌日」という枠組みでは2つのラベルの優劣を判定する検定力が原理的に存在しなかった。
`auc_diff`はp_high_settingの方がわずかに低く(−0.011〜−0.015)ブートストラップCIも
0を跨がなかったが、これはn=11万〜23万という桁違いの標本数による統計的有意性であり、
効果量としては実務的に無視できる水準だった。

## アクション
- 台単位の「今日→翌日」persistence testを、ラベルの優劣判定の主手段として採用する前に、
  まずベースラインラベル自身の翌日予測AUCがチャンスレベル(0.5付近)でないかを確認する。
  ベースライン自体がチャンスレベルなら、この検証設計では判定不能と判断し、
  「ラベルに情報がない」と結論しない
- このプロジェクトの前提（設定は台単位で日毎に再ランダム化される、`ml/CLAUDE.md`の
  店側ランダム化戦略）と整合する結果であり、台個体レベルの日次持続性を前提にした検証は
  そもそもこのドメインに合わない
- ラベル比較をやり直す場合は、`ml/experiments/walkforward_scoring/`の既存walk-forward
  パイプライン（曜日・DD・角番等の構造的特徴量→held-out日の予測）に載せて比較する方が
  検定力・妥当性ともに高い
- 日次persistenceの切り口自体を維持したい場合は、個別台ではなく`(dd, machine_digit)`や
  曜日等のセル集計単位での持続性を見る（集計で検定力を稼ぐ）

## 例
蒲田7: n_pairs=231,620, auc(hit104)=0.5037, auc(p_high_setting)=0.4924, auc_diff=-0.0113
（significant=Trueだが効果量は無視できる水準）。蒲田1・みとやも同様のパターン。

