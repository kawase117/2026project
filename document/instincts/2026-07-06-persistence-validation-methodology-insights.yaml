# 有意性フラグを「diff>0かつCI下限>0」のように片方向だけで実装すると、逆方向の有意差を「有意差なし」と誤報告する

## 背景
`ml/experiments/label_redesign/persistence_validation.py`のレビューで、
`significant = bool(base_diff > 0 and ci_lo > 0)`という実装を発見した。
これだとA(p_high_setting)がBより有意に劣る場合（diff<0かつCI上限<0、つまり
CIは0を跨いでいない）でも`significant=False`と報告されてしまい、
「Bの方が有意に優れていた」という重要な結果を「有意差なし」と誤って握りつぶす。

指示元の計画書は「CIが0を跨がなければ有意」と方向を問わず定義しており、
「diff>0かつ有意」という条件は解釈・結論を書く段階でのみ使うべきものだった。
実装時にこの2つ（統計的有意性の判定 と 解釈上の推奨可否）を混同していた。

## アクション
- 差の有意性フラグは`ci_lo > 0 or ci_hi < 0`のように方向非依存で実装する
- 「Aの方が優れている場合のみ有意扱いにする」といった片方向条件は、
  有意性フラグそのものではなく、その後の解釈・レコメンド文言の側に置く
- レビュー時は`base_diff > 0 and ...`のような片方向条件が有意性判定に混入していないかを
  必ずチェックする。テストケースとして「逆方向でも有意になるべきケース」
  （例: `test_negative_auc_diff_can_still_be_significant`）を用意させる

## 例
修正前: `significant = bool(base_diff > 0 and ci_lo > 0)`
修正後: `significant = bool(ci_lo > 0 or ci_hi < 0)`
（方向判定は`auc_diff > 0`を別途参照して解釈文言側で行う）
