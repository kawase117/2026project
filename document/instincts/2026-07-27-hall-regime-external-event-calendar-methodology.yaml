# ホールのレジーム変化は統計検出でなく外部情報の確認から始める

## 核心の主張
統計的なレジーム変化検出（日次エッジ系列からの自動推定）は検出まで60日以上かかり
2〜3ヶ月規模の変化には間に合わない。しかし店長交代・改装のような運営変化は
ユーザーに直接聞けば即座に分かる観測可能な情報であり、これを推薦の前提として
毎回確認していないのが2026-07-27時点の運用の穴だった。

## 根拠
- n_observations: 1件（みとや大森町、2026-05店長交代）だが、機種レジーム
  （どの機種が設置されているかは初日から直接観測できる）でも同型の構造が
  backtest/results/regime/FINDINGS.md 追試1に既に記録されている
- data scope: single-hall
- result summary:
  - みとやの推薦を「2位・イベントDD根拠あり」として一度出した後、ユーザーから
    「2026/05〜店長交代で不調」という指摘を受けて初めて期間分割を行った。
  - 期間分割の結果、ジャグのイベントDD効果が実際に2026-05でゼロに落ちていたことが
    確認できた（詳細は mitoya-manager-change-regime-confirmed-2026-05 参照）。
  - つまり、聞けば分かる情報を確認しないまま、失効した根拠で推薦を出していた。

## 解釈
- 統計的検出力の限界は、レジームが真に潜在変数（データからしか推定できない）の
  場合にのみ成立する制約であり、外部から確認できる変化点にまで拡張して
  「検出は無理だから仕方ない」と考えるのは誤り。
- 凍結ハッシュ・prereg JSON 自体は変更してはならないが、「既知の外部変化点で
  事後（post-hoc）に期間分割して前後のCIを見る」ことは判定根拠にはできないものの
  「今のルールが生きているかの点検」としては正当。

## Action
- ホール推薦を出す前に「そのホールで最近運営上の変化（店長交代・改装・
  イベント運営方針変更）はありましたか」を毎回1問確認する。
- 判明した変化点があれば、`backtest/run_backtest.py --split-date YYYYMMDD` で
  該当ルールを事後分割し、変化点以降のCIがゼロを跨いでいないか確認してから
  推薦に使う。跨いでいれば根拠として使わない。
- 変化点以降のサンプルが20日程度しかない場合は「効果なし」と断定せず
  「判定不能」として扱う。

