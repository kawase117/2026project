# スペックの正しさは「推定した設定分布の機械割」と「差枚から出す実測の機械割」で突き合わせる

## Core claim
BB・RBスペックの源は2つある（`ml/experiments/jug_rb_setting_prediction/config.py` の `JUGGLER_FAMILY_SPECS` と `document/machine_master_research/machine_master.csv`）。`find_spec` は前者を優先する。コメントに「照合済み」とあっても、値が公表値と食い違う機種があった。
設定の推定には差枚を使っていないので、推定した設定分布から出す機械割（公表機械割の加重平均）と、実測の機械割（1 + 差枚合計/(3×G合計)）の差は、スペックの正しさに対する独立の検査になる。

## Evidence
2026-10-13、みとや・蒲田7・蒲田1・楽園の4ホールで検査。
- どの機種も、実測が推定より約1〜1.8ポイント高いのが共通（ぶどう等の影響）。
- **ゴーゴージャグラー3だけ、旧スペックで推定が実測を超えた**（みとや 推定1.009 対 実測0.998、蒲田7 1.022 対 1.015）。マスターなら共通のずれに合う。
- 外部の解析サイトで確認: ゴーゴー3・ファンキー2・ハッピー8は旧設定が誤り（REG/BB確率が食い違う）、ウルトラミラクルはマスターCSVのほうが誤り。
- 影響: 誤ったスペックのまま、ゴーゴー3を「翌日の高設定確率0.225〜0.466」「台別の定位置あり」と報告していた。訂正後は0.012〜0.125で、定位置は無効。

## Action
1. スペックを使う分析の前に、機種ごとに `find_spec` とマスターCSVを並べて差を出す（食い違い3%超は要確認）。
2. 食い違いがあれば、推定した設定分布の機械割と実測の機械割の差が、他機種の共通のずれと合う側が正しい。外部の公表値（なな徹・パチセブン等）で最終確認する。
3. 絶対水準（機種ごとの高設定率）が不自然に高いときは、スペックの誤りを先に疑う。ホール全体の設定が高いと解釈する前に。
4. 結論が機種内の相対比較（自群比）だけなら、スペックが一致している機種の結論は影響を受けない。
