# ぱち簿のCSVには台番号が無い。.pcb（全バイトXOR 0xFF）には入っている

## Core claim
CSV出力の列は `日付,ホール,タイプ,機種,投資,回収,収支,時間,メモ` だけで、台番号は無い（メモにたまに手書きがあるだけ）。
**台番号はバックアップの.pcbにある。** ユーザーに台番号を聞き直す前に.pcbを求める。

## Evidence
2026-10-12、.pcbを全バイト `^0xFF` で反転すると、「型,キー,長さ,値」の繰り返しが読める。
- キーは `item<YYYYMMDD>_<連番>_<項目>`。項目は `number`（台番号）、`machine_id`、`hall_id`、`invest`/`invest2`、`recovery`/`recovery2`、`start`/`end`（HHMM）、`memo` など。
- 文字列は文字コードが一定でない（一部は復元不能な欠落）ため、**機種名・ホール名は.pcb側で使わず、CSVと突き合わせて付ける**。
- 突き合わせキーは `日付 + (invest+invest2) + (recovery+recovery2)`。3,862件中3,791件が対応。金額が同じ履歴（0円回収など）は曖昧になるので、一意なものだけ使う。
- 新ハナビの `machine_id` は11573。楽園新館=130166、HIROKI東口=130120。台番号は台別DBの当日G・BB・RBと矛盾しないことで検証できた（8/8件）。

## Action
- 台番号が要る分析は、まず.pcbを受け取って復号する（作業手順は2026-10-12のセッションの`join.py`相当。リポジトリ未収録）。
- DBは2025年1月以降なので、ユーザーの履歴（2021年〜）の多くは台別実績と重ならない。重なるのは2026年が中心。
- 台別DBの当日差枚には、ユーザー自身の損益が含まれる。選択の良し悪しを測るときは、自分の損益（円÷貸出単価）を差し引いてから同日・同機種の他台と比べる。
