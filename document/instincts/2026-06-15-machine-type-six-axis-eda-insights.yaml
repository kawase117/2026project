# 機種別ラグ持続性クラスタリングは311機種中93%が無関係型、残りも小サンプルノイズ

## 背景
run_lag_persistence_clustering.py (machine_name単位, n>=10, rho!=NaN,
|rho|>=0.15を据え置き/リバウンド型、それ以外を無関係型):
- lag1_total_diff_coins->efficiency: persistence 11 / reversal 9 / neutral 260
- lag1_efficiency->efficiency: persistence 10 / reversal 9 / neutral 261
- lag1_total_diff_coins->is_top_3: persistence 2 / reversal 10 / neutral 220
- lag1_is_top_3->is_top_3: persistence 3 / reversal 1 / neutral 227

n=15〜40程度ではrho>=0.15が偶然だけで30〜45%発生するため、上記の
非neutral機種の大半はノイズ。複数パターンで符号一致 & n>=60の
「robust」候補は少数:
- リバウンド型最有力: にゃんこ大戦争BIGBANG (n=60, 3パターン全て負: -0.218/-0.222/-0.155)
- 据え置き型候補(n>=87): コードギアス反逆のルルーシュ/復活のルルーシュ(n=169,
  +0.186/+0.207), 1000ちゃんA(n=175, +0.180/+0.209),
  フレームアームズ・ガール(n=150, +0.196/+0.167), リングにかけろ1 V(n=87, +0.169/+0.165)

hall_machineグルーピング(よりサンプル少)では非neutral比率が
7%->10.8%に増加。これはサンプルが減るほど見かけの極端値が
増えるという、偶然由来であることを示す典型パターン。

## アクション
- このクラスタリングをそのまま特徴量化しない
- 上記の数機種(robust候補)に限れば再検証の価値はあるが、
  件数が少なすぎて汎用特徴量にはならない。個別ルール扱いが限界
- 同種の分析を別軸でやる場合は、最初から
  「permutation testでp値算出」または「n>=50 & 複数ターゲットで
  符号一致」をフィルタ条件に組み込むこと

