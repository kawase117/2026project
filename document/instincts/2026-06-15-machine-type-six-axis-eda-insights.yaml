# 機種名以外の単独要因(物理配置/前日連動/月間人気度/ホール調子/曜日/イベント日)はいずれも弱い

## 背景
2026-06-15、機種名が最大ファクターである前提のもと、それ以外で差枚に繋がる
要素を6軸でEDA(全9ホール pooled, 297,450行, 311機種, 2025-01-01〜2026-06-11):

1. 台番号末尾/ゾロ目などの物理配置 -> 既に「向いていない」と判明済み
2. 前日・前々日のefficiency/diff_coins/is_top_3ラグ -> pooled rhoは
   -0.02〜+0.03でほぼゼロ。機種別クラスタリングしても311機種中
   93%が|rho|<0.15の無関係型で、残りも n<60では多重検定ノイズと
   区別不能 ([[lag-persistence-clustering-mostly-noise]]参照)
3. 先月/先々月の機種人気度(monthly_total_games等) -> pooled相関は
   efficiencyに対し0.10-0.15だが、機種内補正後は0.068に減衰し、
   is_top_3への効果はほぼ消失(0.064->0.014)。「人気機種ほど高設定」は
   主に機種間差(=機種名factorの言い換え)
4. ホール全体の当日win_rate -> is_top_3との相関は rho=0.0108
   (全9ホールで-0.0005〜+0.0055)。ホールが好調な日でも個別台への
   波及は検出されない。efficiency_minus_hall_avgもefficiency単体と
   ほぼ同じ(is_top_3はhall×date内ランクのため定数オフセットは無意味)
5. 曜日効果 -> is_top_3_rateは7曜日全てで0.0449前後、小数点3桁まで
   横並び。mean_efficiencyも-0.04〜-0.065の範囲でほぼフラット
6. event_group(_event_group_for_dayベース)/ゾロ目日(11,22日) ->
   is_top_3_rateはそれぞれ0.0448〜0.0492、0.04488 vs 0.04485で
   実質差なし

## アクション
- 「機種名以外の単独特徴量」を探すアプローチはここで一区切りとする。
  新しい単独特徴量を探すより、(a) 機種×他軸の交互作用、または
  (b) games_zscore系の同日関係をライブ分析側機能に転用する方向
  ([[games-zscore-same-day-correlation-not-predictive]]参照)に
  比重を移す
- 機種×曜日/機種×イベント日の交互作用テーブル(run_machine_weekday_event_eda)
  には|delta|0.2〜1.4の値が並ぶが、n=20〜160の小サンプルで
  lag persistence clusteringと同型の多重検定ノイズ問題を抱える。
  そのまま「この機種は水曜に強い」と解釈しない

## 例
ml/machine_type/exploratory/output/{temporal_popularity_eda_report,
hall_relative_performance_eda_report,machine_weekday_event_eda_report,
games_efficiency_eda_report}.md に詳細値あり
