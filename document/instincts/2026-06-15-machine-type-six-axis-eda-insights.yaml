# games_zscore(当日回転数のzスコア)はefficiencyと機種内でも相関するが、ラグでは消える

## 背景
run_games_efficiency_eda.py: (hall_id, machine_name)別に過去30日
rolling(shift(1))から算出したgames_zscoreは、
- pooled: vs efficiency rho=0.171, vs is_top_3 rho=0.082
- 機種内(within-machine, n>=10, 276機種): vs efficiency
  mean_rho=0.149/median_rho=0.149(std=0.164) -> mean=median で
  特定機種への偏りではなく広く成立する同日関係
- vs is_top_3: mean_rho=0.088/median_rho=0.089

しかし lag1_games_zscore(前日の回転数zスコア)は
vs efficiency rho=0.006, vs is_top_3 rho=-0.006 でほぼゼロ。
回転数も差枚も「その日の結果」であり、回転数が先行指標にはならない。

## アクション
- games_zscoreを「翌日の高設定予測」特徴量として追加するのは無意味
  (lag1で消失するため)
- 同日関係としては実質的なので、当日のホール観察(ライブ分析/
  session-recommend系)で「今日は回転数が多い=今日勝負すべき」の
  補助指標として転用を検討する。次予測モデル(machine_type ML)への
  組み込みは見送り

