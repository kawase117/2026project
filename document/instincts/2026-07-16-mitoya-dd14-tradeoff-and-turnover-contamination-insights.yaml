# 「鉄台による偽シグナル」という注意書きは「台の除外」ではなく「帰属の注意」

## 背景
`mitoya_theory.md`の「パターン1: 鉄台による偽シグナル（台固有性）」は、h_jug末尾d4の末尾効果が実は台674という特定1台の個体効果だった（末尾という切り口自体には根拠がない）という**帰属の注意**を意味していた。しかしCodexに全DD一括検証スクリプトの実装を委任した際、この記述を誤読し `KNOWN_IRON_MACHINE_NUMBERS = {641, 642, 674}` として該当台を集計から完全除外してしまった。台674は理論文書のStep 3・4では実は最有力候補（h_jug reversedセクションの角番1そのもの）として明記されており、除外は完全な逆効果だった。修正依頼で除外ロジックを撤廃し、代わりに`single_machine_dominance_flag`（特定1台の寄与率50%以上を検出する注記列）に置き換えた。

## アクション
1. Codexへの委任プロンプトで理論文書の注意書きを参照させる場合、「除外せよ」なのか「注記・警告フラグを立てよ」なのかを明示的に区別して指示する。曖昧な参照だけでは誤読リスクが残る。
2. 台の除外を伴うロジックをCodexが自律的に追加した場合、除外理由と除外対象を必ず人間側で照合する（今回は手動分析値641=+982, 674=+912との突合で誤りが発覚した）。
3. 個体依存の強さを扱いたい場合は「除外」より「フラグ付け」の方が安全（データを隠さずに注意喚起できる）。[[codex-prompt-precision]]の契約明示チェックリストに「除外 vs フラグ」の区別も追加検討。

## 例
修正前: 641・642・674が集計から欠落し、最有力候補が一括検証システムから恒久的に見えなくなっていた。
修正後: 全台を集計対象に含めた上で、`single_machine_dominance_flag`列で「この位置の数値は特定1台に依存している」と警告するのみ。641・674のDD14実績は手動分析値とほぼ一致（981.5≈982, 911.6≈912）し、dominance_flag=Falseで個体依存の懸念もないことを確認。

