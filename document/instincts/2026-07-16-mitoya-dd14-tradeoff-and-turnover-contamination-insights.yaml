# みとや全DD一括頑健性検証スクリプトとCSVが生成済み、対話的DB調査を都度行う必要はない

## 背景
DD14について対話的に「角番18は？角番6は？機種別では？」と複数往復した経緯を踏まえ、Codexに委任して`eda/mitoya_dd_full_sweep_robustness.py`を実装した。DD(1〜31)×セグメント×rank_from_aisle×機種インスタンス（入替期間で正しく分離）の粒度で集計し、`document/mitoya_dd_full_sweep_20260713.csv`（主要値・機種インスタンスベース）、`document/mitoya_dd_full_sweep_positionbased_reference_20260713.csv`（参考値・台番号ベース）、`document/mitoya_dd_hallwide_baseline_20260713.csv`（DD別ホール全体ベースライン）の3ファイルを出力する。n<10の行には`low_confidence`フラグ、特定1台への依存が強い行には`single_machine_dominance_flag`が付与される。7/7の全設定6特殊日は除外済み。

## アクション
1. みとやの特定DDについて位置別・機種別実績を聞かれたら、まずこの3つのCSVを参照する。DBへの都度SQLクエリより優先する。
2. CSVの日付（ファイル名の`_20260713`）が古くなっている場合（DB更新後など）は、`eda/mitoya_dd_full_sweep_robustness.py`を再実行してCSVを更新してから参照する。
3. `single_machine_dominance_flag=True`の行は、その位置の強さが特定1台に依存していることを意味するため、機種入替リスクとして言及すること。

## 例
518番(角番18, rank_from_aisle=18)のDD14実績+1168、519番(角番19)+741は、いずれもこのCSVから即座に参照可能。前回の対話的DB調査結果と一致することを確認済み。
