# 台番号グループと機種グループの比較は必ず入替履歴を確認してから分離する

## 背景
みとや大森町で「異世界かるてっと(705-706)とクレアBT(709-711)はトレード・オフ関係にあるのでは」という仮説を検証した際、最初の集計で「過去60日で対照的60%」という結果が出た。しかしこれは誤りだった。異世界かるてっとは2026-04-06〜04-19の14日間だけ749-750に存在し、04-20以降は705-706に移動していたが、集計時に「749-750=異世界かるてっと」という前提のまま過去に遡ったため、749-750にいた全く別の機種（ヨルムンガンド、主役は銭形5、バジリスク等）の実績を異世界かるてっとの実績として合算していた。台番号ベースの集計と機種名ベースの集計を正しく分離し、各機種の実際の在籍期間（`MIN(date)`〜`MAX(date)` per machine_number+machine_name）に絞って再計算したところ、対照的な日はどちらの軸でも約52%（コイントスの偶然水準）となり、トレード・オフ仮説は棄却された。

## アクション
1. 台番号グループ同士、あるいは機種名グループ同士を比較する前に、必ず `SELECT machine_number, machine_name, MIN(date), MAX(date), COUNT(*) FROM machine_detailed_results WHERE machine_number IN (...) GROUP BY machine_number, machine_name` で入替履歴を確認する。
2. 「台番号軸」（位置に固定、機種が何であれ）と「機種軸」（機種名に固定、位置が何であれ）は明確に異なる集計であり、機種が過去に移動している場合、無条件に同一視してはいけない。
3. 機種軸で比較する場合、比較対象の機種が存在する期間（在籍開始日以降）に集計対象を絞る。存在しない期間を0扱いで合算すると見かけの相関が歪む。
4. 「〇〇と△△はトレードオフでは」という仮説自体は、ユーザーの現場観察（配置の隣接関係、稀な全台設定投入の目撃）に基づく貴重な着想である。着想を安易に肯定・否定せず、集計の正しさを先に固めてから判定すること。

## 例
誤: `WHERE machine_number IN (705, 706, 749, 750)` として60日分を機種名区別なく集計 → 749-750にいた別機種の実績が異世界かるてっとの実績として混入。
正: `WHERE machine_name LIKE '%異世界%かるてっと%'`（機種名軸）と `WHERE machine_number IN (705, 706)`（位置軸、2026-04-20以降）を分離し、それぞれ対応する期間のみで対クレアBT(709-711)の対照日率を計算 → 両軸とも約52%で一致、トレードオフなしと判定。

