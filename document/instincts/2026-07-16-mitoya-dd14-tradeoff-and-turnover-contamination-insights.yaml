# 薄いサンプルではavg_diffと勝率(win_rate)が逆の結論を示すことがある

## 背景
みとやDD14実績で「異世界かるてっと・SHAKE・リオエース」の3機種はいずれもavg_diffが高く見えたが、勝率で見ると実態が分かれた: 異世界かるてっと n=6 win_rate=83.3%（avg_diffの高さと整合）、SHAKE n=11 win_rate=72.7%、リオエース n=8 win_rate=50.0%（avg_diffは+1519と高いが実際は五分五分で、6/14の2台の爆発的勝利(+7676,+8444)がavg_diffを牽引していただけ）。avg_diffだけで3機種を一律に「強い」と評価すると、リオエースのような「稀に大勝ちするだけで実際は五分五分の機種」を見誤る。

## アクション
1. n<15程度の薄いサンプルを評価する際は、avg_diffに加えて必ずwin_rate（104%超え率や差枚>0の割合）を併記し、両者の乖離を確認する。
2. avg_diffは極端値（爆発的な1日の大勝ち）に強く引っ張られる指標であるため、win_rateとの乖離が大きい場合は「特定日の爆発に依存した高avg_diff」を疑う。
3. win_rateが高くavg_diffも高い機種（両指標が一致）が最も信頼度が高い。win_rateが低くavg_diffだけ高い機種は格下げ対象とする。

## 例
リオエース: avg_diff=+1519(高) だが win_rate=50%(五分五分) → 6/14の2台大勝ち(+7676,+8444)への依存が判明、「強い」の評価を撤回。
異世界かるてっと: avg_diff=+1871(高) かつ win_rate=83.3%(高) → 両指標一致、候補として格上げ妥当と判断。

