# DD14×火曜のh_jug角番1が2026-07-14に外れた（641: -2953, 674: +394）

## 背景
過去18日分のDD14集計では641(+982)・674(+912)が最有力候補として繰り返し確認され、機種入替混入バグ修正後も数値は再現した。しかし実際の2026-07-14（火曜・DD14）では641が-2953、674が+394（ほぼ横ばい）となり、事前予想は外れた。同日、東京喰種(574)も-3794と大敗。一方で推奨台全体(30台)の勝率は43.3%、非推奨(236台)は39.0%と、全体としてはわずかに推奨側が有利な結果ではあった。

## アクション
1. h_jug角番1ルールは過去実績の平均としては堅牢だが、単日の的中を保証するものではない。単日評価でルールの成否を断定しない（[[feedback-statistical-certainty-calibration]]と同じ原則）。
2. 火曜×DD14の組み合わせは本セッション時点でn=3日程度と薄く、「火曜は下振れしない」という前回の暫定判断は今回の実績で反証された。曜日×DD相互作用は今後も継続観察が必要。
3. 推奨リストは「複数候補への分散」を前提に設計し、単一候補（641/674のみ）に賭けない運用を維持する。

## 例
2026-07-14実績: 641=-2953(✗), 674=+394(◎), 574=-3794(✗大敗)。過去平均(641=+982, 674=+912, 574=+917)から見て統計的に十分あり得る分散内の外れだが、単日では容易に逆転しうることを示す実例として記録。

