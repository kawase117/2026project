# evolveで生成されたSkillは手動編集して安全

## 背景
prediction-evaluation/SKILL.mdにはevolved_from(11 instinct ID)とconfidenceフィールドがあり、
`everything-claude-code`の`/evolve`コマンドで生成された形跡があった。当初「次回evolve実行時に
再生成されて上書きされるのでは」と懸念し、ユーザーにも「放置すべきか」と問われた。
`commands/evolve.md`の実装を確認したところ、`/evolve --generate`はユーザーが明示的に叩いた時のみ動き、
生成物は`~/.claude/homunculus/.../evolved/`というステージング領域に出力される。`~/.claude/skills/`への
昇格は別の手動ステップであり、バックグラウンドでの自動上書きは発生しない。

## アクション
evolved_from/confidenceフィールドを持つSKILL.mdでも、手動での分割・修正・統合をためらう必要はない。
リスクがあるとすれば「ユーザーが将来同じinstinctクラスタで/evolveを再実行し、かつ生成物を再度手動で
昇格させた場合」のみで、これは目に見える形でユーザーが判断する行為。ただし`~/.claude/skills`自体が
git管理外だと手動編集の差分照合ができなくなる点は別途注意(他instinct参照)。

## 例
prediction-evaluation(evolved_from 11件)から2項目(ゾロ目補正精度の検証単位、3F_Aの信頼度)を
pachinko-live-analysis(evolved_from 10件)へ移動し、両ファイルのevolved_from/件数/進化の背景を
整合させた。移動後も自動発火・自動上書きの問題は発生していない。

