# SKILL.mdの記述は必ず実装スクリプトと照合する

## 背景
tag-normalizerの仕立て直しで、Sonnetエージェントが1回目の書き直し時にSKILL.mdの記述(旧文書)を
整理しただけで完了と申告したが、監督役のFableが`tag-normalizer.py`を実際に読んで照合したところ
`--isolate`オプション(実装に存在しない)、Exit Status 1/3/4(実装は0と2のみ)、Tag Master自体の
YAML検証・品質スコア(0-100)・タグ頻度分布(いずれも未実装)など、複数の記載が実装と乖離していた。
SKILL.mdの「読みやすさ」を整えるだけでは、内容が正しいかどうかは検証できない。

## アクション
companion script(.py/.sh)を持つSkillのSKILL.mdを修正・監査する際は、旧ドキュメントの記述をそのまま
信用せず、実装ファイルを実際に読んでCLIオプション・Exit Status・実装済み機能を突き合わせる。
argparseの引数一覧、sys.exit()の呼び出し箇所、実際にprintしている統計項目を直接確認するのが最も確実。

## 例
`tag-normalizer.py`のargparseには`--dry-run`/`--apply`/`--stats`/`--category`/`--report`/`--outputs`/
`--all`のみが存在し、旧SKILL.mdに書かれていた`--isolate`は存在しなかった。sys.exit(2)以外の明示的な
exit codeも実装になく、Exit Status 1/3/4は削除して0/2のみに修正した。

