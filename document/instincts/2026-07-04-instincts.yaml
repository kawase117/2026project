# 死んだSkill参照は旧パイプライン全体の遺物であることが多い

## 背景
backlink-generatorとtag-normalizerの両方が、Integration/Related Skills節で`ingest-v2`という
存在しないSkillと、改名済みの旧名`monthly-healthcheck`(正しくは`wiki-monthly-healthcheck`)を
参照していた。1つのSkillだけの記載ミスではなく、複数のSkillに同一パターンの死んだ参照が
横断的に残っていたことから、`ingest-v2`という統合パイプラインが過去に存在し、廃止された後も
参照網が全面的に更新されていなかったと判断できた。

## アクション
あるSkillで死んだ参照を1件見つけたら、同じ参照先を含む他のSkillも横断的にgrepし、
同一の旧パイプライン由来の遺物が他にも残っていないか確認する。単発の記載ミスと
パイプライン全体の陳腐化は、修正の緊急度・範囲の判断が異なる。

## 例
`grep -rl "ingest-v2" ~/.claude/skills/`でbacklink-generatorとtag-normalizerの2件がヒット。
一方でtag-normalizer.pyの実装コードは`D:/wiki/.claude/skills/ingest-v2/categories.json`という
データファイルパスに今も依存しており、「ingest-v2という名前のSkill」は消えたが
「ingest-v2という名前のディレクトリ配下のデータファイル」は生きている、という
部分的な生存状態だった。参照除去の際はSkill名への言及とデータパスへの依存を区別する必要がある。

