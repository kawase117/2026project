# データスキーマの重複解消は、Skill統合ではなく共有referencesファイルで十分なことが多い

## 背景
Skill棚卸し監査でinstinct-export/instinct-importが「責務重複・統合候補」と評価されたが、
ユーザーから「正反対の操作(export/import)なのに統合できるのか」と問われ、再検討した。
両者は同じYAMLスキーマ・同じディレクトリ(document/instincts/)を扱うが、発火タイミングは
セッション終盤(export)とセッション冒頭(import)で正反対であり、1つのdescriptionに
両方の発火条件を書くと自動発火の精度がむしろ下がるリスクがあった。

## アクション
「同じデータ資源を読み書きする2つのSkill」は、統合の第一候補にせず、まず
「スキーマ定義を共有referencesファイルに切り出し、両方のSkillから参照する」という
より低リスクな代替案を検討する。統合は発火タイミングが同じ・操作が同一文脈で
切り替わる場合(tag-normalizerの--dry-run/--apply等)にのみ適する。

## 例
instinct-export/references/schema.mdを新設し、instinct-export・instinct-import両方の
SKILL.mdからこの1ファイルを参照する形にした。Skill自体は分離したまま、
スキーマの二重管理だけを解消した。

