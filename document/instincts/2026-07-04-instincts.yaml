# Sonnet実行→Fable監督の二層体制は過信した断定を検出できる

## 背景
Sonnetエージェントが個人Skill22件を監査し、agent-orchestration/development-workflowについて
「実在しない10エージェントに依存している」と深刻度「高」で断定した。しかし監督役のFableが
実際に`~/.claude/agents/`とプラグイン提供エージェント一覧を確認したところ、10エージェントは
`everything-claude-code`プラグインの名前空間で実際に起動可能であり、「実在しない」という
断定は誤りだった。同時にFableは行数の実測ミス(295行→実際は285/294行)や、
「descriptionがほぼ同一」という言い過ぎ(実際は本文冒頭のみ同一)も検出した。

## アクション
Skillの棚卸しや仕立て直しをエージェントに任せる際は、実行役(Sonnet)の断定的な指摘を
そのままユーザーに提示せず、別モデル(Fable)に一次情報(実ファイル・実際のエージェント一覧)を
再確認させる監督ステップを挟む。特に「〜は存在しない」「〜と依存している」という
断定形の指摘は、参照先の実態(名前空間・改名・移動)を見落としている可能性がある。

## 例
本セッションでbacklink-generator・tag-normalizer・agent-orchestration/development-workflowの
4件でこのSonnet実行→Fable監督→(必要なら)Sonnet修正、というパイプラインを使い、
tag-normalizerでは実装スクリプトとの乖離、agent-orchestrationでは「実在しない」という
誤断定という、性質の異なる2種類の誤りをそれぞれ検出できた。

