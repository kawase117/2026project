# tuned版（V12c/V12d）はbase版（V12a/V12b）に及ばない — セグメント個別調整は過学習リスク

## 背景
2026-06-26 正式walk-forward。base版の乗数テーブルに対し以下の調整を加えたtuned版を検証:
- 2F_R_N: 0.40→0.60（ペナルティ緩和）
- 3F_R_N: 全フェーズ1.0（無効化）

## 発見

### 全体指標
| variant | avg_diff | lift@50 | vs V11 avg_diff | vs V11 lift |
|---------|---------|---------|-----------------|-------------|
| V12a(base) | +244.7 | 1.308 | +63.1 | -0.018 |
| **V12b(base½)** | **+230.3** | **1.336** | **+48.7** | **+0.010** |
| V12c(tuned) | +220.4 | 1.317 | +38.8 | -0.009 |
| V12d(tuned½) | +207.0 | 1.332 | +25.4 | +0.006 |

### セグメント別の調整効果
tuned版で修正した2セグメント:

| セグメント | V12a | V12c | 調整効果 |
|-----------|------|------|---------|
| 3F_R_N avg_diff | +8.9 | **+35.8** | **復旧（正しい修正）** |
| 3F_R_N lift | 1.692 | **1.714** | **復旧** |
| 2F_R_N avg_diff | **+206.6** | +198.5 | **悪化（緩和が裏目）** |
| 2F_R_N lift | **1.268** | 1.243 | **悪化** |

3F_R_Nの無効化は正しかったが、2F_R_Nの緩和は逆効果。
結果として全体指標ではbase版が優位。

## 解釈
- セグメント個別の乗数調整は「1セグメントの改善が他セグメントの悪化で相殺される」構造
- scale=0.5（半分緩和）というグローバルな調整の方が、個別セグメント調整より頑健
- 乗数テーブルの過学習リスクは高い → 細かい調整を追わない方が良い

## アクション
- 乗数テーブルはbase版のまま維持。追加の個別調整はしない
- scale=0.5が最適なスケーリングパラメータ
- 将来的にデータが倍増した場合に再検証する余地はある

