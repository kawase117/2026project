# V12b(base, scale=0.5)が最適: avg_diff+48.7かつhit@50/lift@50がV11を上回る唯一のバリアント

## 背景
2026-06-26 walk-forward正式検証。V11のcompositeスコアにセグメント別debut_multiplierを掛けた
5バリアント（V12a/b/c/d）を全期間（171テスト日, window=90）で比較。

## 発見（Window 90, event_type=all, 正式検証）

| 指標 | V11 | V12a(base) | **V12b(base½)** | V12c(tuned) | V12d(tuned½) |
|------|-----|-----------|----------------|-------------|-------------|
| avg_diff | +181.6 | +244.7 | **+230.3** | +220.4 | +207.0 |
| vs_other | +63.8 | +153.5 | **+138.0** | +105.6 | +91.1 |
| hit@50 | 4.64 | 4.58 | **4.68** | 4.61 | 4.67 |
| lift@50 | 1.326 | 1.308 | **1.336** | 1.317 | 1.332 |
| payout | 100.40 | 100.64 | **100.64** | 100.55 | 100.49 |

### V12b が最適解である理由
- **avg_diffとlift@50の両方がV11を上回る唯一のバリアント**
- avg_diff: +181.6 → +230.3（+48.7改善）
- hit@50: 4.64 → 4.68（+0.04改善）
- lift@50: 1.326 → 1.336（+0.010改善）
- V12a(フル適用)はavg_diffは最大だが、lift@50が1.308に悪化
- V12c(tuned)はlift@50が1.317でV11を下回る

### event/non-event分割
| | V11 vs_other | V12b vs_other | Δ |
|---|---|---|---|
| Event | +80.0 | **+220.5** | **+140.5** |
| Non-event | +58.1 | **+109.4** | **+51.3** |

イベント日で特に大きな改善（+140.5枚）。

### 効果の構造
- baseテーブルの方向性は正しいが、フル適用は過剰
- scale=0.5で「大外し回避」と「ランキング精度維持」のバランスが最適
- 「新台を避ける」＋「定番台を微ブースト」の両方が半分の強さで効く

## アクション
- **V12b(base, scale=0.5)を推奨バリアントとする**
- tuned版（V12c/V12d）はbase版に及ばない → 乗数テーブルの微調整は不要
- 3F_R_Nの無効化は正しかったが、2F_R_Nの緩和は逆効果 → baseのまま半分緩和が最適

