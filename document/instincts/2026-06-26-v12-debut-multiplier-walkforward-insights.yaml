# debut_dateの計算はmachine_nameでgroupbyすること（machine_numberは誤り）

## 背景
2026-06-26 V12実装時のバグ。初回walk-forwardでV11/V12a/V12bの全指標が完全一致。

## 原因
`train.groupby("machine_number")["date_dt"].min()` でdebut_dateを計算していた。
同じ台番号に異なる機種が入れ替わっても（新台入替）、最古の日付を返すため、
ほぼ全台がtrain開始日に一致 → 全台pre_existing → 全台乗数1.0。

## 修正
`train.groupby("machine_name")["date_dt"].min()` に変更。

## アクション
- debut系の計算は必ずmachine_nameでgroupbyする
- テストデータでも同一machine_nameの台は同じdebut_dateになることを考慮
