# Sun/Thu weekday効果はsplit-half両方で方向一貫・effect size維持だが、サンプル数減でq値が0.05をわずかに超え stable=False

## 背景
kamata_weekday_event_axis_deepdive.py の Branch A で、kamata7 2F
section 2179-2186 (イベント日除外) について Kruskal-Wallis p=0.000948、
Sun(top, mean_diff=+390.5) と Thu(bottom, mean_diff=-176.0) が
FDR補正後も有意 (q<0.05) だった。

weekday cell の split-half安定性検定 (weekday_cell_stability.csv) を
追加したところ:
- Thu: full q=0.0013(有意), first_half q=0.0439(有意),
  second_half q=0.0559(僅かに非有意)
- Sun: full q=0.0118(有意), first_half q=0.263(非有意),
  second_half q=0.0559(僅かに非有意)

両セルとも same_direction=True(方向は前半・後半で一貫)、effect size も
second_halfで縮小していない(Sunはむしろ+398.7に拡大)。
second_half の q値が両方とも0.0559と、0.05の閾値をわずかに超えただけで、
n_dates=18-20と半分のサンプルサイズによる検出力不足が主因と考えられる。

[[spike-driven-machine-can-fake-cell-vs-rest-stability]] のケースとは異なり、
machine concentration check では top_machine_share=0.22-0.24,
sig_machines=0 と、特定の1台に依存していないことも確認済み。

## アクション
- この曜日効果は「効果なし」と断定せず、「方向性のある real signal だが
  現データ量では検出力不足」として保留扱いにする。
- ML特徴量への即時投入は見送る。データが蓄積され n_dates が
  half-period で30程度に達した時点で再検証する。
- 同様の Sun高/Thu低 パターンが他のセクション・フロアでも再現するか
  横展開して検証することで、サンプルサイズを実質的に増やす方向も
  検討する。

