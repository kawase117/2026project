# イベント日リフトは「機種カテゴリ」ではなく「特定の人気タイトル」に依存する。カテゴリ分類は交絡の代理変数に過ぎなかった

## Core claim
「長期生存×多台数」等の機械的な機種カテゴリでイベント日(is_x_day)の差枚リフトを見ると
複数ホールで正のリフトが出るが、これは回転数交絡（イベント日は回転数も伸びる）と、
カテゴリ内の少数の人気タイトルへの偏りが二重に乗った見かけ上の効果であり、
回転数十分位で層別調整し、かつ上位寄与機種を除外すると効果は消えるか符号が反転する。

## Evidence
- n_observations: 9ホール×4イベント種×5カテゴリの素朴比較（176検定）→ games十分位層別調整
  （eda/category_event_interaction_games_adjusted.py）→ みとや・レイトギャップの2ホールのみ
  「長期生存×多台数」×x_dayでCIが0を跨がない正のリフトが残存 → 上位3機種を除いた感度分析
  （eda/mitoya_lategap_xday_deepdive.py）
- data scope: 各ホール独立（プールなし）
- metric scope: diff（差枚）、games十分位で層別（Mantel-Haenszel型）、bootstrap 95%CI
- result summary:
  - 素朴比較: 6ホールで「長期生存×多台数」×x_dayが正リフト（前回の誤った暫定結論）
  - 回転数十分位調整後: 6ホール中4ホール(蒲田7,ヒロキ,楽園,金時)が符号反転（負）、
    残る2ホール(みとや+164[114,212], レイトギャップ+72[25,125])のみ正のまま
  - 上位3機種を除外すると: みとや +164→**-197**[-232,-165]（符号反転）、
    レイトギャップ +72→**-19**[-66,29]（非有意化）
  - 上位寄与機種は「スマスロ北斗の拳」「東京喰種」が両ホール独立で上位3入り
  - みとやの日付理由別分解: mmdd_zorome(強ゾロ目)が最大(+428[298,555])、digit_4が次点
    (+276[132,393])、digit_24/27は非有意。レイトギャップは個別digit(6/16/26)はいずれも
    非有意で、集約して初めて有意（特定日への切り分け不能）

## Interpretation
- 「多台数」「長期生存」という機械的カテゴリ自体には効果がない。効果は「スマスロ北斗の拳」
  「東京喰種」のような特定の人気タイトルに集中しており、カテゴリはその代理変数に
  過ぎなかった。ユーザーの原初仮説「人気機種で台の扱いが異なる」の"人気機種"の部分だけが
  支持され、"多台数"や"長期生存"という機械的定義は棄却された
- diffの平均差でDD・曜日・イベント日を評価する手法は回転数交絡を強く受ける
  （既存 hit104-and-diff-are-volume-confounded-not-setting-indicators と同じ結論を
  独立手法=games十分位層別で再現）。p56（BB/RB二項尤度）が使えないJuggler以外の機種でも、
  games十分位の層別調整で同様の交絡除去ができることを確認した
- 結果指標(diff)ベースの代理検証であり、設定そのものは見ていない
- レイトギャップは個別日付への切り分けができておらず、みとやほど解像度が高くない

## Action
- 機種カテゴリ(新台/多台数/長期生存)を軸にした一般化ルールは作らない。作るなら
  機種名個別、または「みとやのスマスロ北斗の拳/東京喰種」のようにホール×機種名で書く
- DD・曜日・イベント日をdiffの平均差で評価するときは、games十分位層別調整を経由しない
  結果を信用しない（naive liftは常に過大評価/符号反転のリスクがある）
- みとやのmmdd_zorome(強ゾロ目)とdigit_4は他の理由より根拠が強いので優先度を上げてよいが、
  それでも診断は「スマスロ北斗の拳/東京喰種」という機種名依存の可能性が高く、機種を
  跨いで一般化しない
- 次のステップ候補: スマスロ北斗の拳・東京喰種が他ホールにも設置されていればホール横断で
  同機種のイベント日反応を比較する（機種固有の全国共通販促の可能性を検証）

