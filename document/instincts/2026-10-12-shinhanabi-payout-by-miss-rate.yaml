# 新ハナビの機械割は技術介入の失敗率で97.7〜102.0%の間を動く。台全体の差枚/Gは打ち手の機械割ではない

## Core claim
設定1の97.7%は技術介入を**全て失敗**した場合、102.0%は**全て成功**した場合の値（ユーザー説明、2026-10-12）。
旧値でも誤りでもなく、打ち手の精度で内挿する。97.7を「通常打法の値」として期待値に使わない。

## Evidence
- ユーザーのRB中の氷狙い失敗率は、通算11.6%、2026年9〜10月は7.2%。
- 失敗率7.2%の線形内挿で約101.7%、1回10枚損失の前提の枚数換算で約101.5%。
- 10月の大負け（-45,501円、7,786G）は、BB 17回（期待28回）の下振れで説明でき、失敗率は9月と同じだった。
- 楽園蒲田店の新ハナビ全台の差枚/G（9月+0.065≒102.2%）は全プレイヤー・設定混在の平均で、あなたの機械割ではない。

## Action
- 期待値は 102.0 − 失敗率 × 4.3 で見積もる（machine_masterの`rtp_setting*`は全失敗側）。
- 台全体の差枚/Gは「台の設定の目安」にだけ使い、打ち手の機械割と混ぜない。
- 設定の混合比率は、BB・RBだけでなく、BB中の斜め風鈴（1/11=奇数設定、1/9=偶数設定）、花ゲ中ハズレ（設定1 1/13.4→設定6 1/9.5）も併せて見る。
- ユーザー通算（196,425G）は、BB 1/267、RB 1/355、斜め風鈴 1/10.8で、設定1中心（偶数設定は約9%±10%）。通算では設定2の混在は支持されない。
