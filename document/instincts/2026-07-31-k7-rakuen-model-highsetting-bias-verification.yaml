# 蒲田七・楽園蒲田の機種別baseline比検証(2026-07時点): モンキーターンVのみ両ホールで頑健にプラス

## Core claim
ユーザーの肌感(アイムジャグラー・北斗の拳・化物語・Lカバネリ・モンキーターン・東京喰種は高設定配分が多い)のうち、両ホールでsplit-half一致・鉄台/座席交絡耐性を満たして支持されたのはモンキーターンVのみ。東京喰種・アイムジャグラーは肌感と逆方向。化物語は両ホールとも判定不能。

## Evidence
- n_observations: 蒲田七6機種(38〜108台)、楽園蒲田6機種(12〜67台)
- data scope: single-hall × 2(蒲田七、楽園蒲田)、ホール横断のプールはしていない
- metric scope: diff_coins_normalized、baseline比(同カテゴリ[ジャグ or その他AT]他機種平均比)
- result summary:
  - 蒲田七: モンキーターンV delta+119.8〜+172.5(split-half一致・鉄台除外後も残存)、北斗の拳(全バリアント一括) delta+146.6(同)、東京喰種 delta-189.3(split-half一致だが肌感と逆方向)、アイムジャグラー delta-30.9(同、逆方向)、化物語・カバネリはsplit-halfで符号反転し判定不能(カバネリはS/L分離・座席-機種ペア比較法で追検証しても否定的、→ 2026-07-31-seat-vs-model-effect-paired-comparison-method参照)
  - **北斗の拳のバリアント分割(蒲田七)**: 「北斗の拳」は一括集計されていたが、スマスロ北斗の拳(60台)とスマスロではない北斗の拳 転生の章2(51台)は別機種であり分割すると大きく異なる。蒲田七: スマスロ北斗の拳 delta+244.5 / 転生の章2 delta+38.2(ほぼ平均並み)。楽園蒲田では両バリアントとも同程度に強く(スマスロ+278.4 / 転生の章2+302.4)分割の影響は小さかった。ホールにより分割の重要度が異なるため、必ず分割して個別に確認すること
  - 楽園蒲田: 北斗の拳 delta+272.4、カバネリ delta+35.8、モンキーターンV delta+157.4(いずれもsplit-half・2026-07-06工事前後とも一致)、化物語・東京喰種はsplit-halfまたは工事前後で符号反転し判定不能、アイムジャグラー delta-2.8(ほぼゼロ)
  - 楽園では対象6機種間で座席交絡39件(北斗の拳⇔モンキーターンV21件、北斗の拳⇔東京喰種13件、モンキーターン⇔東京喰種5件)を検出。うち21件・13件について座席固定効果を除いたペア比較・contemporaneous baseline比較の追検証を実施(結果は下記Interpretation参照)

## Interpretation
- 「発表・肌感で目立つ機種=高設定配分が多い機種」ではない。東京喰種はK7で明確に逆方向であり、poco-galspan-announcement-paradoxと同型の罠(発表頻度・印象と実績の乖離)である可能性がある
- 楽園の北斗の拳・カバネリの結果は既存instinct `rakuen-model-level-edge-and-cohort-pitfalls`(2026-07-27)の「北斗の拳 転生の章2に正のエッジ」という結論と方向が一致し、相互に補強し合う
- **座席固定効果を除いた追検証(21+13座席)**: 北斗の拳⇔モンキーターンの21座席で、両機種の在籍期間をそれぞれの同時期otherカテゴリbaselineと比較すると、モンキーターン期delta+46.2、北斗の拳期delta+338.9。**両方ともプラスであり、座席効果だけでは説明できない(座席が構造的に強いだけなら同程度の大きさになるはず)。北斗の拳の方が優遇の度合いが約7倍強いが、モンキーターンの優位も座席効果ではなく機種効果として否定されない**
- 北斗の拳⇔東京喰種の13座席(machine_number 1047-1059)では両機種の平均がほぼ同水準(北斗+191.2 vs 喰種+183.3、北斗の方が高い座席46.2%)だったため当初「区画効果(場所自体が機種を問わず強い)」と解釈したが、対象6機種以外も含めた全在籍履歴を確認したところ誤りだった。2025年1〜3月に在籍していた別機種(スマスロ真・北斗無双delta-528.9、サラリーマン金太郎delta-472.3)は大きくマイナスで、2025年4月以降の3機種(スマスロ北斗の拳+185.7→東京喰種+173.6→北斗の拳転生の章2+458.3)のみプラスが続く。**これは「常に強い座席」ではなく、2025年4月頃を境にこの区画の評価が反転した時間的レジーム変化であり、区画側の構造変化か機種選定側の変化かはこのデータだけでは切り分けられない**(2025年4月以降、この区画に「優遇されていなさそうな機種」が設置された実例がなく反証できないため)
- **【2026-07-31 解決済】楽園アイムジャグラーの「矛盾」は本instinctの集計ミスだった**。当初 delta≈0(不支持)としたが、月次に分解すると差枚ベースと機械割ベースは完全に一致していた。ネオアイムジャグラーEXの差枚ベースdeltaは 202602 +11.0 → 202603 +7.2 → 202604 +72.7 → 202605 +74.5 → 202606 +142.7 → 202607 +178.9 と単調上昇で、機械割ベースedge_pp(-0.03→+0.00→+0.30→+0.40→+0.82→+1.08)と同じ形。矛盾は存在せず、`rakuen-model-level-edge-and-cohort-pitfalls` の報告が正しい。原因は本instinct側の2つの設計ミス: (1) 2025-11に撤去済みの別機種アイムジャグラーEX-TP(通期でほぼ0〜マイナス)をネオEXと合算した、(2) 全期間(20250201-20260730)で平均したため直近の上昇が薄まった。**全期間平均は直近のレジーム変化を破壊する**。機種評価は必ず月次で分解してから述べること
- なお202607はネオEXの絶対値自体は-41.4とマイナスだが、ジャグ他機種baselineが-220.4のため相対では過去最大の+178.9。絶対値で強弱を判断してはならない(同じ誤りを楽園モンキーターンの+39.3でも犯した)
- 化物語・カバネリ(S)は設置台数が少なく(K7:38台、楽園:12台)、標本サイズ由来のノイズで符号反転している可能性が高い

## Action
1. 推奨台スコアリングにモデル(機種)単位の高設定配分ボーナスを加えるなら、まずモンキーターンVから(両ホールで最も頑健)
2. 楽園ネオアイムジャグラーEXは月次分解で両指標とも単調上昇を確認済み。楽園では機種ボーナスの候補として扱ってよい(ただし直近数ヶ月のレジームに依存するため定期再確認が必要)。蒲田七のアイムジャグラーは依然として逆方向のため加えない
2b. 東京喰種は肌感と逆方向(K7)・不安定(楽園)のため加えない
3. 化物語・カバネリ(S)は台数不足で判定不能のまま扱い、設置台数が増えるまで再検証を待つ
4. カバネリを扱う際は必ずS(無印)とL(海門決戦)を分離すること。混同すると新台除外ロジックも機種名変化点基準にしないと漏れる
5. 機種の強弱を全期間平均で判断しない。必ず月次に分解して推移を見る。全期間平均は直近のレジーム変化を消す(楽園ネオアイムジャグラーEXで実際に誤判定した)
6. 楽園の北斗の拳・モンキーターンVは座席固定効果を除いても両方生存したため、少なくとも方向性は信頼してよい(ただし北斗の拳の方が優遇度が大きい)。「上位数台除外後も残るか」の確認は未実施のため引き続き効果量は割り引いて使う
7. 楽園の東京喰種は北斗の拳との13座席比較で機種差がほぼ消えたが、これは区画効果ではなく2025年4月頃の時間的レジーム変化と分かった(区画側・機種選定側どちらが原因かは未特定)。母集団評価が不安定なことと合わせ、東京喰種への機種ボーナスは見送る
8. 座席固定効果の検証では、機種Aの期間と機種Bの期間を直接比較するだけでなく、必ずそれぞれの在籍期間に対応するcontemporaneous baseline(同時期の他機種平均)と比較すること。片方の在籍期間だけbaseline自体が低かった場合、単純な期間間比較は実際より弱く見せる(→ 2026-07-31-seat-vs-model-effect-paired-comparison-method参照)
9. **北斗の拳のように公式名称に複数バージョンが存在する機種(スマスロ北斗の拳/北斗の拳 転生の章2/北斗の拳 宿命等)は、LIKE検索で一括りにせず必ずバージョンごとに分割して確認すること。** 一括集計と分割集計で結論が一致するかはホールによって異なる(蒲田七は分割で大きく変わったが楽園は変わらなかった)ため、「特定バージョンだけが有効」と決め打ちせず、都度分割確認を行う
10. 座席の位置効果を「常に強い区画」と結論する前に、対象機種以外も含めた全在籍履歴のbaseline比deltaを時系列で確認すること。機種入替のタイミングと評価の反転タイミングが一致する場合、区画固定効果ではなく時間的レジーム変化を疑う

