# persistenceシグナルは「より極端な大負け」に絞るほど効き、緩めると消失する — 閾値依存性そのものが構造の手がかりになる

## 背景
みとや大森町で「大負け」の定義（diff_coins_normalizedの下位分位点）を5%/10%/15%と変えて条件付きサブセットでのAUCリフトを再検証した。

| 大負け定義 | サブセットn | リフト |
|---|---|---|
| 下位5%（閾値-3191） | 1,243 | +0.0129 |
| 下位10%（閾値-2397） | 2,495 | +0.0146 |
| 下位15%（閾値-1950） | 3,769 | -0.0015 |

5%・10%では改善が一貫し、15%まで広げると消失する。これは「本当に極端な状態でのみ意味を持つ」という、ノイズでは説明しにくい構造的パターン。

## アクション
- 条件付き特徴量を評価する際は、**単一の閾値だけでなく複数の閾値で感度分析**を行い、リフトの符号・大きさが閾値に対してどう変化するかを見ること
- 「閾値を緩めると効果が消える」というパターンは、シグナルが「極端な事象に特有の構造」を捉えている可能性を示すが、同時に**サンプル数が極端に少ない領域に依存する＝過学習リスクが高い**ことも意味する。両面から判断すること
- 閾値感度分析の結果が「ホール間で符号が逆転する」場合（このセッションの蒲田七のように）、構造自体は実在してもその「意味」がホール固有である可能性を疑うこと

## 例
```python
for q in (0.05, 0.10, 0.15):
    thr = df['diff_coins_normalized'].quantile(q)
    # 閾値ごとに特徴量を再構築し、walk-forwardで再評価
    # リフトの符号・大きさの変化を見て「本物の構造」か「ノイズの偶然」かを判別する
```

