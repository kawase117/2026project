# persistence特徴量は「ベースラインモデルが既に高精度に当てられている機種系統」では悪化させ、「ベースラインが苦手な系統」では改善する傾向が見えた — ベースライン精度と補助特徴量の価値が逆相関する可能性

## 背景
みとや大森町で、persistence_feat追加によるリフトを機種シリーズ別にプールOOF予測で検証した（baseline AUCも併記）：

| 系統 | n | baseline AUC | +persistence AUC | リフト |
|---|---|---|---|---|
| ジャグラー系 | 42 | **0.807**（高精度） | 0.785 | **-0.0227** |
| BT系 | 22 | **0.777**（高精度） | 0.760 | **-0.0165** |
| その他(主にAT/ART) | 1,217 | 0.632（低精度） | 0.641 | +0.0090 |
| 沖ドキ!系 | 55 | 0.608（低精度） | 0.680 | **+0.0720** |

ベースラインAUCが高い系統（ジャグラー・BT系=「設定が見えやすい」とされる機種）ではpersistence特徴量が**悪化要因**となり、ベースラインAUCが低い系統（沖ドキ・その他AT系=「読みにくい」機種）では**改善要因**となる、きれいな逆相関パターンが観測された。

これは「ベースライン特徴量で既に説明できる対象に、無関係/間接的な特徴量を追加するとノイズとして働き、ベースラインで説明しきれない対象には補完情報として働く」という、機種を超えて一般化できる可能性のある仮説。

## アクション
- セグメント別の特徴量リフトを評価する際は、**そのセグメントにおけるベースラインモデルの精度（AUC）も必ず併記すること**。リフトの大小だけでなく「なぜそのセグメントで効く/効かないのか」をベースライン精度との関係で説明できないか検討する
- 「補助特徴量を全データに一律追加する」のではなく、**ベースラインモデルが苦手とするセグメントに選択的に適用する**という特徴量設計戦略（segment-conditional feature injection）を今後検討する価値がある
- ただし本件のセグメント別n（沖ドキ55、ジャグラー42、BT系22）はいずれも「n<150は評価不能」という本セッション内で確立した基準を下回り、特に沖ドキの+0.072という大きな値は**方向性の手がかりに留め、確証とはしない**こと。傾向の再現性はDB拡張後の大標本で再検証が必要

## 例
```python
# セグメント別リフト評価では、必ずベースライン精度も併記し、相関を確認する
for seg, mask in segments.items():
    g = cond[mask]
    if len(g) < 150:
        print(f"{seg}: n={len(g)} -> 評価不能（傾向の手がかりとしてのみ記録）")
        continue
    auc_base = roc_auc_score(g['target'], g['p_base'])
    auc_ext  = roc_auc_score(g['target'], g['p_ext'])
    print(f"{seg}: baseline={auc_base:.3f} lift={auc_ext-auc_base:+.4f}")
    # baseline が低いセグメントほど lift がプラスに振れていないか確認する
```

