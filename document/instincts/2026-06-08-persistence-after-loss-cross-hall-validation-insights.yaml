# machine_layoutテーブルが存在するが`rank_from_aisle`列が欠けているホールでは、build_machine_feature_frameがKeyErrorで落ちる（潜在バグ）

## 背景
`db/マルハンメガシティ2000-蒲田7.db`の`machine_layout`テーブルは存在するが、列が`['machine_number', 'hall_name', 'x', 'y', 'display_y', 'section', 'section_min', 'section_max', 'rank_from_min', 'rank_from_max']`のみで`rank_from_aisle`を持たない。

`load_raw_machine_rows`内の処理は「layoutテーブルが存在しない」場合にのみ`rank_from_aisle`等の列をNaNで補完するロジックを持つが、「テーブルは存在するが一部列が欠けている」ケースをハンドリングしていない。結果、`build_machine_feature_frame`の`work["is_corner"] = ... work["rank_from_aisle"] ...`でKeyErrorが発生する。

## アクション
- `ml/prediction/individual_machine_diff_prediction.py`の`load_raw_machine_rows`内、layout処理部分（`for col in [...]: if col in layout.columns: ...`のループ）を、**マージ後に欠けている列を事後的にNaN補完する**形に修正することを推奨（恒久対応）
- 暫定対応（本セッションで使用）: `raw = m.load_raw_machine_rows(...)` の後に `if 'rank_from_aisle' not in raw.columns: raw['rank_from_aisle'] = np.nan` を追加してから`build_machine_feature_frame`を呼ぶ
- 新しいホールDBでこのパイプラインを使う前に、`machine_layout`テーブルの列構成を必ず確認すること（`has_layout_csv: false`のホールほど部分的スキーマの可能性が高い）

## 例
```python
# 暫定ワークアラウンド（本体未修正の場合）
raw = m.load_raw_machine_rows(db_path, min_games=500)
for col in ['rank_from_aisle']:  # 他にも欠ける可能性のある列を都度確認
    if col not in raw.columns:
        raw[col] = np.nan
frame = m.build_machine_feature_frame(raw)
```

