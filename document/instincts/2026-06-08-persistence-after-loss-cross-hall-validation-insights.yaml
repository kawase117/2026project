# 「直近X_dayで大負け→翌X_dayも回され続ける」シグナルは単一ホール検証では+1.46pt改善したが、別ホールでは符号が反転した

## 背景
ユーザーの観察「高設定台は大負けしても回され続ける」を起点に、`persistence_ratio = 翌X_day回転数 / 自席のX_day平均回転数（lag付き、座席正規化）`を「直近X_dayの下位10%大負け」条件付きで36特徴量に追加し、walk-forward CatBoostで検証した。

- みとや大森町（5fold, 条件付きサブセットn=1,337）: baseline AUC 0.6357 → +persistence 0.6503（**+0.0146**, 5fold中4foldで改善）
- 蒲田七（5fold, 条件付きサブセットn=2,505）: baseline AUC 0.6194 → +persistence 0.6090（**-0.0104**, 符号反転）

全体AUCはどちらのホールでもほぼ無変化（特徴量が情報を持つのは全体の約8〜10%のみのため）。

## アクション
- 単一ホールでの+1〜2pt程度のAUC改善は、本実装の根拠として不十分。**必ず最低2ホール以上でwalk-forward再検証**し、符号の一貫性を確認してから判断すること
- 「4/5foldで改善」のような fold単位の一貫性だけでは不十分（n=1,337規模ではホール固有ノイズで容易に再現する）。ホール間の符号一致こそが真の判定基準
- この種の検証は計算コストが高い（CatBoost二重学習×fold数×ホール数）ため、最初から複数ホールを並行して検証計画に組み込むこと

## 例
```python
# 単一ホールでの「改善」は条件付き採用、複数ホールでの符号一致まで本実装を保留する
results = {}
for hall_db in ['mitoya_omori', 'kamata7']:
    results[hall_db] = run_walkforward_comparison(hall_db, feature='persistence_feat')
if not all(r['lift'] > 0 for r in results.values()):
    print("符号が一致しないため本実装を見送る（ホール固有ノイズの可能性が高い）")
```

