# 「大負けしても回され続ける」現象は、AT系（hana/oki）の方がジャグラー/BT系より「発生しやすさ（出現率）」が10倍以上高い — ただし条件付きサブセットの大半は両者ではなく「未分類（other）」機種

## 背景
ユーザーの事前予測「ジャグラーには設定が入りやすいがその他には入りにくいため、この特徴が見えるか疑問」を検証する目的で、条件付きサブセット（直近X_dayで大負け）内でのjug+bt（Aタイプ系）とhana+oki（AT系）の**出現率**（その機種タイプの全行数に対する条件成立行数の割合）を両ホールで比較した。

**【訂正】初回エクスポート時の数値は誤りだった**（`1337 - 64 = 1273` という引き算で「AT系件数」を導出しており、実際に`machine_type`でフィルタしていなかった）。実データで再計算した正しい値は以下の通り：

| ホール | jug+bt 出現率 | hana+oki 出現率 | 比率 |
|---|---|---|---|
| みとや大森町 | 124 / 10,683（**1.16%**） | 106 / 853（**12.43%**） | 約10.7倍 |
| 蒲田七 | 65 / 14,585（**0.45%**） | 146 / 2,184（**6.68%**） | 約14.8倍 |

「出現率」（機種タイプ内での発生しやすさ）で見ると、AT系の方がジャグラー/BT系より10〜15倍高く、ユーザーの事前予測の方向性は支持される。

**しかし**、条件付きサブセットの**構成比**で見ると、両ホールとも9割前後が`machine_type='other'`（`machine_master`未登録の未分類機種）であり、「ほぼ排他的にAT系に発生する」という当初の記述は誤りだった：

| ホール | 条件付きサブセットn | other | jug | bt | hana | oki |
|---|---|---|---|---|---|---|
| みとや大森町 | 2,495 | 2,265 (90.8%) | 85 | 39 | 1 | 105 |
| 蒲田七 | 4,521 | 4,310 (95.3%) | 21 | 44 | 5 | 141 |

## アクション
- 「出現率」（機種タイプ内での発生確率）と「構成比」（サブセット内での占有率）を**混同しないこと**。「Xタイプで起きやすい」と「サブセットの大半がXタイプ」は別の主張であり、片方が成り立っても他方が成り立つとは限らない（`machine_type='other'`が母数として最大であるため）
- 派生変数の算出は必ず実データに対する直接フィルタ・集計で行い、**他の集計値からの引き算で間接的に求めない**（`1337-64=1273`のような操作は、母集団に第三のカテゴリ（other）が存在する場合に必ず誤りを生む）
- 「差枚」「回転継続」などプレイヤー行動由来の指標を分析する際は、**最初から機種タイプ（jug/hana/oki/bt_flag, またはmachine_type）で層別し、`other`カテゴリの比率も必ず確認すること**
- jug/bt・hana/oki機種でこの種の条件付きサブセットのサンプル数が極端に少ない（n<150）場合、AUC等の評価指標は統計的に無意味（評価不能と明記すべき）。無理に解釈しないこと

## 例
```python
sub = df[df['had_big_loss_prev_xday'] == 1]
print(sub['machine_type'].value_counts())  # 'other' の比率を必ず確認する

# 出現率は必ず実フィルタで計算する（引き算で求めない）
at_full = df[df['machine_type'].isin(['hana','oki'])]
at_sub  = sub[sub['machine_type'].isin(['hana','oki'])]
print(f"AT系出現率: {len(at_sub)}/{len(at_full)} = {100*len(at_sub)/len(at_full):.2f}%")
```

