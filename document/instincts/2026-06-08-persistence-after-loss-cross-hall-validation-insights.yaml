# 「大負け後persistenceシグナル」のホール間符号逆転（みとや+0.0146 vs 蒲田七-0.0104）自体が『同じ現象でも予測的意味がホール固有』の有効な証拠 — だが「AT系サブセットでも符号が逆転する」という補強テストは、誤ったサブセット定義に基づいており無効だった

## 背景
当初、「現象の発生条件（AT系への集中）は共通でも、その現象の予測的意味はホールで逆転する」ことの**追加証拠**として、AT系サブセットに限定したリフト比較（みとや+0.0106 vs 蒲田七-0.0058）を報告した。

**【訂正】このAT系サブセットの定義自体が誤りだった。** 隣接知見（big-loss-persistence-...）で訂正した通り、「AT系サブセットn=1,273/n=2,472」は引き算による誤導出であり、実際に`machine_type`でフィルタした値ではない。正しくフィルタすると：

- みとや大森町: AT系（hana+oki）の条件付き行数は**わずか106件**（全データ26,765件中）
- 蒲田七: 同**146件**（全データ45,829件中）

walk-forward検証の各foldの検証期間に分配すれば数十件規模となり、AUC比較は統計的に意味をなさない。したがって「AT系サブセットでも符号が逆転する」という補強証拠は**実質的に検証されていない**（捏造ではないが、誤った定義で計算した数値をそのまま採用してしまった）。

**ただし、本知見の核心的主張（同じ現象でもホールにより予測的意味が逆転する）自体は、隣接知見`persistence-after-loss-signal-fails-cross-hall-replication`が報告した「条件付きサブセット全体でのリフト符号逆転」（みとや+0.0146 vs 蒲田七-0.0104, n=1,337 vs n=2,505 — これは正しく計算されている）だけで十分に裏付けられる。** AT系限定の再テストは「念のための補強」のつもりだったが、不要であり、かつ誤りを含んでいた。

## アクション
- ホール間で同じ行動パターンが観測されても、**それが同じ予測的価値を持つと仮定しないこと**。これ自体はCLAUDE.md記載の既存知見（ホール別個別モデルが平均+2.44%AUC改善）を補強する
- ただし、**主張の根拠として「最も単純で正しく計算された比較」を優先し、補強のために派生・細分化したサブセットを追加すると、サンプルサイズの縮小と定義ミスのリスクが増す**ことを認識すること。「念のための補強分析」がかえって主張全体の信頼性を損なう場合がある（本件のように）
- サブセットを細分化して再検証する前に、**そのサブセットのサンプルサイズが統計的に意味を持つ規模か**を必ず事前に見積もること（n<150では機種タイプ別のAUC比較は評価不能）
- 「構造は普遍的（プレイヤー行動・機種特性由来）」「意味はホール固有（設定投入戦略由来）」という二層構造の枠組み自体は今後も有効だが、AT系内での意味の逆転は**未検証の仮説**として扱うこと（再検証にはより多くの大負けサンプルが必要 = DB拡張後に再評価）

## 例
```python
# 補強分析を追加する前に、まずサンプルサイズを見積もる
at_sub = df[(df['had_big_loss_prev_xday']==1) & (df['machine_type'].isin(['hana','oki']))]
print(f"AT系条件付きサブセット: n={len(at_sub)}")
if len(at_sub) < 150:
    print("→ walk-forward再検証には小さすぎる。補強テストとして採用しない（評価不能と明記）")
```

