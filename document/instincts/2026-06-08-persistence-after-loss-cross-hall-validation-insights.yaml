# 沖ドキ!とハナハナは、フラグ上は「Aタイプ系」に見えても、実際の設定投入傾向はジャグラーと全く異なる固有の挙動を持つ — ユーザーのドメイン訂正が行動データで実証された

## 背景
セッション中、私は`is_at = hana_flag | oki_flag`という二分類を作って「AT系 vs ジャグラー系」という対立軸で分析しようとしたが、ユーザーから次の訂正を受けた：
- 「沖ドキはAT機の一種だが、関東では設定をあまり入れられない特殊な台」
- 「ハナハナもAタイプだが、ジャグラーと比較すると圧倒的に設定投入傾向が少ない」

つまり、沖ドキ・ハナハナ・ジャグラーはいずれも一般的な機種カテゴリ表では近い位置に分類されることがあるが、**ホールの設定投入戦略における実際の扱われ方は三者三様**。

この訂正を実データ（「直近X_dayで大負け→翌X_dayも回され続ける」現象の機種シリーズ別出現率）で検証したところ、見事に裏付けられた：

| 系統 | 出現率 |
|---|---|
| ジャグラー系 | 0.95% |
| ハナハナ | 1.16% |
| BT系（混在） | 2.29% |
| **沖ドキ!系** | **13.69%** |
| その他（主にAT/ART機） | 14.87% |

沖ドキの挙動（13.69%）はジャグラー/ハナハナ（〜1%）ではなく、本来のAT/ART機グループ（14.87%）に酷似しており、「沖ドキはAT機の一種」というユーザーの認識を行動データが裏付けた。

## アクション
- 機種を「Aタイプ/AT機」のような教科書的な二分類でグルーピングする前に、**ホールでの実際の設定投入傾向についてユーザー（ドメインエキスパート）に確認すること**。表面上同じカテゴリに属する機種でも、ホール戦略上は全く別の扱いを受けていることがある
- ユーザーから得たドメイン知識は、可能な限り**行動データで裏付け（またはクロスチェック）すること**。本件では「出現率」という単純な集計だけでユーザーの主張が定量的に裏付けられた
- 機種グルーピングを設計する際は、二値化（A vs AT）よりも**機種シリーズ単位（jug/hana/oki/bt/other）で個別に評価する**ことを基本方針とする。「広いカテゴリにまとめると本質を消してしまう」機種が存在することを前提とすること

## 例
```python
# 二値化グルーピングの前に、シリーズ単位の出現率を必ず確認する
for flag, label in [('jug_flag','ジャグラー'),('hana_flag','ハナハナ'),('oki_flag','沖ドキ'),('bt_flag','BT系')]:
    full_n = (df[flag]==1).sum()
    sub_n = (df[(df['had_big_loss_prev_xday']==1) & (df[flag]==1)]).shape[0]
    print(f"{label}: {sub_n}/{full_n} = {100*sub_n/full_n:.2f}%")
# 系統間で出現率が大きく異なる場合、二値化グルーピングは情報を失わせる
```

