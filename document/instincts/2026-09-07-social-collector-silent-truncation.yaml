# X収集は成功を装って欠落する。件数でなく「日付カバレッジ」と「フィールドの末尾」を検証する

## Core claim
twitter_monitor の収集は、失敗を例外にせず**成功報告の形で欠落を返す**。
件数・終了コード・ログの警告はいずれも欠落を検出しない。検証は
(a) 日付のカバレッジ (b) 取れた文字列の末尾 の2点で行う。

## Evidence
- n_observations: 3（いずれも独立に発生し、いずれも EXIT=0・警告なし）
- data scope: scraper/twitter_monitor、8アカウント、2026-06-01〜2026-09-07

1. **プロフィール巡回の深さ制限**
   X のプロフィールタイムラインは約2.5週間で遡りが止まる。scrollHeight が
   30回連続で変化しなくても例外は出ず、その時点までを「取得完了」として返す。
   → 日付窓検索（`from:handle since: until:`）へ切り替えて解決。

2. **19日分の無言の欠落**
   「226件取得」という成功報告の裏で 2026-08-14〜09-01 が空だった。
   件数が正の値だったため、ログを読んでも異常に見えなかった。
   → `run_daily.py` に、直近30日のうち投稿を取得できた日数を数える
     事後チェックを追加（25日未満で警告）。

3. **本文の折り畳みによる切断**
   タイムラインと検索結果の article は長文を畳むため、保存された
   `tweet_text` は 130〜180 字で切れる。9/7 楽園蒲田の予告は
   **165字 → 個別ページでは632字**。切れる位置が悪く、

   > アンケート内容は下記3つで、全てが発動

   の直後で終わっており、**仕掛けの列挙が丸ごと欠落**していた。
   予告検証では本文そのものがデータなので、これは分析の前提を壊す。
   → `fetch_full_text.py` で個別ステータスページから取り直す。

## Interpretation
共通するのは「部分的な結果が正常な結果と区別できない形で返る」こと。
3件とも別の原因（無限スクロールの終端・巡回深さ・DOM の折り畳み）だが、
症状は同じで、いずれも**下流の分析が静かに間違う**。

これが意味しないこと: 収集コードにバグがあるという話ではない。
X 側の表示仕様に素直に従うと欠落する、という構造の問題なので、
リトライや待機時間の調整では直らない。

## Action
1. 収集の成功判定に件数を使わない。**日付カバレッジ**（対象期間のうち
   投稿を取得できた日の割合）を必ず出す
2. 文字列フィールドは**末尾を目視する**。`length()` の分布が
   130〜180 に固まっていたら折り畳みを疑う
3. 取り直しは**元フィールドを上書きしない**。`full_text` のような別列に
   入れ、短い投稿では両者が一致することを突き合わせで確認できるようにする
4. 個別ページの取得はアクセス数が跳ねるので、`--contains` と期間で
   対象を絞ってから使う（蒲田関連に絞れば 322 件で済んだ）

