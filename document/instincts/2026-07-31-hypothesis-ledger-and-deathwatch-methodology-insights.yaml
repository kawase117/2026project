# セグメント効果の帰属は、過去の平均ではなく現在の実ロスターで確認する

## Core claim
「効果はセグメントXに集中している」という帰属は、Xに属する対象数が時期によって
大きく変わる場合、古い時期の平均を新しい時期の構成に当てはめただけの誤りになりやすい。
帰属を主張する前に、対象期間ごとの実ロスター（実際にそのセグメントに属する個体の一覧）を
直接突き合わせる必要がある。

## Evidence
- n_observations: 1（楽園蒲田・技術介入clean列端番の失効原因調査、2026-07-31）
- data scope: single-hall
- metric scope: payout residual
- result summary: 2025年平均で「効果は本館2F由来」と帰属したが、破断時点(2026-05〜06)の
  本館2Fの対象台は2〜3台まで縮小しており効果を担えない規模だった。実際の減衰は
  対象が10〜11台のまま安定していた別フロア側で起きていた。月次の実ロスターを
  突き合わせて初めて判明した

## Interpretation
- 過去の集計期間で「どこに多いか」を見た数字を、別の時期の構成にそのまま適用すると
  対象数の変化を見落とす
- 対象数が一桁〜十数台のセグメントでは、機種入替や区画再編で対象数自体が
  短期間に大きく動くため、特に起きやすい
- これは撤回でも失効でもなく「スコープの誤帰属」という別種の誤りである

## Action
- セグメント別の帰属を主張する前に、判定対象期間の実ロスター（実個体リスト）を
  月次または該当期間ごとに直接出力して確認する
- 対象数が20台未満のセグメントでは、期間をまたぐ集計値の使い回しをしない

## Status
- status: active
