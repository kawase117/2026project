# 楽園蒲田DD22は「末尾ゾロ目全体」が強く、名指し機種・末尾22単独には優位性が無い

## 背景
2026-09-22、kawasakislotは「早番ならカバネリor末尾ゾロ目」と予告したが、結果はカバネリ26台平均-236で
外れ、一方で末尾ゾロ目台(57台)全体は平均+965(ホール平均+180に対し超過+785)で的中した。過去7回の
2〜8月22日分析でも末尾ゾロ目全体の超過は平均+440(p=0.007〜0.059)だが、末尾22単独(7台)は2122という
1台の突出(過去に入っていたカバネリ)を除くと有意差が消えることを既に確認済み([[project_rakuen_2004... 系]]、
本セッションの検証)。9/22も末尾22の7台は割れており(2022+5286・3122+2524は良いが1022-4238・2122-476は悪い)、
末尾22専用の優位性は今回も再現しなかった。

## アクション
楽園蒲田のDD22予測では、予告が名指しした機種(カバネリ等)を無条件に本命にしない。名指し機種の直近の
機種内投入状況(全台合算のRB確率など)を別途確認し、外れた場合の代替として「末尾ゾロ目台全体」を
機種を問わず監視する。末尾22の台だけを他のゾロ目末尾より優先する根拠は無い。

## 例
9/22結果: カバネリ26台平均-236(外れ) / 末尾ゾロ目57台平均+965、ホール平均+180に対し超過+785(的中)。
上位はかぐや様2000(+15477,上限)・禁書目録2188(+11905)・邪神ちゃん2111(+10715)でカバネリ以外が牽引。
