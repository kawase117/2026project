# ヒロキ東口の予告は「型」は再現するが「機種」は再現しない

## 背景
2026-09-22裏破天荒の答え合わせで、前回8/26に的中した型(機種まるごと2つ・1機種1/2以上・並び5箇所・
店内10%以上)を構成する具体的機種は、8/26(モンキーV・炎炎2・マギレコ)と9/22(SAO2・東京喰種・カバネリ)で
まったく重ならなかった。しかし「型」自体(機種まるごと2機種以上・対象5機種中1機種以上が1/2規模・
3台並び5箇所以上・店内10%以上が優秀)は2回とも成立した。予告文の「前回は◯◯だった」という実績列挙を
次回の機種選びの根拠に使うと外す。

## アクション
ヒロキ東口の破天荒/裏破天荒系の答え合わせ・次回予測では、前回の名指し機種の再来を期待しない。
代わりに「型の各項目(まるごと2機種以上/対象5機種の一部/並び5箇所/店内10%)が今回も成立するか」を
個別に検証する。対象5機種のうち新規名指し機種(初出)を過小評価しない([[project-hiroki-higashiguchi-asurobo-hatenko]]の
「新規名指しは外すと信頼が落ちるので入りやすい」仮説と合わせて見る。2026-09-22はSAO2という新規名指しが
3台全勝+平均+3320で最強だった)。

## 例
8/26: モンキーV(まるごと的中+1930)・炎炎2(まるごと外れ-1728)・マギレコ(1/2的中+2615)
9/22: モンキーV(まるごと外れ-443)・炎炎2(まるごと的中+739)・マギレコ(1/2外れ-1197)、SAO2(新規名指し・3台全勝+3320)
→ 個別機種の相関はほぼ無いが、型の充足率(4項目中4項目)は両日とも100%。

