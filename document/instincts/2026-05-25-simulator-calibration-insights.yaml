# 3台目以降は勝率が急落。session2までが実践的な上限

## 背景
session2は高勝率（63.6%）だがsession3以降は基準より低い:
- session3: 38.5%（session1の43.8%より低い）
- session4: 25.0%（全sessionで最低）

session3+の発生日数: 13日（全32日中40%）→ session3まで打つのは珍しくない。
しかし勝率は基準を下回る → 期待値が低い状態での継続になっている。

## アクション
立ち回りの実践的ガイドライン:
- session1: 予測に基づく初期選択（勝率43.8%）
- session2: 情報蓄積後の再選択（勝率63.6%、最も高い）→ 積極的に実行
- session3以降: 勝率が急落（38.5%以下）→ 継続するなら強い根拠が必要

シミュレーターでは「session2打ち切り戦略」「session3継続戦略」の期待値を比較する。
session3以降の投資は収支への寄与が低く、撤退の方が期待値が高い可能性がある。

## 例
session3が正当化されるケース:
- 明確な高設定示唆が1台目・2台目で確認できた（不発）かつ末尾が判明して未消化台がある
これ以外の「なんとなく続ける」session3は期待値マイナスの可能性が高い。
