# session2の勝率はsession1より高い。単純な劣化モデルは実態と逆

## 背景
稼働日誌CSV（2026-04-01〜2026-05-20、99行）のうちエナ・ゾーン除外後71セッション/32日を分析:

| session_num | N  | Wins | WinRate |
|------------|-----|------|---------|
| 1          |  32 |   14 | 43.8%   |
| 2          |  22 |   14 | 63.6%   |
| 3          |  13 |    5 | 38.5%   |
| 4          |   4 |    1 | 25.0%   |

alpha(session1->2) = 1.455 でsession2が最高勝率。
シミュレーター設計時の仮説「alphaは1未満で再チャレンジ毎に劣化」は実態と逆だった。

## アクション
シミュレーターのalpha係数モデルを「単純な等比劣化」から以下の非線形モデルに変更する:
- P_win(1) = 0.438（base）
- P_win(2) = 0.636（session1の1.455倍、上昇）
- P_win(3) = 0.385（session2の0.61倍、急落）
- P_win(4) = 0.250（session3の0.65倍、継続低下）

session2だけ特別に高いことの解釈は2つ:
1. 情報蓄積効果: session1で外した経験で台配置の理解が深まりsession2の選択精度が上がる
2. 選択バイアス: session2に移行する日は「session1での外しに確信がある日」=「フロアに高設定の実在が見えた日」に限られる

どちらの解釈でも「session2は利用価値が高い」という行動指針は変わらない。

## 例
直感的な立ち回りとの整合:
「1台目で外したが高設定がフロアに明らかに入っている日に、次の台に移る」= session2
この状況は情報が最も豊富でかつ高設定が残存しているため、勝率が上昇することは理にかなっている。

