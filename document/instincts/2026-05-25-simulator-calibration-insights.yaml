# P_moveの実測値は0.688。シミュレーター初期仮定0.3は大幅に過小

## 背景
稼働日誌71セッション/32日の設定狙いデータ:

| 1日の台数 | 日数 |
|----------|------|
| 1台      |  10日 |
| 2台      |   9日 |
| 3台      |   9日 |
| 4台      |   4日 |

2台以上打った日 = 22/32日 → P_move = 0.688
シミュレーター初期仮定の0.3（1日に再チャレンジする確率30%）は実態の半分以下だった。

全体勝率は47.9%、全体収支は+497,091円（約50日間）。

## アクション
シミュレーターのP_moveを0.3から0.688に修正する。
また日別セッション数は1〜4台の分布を持ち、平均セッション数 = 71/32 ≈ 2.2台/日。
分布を使うなら Poisson(lambda=1.2) のゼロ切り捨てモデル（1〜4台の分布を近似）が適当。

## 例
32日中22日が複数台 → 「1日1台で終わる」のは少数派（31%）。
多くの稼働日は複数台をハシゴしており、シミュレーターは複数台前提で設計すべき。

