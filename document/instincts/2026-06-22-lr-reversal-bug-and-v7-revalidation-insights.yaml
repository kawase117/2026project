# predict_day.pyは当日データなしでも動作しなければならない

## 背景
predict_day.pyは `actual`（当日の台リスト）を使って予測対象台を特定する。
しかし実運用では当日のデータはまだDBに入っていない（スクレイピングは翌日以降）。
6/22予測で `ERROR: 20260622 のデータがDBにありません` が発生した。

回避策: 当日データがない場合は直近日の台リストを代用する。
```python
if actual.empty:
    latest_date = train["date_dt"].max()
    actual = train[train["date_dt"] == latest_date].copy()
    actual["date"] = TARGET
    actual["date_dt"] = target_date
    actual["diff_coins_normalized"] = 0
    actual["games_normalized"] = 0
```

## アクション
- predict_day.pyのactualが空の場合は直近日の台リストで自動フォールバック
- フォールバック時はINFOログを出力して代用日を明示
- 台の入れ替え（新台導入・撤去）は反映されないことをユーザーに伝える

## 例
```
$ python -m ... predict_day --date 20260622
INFO: 20260622 のデータなし → 直近日 2026-06-21 の台リストを代用
（予測結果が正常に出力される）
```

