# LR修正後、v7の全設計判断は再検証が必要

## 背景
v7の3つの設計判断はすべてLR逆転状態のWFバックテスト結果に基づいている:
1. COMPONENT_LIFT_V7: セグメント別lift値 → LR混在データから算出
2. SEGMENT_HIST_RATIO_V7: セグメント別hist比率 → 同上
3. EXCLUDED_SEGMENTS_V7 = {"2F_R_N"}: 2F_R_N除外 → lift≈1.0はLR希釈の結果

LR修正後にWFバックテストを再実行すると:
- 2F_R_Nに有効なコンポーネントが出現する可能性がある
- 各セグメントのlift値が大幅に変わる可能性がある
- セグメント間のhist比率も再計算が必要

## アクション
- LR修正後のバックテストではv7のウェイト固定値をそのまま使い、「旧ウェイト×正しいLR」の成績を確認
- 次にlift値を再計算し、新ウェイトテーブルを構成（v8候補）
- 2F_R_N除外の判断を再検証: 修正後のliftが1.0を有意に超えていれば除外解除
- Codexバックテストプロンプト(2026-06-22-v7-walkforward-backtest.md)はLR修正済みの状態で実行されるので、結果はそのまま使える

## 例
```
LR修正前のlift (旧):     LR修正後のlift (予想):
2F_R_N c1: 1.01           → ???（要再計算）
2F_R_N c3: 0.99           → ???
2F_R_N c4: 1.02           → ???
→ 全て≈1.0 → 除外         → 有意なliftが出る可能性あり → 除外解除
```

