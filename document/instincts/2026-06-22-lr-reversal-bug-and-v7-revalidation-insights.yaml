# セグメント別コンポーネントのlift≈1.0はLR混在による希釈を疑え

## 背景
WFバックテスト166日で2F_R_Nの全コンポーネントがlift≈1.0（無効）と判定された。
これを根拠にv7では2F_R_Nを予測対象から除外した。

しかし原因はLR逆転バグ（56%のセクションでLRが物理的に逆）であり、
旧「2F_R_N」は実質的に左右ランダムサンプルだった。
セグメント別に集計するC1(DD), C3(角番), C4(曜日), C5(イベント), C6(ゾロ目)は
全て左右の異なる物理特性が混ざり、シグナルが打ち消し合っていた。

影響を受けないのはC2(末尾, 全体集計)とhist系(台個別履歴)のみ。

## アクション
- セグメント別コンポーネントがlift≈1.0のとき、まずセグメント定義（LR分割）の正しさを検証する
- LR修正後は以下を全て再計算する必要がある:
  - COMPONENT_LIFT_V7（セグメント別lift値）
  - SEGMENT_HIST_RATIO_V7（セグメント別hist比率）
  - EXCLUDED_SEGMENTS_V7（除外セグメント）
- 「シグナルがない」と結論する前に「シグナルが希釈されている」可能性を排除する

## 例
```
旧「2F_R_N」の構成:
  物理的に右の台: 44%  ← 本来のR
  物理的に左の台: 56%  ← 本来はLに属すべき台
  → 左右の特性が混在してlift≈1.0（ランダムと同等）に見える
  → v7で除外 → 実は有効なシグナルを捨てていた可能性
```

