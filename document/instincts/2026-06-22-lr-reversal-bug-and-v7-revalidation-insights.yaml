# v7の6/21単日評価は結論を出すには不十分

## 背景
v7を6/21で評価した結果:
- v7: avg_diff=-332, WR=46%, MR=95.7%, hit@50=3, Spearman=0.085
- v6: avg_diff=+408, WR=42%, MR=107.1%, hit@50=7, Spearman=0.124
v7が大幅悪化に見えるが、N=1日の評価では統計的に有意な比較ができない。
さらにこの評価自体がLR逆転バグの影響下で実行されている。

## アクション
- 単日評価はあくまで参考値として扱い、採用/不採用の判断にはWFバックテスト（166日以上）を使う
- 未検証のモデル変更を本番予測に使わない（v6aをメイン、v7を参考値が正しい運用）
- LR修正後の状態で再度バックテストを行い、正しいlift値に基づいてv7（またはv8）のウェイトを決定する
