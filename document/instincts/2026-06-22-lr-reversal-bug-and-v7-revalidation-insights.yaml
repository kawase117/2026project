# _infer_lr は台番号ではなくX座標で左右を判定しなければならない

## 背景
`_infer_lr()` は台番号の中央値でLRを分割していた（小さい方=L、大きい方=R）。
しかし蒲田7では島ごとに台番号の並び方向が反転する（奇数列は左→右、偶数列は右→左）。
結果として2Fの55.6%、3Fの57.7%のセクションで物理的な左右が逆転していた。

修正: X座標の中央値でLRを判定する。
```python
# Before (WRONG): 台番号ベース
mn = pd.to_numeric(coords["machine_number"], errors="coerce")
section_median = mn.groupby(coords["section"]).transform("median")
out.loc[valid & (mn <= section_median)] = "L"

# After (CORRECT): X座標ベース
x = pd.to_numeric(coords["X"], errors="coerce")
section_median_x = x.groupby(coords["section"]).transform("median")
out.loc[valid & (x <= section_median_x)] = "L"
```

## アクション
- LR判定は必ず物理座標(X)を使用する
- 台番号の大小は物理配置と一致しない前提で設計する
- 修正後は全セクションで逆転率0%を確認してからコミットする

## 例
```
セクション 2115-2128:
  修正前: L(台番2115-2121) X=15→9 (物理的に右), R(台番2122-2128) X=8→1 (物理的に左) → 逆転
  修正後: L(X≤8の台) = 物理的に左, R(X>8の台) = 物理的に右 → 正しい
```

