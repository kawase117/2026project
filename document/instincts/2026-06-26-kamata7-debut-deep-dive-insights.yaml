# 蒲田7 定番(pre)×強ゾロ目 = +620 は全データ中の最大セル

## 背景
2026-06-26 蒲田7 深堀りEDA。debut_phase_full × dd_category のクロス集計。
pre_existingを含めた完全版で検証。主仮説としてBonferroni p<0.017 で有意。

## 発見

| dd_category | 定番(pre) | 181日+ | 差 |
|-------------|-----------|--------|-----|
| **強ゾロ目** | **+620** (n=6,398) | +420 (n=275) | +200 |
| 月末 | +407 (n=2,041) | +473 (n=88) | -66 |
| 7系 | +332 (n=17,783) | +48 (n=865) | +284 |
| ゾロ目 | +231 (n=11,939) | +196 (n=682) | +35 |
| 1系 | +280 (n=14,913) | +104 (n=669) | +176 |
