# 蒲田7 新台はLセクション（大島）で最も回収され、Sセクション（小島）で最もまし

## 背景
2026-06-26 蒲田7 深堀りEDA（補助仮説、探索的）。
debut_phase × section_size_group のクロス集計。

## 発見

| debut_phase | S (≤8台) | M (9-14台) | L (15台+) |
|-------------|----------|------------|-----------|
| 1-14日 | **-30** | -220 | **-531** |
| 15-60日 | **+77** | -127 | -184 |
| 61-180日 | +42 | **+146** | +91 |
| 181日+ | +56 | +126 | +107 |

新台期（1-14日）のS vs L差: 501枚。
小島(-30) vs 大島(-531)で劇的な差。

## 解釈
- 大島（L）は人目に付きやすく集客力が高い → 新台は大島に配置して低設定で回収
- 小島（S）の新台はニッチ機種が多い → 設定投入でテコ入れの必要あり
- 61-180日以降はM(中島)が最強 → 安定期のテコ入れは中規模セクションに集中

## アクション
- 蒲田7の新台を打つなら小島（Sセクション）の方がまし
- ただしSセクションのn=455（1-14日）で統計的にやや不安定
- 探索的結果のため、追加検証後にML特徴量への組み込みを判断
