# 蒲田7 3F_A新台期は唯一のプラス（+158）だが統計的に不安定

## 背景
2026-06-26 蒲田7 深堀りEDA。debut_phase × floor_seg のクロス集計。
主仮説としてBonferroni p<0.017 で有意（ε²=0.020）。

## 発見

| floor_seg | 1-14日 | 15-60日 | 61-180日 | 181日+ |
|-----------|--------|---------|----------|--------|
| 2F_N | -358 | -158 | **+133** | **+146** |
| 3F_N | -429 | -164 | +71 | +38 |
| 3F_A | **+158** | +16 | +78 | +127 |

3F_A（ジャグラー系3F）は新台期1-14日で唯一のプラス+158。
ただし n=183, n_machines=2 で統計的に不安定。

2F_Nが最も明確な3フェーズ（-358 → +133 → +146）。
3F_Nは改善するが181日+で+38止まり。

## アクション
- 3F_A新台期のプラスは機種固有効果として扱い、構造的パターンとは断定しない
- 2F_N vs 3F_Nの差（181日+で+146 vs +38）はセグメント別特徴量設計に活用できる
- confidence 0.50 → 3F_Aの新台データが蓄積されたら再検証

