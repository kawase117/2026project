# 蒲田7 pre_existingのイベントプレミアムはファミリーで大きく異なる（jug +150 vs bt -23）

## 背景
2026-06-26 蒲田7 深堀りEDA。pre_existingを含めた debut_phase_full × family × is_any_event の
層別クロス集計。Bonferroni補正 p<0.017 で有意（p≈0, ε²=0.015）。

## 発見

| ファミリー | フェーズ | 通常日 | イベント | プレミアム |
|-----------|---------|--------|---------|-----------|
| jug | 181日+ | +68 | +186 | +118 |
| jug | **定番(pre)** | +161 | +311 | **+150** |
| other | 181日+ | +14 | +181 | +167 |
| other | 定番(pre) | +244 | +313 | +69 |
| bt | 181日+ | -32 | +158 | +190 |
| bt | **定番(pre)** | +285 | +262 | **-23** |

### ジャグラー（jug）
- pre_existingでプレミアム+150。通常日+161からイベント日+311への上乗せ。
- 「看板台として常時高設定 + イベント日にさらに上乗せ」の構造。

### BT系（北斗等）
- pre_existingでプレミアム**-23（逆転）**。通常日+285で十分高水準。
- イベント日に追加投入する必要がないとホールが判断している可能性。

### other系
- pre_existingでプレミアム+69。181日+の+167より小さい。
- pre_existing other は通常日+244と高水準のため、追加余地が小さい。

## アクション
- 蒲田7のイベント日にジャグラー系定番台は最有力ターゲット（pre +150プレミアム）
- bt系はイベント日でなくても通常日+285の高水準を狙える
- ML特徴量として debut_phase × family × is_event の3軸交互作用を検討

