# 蒲田7 181日+の週末プレミアムは平日の4倍（+230 vs +50）

## 背景
2026-06-26 蒲田7 深堀りEDA（補助仮説、探索的）。
debut_phase × day_of_week のクロス集計。p値は記載するが有意判定はしない。

## 発見

### 181日+（定番台に近い新規導入機種）
| 曜日 | avg_diff |
|------|----------|
| 土 | **+234** |
| 日 | **+227** |
| 水 | +117 |
| 月 | +70 |
| 木 | +54 |
| 火 | +52 |
| 金 | **+7** |

土日（+230前後）vs 平日（+50前後）で約180枚の差。
金曜が+7で最も低いのは「金曜は回収→土曜にイベント投入」の準備パターンか。

## アクション
- 蒲田7の定番台は土日に優先して狙う
- 金曜は定番台でも低水準 → 避けるべき
- 探索的結果のため、ML特徴量への組み込みは追加検証後に判断

