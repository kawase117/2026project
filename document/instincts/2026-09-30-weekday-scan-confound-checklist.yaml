# 曜日別スキャンで「強い曜日」の大半は交絡(イベント日 or 単発外れ値)だった

## Core claim
直近1ヶ月・1曜日あたり3〜5サンプル程度の曜日別RB確率/差枚スキャンで「特定曜日が強い」という結果が出た場合、実際にその曜日固有の効果である確率より、(a) 確定イベントDDがその月にたまたまその曜日に乗った、(b) 単一の台・単一の日の外れ値が平均を支配した、のいずれかである確率の方が高い。

## Evidence
- n_observations: 8件(みとやSHAKE、楽園サンダーV・ニューキングハナハナV-30、蒲田7タコスロ・異世界かるてっと、蒲田1ハナビ、他)
- data scope: 4ホール(みとや大森町・楽園蒲田・蒲田1・蒲田7)、BT/A+AT機8機種以上
- metric scope: rb_probability(一撃マスターのposterior事後分布)、diff_coins_normalized
- result summary:
  - みとやSHAKE「火水金に設定5濃厚」(全期間プール)→直近1ヶ月では全曜日拮抗(36-48%)に消失。設置台番号が707/708→706→815→760+815と半年で入れ替わっていた交絡
  - 楽園ニューキングハナハナV-30「木曜が強い」(設定4=99%)→4回中1回(9/17、HANAイベントDD)だけが+2,446.8で牽引、他3回はマイナス〜小幅プラス。**イベント日交絡確定**
  - 蒲田7異世界かるてっと「金曜が強い」(設定5以上62%)→4回中1回(9/11、蒲田7イベントDD)だけが+1,033.3で牽引、他3回は+66.7〜+366.7。**イベント日交絡確定**
  - 楽園サンダーV「金曜が強い」→イベント日ではない9/25という単発日が+2,135.2で牽引(交絡ではないが再現性未検証)
  - 蒲田7タコスロ「火曜が強い」→単発日(9/15)依存。イベント日(9/22)はむしろ最弱
  - 蒲田1ハナビ「日曜が強い」→単発日(9/20)依存。イベント日(8/30, 9/27)は中間的

## Interpretation
- 曜日パターンを主張する前に、その曜日に該当する実日付を確定イベントDD暦(`eda/event_calendar.py`のconfirmed/unconfirmedプロファイル、または各ホールのkamata7-event-day-definition-fix等)と突き合わせる。イベント日が1件でも混入していれば、それを除いた残りの日だけで再度平均を見る
- 除いても偏りが残るなら、日別の内訳(1日単位の差枚・回転数)を必ず表示し、1日の外れ値が平均を支配していないか確認する。3〜5サンプル中1サンプルが牽引しているだけなら「曜日の法則」と呼ばない
- これは否定ではない。交絡を除いた上でなお偏りが残るケース(今回は出なかった)は正当な曜日効果として扱ってよい

## Action
- 曜日別スキャンの結果を報告・記録する際は、必ず「(1)該当曜日の実日付一覧→(2)イベントDDとの重複チェック→(3)日別内訳での単発依存チェック」の3手順をワンセットで実行してから結論を出す
- HYPOTHESIS_LEDGER.mdに記録する際も、交絡が確認できたものは「イベント日の効果」として書き直し、曜日仮説としては残さない
- 直近1ヶ月のような短期窓は、この2種の交絡を生みやすい。可能なら数ヶ月分に広げてから曜日を主張する

