# 機種効果と座席効果の切り分けは「同一座席の機種入替前後ペア比較」で行う

## Core claim
機種の高設定配分仮説を検証する際、任意の期間中点でのsplit-halfではなく、実際の機種入替イベント日を境に同一座席の前後を比較する方が、座席(位置)効果と機種効果を切り分けられる。

## Evidence
- n_observations: 蒲田七38台(鉄台2026番除外後のペア比較)
- data scope: single-hall(蒲田七)
- metric scope: diff_coins_normalized、baseline比(同カテゴリ他機種平均比)
- result summary: 2026-06-08に蒲田七machine_number 2011-2028・2032-2052の39台が一斉にモンキーターンV→甲鉄城のカバネリ 海門(うなと)決戦へ入替。既知鉄台2026番(常時setting6、平均diff+3600〜+4900と桁違い)を除いた38台で同一座席ペア比較した結果、モンキーターンV時代のbaseline比delta平均+262.2に対し、カバネリ成熟期(入替30日後以降)は-11.6。同一座席でカバネリ期の方が高かったのは38台中9台(23.7%)のみ。

## Interpretation
- 座席は同一なのに機種を変えたら大きく下落したことは、座席の構造的な強さではなく「モンキーターンVという機種そのものへの優遇」を支持する
- 転換されず残った(座席・機種とも変化なし)モンキーターンV69台のbaseline比deltaは、同イベント日の前後で+136.3→+145.8とほぼ不変であり、一斉入替はホールの機種への優遇方針自体とは無関係な局所的な設置替えだったと分かる
- 中点split-half検証だけでは、機種入替のタイミングと分割点がずれた場合に効果が薄まる・符号が反転する(蒲田七の化物語・カバネリ、楽園の化物語・東京喰種で実際に発生)。イベント日を特定できる場合は必ずそちらを優先する
- 既知の鉄台(常時高設定の特定台番号)が対象集合に混入すると、1台の異常値が平均を大きく歪める。蒲田七2026番は他の座席の10倍以上の値を持つ

## Action
1. 対象機種が占有していたmachine_numberの中で、実際に別の機種へ入れ替わったイベント日をmachine_detailed_resultsのmachine_name変化点から特定する
2. そのイベント日を境目に、同一座席の「機種Aだった期間」と「機種Bだった期間(新台除外30日を適用した成熟後データ)」をペアで比較する
3. 既知の鉄台が対象集合に混入していないか必ず確認し(recommendation-iron-machine-warning参照)、混入していれば除外して再計算する
4. 機種入替が起きていない残存機種についても同じイベント日の前後でdeltaが変化していないかを確認し、ホール側の方針転換と区別する
5. **機種Aの期間と機種Bの期間を直接比較するだけで終わらせない。** 必ずそれぞれの在籍期間に対応するcontemporaneous baseline(同じ日付範囲の他機種平均)も計算し、baseline比のdeltaで両者を評価する。片方の在籍期間だけたまたまホール全体のbaselineが低い(または高い)時期だった場合、単純な期間間の絶対値比較は一方を実際より弱く(または強く)見せる。楽園蒲田の北斗の拳⇔モンキーターン21座席比較で、モンキーターン期の絶対値+39.3は北斗の拳期+339.3より弱く見えたが、モンキーターン期のcontemporaneous baselineが-6.9だったためbaseline比delta+46.2は実質的な優位であり、「弱い」という評価は誤りだった

