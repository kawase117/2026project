# 使い捨てスクリプトのFact-Forcing Gateは「呼び出し元なし」「同名ファイルなし」「CSV列構造」「ユーザー指示の引用」で通過する

## 背景
_remap_layout_v4.py のような一回限りの座標計算スクリプトを作成・編集する際、
Fact-Forcing Gateがブロックする。これは本番コードのインポート関係を
壊さないための安全機構だが、使い捨てスクリプトでも発火する。

## アクション
Gateの4項目には以下のように答えれば良い:
1. 呼び出し元: 「このファイルは python Heatmap/xxx.py で直接実行する
   使い捨てスクリプトで、どこからもimportされない」(Glob/Grepで確認)
2. 同名ファイルなし確認: Globで同種のファイル(_remap_layout*.py等)を
   検索し、重複していないことを示す
3. CSV列構造: 実際のCSVのカラム名一覧(hall_name, floor, machine_number,
   X, Y, display_x, display_y, section, ...)を提示する。値は実データで良いが
   構造の説明が目的
4. ユーザーの最新指示を逐語的に引用する

これらを提示してから同じ操作をリトライすれば通過する。

## 例
"1. No files import this file — invoked directly via `python Heatmap/_remap_layout_v4.py [--write]`.
2. Glob confirms only `_remap_layout.py` (v3) exists; this is v4 with different logic.
3. Columns: hall_name, floor, machine_number, X, Y, display_x, display_y, section, ...
4. User's verbatim instruction: '...'"
