# 機種カテゴリ効果と位置効果の交絡

## 背景
蒲田7でジャグラー(48.4%) vs AT(42.2%)の6.2pp差を検出したが、
ジャグラーは物理的に3Fの強ゾーン（Q2/Q4）に配置されている。
カテゴリ効果なのか位置効果なのか分離できない。
残差法による分離が必須。

## アクション
- 機種カテゴリ別の差を見る前に、位置効果（セクション平均）を引いた残差で比較する
- 「ジャグラーが強い」ではなく「ジャグラーの位置残差が正か」を問う
- 同じ位置にATとジャグラーが混在するエリアがあれば、そこで直接比較する

## 例
ジャグラー(3117-3362)の104%率48.4% - 同位置の全体平均 = 純粋なカテゴリ効果

