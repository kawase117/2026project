# LR効果はDD条件付きで出現する

## 背景
蒲田7の全期間平均でEven/Odd（LRプロキシ）を比較したところ、
104%率は両方とも43.8%で完全に同値だった。
しかし蒲田7ではsection_size（LR分割のプロキシ）が
分散説明力でLR分割の1000倍有効であることが過去に実証されている。
この矛盾は「LR効果が特定のDD日にのみ発動する」ことを示唆する。

## アクション
- LR効果は全期間平均では検出不能。DD別に層別して初めて見える
- セグメント判別はDD分析と並行して実施する必要がある
- Step2（イベント日判別）の結果をStep1にフィードバックする循環構造を想定せよ

## 例
蒲田7: Even 43.8% vs Odd 43.8% (全期間) → DD別に分解すると差が出現する可能性

