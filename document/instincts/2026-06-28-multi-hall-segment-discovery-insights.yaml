# 冷却ゾーン・加熱ゾーンの検出手法

## 背景
蒲田7の10台ブロック分析で、3060-3090が104%率36.6-37.6%（全体平均-7pp）の
一貫した冷却ゾーンであることを発見。また2200x=37.1%も冷却ゾーン。
逆に3330x=52.7%は最も加熱されたゾーン。
これらはホールが意図的に低/高設定を集中配置するエリアを示す。

## アクション
- 10台ブロック単位で104%率を計算
- 全体平均から±5pp以上逸脱するブロックを冷却/加熱ゾーンとしてマーク
- 冷却ゾーンは回避、加熱ゾーンは優先的に狙う
- DD別に冷却/加熱が変化するかも確認する

## 例
蒲田7冷却: 3060x(37.2%), 3070x(36.6%), 3080x(37.6%), 2200x(37.1%)
蒲田7加熱: 3330x(52.7%), 2150x(50.2%), 2130x(49.3%)

