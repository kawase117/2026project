# 位置クォータイルで戦略ゾーンの大構造が見える

## 背景
蒲田7の3Fで台番号順にQ1-Q4に分割したところ、明確なW字構造が検出された。
Q1(3001-3091)=39.9%、Q2(3092-3182)=45.8%、Q3(3183-3273)=45.0%、Q4(3274-3401)=48.9%。
Q1とQ4の差は9.0ppあり、最大のシグナル。
一方2Fは41.1%-45.3%（4.2pp）で比較的フラット。

## アクション
- フロアごとに台番号順Q1-Q4の104%率を計算し、勾配・W字・U字パターンを検出
- 差が5pp以上あれば「戦略ゾーンあり」と判断
- 均一（差<3pp）ならそのフロアは位置によるセグメント分割の価値が低い

## 例
3F_Q1: 39.9% → 3F_Q2: 45.8% → 3F_Q3: 45.0% → 3F_Q4: 48.9%（W字構造）

