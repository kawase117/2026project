# 他ホール検証手順 v1

## 背景
蒲田7・みとやで蓄積した知見を他ホールに展開するための標準手順を設計した。
6ステップで構成。Step0（ホール選定基準）はバイアス排除のため全ホール実施に決定。

## アクション
### Step 1: セグメント判別
- 10台ブロックの104%率ヒートマップを作成
- 位置クォータイルで大構造（勾配/W字/U字）を検出
- 冷却/加熱ゾーンをマーク
- DD別にヒートマップを再作成し、DD条件付きセグメントを検出

### Step 2: イベント日判別（仮説なしアプローチ）
- DD×セグメントの104%率ヒートマップを全出し
- スパイクを検出してからイベント日定義を帰納的に構築
- 強ゾロ目・周年等の特殊日に注意

### Step 3-4: 要素調査（残差法）
- 階層: 差枚 = セグメント効果 + DD効果(イベント/非イベント) + 要素効果 + ノイズ
- 上位効果を除去してから下位を見る（混入防止）
- 要素: 曜日、DD、台末尾、角番、列、イベント日

### Step 5: バックテスト
- 推薦枠はホール規模に比例（~100台→Top5-10、100-300台→Top10-20、300台~→Top20-30）
- lift@Kを複数Kで評価し、精度急落点を検出
- walk-forward最低60日

### Step 6: パラメータ調整
- 調整パラメータは3-5個に制限（オーバーフィット防止）

## 例
蒲田7検証で判明: LR効果は全体平均では0pp（検出不能）だがDD条件付きで出現。
→ Step1とStep2は循環的に実施する必要がある。

