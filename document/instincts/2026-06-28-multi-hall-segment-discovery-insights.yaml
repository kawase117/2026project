# 10台ブロックヒートマップが標準可視化ツール

## 背景
蒲田7で台番号順10台ブロックの104%率ヒートマップを作成し、
冷却/加熱ゾーン、フロア間差異、位置クォータイル構造を一覧で把握できた。
この粒度が「ノイズを抑えつつ局所構造を捉える」最適バランスである。

## アクション
- 各ホールでまず10台ブロック×104%率のヒートマップを作成する
- 色スケール: 36%-52%を青→黄→赤でマッピング
- フロア単位で行を分ける
- DD別に同じヒートマップを再作成し、条件付きパターンを検出する

## 例
蒲田7: 2Fは35ブロック（比較的均一）、3Fは36ブロック（W字構造あり）
