# イベント日定義は帰納的に構築すべき

## 背景
蒲田7でDD21欠落・月末ハードコード・強ゾロ目未統合が繰り返し発生した。
原因は「イベント日を先に仮説として定義してから検証」するアプローチにあった。

## アクション
- DD×セグメントの104%超え率ヒートマップを仮説なしで全出しする
- スパイクが観測されたDD値を集めてからイベント日の定義を帰納的に構築する
- 「このDDが高い理由」を後から説明するアプローチ
- ベースライン（全日の104%超え率）を先に算出しておく

## 例
蒲田7: DD={1,7,11,21,...}を先に定義→DD21欠落→発見遅延
正解: 全DD(1-31)×セグメントのヒートマップ→スパイク検出→定義構築

