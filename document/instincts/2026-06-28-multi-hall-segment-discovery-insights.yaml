# 残差法の階層的適用手順

## 背景
蒲田7の角番分析で、角1が強く見えたものが実際はセクション効果の混入であり、
全角番で残差マイナスだった過去の経験から、残差法の正しい適用手順を定式化。

## アクション
差枚 = セグメント効果 + DD効果 + 要素効果 + ノイズ の階層で分離する。

Step 1: セグメント別平均差枚を計算（最大の分散源）
Step 2: 各台の「セグメント残差」= 差枚 - 所属セグメント平均
Step 3: 残差に対してDD効果を計算（イベント日/非イベント日で層別）
Step 4: DD残差に対して角番・末尾・曜日等を計算

上位効果を除去せずに下位を見ると偽シグナルを拾う（confounding）。

## 例
蒲田7: 「角1が強い」→ セクション残差で見ると全角番マイナス → セクション効果の混入だった

