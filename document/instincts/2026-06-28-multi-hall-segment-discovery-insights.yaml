# セグメント判別 ≠ 台番号ギャップ分析

## 背景
台番号の連番ギャップ（gap検出）でフロア・島を自動推定するアプローチを試みたが、
ユーザーの意図するセグメント判別とは根本的に異なることが判明。
セグメントとは「ホールが設定投入戦略を変える集団の境界」であり、
差枚データから統計的に検出すべきもの。蒲田7のL/R分割のように、
物理的配置とは独立に戦略が変化するポイントを見つけることが目的。

## アクション
- 台番号ギャップは「フロア判定」にのみ使用する（gap>=100）
- セグメント判別は差枚・104%超え率のヒートマップから帰納的に行う
- 10台ブロック単位の104%率を台番号順に並べ、構造変化を検出する

## 例
蒲田7で台番号ギャップ分析→2F/3Fのフロア分離は正確だったが、
2F_A/2F_N/3F_L/3F_Nといった戦略セグメントの発見には無力だった。

