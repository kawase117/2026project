# 途中集計と確定で一致するのは並びだけ。末尾・ゾロ目は途中で有意に見えても消える

## Core claim
site777の途中経過は「差枚が確定する順序」が **早く大きく出た台から確定する**という
系統的バイアスを持つ。このため途中集計で末尾・ゾロ目のような属性軸を評価すると、
実在しないパターンが有意に見える。**並び（連続台番号のかたまり）だけが途中と確定で一致した。**

## Evidence
2026-08-27 楽園蒲田。ゾロ目（台番号末尾2桁同一）の推移:

| 時点 | 差枚有効n | ゾロ目n | 平均差枚 | 勝率 | 平均差p |
|---|---|---|---|---|---|
| 14:27 | 185 | 15 | +232 | 60.0% | 0.182 |
| 15:30 | 256 | 21 | +1,004 | 76.2% | **0.009** |
| 16:32 | 293 | 27 | +877 | 66.7% | **0.019** |
| 21:09 | 405 | 46 | -84 | 47.8% | 0.833 |
| **確定** | 587 | 59 | **+241** | 39.0% | **0.521** |

15:30時点では機種内比較でも p=0.031 で「交絡では説明できない」と判定したが、
確定では完全に消滅した。末尾1-3の優位も同様（途中 p=0.122 → 確定でバラバラ）。

一方、21:09時点で検出した並びラン7本は **7/7が確定データでも成立**。
確定データでは8ブロック検出、最大は転生1040-1044（5台合計+28,336）。

## Interpretation
- 途中集計で確定するのは高回転かつ大きく動いた台に偏る。属性軸の平均はこの選択に汚染される
- 並びは「隣接する複数台が同時に動く」という構造的な条件なので、選択バイアスに強い
- feedback-statistical-certainty-calibration の逆向きの注意。**途中経過の有意は信用しない**

## Action
- 当日の途中経過では **並びの検出だけを行う**。末尾・ゾロ目・日付語呂の結論は出さない
- 属性軸の結論は差枚有効台が全数に近づいてから、または翌日の確定データで行う
- 途中経過で属性軸を報告する場合は「確定まで結論しない」と明示する
