# 公表アンケートは投入の全体ではない。公表外の機種が最大の投入先になりうる

## Core claim
取材発表アカウントが公表する「全台」「1/2」の指定は、その日の高設定投入の
**一部でしかない**。公表外の機種が公表指定の総和を上回ることがある。

## Evidence
2026-08-27 楽園蒲田。公表された仕掛けは6機種30台のみ
（全台: モンハンライズ・ToLOVEる・スト6 / 1/2: マギレコ・からくり2・かぐや様）。

| 群 | 台数 | 平均差枚 | 合計差枚 |
|---|---|---|---|
| 公表指定 | 41(DB上) | +881 | **+36,112** |
| 公表外3機種 | 35 | — | **+51,536** |

公表外の内訳: 北斗の拳 転生の章2 20台 平均+1,881 合計**+37,628**（20台中11台プラス・
中央値+1,810の真の全台系。台1040-1044は5台合計+28,336の並び）、
モンキーターンV 12台 +913、攻殻機動隊 3台 +984。

**転生1機種だけで公表30台全体を上回った。**

また公表【全台】3機種のうち2機種（ToLOVEる 2/8勝 平均-345、スト6 1/6勝 平均-786）が
明確なマイナス。「全台と公表されたから全台入っている」とは扱えない。

## Interpretation
- feedback-announce-scoring-depth（外部報告の網羅性を信用しない）の具体例。
  公表リストに載っていない機種を必ず全体スキャンで確認する必要がある
- 予告アカウント(kawasakislot)は転生を名指ししており、そちらは的中していた。
  取材発表と予告アカウントで情報源としての性質が違う

## Action
- 公表指定機種の確認と**並行して**、必ず機種別スキャンを全機種に対して回す
- 「公表指定に入っていないのに平均+800超」の機種を毎回洗い出す

