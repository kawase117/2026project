# 期待が集中する属性は午前ほど過小評価される。判別が進む夕方以降に本来の水準へ戻る

## Core claim
事前に期待が集まる属性（予告で名指しされた末尾・機種）は、朝は低設定台まで満遍なく
回されるため平均が沈む。時間が経つと打ち手の判別が進んで高設定台に人が残り、
低設定台は放置されるため、平均が本来の水準へ戻る。
**したがって午前〜夕方の途中集計で末尾の優劣を判定してはならない。**

## Evidence
2026-08-27 楽園蒲田、末尾7（予告が「7つく恒例で末尾7」と名指し）:

| 時点 | 末尾7 平均差枚 | 全末尾中の順位 |
|---|---|---|
| 14:27 | -398 | 9位/10 |
| 15:30 | -272 | — |
| 16:32 | -117 | — |
| 21:09(速報) | +147 | 1位 |
| 確定 | **+450** | **1位/10** |

末尾7は59台・平均G 6,359と終日最多稼働のまま、最終的に全末尾中1位になった。
機構の説明はユーザーによる（「速い時間帯は期待されている末尾なので低設定も多く
回されるが、遅い時間帯になると判別が進んで高設定が多く回される」）。

## Interpretation
- Claudeは14:27〜16:32の途中集計を根拠に末尾7を「撒き餌」と判定したが、確定では誤りだった
- 同じ機構は「予告で名指しされた機種」にも当てはまるはず。属性が末尾であることは本質ではない
- 逆に**夕方以降の高回転台は判別を通過して残った台**なので情報価値が高い

## Action
- 途中集計で「期待が集まっている属性がマイナス＝撒き餌」と判定しない
- 末尾・属性の優劣は差枚有効台が全数に近づいてから結論する
- 夕方以降に回転数が伸び続けている台は、判別を通過した候補として優先度を上げる

