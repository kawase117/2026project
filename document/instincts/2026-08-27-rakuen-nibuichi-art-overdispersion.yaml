# AT機のニブイチは機種平均差枚では検出できない。ART回数の過分散検定で検出する

## 背景
2026-08-27 楽園蒲田。現場（LINEオープンチャット＋ユーザー自身）から設定確定演出の
報告があった機種について、既存の差枚系指標が全て miss を返した。

## Core claim
AT機で「機種内の一部の台だけに高設定を入れる（ニブイチ等）」形の投入は、
機種平均差枚では原理的に検出できない。高設定台の増加分を低設定台の減少分が
相殺するためである。代わりに **機種内のART回数がポアソン分布より過分散か**を
χ²検定で見ると検出できる。全台同設定なら ART回数は games に比例したポアソンに従い、
設定が割れていれば過分散になる。

## Evidence
- n_observations: 4機種（確定演出あり）+1機種（推測のみ）、単日・単一ホール
- data scope: 楽園蒲田店 2026-08-27、site777最終スナップショット(21:09)のART回数と
  machine_detailed_results の確定差枚
- 正解ラベル: 現場の設定確定演出報告（機種レベル。**台番号は1件も特定できていない**）

| 機種 | 高設定の実在 | 平均差枚 | 閾値1800判定 | 過分散p |
|---|---|---|---|---|
| 東京喰種(31台) | 確定演出 複数台 | +520 | miss | <0.0001 |
| ストリートファイター6(6台) | 56確+隣456確 | -786 | miss | 0.0028 |
| 戦国乙女5(22台) | 56確 | -359 | miss | 0.0030 |
| マギアレコード(12台) | 456確 | +243 | miss | 0.0045 |
| スマスロ炎炎ノ消防隊2(6台) | 推測のみ(確定でない) | -484 | miss | 0.0114 |

**差枚 0/4、過分散 4/4。**

東京喰種の内部構造: ART頻度上位15台 1/166.6・平均差枚+3,359 / 下位16台 1/308.1・
平均差枚-2,142。上位群のART実測489 vs 期待403、z=+4.28。ほぼ半々で割れており
ニブイチの形。機種平均+520・rank10/54 はこの構造を完全に隠していた。

ストリートファイター6は特に強い実例。取材アカウント(slokotae7)が【全台】と発表し
現場で56確・456確が出ているのに、平均-786・G比0.75（対象5機種で最低）。
**差枚系指標が最も外れる方向に振れた。**

## Interpretation
- 既存の `2026-08-01-answer-check-metric-hit104-over-mean-diff` は正解ラベル6件が
  全て全台系（平均+17〜+4,400）で、**ニブイチ型の偽陰性が検証対象に入っていなかった**。
  本件はその欠落を埋める
- 全台系の検出には引き続き 平均差枚×G比 が最良。**ニブイチの検出には過分散**、と
  2系統を使い分ける
- 差枚が1日では分散が大きいのに対し、ART回数は試行回数が多く設定差が出やすい

## 限界（重要）
- **台レベルの正解ラベルは存在しない。** 確定演出の報告に台番号が一つも付いていない。
  よって「過分散がどの台かまで当てられるか」は本件では未検証。機種内に設定差がある
  ことを検出できる、という主張に留めること
- 唯一台番号がある炎炎2046（現場「高設定示唆強」）は ART比1.03x・差枚+96 と機種平均並みで、
  **過分散手法でも拾えていない**。報告者の推測が外れたのか手法の取りこぼしかは判別不能。
  未解決事例として残す
- 単日・単一ホール。ART回数列の意味が機種によって揃っている前提に依存する
  （ノーマル機ではRB回数を使うこと）

## Action
- AT機の機種を「仕掛け無し」と判定する前に、ART回数の過分散χ²検定を必ず通す
- announce の model_named が miss でも、過分散が有意なら「投入はあったが不発」として
  別枠で記録する。miss と同列に扱わない
- 実装は `((art - games*base)**2 / (games*base)).sum()` を χ²(df=n-1) で評価

