# カテゴリ集計(ΣD/ΣG)は予算中立の機種間再配分を原理的に検出できない

## Core claim
`Σ(G_i × resid_i) / ΣG_i` 型のカテゴリ集計指標は代数的に `100 + (100/3)·(ΣD/ΣG)` に潰れ、
カテゴリ内の台の間でどう差枚が分配されているかの情報は消える。ホールが「特定機種に上乗せし
別の機種を締める」予算中立の再配分を行った場合、この指標は必ずゼロを返す。加えて対象機種が
カテゴリの一部（例: 459台中38台=8.3%）に限られる場合、水準シフトとして起きても検出力がほぼ
ゼロになる。

## Evidence
- n_observations: 1回（2026-08-06、楽園蒲田の8/6予告カバネリ・転生の検証）
- data scope: single-hall（楽園蒲田店）
- metric scope: 機種FE残差(機械割pp)・games加重カテゴリ集計 vs 機種単位の同日カテゴリ比エッジ
- result summary: 楽園のAT一般カテゴリでDD6/16/26効果を測ると新レジーム(2026-06〜)で
  -0.80pp [-1.96,+0.53] ns（459台に薄めた集計）。同じデータで予告名指しの「甲鉄城のカバネリ
  海門決戦」18台だけを同日カテゴリ比エッジで測ると+2.06pp [+0.62,+3.53]★（有意）。
  カテゴリ集計は再配分を見逃し、機種単位の直接測定で拾えた。

## Interpretation
- 「カテゴリ集計で非有意」は「このホールはそのDD/曜日軸に反応しない」を意味しない。
  「そのDD/曜日軸で予算総量は増えていない」しか意味しない。ホールが機種間で再配分している
  可能性は棄却できていない
- 逆に集計が有意な場合(例: ヒロキ・レイトギャップの6つく)は、カテゴリ全体が持ち上がる
  「水準シフト型」であり、この指標が最も得意な現象。両者は別の店の戦略として区別できる
  (楽園=再配分型、ヒロキ/レイトギャップ=水準シフト型)
- 検出力の目安: 対象がカテゴリの8%程度なら、対象自体が+15pp動いても集計への寄与は
  +1.24pp程度で、通常のCI幅(±1〜2pp)にほぼ埋もれる

## Action
1. 予告・晒しで特定機種が名指しされている場合、カテゴリ集計だけで裏取りしようとせず、
   必ず対象機種を同日・同カテゴリのベースラインと比較する形で直接測定する
   (`machine_name` でフィルタしてから同日カテゴリ機械割との差を取る)
2. カテゴリ集計が非有意でも「効果なし」と早合点せず、「水準シフトは検出できなかった」
   とだけ記述し、機種単位の直接測定を次のステップとして明記する
3. 集中度(同日内順列によるz化)は理論上は再配分を捉える候補だが、機種と回転数の
   強い結び付きにより順列帰無分布が歪みうる(2026-08-06検証でzが全条件マイナスに
   偏った)。集中度指標を使うときは帰無分布の妥当性を先に確認すること

