# Instinct YAMLにverification_statusとverified_by[]を追加する

## 背景
938レコード中120件がactiveだが、「検証済み」と「confidence高い」が混同されていた。
検証→知見→セオリー昇格のパイプラインに検証ステータス追跡がなかった。

## アクション
YAMLヘッダーに以下を追加（任意フィールド、後方互換）：
- `verification_status`: unverified（デフォルト）/ confirmed / refuted / superseded
- `verified_by[]`: [{session, method, result, evidence}] のリスト
- compile_instincts.py v1.2.0 で refuted/superseded を自動除外
- 実装プロンプト: `docs/codex_prompts/2026-06-23-instinct-verification-status.md`

## 例
```yaml
verification_status: confirmed
verified_by:
  - session: "2026-06-23"
    method: "walk-forward backtest"
    result: "confirmed"
    evidence: "lift 1.43x on holdout, p<0.01"
```

