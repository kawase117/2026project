# HermesAgent的ループの最小構成は4要素で十分

## 背景
HermesAgentのself-improving loopに触発された記事について、Codexと構成の実用性を議論した。
従量課金下では常時自己改善ループはコスト超過のリスクがある。

## アクション
最小構成:
1. AGENTS.md相当の行動ルール
2. 案件ごとの _epic.md（知識蓄積先）
3. タスクファイル
4. 完了時に昇格メモを追記するhook

HermesAgentの記憶検索・要約・次アクション提案は、この最小ループが回ることを検証した後に追加する。
推論回数は人間トリガーに寄せ、hookでは要約・昇格のみ自動化する。

## 例
ボトルネックはモデル性能ではなく運用コストとノイズ管理。
昇格対象の選別ルール品質が成否を決める。
