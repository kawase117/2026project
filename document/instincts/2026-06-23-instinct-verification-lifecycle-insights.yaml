# セオリー.md更新は自動検知→手動更新の2段階で行う

## 背景
セオリー.mdの手動更新が煩雑で陳腐化が追えない問題があった。
全自動化はノイズが増えるため、まずverification_statusとverified_by[]が整った後に
「confirmed/refutedになったinstinctのうちセオリーに影響するもの」を自動列挙する仕組みを入れる。

## アクション
1. まずverification_status + verified_by[]を実装（最優先）
2. 次にセッション終了時の差分チェックスキルを作成
3. 更新自体は手動（何を更新すべきかの検知のみ自動化）

## 例
セッション終了時に「confirmed: 3件、うちセオリー影響: 1件（角番効果の数値更新）」と通知

