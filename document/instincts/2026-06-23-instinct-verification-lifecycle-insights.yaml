# confidenceは「仮説の強さ」のみを表す

## 背景
confidence値に「仮説の強さ」「検証再現性」「運用優先度」の3つが混在していた。
Codexとの議論で、この曖昧さが知見管理の信頼性を下げていると指摘された。

## アクション
- confidence = 書いた時点での仮説としての確信度（0.0-1.0）
- 検証の進捗は `verification_status` フィールドで管理する（unverified/confirmed/refuted/superseded）
- 検証履歴は `verified_by[]` で追跡する
- confidenceが高い ≠ 検証済み。この2軸を混同しない

## 例
confidence: 0.99 + verification_status: unverified → 強い仮説だが未検証
confidence: 0.80 + verification_status: confirmed → 中程度の仮説だが検証済み

