# ゾロ目補正値の精度検証は「設定レベル」でのみ行う。セッション結果は不可

## 背景
2026-05-28に台2300（2F_N末尾0、ゾロ目台）を実際に打ち、設定5/6を確定させた。
差枚は-200（マイナス）だったが、これはギャンブルの短期分散によるものであり、
設定水準の証拠にはならない。

分析者がゾロ目補正値-149（予測）に対して「実際もマイナスだった→補正が正しかった」と
評価したが、これは誤りだった。

正しい論理：
- 補正値-149 = 「ゾロ目台の方が高設定が入りにくい」という予測
- 実際には設定5/6が入っていた → 補正値の方向性は外れ
- セッション結果-200は分散であり、設定レベルとは独立した事象

## アクション
ゾロ目補正値の精度評価では以下を厳守する：

1. 単一セッション結果で補正精度を語らない
   - 設定5/6でも-200はあり得る（分散）
   - 補正値の評価は「どちらの台に高設定が入っていたか」が基準

2. 正しい検証方法
   - 大量サンプル（N>=20）での同末尾・ゾロ目 vs 非ゾロ目の平均差枚比較
   - または設定開示情報との照合（確定演出・出玉的中率）

3. 評価の2軸を混同しない
   - 補正精度 = 設定割り当てパターンの予測精度
   - セッション結果 = 設定 x 分散の合成

## 例
台2300（2F_N 末尾0 ゾロ目）2026-05-28:
- ゾロ目補正予測: -149（非ゾロ目より低設定傾向と予測）
- 実際の設定: 5 or 6（高設定確定）→ 補正の方向性は外れ
- 差枚結果: -200（分散によるマイナス）
- 誤った解釈: 「-200だったので補正が正しかった」← 設定実態と矛盾
- 正しい解釈: 「補正は外れ、-200は分散の産物」

