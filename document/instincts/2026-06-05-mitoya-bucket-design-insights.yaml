# みとやの「イベント日」は設定投入と相関しない

## 背景
x_day / strong_zorome 以外の event 日（event_only: n=125）のホール台平均は -36.9/台（マイナス）。
土・日は全て is_any_event=1 だが、正の信号ではない。
有効なシグナルは x_day と strong_zorome のみ。

## アクション
みとやでは is_any_event をポジティブシグナルとして使ってはならない。
event_only は others と同様に exclude。

## 例
全期間（514日）bucket 探索：
  x_day:         n=102  avg=+210.7  → adopt
  strong_zorome: n=14   avg=+173.1  → adopt
  event_only:    n=125  avg=-36.9   → exclude
  plain:         n=273  avg=-44.2   → exclude

