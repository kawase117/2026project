# 一貫して強い小サンプル bucket は min-train-days=5 まで下げてよい

## 背景
strong_zorome（月日ゾロ目）は年最大12日。full_2025 学習窓で 5 件程度しかなく、
デフォルト min-train-days=14 では評価対象外（n_days=0）になる。
ただしホール自体が一貫して強い（avg +173〜204/台）ため、
外れた日の損失が小さく played_rate フィルタ（0.44）が自然に機能する。

## アクション
`--min-train-days-strong-zorome 5` を運用デフォルトとする。
累計観測日数を出力 JSON に記録し、実績 15 日超過時に min-train-days=14 に戻して再評価。

## 例
strong_zorome holdout 結果（min-train-days=5）：
  n_days=16, mean_diff=+82.27, Hit@2=0.50, played_rate=0.4375
  実際の期待差枚 ≈ +173 + 82 = +255/台/日（全 bucket 中最強）
