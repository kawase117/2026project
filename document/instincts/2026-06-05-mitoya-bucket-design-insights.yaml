# model excess と実際の期待差枚を混同しない

## 背景
dd4 の model excess = -2.31、dd7 = +36.59 から「dd7 の方が強い」と解釈しがちだが誤り。
model excess はその日のホール平均を引いた相対値。
ホール台平均を加算すると dd4（+239）> dd7（+217）となる。

## アクション
実戦上の優先順位（どの日に行くか）は絶対値 = ホール台平均 + model excess で決める。
モデルの末尾選択精度の評価は excess で行う。この2つは別の問い。

## 例
| | model excess | ホール台平均 | 実際の期待差枚 |
|--|--|--|--|
| dd4 | -2.31 | +241.3 | +239（有利） |
| dd7 | +36.59 | +180.0 | +217 |

