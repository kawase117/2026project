# Bucket別ホール台平均を正しいベースラインとして使う

## 背景
walk-forward の mean_diff は「モデル予測末尾のexcess（予測末尾台平均 − その日のホール全体台平均）」であり、
絶対的な期待差枚ではない。
全期間の overall ホール台平均をベースラインとして使うと、
属性ごとに大きく異なるホール台平均を見落とす。
みとや大森町では x_day（4/7のつく日）のホール台平均は +210.7 で、others の -40 とは別次元。

## アクション
実際の期待差枚 = bucket別ホール台平均（DBから属性フィルタで集計） + model excess
日付フィルタを bucket の定義と同じ条件で絞ること（4日なら day IN (4,14,24) など）。
bucket の統合平均を流用してはならない。

## 例
```sql
-- x_day のホール台平均
SELECT AVG(avg_diff_per_machine) FROM daily_hall_summary
WHERE date >= '20260128' AND date <= '20260529'
  AND (CAST(SUBSTR(date,7,2) AS INT) % 10) IN (4, 7)
-- +210.7 + model excess +18.16 = 実際の期待差枚 +228.9/台
```

