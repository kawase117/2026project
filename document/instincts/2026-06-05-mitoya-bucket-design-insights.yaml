# is_x_day フラグは日付末尾 4/7 と完全一致（DB JOIN 不要）

## 背景
みとや大森町 DB で is_x_day=1 の日と「day % 10 in {4,7}（4/7/14/17/24/27日）」は
514日間で完全一致（n=102、重複率100%）。
x_day ONLY: 0件、ld4/7 ONLY: 0件。

## アクション
x_day 判定は `day % 10 in {4, 7}` で計算する（DB JOIN 不要）。
4/7 のつく日 = マルハン対抗日（ドメイン知識）。

## 例
```python
is_x_day = (int(date_str[6:8]) % 10) in {4, 7}
```

