# strong_zorome は DB フラグではなく ts.month == ts.day で判定する

## 背景
`is_strong_zorome` カラムは `daily_hall_summary` に存在するが、
`aggregate_mode_mitoya()` の後段でカラムが消えるため、
bucket 分類が `is_strong_zorome` を参照すると n_days=0 になるバグが発生した。
strong_zorome = 月と日が同じ日（2/2, 3/3, ... 12/12）は日付から直接計算できる。

## アクション
`classify_mitoya_day_bucket()` では DB フラグを参照せず `ts.month == ts.day` で判定する。
x_day（day % 10 in {4, 7}）を先にチェックして優先させること（4/4, 7/7 は x_day 扱い）。

## 例
```python
def classify_mitoya_day_bucket(ts: pd.Timestamp) -> str:
    day = int(ts.day)
    if day % 10 in {4, 7}:
        return "x_day"
    if ts.month == ts.day:
        return "strong_zorome"
    return "others"
```

