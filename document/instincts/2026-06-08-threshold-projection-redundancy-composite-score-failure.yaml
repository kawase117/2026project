# 「機械割104%超えモデル」と「機械割100%未満モデル」の単純合成は、単独モデルより精度が落ちることを実証——同じ潜在変数の異なる射影は独立した情報源にならない

## 背景
ユーザーから「104%以上(高設定)予測モデルと、100%未満(設定3以下)予測モデルを組み合わせれば精度が上がるのでは」という提案があった。

これに対し事前に「機械割は単一の潜在変数（設定+運）から生成される連続値であり、104%超えと100%未満は同じ値を異なる閾値で切っているだけ——独立した2つの情報源ではなく、同じ弱い信号を異なる角度から見ているに過ぎない」という懸念を提示した上で、実際にみとや島x日の集団regressionで両ターゲット（`over_104_rate`, `under_100_rate`, `avg_kikaiwari`）を学習し、複合スコア（`over_104_rate予測 - under_100_rate予測`）の予測力を単独モデルと比較した。

**実証結果**（Walk-forward 2スプリット平均）：
| 指標 | over_104単独 | under_100単独 | 複合スコア(差分) |
|---|---|---|---|
| Pearson相関 | **0.373** | 0.360 | 0.242 |
| Top30%重複率 | **0.519** | 0.463 | 0.463 |

予想通り、`under_100_rate`単独も`over_104_rate`単独とほぼ同水準の信号を持っていた（両者は同じ「分布が上振れ/下振れしているか」という潜在因子の射影）。しかし**両者を単純に合成（差分）すると、単独の最良モデルより明確に劣化**した——これは2つの独立した根拠を足し合わせたのではなく、相関し合うノイズを重ねてしまった結果と解釈できる。

副産物として、`avg_kikaiwari`（連続値の平均）は閾値率(`over_104_rate`, `under_100_rate`)より弱い信号(Pearson 0.272)だった。これは設定差が分布の「中心」よりも「裾（極端な結果の頻度）」に強く現れる可能性を示唆する、独立した発見でもある。

## アクション
- 「同じ連続値の異なる閾値表現」を別々のモデルとして学習し、その出力を**単純な算術演算（差分・和・積）で合成して精度向上を狙う**のは避けること。これらは独立した情報源ではなく、同じ潜在変数の相関した射影であり、ノイズが打ち消し合うどころか積み重なる可能性が高い。
- 複数の閾値/統計量で同じ潜在変数を多面的に捉える試み自体は無価値ではない——「分布の形（中心・裾の上側・裾の下側）」を多面的に把握する**診断ツール**としては有用。ただし「予測精度向上のための合成」と「分布構造を理解するための多面観測」は別の目的であり、混同しないこと。
- 本当に複数モデルの出力を組み合わせて精度を上げたい場合は、単純な算術演算ではなく、**両モデルの予測値を特徴量として最終メタモデルに学習させる**スタッキング的アプローチを検討する。ただしサンプル数が少ない場合（本ケースでは517日x3島）は過学習リスクが増すため、まず素朴な合成を試して効果を測定し、それでも有望なら段階的にメタモデルへ進む、という順序を踏むこと。
- 「組み合わせれば精度が上がるはず」という直感は、2つのモデルが**本当に独立した情報を捉えているか**を検証してから採用する。本ケースのように両者が同程度の予測力(Pearson 0.36 vs 0.37)を持つ場合、それは「独立した2つの強み」ではなく「同じ信号を別の角度から見ている」可能性を強く疑うべきサイン。

## 例
```python
# NG: 同じ潜在変数の異なる閾値射影を単純に合成
pred_high = model_over104.predict(X)   # P(機械割>=104%)
pred_low  = model_under100.predict(X)  # P(機械割<100%)
composite = pred_high - pred_low       # 「狙い目スコア」のつもりが…
# => Pearson 0.242（単独 over_104 の 0.373 より劣化。ノイズが相関して積み重なった）

# OK（診断目的なら）: 分布の形を多面的に把握する
# 「今日この島は、平均は普通だが上振れ率が高い」のような構造理解には有用
df_island_today[['over_104_rate_pred', 'under_100_rate_pred', 'avg_kikaiwari_pred']]

# OK（精度向上を狙うなら）: スタッキング型メタモデル（ただしサンプル数に注意）
meta_features = pd.DataFrame({'p_high': pred_high, 'p_low': pred_low, 'p_avg': pred_avg})
meta_model.fit(meta_features, y_true)  # 単純演算でなく学習で重みを決める
```
