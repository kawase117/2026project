# v9cは特定の台番号を繰り返し選択する（ランダムではない）

## 背景
v9c Top50の5000G+台を1週間分リストアップすると、同一台番号が連日出現する。
- #3275 マイジャグラーV: 7日中6日
- #3010/#3011/#3012 キングハナハナ: ほぼ毎日
- #2058/#2059/#2070 戦国乙女5: 毎日（ただし大半マイナス）
これはc1（過去実績）やc4（角番）などの構造的特徴量が日をまたいで安定しているため。

## アクション
- リピート台の多さはモデルの欠陥ではなく構造的特徴量の反映
- ただしリピート台の累積成績を追跡することでモデルの実効性を検証できる
- Aタイプのリピート台は勝率が高い。N-typeのリピート台は新台・人気台バイアスの可能性

## 例
週間リピート（6/15-6/21）:
- #3275 マイジャグラーV: 6/7日, avg_games=7,281, 勝敗混在
- #2058 戦国乙女5: 7/7日, avg_games=5,757, avg_diff=-2,100（全敗に近い）

