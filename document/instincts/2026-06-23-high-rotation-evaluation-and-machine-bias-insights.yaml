# 回転数評価は機種別平均からの相対値が最適

## 背景
games_normalizedの絶対値を評価に使うと新台・人気台バイアスが入る。
機種ごとの全台平均回転数を基準にした相対値（例: 当該台のgames / その機種の当日全台平均games）
であれば「その機種の中で特に回されている」=打ち手が高設定と判断したシグナルに近づく。
計算コストは高い（全台×機種別集計が必要）が、絶対値より遥かに有効。

## アクション
- 実装時は test_dateごとに machine_name別の avg_games を計算
- 相対値 = 当該台games / 機種別当日平均games
- Aタイプはセグメント全体の回転水準（日単位）、N-typeは台単位の相対回転数と使い分け
- 現時点では未実装。walk_forward_engine への組み込みは将来課題

## 例
戦国乙女5 全台平均: 5,500G → #2058: 6,500G → 相対値 1.18（やや高い程度）
マイジャグラーV 全台平均: 4,000G → #3275: 8,500G → 相対値 2.13（突出して高い）
後者の方が「高設定シグナル」としての信頼度が高い。
