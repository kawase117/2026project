# セグメント間のTop50高回転率比較にはベースライン比（lift）が必須

## 背景
Top50中の5000G+率だけでは、それがモデルの選別力なのかセグメント自体の特性なのか区別できない。
ベースライン（全台の5000G+率）との比較で初めてliftが計算できる。
実測ベースライン: 3F_R_A=46.8%, 3F_L_A=45.2%, 3F_R_N=34.5%, 2F_L_N=27.2%
Aタイプセグメントは元々半数近くが5000G+なので、Top50のAタイプ高回転率43-46%はベースライン通り（lift≈1.0）。
「高回転台の捕捉はセグメント構造で決まる」と結論するにはliftで確認すべき。

## アクション
- 絶対率ではなくlift（Top50率/ベースライン率）で評価する
- セグメント別ベースラインは日・曜日・イベント日で変動するため、集計期間を揃えること

## 例
3F_L_A: Top50率=46.3%, baseline=45.2% → lift=1.02（ほぼベースライン通り）
2F_R_N: Top50率=26.8%, baseline=26.9% → lift=1.00（同上）
v9cのみ2F_R_Nの高回転+負けlift=1.04でランダム超え。v6aは0.98。

