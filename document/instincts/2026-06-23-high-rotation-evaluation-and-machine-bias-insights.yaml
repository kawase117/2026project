# N-type高回転は「新台」「人気台」「高設定」の3要因が混在し分離困難

## 背景
AT機の高回転は3つの要因で発生する:
1. 新台 — 打ちたいだけで座る（例: 戦国乙女5, avg_diff=-1,184で回されている）
2. 人気台 — 設定不問で回る機種（例: カバネリ海門, avg_diff=-1,466）
3. 高設定 — 実際に設定が入っている
7日間のサンプルではこれらの分離ができない。
avg_diffが大きくマイナスでも「下振れ」の可能性は排除できない。

一方Aタイプの高回転は「設定が入っていない店では回らない」というドメイン知識から
設定投入の裏付けがある程度ある（[[atype-high-games-is-hall-level-signal]]参照）。

## アクション
- N-typeのgames_normalizedを評価軸にする場合、新台・人気台バイアスの差し引きが必須
- 機種ごとの全台平均回転数からの乖離（相対回転数）を使うのが最適解
- 計算コストがかさむが、絶対回転数よりもシグナルとして有効
- 現時点では未実装。将来の評価指標改善時に実装を検討

## 例
戦国乙女5: 店舗に7台あるがv9cが選んだのは4台。特定台に偏っている点は評価できるが、
avg_diff=-1,184なので「設定が入っている」とは断言できない。
全台の平均回転数を基準にした乖離値なら、新台バイアスをある程度差し引ける。

