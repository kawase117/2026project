# 全モデルの高回転捕捉liftは1.0未満（差枚スコアリングの構造的限界）

## 背景
v6a/v9b/v9cいずれもTop50の5000G+率はランダム期待以下（lift 0.74〜0.998）。
差枚ベースでスコアリングしている以上、高回転台が上位に集中する保証はない。
ただしv9cだけは6000G+でlift=0.998（ほぼランダム同等）まで維持。
v6a/v9bは0.74まで落ちる。v9cがAタイプに多く配分していることが効いている。

## アクション
- 高回転捕捉率はモデルの良し悪しというよりスコアリング方式の構造的制約
- v9cのAタイプ重配分が結果的に高回転捕捉を維持する副作用を持つ
- 高回転捕捉を直接改善したければ、gamesをスコアに組み込む設計変更が必要

## 例
全体lift（games>=5000）: v6a=0.846, v9b=0.853, v9c=0.959
全体lift（games>=6000）: v6a=0.738, v9b=0.743, v9c=0.998

