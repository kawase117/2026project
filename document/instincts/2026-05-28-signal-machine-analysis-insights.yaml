# 兆候機種の信号は差枚 OR RB確率の2条件で判定する

## 背景
「モンキーターンV または スマスロ北斗の拳が兆候を示している」の判定に
2つの独立した基準がある：
1. **差枚基準**: avg(diff_coins_normalized) > threshold（例: 200枚）
2. **RB確率基準**: avg(rb_probability_decimal) < 1/300 = 0.003333

差枚は「現在の成績」（短期ノイズに敏感）、
RB確率は「設定の直接的な指標」（より安定した信号）。
どちらか一方でも兆候があれば「信号あり」とする（OR条件）。

## アクション
```python
diff_threshold = 200
rb_threshold = 1 / 300  # = 0.003333

signal_daily['signal_diff'] = signal_daily['avg_diff'] > diff_threshold
signal_daily['signal_rb'] = signal_daily['avg_rb_prob'] < rb_threshold
signal_daily['signal'] = signal_daily['signal_diff'] | signal_daily['signal_rb']
```
分析結果は3つに分けて出力すること：
- 差枚信号のみ
- RB確率信号のみ
- OR（両方合算）

## 例
```
信号あり日数（差枚）: 32
信号あり日数（RB確率 1/300以下）: 41
信号あり日数（OR合算）: 48

→ RB確率は「設定の直接指標」であり差枚より安定した信号になりやすい
→ OR合算が最も多くの兆候日を捉える
```

