# 北斗の拳は2機種存在する：スマスロ北斗の拳 vs 北斗の拳 転生の章2

## 背景
蒲田七DBには「北斗」を含む機種が2つ存在する：
- `スマスロ北斗の拳`（信号機種として有効）
- `北斗の拳 転生の章2`（別機種・除外対象）

`LIKE '%北斗%'` で検索すると両方が引っかかる。
「スマスロ北斗の拳」のみを対象にするために前方一致を使用する。

## アクション
```python
# 正しい検索（前方一致で転生の章2を排除）
cursor.execute(
    "SELECT DISTINCT machine_name FROM machine_detailed_results "
    "WHERE machine_name LIKE 'スマスロ北斗%'"
)
hokuto_names = [r[0] for r in cursor.fetchall()]
# → ['スマスロ北斗の拳'] のみ

# 誤った検索（両方引っかかる）
# LIKE '%北斗%' ← 使ってはいけない
```
信号機種リストは必ずDBから動的取得し、ハードコードしない。

## 例
```python
SIGNAL_MACHINES = []
cursor.execute("SELECT DISTINCT machine_name FROM machine_detailed_results WHERE machine_name LIKE 'スマスロ北斗%'")
SIGNAL_MACHINES += [r[0] for r in cursor.fetchall()]
cursor.execute("SELECT DISTINCT machine_name FROM machine_detailed_results WHERE machine_name LIKE 'モンキーターン%'")
SIGNAL_MACHINES += [r[0] for r in cursor.fetchall()]
# → ['スマスロ北斗の拳', 'モンキーターンV']
```

