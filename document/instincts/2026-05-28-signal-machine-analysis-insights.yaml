# 日曜日「機種一」は少ない台数の機種が安牌。1台機種は設定なし確認済み

## 背景
蒲田七「機種一」イベント（日曜日）では：
- 仮説A（安牌）：3台機種 → 1/3で高設定 → 確率的に最も恵まれた環境
- 仮説B（多台数も候補）：30台機種でも設定6を複数台入れる可能性がある
  → 突出した期待差枚・回転数をもつ台を探す戦略が有効

**実績確認済みの事実**：
- **1台機種は設定が入らない**（除外対象）
- 最多台数（マジアカード100台）のavg_diffは+58枚（低め）
- スマスロ北斗の拳（60台）のavg_diffは+491枚（高い）
→ 台数の多寡だけでは判断できない。機種固有の実績が重要。

## アクション
台数カテゴリ分類：
- 1台: 除外（設定なし既知）
- 2-5台: 少数（安牌候補。確率的に最も優れた環境）
- 6-50台: 実績で判断（avg_diff + 突出台率）
- 50台超: 突出台（avg_diff + 1σ超え台）を探す

## 例
```
日曜日データ（蒲田七）：
  スマスロ北斗の拳: 60台, avg_diff +491 → 多台数でも高い
  モンキーターンV: 84台, avg_diff +370 → 同上
  マジアカード: 100台, avg_diff +58 → 多台数で低い

→ 単純に「少ない台数が良い」ではなく機種固有の特性が重要
```

