# 兆候機種の「強い日」と他機種の相関は統計的に検証が必要

## 背景
現場で体感している仮説：
「モンキーターンV または スマスロ北斗の拳が高設定反応を示す → 同じ末尾の他機種も高設定」

この仮説には2つの対立する解釈がある：
A. **真正信号**: ホールが特定末尾に高設定を集中投入 → 兆候機種が先に反応する
B. **フェイク末尾**: ホールが意図的に兆候機種だけ別の末尾に入れている

どちらが正しいかは統計的検証が必要（未検証）。
confidence=0.75 は「体感あり、統計的確認前」の暫定値。

## アクション
```python
# 信号末尾 vs 非信号末尾の比較
signal_digit = get_signal_machine_digit(today)
same_digit_others = df[
    (df['date'] == today) &
    (df['last_digit'] == signal_digit) &
    (~df['machine_name'].isin(SIGNAL_MACHINES))
]
# avg_diff >> 全体平均 → 真正信号の証拠
# avg_diff ≈ 全体平均 → フェイクの可能性
```
検証後にconfidenceを更新すること。

## 例
```
フェイク末尾の判定基準：
  信号末尾 avg_diff > 全体平均 + 1σ → 「フェイクではない」証拠（強い）
  信号末尾 avg_diff ≈ 全体平均    → 「フェイクの可能性あり」
  信号末尾 avg_diff < 全体平均    → 「フェイクの可能性が高い」
```

