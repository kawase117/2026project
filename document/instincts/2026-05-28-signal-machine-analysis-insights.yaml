# 翌日予測 + 確信度 + 台末尾ゾロ目リストの統合ワークフロー

## 背景
翌日の立ち回りを決定するために以下を一つの出力にまとめる：
1. 翌日予測（末尾ランキング）
2. 各末尾の確信度（combined_scoreをmin-max正規化）
3. 予測上位の末尾に該当する「台末尾ゾロ目」の機種名・台番号リスト

「台末尾ゾロ目」は `machine_detailed_results.is_zorome` とは**別物**。
- `is_zorome` = 月日ゾロ目（日付の日部分と台末尾が一致）← DBに存在
- 台末尾ゾロ目 = 台番号の末2桁が同じ数字（11, 22, 33...99）← 別途計算

## アクション
```python
def is_zorome_machine(machine_number: int) -> bool:
    tail2 = abs(int(machine_number)) % 100
    return (tail2 // 10) == (tail2 % 10) and tail2 != 0

# 確信度変換（combined_scoreはランクの平均, 小さいほど良い → 反転）
confidence = (max_score - score) / (max_score - min_score) * 100
```
台末尾ゾロ目リストは「最新日」（DBの最新date）から取得する。
機種の撤去・追加に対応するため、最新日を必ず使用。

## 例
```
翌日予測 (蒲田七, 2026-05-29 水曜日)
─────────────────────────────────────────
Rank 1: 末尾 7  確信度 82%
  台末尾ゾロ目:
    2077 スマスロ某
    2177 A-SLOT+ 某

Rank 2: 末尾 1  確信度 61%
  台末尾ゾロ目:
    2011 モンキーターンV
    2111 某機種
```

