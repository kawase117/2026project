# 先バレ機種の稼働集中は「打ち手の期待」の証拠であって設定の証拠ではない。比率は当日の実測で採点する

## 背景
2026-09-16 楽園蒲田（6つく恒例ヒロキ対抗・タイガーダッシュ取材）。
予告は先バレで「エウレカが1/2⑤⑥、Lカバネリが1/3⑤⑥。最優先はエウレカ>カバネリ」。

12:55 時点の稼働は名指し2機種に露骨に集中していた（ホール平均438G）。

| 機種 | 台数 | 平均G | ホール平均比 | 1,000G超 |
|---|---|---|---|---|
| カバネリ海門 | 26 | 1,634 | 3.73倍 | 24/26 |
| エウレカ | 25 | 1,574 | 3.60倍 | **25/25（全台）** |

この集中を見て「形になっている」と読んだが、閉店前（19:25、25台が3,000〜5,400G）の実測は逆だった。

- **エウレカ**: 機種のBB合算 1/203 → 過去46日で**下位4〜6%**。平均差枚 -4枚。
  強いのは 3231(1/136,+2,860) / 3225(1/142) / 3216(1/163) / 3220(1/175) の4台で **4/24 ≒ 1/6**。予告の1/2は不成立。
- **カバネリ**: RB 1/379 → 上位54%（平凡）。ただしRB上位25%以内が 6/19台 ≒ **1/3 で比率は成立**。
  ⚠️ 差枚とRBが逆で、RB最良の1031は -750枚、3108は -2,460枚。差枚で追うと逆の台を選ぶ。

稼働が集中するのは先バレで人が張り付くからで、外れの日でも同じ集中が起きる。
[[project-rakuen-announce-ratio-vs-list]]（名指し選択の上乗せは無し）と同じ向きの結果。

## アクション
1. 名指し機種のG比は「注目度」の指標として記録するだけにする。**設定の根拠に使わない。**
   G比3倍でも機種の自己ベースラインが下位なら「不発」と読む。
2. 1/2・1/3 の比率は**当日の実測で数える**。判別可能機種は RB上位25%以内の台数 ÷ 判定できた台数、
   AT機は +1800超え台数 ÷ 差枚が読めた台数。エウレカは1/6、カバネリは1/3だった。
3. **機種が不発でも個別台は生きる。** エウレカ3231はBB 1/136（過去台日で最良）で+2,860。
   機種平均で切ると取り逃がす。逆にカバネリは差枚で切るとRB上位台を落とす。
4. 先バレ日の答え合わせでは、必ず「予告の比率」「実測の比率」「機種の自己ベースライン順位」の3点を並べる。

## 例
NG: 「エウレカ25台が全台1,000G超。先バレどおり1/2で入っている」
OK: 「エウレカはG比3.6倍だが機種BBは過去46日の下位4%。実測は4/24で1/6。ただし3231は過去最良なので単品で狙う」
