# Q1〜Q5の機械割レンジは全ホールで概ね94〜105%に収まり、みとやと同程度(設定3-4相当)

## 背景
8ホールでのmachine_name単位Q1〜Q5機械割レンジ:
ARROW 98.4-102.0%, ザ-シティ 96.0-104.9%, ヒロキ 97.2-102.6%,
マルハン蒲田1 96.6-102.2%, マルハン蒲田7 98.3-102.5%,
レイトギャップ 97.0-102.6%, 楽園蒲田 97.3-101.9%, 金時 95.0-102.4%。
みとや(95.5-105.8%)と同程度のレンジ。

## アクション
- クインタイル間の機械割差を「設定3〜4相当の機種間差」として解釈するのは
  ホール横断で妥当。「設定6確定」のような過大解釈は引き続き避ける。
- 機械割は (games_sum*3 + diff_sum) / (games_sum*3) * 100 で算出
  (eda/mitoya_dd_persistence_metric_comparison.py の payout_rate定義を再利用)。
