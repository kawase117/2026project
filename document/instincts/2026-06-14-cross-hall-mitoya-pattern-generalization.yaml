# 機種別(machine_name)持続性はみとや以外の8ホール全てで再現、台番号別持続性は機種効果の代理に過ぎない

## 背景
みとや大森町店で確認された「machine_name単位の差枚持続性(rho=0.415)が最強で、
台番号別(rho=0.123)は機種効果の代理(残差rho=0.017)」という法則を、
ARROW池上店・ザ-シティ-ベルシティ雑色店・ヒロキ東口店・マルハンメガシティ2000-蒲田1/7・
レイトギャップ平和島・楽園蒲田店・金時京急蒲田店の8ホールで検証した
(eda/cross_hall_pattern_verification.py, 3ヶ月期間ごとのクインタイル+Spearman相関)。

結果: 全8ホールで machine_name rho > machine_number rho、かつ機種効果を除去した
台番号別残差rhoは概ね±0.05以内に収束。
- machine_name rho 範囲: 0.169(ARROW) 〜 0.636(マルハン蒲田7)
- machine_number rho 範囲: 0.015(ヒロキ) 〜 0.202(金時)
- 残差rho: -0.015 〜 0.052 (ほぼゼロ)

## アクション
- ML特徴量設計・台選定ロジックは「機種別の直近強さ」を主軸にすることが
  ホール横断で正当化される。台番号単位の特徴量だけでは機種効果の重複検出に
  なりやすい。
- 新規ホールのデータを扱う際も、まず machine_name単位のクインタイル持続性を
  確認すれば、そのホールでこの戦略が機能するかの第一次スクリーニングになる。

