# 「Q1回避優先」はみとや固有の傾向で、蒲田系大型ホールでは逆にQ5の方が継続率・分散ともに高い

## 背景
みとやでは「Q5(上位)は分散の大きいラッキー台に汚染されやすく、Q1(下位)の方が
構成が安定して回避しやすい」という法則(Q1stay > Q5stay)が見られた。
8ホールでQ5stay/Q1stay(machine_name単位)とQ1/Q5のdiff_std(分散)を比較した結果:

- ARROW・ザ-シティ・ヒロキ: みとや同様 Q1stay > Q5stay、diff_std もQ1側が大きい
  (例: ヒロキ Q5stay=0.300, Q1stay=0.442)
- マルハン蒲田1/7・楽園蒲田・金時(蒲田系大型ホール): **逆転**。
  Q5stay > Q1stay、diff_std もQ5側が大きい
  (例: マルハン蒲田7 Q5stay=0.702, Q1stay=0.325、diff_std Q1=172,879 vs Q5=474,028)
- レイトギャップ: ほぼ同等(Q5stay=0.488, Q1stay=0.505)

## アクション
- 「Q1回避」をホール横断のルールとして固定しない。蒲田系大型ホールでは
  Q5(強い機種)の方が安定して継続するため、Q1回避ルールを適用すると
  むしろ強い機種を見逃す機会損失になる。
- 新規ホールでは必ず Q1stay と Q5stay の両方、およびQ1/Q5のdiff_stdを
  比較してから、どちらの戦略(上位継続ウォッチ vs 下位回避)が有効かを判定する。
  おおよそ「中小規模ホール(台数少・機種数多)はQ1安定型、蒲田系大型ホールは
  Q5安定型」という傾向が見られたが、サンプルホール数が少なくホール規模との
  関係は仮説段階。

