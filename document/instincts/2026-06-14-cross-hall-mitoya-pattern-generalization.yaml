# 物理配置効果はマルハン蒲田7で例外的に有意。稼働量とdiffの相関はホールごとに符号が逆転し一般化不可

## 背景
- 物理配置(x座標 vs diff合計, machine_number単位): machine_layoutテーブルがあった
  マルハン蒲田1/7のみ検証。蒲田1は rho=0.074(p=0.163, 効果なし、みとやと同じ)だが
  蒲田7は rho=-0.112(p=0.003, 弱いが有意な負の相関)。「配置効果は無視できる」を
  全ホールに適用するのは早計。
- 稼働量(games_sum) vs diff合計(machine_number単位, 全期間):
  ARROW 0.013(n.s.), ザ-シティ -0.156(p=0.072), ヒロキ 0.073(n.s.),
  マルハン蒲田1 0.095(p=0.056), マルハン蒲田7 **-0.191(p<0.001)**,
  レイトギャップ 0.049(n.s.), 楽園蒲田 0.077(p=0.067), 金時 **+0.443(p<0.001)**。
  符号も大きさもホールごとに大きく異なる。

## アクション
- 配置効果(x座標)は新規ホールごとに個別検証が必要。特に機種構成が地点ごとに
  あまり交絡しない(機種が広く分散配置されている)ホールでは配置効果が
  顔を出す可能性がある。
- 「稼働量が多い台は強い/弱い」という仮説は単一ホールの結果をそのまま
  他ホールのML特徴量に転用してはならない。ホール固有の運用方針
  (人気台への設定投入 vs 人気台での回収)が反映されているとみられる。
