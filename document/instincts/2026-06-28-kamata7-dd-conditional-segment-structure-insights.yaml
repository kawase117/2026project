# Even/Odd（LR）軸はDD条件付きでも無効

## 背景
蒲田7の全31DD日で台番号の偶奇（Even/Odd）別104%率を比較した結果、
5pp以上の差が出るDDは1つもなかった（最大: DD28の2.9pp）。
全期間でも差なし（両方43.8%）であったが、DD条件付きでも差が出ないことが確認された。
N数は各DD各群3000-4200と十分。

## アクション
蒲田7のセグメント定義からEven/Odd軸を除外してよい。
セグメント軸はクォータイル（Q1-Q4）× フロア（2F/3F）を主軸とする。
他ホールでも同様の3系統CSV（even_odd / quartile / section）を生成し、
Even/Odd差が5pp超のDDが存在しないことを確認してから除外する。

## 例
全31DD日のEven/Odd差:
- 最大: DD28 = 2.9pp（Odd優位）
- 次点: DD2 = 2.4pp, DD18 = 2.3pp
- 平均|diff|: 1.1pp
- 5pp超のDD: なし
