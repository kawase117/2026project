# DD7フロア非対称活性化：2F全面 vs 3F Q2限定

## 背景
蒲田7のDD7（7のつく日）において、2Fと3Fで104%率のリフトパターンが大きく異なることが判明。
2Fは全クォータイルで均等に+4.0pp上昇するが、3FはQ2（端から2番目のポジション）のみ+4.5pp突出し、
Q4（中央奥）はむしろ控えめ（33.1%）。

## アクション
イベント日（DD7系）の台選択を2段階で分岐させる：
1. **2F**: 全ポジションが候補。Q1-Q4の差が小さいため、加熱ゾーン（2131-2140: 49.6%等）を優先。
2. **3F**: Q2ポジション（端から2番目）を重点候補にする。Q1（端席）とQ4（中央奥）は非イベント日と変わらず低い。
   - 3F Q2のDD7: 37.0%（全体平均34.4%から+2.6pp）
   - 3F Q1のDD7: 32.5%（全体平均以下）

数値根拠：
- 2F DD7 lift: avg 35.9% → 39.9%（+4.0pp）
- 3F DD7 lift: avg 33.2% → 34.7%（+1.5pp）
- DD7 特異ブロック: 2231-2240が56.0%（+18.9pp）、3241-3250が50.8%（+12.7pp）

## 例
```python
if is_event_day_7(dd):
    if floor == '2F':
        # 全ポジション候補、加熱ゾーン優先
        candidates = hot_blocks_2f
    elif floor == '3F':
        # Q2ポジション重点、Q1/Q4は避ける
        candidates = blocks_3f[blocks_3f['quartile'] == 'Q2']
```

