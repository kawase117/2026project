# 冷却ゾーン二分法：可変冷却 vs 構造的冷却

## 背景
蒲田7の3Fで、DD条件付き10台ブロック分析により、冷却ゾーンには2種類あることが判明。
全期間平均で低いブロックが、イベント日（DD7）に回復するか否かで性質が根本的に異なる。

## アクション
冷却ゾーンを検出したら、DD7（またはホール固有のイベント日）のリフト量で分類する：
- **可変冷却**（DD7リフト≧5pp）: イベント日に通常レベルまで回復する。非イベント日のみ回避。
  - 例: 3061-3070（avg=32.2%, DD7=37.5%, +5.3pp）、3081-3090（avg=32.1%, DD7=42.0%, +9.9pp）
- **構造的冷却**（DD7リフト<2pp）: 全DD共通で冷え続ける死地。常時回避。
  - 例: 3131-3140（avg=27.8%, DD7=28.3%, +0.5pp）
検出基準: 全DD平均<30%かつイベント日リフト<2ppのブロック = 構造的冷却

## 例
```python
# 構造的冷却ゾーン検出
structural_cold = blocks[
    (blocks['avg_all'] < 30) &
    (blocks['dd7_lift'] < 2)
]
# 可変冷却ゾーン検出
variable_cold = blocks[
    (blocks['avg_all'] < 33) &
    (blocks['dd7_lift'] >= 5)
]
```

