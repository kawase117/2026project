# 3F_R_N衝突解消：「二重ルール」は角番ルール単独だった

## 背景
lr-governing-rule Instinct が 3F_R 全体で raw_digit p=0.015, kakuban p=0.00002 を報告し「末尾+角番の二重ルール」と結論していた。一方 segment-baseline は 3F_R_N 単独で p=0.410 と報告。この矛盾を解消するために角番×末尾の交差表を含む再検証を実施した。

## アクション
- 3F_R_N は**角番のみ有効**(p=0.001, stat=19.5)。中間台を選ぶ
- 3F_R_N の末尾は完全無効(p=0.4)。末尾で台を選んではいけない
- lr-governing-rule の raw_digit p=0.015 は再検証で再現されなかった(p=0.5)。セクション除外条件の差異によるアーティファクトだった可能性が高い
- 「二重ルール」という用語は誤り。3F_R では角番ルール単独が正しい
- bootstrap power=0.503（3F_L_N効果量仮定）で検出力は境界。「シグナルが存在しない」とは断定しないが、実用上は末尾を無視してよい

## 例
- 3F_R_A 角番KW: p≈0 (stat=99.1) → A機でも角番効果は圧倒的
- 3F_R_N 角番KW: p=0.001 (stat=19.5) → N機でも角番は有意
- 3F_R_all 末尾KW: p=0.5 (stat=8.5) → A+N混合でも末尾は非有意
- 3F_R_N 角番×末尾交差表: 角1は全末尾でマイナス(d0=-448, d4=-429)、中間台d5=+286が最強

