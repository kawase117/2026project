# イベント日定義修正の影響定量化：土曜逆効果拡大・月曜符号反転

## 背景
2026-06-19以前のEDAはDD21欠落・月末ハードコード(30,31)・強ゾロ目未統合の不完全なis_x_dayで計算されていた。修正後の定義で全イベント日分析を再実行し、旧定義との効果量差を定量化した。

## アクション
- 旧定義の数値（event-day-position等のInstinct）は**無効**。新定義の数値を使うこと
- **土曜イベントDDの逆効果が拡大**: delta_diff -90.7(旧) → -152.9(新)。土曜のイベント日は明確に避けるべき
- **月曜が符号反転**: delta_diff -25.8(旧) → +21.8(新)。DD21の追加が影響。月曜イベントは「弱い正効果」に格上げ
- **木曜は依然最強だが過大評価されていた**: delta_diff +195.3(旧) → +145.3(新)
- **金曜が大幅上昇**: delta_diff +94.1(旧) → +138.0(新)。DD21追加の恩恵
- 新定義: 98イベント日/342日中 (28.7%)。旧84日から+14日増加

## 例
- 差分内訳: DD21追加 11日、強ゾロ目追加 9日、動的月末 1日(2/28)、旧ハードコード誤検出修正 7日
- 旧ハードコード誤検出: 31日まである月のDD30を月末扱い→修正で除外。影響日: 20250730, 20250830, 20251030, 20251230, 20260130, 20260330, 20260530
- セグメント別イベント効果: 3F_R_A +122.4(最強), 3F_L_A +98.1, 2F_R_N +76.0, 3F_R_N +64.4, 3F_L_N +5.8, 2F_L_N +1.0

