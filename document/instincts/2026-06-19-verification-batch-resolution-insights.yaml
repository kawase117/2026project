# 三重フィルタ（DD×角番×末尾）は安定候補ゼロで実用不可

## 背景
2F_L_NでDD×角番×末尾の三重フィルタ候補を探索した。Top候補はavg_diff +1907(DD20×角N-1×d1)など高い数値を示すが、安定性検証（CI + split-half）を通過する候補はゼロだった。

## アクション
- 三重フィルタは**使わない**。多重比較問題（1,550組み合わせ）による偶然の産物
- DD×角番の**二重フィルタ**で運用する（2F_L: DD27×角N-1=+790、2F_R: DD30×角N-1=+880）
- 安定性検証の基準: CIが0を含まない AND split-halfの前半/後半両方でTop10に入る
- Top5候補すべてstable=0: CIは0を含まないがsplit-halfで前半/後半のTop10に残らない

## 例
- DD20×角N-1×d1: n=30, avg_diff=+1907, CI=[633, 3380], split-half Top10入り=0/0 → stable=0
- DD31×角2×d3: n=17, avg_diff=+1759, CI=[329, 3318], split-half=0/0 → stable=0
- 二重フィルタ（DD×角番）なら2F_L DD27×角N-1=+790が安定して最強

