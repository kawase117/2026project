# lr-governing-ruleのraw_digit p=0.015は再現されないアーティファクト

## 背景
lr-governing-rule Instinctは3F_R全体（A+N混合）でraw_digit p=0.015を報告し、末尾効果の存在を示唆していた。しかし同一のA/N分割・0707除外・鉄台除外条件で再検証したところ、3F_R全体の末尾別KWはp=0.5 (stat=8.5)で完全に非有意だった。

## アクション
- lr-governing-ruleの「raw_digit p=0.015」は引用しない
- 同Instinctの「kakuban p=0.00002」は再現された（3F_R_all p≈0, stat=80.6）ので引用可
- p=0.015と0.5の乖離原因はセクション除外条件・build_floor_side_mapの差異が最有力。追究の価値はない
- **再現されないp値はアーティファクトとして扱う**。角番効果のみが構造的シグナル

## 例
- 再検証: 3F_R_all_digit KW stat=8.5, p=0.5, ε²=0 → 末尾効果なし
- 対照: 3F_R_all kakuban KW stat=80.6, p≈0 → 角番効果は圧倒的
- 個別: 3F_R_A digit p=0.2, 3F_R_N digit p=0.4 → A機・N機どちらでも末尾は非有意
