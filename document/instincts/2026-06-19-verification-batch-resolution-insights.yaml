# 曜日×角番の再検証：角1は全曜日最弱、フェイク検出で木火が突出

## 背景
曜日パターンのEDA再検証（Prompt 3）で、曜日×セグメント×角番×末尾の多角的分析を実施。曜日間KWは有意(p≈0)だがε²≈0で効果量極小。角番との交互作用のほうが実用的に重要。

## アクション
- **角1は全曜日で最弱**: 月+36, 火+87, 水+19, 木+6, 金+24, 土+60, 日-25。特に日曜角1は全角番中最低(-25)
- **角Nも弱い**: 火-20, 木-9, 金**-117**。金曜の角Nは顕著な弱さ
- **中間台が全曜日でトップ**: 角番の普遍的効果を再確認
- **曜日×末尾KW**: 木曜のみ有意(p=0.01)。木曜d7=+288が突出
- **フェイク検出**: イベント日×角番で木曜×角2(delta_diff=+306)と火曜×角N(+297)が異常に大きい。「イベント日効果」ではなく特定曜日×角番の構造的パターンの可能性

## 例
- 曜日×角番Top組み合わせ: 水×角N-1=+251, 木×中間=+243, 火×中間=+240, 土×中間=+238
- フェイク検出Top3: 木×角2(+306), 火×角N(+297), 火×角1(+256) — これらはイベント日に集中するが角番位置効果と分離できていない

