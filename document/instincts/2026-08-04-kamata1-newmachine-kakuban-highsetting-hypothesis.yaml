## Interpretation
- まだ仮説段階。導入直後の新台がアピールされやすいこと自体は一般的な業界通念だが、
  この蒲田1のケースで実際に起きているかは別問題
- もし真なら、`prior_section` がNULL（＝新設台）の角番と、`prior_section` が
  非NULLの角番（＝元から角番だった台）を分けて効果測定する必要がある
- 導入直後の一時的な効果なら、時間が経つと薄れる可能性がある（"newness" と
  "kakuban" の交絡）

