# 蒲田1新設台(2416-2430)はアピール目的で高設定投入されやすい可能性(未検証)

## Core claim
新台導入直後の台（特に角番に配置された新台）は集客アピールのため高設定投入頻度が
通常より高くなる可能性がある。これが事実なら、2026-08-03以降の角番効果測定は
「角番だから強い」ではなく「新台だから（一時的に）強い」を拾ってしまう。

