# 前日好調の台の翌日の継続は、このホールでは弱い。連続日数が増えるほど上がるが小さい。今日の実測を主根拠にする

## 背景
2026-09-20 楽園蒲田で、ユーザーから「重要なのはこの台（3190）が前日も好調だったこと」と指摘された。
判別可能機種（`backtest.bonus_specs`）の台単位で、その日の「設定5以上の事後確率」（2,000G以上、6/1〜9/19、連続日9,113ペア）を使って継続を測った。
- 全台日の「5以上50%超え」の基準率：15.4%（新ハナビ 28.9%、スマスロ ハナビ 33.5%。別機種なので混ぜない）
- 前日が5以上70%超え（3190の9/19相当）：翌日に50%超えは **18.6%**
- 2日連続で50%超え：翌日に50%超えは **26.1%**（n=153）
- 3日連続で50%超え：**30.4%**（n=23、少数）
- 前日→翌日の相関は全機種で **0.22**、新ハナビ単体（154ペア）は **0.03**
- 前日が好調だった台の**翌日の平均差枚は+257で、全体（+252）と同じ**。差枚には継続が出ない。
3190は、9/15・9/16・9/18・9/19の4日で設定5以上が54〜84%と続いていた。
9/20の実測（ユニメモ小役込み）は設定5が有力（約77〜88%）で、その日の確定ボーナス推定は31%、差枚は+524と小幅だった。
クレア3209は、9/19の+5,572（ボーナス推定は29%）に続き、9/20は93%・+4,429と2日連続で勝った。
台単位の継続がホールの意図的な運用かは、この標本では有意に検出できない（watching）。

## アクション
1. 「前日も好調」は判断の背景にとどめ、**当日の実測（ボーナス・小役）を独立の根拠**として先に判定する。
2. 連続日数が長いほど翌日の確率は上がるが、3日連続でも約30%。「前日が好調だから今日も高設定」と断定しない。
3. 継続を確かめるときは、ボーナス由来の設定推定と差枚を分けて見る。差枚は前日の好調と翌日の差枚に関係が出ない。
4. 3日以上の連続の標本が23ペアしか無い。標本が増えたら再検証し、この instinct を更新する。
5. 全台系のスコアについては、前日超えは情報ゼロと実測済み（`feedback-prevday-exceed-carries-no-info`）。台単位のRB推定でも、効果は小さい。

## 例
NG: 「3190は前日も好調だったので、今日も高設定でほぼ確定」
OK: 「3190は9/15〜9/19の4日で5以上54〜84%。今日の実測（小役込み）でも設定5が有力。ただし過去の連続だけでは翌日の高設定確率は約30%止まり。今日の実測を主に判断」

