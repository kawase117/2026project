# 楽園蒲田の機種の強さは、翌日に続かず、同じ曜日に戻る。改装をまたいで再現する

## 背景
ユーザーの問い: 強い軸（機種、末尾、角番、並び）は、いつ強くなり、いつ弱くなるのか。月次レポートは「強い機種は強い」までしか言えていなかった。
楽園蒲田で機種×日の強さを測り(台日の差枚を、同機種・同じ回転数帯・同じ期間の自己の履歴に対する分位にして機種内で平均、3台以上の日)、機種の平均を引いて時間構造を調べた(改装前2025-01〜2026-07-05の120機種、改装後7/6〜9/30の47機種)。
- 翌日の持続はほぼない: lag1の自己相関は改装前+0.058(p=0.008、小さい)、改装後+0.012(p=0.61)。lag2、lag3はほぼ0。強い日の翌日に均して弱くなる兆候もない。
- 7日周期がある: lag7は改装前+0.082(p=0.008)、改装後+0.058(p=0.033)、lag14は改装前+0.075(p=0.008)。強い日の7日後は強さが+0.010(改装前)、+0.019(改装後)高い。
- 機種固有の曜日の傾向が改装をまたいで再現する: ホール全体の日の効果(土日が全機種で弱い等)を引いた後で、改装前の前半→後半 r=+0.284(p=0.002)、改装前→改装後 r=+0.193(p=0.007)。引く前は+0.469と+0.408で、約半分はホール全体の曜日効果だった。
- 日付の「日」には機種固有の構造がない: 日付の末尾(r=+0.013〜+0.082)、上旬/中旬/下旬(+0.057〜+0.148)、7のつく日・ゾロ目日・月末の機種別効果の改装前後の相関(+0.12〜+0.20)は、いずれも有意でない。
- 機種ごとの例(機種固有の曜日効果、改装前/改装後): 絆2天膳 水曜 +0.093/+0.119(最も一貫)、沖ドキBLACK 日曜 +0.067/+0.092・土曜 +0.058/+0.074、攻殻機動隊 土曜 +0.074/+0.056、バンドリ！ 日曜 +0.044/+0.060(水曜は改装後のみ+0.12)。東京喰種とカバネリ海門は曜日差がほぼ平ら。
- 強さは設定の測定ではない(差枚ベースの相対分位)。正解ラベルは使っていない。

## アクション
- 機種の「いつ強いか」は、曜日の7日周期で見る。翌日の持続や、強い日の後の均しを前提にしない。日付の「日」や末尾の周期を機種のタイミングに使わない。
- 機種×曜日の事前確率は、ホール全体の曜日効果を引いたうえで、改装前後で再現するものだけを使う(天膳の水曜など)。
- 軸の時間変化を調べるときは、自己相関(lag1〜14)、強い日の前後の事象研究、期間をまたぐ再現性(前半→後半、改装前→改装後)の順で見る。ホール全体の日の効果を必ず引く。
- 末尾、角番、並びの軸にも同じ手順を当てる(未実施)。

## 例
探索スクリプトは使い捨て(scratchpad)。正式なモジュール化は `backtest/axis_dynamics.py` の予定。
