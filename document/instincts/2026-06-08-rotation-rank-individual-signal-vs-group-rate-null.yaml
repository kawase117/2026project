# 回転数の「集団閾値率」は機械割と無相関(全閾値で確認済み)だが、「個体の島内最大回転順位」は104%超え率を約1.9倍に押し上げる強い信号——ただし本質的にイントラデイデータが必要

## 背景
ユーザーから「回転数が突出した1台がいる = 1台だけ高設定の疑いが高い台がある」という仮説が出た。これに対し集団レベル(`games_X_rate` = 島x日ごとの『閾値超え機の比率』)で`over_104_rate`との相関を測ったところ0.035(ほぼ無相関)だったため、いったん「無関係」と暫定結論したが、ユーザーから「閾値(4000G)の選び方が適切か分からないので、完全に無関係と決めるのは保留してほしい」という再考の要請があった。

そこで3000G〜9000Gまで7段階の閾値で感度分析を実施したところ、**全閾値帯でPearson相関は-0.031〜+0.066の範囲に留まり、信号は一切立ち上がらなかった**——閾値選択の問題ではなく、構造的にこの「集団閾値率」という見方そのものが機械割の信号を捉えられないことが確定した。

ところが、視点を「集団の閾値率」から「個体の相対順位」に変えたところ、劇的な信号が出現した。**「その島・その日で最も回転数が多かった1台」に絞ると、104%超え率は54.1%——全体平均28.6%の約1.9倍**に跳ね上がった。

## なぜ集団レベルでは消えるのか(構造的な理由)
島内には常にちょうど1台の「最大回転数台」が存在する。そのため「最大回転数台の比率」はどの島x日グループでも(ほぼ)一定値(≈1/島内台数)になり、グループ間で変動しない=集団レベルの「率」としては相関のしようがない。しかし「**どの台が最大回転数台になるか**」という個体識別情報には、強い予測力が宿っている。

これは [[individual-binary-classification-granularity-mismatch-shift-to-group-level-regression]] で発見した「個体レベルでは消えるが集団レベルで現れる信号」の**逆方向の現象**であり、対になる教訓として記録する価値がある——「ある変数が集団レベルで無相関だからといって、個体レベル(特に相対順位・ランキングという変換を経た形)でも無関係とは限らない」。

## 運用上の決定的な制約
この信号は本質的に「その日が終わった後に確定する回転数ランキング」に基づいている。つまり開店前(予測時点)では使えない事後診断シグナルである。実際に予測材料として使うには「日中のリアルタイム回転数」のようなイントラデイ(時間帯別スナップショット)データが必須——これは現行DBスキーマ(`machine_detailed_results`は日次集計のみ)が保持していない、新しいデータ収集要件を意味する。

副産物として、「よく回されている台に座れ」というプレイヤーの経験則が、データ的に(54% vs 29%、約1.9倍の的中率で)裏付けられたことも記録に値する。

## アクション
- ある変数(回転数など)が集団レベルの閾値率/平均値で目的変数と無相関だったとしても、即座に「無関係」と結論しない。**「個体の相対順位(ランキング)」という変換を試す**——特に「グループ内に必ず1つ存在する極値(最大・最小)を個体識別するとどうなるか」という角度は、集団の率では構造的に消える信号を顕在化させることがある。
- 逆に、「集団内に必ず一定数存在する属性」(例: 各グループに必ず1台ある最大回転数台、必ず1台ある末番台など)を「集団内の比率」として集計しようとする設計は、その時点で信号を消してしまう可能性が高いことを設計段階で警戒する。
- 個体レベルで強い信号(54% vs 29%)を発見しても、それが「その日の結果に基づく事後情報」である場合、forward予測にそのまま使うことはできない。**その信号を予測に活用するために必要なデータが現在取得可能か(イントラデイ観測など)を必ず確認**し、取得できないなら「これは将来のデータ収集計画の根拠」として位置づける。
- 「集団レベルでの閾値率が機能しない」という結果は、「閾値の選び方が悪い」のではなく「見ている粒度・変換の仕方が間違っている」可能性を疑う——本ケースでは3000G〜9000Gの7段階を試しても変わらなかったことが、それを裏付けている。

## 例
```python
# NG: 集団レベルの閾値率では信号が構造的に消える(閾値を変えても変わらない)
for th in [3000, 4000, 5000, 6000, 7000, 8000, 9000]:
    rate = df.groupby(['date','island'])['games_normalized'].apply(lambda x: (x > th).mean())
    # => over_104_rateとの相関は全閾値で -0.03 〜 +0.07 (ほぼゼロ、閾値を変えても変化なし)

# OK: 個体の相対順位に変換すると信号が顕在化する
df['is_top1_rotation_in_island_today'] = (
    df.groupby(['date','island'])['games_normalized'].transform(lambda x: x == x.max())
)
top1 = df[df['is_top1_rotation_in_island_today']]
print(top1['target_104'].mean())   # => 0.541 (全体平均0.286の約1.9倍! 強い信号)

# ただし、これは「今日の最終結果」に基づく事後診断。
# forward予測に使うには「日中のリアルタイム回転数ランキング」のような
# イントラデイデータが必須 -- 現行スキーマでは取得不可能なため、
# 将来のデータ収集計画の検討材料として記録するに留める。
```
