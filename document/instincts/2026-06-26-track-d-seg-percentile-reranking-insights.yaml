# 【撤回】3手法比較はルックアヘッド汚染のため無効 — リランキング全般が効果なし

## 背景
2026-06-26 Track D。V12b Top80プールから3つのリランキング手法でTop50を選び直し、52日サンプルで比較。
**ただしseg_percentileのstrength_weightに当日実績を使用していたため、結果は無効。**

## 当初の発見（ルックアヘッドあり — 無効）
| Strategy | vs_other | Delta vs baseline | lift@50 | W/L |
|----------|---------|------------------|---------|-----|
| baseline | +94 | - | 1.230 | - |
| seg_percentile | +209 | +115 | 1.280 | 30/22 |
| games_relative | +123 | +30 | 1.236 | 31/21 |
| hist_diff | +78 | -15 | 1.164 | 22/30 |

## 解釈
- seg_percentile: セグメント間のスケール差を吸収し、弱セグメントの中位台を排除。最も効果的
- games_relative: 微改善だが効果が小さい。非イベント日のみ有効、イベント日で悪化
- hist_diff: compositeに既に10%組み込み済みのため、追加リランキングは過学習方向。悪化

## アクション
- seg_percentileを採用。games_relativeとhist_diffはリランキング指標としては不採用

