# 【撤回】seg_percentileリランキングの+108枚はルックアヘッドによる偽陽性だった

## 背景
2026-06-26 Track D。V12bのTop50選抜後にseg_percentileリランキングを適用する効果を検証。

## 初回検証（ルックアヘッドあり — 無効な結果）
strength_weightに `scored["diff_coins_normalized"]`（当日実績）を使用。
結果: +108枚/日, p=0.000003。**ルックアヘッド（未来情報の使用）による偽陽性。**

## 再検証（ルックアヘッドなし — 有効な結果）

### 方法B: composite平均ベース（260日全期間）
strength_weight = scored["composite"]平均。ルックアヘッドなし。
pool_n=80: +7枚/日, p=0.75。**効果なし。**

### 方法C: train期間diff平均ベース（260日全期間）
strength_weight = train 90日間のセグメント別diff_coins平均。ルックアヘッドなし。
pool_n=80: -0枚/日, p=0.78。**効果なし。**
全pool_n (60/70/80/90/100) で p > 0.39。

## 教訓
- ルックアヘッドチェックは検証の必須ステップ
- 「同じロジックを別実装で走らせて結果が異なる」ことで発見できた
- composite平均もtrain diffも、V12bのcomposite順位に対する追加情報を含んでいなかった

## アクション
- predict_gated.pyのリランキングは**デフォルト無効**（--rerankで明示的に有効化可能）
- V12bのcomposite順位をそのまま使うのが現時点の最善

