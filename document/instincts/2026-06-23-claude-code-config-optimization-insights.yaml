# 月次でClaude Code設定を監査する

## 背景
CLAUDE.mdは自然に肥大化する。チーム全員が追記し、削除されない傾向がある。月次の定期監査で膨張を早期検知する仕組みを構築した。

## アクション
- /config-audit スキルを毎月1日に自動実行（/schedule設定済み）
- PreCompact hookでCLAUDE.md 200行超を即時警告
- 監査項目: 行数、unscoped rules数、stale skills、hook照合、内容6分類

## 例
/schedule --cron "0 0 1 * *" --task "config-audit"
PreCompact hook: CLAUDE.md行数チェック → stderr警告
