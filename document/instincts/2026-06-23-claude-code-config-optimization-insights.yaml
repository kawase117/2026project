# Unscoped rulesは3本以下に制限する

## 背景
path-scopeなしのrulesは毎セッション常時ロードされる。手順書的なrules（agents.md, development-workflow.md）をSkill化して5本→3本に削減した。

## アクション
- 新規ruleを追加する前に、path-scopeが可能か検討する
- 手順書的な内容（ワークフロー、エージェント選択ガイド）はSkillにする
- 特定ファイルタイプにのみ適用されるルールは必ずpaths:フロントマターを付ける

## 例
agents.md (unscoped, 51行) → skills/agent-orchestration/SKILL.md に移行

