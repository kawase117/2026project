# 決定的に守りたいルールは指示ではなくHookで強制する

## 背景
Anthropic公式記事の指摘: 「"Never do this" in CLAUDE.md — the model can fail to follow a prompted rule under pressure.」指示ベースのルールはコンテキスト圧迫時やプロンプトインジェクションで破られる可能性がある。

## アクション
- 「絶対にXするな」系のルールはPreToolUse hookで検証・ブロック（exit code 2）する
- 「必ずXせよ」系はPostToolUse hookで検証する
- ソフトなガイドライン（「推奨」「望ましい」）は指示のままでよい

## 例
「git push前に確認」→ 現在の運用ではユーザーが明示的に指示するパターンが確立しているため、hookは不要と判断。ケースバイケース。

