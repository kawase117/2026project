# CLAUDE.mdは200行以下に維持する

## 背景
Anthropic公式記事の推奨に基づき、CLAUDE.mdの行数上限を設定。443行から122行に削減した実績がある。全行が毎セッション読み込まれるため、不要な行はコンテキストコストに直結する。

## アクション
- 手順書・チェックリストはSkill化する（move-to-skill）
- 特定ディレクトリでしか使わない情報はサブディレクトリCLAUDE.mdに移動する
- 完了済みの改善記録はgit履歴で十分なので削除する
- 全セッションで必要な事実（型注意、ビルドコマンド、is_zorome定義）のみルートに残す

## 例
削減前: ディレクトリツリー82行 → 削減後: エントリーポイント5行
削減前: セッションログ月次手順70行 → Skill化で0行

