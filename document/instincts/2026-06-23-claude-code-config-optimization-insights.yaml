# サブディレクトリ固有の情報はサブディレクトリCLAUDE.mdに配置する

## 背景
database/のスキーマ全列定義やml/のPhase4詳細はルートCLAUDE.mdに不要。サブディレクトリCLAUDE.mdに移動すると、該当ディレクトリの作業時のみオンデマンドでロードされる。Codex互換のためAGENTS.mdにサブディレクトリCLAUDE.md探索ルールを追記する必要がある。

## アクション
- ルートCLAUDE.mdには要約1行（「詳細はdatabase/CLAUDE.md参照」）のみ残す
- Codex用にAGENTS.mdに「サブディレクトリのCLAUDE.mdを読む」指示を入れる
- ただしis_zorome定義や型差分注意など、DB/ML横断で頻出する情報はルートに残す

## 例
DBスキーマ24行 → database/CLAUDE.mdに移動、ルートには型差分3行のみ

