# 北斗の拳・モンキーターンVのホール別週次差枚トレンド(直近2か月・完全週集計)：北斗の方が下降傾向のホールが多い

## 背景
各ホールの最新データ日から60日を取り、完全週のみで集計した「週次の1台1日
あたり平均差枚」の傾き(週次線形トレンド)で判定した。総差枚ではなく平均差枚
ベースを最終判定に使うのは、台数・出現日数の影響を減らすため。

スマスロ北斗の拳(9ホール中5ホールが下降):
- 下降: ARROW(傾き-100.4, -96.5→-517.0), ザシティ(-89.2, -159.2→-339.9),
  楽園(-61.5, 929.0→81.0), 蒲田7(-106.1, 993.2→140.7),
  金時(-89.4, 340.7→-249.0)
- 横ばい/混在: ヒロキ(-26.7), レイトギャップ(-1.5), 蒲田1(+48.5)
- 判定保留: みとや(完全週不足でデータ不足)

モンキーターンV(9ホール中3ホールが下降):
- 下降: ザシティ(-58.5, 223.3→-347.6), 蒲田7(-86.7, 703.5→93.7),
  金時(-50.8, 305.6→-128.5)
- 横ばい/混在: ARROW(+11.1), みとや(-7.3), ヒロキ(+35.0),
  レイトギャップ(+18.2), 楽園(+47.1), 蒲田1(-35.3)

全体感: 北斗の拳の方が下降ホールが多く(5/9)、モンキーターンVはホールごとの
差が大きく横ばい/混在が中心(3/9のみ下降)。蒲田7・金時は両機種とも下降傾向で
共通している。

## アクション
- 「北斗の拳は稼働が落ちてきている」と一般化する前に、ホールごとに差が
  大きい点(蒲田1は北斗が唯一上昇傾向、楽園・ARROWは機種間で傾向が逆)を
  踏まえること。
- 週次トレンド判定は完全週のみで集計しないと末尾の不完全週が傾きを歪める。
  みとやのように直近60日で完全週が確保できないホールは「判定保留」とし、
  無理に外挿しないこと。
- 蒲田7・金時は北斗・モンキーターンV両方で下降傾向が一致している。
  ホール全体の集客・機種入替戦略の変化などmachine横断の要因を疑う価値がある
  (単一機種の設定変更だけでは説明しにくい)。

## 例
北斗の拳 蒲田7: 週次平均差枚が993.2→140.7(傾き-106.1、9週中で最大の下落幅)。
モンキーターンV 楽園: 週次平均差枚が-322.4→676.4(傾き+47.1)で、同ホールの
北斗(929.0→81.0、傾き-61.5)とは逆方向に動いている。
