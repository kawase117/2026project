# machine_detailed_results.rb_probability_decimal は、北斗の拳・モンキーターンVでは通常時AT当選率を記録している

## 背景
ジャグラー系ではrb_probability_decimalは文字通りRB(レギュラーボーナス)当選確率で、
`ml/experiments/jug_rb_setting_prediction/config.py`の設定別スペックと直接対比できる。
一方、スマスロ北斗の拳・モンキーターンVのようなAT機では、このDB列は
**通常時のAT当選率**を記録しているとユーザーから明示された。ジャグラーのような
ボーナス(RB/BB)構造ではなく、通常時にAT(アシストタイム)へ当選する確率が
設定差の主指標になるため、列名は同じ`rb_probability_decimal`でも意味が異なる。
juggler-rho-ge-0-4-topdd-setting-equivalent-table 作成時、この2機種には
設定別スペック表が存在しないため「設定相当」変換は実施しなかったが、
それはスペック表がないからであり、指標そのもの(rb_probability_decimal)が
ミスマッチだったわけではない。この2機種でDD別のstable_dd_biasが1件も
出なかった(no_signal=11/recent_drift=5/faded=2/insufficient=0、全18組)結果は、
「指標を間違えたから信号が出なかった」のではなく「正しい指標で見てもDD別の
偏りがほぼ無い」というより確度の高い否定的結果として扱う。

## アクション
- AT機(北斗の拳・モンキーターンV等)のrb_probability_decimalを扱うときは、
  「RB確率」ではなく「通常時AT当選率」として言及すること。ジャグラー系との
  混同を避ける。
- 新しい機種をDD別RB確率スキャンに追加する際は、まずその機種がボーナス機
  (ジャグラー系、RB/BB構造)かAT機(北斗・モンキーターン系、AT当選率構造)かを
  確認し、この列の意味をユーザーに確認してから解釈すること。今回は
  Codexプロンプト作成時に確認漏れがあった。
- AT機は設定別スペック表(config.py相当)が未整備なため、「設定何番相当」の
  変換は今のところ実施できない。実施したい場合は別途スペック表を新規作成
  する必要があり、それには公表スペック値の出典確認が必要。

## 例
`eda/monkey_hokuto_dd_rb_trend_scan.py` の実行結果
(eda/results/monkey_hokuto_dd_rb_trend/all_halls_summary.csv、18組、game>=2000):
stable_dd_bias=0, no_signal=11, recent_drift=5, faded=2, insufficient=0。
蒲田1×北斗の拳とレイトギャップ×北斗の拳は全体期間でeffect_size>=0.02
(唯一閾値超え)だったが直近60日はほぼ0に戻る「faded」(かつて偏りがあったが
今は消えている可能性)。金時×モンキーターンVは直近effect_size=0.097(全体で
最大)だがn_recent=140と薄く要再検証。

