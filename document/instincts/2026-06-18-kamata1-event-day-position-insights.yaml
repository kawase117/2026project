# 蒲田1 2F_A x イベント日 --- kakuban 40位置中32位置が有意（ほぼ全面底上げ）

## 背景
kamata1_2F_A_kakuban_event.csv を読解（2026-06-18実施）。
イベント日定義は DD in {1,7,11,17,21,27,30} + 末日。
40 kakuban 位置中 32 位置が q<0.05 で有意（全面底上げパターン）。

kakuban 別主要 premium
  kakuban=19  premium=+246（n=512）
  kakuban=11  premium=+201（n=1950, q=3e-6）
  kakuban=1   premium=+131（コーナーもイベント日は底上げされる）

## セクション別最強シグナル
kamata1_2F_A_section_event.csv  16 sig rows
  section 2236-2255  premium=+249, q=8.5e-8（最強）
  他の sig section も全て正方向の premium

section 2236-2255 内訳（Heatmap/2F_floor_coordinates_kamata1.csv）
  20台 斜め配置（X=20-39, Y=16-35）
  機種構成  マイジャグラーV / ミスタージャグラー / ウルトラミラクルジャグラー / アイムジャグラーEX-TP

## 台末尾別（2F_A tail x event）
22 tail 中 20 が有意
  tail=8  premium=+247（n=1164, q=3.1e-5）
  tail=1  premium=+176
  ゾロ目台 premium=+150

## アクション
イベント日に蒲田1 2F ジャグ系を訪問する場合:
section 2236-2255（台番号 2236〜2255）を最優先確認する（p=8.5e-8, premium=+249）。
kakuban=11 または kakuban=19 の台を優先（n が大きく信頼性高い）。
コーナー（kakuban=1）もイベント日は +131 で底上げされるが全体平均より低いので中間帯を優先。
tail=8 の台が複数ある場合は追加フィルタとして活用できる。

