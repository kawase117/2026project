# 蒲田1 2F_A の kakuban=9 が土曜日に突出（+269）、曜日感応性は kakuban=9 に集中

## 背景
kamata1_2F_A_kakuban_weekday.csv 読解（2026-06-18実施）。
7 sig rows があり、全て kakuban=9 の 7 曜日分（q=2.5e-3、同一 kakuban 内比較）。

kakuban=9 の曜日別 diff_coins 平均値
  土曜  +269（最高）
  木曜  +132
  月曜  +89
  その他曜日は平均 +80 前後

他の kakuban は曜日感応性なし（non-significant）。

## アクション
土曜日に蒲田1 2F_A を訪問する場合:
kakuban=9 に相当する台を最優先候補とする（他曜日比 +180 のボーナス）。
それ以外の曜日は kakuban=9 を特別視せず、通常の残差ランクに従う。

注意  kakuban=9 の絶対的な戦略的優位は確認されていない（全期間残差では中間帯の mean が正でも median が負）。
土曜日のみ戦術的に浮上するシグナル。

