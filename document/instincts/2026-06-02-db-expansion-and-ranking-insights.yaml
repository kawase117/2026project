# Anti-Concentration 制御：同一ホール繰り返し選択に対する正則化

## 背景
候補限定ランキングで、スコアだけで選ぶと、
ホール A が実際により多くの利益機会を持つ場合、毎日ホール A が選ばれてしまう。
これは：
1. オペレーション上、別のホールへのアクセス機会を失う
2. 実際には「今日はホール B に高リスク高リターン機会がある」のに見逃す

## アクション
ポリシー最適化段階で soft constraint を追加：
```python
# スコア = oracle fit - λ * (share_bias)
# share_bias = (actual_hall_share - expected_share)^2
# λ は tuning で調整
```

もしくは hard constraint：
```python
# max_share = 40%
# 各ホールは max 全日の 40% までしか選択できない
```

## 例
昔：毎日ホール A を選ぶ（スコア最高だから）→ ホール B の大きなチャンス見逃し
新：各ホール max 40% 制約で、ホール B の40% 枠内で最高スコア機会をキャッチ

