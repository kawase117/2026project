# Hit@2 の価値：ショートリスト生成では Hit@1 より優れている場合がある

## 背景
候補限定ランキング（top-k を複数ホールから選択）で hit@1（最高ランク台が正答）に固執すると、
実際の日次最大機会を逃す。一方、hit@2（top 2 に正答がある）は：
- 目標ランキングでも より緩い基準
- オペレーション上、ショートリスト（候補2台）を同時検索するコストは小さい
- より高確率で「本当の機会」をキャッチ

## アクション
ranking パスに hit@1 と hit@2 を並存：
- 目標：hit@1 >= X%
- フォールバック：hit@2 で「少なくとも TOP 2 に候補がある」保証を与える
- Operational: ユーザーに「最優先候補」と「代替候補」を提示

## 例
True daily max = ホールB 台番号55
モデル予測 rank: [ホールA 台号10, ホールB 台号55, ホールC 台号100]
Hit@1: ✗（ランク1位がホールA）
Hit@2: ✓（ランク2位がホールB 台号55）
⇒ ユーザーは「ホールA」と「ホールB」の両方をチェック → 発見成功

