# Oracle統計：完全ホール切り替えでも100%は不可能

## 背景
Holdout期間（2026-01-01 ～ 2026-05-30）における全ホール統合 oracle（実際に発生した日次最大差枚）の統計：
- >=0 diff: 100%（すべての日に何らかの利益機会がある）
- >=100 diff: 86.7%（14日中86日が 100 以上の利益可能）
- >=200 diff: 64.0%（14日中90日が 200 以上）
- >=300 diff: 36.0%（14日中50日が 300 以上）

つまり「毎日 200 以上」は物理的に不可能。予測モデルも同じ制約を受ける。

## アクション
目標設定を相対的に変更：
1. 日次タイミング判定：「去年より良い日」「平均以上の日」に絞る（>=0 必ず当たる）
2. ホール選択ランキング：「この日の利益機会がある場合、どのホールが最も有望か」に変更
3. 多閾値確率：P(>=100), P(>=200), P(>=300) をそれぞれ予測し、ユーザーが期待リターンで判断

## 例
昔：「300 以上の日を毎日当てる」→ 不可能（36%のみが候補）
新：「>=100 が確認できる日を選び、その日のベストホール予測」→ achievable（86% カバー）

