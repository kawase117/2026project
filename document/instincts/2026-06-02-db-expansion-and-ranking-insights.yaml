# Walk-Forward は時間的厳密性が必須：学習 < ターゲット日付（絶対違反禁止）

## 背景
Leakage は subtle に発生：
1. Tuning 期間（既知 oracle を使用）で threshold/weight を決定 ✗（holdout に最適化）
2. holdout で threshold を再選択 ✗（validation 汚染）
3. 学習データに holdout の情報（特徴量統計など）が混在 ✗（forward leak）

正しい flow：
1. Training (< date T)
2. Tuning (date T ～ date T+N, oracle 既知、ポリシー最適化のみ)
3. Holdout (date T+N+1 以降, oracle 未知、固定ポリシーで評価のみ)

## アクション
実装時：
```python
train_dates = df[df['date'] < tuning_start]  # Strict <
tuning_dates = df[(df['date'] >= tuning_start) & (df['date'] < holdout_start)]
holdout_dates = df[df['date'] >= holdout_start]

# Tuning で oracle を見て最適ポリシー決定
best_policy = optimize_policy(tuning_dates, oracle_available=True)

# Holdout では oracle は使わない、固定ポリシー適用
holdout_pred = apply_policy(holdout_dates, policy=best_policy, oracle=None)
```

## 例
❌ 悪い例：holdout で threshold を再調整
✅ 良い例：tuning で決めた threshold を holdout でも固定使用

