# DB拡張の必須性：1年半データでは長期パターンが見えない

## 背景
Codex ホール分析で判明した事実：現在のほぼ全ホールが1年半程度のデータしか保有していない。
この期間では周年イベント日（毎年同じ日付）などの長期季節パターンが捕捉できない。
例：給料日効果、初日効果、末日効果、anniversary patterns が複数年にわたって確認できない。

## アクション
次回モデリング前に、外部データソース（Wayback Machine、過去プログレッシブ記事、ホール公式イベント履歴など）から
2024年以前のデータを補強。最低でも 2.5～3年 分のデータを確保してから再モデリングを実施。

## 例
現在：2024-09 ～ 2026-05（約20ヶ月）
目標：2023-01 ～ 2026-05（約40ヶ月）で年間パターンの再現性を検証可能にする。

