# 多閾値確率：binary ranking より expected value 指向

## 背景
従来：「この台がランク1位か」→ binary classification
問題：200以上の利益が保証できない場合、上位ランクにしても「外れ」扱いされてしまう。

新：「この日このホールで >=100, >=200, >=300 の確率は？」
→ ユーザーが自分のリスク許容度に応じて判断可能

## アクション
モデル出力層を以下に変更：
```
output: P(>=100), P(>=200), P(>=300)
# ランキングはこれらを aggregate してスコア化
# 例：score = 0.5 * P(>=100) + 0.3 * P(>=200) + 0.2 * P(>=300)
```

排他的ではなく並存評価で、ユーザーに透明性を提供。

## 例
ホールA：P(>=100)=0.75, P(>=200)=0.35, P(>=300)=0.10
ホールB：P(>=100)=0.60, P(>=200)=0.55, P(>=300)=0.25

目標が「安定性」 → ホールA 優先
目標が「高リターン」 → ホールB 優先

