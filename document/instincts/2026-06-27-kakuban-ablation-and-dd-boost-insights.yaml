# gate候補か特徴量かは「日変動するか」で判定する

## 背景
segment gate（2F/3F/L/R/A/N）と角番を同列に gate 候補として扱おうとしたが、両者の性質は異なる。segment gate は「今日どこが活性か」という日変動する判定。角番は台の静的な物理位置属性で、日によって変わらない。

## アクション
変数を gate に昇格させるかの判断基準:
- 日変動あり（segment活性度、DD条件）→ gate候補
- 静的属性（角番、末尾、台番号）→ 特徴量
- 静的属性×日条件の交互作用（DD×角番）→ 条件付きgate候補だが、まず特徴量/ブーストで検証
gate化は候補集合を変えるため、精度改善が「効果」か「偶然の濃縮」か分離しにくい。ブーストで先に増分を測るのが安全。

## 例
- segment: 日変動あり → gate として有効（既存実装で採用）
- 角番: 静的属性 → 特徴量として根幹（ablationで+42%確認）
- DD×角番: 条件付き → ブーストで検証したが c3 で既に捕捉済み、gate化も不要

