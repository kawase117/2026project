# 機械割104%は台単位の当日ターゲットとして機能しない

## 背景
蒲田7のデータで機械割分布を分析した結果、104%超は1日平均216台（全稼働台の34.5%）が該当。1日の観測機械割は分散が巨大で、設定1でも運で104%超に到達しうるため、「高設定」の代理指標にならない。

## アクション
予測ターゲットの設計では:
- 台単位の絶対閾値（104%超の二値分類）→ 使わない
- 相対ランキング（Top-K）→ 分散にロバストで有効
- 104%率はセグメント集計やA機評価の補助指標として残す（kamata7_theory.md L214）
- Go/NoGo判断にはホール全体/セグメント集計の指標を使う

## 例
蒲田7（G>=1500、351日間）:
- 104%超: 1日平均216台（34.5%）— 閾値として無意味
- Top50相当: 機械割約132%以上（上位8%）
- 0台の日: 0日（どんな日でも100台以上が104%超）

