# DD×角番ブーストは c3 の既存メカニズムで十分に捕捉済み

## 背景
kamata7_theory.md の DD×角番テーブル（DD7-12で角9が最強、DD19-24で角9が最強等）をブーストとして c1 に乗算する v13a/v13b を作成し、v12b との比較実験を実施。EDAでは有意だった交互作用が、walk-forward では精度改善に寄与しなかった。

## アクション
DD×角番の交互作用を新たに追加する前に、c3 が _hier_lookup(exact_keys=["segment", "kakuban"]) を DD別データソースで引いている点を確認すること。この既存メカニズムが DD×角番の情報を暗黙に捕捉しているため、明示的なブーストや gate 化は二重計上になる。

## 例
walk-forward 260日間の結果:
- v12b baseline hit@10=0.91, v13a full boost hit@10=0.90 (-1.3%), v13b half hit@10=0.90 (-0.8%)
- lift@10: v12b 1.30 vs v13a 1.29 vs v13b 1.29
- event/non-event 両分割でも改善なし
- 結論: DD×角番 gate化（Step 2A）も不要

