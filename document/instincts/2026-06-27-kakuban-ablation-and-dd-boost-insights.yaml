# 角番特徴量はモデルの根幹であり補助ではない

## 背景
角番（kakuban）が「あると少し良くなる補助特徴量」か「モデルの根幹」かを判定するため、v12b_debut_multiplier_half から角番依存を完全に除去した v12b_no_kakuban との対称ablation実験を実施。c1/c2/c3/c4の全4コンポーネントから角番を除去。

## アクション
角番を外す・弱めるような変更を検討する際は、モデル全体の崩壊リスクを認識すること。角番は c1（segment×section_size×kakuban）、c2（最適角番距離）、c3（DD×segment×kakuban）、c4（曜日×segment×kakuban）の4箇所に組み込まれており、除去すると lift@10 が 1.0 未満（ランダム以下）に落ちる。

## 例
walk-forward 260日間の結果:
- hit@10: with kakuban 0.91 vs no kakuban 0.64 (+42%)
- hit@15: 1.38 vs 0.92 (+50%)
- lift@10: 1.30 vs 0.92（no kakubanはランダム以下）
- event/non-event 両方で一貫して角番ありが優位

