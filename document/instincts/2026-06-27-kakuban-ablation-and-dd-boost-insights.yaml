# 予測は3層構造（gate → ranking → 評価補助）で設計する

## 背景
「Top50だけでよいか」「機械割104%超を使うべきか」の議論から、予測目標は単一ターゲットではなく3層構造が必要と整理された。ただし「ランキング一本が正解」と言い切るのは飛躍で、gate と ranking の分離が正しいフレームワーク。

## アクション
| 層 | 目的 | 指標 |
|---|---|---|
| Gate | 今日打てる日か・どのセグメントが活性か | segment活性判定、DD、イベント判定 |
| Ranking | 活性セグメント内での台選択 | 相対ランキング（precision@10主、@15副） |
| 評価補助 | A機/角番などの構造評価 | 104%率（差枚より安定）、lift、payout |

gate の採用根拠は因果解釈（ホールの意思決定再現）ではなく予測効用（precision改善）で判断する。

## 例
現行の predict_gated.py がこの3層を実装:
- Gate: _get_active_segments() でセグメント活性判定
- Ranking: score_day() + _build_variant_pool() で相対ランキング
- 評価: hit@10/15, lift, avg_diff で測定
