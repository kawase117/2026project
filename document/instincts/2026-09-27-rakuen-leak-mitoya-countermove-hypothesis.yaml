# 楽園の先バレ予告→翌日みとやの北斗全台6、が近隣ホールの対抗投入かもしれないという仮説(n=1・未検証)

## 背景

2026-09-27、楽園蒲田がkawasakislot経由で末尾7の先バレフロアマップ予告(9/26 19:21投稿)を出した。
同じ9/27、みとや大森町のスマスロ北斗の拳5台(591-595)がRB確率ベースで全台設定6相当という
強い実績が出た(5台合算G=26,925・RB=111・RB確率1/243、設定1に対する尤度比が約2万倍、
5台中4台が単独でも最尤設定6)。

ユーザーの仮説: これはみとやが楽園の先バレ(客の目立つ動き)に対抗して投入を強化した結果
ではないか、というもの。ただし以下の理由で**現時点では検証不能・単なる偶然の可能性が高い**。

- サンプルはn=1(この1日のみ)
- 9/27は蒲田1・蒲田7・みとや共通で「7のつく日」(月内最後の7の付く日)に該当しており、
  みとやの北斗投入が7のつく日の通常運用である可能性を否定できていない
- 楽園とみとやの投入判断が同じ運営主体・同じ情報源に基づくという確認は取れていない

[[feedback-no-cross-hall-pooling]](ホール横断の共通法則はほぼ存在しない)とは矛盾しない。
あちらは「複数ホールに共通する静的な法則」を対象とし、こちらは「特定2ホール間の
日次の反応的な力学」という別種の仮説であるため。

## アクション

1. 今すぐ実戦に使える仮説ではない。今日の推薦・台選びの根拠にはしない。
2. 今後、楽園で先バレ系の具体的な予告(フロアマップ・末尾指定等)が出た日は、
   翌日以降のみとや・蒲田1・蒲田7の投入強度(全台系判定・RB確率・+1800超え率)を
   通常日と比較して記録する。3〜5例集まるまでは「観察中」の扱いに留める。
3. 逆方向(みとや・蒲田1・蒲田7の先バレ→楽園の対抗)も同様に観察する。
4. 曜日・DD(特に7のつく日)等の既知の交絡因子を必ず統制してから判断する。
   今回のケースでは「7のつく日」という交絡が既に存在する。

## 例

```
2026-09-26 19:21  楽園蒲田 先バレ予告(末尾7 1/2⑤⑥、kawasakislot)
2026-09-27        みとや大森町 スマスロ北斗の拳5台 RB確率ベースで全台設定6相当
                  (5台合算 設定1比 尤度比 約20,000倍)
→ 対抗投入の可能性 vs 7のつく日の通常運用、の2仮説が未分離
```
