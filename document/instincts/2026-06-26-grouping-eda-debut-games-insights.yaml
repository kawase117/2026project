# 「低差枚×高稼働」セルは新台期間の汚染が76.6%を占める

## 背景
2026-06-26 検証B（区間差枚×区間回転数）の深堀り。
「低差枚×高G = avg_diff -97」（9セル中唯一のマイナス）の正体を調査。

## 発見
低差枚×高Gセル（n=25,681）のdebut_phase内訳:
- 1-14日: 25.1%（全体比 9.2% → 2.7倍過剰）
- 15-60日: 51.5%（全体比 30.7% → 1.7倍過剰）
- 合計: **76.6%が導入60日以内の新台**（全体比 39.9%）

上位機種の具体例:
- 甲鉄城のカバネリ海門決戦: avg_diff=-282, avg_days=37日
- 北斗の拳 転生の章2: avg_diff=-270, avg_days=31日
- ミリオンゴッド: avg_diff=-849, avg_days=24日
- 新鬼武者3: avg_diff=-322, avg_days=16日

## 解釈
「低差枚×高稼働 = -97」はホール戦略の発見ではなく、
新台バイアスの再検出。新台は話題性で高稼働だが低設定で回収中。
検証Aの「新台期は全セルマイナス」と同一の現象を異なる切り口で見ているだけ。

## アクション
- 検証Bを予測に使う場合、debut_phase を共変量として含めるか、
  導入60日以内を除外してから再集計すべき
- 検証Bの「設定持続性」シグナルは既知のstreak効果との重複を確認する必要あり

