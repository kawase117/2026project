# 看板台シリーズの後継機は新台期でも優遇される可能性がある

## 背景
2026-06-26 A×C層別クロス集計。debut_phase × count_group を全9ホールで検証。
通常、新台期（1-14日）は全セルマイナスだが、L/XLクラスタでは例外あり。

## 発見
「大台数(L/XL)×新台期(1-14日)」のavg_diff:

| ホール | XXS×1-14日 | L/XL×1-14日 | 看板台優遇の有無 |
|--------|-----------|------------|-----------------|
| ARROW  | -300      | **+95(L)**  | **あり** |
| レイトギャップ | -202 | +9(XL), +153(M) | **あり** |
| 楽園   | -140      | -367(L), **+134(XL)** | XLのみあり |
| 蒲田7  | -268      | -290(L)    | なし |
| 蒲田1  | -323      | -183(L)    | 弱い |
| みとや | -137      | -129(L)    | なし |

## 解釈
ARROW・レイトギャップでは看板台（L/XLクラスタ）の新台が初日からプラス。
看板シリーズの後継機（例: ジャグラー新機種）には
「ファンの期待を裏切らない」ために初日から高設定を入れるパターンの可能性。

ただし:
- L/XLの新台期はサンプルが少ない（150-573件）
- 特定の1-2機種に引っ張られている可能性
- ホール依存性が高い

## アクション
- ARROW/レイトギャップの具体的な「L×新台」の機種名を特定して裏付ける
- ML特徴量としては debut_phase × is_flagship_successor のような
  機種系譜情報が必要だが、現在のDBには系譜データがない
- confidence 0.55 → 機種名特定後に更新
