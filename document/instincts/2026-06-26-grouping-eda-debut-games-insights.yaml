# 経過日数×稼働率の交互作用: 3フェーズモデル（全9ホール検証済み、ホール品質条件付き）

## 背景
2026-06-26 EDA検証。蒲田7で発見し、全9ホール横断で汎化確認済み。
days_since_debut × 14日平均G数（三分位）の二軸グルーピング。
pre_existing機種を除外。蒲田7 n=61,944。全ホール p<0.01。

## 発見: 全ホール共通の単調パターン

経過日数が進むほどavg_diffが改善する単調パターンは**全9ホールで再現**。
ただしプラス圏に到達するかどうかはホールの設定投入総量に依存する。

### ホール品質による2パターン分岐

**好設定ホール（蒲田7/蒲田1/楽園/ARROW/みとや）**:
61-180日でプラス圏に到達。3フェーズモデルが完全に成立。

| ホール | 1-14日 | 15-60日 | 61-180日 | 181日+ |
|--------|--------|---------|----------|--------|
| 蒲田7  | -367   | -151    | **+107** | +110   |
| 蒲田1  | -422   | -125    | **+68**  | +4     |
| 楽園   | -213   | -54     | **+47**  | +62    |
| ARROW  | -126   | -73     | -8       | **+32** |
| みとや | -202   | -78     | -14      | **+50** |

**渋いホール（ヒロキ/ザシティ/金時/レイトギャップ）**:
単調改善するが全フェーズマイナスのまま。設定投入総量が低い。

| ホール | 1-14日 | 15-60日 | 61-180日 | 181日+ |
|--------|--------|---------|----------|--------|
| ヒロキ | -259   | -111    | -60      | -47    |
| ザシティ | -301 | -205    | -143     | -135   |
| 金時   | -166   | -164    | -46      | -37    |
| レイトギャップ | -289 | -182 | -55   | -74    |

### 3フェーズモデル（好設定ホール、蒲田7代表値）

**フェーズ1: 新台期（1-60日）— 回収期**
| 経過日数 | 低稼働 | 中稼働 | 高稼働 |
|----------|--------|--------|--------|
| 1-14日   | -112   | -427   | -380   |
| 15-60日  | -143   |  -29   | -205   |

新台は稼働に関係なく全セルがマイナス。

**フェーズ2: 安定期（61-180日）— 低稼働テコ入れ期**
| 経過日数 | 低稼働 | 中稼働 | 高稼働 |
|----------|--------|--------|--------|
| 61-180日 | **+132** | +112 | +70 |

低稼働 > 高稼働（+132 vs +70）。不人気機種にテコ入れ。

**フェーズ3: 定番期（181日+）— 看板台維持期**
| 経過日数 | 低稼働 | 中稼働 | 高稼働 |
|----------|--------|--------|--------|
| 181日+   | +125   | +93   | **+149** |

高稼働 > 低稼働（+149 vs +125）。看板台の評判維持。

## 因果メカニズム

ホール店長の意思決定モデル:
1. 新台は話題性だけで客が来る → 低設定で回収
2. 安定期に入ると不人気台は客離れ → 設定投入でテコ入れ
3. 定番化した看板台は評判が集客の柱 → 高設定維持でブランド保護

ただし、この「投入余力」はホール自体の設定方針に依存。
渋いホールでは3フェーズの傾きは存在するが水準がマイナスに留まる。

## アクション
- ML特徴量として days_since_debut を使う際、ホールの設定投入水準も考慮すべき
- days_since_debut × avg_games_14d の交互作用は好設定ホールでのみ有効
- 渋いホールでは debut_phase 単独でも方向性は正しいが差が小さい

