# 設置台数の凹型パターンは蒲田7固有。全ホール共通ではない

## 背景
2026-06-26 検証C。蒲田7で発見した凹型（U字型）を全9ホールで検証。
XXS(1-3台)を手動分割 + 残りをKMeans k=5（ホール別独立）。

## 蒲田7の凹型（再掲）
| クラスタ | 台数範囲 | avg_diff |
|----------|----------|----------|
| XXS      | 1-3台    | **+255** |
| XS       | 4-10台   | +220     |
| S        | 12-18台  | +172     |
| M        | 21-30台  | **+114** ← 谷 |
| L        | 34-42台  | +212     |
| XL       | 57台     | +216     |

## 全ホール検証結果

凹型が再現したホール: **蒲田7のみ**（ARROWは弱い凹型）。
その他のホール:
- 蒲田1/楽園/レイトギャップ: 単調増加（大台数ほど良い）
- みとや: XXS最低、L/XL最高 → 大台数優位
- ヒロキ/ザシティ/金時: パターン不明確

## 解釈
凹型パターンは蒲田7の特殊な台構成（マイジャグラーV 57台が突出）に
起因する可能性が高い。汎化性は低い。

## アクション
- 設置台数を「凹型」前提で特徴量設計しない
- ホール個別に台数×成績の関係を確認してから使う
- confidence 0.40 → 蒲田7固有の知見として扱う

