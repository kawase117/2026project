# 土曜が全曜日最強の理由は「3台並び」では説明できない — 別メカニズムの探索が必要

## 背景
曜日別EDAで土曜が末尾gap(d=+0.17)・角番gap(d=+0.18)で全曜日最強だった。
「3台並び」イベントが原因と仮説したが、sliding window分析で否定された。

## アクション
- 土曜が強い理由として以下の代替仮説を検討すべき：
  1. 土曜は単純に高設定の投入台数が多い（投入量仮説）
  2. 土曜は特定セクション・特定島に集中投入する（空間集中仮説）
  3. 「3台並び」は連続3台ではなく、同一機種3台や同一列3台かもしれない（並びの定義再検討）
  4. 差枚の分散自体が土曜に大きい（ボラティリティ仮説）
- 次の分析ステップ: 土曜のセクション別・island別のhit104%率を非土曜と比較

## 例
sliding window(size=3)で土曜固有のシグナルを検出できなかったことから、
「3台並び」は少なくとも物理的に台番号が連続する3台の意味ではないか、
またはその効果が個々の台の差枚ノイズに埋もれるほど小さい。

