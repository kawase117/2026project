# 土曜の3台連続windowはセクション中央部が最もexcessが高い

## 背景
土曜限定のtriplet window分析で、起点位置をleft_edge/middle/right_edgeの3分割で評価。
全セグメントでmiddle（セクション中央付近）のwindow excessが最大。

## アクション
- セクション端（left_edge/right_edge）に並びの起点が偏る仮説は否定された。
- 特に3F_Nではmiddle=+120 vs left=+8 / right=-53と中央集中が顕著。
- ただしこれはsliding windowの構造的アーティファクトの可能性もある（中央windowはより多くのoverlapを持つ）。
- 注意: ここでのedgeはセクション内の台番号順の端であり、角番（通路側の台）とは別概念。

## 例
3F_N起点位置別excess:
- left_edge: +8.1 (n=2727)
- middle: +120.3 (n=2210)
- right_edge: -53.5 (n=2379)

