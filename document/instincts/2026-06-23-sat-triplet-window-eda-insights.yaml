# 土曜3台並びはsliding window(size=3)では検出不可

## 背景
蒲田7の曜日別EDAで土曜が末尾gap(d=+0.17)・角番gap(d=+0.18)の両方で全曜日最強だった。
土曜イベントは「3台並び」＝連続台番号に高設定を投入する日。
この並びが末尾集中として観測される仮説を検証した。

kamata7_triplet_window_eda.py で土曜限定の分析を実施（30,144 windows, 50日, 4セグメント）。
鉄台2026除外、2025-07-07除外済み。

## アクション
- sliding window(size=3)の差枚excessは全セグメントでsd_excess=735〜1998に対しmean_excess=+17〜22枚。S/N比が極めて低い。
- 3F_Aのみt検定p=0.018だが効果量は+17枚と実用的に無意味。
- 土曜 vs 非土曜のMann-Whitney比較は全セグメントでp>0.7。土曜固有のシグナルは皆無。
- 「3台並び」の検出には別アプローチが必要：
  1. 物理的に隣接する3台ではなく、同一island内の離散配置の可能性
  2. 差枚ではなく機械割（payout）ベースの検出
  3. 当日トップ3台の空間的クラスタリング（近接度の検定）

## 例
| セグメント | 土曜excess | 非土曜excess | Mann-Whitney p |
|-----------|-----------|-------------|---------------|
| 2F_A | -16.2 | +10.9 | 0.844 |
| 2F_N | +21.4 | +16.8 | 0.938 |
| 3F_A | +17.3 | +15.3 | 0.932 |
| 3F_N | +22.0 | +24.9 | 0.733 |

