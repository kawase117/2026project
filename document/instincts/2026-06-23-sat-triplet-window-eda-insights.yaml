# daily_hall_summary.weekday_nth はほぼNULL — 曜日フィルタにはフォールバック必須

## 背景
Codexが土曜フィルタを実装した際に発見。
蒲田7の daily_hall_summary で weekday_nth は大半がNULL。
値が入っている行でも形式は 'Sat1'/'Sat2'等の英語表記で、'土1'等の日本語表記ではない。

## アクション
- weekday_nth LIKE '土%' をそのまま使うとほぼ全行がフィルタされて空になる。
- 実装では以下の優先順でフォールバックすること：
  1. weekday_nth（値がある場合、'Sat'始まりで判定）
  2. day_of_week = 'Sat'（daily_hall_summaryの別カラム）
  3. date列からPythonで曜日を算出（最終フォールバック）
- 既知のinstinct daily-hall-summary-date-features-null-bug と関連。date_info_calculatorが全日付で実行されていない問題。

## 例
```python
# 正しいフォールバック実装
saturday_dates = dhs[
    dhs['weekday_nth'].str.startswith('Sat', na=False) |
    (dhs['day_of_week'] == 'Sat') |
    (pd.to_datetime(dhs['date']).dt.dayofweek == 5)
]['date']
```
