title: change_point 2026-06-05 付近でホール戦略が変化している可能性（観察中）

## 背景
角番ドリフト分析で各島の change_point を抽出した結果:

| 島 | 3指標の change_point |
|----|-----|
| main_jug | 2025-08-07（古い） |
| bari | 2026-04-23 |
| **main_mix** | **2026-06-05（今週）** |

main_mix の change_point が今週（2026-06-05）に更新されたのは異常。
直近の gradient や epsilon_sq が大きく変化（上昇傾向）したことを示唆。

考えられる原因:
- 店長交代（2026-04末）の遅れた影響
- AT機の新規配置・機種入れ替え
- 設定投入ルールの変更

**現段階では観察値。複数週のデータで確認が必要**。

## アクション
2026-06-05 の前後で:
1. 機種の配置変更がないか確認
2. 店長の新しい設定戦略が反映されているか推測
3. 今後1-2週間のデータで角番勾配の傾向を追跡

直近データ（2026-06-07以降）を集めて gradient_diff の安定性を確認し、
一時的な変動か本格的な戦略変化かを判断する。

