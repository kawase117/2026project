title: パチスロ成績分析では ε²0.006 で「十分な説明力」 — 差枚は多因子現象

## 背景
Kruskal-Wallis ε² は 0〜1 で「角番という要因が成績のばらつきをどれだけ説明できるか」を示す。

みとやでは:
- main_jug ε² = 0.006653（0.67%）
- 一見小さく見える

しかし差枚（成績）は複合現象:
```
成績 = 設定（機械割） + 回転数（稼働率） + 運要素（サンプルばらつき）
```

- **設定**（機械割 ±5%）：最大の要因だが多くの台で「未知」
- **回転数**（日々変動 ±20%）：人気・評判で揺らぐ
- **運要素**（統計ノイズ）：数日間では無視できない

この背景で ε²=0.006 は：
- 他の指標なし（全島合算）よりも **5〜6倍優れている**（bari ε²=0）
- 「設定」を直接知ることはできないが、**ホールの設定投入パターンを間接的に捉えている**

## アクション
ε² が 0.01 以下でも「有用」と判定してよい理由:
1. 多因子現象なので各要因の説明力は必然的に小さい
2. 他の指標（機種・DD・曜日）と組み合わせると相乗効果
3. 「同じ設定なら角番1 > 角番5」という単純な理論を実データで支持している

ε² ではなく **相対比較**（他の島との ε² 差、時系列の ε² 変化）で判定する。
main_jug (0.00665) > main_mix (0.00132) > bari (0.00000) という階級が信頼度の根拠。
