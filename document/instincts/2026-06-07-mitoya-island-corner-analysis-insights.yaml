title: バラエティ島は角番で高設定を見分けられない — ε²=0 で除外確定

## 背景
バラエティ島（台692以上、モンキーターン・ゴッドイーター・沖ドキなど）の
角番別 avg_diff を検証した結果:

**全期間（rank_from_aisle, プラス日）:**
```
rank1: +1486   rank2: +1529   rank3: +1566   rank4: +1450
```
→ rank3 が最高。rank1 が最低（逆転）

**直近180日の Kruskal-Wallis:**
- ε² = 0.000000（ほぼゼロ）
- gradient = -135（角番1 vs 角番5 で rank1 が低い）

統計的に「角番で説明される差がない」状態。
理由の仮説:
- 機種ターンオーバーが速い（短期配置）
- 機械割の差が角番効果を打ち消す
- 同じセクション内で機種変更が頻繁

## アクション
**バラエティ島の角番ルールは作成しない**。
代わりに:
- 機種別・DD別で分析する（角番は使わない）
- 古いデータ（1ヶ月以上前）は参考にしない
- 稼働率（games_normalized）の方が台の信頼度を示す

## 例
```python
# NG
bari_rank1_rule = df[df['island']=='bari'].groupby('rank_from_aisle')...

# OK（バラエティ島は機種・DD優先）
bari_analysis = df[df['island']=='bari'].groupby(['machine_name', 'dd_group'])...
```

