title: メインジャグラー島の角番効果は直近180日で強化傾向（ε²: 0.00597 → 0.00665）

## 背景
みとや大森町店のメインジャグラー島（台641-691, マイジャグV・アイム）について
Kruskal-Wallis ε² の時系列比較:

| 期間 | rank_from_aisle ε² | rank1-5勾配 |
|------|-----|----------|
| 全期間 | 0.005976 | +112 |
| 直近180日 | **0.006653↑** | **+154↑** |

ε² が小さく見えるが、他の島（bari: 0.000）と比べて **6倍以上の説明力がある**。
差枚 = 設定 + 回転数 + 運要素 という複合要因の中で、
0.67% の説明力は統計的には有意で、角番による設定投入パターンが明確に存在する証拠。

勾配が+112 → +154 に拡大（37%増）したのは、
ホールが「メインジャグラー島の角番1に高設定を集中させる戦略」を
2025年後半以降強化した可能性を示唆。

## アクション
メインジャグラー島の角番1は「信頼できる指標」と見なしてよい。
ただし:
- 他の島（main_mix）とは単価が2倍異なるため別スケールで管理
- バラエティ島は混ぜない
- 直近の change_point (2026-06-05) 付近で戦略変化の可能性を確認

## 例
```sql
-- メインジャグラー島のみで角番別成績確認
SELECT
  ml.rank_from_aisle,
  ROUND(AVG(m.diff_coins_normalized), 0) as avg_diff,
  COUNT(*) as n
FROM machine_detailed_results m
JOIN machine_layout ml ON m.machine_number = ml.machine_number
WHERE ml.machine_number BETWEEN 641 AND 691
  AND m.date >= '20260501'
GROUP BY ml.rank_from_aisle
ORDER BY ml.rank_from_aisle;
```

