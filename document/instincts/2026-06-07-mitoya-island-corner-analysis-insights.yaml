title: 角番分析は必ず島別に分割 — バラエティ島は除外すべき

## 背景
全島合算の角番分析では bari（バラエティ島）の「角番効果なし」が全体の統計を歪める。
島別に分割した Kruskal-Wallis ε² 比較（rank_from_aisle, 直近180日, プラス日）:

| 島 | ε² | gradient | 解釈 |
|----|-----|----------|------|
| main_jug | 0.006653 | +154 | 角番1に高設定集中（強い） |
| bari | **0.000000** | -135 | **角番効果なし（逆転傾向）** |
| main_mix | 0.001322 | +249 | 絶対値大だが相対的に弱い |

bari の ε²=0 は統計的に「角番で説明される差がない」を意味する。
実際、rank1=+1486 と rank3=+1566 で角番1が弱い逆転現象。

## アクション
**バラエティ島（台692以上）は今後の角番分析から除外する**。
理由:
- 古い機種が多く、高設定投入戦略が不明確
- 機種ターンオーバーが速い（データが陳腐化しやすい）
- 角番で選別する価値がない（ε²=0）

角番を使った運用ルールは **main_jug（メインジャグラー島）のみで立案** する。
main_mix（AT列）は角番効果より DD×曜日が重要。

## 例
```python
# NG: バラエティ島を含めた全島角番分析
rank_aisle_all = df.groupby('rank_from_aisle')['diff'].mean()

# OK: main_jug のみで角番分析（bari 除外）
rank_aisle_main_jug = df[df['island']=='main_jug'].groupby('rank_from_aisle')['diff'].mean()
```

