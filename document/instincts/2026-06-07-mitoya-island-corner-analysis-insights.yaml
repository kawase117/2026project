title: メイン混在島（AT列）はメインジャグラー島の2倍の単価で スケールが異なる

## 背景
島別の平均差枚（rank_from_aisle 全角番、プラス日）:

| 島 | avg_diff | 代表機種 |
|----|----------|---------|
| main_jug | +1,400 | ジャグラー・アイム |
| main_mix | **+3,300** | スマスロ北斗・スマスロ碧・新鬼武者 |

main_mix は main_jug の **2.35倍の単価**。
これは「角番効果」ではなく「機種の機械割の差」が主要因。

角番別の勾配を見ると:
- main_jug: rank1(+1525) - rank5(+1366) = **+159**（明確な差）
- main_mix: rank1(+3306) - rank5(+3100) = **+206**（勾配は似ているが絶対値が大きい）

**相対的な角番効果は同程度だが、単価が異なるため別管理が必須**。

## アクション
成績比較時は「main_mix は +3000, main_jug は +1500」という前提で見る。
「main_mix が勝つ」のは角番の選別が効いているのではなく、
機種構成（強い台が配置されている）が異なることが原因。

同じ角番で比較するなら main_jug のみで評価。
全体的な「今日の期待値」を算出するなら機種別・島別に加重平均。

## 例
```python
# 正しい期待値計算
expectation = (
    df[df['island']=='main_jug'].groupby('dd_group')['diff'].mean() * 0.4 +
    df[df['island']=='main_mix'].groupby('dd_group')['diff'].mean() * 0.6
)
```

