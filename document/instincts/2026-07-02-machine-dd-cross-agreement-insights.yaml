# agreement_rate/cohens_hは符号の多数決であり、実際の上げ幅の大きさとは別物

## 背景
機種横断DD一致度は「機種ごとの残差(自分のbaselineとの差)の符号」だけを二項検定しており、残差の大きさは検定に使われない。実データで検証した結果、蒲田7の有意3日(dd7,17,30)のうちdd17はcohens_h=0.407(3日中最大)だがプール絶対水準の乖離(pooled_hit104_rate_vs_hall=+1.94pt, pooled_diff_vs_hall=+58.5)は3日中最小。逆にdd7はcohens_h=0.340(2番目)だが絶対水準の乖離は+4.73pt/+245.3で3日中最大。レイトギャップでも同型の逆転(dd6のcohens_hが最大だがdd19のpooled diffが最大)を確認。方向(プラス/マイナス)は全ケースで一致したが、「どのDDが一番強いか」の順位はagreement系指標とpooled絶対水準系指標で食い違う。

## アクション
機種横断一致度の結果を報告する際は、agreement_rate/cohens_hだけで「強い/弱い」の順位付けをしない。必ずpooled_hit104_rate_vs_hall・pooled_diff_vs_hallを併記し、多くの機種が薄く同方向に動いた日(agreement高いが絶対水準は平凡)と、少数機種が大きく動いた日(agreement低いが絶対水準は大きい)を区別する。

## 例
eda/machine_dd_cross_agreement_scan.pyのattach_pooled_stats/compute_pooled_dd_stats。蒲田7: dd17(cohens_h=0.407, pooled_diff_vs_hall=+58.5) vs dd7(cohens_h=0.340, pooled_diff_vs_hall=+245.3)。

