# ジャグラー系はホール全体シグナルと同方向に動く(逆行しない)。むしろ増幅する傾向

## 背景
machine_masterのjug/hana/oki/bt/otherフラグでカテゴリ分解した結果、9ホール12件の有意日全てで、jugカテゴリ(母数比率6〜12%、n=8〜9台と小サンプル)はホール全体の一致方向と一度も逆行しなかった。むしろ小サンプルゆえに極端な値を取りやすく、蒲田7 dd30ではjug 9/9=100%陽性(全体67%)、レイトギャップdd15ではjug 0/8=0%陰性(全体36%)と、全体より強く同方向に振れるケースが複数あった。「other」カテゴリが多数決で勝つのは機種プール内で66〜73%を占める母数比率通りであり、濃度の偏りの証拠ではない。

## アクション
「この広範囲シグナルは特定カテゴリだけで作られていないか」を検証する際は、単に多数決で勝つカテゴリ(母数が大きいカテゴリが自動的に勝つ)を見るのではなく、各カテゴリの一致率の方向が全体と一致するか・母数比率相応かを個別に確認する。全カテゴリが同方向なら「広範囲な合意」として扱ってよい。hana/okiはn=1〜4程度になることが多く、個別の一致率は参考値に留める。

## 例
eda/machine_dd_cross_agreement_scan.pyのbuild_category_breakdown出力。蒲田7 dd30: jug=100%(9/9), other=67%(42/63), 全体=67%。みとやdd22(負方向): jug=12.5%(1/8), other=36%(20/55), 全体=33%。

