# 機種横断DD一致度スキャンツールが利用可能

## 背景
dd-pattern-shared-across-machines-signals-hall-strategy（2026-06-15由来）の「複数機種が同じDDで揃って上振れする＝ホール投入日」という知見を、手動2〜3機種突き合わせから全機種自動検出に拡張した。2026-07-02セッションでeda/machine_dd_cross_agreement_scan.pyを新規実装。機種ごとにDD別hit104率から自分自身のbaselineを引いた残差を計算し、ホール×DDで「何機種が自分の平均を上回ったか」を二項検定(FDR補正はホール単位でBH法)。さらにis_x_dayとの突き合わせで既知イベント日か新規候補かを判定し、machine_masterのjug/hana/oki/bt/otherフラグでカテゴリ濃度のロバストネス検定(支配カテゴリを除外しても有意性が残るか)まで実装済み。

## アクション
機種横断のDD投入日を検出したいときは`python eda/machine_dd_cross_agreement_scan.py --all-halls`を実行する。出力は`eda/results/machine_dd_cross_agreement/`配下に`{hall}_machine_dd_residuals.csv`(機種×DD残差、category列付き)、`{hall}_dd_agreement.csv`(プール絶対水準・イベント日カバレッジ付き)、`{hall}_category_breakdown.csv`、`{hall}_category_robustness.csv`、`summary_report.csv`(有意日のみ、新規/既知フラグ・支配カテゴリ付き)。

## 例
2026-07-02時点で9ホール実行、有意12件中novel(既知イベント軸で説明できない)候補はみとやdd22/29、蒲田1dd16、レイトギャップdd19/15/23、金時dd23。特にdd=23はレイトギャップと金時で独立に負方向が再現(q=0.012, q=0.034)し、最有力の未知投入日候補。

