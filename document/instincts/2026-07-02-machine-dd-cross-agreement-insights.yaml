# `ls -la`が日本語パス配下で偽の空表示を返すことがある。`find`で再確認すること

## 背景
2026-07-02セッションで`ls -la db/`および`find . -iname "*.db" -maxdepth 3`が実際にはファイルが存在する`db/`ディレクトリを「空」と報告し、これを信じて「実DBが存在しない」という誤った結論をユーザーに報告してしまった。直後に`find . -iname "*.db"`(maxdepth指定なし)を実行したところ`db/マルハンメガシティ2000-蒲田7.db`等が正しく列挙され、実際にはDBファイルが存在していたことが判明。原因はGit Bash側のロケール/エンコーディングの癖と見られる。

## アクション
Windows Git Bash環境で日本語を含むパスの存在確認をする際、`ls`や`find -maxdepth`が空/0件を返しても即座に「存在しない」と結論しない。`find`をmaxdepth無指定で再実行するか、Pythonの`pathlib`/`os.listdir`等の別手段でクロスチェックしてから報告する。特にユーザーへの「〜が存在しない」という否定的な報告は、複数手段で確認できるまで断定的に言わない。

## 例
`ls -la db/` → `(empty)`、`find . -iname "*.db" -maxdepth 3` → `0 for '*.db'`(誤り)。`find . -iname "*.db"`(maxdepth無指定) → `./db/マルハンメガシティ2000-蒲田7.db`等58件を正しく列挙。
