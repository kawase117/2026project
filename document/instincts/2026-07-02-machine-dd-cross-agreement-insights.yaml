# HALL_EVENT_DIGITS[蒲田7]にdd=30が欠落していたバグを修正済み(2026-07-02)

## 背景
eda/core.pyのHALL_EVENT_DIGITS["蒲田7"]は元々[1,7,11,17,21,22,27,31]で30を含まず、is_x_dayはdd=30をその月が30日で終わる月末(4月/6月/9月/11月、12ヶ月中4ヶ月)の場合のみイベント扱いしていた(カバレッジ率約33%)。ユーザーの「蒲田七はdd30もイベント日」という指摘を受けて確認し、機種横断DD一致度スキャンでdd=30がホール全体で有意な上振れ(一致率67%)を示していたにもかかわらず、この欠落により「novel(未知)」と誤分類されていた。30を固定リストに追加して修正。

## アクション
蒲田7のdd30がらみの分析結果を見るときは、この修正(30追加)より前に生成されたキャッシュ・レポートは「dd30=非イベント」の前提で書かれている可能性がある点に注意する。他ホールでも同様の固定DDリスト欠落がないか、実際のドメイン知識と`eda.core.HALL_EVENT_DIGITS`の内容を照合すべき(未実施)。この定義はeda/配下27本以上のスクリプトが依存する共有定義なので、修正時は影響範囲を確認してから変更する。

## 例
eda/core.py:38。修正前: `"蒲田7": [1, 7, 11, 17, 21, 22, 27, 31]` → 修正後: `"蒲田7": [1, 7, 11, 17, 21, 22, 27, 30, 31]`（蒲田1は同じ内容のまま据え置き、ユーザーが蒲田7のみ指定したため）。

