# 異常値をデータ品質問題と決めつける前に、現実の出来事による説明を先に確認する

## Core claim
分析中に遭遇した異常な数値パターン（急激なG比の変化等）に対して、データ側の欠陥
（台移設・欠測・新台効果等）で説明する仮説を提示する前に、それが現実の出来事
（トロフィー等の設定開示・取材・イベント）で説明できないかをユーザーに確認する。
データ品質問題という説明は検証が困難で反証されにくいため、安易に採用すると誤った
結論に固定化しやすい。

## Evidence
- n_observations: 1回（2026-08-06、楽園蒲田 スマスロ炎炎ノ消防隊2のG比3.27急増を
  台移設によるデータ異常と説明したが、ユーザーからトロフィー開示という現実の説明を
  提示され訂正した）
- data scope: single-hall（楽園蒲田店）
- metric scope: n/a（方法論上の誤り）
- result summary: 台移設(2051-2057→2045-2050)自体は事実だったが、それは移設直後3日間の
  閑散を説明するだけで、8/6のG比急増の原因ではなかった。データパターンから「もっともらしい」
  説明を構築したが、実際の原因はユーザーだけが持つ現地情報だった

## Interpretation
- データパターンの一致（台移設のタイミングと異常値のタイミングが近い）は因果を保証しない。
  複数の説明候補がある場合、データだけで一つに絞り込めないなら明示的に保留するか、
  ユーザーに現地情報の有無を確認すべきだった
- 「データ異常」という説明は追加の検証コストを要求しない分、安易に採用されやすい。
  これ自体がバイアスになりうる
- ユーザーは現地観察・SNS等、DBに無い一次情報を持っていることが多い
  （キリントロフィー・アンケート予告の真偽等、過去複数回で実証済み）

## Action
1. 集計値の異常を説明するとき、データ側の理由（欠測・移設・スクレイピングエラー等）と
   現実の出来事（イベント・設定開示・取材）の両方を候補として挙げ、どちらか一方に
   飛びつく前にユーザーに現地情報の有無を確認する
2. 特に「もっともらしいがユーザーに確認していない」説明を断定的に報告しない。
   「〜という可能性がある」と留保するか、質問する
3. データ品質問題の指摘自体は有用だが、それが唯一の説明であるかのように断定しない

