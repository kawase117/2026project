# 楽園蒲田はキリントロフィー(設定表示)制度があり、G比急増は移設・新台効果より先にこれを疑う

## Core claim
楽園蒲田店は特定台に「キリントロフィー」（最低保証設定を示す表示）を早い時間帯に出す運用があり、
これを見た客が正当な根拠を持って着席するため、対象機種のG比（回転数/プール平均）が当日だけ
急増する。この急増は台移設・新台効果によるデータ異常ではなく、公開情報に対する実在の客の
反応である。

## Evidence
- n_observations: 2回（2026-08-07 末尾7・3227番台でユーザーがトロフィーを実見し設定5と判明。
  2026-08-06 スマスロ炎炎ノ消防隊2でユーザーが「店が早い時間にトロフィーを開示、最低4/6台が
  設定5/6」と確認）
- data scope: single-hall（楽園蒲田店）
- metric scope: G比（games_normalized比）、機械割・平均差枚
- result summary: 炎炎ノ消防隊2は8/3〜8/5にG比0.17〜0.64（台移設2051-2057→2045-2050直後の
  閑散）だったのが8/6に3.27へ急増。トロフィー開示という現実の出来事で説明でき、データ品質の
  問題ではなかった。ただし設定確定情報があっても当日結果は6台中3勝3敗・平均-713.8枚と大きく
  振れた

## Interpretation
- G比の異常な急増を見たら、先に「新台導入」「台移設直後」等のデータ側の説明を当てはめる前に、
  トロフィー開示のような現実の出来事がなかったかをユーザーに確認する。楽園蒲田はこの制度が
  存在することが2回の観測で分かっている
- トロフィーで設定が確定していても、日次の実現差枚は五分五分に振れうる（設定確定と結果は
  別物、feedback-scoring-must-separate-setting-from-pnlの直接実例）
- DBだけでは判別できない一次情報（トロフィー目撃）が最も強い証拠になる場面がある。G比×平均差枚
  のような間接指標より優先すべき

## Action
1. 楽園蒲田でG比が直近日から急増した機種を見つけたら、まずユーザーにトロフィー等の現地情報の
   有無を尋ねる。データ側の説明（新台・移設）だけで完結させない
2. トロフィー確認台は「今日の全台系候補」として即座に信頼してよいが、日次差枚が悪くても
   「トロフィー情報が外れた」と結論しない。ボラティリティの問題として区別する
3. 他ホールでも同様の設定表示制度があるかは未確認。楽園蒲田固有の知見として扱い、
   他ホールへ安易に一般化しない

