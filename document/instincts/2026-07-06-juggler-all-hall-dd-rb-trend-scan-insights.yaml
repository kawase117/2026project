# ARROW×ネオアイムジャグラーEXはDD=5(5・15・25系)でRB確率が有意かつ頑健に高い

## 背景
全ジャグラー×全ホールDD別RB確率スキャン(juggler-all-hall-rb-dd-scan-methodology参照)
で、76(hall×machine)組のうちARROWのネオアイムジャグラーEXだけが
game>=400とgame>=2000の両フィルタで一貫して`stable_dd_bias`と判定された。
全体期間p=1.4e-11〜3e-17、直近60日p=0.002〜0.006、Spearman rho=0.68〜0.71。
DD=5が全体期間・直近60日ともトップで、DD=15・25・22・30も上位に入る
「5の倍数日」パターン。ARROWの既知イベント日定義
`HALL_EVENT_DIGITS['ARROW'] = [8,18,28,11,22]`(core.py)には5/15/25が
含まれておらず、既存のイベント日ロジックでは捉えられていない。
同じARROWのゴーゴージャグラー3も同方向の傾向を見せたが、
game>=2000にすると`recent_drift`に落ちる(rho 0.42→0.325)ため
ネオアイムジャグラーEXより頑健性が低い。

## アクション
- ARROW×ネオアイムジャグラーEXのDD=5/15/25偏りをさらに検証する場合、
  曜日交互作用・設置台番号との関係・他機種への波及有無を優先して見る。
- ARROWのイベント日定義に5/15/25を追加すべきか検討する前に、
  この効果量(epsilon_sq=0.02〜0.03)は「小さいが本物」レベルであり、
  diff/plus_rateベースの過大評価とは違うことを踏まえて運用判断すること。
- 蒲田7・蒲田1・みとや等の主力ホールではDD別RB確率の固定バイアスは
  検出されなかった(no_signalかrecent_drift止まり)。「ゴーゴージャグラーは
  DD別に上振れる」という当初仮説はRB確率ベースでは全ホール共通の
  法則としては支持されず、ARROWのみの例外的パターンとして扱うこと。

## 例
`eda/results/juggler_dd_rb_trend/ARROW_dd_profile.csv` の
ネオアイムジャグラーEX行(period=full): DD5のrb_rate_pooled≈1/317(400フィルタ時)、
直近60日ではDD5≈1/305.5。他DD(15,25,22)は1/330〜1/354程度に留まる。
