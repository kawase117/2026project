# 全ジャグラー×全ホールDD別RB確率スキャン：全体期間vs直近60日の二段検定パターン

## 背景
「ゴーゴージャグラーはDD別に上振れる」という単一機種の観察を、全ジャグラー機種
(アイム/マイジャグ/ファンキー/ゴーゴー3/ミスター/ガールズ/ネオアイム/ウルトラミラクル/
ハッピーVIII)×全9ホールに拡張する際、diff/plus_rate ではなく
rb_probability_decimal（RB確率）を指標にすることで、変動が大きいコイン差枚系
指標より本来のスペック差に近いシグナルを見られる。ホール横断のプール集計は
過去の知見(feedback-no-cross-hall-pooling)により禁止のため、hall×machine_name
単位で独立に検定する必要がある。

## アクション
1. `machine_detailed_results` から date, machine_name, machine_number,
   games_normalized, rb_count, rb_probability_decimal を抽出
   (`WHERE machine_name LIKE '%ジャグラー%' AND rb_probability_decimal > 0`)。
2. hall×machine_name ごとに「全体期間」と「直近60日(≒2か月)」の2つのDD別
   RB確率プロファイル(dd=1..31、rb_rate_pooled=sum(rb_count)/sum(games))を作る。
3. 各期間内でKruskal-Wallis(DD群間、rb_probability_decimalを連続値として)を実施し
   epsilon_squaredを効果量とする。RB確率は分散が小さいためdiff系の閾値(0.1)より
   緩い基準(0.02程度)を使う。
4. 両期間で共通してn>=5のDDレベルのみを使い、Spearman相関で「全体期間の
   DDランキング」と「直近60日のDDランキング」の一致度(rho)を測る。
5. verdict分類: 両期間で効果量とrho>=0.4が揃えば`stable_dd_bias`
   (固定的な偏り)、直近だけ効果があれば`recent_drift`
   (トレンド変化/ランダム化の可能性、ただし小標本ノイズの疑いも強い)、
   両方なければ`no_signal`。
6. game_normalizedフィルタ(400→2000等)を変えて頑健性を確認する。
   フィルタ強度を変えてもverdictが崩れない組み合わせのみ信頼する。

## 例
実装は `eda/juggler_all_hall_dd_rb_trend_scan.py`。76(hall×machine)組を
game>=400で走らせると stable_dd_bias=2, recent_drift=35, no_signal=37, faded=2。
game>=2000に厳格化すると stable_dd_bias=2(内訳変化), recent_drift=31,
no_signal=41, faded=2 に変化。recent_driftが最多カテゴリだが、直近60日窓は
DD31レベルに対してセルあたりサンプルが薄く(min_cell_n=5ぎりぎり)、
「ホールが戦略を変えている」証拠と決めつけず、ノイズの可能性を先に検討すること。

