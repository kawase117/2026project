# ジャグラー島×末尾7×x_day が唯一3期間すべてで安定したシグナル

## 背景
全島・全末尾の組み合わせの中で、旧店長2025・旧店長2026前半・新店長2026/5月の
3期間すべてで正の偏差を維持したのはジャグラー島×末尾7のみだった。
物理的ジャグラー島: +196 → +309 → +280（強化傾向）
機種タイプjug:      +232 → +209 → 確認中

マイジャグラーV（台641, 674）が全期間機種変更なしで安定しており、
ジャグラー系は機種変更が少ないため末尾パターンが長期維持される。

## アクション
「今日はx_day、何を狙えばいいか分からない」場合の第一候補はジャグラー島の末尾7台。
ただし台607（末尾7のAT島台）は2026年に崩壊しているため混同しないこと。
ジャグラー島（641-691）内の末尾7台を狙うのが正しい。

## 例
```
両分類軸で一致して安定な組み合わせ（2026年）：
  ジャグラー島×jug × 末尾7: 物理(+304), 機種タイプ(+209) → ◎ 最信頼
  AT島×at_variety × 末尾2:  物理(+437), 機種タイプ(+405) → ○ 2026年に台頭
  AT島×at_variety × 末尾8:  物理(+413), 機種タイプ(+408) → ○ 2026年に台頭
```

