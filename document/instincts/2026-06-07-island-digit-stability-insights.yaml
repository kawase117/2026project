# 分析軸は「物理的島（台番号）」と「機種タイプ」の2軸を保持する

## 背景
機種タイプ（jug_flag/bt_flag等）による分類と物理的島（台番号範囲）による分類は
それぞれ独立した価値を持つ。一方を捨てずに両方を維持することで精度が上がる。

物理的島の強み：機種変更があっても台番号は変わらず耐久性が高い。長期ルール向き。
機種タイプの強み：機種固有の特性（ジャグラー系はボーナス確率型）を反映する。精密分析向き。

みとやでの対応：
- AT島(501-640) ≈ at_variety（機種タイプ）
- ジャグラー島(641-691) ≈ jug（機種タイプ）
- バラエティ島(692-755) = 混合（jug/bt/oki等が混在）

## アクション
新しい分析軸を設計する際は両軸を並行して使う。
両方で一致したパターンが最も信頼度が高いシグナル。
他ホールへの応用時も「物理的島」と「機種タイプ」の2軸で検証する。
将来は「列（セクション単位）」という細分化も可能。

## 例
```
単軸 vs 両軸の信頼度比較：
  物理的島だけ → 機種変更後も追跡可能だが機種固有の特性を見逃す
  機種タイプだけ → 機種変更で追跡不能になるリスク
  両軸一致 → 最も信頼度が高い（機種が変わっても位置が同じなら継続性あり）
```

