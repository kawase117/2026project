# みとやの設定末尾パターンは2025年と2026年で大きくシフトした

## 背景
島別×末尾×年別の安定性を3期間（旧店長2025/旧店長2026前半/新店長2026/5月）に分けて検証した。
2025年と2026年1-4月で主力末尾が入れ替わっていた。
この変化は店長交代（2026年4月末）より前、2026年1-4月の時点で既に始まっていた。
主因は機種入れ替えの可能性が高い（台640: かぐや様は告らせたい→スマスロ秘宝伝等）。

## アクション
過去全期間の平均で末尾を選ばないこと。
直近期間（旧店長2026年1-4月）を最優先の参考値として使う。
新店長（2026年5月〜）のデータは6日分のみで判断不可のため、
2-3ヶ月後（2026年8月以降）に再検証が必要。

## 例
```
AT島(501-640) 3期間比較：
  旧店長2025:     末尾1(+442), 末尾4(+346), 末尾5(+330) ← 終わった戦略
  旧店長2026/1-4: 末尾2(+421), 末尾8(+392), 末尾6(+274) ← 現在の最良参考値
  新店長2026/5:   末尾2(+498), 末尾8(+497)（n=6日、参考程度）

ジャグラー島(641-691) 3期間比較：
  旧店長2025:     末尾6(+290), 末尾5(+203), 末尾7(+196)
  旧店長2026/1-4: 末尾7(+309), 末尾9(+251), 末尾4(+245)
  新店長2026/5:   末尾8(+499), 末尾7(+280)（n=6日）
```

