# みとや x_day の推奨末尾は島によって完全に異なる

## 背景
「x_dayは末尾4/7が強い」という命題はAT島・ジャグラー島を混合した全体平均の話だった。
物理的な島（台番号範囲）で分けると末尾の推奨が大きく変わることが判明した。

台番号による島分類：
- AT島: 501-640 (y=21-36, 17-22台セクション×8)
- ジャグラー島: 641-691 (y=16-20, 17台セクション×3)
- バラエティ島: 692-755 (y=3-13, 小型混合)
- BT島: 805-815 (y=1, 11台)

x_day偏差（xday_mean - global_mean）：
- AT島:      末尾1(+345), 末尾2(+341), 末尾4(+308) ← 末尾7は+266で4位
- ジャグラー島: 末尾7(+228), 末尾6(+190), 末尾9(+170)
- バラエティ島: 末尾8(+217), 末尾1(+189), 末尾9(+189)

## アクション
みとやでx_dayに台を選ぶ際は島を先に決めてから末尾を選ぶ：
- AT島（501-640台）→ 末尾1か末尾2の台
- ジャグラー島（641-691台）→ 末尾7の台
- バラエティ島（692-755台）→ 末尾8の台
「全体でx_day末尾4/7」という命題は単独では使わない。

## 例
```
島別 x_day偏差 Top3（みとや, 2025-2026全期間）：
  AT島(501-640):       末尾1(+345) > 末尾2(+341) > 末尾4(+308)
  ジャグラー島(641-691): 末尾7(+228) > 末尾6(+190) > 末尾9(+170)
  バラエティ島(692-755): 末尾8(+217) > 末尾1(+189) = 末尾9(+189)
  n_records: AT島=1428/digit, ジャグラー島=510/digit, バラエティ島=~700/digit
```

