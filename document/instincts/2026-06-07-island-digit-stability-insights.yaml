# ana-slo.comは機種入れ替え初日だけ「L〇〇〇」表記を使う仕様

## 背景
機種入れ替えがあった日のみ、ana-slo.comのサイトが機種名の先頭に「L」を付けて掲載する。
翌日からは正式名称に戻る。これはスクレイピングエラーではなくサイト側の仕様。

確認例（JSON原本で検証済み）：
- 台509-512: 2025-03-03のみ「Lバイオハザード5」→翌日「バイオハザード5」
- 台557-558: 2025-10-20のみ「L荒野のコトブキ飛行隊」→翌日「荒野のコトブキ飛行隊」

この「L」付き機種名がDBに記録されると：
1. machine_masterに重複エントリが作成される
2. 機種変遷分析でノイズが発生する
3. 機種タイプ分類（jug_flag等）が正しく行われない場合がある

「LB〇〇」で始まる機種名（ニューパルサーBT系等）は正式名称のため除外が必要。

## アクション
json_processor.pyのprocess_machine_data()内（機種名抽出直後、L326付近）に追加：
```python
if machine_name.startswith('L') and not machine_name.startswith('LB'):
    machine_name = machine_name[1:]
```
既存DBに残っているL-プレフィックスは別途normalize_l_prefix_in_db()で一括修正。

## 例
```
正規化すべき（先頭Lを除去）：
  「Lバイオハザード5」      → 「バイオハザード5」
  「L荒野のコトブキ飛行隊」  → 「荒野のコトブキ飛行隊」

保護すべき（LBで始まる正式機種名）：
  「LBニューパルサー」         → そのまま
  「LB SHAKE BONUS TRIGGER」  → そのまま
```

