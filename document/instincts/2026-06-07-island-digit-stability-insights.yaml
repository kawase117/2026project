# Windows Python での日本語出力は sys.stdout.reconfigure(encoding='utf-8') が必須

## 背景
Windows環境ではPythonのデフォルトstdoutエンコーディングがCP932（Shift-JIS）のため、
UTF-8で保存された日本語文字列をprintすると文字化けする。
分析スクリプトで機種名・ホール名が文字化けすると誤った名称を正しい名称と誤認し
分析結果の解釈を誤る危険がある。

実害の例：
- 機種名「かぐや様は告らせたい」が文字化けして別の機種名に見えた
- 「スマスロ秘宝伝」が「スマスロ碧」に見えた
- その結果「存在しない機種変更」を分析報告してしまった

## アクション
日本語を出力する全てのPythonスクリプトのimportブロック直後に必ず追加：
```python
import sys
sys.stdout.reconfigure(encoding='utf-8')
```
対象ファイルの確認コマンド：
`grep -rn "print" --include="*.py" | grep -v "^Binary"` でprintを含むファイル全て。
または `grep -rln "print" ml/ database/ | xargs grep -l "."` で一括確認。

## 例
```python
# 必須パターン（全分析スクリプトの冒頭）
import sys
sys.stdout.reconfigure(encoding='utf-8')
import sqlite3
import pandas as pd

# これがないと以下のような出力になる：
# 縺九∫オ倥○繧ｵ縺ｾ縺ッ蜈ｱ繧峨ｏ縺ｦ縺昴＆縺 → 正しくは「かぐや様は告らせたい」
```
