# 末尾効果が統計的に有意なのは2F_L_N（p=0.028）と3F_L_N（p=0.034）だけ

## 背景
6セグメントのKruskal-Wallis検定結果:
2F_L_N: H=18.7, p=0.028, digit_range=218, 176台 → 有意
3F_L_N: H=18.1, p=0.034, digit_range=278, 100台 → 有意
2F_R_N: H=11.0, p=0.278, digit_range=119, 156台 → 非有意
3F_L_A: H=6.1, p=0.731, digit_range=87, 98台 → 非有意
3F_R_A: H=9.8, p=0.368, digit_range=72, 98台 → 非有意
3F_R_N: H=9.3, p=0.410, digit_range=346, 47台 → 死亡セグメント

A機セグメント（3F_L_A, 3F_R_A）は全粒度で末尾効果が非有意。
digit_range=72-87は差枚のノイズ範囲内。

## アクション
末尾選択で差をつけられるのは2F_L_Nと3F_L_Nのみ。
2F_R_N、3F_L_A、3F_R_Aでは末尾選択は期待値に影響しない。
3F_R_Nは47台・avg_diff≈0で分析対象外。

## 例
2F_L_N: d6(+365)が突出して強い。d3(+147)との差=218。
3F_L_N: d8(+193)とd3(-85)の差=278。d3/d0はマイナス域で打つほど負ける。
3F_L_A: d5(+274)とd7(+188)の差=87。これは差枚分散のノイズ範囲内で有意でない。

