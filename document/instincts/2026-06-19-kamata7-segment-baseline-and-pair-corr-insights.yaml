# 3F_R_Nは47台・avg_diff≈0の死亡セグメント — 分析対象外

## 背景
3F_R_N: 47台、15,889観測、avg_diff=+0.78（実質ゼロ）
Kruskal-Wallis p=0.410、ペア連動 p=0.644
末尾分布も偏り: d5/d6/d7が8.5%、d9が10.7%（通常は各10%前後）

digit_range=346は一見大きいが、47台のうち特定末尾の台数が極端に少なく
（d5: 1,352観測 vs d0: 1,672観測）、ノイズで説明できる。

## アクション
3F_R_Nは全ての末尾分析から除外する。
quickref CSVにも含めない。
3F_Rに行く場合はA機（3F_R_A）のみを対象とするが、A機の末尾効果は非有意なので
末尾以外の軸で台選択する。

## 例
3F_R_N d5: +208（1位）vs d1: -138（10位）、差=346
しかしd5は1,352観測（≈4台分）、d1は1,682観測（≈5台分）。
台数1台の差で大きく変動するため、ランキングに信頼性がない。

