# 6段階粒度比較の結果、Level 5（2F/3F×L/R×A/N）が最適

## 背景
Level 0（全体）からLevel 5（6セグメント）まで段階的に末尾ランキングを集計し、
Kruskal-Wallis検定とSpearman ρで最適粒度を判定した。

結果:
- Level 0 ALL: p=0.014（有意だが Simpson's Paradox で汚染）
- Level 1 N: p=0.003（有意）、A: p=0.799（非有意）
- Level 3 2F_N: p=0.210（2F_Lと2F_Rが相殺して信号消失）、3F_N: p=0.043
- Level 5 2F_L_N: p=0.028（回復!）、3F_L_N: p=0.034、他4セグメント非有意

Level 3（2F_N/3F_A/3F_N）では2F_N内のL/R差異が見えない。
Level 5で分割して初めて2F_L_Nの信号が回復した。

## アクション
蒲田7の末尾分析は常にLevel 5（6セグメント）で実施する。
ただし実際に末尾効果が有意なのは2F_L_Nと3F_L_Nの2セグメントのみ。
残り4セグメントはランキングを参考値として保持するが、統計的根拠はない。

## 例
参照CSV: eda/reports/kamata7_segment_digit_baseline_rankings.csv（全Level全セグメント）
参照CSV: eda/reports/kamata7_segment_digit_signal_strength.csv（ε²/Kruskal-Wallis）
参照レポート: eda/reports/kamata7_segment_digit_baseline_report.md

