# 3F_L_N: d8(+193)/d9(+144)が強い、d3(-85)/d0(-31)はマイナス域

## 背景
3F_L_N（3F左側N機、100台、32,684観測）の末尾ランキング:
d8: +193（1位）
d9: +144（2位）
d6: +106（3位）
d1: +43 （4位）
d7: +25 （5位）
d4: +19 （6位）
