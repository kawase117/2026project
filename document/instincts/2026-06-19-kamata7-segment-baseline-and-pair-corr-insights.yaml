# 全体p=0.006のペア連動はセグメント混合のアーティファクト

## 背景
全体の隣接末尾連動（p=0.006）を6セグメントに分解した結果:

全曜日:
3F_R_A: p=0.017（有意）— ただしA機は全ペアが高相関(r=0.23平均)で隣接だけが特別ではない
2F_R_N: p=0.039（有意寄り）— d5-6ペア(r=0.19)が構造の中心
2F_L_N: p=0.061（境界）
3F_L_A/3F_L_N/3F_R_N: p>0.19（非有意）

土曜日:
3F_L_A: p=0.0017 — d5-6-7チェーン（6-7: r=0.54, 5-7: r=0.51）
3F_R_A: p=0.0017 — d1-2-3-4チェーン（2-3: r=0.58, 1-2: r=0.52）
3F_L_N: p=0.042 — d4-6: r=0.51（非隣接!）
2F_R_N: p=0.210 — d5-6: r=0.52だが全体は非有意

元の「d4-5-6土曜クラスター」は:
- 2F_R_Nのd5-6連動
- 3F_L_Aのd5-6-7連動（1つずれ）
- 3F_L_Nのd4-6連動（間のd5は弱い）
の混合だった。セグメントごとに異なるペア構造が存在する。

## アクション
「隣接末尾を並びで狙う」戦略は全般的には根拠不足。
使えるのは:
- 2F_R_N 土曜: d5-6連動(r=0.52)のみ実用的
- 3F_R_A 土曜: d1-2-3-4チェーンだが A機の末尾効果自体が非有意なので価値限定的
A機セグメントの高い全ペア相関は、台数が少なく日ごとの全体出玉変動が全末尾に共通影響しているだけの可能性が高い。

以下のinstinctを修正:
- kamata7-adjacent-digit-pair-correlation → セグメント非分離の結果で過大評価
- kamata7-saturday-456-cluster → 3セグメントの混合アーティファクト

## 例
全体: 隣接r=0.193, p=0.006（有意に見える）
2F_L_N単独: 隣接r=0.132, p=0.061（境界線）
3F_R_N単独: 隣接r=0.025, p=0.644（完全にゼロ）
セグメント分離すると「隣接が強い」という一般法則は消える。

