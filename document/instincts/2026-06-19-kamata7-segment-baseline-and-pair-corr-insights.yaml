# L/R分割で消失したシグナルが回復する（2F_N p=0.21 → 2F_L_N p=0.028）

## 背景
N機全体(Level 1): p=0.003（有意）
2F_N(Level 3): p=0.210（非有意 ← シグナル消失!）
2F_L_N(Level 5): p=0.028（有意 ← 回復!）
2F_R_N(Level 5): p=0.278（非有意）

2F_Lと2F_Rのランキング相関: ρ=0.333（弱い正相関）。
2F_L_Nではd6(+365)が圧倒的だが、2F_R_Nではd7(+240)が1位でd6は4位(+221)。
LとRを混ぜるとd6の優位性が薄まり、シグナルが消える。

同様に:
3F_N(Level 3): p=0.043（有意）→ 3F_L_N: p=0.034（維持）、3F_R_N: p=0.410（死亡）
3F_Nのシグナルは実質的に3F_L_Nのみが担っていた。

## アクション
蒲田7の末尾分析は必ずL/R分割で実施する。
L/Rを統合した集計は、存在するシグナルを消す方向に作用する。
他ホールでも同様のL/R効果がありうるので、分析設計時に検討すべき。

## 例
2F_N全体: d6は1位(+297)だがp=0.210で非有意。
2F_L_N単独: d6は1位(+365)でp=0.028。d6のリードが+297→+365に拡大。
2F_R_N単独: d7が1位(+240)でd6は4位(+221)。LとRで首位末尾が異なる。

