# 2026-06-19の先行instinct 25件のうち、複数が修正・制限付きに変更

## 背景
同日の先行セッションで25件のinstinctをエクスポートしたが、
その後の6段階粒度比較とペア連動分解により、以下が修正された:

完全無効化:
- kamata7-segment-a-digit-baseline: A機d3/d4優位 → Kruskal p=0.799で非有意
- kamata7-kaku2-d3-dominant: 角2×d3最強 → A機末尾効果自体が非有意
- kamata7-saturday-456-cluster: d4-5-6クラスター → 3セグメント混合のアーティファクト

適用範囲の制限:
- kamata7-segment-n-digit-baseline: N機d6最強 → 2F_L_N限定。2F_R_Nでは非有意
- kamata7-adjacent-digit-pair-correlation: 隣接連動p=0.006 → セグメント分離で一般法則として消滅
- kamata7-segment-kakuban-digit-top20: 三軸最強 → 角番の台固有性問題+有意セグメント限定

変更なし:
- kamata7-simpsons-paradox-digit-segment: 依然として正しい（さらに強化された）
- kamata7-triplet-consecutive-rate-low: トリプレット低頻度は変わらない
- kamata7-digit-selection-hierarchy: 階層構造は正しいが、使えるセグメントが絞られた
- ゾロ目関連5件: セグメント粒度とは独立した効果なので影響なし

## アクション
2026-06-19の先行instinctファイルを参照する際は、本instinctの修正を適用すること。
特にA機の末尾ランキングに基づく推奨は全て無視すべき。
有効な末尾戦略は2F_L_N（d6優先）と3F_L_N（d8/d9優先）の2セグメントに限定される。

## 例
旧: 「A機を打つ場合、まずd3/d4を検討する」（kamata7-segment-a-digit-baseline）
新: A機の末尾選択は統計的根拠がない。末尾以外の軸で台選択する。

旧: 「d4-5-6が三角クラスター」（kamata7-saturday-456-cluster）
新: 2F_R_N土曜のd5-6連動(r=0.52)のみが実用的。d4-5-6の三角構造は混合アーティファクト。
