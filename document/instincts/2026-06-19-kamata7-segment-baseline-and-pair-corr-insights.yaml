d5: +9  （8位）
d0: -31 （9位）← マイナス域
d3: -85 （10位）← マイナス域

Kruskal-Wallis p=0.034で統計的に有意。
d8/d9が明確に上位、d3/d0はマイナス域で打つほど期待値がマイナスになる。
3F_L_N全体のavg_diff=+44と低く、末尾選択が特に重要なセグメント。

## アクション
3F_L（3F左側）でN機を打つ場合、d8/d9を最優先。
d3とd0は絶対回避（マイナス域）。
セグメント全体のavg_diffが低いため、正しい末尾を選ばないと負ける。

## 例
d8(+193) vs d3(-85): 差=278。同じ3F_L_NでもHit末尾とMiss末尾で278の差が出る。
これは6/18 instinctの「3F_L_N×DD7-12×末尾9が唯一の構造シグナル」と整合する。

