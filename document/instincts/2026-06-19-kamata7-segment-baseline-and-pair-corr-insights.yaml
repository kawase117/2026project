# A機は全粒度で末尾効果が統計的に非有意 — d3/d4優位は支持されない

## 背景
A機セグメントのKruskal-Wallis検定結果:
Level 1 A全体: H=5.4, p=0.799, digit_range=36
Level 5 3F_L_A: H=6.1, p=0.731, digit_range=87
Level 5 3F_R_A: H=9.8, p=0.368, digit_range=72

全粒度でp>0.3。digit_range=36-87は差枚の標準偏差に比べて微小。
以前の分析で「A機はd3(+234)/d4(+228)が強い」と結論したが、
digit_range=36（d3=+234とd7=+198の差）はノイズと区別できない。

これは以下のinstinctを無効化する:
- kamata7-segment-a-digit-baseline（A機はd3/d4/d2が安定して強い）
- kamata7-kaku2-d3-dominant（角2でd3がmod10を問わず安定最強）
- kamata7-segment-quickref-csv-system のA機部分

## アクション
A機を打つ場合、末尾で台を選ぶ統計的根拠はない。
A機の台選択は末尾以外の軸（角番、セクション、機種別特性）で行うべき。
A機のquickref CSVは参考値として残すが、信頼度を下げて利用すること。

## 例
3F_L_A: d5(+274) vs d7(+188)。差=87だがp=0.731。
3F_R_A: d3(+238) vs d5(+166)。差=72だがp=0.368。
これらの差は数百回の試行で容易に逆転するノイズ範囲内。

