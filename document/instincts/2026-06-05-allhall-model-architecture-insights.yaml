# 蒲田7選択日の実際順位分布：ペナルティ判断の基準値

## 背景
hybrid モデルが蒲田7を選んだ 97/150 日の実際の順位分布（holdout期間）：
- rank=1（本当に最良）: 27日（27.8%）
- rank<=3合計: 71日（73.2%）
- 平均実順位: 2.82、中央値: 2

ランダム期待値との比較：
- rank=1 期待: 11.1% → 実績27.8%（2.5倍）
- rank<=3 期待: 33.3% → 実績73.2%（2.2倍）

## アクション
蒲田7は「外れではないが最良でもない」状態。完全に切る根拠はない。
no_signal_penalty を強めることよりスコア精度を先に改善する。
改善後に 70%+ が続くなら penalty を検討する。

## 例
rank=1率 27.8% vs ランダム 11.1% → 蒲田7はランダムより明確にプラスの選択
しかし 70%+ の選択率は高すぎる → スコア改善で自然に下がることを期待

