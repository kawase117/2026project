# 排他的ビン期待値スコアはspearmanを改善するがavg_diffは変わらない

## 背景
スコア式を累積型から排他的ビン型に変更した実験：
- 累積型: score = w100*P(>=100) + w200*P(>=200) + w300*P(>=300)
- 排他的ビン型: expected_diff = -100*P(<0) + 50*P(0-100) + 150*P(100-200) + 250*P(200-300) + 350*P(>=300)

結果：
- avg_diff: 127.21 → 126.17（-1.04、誤差範囲内）
- spearman: 0.3835 → 0.4263（+0.043、+11%改善）
- 蒲田7選択率: 64.7% → 70.7%（悪化）

spearman改善は「ホール間の相対順位把握能力の向上」を意味するが、
1位を常に選択するため、1位の選択精度が変わらない限りavg_diffは変わらない。

## アクション
排他的ビン型は理論的に正しいスコア式として維持する。
P(<0)の追加は蒲田7の低調日を検知する期待があったが、
蒲田7はP(>=0)が高いため選択率がむしろ上昇した。

## 例
is_ge_0 = (avg_diff >= 0).astype(int)  # 新規ターゲット追加
targets = ['is_ge_0', 'is_ge_100', 'is_ge_200', 'is_ge_300']

