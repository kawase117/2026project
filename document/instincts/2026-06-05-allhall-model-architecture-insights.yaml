# みとや大森町は全フロア1フロア扱い、N/A/BTの3セグメント構成

## 背景
蒲田七は2F/3F × A-type/N-type = 4セグメント（2F_N, 2F_A, 3F_N, 3F_A）。
みとやは全台1フロアのため、フロア区分は不要。
さらに、みとやはBTに高設定を入れることが多いため、BTを独立セグメントとする。

台番号構成: 5xx(99台), 6xx(100台), 7xx(56台), 8xx(11台) → フロア分け不要

## アクション
```python
EXPERTS_MITOYA = ("N", "A", "BT")

def add_atype3_columns(df):
    bt   = df["bt_flag"] == 1
    a_nb = (df["jug_flag"] == 1) | (df["hana_flag"] == 1) | (df["oki_flag"] == 1)
    bucket = pd.Series("N", index=df.index)
    bucket[a_nb] = "A"
    bucket[bt]   = "BT"   # BTが最優先（A条件より後で上書き）
    df["atype_bucket"] = bucket
    df["expert"] = bucket
    df["is_a_type"] = (a_nb | bt).astype(int)  # row_weight互換性維持
    return df
```
`floor_bucket` / `floor_head` 列は生成しない。

## 例
台番号 501（bt_flag=1, jug_flag=1）→ "BT"（BTが優先）
台番号 601（bt_flag=0, jug_flag=1）→ "A"
台番号 701（bt_flag=0, jug_flag=0）→ "N"

