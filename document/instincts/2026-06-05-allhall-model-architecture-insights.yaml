# _optimize_allhall_policy には use_gpu パラメータが必要

## 背景
`build_policy_grid(use_gpu=False, ...)` がフォールバックパスにハードコードされていた。
`_optimize_allhall_policy` に `use_gpu` パラメータがなかったため、
`policy_grid=None` で呼ばれた場合に常にフルグリッドになる。
通常 `main()` から `policy_grid` が渡されるため dead code だったが、
関数シグネチャとして `use_gpu` を持つべき。

## アクション
```python
def _optimize_allhall_policy(*, ..., policy_grid=None, use_gpu: bool = False):
    if combos is None:
        combos = build_policy_grid(use_gpu=use_gpu, ...)  # False固定を解消

# main() の呼び出し側:
best_policy, opt_table = _optimize_allhall_policy(
    ..., policy_grid=policy_grid, use_gpu=bool(args.use_gpu),
)
```

