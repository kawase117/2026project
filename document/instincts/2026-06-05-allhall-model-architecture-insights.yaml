# make_binary_model の分岐は「XGBoostのインストール有無」ではなく「use_gpuフラグ」で行う

## 背景
`if XGBClassifier is None` という条件でモデルを分岐すると、
XGBoostがインストールされている環境では `--use-gpu` なしでも常に XGBClassifier が使われる。
これにより LogisticRegression でチューニングされたベースライン（例: hybrid avg_diff=127.21）が
再現できなくなる。

修正前（バグ）の動作:
- XGBoost入り + `--use-gpu` なし → XGBClassifier(device="cpu") ← LogRegではない
- XGBoost入り + `--use-gpu` あり → XGBClassifier(device="cuda")
- XGBoost未インストール            → LogisticRegression

## アクション
```python
# NG: XGBoostのインストール有無だけで分岐
def make_binary_model(*, c, use_gpu, gpu_backend):
    if XGBClassifier is None:
        return LogisticRegression(C=c, ...)
    return XGBClassifier(...)  # XGBoost入りなら常にXGBoost

# OK: use_gpuフラグで分岐（インストール有無はフォールバックのみ）
def make_binary_model(*, c, use_gpu, gpu_backend):
    if not use_gpu or XGBClassifier is None:
        return LogisticRegression(C=c, ...)   # デフォルトはLogReg
    return XGBClassifier(device="cuda", ...)  # GPU明示時のみXGBoost
```

同様に `make_regressor` も `if not use_gpu or XGBRegressor is None` に変更する。

## 例
```python
def make_binary_model(*, c: float, use_gpu: bool, gpu_backend: str) -> Any:
    if not use_gpu or XGBClassifier is None:
        return LogisticRegression(max_iter=500, class_weight="balanced",
                                  solver="lbfgs", C=float(c), random_state=42)
    params = build_model_params(use_gpu=True, gpu_backend=gpu_backend)
    return XGBClassifier(n_estimators=300, ..., **params)
```

