# pooled + ホール×シグナル交互作用項（hybrid）が最良アーキテクチャ

## 背景
3アーキテクチャの同一holdout比較（150日）：
- per_hall: 58.23（データ不足で過学習）
- pooled: 105.46（全ホール共通係数、ホール固有シグナルを希釈）
- hybrid: 121.92 → C=0.1チューニング後127.21

hybrid は「全データでパラメータを学習しながら、ホール固有のシグナル日に専用係数を持つ」構造。
SIGNAL_DETECTED ホールの DD-topk / strong_zorome の交互作用項が有効。
NO_SIGNAL ホール（蒲田7等）の交互作用項はゼロのままなので自然にペナルティ不要。

## アクション
hybrid を基本アーキテクチャとして採用。特徴量は：
- pooled base features（weekday, dd, is_zorome_day, is_strong_zorome_day等）
- SIGNAL_DETECTED ホールのみ：hall_dummy × confirmed_signal の積

## 例
