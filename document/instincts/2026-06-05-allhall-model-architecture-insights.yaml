# GPU ランキングモデルは小データ（178行/ホール）では LogReg hybrid に劣る

## 背景
GPU model zoo（XGBRanker/LGBMRanker/CatBoostRanker）vs hybrid LogReg の比較：
- hybrid LogReg (C=0.1): avg_diff=126.17 ← 現ベスト
- CatBoostRanker CPU: 111.81
- XGBRanker md3 CPU: 111.81, spearman=0.3117
- CatBoostRanker GPU: 34.73（NDCG GPU未実装で崩壊）

