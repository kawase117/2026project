# ホール別独立モデルは178行では機能しない

## 背景
全ホール統合モデル（pooled）の代わりに、各ホール独立のロジスティック回帰モデルを試した結果：
- per_hall: chosen_avg_diff_mean=58.23, regret=206.50
- pooled: chosen_avg_diff_mean=123.65

per_hall が pooled を大幅に下回った。原因は訓練データが1ホール=178行と少なく、
walk-forward 序盤の訓練サンプルが50〜80行程度まで減るため、疎なバイナリ特徴量
（is_topk_dd: 年5回、is_strong_zorome: 年12回程度）で係数が発散する。

## アクション
ホール別独立モデルは 500行/ホール以上のデータが確保できる場合にのみ有効。
現データ（178日/ホール）では pooled + ホール×シグナル交互作用項（hybrid）が最良。

## 例
❌ per_hall モデル (178行): avg_diff=58.23
✅ hybrid (pooled + hall×signal): avg_diff=127.21
→ DB拡張後（500行+）に per_hall を再評価する

