# 予告が名指しした機種を、少標本の機種別平均だけで『避ける』に入れない。避けるは複数の切り口で一貫して弱い機種に限る

## 背景
2026-10-17の答え合わせで、凍結した予測の「避ける」が大きく外れた。

- 蒲田1の北斗の拳 転生の章2: 7の付く日の4日平均−320を根拠に避けたが、11台の平均が+2,209(+1000以上が7台、edge−1,748)。予告が「メイン機種」として名指ししたのは転生だった。
- 楽園のネオアイムEX: 「予告で優遇されても7の付く日−88で数字の裏づけなし」と避けたが、66台の平均+260(+1000以上が17台、edge+283)。
- 避けて当たったのは蒲田7の東京喰種だけ(平均−232、edge+331)。ただし+1000以上が17台で最大+17,200と、ばらつきが非常に大きい。
- 一方、押す側の「判断」は、楽園・蒲田1・蒲田7・東口の4ホールすべてでedgeがプラスだった(+400、+1,150、+241、+227)。

「数字の裏づけがない」は「予告が外れる」ではない。4日の機種別平均は、台数が3〜10台の機種では偶然の幅に入り、名指しされた機種を否定できない。

## アクション
- 『避ける』に入れるのは、全日・直近30日・曜日・特定日(8の付く日など)の**複数の切り口すべてで負で、負の幅が大きい**機種に限る。例: 蒲田1のサンブレイク(全日−1,107)、楽園のSAO II(全日−381、直近−245)。
- 予告が名指しした機種は、少標本で弱くても『判断の外(中立)』に置く。避けるにも判断にも入れない。
- 『避ける』を書く行は、機械抽出で「避け」を含む行がすべて避ける機種として拾われる。名前の前方一致で別の機種(無印のモンハンライズなど)まで入るので、`prediction_ledger extract` で抽出結果を確認してから凍結する。
- 避ける機種のedge(正なら避けて正解)は、凍結台帳の翌朝採点で、判断のedgeと別に追う。

## 例
```text
避けた北斗転生(蒲田1): 7の付く日4日平均 -320 -> 実績 11台平均 +2,209 (edge -1,748)
一貫して弱い機種の例: サンブレイク(蒲田1) 全日 -1,107 / 8の付く日 +943(不安定)・日曜 -1,686 -> 複数の切り口で負なので避けるに入れる
```

