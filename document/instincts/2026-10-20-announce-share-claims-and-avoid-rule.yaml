# 『ジャグ20%』『エウレカ1/3』は台のうち高設定が何割かの主張。差枚の閾値や他機種との差枚比較では測れない

## 背景
2026-10-17の答え合わせで、楽園の予告「ジャグ20%⑤⑥」と「エウレカが1/3」が、従来の判定で「外れ」になった。ユーザーに「ジャグ20%はジャグラーの20%が高設定(456)という意味」「エウレカの1/3が高設定という意味で、機械割が低めの機種はこの測り方では実態をつかめない」と指摘された。

- 従来のジャグ20%の判定(`category_share`)は、閾値(機種平均+1,800)を超えた機種のうちジャグラーが何割か、だった。ジャグラーの高設定が20%入っても、機種平均の差枚は負のまま(4,800Gで設定5は約+470、設定1〜2は約−360。0.2×470＋0.8×(−360)≒−190)で、+1,800には届かない。主張を測っていなかった。
- 従来のエウレカ1/3の判定(`model_named_ratio`)は、機種の上位1/3台の平均差枚を、ホール全体の差枚の上位1/3の平均(+2,718)と比べた。境界(+334)を超えた台はエウレカ25台中8台(32%)で台数は1/3どおりだったのに、上位9台の平均+1,249がホール上位1/3の平均に届かず「外れ」。機種ごとの機械割の違いを無視する比べ方だった。

## アクション
- 『台のうち高設定が何割』の主張は、**高設定(4〜6)の割合の推定**で判定する。`announce.py` の `category_high_share`(カテゴリ)と `model_high_share`(機種)を使う。`basis=bonus` はBB/RBの尤度(ジャグラー・ハナハナ)、`basis=payout` は設定別機械割から出す期待差枚との混合(AT・ART)。
- 判定は区間で3段階(期待通り(矛盾なし)/期待を上回る/期待を下回る)にし、否定できたときだけ hit=False にする。「外れ」とは書かず、「予告は出ていたが期待通りの結果ではなかった」と書く。仕掛けの有無は差枚からは言えない。
- `basis=payout` は割合の値が低めに寄る(真の割合30%でも推定3〜13%)。「期待を下回る」と否定できるのは主張値がかなり高いときだけ。台数が少ない日(AT・ARTで24台など)は区間が広く、数日分をまとめて見る。
- A+ATでも、DBのBB/RB列がスペックと合わない機種がある(楽園のエウレカ ZERO TYPE-ART: RBは常に0、BBは1/198でスペックの1/258〜278より速い)。名前だけで `basis=bonus` を使わず、列がスペックの範囲に入るかを確認する(判定側は `_columns_match_spec` で hit=None にする)。判別可否はスペックを引いて答える点は `check-spec-judgeable-before-saying-unjudgeable` と同じ。

## 例
```text
楽園 10/17 ジャグ20%: 1,500G以上のジャグラー110台、高設定の割合の推定16%、95%区間6〜30% -> 20%を含む = 期待通り(矛盾なし)
楽園 10/17 エウレカ1/3: 差枚×機械割で24台、推定0.1%、95%区間0〜37% -> 33%を含む = 期待通り(矛盾なし)(区間が広く、否定も肯定もできない)
```

