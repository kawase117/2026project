# 候補抽出に後半データが使われている以上、前後半分割は holdout ではなく split-half consistency check

## 背景
`eda/rakuen_theory_revalidation.py` はジャグ・ハナハナ・技術介入・AT一般のカテゴリ別DD候補を
中央値日（2025-10-14）で前後半に割り、後半でBH補正付き permutation 検定を行い、通過分に
`holdout_supported` という列名を与えた。しかし候補DD `{5,11,15,22,25}` 等は 2026-07-29 時点、
すなわち**後半を含む全期間**から抽出されている。後半は仮説生成に使われたデータであり、
定義上 out-of-sample ではない。

この誤ラベルは実害がある。`holdout_supported` は「再利用してよい候補」のゲートとして
report.md の判定セクションに使われており、読者（未来の自分を含む）は前向き検証済みと誤読する。
真の holdout は候補確定日以降に新規到着したデータ（このケースでは 2026-07-29 以降）しかない。

なお検定そのものの実装は正しい。独立単位を日次平均に取って permutation を回しており
（`eda/rakuen_theory_revalidation.py:134`）、台行レベルの擬似反復による p 値インフレを回避している。
ジャグで31DD中1本しか通らない（p値分布がほぼ一様）のは較正が効いている証拠。
問題は検定ではなくラベルと結論の書き方。

## アクション
- 分割検証の列名・見出しは `split_half_consistent` / `前後半で方向一致` とする。`holdout` の語は
  候補確定日より後に到着したデータにのみ使う。
- 前後半一致は「候補が期間内で安定していた」証拠であって、「将来も効く」証拠ではない。
  運用投入の可否は `backtest/prereg.py` の事前登録＋`backtest/forward/` のフォワードで決める。
- 中央値分割は仮説ではなくデータ量で決めた恣意的な線であることを明記する。改定時期を主張したい
  なら change-point 検定を別途行う。

## 例
誤: 「時系列holdoutのBH補正を通過したのはジャグDD5のみ。他は再利用不可」
正: 「前後半で方向一致かつ後半BH補正通過はジャグDD5のみ。ただし候補自体が全期間由来なので
    これは期間内安定性の確認であり、前向き妥当性は未検証」

