# omnibus 非有意と walk-forward top-k 有効は矛盾しない。検定設計が違うだけ

## 背景
`rakuen_theory.md` §2.1c は「section主効果・section×DD交互作用は構造なし」と結論している。
一方、同じデータで直近90日を訓練窓とする walk-forward（当日games足切りなし・工事前・
ジャグp56）を回すと、top3 section の excess は通常日100日で **+0.047 [+0.040, +0.053]** と
明確に正だった（`eda/results/rakuen_theory_revalidation/juggler_section_walkforward_p56.csv`
の daily 行から算出）。

これは矛盾ではない。omnibus は「全section が等しい」という強い帰無仮説を全section同時に
検定するため、上位数区画にだけ効果があり残りが平坦な場合には検出力を失う。対して
top-k walk-forward は「直近実績上位の区画を選ぶ」という**逐次的な意思決定手順**そのものを
評価しており、平坦な下位区画は選択されないので希釈されない。運用が知りたいのは後者。

## アクション
- 「構造なし」と書く前に、その主張が omnibus 検定由来かどうかを確認する。omnibus 由来なら
  「一括検定では検出できない」と書き、top-k walk-forward の結果を併記する。
- 逆に walk-forward が正でも、それが**機種構成の偏り**で説明できないか必ず潰す。p56 は
  family 別スペックで計算されている（`eda/dd_setting_posterior_rank.py:96`）が、section 間の
  機種構成が偏っていれば事後分布の鋭さと平均回転数の差だけで持続的な section 差が出る。
  `p56` を (date × family) 内で残差化して同じ walk-forward を回し、効果がどれだけ残るかを見る。
- セオリー文書の該当節は「構造なし」→「一括検定では検出不可、top-k逐次選択では+Xpp」に書き換える。

## 例
誤: 「§2.1c で section 効果は否定済みなので section ベースの推薦は作らない」
正: 「omnibus は非有意だが top3 walk-forward は +4.7pp。family残差化後も残れば採用候補」

