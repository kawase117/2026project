# 物理マッピングが未確定なら、再集計しても出てくるのは工事前の遺物

## 背景
楽園蒲田は 2026-07-06 に改装。`legacy_section_status.csv` は旧7区画
（1106-1115 / 1130-1134 / 1209-1216 / 3113-3116 / 3117-3120 / 2141-2162 / 1057-1059）すべてが
`requires physical mapping / re-estimation` であることを示した。うち2区画は工事前の行数も0で、
そもそもラベルが現存しない。

この状態で §6/§8/§9 を「完全再実行」しても、出力されるのは工事前レイアウト上の推定値であり、
現行の台選びには使えない。工事後の観測日数は20日しかなく、clean列の端効果も
`insufficient-post-period` 判定で、独立に再推定するにも足りない。作業順序は
**物理マッピング確定 → 再集計**であって逆ではない。

## アクション
- 改装後は、旧ラベルを使うすべての運用ルール（`rakuen_theory.md` §12 のハード回避・狙い目リスト）を
  まず全面凍結する。再実行の優先度はマッピング確定より必ず後。
- マッピングは台番号の連続性ではなく `Heatmap/*_floor_coordinates_*.csv` と
  `machine_layout_history` の突合で物理的に確認する。
- 工事後データが60日に満たない間は、工事前の推定値を現行レイアウトへ移植しない。
  移植ではなく「工事前の知見を仮説として、工事後データで事前登録フォワード」の形にする。
- セオリー文書の冒頭に「運用フローは未再計算のため暫定」を明記し、注意書きだけ読む人と
  §12の台選びフローだけ読む人が逆の行動を取る事態を防ぐ。

## 例
`rakuen_theory.md` は §3.1c/§2.2b で旧定義の無効化を追記済みだが、§12 の実運用フローは
旧イベント日 `{10,11,22,30}` と旧section名のまま残っており、`min_games=2500` の足切りも
§6.1 自身が撤回した後に残置されていた。訂正の追記だけでは運用節は直らない。

