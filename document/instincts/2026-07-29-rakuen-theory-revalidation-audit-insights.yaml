# 「1つだけ生存」の要約は、候補間の順位入れ替わり（カレンダー改定）を消してしまう

## 背景
楽園ジャグのカテゴリ別DD候補を p56（設定5-6事後確率）で前後半比較すると、
`eda/results/rakuen_theory_revalidation/category_dd_temporal_validation.csv` は次を示す。

| DD | 前半effect | 後半effect |
|---|---|---|
| 5 | +0.010 | +0.044 |
| 11 | +0.009 | +0.030 |
| 22 | +0.051 | +0.016 |
| 25 | +0.051 | +0.021 |

前半で最強だった DD22/25 が後半で 1/3 に減衰し、前半で最弱だった DD5 が 4 倍に増えている。
BH補正を通ったのは DD5 のみなので「DD5だけ生存、他は未確定」と要約できてしまうが、
この要約は**入れ替わりが系統的である**という最も情報量の多い構造を捨てている。
運用上「DD5を狙う」と「DD22/25はもう死んでいる」は別の主張であり、後者は
旧セオリーに基づく台選びを止める根拠になる。

## アクション
- 候補群の前後半比較では、生存/非生存の二値ではなく effect の**順位変化**を必ず表で出す。
- 順位入れ替わりが見えたら中央値分割で止めず、change-point 検定でカレンダー改定時期を推定する。
- ホール側のイベントカレンダーは改定されうるものとして扱う。「シグナルが消えた」と
  「シグナルが移動した」を区別しないと、移動先を取り逃す。
- 改装・店長交代など既知の変化点はユーザーに聞いて期間分割する
  （関連: `2026-07-27-hall-regime-external-event-calendar-methodology.yaml`,
  `2026-07-23-regime-nonstationarity-and-changepoint-insights.yaml`）。

## 例
`document/rakuen_theory.md` の旧イベント日定義 `{10,11,22,30}` が無効化された経緯も同型。
定義が「間違っていた」のか「途中で変わった」のかで、過去データの扱い（全捨て vs 期間分割）が変わる。

