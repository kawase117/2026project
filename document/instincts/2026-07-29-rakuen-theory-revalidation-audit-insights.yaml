# 機械割ベースの rate は設定検出ではなくホールの月次収支リズムを拾いうる。p56 と同列に置かない

## 背景
`category_dd_temporal_validation.csv` の BH補正通過数はカテゴリで大きく偏る。

| category | metric | 31DD中の通過数 |
|---|---|---|
| ジャグ | p56 | 1 |
| ハナハナ | rate | 7 |
| 技術介入 | rate | 3 |
| AT一般 | rate | 0 |

ハナハナで7/31が通り、しかもそのうちDD13/19は有意な**マイナス**効果。設定投入日が
月に7日以上あり、かつ特定日に有意な低設定日があるという解釈より、
`rate`（機械割）が設定ではなくホールの月次収支サイクルと打ち手の技術介入度を
拾っていると考えるほうが自然。機械割 = 100 + diff/(3*games)*100 であり、
分母の games は客の集合的判断を含むエンドジェナスな量
（関連: `2026-07-29-rakuen-event-day-category-decomposition-insights.yaml`）。

ジャグの p56 だけが BB/RB 回数の二項尤度による**設定の直接推定**であり、
他カテゴリの rate とは情報の質が違う。同じ表に並べると読者は同じ信頼度で受け取る。

## アクション
- カテゴリ横断の DD 表を作るときは metric 列を必ず併記し、p56 由来と rate 由来を
  別セクションに分ける。少なくとも rate 由来には `exploratory` タグを付ける。
- ハナハナは一撃スペック表から BB/RB 確率を引けるので、p56 相当の尤度指標を作れる。
  それを作るまでハナハナDD7/17/27は `watching` 固定とし、台選びの根拠にしない。
- 技術介入・AT一般は打ち手の技術差が機械割に直接乗るため、尤度指標を作れない。
  これらのカテゴリでは日レベルのDD主張自体を控える。

## 例
誤: 「ハナハナはDD7/17/27が再現、技術介入はDD11/22/30が残った」と一覧表で提示
正: 「設定尤度で検証できたのはジャグDD5のみ。ハナハナ・技術介入は機械割ベースの
    探索的所見で、回転数選択と設定を分離していない」

