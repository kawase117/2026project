# 「上回らなかった」は「劣る」と「差が検出できない」の両方を意味しうる。対応差CIがなければ判定不能

## 背景
Codex が生成した `eda/results/rakuen_theory_revalidation/report.md` は section walk-forward の
比較を点推定のみで示し、「category_calendar_split は all_history を上回らなかった」と結論した。
CSV の daily 行から**対応差**（同一日で両モデルを引き算）のCIを自分で計算すると:

- ordinary top3: 対応差 +0.0028 [-0.0009, +0.0064]
- event top3:    対応差 +0.0016 [-0.0079, +0.0112]
- ordinary top5: 対応差 -0.0018 [-0.0056, +0.0019]
- event top5:    対応差 -0.0009 [-0.0107, +0.0088]

4セルすべて0を跨ぎ、かつ幅は±0.01と効果量+0.047に比べて十分狭い。つまり実態は
「splitが劣る」ではなく**実質同等**。採択する結論（単純な all_history を使う）は同じでも、
理由が「splitが負けた」か「差を検出できないので単純な方を採る」かで、将来 split を
再検討する余地の有無が変わる。

## アクション
- モデル比較は必ず**同一日で対応を取った差**のCIを出す。独立2群のCIの重なりで判断しない。
- 他エージェントの分析成果物を受け取ったら、report.md の文章ではなく**元CSVから自分で
  再計算**する。特にCIが省略されている箇所は、結論が反転しうる場所として優先的に検算する。
- CIが0を跨ぎ、かつ幅が効果量に比べて十分狭いなら「差なし」ではなく「実質同等（equivalence）」
  と書く。サンプル不足で幅が広い場合は「判定不能」と書き分ける。
- 関連: `2026-07-27-predict-scorecheck-cycle-methodology.yaml`（CI幅の併記は必須要件）。

## 例
このセッションでは report.md に埋もれていた **section top3 の excess +4.7pp [+4.0, +5.3]** が
CSV 再計算で初めて可視化された。比較の勝敗にばかり紙面が割かれ、両モデル共通の
「section ランキング自体が効いている」という最大の発見が報告されていなかった。

