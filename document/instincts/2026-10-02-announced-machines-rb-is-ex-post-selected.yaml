# 発表機種のRBが高いのは事後選択を含む。「RBなら選択の影響が小さい」は誤り

## 背景
月次レポート層2で、発表された判別可能機種と同日の未発表機種のP(設定4以上)を比べると 0.674 vs 0.328（差+0.346、95%CI[0.291,0.400]、
発表110機種×日・未発表632機種×日・28日）と大差になった。当初は「RBは差枚ほど直接は選ばれない」と説明したが誤り。
ノーマル/BT/A+ATはボーナス回数が出玉に直結するので、差枚で選ばれた(結果を見て選ばれた)機種はRBも高く出る。
この差は発表の選択の強さを強く含み、店の投入の証拠にならない。公表は店に都合のよい選択でもある（既存の方針）。

## アクション
- 発表機種 vs 未発表機種の比較は、RBでも差枚でも「選択を含んだ上限の目安」としてだけ報告する。「発表された=入っていた」の根拠にしない。
- 店の投入を測るには、発表前に決まっている情報（予告・イベント日）との突き合わせを使う。結果発表は正解ラベルとイベント実績の算出にだけ使い、予測の入力特徴量にしない（リーク）。
- 並べ替え検定は同じ日の中で発表/未発表ラベルを入れ替える（日で層別）。

## 例
backtest/monthly_report_layer2.py の announced_rb_comparison と、レポート層2の「発表された判別可能機種 vs 同日の未発表機種」節。
