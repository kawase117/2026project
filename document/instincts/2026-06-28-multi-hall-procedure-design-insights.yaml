# グリッドサーチ禁止、感度分析のみ

## 背景
パラメータの全組み合わせを試す（グリッドサーチ）と、
最良の組み合わせがデータに過適合するリスクがある。
パラメータ数を5個に制限し、1変数ずつの感度分析で調整する。

## アクション
- 調整対象: アクション閾値(3pp)、縮小k(20)、訓練期間(60日)、min_games(1500)、スパイク閾値(5pp)
- 手順:
  1. デフォルト値でバックテスト → ベースラインlift
  2. パラメータを1つずつ変化させ、liftの感度を確認
  3. 感度が高いパラメータのみ微調整
  4. 最終パラメータで再度バックテスト → 確定
- パラメータの追加は禁止（5個固定）

## 例
訓練期間を60→90日に変更 → lift@10が+2%改善 → 感度あり → 採用検討
アクション閾値を3→2ppに変更 → lift@10が-1%悪化 → 感度低い → デフォルト維持

