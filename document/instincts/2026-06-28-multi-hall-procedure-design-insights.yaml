# 残差計算は当日平均を使用する

## 背景
残差₁ = 差枚 - セグメント平均 の「セグメント平均」に全期間平均を使うと、
イベント日にホール全体が上がる変動が残差に残る。
当日平均を使えば「その日のセグメント内での相対的な強さ」を見ることになり、
日ごとの全体変動を自然に除去できる。

## アクション
- 残差₁ = 台Xの差枚 - 所属セグメントの**当日**平均差枚
- 全期間平均は使わない
- この残差₁に対してDD効果（残差₂）を計算する

## 例
イベント日に全セグメント平均+500枚の場合:
- 全期間平均使用: 残差₁に+500が残る → DD効果と混入
- 当日平均使用: 残差₁は0周辺 → クリーンな要素効果検出

