# Step 1 と Step 2 は循環的に実施する

## 背景
セグメント判別（Step 1）とイベント日判別（Step 2）は独立ではない。
蒲田7のLR効果が全期間平均では差ゼロだがDD条件付きで出現した事実から、
DD分析の結果がセグメント定義にフィードバックされる循環構造が必要と判明。

## アクション
実行順序:
1. Step 1-1〜1-4: セグメント初期判別（10台ブロックヒートマップ、クォータイル、冷却/加熱ゾーン）
2. Step 2-1〜2-5: イベント日判別（DD×セグメント全出し、スパイク検出）
3. Step 1-5〜1-6: DD条件付きセグメント検出 → セグメント定義確定（循環フィードバック）
4. Step 3以降に進む

## 例
蒲田7: Even/Odd差=0pp（全期間）→ DD別に分解 → 特定DDでのみLR効果出現 → セグメント再定義

