# スコアリングは加算方式→LTR移行の2段階

## 背景
蒲田7ではLTRアプローチで進めたが、他ホール展開の初期段階では
どの要素が効いているか把握しやすい加算方式の方が透明性が高い。
効果が確認できたホールから段階的にLTRに移行する。

## アクション
- Phase 1（加算方式）: スコア = Σ（要素iの効果量pp × 該当フラグ）
- Phase 2（LTR移行）: 要素を特徴量として学習モデルに投入
- 移行判断: バックテストで加算方式のliftが安定して正 → LTR移行を検討

## 例
角番効果+5pp + 末尾効果+3pp → 角番かつ末尾該当台のスコア = +8pp

