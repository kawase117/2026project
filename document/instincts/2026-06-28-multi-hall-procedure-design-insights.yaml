# ベイズ縮小 k=20 適応型

## 背景
DD=1〜31 × セグメント のクロス集計では、DD=31のように出現回数が少ないセルが発生する。
小規模ホールでは1セルに5件しかないこともある。
単純な閾値カット（N未満は除外）ではなく、ベイズ的縮小を採用した。

## アクション
- 推定値 = (n × 観測値 + k × 全体平均) / (n + k)
- k = 20 を基本値とする
- ホールの1DD×1セグメントの平均サンプル数が20未満の場合、k = その平均値に調整
- kがサンプル数と同程度のとき、観測値と全体平均が半々でブレンドされる

## 例
DD=31, セグメントA, n=8, 観測値=55%, 全体平均=43%, k=20
→ 推定値 = (8×55 + 20×43) / (8+20) = 46.4% （55%→46.4%に縮小）

