# スパイクの3分類

## 背景
DD×セグメントのヒートマップでスパイクを検出した際、
その性質によって対応が異なる。3種に分類して処理する。

## アクション
| パターン | 判定基準 | 対応 |
|----------|----------|------|
| 全セグメント共通 | 全セグメントで+5pp以上 | ホール全体のイベント日として採用 |
| セグメント限定 | 特定セグメントのみ+5pp | 条件付きイベントとして記録 |
| 単発 | 1-2セルのみ | 周年・強ゾロ目等を個別調査 |

帰納的グルーピング: スパイク検出後に{7,17,27}→「7のつく日」と命名。
先にDD群を仮説として定義してはいけない。

## 例
蒲田7: DD={7,17,27}が全セグメント共通スパイク → 「7のつく日」イベント
DD=22がセグメント限定 → 条件付きイベント
