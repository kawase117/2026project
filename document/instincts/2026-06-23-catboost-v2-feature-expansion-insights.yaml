# v2スモーク: AUC 0.602, p@10 0.275（v1: 0.539, 0.217）— フル実行で確認必須

## 背景
CatBoost v2（machine_type 5値cat + rolling_diff 7d/14d/28d + is_event）のスモークテスト（8活性日）:
- AUC: 0.539 → 0.602 (+0.063)
- p@10: 0.217 → 0.275 (+0.058)
- ML昇格3条件: 全PASS（スモーク段階）
- Front 0.300 / Back 0.250（安定）

## アクション
confidence=0.65に留める理由:
1. 8日間のスモークテストは統計的に不安定（標準誤差が大きい）
2. v1のスモークテストでは出なかった傾向がフル（195日）で出る可能性
3. フル実行結果でp@10, AUC, event/non_event分割, front/back全てを再検証
4. 特にevent日のp@10改善（0.205→0.250）がフルでも再現するかが鍵

## 例
v1 full: AUC=0.539, p@10=0.217, ML昇格=NOT YET
v2 smoke: AUC=0.602, p@10=0.275, ML昇格=PASS（暫定）
v2 full: 実行中（推定25-35分）
