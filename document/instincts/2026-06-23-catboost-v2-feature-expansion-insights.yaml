# is_eventフラグ追加でMLのイベント日弱点に対処

## 背景
v1ではMLがイベント日で弱い（0.205 vs ルール0.236）、非イベント日で強い（0.222 vs 0.210）パターンがあった。
v2でis_eventを明示的に特徴量投入した結果、スモークテストでevent p@10が0.205→0.250に改善。
CatBoostがis_event×他特徴量の交互作用を学習し、日種別で異なるスコアリングを行えるようになった可能性。

## アクション
MLモデルのevent/non_event分割で一方が弱い場合:
1. is_eventフラグを特徴量として明示的に投入
2. CatBoostの交互作用学習に委ねる（手動分岐より効果的）
3. ただしイベント日の定義自体がルールベースのc3/c4と重複するため、効果の分離は困難

## 例
v1: event 0.205 < rule 0.236, non_event 0.222 > rule 0.210
v2 smoke: event 0.250 > rule 0.050, non_event 0.283 > rule 0.167
