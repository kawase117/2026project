# 1つのML実験プロンプトには1つの主仮説を設定する

## 背景
v2プロンプト初版で「machine_typeカテゴリカル」と「machine_master 4フラグ」が混在し、
Codexから「タイトルと実装が別仮説」「結果解釈が曖昧になる」と指摘を受けた。
仮説が混線すると、改善がどの特徴量に起因するか分離できない。

## アクション
ML実験のプロンプトを設計する際:
1. タイトル・背景・実装が同一仮説を指すことを確認
2. 複数の独立した仮説は別実験（v2a/v2b）に分離
3. 「Phase Xの再現」と称する場合、本当に同じアプローチかを検証する
   - Phase 5の「model_type grouping最有効」は別モデル学習であり、特徴量投入ではない

## 例
NG: タイトル「machine_type categorical」、実装「jug/hana/oki/bt 4フラグ」
OK: タイトル「machine_type 5値categorical」、実装「np.selectで5値に変換しcat_features指定」
