# rolling_diff は窓幅別分離（7d/14d/28d）が単一hist_diffより有効

## 背景
v1のhist_diff（単一の過去平均差枚）をrolling_diff_7d/14d/28dの3窓幅に分離した結果、
スモークテスト（8活性日）でAUC 0.539→0.602（+0.063）に改善。
Phase 9でもrolling_avg_diff_7dが一貫してSelectKBestのトップ特徴量だった。

## アクション
台別の時系列特徴量を設計する際は:
1. 単一窓幅の集約値より、複数窓幅（短期7d/中期14d/長期28d）に分離して投入
2. _calc_rolling_diff ヘルパーで ref_date からの lookback を計算
3. 履歴不足時は fillna(0.0) で安全に処理

## 例
```python
def _calc_rolling_diff(history, target_machines, n_days, ref_date):
    cutoff = ref_date - pd.Timedelta(days=n_days)
    recent = history[(history["date_dt"] >= cutoff) & (history["date_dt"] < ref_date)]
    avg = recent.groupby("machine_number")["diff_coins_normalized"].mean()
    return target_machines.map(avg).fillna(0.0)
```
