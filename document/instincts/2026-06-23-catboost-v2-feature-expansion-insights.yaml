# 機種分類は5値カテゴリカル1列が最適（4バイナリフラグより優位）

## 背景
machine_masterの4フラグ（jug_flag/hana_flag/oki_flag/bt_flag）をそのまま4バイナリ特徴量として投入する案と、
5値カテゴリカル1列（jug/hana/oki/bt/other）としてCatBoostのcat_featuresに渡す案を比較検討。
Codexレビューで「4フラグは別仮説であり、CatBoostの交互作用学習にはカテゴリカル1列の方が自然」と指摘。

## アクション
CatBoostにカテゴリカル変数を投入する場合:
1. np.selectで5値文字列に変換し、cat_features指定でPoolに渡す
2. バイナリフラグの個別投入は避ける（スパースで交互作用学習が非効率）
3. _prepare_ml_frame で数値列とカテゴリカル列を分離処理する

## 例
```python
work["machine_type"] = np.select(
    [work["jug_flag"].eq(1), work["hana_flag"].eq(1),
     work["oki_flag"].eq(1), work["bt_flag"].eq(1)],
    ["jug", "hana", "oki", "bt"],
    default="other",
)
pool = Pool(X, label=y, cat_features=[ML_FEATURES.index("machine_type")])
```
