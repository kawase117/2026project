# 過去Phase実験の引用は「何を実証したか」を正確に記載する

## 背景
v2プロンプトで「Phase 5でmodel_type grouping最有効と実証済み」を根拠にmachine_type特徴量投入を提案したが、
Phase 5は「機種タイプ別に別モデルを学習するgrouping戦略」の検証であり、「machine_typeを特徴量として投入」した実験ではなかった。
Codexから「Phase 5の再現ではなく別アプローチ」と正しく指摘。

## アクション
プロンプトで過去実験を引用する際:
1. 実験が「何を変えて何を測定したか」を正確に確認
2. 「grouping戦略」と「特徴量投入」を混同しない
3. 直接的に再現できない知見は「示唆」として記載し、「実証済み」とは書かない
4. Phase番号だけでなく、具体的な手法名（groupby, feature selection, hyperparameter tuning等）を明記

## 例
NG: 「Phase 5でmodel_type grouping最有効と実証済み → machine_typeを特徴量投入」
OK: 「Phase 5で機種タイプ別のgrouping戦略が有効と実証（AUC +2.44%）。これは機種タイプが予測に有用な情報を含むことを示唆するが、特徴量として投入した場合の効果は別途検証が必要」
