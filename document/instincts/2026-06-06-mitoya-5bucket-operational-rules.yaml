# 異機序のバケットを統合すると個別モデルより性能が落ちる

## 背景
positive_combined モード（x_day + strong_zorome + month_end_30 + dd_11 を "positive_day" に統合）の
holdout 結果は mean_diff=-5.04 と負。一方 atype3 の x_day は +18.16。
統合によって x_day の強いシグナルが他の弱いバケットのノイズで希釈される。
日付パターンが異なれば末尾選択の最適戦略も異なるため、同一モデルで学習させることが不適。

## アクション
バケット統合は「シグナルが同一機序から来ていること」が確認できた場合のみ行う。
x_day（4/7のつく日）と strong_zorome（月日一致）はそれぞれ独立した機序を持つため、
個別バケットとして保持する。
統合バケットの walk-forward 結果が個別バケットを下回ったら即座に廃止を判断する。

## 例
```
バケット統合の NG パターン：
  x_day（末尾4/7が優遇される日）
  + strong_zorome（月日一致の特別イベント）
  + dd_11（ホール全体が強いが末尾は予測不可）
  = positive_combined → mean_diff=-5.04（x_day 単独の +18.16 より悪い）

正しいアプローチ：
  各バケットを独立したサブモデルとして管理し、
  バケット分類→対応モデル選択→予測の順で運用する
```

