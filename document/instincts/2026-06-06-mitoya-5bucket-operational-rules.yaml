# month_end_30 の採用判断には observed_dates >= 6 が必要

## 背景
walk-forward holdout で month_end_30 の mean_diff は +124.00 と強い結果だったが、
observed_dates_holdout=2（2日分）のみ。strong_zorome 採用時と同じ状況。
strong_zorome は min-train-days=5 で採用したが、採用後に n=2 日での CI が
過信頼（bootstrap_ci が実効サンプルサイズを過大評価）であることが判明した。

## アクション
month_end_30 は observed_dates_holdout >= 6 到達まで実戦見送り。
（30日は毎月1回 → 6ヶ月 = 2026年12月ごろに再評価）
それまでは毎月30日に予測ログを記録し、累積実績を蓄積する。
再評価時は「6日中何日が正の mean_diff か」で採用可否を判断する。

## 例
```
現状（2026-06-06）：
  observed_dates_holdout = 2
  mean_diff = +124.00（有望だが統計的に不十分）

再評価条件：
  observed_dates_holdout >= 6（2026年12月ごろ）
  かつ 6日中 4日以上が正の mean_diff

採用後は strong_zorome と同様に margin 閾値を calibration する
```
