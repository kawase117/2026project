# ホール全体が強い日 ≠ 特定末尾が予測可能な日

## 背景
DB探索で DD=11 のホール台平均差枚が +94.5 だったため、x_day/strong_zorome に続く第3の
ポジティブバケットとして dd_11 を設計した。
しかし walk-forward holdout（n=3日）での mean_diff は -65.34 と負になった。
ホール全体の上昇が「全末尾が一様に上がる」によるものであれば、
モデルは末尾選択の根拠を持てずノイズを拾って誤予測する。

## アクション
新バケット候補を評価するとき、「ホール台平均がプラス」だけでは採用根拠として不十分。
「そのバケット内で特定の末尾に集中したプラスが見られるか（=末尾分布の偏り）」を確認すること。
確認方法：bucket_exploration.txt の LastDigit × DD クロス集計を見る。
全末尾が同方向に動いているだけなら、モデルは末尾選択を改善できない。

## 例
```
DD=11 の実績：
  ホール台平均: +94.5（強い）
  walk-forward mean_diff: -65.34（モデル選択が裏目）
  理由推測: 11日は全末尾が一様に強く、特定末尾への集中がない
  → バケットとして採用不可

DD=4/7 のつく日（x_day）の実績：
  ホール台平均: +210.7（強い）
  walk-forward mean_diff: +18.16（モデル有効）
  理由推測: x_day は特定末尾（4,7）への集中が実際に存在する
  → バケットとして有効
```

