# みとや5バケット実戦ルール（2026-06-06 確定版）

## 背景
5バケット walk-forward（atype3 mode、holdout 2026-02-26〜2026-05-29、93日評価）の結果に基づく。

| bucket | mean_diff | observed_dates_holdout | 判断 |
|--------|-----------|----------------------|------|
| x_day | +18.16 | 19 | 採用 |
| strong_zorome | +82.27 | 2 | 採用（n少だが一貫性あり） |
| month_end_30 | +124.00 | 2 | 観測継続 |
| dd_11 | -65.34 | 3 | 除外 |
| others | +0.05 | 67 | margin 閾値で取捨 |

positive_combined mode: positive_day=-5.04, others=-1.62 → atype3 に劣る。使わない。

## アクション
採用バケット: x_day と strong_zorome のみで実戦。
month_end_30 は予測ログに記録するが実戦しない。
observed_dates_holdout >= 6 になった時点（あと4ヶ月分）で再評価する。
dd_11 は当面再検討しない。
positive_combined モードは production に含めない。

## 例
```python
# 実戦採用条件
should_play = (
    day_bucket in {"x_day", "strong_zorome"}
    and margin >= threshold  # walk-forward calibration 済み
)

# month_end_30 は記録のみ
if day_bucket == "month_end_30":
    log_prediction(date, predicted_digit, "watch_only")
```

