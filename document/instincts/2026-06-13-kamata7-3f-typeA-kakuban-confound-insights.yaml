# 蒲田7 3F type A の near/far cat3 「U字パターン」は角番効果ではなく28台の個体特性の交絡

## 背景
floor_segment角番ε²分析で蒲田7/3F/all_daily/type Aが最高ε²(0.002977)だったため、
near(角番1)/mid/far(角番max)のcat3集計を行ったところ、residual_diffで
near=-195.6, mid=+33.5, far=-182.6というU字パターン（ε²_3cat=0.00359, p=5.0e-45）
が全14セクションで一貫して観測された。

しかしnear/farは各セクションでn_machines=1（台1台のみ）であり、機種変遷
（LAG/SUM segment分析）を確認したところ：
- 28台中22台（79%）が約338日間、一度も機種が変わっていない
- 28台中23台（82%）がdominant_segment_share>=0.8（実質機種固定）

つまりnear/farの平均値は「その位置に台を置いた効果」ではなく、
「14セクションの通路側・最奥に偶然固定配置された28台の特定機種・個体の
パフォーマンス平均」そのものであり、位置効果と個体効果が分離不能。
みとやの台570（corner5バウンス）・マイジャグラーV intra-machine効果と
同型の交絡パターン。

residual_games/games_normalizedでも同方向(near=-195.59, mid=+33.51,
far=-182.60, ε²=0.000853/0.000779)だったが、ε²はresidual_diffよりさらに
小さく、追加の記述的事実にとどまる。

## アクション
- セクション粒度のkakuban cat3分析で near/far の n_machines が1（または
  少数固定）の場合、観測されたnear/far差は「位置効果」ではなく「個体・
  機種の交絡」である可能性を最優先で疑うこと
- 機種変遷（LAG/SUM segment）を必ず確認し、dominant_segment_share>=0.8
  かつsegment_count=1の台が多数を占める場合、その位置カテゴリは
  「ほぼ固定個体のサンプル」と解釈し、位置効果の主張を行わない
- ε²がみとやmain_jugの基準値(0.0067)の半分以下(蒲田7 3F type A: 0.0036)
  かつ上記の交絡が確認された場合、その粒度でのkakuban分析は「効果なし」
  として打ち切り、より頑健な他フロア/セグメントの探索に戻る
- みとや式「セクション×日の集団regression」への粒度転換は、まず
  ε²が頑健（≳0.005）かつ個体交絡が排除できているセクション/セグメントが
  見つかってから着手する。交絡が解消されていない状態での粒度転換は
  「信号 vs 機種構成効果」を区別できず空振りリスクが高い

## 例
```
kamata7_3F_typeA_near_far_machine_transitions.csv の
segment_count_values = {1: 22, 2: 4, 4: 1, 5: 1}（n=28）
→ 22/28(79%)が全期間同一機種 → near/far平均は位置効果ではなく個体効果
```

