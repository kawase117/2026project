# Codex実装プロンプトはコード実装(line番号・関数定義)を読んでから書き、ユーザーの2段階指摘に備える

## 背景
蒲田7 3F type A cat3分析のCodexプロンプトを2回作成し、いずれもユーザーから
詳細な技術的指摘（1回目: load_hall_daily_frame()の戻り値契約・出力粒度の
混在・縮退ケース未定義、2回目: residual_gamesの「稼働率」誤解釈・検証2SQLが
時系列変遷を見ていない・分析期間未固定）を受けて全面的に書き直した。
両回とも、実際のソースコード（compute_machine_metric_residuals,
load_hall_daily_frame, _compute_kakuban_group_effect,
summarize_section_kakuban_cat3 等）を読み直すことで初めて正確な記述が
可能になった。

## アクション
- Codex向け実装プロンプトを書く前に、関連する既存関数の実装（特に
  戻り値の契約・列の意味・期間のデフォルト挙動）をRead toolで確認し、
  推測や記憶ベースの記述を避ける
- 「residual_*」のような派生列は必ず計算式（line番号付き）を確認し、
  「稼働率」「絶対値」等の意味づけをコードと照合してから記述する
- 時系列・期間に関する処理（変遷・change point等）は、全期間集約SQLで
  代用せず、LAG/SUM等のwindow関数で実際に時系列変化を捉える設計にする
- 分析対象期間は既存出力（例: all_daily）と動的に一致させ、ハードコード
  しない（daily frameのdate min/maxから<PERIOD_START>/<PERIOD_END>を導出）
- 出力ファイルの粒度（section別 vs floor_segment全体）が混在しないよう、
  別ファイルに分離する

## 例
```
1回目の指摘: 「load_hall_daily_frame()の契約が曖昧」
→ 実装を読んでA/N両方・excluded_from_corr未フィルタで返ることを確認し、
  プロンプトに明示的な2段フィルタ＋n_rows=56266検証を追加

2回目の指摘: 「residual_gamesを稼働率と解釈しているのが不正確」
→ compute_machine_metric_residuals()のline201-211を確認し、
  「同機種平均比の回転数偏差」という正確な表現に修正
```
