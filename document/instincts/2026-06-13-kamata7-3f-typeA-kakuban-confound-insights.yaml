# residual_gamesとgames_normalizedのcat3集計値が小数点まで完全一致（要点検）

## 背景
kamata7_3F_typeA_kakuban_cat3_global_games.csv で、value_col="residual_games"
と value_col="games_normalized" の near/mid/far平均値が
(-195.590002, 33.510066, -182.598758) と全く同一だった。
residual_games = games_normalized - machine_name平均（line 201-211）なので、
機種名平均が常にゼロでない限り両者が完全一致するのは構造的にあり得ない。

## アクション
- 同様の出力で residual_* と元の絶対値列が完全一致している場合、
  集計コードが同じ列を参照している（value_col引数が実際には
  反映されていない）バグを疑い、実装を確認する
- 本件では効果量(ε²)がいずれにせよ小さく結論に影響しないため、
  最終結論には影響なしとして処理したが、追加検証を行う場合は
  最初にこの点を修正・再生成すること

## 例
```
global_games.csv:
  residual_games:    near=-195.590002 mid=33.510066 far=-182.598758
  games_normalized:  near=-195.590002 mid=33.510066 far=-182.598758  # 同値→バグ疑い
```

