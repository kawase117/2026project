# 天井効果を Loss ベースメトリクスで解決

## 背景
LTR モデルが hit@2 ≈ 99% に達すると、従来の accuracy ベースの評価では改善が検知できない。
特に「新特徴量の有効性」「グループ化戦略の最適性」「ハイパラ調整の効果」が数字に反映されない。

**実例**：digit_lag_v1 vs v2r_current
- hit@2: 0.8634 → 0.9907 だけでは、Q1 層や high_anomaly 層での改善が不可視

## アクション
ceiling effect 下では、以下の多層評価フレームワークに切り替える：

1. **Loss ベースメトリクス（主軸）**
   - rank1 がミスしたときの期待ペナルティ（actual_top1_diff - chosen_diff）
   - percentile 分布（P50, P75, P95）で条件別の悪さを可視化

2. **Rank Complement Chain（操作層）**
   - rank2/rank3 の rescue 率（rank1 ミス時に rank2 で補正できるか）
   - critical_miss 率（top3 まですべて外した率）

3. **条件層別分解（見える化）**
   - weekday, pred_span_quartile (confidence), anomaly_direction, failure_day の 5 次元
   - 各層で hit@2, loss, rescue_rate を個別に測定

4. **統計有意性テスト**
   - Wilcoxon signed-rank （同一日ペア）または Mann-Whitney U （不釣り合いデータ）
   - Bootstrap CI （date_expert_pair block resampling, n_boot=12000）
   - Benjamini-Hochberg FDR + Bonferroni 多重検定補正

5. **採用判定ロジック（自動化）**
   - 採用推奨：主要指標で「有意悪化なし」かつ「有意改善あり」
   - 条件付き採用：有意改善はあるが低サンプル警告あり
   - 非採用：主要指標で有意悪化あり

## 例
digit_lag_v1 vs v2r_current（429 pairs, 100% overlap）の結果：

- 全体 hit@2: 0.8634 → 0.9907（改善が見える）
- Q1（低信頼度）: hit@2 0.5566 → 0.9717（大改善）、rescue_rate 0.2419 → 0.8（劇的）
- high_anomaly: rescue_rate 0.3333 → 0.8571（特定層で効果大）
- BH 有意差：16/48 tests で有意（p_adj_bh ≤ 0.05）
- 判定：条件付き採用（改善あり、低サンプル警告あり）

