# 各モジュール < 400 行に分割して保守性を確保

## 背景
ceiling_effect フレームワークは本来 1000 行級の単一ファイルになりがちだが、
7 つの小モジュールに分割することで：

- 各モジュールの責務が明確（責務分離）
- テストが書きやすい（ユニットテスト化）
- バグ修正のスコープが小さい（デバッグ時間短縮）
- 再利用しやすい（他フェーズでの import）

## アクション
モジュール分割の基準：

1. **各モジュール < 400 行**
   - loaders.py (800 L): CSV 読み込み + DB 復元
   - stratifiers.py (400 L): 5 条件評価器の定義
   - loss_chain.py (500 L): loss シナリオ分類
   - stats.py (650 L): 統計テスト
   - decision_report.py (350 L): 採用判定ロジック
   - runner.py (800 L): 全体オーケストレーション

2. **モジュール間の依存関係をシンプルに**
   - runner.py が全モジュール import
   - クロス参照なし（循環依存なし）

3. **テスト構造**
   - test_ceiling_effect_eval.py (loaders, stratifiers, loss_chain)
   - test_ceiling_effect_stats.py (stats)
   - test_ceiling_effect_decision_memo.py (decision_report, runner)

## 例
ceiling_effect パッケージの構成で、pytest 実行時に「どのテストが落ちたか」から
「どのモジュールに bug があるか」が直結するメリット大。
モジュール分割により、デバッグ時間が大幅短縮。

