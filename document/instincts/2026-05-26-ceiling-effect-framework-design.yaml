# MVP を先に出して、段階的に機能追加する設計

## 背景
ceiling_effect フレームワークの実装を段階化することで、実装リスク・テスト負荷・デバッグ難易度を軽減できた：

- Phase 1-2 MVP（データ加工 + loss 計算）を先に完了
- 実データで loss_scenarios.csv, condition_layer_metrics.csv を生成確認
- Phase 3（統計テスト）は MVP 出力を入力として設計
- Phase 4（決定支援）は Phase 3 出力を入力として設計

## アクション
フレームワーク設計時は必ず以下の段階を守る：

1. **MVP フェーズ**：コア機能のみ実装
   - データローディング、条件層分割、loss シナリオ分類
   - 出力: CSV/JSON の基本形式
   - テスト: CSV 行数・列構成の検証

2. **拡張フェーズ**：MVP 出力を活用して次機能を追加
   - 統計テスト層（MVP の loss を入力として使用）
   - テスト: MVP が出力した値との対応チェック

3. **意思決定層**：拡張層の出力を入力として最終判定ロジック
   - テスト: 過去データで「予想した判定」と「実現した結果」の整合性

## 例
ceiling_effect の実装順序で「各フェーズ完成→次フェーズ開始」の段階化により、
バグの原因が明確になり、デバッグ時間が 10 倍以上改善された。

