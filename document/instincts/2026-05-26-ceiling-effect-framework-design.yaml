# ブートストラップは block resampling（date × expert 単位）が必須

## 背景
同一日内の複数台や複数 expert はクラスタ構造がある場合、
単純な iid resampling では CI が楽観化する。

理由：同一日内の台は条件を共有（相関あり）、同一 expert は skill が一定（時系列相関あり）

## アクション
bootstrap 実装時は必ず以下を守る：

1. **Block 単位の決定**
   - 最小単位: date × expert （その日その expert の全台）
   - より保守的: date のみ （その日の全 expert×台）

2. **Resampling 実装**
   - block_idx = np.arange(len(paired_df))
   - for i in range(n_boot): s = rng.choice(block_idx, size=len(block_idx), replace=True)
   - deltas[i] = np.mean(cur[s] - base[s])

3. **CI 幅の検証**
   - Block CI が iid CI より広いか確認

## 例
digit_lag_v1 vs v2r_current（429 pairs）：
- iid: CI_low=-0.0023, CI_high=+0.0189（狭い）
- block: CI_low=-0.0045, CI_high=+0.0212（広い） ✓

