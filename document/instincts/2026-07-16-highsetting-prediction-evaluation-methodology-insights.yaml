# ラベル的中率(lift)は差枚エッジと同義ではない、特にAT機種では乖離しうる

## 背景
「precision@10% lift=1.81x」のような数値を「差枚がランダムの1.81倍」と誤解されやすい。実際は「その日実際に出たBB/RB回数から推定した『高設定っぽい』ラベルに、前日までの情報だけでどれだけ近づけたか」という的中率の比に過ぎない。楽園蒲田ATトラック(スマスロ北斗の拳)で実測したところ、lift=7.45xという高い的中率でも同期間のdiff_edge(候補台平均差枚-プール平均差枚)は-533枚とマイナスだった。原因を機種内で分解すると、15候補中12件はラベル自体が外れており(precision実質20%)、外れた台に-2952,-2381×2などの大きなマイナスが混在して平均を押し下げていた。さらに的中した3件のうち1件も同日プール平均を大幅に下回った(191 vs 1396)。AT機は1回の当選の払い出し量自体が大きくブレるため、「RB回数が設定5-6相当だった」というラベル的中と実際の差枚は別物になりうる。対照的にジャグラー・ハナハナ(純ボーナス機、AT演出なし)では蒲田7ジャグlift=2.85x/diff_edge=+232枚、蒲田7ハナハナは候補の勝率60.6%(プール47.4%)・平均差枚+1006枚(プール+287枚)と、ラベル的中と差枚がほぼ同方向に動いた。

## アクション
設定推定パイプラインの成果を報告する際は、precision@N%やliftのような「ラベル的中率」指標と、実際のdiff_coins_normalized(差枚)ベースの指標を必ず分離して両方提示する。特にAT/ART系の機種(1回の当選による払い出し変動が大きい機種)では、ラベルlift単体を実戦価値の指標として使わない。答え合わせログには両方(precision/base/liftとpicks_diff_mean/pool_diff_mean/diff_edge)を必ず記録し、機種混合プールで異常な値(liftとdiff_edgeが逆方向)が出たら個別機種・個別日に分解して原因を特定する。

## 例
run_highsetting_answercheck.py の LOG_COLS に precision/day_base/lift と picks_diff_mean/pool_diff_mean/diff_edge を両方含める設計。楽園AT: lift=7.45x, diff_edge=-533。この乖離を報告せず lift だけ見せると「実戦で1.8倍儲かる」という誤解を招く。

