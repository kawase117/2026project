# 誤ラベル・低情報量の機種をプールに混ぜるとbase希釈でliftが見かけ上膨らむ

## 背景
楽園蒲田のAT(モンキーターンV+北斗)を素朴にプールしたところlift=2.27xと良好に見えたが、後にモンキーターンVのRB列が楽園では別のセマンティクス(カウンター差)で常にis_high=Falseに近いラベルになっていたと判明。北斗単独で計測し直すとlift=1.36x(ベースレート4.9%→9.2%)だった。メカニズム: 無情報な負ラベル台を混ぜるとプールの分母(day_base)が薄まる一方、モデルはその台をほとんど選ばないため分子(precision)はほぼ影響を受けず、liftが見かけ上膨張する。同じ現象が戦国乙女4(複数ホールでBB列がたまたま設定6付近の値に一致し誤採用)でも再現した。

## アクション
複数の機種・母集団をプールしてlift等の比率指標を報告する前に、必ず機種別・母集団別に指標を分解して個別確認する。プール値と個別値が大きく乖離する場合(特にプール値の方が良く見える場合)、無情報・誤ラベルの母集団が混入していないか疑う。母集団を追加するたびに、追加前後でのbase rateの変化を確認し、説明できない変化があれば追加した母集団のラベル妥当性を再検証する。

## 例
楽園AT: プール(モンキーV+北斗)lift=2.27x → 北斗単独lift=1.36xに補正。エウレカ混入時も同様にプール数値が個別機種と乖離した。

