# 単一の強い要因が支配的な環境ではシンプルなモデルが学習モデルに勝つ

## 背景
高設定台の翌日位置予測で、蒲田7ジャグは「台効果(過去の高設定率)×据置倍率」という単純な経験ベイズ(v1, lift=1.81x)がLightGBM(v2, lift=1.34x)に一貫して勝ち続けた。v1スコアを特徴量として与えるスタッキング(1.38x)やv1/v2のランク平均ブレンド(1.68x)を試してもv1単体を上回れなかった。一方、楽園蒲田ジャグはv1が機能せず(0.94x、事実上シグナルなし)、LightGBM(v2, lift=1.26x)の方が優位だった。楽園は「特定の台に高設定が入りやすい」という単一の強い台効果が薄く、DD・曜日・末尾・位置などの交互作用でしか予測できない構造だったためと考えられる。逆に蒲田7は台効果が非常に強い(信頼性の高い単一シグナル)ため、学習モデルが多数の弱い特徴量でそのシグナルを希釈してしまう。

## アクション
day-aheadランキング系の予測タスクで、まず「単一の強い要因(例: 台の履歴)だけでどれだけ予測できるか」の単純なベースライン(v1的な経験ベイズ・移動平均)を必ず作り、学習モデルと同一の評価プロトコルで比較する。学習モデルが単純ベースラインに負ける場合、それは学習モデルの実装ミスではなく「その環境は単一要因が支配的で、多特徴量学習はノイズを持ち込むだけ」という構造的な結果である可能性が高い。ホール・トラックごとに勝者モデルが異なることを前提とし、統一モデルを強制しない。

## 例
run_highsetting_daily.py の CHAMPIONS辞書: 蒲田7ジャグ=v1(1.81x)、楽園ジャグ=v2(1.26x)、蒲田1ジャグ=v1+v4ブレンド(1.57x)など、ホール×トラックごとに異なる勝者モデルを個別採用。
