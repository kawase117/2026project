# BB/RB列の意味はホール×機種ごとに異なるため、レンジ+スプレッド+中央値の3点検証が必須

## 背景
同じ機種でもホールが導入しているデータカウンターによって「RB」列に何を集計するかが変わる(ユーザー指摘)。実例: 甲鉄城のカバネリのRB列は蒲田7/蒲田1/みとやでは「ボーナス初当り」レンジに適合したが、楽園だけ「ST初当り」レンジに適合した。楽園のモンキーターンVはBB・RB列ともどのスペック表のレンジにも入らず(RB観測1/466 vs スペックレンジ1/300〜1/223)、ユーザー解説によれば「当たり中もG数をカウントするカウンターのため通常時確率が復元不能」と判明し計算不可能と結論した。さらに、レンジ内に収まっていても罠がある: エウレカTYPE-ARTの「BB=ボーナス合算」表は観測1/190がレンジ1/196〜1/183に収まる(PASS)が、設定間の差がわずか6.9%しかなく判別力が実質ゼロ(誤採用するとlift=1.03xのゴミラベルになる)。戦国乙女4のBB列は複数ホールで観測1/215がレンジ上限1/217(設定6相当)にたまたま近接していただけで誤採用されていた。

## アクション
BB/RB等のカウント列から設定推定ラベルを作る際は、単純な「観測レートがスペックのレンジ内か」だけでなく3点を検証する: (1) レンジ内か(観測が公表確率の最小〜最大×若干のマージンに収まるか)、(2) スプレッド十分か(設定間の確率比が最低1.10倍程度ないと判別力不足で誤ラベル源になる)、(3) 中央値より濃すぎないか(ホール平均観測レートが中央設定(設定3-4相当)の確率を超えて「常に高設定寄り」に見える場合、別のセマンティクスの偶然一致を疑う)。この3点はホール×機種×列の組み合わせごとに独立に検証すること。

## 例
eda/at_semantics_validator.py の tech_range_ok()/choose_mapping()。RANGE_LO_MARGIN=0.88, RANGE_HI_MARGIN=1.06, MIN_SPREAD=1.10, かつ観測上限=中央設定確率、の3制約を組み合わせて自動検出。これにより楽園エウレカのBB=CM誤採用と戦国乙女4のBB列誤採用を自動排除できた。

