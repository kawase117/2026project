# クロス特徴量は実装前に必ずランダム基準との比較から探索する

## 背景
「複数グループが同じ末尾を予測 → 信頼度UP」という直感は自然だが、
「ランダムでも起きる頻度」と比較しないとノイズ特徴量を実装するリスクがある。

本セッションでは探索先行により、実装前に「ランダム水準と区別不能」と判明し、
実装コストをゼロに抑えた。アンチパターン確認も同時に完了。
データ探索 → 判断 → スキップ、というフローが機能した事例。

## アクション
クロス特徴量候補に対して以下の順序で確認してから実装を決定する：

1. ランダム期待値の計算（n_top/n_total の二項確率で期待値算出）
2. 実測合意率 vs ランダム期待値を比較（差異が1pp以上あるか）
3. Lag-1合意 → 翌日パフォーマンスのSpearman r計算
4. 判断基準: |r| >= 0.05 かつ p < 0.10 を満たさなければスキップ

## 例
```
クロス特徴量の実装判断フロー:
Step1: 合意率計算 → ランダム期待値と比較
   差異 < 1pp → 実装スキップ（蒲田7クロスエキスパートのケース）
   差異 ≥ 1pp → Step2へ

Step2: Lag-1 Spearman r計算
   |r| < 0.05 → 実装スキップ
   |r| ≥ 0.05 → Step3へ

Step3: 方向とeffect size確認
   phi < 0.10 → アンチパターンも実装スキップ
   phi ≥ 0.10 → 実装検討
```
