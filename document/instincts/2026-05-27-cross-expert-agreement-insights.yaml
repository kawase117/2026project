# クロスエキスパート合意はランダム水準を超えない（蒲田7）

## 背景
4エキスパート（2F_A/2F_N/3F_A/3F_N）が翌日の末尾top2を予測するとき、
「複数グループが同じ末尾を予測していれば信頼度が高い」という直感がある。
しかし蒲田7の147日間の実測データを検証したところ、
この直感は統計的に支持されなかった。

4グループがそれぞれ10末尾から2つを独立にランダム選択した場合の
「ある末尾が2+グループに選ばれる確率」= 18.1%。
実測値 = 18.2%。誤差0.1ppであり、ランダム基準と区別不能。

## アクション
- クロスエキスパート合意カウント（agree_count）をlag-1特徴量として実装しない
- 「複数グループ合意 = 高信頼」という解釈を予測に使用しない
- エキスパートごとのwithin-expert予測はそれぞれ独立した情報として扱う
- 特徴量候補が「グループ間の相関」に依存する場合は、
  まず合意率のランダム期待値と比較してから実装判断する

## 例
```python
# ランダム期待値の計算（各グループがtop2を選ぶ = 2/10）
p_pick = 2/10
p2plus_random = 1 - (1-p_pick)**4 - C(4,1)*p_pick*(1-p_pick)**3
# = 18.1%

# 実測: agree_count>=2 の割合 = 18.2%
# → 実測 ≒ ランダム（差異0.1pp, 特徴量価値なし）
```

