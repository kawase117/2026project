# クロスエキスパート合意は微弱な負の自己相関を示すが実装不要

## 背景
Chi2検定: 昨日高合意(≥2) → 今日の合意が下がる傾向が p=0.025 で有意。
Spearman r(lag1 agree → today agree) = -0.036（負）。

ただし effect size が小さく（phi ≈ 0.06）、
翌日パフォーマンスへの直接的な影響もなし（性能シグナルがない）。

フロア別の傾向：
- 2F_N ∩ 3F_N: 46.9%（ランダム37.8%より+9.1pp、最大）
- 2F_A ∩ 2F_N: 32.7%（ランダム以下）→ BT機フロアと通常AT機は末尾戦略非共有

## アクション
- p値が有意でもeffect size(phi<0.10)なら実装スキップ
- 「高合意翌日に回避」アンチパターン特徴量も不採用
- 2F_AはBT/A-RT機のため他フロアと独立した末尾投入戦略と解釈

## 例
```python
# Chi2クロス集計
# lag1_high  today_high=0  today_high=1
#   False         964          231
#   True          230           35
# Chi2=5.054, p=0.025  → 有意だが phi=sqrt(5.054/1460)=0.059
# → effect size小さく実装不要と判断
```

