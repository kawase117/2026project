# Lag-1クロスエキスパート合意 → 翌日パフォーマンスにシグナルなし

## 背景
「昨日2+グループが合意した末尾は今日も高パフォーマンス（streak）」という仮説を検証。
147日間のtestperiodデータで計測した結果：

- Lag-1 agree → 翌日avg_diff/機 Spearman r = -0.019（実質ゼロ）
- Mann-Whitney p = 0.33（有意差なし）
- agree_lag1=2: 1107円/台、agree_lag1=3: 969円/台（高合意でむしろやや低下）

同日合意はhit@2が全レベル99%超で天井効果があり差別化不能。
かつ同日他エキスパートの予測を使うのはデータ漏洩。

## アクション
- `cross_agree_lag1` 系の特徴量は実装をスキップ
- 同日合意（agree_count当日値）も使用不可（漏洩）
- 合意streak/anti-streakいずれも実装根拠なし

## 例
```python
# 検証結果サマリ
# agree_lag1=0: mean=1069円/台 (n=208)
# agree_lag1=1: mean=1083円/台 (n=208)
# agree_lag1=2: mean=1107円/台 (n=68)
# agree_lag1=3: mean= 969円/台 (n=16)
# Spearman r(lag1 → avg_diff) = -0.019
# → 特徴量採用閾値(|r|>=0.05)未満、実装スキップ
```

