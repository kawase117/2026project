# 蒲田七（および蒲田一と共有）の曜日別設定投入パターン — グラウンドトゥルース

## 背景
ユーザーが蒲田一と共有している法則。蒲田七の曜日別設定投入方針。

| 曜日 | イベント内容     | 投入パターン                         |
|------|----------------|----------------------------------|
| 日曜 | 機種1以上       | 各機種に最低1台は高設定               |
| 土曜 | 三台並び        | 末尾連番で3台が高設定                 |
| 金曜 | 列一台以上      | 各列に1台は高設定                    |
| 木曜 | ニブイチ        | 複数機種の半分が高設定（以前はランダム）  |
| 水曜 | 台番号末尾基準   | 末尾の数字で判定                     |
| 火曜 | 角◯            | 角からX番目の台に設定                 |
| 月曜 | 一列まるごと    | 特定の列全体が高設定                  |

最近の傾向: ハーフにして2本（各パターンを半量×2箇所）に移行しつつある。

## 各パターンとデータ観測の対応

- 水曜（末尾基準）: concentration_ratio=1.200、streak≥5=0%、8-9-0クラスタが安定 → 末尾数字での投入が最もクリーンに検出される
- 土曜（三台並び）: best_cluster=6-7-8、concentration_ratio=1.214 → 3末尾連番クラスタとして検出
- 火曜（角◯）: best_cluster=6-7-8、concentration_ratio=1.229 → 角番台の末尾が6-7-8に集中
- 木曜（ニブイチ）: A型・AT系=0-1-2、BT=8-9-0、streak≥5=10.9% → 機種タイプ別に分割
- 月曜（一列まるごと）: concentration_ratio=1.039（最弱）、streak≥5=8.7% → 列全体投入のため末尾クラスタとして現れにくい
- 金曜（列一台以上）: concentration_ratio=1.196 → 各列1台のため末尾集中度は中程度
- 日曜（機種1以上）: A型・AT系=6-7-8、BT=0-1-2 → 機種タイプ別に分離

## アクション
この表をML特徴量設計の起点として使う。
曜日ごとに「投入ロジック」が異なるため、同じ末尾クラスタ特徴量でも曜日によって解釈が異なる。

ハーフ×2移行の含意:
- 1つの強いクラスタよりも「2つの弱いクラスタ」を検出する必要が増している
- top2がクラスタ外に出やすい（6/7曜日でtop2がbest_cluster外）のはこの移行を反映している可能性
- walk-forwardで時系列方向に「ハーフ×2化」の影響が出ていないか要確認

## 例
水曜（末尾基準）: 末尾8・9・0を選んで投入 → 8-9-0クラスタが安定出現
土曜（三台並び）: 台番号連番の末尾6・7・8（例: 16・17・18番）を並べて投入 → 6-7-8クラスタ
月曜（一列まるごと）: 1列が例えば11〜20番なら末尾1〜0が全て上昇 → 末尾クラスタに現れにくい
