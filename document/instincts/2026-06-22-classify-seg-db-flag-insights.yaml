# Walk-forward scoringはルールベースであってMLではない

## 背景
v1-v6のWalk-forward scoringモデルは手動設計のコンポーネント（c1-c6, hist特徴量）を
手動設定のウェイトで線形結合するルールベースのスコアリングシステム。
学習アルゴリズム・損失関数・パラメータ最適化プロセスが存在しない。
Walk-forwardは評価フレームワークであり、学習手法ではない。

位置づけは「MLに投入する前の特徴量探索・有効性検証フェーズ」。
有効と判明した特徴量をCatBoost等のMLモデルに渡すための前段階。

## アクション
- このモデルの結果を「ML予測」と呼ばない
- 「ルールベーススコアリング」または「特徴量有効性検証」と正確に位置づける
- 真のMLパイプライン（Phase 4 CatBoost）との違いを明確にする
- v6bのセグメント別ウェイトも「手動チューニング」であり「学習」ではない

## 例
```
| 要素       | Walk-forward scoring | 真のML (Phase 4) |
|-----------|---------------------|-----------------|
| 特徴量     | 手動設計              | 手動設計も可      |
| 重み       | 手動設定              | データから学習     |
| 閾値       | 手動選択              | 交差検証で最適化   |
| 学習アルゴリズム | なし             | GBM, LogReg等    |
| 損失関数    | なし                 | logloss, AUC等   |
```

