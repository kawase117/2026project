# 機種名は現在A/N分類のみに使用、直接的な特徴量としては未使用

## 背景
機種名は差枚・機械割に大きな影響がある（理論機械割が機種ごとに異なる）が、
現在のスコアリングモデルでは classify_seg による A/N 2値分類にしか使われていない。
個別機種名、機種カテゴリ（6号機AT/6.5号機AT等）、技術介入可否は未使用。

ルールベースで機種名を直接使うのは困難（数十〜百種類、サンプル数不足）。
CatBoost等のツリー系MLモデルならカテゴリカル特徴量として自然に扱える。

## アクション
- ルールベースでは A/N/技術介入 の3分類程度が現実的な上限
- 本格的な機種別分析はMLパイプライン（Phase 4）で実施
- 技術介入機（完全攻略で設定1でも機械割100%超）の分離は別途検討課題
- DB改修時に machine_category 列を追加すれば、分類の基盤が整う

## 例
```
現在使用:
  machine_name -> classify_seg() -> "A" or "N" -> セグメント名の一部

未使用だが価値あり:
  個別機種名（アイムジャグラー vs マイジャグラー） -> 理論機械割が異なる
  機種カテゴリ（Aタイプ / 技術介入 / AT機） -> 出玉性能の天井が違う
  技術介入可否 -> 設定1でも100%超が可能
```
