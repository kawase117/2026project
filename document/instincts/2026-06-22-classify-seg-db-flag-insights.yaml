# classify_seg 変更時は実DB機種名でのスモークテストを必須化する

## 背景
v6実装でCodexが classify_seg を修正した後、全件N判定になるバグに気づくまで
テスト→デバッグ→DB実データ確認と複数ステップを浪費した。
原因は2つ: (1) family_dfの反映漏れ (2) テストデータが実在機種名を使っていなかった。

## アクション
- プロンプトに以下のスモークテストを必須として埋め込む
- A件数が0なら classify_seg のキーワードが壊れていると判断
- テストデータも実在の機種名（DBから取得）を使用すること

## 例
```python
# 必須スモークテスト（プロンプトに埋め込む）
from ml.experiments.walkforward_scoring.scoring_model import classify_seg
import sqlite3, pandas as pd
with sqlite3.connect('db/マルハンメガシティ2000-蒲田7.db') as conn:
    names = pd.read_sql('SELECT DISTINCT machine_name FROM machine_detailed_results', conn)
counts = names['machine_name'].map(classify_seg).value_counts()
print(counts)
assert counts.get('A', 0) > 0, "classify_seg が全件Nを返している"
```

