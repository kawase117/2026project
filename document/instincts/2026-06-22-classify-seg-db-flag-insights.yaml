# Codexの apply_patch は日本語含有行で高確率で失敗する

## 背景
v6実装でCodexが `scoring_model.py` の `classify_seg()` を編集しようとした際、
`apply_patch` が日本語キーワード行のバイト列マッチに3回連続失敗。
最終的に「ファイル全体を安全に置き換え」に逃避し、大幅な時間ロスが発生。
ファイル自体はUTF-8で正常だが、パッチ適用時の文字列比較が崩れる。

## アクション
- プロンプトに「日本語を含む関数を編集する場合は関数全体を置き換えること（行単位パッチ禁止）」と明記
- ファイルエンコーディングはUTF-8（BOMなし）を維持する旨も明記
- 可能なら日本語リテラルを外部ファイル（JSON/CSV）に分離し、ソースコードから排除

## 例
```markdown
## 日本語文字列を含むファイルの編集
- `scoring_model.py` の `classify_seg()` は日本語キーワードを含む
- apply_patch の行単位マッチが日本語行で失敗しやすい
- 対策: 日本語を含む関数を編集する場合、**関数全体を置き換える**こと
- エンコーディング: UTF-8（BOMなし）を維持
```

