# A/N分類は機種名文字列マッチではなくDBフラグにすべき

## 背景
`scoring_model.py` の `classify_seg()` は機種名の部分一致（ジャグラー、ハナハナ等）でA/N分類を行っている。
v6実装時にCodexが `apply_patch` で日本語キーワード行のマッチに3回失敗し、全体置換に逃避。
さらに修正後も全件N判定になるバグが発生（family_dfの反映漏れ）。
根本原因は、ランタイムで毎回文字列マッチする設計にある。

問題点:
- 新機種追加のたびにキーワードリスト更新が必要
- エンコード問題に脆弱（Codexの apply_patch が日本語行で失敗）
- ホール間の機種名表記揺れリスク
- ニューパル脱落のような見落としが起きやすい

## アクション
- DB改修タイミングで `machine_detailed_results` に `machine_category` 列（A/N）を追加
- スクレイピング時 or DB投入時（`database/json_processor.py`）で一度だけ分類
- スコアリングモデル側は `classify_seg` を廃止してDBフラグを参照するだけにする
- 改修までは現行の文字列マッチを維持するが、キーワードリストの網羅性を定期確認

## 例
```python
# 現状（脆弱）
def classify_seg(machine_name):
    keywords = ("ジャグラー", "ハナハナ", "ファンキー", ...)  # 漏れリスク
    return "A" if any(k in str(machine_name) for k in keywords) else "N"

# あるべき姿（DB改修後）
# json_processor.py で投入時に分類:
#   row["machine_category"] = classify_once(row["machine_name"])
# scoring_model.py では:
#   family = row["machine_category"]  # DBから直接取得
```

