# FORECAST_EXCLUDED_COLUMNS が同日リークの主防衛線

## 背景
`utils.py` の `FORECAST_EXCLUDED_COLUMNS` は同日の目的変数と直接相関するカラムを列挙している。
`get_numeric_features()` はこのセットと `META_COLUMNS` と `is_top_2` を除外してから
数値カラムを特徴量リストとして返す。
`run_mode_bucketed` 内に `features = [f for f in features if f not in {"is_top_2"}]` という
二重防衛も存在する。

## アクション
新しいカラムを追加するとき、そのカラムが「同日の差枚・勝率・効率」に由来する場合は
必ず `FORECAST_EXCLUDED_COLUMNS` に追加すること。コメントに除外理由を記載すること。
lag/roll 派生カラム（`lag1_total_diff_coins` 等）は除外不要（shift 済みで安全）。

## 例
```python
FORECAST_EXCLUDED_COLUMNS = frozenset({
    "total_diff_coins",         # 目的変数 is_top_2 の直接の元データ
    "total_diff_coins_focus",   # Same-day weighted payoff. Leakage if left in features.
    "win_rate",                 # 同日勝率
    "efficiency",               # 同日効率
    "efficiency_focus",         # Same-day weighted efficiency derived from same-day payout.
})
```

