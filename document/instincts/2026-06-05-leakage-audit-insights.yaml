# bootstrap_ci は unique_date ベースで実施しないと CI が過信頼になる

## 背景
walk-forward は複数 seed で実行されるため、同一日付が複数 seed 分（例：8 seed）だけ
行として複製される。`bootstrap_ci(arr)` がこの複製された配列をそのまま resample すると、
実効的なサンプルサイズが「ユニーク日数 × seed 数」になり、CI が過度に狭くなる。
strong_zorome の実例：n_unique_dates=2, seeds=8 → n_rows=16。
ci_low=+37.89 は n=2 のデータとしては過信頼。

## アクション
small-bucket の CI を解釈するとき、JSON の `n_days` ではなく
`strong_zorome_observed_dates_holdout`（ユニーク日数）を参照すること。
n_unique_dates が 5 未満の場合、CI の符号より「訓練履歴での一貫性」で採用判断する。
統計的に厳密な CI が必要な場合は日付単位で平均化してから bootstrap する。

## 例
```python
# seed 複製を除去：日付単位で平均してから bootstrap
per_date = bucket_df.groupby("date")["excess"].mean().reset_index()
values = per_date["excess"].to_numpy()
ci = _bootstrap_mean_ci(values, n_boot=4000, seed=42)
# n=2 の場合 CI は事実上意味をなさないため、
# 「14日の訓練履歴で一貫して positive だったか」で採用判断する
```
