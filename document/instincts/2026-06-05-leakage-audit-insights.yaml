# full_2025 は 2025-12-31 終端で holdout と完全分離

## 背景
`build_train_window("full_2025", test_start)` は
`(REGIME_1_START="2025-07-07", REGIME_2_END="2025-12-31")` を返す。
holdout 期間は `REGIME_3_START="2026-01-01"` 以降。
train end と holdout start が 1 日差で分離されており、どのテストブロックでも重複しない。
`recent_60d` は `(test_start - 60d, test_start - 1d)` なので現ブロックとは常に分離。

## アクション
新しい window_name を `build_train_window()` に追加するとき、
`tr_end < holdout_start（2026-01-01）` が常に成立するか確認すること。
固定終端日を使う window は特に要確認。

## 例
```python
REGIME_2_END = "2025-12-31"    # train end（固定）
REGIME_3_START = "2026-01-01"  # holdout start → 1日差で分離 ✅

# NG 例：固定終端が holdout 期間内に入るケース
if window_name == "recent_plus_jan":
    return pd.Timestamp("2025-07-07"), pd.Timestamp("2026-01-15")  # ← holdout に侵入
```

