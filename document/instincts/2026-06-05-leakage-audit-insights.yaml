# hall_digit_mean_diff（非シフト同日値）を merge から意図的に除外する

## 背景
`aggregate_mode_mitoya()` では `hall_digit_mean_diff`（同日の末尾別ホール平均差枚）を
中間変数として計算し、そのラグ版（lag1〜lag15）のみを `agg` に merge する。
非シフトの `hall_digit_mean_diff` は `is_top_2` と直接相関する同日情報であり、
merge カラムに誤って含めると即リークになる。
コメントなしだと将来の開発者が誤って追加するリスクがある。

## アクション
`hall_digit_daily` から `agg` に merge するとき、必ず lag_cols だけを選択する。
`hall_digit_mean_diff` は明示的に除外し、その意図をコメントで記録すること。

## 例
```python
lag_cols = [f"lag{lag}_hall_digit_diff" for lag in digit_lags]

# Intentionally exclude `hall_digit_mean_diff` (same-day unshifted value) from merge.
# Only lagged versions (lag_cols) are safe to use as features — leakage prevention.
agg = agg.merge(
    hall_digit_daily[["date", "last_digit", *lag_cols]],  # hall_digit_mean_diff は含まない
    on=["date", "last_digit"],
    how="left",
)
```

