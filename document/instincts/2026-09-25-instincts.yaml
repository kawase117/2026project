# 並びブロックの外れ台は、島平均に対する回転数比を見てから「並び崩れ」と判定する

## Core claim
複数台の並びブロックのうち1台だけ差枚がマイナスでも、その台の回転数が島(同機種の設置範囲)平均を
明確に上回っていれば、「並びが崩れていた」と即断せず「高設定だったが分散で負けた」可能性を残す。

## Evidence
- n_observations: 1日(2026-09-24、楽園蒲田)
- data scope: single-hall、3台並び候補3組
- metric scope: games / diff
- result summary: 戦国乙女5島の2104(-3619)・2118(-3666)、化物語島の2238(-2238)は、3台並びの
  「3台目」として差枚だけ見ると外れに見えたが、回転数はそれぞれ島平均の1.25倍・1.49倍・2.09倍
  あった。差枚だけで3台目を並びから除外し「2台並び」と判定するのは早計だった

## Interpretation
- 既存instinct(feedback-narabi-detect-by-games-too)は「両隣が低回転なら並びの中心を支持する」
  という中心台の判定基準だったが、今回は逆に「並びの外れ台自体の回転数」を見る視点が追加された
- 回転数が高いことは「高設定だった証拠」ではなく「その可能性を否定しない」程度の弱い材料である。
  過度な断定(2026-09-25-tail-corner-rb-spec-comparison-confidence-cap と同じ確度管理)は避ける

## Action
- 並びブロックの一部台が差枚マイナスで並び判定から外したくなったら、その台の回転数を同機種の
  当日平均(島平均)と比較する
- 島平均の1.2倍以上なら「差枚は外れたが打ち込まれていた」と記録し、並びブロックの範囲を
  安易に狭めない
- 断定はしない。「否定しない」という弱い形で記録する

