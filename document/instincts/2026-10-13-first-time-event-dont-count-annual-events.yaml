# 「初」は取材・企画の初回。周年など毎年開催のイベントは数えない。「煽りが初」は告知の話

## Core claim
「初取材・初イベント日はホールが力を入れる」（ユーザーの経験則）の観測に数えるのは、そのホールで**その取材・企画が初めて行われる日**だけ。周年、年始、毎年の記念日などの恒例イベントは、年に1回の定例なので「初」ではない。
投稿の文言「周年煽りはおそらく初」は、**告知の煽りが初めて**という意味で、周年そのものが初という意味ではない。

## Evidence
2026-10-13、金時蒲田東口の10/12周年（予告: 「周年煽りはおそらく初。当日はマックスケガレ来店」）の答え合わせで、私が周年を初イベント日とみなして「強い支持」として仮説に加算した。ユーザーに「周年は毎年やっているので初ではない」と指摘された。
金時の10/12は超え4機種（期間平均0.64/日）と大きく強かったが、これは周年+取材の結果であり、「初」の仮説の観測ではない。

## Action
1. 予告の「初」を見たら、何が初なのか（取材・企画の初回か、告知の煽りか、新台導入か）を本文で確かめてから台帳に加算する。
2. 周年・記念日などの恒例イベントは、**前年以前の同じ周年との比較**で見る（毎年この強さが出るか）。初イベント日の仮説とは別枠で記録する。
3. 加算の前に、その日が初かどうかを `document/registry/EVENT_DAYS.jsonl`（同ホールの過去の同名・同種イベント）で確認する。
4. 誤って加算したら、記憶・答え合わせ文書の双方から取り消し、訂正の理由を残す。
