# 絶対差枚と相対差枚は別の問いに答える。混ぜると効果が消える

## Core claim
このプロジェクトは長らく `edge = 差枚 − 同日ホール平均` を主指標にしてきた。これは
**「その日その店で適当に座った場合に対する上乗せ」**であって、**実際に取れる枚数ではない。**

イベント日はホール全体も上がる。相対差枚はその上昇を分母ごと引いてしまうので、
**日を選ぶ効果が構造的に消える。** 2026-09-11 にこれで
「ボーナス確率は上がっているのに出玉に変換されていない」という誤った結論を出した。

| 蒲田7 強ゾロ目 | |
|---|---|
| 相対差枚（ホール平均との差） | **+63枚** |
| **絶対差枚** | **+350枚** |

## Evidence
絶対差枚で見ると、ボーナスの上振れと出玉がきれいに対応する。

| ホール | 上振れ | × 変換係数 | = 予測 | **実測（絶対）** |
|---|---|---|---|---|
| 蒲田7 | +3.63% | 65枚/% | +236枚 | **+302枚** |
| ベルシティ雑色 | +3.99% | 51枚/% | +204枚 | **+214枚** |
| 蒲田1 | +1.79% | 59枚/% | +106枚 | **+137枚** |
| 楽園蒲田 | +0.98% | 55枚/% | +54枚 | **+85枚** |

**ボーナス1%あたりの枚数は3カテゴリでほぼ同じ**（ノーマル 48〜61 / BT 26〜64 /
A+AT 50〜69、相関 0.67〜0.85）。BTのボーナスループやA+ATのAT上乗せがあっても
ボーナス確率と出玉の関係は壊れていない。**「BTは設定が入っても勝ちに繋がらない」は誤り。**

指標を相対から絶対に替えただけで、`condition_drilldown` の「採用」判定は
**26件 → 41件** に増えた。相対で判定していたぶん取り逃がしていた。

相対が有用な場面もある。蒲田7の7のつく日は **絶対 +95 / 相対 -30**。
ノーマルは上がっているがホール全体（AT含む）はもっと上がっている、と読める。
**行く価値はあるが、その日ジャグラーを選ぶのは最善ではない。**

## Interpretation
問いごとに指標が決まる。混ぜない。

| 問い | 指標 |
|---|---|
| **今日この店に行くか** | **絶対差枚** |
| その日その店で、どの機種・台を選ぶか | 相対差枚 |
| 設定が入ったか | ボーナス確率の上振れ%（機種ごとの自己基準から） |
| 全台が上がったのか一部だけか | 高設定率（[[hall-raises-a-subset-not-everything]]） |

- [[feedback-scoring-must-separate-setting-from-pnl]] は「フルデイ差枚は実現損益ではない」
  と言った。本 instinct はその手前の話で、**そもそも何を差枚と呼ぶか**が二通りある

## 限界
- 絶対差枚はホール全体の調子を含む。好調な月の条件日は全部良く見える。
  だから四半期で切って確認する（[[whole-period-aggregates-hide-regime-changes]]）
- 変換係数は機種内の回帰から出したもので、因果ではない。ボーナスが増えれば枚数が増える
  という機構は自明だが、係数の水準は機種構成に依存する

## Action
- **イベント日・条件日の効果は絶対差枚で出す。** 相対だけを見て「効果が小さい」と言わない
- ボーナス上振れと差枚を並べるときは、**両方とも同じ基準に揃っているか確認する**。
  片方が相対でもう片方が絶対だと、引き算した瞬間に意味を失う
- `backtest/condition_drilldown.py` は3つを併記する。判定は絶対差枚で行う
