# backtest 98% vs live 25-50% の乖離はリークで完全に説明できる

## 背景
本プロジェクトの実測値：
- backtest (clean holdout) precision@2: 83-87%
- live評価 (9日間) precision@2: 25-50%

この乖離を「small sample effect」「seasonal shift」で説明しようとしていたが、
実際は total_diff_coins_focus リークが原因：

- backtest: 同日実績列を特徴量として使用
  → モデルは「正解を見てから答える」状態
  → precision@2=83-87%は実績値が既知なら当然の数値

- live評価: 翌日予測時には翌日の実績は未知
  → リークなしの真の性能
  → precision@2=25-50%が真の予測力（ランダム=20%とほぼ同等）

## アクション
リーク修正後のbacktestでの期待値：
全lag特徴量のSpearman rho<0.06なので、真の性能はランダムに近い可能性が高い。
修正後に precision@2 = 20-40% 程度が現実的な期待値。
特徴量追加（dd_value, is_zorome, wed_digit_hist_avg）で改善余地あり。

リーク修正→再評価→特徴量改善のサイクルで進める。
リーク修正前の改善議論は無意味。

