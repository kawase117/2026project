# パラメータ選定のclean holdoutは特徴量リークを修正しない

## 背景
clean holdout監査（2025年内で候補選定→2026年holdout評価）を実施：
- 2025年選定期間（n=109日）の hit@2: 3F_N=1.000, 2F_A=1.000, 2F_N=0.991
- 2026年holdout（n=150日）の hit@2: 全セグメント98-99%

元の99%とほぼ変化なし。

理由：パラメータ選定のclean化は「window/lambdaをテスト期間で最適化した」という
間接リークへの対処。特徴量レベルの直接リーク（同日実績列の混入）は
参照データを変えても修正されない。

両者の違い：
- 間接リーク（パラメータ選定）: clean holdoutで対処可能
- 直接リーク（同日実績列が特徴量）: 特徴量から除外しないと修正不可

## アクション
clean holdout後も高精度が継続したら、直接リークを疑って
get_numeric_featuresの全出力列を確認する。

