# リーク診断の3ステップ標準手順

## 背景
今回のリーク発見は3ステップで確定した。
ステップ1・2だけでは「非線形相互作用」と誤判断するリスクがある。

ステップ1: ナイーブ基準との比較
- 「過去の頻度Top2を固定して毎日予測」→ hit@2がランダム基準と同等か確認
- 同等なら「Top2は日次変動あり、単純暗記ではない」が確認できる

ステップ2: 個別特徴量の予測力確認
- 線形相関: is_top_2との相関係数
- Spearman rho: 日内の相対順位との相関
- 両方ともほぼゼロなら「lag特徴量は予測力なし」が確認できる

ステップ3: 同日実績列の単独予測力確認（最重要）
- 除外対象のはずの列（avg_diff_coins等）を直接使った場合のhit@2を計算
- 100%に近ければリーク確定

今回: ナイーブ=37.8%, Spearman rho<0.06, total_diff_coins_focus単独=100%
→ 全3ステップでリーク確定。

## アクション
バックテストhit@2が95%超の場合、このチェックリストを実行する前に
特徴量・戦略の改善議論に入らない。

チェックリスト：
□ ナイーブ基準（固定Top2）のhit@2を計算
□ 全特徴量のSpearman rho（日内ランク）を計算
□ get_numeric_featuresで返される全列を確認し、同日実績列を列挙
□ 同日実績列の単独hit@2を計算（1.0に近ければリーク確定）
□ SAME_DAY_LEAK_COLSを追加して修正・再評価

