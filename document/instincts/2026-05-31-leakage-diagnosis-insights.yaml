# total_diff_coins_focus が特徴量に混入していた根本リーク

## 背景
clean holdout監査（2025選定→2026評価）でも hit@2=98-99% が継続したことで調査。
以下の手順でリークを特定した：

1. ナイーブ基準（過去固定Top2）: hit@2=37.8% ≈ ランダム
   → Top2は日次で変動しており単純暗記ではない
2. 全lag特徴量のSpearman rho（日内ランク相関）: 0.002〜0.059
   → lag特徴量は実質ランダムレベルの予測力
3. total_diff_coins_focus 単独 hit@2 = 100.0% (327日全勝)
   → 同日の実績値が特徴量に混入している

_predict_for_date (tail_ltr_split_rule_nextday_gpu.py line 591) の除外リスト：
```python
excluded_targets = {"is_top_2", "is_rank_1", "is_top_3", "is_worst_1", "is_worst_3"}
```
ターゲットラベル5列しか除外していない。
total_diff_coins_focus (r=+0.643 with is_top_2) が特徴量として混入。
efficiency_focus も同様 (r=+0.642)。

## アクション
_predict_for_date の特徴量フィルタを以下に修正する：
```python
SAME_DAY_LEAK_COLS = {
    "is_top_2", "is_rank_1", "is_top_3", "is_worst_1", "is_worst_3",
    "avg_diff_coins", "total_diff_coins", "total_diff_coins_focus",
    "win_rate", "efficiency", "efficiency_focus", "diff_coins_normalized",
}
all_features = [f for f in all_features if f not in SAME_DAY_LEAK_COLS]
```
同様の除外漏れが clean_holdout_audit.py, tail_ltr_split_rule_wf.py にも存在しうる。
修正後は全バックテストを再実行して真の性能を計測する。

