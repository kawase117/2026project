# ランク問題でindividual correlationが低くても高精度はありうるが確認が必要

## 背景
XGBoostランカーはindividual correlationではなく日内相対順位を学習するため、
「linear correlation≈0なのにhit@2=98%」を「非線形相互作用」で説明できるように見える。

今回確認した3つの指標：
- Spearman rho（日内ランク相関）: 最大0.059（≈ランダム）
- ナイーブ基準（固定Top2）hit@2: 37.8%（ランダム基準と同等）
- total_diff_coins_focus単独 hit@2: 100.0%（リーク確定）

この3つが揃った場合、「非線形相互作用説」は成立しない。
直接リークが存在すると判断すべき。

## アクション
個別linear correlationが低くても次のチェックを追加する：
1. Spearman rho（日内ランク相関）: 0.1超が少なくとも1つあるか
2. 最強単独特徴量でのhit@2: 50%超か（ランダム38%より有意に高いか）
3. 除外されているはずの同日実績列の単独hit@2: 1.0に近くないか

全てが低い（≈ランダム）なのに全体hit@2が95%超なら直接リーク確定。
