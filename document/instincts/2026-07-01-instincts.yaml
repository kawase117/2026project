# diff/104%だけでは真の設定と乖離することがある — 実打確認との矛盾例

## 背景
2026-06-30の蒲田1候補#2101（スマスロ北斗の拳）はdiff=+1400、機械割104%超えというデータ上はプラス判定だったが、
ユーザーが実際にその台を打った経験では「おそらく低設定」という逆の印象だった。
AT機・スマスロ系は個人の技術介入（目押し、演出選択、状態管理）や短時間の分散で機械割が容易にブレるため、
1日分のdiff/104%フラグは「真の設定」の代理指標として不完全である。

## アクション
- diff/104%ベースの評価は「打感」「実打確認」と食い違うことがある前提で解釈する
- 可能な場合は実打・現地観察による設定判定を正解ラベルとして優先し、diff/104%は補助指標に留める
- 特にスマスロ・AT機など技術介入余地の大きい機種では、diff/104%単体の的中判定を過信しない
- ジャグラー等の技術介入が少ない機種では相対的にdiff/104%の信頼度が高い（`juggler-104pct-threshold-meaning-by-model` instinct参照）

## 例
#2101 スマスロ北斗の拳: diff=+1400, 機械割104%超え（データ上プラス）だが実打印象は低設定
→ 予測の成否をこの1台だけで判定するのは危険。複数台・複数日の集計で見るべき

