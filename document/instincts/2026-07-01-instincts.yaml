# 全台イベント銘柄は予測成否の評価対象から除外すべき

## 背景
2026-06-30の3ホール候補台バックテストで、蒲田7の炎炎ノ消防隊2(#2201,#2211)・ミリオンゴッド(#3074)、蒲田1のミリオンゴッド(#2040)が
その日「全台」イベント報告のある機種だったことが判明。
これらは個別台選定ロジックとは無関係に機種単位で高設定が入るため、候補に含まれていれば機種選択の巧拙に関わらず機械的にプラスになる。
逆にavoidリストに入れていた場合（蒲田1 #2040）は「avoid判定が外れた」ように見えるが、実際は全台イベントという構造要因によるもので、avoidロジック自体の欠陥ではない。

## アクション
- 予測の的中率・プラス率を計算する前に、その日の全台イベント報告がある機種を候補・avoid双方から除外する
- 全台イベント銘柄を含めたまま的中率を出すと、モデルの個別台選定能力を過大評価（または過小評価）する
- 全台イベントは `zenki-event-unpredictable-from-avg-diff`（2026-07-01作成）で報告済みの通り事前予測が困難なため、「引けた/引けなかった」は運要素として別集計にする

## 例
2026-06-30: 蒲田7候補#2201,#2211,#3074（炎炎ノ消防隊2・ミリオンゴッド、全台報告あり）→ 機種選択の巧拙と無関係にプラス
蒲田1 avoid #2040（ミリオンゴッド、全台報告あり）→ avoidロジックの欠陥ではなく全台イベントによる例外

