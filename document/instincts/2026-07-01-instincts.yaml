# 稼働不足台（G数が著しく低い）は的中判定に使えない

## 背景
2026-06-30のみとや候補台バックテストで、#516(G=0), #567(G=233), #602(G=369), #618(G=755)など、
候補15台中複数がG数1000未満で、差枚・104%判定が統計的にほぼ無意味な水準だった。
G数が極端に低い状態での差枚・機械割は分散が支配的で、「設定が良かったか」を判断する材料にならない。

## アクション
- 候補台の的中率評価には最低G数フィルタ（目安: 1500G以上、既存の `shindai-exclude-from-games-analysis` 系の運用と整合）を適用する
- フィルタ未満の台は「判定不能」として的中率の分母から除外する（プラス/マイナスどちらにもカウントしない）
- 稼働自体が少ないという事実（早退・機種の人気薄）そのものも、間接的な低設定シグナルになりうる点は別途検討

## 例
みとや2026-06-30候補15台中、G<1000が4台（#516,#567,#602,#618）→ 実質判定可能なのは11台程度
G数十分な候補のみで再集計すると、的中率の解釈がより公平になる

