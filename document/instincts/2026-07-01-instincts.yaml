# 蒲田7 Top20フルリスト検証: プラス率25%、実績順位は中央値より下寄り

## 背景
2026-06-30、蒲田7で実際に運用していた期待値順Top20候補リストを実績と全数照合した結果:
- プラス率 5/20 (25%)
- Top10的中 0/20
- 候補台の平均実績順位が上位64.7%相当（＝中央値より悪い、下位寄り）
- 期待値1位だった#3264（真打吉宗, avg+4380）が実績713/715位（ほぼ最下位）

これは前回の縮小版（Top7）評価より深刻な結果で、「量を増やしても質が伴わない」ことを示す。
ただし全台イベント銘柄（#2201,#2211,#3074）を含んだままの集計であり、`zenki-event-confounds-prediction-evaluation` の補正をかけると数値は変わりうる（未実施）。

## アクション
- 蒲田7の個別台記憶型戦略は、Top20規模でもプラス率が全体平均を下回る可能性がある。過信しない
- 期待値ランキングの序列自体（1位が最も外れた）に情報量がない可能性を考慮し、期待値ソートより勝率ソートを優先する運用を検討
- 全台イベント銘柄を除いた「純粋な個別台選定スキル」の再評価が必要（未実施タスクとして残す）

## 例
2026-06-30 蒲田7 Top20: プラス5/20(25%)、Top10的中0/20、平均実績順位64.7%（下位寄り）
期待値1位 #3264: 実績713/715位（最下位圏）→ ランキング序列の妥当性に疑義
