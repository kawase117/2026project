# 複数機種で同じDDが揃って光る場合、機種固有ではなくホールの投入日戦略を反映している可能性が高い

## 背景
みとや/蒲田7/蒲田1で甲鉄城のカバネリ・ジャグラーガールズ・クレアの秘宝伝のDD深堀りを行った結果、同一ホール内の異なる機種が同じDDで揃って好調になる現象を確認した。蒲田7ではカバネリ(hit104率上位DD1・4・23・21・28・7、baseline44.0%)とジャグラーガールズ(上位DD30・19・7・9・27・15、baseline27.7%)が共にDD7で有意な上振れ(カバネリ51.6%, ジャグラーガールズ37.0%)。みとやではジャグラーガールズ(上位DD24・16・5・9・30・14・7)とクレアの秘宝伝(上位DD27・31・4・24)が共にDD24・DD4近辺で上振れした。機種ごとに独立にDD別クセが決まるなら偶然の一致は起きにくく、ホール側が特定の日に複数機種へ横断的に設定を投入していると解釈するのが自然。

## アクション
機種別のDD分析結果を評価するときは、単独機種の結果だけで「この機種特有のクセ」と結論せず、同じホールの他機種でも同じDDに山が出ていないか必ず突き合わせる。複数機種で一致すればホール全体のイベント日投入戦略、その機種だけで突出していれば機種固有の設定表(ボーダー・出玉設計)起因、という切り分けに使う。

## 例
eda/results/machine_dd_deepdive/dd_breakdown.csv。蒲田7: カバネリDD7 hit104率=51.6%(baseline44.0%)、ジャグラーガールズDD7 hit104率=37.0%(baseline27.7%)。両機種ともDD7で一致して上振れ。

