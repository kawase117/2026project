# 指定機種名×全ホール横断のDD深堀りツールが利用可能

## 背景
既存のmachine_axis_pattern_scan.pyは蒲田1/蒲田7/みとやの3ホール限定・ホール内min_machine_days_total=200かつtop_n=30に絞る設計のため、任意の指定機種(カバネリ・ジャグラーガールズ・クレアの秘宝伝など)が全ホール中の一部でしか結果に現れず、後継機(海門(うなと)決戦)のような表記違いの別machine_nameも見落としやすい。2026-07-02セッションでeda/machine_dd_deepdive_target_machines.pyを新規作成し、TARGET_MACHINESリストで指定した機種名を全9ホール(eda.core.HALL_DBS)横断・min_machine_days_total=100に緩和して、DD軸のKruskal-Wallis(diff)/カイ二乗(plus,hit104、バイアス補正Cramér's V)検定とDD別内訳(n・avg_diff・plus_rate・hit104_rate)を出力する。

## アクション
特定機種名を指定したDD深堀りが必要なときは、eda/machine_dd_deepdive_target_machines.pyのTARGET_MACHINESリストを対象機種名に書き換えて再実行する。出力はeda/results/machine_dd_deepdive/summary.csv(ホール×機種ごとの検定結果とbaseline)とdd_breakdown.csv(DD値1-31別の内訳)。

## 例
python eda/machine_dd_deepdive_target_machines.py
