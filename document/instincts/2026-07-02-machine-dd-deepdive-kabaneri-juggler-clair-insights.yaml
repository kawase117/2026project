# 後継機で旧機種とDDパターンが変わって見えても、セルサイズを確認するまでは戦略変化と断定しない

## 背景
甲鉄城のカバネリ(オリジナル)は蒲田1(plus効果量0.168)・蒲田7(plus効果量0.122)で有意になり、上位DDが各ホールの公式イベント日(1・7・17・21・22)と部分一致した。一方、後継機の海門(うなと)決戦はみとや(上位DD5・6・14、事実上非イベント日中心)とヒロキ(上位DD11・14・20・29、公式イベント日[6,16,26]と一つも一致せず)でのみ有意になり、オリジナルとは全く異なるDDセットだった。ヒロキの結果はn_machine_days=445をDD31水準で割るとセルあたりn≈14〜15と極小で、二項比率の95%信頼区間が±20pt超と非常に広い。plus効果量0.227は今回の分析全体で最大の数値だが、公式イベント日と上位DDが一つも重ならないことと合わせると、「後継機で投入戦略が変わった」という解釈よりサンプル不足由来のノイズである可能性のほうが高い。

## アクション
シリーズ後継機のDDパターンが旧機種と異なって見えても、即座に「戦略変化」と結論しない。まずDD区分あたりのn(セルサイズ)を確認し、n<20程度なら機種名×DD持続性チェック(eda/machine_dd_persistence_check.pyと同様の前半/後半split・Spearman)にかけて再現するか検証してから解釈する。

## 例
eda/results/machine_dd_deepdive/summary.csv。ヒロキ/海門決戦: n_machine_days=445, DD1セルあたりn≈14〜15。plus_effect=0.227(全体最大)だが公式イベント日[6,16,26]と上位DD[11,14,20,29]が不一致。

