# 楽園蒲田はmachine_numberが工事前後で別の物理台を指す。台番号だけの長期集計は機種入替を誤って連結する

## Core claim
楽園蒲田店は2026-07-06の島配列工事で機種配置が大きく変わっており、同じ
`machine_number`が工事前後で全く別の機種を指すことがある。`machine_name`で
フィルタしていても、工事をまたいで台番号が使い回されているケースでは
「この台番号は昔から強かった」という長期集計が、実際には別の物理台の実績を
混ぜてしまう。

## Evidence
- n_observations: 1台（machine_number=1103）の全履歴確認
- data scope: single-hall（楽園蒲田店）
- metric scope: machine_name の時系列変化
- result summary: 台1103は2026-07-28以前は「キングハナハナ-30」、
  2026-07-28以降は「ネオアイムジャグラーEX」に完全に入れ替わっていた。
  `hana_flag==1`でフィルタした「直近90日（2026-05-09〜08-06）」の台別出率
  ランキングはこのフィルタのおかげで1103をキングハナハナ期間だけ正しく
  集計していたが、2026-08-07時点でこの台はもうハナハナではなく、
  結果として「いつも強いハナハナ上位3台」のリストに誤って含めてしまった
  （実在しない比較対象を答えとして提示するところだった）
- 追加確認: machine_number 3166〜3181（現在のハナハナ16台の設置場所）は
  工事前は「コードギアス」「アクエリオン」等の無関係な機種群で、
  ハナハナとしての履歴は工事後の31日分しか存在しない

## Interpretation
- `machine_number`は物理台の永続識別子ではない。工事・レイアウト変更のたびに
  同じ番号が別モデルへ再利用されることがある
- カテゴリフラグ（`hana_flag`等）でのフィルタは「そのカテゴリだった期間」を
  正しく残すので集計自体は汚染されないが、**集計結果の解釈**（「この台番号は
  今も強い」）が誤りうる。今その台番号に座っている機種が同じでなければ
  意味を持たない
- 既存のレイアウトエポック注意（HYPOTHESIS_LEDGER.mdヘッダの
  「工事前/工事後を必ず確認」）は角番・セクション等の**位置効果**の文脈で
  書かれているが、本件は**機種の同一性そのもの**が壊れるという別の失敗モードで、
  区別して明記する必要がある

## Action
- 楽園蒲田で機種名によらない長期のmachine_number集計をする前に、対象期間内で
  該当machine_numberのmachine_nameが変化していないかを必ず確認する
  （`groupby(machine_number)["machine_name"].nunique() > 1` で機械的に検出できる）
- 変化していれば、工事エポック（2026-07-06）またはmachine_name変化点で
  期間を区切ってから集計する。工事後だけに限定した集計は、対象の台番号が
  工事後にしか存在しないカテゴリなら自動的に安全になる
- 「通算」を主張するときは、その台番号が主張する全期間で同一機種だったことを
  先に確認してから使う

