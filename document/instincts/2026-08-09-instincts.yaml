# 一部のAT機はRBという区分自体を持たない。rb_count=0を『RBが悪い』と読んではいけない

## Core claim
機種によってはRB（レギュラーボーナス）という区分自体が存在せず、`rb_count`が
常に0・`rb_probability_decimal`が常にNaNになる。これは「RB確率が低い＝低設定寄り」
という意味ではなく、単に「この機種にRBという概念が無い」という構造上の欠落である。
BB/RBの両方から設定推測する前に、対象機種の全履歴でrb_countが一度でも非ゼロかを
確認しなければならない。

## Evidence
- n_observations: 1機種・44行（楽園蒲田店 花の慶次～佐渡攻めの章～、全履歴）
- data scope: single-hall・single-model（楽園蒲田店、花の慶次）
- metric scope: rb_count, rb_probability_decimal
- result summary: 全44行（台2010/2018/2019/2020、直近90日超）で`rb_count`が
  1件残らず0、`rb_probability_decimal`は1件残らずNaN。同機種の公式スペック
  （1geki.jp）にもBB確率（初当り確率）のみが掲載され、RB単独の確率表は存在しない
  （「RB：BB：ATが均等に振り分け」という内部配分の記述のみで、ホール側の
  掲示・ホールデータにはRBという独立イベントが現れない）

## Interpretation
- `bb_count`列は、この種の機種では実質的に「初当り総数」を記録しているとみなせる
- RB確率が構造的に存在しない機種でこれを設定推測の材料に使おうとすると、
  常にNaN/0比較になり誤った結論（あるいはクラッシュ）を招く
- 逆に本当にRBを持つ機種（キングハナハナ-30・ニューキングハナハナV-30等の
  ノーマルタイプ）ではBB・RB両方から通常どおり事後推測できる

## Action
- 新しい機種の設定推測を始める前に、対象機種の全履歴で
  `(df["machine_name"]==機種名)["rb_count"].sum() > 0` を確認する
- 0であれば、1geki.jp等の公式スペックでBB確率（初当り確率）単独の表を探し、
  その確率だけで二項事後を計算する。RB列が無いことを断らずに結果だけ出さない
- ノーマルタイプ機（ジャグラー・ハナハナ系）は通常BB/RB両方が存在するので、
  この確認が必要になるのは主にAT/ART系・スマスロ系の機種

