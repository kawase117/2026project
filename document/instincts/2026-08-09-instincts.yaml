# k個の候補の「最良1つ」は期待順位と比べてはいけない。p値に変換する

## Core claim
k個の候補のうち最良のものの順位は右に歪んだ分布を持つため、期待順位
`(N+1)/(k+1)` との比較は帰無仮説の下でも過半数が「期待より上」になる。
必ず `p = 1 − C(N−r, k)/C(N, k)` に変換してから判定する。
候補数kが日ごとに変わる主張では、これを怠ると必ず誤検出する。

## Evidence
- n_observations: 楽園蒲田 41日（2026-06-01〜2026-08-08）
- data scope: single-hall（楽園蒲田店）
- metric scope: 全台系スコア gratio_mean_diff の機種内順位
- result summary: 「機種台数==DDの機種に全台系が1つ以上ある」という主張を検証。
  - 「期待rankより上」で数えると 23日中17日で当たって見える
  - p値に変換すると p_rank平均 **0.456**[0.378, 0.534]（帰無は0.5）で区別不能
  - 閾値基準では41日中8日で、ランダム期待 **11.0日を下回る**（期待値割れ）
  - 強ゾロ目3日(6/6, 7/7, 8/8)は3/3だが、各日の「1つ以上」確率が
    0.509/0.445/0.609なので同時確率は **0.138**（約7回に1回）。
    Fisher統合 p=0.160(rank基準) / 0.682(閾値基準)。いずれも非有意

## Interpretation
- k個の最小値は mean=(N+1)/(k+1) に対し median≈N(1−0.5^(1/k)) で **median < mean**。
  k=6, N=120 なら mean 17.3 に対し median 13.1。帰無下でも約56%の日が
  「期待より上」に落ちる
- 噂・体感が生まれる構造もここにある。**候補数kが多い日ほど自動的に当たる**。
  2026-08-01 の楽園は1台設置機種が119機種中46機種あり、全台系12機種のどれかが
  1台設置機種に当たる確率は99.8%。「1台設置に仕掛け」は当たって当然だった
- 同じ罠は閾値側にもある（quantile-threshold-count-claim-is-tautological）。
  あちらは閾値を分位点で切ると恒等式になる話、本件は候補数側の同型の罠

## Action
1. 「どれか1つでも」型の主張は `p = 1 − C(N−r, k)/C(N, k)`（順位基準）または
   `p = 1 − C(N−T, k)/C(N, k)`（T=当日の閾値超え機種数、閾値基準）で採点する
2. 複数日はFisher統合 `X² = −2Σln(p)`, `df=2m` でまとめる
3. 「k個中1個当たった」と報告するときは必ず**期待数 k×T/N を併記**する。
   期待0.85に対して実際1なら、それは当たりではない
4. 事前登録に載せるときも、判定式にkの補正を組み込んでから凍結する

