# グループ平均差枚は上位2台で作られる。中央値・プラス率・上位除去を必ず併記する

## Core claim
グループの平均差枚がホール平均を上回っていても、それが上位数台の上振れで
作られている場合がある。高設定の面投入は分布の中心を動かすが、上振れ2発は
動かさない。**中央値・プラス率・上位2台除去後の平均**を併記して初めて区別できる。

## Evidence
- n_observations: 2026-08-08 ヒロキ東口店 279台（うち山佐系29台）
- data scope: single-hall・single-day
- metric scope: 平均差枚 / 中央値 / プラス率
- result summary:
  - 山佐系29台 平均**+1,139枚** vs ホール279台 **−41枚** → 差+1,180枚。
    「8/8は山佐の日、効いた」と読める
  - 上位2台（ゴッドイーター2255 +17,258枚、鉄拳6 2087 +14,622枚）を除くと
    山佐27台 **+42枚** vs ホール277台 **−156枚** で差は約200枚まで縮む
  - **中央値は 山佐−694 / ホール−683 でほぼ同一**。プラス率 45% vs 35%
  - 同日のゴッドイーター リザレクション5台は平均+2,726枚だが、2255を除く
    4台は平均−907枚（4台ともマイナス）。機種平均だけを見て「全台系だった、
    自分の予測は外れ」と誤って自己採点した
  - 対照例: 同日の鉄拳6は2台とも プラス（+14,622 / +3,625）で、
    こちらは1台の上振れではない

## Interpretation
- 平均だけが良く中央値とプラス率が対照群と同じなら、それは「上振れが出た」
  のであって「効いた」ではない
- feedback-scoring-must-separate-setting-from-pnl の系だが失敗モードが違う。
  あちらは「台単位の高設定は結果指標では判定不能」、本件は
  「グループ集計の頑健性」。両方適用する
- **自分の予測の答え合わせで特に危ない**。「外れた」と早合点して、
  正しかった判断を撤回しかける（実際にこのセッションで一度撤回しかけた）

## Action
1. グループ比較は **平均 / 中央値 / プラス率** の3点セットで出す。平均単独で書かない
2. 上位2台を除いた感度分析を1行添える
3. 中央値とプラス率が対照群と同水準なら、結論は「上振れが2発出た」と書く。
   「効いた」「エッジがある」と書かない
4. 自己採点にも同じ規律を適用する。機種平均が良かったからといって、
   「避けろ」という自分の判断を撤回しない

