# 強ゾロ目日は「末尾一致」が効かず「台番号末尾ゾロ目」のほうが増幅する

## Core claim
強ゾロ目日(MM=DD)において、末尾がその日のdd(=mm)と一致する台を狙う戦略は
9ホール中8ホールで通常日より**悪化**する。一方、台番号末尾ゾロ目(下2桁同一)は
9ホール中7ホールで増幅する。方向が逆であり、混同してはならない。

## Evidence
- n_observations: 2025-01-01〜2026-08-08、9ホール、強ゾロ目 最大19日/ホール
- data scope: all-hall（各ホール個別に測定、プールはしていない）
- metric scope: 同日内 gap（対象群−非対象群の games加重機械割、pp）
- result summary:
  - **末尾一致**: 増幅(強ゾロ目gap−通常日gap)が正なのは2ホールのみ。
    金時 −2.62pp[−5.16,−0.08]で有意に**マイナス**。ヒロキはプラス率25%(16日中4日)
  - **末尾ゾロ目**: 7ホールで増幅が正。蒲田7 +3.49pp[−0.34,+7.32]が最大、
    レイトギャップ +2.18pp[+0.11,+4.26]のみCIが0を跨がない。
    ただし18セル検定で有意1件は偽陽性期待0.9件の範囲内
  - **ホールドアウト 2026-08-08**: 末尾ゾロ目は8ホール中7でプラス、平均+2.96pp
    (蒲田1 +14.56pp、ザシティ +12.38pp、金時のみ −13.12pp)。
    末尾一致も8ホール中6でプラスだが平均+0.45ppと小さい
- 実装: `eda/strong_zorome_lastdigit_scan.py`、`eda/strong_zorome_hall_level.py`

## Interpretation
- **末尾一致の否定のほうが証拠が強い**（方向が9ホール中8で一致、うち1件は有意）。
  末尾ゾロ目の肯定は多重検定の範囲内で、根拠は符号の一貫性のみ
- 2026-08-03 の hiroki-jug-hitdd / kamata7-hana-hitmm は**全日平均**での測定。
  強ゾロ目日はその部分集合で符号が反転する。**元instinctの否定ではなく
  境界条件の追加**であり、通常日での適用は生きている
- セグメントで符号が変わる。2026-08-08 楽園は JUG で末尾ゾロ目 +1,524枚/台
  (プラス率58%)だが BT は −375枚、AT は差なし。蒲田7は全セグメントで差なし。
  蒲田1のみ AT +3,200枚・JUG +1,200枚と両方で成立した
- 事前に測った増幅の順位は当日の実績と一致しなかった（蒲田7が事前1位→当日+1.22pp、
  蒲田1が事前3位→当日+14.56pp）。過去平均でホールを選ぶより、当日ホール側が
  何を名指ししているかのほうが情報量が上だった

## Action
1. 強ゾロ目日に「末尾==dd」を狙う根拠として使わない。特にヒロキ・金時では避ける
2. 末尾ゾロ目は**加点材料まで**。主軸にしない。フォワード継続中(2026-08-08が1点目、
   残り19エントリー日)
3. どちらも必ず JUG/HANA/OKI/BT/AT に割ってから判断する。プールで結論しない
4. 2026-09-09 が次の検証機会

