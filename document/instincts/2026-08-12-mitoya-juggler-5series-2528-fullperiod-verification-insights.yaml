# みとやジャグラーの「5のつく日」「DD25-28ウィンドウ」仮説は全期間検証で棄却(短期観測の見かけ上の重なりだった)

## 背景
直近1ヶ月の機種別日次RB率スキャンで、7/15(ガールズ+24%)・7/25(ファンキー2+27%)・
7/26(ウルトラミラクル+23%)・7/28(ファンキー2+29%、ウルトラミラクル+24%)など
「5のつく日」「DD25-28」帯に複数機種の上振れが重なって見えたため、
(1)5のつく日(DD5,15,25)、(2)DD25-28の4日間ウィンドウ、の2仮説を検討した。

全期間(2025-01〜2026-08、games>=1500、n_dates=47〜76)で機種別に
vs rest カイ二乗検定＋投資量(games)相関チェックを行った結果:

- **5のつく日**: 8機種中有意なのはゴーゴージャグラー3のみ(diff+0.00013, chi2_p=0.0003)
  だが、games相関r=0.442(p=0.001)で投資量交絡が濃厚。他7機種は全て非有意
  (ガールズp=0.24, ファンキー2 p=0.70)で、短期間で目立った上振れ機種は
  全期間で見ると有意差が消えた。
- **DD25-28ウィンドウ**: 8機種すべて非有意(全てp>0.1)。ホール合算でもp=0.14で棄却、
  diffはむしろ微小マイナス。

さらに、この直近1ヶ月のスキャン自体、146検定(機種×日)中p<0.05は5件のみで、
純粋なランダムノイズでも期待される件数(146×0.05≈7.3件)を下回っており、
統計的には「ノイズ以下」だった。

## アクション
1ヶ月程度の短期観測で複数機種の上振れが同じDD帯に重なって見えても、
それだけでは法則の根拠にしない。必ず全期間(1年以上、目安n_dates>=40)で
機種別に vs rest カイ二乗検定＋投資量相関チェックを行ってから運用候補に
上げること。「複数機種が同時に上振れて見える」こと自体、月1回しか来ない
DDのサンプル不足による偶然の重なりで十分起こりうる。

## 例
5のつく日: ゴーゴー3のみ有意(diff+0.00013, p=0.0003)だが投資量交絡濃厚
(games相関r=0.442, p=0.001)。他7機種非有意。
DD25-28: 8機種＋ホール合算すべてp>0.1で棄却(合算diff=-0.00002, p=0.1408)。

