# みとや差枚弱体化局面では、非有意な微弱パターンでも定点観測リストに残す(5のつく日・DD25〜月末)

## 背景
2026-08時点、みとやは差枚の弱体化が続いている局面。ユーザーの見立てでは
「統計的に強固な形では見えづらいが、ホールが何らかの微弱な客引き止め施策を
打っている可能性が高い」局面であり、5のつく日・DD25-28ウィンドウの仮説は
全期間検証で棄却された(mitoya-juggler-5series-2528-window-rejected-fullperiod
参照)ものの、「強い法則ではないと分かった上で」今後も継続的にウォッチする
方針が明示された。

## アクション
みとやのジャグラー系分析で5のつく日・DD25〜月末の動向を、単発で棄却して
終わらせず月次スキャンの定点観測項目に含める。単月では非有意でも切り捨てず
時系列で蓄積すること。差枚弱体化局面(機械割トレンドが低下している期間)では、
通常より小さいeffect_sizeでも「経過観察」として記録に残す価値を高く見積もる。
ただし実際の座席選択などの運用判断に使うのは、複数月にわたる再現性が
確認できてから。

## 例
2026-08時点の全期間検証では5のつく日・DD25-28ともに棄却されたが、
今後の月次スキャンでこの2条件を継続的な観測リストに残す。

