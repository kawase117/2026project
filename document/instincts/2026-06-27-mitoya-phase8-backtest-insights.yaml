# どの戦略も単独では全ウィンドウを支配しない

## 背景
5ウィンドウの walk-forward バックテストで、Shortlist・CornerRule・MachineCorner の3戦略すべてが少なくとも1ウィンドウで大幅に劣化する。CornerRule は Period 3→4 で -6.4、MachineCorner は Period 2→3 で +53.4、Shortlist は Period 3→4 で +93.5。ホール側の戦略変更やレイアウト変更による regime change が原因と考えられる。

## アクション
- バックテストの「平均」だけで戦略を選ばない。ウィンドウ別の最悪ケースを必ず確認する
- 複数戦略のアンサンブルまたは切り替えロジックを検討する
- regime change の検知（直近の実績が過去平均から大幅に乖離したとき）を組み込む
- 新しい戦略を追加するときも、全ウィンドウで均一に効くことを確認してから採用する

## 例
全体の平均だけ見ると MachineCorner (+165.3) が最強に見えるが、
Period 2→3 では +53.4 まで落ちる。平均の高さだけで採用すると、
このウィンドウに当たったとき期待外れになる。
