# X_DDS日は角番ルール単独でShortlist（機種名）を上回る

## 背景
Phase 8 バックテスト（5ウィンドウ walk-forward）で、CornerRule（reversed=0 の corner1-4 を狙う）が X_DDS 日に Target 比 +313.1 を記録。Shortlist（機種名 top_n=2）の +281.0 を上回った。機種名情報なしのシンプルな物理位置ルールでこの数字が出ることは、ホール側の設定投入が物理位置に強く依存していることを示す。

## アクション
- X_DDS 日はまず CornerRule（reversed=0 セクションの角番1-4）を基本戦略にする
- 機種名は補助情報として使い、CornerRule と矛盾しない場合にのみ採用
- 特に Period 1→2 (+552) と Period 2→3 (+516) で角番効果が強く出る

## 例
X_DDS日の戦略比較:
  Shortlist (機種名): +281.0
  CornerRule (角番): +313.1
  MachineCorner (機種×角番): +266.3

