# MachineCorner（機種×角番）は全体最強だがウィンドウ間の振れが大きい

## 背景
MachineCorner 戦略は全体で Target 比 +165.3 と3戦略中最高だが、ウィンドウ別では +259.7, +314.3, +53.4, +139.8, +59.1 と大きく振れる。CornerRule も Period 3→4 で -6.4 に崩れる。どの戦略も単独では全ウィンドウ安定しない。

## アクション
- 単一戦略への依存を避け、CornerRule と MachineCorner を組み合わせる
- CornerRule を基本にし、MachineCorner の情報で補強する形が実運用向き
- 特定ウィンドウでの崩壊を検知するモニタリング（直近N日の実績追跡）が必要
- Shortlist は安定性では最も均一（+93〜+170）なので、フォールバック戦略として残す

## 例
Period別 CornerRule vs MachineCorner:
  0→1: CornerRule +125, MachineCorner +260
  3→4: CornerRule -6, MachineCorner +140
  → どちらかが崩れても他方で補える

