# 楽園の結果発表の「対象台」は、差枚で選ばれた台ではない可能性が高い。差枚で採点せず、RB確率の台と突き合わせて検証する

## 背景
2026-10-05、slokotae7の10/4結果(画像2枚、対象台49台)を台番号まで読み、DBの差枚と、サイトセブンのRB高低比(ジャグ・BT、2000G以上98台)に突き合わせた。

- 対象台49台のうち、差枚がマイナスの台が16台(33%)。-2000枚以下が4台(GOD 1019 -2160・1020 -2260、喰種2082 -5000、リコリコ2218 -2580)。差枚の良い台を集めたものではない。
- 3台並びの両端に、1000G未満の台がある(ネオアイム1135 628G・1137 520G、バイオ2006 317G)。並びの全台が打たれたとは限らず、「並び」の差枚平均は、中心の1台の結果に引かれる。
- 「対象台」の意味は、kawasakislotの本文(楽園のアンケートで『各フロアに3台並び⑤⑥3か所以上』『全⑥機種』)から、**ホールが申告した設定⑤⑥の台**と読める。ただしこれは推測で、ホールの申告であることは確認していない。
- サイトセブンのRB高低比の上位10台(1136・1190・1198・1132・1192・1164・1169・1159・3151・3200)のうち、4台(1136・1190・1159・3151)が対象台に入っていた。98台中の対象台は9台(約9%)なので、基準率を上回るが、n=10・1日で、偶然を除けない。1198・1132・1192・1164・1169・3200は入っていない。
- 10/4の抽出が止まっていたため、10/4分の対象台は、今回初めて分析に使えた。10/2・10/3分は取得済みだが、予測にも答え合わせにも使っていなかった。

## アクション
- 対象台の差枚だけで、「当たり」「外れ」を判定しない。差枚でなく、台番号を正解ラベルの候補として扱う。
- 並びの両端など、1000G未満の台を含む並びは、「並びが成立した」と数えない。回転数を見る(回転数3連の検出と併せる)。
- **検証してから使う**: 対象台の台番号(`db/analysis_results.db` の `external_result_machines`)と、サイトセブンのRB高低比を、日数を重ねて突き合わせる。10/1(61台)・10/2(49台)・10/3(50台)・10/4(49台)の4日分が使える(RBの記録はDB側にある)。ジャグ・BT機で、高低比の高い台が対象台に入る割合が、基準率(約9%)を安定して上回るかを見る。
- 検証前は、「対象台=設定⑤⑥」とは言い切らない。「ホールの申告の可能性が高い」と書く。
- 関連: project-rakuen-announce-ratio-vs-list(予告の名指しの読み方)、feedback-scoring-must-separate-setting-from-pnl(台単位の高設定は結果指標では判定できない)。

## 例
10/4の楽園。ネオアイム1136は、6715G・RB 33回(1/203)・差枚+4100で、RB高低比7.16倍(98台中1位)、対象台に入っていた。ネオアイム1190は、5963G・RB 29回(1/206)・差枚+1830で、高低比5.38倍(2位)、対象台に入っていた。一方、GOD 1019は、5335G・差枚-2160で、並び(1018-1020)の一員として対象台に入っていた。
