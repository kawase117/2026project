# 楽園蒲田DD=7/17/27の末尾7効果は2026年5月以降に始まった本物のレジーム。ただし隣接末尾への波及は再現しない

## Core claim
楽園蒲田店で「日付の日がDD=7/17/27」の日は、末尾7の台の残差（同日同機種平均差引後）が
他の日より系統的に高い。announce登録用に集めた8日（n=8）ではなく、2026-05-01〜08-17の
全DD=7/17/27（n=11） vs それ以外（n=96）で検定しても有意（Welch p=0.0089, Mann-Whitney
p=0.0012）。**しかもこれは末尾7に固有で、他の9末尾はどれも有意でない**
（末尾6のMann-Whitney p=0.088〜0.056(AT限定)が最も近いが、これは「有力」ではなく
「n=11では判定不能」という意味である。事後検出力(post-hoc power)は約25%しかなく、
80%検出力に必要なDD群のnは約90——7つく周期(月3回)では約2年半分。加えてこのセッションで
末尾×セグメントの組み合わせを約70通り検定しており、真に無関係でも最低1つがp<0.05に
なる確率は97%を超える。末尾2はp≈0.49〜0.95でノイズ水準、AT限定だと差がほぼゼロ(+0.3)
まで消える）。

この現象は**2025年には存在しなかった**。2025-01〜2026-04でDD=7/17/27の同じ検定を
やると平均差はほぼゼロ（-1.9 vs -19.9）。**2026年5月頃に始まった新しい施策**として
扱うべきで、n=8という小標本を理由に「まだ確証できない」と切り捨てるのは誤り。

## Evidence
- n_observations: 全期間検定 n=11(DD7/17/27) vs n=96(その他), 2026-05-01〜08-17。
  対照として2025-01〜2026-04のn=48 vs n=436も計測（無効果を確認）
- data scope: 楽園蒲田店、末尾7残差=同日同機種平均を引いた台差枚の平均
- metric scope: diff_coins_normalized の機種内残差
- result summary:
  - 末尾7単独: DD7/17/27平均+584.4 vs その他+16.3、差+568.2、Welch p=0.0089
  - 末尾6・7・8の相関(n=11): 7-6 r=-0.437(p=0.18)、7-8 r=-0.555(p=0.077)、
    6-8 r=-0.048(p=0.89、ほぼゼロ)。「6が弱いとき8が強い」という代替関係は
    支持されない。日次で見ると6と8はむしろ同方向に動く日が多い
  - 「7が強い日は6・8が他末尾より強め、7が弱い日は6・8がさらに強く6>8」という
    複合仮説はmedian splitで方向は一致(n=5ずつ)するがp=0.11〜0.95で未確定
  - セグメント別に見ると、末尾7はAT限定でも有意(Mann-Whitney p=0.039、Welch p=0.060
    とやや弱まる)。末尾6はAT限定でp=0.056まで近づくが、末尾2はAT限定だと差が
    ほぼゼロ(+0.3, p≈0.95)まで消え、プールで見えた正の値は他の小セグメント
    (推定OKI、1日1〜2台)のノイズだったと確認できた
  - 末尾6の効果量(Cohen's d≈0.41, AT限定)から事後検出力(post-hoc power)を計算すると
    n=11で約25%しかない。80%検出力に必要なDD群のnは約90（7つく周期・月3回では
    約2年半分）。このセッションだけで末尾×セグメントの組み合わせを約70通り検定して
    おり、真に無関係でも最低1つがp<0.05になる確率は97%超。p=0.056〜0.088は
    「有力候補」ではなく「この標本数では判定不能」と読むこと
  - ホール全体の稼働(平均G数)は2025年の週平均2000-2500台→2026年8月の
    3600-4300台へ明確に増加。一方**差枚の右肩上がりは無い**。2026年7月は
    全期間で最悪の月次平均差枚-116を記録している

## Interpretation
- 「n=8では確証できない」という前セッションの慎重さは、DD定義を全期間へ
  拡張することで解消できた。今後は announce登録日だけでなく
  `date.str[6:8] in (7,17,27)` で全期間から抽出して検定すること
  （`backtest/neighbor_effect.py` の考え方を末尾グループ判定にも流用できる）。
- **隣接末尾（6・8）や別末尾（2）への波及・代替という枠組みは、いったん筋の
  良い仮説に見えたが検定では再現しなかった。** 集計平均だけを見ると6・2が
  正に見えたが、これは少数の極端な日（8/17等）に引きずられた見かけ上のもので、
  日次相関はゼロ〜負だった。今後同種の仮説を思いついても、集計平均だけで
  判断せず必ず日次相関まで見ること。
- **稼働増 ≠ 差枚増。** ホールの「強さ」を語るときは両者を区別する。
  末尾7シフトは差枚総量の増加からではなく、稼働が増えた中での**配分の変化**
  として説明する方が実測に整合する。
- **「境界線に近いp値」は「有力候補」ではない。** p=0.05〜0.10の値は、それ単独では
  「検出力不足で判定不能」以上の意味を持たない。n=11・効果量d≈0.4程度では
  事後検出力は25%前後しかなく、真に効果がゼロでも偶然この程度のp値は珍しくない。
  「セグメントを絞ったらp値が下がった」という動きだけを根拠に仮説を格上げしない
  こと——絞り込み自体が多重比較の一形態であり、都合の良い切り口を後から選んで
  いないか常に自問する。

## Action
- 楽園蒲田の末尾D予告を評価するとき、announce.pyのn=8前後の登録済みサンプルに
  頼らず、まず全期間のDD一致日で検定してから判断する。
- 隣接末尾・代替末尾の仮説は、思いつきの時点でinstinctに書かず、
  日次相関（Pearson/Spearman、n>=10目安）を確認してからにする。
- 稼働(games_normalized)と差枚(diff_coins_normalized)のトレンドは常に分けて
  報告する。「ホールが強くなった」と一括りにしない。
- 境界線上のp値（0.05〜0.10）が出たら、そのまま報告せず必ず (a) 事後検出力、
  (b) 有意水準に必要なサンプルサイズ、(c) そのセッションで行った検定の総数
  （多重比較の文脈）の3点を併記する。3点を出さずに「境界線」「有力」と
  形容しない。

