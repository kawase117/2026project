# ジャグラー系の末尾仕掛けは差枚残差ではほぼ検出できない。RB確率でしか見えない

## Core claim
楽園蒲田の末尾7予告（2026-08-17、事前登録済み・out-of-sample）で、JUGセグメントの
差枚残差は+123.4（ほぼゼロ、効果なしに見える水準）だったが、同じ台群のRB確率は
末尾7ジャグ11台中7台が rb_rate>=1/300（0.636、通常日ベースレート0.253を大きく上回る）
と明確な仕掛けを示していた。設定が入っていても当日差枚がマイナスになる台が複数あり
（例: rb_rate 1/230=設定6超えの引きなのに当日差枚-333）、**差枚は仕掛けの粗い代理でしかない**。

## Evidence
- n_observations: 1日（2026-08-17、事前登録した予告のout-of-sample採点）。
  ただし方法論自体は `feedback-scoring-must-separate-setting-from-pnl`
  （台単位の設定は結果指標では判定できない）の直接の帰結であり、単発の観察ではない
- data scope: 楽園蒲田店、jug_flag=1 & games_normalized>=3000 の台
- metric scope: diff_coins_normalized残差 vs rb_rate(合成確率ではなくRB確率)
- result summary: JUG末尾7残差+123.4(ほぼ効果なし) vs RB確率ベース末尾7の
  ⑤⑥率0.636(通常日0.253を大きく超過)。個別台: 1107番rb_rate1/230・差枚-333、
  1117番rb_rate1/257・差枚-1333

## Interpretation
- announce.py の `position_rule`/`model_named` はホール全体の差枚を使うため、
  ジャグラー・ハナハナのようにRB確率という直接の計器がある機種では
  **差枚ベースの判定が false でも「仕掛けが無かった」と結論してはいけない**。
- 既存instinct（メーカー公表スペック表がある機種はRB確率、ジャグ・ハナハナ以外に
  適用しない）と対をなす。あちらは「RB確率の誤用を防ぐ」警告、こちらは
  「ジャグ・ハナハナでは逆に差枚を過信しない」警告で、方向が逆。

## Action
- ジャグラー・ハナハナ系の末尾・角番仕掛けを評価するときは、
  announce.pyの`position_rule`と並行して`backtest/announce.py`の
  `gogo_rokuroku_baseline`と同型のRB確率検定（bar=1/280,1/300,1/320）を必ず走らせる。
- 差枚ベースのclaimがfalseでRB確率ベースが hit のとき、「予告は外れた」ではなく
  「判定式が主張に対応していなかった」と記録する。

