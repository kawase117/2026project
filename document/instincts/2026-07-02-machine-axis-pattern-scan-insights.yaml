# 機種ごとの強いDDは、ホールの公式イベント日リストと部分的にしか一致しない

## 背景
機種名×DD軸の法則性スキャンで判明。スマスロ北斗の拳(蒲田1, n=9617)はDD1・DD11(蒲田1のイベント日)に加えDD10・DD9(非イベント日)も好調で、DD12(-331枚)が最弱だった。クレアの秘宝伝(みとや, n=830)はDD27(勝率72.4%, hit104率62.1%)が突出する一方、みとやの公式イベント日であるDD7(勝率19.2%、全31日中最弱クラス)・DD14(24.1%)はむしろ弱かった。ファンキージャグラー2(蒲田7, n=8457)はDD14(勝率57.9%, 平均+982枚)が最強だが、蒲田7の公式イベント日リストには含まれない。

## アクション
機種の強いDDを見つけたい場合、ホールの公式イベント日フラグ(is_x_day)だけに頼らず、必ず機種×dd(1〜31)の個別breakdownを確認する。逆に「イベント日だから強いはず」という前提で特定日を評価せず、同じイベント日リスト内でも機種によって強弱が大きく割れることを踏まえる。

## 例
eda/results/machine_axis_pattern_scan/{hall}_top_signal_breakdown.csv。クレアの秘宝伝dd27: hit104率62.1%(n=29) vs dd7: 19.2%(n=26)、同じ「イベント日」区分内でも47ptの差。

