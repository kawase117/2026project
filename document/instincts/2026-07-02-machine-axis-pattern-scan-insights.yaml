# 機種×DD/曜日/イベント日の法則性スキャンツールが利用可能

## 背景
2026-07-02セッションで設計、Codexが実装。全機種を対象に、DD(1-31)/曜日(7水準)/イベント日(is_x_day, 2水準)の3軸それぞれについて、差枚(Kruskal-Wallis)・勝率・104%超え率(カイ二乗、バイアス補正Cramér's V)の法則性をスクリーニングし、効果量上位シグナルとその水準別内訳を出力する。現在設置されている機種のみを対象とし(30日grace)、新台除外(30日)も適用済み。

## アクション
python eda/machine_axis_pattern_scan.py で3ホール(蒲田1/蒲田7/みとや)分を一括実行。出力はeda/results/machine_axis_pattern_scan/配下の{hall}_pattern_summary.csv(全件)、{hall}_top_signals.csv(効果量上位30件)、{hall}_top_signal_breakdown.csv(上位シグナルの水準別内訳)、summary_report.csv(軸×アウトカム別の集計)。p値ではなくeffect_size列（Kruskal-Wallisはepsilon_sq相当、カイ二乗はバイアス補正Cramér's V）を主指標として解釈すること。

## 例
python eda/machine_axis_pattern_scan.py
python eda/machine_axis_pattern_scan.py --halls 蒲田7 --top-n 50
