# 未補正Cramér's Vは水準数が多い軸で見かけ上大きくなる。バイアス補正が必須

## 背景
machine_axis_pattern_scan.pyの初回実装で、dd軸(31水準)×hit104/plusのCramér's Vがeffect_size>=0.1を示す機種の割合が69〜97%（day_of_week(7水準)は16〜33%、is_x_day(2水準)は2〜8%）という異常な差になった。原因は、二値アウトカム(c=2)の分割表でCramér's Vの分母min(r-1,c-1)が常に1になる一方、分子のchi2は帰無仮説下でも期待値df=(r-1)(c-1)を持つため、水準数rが大きいほどノイズだけでchi2が膨らみVが水増しされること。実証: dd×hit104のeffect_sizeとlog(n_obs)の相関が-0.89〜-0.92（真の効果ならサンプル数と無関係のはず）。Bergsma & Wicher (2013)のバイアス補正版Cramér's Vに切り替えたところ、相関は-0.16〜-0.32まで改善し、pct_effect_ge_0_1もdd軸で13〜24%という現実的な値になった。

## アクション
水準数が大きく異なる複数の軸を同じ効果量閾値で比較する分析を組むときは、必ずバイアス補正版Cramér's V（`phi2_tilde = max(0, chi2/n - (r-1)(c-1)/(n-1))`から計算）を使う。未補正版を使う場合は、水準数が多い軸(10水準超など)の結果を他の軸と直接比較しない。疑わしい結果が出たら、effect_sizeとlog(n_obs)の相関を確認する診断が有効（強い負の相関は水増しのサイン）。

## 例
eda/machine_name_significance_scan.py の `_cramers_v_bias_corrected`。eda/machine_axis_pattern_scan.py の `_scan_binary_outcome` で使用。

