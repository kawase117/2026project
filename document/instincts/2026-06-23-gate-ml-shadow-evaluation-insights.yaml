# MLは非イベント日で強く、イベント日ではルールベースが勝つ

## 背景
gate_ml_shadow vs gate_v6b_rule のevent/non_event分割:
- Event日: ML 0.205 < Rule 0.236（ルールが大幅に勝つ）
- Non-event日: ML 0.222 > Rule 0.210（MLが勝つ）
イベント日のパターンはc3(DD別)・c4(曜日別)で既にルールベースが捉えている。
MLが上乗せできるのは非イベント日の微妙な傾向のみ。

## アクション
MLとルールベースのアンサンブル（イベント日はルール重視、非イベント日はML重視）が有望。
または、イベント日フラグ自体をCatBoostの特徴量に追加して日種別の重みを自動学習させる。

## 例
Event: Rule 0.236 >> ML 0.205 (差 -0.031)
Non-event: ML 0.222 > Rule 0.210 (差 +0.012)
