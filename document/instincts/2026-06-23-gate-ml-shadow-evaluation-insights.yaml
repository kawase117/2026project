# AUC 0.539は特徴量不足のサイン

## 背景
CatBoost shadow（12特徴量、200 iterations、depth=4）のAUCが0.539。
ランダム(0.5)をわずかに超えるだけ。fallback日数=0で全日学習成功しているため、モデル自体は動作している。
c1-c6は既にセグメント×角番×DDの交互作用を手動計算済みのため、MLが再発見できる新しい交互作用が限定的。

## アクション
AUC < 0.55の場合、モデル構造やハイパーパラメータの調整よりも特徴量追加が先。
第一候補: machine_type（5-7カテゴリ）をcat_featuresとして投入。
機種カテゴリ×既存特徴量の交互作用をCatBoostに自動発見させる。

## 例
現状: c1-c6 + hist_* + seg_relative_* = 12特徴量 → AUC 0.539
期待: + machine_type → 機種別の角番効果差・DD反応差を学習 → AUC改善
