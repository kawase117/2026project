# MLはBack期間で急上昇し、データ蓄積による改善余地を示唆

## 背景
gate_ml_shadow: Front 0.201 < Back 0.233（+0.032pp）
gate_v6b_rule: Front 0.221 ≈ Back 0.215（安定）
MLはBack期間（後半98日）でルールベースを大幅に超えた。
学習データの蓄積が精度向上に寄与している可能性。

## アクション
この傾向が本物なら、より長い学習窓（90日→120日）や、データ量が増えた将来の再評価でMLが優位に立つ可能性がある。
ただしBack期間のみの優位は過学習の可能性もあるため、confidence=0.70に留める。

## 例
Front(97日): ML 0.201 vs Rule 0.221 → Rule勝ち
Back(98日): ML 0.233 vs Rule 0.215 → ML勝ち（+0.018pp）
