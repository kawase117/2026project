# ML昇格判定フレームワーク: 3条件 + AUC診断

## 背景
CatBoost shadow評価で使用した判定フレームワークが機能した。
3条件: (1) ML > Rule + 5pp, (2) Front/Back両方でRule超え, (3) ML > Random。
追加でAUC診断: AUC > 0.55なら特徴量追加で改善余地あり、≤ 0.55なら特徴量不足。

## アクション
ML昇格判定時は以下の決定木に従う:
- 3条件すべてPASS → GRADUATE（ML昇格）
- ML > Random だがGRADUATE条件未達 + AUC > 0.55 → 特徴量追加して再試行
- ML > Random だがAUC ≤ 0.55 → ルールベースで運用開始、特徴量空間拡張後に再評価
- ML < Random → FAIL（ML棄却）

## 例
今回の結果: ML > Random(PASS), ML ≈ Rule(FAIL), AUC=0.539(≤0.55)
→ 判定: NOT YET、ルールベース運用開始 + machine_type追加で再評価
