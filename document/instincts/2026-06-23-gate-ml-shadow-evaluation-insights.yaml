# --max-daysオプションでCodexタイムアウトを防止する

## 背景
CatBoost shadowフル実行（257日×score_day 11回≈34分）がCodexで2回タイムアウト。
実装→修正ループ後にフル実行すると60分制限に収まらない。

## アクション
1. 新規runnerには必ず `--max-days N` オプションを実装させる
2. プロンプトに「Codexでは --max-days 10 でスモークテストのみ。フル実行はユーザー環境で行う」と明記
3. 推定実行時間が15分を超える場合は、プロンプトにフル実行禁止を明示

## 例
```python
parser.add_argument("--max-days", type=int, default=None)
if args.max_days is not None:
    test_dates = test_dates[:args.max_days]
```
プロンプト末尾: 「フル実行はユーザー環境で行う。Codexではスモークテスト（--max-days 10）のみ実行すること。」
