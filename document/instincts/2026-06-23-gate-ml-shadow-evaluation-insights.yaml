# 第1層ゲートが改善の大半を稼ぎ、第2層ランキング改良は天井に近い

## 背景
5系列比較（195活性日）で、p@10の改善構造が明確になった。
- ゲートなし→あり: 0.197→0.216 (+0.019pp, 約10%改善)
- v6b特徴量追加: +0.002pp
- CatBoost ML化: -0.001pp（ルールベースと互角）
改善の95%以上は第1層（活性セグメント絞り込み）が担っている。

## アクション
第2層のランキング精度を上げるには、現在の12特徴量の非線形交互作用だけでは不十分。
特徴量空間の拡張（machine_type等カテゴリカル変数の追加）か、第1層の粒度細分化に投資すべき。
重み最適化やルール微調整への追加投資はROIが低い。

## 例
gate_v6a(0.216) vs gate_v6b_rule(0.218) vs gate_ml_shadow(0.217) — 第2層の3手法がほぼ同じp@10に収束。
