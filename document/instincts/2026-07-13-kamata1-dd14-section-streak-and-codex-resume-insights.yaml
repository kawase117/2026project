# DD14×2077-2161「9セクション連続プラス」は通期集計のみで成立する不安定な現象

## 背景
蒲田1のDD14(18日分)で、セクション2077-2161の9セクション連続で平均diffがプラスという珍しい現象を発見。
四半期4分割(Q1-Q4)で検証したところ、9セクション全プラスを維持した四半期は0/4。
2000回ブートストラップでも「9セクション全プラス」の再現率はP=7.65%と低く、通期集計でのみ見える見かけ上の現象だった。
一方、「全プラス」という完璧基準ではなく「日次勝率(その日の平均diffがプラスだった日の割合)」で見直すと、
2110-2120セクション(単一機種=モンスターハンターライズ)が82.4%(n=17日)という突出した値を示し、実用的な候補として浮上した。

## アクション
```python
# 連続セクション現象を見つけたら
if "N セクション連続プラス" in observation:
    # 1. 完璧基準(全プラス)ではなく日次勝率で再評価する
    # 2. 四半期分割で全プラスが何回維持されるか確認する(0/4なら通期のみの見かけ)
    # 3. ブートストラップで再現確率を出す(10%未満なら脆弱)
    # 4. 勝率が突出するセクションを個別に探す(全体ではなく一部が牽引している可能性)
    action = "完璧基準(全プラス)で頑健性判定せず、日次勝率+四半期分割+bootstrapの3点セットで検証する"
```

## 例
```
2077-2161 (9セクション): 四半期全プラス維持=0/4, bootstrap P(全9プラス)=7.65% → 脆弱
日次勝率で再評価:
  2110-2120 (モンスターハンターライズ単一機種): 82.4%(n=17) → 突出、実用候補
  2088-2098 (からくりサーカス/かぐや様/SAO混在): 61.1% → 機種混在でセクション根拠は薄い
  2147-2150 (東京喰種): 41.8% → 平均以下、既存instinct(全台系は平均差枚で予測不可)にも該当
```

