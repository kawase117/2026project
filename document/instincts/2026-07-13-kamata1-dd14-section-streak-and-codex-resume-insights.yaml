# 蒲田1はhas_aisle=falseのため角番(通路距離)は定義されず、rank_from_min/maxは端番と呼ぶ

## 背景
2026-07-11のリファクタ(コミット088d5d2)で「角番」(通路距離,rank_from_aisle)と「端番」(台番号順の末端位置,
rank_from_min/max)の用語が分離された。蒲田1はhas_aisle=falseのホールでrank_from_aisleが定義されないため、
rank_from_min/maxを使った位置分析は常に「端番」と呼ぶべきで、「角番」は誤用になる。
セッション中に一度「角番クロス」と表現してしまい、ユーザーから訂正が入った。

## アクション
```python
if hall == "kamata1" and analysis_uses in ["rank_from_min", "rank_from_max"]:
    correct_term = "端番"  # 角番(rank_from_aisle)ではない
    # 角番という語を使うのはhas_aisle=trueのホール(蒲田7など)でrank_from_aisleを使うときのみ
```

## 例
```
誤: 「角番クロス(rank_from_min)」
正: 「端番クロス(rank_from_min)」— 蒲田1はhas_aisle=falseのため角番は未定義
```
