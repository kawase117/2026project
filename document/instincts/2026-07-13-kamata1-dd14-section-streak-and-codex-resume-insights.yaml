# codex-companion.mjsのtaskコマンドを直接叩くと--resumeがCodexへの生プロンプト文字列として誤解釈される

## 背景
Codexへの委任タスクが確認質問(閾値選択)で止まった後、再開のために
`node codex-companion.mjs task "--resume-last <指示文>"` をBashから直接叩いたところ、
"--resume-last"という文字列がCLIフラグではなくCodexへの生プロンプトテキストとして渡り、
Codexがリポジトリ内に存在しない"--resume-last"という機能を探し回るという誤動作が発生(約10分・2万トークン以上浪費)。
codex-cli-runtimeスキルによれば、--resume/--effort/--modelなどのルーティングフラグは
codex:codex-rescueサブエージェント経由でのみ正しく解釈される(サブエージェントが内部で
`--resume` → `task --resume-last`のようにテキストを変換してから実際のtaskコマンドを呼ぶ)。
Bashから直接codex-companion.mjsのtaskサブコマンドを呼ぶと、その変換ロジックをバイパスしてしまい、
渡した文字列がそのままCodexへの指示として解釈される。

## アクション
```python
# Codexタスクを--resumeで再開したいとき
if need_to_resume_codex_task:
    # NG: Bashから直接 codex-companion.mjs task "--resume ..." を叩く
    # OK: Agent(subagent_type="codex:codex-rescue", prompt="--resume <指示文>") を使う
    action = "Codexの再開・ルーティングフラグは必ずAgentツール経由でcodex:codex-rescueサブエージェントに渡す。" \
             "codex-companion.mjsをBashから直接叩いてよいのはstatus/resultなどの読み取り専用コマンドのみ。"
```

## 例
```
誤った呼び出し(実際に発生):
  Bash: node codex-companion.mjs task "--resume-last 閾値は...で進めてください"
  → Codexが "--resume-last" をコードベース内の未実装機能として検索し始める(誤動作)

正しい呼び出し:
  Agent(subagent_type="codex:codex-rescue", prompt="--resume 閾値は...で進めてください")
  → サブエージェントが内部で `task --resume-last` に変換して正しく再開
```

