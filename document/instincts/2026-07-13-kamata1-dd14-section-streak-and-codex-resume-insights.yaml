# プールした端番(rank_from_min)の優位は少数セクションのアーティファクトになりやすい

## 背景
蒲田1 DD14の9セクションをプールしてrank_from_min別平均diffを集計したところ、端番1(通路端に相当する末端)が
+502.8枚(n=142)と突出して見えた。しかしセクション別に分解すると、端番1が最強なのは9セクション中1セクション
(2147-2150, +2,652.9)のみで、他3セクションではむしろマイナスだった。プールした集計の突出値は、特定の
小セクション(n=48-57と薄い)の極端な数値が平均を持ち上げていただけだった。
kakuban-not-section-edgeと同系統の「プール集計の落とし穴」。

## アクション
```python
# 角番/端番の効果をプールで見つけたら
if "端番Xが強い(プール集計)" in claim:
    # 必ずセクション別に分解して再確認する
    per_section = groupby(["section", "rank_from_min"])
    # 9セクション中何セクションで同じ順位が最強かを数える
    # 1-2セクションのみが根拠なら「汎用ルール」ではなく「特定セクションの局所効果」と呼ぶ
    action = "プールした角番/端番の優位はセクション別分解で再現するかを必ず確認する"
```

## 例
```
プール集計: 端番1 mean=+502.8 (n=142, 9セクション合算)
セクション別分解:
  2147-2150: 端番1=+2,652.9 (最強、この1セクションが牽引)
  2143-2146: 端番1=+1,023.1 (2位、端番3が+1,309で上回る)
  2077-2087, 2121-2131, 2132-2142: 端番1はマイナス
→ 「端番1優位」は汎用ルールではなく2147-2150という特定セクションのみの局所効果
```

