# みとやのmachine_layoutセクションは各島の両面(2列)を1セクションとして格納しており、y座標で分割しないと異機種が混在する

## 背景
みとや大森町店の machine_layout テーブルは section 列に島単位の範囲(例: "624-657")を持つ。
しかし各主要島セクションはy座標の異なる2列で構成されており、それぞれ全く異なる機種が配置されている。

実測例(section "624-657"):
- y=21 (台番号624-640, 17台): AT機バラエティ混在 (東京喰種IV, バジリスク絆2, スマスロ北斗, 化物語 2nd等)
- y=20 (台番号641-657, 17台): マイジャグラーV 専用

同様に section "658-691":
- y=17 (658-674): マイジャグラーV
- y=16 (675-691): ネオアイムジャグラーEX

section単位でグループ化すると A群/AT群が混在し、誤ったパターン学習の原因になる。

## アクション
- section × y の複合キーを分析単位として使用する:
  `df["section_key"] = df["section"] + "_y" + df["y"].astype(str)`
- これにより "624-657_y20"(マイジャグラー) と "624-657_y21"(AT混合) に自動分離される
- section単位のみのグループ化でA群/AT群を判定した既存スクリプトは結果を再確認すること

## 例
```python
# machine_layout JOIN後に追加
df["section"] = df["section"] + "_y" + df["y"].astype(str)
# 結果: "624-657_y20"=マイジャグラーV, "624-657_y21"=AT混合, "658-691_y17"=マイジャグラーV
```

