# みとやのホール全体median payoutは月次99.3〜100.7%で推移し、hit_rate_104はほぼ全月0%。蒲田7とは根本的に異なる低天井ホール

## 背景
eda/mitoya_section_category_eda.py の Branch C (daily_hall_summary × monthly集計 + レジーム変化検定)。

月次推移(2025-01〜2026-06, n=18ヶ月):
- median_payout: 99.26%〜100.68% の範囲で推移
- hit_rate_104: 2025-07(9.7%), 2025-08(3.2%), 2025-09(3.3%) のみ有値、他は全て0%
- hit_rate_100 (ホール全体が100%超の日): 33〜64%程度で毎月存在
- 直近3ヶ月(2026-04〜06) median=99.84%, hit_rate_104=0.000

レジーム変化検定 (split 2025-07-01):
- 前半 median=99.61%, hit_rate_104=0.6%
- 後半 median=99.93%, hit_rate_104=1.5%
- Mann-Whitney p=0.0581 → 有意なシフトなし(正常: 均質な母集団)

## アクション
- みとやはホール全体が104%を超える日がほぼ存在しない低天井ホール
  蒲田7のようなホール全体好調日の恩恵を期待する戦略は機能しない
- 分析の焦点はホール全体ではなく「セクション/機種レベルの差異」に絞ること
  Branch A のsection-level stable判定が本質的価値を持つ
- hit_rate_104 ≈ 0%はデータ異常ではなく構造的なホール特性
- 全期間split-halfは「均質な母集団」と確認できるため、
  Branch A/B/X_DDS分析の split-half 結果は有効な検証

