## 背景
eda/mitoya_section_category_eda.py Branch A の実行結果で確認。

曜日軸(weekday)での結果: stable sections → 0件（全てq値が高く非有意）
X_DDS軸(is_xdds=1)での結果: stable sections → 5件（q≈0〜0.021）

これは既存instinct「みとやでは曜日要素よりDD要素(7のつく日)の影響が強い」を
EDAで直接検証し支持した結果。

## アクション
- みとやのsection/機種軸EDAでは weekday を主軸に採用しない
- X_DDS = {4, 7, 14, 17, 24, 27} を主軸とすること
- DD group分類(7系/4系/1系/月末/その他)を副軸として使用する場合は
  7系={7,17,27}, 4系={4,14,24}, 1系={1,11,21}, 月末={30,31}, その他 で分類
- weekday分析で「土曜stable」が出た場合は、X_DDS日と土曜の交絡を疑うこと
