# X_DDS日のリフト(+2.27%)はA群が大きいが、AT群が絶対payout高く(101.38%)かつ持続性有意(rho=0.472)。「リフト最大=優先」は誤り

## 背景
eda/mitoya_section_category_eda.py の Branch B (A群/AT群 × X_DDS 2×2 + split-half Spearman)結果。

2×2 summary (machine_days加重):
| category | non_X_DDS | X_DDS   | lift   | hit_rate_104(X_DDS) | n_machine_days |
|----------|-----------|---------|--------|---------------------|----------------|
| AT群      | 99.60%    | 101.38% | +1.77% | 34.7%               | 17,184         |
| A群       | 96.76%    | 99.03%  | +2.27% | 28.3%               | 10,264         |

split-half Spearman (X_DDS日, machine_name単位):
| category | rho   | p値   | n_machines | 判定       |
|----------|-------|-------|------------|------------|
| AT群      | 0.472 | 0.002 | 39         | ✅ 持続性有意 |
| A群       | 0.280 | 0.354 | 13         | ❌ 非有意    |

スクリプトの自動結論「A群を優先」は誤り。理由:
1. A群のX_DDS絶対payout=99.03%は100%未満（期待値マイナス）
2. A群の持続性rho=0.280はn=13と少なく統計的に非有意(p=0.354)
3. AT群は絶対payout101.38%かつ持続性有意

## アクション
- 「リフト(差分)の大きさだけ」でカテゴリ優先度を決定するロジックは採用しないこと
- 優先順位の判定基準: 「絶対payout水準 ≥ 100%」AND「持続性rho p値 < 0.05」AND「n_machines十分」の3つを確認
- X_DDS日のみとやではAT群を機種平均として優先(101.38%, rho=0.472 p=0.002)
- A群のX_DDS payout=99.03%は平均期待値マイナスだが、マイジャグラーV等の個別機種は上回る可能性
  → Branch A のsection-level stable判定(658-691_y17=マイジャグラーV stableなど)と組み合わせ

