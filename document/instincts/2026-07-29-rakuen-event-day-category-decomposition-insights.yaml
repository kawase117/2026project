# 楽園のジャグ82台は工事前エポックで本館1Fの一角に集中し、島=機種の完全交絡がある。A日の投入は位置でなく機種で説明される

## 背景
工事前エポックの楽園ジャグ82台は全て本館1Fの1135-1216範囲に集中しており、
フロア軸は1水準しかなく分析不能だった。さらに各島(section)がほぼ単一機種
（例: 1156-1169=ゴーゴージャグラー3、1197-1216=マイジャグラーV）で構成され、
セクション効果と機種効果が原理的に分離不能。機種間差(wd_normal幅0.137)がB日
リフト(0.01前後)の10倍以上大きく、「どの日か」より「どの機種か」が支配的。

A日(公示型イベント日)の技術介入・AT一般でも同じパターンが確認された。AT一般では
機種のlift_A（沖ドキDUOアンコール+13.6pp、バジリスク絆2天膳+11.9pp等）が
位置属性のlift_A（±1pp程度）の10倍以上。技術介入では末尾7が機械割・BB+RB両方で
有意という唯一の頑健な位置系シグナルとして残ったが、全体としては機種選択の方が
支配的な軸だった。

## アクション
- 楽園の立ち回りは「どこに座るか」より「日ごとにどの機種・カテゴリが動くか」を
  先に確認する。位置ベースの発見（§1のHot/Cold、§2.1cの端番効果等）は全機種プール
  または特定カテゴリの平常時の話であり、イベント日の配分先分析には別途カテゴリ別・
  機種別の検証が必要
- セクション=単一機種という交絡がある場合、同日内残差の「差分」(lift = イベント日 -
  平常日)を取ることで機種構成という時間不変の交絡を相殺できる。ただし機種の入替時期
  が短期間に偏っている場合はこの限りでない
- 技術介入カテゴリはBB+RB(回/1000G)が打ち手の技量では動かないため、機械割との
  併読で「設定投入の署名」を確認できる。AT一般はbb_count/rb_countが機構的に無意味
  なため、この裏取り手段がなく、回転数交絡から逃げられない点は留保として残る

## 例
`eda/rakuen_jugday_attribute_scan.py`（ジャグ×B日、9属性スキャン、lift有意なのは
sec_size=large(13台+)のみ）、`eda/rakuen_aday_at_attribute_scan.py`（技術介入/AT一般
×A日、末尾7が技術介入で機械割+1.656pp[+0.644,+2.551]・BB+RB+0.152[有意]の
両方を満たす唯一の位置系シグナル。**この「末尾7」はA日{11,22,30}全体との比較であり、
「7日(DD7)」とは無関係**。DD7そのものと末尾7の関係は下記 `tail-digit-dd-matching-mostly-refuted` 参照）。

