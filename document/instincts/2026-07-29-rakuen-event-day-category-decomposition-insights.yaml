# 楽園のイベント日はカテゴリ(ジャグ/技術介入/AT一般/ハナハナ)ごとに別のカレンダーを持つ

## 背景
楽園蒲田店を機種内機械割残差でカテゴリ別に割ると、DDごとに全く違う顔を見せる:

| DD | ジャグ | 技術介入 | ハナハナ | AT一般 |
|---|---|---|---|---|
| 30 | +0.99 | +2.50(1位) | +4.56 | +2.41(1位) |
| 22 | +2.19(1位) | +2.50(2位) | +3.70 | +1.70(2位) |
| 11 | +1.93 | +1.96 | +2.99 | +1.60 |
| 25 | +1.67 | -0.53 | -1.86 | +0.77 |
| 15 | +1.49 | -0.78 | -1.42 | -0.94 |
| 5  | +1.94 | -0.13 | -1.74 | -0.64 |

さらに2つの型に分かれる。(A)公示型{11,22,30}は全カテゴリがプラスで回転数も
+1,100〜1,900G増（客が期待して集まる日）。(B)ジャグ限定日{5,15,25}はジャグのみ
プラスで他3カテゴリはマイナス、回転数増加も小さい（客の期待が乗っていない日）。
ハナハナは{7,17,27}という完全に独立したカレンダーを持つ。

セッション初期に「DD30は9ホール中6ホールで上位、楽園だけ19位（ジャグ限定指標）」
から「楽園はDD30に乗っていない」と誤読したが、これは楽園がDD30予算を技術介入・
AT一般に振り、他ホールがジャグ中心構成だったための見かけだった。

## アクション
- ホール単位の単一 `event_dds = {...}` という設計を疑う。カテゴリ軸（ジャグ/AT/
  技術介入/ハナハナ）を持たせて初めて実態を表現できる
- DD別の集計をジャグ限定指標（p56等）だけで行い、他ホールと比較して「乗っていない」
  と判断する前に、必ずカテゴリ別内訳を確認する。台数構成比の違いが結論を反転させうる
- 「差枚が大きい＝高設定」で止めず、「どのカテゴリ・どの機種に配分されているか」まで
  分解する。これがプロジェクトの中核目的（ユーザー指摘、2026-07-29「差枚が大きい、では
  他の客と同じレベルの読みしかできない」）
- 設定投入傾向はホールごとに独立しているため、設定傾向の分析に他ホールを対照群として
  使わない（既存メモリ `feedback-no-cross-hall-pooling` と整合）。ただし「回転数の
  地域共通需要成分」を分離する目的（給料日・天候等）でのみ他ホールを参照するのは可

## 例
`eda/dd_setting_posterior_rank.py`（ジャグp56のホール横断比較）と
`eda/rakuen_aday_at_attribute_scan.py`（技術介入/AT一般のカテゴリ別配分先スキャン）を
参照。document/rakuen_theory.md §3.1a に全カテゴリの数値とカテゴリ別暫定event_dds表を記録。

