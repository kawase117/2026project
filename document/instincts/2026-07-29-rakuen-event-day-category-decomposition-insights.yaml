# hit104率・差枚は回転数の関数であり、「同じ日の中の比較」には使えるが「日そのものの水準比較」には使えない

## 背景
機械割 = 100 + diff/(3*games)*100 なので Var(機械割) ∝ 1/games。回転数十分位で
実測すると平均機械割そのものが82.7%→106.2%と単調に動き、hit104率(P(機械割>104%)超え確率)
は16.1%→54.6%と3.4倍動く（`eda/rakuen_hit104_volume_bias.py`）。BB+RB(回/1000G)も
低回転行に打ち手の打ち切りバイアスが乗り、games十分位で機種内残差が-0.724→+0.643と動く。

ただし回転数は単なるノイズではない。客はAT示唆・ホール告知・過去実績から高設定を予測し
長く座り続けるため、回転数自体が「客の集合的判断」を集約したエンドジェナスな信号である
（ユーザー指摘、2026-07-28）。したがって「回転数が多い日は機械割も高い」こと自体は
アーティファクトではなく実信号でありうる。

一方、同じ理由で回転数は「その日の運」の下流でもある——低設定でもその日たまたま
早い当たりが続けば長く回り、高回転行として記録される。真の設定と真の運の両方が
回転数の高低を生むため、「その日の回転数が高かったこと」を「その日が高設定だった
証拠」として使うのは、証拠と結果を取り違えている（循環）。

## アクション
- DD・曜日など日付そのものを軸にした水準比較（「DD30は高設定日か」等）には、
  差枚・hit104率をそのまま使わない。BB/RB二項尤度による設定事後分布(p56)など、
  回転数を「足切り」でも「統制変数」でもなく尤度の重みとして正しく処理する指標を使う
  （ただしp56も回転数とゼロ相関ではない点に注意、下記 `rakuen-event-day-not-single-calendar` 参照）
- 回転数そのものは予測用の特徴量として使ってよい（前日までの値、または他ホールとの
  相対値として）。「捨てる」のではなく「証拠としての使い方を変える」のが正しい対応
- min_games による当日足切りは、低設定を早期に見切った行を選択的に落とす操作であり、
  評価指標からは撤廃する。同じ情報は「尤度の重み」または「前日までの特徴量」に置き換える
- 同日残差（その日の他台平均との差）は「日レベルの軸」の効果を数学的にゼロへ潰す
  （DD・曜日は日付の関数のため）。日レベル軸を測るときは基準点を「同日の他台」ではなく
  「その台自身の全期間平均」に変える

## 例
楽園の§3イベント日定義{10,11,22,30}は差枚とhit104率だけで決められていたが、
機種内機械割残差の同一日程データを設定事後分布p56で再検証すると、DD30・DD10は
ジャグでは支持されなかった（p56は31DD中19位・12位）。しかしカテゴリ別に割ると
技術介入・AT一般ではDD30が1位で、ジャグの取り分が薄いだけだったことが判明した
（`rakuen-event-day-not-single-calendar` 参照）。

