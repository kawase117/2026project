# 楽園「末尾をDDに寄せる」仮説は網羅検証でほぼ不支持。同日内残差での検出は困難

## 背景
現場の噂（知人談）を桁分解ルール（DD1-9→その数字、2桁で異なる→両桁OR、
DD11/22→末尾ゾロ目全般）で全31日網羅検証した（同日内残差=機械割-その日の同カテゴリ
全台平均、日レベル交絡を除去）。結果は以下の通り、支持されなかった。

- 単一桁の日(DD1-9): 仮説末尾が10候補中上位3位以内に入った割合は11.1%（ランダム
  期待値30%を下回る）。DD2は仮説の末尾2が10候補中最下位という逆方向の結果
- 2桁で異なる日(20日): 有意0/20
- DD11・DD22(末尾ゾロ目): DD22のみ31日中3位で有意(+1.451[+0.033,+2.793])、DD11は
  18位で非有意。ただしゾロ目でないDD8(1位)・DD5(2位)の方がリフトが強く、DD22が
  突出しているとは言えない
- 31検定中有意2件は、31検定を5%水準で行った場合の偶然の期待値(約1.55件)の範囲内

なお `bday-jugday-no-position-signal-machine-dominant` の「末尾7」発見は
A日{11,22,30}全体との比較であり、DD7（7日）そのものとは無関係だった（命名の混同に
注意）。DD7本来の意味で末尾7を技術介入限定で再検証すると、方向は一貫してプラス
（全期間+1.525、前半+2.371、後半+0.576）だが全てCIがゼロを跨ぎ非有意（検出力不足）。

## アクション
- 数字ゴロ合わせ系の噂は「もっともらしいが多重比較で説明できる範囲」であることが
  多い。検証時は必ず候補全体（このケースでは末尾0-9全て、または全31日）に対する
  point-estimateを出し、仮説の対象が候補内で偶然の範囲を超えて突出しているかを
  ランクで判定する。単一セルのCIだけを見て「有意だった」と判断しない
- 「A日{11,22,30}のような複合イベント日カテゴリで見つかった属性効果」と
  「特定のDD単体(例: 7日)で見つかる効果」は別の主張であり、命名・記録時に
  明確に区別する。曖昧な命名（例:「DD7×末尾7」）は後のセッションで混同を生む
- この仮説は再検証の優先度を下げてよい。ただし「同日内残差では捉えられない
  局所的パターン（特定機種・特定フロア限定）」の可能性は完全には排除できない

## 例
`eda/rakuen_dd_tail_digit_matching_scan.py`、
`eda/results/rakuen_dd_tail_digit_matching_scan/`。
document/rakuen_theory.md §3.1c に全結果を記録。
