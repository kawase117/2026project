# カテゴリ(bt_flag等)×末尾のような属性の組み合わせ母集団は、改装の有無に関わらず機種入替で常時流動する

## 背景
楽園蒲田店のDD11×技術介入×末尾7の発見（rakuen_theory.md §3.1b、耐久性検証済み）を
事前登録する前に、2026-07-06の島配列工事後の母集団を確認したところ、
工事前24台→工事後12台（機種10種、232 machine-day/23日）まで縮小していた。

内訳を精査すると、9台は工事前から存在する台番号だが、うち3台
（3137,3147,3197）は工事直前の在籍機種が技術介入ですらなく、技術介入だった
期間はそれぞれ11行・58行・115行という短い間だけだった。つまり「末尾7×技術介入」
という母集団は、物理的な島配列工事とは無関係に、通常の機種入替だけで
数ヶ月単位で入れ替わり続けている。run_backtest.pyのコメントにもある
「みとや39/266台、蒲田7104/715台が30日窓内で機種変更」という既知の base rate と
整合する現象。

## アクション
- カテゴリ(jug_flag/hana_flag/bt_flag)を条件に含む位置・末尾ルールを長期の
  事前登録・フォワードテスト対象にする前に、対象母集団の過去の機種入替頻度を
  確認する。「台番号が同じだから母集団も同じ」とは限らない
- 改装等の単発イベントの前後比較だけでなく、イベントが無くても数ヶ月単位で
  母集団が入れ替わりうることを前提にルール設計する。事前登録のlookback_days・
  min_history_daysだけでは、母集団自体の入替は補正できない
- サンプルが薄い時点（machine-dayが元の発見の5%未満等）での事前登録は、
  根拠のない期待の追認になりやすい。in-sampleの健全性チェックが成立する
  データ量（目安: 元の発見のmachine-dayの1割以上）が貯まってから登録する

## 例
`document/rakuen_theory.md` §3.1b「フォワードテストは保留」を参照。
DD11×技術介入×末尾7は発見として破棄されたわけではなく、工事後データが
60〜90日（目安2026年9〜10月）蓄積してから母集団を再定義し直すまで
`status: watching`のまま保留。
