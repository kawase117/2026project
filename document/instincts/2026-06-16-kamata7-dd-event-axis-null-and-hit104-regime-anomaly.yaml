# kamata7ホール全体で、2025-12-23以降hit_rate_104(全体payoutrate>=104%の日)が実質ゼロになっている(未調査の異常)

## 背景
DD/イベント日軸のhallwide split-half検証([[kamata7-dd-event-axis-null-section-and-hallwide]])で、
split_half_cutoff=2025-12-23を境に、全31DD・全6イベントグループについて
second_half(2025-12-23〜2026年6月、約169日)のhit_rate_104が
cell側・rest側ともに完全に0になっていることが分かった
(first_halfでは0.05〜0.33程度の値があった)。

これは「DDに効果がない」という結論とは別に、
**ホール全体(715台平均)のpayoutrate_pctが104%を超える日が
2025-12-23以降ほぼ消失した**という現象を示している。

タイミングは、[[kamata-seat-regime-change-cross-machine-name-followup]]で見つかった
2180/2182の機種交代日(2025-12-22)とほぼ一致しており、関連の可能性がある
(ただし2台の機種交代だけで715台平均が動くとは考えにくく、
他の要因の可能性も高い)。

## アクション
1. kamata7のhallwide median_payoutrate_pct / hit_rate_104 / hit_rate_100を
   月単位の時系列でプロットし、2025-12-23前後で実際にレベルシフトが
   起きているかを確認する。
2. レベルシフトが確認できた場合、原因を切り分ける:
   - データ収集範囲・対象台数の変化(715台という台数自体が変わっていないか)
   - ホール全体の運用方針転換(複数台の機種入替が同時期に集中していないか)
   - 季節性(12月末〜1月の年末年始要因である可能性)
3. このレベルシフトが本物であれば、338日分の全期間データを
   「1つの均質な母集団」として扱う他の分析(DD軸・曜日軸など)の
   split-half検証は、前後半で分布が異なる集団を比較していることになり、
   stable判定の解釈に注意が必要(false negativeの一因になりうる)。

## 例
```python
# hallwide payoutrate_pctの月次推移を確認する
monthly = daily_hall_summary.groupby(daily_hall_summary['date'].dt.to_period('M')).agg(
    median_pr=('payoutrate_pct', 'median'),
    hit104=('payoutrate_pct', lambda s: (s >= 104).mean()),
)
```

