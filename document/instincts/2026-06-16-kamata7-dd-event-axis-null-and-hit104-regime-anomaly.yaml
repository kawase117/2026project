# kamata7のDD/イベント日軸は、セクション単位(2179-2186)でもホール全体(daily_hall_summary)でも法則性なし(stable=0)

## 背景
CLAUDE.mdのイベント日仮説(1日/7・17・27日/1・11・21・31日/22日ゾロ目/MM=DD強ゾロ目/月末)に基づき、
kamata7で2段階のDD軸検証を実施した。

1. セクション単位(2F 2179-2186、8台、entity_n_dates=338):
   - DD単独31カテゴリ、イベントグループ6種類とも stable=0
   - all_event vs non-event: q_value=0.8171で非有意
2. ホール全体(daily_hall_summary、715台平均、entity_n_dates=338):
   - 同じグループ定義で再検証(個別グループのrest baselineバグ修正後も結果不変)
   - DD単独31カテゴリ、イベントグループ6種類とも stable=0
   - all_event vs non-event: q_value=0.9450で非有意(cell_rate=0.0306, rest_rate=0.0292)

セクション単位・ホール全体のどちらでも、DD/イベント日だけでは
payoutrate(機械割)の強弱を予測できないことが確認された。

## アクション
1. kamata7において、DD/イベント日を単独の特徴量として使うのは避ける。
   weekday軸([[kamata7-2179-2186-weekday-law-rejected-thu-weak-survives]])のような
   「曜日×台」レベルの方が信号が見つかりやすい。
2. 今後DD/イベント日を扱う場合は、単独軸ではなく
   「weekday × event-day」や「machine_regime × event-day」のような
   交互作用軸として検討する(単独では棄却済み)。
3. 他ホール(kamata1など)でDD/イベント日軸を試す場合も、
   今回と同じnull結果になる可能性を念頭に置き、
   早期にstable=0が出た場合は深追いしない。

## 例
```python
# DD/イベント日単独のグループ化では検出できなかった
# -> weekdayや機種レジームとの交互作用として再検討する
df['dd_event_label'] = ...  # 単独では使わない
df['weekday_x_event'] = df['weekday_label'] + "_" + df['dd_event_label']
```

