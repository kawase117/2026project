# グループ別split-half比較では、各グループについて cell_n + rest_n == entity_n_dates を検算するよう指示する

## 背景
kamata_dd_axis_hallwide_deepdive.pyの初回実装で、`all_event`グループの
rest baselineは正しく「全期間 - all_event」(cell_n+rest_n=338)だったが、
個別5グループ(event_7等)のrest baselineは「他のイベント日グループの日数」
(cell_n+rest_n=119)になっており、「通常日との比較」ではなく
「他のイベント日タイプとの比較」になっていた。

この種のバグは、stacked table(イベント行のみ)からrestを作る実装で
発生しやすく、グループ別のq値が一見妥当に見えるため気づきにくい
([[codex-eda-script-prompt-pitfalls-machine-axis]]の追加パターン)。

## アクション
1. グループ別split-half比較を依頼するプロンプトには、
   「各グループでcell_n + rest_n == entity_n_dates(全期間日数)を
   syntheticテストでアサートする」ことを明示的に含める。
2. 実データのレポートでも、グループ別テーブルにcell_n/rest_nの合計列を
   確認し、entity_n_datesと一致するかをレビュー時にチェックする。

## 例
```python
# synthetic test
for _, row in compare.iterrows():
    assert row['cell_n'] + row['rest_n'] == entity_n_dates
```
