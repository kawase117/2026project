# 【解決済み】kamata7のhit104消失は「突然のレジーム変化」ではなく「開店ブースト終了後の緩やかな正常化」

## 背景（元の仮説）
2025-12-23を境にホール全体(加重平均)のhit104が消失。突然のレジーム変化を疑っていた。

## 調査結果（2026-06-26）

### ホール全体加重平均payout（月次）
- 2025-07: 103.70% (hit104=28%) ← 開店ブースト期
- 2025-09: 101.67% (hit104=0%) ← 8月→9月で急低下
- 2025-12: 101.24% (hit104=0%)
- 2026-06: 100.68% (hit104=0%)
→ 12ヶ月にわたる連続的下降。12月22日に急変した形跡なし。

### 個別台レベルのhit104率（1日あたり104%超え台数）
- 2025-07: 282台/日 (39.5%) ← 開店ブースト
- 2025-09: 234台/日 (32.8%) ← 9月以降は横ばい
- 2025-12: 222台/日 (31.0%)
- 2026-06: 215台/日 (30.1%)
→ 104%超え台数は9月以降ほぼ一定（30-32%）。突然の消失ではない。

### 解釈
- ホール全体加重平均が下がったのに個別hit104率が安定 → 「超え幅の縮小」か「低設定台の回収強化」
- ホール側の設定配分の微調整（設定6→設定5など）で説明がつく
- 台数は全期間714台で一定（データ収集範囲の変化ではない）
- 7月→9月の低下が最大 → 開店ブースト（2025年7月開店の蒲田7）の終了が主因

## MLモデルへの影響
- 影響は小さい: vs_otherは全体水準シフトをキャンセルする相対指標
- walk-forward window=90が局所分布に追従するため、トレンドの影響を吸収
- split-half検証の解釈に注意は必要だが、paired differenceベースの検定結果は有効

## アクション
- ~~月次プロットで急変を確認する~~ → 調査完了。急変ではなく緩やかな正常化
- 全期間を均質に扱う分析には依然として注意が必要（前半が高payout期）
- window=90のwalk-forwardが正しい選択であることの追加根拠になった

