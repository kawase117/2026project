# 楽園蒲田の位置軸(角番・末尾・並び)×時間軸は、客の集中(回転数)は確実に出るが、設定の優位は末尾7を除いて検出できない

## 背景
改装後(2026-07-07〜09-30、86日)で、位置の軸(末尾=台番号の下一桁、角番=セクション端からの位置、並び=同機種・同セクションの連番の隣接ペア)を、時間の軸(曜日、日の下一桁D、DD、ゾロ目・強ゾロ目、イベント・公約23系列)ごとに、「その時間の中と外で、位置の効果が違うか」を日付ラベルの並べ替え検定(2000回、曜日の中で入れ替え)で見た。族50本、セル3726。区分はノーマル・BT(RB確率とRB O/E、回転数)、それ以外(機械割=差枚÷3G、回転数。入替後7日以内の新台は除外)。
- 回転数以外では、偶然と区別できない: RB O/E(897セル)でp<0.05は40(偶然なら約45)、機械割(897セル)で46(約45)。BH補正を通る30セルのうち25は回転数の指標。回転数以外で通るのは、7のつく日×末尾7のRB O/E(+0.118、9日、q=0.116)と、3のつく日×末尾5のAT等の機械割(+4.1pt、8日。同じ日の末尾6は-5.2ptで逆向きなので偶然の可能性が高い)の2つだけ。
- 客の集中(回転数)は確実に出る: 「Xのつく日に末尾Xの台」は、10通りすべて(0〜9)で回転数が増える(ノーマル・BTで10/10が正、AT等でも10/10)。7のつく日の末尾7は+113%(ノーマル・BT)と+68%(AT等)、0のつく日の末尾0は+54%と+37%、8のつく日の末尾8は+12%と+13%。非対角の90セルは平均-3%(平常)。
- 設定の優位は、対角のうち末尾7だけ: 対角10セルのRB O/Eは4/10が正(偶然と同じ)、AT等の機械割は1/10が正。7のつく日はホール全体では底上げされていない(ノーマル・BTのRB O/E 0.993、AT等の機械割-0.91pt)。AT等では、7のつく日の末尾7が機械割で最も低い(-2.54pt)。末尾7の優位はジャグラー系に集中する(別のinstinct rakuen-d7-tail7-jug-setting-tilt)。
- ズレ(Xのつく日にYが好調)は、偶然の範囲: 非対角90セルでp<0.05は、ノーマル・BTのRB O/Eで3(偶然なら約4.5、p<0.01は0)、AT等の機械割で5(約4.5)。Dごとに最も高い末尾は、1の日は6、2は3、3は8、4は9、5は6、6は8、8は2、9は5とばらつき、X+1などの規則もない。
- 角番(角1、角2、角3以上): 回転数以外は補正後に通るものがない。7のつく日は、ノーマル・BTで角1が-16%、角2が+19%(回転数)。
- 並び: 隣接ペアの残差の積は、機種全体の強さ(全台系)を引くまで、全台系の公約の日などで高く出た(+0.075、p=0.001)。同機種・同日の平均を引き、3台以上の機種に限ると、補正後に通るものがなく、族でp<0.05はゾロ目日×AT等の1本(負の向き、p=0.038)だけ。
- 検出力は低い。1水準あたり3〜12日で、DDは1日付が2〜3日分。「検出できなかった」であって「ない」ではない。

## アクション
- 「Xのつく日は末尾X」は、客の期待としては実在する。回転数は、その台に集中するので、座れるかを考えるなら、末尾Xの台は埋まりやすい前提で動く。設定の優位は、末尾7のジャグラー以外では、根拠にしない。
- 位置軸×時間軸を機種タイプ別に見るときは、末尾×Dの対角(同じ数字)と、非対角を分けて報告する。総当たりの最小pは、補正後で読む。
- 並びの強さを、隣接台の残差の積で測るときは、同機種・同日の平均を引き(全台系を除く)、3台以上の機種に限る。引かないと、全台系を並びと取り違える。
- 指標を機種区分で変える: ノーマル・BTはRBと回転数、それ以外は機械割(差枚÷3G)と回転数。差枚そのものは、回転数が違う日・台を比べるのに使わない(差枚=3×回転数×(機械割-1))。
- AT機で、特定のイベント・公約の日に特定の機種が使われやすいか、の検証は未着手。予告で凍結された日付だけを使う。

## 例
7のつく日の末尾7のノーマル・BTは、回転数が+113%(7705G対約3000G)、RB O/Eは+11.8%。0のつく日の末尾0は、回転数が+54%だが、RB O/Eは+6.6%(p=0.048)で弱い。
