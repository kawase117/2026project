# 「高分散機種にpayout_rate>=100%を追加する」ことによるQ5-Q1シフトは9ホール中8ホールで正方向に再現する

## 背景
eda/strategy1_placebo_check.py (みとや・蒲田1・蒲田7) と
eda/strategy1_8hall_expansion.py (ARROW池上・ザ-シティ雑色・ヒロキ東口・
レイトギャップ平和島・楽園蒲田・金時京急蒲田) で、walk-forwardの
「戦略1: diff_std>=median(高分散) & payout_rate>=100%」と
「プラセボ: diff_std>=medianのみ(payout条件無し)」のQ5-Q1差を9ホールで比較した。

| ホール | 戦略1 Q5-Q1 | プラセボ Q5-Q1 | シフト(戦略1-プラセボ) |
|---|---|---|---|
| みとや(Xgroup) | +0.059 | +0.003 | +0.056 |
| 蒲田1(日曜) | +0.049 | -0.008 | +0.057 |
| 蒲田7(日曜) | +0.017 | -0.029 | +0.046 |
| レイトギャップ平和島 | +0.015 | -0.038 | +0.053 |
| 楽園蒲田店 | +0.039 | -0.028 | +0.067 |
| 金時京急蒲田店 | +0.026 | -0.035 | +0.061 |
| ARROW池上店 | -0.045 | -0.053 | +0.008 |
| ヒロキ東口店 | -0.040 | -0.048 | +0.008 |
| ザ-シティ雑色店 | -0.036 | -0.034 | -0.002 |

シフトは9ホール中8ホールで正(+0.008〜+0.067)、1ホール(ザ-シティ雑色)のみ
ほぼゼロ(-0.002)。プラセボ(diff_std>=medianのみ)自体はQ1>Q5に偏りやすい
(分散の大きい機種は大負け側にも触れやすい)が、payout>=100%条件を加える
ことでQ5方向への補正が一貫してかかる。

ただし「戦略1自体のQ5-Q1>0(実用可能)」は6/9ホール
(みとや・蒲田1・蒲田7・レイトギャップ・楽園蒲田・金時京急蒲田)のみで、
ARROW・ヒロキ・ザ-シティの3ホールはプラセボのベースが強くQ1偏重
(-0.034〜-0.053)のため、シフトだけでは戦略1も負のまま。

## 追加検証(2026-06-14): 閾値感度分析とsplit-half時系列検証

eda/strategy1_threshold_sensitivity.py (payout閾値95/98/100/102/105 ×
diff_std percentile 50/60/70/75) と
eda/strategy1_splithalf_check.py (前半/後半でのQ5-Q1再現性、payout100%/102%)
で、上記6ホールの「実用可能」判定の頑健性を再検証した。

| ホール | payout=100% (前半/後半) | payout=102% (前半/後半) | 判定 |
|---|---|---|---|
| みとや(Xgroup) | +0.068 / +0.047 | +0.037 / +0.055 | 頑健(両閾値で正) |
| 楽園蒲田店 | +0.054 / +0.025 | +0.064 / +0.022 | 頑健(両閾値で正) |
| 蒲田1(日曜) | +0.019 / +0.023 | +0.068 / +0.091 | 頑健、102%推奨 |
| 蒲田7(日曜) | +0.063 / -0.006(負転) | +0.114 / +0.045 | 100%は不可、102%推奨 |
| レイトギャップ平和島 | +0.003 / -0.004(負転) | +0.057 / -0.063(負転) | **両閾値で負転、不採用** |
| 金時京急蒲田店 | +0.003 / +0.039(弱い) | -0.026 / -0.041 / +0.008(不安定) | **不安定、不採用** |

レイトギャップ・金時京急は当初の9ホール表でQ5-Q1がわずかに正(+0.015/+0.026)
だったが、payout閾値を僅かに変える(100%→102%)、または期間を前半/後半に
分けるだけで容易に符号が反転する。境界線上の正値であり、再現性がない。

## アクション
- 新規ホールで法則①(戦略1)を使う前に、まず「プラセボ(diff_std>=medianのみ)
  のQ5-Q1」を確認する。これが-0.04以下と強くQ1偏重なホールでは、
  戦略1のシフト(+0.05程度)だけでは不十分なため、法則①を主軸スクリーニング
  として採用しない。
- **実用可能ホールは4つに絞る**: みとや・楽園蒲田店(payout>=100%でよい)、
  蒲田1・蒲田7(payout>=102%を推奨。100%では蒲田7が時系列で不安定)。
  レイトギャップ平和島・金時京急蒲田店は法則①を主軸スクリーニングに
  使わない([[kamata-hokuto-strategy1-high-variance-generalizes]]の蒲田1/7記述も
  payout>=102%に読み替える)。
- 新規ホールで法則①を検証する際は、単一閾値・全期間集計だけでなく、
  必ず閾値感度(payout±2-5%、diff_std percentile 50-75)とsplit-half
  (前半/後半)の両方で符号が安定するかを確認する。どちらかで符号反転する
  場合は「採用」と判定しない。
- 「payout>=100%によるQ5方向シフト」という効果量自体は9ホール中8ホールで
  +0.008〜+0.067と一貫していたが、上記の頑健性検証により実用可能ホール数が
  当初の6/9から4/9に下方修正されたため confidence=0.65とした。

