# Non-Stationarity Invalidates Single-Regime ML Models

## 背景
When absolute baseline metrics shift systematically across time (e.g., high-profit rate drops from 29% to 24%), models trained on one regime will fail catastrophically on another, even if relative patterns remain stable. This is not a feature engineering problem — it's a fundamental architectural mismatch.

Example: Regression trained on 29% baseline predicts test data consistently 5pp too high. Classification trained on Regime 1 patterns (when 末尾0 ranked 1st in 40% of days) fails in Regime 2 (where 末尾0 ranks 1st only 25% of days, not because it weakened relative to others, but because baseline dropped).

## アクション
1. **Identify regime transitions early** — Monitor key metrics (baseline high-profit %, absolute performance distribution) for structural breaks
2. **Use regime-invariant predictions** — Prefer Learning to Rank (predict orderings, not absolute values) over regression/classification when baseline may shift
3. **Design time-adaptive learning** — Implement time-decay weighting or expanding-window retraining to automatically down-weight old regime-specific patterns
4. **Validate across regimes** — Always test on out-of-sample periods that may differ in baseline; don't assume train/test are identically distributed
5. **Quantify regime shift impact** — Measure baseline shift magnitude; if >2pp uniform shift, single-regime models will fail

## 例
**Pachinko analyzer tail ranking:**
- Train period (Regime 1): 29-30% high-profit baseline, 末尾 ranking: 末尾0 > 末尾6 > 末尾2 > ... (stable order)
- Test period (Regime 2): 24-25% high-profit baseline, 末尾 ranking: same order, BUT absolute frequencies shift
  - 末尾0: 30% → 25% (5pp drop, same as baseline)
  - 末尾6: 29% → 24% (5pp drop, same as baseline)
  - Relative order unchanged; single-regime regression fails anyway

**Solution:** Use Learning to Rank (predicts relative ordering, invariant to 5pp baseline drop) + time-decay weighting (automatically adapts as Regime 2 data accumulates).

