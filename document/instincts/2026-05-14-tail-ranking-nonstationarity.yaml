# Learning to Rank (LTR) is Robust to Baseline Shifts

## 背景
Classification and regression predict absolute values or categories; when baseline shifts, these fail. Learning to Rank predicts relative ordering (which option is strongest) without caring about absolute values — inherently robust to baseline shifts.

## アクション
1. **Convert to pairwise ranking** — For each day, generate training examples: (tail_i vs tail_j: i wins) based on actual ranking
2. **Choose LTR algorithm** — LambdaRank (tree-based, interpretable), RankSVM (kernel-based), or ListNet (direct ranking loss)
3. **Use ranking metrics** — Evaluate with Spearman ρ, NDCG@k, not accuracy; these measure relative order quality
4. **Combine with time-decay** — Weight pairwise examples by recency; recent days get weight ≈1.0, old days get ≈0.1-0.3
5. **Deploy as ranking pipeline** — For each prediction day, score each option, sort by score, output top-K

## 例
**Tail ranking with non-stationary baseline:**

Regular classification approach (FAILS):
```
Train: "predict which 末尾 is Rank1"
  Regime 1 (29% baseline): 末尾0 is Rank1 in 40% of days
  Regime 2 (24% baseline): 末尾0 is Rank1 in 25% of days (due to baseline shift, not weakness)
  Model trained on Regime 1 overfits to "末尾0 → Rank1"
  Test on Regime 2 → 15% accuracy (worse than random)
```

Learning to Rank approach (SUCCEEDS):
```
Train: "for each day, rank all 末尾 by win-rate; learn pairwise preferences"
  Regime 1: 末尾0 beats 末尾3 in 80% of days (sign: 末尾0 is consistently stronger)
  Regime 2: 末尾0 beats 末尾3 in 78% of days (same signal, robust to baseline)
  Model learns: "末尾0 > 末尾3" regardless of absolute baseline
  Test on Regime 2 → 20% Rank1 accuracy (vs 10% random), stable relative ordering
```

