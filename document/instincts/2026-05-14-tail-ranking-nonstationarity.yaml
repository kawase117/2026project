# Data-Driven Pattern Discovery Supersedes Hypothesis-Driven Assumptions

## 背景
Domain expertise (e.g., "payday effects on machine selection") provides useful starting hypotheses, but must be validated with rigorous statistical testing. If chi-square tests show p=1.0000 (complete independence), the hypothesis is false — period. Don't try to make it work.

User feedback this session: "給料日の考えに固執するのは辞めてください。機械学習での発見を第一に考えてください。" (Stop fixating on paydays. Prioritize ML discovery first.)

## アクション
1. **Formulate hypotheses as testable predictions** — "DD 20-25 has higher 末尾0 frequency" → chi-square test
2. **Use appropriate statistical tests** — Chi-square for independence, t-test for mean differences, Spearman ρ for rankings
3. **Set significance threshold** — p < 0.05 is standard; p=1.0000 means complete independence (hypothesis false)
4. **Abandon unsupported hypotheses immediately** — Don't spend engineering effort on patterns that don't exist in data
5. **Shift to data-driven discovery** — If hypotheses fail, ask "what patterns do the data actually show?" rather than forcing preconceptions

## 例
**Pachinko analyzer payroll hypothesis:**

Hypothesis (intuitive but untested):
- "High-setting machines concentrated around paydays (20-25) to capture salary-inflated players"
- Prediction: 末尾 ranking should differ on paydays vs non-paydays

Statistical test:
```
Chi-square (tail vs DD):
  H₀: tail ranking is independent of DD
  χ² = 0.00, p = 1.0000
  Conclusion: REJECT hypothesis; tail ranking is completely independent of DD
```

Correct response: Abandon payday hypothesis entirely. Focus on what data shows (relative ranking is stable across all dates).

Incorrect response: "Maybe the effect is subtle" or "let's try interaction terms anyway" — wasting engineering effort on false patterns.

