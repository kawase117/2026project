# Relative Ranking Can Remain Stable Even When Absolute Baseline Drifts

## 背景
If all groups shift by the same amount (e.g., all 末尾 drop 5pp uniformly), the relative ranking (which tail is strongest) doesn't change. This is a key insight for designing robust prediction systems: focus on relative comparisons, not absolute thresholds.

## アクション
1. **Monitor absolute baseline** — Track key metrics (high-profit %, overall distribution) to quantify regime shifts
2. **Compare relative signals** — For each entity (tail, machine, etc.), compute its position relative to others, not absolute value
3. **Use ranking-based features** — Prefer "rank within cohort" over "absolute win rate" when baseline may shift
4. **Validate ranking stability** — Compute Spearman ρ between Regime 1 and Regime 2 rankings; high ρ (>0.7) signals stable ordering
5. **Leverage for prediction** — If relative ordering is stable, predict it even when absolute values are unknown

## 例
**蒲田7 tail ranking drift analysis:**

Absolute values (show drift):
```
Regime 1 (high-profit baseline 29-30%):
  末尾0: 30.1%, 末尾1: 29.7%, 末尾2: 30.0%, 末尾3: 28.5%, ...

Regime 2 (high-profit baseline 24-25%):
  末尾0: 25.1%, 末尾1: 25.3%, 末尾2: 25.0%, 末尾3: 23.9%, ...
  ↑ each dropped ~5pp uniformly
```

Relative ranking (shows stability):
```
Regime 1 ranking: 末尾0(30.1) > 末尾2(30.0) > 末尾1(29.7) > 末尾6(29.1) > ... > 末尾3(28.5)
Regime 2 ranking: 末尾0(25.1) > 末尾2(25.0) > 末尾1(25.3)... wait, relative order changed!
                  (Actually: 末尾1 moved above 末尾2; indicates non-stable ranking)
Spearman ρ between Regime 1 and Regime 2 rankings: ≈ 0.65 (moderate stability, not perfect)
```

Implication: Relative ranking is *mostly* stable but not perfectly; use ranking predictions with moderate confidence, not high certainty.

Comparison:
```
❌ Absolute prediction: "末尾0 will reach 30%" (FAILS in Regime 2; reaches only 25%)
⚠️ Relative prediction: "末尾0 will rank 1st" (70% success; sometimes 末尾1 or 末尾2 rank higher)
```
