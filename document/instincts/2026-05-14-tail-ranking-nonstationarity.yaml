# Time-Decay Weighting Handles Regime Drift Without Explicit Detection

## 背景
Rather than explicitly identifying which regime you're in, assign exponential weights to training examples: recent data gets weight ≈1.0, old data gets ≈0.1-0.3. This automatically down-weights regime-specific patterns as time progresses and new regimes emerge.

Advantage: No need to manually detect regime transitions; model adapts continuously.

## アクション
1. **Compute sample weights** — `w(t) = exp(-λ * (T_current - t) / T_total)` where λ ∈ [1.0, 2.5]
2. **Tune decay rate λ** — Grid search; λ=1.5-2.0 typically balances old/new data (80% recent, 20% historical)
3. **Incorporate in training loss** — Weight each training example by w(t); loss becomes `Σ w(t) * L(example_t)`
4. **Retrain frequently** — Weekly/monthly retraining ensures weights stay current as new data arrives
5. **Monitor regime indicator** — Track baseline metric (high-profit %, absolute distribution) to detect if Regime 3 has different baseline

## 例
**蒲田7 tail ranking with time-decay:**

Without time-decay (uniform weights):
```
Train on 150 days total (120 Regime 1 + 30 Regime 2)
Each day equally weighted → Regime 1 patterns dominate (80% of data)
Model overfits to Regime 1 (29% baseline) patterns
Test on Regime 2 (24% baseline) → poor generalization
```

With time-decay weighting (λ=1.5):
```
Train on same 150 days, but with exponential weights
Regime 1 (120 days old, 5 months): weight ≈ 0.15
Regime 2 (0-30 days old, current): weight ≈ 0.85-1.0
Effective training: ~25 Regime 1 + 30 Regime 2 = 55 days equivalent
Model learns Regime 2 patterns strongly, Regime 1 patterns weakly
Test on Regime 2 → much better generalization
```

Retraining schedule:
```
Day 0 (2025-12-31):  T_total = 150, λ=1.5 → Regime 1 weight=0.15, Regime 2 weight=1.0
Day 30 (2026-01-30): T_total = 180, λ=1.5 → Regime 1 weight≈0.10, Regime 2&3 weight≈0.9-1.0
Day 60 (2026-02-29): T_total = 210, λ=1.5 → Regime 1 weight≈0.05, Regime 2 weight≈0.7, Regime 3 weight≈1.0
```
As Regime 3 data arrives, it automatically gains prominence; old regimes fade.

