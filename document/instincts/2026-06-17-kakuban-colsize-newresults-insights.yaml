# Long 列では端点ペア（角1・角16付近）のみ有意、中間効果は出ない

## 背景
2026-06-17: `section_max - section_min + 1` ベースの正しい colsize 定義による再実行結果。
旧検証は **X角番の先行実験**（X座標列台数ビン）として位置づけ直された。section 角番の long bin としては軸がずれており、このセグメントの結論は今回が初めての有効な検証。

significant kakuban（section_max - section_min + 1 ベース）:

| segment | sig kakuban | mean_residual | sections |
|---|---|---|---|
| 2F_long_N | 角1 / 角17 | −136 / −135 | 9 / 7 |
| 3F_long_N | 角16 / 角1 | −230 / −202 | 3 / 3 |
| 3F_long_A | 角1 / 角16 | −134 / −120 | 4 / 4 |

中間台（角2-15）はいずれも q >> 0.05 で非有意。

## 解釈
中間効果が出ない理由（推測）:
1. バラエティコーナー（2F long）では機種投入が角番効果を上書き
2. long 列は台数が多く、中間の差異が平均化されて検出力不足

## アクション
long 列では「角1と末端角（列サイズ-1 以上）を避ける」だけで十分。
中間台の積極的な優劣評価はしない。

