# 機種粒度の全台系検出スコアは少数台機種と新台に構造的に有利

## 背景
G比（機種平均回転数/プール平均回転数）×平均差枚 という全台系検出スコア
（hist_model_gratio_mean_diff、2026-08-01正解ラベル6件で検証済み最上位指標）には
2つの既知バイアスがある。

1. 台数を見ないため少数台機種が有利。みとや2026-08-04でカバネリ17台
   （score+1,339, rank5/36）がやじきた道中記参る！4台（score+2,323, rank1/36）に
   負けた。4台なら2台が跳ねれば平均が上がるが、17台は全台が働かないと上がらない。
   本来検出したい大規模投入ほど不利になる。対抗指標winrate_lb95_gratio（勝率のWilson
   下限95%×G比×平均差枚）を試したが、台数を重く見る方向には動いたものの
   トップの入れ替えには至らなかった（未検証・要継続比較）。
2. 新台はG比が構造的に膨らむ。6ホール・30,039機種日の計測で、導入0-6日は
   G比中央値1.42・平均差枚-315（=平均的には負けている）に対し導入60日+は
   G比中央値0.84・平均差枚+40。それでも閾値+1,800超え率は新台10.5% vs
   既存台4.8%と2.2倍高い。期待値ではなく分散が大きいために閾値超えしやすいだけ
   （「新台は販促で高設定」という通説は支持されない）。

## アクション
機種粒度の全台系スコアでランキング上位を「本物の全台系」と即断しないこと。
- 新台を候補から除外してはいけない（ホールが実際に新台へ全台系を入れる例が
  ツイート予告で確認されている）。除外ではなく age_days で層別し、
  新台と既存台で別々のベースレート（今回の実測: 10.5% vs 4.8%）と比較する。
  単一のベースレートで的中率を測ると新台を名指しするだけで指標が有効に見える。
  ホールの予告は新台を名指ししがちなので、この混同は実際に起きやすい。
- 少数台の高スコアは「機種全体の傾向」ではなく「たまたま跳ねた数台」の可能性を疑う。
  勝率（何割の台が実際にホール平均を上回ったか）も併記して判断する。

## 例
backtest/announce.py の model_scores() は first_seen を渡すと age_days/age_bucket
列を返し、_judge_claims() が model_named 判定に base_rate を併記する。
新指標 winrate_lb95_gratio は zentaikei.metric で選択可能（未検証、並走比較中）。

