# 「1/N⑤⑥」型の主張は機種平均では原理的に検出できない。上位1/N台をホール同分位と比べる

## Core claim
「1/N⑤⑥」（残り(N-1)/Nは低設定）という主張は、機種平均で判定すると平均が
構造的に薄まり全台系用の閾値に原理的に届かない。判定式は機種の上位1/N台の平均を
ホール全体の同じ上位分位（当該機種を除く）と比較する形にしなければならない。

## Evidence
- n_observations: 1日（楽園蒲田 2026-08-07）、2機種（北斗の拳 転生の章2＝20台、
  交響詩篇エウレカセブン＝25台）で「1/3⑤⑥」の予告主張を両方式で判定
- data scope: single-hall（楽園蒲田店）
- metric scope: 機種平均差枚（全台系用の既存 model_named 判定式）vs 上位1/N台平均
  （新設した model_named_ratio 判定式）
- result summary:
  - 転生: 機種平均判定 = **False**（score +1,481 < 閾値1,800、rank6/56）
    / 上位1/N判定 = **True**（上位7台平均+5,606 vs ホール同分位平均+2,587、超過+3,019）
  - エウレカ: 機種平均判定 = False（score +622） / 上位1/N判定 = **False**（僅差、
    上位9台平均+2,360 vs ホール同分位+2,622、超過-262）。当初「台数分布としては
    主張どおり」と評価したが、ホール全体の上位1/3も同水準に高いため誤りだった
  - 2機種で判定式の違いにより1件（転生）で結論が反転した

## Interpretation
- 既存の model_named（全台系用、機種平均が閾値超えか）と model_named_ratio
  （部分投入用、上位1/N台がホール同分位を超えるか）は測っている対象が違う
- 「機種平均が低い」ことは「1/N⑤⑥ではない」ことの証明にならない。むしろ主張が
  正しければ平均は必ず薄まるので、機種平均の低さは1/N型の主張がある限り無情報

## Action
- 予告のclaimを登録する前に、主張が「全台系」型か「1/N部分投入」型かを見分ける。
  「1/2」「1/3」等の分数表現があれば後者として model_named_ratio を使う
- 台単位の設定は結果指標（差枚）から断定できないため、判定は「上位1/N台が同分位の
  ホール水準を超えたか」に留め、閾値超え台数など台単位の指標は参考値扱いにする

