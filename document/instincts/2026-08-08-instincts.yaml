# 分位点閾値で「N件超え」を判定すると恒等式になり反証可能性を失う

## 背景
backtest/announce.py の全台系検出で、「全⑤⑥×2機種あり」という予告を採点するために
機種スコアの95パーセンタイルを閾値にした。全6ホールで baserate を実行すると、
閾値超え機種数/日が例外なく「候補機種数×0.05」に完全一致した（楽園: 候補61.5→超え3.08、
蒲田7: 60.4→3.02、蒲田1: 46.7→2.34、ヒロキ: 43.4→2.17、みとや: 32.0→1.61、雑色: 14.7→0.74）。
分位点で閾値を切る限りこれは定義上の恒等式であり、観測ではない。この閾値のもとでは
「N機種が全台系だった」というclaimは的中して当然（毎日ほぼ自動的に成立）で、
何も検証していないことになる。

## アクション
「件数がN以上」を判定する仕組みを作るときは、閾値を対象と同じ分布の分位点から
決めてはいけない。閾値は外部の物理的・独立な根拠（今回は「設定6・機械割109%×
5000G×全台系のG比1.3〜1.4」という物理推定）から絶対値で固定し、分位点は
その絶対値が妥当かを事後チェックする補強材料としてのみ使う。
「閾値超え件数/日」が「候補数×(1-分位点)」と一致していないか必ず検算すること。
一致していれば閾値の決め方そのものを疑う。

## 例
backtest/announce.py の zentaikei.threshold は絶対値 +1,800 に固定した
（根拠: backtest/announce/README.md「閾値は分位点ではなく絶対値で固定する」節）。
baserate サブコマンドは分位点推定を出すが、それをそのまま threshold として
採用してはならない。

