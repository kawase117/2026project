# 語呂合わせで説明できる日付効果は、既存のDD系イベントカレンダーと交絡しやすい

## Core claim
「8/7=ハナの日」のような語呂合わせが観測されたカテゴリ好調と一致しても、
それだけで語呂合わせを主因と結論してはならない。同じ日が既存のDD/曜日/ゾロ目
カレンダーに載っていないかを必ず先に確認する。日付ベースの軸は互いに交絡する。

## Evidence
- n_observations: 1日（楽園蒲田 2026-08-07）＋工事後エポックでの多日照合（4日）
- data scope: single-hall（楽園蒲田店）
- metric scope: 機種粒度全台系スコア（G比×平均差枚）、島×機種内残差の末尾効果
- result summary:
  - 2026-08-07（8/7=ハナの日）に閾値超え4機種中2機種がハナ系（花の慶次 rank2、
    キングハナハナ-30 rank4）で「語呂合わせが効いている」と最初に結論した
  - しかし同日は DD7 でもあり、既存instinct/台帳の `rk-event-dd-hana`（楽園ハナハナの
    DD{7,17,27}、既に「成立」記録済み、DD7 +449枚/+2.76pp）と完全に交絡していた
  - さらに末尾7効果を島×機種内残差で見ると、工事後(2026-07-06..)のDD7系4日
    （07-07/07-17/07-27/08-07）で JUG +1,006枚 CI[+520,+1491]・HANA +1,854枚
    CI[+660,+3049]、非DD7系はJUG **-141枚**（逆符号）。07-17・07-27はハナの日ではないため、
    **末尾7の機構についてはDD7系仮説が優勢**と判明し、当初の語呂合わせ主因説を格下げした

## Interpretation
- 語呂合わせに残る説明範囲は「8/7に限って花の慶次・キングハナハナが閾値超えの
  全台系になったこと」のみ。末尾の仕掛けはDD7系で説明できる
- 日付軸（語呂合わせ・DD・曜日・ゾロ目）は同じ日に複数重なることが普通で、
  1つの軸で説明がついても他の軸が交絡していないかを確認しないと因果を誤帰属する

## Action
- 語呂合わせを検出したら、その日が既存の instinct / HYPOTHESIS_LEDGER.md に
  記録済みのDD・曜日・ゾロ目イベントと重なっていないか必ず先にチェックする
- 交絡している場合は、語呂合わせでない同種の日（例: DD7系だがハナの日でない
  8/17・8/27、ハナの日だがDD7でない9/7）で追試して切り分ける
- 効果が複数の候補日にわたって観測される場合（今回の末尾7×07-07/07-17/07-27/08-07）
  はDD系の説明を優先する。語呂合わせは単発（月に1〜2回）でしか成立しない説明力の弱い軸

