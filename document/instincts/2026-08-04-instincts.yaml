# ホール平均差枚は1台の異常値だけで符号が反転しうる。集計前に外れ値を確認すること

## Core claim
台数の少ないホール（数百台規模）では、極端なG数・差枚を持つ単一台（データエラー含む）が
ホール全体の平均差枚の符号を反転させることがある。ホール全体の判定（プラス日/マイナス日）を
出す前に、上位・下位の外れ値台を個別に確認する必要がある。

## Evidence
- n_observations: 1回（2026-08-03、蒲田1）
- data scope: single-hall（マルハンメガシティ2000-蒲田1）
- metric scope: diff（ホール平均差枚）
- result summary: 台2427(新鬼武者3、G数27,671・差枚-79,900、ユーザー確認済みデータエラー)を
  含めるとホール平均-74.2枚(365台)、除外すると+145.1枚(364台)。1台の除外で
  ホール全体の判定がマイナス日からプラス日に反転した。104超率(payoutベースの比率指標)は
  この1台の有無でほぼ変化しなかった（金額ベースの指標だけが感応する）。

## Interpretation
- 平均差枚のような金額の総和・平均をとる指標は、比率指標（104超率・プラス台率）より
  少数の極端な台に弱い。同じデータでも指標によって外れ値への感応度が違う
- 台数が少ないホール・当日母数が少ないカテゴリほどこの影響が大きい。全ホール一律の
  閾値は設定できないが、ホール平均を報告する前に上位・下位数台のG数と差枚を目視すること
- このケースは検証済みのデータエラー（ユーザー確認）だったが、外れ値が本物の実績
  （例: 大量差枚が出た1台）である場合は除外してはいけない。除外の可否は
  データの正当性で判断し、値の大きさだけで機械的に外れ値除去しない

## Action
1. ホール全体の平均差枚・機械割を算出する前に、その日の最大・最小差枚の台を確認する
2. 除外はデータエラーが確認できた場合に限定し、除外の理由をログに残す
   （「今回のみ」であることを明記し、恒常的なフィルタにしない）
3. 台の増設・入替直後の日は、新規追加された台にG数0（当日未稼働）の行が
   複数含まれることがある。母数（総台数 vs 集計対象台数）が指標によって異なりうるため、
   平均差枚の母数と104超率の母数（payout算出可能台数）を分けて明記する

