# ホール関連ツイートは「事前予告」と「事後の結果報告」を投稿内容で区別しないと採点が無意味になる

## Core claim
Xの投稿は見た目が似ていても情報の種類が違う。「リアルアイ予想」等の見出しがある投稿だけが
事前予測で、単に当日の機種別実績（台数・平均差枚・プラス比率）を列挙した投稿は事後の結果報告
であり、これを「予告」として的中率評価に使うと、結果が結果と一致するのは当然という
無意味な検証になる。

## Evidence
- n_observations: 1回（2026-08-03の答え合わせで発生）
- data scope: 全ホール共通（Xの晒し・実況アカウント投稿全般）
- metric scope: n/a（方法論上の誤り）
- result summary: 蒲田1・蒲田7に関する@999999Q9Qの2投稿を「予告」として的中率を評価し、
  「晒し屋の予告が統計モデルを圧倒した」という結論を出したが、ユーザー指摘により
  両投稿とも既に確定した当日実績の事後報告（全台系・ニブイチ列の結果発表）だったと判明。
  実際の事前予告は同じ8/3の別投稿（リアルアイ予想、蒲田1のみ）1件だけだった。

## Interpretation
- 予告と結果報告は使い道が違う。予告は「予測情報源」として的中率で評価する対象。
  結果報告は「その日ホールが何をしたか」を教える**正解ラベル**として使う対象で、
  的中率評価には使えない（自分自身が正解なので必ず一致する）
- 見分け方: 投稿に予想・見立てである旨の明示（「予想」「リアルアイ」等）があるか、
  時系列的に当日の営業終了後・実績数値を伴う報告になっているかを確認する。
  文体やアカウントの信頼度だけで判断しない
- 同一アカウントが予告と結果報告の両方を出すこともあるため、「誰が書いたか」ではなく
  「投稿の中身が予測か報告か」で毎回判定する

## Action
1. ホール関連ツイートを台選び・答え合わせの根拠に使う前に、その投稿が
   「エントリー前の予測」か「結果が出た後の報告」かを明示的に確認する
2. 結果報告は正解ラベルとして蓄積してよい（機種別104超率・機械割のばらつきを見る材料）が、
   これを予測情報源の的中率として扱わない
3. 予告アカウント・予告文言の的中率を追跡したい場合は、事前予測が明確な投稿
   （「予想」等の見出しを持つもの）だけを対象に絞ってから集計する

