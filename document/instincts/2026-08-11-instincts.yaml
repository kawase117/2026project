# 位置効果は「同一位置での機種入替」と「同一機種の位置移動」でしか識別できない

## Core claim
セクション間のランキング比較は候補数ぶんの選択バイアスを受けるため、上位に来ただけでは
位置効果の証拠にならない。バイアスを受けないのは **(1) 同一位置で機種が入れ替わっても
エッジが残るか** と **(2) 同一機種が別位置へ移動したらエッジが消えるか** の2つだけで、
位置仮説の識別はこの2つで行う。どちらの履歴も無い位置は、位置と機種が完全交絡しており
現データでは識別不能である。

## Evidence
- n_observations: 1ブロック（楽園蒲田 2247-2250、工事後33日）
- data scope: single-hall（楽園蒲田店、2026-07-06 工事後レジーム）
- metric scope: 総和ベース出率の対ホール差（pp）
- result summary:
  - **(2) 同一機種の移動**: うみねこのなく頃に2 が 2247-2250（7/7-7/23、+2.21pp 勝率73%
    中央値+2.35）から隣接 2243-2246（7/24-8/8、**-2.46pp** 勝率38% 中央値-3.66）へ移動し、
    **符号反転 -4.67pp**。機種は不変で位置だけが変わった
  - **(1) 同一位置の機種入替**: 同ブロックの占有3機種すべてがプラス。
    うみねこ +2.21 / 鉄拳6 +4.69 / バンドリ！ +6.85
  - **対照（ランキングは弱い）**: 68セクションの split-half（奇数日 vs 偶数日）は
    spearman **+0.157 p=0.20**、符号一致 40/68=59%。ランキング2位の 2247-2250 自身も
    odd +0.41 / even +7.49 と不安定

## Interpretation
- **位置軸が全般的に復活したのではない**。split-half が非有意である以上、
  [[2026-08-01-rakuen-post-reno-model-not-machine]] の「楽園は位置軸（端番・セクション）が
  全滅している」は工事後も維持される。本件は単一ブロック限定の例外主張であり、
  この instinct はあちらを supersede しない
- ランキング上位であること自体は証拠ではない。68個から2位を選べば偶然でも起こる。
  効いているのは (1)(2) の位置内反復のほう
- **島単位でも台は選べない**。バンドリ！5日で台×日20件中プラス11件（**55%**）に対し、
  4台合計では5/5日プラス。当たり台が 2247→2250→2248→2249 と日替わりで巡回しており、
  事前にどれかは当てられない。[[2026-08-01-rakuen-post-reno-model-not-machine]] の
  「機種は選べ、台は選ぶな」が島粒度でも成立する
- ⚠️ **フォワード初日は外れている**。2026-08-10 の凍結plan
  （`rakuen_block2247_position_follow`）は mean_edge **-225枚/台**、1/4台のみプラス。
  30日中1日目なので結論ではないが、この主張は現時点で **未検証** である

## Action
1. 位置仮説を立てたら、結論を書く前に必ず履歴を2方向で洗う。
   (a) そのブロックで機種が入れ替わった日があるか。(b) その機種が他位置へ移動した日があるか
2. どちらの履歴も無ければ「位置と機種は交絡しており識別不能」と明記し、
   ランキング順位を根拠に本物と断定しない。フォワードで待つ
3. 位置ブロックを推奨するときは **島を指定し、島内の台は指定しない**。
   「島は毎日プラス」と「台は毎日プラス」を区別して伝える（前者だけが正しい）
4. 機種の移動履歴は `machine_detailed_results` を machine_name で全期間グルーピングし、
   台番号集合が変わった日を拾えば出る。レイアウトは `machine_layout_history` が正本で、
   `load_frame()` が日付範囲で正しく結合する（単一スナップショットの `machine_layout` は
   工事をまたぐと誤る）

