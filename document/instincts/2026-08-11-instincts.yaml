# 予告は層に分けて読む。「数の主張」の無情報を理由に「母集団の絞り込み」まで捨てない

## Core claim
ホール予告は多層である。「全台系がN機種ある」という **数の主張** は baserate と同水準に
なりやすく情報量ゼロだが、同じ投稿に併記される **母集団の絞り込み条件**（「6台以下から」
「未対象機種から」）は反証可能で情報量が大きい。数の主張の無情報を理由に投稿全体を
棄却してはならない。また `CLAIM_TYPES` に表現手段が無いことは、**予告に情報が無いこと
ではない**。実装の限界と情報量の欠如を混同しない。

## Evidence
- n_observations: 1回（2026-08-09 楽園蒲田、kawasakislot）
- data scope: single-hall（楽園蒲田店）
- metric scope: 機種別の台数カウントと平均差枚（DB 20260809、`load_frame`）
- result summary: 「3台以上設置機種から全⑤⑥×2機種」は直近60日 baserate で閾値超え
  中央値2機種/日 → 情報量ゼロという判定は **正しかった**。しかし同じ投稿の
  「毎日仕掛けは6台以下かつ未対象機種から」を一緒に切り捨てた結果、登録を見送った。
  実績は下表のとおりで、絞り込み条件のほうは的中していた。

  | 機種 | 台数 | 既対象か | 実績 | 予告ルール |
  |---|---|---|---|---|
  | バジリスク絆2 天膳 | 4台 | 未対象 | +3/4台 平均+2,441枚 | 毎日仕掛け枠に**完全合致** |
  | 化物語 | 9台 | 8/1・8/2 既対象 | +4/9台 平均+900枚 | 6台超・既対象 → **取材枠** |

## Interpretation
- 見送りの決め手にしたのは「台数フィルタは `CLAIM_TYPES` のどれにも当てはまらず
  機械的に採点できない」だった。これは **announce.py に表現手段が無い** という実装の話で、
  **予告に情報が無い** ことではない。この取り違えが直接の原因である
- 同じ誤りが機種系列の読み方にも出た。「8/1〜8/7 で重複が無いのでローテーションしており
  特定不能」と結論したが、化物語は 8/1・8/2・8/9・8/10 と **10日で4回** 対象化している。
  ローテーションしていたのは毎日仕掛け枠だけで、取材枠は同一機種を繰り返す。
  **枠を分離せず1本の系列として見たことが誤り**
- 発信者が複数の選定枠（毎日仕掛け / 取材）を持つ場合、対象機種の履歴は枠ごとに
  別系列として扱う。混ぜると「規則性なし」に見える

## Action
1. 予告を読んだら主張を層に分ける: **数** / **母集団の絞り込み** / **機種の名指し** /
   **位置**。数の層だけを baserate と比べて投稿全体を棄却しない
2. `CLAIM_TYPES` で表現できない条件は、棄却理由にせず `claims[].note` に自然文で残す。
   「n台以下」「直近N日で未対象」を表現する claim type の追加を検討する
3. 発信者が複数枠を持つなら枠ごとに系列を分けて履歴を取る。1系列にプールしない
4. 登録を **見送った** 判断も `backtest/announce/RETROACTIVE_NOTES.md` のカテゴリ2に残す。
   台帳には登録したものしか載らないので、外した見送りは記録から消え、
   発信者の実力と我々の判断力を取り違える

