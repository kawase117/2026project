- id: 2026-10-04-tail-balancing-needs-rb-and-tail-vs-machine-split
  trigger: "末尾の均し・ローテーション・『差枚が貯まった末尾はしばらく避ける』を調べるとき。末尾の予告（末尾7が1/2など）の答え合わせ。蒲田7のノーマル機の次の末尾を予測するとき。『末尾に法則は無い』と結論したくなったとき"
  confidence: 0.7
  domain: methodology
  source: session-observation
  project_id: 2026project
  project_name: pachinko-analyzer

  title: 末尾の法則はノーマル機のRBで測り、末尾単位か1台単位かを「同じ末尾の別機種 vs 別末尾」で切り分ける

  core_claim: |
    末尾の法則を差枚で測ると、AT機の揺れと当日のホール全体の上下に埋もれて見えない。
    ノーマル機（machine_master.bonus_judgeable=1）の RB を、機種ごとの RB 期待値からの z で
    末尾別に合算すると見える。また「貯まった末尾は翌日弱い」は、1台ずつの「出た台は下げる」や
    ホール全体の予算でも同じ形になるので、それだけでは末尾単位の管理とは言えない。同じ末尾・別機種の台の
    直近合計と、別の末尾（対照）の台の直近合計を並べて回帰し、その差（日ごとのまとまりを考えた誤差）で判定する。

  evidence:
    n_observations: 9
    data_scope: hall×day×tail（9ホール、2025-01〜2026-09。ヒロキは末尾4・9が無く除外）
    metric_scope: diff_coins_normalized と rb_count（機種期待値からのz）
    result_summary: |
      差枚では蒲田7・みとや・ARROW に「貯まった末尾は弱い」が出たが、別末尾の対照と差が無く
      1台単位か予算だった。ノーマル機RBでは蒲田7だけ末尾単位で均す（同じ末尾の別機種 vs 別末尾
      差 t=-4.3、月内のばらつき偶然の0.80倍 p=0.002、前半・後半とも再現 z+0.26/+0.17）。
      楽園は7のつく日→末尾7が RB で z+1.04（差枚では+45枚）。予告で末尾を名指しした楽園12日は
      RB z平均+2.68（11/12）なのに、差枚採点は 8/7 を miss にしていた。

  interpretation:
    - 末尾は「差枚で見えない＝無い」ではない。ノーマル機RBで測り直す
    - 末尾単位か1台単位かは、同じ末尾の他台の効果が別末尾の対照より強いかでしか言えない
    - 末尾の法則はホールごとに逆向きもある（みとやは同じ末尾を続ける）。ホールをまたいで混ぜない

  action:
    - 末尾の分析は ノーマル機RB と 差枚 の両方で出し、差枚だけで「無い」と書かない
    - 「均している」と書く前に、同じ末尾の別機種 vs 別末尾の対照で切り分ける
    - 蒲田7は事前登録 k7_normal_tail_rb_due3（2026-09-30〜フォワード）の結果で採否を決める。過去データの数字を採否根拠にしない
    - 末尾の予告の採点は announce.py の rb_normal（同じ日・同じ機種の台との RB z）も見る

- id: 2026-10-04-result-image-numbers-before-asking
  trigger: "結果発表の画像（台データ画面・表）から台番号と機種名を読み取ったとき。画像の機種名とDBの機種名が合わない台を一覧にしてユーザーに確認する前。『どの台か決められない』と書きたくなったとき"
  confidence: 0.8
  domain: data-quality
  source: user-correction
  project_id: 2026project
  project_name: pachinko-analyzer

  title: 画像の台番号は回転数・BB・RBで照合し、画像の文脈（ゾロ目・末尾・並び・機種一）で候補を絞ってから聞く

  core_claim: |
    画像の機種名・台番号の読み取りは画質で崩れる（北斗物語＝化物語、2012＝2022、2180＝2160、2123＝2132）。
    回転数・BB・RB は DB と完全一致することが多く、決め手になる。ただし台番号が飛び飛びの画像（機種一など）で
    ホール全体と比べると偶然の一致が起きる。候補を、画像の文脈（末尾ゾロ目の発表ならゾロ目の台、末尾○なら
    その末尾、並びなら連番、ユーザーの「203X のGODかからくり」なら その数台）に絞って比べると決まる。

  evidence:
    n_observations: 30
    data_scope: 999999Q9Q・slokotae7・datagasubete の結果画像（2026-06〜09、楽園・蒲田7・蒲田1）
    metric_scope: extraction_panels（games/bb/rb）と machine_detailed_results
    result_summary: |
      数字の照合で台番号を確定 0 → 3,418台、要確認 321 → 0台。ユーザーが『決められない』としかけた
      203X/207X/212X/218X は、候補の数台と比べて全部決まった（GOD 2038 は 6,395G/RB51 で完全一致）。
      失敗の型: 数字の読み直しが台番号を連番に置き換える、ボーナスの数字が1つしか出ない画面を BB 欄に入れ
      RB を全部0にする、左右2機種の画面を1機種と読む、同じ画像を2回読み取って記録が重なる、読み取りが
      たまたま空の数字を返す（0台の画像の約4割）。

  interpretation:
    - 名前が合わない＝台が違う、ではない。数字で台が確定すれば名前の読み違い
    - 数字だけで遠くの台に直すのは危ない（ウルトラミラクル→2222 邪神ちゃん）。名前も合うか、番号が近いときだけ自動
    - ユーザーの答えは即座に document/registry/RESULT_NUMBER_FIXES.jsonl に書く（記録しないと同じ質問を再度出す）

  action:
    - 要確認の一覧を出す前に、画像の文脈で候補を絞って数字で照合し、決まったものは決めてから残りだけを聞く
    - 決め方は台帳に「ユーザー確認」と「数字で確定」を書き分ける。外す台は to=null
    - 照合の仕組みは backtest/result_corpus.py（_match_panel・_image_number_rule・number-proposals）。自前で書き直さない
