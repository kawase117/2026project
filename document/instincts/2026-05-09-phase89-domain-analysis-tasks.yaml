# 機種別（model_type）の投入パターン差

## 背景
Phase 5 検証で「全ホール統合より機種別個別モデル」が+2.44% AUC向上したという実績がある。これは**機種ごとに異なる投入戦略**が存在することを示唆する。DD・days_since・効率の投入パターンが機種別に異なる可能性。

## アクション
1. 主要機種（上位5-10機種）ごとにDD分布を可視化
2. 各機種の days_since_rank1 平均値の比較（周期が機種で異なるか？）
3. 機種別の efficiency 特性を分析（クセのある機種の特定）
4. 機種別に最適化したサブモデルの構築を検討

## 期待される発見
- 機種別の投入戦略の多様性（例：A機種は月中心、B機種は給料日前）
- 機種によって最適なRecall閾値が異なる可能性
- 「TOP_5」の定義が機種別に異なるべき理由の発見

