# days_since（高設定サイクル）検証

## 背景
高精度予測機械の days_since_rank1 (前回高設定からの経過日数) の平均値が11.7日という結果は、**約2週間サイクルで高設定が投入される**ことを示唆する。これは固定的な定期投入戦略の存在を強く示唆する。

## アクション
1. 機械ごと・ホール全体で高設定投入の時間間隔を時系列で可視化
2. 実際に7日・14日・21日などの固定周期パターンが存在するか検証
3. 周期が機種別（model_type）に異なるかを確認
4. days_since = 7-21日の範囲に限定した場合のモデル精度向上度を測定

## 期待される発見
- 店側の定期的な投入スケジュール（毎週？隔週？）の発見
- 機種別投入戦略の周期性の違い
- Recall固定での精度を更に高める閾値条件の発見（days_since + DD の組み合わせ条件）

