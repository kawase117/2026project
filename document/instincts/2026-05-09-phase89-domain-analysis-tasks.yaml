# 確度スコア（y_pred_proba）の分布分析

## 背景
各モデルの y_pred_proba（予測確度スコア 0.0-1.0）の分布を分析することで、モデルの自信度がどの程度キャリブレーションされているか、または過度に確信的か（overly confident）を評価できる。また、スコア分布から最適な閾値を発見する手段となる。

## アクション
1. 全6モデル × 全3ターゲット × Recall固定時の y_pred_proba ヒストグラム生成
2. y_pred_proba と実績（TP/FP）の相関度を測定（信頼度スコアが高いほど本当に高設定か）
3. キャリブレーション曲線を生成（予測確度と実績一致度）
4. モデル間の自信度の違いを比較（例：Neural Networkは極端な値を出すか？）

## 期待される発見
- モデルの自信度が現実とどの程度ズレているか
- 最適な確度スコア閾値の再発見
- ユーザー向けスコア提示時の信頼度表現方法の改善

