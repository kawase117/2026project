# 時系列（月単位・週単位）の投入パターン変化

## 背景
現在の分析は全期間のデータを統合した結果だが、**時間とともに投入パターンが変化している可能性がある**。例：最初は18日集中だったが、4月下旬に戦略が変わったなど。月単位・週単位で投入パターンの推移を観測することで、ホール側の戦略進化を捉えられる可能性。

## アクション
1. データ期間を月単位に分割し、各月の DD・days_since・efficiency 分布を比較
2. 週単位でも同様に分析（より短周期の変動を捉える）
3. 投入パターンの「大きな転換点」をグラフから特定
4. 転換点の背景を推測（新しいイベント、機種入替、競合店の影響など）

## 期待される発見
- ホール側の戦略進化・最適化プロセスの可視化
- 現在進行中のホール戦略の特定（最新の投入パターン）
- 予測モデルの再学習タイミングの発見（月1回？月2回？）
