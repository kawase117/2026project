# 偽陽性（False Positive）根因分析

## 背景
CatBoost + Top_5 + Recall=10% で、予測数183台のうち実TP(true positive)は32台、FP(false positive)は151台。つまり**約83%が偽陽性**。これらのFPの特性を理解することで、除外条件を発見し精度を向上させられる可能性がある。

## アクション
1. FP 151台の特性をTP 32台と比較（DD, days_since, efficiency, games等）
2. TP台とFP台の明確な境界特性を検出（例：efficiency > 50% は常にFP等）
3. FP台に共通する特徴パターンを抽出（例：初出現機械、営業初日など）
4. 除外ルール（DD範囲、days_since範囲、効率閾値等）を構築してFP削減

## 期待される発見
- FP削減ルール（Precision向上）
- 学習データ中の偽ラベル候補の発見
- 高設定の「本当の定義」の再考（上位5機種より狭い定義が必要？）

