# DD（日付）集中度分析

## 背景
Phase 8-9 Recall固定精度比較分析で、CatBoost + Top_5 + Recall=10% の高精度予測機械の特性を分析した結果、**DD（月内日付）の平均値が18.4日**に集中していることが発見された。これは給料日（25日）前の集客対策、または月半ばの定期リセットなどの戦略的投入を示唆する可能性がある。

## アクション
1. ホール内でDD別のヒートマップを生成（1-31日の各日における高設定投入数）
2. 給料日（25日）、初日（1日）、末日（30/31日）、月半ば（15日）など戦略的な節目との相関を検証
3. 複数ホール間でDD投入パターンが異なるかを比較
4. 時系列でDD投入パターンが変化するかを確認（例：最初は18日集中だが、時間とともに分散）

## 期待される発見
- 店側の給料日・イベント日前後の戦略的投入パターンの定量化
- ホール別投入戦略の多様性の確認
- 客の行動周期（給料日前後の来店）との一致度検証

