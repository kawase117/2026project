# モデル間の予測一致度分析

## 背景
6つのモデル（XGBoost Baseline, XGBoost Balanced, CatBoost, RandomForest, Stacking, Neural Network）が存在する。各モデル個別の精度が15-17%であっても、**複数モデルが同じ台を指摘した場合のPrecisionは大幅に向上する可能性がある**。

## アクション
1. 全機械に対して6モデル全ての予測を実行（Recall=10%固定で3モデル以上が合意した台を抽出）
2. モデル合意度別（6モデル全て合意、5モデル、4モデル...）のPrecision遷移を測定
3. 最適な「合意モデル数」の閾値を発見（例：4モデル以上合意で Precision 25%等）
4. 合意度が高い台の特性（DD, days_since等）を分析

## 期待される発見
- Ensemble効果による精度向上度（15% → 20%+への可能性）
- モデル間の多様性と相補性の評価
- 実運用で実現可能な「複数モデル投票」戦略の構築

