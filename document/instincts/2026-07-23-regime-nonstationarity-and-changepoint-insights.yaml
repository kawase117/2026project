# 帰無を棄却できなかったら、既知振幅を注入して最小検出振幅を測る。それをせずに「無い」と言ってはいけない

## 背景
「棄却できない」は「効果が無い」ではなく「あっても見えない」かもしれない。区別するには検出力が要る。実データの日次系列（＝本物のノイズ）に振幅±A・周期75日の矩形波を人工的に注入し、p<0.05 になる最小振幅を測ればよい。

2026-07-23の検証では、この測定で判定が分かれた。蒲田7・雑色は±150枚以上のレジームを棄却できる検出力があったので null に情報量があった。一方みとやのイベントDD限定ルールは±800枚でようやく p=0.04 で、**検出力ゼロ＝判定不能**だった。この区別をせずに「全ホール null」と書いていたら誤りになるところだった（実際その後みとやは強い非定常が確認された）。

既存 instinct `feedback-statistical-certainty-calibration` の「非有意でも効果なしと断定しない」を、具体的な測定手順として実装したもの。

## アクション
1. null を報告するときは必ず detect_limit（最小検出振幅）を併記する。単位は指標に合わせる（枚 / pp / z）。
2. 検出限界が実務的に意味のある効果量より大きいセルは「判定不能」と書く。「効果なし」と書かない。
3. **有意なセルの detect_limit は信用しない。** 既に閾値付近にある系列は微小な振幅注入で p<0.05 に到達するため、その値は検出力ではなく「もともと有意だった」ことしか示さない。検出限界として意味を持つのは明確に null のセルのみ。
4. エントリー日が疎なルール（イベントDD限定など）は検出力が壊滅的に落ちる。全日プローブに置き換えられないか先に検討する。みとやは143日→555日で判定不能から p=0.0000 に変わった。

## 例
蒲田7 rb_top3: ±200枚で p=0.01、±100枚では p=0.20（検出限界≈±150枚）。みとや eventDD: ±800枚でようやく p=0.037（検出力なし）。

