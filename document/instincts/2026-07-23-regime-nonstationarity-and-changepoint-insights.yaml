# レジームは循環しない。法則は長期安定して一度きり終わる。破断は店長交代・工事など外部イベントに駆動される

## 背景
当初の仮説は「ホールは2〜3ヶ月の短いスパンで法則を入れ替えている」だった。実際に観測されたのは違う形だった。

みとやジャグの角番1優位は **2025-01 から 2026-04 まで16か月間 +0.327z [+0.296, +0.360] で安定**し、2026-04-27 に消失した（後期 +0.013z [-0.050, +0.073]）。循環ではなく一度きりの構造破断。しかもユーザー情報によれば同時期に**店長交代**があった。

さらに、破断日を未知として全候補スキャンする変化点検出を4ホール22系列に当てたところ、**有意な破断はみとやジャグの1件だけ**だった（p=0.0135、2指標独立で同じ日付を検出）。他17系列は p>0.24。

つまり破断はデータ内在的な周期現象ではなく、外部の観測可能な事象に駆動されている。

## アクション
1. レジーム追随（常にレジームを推定し続ける仕組み）を作らない。潜在変数としてのレジームは60日窓でしか推定できず2〜3ヶ月のレジームには間に合わない。
2. 代わりに「安定した法則を使い続け、**死んだことを検知する**監視」を持つ。事後検知で足りる。16か月効く法則なら3か月遅れの検知でも十分価値がある。
3. 破断日は**ホールイベント（店長交代・工事・リニューアル・チェーン方針変更）を候補として事前指定**して検定する。事後スキャンは多重比較補正の代償で検出力を大きく損なう。
4. このイベント情報を持っているのはデータではなくユーザー。分析前にホール側の出来事を聞く。
5. みとやのパターンを他ホールに般化しない。破断は個別事象であり、他3ホールの既知セオリーは現時点で生存している。

## 例
backtest/results/regime/changepoint.csv。みとやジャグ: 破断日2026-04-27、payout +2.679→+0.969pp / rbz +0.332→-0.003z、ともに p=0.0135。近接非有意例の蒲田7ジャグ(p=0.066)は全期間の角番1効果が -0.002pp ≈ 0 なので「存在しない効果の死亡」で意味を持たない。

