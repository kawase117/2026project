# 位置効果は同日×同機種平均からの残差で測る。同日×同カテゴリ平均では機種構成が混入する

## 背景
AT一般は機種構成が不均質（蒲田7で58機種、楽園で134機種）。同日・同カテゴリ平均からの残差では「角に置かれている機種がそもそも機械割の低い機種だった」という交絡を除去できない。同日**かつ同機種**の平均を引けば機種差が消える。

また差枚だとカテゴリ間で分散スケールが5倍近く違い（蒲田7: AT一般 SD=3278 vs ハナハナ 1469）比較できないので、機械割ppを使う。

## アクション
1. 位置効果の主指標は「同日×同機種平均からの機械割残差(pp)」にする。
2. その機種が同日に1台しかない行は落とす。残差が定義上0になり効果を薄める。
3. **設置台が全てその位置にある機種は残差が構造的に0になる**（楽園の戦国†恋姫が該当、残差 0.000 / CI [0,0]）。効果を過小評価する方向にのみ働き偽陽性は作らないが、機種別内訳を見るときは認識しておく。
4. 当日のgamesでフィルタしない。角番が不人気で回転数が低い場合、games下限が角番だけを選択的に除外して効果を消す。代わりに mean_games を併記して回転数の差自体を診断材料にする。
5. 効果が単一機種のアーティファクトでないことは、機種別内訳と「支配的機種を除いた再計算」で確認する。

## 例
楽園技術介入のセクション端効果 +0.868pp は、エウレカセブンTYPE-ART が行数の22%を占めていたが、除外後も +0.770pp CI [0.49, 1.16]（n=5792、28台）。有意にプラスなのが新ハナビ +1.786 / クランキークレスト +1.472 / ディスクアップ +1.210 と典型的な技術介入機に揃っていた。

