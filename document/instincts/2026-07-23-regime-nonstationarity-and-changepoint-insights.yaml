# プール平均のnullは「セグメント非依存の形では効果がない」までしか言えない。符号が逆のセグメントは打ち消し合う

## 背景
2026-07-23、蒲田1のセクション端効果が全カテゴリで null だったことから「蒲田1は位置軸そのものが効かない」と書いたが、これは誤りだった。測ったのは全期間・全セクション・全日をプールした平均に過ぎない。セグメントで符号が逆なら（例: イベント日プラス、通常日マイナス）プール平均はゼロになる。

これは同じセッションで自分が使った論法そのもの――「長期プールは符号の違う期間を平均して打ち消す」――の再来であり、同じ誤りを別の軸で犯していた。実際、蒲田1には18本のinstinctがあり `kamata1-identity-a-specialized-hall` は A系/N系分割で「カクバンは両系統で有効」と既に結論している。分割していないから消えていただけだった。

## アクション
1. プール平均の null は「セグメント非依存の効果はない」と書く。「効かない」と書かない。
2. そのホールに既存のセグメント定義（A系/N系、島タイプ、DD軸など）があるなら、プール分析はその手前の粗い層でしかない。既存instinctを先に読む。
3. セグメント分割は検定数を増やすので偽陽性リスクが上がる（`highsetting-rb-probability-kakuban-verification-20260716` の「角番×DD細粒度ルールは再現率40-70%止まり」）。見るセグメントを**先に固定**してから当たる。
4. 既に18本のinstinctがある軸を粗い粒度でやり直すのは焼き直し。新規性があるのは手法（機種内統制・非定常性検定など）を変えた場合だけ。

## 例
蒲田1セクション端: ジャグ +0.068pp [-0.10, 0.24]、AT一般 -0.343pp [-0.84, 0.10]、技術介入 -0.110pp、ハナハナ +0.219pp と全て null。一方 `kamata1-identity-a-specialized-hall` は A系 DD軸 MWU p=0.0000、N系 p=0.136 と系統分割で明確な差を記録している。

