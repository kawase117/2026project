# 差枚は回転数の分散を丸ごと含む。設定差を見たいなら機械割とRB確率で並べて測り、指標ごとに見えるものが違うと理解する

## 背景
2026-07-23、非定常性検定を全9ホールで回した際、系列を全て差枚ベースのエッジで作っていた。差枚 = G数 × 3 × (機械割 - 1) なので、当日どれだけ回ったかという設定と無関係な分散が丸ごと混入する。スロットは6段階設定であり、見るべきは設定差。

同一の選択ルールに対し指標だけを差枚 / 機械割pp / RB確率の機種内zスコアに差し替えたところ、**結論が覆った**。みとやジャグは3指標すべて p=0.0000 で非定常と判定され、「設定方針の短期レジームは存在しない」という判定が撤回になった。

同時に事前の見込み（設定系指標にすれば検出力が一律に上がる）は外れた。明確に null のセルで検出限界を枚換算すると機械割は120〜480枚相当で、差枚の100〜400枚とほぼ同等。p<0.05 の件数も diff 6/55、payout 7/55、rbz 2/30 とほぼ変わらない。つまり指標変更の効果は「感度向上」ではなく「**別の信号の可視化**」だった。

## アクション
1. 台×日のシグナル検定では、差枚単独で結論を出さない。最低でも機械割(pp)を並べる。ジャグ・ハナハナはRB確率の機種内zスコアも加える。
2. 3指標で結果が食い違ったら、それは矛盾ではなく「指標ごとに見える対象が違う」ことの表れとして扱う。楽園ジャグは差枚(p=0.637)でも機械割(p=0.793)でも見えず、RB確率でだけ見えた(p=0.013)。
3. 「差枚では null だが設定系指標で有意」のセルを明示的に列挙する。ここが差枚単独の分析で取りこぼしていた領域になる。
4. 複数指標で再現するかを採否基準にする。みとやジャグはRB確率ルールで3/3再現、蒲田7 AT一般は2/2再現。単一指標のみの有意は偽陽性として扱う。

## 例
backtest/results/regime/metric_comparison.csv。みとやジャグ(RB確率ルール): diff p=0.0000 / payout p=0.0000 / rbz p=0.0000、ratio 1.72-1.88。差枚では見えず設定系で見えたセル: ヒロキ東口技術介入(0.160→payout 0.0000)、みとや技術介入(0.217→0.017)、蒲田7ハナハナ(0.190→0.047)、楽園ジャグ(0.637→rbz 0.013)。

