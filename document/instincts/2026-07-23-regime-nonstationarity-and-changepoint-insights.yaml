# みとや角番1の高設定シグナルは2026-04-27に消失した。RB確率で見た優位はゼロになっている

## 背景
みとやジャグの角番1（rank_from_aisle=1、実運用上は横列2台のセオリー）は、選択ルールと無関係に台そのものの残差で見ても長期に安定していた。

- 前期 2025-01〜2026-04（485日）: RB z残差 +0.327z [+0.296, +0.360] / 機械割残差 +2.261pp [+2.039, +2.501]
- 後期 2026-05〜2026-07（75日）: RB z残差 +0.013z [-0.050, +0.073] / 機械割残差 +0.850pp [+0.063, +1.721]

変化点検出（破断日を未知としてスキャン、循環シフトで補正）は2指標独立に **2026-04-27** を検出、p=0.0135。同時期に店長交代があった。

**RB確率で見た設定シグナルは完全消失**（CIがゼロを跨ぐ）。機械割残差は弱く残るが前期の約1/3。同時期に全ジャグ 89→84台、角番1台 7→6台の減少もある。

## アクション
1. みとやの角番1セオリーを無条件で使わない。2026-05以降のデータで再評価してから使う。
2. 特にRB確率ベースの選択で角番1を優先するロジックは、後期データでは根拠を失っている。
3. 後期は75日しかなく、恒久的終了か一時的変動かは確定できない。継続観察する。機械割残差 +0.850pp [+0.063, 1.721] はまだゼロを跨いでいないので、弱い優位が残っている可能性はある。
4. 店長交代のような人事イベントは他ホールでも起きうる。既知セオリーを使う前に、そのホールで最近イベントが無かったかを確認する。

## 例
backtest/results/regime/mitoya_jug_diagnosis.csv と changepoint.csv。高エッジ窓(2025-06〜10)は角番1比率68%・マイジャグラーV 72%、低エッジ窓(2026-03〜07)は角番1比率35%・機種構成分散。窓平均エッジと角番1比率の相関 +0.761（新台比率 +0.059、イベントDD比率 -0.011 を圧倒）。

