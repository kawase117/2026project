# ホールごとにデータ開始日が違う。指定した期間ではなく実際に取れた日数で検出力が決まる

## 背景
2026-07-23の検証で --start 20240101 を指定していたが、実際のデータは全ホール2025年以降だった。特に**蒲田7は2025-07-07開始で375日しかなく**、他ホール（550日前後）より検出力が約3割低い条件で測っていた。結論は変わらなかったが、蒲田7の null は他ホールの null より弱い証拠であることを見落としていた。

ホール別データ状況（2026-07-23時点、20260720まで）:

- 楽園蒲田店: 2025-01開始 / 563日 / 587台
- 金時京急蒲田店: 2025-01開始 / 564日 / 148台
- ザ-シティ-ベルシティ雑色店: 2025-01開始 / 562日 / 133台
- みとや大森町店: 2025-01開始 / 560日 / 266台
- ヒロキ東口店: 2025-01開始 / 560日 / 279台
- マルハンメガシティ2000-蒲田1: 2025-01開始 / 550日 / 401台
- ARROW池上店: 2025-01開始 / 547日 / 320台
- レイトギャップ平和島: 2025-03-20開始 / 481日 / 451台
- **マルハンメガシティ2000-蒲田7: 2025-07-07開始 / 375日 / 715台**

## アクション
1. ホール横断で結果を並べる前に n_days を必ず併記する。指定期間ではなく実測日数で読む。
2. 日数の少ないホールの null は弱い証拠として扱う。検出限界の測定（`null-result-requires-power-measurement`）と併せて読む。
3. カテゴリ構成もホールで大きく違う。レイトギャップ平和島の沖スロは22,800行と他ホールの3〜4倍で、沖スロ軸を検証するなら唯一まともなサンプルを持つホール。
4. database/pachinko.db と database/pachinko_data.db は 0B の空ファイル。実体はリポジトリルート直下の pachinko_data.db。ホール別DBは db/<ホール名>.db。パス取り違えの事故源。

## 例
蒲田7の非定常性検定は n_days=365〜375 で他ホールの550前後より短い。同セッションの追試1〜3の蒲田7の結果はこの条件下のもの。
