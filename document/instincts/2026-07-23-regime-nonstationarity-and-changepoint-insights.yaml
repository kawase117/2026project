# machine_layout は日付次元を持たない単一スナップショット。工事を挟むと前後どちらかの期間が必ず誤る

## 背景
machine_layout の列は machine_number / hall_name / x / y / display_y / section / section_min / section_max / rank_from_min / rank_from_max / rank_from_aisle で、**日付列がない**。ホールが島配列の工事をすると、スナップショットの取得時期によって工事前か工事後どちらかの期間に誤った位置が割り当たる。

楽園蒲田店の例: 2026-07-06 に247台（全567台の約44%）が一斉入替、新規台番号20台が出現。この20台が machine_layout に存在しないことから、**スナップショットは工事前**と判定できた。したがって過去分析（2025-01〜2026-07-05）の位置は正しく、今後の運用には使えない。

工事の検出は台番号セットのJaccardでは捕まらない（島配列変更では台番号が変わらないことがある）。**台ごとの機種が同日に一斉に変わった件数**で見るのが有効。楽園は通常の機種入替が121〜140台なのに対し2026-07-06だけ247台で突出していた。

## アクション
1. 位置軸の分析をする前に、対象期間に工事が無かったかを確認する。検出は「機種が変わった台数」の日次カウントで、通常の入替規模から突出した日を探す。
2. machine_layout に無い台番号が稼働データに現れる日を探せば、スナップショットが工事前か工事後かを判定できる。
3. 工事後の運用・フォワードテストには、レイアウトの再取得が必須。
4. ホール別の位置軸の可用性（2026-07-23時点）:
   - 蒲田7・みとや: rank_from_aisle 使用可（通路角番）
   - 楽園・蒲田1: rank_from_aisle は全NULL。rank_from_min / rank_from_max（セクション端）のみ
   - 雑色・ARROW池上・ヒロキ東口・レイトギャップ平和島・金時京急: machine_layout が空か存在せず、位置軸は使用不可
   - セクション端は通路角番ではない（`feedback-kakuban-not-section-edge`）

## 例
楽園2026-07-06以降の稼働587台のうち20台が machine_layout に不在 → スナップショットは工事前。工事前のみ（〜2026-07-05）で再計算しても効果はほぼ不変（技術介入 +0.868→+0.894pp）で、汚染期間14日は結論に影響しなかった。

