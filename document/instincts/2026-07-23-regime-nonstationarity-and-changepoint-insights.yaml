# 日次系列の帰無分布は循環ブロック置換で作る。iidシャッフルは自己相関をレジーム変化と誤認させる

## 背景
台選択ルールの日次エッジには正の系列相関がある（同じ台が連日選ばれ続けるため）。この相関だけでローリング窓平均は勝手に振れる。帰無分布をiidシャッフルで作ると相関が消えて分布が狭くなりすぎ、**ただの自己相関がレジーム変化として有意に出る**。

検定したいのは「窓平均の振れがノイズを超えるか」なので、帰無仮説側も同じ短期相関を持っていなければならない。

## アクション
1. 非定常性の帰無分布は循環ブロック置換（block=7日程度）で作る。ブロック内の並びを保つので短期相関は生き残り、ブロックをまたぐ長期構造＝レジームだけが壊れる。
2. 変化点検出では循環シフト（np.roll）を使う。系列相関を保ったまま時間軸上の位置関係だけを壊せる。
3. CI もブロックブートストラップで取る。run_backtest.bootstrap_ci(block=7) が実装済み。iid版(block=1)と並べると幅の差でどれだけ過大評価していたかが見える。
4. 変化点を「全候補スキャンして最大」で探すなら、帰無分布も**同じスキャンを通す**。最大値を取る操作自体が多重比較なので、これを怠るとp値が大幅に楽観化する。

## 例
backtest/regime.py の circular_block_permute()。変化点検出では scan_changepoint() を累積和でO(n)化し、2000回の循環シフトそれぞれで同じスキャンを回して max統計量の帰無分布を作る。

