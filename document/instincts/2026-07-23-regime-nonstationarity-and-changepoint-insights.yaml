# 位置ポリシーはホールによって「全機種共通型」「カテゴリ別型」に分かれる。ホール横断の共通則は無いが、ホール内共通則を持つホールはある

## 背景
「店側が日々変化する機種に合わせて毎回設定を考えるのは労力が大きすぎる。だから機種が変わっても共通する法則があるはず」という労力コスト論を検証した。この論拠が支持するのは機種個別のスコアリングではなく**機種を問わない配置ポリシー**なので、位置効果をカテゴリ横断で測れば直接検証できる。

結果はホールで分かれた。

- **楽園**: セクション端が4カテゴリすべて同符号（プラス）、3/4有意。労力コスト論が予測する「一つの配置ルールを全機種に適用する」そのもの
- **蒲田7**: AT一般のみ、しかも符号がマイナス（角番1が -1.205pp）
- **みとや**: ジャグのみ（角番1 +1.575pp）
- **蒲田1**: プール平均では検出されず（ただしセグメント分割していない。`pooled-null-does-not-imply-segment-null` 参照）

労力コスト論は却下しなくてよい。ただし予測するのは「普遍性」ではなく「**安定性**」――一度決めた配置ルールを長期間変えないこと。実際、位置効果には非定常性が検出されなかった（角番1回避 p=0.25）。

## アクション
1. 探すのは「ホール共通の法則」ではなく「ホール×カテゴリごとに固定された配置ポリシー」。既存 `feedback-no-cross-hall-pooling` を位置軸でも適用する。
2. ただし**ホール内での機種横断共通ポリシーは存在しうる**（楽園）。ホール内でも必ずカテゴリ別に分けるべき、とまで一般化しない。まずカテゴリ横断で測り、揃うかを見る。
3. 効果が偶然でないかの検証は、カテゴリ横断の再現性そのものが担う。ジャグ18台/AT一般66台/技術介入31台/ハナハナ7台は互いに素な台集合なので、単一台のアーティファクトなら4群に同時に同符号では現れない。

## 例
backtest/results/regime/section_edge_by_category.csv。楽園セクション端(両端まとめ、機種内残差): ジャグ +0.335pp [0.06,0.58]、AT一般 +0.185 [-0.10,0.41]、技術介入 +0.868 [0.61,1.28]、ハナハナ +0.738 [0.18,1.33]。

