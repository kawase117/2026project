# 機種の「上位%」「平均差枚」は判定できる台が1台でも出る。推す前に判定対象台数と全台合算判定を見る

## 背景
2026-09-18 楽園蒲田の site777 ブリーフ（19:25）で、スマスロハナビが判別可能機種の最上位に出た
（自己ベースライン上位4%・設定5以上63%・平均差枚+1280）。これを「機種として強い」と報告したが、
ユーザーに「差枚が出ている台自体が少ないのでは」と指摘され、機種の中身を見ると次の通りだった。

| 見たもの | 値 |
|---|---|
| 設置台数 | 7台 |
| 判定対象（2,000G以上・setting_eval_eligible） | **3148の1台のみ** |
| 他6台の回転数 | 235〜1,497G（全て2,000G未満） |
| 全台合算（model_zentaikei） | 合計8,024G・**合算最尤設定1**・全台高設定の確率7.9%・判定保留 |

ブリーフの機種表の「上位%」「設定5以上」「平均差枚」は、判定対象が1台でも機種の代表値として出る。
つまり「上位4%」は3148という1台の個別成績の順位で、機種全体の設定投入を測っていない。
高設定候補の台（3154: RB1/202、1,213G）は2,000G未満で機種表の計算に入らないまま、台リストにだけ載っていた。

## アクション
1. ブリーフの機種表を見たら、その行の**設置台数と判定対象台数**を必ず確認する。判定対象が全体の半分未満なら「機種として強い」と言わない。
2. 機種の評価は `site777_analysis*.json` の `model_zentaikei`（全台合算）を併読する。合算最尤設定・全台高設定確率・verdict を見る。verdict が「判定保留（情報不足）」なら機種評価は保留と書く。
3. 台単位の材料（個別のRB確率・最尤設定）は台単位として報告し、機種の評価に一般化しない。
4. 機種全体を語るときは「N台中M台で判定」を併記する。

## 例
NG: 「スマスロハナビは自己ベースライン上位4%、機種として強い」
OK: 「スマスロハナビは7台中2,000G以上が3148の1台だけで、機種表の値はその1台のもの。全台合算は最尤設定1で判定保留。3148・3154は台として見る」

