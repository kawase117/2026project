# 楽園蒲田の機種×曜日のRB優位は、アレックス月曜が最もよく再現し、バーサス日曜は弱い手がかり、他は未確認

## 背景
改装後(2026-07-06〜09-30、86日)のノーマル+BT 20機種で、機種ごとにRB確率が最も高い曜日を選び、その曜日が後の月でも他の曜日よりRBが高いかを調べた。
- 設計A: 7月だけで曜日を選び、8〜9月で検定。設計B: 7〜8月で選び、9月で検定。選んだ曜日は検定前に決まるので、7曜日の最大の補正は要らず、曜日ラベルの入れ替えによる片側検定。
- 20機種全体では、設計Aでp<0.05が2機種(偶然なら約1)、設計Bで1機種(偶然なら約1)。検定期間の効果が正の機種は10/20と11/20。選んだ曜日の効果は、検定期間で平均+19%から-1%、+13%から+3%へ縮んだ(平均への回帰)。機種×曜日の傾向が全体として続くという証拠はない。
- アレックス ブライト月曜(3台): 全期間+22%(p=0.008)。7月+38%、8月+16%、9月+13%と低下。設計Aで+15%(p=0.027)、設計Bで+13%(p=0.125)。機械割の差は-0.9ptで差枚では再現しない。RBだけの効果。
- バーサスリヴァイズ: 全期間の強い曜日は日曜(+19%、p=0.058)。7月は差なし、8月+32%、9月+16%。設計Bの日曜は+16%(p=0.030)で再現。設計Aは7月で土曜を選んだが検定期間-10%(p=0.925)で再現しない。土曜は支持されない。
- ジャグラーガールズ月曜: 全期間+13%(p=0.058)。後の月は+9%(p=0.116、0.225)で有意でない。
- サンダーV水曜: 全期間+16%(p=0.019)だが、9月は+1%。設計Aは7月で金曜を選び+3%、設計Bの水曜も+1%で再現しない。
- 台別: アレックスの月曜は3台とも他曜日よりRBが良い(3141が設定5以上88%、3140が69%、3139が25%)。サンダーVの水曜は6台がそろって少し良い程度で、特定の台への偏りは見えない。
- 検定期間の該当日は4〜9日だけで、検出力が低い。「再現しない」は「効果がない」ではない。8検定を見たので、p=0.03前後の2件は補正すると有意と言えない。

## アクション
- 言える範囲は「その曜日はRBが高めで、設定が入りやすかった可能性がわずかにある」まで。「設定を入れていた」「法則性」とは書かない。
- 予測に使う強さの順は、アレックス月曜(台を見る価値がある)、バーサス日曜(様子見)、ジャグラーガールズ月曜(単独では動かない)。バーサスの土曜とサンダーVの水曜は使わない。
- 10月以降のデータが出たら、アレックス月曜とバーサス日曜を、曜日を事前に固定して検定する(ジャグラーガールズ月曜は弱い手がかりとして分けて扱う)。
- 曜日の効果は、機種の効果と違い、月ごとに強さが動く。強い曜日を選んだ期間と検定する期間を分け、選択期間の数字を期待値として使わない。
- 比べる指標は、差枚でなくRB確率(判別可能な機種)と機械割。回転数帯を揃える。

## 例
アレックスは、強い曜日の効果が7月+38%、8月+16%、9月+13%と下がった。7月の3日が全期間の数字を引き上げていた。
