# 2F(N機100%)と3F(A53%+N47%)で末尾ランキングが大きく異なる

## 背景
蒲田7のフロア構造:
2F: 台番号2001-2352、351台、avg_diff=+235、100% N機
3F: 台番号3001-3365、364台、avg_diff=+140、52.7% A + 47.3% N

フロア間の末尾ランキングSpearman = 0.4（低相関）。

2F Top3: d6(+307), d9(+271), d7(+262)。Bottom: d3(+99), d1(+120)
3F Top3: d8(+183), d5(+157), d6(+157)。Bottom: d1(+86), d3(+90)

2Fは100% N機のため、N機ベースラインランキング(d6>d8>d9)とほぼ一致。
3FはA/N混合のため、Simpson's Paradoxにより両方のランキングが混合して出現。
3Fでの末尾選択はセグメント(A/N)を先に決めてからランキング参照すべき。

dd_mod10別の2Fランキング（土曜）:
mod10=2: d6(+1430)が圧倒的
mod10=9: d9(+1257)が圧倒的
mod10=6: d6(+801), d4(+774), d5(+763)が拮抗

3F土曜では異なる:
mod10=2: d6(+692), d5(+472) — d6は共通だが値は半分
mod10=9: d8(+549), d3(+378) — 2Fのd9首位とは全く別
mod10=5: d1(+356), d2(+321) — 2Fはd7(+537)が1位

## アクション
2Fに行くと決めた場合: N機ランキング（d6優先）をそのまま適用。
3Fに行く場合: まずA機/N機を決め、セグメント別ランキングを参照。
N機を打ちたいなら2F（avg_diff=+235 > 3F全体のavg_diff=+140）。
A機を打ちたいなら3F一択（2FにはA機がない）。

## 例
2F土曜mod10=2: d6(+1430)が圧倒的最強。3F同条件: d6(+692)で半分以下。
→ N機d6狙いなら2Fの方が有利。
3F土曜mod10=5: d1(+356), d2(+321)。2F同条件: d7(+537), d8(+358)。
→ フロアで狙い末尾が完全に異なる。

