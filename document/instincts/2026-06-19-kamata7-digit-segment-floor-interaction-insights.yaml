# A機とN機の末尾ランキングは逆相関（Simpson's Paradox）— 全体集計は無意味

## 背景
蒲田7の全データでセグメント別に末尾ランキングを算出した結果:
A機（ジャグラー/ハナハナ）Top3: d3(+234), d4(+228), d2(+223)。Bottom: d7(+198), d0(+207)
N機（AT系）Top3: d6(+236), d8(+217), d9(+207)。Bottom: d3(+92), d1(+143)
全体Spearman ρ(A vs N) = -0.418（逆相関）。

N機が全体の約73%を占めるため、セグメント無視の全体集計ではN機ランキングに引きずられ、
A機の真のシグナル（d3, d4強い）が消失する。
以前「末尾に有意性なし」と結論した原因はこのSimpson's Paradoxだった。

dd_mod10×曜日別でも70セル中63セルでρ < 0.5。
極端な例: 土曜mod10=5 ρ=-0.9、木曜mod10=0 ρ=-0.8。
ほぼ全ての条件下でA/Nランキングは独立または逆転している。

## アクション
蒲田7の末尾分析は必ずセグメント（A/N）別に実施する。
全体集計での末尾ランキングは参照してはならない。
他ホールでも同様のSimpson's Paradoxが存在する可能性があり、セグメント分割を先行すべき。

## 例
全体: d6が1位に見える（N機73%の影響）
A機のみ: d3が1位（+234）、d6は6位（+217）
N機のみ: d6が1位（+236）、d3は最下位（+92）
d3を打つべきかどうかの判断がA機かN機かで完全に逆転する。

