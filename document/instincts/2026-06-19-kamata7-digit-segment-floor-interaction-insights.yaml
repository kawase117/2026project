# N機は末尾d6が圧倒的に強い（d3/d1が弱い）

## 背景
N機の末尾ベースライン（全dd_mod10・全曜日平均）:
d6: +236（1位）— 2位と+19差で安定的首位
d8: +217（2位）
d9: +207（3位）
d7: +181（4位）
...
d5: +163（8位）
d1: +143（9位）
d3: +92 （10位）— 最下位、1位との差は+144で巨大

d6の優位はdd_mod10別でも頻出:
mod10=1: d6が1位(+215)
mod10=2: d6が1位(+410)
mod10=4: d6が1位(+320)
mod10=6: d7が1位だがd6は9位（例外的に弱いケース）

d3は10セル中5セルでBottom2入り。N機のd3回避はほぼ鉄則。

## アクション
N機を打つ場合、d6を最優先で検討する。次点でd8/d9。
d3は特別な理由がない限り避ける（全体最下位+92、最強d6との差=144）。
2Fは100% N機のため、2Fに行く場合は自動的にこのN機ランキングが適用される。

## 例
土曜mod10=2: N機d6=+1214（全セル中最大値）、d1=+21（最弱）。d6とd1で1193の差。
水曜mod10=6: N機d1=+1005（例外的にd1が1位）、d3=-345（やはり最弱）。

