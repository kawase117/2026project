# A機は末尾d3/d4/d2が安定して強い（d7/d0が弱い）

## 背景
A機の末尾ベースライン（全dd_mod10・全曜日平均）:
d3: +234（1位）
d4: +228（2位）
d2: +223（3位）
d8: +220（4位）
...
d0: +207（9位）
d7: +198（10位）

Top3のd3/d4/d2はいずれもN機ではBottom寄り（d3=最下位、d4=7位、d2=6位）。
A機とN機で真逆のパターンが存在するため、A機を打つ場合はA専用ランキングに従う必要がある。

dd_mod10別でも安定:
mod10=1: d8(+416), d4(+415)が突出
mod10=4: d3(+275), d1(+266)
mod10=7: d5(+340), d3(+329)（イベントDD）
mod10=9: d3(+317), d8(+279)

## アクション
A機を打つと決めた場合、まずd3/d4を検討する。
ただしdd_mod10×曜日でランキングは変動するため、早見表(kamata7_digit_segment_quickref.csv)で具体的条件を確認する。

## 例
土曜mod10=5（7/5相当）: A機はd2(+939), d3(+830)が突出。d0(-267)は絶対避ける。
水曜mod10=9（6/19相当）: A機はd3(+650), d8(+547)。N機はd4(+1010), d3(+645)で偶然一致。

