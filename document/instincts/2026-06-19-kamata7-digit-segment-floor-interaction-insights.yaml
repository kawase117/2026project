# 末尾選択の意思決定階層: フロア→セグメント→dd_mod10×曜日→末尾→ゾロ目

## 背景
今回の一連の分析で判明した各軸の効果量と独立性:
1. セグメント(A/N): ρ=-0.418で末尾ランキングが逆転。分割必須。
2. フロア(2F/3F): ρ=0.4で異なるパターン。2F=100%N機のためセグメントと連動。
3. dd_mod10×曜日: 70セル中63セルでA/Nが独立。セル別ランキング参照必須。
4. ゾロ目台: +49の安定効果だが、mod10×曜日で+333〜-330の変動あり。

効果量の順序:
- セグメント×末尾ランキング差: 最大144（N機d6=+236 vs d3=+92）
- ゾロ目×DD11: +210（最大の単一効果）
- フロア差(2F vs 3F): +95（avg_diff差）
- ゾロ目全体: +49

## アクション
台選びの判断フロー:
1. フロアを選ぶ（N機なら2F優位、A機なら3F一択）
2. セグメントを決める（イベント日はA機が+122のイベント効果）
3. dd_mod10と曜日から早見表でTop3末尾を確認
4. Top3末尾のうちゾロ目台があれば優先（ただしmod10×曜日のゾロ目効果を確認）
5. DD11なら最優先でゾロ目台（+210効果）

## 例
7/17(木) DD17 mod10=7 イベント日:
1. A機狙い → 3Fへ
2. セグメントA × mod10=7: d5(+340), d3(+329), d0(+298)
3. d3のゾロ目台=33番台があれば候補（ただし木曜mod10=7のゾロ目効果を別途確認）
