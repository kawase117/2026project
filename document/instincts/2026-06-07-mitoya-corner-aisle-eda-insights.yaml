title: 「角番」と「ランク」は区別必須 — 位置は角番、成績順位はランクと呼ぶ

## 背景
ユーザーからの明示的な指摘: 「ランクだと成績順位と混同する。角番という言い方に統一してください」。
本プロジェクトでは:
- **角番**（kakuban）: メイン通路からの距離による位置順位（rank_from_aisle, rank_from_min）
- **ランク**: 機械ランキング（machine_rank_in_type）、成績順位

同じ「ランク」という言葉が両方に使われるため、文脈から判断できなくなる。

## アクション
コードのコメント・出力文字列・分析レポートで位置順位を指すときは「角番」を使う。
`rank_from_aisle` / `rank_from_min` のカラム名はそのまま（変数名まで変える必要はない）が、
日本語の説明では「角番1」「角番5」と表現する。
成績順位を表すときのみ「ランク」を使う。

## 例
```python
# NG
print(f"Rank1の平均差枚: {avg_rank1:+d}")  # 成績ランクか位置ランクか不明

# OK
print(f"角番1（通路最近接）の平均差枚: {avg_rank1:+d}")   # 位置を明示
print(f"成績ランク1位台の平均差枚: {avg_rank1:+d}")       # 成績を明示
```

