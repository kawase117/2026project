title: みとや メインジャグラー島の角番1はプラス日に+640（島内で最大）— 通路最近接台に高設定集中

## 背景
島別×角番別のプラス日限定 avg_diff を分析した結果、メインジャグラー島（台641-691）で
最も明確な角番勾配が観測された:

| 角番 | avg_diff | plus_rate |
|-----|----------|-----------|
|  1  |   +640   |   64.8%   |
|  2  |   +447   |   60.2%   |
|  3  |   +358   |   57.1%   |
|  4  |   +180   |   53.4%   |
|  5  |   +311   |   54.7%   |

一方バラエティ島（台692+）は角番1=+255と勾配が弱い。
バラエティ島はそもそも高設定投入率が低く、角番効果が薄れる。

## アクション
みとやのメインジャグラー島では角番1・2に着目する。
島全体のDD（4系・7系）が強い日は角番1-3が特に優位。
バラエティ島の角番1は「角番1だから強い」という単純な推測をしないこと。

## 例
```
みとや 島別×角番 avg_diff（プラス日限定）:
  main_jug(641-691): rank1=+640, rank2=+447 → 明確な角番勾配あり
  bari(692+):        rank1=+255, rank2=+201 → 勾配が弱く高設定自体が少ない
  main_mix(501-640): rank1=+480, rank2=+390 → 中程度の勾配
```

