title: daily_hall_summary.day_of_week は大部分が NULL — date 文字列から直接計算すること

## 背景
みとや大森町店DBで `daily_hall_summary.day_of_week` を確認したところ、515行中514行が NULL。
挿入処理の不備でほぼ全行が NULL になっている。
SQL クエリで day_of_week でフィルタ・グループ化してもほとんどデータが得られない。

## アクション
曜日フィルタが必要な場合は date カラム（YYYYMMDD テキスト）から直接計算する:

```sql
CASE STRFTIME('%w', SUBSTR(date,1,4)||'-'||SUBSTR(date,5,2)||'-'||SUBSTR(date,7,2))
  WHEN '0' THEN '日'
  WHEN '1' THEN '月'
  WHEN '2' THEN '火'
  WHEN '3' THEN '水'
  WHEN '4' THEN '木'
  WHEN '5' THEN '金'
  WHEN '6' THEN '土'
END as day_of_week
```

または Python 側で `pd.to_datetime(df['date'], format='%Y%m%d').dt.dayofweek` を使う。
`STRFTIME('%w', date)` は YYYYMMDD テキスト形式に直接適用できないことに注意。

## 例
```sql
-- NG: day_of_week カラムを使った曜日フィルタ（ほとんど NULL でヒットしない）
SELECT * FROM daily_hall_summary WHERE day_of_week = '金'

-- OK: date 文字列から曜日を計算
SELECT *,
  STRFTIME('%w', SUBSTR(date,1,4)||'-'||SUBSTR(date,5,2)||'-'||SUBSTR(date,7,2)) as dow_num
FROM daily_hall_summary
WHERE STRFTIME('%w', SUBSTR(date,1,4)||'-'||SUBSTR(date,5,2)||'-'||SUBSTR(date,7,2)) = '5'  -- 金曜
```
