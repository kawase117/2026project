id: machine-position-effect-confounding
trigger: "台番号の角番（位置）効果と機種配置効果を比較するとき"
confidence: 0.90
domain: domain-analysis
source: empirical-validation
project_id: 2026project
project_name: pachinko-analyzer

title: 不人気機種の配置が位置効果を打ち消す — 機種効果と位置効果は交絡している

## 背景
台570（角番4、中央AT列）の機種変更追跡:

| 機種 | 人気 | avg_diff |
|------|------|---------|
| スマスロ北斗の拳 | 高 | +321 |
| 新鬼武者3 | 低 | -595 |
| スマスロ北斗転生 | 高 | +555 |

「不人気機種 → 成績急落」「人気機種 → 回復」は確認できる。
ただし「人気機種 → 人気機種（モンハン→東京喰種など）」の遷移では成績が安定するため、
位置効果と機種効果の分離ができない。

正確な解釈:
- 「機種効果 > 位置効果」は言いすぎ
- 「不人気機種が配置されると位置効果を打ち消す」が正確
- 「人気機種が長期固定されているポジション ＝ ホールが意図的に選んだ場所」という
  間接的な位置の強さの現れ方もある

## 追加検証（2026-06-07）: マイジャグラーV機種内角番効果
同一機種（マイジャグラーV）だけで角番効果を見た結果:

| 角番 | avg_diff | plus_rate |
|-----|----------|-----------|
|  1  |   +709   |   66.6%   |
|  2  |   +310   |   54.6%   |
|  3  |   +219   |   51.5%   |
|  4  |    +45   |   43.9%   |
|  9  |    +49   |   43.9%   |

機種が同じでも角番1と角番4で664差 → **位置効果は機種効果と独立して存在する**。
「機種効果だけで角番差は説明できる」という仮説は棄却。
正確な結論: 位置効果・機種効果は両方独立して存在し、交絡している。
不人気機種が配置されると位置効果を打ち消す（台570事例）が、
人気機種が揃ったときは位置効果が明確に現れる（マイジャグV事例）。

## アクション
台番号固有の強さを語るときは「現在配置されている機種込みで評価」する。
機種が不人気機種に変わった後は過去データを重く扱いすぎないこと。
人気機種が長期配置されているポジションを「強ポジション」と見なすのは合理的だが、
機種変更後に同じ期待値を持つのは危険。
同一機種内での角番比較が最も純粋な位置効果の検証になる。

## 例
```sql
-- 特定台番号の機種変更履歴と成績推移
SELECT
  machine_name,
  MIN(date) as first_seen,
  MAX(date) as last_seen,
  COUNT(DISTINCT date) as n_days,
  AVG(diff_coins_normalized) as avg_diff
FROM machine_detailed_results
WHERE machine_number = 570
GROUP BY machine_name
ORDER BY first_seen;
-- → 機種が変わるたびに avg_diff が激変するかどうか確認
```

