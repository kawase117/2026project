title: 逆順セクション定義は hall_config.json に書く — コードにハードコードしない

## 背景
当初 Python の frozenset としてスクリプト内にハードコードされていた逆順セクション定義を、
`config/hall_config.json` の `layout_settings.reversed_sections` に移動した。
理由:
- コードを読まないと定義が分からない → メンテナンス困難
- ホール追加時に複数ファイル修正が必要
- データと設定の混在（separation of concerns 違反）

## アクション
新しいホールで逆順セクションが存在する場合は hall_config.json に追記する:
```json
"layout_settings": {
  "reversed_sections": ["523-539", "557-573", "591-607"]
}
```
DBセットアップ時（`db_setup.py`）が自動的に読み込み、`machine_layout` テーブルの
`is_reversed_section`（INTEGER 0/1）と `rank_from_aisle`（INTEGER）を計算・格納する。

## 例
```json
// config/hall_config.json
{
  "hall_name": "みとや大森町店",
  "layout_settings": {
    "reversed_sections": [
      "523-539", "557-573", "591-607", "624-640",
      "658-674", "701-711", "723-733", "745-755"
    ]
  }
}
```
```sql
-- DB内の格納結果
SELECT section, is_reversed_section, rank_from_aisle
FROM machine_layout
WHERE section = '523-539'
-- is_reversed_section=1, rank_from_aisle=rank_from_max
```

