title: 通路距離補正した角番（rank_from_aisle）はノーマル角番の5倍の説明力（ε²）を持つ

## 背景
みとや大森町店の台番号は交互逆順配置（メイン通路側が高番号のセクションと低番号のセクションが交互）。
逆順補正なしの rank_from_min はメイン通路からの距離を正しく表せない。
Kruskal-Wallis ε² で3指標を比較した結果:

- rank_from_aisle  : ε²=0.002482  ← 最大（5.1倍）
- rank_from_min    : ε²=0.000488
- physical_corner  : ε²=0.000434

プラス日限定で差枚を目的変数としたとき、通路距離補正指標が圧倒的に優れる。

## アクション
みとや（または同様の逆順交互配置ホール）の角番分析では、必ず `rank_from_aisle`（DB格納済み）を
使うこと。`rank_from_min` は使用禁止ではないが、説明力が5分の1に落ちることを認識する。
新ホールのレイアウト追加時は `reversed_sections` を hall_config.json に定義してから
DB更新を行うことで自動的に `rank_from_aisle` が計算・格納される。

## 例
```python
# NG: ノーマル角番（逆順補正なし）
df.groupby('rank_from_min')['diff_coins_normalized'].mean()

# OK: 通路距離補正済み角番（DB格納済み）
df.groupby('rank_from_aisle')['diff_coins_normalized'].mean()
```

