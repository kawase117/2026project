title: AT機角番4の高成績は特定台番号への強機種固定配置による交絡 — 角番効果ではない

## 背景
AT機（other/bt カテゴリ）の角番4が全体で avg+459 と高く見えたが、これは角番効果ではなく
「強い機種（スマスロ北斗の拳）が角番4の特定台番号（543, 570等）に長期固定配置されていた」
ことによる交絡効果だった。

検証結果:
- 台543（角番4）: スマスロ北斗の拳が474日間固定 → avg+297
- 台570（角番4）: 北斗→新鬼武者3→北斗転生と機種変更
  - 北斗時代: avg+321
  - 新鬼武者3: avg-595（同じ台番号・同じ角番なのに急落）
  - 北斗転生: avg+555（北斗系に戻ると回復）

→ 機種効果が位置効果を上回る（暫定結論）

## アクション
「角番X が強い」という分析結果を見たら、必ずその角番に固定配置されている機種を確認する。
長期間（100日以上）同一機種が占有している台番号があれば、機種別×台番号別に分解して
交絡の有無を検証すること。

## 例
```sql
-- 角番4 の AT 台番号別 × 機種別成績
SELECT
  m.machine_number,
  ml.rank_from_aisle,
  m.machine_name,
  AVG(m.diff_coins_normalized) as avg_diff,
  COUNT(DISTINCT m.date) as n_days
FROM machine_detailed_results m
LEFT JOIN machine_layout ml ON m.machine_number = ml.machine_number
WHERE ml.rank_from_aisle = 4
  AND m.machine_name NOT LIKE '%ジャグラー%'
  AND m.machine_name NOT LIKE '%アイム%'
GROUP BY m.machine_number, m.machine_name
ORDER BY n_days DESC, avg_diff DESC;
-- → 長期固定機種があれば「機種効果の交絡」として扱う
```

