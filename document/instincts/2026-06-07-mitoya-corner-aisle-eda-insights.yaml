title: 角番5のバウンス（rank4より高い）は構造的要因ではなく特定台番号の個別特性

## 背景
メインジャグラー島（641-691）で角番4（avg+180）→角番5（avg+311）とバウンスが観測された。
当初「角番5が別通路の角番になるセクション構造の影響」と説明したが、これは誤り。
実際の原因は台670（658-674 セクション角番5）が avg+152 と比較的良好で、
当該セクション全体（全台マイジャグラーV占有）の機械割の高さと重なった個別特性だった。

## アクション
角番の単調性（角番1 > 角番2 > ... > 角番n）が崩れた場合は：
1. 問題の角番に含まれる台番号を個別に確認する
2. セクション×台番号ごとの avg_diff を出す
3. 「構造的説明」を先に持ち出さず、データから帰納的に説明する

「角番5が別通路構造だから強い」という説明は、みとやの実レイアウトでは成立しない。

## 例
```python
# 角番5のバウンスが見えたとき
# 1. 問題の台番号を特定
df_rank5 = df[df['rank_from_aisle'] == 5].groupby('machine_number')['diff_coins_normalized'].agg(['mean','count'])
# 2. 特定台番号の機種変遷を確認
# → 機種固定 or 機種変更履歴が原因でないか
```

