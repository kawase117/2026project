# rho>=0.4グループ14組: topDDの実測RB確率を設定別スペックと対比した一覧表

## 背景
`eda/juggler_all_hall_dd_rb_trend_scan.py`(game>=2000)のverdict=`recent_drift`の
うち、全体期間と直近60日のDDランキングの一致度(spearman_rho)が0.4以上ある
14組について、全体期間top_ddと直近60日top_ddそれぞれの実測RB確率
(rb_rate_pooled)を`ml/experiments/jug_rb_setting_prediction/config.py`の
`JUGGLER_FAMILY_SPECS`(設定1-6のrb_probability)と対比し、「実質何設定相当か」
を求めた。effect_size単体の閾値判定では見えない「ピーク日の絶対水準」を
確認する目的。

## アクション
機種名→ファミリーキーの対応は`JUGGLER_FAMILY_MATCHERS`
(MYV=マイジャグラーV, GOGO3=ゴーゴージャグラー3, FUNKY2=ファンキージャグラー2,
HAPPY8=ハッピージャグラーVIII, UMJ=ウルトラミラクルジャグラー,
GALS=ジャグラーガールズ, MISTER=ミスタージャグラー,
IMEX=アイムジャグラー系(アイムEX-TPとネオアイムEXの両方がこのキーワードに一致))
を使い、設定推定にはこのfamily_key経由でspecテーブルを引くこと。

n(セル内サンプル数)が1桁のセルは「設定X相当」という表現をそのまま信じず、
少数サンプルによる分散の可能性を先に疑うこと。下表で太字相当のn<10セルは
再検証待ち。逆に n>=100 かつ全体期間・直近60日で同じ設定帯に収まっている
組(蒲田7×ゴーゴージャグラー3)は、みとや×ジャグラーガールズDD24と同格以上に
信頼できる候補として扱う。

