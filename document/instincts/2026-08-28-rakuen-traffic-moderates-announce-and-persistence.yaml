# 稼働量は全台系判定の最大のモデレータ。低稼働日は閾値超えが1/3になり、予告の名指しも効かなくなる

## Core claim
ホールの稼働量（当日の台あたり平均回転数）は、全台系スコアの閾値超えを左右する
**単一で最大の変数**であり、他のどの機種側特徴よりも効く。さらに稼働量は
「予告の名指しが当たるか」「前日の対象が翌日も続くか」の**符号と有意性そのものを
切り替える**。したがって予告の的中率・ベースレート・持続性は、
**稼働量で層別しない限り意味を持たない**。

## Evidence
楽園蒲田店、2026年・土曜除く203日（機種×日 n=9,180）。
稼働量 = 当日の台あたり平均回転数。中央値2,539で低/高に二分。

### 1. 稼働量そのものの効果（最大）

| 群 | 日数 | 1日あたり閾値1800超え機種数 |
|---|---|---|
| 低稼働日 | 101 | **1.04** |
| 高稼働日 | 102 | **2.86** |
| （参考）予告=取材日 | 15 | 4.60 |
| （参考）それ以外 | 73 | 3.22 |

機種の実力(直近30日超え率)を統制したロジスティックで
`low_traffic` 係数 **-1.11 (p<1e-16)**。

### 2. 予告アカウント(kawasakislot)の名指し — 高稼働日限定の効果

| 群 | 日数 | named オッズ比(30日率で統制) | 当日の全超えに占める名指し由来 |
|---|---|---|---|
| 低稼働の予告日 | 3 | **1.15 (p=0.90)** | 7件中1件 = 14.3% |
| 高稼働の予告日 | 12 | **2.41 (p=0.0055)** | 57件中20件 = 35.1% |

層別しない全体では OR 2.34 (p=0.0045) と「名指しには実力を超えた情報がある」と
見えるが、これは**実質的に高稼働日だけの現象**だった。

### 3. 前日持続性 — 稼働量で符号が分かれる

| 群 | prev_over オッズ比(30日率で統制) |
|---|---|
| 低稼働日 (n=6,173) | **1.34 (p=0.28)** |
| 高稼働日 (n=6,037) | **0.80 (p=0.26)** |

層別しない全体では加重平均差 -0.001 で「持続性はゼロ」に見えるが、
**低稼働で正・高稼働で負が打ち消し合っていた**可能性がある。どちらも非有意で判定不能。

### 4. 大量設置・荒波は稼働量と交互作用しない

荒波度 = 2025年データで作った機種別の台×日 差枚std（検定期間へのリークなし）。

| 変数 | 高稼働日 | 低稼働日 | 交互作用 |
|---|---|---|---|
| 台数(log) | OR 0.81 (p=0.002) | OR 1.03 (p=0.75) | +0.24 (p=0.054) |
| 荒波度 | OR 1.55 (p<1e-4) | OR 1.42 (p=0.002) | +0.001 (**p=0.99**) |

## Interpretation
- ユーザー仮説「客の少ない日は大量機種・荒波機種に入りにくい」のうち、
  **大量機種は逆**（不利なのは高稼働日で、低稼働日は不利が消える）、
  **荒波機種は交互作用ゼロ**だった。ただし台数効果は `gratio_mean_diff` が
  少台数機種に構造的に有利（announce.py docstring）という指標の癖を含む
- **荒波機種が閾値を超えやすいのは「設定が入る」からではなく「分散が大きいから
  閾値を跨ぐ」から**。荒波度は差枚stdそのものなので半ば同義反復であり、
  荒波機種の閾値超えは設定投入の偽陽性になりやすい。
  運用判断として荒波を避けるのは正しく、この指標が検出できていないだけ
- ユーザー仮説「低稼働日は予想しやすいもの(予告機種)に入りやすい」は
  **測定した範囲では逆**。ホールが投資しない日は予告どおりに入らない、と読める
- [[feedback-prevday-exceed-carries-no-info]] の「持続性ゼロ」は層別前の結論であり、
  稼働量で分けると符号が分かれる。断定を判定不能へ格下げする

## 限界（重要）
- **低稼働の予告日は3日・閾値超え7件しかない。** 名指し効果の消失は検出力がほぼ無い
  状態での観察であり、「効かない」と断定してはならない。積極的な反証が無いという水準
- 持続性の低/高いずれも p>0.25 で非有意。符号の一致は示唆であって結論ではない
  （[[feedback-statistical-certainty-calibration]]）
- 単一ホール（楽園蒲田店）。[[feedback-no-cross-hall-pooling]] の通り他ホールへ外挿しない
- 稼働量は結果と同じデータから測る。低稼働日は pool 平均回転数が下がるため
  gratio が機械的に膨らむ経路があり、稼働量の効果の一部は指標の分母経由かもしれない。
  分離は未実施
- 当日の稼働量は事前には分からない。曜日（金2.69 / 土4.92 / 日2.31 機種）と
  取材の有無からの推定に留まる

## Action
- 予告の的中率・ベースレートを出すときは**必ず稼働量で層別する**。
  全期間プールの「名指しOR 2.34」を単独で引用しない
- 予測の期待閾値超え機種数は、低稼働シナリオ 1.04 / 高稼働 2.86 / 取材日 4.60 を
  出発点にする。稼働シナリオが割れる日は**両方の数字を併記して現地判断に渡す**
- 現地での分岐: 午前の稼働が通常の半分程度（台あたり平均2,500回転を切る感触）なら
  低稼働シナリオ。このとき予告リストは候補集合として機能しない
- 荒波上位機種（楽園蒲田2025: 化物語1位 std3491・東京喰種2位・かぐや様8位・
  東リベ11位・バンドリ23位）が閾値を超えた場合、設定投入の証拠として弱く扱い、
  [[nibuichi-detection-by-art-overdispersion]] の過分散検定など別軸で裏を取る
- 稼働量を `backtest/announce.py` の baserate / named-context に説明変数として
  組み込むことを検討する（現状どちらも稼働量を見ていない）
