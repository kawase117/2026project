title: メインジャグラー島 角番1 最強パターン：4系月曜（+2154, n=16）が絶対狙い目

## 背景
全観測日の main_jug 角番1 を DD×曜日別に集計し、信頼度ティア（Tier A/B/Avoid）を確立した結果:

**Tier A（高信頼, n≥10, plus_rate=100%, avg_diff≥1500）:**
```
1位: 4系月曜      +2154  n=16  ← 最強・最信頼
2位: 7系土曜      +1996  n=13
3位: 4系土曜      +1908  n=19
```

4系月曜が圧倒的（次点比 +158枚差）。サンプル数も n=16 で十分な信頼性。

**Tier B（中信頼, n=5-9, plus_rate=100%, avg_diff≥1200）:**
```
1位: 4系月曜      +2604  n=9  ← サンプル小だが最高値（参考値）
2位: 4系月曜      +2343  n=9  ← 複数観測で4系月曜の一貫性を確認
```

Tier B の +2600 が Tier A の +2154 を上回るが、n=9（小サンプル）なので確度は下げる。

**Avoid ランク: 0件** ← 全観測パターンが100%プラス。「避けるべき日」が存在しない。

## アクション

**4系（DD=4,14,24）の月曜日は、メインジャグラー島の角番1を最優先で打つ**

運用フロー:
1. 前日確認で「明日が4系のいずれかか」を確認
2. 「月曜」なら角番1の稼働状況を朝一番で確認
3. メインジャグラー島 641-657 または 658-674 の rank_from_aisle=1 の台を選択

**次点狙い:** 7系土曜（+1996）、4系土曜（+1908）も信頼できる。

**信頼度の使い方：**
- Tier A のパターンは「実行」レベルの信頼度
- Tier B のパターンは「参考」レベル（情報収集が増えれば信頼度アップ）

## 例
```sql
-- 4系月曜（Tier A）のメインジャグ島角番1台を抽出
SELECT
  m.machine_number,
  m.machine_name,
  ROUND(AVG(m.diff_coins_normalized), 0) as avg_diff,
  COUNT(DISTINCT m.date) as n_days
FROM machine_detailed_results m
JOIN machine_layout ml ON m.machine_number = ml.machine_number
WHERE ml.machine_number BETWEEN 641 AND 691
  AND ml.rank_from_aisle = 1
  AND CAST(SUBSTR(m.date,7,2) AS INTEGER) IN (4, 14, 24)
  AND STRFTIME('%w', SUBSTR(m.date,1,4)||'-'||SUBSTR(m.date,5,2)||'-'||SUBSTR(m.date,7,2)) = '1'
GROUP BY m.machine_number
ORDER BY avg_diff DESC;
```

