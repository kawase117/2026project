title: 運用ルール確立のフレームワーク：Tier A/B/C による信頼度管理

## 背景
main_jug・main_mix の運用ルール確立で採用した Tier 分類法:

| Tier | 定義 | 信頼度 | 運用判断 |
|------|------|--------|---------|
| **A** | n≥10, plus_rate=100%, avg_diff 高 | 実行レベル | この日このパターンなら打つ |
| **B** | n=5-9, plus_rate=100%, avg_diff≥中 | 参考レベル | A を待つ暇があれば検討 |
| **Avoid** | plus_rate<60% or avg_diff<閾値 | 回避推奨 | この日は避ける |

**サンプル数（n）が信頼度を決める本質的な理由：**
- 統計的には 3-5 回の観測は「偶然」の可能性が高い
- 10 回以上の観測なら「ホールの意図的な戦略」の証拠
- plus_rate=100% でも n が小さければ「次の観測で逆転する可能性」

## アクション

新しい分析（末尾別、セクション別など）で運用ルールを作るたびに:
1. **Tier A の基準を設定する** （n≥10など）
2. **Tier B の基準を設定する** （より緩い条件で「参考値」レベル）
3. **Avoid を明示的に抽出する** （「避けるべき」は重要）
4. **「サンプル数が少ない高値」は参考値に格下げ** する勇気

みとやでの実績:
- main_jug 角番1: Tier A 24件, Tier B 49件
- main_mix DD×曜日: Tier A 198件 → ほぼ全パターンがプラス

