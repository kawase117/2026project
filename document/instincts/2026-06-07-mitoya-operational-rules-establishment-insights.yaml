title: AT列（main_mix）は「いつ打ってもプラス」 — Tier A 198パターン（圧倒的強さ）

## 背景
main_mix（台501-640, AT機列）の全角番合算で DD×曜日を集計した結果:

**Tier A（絶対狙い, plus_rate=100%, avg_diff≥3500）: 198パターン**
```
1位: 7系木曜      +5427  n=23
2位: 4系土曜      +5320  n=34
3位: 4系水曜      +5217  n=24
```

Tier A が 198件 = ほぼ全 DD×曜日 パターンがプラス。
**「避けるべき日がない」という異常な強さ**。

**Tier B（優先, plus_rate=100%, n≥20, avg_diff≥2500）: 420パターン**
- +3400～3500 の安定帯

**Tier C（参考）: 153パターン**
- +2400～2500 の下位帯

## 解釈

主要因は **機種構成**（スマスロ北斗・新鬼武者・スマスロ碧など高機械割機種）
と **高設定投入率の高さ**（AT機は全般的に ホール利益率が低いため設定が甘い傾向）。

角番効果（rank_from_aisle）よりも **DD×曜日による設定投入戦略が主要因**。

## アクション

**AT列は「日程選択よりも台番号・機種選択を優先」する**

運用判断:
1. Tier A（+5000超）の日に打つのは推奨だが、Tier C でも +2400 プラスは確実
2. 「今日は何系か」より「現在配置されている機種は何か」を重視
3. 高機械割機種（北斗系・新鬼武者など）がAT列に配置されていれば、
   いつ打ってもプラス期待値

**最優先 DD×曜日（Tier A の Top 5）:**
- 7系木曜（+5427）
- 4系土曜（+5320）
- 4系水曜（+5217）
- 7系木曜（+5099）
- 4系金曜（+5048）

## 例
```python
# main_mix（AT列）の日別期待値計算
dd_group = 4  # 本日が4系（4, 14, 24日）
weekday = 'Sat'  # 本日が土曜

# ルールCSVから該当パターンを検索
top_match = rules_df[
    (rules_df['dd_group']=='4系') &
    (rules_df['day_of_week']=='Sat') &
    (rules_df['rank_tier']=='A')
]
# → avg_diff=+5320, n=34 確定
expected_diff = 5320
```

