title: 全パターンプラスは「ホール戦略の不在」ではなく「高い設定投入量」を示す

## 背景
main_jug 角番1（73パターン）と main_mix（771パターン）
いずれも **「避けるべきパターン（Avoid）がゼロ」** という現象。

plus_rate=100% が全パターンに及ぶ理由:
- 機械割（設定）が「どのセクション・どのDD でも」高く設定
- または高い設定が「ほぼ全台」に投入
- ホール経営判断として「客の還元率を上げる（稼働率確保）」戦略

**対比:**
- bari（バラエティ島）の角番: ε²=0 で選別なし → 低設定混在
- main_jug 角番1: ε²=0.0067 で明確な選別 → 「角番1 に特に高設定」

## アクション

「全パターンプラス」が観測されたら:
1. **「どこに打ってもプラス」は幸運ではなく、次のステップへの合図**
2. 「差枚の大きさ」（+1500 vs +2500 vs +5000）で優先順を付ける
3. 「ホールの意図」を追従するより、「実績の差」で選別する

みとやの場合:
- main_jug: 「どの DD×曜日 も +1000～+2000」 → 高設定多投入の確認
- main_mix: 「どの DD×曜日 も +2400～+5400」 → より多投入の確認

**危険な誤解：「Tier A と Tier C に差がない」**
- Tier A は「最も確実」、Tier C は「ギリギリプラス」
- サンプル数・再現性を疑う必要がある

## 例
```python
# 「全パターンプラス」時の段階的分析
if df['plus_rate'].min() == 100.0:
    print("全パターンプラス → 次のステップ:")
    print("1. 差枚の分布（中央値、四分位数）を確認")
    print("2. サンプル数の偏り（小サンプルの高値）を検出")
    print("3. 機種・配置による条件付き分析へシフト")
```
