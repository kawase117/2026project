id: sqlite-connection-leak-without-context-manager
trigger: "sqlite3.connect() でDB接続を開いてクエリを実行するとき"
confidence: 0.92
domain: python-best-practices
source: session-observation
project_id: 2026project
project_name: pachinko-analyzer

# with文なしの sqlite3.connect は例外時に接続がリークする

## 背景
`ml/utils/db_queries.py` で `conn = sqlite3.connect(...)` → `pd.read_sql_query(...)`
→ `conn.close()` のパターンを使っていた。
`read_sql_query` が例外を出すと `conn.close()` が呼ばれない。

## アクション
必ず `with sqlite3.connect(db_path) as conn:` を使う。
SQLiteの `with` はコミットも自動で行う（エラー時はロールバック）。

## 例
```python
# NG
conn = sqlite3.connect(db_path)
df = pd.read_sql_query(query, conn)
conn.close()  # 例外時に到達しない

# OK
with sqlite3.connect(db_path) as conn:
    df = pd.read_sql_query(query, conn)
```

