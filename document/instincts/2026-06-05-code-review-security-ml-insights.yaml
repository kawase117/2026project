id: bare-except-swallows-keyboard-interrupt
trigger: "例外処理で except: pass を書くとき"
confidence: 0.98
domain: python-bugs
source: session-observation
project_id: 2026project
project_name: pachinko-analyzer

# 裸の except は KeyboardInterrupt を飲み込む

## 背景
`date_info_calculator.py` の `_check_holiday` で `except: pass` が使われており、
`BaseException`（`KeyboardInterrupt`や`SystemExit`含む）ごと無音で飲み込んでいた。
フォールバックがあるケースでも失敗が完全に隠れる。

## アクション
必ず `except Exception as e:` を使い `logging.warning` で記録する：
```python
import logging
try:
    if jpholiday:
        return jpholiday.is_holiday(date_obj.date())
except Exception as e:
    logging.warning("jpholiday.is_holiday() failed: %s", e)
```

## 例
```python
# NG
except:
    pass

# OK
except Exception as e:
    logging.warning("jpholiday failed: %s", e)
```

