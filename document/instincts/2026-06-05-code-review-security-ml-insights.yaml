# f-string SQL でのテーブル名/カラム名はallowlist必須

## 背景
`data_loader.py` の `load_machine_detailed_by_date` でf-string SQLが使われており、
`date_str` が直接クエリに埋め込まれていた。`database_accessor.py` では
`table_name`・`column` もf-string埋め込みだった。
Streamlit経由でユーザー入力が流れ込む可能性がある。

## アクション
- ユーザー入力が入りうる値は必ず `?` プレースホルダーでパラメータ化
- テーブル名・カラム名はSQL識別子なのでパラメータ化できない → allowlist で検証
  ```python
  ALLOWED_TABLES = frozenset({'machine_detailed_results', ...})
  def _validate_table(name):
      if name not in ALLOWED_TABLES: raise ValueError(...)
  ```
- `sqlite_master` のテーブル存在確認も `WHERE name=?` でパラメータ化可能

## 例
```python
# NG
query = f"SELECT * FROM {table_name} WHERE date = '{date_str}'"

# OK
_validate_table(table_name)
query = f"SELECT * FROM {table_name} WHERE date = ?"
df = pd.read_sql_query(query, conn, params=(date_str,))
```

