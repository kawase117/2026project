id: groupby-values-alignment-bug
trigger: "groupby集計後に .values でシリーズをDataFrameに代入するとき"
confidence: 0.95
domain: pandas-bugs
source: session-observation
project_id: 2026project
project_name: pachinko-analyzer

# .values 代入は groupby のインデックスアライメントを無視して行がズレる

## 背景
`backtest_helpers.py` の `compute_training_stats` で
`grouped['win_rate'] = (count_win / count_total * 100).round(2).values`
のように `.values` を使っていた。`count_win / count_total` は groupby
インデックスでアライメントされるが、`.values` で ndarray にしてから代入すると
`grouped` の行順と一致しない可能性がある。

## アクション
`.values` を使わず `.merge()` でインデックスを保持して結合する：
```python
win_rate_series = (count_win / count_total * 100).round(2).rename('win_rate').reset_index()
grouped = grouped.merge(win_rate_series, on=group_cols, how='left')
```

## 例
```python
# NG: インデックス不一致リスク
grouped['win_rate'] = (count_win / count_total * 100).values

# OK: merge でアライメント保証
win_rate_s = (count_win / count_total * 100).rename('win_rate').reset_index()
grouped = grouped.merge(win_rate_s, on=group_cols, how='left')
```

