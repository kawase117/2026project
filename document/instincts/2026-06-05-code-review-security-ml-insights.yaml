id: walrus-operator-parameter-overwrite
trigger: "Pythonのwalrus演算子 := をif条件の中で使うとき"
confidence: 0.99
domain: python-bugs
source: session-observation
project_id: 2026project
project_name: pachinko-analyzer

# walrus演算子でFalseを代入するとパラメータが永久に上書きされる

## 背景
`feature_engineering.py` の Feature 8 で以下のコードがあった：
```python
if is_train := False:  # Placeholder: always use stored stats
    pass
```
walrus演算子は関数パラメータ `is_train` をローカル変数として `False` に永久上書きする。
結果として学習統計（`dd_global_mean`, `dd_global_std`）が一切計算されなくなっていた。

## アクション
プレースホルダーで walrus を使わない。意図に沿った条件分岐を書く：
```python
# NG
if is_train := False:
    pass

# OK
if is_train:
    self.train_stats["dd_global_mean"] = float(self.df["diff_coins_normalized"].mean())
    self.train_stats["dd_global_std"] = float(self.df["diff_coins_normalized"].std() + 1e-8)
```

## 例
`if x := False:` は `x = False` を実行してから `if False:` を評価する。
既存の同名パラメータを黙って上書きするので特に危険。

