id: ml-rolling-stats-shift1-leakage
trigger: "機械別のローリング統計（移動平均・標準偏差）を特徴量として計算するとき"
confidence: 0.97
domain: ml-feature-engineering
source: session-observation
project_id: 2026project
project_name: pachinko-analyzer

# ローリング統計には必ず shift(1) を付けてデータリーケージを防ぐ

## 背景
`feature_engineering.py` の `_build_machine_history_features` と
`_compute_machine_rolling_stats` で `.rolling(14).mean().values` のように
shift なしで計算していた。`rolling(N).mean()` はデフォルトで当日を含むため、
当日の `diff_coins_normalized`（目的変数の源泉）が特徴量に混入していた。

## アクション
全ローリング統計に `.shift(1).fillna(0)` を追加する。
`stability`（std）、`consecutive_wins` の win_indicator にも同様の対処が必要。

## 例
```python
# NG (当日含む)
ma_14_diff = df_machine['diff_coins_normalized'].rolling(14, min_periods=1).mean().values

# OK (前日まで)
ma_14_diff = (df_machine['diff_coins_normalized']
              .rolling(14, min_periods=1).mean()
              .shift(1).fillna(0).values)
```

