# 当日 diff を特徴量マーカーに使うのは直接的なラベルリーケージ

## 背景
`_build_domain_specific_features` の Feature 2/3/6 で
`self.df["diff_coins_normalized"].values[i] > 1000` を条件に使っていた。
ラベル（diff）をそのまま特徴量に使うためモデルが汎化せず過学習する。
`rank_percentile` も同日diffでランクを計算しており同様の問題。

## アクション
前日の diff（lag-1）を使うよう変更する：
```python
_df_sorted['diff_lag1'] = (
    _df_sorted.groupby('machine_number')['diff_coins_normalized']
    .shift(1).fillna(0)
)
```
`rank_percentile` も前日diffでランク計算する。

## 例
```python
# NG: 当日diff使用
if (dd == 25) and (self.df["diff_coins_normalized"].values[i] > 1000):
    marker[i] = 1.0

# OK: 前日diff使用
if (dd == 25) and (diff_lag1_vals[i] > 1000):
    marker[i] = 1.0
```

