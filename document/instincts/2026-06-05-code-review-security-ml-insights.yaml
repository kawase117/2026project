# sys.stdout のモジュールレベル置換は import 時に Streamlit を壊す

## 背景
`database/main_processor.py` でモジュールの先頭に
`sys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')`
があった。Streamlit や他のモジュールからインポートされた場合、
そのプロセスの stdout/stderr が永続的に置き換わる。

## アクション
`if __name__ == "__main__":` ブロック内に移動する：
```python
if __name__ == "__main__":
    sys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')
    sys.stderr = io.TextIOWrapper(sys.stderr.buffer, encoding='utf-8')
    main()
```

## 例
CLIスクリプトは直接実行専用であっても、将来インポートされる可能性がある。
エンコーディング設定などの副作用は必ず `__main__` ブロックに閉じ込める。

