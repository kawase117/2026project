# debut_phase 効果はレジーム依存が強く、walk-forward での再学習が必須

## 背景
Phase11b で h_nonjug の debut 効果がレジーム分割で ρ=0.400（❌崩壊）と判定。pre 期の mature=-267（n=566）が post 期で mature=+134（n=8015）に反転。Phase10f で確認した生存バイアスがレジーム分割で再確認 — pre 期は mature サンプルが少なく不安定。v_nonjug は ρ=-0.500 で完全崩壊。

## アクション
- debut_phase を ML 特徴量にする場合、walk-forward で直近期間のデータから再学習すること
- 固定ウェイトで debut_phase を使うのは危険（序列が反転する）
- h_nonjug の top1=pre_existing は pre/post で維持されるが、下位の序列は安定しない
- v_jug は pre 期に debut/growth/mature が極少数（n=48/57/27）で検定不能。post 期のみ有意

## 例
h_nonjug debut 序列:
  pre期: pre_existing(+80) > growth(-55) > debut(-106) > mature(-267)
  post期: pre_existing(+283) > mature(+134) > growth(+34) > debut(-82)
  mature が最下位から2位に急上昇。ρ=0.400
