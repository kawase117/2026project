# h_nonjug X_DDS日の金曜はプレミアムが弱い（交互作用 p=0.007）

## 背景
Phase11a の 2-way ANOVA で h_nonjug のイベント日×曜日交互作用が p=0.007。蒲田7の「イベント日×土曜逆効果」に相当するパターンを探索した結果、みとやでは「金曜 X_DDS」のプレミアムが他曜日の半分程度。ただし mixed_805 の交互作用 p=0.017 は n=4,510 で統計力が弱い。

## アクション
- h_nonjug X_DDS 日の金曜は他曜日より控えめに評価する（+188 vs 平均+289）
- ただしマイナスではないので「避ける」ではなく「期待値を下げる」程度
- ホール全体では交互作用 p=0.069 で非有意。セグメント依存の弱いシグナル

## 例
h_nonjug X_DDS 曜日別: 火+393, 木+391, 水+348, 土+321, 月+205, 金+188, 日+176

