# みとやの曜日効果は非イベント日限定で効果量が小さい

## 背景
Phase11a で曜日を 3 粒度でスクリーニング。h_jug/h_nonjug/v_jug の segment 粒度で有意（p<0.01）だが、X_DDS 日限定では h_nonjug のみ境界的（p=0.018）で他は脱落。曜日別の avg_diff 差は最大 72（h_nonjug 非イベント日: 金=-38 vs 水=-110）で、角番効果（差=483）の 1/7。

## アクション
- 曜日を主軸の特徴量にしない。ε²=0.001 で寄与が小さすぎる
- ルールベース補正としても優先度は低い
- 唯一検討に値するのは「h_nonjug X_DDS 日の金曜は他曜日の半分」（+188 vs 火+393/木+391）だが、ANOVA 交互作用 p=0.007 で ε² は小さい

## 例
h_nonjug 非イベント日曜日別: 金=-38, 月=-80, 日=-27, 火=-99, 水=-110, 木=-105, 土=-60
差の最大値 72 は角番効果 483 の 15%

