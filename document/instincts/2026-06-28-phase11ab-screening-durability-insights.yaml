# 台番号末尾ゾロ目は v_nonjug でのみ有意（回避強化の方向）

## 背景
Phase11a で is_zorome（台番号末尾ゾロ目）を 3 粒度でスクリーニング。ホール全体 p=0.402 で脱落。唯一有意なのは v_nonjug（segment p<0.001, composite/非イベント日 p<0.001）だが、方向は「ゾロ目台がさらに悪い」（ゾロ目=-264 vs 非ゾロ目=-98）。v_nonjug 自体が回避セグメントなので新しい正のシグナルではない。

## アクション
- ゾロ目を台選びの正のシグナルとして使わない
- v_nonjug のゾロ目台は avg_diff=-264 で回避をさらに強化する情報にはなる
- h_nonjug segment で p=0.030 だが ε²=0.000 で実用価値なし
- 蒲田7のゾロ目（+49, 堅牢）とは構造が異なる。みとやではゾロ目に設定を入れる傾向がない

## 例
v_nonjug: ゾロ目=-264 (n=1705), 非ゾロ目=-98 (n=11654)。差=-166
h_nonjug 非イベント日: ゾロ目=+15 (n=3749), 非ゾロ目=-80 (n=36612)。ゾロ目がやや良いが ε²=0.000

