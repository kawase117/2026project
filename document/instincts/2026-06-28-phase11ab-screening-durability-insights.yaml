# みとやに DD full spectrum のトラフゾーンは存在しない

## 背景
Phase11a で DD 1-31 を 3 粒度（ホール全体 / セグメント別 / セグメント×event_scope）でスクリーニング。蒲田7では DD18-23 のトラフゾーン発見が重要だったが、みとやでは composite（X_DDS / 非イベント日分割）にすると X_DDS 側は全セグメント脱落（p>0.4）。DD full spectrum の有意性は X_DDS 日の DD4/7/14/17/24/27 が引き上げているだけ。

## アクション
- DD full spectrum の深掘りは不要
- DD 軸は is_xdds（binary）の粒度で十分。DD 個別フラグを ML 特徴量にする価値はない
- 蒲田7との構造差: 蒲田7はイベント日定義が「7のつく日+1のつく日」で DD が 12 種、みとやは X_DDS が 6 種。DD 内部の変動が小さいためトラフが出ない

## 例
v_jug segment: p=0.001 で有意だが、composite/非イベント日: p=0.009, ε²=0.002 と効果量が極小
h_nonjug composite/非イベント日: p=0.034 だが ε²=0.000。DD30(+278) のみプラスだが n=1197 で信頼性低

