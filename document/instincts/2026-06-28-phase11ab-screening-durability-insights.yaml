# h_jug corner は唯一のレジーム耐性ありシグナル（ρ=1.000）

## 背景
Phase11b でレジーム境界（2025-07-07、74台同日変更）の前後で角番・debut 効果の安定性を検証。全 5 セグメント × 2 軸 = 10 組のうち、✅安定 は h_jug corner のみ。

## アクション
- h_jug corner1 は機種入替を跨いでも信頼できる唯一のシグナル
- pre 期 corner1=+480, post 期 corner1=+361。絶対値は下がるが序列は完全一致
- 他のすべてのセグメント×軸はレジーム耐性がないか効果自体がない
- ML モデルで h_jug corner を特徴量にする場合、レジーム分割での再学習は不要

## 例
安定性サマリ:
  h_jug corner: ✅安定 (pre/post p<0.001, ρ=1.000, top1=corner1 維持)
  h_nonjug corner: ⚠️不安定 (ρ=0.800, top1 維持だが序列にブレ)
  h_nonjug debut: ❌崩壊 (ρ=0.400, mature が pre=-267→post=+134 に反転)
  v_jug/v_nonjug/mixed_805: ❌崩壊 or ✗効果なし

