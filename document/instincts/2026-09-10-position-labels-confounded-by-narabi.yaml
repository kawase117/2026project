# 台単位ラベルの位置分析は、粒度で分けないと並びの構造的偏りを店の意図と取り違える

## Core claim
並びラベルは**同一 section 内の連続 k 台**である。島（n台）の中で連続 k 台の取り方は
(n-k+1) 通りあり、そのうち端（角1）を含むのは1通りしかない。中間の角番は多くの
ブロックに現れる。したがって**ホールが何もしなくても、並びラベルを集めれば
角1が過少・中間角が過剰になる**。これは配置の証拠ではなく数え方の帰結である。

## Evidence
楽園蒲田、`granularity` を台単位に伝播させて分けた結果（2026-09-10）:

| 角番 | 全台系ラベル(40グループ/199台) | 並びラベル(129グループ/497台) | 設置構成比 |
|---|---|---|---|
| 角1 | **28.1%** [23.4, 33.3] | **4.0%** [2.4, 5.8] ★低 | 23.9% |
| 角2 | 27.1% ★高 | 12.3% ★低 | 22.5% |
| 角4 | 13.1% | 24.5% ★高 | 13.8% |
| 角5 | 9.5% | 20.7% ★高 | 11.4% |

**全台系ラベル（機種の設置台すべてを覆うので構造的偏りを受けない）では、
角1は設置比を下回らない。** むしろ点推定は上回る（有意ではない）。
2026-09-09 に「角1は11.6%で設置比23.9%の半分以下」と報告したのは、
この2種を混ぜた結果であり、実質的に並びラベルの偏りを見ていた。

末尾7も分けると有意性を失う: 全台系 12.1% [9.3, 14.7] / 並び 11.5% [9.2, 14.0]、
いずれも設置比 10.1% を含む（混合時は 15.0% [12.9, 17.2] だった）。

## Interpretation
- 2026-06-17 の残差法による「角1は全セグメントで残差マイナス」は**独立した手法**であり、
  この訂正は残差法の結論を否定しない。否定するのは「外部ラベルがそれを裏付けた」という
  こちらの主張のほうである
- 混合時に効果が大きく見えたのは、ラベルの7割が並び由来だったため

## 限界
- 粒度が決まるのは楽園の1,058台中773台。285台は機種名が一致せず、
  散文アカウント由来の1,189台（蒲田1/7）は本文が機種行を列挙しないので原理的に不明
- 全台系ラベルは40グループ・199台しかなく、区間が広い。「角1に偏りが無い」を
  積極的に主張できるほどの検出力も無い。**分からない、が正しい現状**

## Action
- `external_result_machines` で位置を測るときは **必ず `granularity` で層別する**。
  並びと全台系を同じ集計に入れない
- 並びラベルで角番・セクション内位置を語らない。連続ブロックである時点で
  位置分布は構造的に決まっている
- 位置の主張には全台系ラベル（または `1/N` のような非連続ラベル）だけを使う
- 粒度が NULL の台は集計から落とす。「不明」を「全台系」に寄せない
