# 同じ日付の過去3回は標本が小さすぎる。ホール水準も機種も「弱い」と決めつけない

## Core claim
22日のような同日付は、DBの範囲（7月以降）で3回しかない。3回とも負でも、**ホール水準の予告を割り引く根拠にはならず**、機種ごとの3回（4〜9台なら当たり台の偏りが大きい）は特に当てにならない。

## Evidence
10/22の予測で、蒲田7の22日（+136／−361／−207）と蒲田1の22日（−25／−70／−58）が負だったことから「予告の全域強化に沿っていない」と書いた。実際は蒲田7 +234/台（100台が+2,000以上）、蒲田1 +104/台で、どちらも過去の22日を上回った。楽園のモンスターハンターライズ（22日の3回が −230／−940／−465、4〜9台）も弱いと書いたが、当日は19台で +1,431 と最強クラスだった。一方で、楽園の22日は +201／+130／+180 と一貫して高く、4回目も +154 で続いた。同じ3回でも、一貫して高いホール水準は続き、機種別の負けは続かなかった。

## Action
1. 同日付の3回は「傾向」と書くまでにとどめ、予告や機種の採否を決める根拠にしない。
2. 機種別の3回は、台数が10台未満なら参考にとどめる。
3. 「避ける」にするなら、同日付以外の条件（別の日付種別での実測、台数が多い機種）も満たすものだけにする。
4. ホール水準の見立てを書くときは、過去3回の幅（−361〜+136など）を併記し、「外れうる」と書く。

## 補足
10/22の「ミリオンゴッドを避ける」は同日付3回（−616／−524／−1,276、21〜25台）に基づき、結果もホール比 −148 で成立した。台数が多く方向が揃う場合は、避ける根拠にしてよい。
