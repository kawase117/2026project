# クイック収集は「完走」と「今日のデータ」が別。報告の前にホールごとの observed_at と最大Gを見る

## Core claim
`scraper.realtime.run --mode quick` は終了コード0で完走しても、楽園蒲田（サイトセブン）が**前日の最終値のまま**返ることがある。ランキングは `--latest-per-hall` で最新ファイルを選ぶので、古いデータでも順位は出る。見かけ上は正常で、報告すると昨日の台を今日の候補として出してしまう。

## Evidence
10/22 15:34 の収集で、楽園蒲田のスナップショットのファイル名は 20261022_153412 なのに、全269台の `observed_at` が 2026-10-21T18:11、最大G数 5,499（昨日の値）だった。他の4ホールは 10/22 15:34〜15:49 で正常。ランキング1位は昨日のデータの 1193番（ネオアイムEX）になっていた。同日 17:00 の再収集では今日の値（最大G 5,078）に更新された。

## Action
1. クイック収集の後、**ホールごとに最新スナップショットの `observed_at`（日付と時刻）と最大G数**を確認する。ファイル名の日時は信用しない。
2. 今日の日付でないホールは、ランキング・列の合算RBを**報告から外す**。「楽園は昨日のデータのまま」と言い、時間を置いて再収集する。
3. 再収集の後も、同じ確認を繰り返す。

## 例
```python
# 5ホールの最新ファイルの observed_at を数える
for h in halls:
    f = sorted(glob(f'scraper/realtime/output/snapshots/{h}_quick_{today}_*.jsonl'))[-1]
    c = Counter(str(json.loads(l)['observed_at'])[:16] for l in open(f, encoding='utf-8-sig'))
```

