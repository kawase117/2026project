# 末尾7は全条件・全曜日で末尾5-9内において常に下位

## 背景
digit7_vicinity_summary.csv: 末尾7は土曜4位・水曜5位（最下位）・7含む日4位・その他4位。
weekday_digit_cross_report.csv: 末尾7が曜日別全末尾平均を上回る曜日は木曜(+57)・火曜(+22)のみ。
日曜(-32)・水曜(-53)・金曜(-30)で平均を大きく下回る。

ユーザー仮説: 「蒲田七ではスロットユーザーが末尾7（ラッキー7）を朝一優先で選ぶため、
ホール側はそれを知っており末尾7には高設定を入れない」

7含む日（7・17・27日）に末尾7が高くなる（mean=311.1）唯一の例外あり。
ただしその日でも末尾5-9内では4位であり末尾7が最強にはなっていない。

## アクション
末尾7には「期待値を下げるバイアス」をLTRスコアに組み込むことを検討。
例外: 7含む日（day_of_month in [7, 17, 27]）はバイアスを緩和する設計も考えられる。

## 例
全期間 mean_diff: 末尾7=190.5 vs 全末尾平均≈195（わずかに下位）
土曜: 末尾6=307.8 vs 末尾7=224.3（末尾6が圧倒的に強い）
水曜: 末尾7=139.6（全曜日・全末尾中でも特に低い水準）
