# 土曜は末尾6、水曜は末尾8・9が強い — 曜日で「強い末尾」パターンが異なる

## 背景
digit7_vicinity_summary.csv（末尾5-9の条件別順位）:

| 条件   | 1位 | 2位 | 3位 | 4位 | 5位 |
|--------|-----|-----|-----|-----|-----|
| 土曜   |  6  |  8  |  7  |  9  |  5  |
| 水曜   |  8  |  9  |  5  |  6  |  7  |
| 7含む日|  8  |  6  |  9  |  7  |  5  |
| その他 |  6  |  9  |  8  |  7  |  5  |

- **土曜**: 末尾6（mean=307.8）が圧倒的1位。「7の左隣で出玉演出」仮説と整合。
- **水曜**: 末尾8・9が上位、末尾6・7は下位。土曜とは異なり「7の右側（8・9）」が強い。
- **末尾7**: 全4条件で常に4位または5位（下位固定）。

## 解釈（ユーザー仮説）
- 土曜: 技術レベルの低いオカルト客が「7狙い→その周辺6に設定が入っていた」という体験をさせる
- 水曜: 設定投入日として業界で知られる曜日。土曜とは異なるユーザー層向けの台配置戦略

## アクション
ML特徴量候補:
- `is_saturday AND last_digit == "6"` の交互作用
- `is_wednesday AND last_digit in ["8", "9"]` の交互作用
いずれも過学習警戒。walk-forwardで寄与を確認してから採用する。

## 例
土曜 末尾6 mean=307.8 vs 土曜全末尾平均≈209（+47%）
水曜 末尾8 mean≈255、末尾9 mean≈236 vs 水曜全末尾平均≈193（+32%、+22%）

