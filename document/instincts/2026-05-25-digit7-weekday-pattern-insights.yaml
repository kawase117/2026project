# 日付の日部分に7を含む日（7・17・27日）は末尾7のmean_diffが75%高い

## 背景
day7_digit_report.csv より:
- day7_flag=True（7日・17日・27日）の末尾7 mean_diff = 311.1
- day7_flag=False（その他の日）の末尾7 mean_diff = 177.1
- 差: +134（+75%）

ホールが「日付に7がある日に末尾7へ高設定を入れる」演出をしている可能性。
ただし7含む日でも末尾5-9内の順位は4位（8>6>9>7>5）であり、
末尾7が突出しているわけではなく「全体的に出す日で末尾7も上がる」可能性もある。

## アクション
ML特徴量候補: `day_of_month.isin([7, 17, 27])` フラグ。
全320日中約46日（14%）のサンプルのため過学習警戒。
walk-forwardでの寄与確認が必須。
「7含む日の全末尾平均 vs その他」を先に確認して全体的な出す日フラグかを検証する。

## 例
7含む日の末尾7: mean=311.1 / その他: mean=177.1 → +75%
ただし7含む日の末尾8が1位（末尾7は4位）のため末尾7専用の日ではない可能性

