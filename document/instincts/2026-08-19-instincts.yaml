# 「ルールに情報が無い」の確信度と「今日どれが来るか」の確信度は別物

## 背景
2026-08-18 楽園蒲田で、予告の「8台設置機種＝全台系」ルールを90日統計で否定し
（反証側は的中）、対抗として台数の多い機種（モンキーターンV 12台、甲鉄城のカバネリ
海門決戦18台）を提示したが、対抗予測は2/2とも外れた。当日唯一の閾値超えは、対抗予測
の対象から外していた同機種の旧筐体3台（甲鉄城のカバネリ、+2,422）だった。選定時、
「台数が多い方が少台数バイアス（平均差枚が跳ねやすい）が無く信頼できる」という基準を
使ったが、これは「少台数機種に高設定が入りにくい」ことを意味しない。両者を混同していた。

## Core claim
統計的反証（「このルールには当てにできる情報が無い」）は90日規模のデータで高い確信度を
持てるが、「今日どの機種が来るか」という対抗予測は、その日の閾値超え数K（本件では1機種、
候補55機種）に対する事前確率（1/55程度）でしか支えられず、同じ強さで語ってはならない。
また「台数が多い＝スコアの信頼性が高い」は「台数が多い＝当たりやすい」とは別の主張である。

## Evidence
- n_observations: 1（2026-08-18、対抗予測2件中2件が外れ）
- data scope: single-hall, single-day
- metric scope: diff / rank
- result summary: 対抗予測（モンキーターンV rank6/55、カバネリ海門 rank47/55）はいずれも
  外れ、当日1位は対抗予測から除外した旧筐体3台だった

## Interpretation
- 少台数バイアス（少ない台数だと平均差枚が偶然跳ねやすい）は指標の測定誤差の話であって、
  ホールの設定投入確率の話ではない。台数の多寡と「高設定が入る確率」に相関があるという
  根拠は無い
- 反証（棄却）と予測（的中）は別の統計的主張であり、前者の確信度をそのまま後者に流用しない

## Action
- 対抗予測を提示するときは、反証の確信度（90日統計に基づく）とは別に、対抗予測自体の
  事前確率（候補数分の1程度）を明示する
- 機種選定の根拠に「台数が多い」を使うときは、それが「スコアのノイズが少ない」ためなのか
  「当たりやすい」ためなのかを区別して書く。後者は根拠にしない

