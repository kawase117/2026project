# cmd.exe /c 経由の起動はこの実行環境では実行されず、バナーだけ返してexit 0で終わる

## 背景
2026-08-19、site777の稼働テストで `cmd.exe /c "scraper\site777\run_site777_complete.cmd -MinGames 2000"` を
2回実行し、いずれもexit code 0・所要数秒で「完了」と報告された。しかし出力先の
`site777_full_run_latest.json`のstartedAtは前回(8/17)のままで、当日8/19付で更新された
ファイルは1件もなかった。標準出力はcmd.exeの起動バナー（"Microsoft Windows [Version...]"）
だけで、update gateやpythonの出力が一切無かった。最小再現として`cmd.exe /c "echo HELLO"`を
実行しても同様にバナーのみでHELLOが出力されず、cmd.exe /c自体がコマンド文字列を実行して
いないことを確認した。一方`powershell.exe -NoProfile -Command "echo HELLO"`は正常に動作し、
`powershell.exe -NoProfile -ExecutionPolicy Bypass -File run_site777_complete.ps1 -MinGames 2000`
で.cmdをバイパスして.ps1を直接呼び出すと、msedgeが実際に起動し119機種587台を19分で完走した。

なお、この過程で「msedgeプロセスは起動しているがMainWindowTitleが空＝別ウィンドウ
ステーションで見えない状態になっている」という診断を一度下したが、これは誤りだった。
実際の原因はcmd.exe /cがコマンドを一切実行していないことであり、起動したように見えた
msedgeプロセスは無関係な残留プロセスだった可能性が高い。

## Core claim
この環境（Claude CodeのBashツール、非対話的な起動経路）から`cmd.exe /c "<command>"`を
実行すると、コマンド文字列が実行されずcmd.exeの起動バナーのみを返してexit code 0で
終了する。`powershell.exe -NoProfile -ExecutionPolicy Bypass -File <script>.ps1 <args>`
で.ps1を直接呼び出すと正常に実行される。

## Evidence
- n_observations: 3(cmd.exe /c失敗2回、echo単体テスト1回、powershell.exe -File成功1回)
- data scope: 実行環境固有(Claude Code Bashツール on Windows)
- metric scope: other(プロセス起動・ファイル更新時刻)
- result summary: cmd.exe /cは`echo`すら出力しない。powershell.exe -Fileは119機種587台を
  19分で完走し、site777_complete_run_latest.jsonのstartedAtが当日UTC時刻で更新された

## Interpretation
- exit code 0は「コマンドが実行された」ことを保証しない。この環境では特に、GUI/ブラウザ
  自動化を伴う.cmdラッパー経由の呼び出しで顕著にサイレント失敗する
- 「msedgeプロセスはあるがウィンドウが見えない＝ウィンドウステーション分離」という仮説は
  今回は誤診断だった。プロセス存在だけで自動化が動いていると判断せず、出力ファイルの
  実際の更新時刻(タイムスタンプ)で裏取りすること
- 原因(cmd.exe /cのクォーティング処理がこのBashツールの呼び出し経路と噛み合わない等)は
  未確定。ワークアラウンドの有効性のみ確認済み

## Action
- site777に限らず、このプロジェクトの.cmdラッパーをClaude Codeから実行するときは
  `cmd.exe /c "<script>.cmd"`を使わず、内部で呼んでいる.ps1を
  `powershell.exe -NoProfile -ExecutionPolicy Bypass -File "<full path>.ps1" <args>`で
  直接起動する
- バックグラウンドタスクが「completed / exit 0」と報告されても、site777の場合は
  `site777_complete_run_latest.json`または`site777_full_run_latest.json`の`startedAt`
  (UTC)が今回の実行時刻と一致するかを必ず確認してから「完走した」と報告する
- 疑わしいときは`powershell.exe -NoProfile -Command "echo TEST"`のような最小コマンドで
  実行経路そのものが機能しているかを先に確認する

