# 機種平均ではなく台番号別のG数×差枚の歴史的相関で単一台シグナルを検出する

## 背景
2026-08-18 楽園蒲田、マギアレコード（増台直後、9台→12台）の12台中、8000G超は台2133
（+2,715）と台2130（−1,190）の2台のみ。機種平均は+104枚で閾値+1800に遠く届かず
「仕掛けなし」に見えた。しかし台2133単体の2026年通年履歴を見ると、8000G以上に達した
日（12/145日、8.3%）の平均差枚は+6,187で、8000G未満の日（+141）やホール全体の
8000G以上平均（+2,292）を大きく上回り、G数×差枚の相関係数もホール平均r=0.273に対し
r=0.524と明確に強かった。台2130は同じ閾値超えでも歴史的相関がr=0.296と弱く、当日も
逆方向（−1,190）だった。

## Core claim
機種平均が閾値未達でも、機種内の特定の台番号が「歴史的にG数×差枚相関が強い」場合、
その台が当日8000G超などの高回転を記録したことは、機種平均より高精度な設定示唆の
検出材料になりうる。この非対称性（機種内1台だけが強い相関を持つ）はkishu-ichi-decoy
（機種内1台だけ高設定の撒き餌）が実データに残す痕跡と一致する。

## Evidence
- n_observations: 2台（2133・2130、各140日以上の履歴）
- data scope: single-hall, single-machine, per-table
- metric scope: games_normalized / diff / correlation
- result summary: 台2133 r=0.524（ホール平均r=0.273の約1.9倍）、8000G以上日の平均差枚
  +6,187（ホール平均+2,292の2.7倍）。台2130は r=0.296 でホール平均並み

## Interpretation
- 「機種全体は撒き餌に見えるが、特定の台番号だけは本命」という構図が、台単位の
  G数×差枚相関という定量指標で識別できる可能性がある
- ただし今回は1機種2台のみの観察。台の物理位置（角番・通路沿い等）や機種特性による
  交絡は未統制。一般化する前に他機種・他ホールで同じ手法を試す必要がある
- 増台直後（新台ではなく既存タイトルの台数増加）は、既存の台番号（2133等）と新規の
  台番号が混在するため、履歴の長い台番号だけがこの分析の対象になる

## Action
- 機種平均が閾値未達でも当日高回転（目安8000G以上）の台があれば、その台番号の
  過去90日〜通年のG数×差枚相関をホール全体のベースライン（本件ではr≈0.27）と比較する
- 相関がホール平均を明確に上回る台番号は、機種平均のスコアに関わらず個別に記録する
- この手法はまだ1事例のみ。運用の一次シグナルにはせず、機種平均スコアの補助情報として
  扱うこと

