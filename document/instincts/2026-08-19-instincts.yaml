# 稼働が低い日は「仕掛けなし」の判定材料が薄い、判定失敗の証拠として扱わない

## 背景
2026-08-18 楽園蒲田の予告採点で、名指し4機種が全て閾値+1800未達（rank14/30/38/52位、55機種中）だった。
当初はこれを「予告に情報が無かった」とだけ解釈しかけたが、ホール全体の平均games_normalizedが
1,878G（90日窓平均3,144Gの下位15.9%タイル）、games>=3000到達率が20.4%（90日平均43.7%、
下から7/88日）という閑散日だった。RB確率による設定判定も、対象24台中games>=3000到達は
わずか4台で不成立だった。

## Core claim
ホール全体の稼働（平均games_normalizedやgames>=3000到達率）が90日窓で下位20%程度まで
落ちている日は、機種名指し・末尾・角番などの主張を「外れた」と判定する検出力そのものが
構造的に低下している。差枚ベースでもRB確率ベースでも、客が座っていない台は判定材料が無い。

## Evidence
- n_observations: 1（2026-08-18、楽園蒲田）
- data scope: single-hall, single-day
- metric scope: diff / games_normalized / rb_probability
- result summary: 平均games 1,878G（baseline 3,144G）、games>=3000到達率20.4%（baseline 43.7%）。
  名指し4機種のうちRB判定可能だったのは1台のみ

## Interpretation
- 「機種名を挙げた主張が閾値未達だった」ことと「仕掛けが存在しなかった」ことは同じではない。
  客が付かなかった日は後者を主張する材料が無い
- 差枚が主指標として機能するのは、ある程度の稼働（客の集合知シグナル）が前提になっている
  （feedback-scoring-must-separate-setting-from-pnl の回転数ロジックと同型の制約）
- 単日1件の観察であり、閾値「下位20%」は暫定値。稼働低下と外れ率の系統的な相関は未検証

## Action
- 採点前にホール全体の平均games_normalizedを直近90日ベースラインと比較し、パーセンタイル
  を記録する。下位20%程度の閑散日では「外れた」の結論に稼働低下の注記を必ず添える
- RB確率での判定を試みる前に、対象機種の games>=3000 到達台数を先に数える。到達台数が
  少なければ「判定不成立」として報告し、「否定」とは書かない
- 閑散日は当日の閾値超え数K自体が構造的に減る（分母が薄い）。named_models_hypergeom_criterion
  等でKを使う判定でも、K減少が『仕掛けが絞られた』ではなく『客が来なかった』結果である
  可能性を割り引くこと

