# 楽園蒲田の当日運用は「announce凍結→15時台/17時台のsite777実行→ベースライン強い主張優先で突き合わせ」の順で行う

## 背景
2026-08-19、@kawasakislotの予告(化物語=9台設置・機種名指定の二重主張、末尾9のposition_rule)を
`backtest/announce/rakuen__20260819__kawasakislot.json`に事前登録済みの状態で、site777の
稼働テストを正午前(11:49〜12:08)に実行した。表データ(119機種587台)は完全取得できたが、
グラフ(差枚)対象は0件だった。2,000G以上の台がまだ存在しない時間帯だったためで、
`scraper/site777/INSTINCTS.md`の「午後の速報では設定推定はほとんど効かない」という
既存知見と整合した。この日はannounce側の分析で化物語(直近30日20.0%・ホール平均5.7%相当の
3.5倍)とハッピージャグラーVIII(0.0%)を対照群として名指し予測(prior_prediction)まで
凍結済みだった一方、末尾9のposition_ruleは通年ベースラインがプール/AT/JUGいずれも
ほぼゼロ(pooled -9.0±12.6)で、RB確率のみ弱い偏り(3/11)という状態だった。

## Core claim
楽園蒲田の当日運用フローは (1) 予告ツイートの分析をannounceとして即日中に凍結する、
(2) site777は15時台・17時台以降の2回、`powershell.exe -File`で実行する(15時以前は
グラフ対象0件になりうるため判断材料にしない)、(3) 3レポートとannounceのclaims/
prior_predictionを突き合わせる際は、通年/90日ベースラインが強い主張(例: 化物語の
20.0% vs ホール平均5.7%)を最優先で確認し、ベースラインがほぼゼロの主張(末尾
position_ruleなど)は当日実測が明確に上振れない限り採用しない、という優先順位で
進めると再現性のある判断ができる。

## Evidence
- n_observations: 1(2026-08-19の運用テストで手順を確立。的中率など結果の検証はまだ)
- data scope: single-hall(楽園蒲田), single-day
- metric scope: other(運用フロー・タイミング)
- result summary: site777は正午前実行でグラフ対象0件(表データのみ完走)。手順自体は
  実行可能と確認できたが、予測精度の実証はこの回では行っていない

## Interpretation
- これは判断精度の主張ではなく、再現可能な運用手順の確立である。次回以降、同じ手順を
  繰り返して精度を検証する必要がある
- 15時台・17時台という時間帯指定は`scraper/site777/INSTINCTS.md`の既存観測(8/17時点、
  13:55でも2,000G以上9台のみ)を踏襲したもので、本日さらに0件という形で下限側が
  再確認された

## Action
- 当日朝〜昼: announceの凍結状況とclaims/n9_roster等の事前分析を確認する
- 15時台: site777を`powershell.exe -NoProfile -ExecutionPolicy Bypass -File
  scraper\site777\run_site777_complete.ps1 -MinGames 2000`で実行し、3レポート
  (analysis/last_digit/setting、いずれも`_filtered.md`)を読む
- 17時台以降: 2回目を実行し、進捗(グラフ対象台数の増加)を比較する
- 突き合わせはベースラインが強い主張から優先して確認し、ベースラインがほぼゼロの
  主張は当日実測の明確な乖離が無ければ採用しない

