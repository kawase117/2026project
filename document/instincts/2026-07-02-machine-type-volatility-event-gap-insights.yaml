# n_activeは特定機種の設置台数ではなくホール全体の当日稼働台数

## 背景
Top3/Bottom3ランキングはホール全体の中でのその日の順位なので、n_active(games_normalized>=400を満たす当日の稼働台数)もホール全体の合計値。蒲田七のような数百台規模のホールではn_active<6（ホール全体が6台未満稼働）はほぼ発生しない。ユーザーが「特定機種が6台以上ある日がほとんど無い」という意味だと誤解した実例があった。

## アクション
n_active系のフィルタや列を説明するときは「ホール全体の当日稼働台数」であることを明示する。機種単位の設置台数と混同されやすいので、変数名や出力列名にhall/machineのスコープを明記するか、説明時に必ず両者を対比して述べる。

## 例
eda/machine_name_significance_scan.py の n_active = groupby("date")["machine_number"].transform("nunique")（全機種合算）。

