# 同一機種名の複数ホール比較で機種スペックとホール裁量を切り分けられる

## 背景
新規DBクエリなしで、既存の機種別サマリーCSV(eda/results/machine_name_significance/*.csv)を機種名でマージするだけで実施可能。ホール間のhit104_rateのばらつき(range)が小さい機種はスペック起因（ジャグラー系: range 1.1〜4.3pt）、大きい機種はホール裁量の候補（回胴黙示録カイジ 狂宴: range 22.7pt、ただし現在ほぼ撤去済みのため実運用価値は低い）と分類できた。

## アクション
機種の強弱を評価する際、可能な限り複数ホールに設置されている機種を対象に選び、ホール間分散の大小で「スペック限界」と「ホール裁量」を切り分けてから、bottom3_lift等の相対指標を解釈する。単一ホールのみのデータで機種を評価すると、この2つの原因を混同したまま結論を出すリスクがある。

## 例
Bashでの即時集計: 3ホールのmachine_summary.csvをmachine_nameでマージし、groupby("machine_name")でhit104_rateのstd/rangeを比較。
