# 慢性的ワースト機種の下振れは既知のDD/曜日イベント軸ではほぼ説明できない

## 背景
東京喰種は全3ホール共通でbottom3_lift最高（慢性的にその日のワースト3に入りやすい）かつhit104_rateも平均より高い(高ボラティリティ機種)。is_any_event/is_x_day/is_weekendでevent日/通常日に分割して検定した結果、hit104_gapは全ホール・全軸で弱いが一貫してプラス(Cramér's V 0.017〜0.12、ほぼsmall未満)だったが、bottom3_gapはホールごとに符号が割れ(蒲田1+、蒲田7/みとや-)、Cramér's Vはほぼ0(0.0002〜0.031)で信号なし。ボラティリティ上位機種全体で見ても、既知のイベント軸でCramér's V>=0.1を示す機種は蒲田1で5.9%、蒲田7/みとやで0%だった。

## アクション
「機種の高ボラティリティ＝既知のイベントカレンダーによる投入格差」という仮説は安易に採用しない。hit104側の弱い上振れ効果と、bottom3側の説明力ゼロは別々に評価する。集約軸(is_x_day全体)でテストすると、ホール×特定DD限定の鋭い信号が平均化されて薄まる点に注意し、必要なら機種×DD単位(1〜31)の粒度まで分解して確認する。

## 例
eda/machine_volatility_event_gap_scan.py の summary_report.csv。東京喰種のbottom3_gap: 蒲田1=+0.63(p=0.35), 蒲田7=-0.33(p=0.18), みとや=-0.65(p=0.29)。全て非有意かつ符号不安定。

