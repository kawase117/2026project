# 「27日全設定」等のDD単位の強い日は特定ホール・特定機種に限定され、他ホールには一般化できない

## 背景
東京喰種のDD別(1〜31)hit104_rate/avg_payoutを3ホールで比較。蒲田7ではdd27がavg_payout=107.14(31日中最高)、hit104_rate=45.5%(最高)で明確に突出。蒲田1ではdd27は平凡(36.8%, 102.10)で、代わりにdd7が突出(46.2%, 106.30)。みとやではdd27もdd7も平凡で、dd14/dd4/dd24が突出。「7のつく日」グループ内でも蒲田7はdd7とdd27が強くdd17は平凡、というように同一グループ内でも一様ではない。

## アクション
特定DD（27日など）のイベント効果を語るときは、必ずホール名と機種名をセットで確認する。is_x_dayのようなDD群を束ねた集約軸での検定は、ホール×DD特異的な強い信号を平均化して薄めてしまうため、集約軸で効果が小さく出ても個別DDで強い信号が隠れている可能性を疑う。

## 例
東京喰種dd27: 蒲田7=45.5%/107.14(最高), 蒲田1=36.8%/102.10(平凡), みとや=40.8%/102.10(平凡)。

