# 絶対閾値(104%)による機種比較は機種スペックとホール裁量を混同する

## 背景
3ホール(蒲田1/蒲田7/みとや)で機種別hit104_rateを集計した結果、ジャグラー系ノーマル機（ジャグラーガールズ、ネオアイムジャグラーEX、ゴーゴージャグラー3、マイジャグラーV等）が全ホール共通でhit104_rate=25〜26%と低く、かつホール間のばらつきも小さかった(range 1.1〜4.3pt)。これは公表機械割レンジが狭い機種スペックの限界であり、ホールの設定投入戦略とは無関係。一方、同じ機種群のbottom3_lift（その日のホール内相対順位で下位3台に入る頻度、設置台数で正規化したリフト比）はほぼ0(0.00〜0.02)で、相対指標では全く不利ではなかった。

## アクション
機種間比較では絶対閾値ベースの指標(hit104_rate、payout_rateの絶対値)を主指標にしない。設置台数で正規化した相対順位ベースの指標（Top3/Bottom3選出リフト比など）を優先する。機種スペックの影響を切り分けたい場合は、同一機種名が複数ホールに存在するケースを使い、ホール間のばらつき(range/std)が小さければスペック起因、大きければホール裁量の候補と判定する。

## 例
eda/machine_name_significance_scan.py の hit104_rate と bottom3_lift を比較。ジャグラー系: hit104_rate=25-26%(全ホール共通で低い) だが bottom3_lift≈0(不利ではない)。

