# 大サンプルでのp値はほぼ常に0になり判断材料にならない。効果量を主指標にする

## 背景
機種別のKruskal-Wallis検定(n=125,608〜236,469)で全指標・全ホールでp≈0だったが、効果量(epsilon squared)はhit104_rateで0.007〜0.008、avg_payout_rateで0.017〜0.033と、いずれも"small"閾値(0.01〜0.06)以下かその境界。同様にTop3/Bottom3選出のカイ二乗検定でもp≈0だがCramér's Vは0.08〜0.17程度。p値だけを見ると「機種間に有意差がある」と誤読するが、実質的な説明力は乏しい。

## アクション
n>1万件クラスのデータで検定するときは、p値を「発見」として報告しない。Kruskal-Wallisはepsilon squared(small≈0.01, medium≈0.06, large≈0.14)、カイ二乗はCramér's V(small≈0.1, medium≈0.3, large≈0.5)を主指標として結果を解釈する。複数機種×複数ホール×複数軸で検定数が多い場合はさらに多重比較の観点から個別p値を無視し、効果量ランキングで議論する。

## 例
eda/machine_name_significance_scan.py, eda/machine_volatility_event_gap_scan.py の significance_summary.csv で epsilon_sq/cramers_v 列を主指標として運用。

