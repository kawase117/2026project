# 日本語出力はBashではなくPowerShellでPYTHONIOENCODING=utf-8を設定して実行

## 背景
Bash toolで日本語を含むPythonスクリプトを実行すると、出力がmojibake（文字化け）になる。
PowerShellで `$env:PYTHONIOENCODING = "utf-8"` を設定してから実行すると正常に表示される。

## アクション
日本語出力を含むPythonスクリプトは以下で実行:
```powershell
$env:PYTHONIOENCODING = "utf-8"; python script.py
```
Bash toolは使わない。

## 例
```
# NG: Bash tool
python _tmp_predict.py  # → 文字化け

# OK: PowerShell tool
$env:PYTHONIOENCODING = "utf-8"; python _tmp_predict.py  # → 正常表示
```
