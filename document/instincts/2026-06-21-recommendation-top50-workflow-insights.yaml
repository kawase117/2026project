# 蒲田7のDB実体ファイル名は「マルハンメガシティ2000-蒲田7.db」

## 背景
db/kamata7.db は0Bの空ファイル。実データは db/マルハンメガシティ2000-蒲田7.db（55.73MB）に格納されている。
前回セッションでも同じミスが発生しており、kamata7.dbを開いてテーブルが見つからないエラーが出た。

## アクション
蒲田7のデータを読む場合は必ず `db/マルハンメガシティ2000-蒲田7.db` を指定する。
`kamata7.db` は使用しないこと。

## 例
```python
DB_PATH = 'db/マルハンメガシティ2000-蒲田7.db'  # 正しい
# DB_PATH = 'db/kamata7.db'  # 空ファイル、使用禁止
```

