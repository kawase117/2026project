# machine_masterのキーはmachine_name_normalizedであり、machine_numberではない

## 背景
machine_masterテーブルのカラム構成:
- machine_name_normalized（キー）
- jug_flag, hana_flag, oki_flag, bt_flag
- display_names, official_name, created_at, updated_at

machine_numberカラムは存在しない。A機種判定はmachine_name_normalizedでフラグを取得するか、
machine_detailed_resultsのmachine_nameとキーワードマッチで行う。

## アクション
1. machine_masterからはmachine_name_normalizedでjug_flag/hana_flag/bt_flagを取得
2. machine_numberとの紐付けはmachine_detailed_resultsのmachine_nameを経由して行う
3. キーワードマッチ（ジャグラー、ハナハナ等）を併用して漏れを補完

## 例
```python
# 正しい: machine_name_normalizedでフラグ取得
mm = pd.read_sql("SELECT * FROM machine_master", conn)
a_names = set(mm.loc[mm['jug_flag']==1, 'machine_name_normalized'])

# 誤り: machine_numberカラムは存在しない
# mm.loc[mm['bt_flag']==1, 'machine_number']  # KeyError
```

