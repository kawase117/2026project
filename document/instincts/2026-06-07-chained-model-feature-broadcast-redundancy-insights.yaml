# 「セクション内に対象が1台しかいない」上流予測を groupby-mean でブロードキャストすると、下流モデルにとって完全に冗長な特徴量になる

## 背景

みとやの「角番予測モデル（Model 1: corner_rank_prediction_by_section.py）」の出力を
「個別台差枚予測モデル（Model 2: individual_machine_diff_prediction_by_section.py）」の
特徴量として統合するパイプラインをレビューした。

検証の結果：
- 18セクション全てで baseline（角番特徴なし）と with_corner（あり）の AUC/Precision/Recall/F1 が
  delta = 0.0 で完全一致
- pred_corner_top_prob の feature importance が **全セクションで厳密に 0.0**（最下位）
- pred_baseline と pred_with_corner の予測値も bit-identical（最大差分 0.0）

根本原因：
```
1. みとや大森町店は全18セクションで「角番台（rank_from_aisle==1）」が必ず1台のみ
2. merge_corner_predictions() は groupby(["date","section"]).agg(mean) で
   角番台の予測確率を集約 → 1台しかいないため、その1台の値がそのままセクション内
   全台にブロードキャストされる
3. セクション別モデルでは section が定数なので、このブロードキャスト値は
   実質「日付だけに依存するスカラー」に潰れる
4. モデルには既に dd, weekday_num, month, machine_xday_avg_wf, seat_dd_roll,
   model_weekday_roll など、より直接的で機種・台番号に紐づいた日付系特徴が
   大量に存在するため、CatBoost はこの特徴を完全に冗長と判定し一度も分岐に使わない
```

「実装は技術的に正しい（マージ・集約のコードにバグはない）が、対象集合のカーディナリティが
小さすぎるため、統計的に意味のある変換になっていない」というケース。
delta_auc=0.0 は merge失敗のサインではなく、「集約後の特徴が下流モデルの既存特徴と
完全に線形従属/冗長である」ことのサイン。

## アクション

上流→下流の特徴統合パイプラインをレビュー・設計する際は必ず以下を確認する：

```python
# 1. 集約対象のカーディナリティを先に確認する
target_count_per_group = df.groupby(group_keys)[target_flag].sum()
if (target_count_per_group == 1).all():
    # 集約(mean等)が「1サンプルの値の単純コピー」に退化している
    # → 下流モデルでgroup_keysが定数になる文脈では、実質「日付だけのスカラー」
    print("WARNING: aggregation degenerates to single-sample broadcast")

# 2. 統合後、必ず feature importance と delta_auc の両方を確認する
#    delta_auc=0.0 だけでなく importance=0.0 も併せて見ることで
#    「ノイズで効果が消えた」のか「完全な冗長性で効果がない」のかを区別できる
importance = model.get_feature_importance(prettified=True)
if importance.loc[importance['Feature Id']==NEW_FEATURE, 'Importances'].iloc[0] == 0.0:
    # 統合特徴がモデルに一度も使われていない → 設計を見直す
    ...

# 3. 改善案：ブロードキャストではなく対象行にのみマージする
#    例：角番台の予測値は「角番台自身の行」にのみ付与し、
#    他の台には付与しない（NaN または別ロジック）
merged = machine_frame.merge(
    corner_frame[["date", "machine_number", "pred_corner_top_prob"]],
    on=["date", "machine_number"],   # section ではなく machine_number で結合
    how="left",
)
```

## 例

```
誤った統合: 角番予測値を (date, section) で集約してセクション内全台にブロードキャスト
  → セクション内に角番台が1台しかいないため、実質「角番台1台の予測値の単純コピー」
  → セクション別モデルでは section が定数なので「日付だけに依存するスカラー」に退化
  → 既存の日付系特徴（dd, weekday_num, machine_xday_avg_wf 等）と完全に冗長
  → feature_importance = 0.0（全18セクション）, delta_auc = 0.0（全18セクション）

正しい診断手順:
  1. groupby(date, section)["is_corner"].sum() で対象数を確認 → 全セクション1台と判明
  2. 統合後の pred_baseline と pred_with_corner を比較 → bit-identical と判明
  3. feature_importance を確認 → 0.0 と判明（3点が揃って「冗長」と確定診断できる）
```

