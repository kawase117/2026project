# n_folds=1 のシナリオ比較で「最良」を選ぶのは、有意差検定なしの単一試行比較に過ぎない

## 背景

みとやの角番予測モデルでは、ウィンドウ別ablation（xday_7mean, xday_rolling30_mean,
xday_90mean, xday_expanding_mean, all_days_expanding_mean）と特徴シナリオ別ablation
（all_days/xday_only/hybrid）の両方で「最良シナリオ」を選択するロジック
（select_window_ablation_scenario, paired_ttest_fold_aucs）が実装されていた。

しかし実際の出力を確認すると：
- x_day限定スコープ（72日学習/30日検証）では walk-forward が **1fold** しか作れない
  （build_walk_forward_folds は len(dates) < train_days + 1 で空リストを返す）
- 全シナリオで n_folds=1 → paired_ttest_fold_aucs が機能せず p_value=NaN
- 「xday_7mean が最良（AUC 0.552）」という結論は、0.502〜0.533 という僅差の
  シナリオ群に対する**単一試行の比較**に過ぎず、統計的に有意かどうか判定不能

「比較・選択ロジックを実装した」ことと「その選択が統計的に妥当である」ことは別問題。
fold数が少ない設定では、選択ロジック自体が機能しない（p値が出ない）ことに
気づかないまま「最良シナリオ」が確定してしまうリスクがある。

## アクション

ablation/シナリオ選択を実装・レビューする際は必ず：

```python
# 1. 各シナリオの n_folds を確認する（最重要）
metrics_df = pd.read_csv(ablation_metrics_path)
if (metrics_df["n_folds"] <= 1).any():
    print("WARNING: n_folds<=1 のシナリオが存在 → 有意差検定不可、選択結果は無効")
    # この場合「最良シナリオ」として確定させてはいけない

# 2. fold数を増やすための設計変更を検討する
#    - train_days/step_days の縮小（ただし学習データ量とのトレードオフに注意）
#    - x_day限定ではなく all_days スコープで学習し、x_dayのみで検証する
#      （xday-scope-superiority 等、既存知見との整合性を要確認）
#    - 検証期間全体をより長く確保する（DB拡張: [[db-expansion-plan-20260602]]）

# 3. n_folds=1 の場合、選択結果を「参考情報」として明記し、
#    本番採用は n_folds>=3〜5 を確保してから行う
```

## 例

```
誤った報告: 「window ablation の結果、xday_7mean (AUC 0.552) が最良と判明したため採用」
正しい解釈: 全シナリオで n_folds=1（p_value=NaN）。
            AUC差は 0.502〜0.552 の僅差で、単一の検証期間での比較に過ぎない。
            → 「最良」の確定は時期尚早。fold数を増やせる設計に変更してから再評価すべき
```
