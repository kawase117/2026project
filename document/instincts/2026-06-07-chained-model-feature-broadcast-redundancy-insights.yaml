# 上流モデルの精度がチャンスに近い場合、下流への連結は「弱い信号の上に意味のない統合を重ねる」だけになる

## 背景

みとやの角番予測モデル（Model 1）自体の精度を確認したところ：
- 全体AUC = 0.584（positive_rate ≈ 0.39 → chance AUC ≈ 0.5）
- セクション別では 0.52〜0.61 とばらつき、明確に強いセクションは無し
- → chance からの上振れはわずか（統計的有意性も未検証）

この状態で Model 1 の出力を Model 2 の特徴量として統合しても、伝達できる
情報量自体がほぼゼロに近い。実際に [[chained-model-feature-broadcast-collapses-to-redundant-date-proxy]]
で確認した「完全な冗長性」は、(a) 集約方法の問題と (b) 上流モデルの信号の弱さ、
の両方が重なった結果である。

## アクション

二段（chained/stacked）モデルを設計・評価する際は、連結する前に必ず：

```python
# 1. 上流モデル単体の精度が chance baseline と有意に区別できるかを先に検証する
#    （[[antipattern-claim-requires-chance-baseline-comparison]] と同じ手法を適用）
n = len(val_df)
p = positive_rate
chance_auc = 0.5
se_auc = ... # 適切な標準誤差推定（bootstrap等）
if abs(observed_auc - chance_auc) < 2 * se_auc:
    print("上流モデルの精度はチャンスと区別不可 → 下流連結は無意味の可能性が高い")
    # この時点で「連結アーキテクチャの改善」より「上流モデル自体の精度向上」を優先する

# 2. 連結によるゲインの理論上限を見積もる
#    上流AUCが0.55程度なら、伝達可能な情報量はごく僅か。
#    下流モデルが既に持つ強い特徴（machine_avg_diff_wf 等、AUC寄与度の高いもの）と
#    比べて、上流予測が追加でもたらせる価値は理論的にも小さい
```

## 例

```
誤った優先順位: 「角番予測→個別台予測」の統合方法（集約・マージ方式）を改善する
正しい優先順位: まず角番予測モデル単体の精度（AUC 0.584、chanceは0.5）が
              統計的に意味のあるシグナルかを検証する
              → 意味がなければ、どう統合しても下流に伝わる情報はない
              → 「弱いモデルの上に強い統合ロジックを作る」のではなく
                「まず上流モデルを強くする」が正しい改善順序
```

