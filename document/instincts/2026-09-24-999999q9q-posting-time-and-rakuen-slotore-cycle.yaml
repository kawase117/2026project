# 楽園蒲田「スロトレ調査団 インフィニティ取材」はおよそ月1回・23日前後に定期開催される企画

## Core claim
楽園蒲田のイベント台帳(EVENT_DAYS.jsonl)を見ると、「スロトレ インフィニティ取材」は
6/23・7/23・8/24・9/23という約1ヶ月おきのペースで登場している。単発の演者来店ではなく、
月次の定期企画として扱うべき。

## Evidence
- n_observations: 4（6/23, 7/23, 8/24, 9/23）
- data scope: 楽園蒲田店単一ホール
- result summary: 9/23予告の演者欄に「スロトレ調査団 インフィニティ」とあり、EVENT_DAYS.jsonlを
  検索すると同名企画が過去3回（ほぼ月1回、23日前後）登録済みだった。過去2回（6/23,7/23）は
  対象の北斗系機種（当時1011-1016）が好調、直近1回（8/24）は不調、という結果のばらつきがあった。

## Interpretation
- 定期企画である以上、次回もおおよそ1ヶ月後（10/22-24頃）に再来する可能性が高い。予告本文に
  同名の演者・企画名が出た時点で、単発イベントではなく定期企画として過去回を検索する価値がある
- ただし過去3回の実績は一貫してプラスではない（3回中1回はマイナス）ため、企画名だけで
  「強い」と決めつけず、直近の named-context 実測と併せて判断する

## Action
1. 楽園蒲田の予告に「スロトレ調査団」系の企画名が出たら、EVENT_DAYS.jsonlをgrepして
   過去の同名企画の開催日・登録機種を確認する
2. 定期企画と判明したら、その周期（今回は約1ヶ月・23日前後）をnoteに記録し、次回の見込み日を
   逆算できるようにする
3. 過去回の実績（差枚・+1800超え率）を named-context と同様の粒度で振り返り、企画名だけで
   期待値を上乗せしない

