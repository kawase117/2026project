# 999999Q9Qの投稿は時間帯で「前日結果速報」と「翌日予告」に分かれる。深夜0-1時台は前日分の振り返り

## Core claim
999999Q9Q（蒲田7/蒲田1担当）は23時台に翌日（蒲田7=メガなな予想、蒲田1=メガいち予想）の
本予告を投稿し、日付が変わった直後の0時27分〜0時48分頃には前日分（多くはゾロ目や特定日の
結果）の振り返り投稿を別に出す。深夜の投稿を機械的に「当日予告」と扱うと、実際には前日の
結果報告を予告として誤読するリスクがある。

## Evidence
- n_observations: 1（2026-09-23の収集時に発覚）
- data scope: 999999Q9Q、蒲田7/蒲田1
- result summary: 9/23 00:27・00:48の投稿は「ゾロ目の日は全機種+全域強化」「ゾロ目の22日は…」という
  前日(9/22、ゾロ目)の結果振り返りだった。本命の9/23予告は前夜（9/22）21:25（蒲田1）・23:51（蒲田7）
  に別途投稿されていた。深夜の投稿だけを見て「今日の予告が無い」と判断すると誤り。

## Interpretation
- このアカウントの実質的な予告投稿ウィンドウは「前日21時台〜24時前」であり、日付が変わった後の
  投稿は基本的に前日分の総括（次のゾロ目・特定日まで予告としての新規性は薄い）
- 予告を探すときは、当日0時以降だけでなく前日21-24時台まで遡ってスキャンする必要がある
  （announce-prepの収集窓とも整合）

## Action
1. 999999Q9Qから当日分の予告を探すときは、前日21時〜24時台の投稿を最優先で確認する
2. 深夜0-2時台の投稿を見つけたら、本文に「今年」「過去」「〜日は」のような回顧的な言い回しが
   あるかを先に見て、前日結果の振り返りではないかを一度疑う
3. 本文の「明日は」「今日は」だけで判定せず、投稿時刻と対象日の関係を必ず確認する

