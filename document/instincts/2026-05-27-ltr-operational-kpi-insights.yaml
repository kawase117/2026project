# is_rank_2 / is_rank_3 専用モデルは現行より悪化する可能性が高い

## 背景
現行モデル（is_top_2ターゲット、XGBRanker ndcg）はグループあたり正例が2件。
is_rank_2専用モデルにすると正例が1件/グループになり学習シグナルが弱くなる。
rank2の定義は「rank1の次」という曖昧なもので、専用化に向かない問題設定。

実測精度（v2r_current, kamata7, 145日）:
- Rank1完全一致: 93.8%
- Rank2完全一致: 77.0%
- hit@2: 99.1%

## アクション
is_rank_2 / is_rank_3 専用モデルを実装しない。
現行モデルの連続スコア出力（全10末尾のスコア）をそのまま使い、
TOP3・BOTTOM3は既存スコアから抽出する（新規学習不要）。

## 例
```
# TOP3は既にlatest_test_top3.csvに実装済み（rank 1,2,3）
# BOTTOM3はlatest_test_full.csvから抽出（rank 8,9,10）
# 新規モデル学習なし
```

