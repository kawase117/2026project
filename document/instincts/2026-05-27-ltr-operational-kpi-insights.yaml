# latest_test_top3.csvはエキスパートごとのrank1〜3を既に出力している

## 背景
`tail_ltr_split_rule_nextday_gpu.py` が出力する `*_latest_test_top3.csv` は、
各エキスパート（2F_N, 3F_N, 3F_A, 2F_A）のrank1・rank2・rank3を含む。
2F_Aも2026-05-26時点ではTOP3に含まれている（除外デフォルトを解除した場合）。

## アクション
- TOP3の新規実装は不要
- 追加が必要なのはBOTTOM3（rank 8,9,10）のみ
- 2F_Aの除外デフォルト（`default="2F_A"`）を解除すれば2F_Aも自動参加

## 例
```
*_latest_test_top3.csv の構造:
expert, rank, last_digit, pred, actual_raw_diff, prob_positive, final_score, ltr_pred
2F_N, 1, 0, 0.9481, 15200.0, ...
2F_N, 2, 7, 0.1135,  9000.0, ...
2F_N, 3, 2, 0.0304,  8000.0, ...
2F_A, 1, 3, 0.9980,  7600.0, ...  ← 2F_A参加時
2F_A, 2, 5, 0.1515,  2300.0, ...
2F_A, 3, 8, 0.0610,  1700.0, ...
```
