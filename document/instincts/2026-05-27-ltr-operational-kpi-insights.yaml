# 2F_A除外はデータ起因ではなくハードコードされたデフォルト値が原因

## 背景
`tail_ltr_split_rule_nextday_gpu.py` の `--reliability-exclude-experts` の
デフォルト値が `"2F_A"` にハードコードされており、以下が発生する:
- 信頼性履歴トラッキングから2F_Aが除外される
- テスト期間評価（`--enable-test-period-report`）から2F_Aが除外される
- `combine_experts_included` には含まれる（combined rankingには参加する）

実際には `_is_expert_indeterminate` 関数が per-day で flat check をしており、
2026-05-26時点の2F_A予測スパン = 0.997（他エキスパート 0.946〜0.893 と同等）。

## アクション
- `--reliability-exclude-experts` のデフォルトを `""` に変更する（line 106）
- per-day の indeterminate check（`_is_expert_indeterminate`）に任せる
- 変更後は `test_period_overall_by_expert` に2F_Aが現れることを確認
- 2F_Aの hit@2 が 95% 以上なら復活確定

## 例
```python
# tail_ltr_split_rule_nextday_gpu.py line 104-108
# Before (問題のあるデフォルト)
p.add_argument("--reliability-exclude-experts", default="2F_A", ...)

# After (動的判定に任せる)
p.add_argument("--reliability-exclude-experts", default="", ...)
```

