# actual_raw_diff はグループ合計差枚であり1台あたりではない

## 背景
`loss_scenarios.csv` および `testperiod_topk.csv` の `top1_actual_raw_diff` は、
予測rank1末尾に属する**全台の差枚合計**（`total_diff_coins`）である。
kamata7の場合、2F_Nは末尾あたり約32台、3F_Nは15台、3F_Aは21台存在するため、
グループ合計差枚はエキスパートによって大きく異なる。

## アクション
差枚KPIを報告するときは必ず2種類を区別する:
- `top1_actual_raw_diff`: グループ合計（スクリプトが出力する生の値）
- `top1_avg_diff_per_machine`: 1台あたり（= total / machine_count）

実運用では「1人が1台に座る」ため、**1台あたり差枚が実践的なKPI**。
`avg_diff_per_machine = top1_actual_raw_diff / machine_count` を
KPIレポートに必ず追加すること。

## 例
```
kamata7テスト期間（2026-01-01〜05-25, 435サンプル）:
  グループ合計:  +21,795枚/日/エキスパート（台数で歪む）
  1台あたり:     +1,001枚/日（実践的な期待値）
  プラス率:      99.1%

エキスパート別:
  2F_N: 32台 → +983枚/台,  pos=99.3%
  3F_N: 15台 → +1,421枚/台, pos=98.6%
  3F_A: 21台 → +599枚/台,  pos=99.3%
```

