# BOTTOM3出力に新規モデル学習は不要、既存full scoringから抽出するだけ

## 背景
`latest_test_full.csv` は各エキスパートの全10末尾スコアを保持している。
BOTTOM3 = スコアが最も低い3末尾（rank 8, 9, 10）であり、既存データから直接抽出可能。
専用のis_worst_1モデル（worst1_hit_rate=78.9%）と同等効果が期待できる。

## アクション
1. `latest_test_full.csv` のスコアを昇順ソート
2. 下位3件を `latest_test_bottom3.csv` として出力（top3と同形式、rank=8,9,10）
3. JSONの `latest_test_bottom3_by_expert` キーに記録
4. 実測精度を測定してから、専用worst1モデルが必要か判断する

## 例
```python
full_df = pd.read_csv("*_latest_test_full.csv")
bottom3 = (full_df
    .sort_values(['expert', 'pred'])   # スコア昇順
    .groupby('expert')
    .head(3)
    .assign(rank=lambda df: df.groupby('expert').cumcount() + 8))
bottom3.to_csv("*_latest_test_bottom3.csv", index=False)
```

