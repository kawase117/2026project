# hit@2は「ソフト」な指標、実運用ではランク1完全一致が重要

## 背景
hit@2 = 「予測上位2件のどちらかが実際のTOP2内に入っていれば成功」。
99.1%は「2回チャンスがある」という緩い条件での数値。
実際の運用では最も良い末尾1つを選ぶため、ランク1完全一致が核心指標。

## アクション
精度報告では hit@2 だけでなく以下を必ず併記する:
- `top1_match`: rank1完全一致率（最重要）
- `top2_match`: rank2完全一致率
- `top1_avg_diff_per_machine`: 1台あたり差枚期待値
- `hit@3`: TOP3カバレッジ参考値

hit@2だけ見ると天井効果を過大評価しやすい点に注意。

## 例
```
v2r_current (kamata7, 145日, 3エキスパート):
  hit@2:           99.1%  ← ソフト指標（参考値）
  ランク1完全一致: 93.8%  ← 実運用の核心
  ランク2完全一致: 77.0%
  1台あたり差枚:   +1,001枚/日, pos=99.1%  ← 実践KPI
  TOP3カバレッジ: 90.3%が2件ともTOP3内
```

