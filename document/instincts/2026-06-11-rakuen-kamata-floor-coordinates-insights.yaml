# preview_screenshotタイムアウト時はPlotly内部データを直接抽出して照合する

## 背景
page_17（ヒートマップページ）のように1ページに10個のPlotly図(フロア5枚×2種類)が
含まれると、`preview_screenshot` は毎回30秒でタイムアウトする。
ただし `preview_eval` で `.js-plotly-plot` 要素の `.data`/`.layout` には
オフスクリーン(clientWidth/Height=0)でもアクセスでき、
描画前のReact/Plotlyオブジェクトは存在している。

## アクション
1. まず `.claude/launch.json` の `runtimeExecutable` を確認する
   - `streamlit` がPATHに無い場合は `"runtimeExecutable": "python", "runtimeArgs": ["-m", "streamlit", "run", "main_app.py"]` に変更
2. `preview_start` → `preview_eval(window.location.reload())` でページロード
3. screenshotが通らない場合、以下で直接データ照合する：
```js
(() => {
  const plot = document.querySelectorAll('.js-plotly-plot')[idx];
  const cd = plot.data[0].customdata; // [[ [machine, pct], ... ], ...] 行=y, 列=x
  const grid = {};
  for (let yi=0; yi<cd.length; yi++)
    for (let xi=0; xi<cd[yi].length; xi++)
      if (cd[yi][xi][0]) grid[`${xi+1},${yi+1}`] = cd[yi][xi][0];
  return grid;
})()
```
4. 抽出した `{x,y: machine_number}` を生成元CSVの `display_x,display_y,machine_number` と突合する
5. `.data[idx].x` / `.data[idx].y` でグリッドサイズ（フロアごとの最大x/y）も即座に確認できる

## 例
本セッションでは plot index 0-4 がフロアヒートマップ(新館1F/2F, 本館1F/2F/3F)、
5-9 が末尾ハイライト散布図に対応。customdata抽出により
全569台分の座標がCSV生成内容と完全一致することをスクリーンショット無しで確認できた。

