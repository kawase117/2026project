# フロア座標CSV生成のワークフロー（楽園蒲田店 全5フロア対応で確立）

## 背景
楽園蒲田店の本館3F/2F/1F・新館1F/2F、計569台のフロア座標CSVを
`Heatmap/generate_rakuen_kamata_coordinates.py` に実装した。
画像から手動で座標を起こす作業は、関数化された build パターンと
ASCIIプレビュー検証を組み合わせることで、ミスなく高速に進められた。

## アクション
1. フロアごとに `build_rows_<hall>_<floor>()` 関数を1つずつ作成する
2. 共通ヘルパーを使う：
   - `add_run(rows, floor, machines, start_x, start_y, step_x, step_y, section=None)`
     → 横列・縦列・1マスの三角形配置すべてこれ1関数で表現できる
     （横列: step_x=1,step_y=0／縦列: step_x=0,step_y=1／単マス: step_x=step_y=0）
   - 列が「上から下」「左から右」など逆方向に並ぶ場合は
     `list(range(end, start-1, -1))` のように reversed range を使う
   - `validate_rows(rows, expected)` で機種番号の過不足・重複座標を必ずチェック
3. `main()` に `write_csv(build_rows_xxx(), here / "xxxF_floor_coordinates_<hall>.csv")` を追加するだけで
   `Heatmap/coordinate_utils.py` の `find_floor_csvs()` が自動で拾う（コード変更不要）
4. 完成後は `preview_ascii.py` でASCIIグリッド表示し、画像のレイアウトと目視突合する

## 例
```python
def build_rows_shinkan_2f() -> list[dict[str, object]]:
    floor = "新館2F"
    rows: list[dict[str, object]] = []
    # 横列
    add_run(rows, floor, list(range(2008, 2021)), 2, 1, 1, 0)
    # 縦列（逆順）
    add_run(rows, floor, list(range(2003, 1999, -1)), 1, 9, 0, 1, section=(2000, 2003))
    # 三角形の単マス配置
    add_run(rows, floor, [2127], 8, 18, 0, 0, section=(2126, 2128))
    add_run(rows, floor, [2126], 7, 19, 0, 0, section=(2126, 2128))
    add_run(rows, floor, [2128], 9, 19, 0, 0, section=(2126, 2128))

    expected = set(range(2000, 2091))
    validate_rows(rows, expected)
    return sorted(rows, key=lambda row: int(row["machine_number"]))
```

