# kawasakislotの深堀りリプライにある具体台番号は的中率が低い。予告本文の構造的主張の方が再現しやすい

## Core claim
予告アカウント kawasakislot が本体ツイートとは別に付けるリプライ（「常連さんは
踏まえて動く」という具体的な台番号リスト）は、単発検証では実際の強台・並びの
中心とほとんど一致しなかった。一方、予告本文にある構造的な主張
（「全は◯台以上機種から」等の台数条件）は的中した。

## Evidence
2026-09-17 楽園蒲田店（[[project-rakuen-lastdigit7-rb-only]] と同じ末尾7予告日）:
- 深堀りリプライの名指し台: カバネリ1027/1037・1031/1042、東京喰種2077、
  リゼロ2(2177)、エウレカ3229/3233 → 6組中5組が外れ（1027はプラスだが並びの中心
  ではない、2077は31台中最悪水準、リゼロ2はボーナス0回、エウレカ2台は25台中下位）。
  唯一一致したのはマイジャグ1212/1213で3台並びブロック(1212-1214)に合致
- 予告本文の構造的主張「全は7台以上機種から」→ ニューキングハナハナV‐30(8台)が
  当日のgratio_mean_diffスコア1位(5702)で的中
- 予告本文「3台並び7箇所以上」→ 実測15箇所（90日ベースライン上位10%点と同水準）で的中
- 予告本文「7台並び2箇所以上」→ 実測1箇所のみで未達

## Interpretation
- n=1日のみ。常連向け具体台番号リストの的中率が恒常的に低いとまでは言えないが、
  [[feedback-scraper-image-tweet-misbinding]] や自己申告水増し傾向
  ([[project-kawasakislot-selfreport-inflated]]) と同様、個別の具体的な主張ほど
  検証コストに見合わない可能性がある
- 予告本文にある「台数条件」（◯台以上、並び箇所数）は、この日は具体台番号より
  再現性が高かった

## Action
- kawasakislotの予告を答え合わせするときは、具体台番号よりも先に
  台数条件・並び箇所数などの構造的な主張を検証する
- 深堀りリプライの具体台番号は「参考程度」に留め、当日の推薦の主根拠にしない
- 同種の答え合わせをあと数件積み重ねてから、恒常的な傾向かどうかを判断する

