# AT機の「回転数×差枚」相関は機種ごとに構造が違う。マイナス差枚を高設定の追加根拠にしない

## Core claim
AT機（`bonus_judgeable=0`）は確率的な設定判別ができないため「回転数の高さ」が
唯一の設定シグナルになりがちだが、回転数と差枚の関係は機種によって全く異なり、
一般化して「回転数が高くマイナス差枚の台ほど高設定」とは言えない。

## Evidence
- 2026-09-17 楽園蒲田店 甲鉄城のカバネリ 海門(うなと)決戦（26台）:
  games_normalizedとdiff_coins_normalizedの相関 r=+0.51（中程度の正相関）。
  回転数上位5台中4台がプラス差枚で、回転数が高い台はむしろ勝っている台が多い。
- 同日 東京喰種（31台）: 同相関 r=+0.04（ほぼ無相関）。
  回転数最大の台(2077, +9339G)は差枚-4428と大きくマイナスだったが、
  同水準の高回転(2058, 8608G)も-4666と同じくマイナスで、逆に高回転かつ
  +7286/+4905の台(2085,2074)も存在し、回転数から差枚の方向を読めない。

## Interpretation
- カバネリは「回転数が伸びている台=差枚も伸びやすい」機種で、
  マイナス差枚を高設定の追加根拠にする発想はこの機種の実測とは逆行する
- 東京喰種は回転数と差枚がそもそも無関係な機種で、突出した高回転×マイナスの台
  （例:2077）だけを名指しで「推定高設定」と判断する根拠は、同水準の他の台
  （2058）と比べて特に強いわけではない
- n=1日・2機種のみの観測であり、他機種・他日への一般化はまだできない

## Action
- 「回転数が高い＝設定投入シグナル」自体は使ってよいが（末尾7全体のG比集中など）、
  それを「差枚のマイナス」と組み合わせて高設定の根拠にする前に、
  対象機種で回転数×差枚の相関を当日データで確認する
- カバネリ・東京喰種以外のAT機でも同様の相関チェックを積み重ね、
  n が増えたら機種横断の傾向として書き直す

