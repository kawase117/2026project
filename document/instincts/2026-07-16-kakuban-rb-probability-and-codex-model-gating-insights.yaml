# RB確率は「粗い普遍的効果」の裏取りには強いが、DD条件付きの細粒度ルールの裏取りには弱い

## 背景
蒲田7・蒲田1で確立済みの「角番1(コーナー)は最弱」という差枚・機械割ベースの結論を、設定に直結する独立指標RB確率(rb_probability_decimal)で再検証した(eda/kakuban_rb_probability_verification.py)。結果、角1のRB確率が他バケットより有意に低いことは両ホール・両games閾値(400/2000)の全4条件で確認され(蒲田7: p=5.0e-13〜3.7e-37、蒲田1: p=3.6e-6〜2.3e-15)、粗い角番ルールはRB確率で強く裏取りできた。一方、DD×角番の細粒度な「最強角番」一致率(RBベース vs 差枚ベース)は蒲田7で40%(min_games=400)/70%(min_games=2000)、蒲田1で27%/60%にとどまり、5分類のランダム一致率(≈20%)は上回るものの完全一致には程遠かった。また角番バケット全体の順位相関(Spearman)はgames_normalized≥2000で両ホールともρ=1.0(完全一致)だが、蒲田1でmin_games=400にするとρ=0.5(p=0.391、非有意)まで崩れた。

## アクション
「差枚ベースの粗い普遍的効果(全体平均で見た主効果)」は独立指標での裏取り検証に向いており、確信度を引き上げる材料になる。一方「DD×角番のような条件付き細粒度の交互作用ルール」は、独立指標での再現率がせいぜい中程度(40-70%)にとどまることを前提に、「構造シグナル」ではなく「戦術的シグナル」程度の確信度で扱うべきで、独立指標での不一致だけを理由に棄却しない(ノイズの影響が大きいだけの可能性がある)。低ゲーム数(low n)の台を含めると独立指標との相関が崩れやすいため、独立指標での検証はgames_normalized≥2000程度の高稼働台に絞るのが安全。

## 例
蒲田1 min_games=400: kakuban 5分類のRB確率 vs 機械割の順位相関がSpearman ρ=0.5(p=0.391、非有意)。同じ蒲田1でmin_games=2000に絞るとρ=1.0(p=1.4e-24)に急改善。閾値次第で「相関なし」から「完全相関」まで結論が変わりうる。

