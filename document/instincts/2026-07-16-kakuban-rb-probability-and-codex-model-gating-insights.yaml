# Codexの「要CLI更新」エラーは実際にはモデル単位のアカウント側gatingであることが多い

## 背景
~/.codex/config.tomlのデフォルトmodel(例: gpt-5.6-luna)を使ったCodexタスクが"requires a newer version of Codex"エラーで4回連続失敗した。npm経由の`@openai/codex`アップグレード(0.142.5→0.144.5)、さらにOpenAI Codexデスクトップアプリ本体の手動更新(CODEX_CLI_PATHが指すバイナリを`codex.exe --version`で0.144.5に上がったことまで確認)を行っても、gpt-5.6-luna・gpt-5.6-terra・gpt-5.6-solの3モデル全てで同一エラーが再現した。エラー文言はCLIバージョン起因を示唆するが、実際には旧世代モデル(gpt-5.5)を--model指定した軽量診断タスクは即座に成功し、CLI自体は正常でgpt-5.6系モデルだけがこのアカウントで未解放(gating)であることが判明した。

## アクション
Codexが"requires a newer version"エラーで失敗した場合、CLI/アプリの更新を繰り返す前に、まず軽量な診断タスク(例: cwdとgit statusを返すだけ)を`--model gpt-5.5`のような枯れた旧モデルで1本投げて原因を切り分ける。それが成功すればCLIは正常でモデル単位のアカウントgatingが原因と確定でき、以降はそのモデルで本タスクを再投入すればよい。CLI更新はnpm経由では効かない場合があり(実際に使われるバイナリはOpenAI Codexデスクトップアプリ同梱のCODEX_CLI_PATH側であることが多い、~/.codex/config.tomlで確認可能)、CLI更新自体に時間を浪費しないこと。

## 例
task-mrn63e1x/mrn7mu2l/mrn84fbc/mrn8qmg8の4タスクがgpt-5.6-luna/terraで同一エラーにより失敗。5本目の軽量診断タスク(--model gpt-5.5)が即成功し、以降--model gpt-5.5指定で本題(RB確率検証)のCodexタスクが9分18秒で正常完了した。

