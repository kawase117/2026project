# グループ持ち回り周年イベントは全日程で自店DBを検証し、頻出機種は現存確認とセットで見る

## Core claim
複数店舗が持ち回りでホストする共同シーズンイベント(みとやグループの周年巡業など)では、
ホスト権が無い日も自店で同時にイベントが動いていることがあるため、日程表にある全日付を
自店DBで検証すべきであり、かつ「過去の頻出機種」は現在の設置有無・台数変化・直近実績と
セットでなければ判断材料にならない。

## Evidence
- n_observations: 2025年度8日程(7/10,7/17,9/4,9/24,10/12,10/14,11/30,12/5)、みとや大森町店1ホール
- data scope: single-hall (みとや大森町店)
- metric scope: diff_coins_normalized (機種別平均・ホール全体平均)
- result summary:
  - 8日程全てで大森町のホール全体平均差枚が通常日ベースラインを上回った(全日プラス、win_rate35〜56%)
  - 頻出機種(からくりサーカス・モンキーターンV・北斗の拳が各4回)のうち、からくりサーカスとモンキーターンVは2026年9月時点で撤去済み、北斗の拳は18台→5台に縮小し直近14日は10日マイナス
  - 現存かつ直近実績も維持されていたのはマギアレコード(2回出現、6-7台→5台、直近14日中9/14に全台同時大跳ね)とガールズ&パンツァー最終章(1回だが単独最大+7306、直近も比較的安定)のみ

## Interpretation
- 「持ち回りイベント」は各ホストホールのみで完結するのではなく、グループ全店で同時に動く共同企画であることがある。当初「自店がホストの日と、自店が参加する日(グループ全店イベント)の2日だけ」と誤認したが、実際は全日程が対象だった
- 過去の出現回数が多い機種ほど「常連=強い」と誤読しやすいが、実際は入替・縮小が進んだ退役機種であることが多い。出現頻度だけでランキングすると外す
- 「頻度×現存×直近実績維持」の3条件が揃う機種を優先すべきで、頻度単独や直近実績単独では判断を誤る
- 台番号の"場所の継続性"(過去に強かった位置に今何があるか)は補助指標としては使えるが、単独では弱い(今回、旧いざ番長の位置=現カバネリ632は継続性が無かった)

## Action
- 予告ツイートに年度×日程×ホストホールの一覧表が出たら、まず自店が全日程に参加しているか(ホスト以外の日も含め)をユーザーに確認する。自己判断で「ホストの日だけ」と絞らない
- 全日程を自店DBでホール全体平均・機種別top6程度で洗い出す
- 頻出機種リストができたら、必ず「現在も設置されているか」「台数がどう変化したか」「直近2-3週間の実績」を機種ごとに追加確認する。この確認をせずに頻度だけで優先順位をつけない
- 場所の継続性チェックは補助指標として使うが、直近実績・モデルスコアと矛盾する場合は後者を優先する

