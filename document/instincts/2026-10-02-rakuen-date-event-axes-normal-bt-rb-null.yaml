# 楽園蒲田のノーマル・BTは、日付軸・イベント別・公約別のRB確率で、偶然と区別できる機種×軸の効果は検出できなかった

## 背景
ノーマル12機種+BT8機種(RBが判別できる20機種)のRB確率を、機種×回転数帯(2000G刻み)の基準から出した期待RB回数との比(O/E、1が平常)で見た。検定は、曜日の中で日付ラベルを入れ替える並べ替え検定。
- 日付軸(改装後86日、改装前549日): D(日の下一桁)、DD、ゾロ目(11・22日)、強ゾロ目(月=日)。ホール全体のD別O/Eは0.97〜1.04で、最大のDも偶然と区別できない(p=0.17)。機種別(改装後20機種、改装前29機種)で、p<0.05は偶然の期待数前後、BH補正後は0。ゾロ目6日・強ゾロ目3日はむしろ低い側(0.98、0.97)。機種ごとの下一桁プロファイルは、改装前と改装後で再現しない(相関の平均+0.02)。
- イベント別・公約別(2026-06-02〜09-30、120日、`EVENT_SERIES.jsonl` の23系列×20機種=450セル): 系列内で最大の機種が偶然より突出した系列は0/23。セルでp<0.05は高い側14・低い側25(偶然の期待数約22)、BH補正後は0。ホール全体のO/Eも全系列0.96〜1.05。公約の種類(並び:3台、機種指名:全、全台系)による差も見えない。
- 「水星神取材×アレックス ブライト」はO/E=1.152(11日、p=0.008)で最も目立ったが、補正後は有意でない。内訳は、改装前の5日(旧4台2175-2178、1台あたり約1000G、RB54回)でO/E=1.31、改装後の6日(3台3139-3141)でO/E=1.09・近似設定2.5相当(設定5以上25%)・機械割95.8%・差枚-338/台。全体の高さは、少数回転の改装前の日が作っていた。台帳には登録しなかった。
- 検出力は低い。1系列3〜12日で、数%〜十数%の差は拾えない。「検出できなかった」であって「効果がない」ではない。AT機は、RB確率で測れないため、この分析に含まれていない。

## アクション
- 日付軸(DD、D、ゾロ目、強ゾロ目)やイベント名・公約名を理由に、ノーマル・BTの特定機種を強いと書かない。使うなら、事前に機種と軸を固定して、次の開催で検定する。
- イベント系列を機種別に見るときは、改装前と改装後を分ける。台番号も台数も変わる機種(アレックスは4台から3台)があり、混ぜると、回転数の少ない日が全体を動かす。また、日付が同じ取材(超太陽神、水星神、四星W)は、独立した複数の証拠として数えない。
- 450セルのような総当たりの最小pは、補正後の値で読む。1機種×1系列を後から拾って登録しない。
- 「特定のイベントで特定の機種を多用する」という見方は、AT機の領域で起きている可能性が高い(取材の台帳に転生、エウレカ、東京喰種などの記載がある)。AT機は、差枚と回転数で、予告で凍結された日付だけを使って別に検証する(未着手)。

## 例
アレックス×水星神は、全体のO/Eが1.152で目立つが、改装後だけに絞ると1.09、機械割95.8%で、高設定の様子は見えない。
