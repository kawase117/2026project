# pd.crosstabの複合行キーは「Seriesのリスト」で渡す。zip()でタプル化したリストを渡すと壊れる

## 背景
dashboard/utils/interaction_analysis.pyのrun_pairwise_axis_test()で、2軸×outcomeのクロス集計を`pd.crosstab(list(zip(work["_axis_a"], work["_axis_b"])), outcome)`と実装していた。zip()でタプル化した値のリストを渡すと、pandas内部の`maybe_make_list`が「すでにlistだから」とラップせずそのまま扱ってしまい、`index + columns`のリスト結合のつもりが意図しないSeries同士の演算やcommon_idx構築に迷い込み、`ValueError: Length of values (2) does not match length of index (N)`という原因の分かりにくいエラーになる。avg_diff指標はkruskal検定の別経路を通るため発生せず、win_rate/hit104_rate（crosstabを使うchi2経路）を選んだ時だけ再現した。ユーザーから「総当たりで調べるようなことか、コードの一部にミスがあるはずだ」と指摘され、実際に1箇所の誤用が原因だった。

## アクション
pd.crosstabで複数軸をまとめて1つの行キーとして扱いたい時は、値をzip/タプル化せず`pd.crosstab([series_a, series_b], outcome)`のように**Seriesそのものをリストに入れて**渡す。エラーメッセージが「Length of values (N) does not match length of index (M)」のように無関係に見える場合、まずcrosstab/pivot_table系の呼び出し引数の型（Series vs 生のlist/tuple)を疑う。総当たりでdbやaxisの組み合わせを検証する前に、まずコード自体の型の誤用を疑うべき（ユーザー指摘通り）。

## 例
NG: `pd.crosstab(list(zip(work["_axis_a"], work["_axis_b"])), outcome)` → 全ホール・全軸組み合わせで同じ箇所がクラッシュ。
OK: `pd.crosstab([work["_axis_a"], work["_axis_b"]], outcome)` → MultiIndexの行(row_0, row_1)を持つ正常なcontingency tableが返る。修正1行で楽園蒲田・蒲田7など複数DBで再現→解消を確認済み。

