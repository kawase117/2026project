# みとや大森町において末尾7の強い日は x_day に限定される

## 背景
全 31 DD に対する偏差分析（deviation >= +150）で、末尾7が高偏差を示す DD は
DD=4(+368), DD=7(+341), DD=17(+256), DD=24(+248) の 4 DD のみだった。
これらは全て x_day（day%10 in {4,7}）に含まれる。
末尾7の global_mean は +20 で中位だが、x_day 以外の DD では突出した偏差を見せない。

## アクション
みとやで「末尾7が強い日を探す」= x_day を探すと同義。
末尾7に特化した別バケットを作る必要はない。
x_day の中で特に末尾7が強い DD（4, 7, 17）を重み付けする場合は
バケット分割ではなくモデル内の特徴量として扱うこと。

## 例
```
末尾7の DD別偏差（deviation >= +150 のみ）：
  DD=4  [x_day]: +368
  DD=7  [x_day]: +341
  DD=17 [x_day]: +256
  DD=24 [x_day]: +248
  ── その他全 DD は +150 未満 ──

対比：末尾4は deviation >= +150 を達成する DD が 7 個存在するが、
      末尾7は x_day 4 DD のみに完全に限定される。
```
