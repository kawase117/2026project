# 複数末尾の同時高偏差が新バケット採用の必要条件

## 背景
全 31 DD に対して偏差分析（deviation >= +150）を実施した結果、
複数の末尾が同時に高偏差を示す DD は x_day（4/7/14/17/24/27）と DD=30 のみだった。
1末尾のみで偏差 +150〜225 程度の DD（DD=9: digit=6 +225, DD=20: digit=0 +167）は
存在するが、n=17 の単一末尾では偶発性を排除できない。

x_day の偏差レンジ: +248〜+469（各DD で 2〜4 末尾が同時に高偏差）
DD=30 の偏差レンジ: +203〜+256（3 末尾が同時に +200 超）
新候補なし: 偏差 +150 以上かつ複数末尾を同時に持つ DD は発見されず

## アクション
新バケット評価基準：
- 必要条件：deviation >= +150 の末尾が 2 つ以上同時に存在すること
- 十分条件：deviation >= +200 の末尾が 2 つ以上（x_day 水準）
1末尾のみの候補は「ウォッチリスト」止まりとし walk-forward には追加しない。

## 例
```
採用基準を満たす DD（2026-06-06 時点）：
  x_day (4,7,14,17,24,27): 偏差 +248〜+469、複数末尾同時 → 採用済み
  DD=30: 偏差 +203〜+256、3末尾同時 → ウォッチ中（observed_dates=2）

採用基準を満たさない DD：
  DD=9:  digit=6 のみ偏差 +225 → 1末尾 → 除外
  DD=19: digit=4/2 が偏差 +153/158 だがグローバルバイアスの反映 → 除外
  DD=20: digit=0 のみ偏差 +167 → 1末尾 → 除外
```

