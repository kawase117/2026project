# 月×DD の季節性分析は 1.5 年データでは統計的に不可能

## 背景
みとや大森町 1.5 年データで (月, DD, 末尾) セルの n_dates を確認したところ、
月×DD の各セルは n=1〜2 しかなかった。
- 月1〜5（2年分）：n=2
- 月6〜12（1年分）：n=1
n=1 のセルは mean = その1日の値そのもので、平均の意味をなさない。
DD=19 の9月に digit=9 が +2035 という外れ値が出たが、これは n=1 の1日分の実績値にすぎない。

## アクション
月×DD の季節性分析を提案・実施しないこと。
必要データ量：n_dates >= 3〜5 per cell = 3〜5 年分。
代替アプローチ：
- DD 集計（全月込み）で検出できるパターンに注力する
- データが増えた時点（3 年以上）で月別分析を再検討する

## 例
```
DD=19, 月別 digit=9 の mean_diff：
  9月: +2035（n=1）, 11月: +846（n=1）, 8月: +142（n=1）, ...
  → 値の大きさはサンプルサイズを反映しない。季節性の証拠にならない。

必要サンプルサイズ：月×DD=12×31=372 セル、各 n>=3 → 1116 日以上 ≈ 3 年
```

