# spread 上位の DD ≠ 新バケット候補：グローバル末尾バイアスとの混同

## 背景
composite score (spread × sqrt(n/17)) でランキングしたところ DD=19 がトップになったが、
実際に「グローバル平均からの偏差」を見ると、DD=19 の top2（digit=4: +158, digit=2: +153）は
みとや全体のグローバルランキング（4が全体1位 global+60、2が2位 global+42）を
そのまま反映しているだけだった。
spread が大きく見えたのは bottom3 の末尾が強く負になったためで、
特定末尾を予測できる構造とは異なる。

## アクション
新バケット候補評価は spread ではなく「グローバル baseline からの偏差」で判断すること。
計算手順：
1. 全 DD の平均を digit 別に計算（global_mean）
2. 各 (DD, digit) セルで deviation = mean_diff - global_mean を計算
3. そのDD内で deviation >= +150 を達成する digit が複数あれば候補
4. 1 digit のみの場合は n=17 での偶発的変動と区別できないため除外

## 例
```
DD=19: spread=303（ランキング1位）
  → deviation top2: digit=4(+158), digit=2(+153)
  → グローバルランキングの1位・2位と完全一致 → 固有パターンなし

DD=4 (x_day): spread=288
  → deviation top3: digit=2(+469), digit=7(+368), digit=5(+351)
  → digit=5 は global -15 なのに x_day では突出 → 本物の DD固有パターン
```

