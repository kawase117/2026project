# みとやの7のつく日は要注目日（ユーザー指定）。強さはホール全体ではなく、うみねこ2と獣王に出ている

## 背景
2026-10-28に、ユーザーが10/27（DD27）について「獣王、うみねこが全で良いと思われる」と判定し、7のつく日のみとやを要注目日として思い出すよう依頼した。
確定DB（7/1〜10/27）で確認した結果は次のとおり。
- ホール全体の台平均差枚は、7のつく日12日で+149、ほかのイベント日（1・4・14・24・30）19日で+6、通常日88日で−9。7/7（+695）を除くと約+99になる。12回中4回はマイナス（7/27、8/7、9/17、10/17）だった。
- うみねこ2（707・708）は、9/17・9/27・10/7・10/17・10/27の5回連続で2台とも勝った。9/7より前の7のつく日で2台とも勝ったのは5/7の1回だけ。7のつく日以外は平均−37・勝率40%。
- 獣王（10/5導入）は、7のつく日の3回がすべてプラスだった（+122、+920、+3,112）。それ以外の20日は平均−1,045・勝率31%。

## アクション
- 7のつく日のみとやの予測では、うみねこ2（707・708）と獣王を「判断:」の行に推す候補として書き、凍結する。ホール全体の上げ（全体が強い日）としては書かない。
- ディスクアップ745は、DD27でもRB確率が設定1並みだった（mitoya-discup745-dd27-rb-no-high-setting）。7のつく日だからといって745を筆頭にしない。
- 失効の判定：うみねこは6回目の11/7が最初の分かれ目になる。5連続は後から窓を選んだ観察なので、外れた場合は「9/17〜10/27の短期法則が終わった」と期間を付けて記録する。撤回とは書かない。
- 答え合わせは差枚だけで決めない。獣王・うみねこはAT機なので、G比と平均差枚で見る。

## 例
11/7（土）の予測：「判断: うみねこのなく頃に2（707・708）と獣王（561〜564）。7のつく日に9/17から5連続（うみねこ）」。答え合わせでは、2台の平均Gがホール平均の1.5倍を超えたか、平均差枚がプラスかを記録する。

