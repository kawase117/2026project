# 日内シャッフルで検定すると、蒲田7の曜日の型で再現したのは「水=末尾」だけ。蒲田1には曜日の型が見えない

## 背景
`eda/weekday_concentration_scan.py` を作った（2026-10-28）。7つの集中度指標（角番・末尾・3台並び・ニブイチ・列全体・列1台・機種1台）を日ごとに計算し、日内で差枚を並べ替えた帰無分布との差を曜日別に検定する。
- 蒲田7：「水=末尾」は4〜8月（p<0.0001）でも9/1〜10/26（p=0.0007）でも再現した。火=角番、木=ニブイチ、金=列1台、月=列全体、土=3台並び、日=機種1台は、どちらの期間でも目立たなかった。
- 蒲田1（店長交代後の9/1〜10/26）：どの指標でも曜日間の差は有意でなかった（Kruskal-Wallis p>0.05）。火曜の角番（+0.157、p=0.03）と月曜の列1台（p=0.03）は、7指標×7曜日の多重比較の中の値なので探索的なものにとどまる。
- 再現しなかったのは、物差しが型の定義と合っていない可能性もある。棄却ではない。

## アクション
- 蒲田7の予測で曜日の型を根拠にするのは「水曜=末尾」だけにする。ほかの曜日の型は「既知の型（未再現）」と書き、主根拠にしない。
- 蒲田1には蒲田7の曜日の型を当てはめない。火曜の角番は、次の火曜からフォワードで記録する。
- 型の定義を見直したら、`venv\Scripts\python.exe -m eda.weekday_concentration_scan --hall <DB名> --start --end --perm 200 --seed 0` で再検定する。レポートは eda/reports/weekday_concentration_* にある。

## 例
10/28（水）の蒲田7の予測は「水曜末尾」を根拠に入れた。ただし、どの末尾かは事前に決めなかった。同じ日の蒲田1は、曜日の型を根拠にせず「推す機種なし」とした。

