# 楽園の水木金とヒロキの木曜が機械割104%でTier B以上、複数ホールで「木曜」が共通シグナル

## 背景
全日程3000G以上、ホール×曜日でpp>=5かつn>=20のTier B以上一覧:

| ホール | 曜日 | n      | hit104率 | pp   |
|--------|------|--------|---------|------|
| ヒロキ | 木   | 4,032  | 42.1%   | +6.6 |
| 楽園   | 水   | 12,363 | 41.8%   | +6.3 |
| 楽園   | 金   | 13,967 | 41.1%   | +5.6 |
| 楽園   | 木   | 11,326 | 41.0%   | +5.5 |
| 楽園   | 火   | 13,358 | 40.8%   | +5.3 |
| 金時   | 木   | 2,658  | 40.8%   | +5.3 |
| 蒲田7  | 木   | 18,774 | 40.5%   | +5.0 |

「木曜」が楽園・金時・蒲田7・ヒロキの4ホールで共通してTier B以上。
楽園は火水木金の4日全てがTier B以上で、平日全体が強い。

ホール×DD_mod10では「金時×4系」のみTier B（40.6%, +5.1pp, n=2116）で、
これはみとやの4系イベント定義（mitoya_event_definition_confirmed）とは
別ホールでの4系シグナルとして注目に値する。

## アクション
楽園の平日（特に水・木・金）と、楽園・金時・蒲田7・ヒロキの木曜を
機械割104%以上の出現確率が高い候補として優先的に観察する。
「木曜が地域共通のイベント曜日」という仮説の検証材料として記録。

