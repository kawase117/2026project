# 機械割104%出現率スキャンの実装パターン（eda/hit104_scan.py）

## 背景
差枚ベースの21次元スキャン（2026-06-09実施）と同じ軸を、
「機械割>=104%」の二値フラグの出現率で再走査するための実装。

実装済みファイル: `eda/hit104_scan.py`
- PASS1: min_games=1000で全次元スキャン
- PASS2: min_games=3000で再検証（PASS1のTier Aがどれだけ生存するか）

Tier判定基準:
- A: ベースラインとの差(pp) >= 10 かつ n >= 30
- B: pp >= 5 かつ n >= 20
- C: それ以外

## アクション
```python
df['kaiwari'] = 100 + (df['diff_coins_normalized']
                        / df['games_normalized'].clip(lower=1)) / 3 * 100
df['hit104']  = (df['kaiwari'] >= 104.0).astype(int)

# グループ別出現率
grp = df.groupby(col)['hit104'].agg(['mean','count'])
grp['hit_pct'] = grp['mean'] * 100
grp['pp'] = grp['hit_pct'] - baseline  # baseline = df['hit104'].mean()*100
```

## 注意点（実装上のはまりどころ）
- 全データを1つのDataFrameに結合して `sort_values` すると
  `numpy._core._exceptions._ArrayMemoryError` が発生する規模
  （約120万行 × ラグ計算で一時配列が肥大化）。
  ラグ分析はホールごとに個別処理してから結果のみ集約すること。
- `last_digit` は `machine_number % 10` を文字列化（差枚スキャンと型を揃える）。
- 1000Gと3000Gでbaselineそのものが変わる（31.1% vs 35.5%）。
  ppの絶対値はbaseline依存なので、2パス間でppを直接比較しない。
