# 機械割104%の「前日hit→翌日hit」連続性はほぼゼロ（差枚streakとは別の現象）

## 背景
差枚ベースのlag_analysis（2026-06-09実施）では蒲田7アイムジャグラーEX-TPで
streak_rate=86%という強いシグナルが見つかっていた。

しかし機械割104%を指標にした全ホール・台番号単位のラグ分析では:

min_games=1000:
- 全ホール streak_pp: -0.7〜+1.2pp（ザシティ最大+1.2、みとやは-0.7と逆相関）

min_games=3000:
- 全ホール streak_pp: -0.2〜+1.3pp（ザシティ+1.3、楽園+1.1が最大）

いずれもTier B閾値(+5pp)に遠く及ばない。

## 解釈
差枚の連続性（streak_rate=86%等）は「特定の台が複数日にわたり高設定で
据え置かれている」現象を捉えている。
一方「機械割104%以上を達成したか」という二値指標は日々の確率変動（運）の
影響が大きく、設定の継続性を直接反映しない。
つまり「高設定が据え置かれている台」でも、その台が実際に104%以上の
結果を出すかは試行ごとのばらつきが大きい。

## アクション
台選択のロジックでは、「前日104%超だったか」より
「前日の差枚自体（および機種別streak_rate）」を優先指標として使う。
機械割104%指標は「今日その台が高設定かどうか」の判定には有効だが、
「翌日も狙うべきか」の判定にはlag_analysisの差枚streakを使うこと。

