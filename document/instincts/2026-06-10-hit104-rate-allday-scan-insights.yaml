# DD_mod10単独・台番号末尾単独・曜日×DD_mod10は機械割104%指標でも全て無効（差枚スキャンと一致）

## 背景
全日程3000G以上での結果:
- DD_mod10単独: 最大pp = +0.5（dd_mod10=0）、最小 = -0.3。全てTier C
- 台番号末尾単独: 最大pp = +0.4（末尾8）、最小 = -0.3。全てTier C
- 曜日×DD_mod10（全ホール）: pp>=5かつn>=20を満たす組み合わせ ゼロ件

差枚ベースのスキャン（2026-06-09実施）でも同じ次元が全ホール全パターンTier Cだった。
2つの独立した指標（差枚・機械割104%）で同じ結論に至ったため、
これらの次元を「単独次元として無効」と確定してよい。

## アクション
DD_mod10単独・台番号末尾単独・曜日×DD_mod10の3次元は、
今後のEDAスキャンで優先度を下げてよい（探索コストの削減）。
有効なシグナルは「機種名×曜日」「ホール×曜日」「機種名×DD_mod10」など
機種名やホールを含む組み合わせでのみ発現する。

