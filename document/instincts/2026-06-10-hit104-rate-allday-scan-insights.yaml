# 全日程3000G以上では平日(特に木)が土日より機械割104%出現率で4-5pp高い

## 背景
全ホール合算・3000G以上での曜日別機械割104%出現率:
- 木: 37.7% (+2.2pp)
- 水: 37.2% (+1.7pp)
- 火: 37.1% (+1.6pp)
- 金: 36.7% (+1.2pp)
- 月: 36.2% (+0.7pp)
- 土: 33.5% (-2.0pp)
- 日: 33.2% (-2.3pp)

差枚スキャン（games_normalized>=1000）では曜日単独は全ホール全パターンTier Cだったが、
機械割104%・3000G以上では平日>土日の傾向が一貫して見える。
ただし最大pp差は木(+2.2)で、Tier B閾値(+5pp)には届かない。

## 仮説（要検証）
1. 真にホールが平日に高設定を投入している
2. サンプリングバイアス：土日は稼働率が高く低設定機種も3000G到達するため
   分母が薄まる一方、平日は元々高設定の台に常連が座り続けるため3000G到達した
   台の中の高設定比率が相対的に高くなる

## アクション
平日有利の傾向を「設定投入パターン」として断定する前に、
「3000G到達した台の母集団の質」が曜日で変わっていないか
（稼働率・客層の違い）を別途検証すること。

