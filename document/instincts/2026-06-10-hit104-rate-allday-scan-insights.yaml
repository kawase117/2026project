# 全日程の機械割104%以上出現率は新台初日と完全に順位が逆転する

## 背景
新台初日（2026-06-10セッション前半）: みとや(103.9%)・ARROW(102.9%)が機械割で1-2位、
104%以上出現率でもARROW(38.5%)・みとや(36.7%)が1-2位だった。

しかし全日程・3000G以上フィルタでの機械割104%以上出現率:
1. 楽園   38.7% (+3.2pp)
2. 蒲田7  38.0% (+2.5pp)
3. 金時   37.9% (+2.4pp)
4. ヒロキ  36.0% (+0.5pp)
5. 蒲田1  34.7% (-0.8pp)
6. みとや  34.0% (-1.5pp)
7. レイトギャップ 33.1% (-2.4pp)
7. ザシティ 33.1% (-2.4pp)
9. ARROW  32.4% (-3.1pp)  ← 新台では1位だったが全日程では最下位

baseline(全体平均) = 35.5% (n=759,328, 3000G以上)

## アクション
「新台初日狙い」と「通常営業での高設定狙い」は別のホール選択をすべき。
- 新台初日 → みとや・ARROW
- 通常営業（全日程） → 楽園・蒲田7・金時
ホールには「新台開放型」（みとや・ARROW）と「通常営業型」（楽園・蒲田7・金時）の
2つの異なる戦略パターンが存在する可能性が高い。

