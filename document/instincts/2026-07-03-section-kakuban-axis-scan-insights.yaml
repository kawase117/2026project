# section粒度のdd軸有意は既知のホール全体イベント日効果を再検出しているだけの可能性が高い

## 背景
section_kakuban_axis_pattern_scan.pyの蒲田7セクション"2230-2246"のdd別plus率breakdownを見ると、
ピークはDD7=53.0%, DD21=49.2%, DD30=51.4%——kamata7-event-day-complete-definitionで確定済みの
イベント日リスト[1,7,11,17,21,22,27,30,31]と完全に一致した。
section粒度は複数台を同時に束ねるため、同じ日に属する行は全て同じdd/is_x_day値を共有する。
ホール全体で特定日に投入強化する既知の挙動があると、どのsectionを切り取っても同じ山が出て
しまい、section固有の位置効果と区別できない（machine_name軸スキャンでは1台=1日1行なので
この重複は起きないが、section軸のような多対1グルーピングでは起きる）。
kakuban粒度（同じ角番が複数の異なる島に分散）はこの汚染が弱く出た（kakuban=22のピークDD24/29/18/20
は既知イベント日リストと一致しない）ため、section軸よりも汚染が少ない可能性がある。

## アクション
section粒度のtop_signalsは、ドライバーとなっているdd値がHALL_EVENT_DIGITS（eda/core.py）と
一致するかを機械的にチェックし、一致するものは既知効果の再検出として割り引いて解釈する。
本当にsection固有効果を見たいなら、生の値ではなく「その日のホール全体平均を引いた残差」
（section_daily_value - hall_wide_daily_mean）でdd/dd_bin軸を再スキャンする必要がある。
これは ml/analysis/kamata_kakuban_section_residual_eda.py の残差（セクション内平均を引いて
角番効果を見る、比較の粒度が違う）とは別物なので混同しないこと。この残差版は未実装（2026-07-03時点）。

## 例
蒲田7 section "2230-2246" dd=7: n=202, plus_rate=53.0%
蒲田7 section "2230-2246" dd=21: n=197, plus_rate=49.2%
蒲田7 section "2230-2246" dd=30: n=185, plus_rate=51.4%
→ HALL_EVENT_DIGITS["蒲田7"] = [1,7,11,17,21,22,27,30,31] と完全一致。

