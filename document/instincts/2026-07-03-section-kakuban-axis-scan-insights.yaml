# dd_binの「sparse-cell警告解消」効果は、対象が真に低サンプルでないと発動しない

## 背景
RE:3(蒲田7, 新台・低サンプル)ではdd軸のchi2検定でexpected cell<5が50%超となりwarning付き
だったが、dd_binで束ねることでwarningが解消された（dd-bin-double-edged-swordパターンb）。
これを期待してsection/kakuban軸（machine_axis_pattern_scan.pyの複数台×多日数を束ねたグループ）
にも同じdd_binスキャンを適用したところ、dd軸のchi2でwarning付きになった行はほぼ皆無だった
（蒲田7_section: 0/159, 蒲田7_kakuban: 0/66, 蒲田1_kakuban: 0/60, みとや_kakuban: 2/66）。
section/kakubanは複数台のdaily行を束ねる設計そのものにより、個別DDセルのサンプル数が
最初から数百〜数万あり、そもそも「薄いセル」の問題が存在しなかった。

## アクション
「Binにすれば信頼性が上がる/新発見できる」という期待を持つ前に、対象グループの
n_obsと軸のカーディナリティ（dd=31水準）から1セルあたりの期待サンプル数を概算し、
既に十分（目安: 1セルあたり5を大きく上回る）であればBinの追加価値はほぼないと判断する。
Binが効くのは「機種単体・新台・短期間」のような本質的に低サンプルな軸粒度に限られる。

## 例
蒲田7_kakuban n=716（kakuban=22）でも1セル(dd31水準)あたり平均23件でwarning未発生。
RE:3は機種単体で数十日分のみのため1セルあたり5件未満が頻発しwarning発生。
