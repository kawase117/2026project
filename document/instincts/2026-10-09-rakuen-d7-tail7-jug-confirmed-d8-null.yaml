# 楽園蒲田の末尾7ジャグは7のつく日だけの再現する仕掛け。8の日×末尾8には広げない

## 背景
- 事前に固定した予測(2026-10-07、7の日×末尾7のジャグ)を、翌日のDBで検証した。機種自己のRB確率を基準にしたRB比は、末尾7ジャグ(11台日)1.259(片側Poisson p<0.001)、同じ日の他の末尾のジャグ0.967。ホール稼働の増加では説明できない(同日の他末尾と比べている)。10台中8台でRB比が1超。
- 7の日は、改装後の7/7から10/7まで10日連続で向きが一致した(9日の日別RB比は1.13〜1.29)。
- 同じ見方を8の日×末尾8に当てた(2026-10-08の予測時、9日分)。RB比は末尾8が1.034(91台日)、他の末尾が1.003で、9日中6日が1超・3日が1未満(0.89〜1.18)。7の日のような安定性はない。
- 10/8(10日目)の追試は、ジャグ・ハナハナ系の末尾8が0.94、全体が0.945。末尾8の全機種平均差枚は-240で、10末尾中8番目。予測(本線にしない)どおり、効果なし。
- 旧記録は『Xのつく日に末尾X』の他の対角(0、8を含む)では動かないと書いていた。これが8の日でも前向きに確認された形。

## アクション
- 楽園蒲田の7のつく日は、ノーマル機の末尾7(ネオアイム、マイジャグラーV、ゴーゴージャグラー3、ハッピージャグラーVIII)を第一候補に維持する。AT機の末尾7には効かないので、末尾7だけで座らない(2017は-1,079、2207は-2,825)。
- 8の日×末尾8、そのほかの『日付の下一桁=台の末尾』を、7の日と同じ根拠で本線にしない。予告が『末尾8が1/2⑤⑥』と言っても、実績の裏付けがない限り順位を上げない。
- 予告の主張が『7の日の末尾7』と同型でも、日付ごとに別に測る。測る道具は、ノーマル機のRB比(機種自己基準、同日の他の末尾との比較)。差枚は使わない。
- 11/7、11/17、11/27など、次の7の日で、累計を更新する(10日連続の向きが続くか)。

## 例
10/7の楽園1197・1207(マイジャグV、末尾7)はRB比1.38・1.42、1187(ネオアイム)は1.92。一方で、10/8の末尾8は同じホール・同じ機種群で0.94だった。台番号の末尾が同じでも、日付が7かどうかで結果が分かれた。
