# 条件日の機種ランキングは、台数が少ない機種ほど翌日に外れる(暫定)

## 背景
2026-10-07(7の付く日)の予測で、7/7〜10/6の7の日9日分から機種別の平均差枚を並べ、上位を「7の日に強い機種」として書いた。
- 蒲田1: 攻殻(3台)+1,633、戦国乙女4(4台)+1,317、化物語(4台)+1,261、いざ!番長(3台)+952。当日は **-1,067・-550・-267・-233と4機種すべて下振れ**。
- 蒲田7: 化物語(9→5台に減)+1,124、攻殻(3台)+1,115。当日は **-1,200・-1,600**。
- 一方、台数が多い機種は向きが保たれた: 蒲田1の東京喰種(20台)+1,366→+1,155、蒲田7の炎炎2・ToLOVEる・カバネリ海門(42台)。
- 少ない台数の平均は偏りやすく、9日の中の上位は「たまたま当たった日が多かった」機種が残る。上位を選んだ時点で選択バイアスが入る(予測した本人が上位から選んでいる)。

## アクション
- 条件日の機種順位を予測の根拠にするとき、台数が8台未満の機種は「履歴が根拠」と書かない(書くなら『少台数のため偏りの可能性』を併記)。
- 台数の多い機種を優先して並べ、少台数は当日のG比・勝ち台率・RB(判別できる機種のみ)で見る。
- 条件日の順位を使った予測は、台数別(少/中/多)に層別した的中率で事前に検証してから採用する。今回は1日・2ホール・6少台数機種で、層別の有意性は未検証。
- 予告の名指しと条件日の履歴が食い違うときは、台数が多い側の根拠を優先する(蒲田1の戦国乙女5は10台で、履歴の-366に反して名指しどおり+1,133だった)。

## 例
蒲田1の攻殻機動隊(3台)は、7の日9日で超えが3/9、平均+1,633、他の日は+51。10/7は-1,067。3台の平均は1台の大勝ちで動く。

