# 個体・二値分類で天井に達したら、目的変数の粒度を「集団・連続値」にシフトする——EDAの信号は集計レベルに宿っている

## 背景
[[small-population-effect-size-cannot-yield-high-individual-auc]] で示した通り、みとや・蒲田七とも個別台×二値分類（104%超えYES/NO）のAUCはほぼランダム（0.53前後）に留まった。一方でEDAは「島別に+1.7pt/+1.3pt/-0.3ptという異なるイベント効果がある」「イベント日全体で+1.4ptの効果がある」という**集計レベルでは確かに存在する信号**を検出している。

この食い違いの本質は、**予測対象の粒度（granularity）がEDAで発見した信号の宿る粒度と一致していない**ことにある。EDAで見つけた信号は「個々の台が今日勝つか」ではなく「ある島・ある日の集団としての104%超え率がどれくらい高まるか」という集計レベルの現象であり、これを個体の二値分類に落とし込むと、本来集計でしか観測できない小さな信号が個体ごとのギャンブル分散（CLAUDE.md Phase4基本理念「ギャンブルの不確実性」）に埋もれてしまう。

これは [[ml-allhall-paradigm-shift-20260602]] で記録した「強いホール当て→スパイク日当て」の転換と同じ構造の問題であり、汎用的なパターンとして再認識する価値がある。

## アクション
- 個体レベルの二値分類でAUCが理論上限（効果量から逆算した値）に張り付いて改善しないと判明したら、**モデリングを諦めるのではなく、目的変数の粒度を「効果が実際に観測される粒度」に合わせて再設計する**：
  - 個体×二値（この台は104%超えるか）→ 集団×連続値（この島の今日の104%超え率は何%か、または平均機械割は何%か）への転換
  - これにより、個体の分散（ノイズ）が集計によって平均化され、本物の集団レベル信号（島別+1.7pt等）がS/N比よく学習可能になる
- 出力された予測も「個体選択（この台に座れ）」ではなく「ポートフォリオ配分（今日はどの島に重点投資すべきか）」という意思決定支援に変える——これは [[ml-hall-concentration-penalty-20260602]] で確立した「Top2運用」のような集団・分散投資的発想と整合する
- この転換を行う前に、必ず「対象とする集計単位（島×日、ホール×日など）でのサンプル数が十分か」を確認すること。集計しすぎると今度はサンプル数不足で学習が不安定になる

## 例
```python
# NG: 個体×二値（信号が小さすぎてノイズに埋もれる、AUC≈0.53で頭打ち）
y = df['target_104']  # 1台・1日ごとのYES/NO
model.fit(X[['dd','dow','is_event','island', ...]], y)

# OK: 集団×連続値（EDAで検出した信号がそのまま目的変数になる）
df_grouped = df.groupby(['date','island']).agg(
    over_104_rate=('target_104','mean'),
    avg_kikaiwari=('kikaiwari','mean'),
    n_machines=('machine_number','count')
).reset_index()
y = df_grouped['over_104_rate']  # 島×日ごとの集計値（連続値）
model.fit(X_grouped[['dd','dow','is_event','island']], y)  # regressionとして学習
```
