# 「EDAでは効くのにMLではランダム」は矛盾ではなく、効果量(effect size)とAUCの数学的関係から生じる必然

## 背景
みとや大森町・島別サブモデルの検証で、`is_event`（イベント日フラグ）を含む特徴量だけのモデルはAUC=0.53（ランダム同然）だったが、EDAでは「イベント日31.5% vs 通常日30.1%」という統計的に意味のある差（[[mitoya-event-day-definition-and-selection-bias-in-min-games-filter]]参照）を検出していた。

ユーザーは「EDAで成果が出ているのにMLではランダムというのが腑に落ちない、何らかの傾向があるなら学習に活かせるはずでは」と疑問を呈した。

これは矛盾ではない。**母集団のbase rate差が小さい（このケースで1.4ポイント）場合、個体レベルの判別力（AUC）は数学的に0.5近傍に収束するしかない**。AUCは「2群の分布がどれだけ重ならず分離しているか」を表す指標であり、群間差が31.5% vs 30.1%程度では分布はほぼ完全に重なる。実際、`is_event`単独のAUCを測定したところ0.5201だった——これはまさに理論通りの値。

「大量データで統計的有意差(p<0.05)を検出できる」ことと「個体予測のAUCが高い」ことは全く別の主張であり、前者が成立しても後者が成立するとは限らない。これは情報理論的な必然であり、モデリングの失敗ではない。

## アクション
- EDAで検出した群間差を見たら、その**効果量（base rate差のポイント数）がそのまま個体予測の上限AUCに直結する**ことを念頭に置く。差が1〜2ポイント程度なら、得られるAUCの理論的上限も0.50〜0.55程度であり、それ以上を「失敗」と判断してはならない（むしろそれが正常）。
- 逆に、ある特徴量だけのモデルでAUCが理論値より大幅に高く出た場合（例：単独で0.7、0.8など）、それは「真の強い信号を発見した」のではなく**リークを疑う**べきサイン。
- 「群間差は実在するが個体予測には使えない」というのは矛盾した結果ではなく、**両立しうる正常な状態**だとユーザーに説明できるようにしておく——これを理解していないと、無意味に特徴量を増やしてリークを誘発する方向に進んでしまう。

## 例
```python
# is_event 単独でのAUCを測定 → 母集団差(31.5% vs 30.1%, 差1.4pt)から予想される通り0.52
auc_is_event_only = roc_auc_score(y_test, df_test['is_event'].values)
# => 0.5201 （理論的に妥当な値。これが「効かない」ではなく「期待通り」）

# 警戒すべきパターン: 特徴量を追加した瞬間にAUCが跳ね上がる → リークを疑う
# diff_coins_normalized, games_normalized（その日の実績値）を含めると AUC 0.53 → 1.0 に急騰
# → これらは予測時点で未知の「答え」そのものであり、モデルが学習しているのではなく答えを見ている
```

