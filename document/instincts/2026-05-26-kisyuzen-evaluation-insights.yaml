# base_rate が低い場合は固定閾値ではなく日次 Top-K 評価を使う

## 背景

Layer 0（is_kisyuzen 検知）を base_rate=3.45% で実装した際、
CatBoost の予測確率が全件 0.03〜0.25 程度に収束し、
閾値 0.3 でも 0.5 でも precision/recall = 0.0 となった。

原因: well-calibrated な CatBoost は確率を base_rate に近い値で出力する。
base_rate=3.45% なら真の機種全でも確率 0.1〜0.2 程度が上限になる。

解決策: 「閾値以上なら推薦」から「その日の全機種の中で確率上位 K 機種を推薦」に変更。
AUC=0.695 × 日次 Top-2 選択 で hit@2=17.8% vs random 6.8%（lift=2.62x）を達成。

## アクション

base_rate < 5% のモデル評価時：

1. 固定閾値による precision/recall を捨てる
2. 日次 Top-K 選択に切り替える

```python
for k in [1, 2, 3]:
    hits = []
    for date, group in eval_df.groupby('date'):
        top_k = group.nlargest(k, 'proba')['entity'].tolist()
        actuals = group[group['target'] == 1]['entity'].tolist()
        hit = int(any(e in actuals for e in top_k))
        hits.append(hit)
    hit_at_k = np.mean(hits)
    random_baseline = 1 - (1 - base_rate) ** k
    lift = hit_at_k / random_baseline
```

3. random_baseline = 1 - (1 - base_rate)^k で計算
4. lift > 1.5 なら実用的に有意と判断

## 例

```
変更前:
  precision@threshold=0.3 = 0.0  <- 確率が全件 0.3 未満で機能しない

変更後:
  hit@1 = 11.1%  random=3.5%  lift=3.22x
  hit@2 = 17.8%  random=6.8%  lift=2.62x
  hit@3 = 23.3%  random=10.0% lift=2.34x
```

