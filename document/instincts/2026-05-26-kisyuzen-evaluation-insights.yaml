# 2F_N セグメントは汎用特徴量では機能しない

## 背景

4セグメント（2F_A, 2F_N, 3F_A, 3F_N）で複数回実験し、
2F_N（2F の AT系のみ）が一貫して hit@1 < random を示した：

  2F_N is_top3 hit@3 = 0.267 vs random 0.274（lift=0.97）
  2F_N is_top5 hit@1 = 0.156 vs random 0.163（lift=0.95）

セグメント定義の補足（machine_type_common.py による）:
- "A" セグメント = jug_flag OR hana_flag OR bt_flag == 1（A型 + ハナハナ + BT）
- "N" セグメント = 上記フラグ全て0 = AT系のみ（BT は含まない）

2F_N の特徴：
- 最大セグメント（約33機種/日）
- AT系のみで機種ごとのキャラクターが多様
- 汎用特徴量（weekday_prior_top1_rate, lag1_rank_pct など）が捉えにくい

注意: 評価日数が少ない（n=5）場合は偶然 lift=1.5 以上になることがある。
90日評価で random 以下が確定してから判断すること。

## アクション

2F_N を扱う場合の優先順序：

Option A（除外）: 推薦対象から外す（最優先）
Option B（分割）: AT系を機種タイプ（液晶/通常/ART等）でさらに細分化して独立モデルを訓練
Option C（特徴量追加）: machine_type 別 rolling win_rate などを追加

まず Option A で運用し、データが増えたら Option B を検討。

## 例

```
2F_N lift 推移:
  n_eval_days= 5: hit@3=0.40, lift=1.54  <- 少サンプルで偶然良く見えた
  n_eval_days=90: hit@3=0.27, lift=0.97  <- 本来の性能（random以下確定）
```

