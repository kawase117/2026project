# Layer 0 と Layer 1 は混合せず独立した信号として別々に提示する

## 背景

Layer 0（is_kisyuzen）と Layer 1（セグメント内 top-K）を
final_score = layer1_proba * (1 + 0.5 * layer0_proba) で混合したが、
2つの信号は性質が根本的に異なる：

Layer 0: 稀な高品質日検知（機種全）、hit@2=17.8%（6日に1日）
Layer 1: 日次相対パフォーマンス、hit@3=83.3%（5日に4日）

混合スコアでは Layer 1 の hit 率が高いため Layer 0 の信号が薄れ、
評価指標が何を測っているか不明確になる。

## アクション

推薦システムの出力設計：

```python
daily_recommendation = {
    'date': today,
    # Layer 0: 機種全候補（稀だが高確信度）
    'kisyuzen_candidates': layer0_top2,
    # Layer 1: セグメント別高ランク候補（頻繁・安定）
    'segment_top': {
        '2F_A': layer1_2FA_top1,
        '3F_A': layer1_3FA_top1,
        '3F_N': layer1_3FN_top1,
        # 2F_N は除外（random以下）
    }
}
```

混合スコアは使わない。2つの信号をユーザーが用途に応じて参照する設計にする。

## 例

```
Layer 0 単独: hit@2=17.8%（6日に1日は機種全を捕捉）
Layer 1 単独: hit@3=83.3%（5日に4日はセグメント top3 を捕捉）

混合スコアの問題:
- 機種全でない日の Layer 0 top-2 が Layer 1 の順位を歪める
- 2つの信号の独立した価値が隠れる
```

