# 機種全の win_rate 閾値は 80% に構造的な切り目がある

## 背景

蒲田七の機種名別日次 win_rate（17,346件）で 5% バケット集計を行い、
avg_diff と diff>0率 の構造変化を確認した結果：

- 60〜69%: diff>0率 92〜94%、min_diff が負のケースあり
- 70〜74%: diff>0率 100% だが 75% で min_diff=-500
- 80%〜:   diff>0率 99〜100%、min_diff >= 220（全件確実にプラス）

特に注意が必要な点：
- win_rate=67% に 826件のスパイク
  -> 3台機種の 2/3 勝利（2/3=66.7%）が原因
  -> min_diff=-1,267 という負値が混入
  -> 2台低設定 + 1台高設定が機種全として誤ラベルされるアーティファクト

80%+ はこのアーティファクトの影響を受けない最低ラインである。

## アクション

機種全ラベルの閾値設定時：
- 70%: 全件プラスだが 75% でmin_diff=-500（不十分）
- 80%: min_diff=220+、全件プラス確認（推奨）
- 100%: 最クリーンだが件数が少なすぎる（2.2%）

機種サイズ起因スパイクの回避策：
HAVING COUNT(*) >= 4 を使うことで 3台以下の機種（67%=2/3が混入）を除外できる。

## 例

```
win_rate=67%（3台機種の2勝）:
  件数=826, avg_diff=1,272, min_diff=-1,267  <- 機種全でない日が混入

win_rate=80%（最低4台中3勝以上）:
  件数=727, avg_diff=1,903, min_diff=+220    <- 全件プラス確認

-> 閾値 80% が品質保証として最低ライン
```

