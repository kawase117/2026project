# Walk-forward 5バリアント比較: DD-bin→DD個別→hist機械割→角番修正→ウェイト最適化

## 背景
スコアリングモデルの改良を段階的に検証するため、5バリアントを設計した。
各バリアントは前のバリアントから1要素だけ変更し、改善幅を分離する。

v1_baseline:     角番old + DD-bin    + hist_diff    + default weights
v2_dd_individual: 角番old + DD個別   + hist_diff    + default weights
v3_hist_payout:  角番old + DD個別   + hist_payout  + default weights
v4_kakuban_fix:  角番new + DD個別   + hist_payout  + default weights
v5_optimized:    角番new + DD個別   + hist_payout  + optimized weights

改善要因の分離:
- v1→v2: DD-bin vs DD個別の効果（C3コンポーネント精度）
- v2→v3: hist_diff vs hist_payout の効果（タイブレーカー精度）
- v3→v4: 角番反転バグ修正の効果（全角番コンポーネントに影響）
- v4→v5: ウェイト最適化の効果（コンポーネント配分）

## アクション
1. バリアント間の差分は必ず1要素のみにして因果を分離する
2. v5のウェイト最適化はテスト期間前半で探索、後半で検証（オーバーフィット防止）
3. 結果はlift@50, avg_diff_vs_other, win_rateの3指標で比較する
4. イベント日/非イベント日で分割し、各バリアントの得意領域を特定する

## 例
期待される改善パス（DD20単発テストからの推測値）:
  v1(DD-bin, hist_diff):     lift@50 ≈ 1.0〜1.5
  v2(DD個別):                lift@50 ≈ 1.5〜2.0（C3精度向上）
  v3(hist_payout):           lift@50 ≈ 2.0〜2.5（タイブレーカー精度向上）
  v4(角番fix):               lift@50 ≈ ?（全コンポーネントに影響、改善方向は不明）
  v5(weight opt):            lift@50 ≈ v4以上（最適化による上乗せ）

