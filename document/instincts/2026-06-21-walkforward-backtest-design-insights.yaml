# DD20(6/20)TOP50バックテスト: avg_diff+906, hit@10=3/10(4.29x lift)

## 背景
2026-06-20（土曜日、DD20、非イベント日）のTOP50推奨台リストを
実績データと照合した初のバックテスト。角番反転バグ修正前のスコアリング。

主要結果:
- TOP50 avg_diff = +906（その他 avg_diff = -82）→ 差分 +988
- TOP50 win_rate = 62%（全体 48%）
- hit@10 = 3/10（期待値0.7 → lift 4.29x）
- hit@50 = 12/50（期待値3.5 → lift 3.43x）

個別的中例:
- 7つの魔剣が全で: 推奨2台（2108, 3282）とも実績TOP10に入った全的中
- 虚構推理(2349): 差枚は低いが異常に高いG数(9800G)。イベント日3ヶ月平均5400Gに対し+81%
  → 全台設定6の可能性を示唆するが差枚からは判断不能

## アクション
1. 1回のバックテストで過度な結論を出さない（n=1）
2. Walk-forwardで全営業日に拡張して真の予測力を検証する
3. 角番修正後に再検証する（現在の数値はバグ込み）
4. 虚構推理のようなG数異常台は「全疑惑」フラグとして追加指標にする価値あり

