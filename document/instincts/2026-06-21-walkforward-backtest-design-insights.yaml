# 個体タイブレーカーは機械割(payout)が差枚(diff)より優位、勝率とG数は逆効果

## 背景
DD20バックテストで各hist指標を単独コンポーネントとしてTOP50を選定し、
実績TOP50とのリフトを比較した。結果:
- hist_payout（機械割）: lift = 2.29x — 最強
- hist_diff（差枚）: lift = 1.43x — 有効だが機械割に劣る
- hist_winrate（勝率）: lift = 0.29x — 逆効果（ランダム以下）
- hist_games（G数）: lift = 0.29x — 逆効果（ランダム以下）

差枚は高G数低機械割の台を過大評価する。機械割は台の設定を正規化して反映する。
勝率とG数は設定情報をほぼ含まず、ノイズが支配的。

## アクション
1. 個体タイブレーカーには hist_payout（直近90日の台別平均機械割）を使用する
2. hist_diff は次善策として残すが、機械割が使えるなら機械割優先
3. hist_winrate と hist_games は個体評価に使用しない（逆効果）
4. 機械割の計算: (games_normalized * 3 + diff_coins_normalized) / (games_normalized * 3) * 100

## 例
DD20 単独コンポーネントTOP50結果:
- hist_payout TOP50: avg_diff=+906, hit@10=3/10 → lift 2.29x
- hist_diff TOP50: avg_diff=+650, hit@10=2/10 → lift 1.43x
- hist_winrate TOP50: avg_diff=-200 → lift 0.29x（ランダム以下）

