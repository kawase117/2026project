# 各コンポーネント単独でTOP50を選定し、リフトを測定する手法が有効

## 背景
6コンポーネント合成スコアのうち、どのコンポーネントが実際に予測に寄与しているかを
定量化するため、各コンポーネントを単独スコアとしてTOP50を選定し、
実績TOP50との一致度（lift@50）を測定する手法を採用した。

DD20での結果:
- hist_payout: 2.29x（最強だが過去実績の外挿）
- C4(曜日×角番): 1.72x（構造コンポーネント最強）
- composite: 1.71x（合成スコア）
- C1(seg×ssg×角番): 1.43x（安定的ベース）
- C3(DD×角番): 1.14x（DD個別化で改善余地）
- C2(セオリー): 0.86x, C5(末尾): 0.57x, C6(ゾロ目): 0.86x

composite ≈ C4単独 は、他コンポーネントの情報が冗長か、
ウェイト配分が最適でない可能性を示唆する。

## アクション
1. Walk-forwardで全テスト日についてコンポーネント単独リフトを記録する
2. lift@50 < 1.0 のコンポーネントはウェイトを下げるか除外を検討する
3. コンポーネント間の相関を計算し、冗長なペアを特定する
4. 曜日別・DD別にコンポーネント寄与度が変わるか検証する

## 例
コンポーネント単独評価の実装:
  for comp in ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'hist_payout']:
      top50 = scores.nlargest(50, comp)
      lift = len(top50_machines & actual_top50) / expected_hits
