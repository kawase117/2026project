# 土曜日×角番(C4)は構造コンポーネント中最高のリフトを記録

## 背景
DD20（土曜日）のバックテストで各構造コンポーネント単独のリフトを計算した結果:
- C4（曜日×角番）: lift = 1.72x — 構造コンポーネント中最高
- C1（seg×ssg×角番）: lift = 1.43x — 安定的
- C3（DD個別×角番）: lift = 1.14x — DD個別化で改善余地あり
- C2（セオリー最適角番）: lift = 0.86x — 単独では弱い
- composite（6コンポーネント合成）: lift = 1.71x — C4単独とほぼ同等

C4の高リフトは土曜日固有の可能性がある。他の曜日では異なるコンポーネントが
最高リフトになる可能性があるため、Walk-forwardで曜日別のコンポーネント寄与度を検証する必要がある。

## アクション
1. Walk-forwardでは曜日別にコンポーネント単独リフトを記録する
2. 土曜日にC4のウェイトを上げる曜日適応型ウェイト戦略を検討する
3. 一方、1回のバックテストから過度に一般化しない（n=1問題）
4. composite が C4 単独と同等のリフトを出したことは、他コンポーネントの冗長性を示唆する可能性あり

## 例
DD20コンポーネント別lift@50:
  C1: 1.43x, C2: 0.86x, C3: 1.14x, C4: 1.72x, C5: 0.57x, C6: 0.86x
  composite: 1.71x ≈ C4単独

