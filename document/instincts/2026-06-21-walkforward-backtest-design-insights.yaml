# Walk-forwardはRolling窓で実施し、3サイズ(90/180/365日)を並行比較する

## 背景
expanding窓（データ蓄積型）はトレンド変化への追従が遅い。
ホール側の設定投入戦略は時間とともに変化する可能性があり、
直近のパターンにより重みを置くrolling窓が適切と判断された。

設計上の決定事項:
- テスト開始日: データ開始から365日後（全窓サイズの公平比較のため）
- 7/7（全台設定6の特殊日）は訓練・テスト両方から除外
- 台番号2026（鉄台）は常に除外
- MIN_GAMES = 400 でフィルタ
- v5のウェイト最適化はテスト期間の前半50%のみ使用し、後半50%で検証

## アクション
1. 窓サイズ90/180/365日を全て実行し、結果を比較する
2. 90日は短期トレンド追従力、365日は安定性を評価する主軸
3. expanding窓は実装しない（ホール戦略変化への追従が目的）
4. テスト開始日は全窓サイズで統一し、比較の公平性を確保

## 例
テスト日=20260620, 窓365日の場合:
  訓練データ: 20250621 〜 20260619（test_date自体は含めない）
  テストデータ: 20260620のgames_normalized>=400の台のみ

