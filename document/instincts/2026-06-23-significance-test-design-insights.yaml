# リサンプリング単位は「日」であり「台」ではない

## 背景
同一日内の台は独立でない。v9cは特定台番号を連日選択する（リピート台）。
台を1標本にすると独立性仮定が崩れ、p値が過小（偽陽性率上昇）になる。
各日に全variantが同じ台プールをスコアリングするため、日単位でモデルがペアになる。
ペア化で「当たり日/外れ日」の共通変動が相殺され検出力が上がる。

## アクション
- ブートストラップ/並べ替えで入れ替える対象は「日」（台ではない）
- ペアリングキー = (segment, test_date)。同一セルでvariantをペア比較
- 検定母体は segment_daily_results.csv（既存出力・モデル改変不要）
- 集計後のsummary（.mean()済み）は日次分布を捨てるため検定に使えない

## 例
segment_daily_results.csv の1行 = 1 (segment, variant, window, test_date)
同一(segment, test_date)でv6aとv9cの行を引き当て、差分 d_t を構成する

