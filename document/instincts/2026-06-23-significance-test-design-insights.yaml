# 平均ベースの検定は単一日への依存が強く leave-one-day-out 感度が必須

## 背景
2F_L_N std=3003はDD07の+12,920が、3F_L_NはDD28の+6,126が平均を正に見せている。
ブートストラップやt検定の平均ベース結論は、この1日に支配される。
Wilcoxon（中央値）や符号検定（勝敗0/1）は外れ値に頑健だが、
平均系の指標を使う場合はleave-one-day-out感度分析で「1日抜いたら有意性が消えないか」を確認すべき。

## アクション
- 加算系検定（avg_diff_vs_other）にはleave-one-day-outを必ず併用する
- 1日抜きで有意性が消える差は「本物でない」と判定する
- 勝敗系（符号検定）を見出し指標にすると外れ値問題を回避できる

## 例
2F_L_N: DD07を抜くとavg_diff_vs_otherが+1,009→大幅低下
3F_L_N: DD28を抜くとavg_diff_vs_otherが正→負に反転する可能性

