# 日次liftの平均は「比の平均≠平均の比」で統計的に誤り

## 背景
lift = hit/expected の比率を日次で出して平均するのは数学的に不正確。
正しい集約量はプール比 Σhit/Σexpected。
現状 _aggregate_daily_results および segment_daily は日次liftの .mean() を取っている。
これはレポート用の概算としては許容範囲だが、検定用途には不適。

## アクション
- 検定でlift系を使う場合、日をブートストラップしてΣhit/Σexpectedを再計算する
- segment_daily_results.csv にはhit_tとlift_tはあるがexpected列が欠落
- hit_t=0の日はlift_t=0で逆算不能 → _summarize_metricsにexpected_t出力追加が最小改修
- 加算系・勝敗系だけなら改修不要で即検定可能

## 例
NG: mean(lift_t3500) over 256 days = 1.258
OK: sum(hit_t3500) / sum(expected_t3500) over 256 days（プール比）
差は通常小さいが、hit=0の日が多いセグメントで乖離する

