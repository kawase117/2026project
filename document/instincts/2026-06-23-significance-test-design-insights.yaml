# 検定する量は3族に分けて扱う（加算系・勝敗系・比率系）

## 背景
指標の数学的性質によって検定手法が変わる。
加算系（avg_diff_vs_other）は日次差分の平均→ペアブートストラップ。
勝敗系（win）は日次の勝敗フラグ→符号/二項検定（最も頑健、見出し指標）。
比率系（lift_t）はプール比Σhit/Σexpected→日次平均は誤り。
3族を混同するとすべての結論が無効になる。

## アクション
- 見出し指標 = 勝敗系（外れ値に左右されない）
- 頑健性チェック = Wilcoxon符号順位（加算系の中央値）
- 効果量 = ペアブートストラップ95%CI（差の大きさ）
- 比率系はexpected列追加後にプールブートストラップ
- 設計文書: document/plans/2026-06-23-significance-test-unit-and-quantity-spec.md

## 例
加算系: d_t = vs_other(v6a)_t - vs_other(v9c)_t → mean(d_t)の95%CI
勝敗系: N日中v6aが勝った日数 → 二項検定 H0: p=0.5
比率系: Σhit_t3500(v6a) / Σexpected_t3500(v6a) vs 同v9c

