# v6→v10の探索は飽和。新variant作成より検定・評価基盤整備を優先すべき

## 背景
2F lift_t3500でv6a=1.234, v9b=1.238, v9c=1.258。差は0.024で誤差レベル。
v8（動的セグメントウェイト）は全スケールでv6aに劣後。
v10a-e（曜日×角番ブースト）もscale→0で単調収束=施策自体が無効。
クロスセグメントスケール歪みがv8/v10で繰り返し発生。
統計的有意性は未検証のまま。差が本物か判定する手段がない状態で新variantを作っても意味がない。

## アクション
- 新variantは有意性検定・評価指標修正の完了まで凍結
- レバレッジの順序: ①有意性検定（Track A） ②評価指標修正（Track B） ③ゲート堅牢化（Track C）
- composite直接介入（セグメントブースト・動的ウェイト）は構造的に失敗する → Top50後リランキング限定
- 設計文書: document/plans/2026-06-23-post-instinct-improvement-roadmap.md

## 例
v10d(scale=0.25): lift@50=1.2462 < v6a=1.2495（縮小しても超えない）
→ scale sweep全域でv6aに劣後 = 施策自体が無効（打ち切り判断）

