# イベント日はN=6で検出力不足。統計的結論は出せない。

## 背景
28日間バックテストでイベント日はわずか6日。256日間でも30-40日程度。
符号検定で勝率83%(5/6)をp<0.05にするにはN≥6でちょうどギリギリ（片側p=0.109）。
つまり「イベント日はv6aが強い」はサンプル数的に確定不能。

## アクション
- イベント日サブセットの結論は「定性的傾向」に留め、「有意に優れている」とは言わない
- 256日walk-forwardでもイベント日N≈30-40。二項検定でp<0.05にするには勝率≥70%が必要（N=30）
- イベント/非イベントの分割は全体検定の補足情報として使う（主検定にしない）

## 例
N=6, 勝利5日: 片側二項検定 p=0.109（有意でない）
N=30, 勝利21日(70%): 片側二項検定 p=0.043（ギリギリ有意）

