# 「甲鉄城のカバネリ」はS版（無印）とL版（海門(うなと)決戦）の2機種が両方現役で存在する

## 背景
蒲田7では以下の2機種が両方とも現役（last_date=20260607）で稼働している:

| machine_name | n(games>=1000) | baseline hit104 |
|---|---|---|
| 甲鉄城のカバネリ（無印・S版） | 1648 | 45.8% |
| 甲鉄城のカバネリ 海門(うなと)決戦（L版） | 3156 | 33.5% |

2026-06-10セッション前半の「機種×ホール固定効果」分析で
「甲鉄城のカバネリ」として扱っていたのは**無印（S版）**であり、
「カバネリ海門」（L版）とは別機種・別baselineである。

## アクション
- 今後「カバネリ海門」と呼ぶ場合はL版「甲鉄城のカバネリ 海門(うなと)決戦」を指す。
- 無印（S版）は「カバネリ無印」または「S甲鉄城のカバネリ」と呼んで区別する。
- machine_nameでの完全一致クエリは2機種を自動的に区別するため、
  分析時に「カバネリ」とまとめて言及しないよう注意する。

