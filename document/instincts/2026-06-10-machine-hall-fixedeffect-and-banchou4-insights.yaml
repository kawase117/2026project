# 全期間・同一機種比較（固定効果）では蒲田7が最上位、楽園は中位に転落、ザシティが最下位

## 背景
3ホール以上で導入されている155機種（games_normalized>=1000, 各機種×ホールn>=30）について、
機種内平均との残差(resid)をホール別に集計：

| ホール | 機種数 | n | avg_resid_kaiwari | avg_resid_hit104 |
|---|---|---|---|---|
| 蒲田7 | 109 | 219,773 | +1.95 | +2.45 |
| 蒲田1 | 131 | 157,089 | +1.13 | +1.03 |
| 金時 | 99 | 52,777 | +0.42 | +0.82 |
| みとや | 126 | 116,341 | -0.04 | -0.73 |
| ARROW | 120 | 152,391 | -0.14 | -0.27 |
| 楽園 | 141 | 184,316 | -0.40 | +0.62 |
| レイトギャップ | 135 | 143,412 | -0.65 | -0.65 |
| ヒロキ | 137 | 90,910 | -0.92 | -0.74 |
| ザシティ | 111 | 46,248 | -1.00 | -2.32 |

既存のhit104-rate-allday-scan-insights（生の率ベース）では
楽園(38.7%) > 蒲田7(38.0%) > 金時(37.9%) > ... > ARROW(32.4%最下位)
だったが、機種を揃えて比較すると**蒲田7が最上位、楽園は中位（-0.40）に転落**する。

## 解釈
楽園の高いhit104率は「機種ラインナップそのものが高設定になりやすい台に
偏っている」結果である可能性が高く、蒲田7は「どの機種を持ってきても
他ホールより高め」という、より本質的な"設定投入の強さ"を示している。
ザシティは生の率でも固定効果でも最下位で一貫して弱い。

## アクション
「全日程でどのホールが強いか」を判断する際は、生の率ではなく
固定効果（同一機種比較）を優先する。蒲田7 > 蒲田1 > 金時を
「常時強いホール」群、ザシティ・ヒロキ・レイトギャップを
「常時弱いホール」群として扱う。

