# 全期間版 機種×ホール固定効果分析の実装パターン（eda/machine_hall_fixed_effect.py）

## 背景
新台初日限定ではなく全期間データで、3ホール以上に導入されている機種について
ホール間の機械割差（固定効果）とhit104率トップ組み合わせを抽出する実装。

実装済みファイル: `eda/machine_hall_fixed_effect.py`
- MIN_GAMES=1000, MIN_N_PER_HALL=30, MIN_HALLS=3
- 機種×ホールで集計後、機種内平均(m_avg_kaiwari)との残差を計算
- ホール別にresidの平均を取って固定効果ランキングを作成
- 機種別にresidのレンジ(max-min)が大きい＝ホール間差が大きい機種を抽出

## 注意点
- 機種名の表記ゆれに注意。例えば「甲鉄城のカバネリ」と
  「甲鉄城のカバネリ 海門(うなと)決戦」は別機種（S版/L版）として
  別々にgroupbyされる。意図せず両方を含めたい場合は
  machine_name LIKE '%カバネリ%' のような部分一致が必要、
  逆に区別したい場合は完全一致のままでよい。

