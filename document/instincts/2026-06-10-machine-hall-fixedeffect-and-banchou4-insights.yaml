# 蒲田7押忍！番長4の「月火高/水金低」パターンは他の現役機種では再現せず、機種固有の一過性現象と判断（強いブランドの新作には特別な投入傾向がありうる、という仮説として記録）

## 背景
押忍！番長4×蒲田7（n=324, 2026年現在は撤去済み）で観測された
月火 hit104率+10.3pp / 水金-11.1pp（差約20pp、avg_kaiwariも月115.4 vs 水100.6）
という強い曜日パターンが、蒲田7の他の現役大型機種でも見られるか検証した。

蒲田7現役9機種での「月火pp - 水金pp」:

| 機種 | n | 差 |
|---|---|---|
| 無職転生 | 870 | +5.8 |
| 新鬼武者3 | 3078 | +3.0 |
| 東京喰種 | 13038 | +1.8 |
| 北斗の拳 転生の章2 | 3714 | +1.2 |
| 革命機ヴァルヴレイヴ2 | 5248 | +0.1 |
| 甲鉄城のカバネリ(無印) | 1648 | -1.2 |
| 戦国乙女4 | 4202 | -1.3 |
| 東京リベンジャーズ | 4634 | -1.5 |
| カバネリ海門 | 3156 | -3.0 |

最大標本の東京喰種(n=13038)でも差はわずか+1.8pp。
押忍！番長4の差(約20pp)に匹敵する機種は皆無。

## 解釈（ユーザー仮説）
押忍！番長4は「超人気シリーズの間を開けた新作」として導入時に
大きな期待・注目があった。**強いブランド力を持つ新作機種は、
通常の機種とは異なる特別な投入パターン（曜日依存の集中投入など）を
取る可能性がある**という仮説。

## アクション
- 「曜日×機種」のような細分化された次元で見つかったパターンは、
  他の機種で再現するかをセットで検証してから一般法則として扱うこと。
  押忍！番長4のパターン単体では「設定投入法則」として採用しない。
- 今後、強いブランド力を持つ新作機種（人気シリーズの新作・続編）が
  入荷した際は、その機種だけ別枠で曜日/DD依存性を確認する価値がある
  （「強いブランドでは通常と異なる傾向がありうる」という仮説の検証材料として）。
