# 投入戦略は3ヶ月ごとに完全リセットではなく、構造は持続しつつ狙う日付がローテーションする

## 背景
ユーザーが「投入傾向は3ヶ月単位で変わるのが基本」という仮説を提示。90日ウィンドウでの実データ検証の結果、完全な仮説通り(3ヶ月ごとに完全リセット)ではなく、「特定機種にDD別パターンが出やすいという構造的傾向は持続するが、狙う具体的な日付(DD値)自体は90日規模でローテーションする」という中間的な実態が判明した(dd-target-day-rotates-not-full-reset参照)。一方で蒲田7の北斗の拳のように、直前90日は有意だったのに直近90日で完全に消えるケース(真のトレンド変化・減衰)も同時に存在する。

## アクション
短期ウィンドウでの検証は「同じ日付が続けて光るか」を要求せず、「隣接ウィンドウにも構造(実質的な効果量)があるか」を見る。実運用の台選びは直近ウィンドウの結果を主軸にしつつ、多重検定によるノイズ拾いを避けるため、隣接ウィンドウでの緩いサニティチェック(効果量が閾値以上)は残す。全期間一括統計は「どの機種がそもそもパターンを持ちやすいか」の一次スクリーニングに使い、「今どの日を狙うべきか」の答えには使わない。四半期ごとに独立して大量の検定を繰り返す運用は、insample-cv-overfitting-guard instinctと同種の過学習リスクを持つことを常に意識する。

## 例
蒲田1スマスロ北斗の拳: window0(直近90日)ピーク17日p=3.0e-5、window1(直前90日)ピーク1日p=7.7e-4。両方強いが対象日が移動。蒲田7の北斗の拳はwindow1(p=0.0074)有意→window0(p=0.38)で消滅、こちらは真の減衰。

