# 「直近」と「直前」は基準点なしでは同じ意味に読める。実日付を併記すべき

## 背景
2つの90日ウィンドウを「直近90日」「直前90日」と呼んで説明したところ、「直前」は基準点(何の直前か)を明示しないと「今の直前=直近」と同じ意味に読めてしまい、ユーザーに混同された。

## アクション
複数ウィンドウを説明する際は、相対的な時間語(直前・直近)だけに頼らず、実際の日付範囲(YYYY-MM-DD..YYYY-MM-DD)を必ず併記する。

## 例
window0(直近90日: 2026-04-02〜2026-06-30) vs window1(その一つ前の90日: 2026-01-02〜2026-04-01)。
