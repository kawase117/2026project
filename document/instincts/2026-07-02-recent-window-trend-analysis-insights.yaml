# 比較先ウィンドウの効果量がゼロ(ノイズ状態)だと、順位相関だけの一致判定は誤検出する

## 背景
曜日軸90日ウィンドウ検証で、蒲田7のいざ！番長(plus)はwindow1の効果量が実質ゼロ(0.00、完全にノイズ状態=曜日間でほぼ差がない)だったにもかかわらず、window0とのSpearman rho=0.89という高い一致度を示した。効果量ゼロの状態では「どの曜日/日が一番高いか」はノイズによる僅差で決まるため、この種の一致は偶然の可能性が高い。DD軸版(machine_dd_recent_window_scan.py)ではこれを教訓に、consistent_with_prior_windowの条件へwindow1_effect>=0.05を追加した。曜日軸版(machine_weekday_recent_window_scan.py)には未反映。

## アクション
複数ウィンドウ間の一致をSpearman順位相関(または類似の順位ベース指標)で判定する仕組みを作る/レビューするときは、比較対象ウィンドウ側にも最低限の実質的な効果量があることを追加条件にする。効果量が閾値未満のウィンドウとの「一致」は無視するか、noteに理由を残して別枠にする。

## 例
eda/machine_dd_recent_window_scan.py の consistent_with_prior_window 判定に window1_effect >= 0.05 を追加。eda/machine_weekday_recent_window_scan.py は未修正のため、同種の誤検出が起こりうる。

