# 短期ウィンドウ間でパターンが「消える」のではなく「狙う日付が移動する」ケースがある

## 背景
90日ウィンドウ検証（machine_dd_recent_window_scan.py）で、蒲田1のスマスロ北斗の拳とファンキージャグラー2(蒲田7)は、直近90日・その前90日の両方が独立に強く有意（p<0.001クラス、n=900〜2000超）だったが、ピークとなるDD値(日付)自体が移動していた（北斗の拳: 17日→1日、ファンキージャグラー2: 9日→1日）。両ウィンドウ間のSpearman順位相関は低い（0.07〜0.19）にもかかわらず、両方とも実質的な効果量（0.13〜0.22）を持っていた。
これは document/instincts/2026-07-02-machine-dd-persistence-check-insights.yaml の
persistence-rho-cannot-distinguish-no-signal-from-regime-shift（北斗の拳の前半/後半split rho≈0.015を「後継機投入による一度きりの市場変化」と解釈した instinct）を精緻化する発見。実際には一度きりの regime shift というより、90日規模で継続的にターゲット日がローテーションしている可能性が高い。

## アクション
短期ウィンドウ比較で「同じ日付/曜日が続けて光るか」だけを一致条件にすると、この種の実在する構造的シグナルを誤って棄却する。一致判定には「隣接ウィンドウにも実質的な効果量（閾値0.05程度）があるか」を用い、対象日の完全一致は要求しない。全期間一括の前半/後半50/50splitでrho≈0が出た場合も、即座に「法則性なし」と判断せず、90日規模の細かいウィンドウで再検証する。

## 例
蒲田1 スマスロ北斗の拳 hit104: window0(2026-04-02..2026-06-30) p=3.0e-5 効果量0.217 トップ17日、window1(2026-01-02..2026-04-01) p=7.7e-4 効果量0.178 トップ1日。

