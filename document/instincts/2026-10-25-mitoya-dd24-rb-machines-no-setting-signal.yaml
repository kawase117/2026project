# みとやのDD24は、RB判別機種（ジャグラー以外）の差枚が出てもRB確率が通常日と同じで、設定投入の傾向は見えない

## Core claim
みとや大森町のDD24では、ノーマル/BTとA+ART/ATの差枚が通常日より大きく出る日があるが、RB確率は通常日と同程度のままで、設定が多く入ったことを示す材料にならない。差枚は稼働（回転数）の多さが押し上げている。

## Evidence
- n_observations: 10日（2026年1月以降のDD24 9日 + 2026-10-24）
- data scope: みとや大森町店、ジャグラーを除く bonus_judgeable=1 の機種（ノーマル/BT 10機種、A+ART/AT 5機種）
- metric scope: 平均差枚、勝率、RB確率（総RB/総回転数）
- result summary:

| タイプ | 日 | 台日 | 平均G | 平均差枚 | RB確率 |
|---|---|---:|---:|---:|---|
| ノーマル/BT | DD24（1月〜9/24） | 136 | 3,968 | -146 | 1/395 |
| ノーマル/BT | 通常日 | 3,341 | 2,710 | -59 | 1/388 |
| ノーマル/BT | 10/24（DD24） | 17台 | 5,390 | +732 | 1/365 |
| A+ART/AT | DD24（1月〜9/24） | 78 | 4,966 | +506 | 1/537 |
| A+ART/AT | 通常日 | 1,901 | 3,298 | -16 | 1/532 |
| A+ART/AT | 10/24（DD24） | 11台 | 6,390 | +1,403 | 1/601 |

- 10/24は差枚が過去のDD24平均を大きく上回ったが、RB確率は通常日と同程度。DD24の日ごとの強さは月で変わる（6月以降の全RB機種の平均差枚は -233、+184、+2、+58）。
- A+ART/ATは「他のイベントDD」でも+216と上振れており、DD24に固有ではない。

## Interpretation
- 差枚が高い日は回転数も多い。RBが通常日と変わらないので、「設定を入れた日」ではなく「稼働が多く出玉が出た日」と読む。
- ノーマル/BTはDD24でも差枚・勝率とも通常日と大差がなく、狙う根拠にならない。
- A+ART/ATは台日が少なく（9日で78台日）、ディスクアップUR 745は10/24に-1,292だった。

## Action
- みとやのDD24で非ジャグラーのRB判別機種を推す理由に「DD24だから」は使わない。座るなら開店後のRB確率と回転数で決める。
- 標本が増えたら（DD24の台日が200を超えたら）RB確率に差が出るかを再確認する。それまでは監視中。

