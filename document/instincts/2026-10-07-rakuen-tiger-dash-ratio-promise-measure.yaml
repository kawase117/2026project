# 1/N公約は機種平均では測れない。+1,800超えの台数の割合と勝ち台率で測り、当たり台は結果ツイートの台番号で確認する

## 背景
『1/3の機種』は30台中約10台だけが高設定なので、機種平均は+1,800に届かないのが普通である。
2026-10-06のカバネリ(30台)は、機種平均+1,656(閾値未満)だが、+1,800超えが11台(37%)で、1/3の公約と一致した。
化物語(9台、1/2公約)は、勝ち2/9・平均-698で、RB合算は1/338(自己ベース1/385より良い)。当たり台は結果ツイート待ち。
7/26の化物語(1/2、結果発表で5/9が当たり、台番号は画像で確認)は、当たり5台の差枚が+10,191〜-1,714で、3台がマイナス、機種平均は+1,731だった。当たり台のRBは1/387、外れ台は1/384で、RBでも差枚でも当たり台を特定できない。
予告の台数が誤りだったのは7/26だけ(化物語7台は実際9台、カバネリ15台は18台)。他の取材日9日は予告台数がDBと一致した。
以前、取材日のカバネリを「超え0/8」(機種平均+1,800)で弱いと見たのは、1/Nの公約に合わない指標だった。

## アクション
- 1/2・1/3公約の採点は、機種平均ではなく、機種内の+1,800超え台数(または勝ち台率)と、公約の割合(1/3=約33%、1/2=約50%)を比べる。
- 当たり台の特定は、SEVEN-D(datagasubete)の結果ツイート(数日〜9日後に投稿)の台番号で行い、差枚・RBで推測しない。
- 取材日の機種別の集計(超え回数など)で、公約の割合に合わない指標(機種平均)を使わない。予告の台数は、DBと突き合わせて確認する。

## 例
10/6のカバネリ海門30台: +1,800超え11台(37%)、+3,000以上8台、+5,000以上4台、勝ち20台。機種平均は+1,656で、機械採点の「全台系の閾値」には届かない。
