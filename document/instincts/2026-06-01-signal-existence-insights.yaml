# カレンダー特徴量の悪化は「パターンが非定常である証拠」

## 背景
カレンダールール holdout 比較結果（蒲田7）：
- global（カレンダーなし）：precision@2 = 0.2025（最良）
- dd_value追加：0.1800（悪化 -2.25pp）
- weekday追加：0.1900（悪化 -1.25pp）
- dd+weekday：0.1942（悪化 -0.83pp）

「追加すると悪化する」は「selection期間で学習したパターンが
holdout では逆方向になっている」を意味する。
ホール側が意図的に戦略を変えている（非定常）のが最も自然な説明。

## アクション
カレンダー特徴量追加で性能が悪化した場合：
1. 「特徴量が悪い」ではなく「パターンが変化している」と解釈する
2. ローリングウィンドウでパターンの安定性を確認（90日窓×スライド）
3. 非定常なら「直近N日だけの集計」を特徴量にする（長期統計より短期適応）
4. それでも悪化なら「このホールはカレンダー戦略を使っていない」可能性を考慮

