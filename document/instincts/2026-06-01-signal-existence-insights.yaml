# ホール横断プールが最速・最安の検出力増強手段

## 背景
蒲田7単体：holdout 150日 → 80%検出力閾値 precision@2 ≈ 26.68%
全9ホール合算：holdout ≈ 1,350日 → 閾値が約 23% 程度に低下

既存DBが全ホール分存在するため、追加コストは数時間の分析スクリプト実行のみ。
ライブ収集（約13年待ち）と比較して圧倒的にコストが低い。

## アクション
単ホールでシグナルが有意でなかった場合の次のステップ：
1. 全ホール共通の分析スクリプトを同条件で実行
2. ホール別の方向性を確認（全ホールで同方向なら pooling が有効）
3. プールした場合の有効n と検出力閾値を再計算
4. それでもシグナルなしなら問題の難易度自体を変える（ターゲット変更）

