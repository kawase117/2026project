# 4セグメント検定でp≈0.05は多重検定の見かけ

## 背景
signal_existence_plan で 3F_N のみ反復回避 p≈0.05 が出た。
しかし 4セグメント（2F_A, 2F_N, 3F_A, 3F_N）を同時検定した場合、
Bonferroni補正の閾値は p=0.05/4=0.0125。
p≈0.05 は補正後に消える → 「4回試してたまたま1回引っかかった」が正しい解釈。

## アクション
セグメント別検定で p≈0.05 が出ても、以下を確認する前に「シグナルあり」と判断しない：
1. Bonferroni補正後も有意か（n_tests で割った閾値を使う）
2. 他のホールでも同方向の傾向があるか（再現性確認）
3. selection → holdout で同方向か（消える可能性を確認）

