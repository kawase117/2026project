# 予測問題の難易度はターゲット粒度で変わる

## 背景
現在のターゲット：「10末尾の中でどれが上位か」（1/10問題）
- ランダム基準 precision@2 = 20%
- 小さな改善も埋もれやすい

代替ターゲット：「2Fと3Fのどちらに高設定が多いか」（1/2問題）
- ランダム基準 50%
- 同じ効果量でも検出力が大幅に高い
- 実運用上も「フロアを選ぶ」判断は有用

## アクション
signal_existence_plan が null 結果を返したとき、次に試す：
1. ターゲットを末尾(1/10)からセグメント(1/2〜1/4)に変更
2. 同じ検定を再実行
3. セグメントレベルでシグナルが見つかれば、その中で末尾を選ぶ2段階に進む

「予測が難しい」は「このターゲット設定が難しい」であって
別の粒度では解ける可能性がある。

