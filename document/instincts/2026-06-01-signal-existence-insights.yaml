# MLの前に統計的シグナル存在確認が必須

## 背景
signal_existence_plan.py を蒲田7（holdout 150日）で実行した結果：
- 反復回避：P(top1_{t+1}|top1_t) = 0.098 vs 基準0.10（非有意）
- ランク自己相関：max |rho|≈0.035（実質ゼロ）
- (DD,末尾)セル：Bonferroni補正後有意0件
- 最良ルール(drought_relative)：precision@2=21.25%、95%CI含む20%（非有意）

リーク修正後、統計的に検出可能なシグナルが存在しないことが確認された。
この状態でML特徴量を追加しても性能は改善しない。

## アクション
新しい予測対象・ホール・期間でMLを始める前に必ず以下を実行する：

1. 反復回避検定：P(rank1_{t+1}|rank1_t) vs 基準10%（セグメント別）
2. ランク自己相関：lag=1,2,3,7 の Spearman rho
3. ルールベース holdout 比較：drought/momentum/exclusion ルール vs. ランダム
4. 有意なシグナルが1つ以上確認できてからMLに進む

シグナルなしの状態でMLを設計してもリーク修正後は精度がランダムに戻る。

