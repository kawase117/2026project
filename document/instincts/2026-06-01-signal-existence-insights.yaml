# 効果量が検出力閾値の1/5以下なら実運用での検証は非現実的

## 背景
蒲田7の結果：
- 観測された最良改善量：drought_relative で 1.25pp（21.25% - 20%）
- 80%検出力に必要な改善量：6.68pp（26.68% - 20%）
- 必要サンプル数：約2,000日/セグメント ≈ 約13年分

効果量が検出力閾値の1/5しかない場合、ライブデータ収集で確認するのは非現実的。

## アクション
「ライブで継続記録して検出力を稼ぐ」という提案が出たとき、先に計算する：
1. 観測された効果量（precision改善量）
2. 80%検出力に必要な改善量（power計算）
3. 必要日数を逆算
4. 必要日数が1〜2年を超えるなら別のアプローチを先に試す

最優先の代替：ホール横断プールでサンプルを増やす（数時間の作業）。

