# 台単位の結果指標では高設定を判定できない。機種単位なら「平均差枚 × 回転数比」が最良

## Core claim
ユーザーの指摘「答え合わせで平均差枚にマイナスを入れるのは高設定フラグとして優秀でない」は**正しい**。
ただし当初 hit104率 を主指標に据えたのは**誤りだった**（20260803、正解ラベルで反証。下記「⚠️訂正」）。
正しい結論は2段構え:
- **台単位**: 結果ベースの指標はどれを使っても高設定を判定できない。指標選択の問題ではない
- **機種単位**: 全台系の検出には **平均差枚 × 回転数比(G比)** の複合が最良。次点が平均差枚単独。
  hit104率・プラス台率は**劣る**

## ⚠️ 訂正（20260803、正解ラベル6件による検証）
20260801 の全台系が3ホール分判明した（楽園=鉄拳6・化物語、蒲田7=東京喰種・東京リベンジャーズ、
蒲田1=革命機ヴヴヴ2・防振り。出典: 各店の取材発表アカウント）。これを正解ラベルとして
各指標が当該機種を何位に置くかを測った（n>=3機種、48〜62機種中）:

| 指標 | 平均順位 | 上位% | 最悪 |
|---|---|---|---|
| **複合(G比×平均差枚)** | **5.2位** | **10.1%** | 19位 |
| **平均差枚** | **5.5位** | **10.6%** | 20位 |
| G比(回転数/ホール平均) | 10.8位 | 19.0% | 33位 |
| hit104率 | 12.0位 | 22.6% | 38位 |
| プラス台率 | 14.5位 | 26.9% | 42位 |

**hit104率・プラス台率は最下位クラスだった。** 全台系は「大量に放出する」規模のイベントであり、
台数ベースの指標は頭打ちになって規模を捉えられない。

## 決定的証拠: 全台高設定でもプラス台率16.7%になる
| 機種 | 台数 | 平均差枚 | 中央差枚 | プラス台率 | G比 |
|---|---|---|---|---|---|
| 蒲田1 防振り | 3 | +4,400 | +5,500 | 100% | 1.23 |
| 楽園 鉄拳6 | 5 | +3,791 | +3,429 | 100% | 0.91 |
| 蒲田7 東京喰種 | 41 | +4,159 | +4,000 | 82.9% | 1.03 |
| 楽園 化物語 | 9 | +2,445 | +1,572 | 66.7% | **1.77** |
| 蒲田7 東京リベンジャーズ | 5 | +1,980 | **-500** | **40.0%** | **1.64** |
| 蒲田1 革命機ヴヴヴ2 | 6 | **+17** | **-1,950** | **16.7%** | **1.40** |

**下2件は公式に全台高設定と発表されながら、結果は惨敗している。**
ヴヴヴ2は6台すべて高設定で機種総差枚 +100枚。
→ **結果ベースの指標で台単位の設定を判定するのは原理的に無理**。ユーザーの当初の指摘は、
私が前回認めた以上に正しかった。

## 回転数(G比)が効く理由 — 結果指標との相補性
結果が悪かった3機種(東リべ1.64 / ヴヴヴ2 1.40 / 化物語1.77)は**すべてG比が自店1〜2位**。
結果が良かった3機種(喰種1.03 / 防振り1.23 / 鉄拳6 0.91)はG比が平凡。
**結果が出た全台系は平均差枚で見つかり、結果が出なかった全台系は回転数で見つかる。**
だから複合が最良になる。

プレイヤーは台内部の設定示唆(示唆演出・OC・小役確率)を見て居座る。
**外部データに無い情報が滞在時間に反映されている＝回転数は他プレイヤーの集合知シグナル。**
参考: 各店のG比中央値は0.91〜0.95、上位10%が1.24〜1.37。G比1.4超は明確な異常値。

## Evidence（楽園 20260801 AT一般 344台）
G数五分位別:

| 分位 | 平均G | 平均差枚 | 中央差枚 | プラス率 | hit104率 |
|---|---|---|---|---|---|
| G最少 | 1,932 | -978 | -1,047 | 14.5% | 13.0% |
| G少 | 4,154 | -646 | -1,190 | 29.0% | 24.6% |
| G中 | 5,695 | -819 | -1,428 | 33.8% | 17.6% |
| G多 | 7,193 | **+1,029** | +334 | 52.2% | 47.8% |
| G最多 | 8,922 | **+2,288** | +1,477 | 68.1% | 56.5% |

**差枚は「設定 × 回転数 × 運」の積であり、設定だけを測っていない。**
HYPOTHESIS_LEDGER の `rk-event-dd-hall` が「差枚・hit104率が回転数を測っていた」として
撤回されたのと同型の交絡。

## ユーザーの2つの理由の検証（片方は逆向きだった）

### (a)「低設定は途中でやめられるので負けが小さく出る」→ 支持されるが、方向が逆
G最少層(1,932G)の平均差枚は -978 で、hit104率13%。確かに低設定は早く見切られ小さい負けで終わる。
つまり**平均差枚は既にマイナス側を過小評価している**。「マイナスを入れるのが問題」ではなく
「入れても足りない」。この効果は平均差枚を**甘く**見せる。

### (b)「大負けは高設定の不発を長時間粘った結果」→ ジャグでは否定された
楽園 ネオアイムジャグラーEX 61台(20260801)を差枚で層別し、RB確率を見た:

| 群 | 台数 | 平均G | 平均差枚 | RB確率 | BB回数 | RB回数 |
|---|---|---|---|---|---|---|
| 大勝(+1000超) | 9 | 6,360 | +2,127 | **1/266.5** | 28.8 | 24.6 |
| 中間 | 47 | 3,361 | -173 | 1/503.6 | 12.3 | 8.2 |
| 大負(-1000未満) | 5 | 3,795 | -1,361 | **1/420.5** | 9.4 | 10.0 |

参考: アイム系 RB確率は設定1≒1/439、設定6≒1/330。
**大負け台のRB確率 1/420.5 は設定1相当。高設定の不発ではなく素直に低設定だった。**
⚠️ これはジャグ(Aタイプ)の結果。AT機はボラティリティが桁違いで、設定6でも -5,000枚は
普通に起きるため一般化してはならない。AT機では (b) は依然として起こりうる。

なお差枚下位10台の平均G=7,153 は全体中央 5,712 より多く、「大負け台は長く回されている」
という観察自体は正しい。ただし上位10台は 8,303G とさらに多く、全体としては
「出た台が回されている」方向。

## 指標を変えると順位が大きく入れ替わる（楽園 20260801、n>=5機種）
| 機種 | 平均差枚順位 | hit104率順位 | 差 | 読み |
|---|---|---|---|---|
| スマスロ サンダーV | 11 | 30 | **-19** | 平均は良いが104超えは1/6 |
| 北斗の拳 転生の章2 | 9 | 19 | **-10** | 少数の大勝ち台が平均を作る(5/20プラス) |
| 革命機ヴァルヴレイヴ2 | 2 | 9 | -7 | 中央差枚 +572 に対し平均 +3,068 |
| マギアレコード | 7 | 14 | -7 | 平均+900 だが**中央-857** |
| スーパーリオエース2 | 33 | 14 | **+19** | 平均は最下位級だが104超えは1/3 |
| からくりサーカス2 | 28 | 11 | **+17** | 同上 |
| ディスクアップ ULTRAREMIX | 14 | **2** | +12 | 地味だが台数ベースでは最上位級 |
| 甲鉄城のカバネリ海門 | 17 | 14 | +3 | 平均+119 に対し**中央-1,452**(1台の大勝ち) |

## ⚠️ 2つの質問を1つの指標で測らないこと
- **「ホールが高設定を置いたか」** を測るなら → hit104率・中央差枚・(Aタイプなら)RB事後分布
- **「自分がいくら勝てたか」** を測るなら → 差枚。ただしユーザーは低設定と判断したら途中でやめられるため、
  **フルデイの差枚は実現損益より悲観的**。フルデイ差枚は「朝から閉店まで打ち切った人」の損益であって
  ユーザーの損益ではない
この2つは別の質問であり、同じ表に並べて「当たり/外れ」を判定してはならない。

## Action
1. **機種単位の全台系判定**: 主指標は **G比 × 平均差枚**、次に **平均差枚**。
   hit104率・プラス台率を主指標にしてはならない（正解ラベルで最下位クラス）。
   ⚠️ ただし平均差枚はG数と交絡する（下記Evidence参照）ので、必ず **G比を併記**して
   「規模が大きいのか、単に回されただけか」を切り分ける
1b. **台単位の高設定判定**: 結果ベースの指標では不可能。台を名指しで採点しない。
   採点は必ず機種・セクション等の**群単位**で行う
2. ジャグ・ハナハナ・技術介入では **RB確率ベースの設定事後分布** を併記する
   （[[forward-scoring-needs-rb-perspective-not-just-diff]]）
3. AT機では大負け台を「低設定確定」と読まない。ボラティリティで説明できる範囲を超えているか、
   G数と併せて確認する
4. hit104率にも欠点がある: 低回転台の payout はノイズで、104%に届かないだけの可能性がある。
   ただし min_games での足切りは選択バイアスを持ち込む(CLAUDE.md)ので、
   **足切りせず G数分位を併記する**形で扱う
5. 「機種平均が微プラス」を安全性と読み替えない。**避難先を選ぶときは必ずプラス台率を見る**。
   実例(蒲田1, 20260801): 北斗の拳 転生の章2 は edge +2.59pp と微プラスだが
   プラスは **5/12**・平均+67枚。当たり台率4割強の機種は「リスクの少ない避難先」にならない
   （※ 全台系の検出には使わない。上表のとおりプラス台率は検出指標としては最下位）

