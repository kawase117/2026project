# X角番（x_kakuban）— X座標列内の深度順位による新しい分析軸

## 背景
2026-06-17: section 角番（kakuban）と混在していた旧 colsize 分析（X座標集計ベース）を
「X角番の先行実験」として再定義したことを機に、X角番を正式な分析概念として定義する。

section 角番（既存）と X角番（新規）は独立した2軸：

| 概念 | 定義 | 捉えるもの |
|---|---|---|
| section 角番 | 島（連続台番号グループ）内での台番号順位 | 島の端/中間ポジション |
| X角番（x_kakuban） | X座標列内でのY方向順位（Y昇順） | 物理的な手前/奥ポジション |

## X角番の計算定義

```python
# floor_coordinates_*.csv の座標データを使用
# 同じ X 座標を持つ台を Y 昇順（手前→奥）に並べてランク付け
coords["x_kakuban"] = (
    coords.groupby(["floor", "X"])["Y"]
    .rank(method="first")
    .astype(int)
)
# x_kakuban=1 が最も手前（Y値が小さい）の台
```

## section 角番との違い

```
例: 蒲田7 2F の X=5 列に 2 セクション・4台がある場合（模式）
  台番号 2010 (section_A, Y=2) → section角番=1, X角番=1（手前）
  台番号 2011 (section_A, Y=3) → section角番=2, X角番=2
  台番号 2050 (section_B, Y=5) → section角番=1, X角番=3（別セクション・同X列）
  台番号 2051 (section_B, Y=6) → section角番=2, X角番=4（奥）
```

→ X角番はセクション境界を無視して「入口から何番目か」を測る。

## 先行実験との関係
旧 kamata7_kakuban_colsize_eda.py の「X座標集計ベースの colsize」部分は、
X角番の概念を意図せず混入させていた先行実験として位置づけ直された。
ただし実装が section 角番と混在しているため、クリーンな再実装が必要。

## アクション
`kamata7_x_kakuban_eda.py` として新規実装する。
section 角番分析スクリプト群とは独立したファイルとして管理する。

