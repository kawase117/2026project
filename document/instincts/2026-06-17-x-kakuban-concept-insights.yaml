# X角番仮説：ホールは「手前台 vs 奥台」でも設定投入を変える可能性がある

## 背景
2026-06-17: X角番コンセプト定義と同時に立案。
section 角番（島の端/中間）が有意なシグナルを示すことは確認済み。
X角番（入口からの奥行き）も別の設定投入ロジックを反映している可能性がある。

## 想定される投入パターン
- **手前台優遇仮説**: 入口に近い台（X角番=1）に高設定 → 稼働率UP・ホール宣伝効果
- **奥台優遇仮説**: 奥の台（X角番=最大）に高設定 → ハイエナ防止・常連優遇
- **中間台優遇仮説**: section 角番と同様に中間が優遇

## section 角番との交絡
X角番と section 角番は相関する場合がある（同じ島内で並ぶ台は X も Y も近い）。
交絡の有無は実装後に Spearman 相関で確認する。
独立していれば 2 軸を組み合わせた特徴量設計が有効になる。

## アクション
`kamata7_x_kakuban_eda.py` の結果を受けて、X角番と section 角番のシグナルが
独立しているか交絡しているかを確認する。
