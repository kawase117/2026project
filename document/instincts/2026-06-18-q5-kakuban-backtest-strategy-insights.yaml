# DD別日次推薦はEDA CSV × 最新機種配置 × Q5フィルタの3ステップで生成する

## 背景
2026-06-18: `eda/kamata7_q5_kakuban_backtest.py` のDD別バックテストから
日次推薦ワークフローが確立した。

## アクション

**ステップ1: Q5機種名セット取得**
```python
q5_names = _get_q5_names(df, train_period)  # 直近3ヶ月で差枚sum上位20%
```

**ステップ2: 最新機種配置×座標マージ**
```python
latest_df = df[df["date"] == latest_date][["machine_number","machine_name"]].drop_duplicates()
base = coords.merge(latest_df, on="machine_number", how="left")
base["is_q5"] = base["machine_name"].isin(q5_names)
```

**ステップ3: 各セグメントの EDA CSV を DD でフィルタして mean_residual 降順ランク**
```python
dd_eda = pd.read_csv(eda_path)
dd_eda = dd_eda[dd_eda["dd"] == DD_TODAY].sort_values("mean_residual", ascending=False)
```

**ステップ4: Q5台が見つかるまで角番ランクを降順に走査（次善フォールバック）**

**ステップ5: 全セグメントを統合し machine_number で重複除去（mean_residual 最大を採用）**

日次推薦TOP50は「期待残差（mean_residual）降順」でソートし、
台番号・機種名・セグメント・角番・期待残差・n・セクションを別カラムで出力する。
nが小さい（< 50）エントリは高シグナルでも信頼度低として注釈する。

