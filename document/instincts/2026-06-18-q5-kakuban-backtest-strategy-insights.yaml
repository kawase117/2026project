# Q5×角番戦略ではNA分割よりRL分割が1日総差枚で約2.5倍優位

## 背景
2026-06-18: `eda/kamata7_q5_kakuban_backtest.py` のDD別角番戦略バックテスト結果。
テスト期間: 2026-04-01〜06-16（75日間）

| 分割軸 | 1日平均台数 | 平均差枚/台 | 1日総期待差枚 |
|--------|-----------|------------|-------------|
| NA分割（2F_N + 3F_A） | 5.5台 | +543 | ~2,987 |
| RL分割（2F_L/R + 3F_L/R） | 11.2台 | +672 | ~7,526 |

NA分割は機種タイプ（ジャグ/ハナ系 vs AT/ART系）で分割する。
RL分割は空間位置（X座標で左/右）で分割する。

RL優位の理由：
1. **分解能** — RL分割は左右別々にEDAして最強角番を計算するため、左右で最適なターゲットが異なる（e.g., 3F_L:角番6 vs 3F_R:角番19）
2. **カバレッジ** — NAでは2F_AとQ5機種が存在しないためカバレッジが低い。RLは同じQ5機種をL/R別に独立評価するため台数が増える
3. **3F_A内部の格差を顕在化** — NA分割では3F_A=+317という平均に埋もれるが、RL分割で3F_L=+481 / 3F_R=+335と左側の優位性が見える

## アクション
Q5×角番の日次推薦にはRL分割（Pattern2）を基本戦略とする。
NA分割（Pattern1）は3F_Aの1位候補（3345等の固有台）を補完的に参照する用途で使う。

