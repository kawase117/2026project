# 日次推薦表は台番号と機種名を別カラムにし mean_residual 降順で TOP50 を出力する

## 背景
2026-06-18: ユーザーフィードバック「ソートするので台番号と機種名は別カラムにしてください」。
台番号・機種名を同一セルに入れると Excel/Sheets でのソートができない。

## アクション
出力カラム順: 順位 | 台番号 | 機種名 | セグメント | 角番 | 期待残差 | n | セクション

```python
top50.columns = ["台番号","機種名","セグメント","角番","期待残差","n","セクション"]
print(top50.to_csv(sep="\t", index=True, index_label="順位"))
```

同一台が複数セグメントに出現する場合は mean_residual が最大のセグメントを採用し重複除去する。
