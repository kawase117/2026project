# Q5台が最強角番にいない場合はEDA CSVを mean_residual 降順ソートして次善角番を順次探索する

## 背景
2026-06-18: DD=18 の日次推薦生成で複数セグメント（2F_N, 3F_A, 2F_R, 3F_R）において
ターゲット角番にQ5台が存在しないケースが発生。

例: 2F_R のDD=18最強角番=20 → 角番20の台は「プリズムナナ」（非Q5）
Q5機種の最高kakuban は17（モンキーターンV、スマスロ北斗の拳）

## アクション

```python
# EDA CSV を DD でフィルタして mean_residual 降順ソート
dd_eda = eda[eda["dd"] == DD_TODAY].sort_values("mean_residual", ascending=False)

for _, row in dd_eda.iterrows():
    kk = int(row["kakuban"])
    hits = seg_base[(seg_base["kakuban"] == kk) & (seg_base["is_q5"])]
    if not hits.empty:
        # ここが次善候補（何位目かをカウントして表示）
        break
```

最低限 TOP5 まで探索し、見つからなければそのセグメントは「本日候補なし」とする。
同じ mean_residual 値（n が小さく EDA テーブルに同点がある場合）は全て表示する。

