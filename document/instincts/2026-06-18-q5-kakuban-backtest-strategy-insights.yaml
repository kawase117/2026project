# 2F_R の avg_diff=+1420 は12,300・11,200差枚の2件の爆発値に起因する — 信頼区間が極めて広い

## 背景
2026-06-18: 2F_R セグメント全69行（30台）の内訳を分析。

高額1回ヒット:
- 2311 戦国乙女4（1日のみ）: +12,300
- 2234 新鬼武者3（1日のみ）: +11,200

最も安定した台:
- 2346 いざ！番長（6日間 avg+3,533）
- 2257 スマスロ北斗の拳（6日間 avg+1,200）

75日間で出現日数が1日のみの台が34台中約半数を占める。

## アクション
2F_R の推薦台を評価する際は avg_diff より「出現日数（n）」を優先的に確認する。
出現日数 >= 3 かつ avg_diff > 0 の台を安定候補とみなす。
avg_diff=+1420 は報告値として正確だが、実運用上の期待値としては過大評価になる可能性がある。

