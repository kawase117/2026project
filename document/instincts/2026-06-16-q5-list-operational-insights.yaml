# 両ホール共通Q5機種は「機種スペック自体の強さ」が持続性の一因である可能性

## 背景
蒲田7（17機種）と蒲田1（16機種）のQ5を比較したところ13機種が共通だった。
`hall-specific-findings-never-transfer-to-other-halls` の原則上、
「Aホールの成績がBホールでも再現する」とは言えないが、
「機種のベーススペックや人気度が差枚持続性に寄与している」という
仮説はホール横断で成立しうる方法論レベルの話として区別できる。

## アクション
- 共通Q5機種を「機種スペック由来の強さ候補」、固有Q5機種を
  「ホール戦略由来の強さ候補」として仮説的に分類する
- 確定した法則ではなく仮説（confidence=0.78）。
  検証にはmachine_master_researchの公称スペックとの照合が必要
- ホール別の主張はホール別に行う（hall-specific原則は守る）
