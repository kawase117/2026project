# 少台数の高分散機種はpayout_rateが過大に見える可能性がある

## 背景
蒲田1Q5リストに「バジリスク絆2 天膳 BLACK EDITION」が108.45%・6台で登場。
AT高分散機種は大当たりが集中した期間だとpayout_rateが設定投入率を大きく超えて見える。
台数が少ないほど1〜2台の当たり期間で機種全体のpayout_rateが大きく変動する。

## アクション
- Q5リストで「台数 < 10 かつ payout_rate > 106%」の機種は
  「高分散のラッキー候補」と分類し信頼度を下げる
- n_datesが窓の全日数（約92日）に近いほど安定した実績
- 迷う場合は games_sum / n_machines（台あたり平均稼働）も確認する

