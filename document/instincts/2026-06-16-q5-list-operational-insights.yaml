# n_machines は「窓内にその機種名で稼働した台番号のユニーク数」であり、現在の設置台数ではない

## 背景
`kamata7_current_q5_list.py` および `kamata7_machinename_q5_backtest.py` の
`n_machines = machine_number.nunique()` は、集計窓内に
`games_normalized >= 1000` の記録があった台番号の種類数を返す。

窓の途中で機種が入れ替わった台番号は、入れ替え前の機種名と
入れ替え後の機種名の両方でカウントされる（重複計上）。

ただし `active=True`（最終登場が30日以内）でフィルタ済みの場合は
現在の設置台数に近い値になる。

## アクション
- 「モンキーターンV 66台」を「現在66台ある」ではなく
  「過去3ヶ月で66種類の台番号で稼働」と解釈する
- 現在台数を正確に知りたい場合は `last_date == max_date` 行のみの
  `machine_number.nunique()` で計算する
- active=True（30日以内）フィルタ後の値は実用上十分に現在台数に近い

## 例
```python
# 現在台数の正確な計算
current_n = df[df['date'] == max_date].groupby('machine_name')['machine_number'].nunique()
```

