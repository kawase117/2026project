# x_day系（4系・7系）はDD内での連続性が極めて高い

## 背景
lag_analysis('みとや', 'dd_group', lag=1) を実行したところ（2026-06-09）：
  4系: streak_rate=91.5%（前のx_day日がプラスなら次のx_day日も91.5%でプラス）
  7系: streak_rate=95.9%
  その他: streak_rate=32.2%（ほぼランダム）

注意：lag=1はDD内の連続観測（DD=4→DD=14→DD=24の順）を見るため
「翌日」ではなく「次の同系列日（約10日後）」の連続性を示す。

## アクション
「前回のx_day（4系）がプラスだった → 次の4系（10日後）も期待できる」
という運用判断の統計的根拠として使用できる。
その他系（非x_day）は連続性がなくランダムに近い。

## 例
```python
lag = lag_analysis('みとや', 'machine_name', lag=1, min_n=5)
# rebound_rate: 前日マイナス→翌日プラスの確率（リバウンド）
# streak_rate:  前日プラス→翌日プラスの確率（据え継続）
```

