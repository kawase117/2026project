# x_dayパターンがゼロ仮説でauto-explorerにより自動再発見された

## 背景
full_scan()をみとやに適用した結果、事前知識ゼロでDD=4,14,24がTier B、
DD=7,17,27がTier Cとして自動検出された。
これはinstinct記録済みの「x_day={4,7,14,17,24,27}」と完全一致。

DD別 avg_diff（みとや全機種、n>=10）:
  DD=4:  +280 Tier B  (x_day)
  DD=14: +234 Tier B  (x_day)
  DD=24: +213 Tier B  (x_day)
  DD=7:  +185 Tier C  (x_day)
  DD=27: +184 Tier C  (x_day)
  DD=17: +172 Tier C  (x_day)
  DD=30: +150 Tier C  (ウォッチ中・instinct既記録と一致)

## アクション
auto-explorerが既知パターンを再発見 = フレームワークの信頼性確認。
新規Tier B/Cパターンはドメイン知識と照合し、
既知パターンの再発見か真の新規発見かを判断する。

## 例
```python
# DD=30の深掘り（Tier C→Bへの昇格可能性確認）
scan_dimension('みとや', ['dd', 'date_digit'], filters={'dd': 30}, min_n=3)
```

