# 自動総当たり探索を先に実施し、その後に仮説検証する

## 背景
「何を探すか」が分からない段階では、全次元の総当たりスキャンで
「まだ知らないパターン」を先に発見する。
みとやのDD=30発見・末尾7がx_day限定という発見はいずれも事前仮説なしで得られた。
仮説検証は「発見後に仮説を立てて深掘り」という順序が正しい。

## アクション
1. full_scan(hall, max_dims=1) で全1次元をスキャン（高速・全体把握）
2. Tier A/B が出た次元を中心に max_dims=2 で2次元スキャン
3. 発見したパターンに対してフィルタを追加して仮説検証
4. Tier A パターンを export_tier_a_drafts() でinstinct候補化

## 例
```python
# Step 1: 全1次元スキャン
scan1d = full_scan('みとや', max_dims=1, min_n=10)
summary = summarize_scan(scan1d)  # Tier A/B のみ抽出

# Step 2: 有望次元を2次元に拡張
scan2d = full_scan('みとや', max_dims=2,
    dimensions=['dd_group', 'day_of_week', 'date_digit'])
```

