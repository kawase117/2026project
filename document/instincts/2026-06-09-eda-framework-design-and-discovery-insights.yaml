# 「その他系 × 月曜日」が複数ホールで共通のTier Bパターン（2026-06-09 自動発見）

## 背景
cross_hall_scan(['dd_group','day_of_week'], min_n=10) を実行したところ、
「その他系（非x_day）× 月曜日」が4ホールで Tier B として出現した。
事前に仮説なし・auto-explorerによる自動発見。

実績値（n>=10）：
  レイトギャップ: avg_diff=+607, plus_rate=50.9% (Tier B)
  ヒロキ:         avg_diff=+332, plus_rate=44.8% (Tier B)
  ザシティ:       avg_diff=+224, plus_rate=42.4% (Tier B)
  ARROW:          avg_diff=+134, plus_rate=46.7% (Tier B)
  みとや:         avg_diff=+277, plus_rate=41.5% (Tier C) ← x_day効果で埋もれている可能性
  楽園:           avg_diff=-50  (Tier C)
  金時:           avg_diff=-139 (Tier C)

## アクション
週明け月曜は客足を戻すため設定を上げる戦略をとるホールが複数存在する可能性。
検証：各ホールで「月曜かつ非x_day」の日に絞って機種別・セクション別に深掘りする。
注意：みとやはx_day効果が強いため月曜効果が見えにくい可能性がある。

## 例
```python
scan_dimension(
    'レイトギャップ',
    ['machine_name'],
    filters={'is_any_event': 0},
    min_n=5,
    df=df[df['day_of_week']=='月']
)
```

