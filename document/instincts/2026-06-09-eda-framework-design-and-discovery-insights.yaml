# EDA発見→instinct候補ドラフト→人間レビューのパイプライン

## 背景
instinctが散発的な状況に留まっている問題を解決するため、
auto-explorerとinstinct_generatorを連携させたパイプラインを実装した（2026-06-09）。

パイプライン：
  full_scan() → Tier A抽出 → export_tier_a_drafts() → YAMLドラフト → 人間レビュー → 正式採用

人間レビューが必須な理由：
- グローバルバイアスとの混同チェック（DD=19問題: spread大でも固有パターンなし）
- サンプル数の十分性確認
- ドメイン解釈の追記（「なぜこの日が強いか」）

## アクション
1. scan_dimension() or full_scan() でTier Aパターンを発見
2. export_tier_a_drafts() で document/instincts/ にYAMLドラフトを出力
3. 【要記入】部分（グローバルバイアスチェック・運用ルール）を人間が埋める
4. 正式なinstinctとして採用

## 例
```python
export_tier_a_drafts(
    scan_result = result,
    group_cols  = ['dd', 'day_of_week'],
    hall_name   = 'みとや',
)
# → document/instincts/2026-06-09-auto-draft-みとや-dd_day_of_week.yaml
```

