# Tier判定はホール全体のbaseline plus_rateに対する相対値で行う

## 背景
全機種集計データでの plus_rate は約38-39%（みとや実測）が基準値。
セクション特定分析用の絶対閾値（Tier A: plus_rate>=75%）を全機種データに
そのまま適用すると、全パターンがTier C/Avoid になり機能しない。

パチスロホールの構造上、全機種平均は：
- plus_rate: 37-45%（設定1-6混在のため半数以下がプラス）
- avg_diff: -100〜+300程度が正常範囲

## アクション
eda/core.py の _classify_tier() は baseline_plus_rate を自動計算して相対判定する。
セクション特定データ（機種フィルタ後など）では baseline_plus_rate が高くなるため
自動的に閾値も上がり、正しく機能する。

## 例
```
全機種データ: baseline_plus_rate=38.6%
  Tier A 条件: plus_rate >= 53.6% (baseline+15)
  Tier B 条件: plus_rate >= 43.6% (baseline+5)

ジャグラー限定（高設定多投入）: baseline_plus_rate=55%
  Tier A 条件: plus_rate >= 70%
  Tier B 条件: plus_rate >= 60%
```

