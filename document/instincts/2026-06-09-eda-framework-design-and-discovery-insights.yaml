# 現状のデータでは EDA が ML より有効

## 背景
蒲田七・みとやの両ホールでML予測を試みた結果、「現状の情報ではMLによる予測は困難だが
EDAは一定の効果がある」「MLで読み取れるのは粒度の粗い情報のみ」という結論に達した。
MLが苦手な理由：ホール側の意図的なランダム化、データ量不足、ノイズが多い。

## アクション
MLによる精度改善に時間を費やすより、EDAを「信じられないくらい広く・深く」実施し、
発見したパターンをinstinctとして蓄積することを優先する。
MLは発見したパターンの「統計的な実証」ツールとして位置づける。

## 例
```
EDAで発見 → instinct化 → walk-forwardで検証（ML）
「x_dayの末尾4が強い」→ Kruskal H検定で有意確認 → 運用ルール採用
```

