# EDAパターンの有意性は4指標で総合判断する

## 背景
「Tier Aだから有意」だけでは不十分。パチスロデータは正規分布しないため
ノンパラメトリック検定を使用し、4指標を組み合わせて判断する。

## アクション
| 指標 | 判断基準 | 役割 |
|------|---------|------|
| Kruskal-Wallis p値 | p < 0.10 | 次元全体の有意性 |
| epsilon_sq (ε²) | >0.02=小, >0.06=中, >0.14=大 | 実用的な差の大きさ |
| Bootstrap 95% CI | CIがゼロをまたがないか | 平均値の信頼性 |
| Spearman rho | 月間トレンドの方向性 | 安定性vs消滅傾向 |

グローバルバイアスチェック（必須）：
deviation = pattern_avg_diff - global_mean を計算し、
乖離が大きい場合のみ「固有パターン」として採用する（DD=19の教訓）。

## 例
```python
# scan_dimension() が自動計算（kruskal_H, p_value, epsilon_sq, ci_lo, ci_hi, spearman_rho）
result = scan_dimension('みとや', ['dd', 'date_digit'], min_n=5)

# グローバルバイアスチェックを追加
global_mean = load_hall_df('みとや')['diff'].mean()
result['deviation_from_global'] = result['avg_diff'] - global_mean
```
