# EDA ツールは Jupyter Notebook + 関数ライブラリが最適

## 背景
「毎回Claudeに頼むよりGUIツールを作ったほうが良いか」という問いに対し検討した結果、
Jupyter Notebook + 名前付きPython関数ライブラリが最適と結論。
理由：
- GUIは「もう一軸追加したい」という探索中の方向転換に弱い
- Notebook形式はデータ探索で最も広く使われている業界標準
- 関数ライブラリは引数を追加するだけで次元を拡張できる
- 一人ユーザー・探索目的ならGUIのメンテナンスコストが無駄

## アクション
新しい分析軸・フィルタが必要になったら eda/core.py の関数を拡張するだけ。
ダッシュボードへの統合は「運用フェーズ」（パターンが確定してから）に先送り。

## 例
```python
# GUI不要。関数呼び出しで自由に組み合わせ
scan_dimension('みとや', ['dd', 'date_digit'], filters={'is_x_day': 1}, min_n=5)
full_scan('みとや', max_dims=2, dimensions=['dd_group','machine_digit'])
cross_hall_scan(['dd_group', 'day_of_week'], min_n=10)
```

