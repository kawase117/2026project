# ホール固有パターンと共通パターンは等価値

## 背景
みとや固有のパターン（x_day末尾4が強い）と他ホールで確認できないパターンを
「矛盾」として扱うのは誤り。
各ホールは独自の設定投入戦略を持つ（CLAUDE.mdの実証済み事実）。
ホール固有パターンはそのホールを攻略するための固有知識として価値がある。

## アクション
cross_hall_scan()の出力で universality='hall_specific' のパターンも積極的に採用する。
universality='universal' はより広く適用できる汎用ルールとして別途管理する。
「矛盾」という語は使わず「ホール固有のクセ」として記録する。

## 例
```
みとや: x_day × 末尾4 → +469（ホール固有）→ みとや運用ルールに採用
蒲田7:  x_day × 末尾4 → +50（有意でない）→ 蒲田7では異なるパターンを探す
→ 矛盾ではなくホール戦略の違い
```

