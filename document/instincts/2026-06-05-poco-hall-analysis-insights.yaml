# PATCH_FOUND は PARTIAL ステータスを持てない：複合機種は別途 PARTIAL で登録

## 背景
`rebuild_poco_pipeline.py` の `PATCH_FOUND` ディクショナリは、ループで全エントリーを
`('FOUND', db_match)` として登録する。`norm_one()` の FOUND ハンドラは
`return [db_match]` と単一要素リストを返すため、パイプ区切り文字列
（例: `'キングハナハナ-30|バジリスク天膳'`）は1つの機種名として扱われ未マップになる。
`PARTIAL` ステータスのみが `split('|')` による複数機種展開を行う。

## アクション
複数機種に展開が必要な複合戦略機種は `PATCH_FOUND` に書かず、
`PATCH_FOUND` / `PATCH_DELETE` ループの後に直接 PARTIAL で登録する。

```python
# 複合戦略機種: PARTIAL ステータスでパイプ区切りを2機種に展開
mapping['ハナハナ天膳'] = ('PARTIAL', 'キングハナハナ-30|バジリスク～甲賀忍法帖～絆2 天膳 BLACK EDITION')
```

## 例
`ハナハナ天膳` は「ハナハナ全台 + 天膳全台」の複合発表。
修正後: `['キングハナハナ-30', 'バジリスク～甲賀忍法帖～絆2 天膳 BLACK EDITION']` に展開される。

