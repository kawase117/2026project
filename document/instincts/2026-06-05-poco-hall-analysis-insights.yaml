# DD別パフォーマンス：27日最強・10日最弱・25日（給料日）は期待外れ

## 背景
K7 発表日（2025/7/12〜2026/5/31）のDD別avg差枚実測値。

高DD（avg>+3,000）: 27日(+3,665)・13日(+3,465)・31日(+3,458)・3日(+3,353)・7日(+3,240)
低DD（avg<+2,400）: 10日(+2,084)・29日(+2,163)・20日(+2,342)・25日(+2,462)

25日（給料日）は意外にも低パフォーマンス。
27日・31日・3日・13日がイベント日フラグ有無に関わらず安定して高い。

## アクション
- MLモデルに `dd_score`（DD別avg差枚の歴史的期待値）を特徴量として追加を検討
- 「給料日=高設定日」という先入観を捨て、実データに基づく DD スコアを使用する

## 例
単純なイベント日フラグより、DD別の実績スコアの方が予測精度が高い可能性がある。

