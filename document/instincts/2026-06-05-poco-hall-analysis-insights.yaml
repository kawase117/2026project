# K7: イベント日×火・木・日曜日に発表機種数が爆発（通常日の2.5〜3倍）

## 背景
K7の発表機種数「曜日×イベント日フラグ」クロス集計：

| | 月 | 火 | 水 | 木 | 金 | 土 | 日 |
|--|--|--|--|--|--|--|--|
| 通常日 | 2.37 | 1.69 | 1.91 | 2.29 | 1.68 | 1.79 | 1.84 |
| イベント日 | 2.42 | **5.08** | 2.50 | **4.58** | 2.15 | 2.57 | **4.33** |

土日の発表日実績: avg+3,078 / 勝率78.1%（平日: +2,798 / 71.6%）
K1は逆に土日集中型（平日発表率63〜70%、土日89%）。

## アクション
- `is_event_day × weekday` の交差特徴量をMLモデルに追加することを検討
- 特に「イベント日 × 火/木/日」は最大の発表量と高い設定期待値の組み合わせ

## 例
```python
df['is_event_weekday_peak'] = (
    (df['is_event_day'] == 1) &
    (df['weekday_jp'].isin(['火', '木', '日']))
).astype(int)
```
