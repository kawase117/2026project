# ぽこ発表シグナルは圧倒的に有効：発表日+2898 vs 非発表日+95

## 背景
2025/7/12〜2026/5/31 K7全期間における発表日 vs 非発表日の実測値。
「発表日」= その日の poco full_half_normalized に機種名が記載されている台日。

| 区分 | 台日数 | avg差枚 | 勝率 |
|------|--------|--------|------|
| 発表日 | 6,902 | +2,898 | 73.9% |
| 非発表日 | 223,328 | +95 | 39.4% |

月別では全期間一貫して有効（最低月 2026/3 でも Δ+2,090）。

## アクション
ぽこ発表日をMLの正例ラベル・特徴量として積極的に活用してよい。
マグレ排除の三重条件: avg_G>=4000 かつ 勝率>=60% かつ 台/日>=2。

## 例
発表されても全敗するケースがある（例: 2026/5 ミリオンゴッド avg-1,552・勝率12%）。
発表回数だけで判断せず実績との照合を必ず行うこと。

