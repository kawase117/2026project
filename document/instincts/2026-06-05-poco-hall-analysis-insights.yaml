# K7とK1の結果は必ず別々に出力する（統合禁止）

## 背景
蒲田七（K7）と蒲田一（K1）は戦略・規模・データ品質が根本的に異なる：
- 規模: K7 月平均69.7機種発表 vs K1 44.9機種（K7の約65%）
- K7: アニメ系スマスロを幅広く・平日も機種名明示
- K1: 戦国乙女4・カバネリ海門などに集中・平日は機種全が「不明」多数
- 同一機種でもK7とK1で実績が真逆になるケースがある
  （例: 2026/5 東京リベンジャーズ → K7: +3,104 vs K1: -1,280）

## アクション
ぽこデータ関連の全ての分析・出力でK7とK1を分離する。統合した数値は禁止。

```python
# 正しいターゲット分離
poco_k7 = {}  # date -> set(機種名) for K7のみ
poco_k1 = {}  # date -> set(機種名) for K1のみ
for _, row in df.iterrows():
    date = str(row['date'])
    for poco_dict, col in [(poco_k7, 'kamata7_full_half_normalized'),
                            (poco_k1, 'kamata1_full_half_normalized')]:
        machines = set()
        if pd.notna(row[col]) and str(row[col]).strip():
            for m in str(row[col]).split('、'):
                m = m.strip()
                if m:
                    machines.add(m)
        poco_dict[date] = machines
```

## 例
K7実績はK7のDBを、K1実績はK1のDBを、それぞれのターゲット辞書と照合する。
出力時も「K7（蒲田七）」「K1（蒲田一）」のセクションを必ず分けて表示する。

