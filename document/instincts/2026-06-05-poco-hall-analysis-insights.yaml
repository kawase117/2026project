# K1 平日の「機種全=不明」はデータ欠損ではなく情報非公開

## 背景
K1の平日で `kamata1_full_half_normalized` が空になる日が多い原因：
- 曜日別「機種全=不明」日数: 火8日・水9日・金9日 vs 土0日・日1日（/47日）
- K1も毎日「配置戦略 + 機種全」を実施しているが、
  平日の機種全部分の機種名が把握できていないケースが多い。
- K7は同条件で不明が1〜3日のみ（ほぼ全日機種名が判明）。

## アクション
- K1平日データは「配置戦略（位置情報）」は使えるが「機種名」は欠損扱いが安全
- K1の機種別分析は土日中心で行うと精度が高い
- 「発表なし」ではなく「不明」であることを区別して扱う

## 例
```
水曜日→末尾→ジャグラー末尾6、その他機種末尾7、全→不明
  ↑配置戦略は記録済                              ↑機種名は不明
```

