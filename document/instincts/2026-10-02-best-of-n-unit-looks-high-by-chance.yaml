# 毎日の最良台を選ぶと、高設定が無くても「1台は高設定らしい」が毎日成立する

## Core claim
n台の中から毎日いちばん良い台を選ぶと、高設定が1台も入っていなくても、設定5以上の確率が50%超の台が1台以上ある日が約9割になる。「毎日1台は高設定らしく見える」は、一日一台の入れ方の証拠にならない。判別するには、H1(毎日ちょうど1台が高設定)とH0(高設定なし)のベイズ係数と、合算RBの期待差(÷標準偏差)で比べる。

## Evidence
- n_observations: 1(楽園蒲田 ディスクアップ ULTRAREMIX 8台、直近14日 9/17〜9/30、97台日)
- data scope: 楽園蒲田のディスクアップ(設定1・2・5・6の4段階機、RB 1/495・1/477・1/399・1/334)
- metric scope: rb_probability
- result summary:
  - 設定5以上の確率が50%超の台が1台以上ある日は、観測86%に対し、高設定なし(設定1・2のみ)のシミュレーションで平均91%(97.5%点100%)
  - ベイズ係数(H1/H0)は 設定5・6等確率0.44、設定5のみ0.86、設定6のみ0.12。以前の47日は0.0004で、この期間は強く否定される水準だった
  - 合算RB792回は、高設定なし787回・毎日1台が設定5で811回・設定6で837回(標準偏差約28)の中間。期待差が標準偏差の約1倍しかなく、14日では見分けられない

## Interpretation
- 4段階機でRB差が小さいため、RBだけで1日1台を判定する力が元々弱い
- 目立つ日(9/28 係数3.64、9/26 1.83)はあるが、8台から最良を選んだ偶然を超える確証にならない
- 全機種の高設定割合の推定(EM+日クラスタ・ブートストラップ90%区間)で、区間の下限が0超だったのは キングハナハナ-30 28%・ネオアイムEX 12%のみ。他は区間が0〜40%台で判別不能

## Action
- 「毎日1台は高設定」「最良台が○%」と書く前に、高設定なしの帰無シミュレーションで同じ日の割合を出し、観測と並べる
- 仮説間の期待差が標準偏差の1倍程度なら「見分けられない」と書き、成立・棄却のどちらにも倒さない
- 前向き検証は、判定基準(区間の下限が0超かつ翌月も再現)を台帳に先に登録してから行う

