# 差枚の絶対値ではなく、G数で正規化した「個別機械割」で評価すべき

## 背景
6/7の予測検証で、当初「差枚の絶対値」で予測TOP群の優劣を判断していたが、
ユーザーから「個別の差枚と回転数（G数）から機械割を算出し、104%を超えている台が
何台あるか見てください」という訂正を受けた。

差枚の絶対値は回転数（G数）に強く依存する（同じ設定でも7000G回した台と500Gしか
回らなかった台では絶対値の意味が全く異なる）。機械割（= 100 + 差枚/(G数×3)×100、
3枚がけ前提の概算式）でG数を正規化することで、初めて「設定の良し悪し」に近い
比較可能な指標になる。

実際に正規化前後で評価結果が変わった：
```
予測TOP50（差枚絶対値ベースの平均）: 母集団平均と大差なし、判断材料として弱い
予測TOP50（個別機械割>=104%の台数比率）: 38.0% (19/50) vs 母集団28.9% (77/266)
  → 9.1ポイントの差。グループとしての優位性が見える
```

正規化することで、絶対値では埋もれていた「グループとしての選別力」のシグナルが
顕在化した。

## アクション
個別台の良し悪しを比較する際は、必ずG数で正規化した指標を使う：

```python
df['kikaiwari'] = 100 + (df['diff_coins_normalized'] / (df['games_normalized'] * 3)) * 100
# 3枚がけ前提の概算式。設定4は理論上104%前後とされる目安。

# グループ間で「機械割>=104%の台数比率」を比較する
group_rate = (group_df['kikaiwari'] >= 104).mean()
population_rate = (df['kikaiwari'] >= 104).mean()
```

注意: この機械割は「3枚がけ」を前提とした概算値であり、実際の正確な機械割
（理論配当表ベース）とは異なる近似値である。傾向比較の目的には十分使えるが、
絶対値そのものを厳密な指標として扱わないこと。

## 例
```
台608 化物語: G数=2500, 差枚=+18412 → 機械割推定 約 345%（極端な大勝ち）
台631 ビッグドリーム: G数=4043, 差枚=+741 → 機械割推定 約 106%（堅実なプラス）

差枚の絶対値だけ見ると「台608が圧倒的に優秀」に見えるが、
機械割で見ると両方とも「100%超のプラス収支」という同じカテゴリに属する。
絶対値は「その日どれだけ稼いだか」、機械割は「設定の良さに近い指標」という
役割の違いを区別して使う。
```

