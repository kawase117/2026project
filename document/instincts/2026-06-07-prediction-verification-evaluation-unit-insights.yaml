# n=50程度の小集団の集計指標は、たった1台の大当たりで支配される

## 背景
東京喰種を除外して再ランクした予測TOP50を検証した際、「合計差枚 +23,832枚、
集計機械割 104.87%」という一見好調な結果が出た。しかし内訳を調べると：

```
TOP50合計差枚 +23,832枚のうち、台608(化物語) 一台で +18,412枚（全体の77.3%）
この1台を除いた残り49台の集計機械割: 101.13%（104%を大きく下回る）
```

つまり「グループとして機械割104%を達成した」という評価のほぼ全てが、
たった1台の極端な大当たり（ギャンブル変動の産物）によって作られていた。
n=50程度の小さな集団では、合計値・平均値ベースの集計指標は外れ値1台の影響を
強く受けてしまい、「モデルがグループとして高設定を選別できたか」という
本来見たい構造的シグナルを覆い隠してしまう。

これは [[individual-rank-precision-is-wrong-metric-for-gambling-variance]] と
表裏一体の問題：個別の絶対値による評価から逃れようとして集計値に頼っても、
集団が小さいうちは結局1台の変動に支配されてしまう。

## アクション
小集団（n<100程度）の集計指標を見る際は、必ず以下を確認する：

1. 合計値・平均値を見る前に、寄与度の分布（上位数台が何%を占めるか）を確認する
   ```python
   top_contributors = group_df.nlargest(5, 'diff_coins_normalized')
   contribution_pct = top_contributors['diff_coins_normalized'].sum() / group_df['diff_coins_normalized'].sum()
   if contribution_pct > 0.5:
       print("少数の外れ値が合計を支配している → 集計値は信頼できない")
   ```
2. 合計・平均ではなく「閾値を超えた台の割合」（カウントベースの指標）を優先する
   - カウントベースの指標は外れ値1台の影響を受けにくい
   - 例: 「機械割>=104%の台数比率」は、1台が桁外れの値でも「1台」としてしか
     カウントされないため頑健
3. 外れ値を含む場合と除いた場合の両方を提示し、結論の頑健性を確認する

## 例
```python
# NG: 合計値だけを見て「グループ全体が好調だった」と結論づける
print(f"TOP50合計差枚: {top50['diff_coins_normalized'].sum()}")  # +23832 → 良さそうに見える

# OK: 寄与度分布を確認してから判断する
sorted_diffs = top50['diff_coins_normalized'].sort_values(ascending=False)
top1_contribution = sorted_diffs.iloc[0] / sorted_diffs.sum()
print(f"最大の1台が全体の{top1_contribution:.1%}を占める")  # 77.3% → 集計値は信頼できない
print(f"その1台を除いた集計: {sorted_diffs.iloc[1:].sum()}")  # +5420（印象が大きく変わる）
```
