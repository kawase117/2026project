# 「予測順位が実績順位と一致したか」（hit@k）でMLモデルの良し悪しを判断するのは誤り

## 背景
6/7予測の検証で「予測TOP10のうち実際にTOP10に入ったのは何台か」(hit@k)を主指標として
報告したところ、ユーザーから明確な訂正を受けた：

「同じ設定6であっても、運によって2000枚出るのか、5000枚出るのかは分かりません。
そこは予測できる範囲ではないのでTOPで個別台予測性能を測るのは間違いです。」

これはCLAUDE.mdの基本理念1「ギャンブルの不確実性 — 単一試行の結果ではなく統計的な
傾向を予測」と完全に整合する指摘である。パチスロは同一設定でも日々の差枚に大きな
分散があるため、「モデルが予測した1位の台が実際に1位になったか」という個別順位の
完全一致を求める評価は、原理的に達成不可能な基準で評価していることになる
（モデルの実力ではなく純粋なギャンブル変動を測ってしまう）。

## アクション
日次予測の精度を評価する際は、個別順位の的中（hit@k）を主指標にしない。
代わりに以下のような「グループ単位・正規化済み指標」を使う：

1. 予測上位群 vs 母集団全体の集計指標を比較する
   （[[kikaiwari-normalized-by-games-is-correct-evaluation-unit]] 参照）
2. 多数の検証日を蓄積し、グループ単位の優位性が継続的に観測されるかを見る
3. 個別順位の一致は「参考情報」程度に留め、主要な合否判定には使わない

## 例
```python
# NG: 個別順位の完全一致を主指標にする → ギャンブル変動を測ってしまう
hit_at_3 = len(pred_top3 & actual_top3) / 3  # これだけで「当たった/外れた」と判断しない

# OK: グループ単位の正規化済み指標で「傾向として優位だったか」を見る
pred_top50_kikaiwari_rate = (top50['kikaiwari'] >= 104).mean()
population_kikaiwari_rate = (df['kikaiwari'] >= 104).mean()
# → 38.0% vs 28.9% のような「グループとしての優位性」を蓄積・追跡する
```

