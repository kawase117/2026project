# 並び予測のSpearmanシグナル設計（X2/X3/X4/X5）

## 背景
n≈25という小サンプルでSpearman検証を行う。有意閾値は|r|>0.37かつp<0.1（n=25での保守的設定）。
4シグナルのうち、実際に有効だったのはX2のみ（X3/X4は一度も有効にならず）。

## アクション
- X2: DD mod 10 vs 各digit binary（10本計算）
- X3: 前週first_digit vs 今週first_digit（複数digitは1st digitを代表値）
- X4: (前週first_digit + offset) % 10 vs 今週first_digit（offset 0〜9を全探索）
- X5-inv: 直近4週の出現頻度 → 低頻度digitを優先（枯渇仮説）
- X5-mom: 直近4週の出現頻度 → 高頻度digitを優先（モメンタム仮説）
- X5-invとX5-momは同時発火を許容（加算式）
- タイブレークは (4 - recent_freq[d]) * 0.01 で未出現digit寄りがデフォルト

## 例
# タイブレーク符号の注意
scores[d] += (4 - target_row.recent_freq[d]) * 0.01  # 未出現優先（正しい）
scores[d] += target_row.recent_freq[d] * 0.01        # 出現優先（逆）← 混同しやすい

