# 並び起点予測はホールの意図的ランダム化により構造的に困難

## 背景
walk-forward評価結果:
- K1: hit@3=27.8% vs baseline=45.6%（ベースライン大幅下回り）
- K7: hit@3=53.3% vs baseline=56.2%（ほぼベースライン水準）
有効シグナルはX2（DD相関）のみで不安定。X3/X4（ローテーション）は全期間で有意にならなかった。

主因はデータ量不足ではなくホール側の意図的ランダム化。
「客に高設定台を特定させないため意図的にランダム配置」という設計原則がある。

## アクション
- 弱い相関（r≈0.2〜0.3）が存在する可能性はあるが、検出にはn≈100以上が必要（現ペースで約2年）
- 予測モデルより「K7でdigit確認→K1で運用」という実地確認戦略の方が実戦価値が高い
- K7とK1で同日に同じdigitが出る共通パターンが観測されており、これを利用した確認フローが有望

## 例
# 共通パターン観測例（同日同digit）
# K1 20250712 DD=12 digits=6  / K7 20250712 DD=12 digits=6
# K1 20250816 DD=16 digits=3,8 / K7 20250816 DD=16 digits=3,8
# → K7開店後にdigit確認→K1に同じdigitで投資という運用フローが現実的

