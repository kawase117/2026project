# X5-momの全期間Spearmanは直近の連続パターンを希釈する

## 背景
K1 2026年以降でdigit5が5〜6週連続出現したが、X5-momは一度も発火しなかった。
原因: 全期間通算Spearman(recent_freq[5], hit[5])では、序盤（2025年）にdigit5が少なく
全体相関が閾値を超えられない。直近の「streak」を全期間統計が打ち消す。

## アクション
- 将来的な改善案: 直近Nヶ月のみのSpearmanに切り替える（ただし過学習リスクあり）
- 現状では「全期間Spearman」の制約として受け入れ、結果解釈時に注意する
- X5-momが発火しない期間の予測はほぼX2+タイブレーク依存になることを認識しておく

## 例
# 2026年K1の見逃しパターン
# actual: [1,5], [2], [3], [5], [0,5], [1,5], [5]  ← digit5が支配的
# pred:   [4,9,8] 固定  ← X5-momが全期間Spearmanでは発火せず
# 直近6週だけでSpearmanを計算すればr≈0.6以上になる可能性がある
