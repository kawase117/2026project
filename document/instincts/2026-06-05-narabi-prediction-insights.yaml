# 並び予測ターゲットは「起点digit TOP3ランキング」に絞る

## 背景
ぽこデータには並び仕掛けの起点末尾（0〜9）が約96%の日付で明示されている（土曜日・並び限定）。
「並びが来るか否か」（バイナリ）より「どの末尾が起点か」（多クラス）の予測が実戦価値が高い。
発表に複数digitが含まれる場合（例: 3,8）は全て正解として扱う。

## アクション
- 予測対象: 土曜日の並び起点digit（0〜9）TOP3ランキング
- K1・K7は独立して処理（同じデータ量・同期間だが共通パターンを別途検証）
- 評価指標: hit@3（メイン）+ MRR（補助）
- ベースラインは実際のactual_digits件数を反映した確率的基準（固定30%ではない）

## 例
strategy_digits="3,8|2" → actual_digits=[3,8] → TOP3に3か8が含まれればHIT
K1 n=28件、K7 n=25件（2025-07〜2026-05）

