# 3FはAUC大幅改善、2Fはflat（rich_all適用時）

## 背景

rich_all（130+特徴量）を適用したときのセグメント別AUC変化：

- 2F: 0.5857 → 0.5845（-0.001、実質ゼロ）
- 3F: 0.5809 → 0.6520（+0.071、大幅改善）

2Fには特徴量追加が効かず、3Fには有効な特徴量が存在することを示している。
2Fと3Fでホールの設定投入ロジックが異なる可能性を示唆する。

## アクション

rich_all評価後は必ずセグメント別AUCを確認すること。
セグメント間でAUC改善幅が大きく異なる場合：
1. 改善したセグメント（3F）の feature_importance 上位15を調査
2. そのセグメント専用のfeature subsetを構築して hit@1 も確認
3. 改善しないセグメント（2F）は別のアプローチ（target再定義など）を検討

## 例

```
3F: rich_all AUC 0.652 → top特徴量を絞った専用セット構築へ
2F: rich_all 効果なし → target を is_top3 → win_rate threshold（絶対基準）へ変更を検討
```

