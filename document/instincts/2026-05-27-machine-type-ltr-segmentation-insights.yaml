# days_since_last_rank1（設定サイクル仮説）は蒲田7で否定された

## 背景

「ホールが定期的に特定機種に設定を入れる → days_since_last_rank1 が予測に有効」
という仮説を rich_all feature importance で検証した結果：

- days_since_last_rank1:  2F=130位、3F=85位
- days_since_last_top3:   2F=120位、3F=56位
- rank_trend_1m_vs_2m:    2F=104位、3F=132位
- same_weekday_rank1_rate: 2F=103位、3F=102位

いずれも下位であり、設定投入サイクルは蒲田7では検出不能と判断する。

## アクション

蒲田7において：
- days_since_last_rank1 系の特徴量を重視しない
- 「何日ぶりに設定が入る」というサイクルパターンは存在しないか、
  少なくともこのモデルでは捉えられない
- 他ホールでは異なる可能性があるため、新ホール分析時は改めて確認

## 例

```
仮説: 「前回top1から14日経った機種は次の高設定候補」
実測: feature importance 130位 → 無関係
結論: 蒲田7の設定投入はサイクル的ではなく、直前の成績トレンドで予測する方が有効
```

