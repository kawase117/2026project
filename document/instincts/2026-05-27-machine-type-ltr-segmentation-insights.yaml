# 4分割（2F_A/2F_N/3F_A/3F_N）→ 2分割（2F/3F）でlift@1が大幅改善

## 背景

機種別ML v2 では当初 floor × atype の4セグメントを使用していた。
2F_A の機種数が少ない（≈10台）ためbase_rateが高止まりし学習が不安定だった。
フロア二分割（2F / 3F）に変更して各セグメントの機種数を増やした結果：

- 2F lift@1: 1.12 → 1.67（大幅改善）
- 3F lift@1: 1.47 → 1.53（安定維持）
- combined hit@1: 0.1667 → 0.1889、AUC: 0.578 → 0.584（90日評価）

## アクション

機種別MLセグメント設計では、A型/非A型の軸はセグメント内機種数が十分な場合のみ有効。
機種数が不足する場合はフロアのみ（2F / 3F）で2分割する。

判断基準：
- セグメント内ユニーク機種数 < 15 → 分割を粗くする（2分割に戻す）
- セグメント内ユニーク機種数 ≥ 15 → 4分割を維持してよい

## 例

```python
# Before: 4分割
SEGMENT_KEYS = ("2F_A", "2F_N", "3F_A", "3F_N")
work["segment_key"] = work["segment_floor2"] + "_" + work["segment_type2"]

# After: 2分割（機種数不足対策）
SEGMENT_KEYS = ("2F", "3F")
work["segment_key"] = work["segment_floor2"]
```

