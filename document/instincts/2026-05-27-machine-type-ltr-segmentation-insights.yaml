# 特徴量過多でAUCとhit@1が逆方向に動く

## 背景

baseline6（6特徴量）→ rich_all（130+特徴量）に変更した結果：

- combined AUC: 0.584 → 0.615（+0.031）✓
- combined hit@1: 0.189 → 0.122（-0.067）✗
- combined lift@1: 1.885 → 1.316（-0.569）✗

AUCは「全体的な順序付け精度」を測るため多くの特徴量で改善しやすい。
一方 hit@1 は「rank1の台が実際にtop3か」という点精度であり、
多数の弱いシグナルがrank1の確信度を希薄化させ悪化する。

## アクション

XGBRankerで特徴量を追加する際は AUC だけでなく hit@1 を必ず同時に確認する。
AUC改善 + hit@1悪化 は「過剰特徴量による rank1 確信度の希薄化」のサインであり、
次のアクションは rich_all から重要特徴量を絞った中間セットを構築すること。

段階：
1. rich_all の feature_importance 上位10-15を抽出
2. そのサブセットで再評価（AUCとhit@1が共に改善するか確認）
3. 改善しない場合は baseline6 に戻り、問題設定の再定義を検討

## 例

```
feature_count:    6    →  130+   →  目標: 10-15（sweet spot）
AUC:          0.584   →  0.615  →  0.615 維持したい
hit@1:        0.189   →  0.122  →  0.189 以上に戻したい
```

