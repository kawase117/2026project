# 機種MLは末尾MLの補助フィルターとして使うのが現実的

## 背景

蒲田7での比較（2026-05-27時点、LTR 2分割 90日評価）：

- 末尾ML hit@1→top2: 95.3%（144日、10択）
- 機種ML hit@1→top3: 18.9%（90日、30択）

性能差の理由：
1. 末尾ML は 10択、機種ML は 30択（問題の難易度が3倍）
2. 末尾番号はホールの意図的な投入シグナルとして強く機能する
3. 機種別成績はノイズ（設定以外の要因）が多い

現実的な到達目標は hit@1 30-40%、AUC 0.62-0.65 程度。
末尾MLの水準（95%+）は問題の難易度差から構造的に届かない。

## アクション

機種MLは単独の意思決定ツールではなく、末尾MLとの組み合わせで使う：
「末尾MLで末尾X推奨」かつ「機種MLで3F推奨」→ 3FのX末尾台に集中

また機種MLの改善を判断する際は AUC だけでなく hit@1 も確認し、
「hit@1 が lift 1.5x 以上を維持しているか」を実用水準の基準とする。

## 例

```
単独意思決定:
  末尾ML: ✅ 95%+ で活用可能
  機種ML: △ lift 1.88x → 補助情報として活用

組み合わせ戦略:
  末尾ML（末尾7推奨） × 機種ML（3F推奨）
  → "3Fフロアの末尾7の台" に絞り込む
```

