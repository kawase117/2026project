# アウトカムリークはターゲットリークと別物で見逃されやすい

## 背景
古典的なリーク確認はターゲットリーク（is_top_2 を特徴量に使う）を防ぐもの。
今回のリークは「ターゲットそのものではないが、同日実績由来でターゲットと高相関な列」。

- ターゲットリーク：is_top_2, is_rank_1 など → 除外リストで対処済み
- アウトカムリーク：total_diff_coins_focus (r=+0.643 with is_top_2) → 除外リストに入っていなかった

アウトカムリークの特徴：
- 列名がlag特徴量と区別しにくい（_focus サフィックス等）
- 除外リストに載っていないため自動的に特徴量として採用される
- 単独でhit@2=100%を達成できる（モデルは実質「正解を見てから回答」）

## アクション
SAME_DAY_LEAK_COLS はターゲットリークとアウトカムリーク両方を含める：

```python
SAME_DAY_LEAK_COLS = {
    # ターゲットリーク
    "is_top_2", "is_rank_1", "is_top_3", "is_worst_1", "is_worst_3",
    # アウトカムリーク（同日実績由来）
    "avg_diff_coins", "total_diff_coins", "total_diff_coins_focus",
    "win_rate", "efficiency", "efficiency_focus", "diff_coins_normalized",
}
```
新しい集計列を追加するときは「この列は翌日予測時点で既知か？」を必ず確認する。

