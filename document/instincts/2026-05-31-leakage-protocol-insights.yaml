# リーク確認は「除外リスト」ではなく「混入リスト全追跡」で行う

## 背景
total_diff_coins_focus のリークを複数回の確認依頼にもかかわらず見逃した。
原因は「除外リストに target 列が含まれているか」をチェックしていたこと。
しかし本当に必要なのは「get_numeric_features() が返す全列の生成元を追跡すること」。

間違ったチェック方向：
- excluded_targets を確認して「target列は除外済み」と判断 → 不十分

正しいチェック方向：
- get_numeric_features() の全出力列をリストアップし
- 各列の生成元コードを追跡して「同日実績か過去集計か」を分類する

## アクション
リーク確認を求められたら以下を実行する（コードレビューだけで完結させない）：

1. get_numeric_features(df_expert) の実際の出力列を列挙
2. 各列について生成元コード（add_simple_features, aggregate_mode等）を追跡
3. 同日実績由来の疑いがある列をリストアップ
4. 疑わしい列は単独 hit@2 を実測（1.0に近ければリーク確定）
5. SAME_DAY_LEAK_COLS に追加して再評価

## 例
```python
# 疑わしい列の単独 hit@2 計算
single_feature_hits = []
for col in df_expert.columns:
    if col in excluded_targets:
        continue
    tmp = df_expert.groupby("date").apply(
        lambda g: g.nlargest(2, col)["is_top_2"].sum() >= 1
    )
    single_feature_hits.append({"col": col, "hit@2": tmp.mean()})
# hit@2 が 0.9 以上の列はリーク候補
```

