# 同日実績列の命名規則がlag特徴量と区別できないとリークを招く

## 背景
total_diff_coins_focus の _focus サフィックスは「絞り込み対象の集計値」に見えるが、
実際は「当日のセグメント内合計差枚」という同日実績列だった。
命名だけで同日実績かどうかを判断するのは困難だった。

## アクション
列作成時のルール：
- 同日実績列には _actual サフィックスを付ける（例: total_diff_coins_actual）
- lag特徴量には _lag1, _roll7 等の明示的サフィックスを付ける
- _focus のような曖昧なサフィックスは避ける

既存の曖昧命名への対処：
- total_diff_coins_focus → SAME_DAY_LEAK_COLS に追加済み
- 新列追加時は「翌日予測時点で既知か？」をコメントに必ず記載する

## 例
```python
# NG: 曖昧（lag か実績か不明）
out["total_diff_coins_focus"] = ...

# OK: 明示的
out["total_diff_coins_actual"]     = ...  # 同日実績 → SAME_DAY_LEAK_COLS必須
out["total_diff_coins_lag1"]       = ...  # 前日実績 → 特徴量として使用可
out["total_diff_coins_roll7_lag1"] = ...  # 7日ローリング前日まで → 使用可
```

