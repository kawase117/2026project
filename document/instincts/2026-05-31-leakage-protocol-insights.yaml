# リーク確認はコードレビューではなく計測で完結させる

## 背景
total_diff_coins_focus のリークはコードレビューで複数回見逃された。
発見のきっかけは「単独特徴量で hit@2 を計算する」という経験的テストだった。

コードレビューが失敗する理由：
- 列名が lag 特徴量と区別しにくい
- generate 元のコードを全追跡するには認知負荷が高い
- 複数ファイルにまたがると見落としが発生しやすい

経験的テストは確実：
- total_diff_coins_focus 単独 hit@2 = 100.0%（327日全勝）
- この計測だけでリーク確定、コードレビューは補助に過ぎない

## アクション
リーク確認の標準手順として以下を追加する：

コードレビュー → 補助的確認
経験的テスト  → 主要確認（こちらが正）

経験的テストのチェックリスト：
□ ナイーブ基準（固定Top2）の hit@2 を計算（ランダム基準確認）
□ 全特徴量の Spearman rho（日内ランク相関）を計算
□ 疑わしい列の単独 hit@2 を計算（0.9超でリーク確定）
□ 修正後に hit@2 がランダム基準まで低下することを確認

