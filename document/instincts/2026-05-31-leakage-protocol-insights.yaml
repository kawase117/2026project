# 「DBリークなし」は確認ではなく間接推論である

## 背景
リーク修正後に hit@2 がランダム基準まで低下したことから
「database/ の DB 生成過程にリークはない」と結論された。

しかしこれは間接推論であり、DB生成コードを直接検証したわけではない：
- 特徴量除外を修正 → hit@2 = 38% に低下（期待通り）
- ∴ DB生成にはリークがない　← これは推論

precision@2 = 20.83%（ランダム20%との差0.83pp）では、
DB生成側に微小なリークが残っていても統計的に検出できない可能性がある。

## アクション
DB生成リークを直接確認する場合は：
1. database/data_inserter.py, summary_calculator.py で当日データを使っている箇所を確認
2. aggregate_mode が作成する全列の定義を追跡
3. 当日入力データから当日実績列を作成している処理がないか確認

「DB側リークなし」は現時点では間接推論に留まることを記憶する。
hit@2 がランダムを有意に超えるようになったとき、改めて直接確認の価値がある。

