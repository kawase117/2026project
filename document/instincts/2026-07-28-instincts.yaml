# 選出したtop-N台が当日データに欠落した日、平均の分母をこっそり縮めるとアウトライヤーに引きずられて過大評価する

## 背景
2026-07-29、Codexへの独立監査依頼(codex:rescueではなく直接コピペ依頼)で
発覚。k7_at_histdiff_top3のedge検証で、私の即席walk-forwardスクリプトは
`sel = day[day.machine_number.isin(top)]` として当日のgames_normalized>=1000
プールと突き合わせていたが、historyで選ばれたtop3のうち当日1000G未満
だった台は`sel`から黙って落ち、`sel.diff_coins_normalized.mean()`の
分母が3から2に縮んでいた。269日中109日(40%)でこれが発生しており、
「たまたま残った1〜2台に極端な当たり日が含まれる」ケースの重みが
不当に増幅されていた(例: 2025-11-04、3051が欠落し残り2台の平均に
+8200のアウトライヤーが直接反映、3台平均なら薄まっていたはずの影響が
2台平均で2倍近く効いた)。この結果、全台top3のedgeは修正前+1,130.1枚
→修正後+880.6枚と約22%過大に出ていた。
5日分のピック・diff・baselineをCodexに個別出力させて自分の値と
突き合わせる、という粒度の細かい照合をして初めて発見できた。
集計値(edge平均・CI)だけを見比べていたら気づけなかった。

## アクション
- 即席のwalk-forward検証スクリプトを書くときは、top-N選出後に
  「当日の実データプールに実在する台だけを候補にしてtop-Nを選ぶ」
  (Codexが採った方式)か、「欠落した台を0点/baseline値で埋めて必ずN台で
  平均する」のどちらかを明示的に選び、分母が黙って縮む実装にしない。
- 集計後のedge平均だけで検証を終えず、疑わしい結果が出たら数日分の
  生ピック・diff・baselineを出力して手計算と突き合わせる。今回はこの
  粒度の照合でしか発見できなかった。
- 本番の`backtest/forward.py score()`も同じ`sum(...)/ len(rows)`構造だが、
  全preregが`min_games_today=0`(未フィルタ)のため、実際に「台が当日
  データに存在しない」場合(撤去・機種入替等)以外では分母縮小が起きない。
  今は無害だが、将来`min_games_today>0`のpreregを作る場合はこのリスクが
  本番パイプラインにも及ぶことを事前に認識しておく。

## 例
2025-11-04、蒲田7 AT一般: history top3=[3051(score=2647.8), 3079, 3255]。
3051は当日games_normalized<1000で日次プールから欠落。
バグ版: sel=[3079(+8200), 3255(-2800)]の2台平均=+2,700 → edge=+2,467
修正版(Codex方式、当日プール内から選び直し): sel=[3038(-2600), 3079(+8200), 3255(-2800)]
の3台平均=+933 → edge=+700.5。1日でedgeの解釈が3.5倍変わった。

