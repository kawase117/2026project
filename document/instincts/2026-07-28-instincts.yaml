# 新しいスコアの好成績は、まず選出頻度の偏りを分解してから信じる

## 背景
2026-07-28、蒲田7のk7_at_histdiff_top3ルール(rank1-3)を9ヶ月walk-forwardで
測ると+1,130枚/台(CI[+737,+1,619])と好成績だったが、選出頻度を見ると
台2026が227日中184日(81%)選ばれていた。台2026を除外すると+122.6枚
(CI[-114,+371])まで潰れ、ゼロ跨ぎになった。ルールの正体は「鉄台2026を
拾う器」に過ぎなかった。
同日、みとやのジャグRB機種内zスコアでも同じ手順を踏んだが、こちらは
1台除外(674)で+206.0→+120.4、上位3台除外でも+48.5(CI[-30,+136])と
段階的に減衰するのみで、k7のような単一台への完全依存ではなかった。
ただし選出頻度上位10台中8台が角番1〜3に集中しており、位置属性という
別の交絡因子が見つかった(下記instinct参照)。
この2例から、「新しいスコアの集計edgeが良い」だけでは何も分からず、
選出頻度の偏りを見て初めて「本当に日次で入れ替わる設定を当てているのか」
「特定の台(鉄台)や特定の位置区画を拾っているだけなのか」が区別できる
ことが分かった。

## アクション
- 新しいスコアリングルールをprereg化する前に、walk-forwardの選出ログから
  台番号の選出頻度カウントを必ず取る。
- 上位1〜3台を順に除外して同じwalk-forwardを再計算し、edgeがどれだけ
  残るかを見る。ゼロまで潰れれば「鉄台/固定効果を拾う器」に過ぎない
  (k7 AT一般の例)。段階的に減るだけなら広い効果の可能性があるが、
  次に選出頻度上位台の位置属性(rank_from_aisle/section)・機種を確認し、
  既知の位置効果(角番など)の再発見でないか照合する。
- 単一台除外で潰れるルールは、その台がbriefing_common.IRON_MACHINES等の
  既知の鉄台リストに載っているか確認し、載っていなければ新規鉄台候補として
  記録する。

## 例
k7_at_histdiff_top3 (蒲田7, AT一般, hist_mean_diff, 2025-10-28〜2026-07-27):
  全台rank1-3: n=269 +1,130.1枚 CI[+737.0,+1,618.8] 勝日率61%
  2026除外rank1-3: n=269 +122.6枚 CI[-114.4,+370.5] 勝日率47% ← ゼロ跨ぎ
  rank1のみ: n=227 +2,970.1枚 CI[+2,189.5,+3,844.6] 勝日率71%(台2026が180/227日=79%)

【2026-07-29追記・訂正】上記の絶対値は算出コード自体のバグにより過大。
mean-averaging-denominator-shrink-bias(下記instinct参照)により、
269日中109日(40%)で分母が2台に縮小していた。修正後は
全台top3 +880.6枚・2026除外 +51.1枚(Codexの独立監査 +787.7枚/+2.4枚と
概ね整合)。「2026除外でゼロに潰れる」という結論自体は変わらないが、
絶対値を再利用する場合は修正後の数字を使うこと。

