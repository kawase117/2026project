# Codex委任フローは機能するが、委任判断そのものがサボられがちだった

## 背景
CLAUDE.mdに「Claude=指揮監督/Codex=実装」の役割分担が明記され、過去セッションでも
feedback-codex-collaboration-workflowとして記録済みだったにもかかわらず、直近の複数コミット
（重み二重定義修正・角番シグナル理論訂正など、機械的修正に分類できるもの）を実際には
Claudeが直接Edit/Writeで処理していた。ユーザーから「なぜCodexに委任していないのか」と
指摘され、初めて発覚した。理由は「委任コストの過大評価」ではなく、分析中に小さなバグを
見つけた瞬間にその場で直す方が心理的に速く感じ、委任判断の自問自体を毎回スキップして
いたこと。

実際にcodex-prompt-precisionスキル→codex:rescue→バックグラウンド実行→
`codex-companion.mjs status --all --json` / `result <job-id> --json` でのポーリング、
という一連のフローをテストしたところ、技術的には問題なく機能した
（ゴミファイル`$($db.FullName)`/`None`の原因調査を実例として実施、2026-07-28）。
ただし調査自体は空振り（原因コミット特定不能）に終わり、Codexへの委任がタスク成否を
保証するわけではない。

## アクション
- コード修正が発生する見込みのタスクに着手する前に、必ず「これは単純実装／機械的修正か？
  Codexに投げるべきか？」を明示的に自問する。分析・解釈・プランニングはClaude自身が担当
  してよいが、実際のコード編集フェーズに入った瞬間に判断を切り替える。
- 委任する場合はcodex-prompt-precisionスキルで契約・粒度・日付境界・除外条件を先に埋めて
  からcodex:rescueに渡す。
- codex:rescueのsubagentは転送専用でジョブ状態を自分でポーリングできないため、
  バックグラウンドジョブの状況確認は`node codex-companion.mjs status --all --json`と
  `result <job-id> --json`を直接叩く。job IDがsubagent経由の応答で見つからない場合は
  `status --all`で最新ジョブを探す。

## 例
2026-07-28、ゴミファイル調査を`codex:rescue`に委任。`task-resume-candidate`で再開可能
スレッドなし確認→新規タスク発行→120秒超でバックグラウンド移行(job bdai8a89n)→
subagentへのフォローアップメッセージではジョブ状態を取得できず→
`codex-companion.mjs status --all --json`で`task-ms3xbh9m-zo6nvg`のcompletedを確認→
`result`コマンドで全文取得、という流れで完走した。

