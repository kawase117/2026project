# 全期間平均のwalk-forward edgeは、既知のレジーム変化点で必ず分割し直してから評価する

## 背景
2026-07-28、みとやのジャグRB機種内zスコア(hist_mean_rb_prob_model_z)の
全日walk-forward(2025-10-28〜2026-07-27, n=267日)は+206.0枚/台
CI[+113.2,+324.6]・勝日率60%で「盤面最強」に見えた。しかし2026-05の
店長交代(既にdeathwatchがmitoya_jug_corner1をWEAKENEDと判定済みの
レジーム変化点)で前後に分割すると、交代前n=185は+334.2枚CI[+248.6,+460.2]・
勝日率68%、交代後n=82は-83.1枚CI[-236.1,+119.2]・勝日率43%と符号が
反転した。土曜限定の効果(全期間+528.3枚・勝日率81%)も同様に、交代前
n=26は+767.7枚・勝日率92%、交代後n=11は-37.6枚・勝日率55%だった。
さらに選出頻度上位10台中8台が角番1〜3(physical_corner)に集中しており、
z版スコアの正体はコーナー効果の別表現に過ぎず、コーナー効果自体が
2026-05以降弱まっていることが根本原因だった。
全期間の集計は、崩壊した前半の強い数値が後半のゼロ〜マイナスを
平均でならして隠してしまう。

## アクション
- 評価対象のホールに既知のレジーム変化点(店長交代・改装・機種入替等、
  deathwatch/STATUS.mdやtheory文書に記載されたもの)がある場合、
  全期間walk-forwardの数値をそのまま採否根拠にしない。
- 必ずレジーム変化点の前後で分割し、両方のCIを併記する。事後(直近)側の
  CIがゼロを跨ぐ、または符号が反転していれば、全期間の好成績は
  過去の遺産であり現在は機能していないと判断する。
- 新しいスコアが「既知の位置効果(角番等)の言い換えになっていないか」も
  選出頻度×位置属性のクロス集計で確認する(pick-concentration-decomposition
  instinctと併用)。

## 例
みとや hist_mean_rb_prob_model_z (ジャグ, top3):
  全期間(n=267): +206.0枚 CI[+113.2,+324.6] 勝日率60%
  交代前(〜2026-04, n=185): +334.2枚 CI[+248.6,+460.2] 勝日率68%
  交代後(2026-05〜, n=82): -83.1枚 CI[-236.1,+119.2] 勝日率43% ← 符号反転
台674(マイジャグラーV, physical_corner=1)の月別平均diffが2026-05に
+525→-61と転落しており、コーナー効果の崩壊時期と完全に一致する。

