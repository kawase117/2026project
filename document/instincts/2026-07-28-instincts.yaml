# 鉄台の的中はルール・選定ロジックの成功として数えてはならない

## 背景
2026-07-27の答え合わせで、蒲田7の台2026(+4,100枚)を「本命が当たった」と評価したが、
台2026は briefing_common.IRON_MACHINES に登録済みの鉄台であり、機種が3回変わっても
優遇が続く座席固有の効果である。鉄台の的中は選定アルゴリズムの精度と無関係に
高確率で起きるため、これをルールの成功事例として数えると評価が甘くなる。
実際、同じルール(k7_at_histdiff_top3)は台2026を除く非鉄台2枚(3203, 3089)のうち
1枚が-6,000枚と大きく外し、ルール全体のedgeは-89枚とマイナスだった。
鉄台の勝ちに引きずられて「本命的中」と総括すると、この失敗が見えなくなる。

## アクション
- フォワード結果を評価するときは、picks から IRON_MACHINES に該当する台を除外した
  上で edge / diff を再集計し、両方を併記する（鉄台込み・鉄台抜き）。
- 「本命が当たった」という総括は、その台が鉄台かどうかを確認してから書く。
- 鉄台以外の選定精度こそが、ルールの実力を測る指標である。

## 例
2026-07-27 k7_at_histdiff_top3: 全体 mean_edge_per_pick=-89.3枚
（台2026 +4,100枚を含む）。台2026(鉄台)を除いた非鉄台2枚(3203:-6,189, 3089:+2,011)
だけで見ると平均-2,089枚で、鉄台込みの数字よりさらに悪い。
「鉄台の勝ちが全体の赤字を覆い隠していた」ことが、除外して初めて分かる。

