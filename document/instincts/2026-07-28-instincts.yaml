# 合成確率(bb+rb / games)は「不発」仮説の裏付けに使えるが確定はできない

## 背景
2026-07-27、蒲田7の台3203(シャーマンキング)が5,805G・diff=-6,000枚だったが、
ユーザーから「2/4で早い段階に万枚出ていたので、実際は高設定だったが不発で
大きくマイナスになった可能性がある」という現場観察が入った。
machine_detailed_results には時間帯別データが無く(日次集計のみ)、この主張を
直接検証できない。ただし当日行の bb_count=17, rb_count=13 から合成確率を
計算すると 1/193.5 で、これは一般的な低設定の合成確率(目安1/380〜400程度)より
明確に高く、高設定域でしか出にくい当たり数だった。この数値は「不発」仮説と
矛盾せず、むしろ整合的だった。

## アクション
- 時間帯別データが無いホールで「高設定だったが不発」という現場観察を検証したい
  場合、当日の bb_count/rb_count から合成確率を計算し、一般的な設定別スペックの
  目安と比較する。低設定では出にくい当たり数なのにdiffが大きくマイナスなら、
  仮説と整合的（矛盾しない）と言えるが、これは「確認」ではなく「棄却されない」
  というだけであり、低設定でも短期的にこの水準の当たりは起こり得るため断定はしない。
- この方法は答え合わせの解釈を補強する材料であり、選定ルールの成否判定には使わない
  （判定は事前登録のフォワード集計のみで行う）。

## 例
台3203: games=5805, bb=17, rb=13, 合成確率=1/193.5(bb 1/341.5, rb 1/446.5)。
diff=-6,000枚という結果だけを見ると「低設定で終日不発」に見えるが、
合成確率の高さは「当たりは十分出ていたが、勝った分を打ち返された」という
"高設定だが不発"パターンの方が説明として自然であることを示唆する。

