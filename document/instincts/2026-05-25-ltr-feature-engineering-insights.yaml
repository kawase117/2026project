# ホール横断digit-level lagはentity_key単位lagと別次元の信号

## 背景
現行モデルのlag特徴量は `entity_key = "3F_N|7"` 単位（フロア×末尾）で計算。
EDAのMI分析で有効と判定された `lag7_digit_diff` は
ホール全体の末尾別集計（全フロアを跨ぐ）であり、別次元の信号。
MI rank1: lag7_digit_diff (0.01237), rank2: lag14_digit_diff (0.00222)。

## アクション
`aggregate_mode()` の `agg.sort_values()` 直後に以下を追加:
```python
DIGIT_LAGS = [2, 6, 7, 14]
hall_digit_daily = (
    agg.groupby(["date", "last_digit"], sort=True)["total_diff_coins"]
    .mean().reset_index()
    .rename(columns={"total_diff_coins": "hall_digit_mean_diff"})
    .sort_values(["last_digit", "date"]).reset_index(drop=True)
)
for lag in DIGIT_LAGS:
    hall_digit_daily[f"lag{lag}_hall_digit_diff"] = (
        hall_digit_daily.groupby("last_digit")["hall_digit_mean_diff"]
        .shift(lag).fillna(0.0)
    )
lag_cols = [f"lag{lag}_hall_digit_diff" for lag in DIGIT_LAGS]
agg["last_digit"] = agg["last_digit"].astype(str)
hall_digit_daily["last_digit"] = hall_digit_daily["last_digit"].astype(str)
agg = agg.merge(hall_digit_daily[["date", "last_digit", *lag_cols]], on=["date", "last_digit"], how="left")
```

## 例
entity_key "3F_N|7" のlag7 = 3F_Nフロア内の末尾7のみの過去7日差枚
hall_digit lag7 for "7" = ホール全体（全フロア）の末尾7の過去7日平均差枚

