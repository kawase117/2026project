# hall-levelのrolling差枚特徴量はis_top2予測のMI=0

## 背景
MI-LTR分析（ターゲット: is_top2）の結果:
- roll7_avg_diff, roll14_avg_diff, roll28_avg_diff のMI = 0.0
- lag1/7/14_avg_diff のMI = 0.0
- weekday のMI = 1.98e-6（実質ゼロ）
ホール全体のaggregate差枚は、どの末尾がtop2に入るかという相対判断に貢献しない。
digit-level特徴量（lag7_digit_diff=0.01237）のみが有意な信号を持つ。

## アクション
hall-level rolling特徴量をLTRの特徴量から削除することを検討する。
ただし現行モデルではentity_key単位のlag（フロア×末尾）は別物なので混同しない。
hall-aggregate（`avg_diff_per_machine` 系）は削除候補。

## 例
MI=0特徴量（is_top2に対して）:
- lag1_avg_diff, lag7_avg_diff, lag14_avg_diff
- roll7_avg_diff, roll14_avg_diff, roll28_avg_diff

