# ml/ 配下のスクリプトは `python -m` で実行する

## 背景
`python ml/last_digit/tail_ltr_split_rule_nextday_gpu.py` で実行すると
`ModuleNotFoundError: No module named 'ml'` が発生する。
`ml/` はパッケージ（`__init__.py` あり）として設計されており、
直接スクリプト実行では相対インポートが解決できない。

## アクション
必ず `python -m` 形式で実行する。ドット区切りのモジュールパスを使用。

## 例
誤: python ml/last_digit/tail_ltr_split_rule_nextday_gpu.py
正: python -m ml.last_digit.tail_ltr_split_rule_nextday_gpu

