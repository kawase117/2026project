# Kruskal post-hocで末尾3が4ペア全てに登場し最も乖離している

## 背景
蒲田七のKruskal post-hoc（Mann-Whitney全ペア）で有意（p<0.05）なペア4件:
- 3 vs 8: p=0.0016（最も有意）
- 3 vs 6: p=0.0019
- 3 vs 9: p=0.0023
- 2 vs 3: p=0.042
全ペアに末尾3が含まれる。他の末尾同士は有意差なし。

## アクション
末尾3の分布特性を個別調査する（高い？低い？）。
3F_A（hit@2=76.9%の低精度expert）と末尾3の重なりを確認する。
ただしKruskalはホール全体（訓練期間含む）での差異であり、
末尾3を特別扱いするモデル変更は慎重に行う（overfitting警戒）。

## 例
有意ペア: (3,8)=0.0016, (3,6)=0.0019, (3,9)=0.0023, (2,3)=0.042
無効ペア例: (0,1)=0.99, (4,5)=0.98 → 大半は有意差なし

