# `--windows-*` はtraining期間名であり特徴量のroll幅ではない

## 背景
ACF/PACFで「roll28が最適」という知見を得た後、
`--windows-wed "roll28"` を指定したところ全candidateが "unavailable" になった。
`roll28` は特徴量名（`roll28_total_diff_coins`）であり、
training windowの名前（`full_2025`, `recent_60d` など）とは完全に別物。

## アクション
`--windows-*` には以下の有効名のみを指定する:
- `full_2025`（regime1開始〜regime2終了）
- `recent_60d`（テスト開始60日前〜前日）
- `recent_90d`, `opening_early`, `regime1_full` 等
ACF/PACFのroll幅はfeature設計に使うが、`--windows-*`には影響しない。

## 例
誤: --windows-wed "roll28"       → 全候補unavailable（window名不存在）
正: --windows-wed "full_2025"    → デフォルト動作、valid windowが選択される

