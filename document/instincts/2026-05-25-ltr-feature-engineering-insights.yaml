# last_digit別ACFパターンは異質であり全末尾共通の有意lagは存在しない

## 背景
蒲田七のlast_digit別ACF（lags=30）の結果:
- 全末尾共通の有意lagはゼロ
- 最も広く有意なlag: lag6（5末尾）、lag2（4末尾）、lag9（3末尾）
- 末尾ごとにパターンが明確に異なる

## アクション
単一のlagで全末尾を代表させることはできない。
hall-wide digit-level lag特徴量はlag2/6/7/14の複数を追加し、
モデルが各末尾に応じて最適lagを学習できるようにする。

## 例
末尾1の有意lag: 1, 6, 9（短周期）
末尾6の有意lag: 1, 2, 4, 5, 21, 25（多数・長期含む）
末尾0の有意lag: 11, 14, 17（中期のみ）
→ 共通性なし、lag7/14のみ追加では不十分
