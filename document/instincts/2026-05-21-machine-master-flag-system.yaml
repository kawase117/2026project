# machine_master フラグはキーワードリストで一元管理する

## 背景
bt_flag / hana_flag / jug_flag / oki_flag はすべて機種名の部分一致で判定される。
フラグ判定ロジックは `database/data_inserter.py` の冒頭にある `_BT_KEYWORDS` リストで一元管理されている。
`get_or_create_machine_master()` が新規機種挿入時にこのリストを参照してフラグをセットする。

## アクション
- キーワード追加は `data_inserter.py` の `_BT_KEYWORDS` リストのみ編集する
- 追加後は `python database/update_machine_flags.py` を実行して既存DBに反映する
- hana_flag は `ハナハナ` / `スーハナ`、oki_flag は `沖ドキ`、jug_flag は `ジャグラー` で判定（変更時は `_calc_flags()` も同時に修正）

## 例
```python
# _BT_KEYWORDS に追加するだけでよい
_BT_KEYWORDS = [
    'ボーナストリガー', 'BONUS TRIGGER',
    'BT', 'LB', 'パルサー',
    ...
]
# その後
# python database/update_machine_flags.py
```

