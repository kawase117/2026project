# get_or_create_machine_master は既存レコードを更新しない

## 背景
`data_inserter.py` の `get_or_create_machine_master()` は既存レコードがあれば
そのまま返して終了する（UPDATEしない）。
キーワードを追加しても、すでにDBに登録済みの機種には自動で反映されない。

## アクション
- キーワード追加後は必ず `python database/update_machine_flags.py` を手動実行して既存レコードを再評価する
- 新規機種（初回スクレイピング）については挿入時に自動でフラグがセットされる

## 例
```
# キーワード追加 → update_machine_flags.py 実行のセット
1. database/data_inserter.py の _BT_KEYWORDS に追加
2. python database/update_machine_flags.py
```

