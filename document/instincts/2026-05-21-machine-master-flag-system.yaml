# パチスロ機種名の典型的な表記揺れパターン

## 背景
ana-slo.comからスクレイピングした機種名には複数の表記揺れが存在し、
同一機種が異なるキーとして登録されてしまうケースがある。

## アクション
キーワード設計時は以下の揺れを考慮する：
1. **プレフィックス有無**: `L不二子BT` vs `不二子BT`、`スマスロ ハナビ` vs `新ハナビ`
2. **全角/半角**: `！` vs `!`、`Ⅲ` vs `III`（ローマ数字）、`‐`（全角ダッシュ）vs `-`
3. **スマスロ表記**: `スマスロ ○○` / `スマート沖スロ ○○` / `○○(スマスロ)` が混在
4. **LB プレフィックス**: LBで始まる機種は基本的にBT機
5. **シリーズ番号**: 数字やサブタイトルで別機種になる場合がある（エウレカセブン3/4はBT非該当）

## 例
```
# 安全なキーワード設計の例
'ハーレムエース'  # 翔べ！・翔べ! 両方をカバー
'マタドール'      # マタドールⅢ・マタドールIII 両方をカバー
'エウレカセブン HI-EVOLUTION ZERO TYPE'  # 特定バージョンだけ狙い撃ち
```

