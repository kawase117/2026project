# machine_master はホールDB内に埋め込まれている（共有DBではない）

## 背景
`db/machine_master.db`（db_setup.pyが作る共有マスター）と、
各ホールDB内の `machine_master` テーブル（data_inserter.pyが動的に作る）は別物。
ダッシュボードのクエリ（table_config.py）は各ホールDB内の machine_master を参照している。

## アクション
- フラグ変更は各ホールDBの machine_master テーブルに直接適用する必要がある
- `update_machine_flags.py` は `db/*.db` を glob して全ホールDBを一括更新する
- `db/machine_master.db` は現時点ではダッシュボードから参照されていないため優先度低

## 例
```python
# table_config.py のクエリ例
{'suffix': 'bt', 'name': 'BT機種', 'condition': 'AND mm.bt_flag = 1'}
# mm = 各ホールDB内の machine_master（JOIN済み）
```

