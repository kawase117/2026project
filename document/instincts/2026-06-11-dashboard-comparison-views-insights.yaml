id: streamlit-dataframe-no-html-rendering
trigger: st.dataframe() のセルにバッジ・装飾的な表示を追加しようとするとき
confidence: 0.95
domain: dashboard-development
source: session-observation
project_id: pachinko-2026project
project_name: 2026project
title: st.dataframe() はセル内のHTMLをレンダリングしない — バッジはプレーンテキストで実装する
background: >
  confidence_badge() を当初 HTML <span style="..."> として実装したが、page_11/16 の
  表示は st.dataframe(use_container_width=True) を使用しており、HTML はエスケープ
  されてそのまま文字列表示されてしまう問題があった。
action: >
  st.dataframe のセルに警告マーク等を表示する場合はプレーンテキスト（絵文字+テキスト）
  で実装する。HTML + unsafe_allow_html が使えるのは st.markdown 経由のカード型
  コンポーネント（metric_card 等）のみ。
example: >
  confidence_badge(count, threshold=5) は count < threshold のとき
  "⚠️ サンプル少" という文字列のみを返す（HTMLタグなし）。

