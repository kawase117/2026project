id: claude-code-fact-forcing-gate-hook
trigger: Write/Edit ツールでこのプロジェクト配下のファイルを新規作成・編集するとき
confidence: 0.9
domain: workflow
source: session-observation
project_id: pachinko-2026project
project_name: 2026project
title: ファイルの Write/Edit 前に「Fact-Forcing Gate」フックが事実確認を要求する
background: >
  本セッションで plan ファイル・新規 util ファイル・design_system.py 等の編集時、
  毎回「呼び出し元ファイル」「既存重複の有無（Glob/Grep確認）」「データファイルの場合の
  フィールド構造」「ユーザー指示の引用」を提示しないとツールがエラーを返すフックが
  有効になっていた。
action: >
  Write/Edit を実行する前に、事前に Grep/Glob で呼び出し元・重複ファイルの有無を
  確認しておく。エラーが出たら指定の4項目（呼び出し元、影響する公開関数、データ構造、
  ユーザー指示の引用）を本文で提示してから同じ操作をリトライする。
example: >
  "1. Files importing X: ... / 2. Public functions affected: ... /
  3. No data file I/O ... / 4. User's instruction (approved plan): ..."
  の形式で回答してから再実行する。
