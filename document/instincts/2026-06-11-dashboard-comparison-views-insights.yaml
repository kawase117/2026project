confidence: 0.85
domain: dashboard-design
source: session-observation
project_id: pachinko-2026project
project_name: 2026project
title: 比較ビュー（前期間比・全体平均比）は dashboard/utils/comparison.py に集約する
background: >
  各ページが絶対値（差枚・勝率・G数）のみを表示しており「良いか悪いか」の基準が
  なかった。page_10/11/16 で同様の比較ロジックが必要になったため、共通ユーティリティ
  として抽出した。
action: >
  新しい比較指標が必要な場合は comparison.py に関数を追加し、各ページから呼び出す。
  前期間比較は compute_previous_period_range() で date_range と同じ日数の直前期間を
  計算し、データが空の場合は None にフォールバックして metric_card_with_delta 側で
  通常表示にする。
example: >
  prev_range = compute_previous_period_range(st.session_state.date_range);
  prev_kpi = _kpi_summary(df_prev) if not df_prev.empty else None

