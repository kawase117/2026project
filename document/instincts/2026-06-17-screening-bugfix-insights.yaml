# X_DDS lift が負の機種には Q5 ボーナスを適用しない

## 背景
旧スコア式: `is_q5 * 100 + (11 - sec_rank) * 5 + lift`
Q5=True かつ X_DDS lift=-2.29 の機種が Q5 ボーナス 100 の重みで rank4 に入っていた。
「X_DDS 日にパフォーマンスが落ちる Q5 機種」を推奨するのは意味論的に誤り。

## アクション
- Q5 ボーナスは **lift > 0 のときのみ**付与する
- 修正後スコア式:

```python
lift = result["lift_machine"].fillna(0)
q5_bonus = result["is_q5"].astype(int) * (lift > 0).astype(int) * 100
result["score"] = q5_bonus + (11 - result["section_rank"].fillna(10)) * 5 + lift
```

- lift < 0 の Q5 機種は補助情報扱い（Q5リスト末尾に表示）
- section 不明・lift 高い非 Q5 機種は補助リストに別掲する

## 例
修正前: lift=-2.29 の Q5 機種 score=112.71（rank4）
修正後: score=2.71（Q5リスト末尾）← 正しく格下げ
修正後 rank1: section rank1 + Q5 + lift=+5.59 の機種 score=155.59

