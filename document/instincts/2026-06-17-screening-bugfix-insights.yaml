# section 不明のデバッグ手順：台番号変更より SQL バグを先に疑う

## 背景
化物語・東京喰種・マギアレコード・甲鉄城のカバネリ等が section = NaN になっていた。
「設置変更で台番号が変わったのでは？」と仮定したが誤りだった。
実際には台番号は CSV に全て存在し、バグは SQL の GROUP BY に起因していた。
修正後は全 Q5 機種で section が判明し、ランキングが大幅変動した。

## アクション
section 不明が出たら以下の順で確認する:

1. 台番号が CSV 範囲内か確認:
```python
csv_nums = set(csv["machine_number"].tolist())
missing = [n for n in machine_nums if n not in csv_nums]
```

2. missing=[] なら SQL バグを疑う。台番号に複数機種名が存在するか確認:
```sql
SELECT machine_number, machine_name, COUNT(DISTINCT date) as n
FROM machine_detailed_results
WHERE machine_number IN (...)
GROUP BY machine_number, machine_name
ORDER BY machine_number, n DESC
```

3. 複数機種名あり → `_load_latest_machine_names` 系の SQL を CTE + MAX(date) JOIN に修正

## 例
台番号 608-614 → CSV に全て在籍（missing=[]）
→ 複数機種名あり → SQL 修正で section 判明 → rank 大幅変動

