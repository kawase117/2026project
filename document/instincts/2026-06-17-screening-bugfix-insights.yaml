# SQLite の GROUP BY は集約なし列に任意の値を返す（最古・最新保証なし）

## 背景
mitoya_xdds_screening.py の `_load_latest_machine_names` で
`GROUP BY machine_number HAVING COUNT(DISTINCT date) >= 5` を使っていた。
台番号608-614には過去に複数の機種が設置されており、
SQLite が GROUP BY の非集約列（machine_name）に最少登場の機種名を返した。
compute_machine_xdds_perf は machine_name キーで集計するため、
merge 時にキーが不一致 → section = NaN（section 不明）に見えるバグが発生。

## アクション
- `GROUP BY machine_number` で machine_name を取る SQL は**必ず最新日付を明示**して取得する
- 正しいパターン（CTE + MAX(date) JOIN）:

```sql
WITH counts AS (
    SELECT machine_number, MAX(date) AS max_date, COUNT(DISTINCT date) AS total_dates
    FROM machine_detailed_results
    GROUP BY machine_number
    HAVING total_dates >= 5
)
SELECT c.machine_number, mdr.machine_name
FROM counts c
JOIN machine_detailed_results mdr
    ON mdr.machine_number = c.machine_number AND mdr.date = c.max_date
GROUP BY c.machine_number
```

- `COUNT(DISTINCT ...) OVER (PARTITION BY ...)` は SQLite では使えない（エラー）
- section 不明になったら「台番号変更」ではなく「GROUP BY の機種名ミスマッチ」を先に疑う

## 例
台番号608に A機種215日・B機種188日・C機種19日が存在する場合、
GROUP BY machine_number → SQLite は C機種（最少）を返す可能性がある
CTE + MAX(date) JOIN → 最終登場日の機種名を正しく返す

