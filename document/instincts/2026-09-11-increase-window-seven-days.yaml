# 効くのは「新台」ではなく「既存機種の増台」。効果は7日で消え、効かないホールがある

## Core claim
`model_inventory` の `change_kind` を分けると、上乗せがあるのは
**`increase`（既存機種の台数増）だけ**で、`new`（新台導入）にはほぼ無い。
そして **8日目には消える**。さらに**ホール差が大きく、共通の数値として使えない**。

同じ改装日に台数を触られていない機種を対照にしたイベントスタディ（10ホール）:

| increase (n=160) | 上乗せ | 正の割合 |
|---|---|---|
| 事前30日 | +0.53pp | 57% |
| **当日〜7日** | **+2.45pp** | 72% |
| 8〜30日 | +0.41pp | 56% |

差分の差 **+1.90pp**、改装日クラスタbootstrap 95% [+1.23, +2.64]。
`new` は当日〜7日 +0.53pp、8〜30日 **-0.46pp**（正の割合42%）。

## Evidence
**「改装日そのものが出す日」ではない。** ホール全台平均の出率で通常日と比べると
全体 **-0.10pp**、9ホール中7ホールが負（楽園 +0.51 / ARROW +0.80 のみ正）。
改装日効果の言い換えではないことがこれで確認できる。

**増台機種がもともと強いわけでもない。** 同じ対照で事前30日は +0.53pp しかない。

運用ルールとして「直近7日に増台があった機種を毎日1つ選ぶ」を過去日で回すと、
その日のホール機種平均に対し **+1.83pp（n=725, 勝率56%, 95% [+1.17, +2.53]）**。
対照ルール: 新台 +1.14pp / **前日の最強機種 +1.10pp** / 無作為 -0.06pp。

⚠️ 前日の最強機種は平均だけ見ると悪くないが、**中央値 -4.74pp・勝率41%**。
少数の万枚台が平均を作っているだけで、追いかけ戦略は実際には負ける。
このルールを平均だけで評価してはいけない。

**ホール別（増台ルール、pp / 勝率 / n）:**

| 効く | | 効かない | |
|---|---|---|---|
| みとや大森町 | +4.65 / 69% / 49 | 蒲田7 | +0.46 / 44% / 115 |
| レイトギャップ平和島 | +4.31 / 70% / 128 | ARROW池上 | +0.07 / 47% / 58 |
| ヒロキ東口 | +4.03 / 59% / 32 | ベルシティ雑色 | -0.30 / 41% / 41 |
| 楽園蒲田 | +1.32 / 60% / 231 | 蒲田1 | +1.05 / **44%** / 64 |

蒲田1は平均は正だが勝率44%で、上の「前日の最強機種」と同じ形をしている。
**平均と勝率が食い違うホールは、平均のほうを疑う。**

## Interpretation
- 新台に効果が無いのは直感に反するが、[[shindai-exclude-from-games-analysis]] と整合する。
  新台は設定に関係なく回るので、店は設定を入れなくても稼働が取れる。
  一方、既存機種をわざわざ増やすのは店がその機種を推す意思表示になっている
- 8日で消えるのは「導入時のご祝儀」の形。恒常的な優遇ではない
- ホール差は [[feedback-no-cross-hall-pooling]] の再確認。全体平均 +1.83pp を
  蒲田7に当てはめると、実測 +0.46pp・勝率44% を +1.83pp と誤認する

## 限界
- ホール別の n は 7〜231 とばらつく。金時（n=7）は何も言えない
- 機種平均の話であって、その機種の中のどの台に座るかは別問題。座席選択は別軸
- `delta >= 3` を増台の閾値にしている。1〜2台の増減は入替の端数と区別がつかない
- `model_inventory` はリネーム検出込みだが、検出漏れがあれば偽の increase になる
  （150件のリネームを吸収済み。LBタコスロ↔タコスロ等）

## Action
- 増台と新台を**必ず分けて**扱う。混ぜると効果が薄まる
- 窓は **7日**。8日目以降の増台を根拠にしない
- `backtest/morning.py` はホール別の凍結値を出し、効かないホールでは警告する。
  紙に出ている数値のほうを信じる
- 「改装日だから」を独立の根拠に使わない。改装日はホール全体では出す日ではない
- 追いかけ戦略（前日の最強機種）は平均に騙されない。中央値と勝率を必ず見る
