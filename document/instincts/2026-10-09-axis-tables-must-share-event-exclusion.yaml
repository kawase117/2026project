# 軸別の表はすべて同じイベント除外で作る。DD集合だけでは周年日が残る

## Core claim
曜日の表だけイベント日を除き、DDの表を全日で作ると、周年日の1日がDDの順位を作る。みとやのDD別表では10日が1/268で1位に見えたが、これは7/10の周年日(7,982Gで36回、1/222)の混入で、除くと1/477だった。イベントDD集合(1・4・7・14・17・24・27・30)に10日は入っていないので、DD集合だけでは周年日が漏れる。

## Evidence
- n_observations: 1(みとや大森町 ディスクアップ745、2026-07-08〜10-07)
- data scope: 745の92日。イベントDD除外で68日、台帳(EVENT_DAYS.jsonl)の周年日も除くと66日
- metric scope: rb_count / games_normalized
- 全日のDD別表: 10日1/268、31日1/365、17日1/369、8日1/373。除外後: 10日1/477(2日分のみ低回転)、17日は全日がイベントDDなので消え、31日・8日だけ残った
- ユーザーが「これは周年日などを除いていますか」と確認して発覚。私は除外していないのに、最初の報告でそのまま提示していた
- 楽園は期間92日のうち62日が台帳のイベント日で、台帳全件を除くと30日しか残らず、検出力が大きく落ちる

## Interpretation
- 除外の定義は、イベントDD集合と、台帳の個別日付(周年・取材・版権)の両方が要る
- 軸ごとに別々の除外を暗黙に使うと、表どうしを比較したときに説明できない食い違いが出る

## Action
- 軸別の表は、同じ除外関数を通した同じ行集合から作る。表の見出しに「全日」か「イベント除外(n日)」を明記する
- 除外は、イベントDD集合と`EVENT_DAYS.jsonl`の該当ホールの日付の両方を使う。取材なしの日(「毎日仕掛け取材なし」)は除外対象にしない
- 除外しても残る日数が少ない(楽園は30日)ホールでは、全日の表と除外後の表を並べ、検出力の限界を書く
- 報告する前に、上位の日が台帳のイベント日かどうかを必ず引く

