# 途中データの軸スイープ★は選抜バイアスで過大に出る。フルデイで回し直してから「発見」と呼ぶ

## 背景
2026-09-16 楽園蒲田で、site777 の途中データ（15:55〜19:25、差枚が読めた台 132〜175台）に
軸スイープを当てて★を報告した。翌々日（2026-09-18、DBに9/16フルデイが入った後）に
同じスイープをフルデイ（1,000G以上380台）で回し直すと、★の強さが大きく落ちた。

| 指標×軸 | 最強グループ | 途中データ | フルデイ |
|---|---|---|---|
| 差枚ホール比×列 | 2058-2070（東京喰種） | **p=0.003** | p=0.172 |
| 差枚残差×機種×角番 | カバネリ×角4 | **p=0.045** | p=0.105 |
| 回転数残差×フロア | 3F | p=0.025 | **p=0.025**（唯一維持） |

原因は差枚側の選抜。途中データで差枚が読めるのは 2,000G 到達台（= 打ち手が降りなかった台）だけで、
勝っている台が濃縮される。グループ内の1〜2台が大勝ちしていると平均が跳ね、
並べ替え検定の帰無分布（同じ選抜がかかった台の中での入れ替え）では再現されにくいため p が小さく出る。
回転数指標は全台（587台）を使うので、この歪みを受けにくく、フロア3Fだけが生き残った。

## アクション
1. 途中データの★は**席選びの材料**にとどめる。「発見」「今まで見ていなかった軸」と報告しない。
2. 答え合わせは必ず**フルデイのDB**で回し直す（`backtest/axis_sweep_baserate.py` の `sweep_day` を
   当日1日に当てれば同じ検定ができる）。事前登録・ルール化の判断もフルデイの p で行う。
3. 途中データで相対的に信用できるのは**回転数指標**（全台を使うので選抜が入らない）。
   差枚指標の★は割り引く。
4. 報告文では「途中データ（差枚N台）」「フルデイ（N台）」を必ず併記する。

## 例
NG（9/16 19:25）: 「カバネリ×角4 が p=0.045。私が見ていなかった切り口が見つかった」
OK: 「途中データでカバネリ×角4 が p=0.045。差枚が読めた175台だけの結果なので、明日フルデイで確認する」
   → フルデイでは p=0.105 で有意ではなかった

