# n=30日程度の検証では、hit@3等の離散指標は1日の結果差で大きく変動する

## 背景
同一データに対して特徴量構成だけを変えた3パターンを30日 walk-forward validation
で比較したところ、以下のように指標が大きく振れた：

```
baseline:           hit@3 = 0.0556
3特徴量追加後:       hit@3 = 0.0333  （baseline比で約40%の相対低下に見える）
physical_islandのみ: hit@3 = 0.0556  （baselineと完全一致）
```

hit@3 は「日次のtop3予測一致数/3」の30日平均であり、0.0556 と 0.0333 の差は
実質的に「30日間で1ヒット分」程度の差でしかない。これは統計的に意味のある
劣化ではなく、サンプルサイズに起因するノイズの範囲内である可能性が高い。

このような小さな検証窓で「Spearman 0.2936 → 0.2915」のような小数点3桁の差を
「改善」「悪化」と断定するのは、[[antipattern-claim-requires-chance-baseline-comparison]]
と同様に、ノイズと実質的なシグナルを区別できていない誤った判断を招く。

## アクション
小さな検証窓（n<50程度）で複数構成を比較する際は：

1. 離散指標（hit@k, precision, recall）の最小単位を意識する
   - 例: n=30日のhit@3なら、1/30 ≈ 0.033 が最小の変動単位
   - 観測された差がこの最小単位の1-2個分なら「ノイズ」と解釈する
2. feature importance のような補助指標と併せて判断する
   - 指標の差が小さくても、importance が明確にゼロ/極小なら「冗長」の判断は可能
   - 逆に、指標の差が大きくても importance が低ければ「過学習/ノイズ」を疑う
3. 可能であれば検証期間を伸ばす、または複数のシード/期間で再現性を確認してから
   「改善した」「悪化した」と結論づける

## 例
```python
# NG: 小数点3桁の差だけで「改善/悪化」を断定する
if new_spearman > baseline_spearman:
    print("改善した！この特徴量を採用する")

# OK: 最小変動単位とfeature importanceを併せて判断する
min_unit = 1 / n_validation_days  # 例: 1/30 ≈ 0.033
delta = abs(new_metric - baseline_metric)
if delta < min_unit:
    print("差は最小変動単位以下 → ノイズの可能性が高く、結論を保留する")
if feature_importance < 0.01:
    print("importanceがほぼゼロ → 指標の変動に関わらず冗長と判定して良い")
```
