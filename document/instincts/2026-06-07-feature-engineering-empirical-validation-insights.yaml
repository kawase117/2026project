# 連続値の特徴量が既に存在する場合、それを二値化したフラグはCatBoostにとって無価値

## 背景
`is_new_machine = (machine_sample_n_wf < 30)` という二値フラグを追加したが、
feature importance は完全にゼロ（0.000）だった。一方、元の連続値
`machine_sample_n_wf` は重要度3.4%（全特徴量中#8位）と高い寄与を示していた。

CatBoost のような決定木ベースのモデルは、連続値特徴量に対して任意のしきい値で
分割点を学習できる。そのため、人間が「30」という閾値を決め打ちして二値化しても、
モデルは既に連続値からその情報（および、もしより良い閾値があればそれも）を
自由に学習可能であり、二値化版は完全に冗長になる。

これは「新台フラグ」に限らず、決め打ちの閾値による二値化全般に当てはまる：
- 「ベテラン台かどうか」（経過日数を閾値化）
- 「高頻度かどうか」（出現回数を閾値化）
- 「大型機種かどうか」（規模を閾値化）

## アクション
連続値変数の二値化を検討する際は、以下を確認する：

1. 元の連続値が既に特徴量リストに含まれているか確認する
   → 含まれていれば、二値化版を追加しても決定木モデルには無価値（冗長）
2. 二値化が正当化されるのは以下のケースに限る：
   - 元の連続値がノイズが多く、閾値以下では情報がない（モデルが自動学習しにくい）
   - 線形モデル等、非線形な分割点を学習できないモデルを使う場合
   - 解釈性のために明示的なビジネスルールとして埋め込みたい場合
3. CatBoost/LightGBM等の決定木ベースモデルでは、基本的に連続値をそのまま渡し、
   モデルに分割点の学習を委ねる方が良い

## 例
```python
# NG: 連続値が既にあるのに、決め打ち閾値で二値化して追加する
df["machine_sample_n_wf"] = ...  # 既存（連続値、重要度3.4%）
df["is_new_machine"] = (df["machine_sample_n_wf"] < 30).astype(int)  # 重要度0.000（冗長）

# OK: 連続値をそのまま渡し、モデルに分割点学習を委ねる
NUMERIC_FEATURES = ["machine_sample_n_wf", ...]  # is_new_machine は追加しない

# 二値化が正当化されるケース: 線形モデルや解釈性重視の場合のみ
# logistic_model.fit(df[["is_new_machine"]], y)  # 決定木以外なら検討の余地あり
```

