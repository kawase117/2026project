# ドメイン知見の確信度が高くても、新規ML特徴量が既存特徴量と冗長なら効果はゼロ

## 背景
mitoya_daily_prediction.py に、信頼度0.90-0.95の3つのドメイン知見
（island-vs-machinetype-dual-axis, corner-static-positional-effect,
new-machine-seat-dd-roll-contamination）に基づく特徴量を実装し、
30日 walk-forward validation で実測した。

結果：
```
baseline (B案):        Spearman 0.2936 / hit@3 0.0556 / precision 0.4545
3特徴量同時追加後:      Spearman 0.2915 / hit@3 0.0333 / precision 0.4520  ← 悪化
physical_islandのみ:    Spearman 0.2964 / hit@3 0.0556 / precision 0.4500  ← 誤差範囲内の微増
```

feature importance で原因を特定：
- physical_island（重要度3.9%, #7位）→ 唯一モデルが活用。既存軸（section/machine_type）
  と独立した情報を持っていた。
- island_pos3_avg_wf（重要度0.95%, #23位）→ ほぼ無視。既存の seat_dd_roll/section/
  rank_from_aisle が同じ交互作用をより細かい粒度で既に捉えていた（冗長）。
- is_new_machine（重要度 **0.000**）→ 完全に無視された。

「ドメイン分析で確信度0.95の知見を得た」ことと「その知見をML特徴量として
明示的に追加する価値がある」ことは別問題。モデルが既存特徴量から間接的に
同じ情報を学習できている場合、新規特徴量は冗長でしかない。

## アクション
ドメイン知見をML特徴量として実装する前に、必ず以下を実施する：

1. その情報が既存特徴量から導出可能かを先に検討する
   - 例: 「新台かどうか」は二値フラグを作る前に、既存の連続値
     `machine_sample_n_wf`（サンプル数）が既に同じ情報をより精緻に
     持っていないか確認する
2. 実装後は必ず walk-forward validation + feature importance の両方で検証する
   - importance がほぼゼロ（<1%、既存の関連特徴量より大幅に低い）なら冗長と判定
   - validation指標（Spearman/hit@3/precision）が悪化または横ばいなら追加しない
3. 「効果がなかった」「冗長だった」という結果も、次回の特徴量設計の判断材料として
   重要な知見として記録する（[[binary-flag-redundant-with-continuous-equivalent]] 参照）

## 例
```python
# NG: 確信度の高いドメイン知見だからといって無検証で採用する
df["is_new_machine"] = (df["machine_sample_n_wf"] < 30).astype(int)
NUMERIC_FEATURES.append("is_new_machine")
# → そのまま運用に投入

# OK: 実装後に必ず empirical check を行う
model.fit(...)
importance = model.get_feature_importance(...)
if importance["is_new_machine"] < 0.01:
    # 既存の machine_sample_n_wf で代替可能と判定し、追加せず削除する
    NUMERIC_FEATURES.remove("is_new_machine")
```

