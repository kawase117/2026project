# 7系×土曜は全ホールで7系最弱曜日 — DD27/土曜の予測失敗の構造的原因

## 背景
2026-06-27（DD27、土曜）の3ホール候補台予測が全て実績と大幅に外れた（台レベルヒット率20-30%、Top10重複0-1件）。
全ホールのDD系統×曜日スキャン結果を照合した結果、7系×土曜はどのホールでも7系の中で最弱曜日であることが判明。
