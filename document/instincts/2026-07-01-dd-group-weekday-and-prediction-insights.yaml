## 背景
既存instinct `kamata7-7kei-monday-strongest-signal` の +807 という値は、蒲田7の7/7周年イベント（全台高設定日）を除外していない状態で計算されたものだった。
2026-06-30に `eda/dd_group_weekday_interaction_3halls.py` を7/7除外ありで実行した結果、7系×月 は avg +207（Tier C）に修正された。
周年日が全台高設定であることが統計を大幅に歪めていたことが判明。

## アクション
- 蒲田7の7系シグナルとして月曜を「最強」扱いしてはならない
- 7系の実際の強い曜日は **7系×木(+386, Tier B)** と **7系×日(+323, Tier B)**
- +807という数値を根拠に月曜への大量投資をする戦略は再評価が必要
- 7/7周年日を含むあらゆる統計計算では除外ロジックが必須

## 例
修正前（誤）: 7系×月 = +807, CI=[692,930], Tier A
修正後（正）: 7系×月 = +207, Tier C
正しい強シグナル: 7系×木 = +386 (Tier B), 7系×日 = +323 (Tier B)

