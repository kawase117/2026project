# 機種総差枚（n×avg_diff）が正しい予算圧縮評価指標

## 背景
全台系イベントが他機種のTop10差枚を圧縮するメカニズムを評価するとき、
「平均差枚」だけを比べると台数の違いが見えなくなる。
3台機種の平均+5,000枚 と 20台機種の平均+5,000枚 では、後者がホール投資の大半を占めており、他機種への配分は激減する。
機種総差枚 = n × avg_diff が正しい「この機種がホール出玉バジェットのどれだけを使ったか」の指標。

## アクション
- 全台系イベントの「圧縮効果」分析には 機種総差枚（sum_diff または n×avg_diff）を使う
- 機種ランキングを作るときは avg_diff と sum_diff の両方を確認する
- ホール全体の出玉バジェットが一定だという仮定のもと、大台数機種の好調は他機種の低調を示唆
- 実装は未完了（今後のEDAタスクとして残存）

## 例
東京喰種（20台）× avg+3,000 = 機種総差枚 +60,000
ジャグラー（5台）× avg+5,000 = 機種総差枚 +25,000
→ 出玉バジェット的にはジャグラーより東京喰種の方が大きい日だった
