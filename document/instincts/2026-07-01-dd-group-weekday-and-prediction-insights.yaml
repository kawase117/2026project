# 機種入替が長期窓学習を無効化する — 個別台予測の根本的制約

## 背景
2026-06-27予測で、過去DD27実績のTop候補台と実際のTop10の重複が0-1件に留まった原因のひとつが機種入替。
蒲田7は1年以上のデータで「過去のTop台」が特定できても、その台が同一機種であり続ける保証がない。
機種入替後は台番号は同じでも全く別の機種が座っており、過去実績が無意味になる。

## アクション
- 個別台の学習窓は最大6ヶ月を上限として検討（機種サイクルを考慮）
- 台番号固定の特徴量を使う場合は最終入替日を必ずチェック
- 機種名+台番号の複合キーで管理し、機種変更時に実績をリセット
- 機種レベルの特徴量（機種別過去実績）は台番号より安定した代替になりうる

## 例
蒲田7 DD27 Top10候補台のうち、実際にDD27でもTop10だった台: 0-1件
主因: (1)7系×土曜が最弱曜日, (2)東京喰種全台系、(3)機種入替による学習データ無効化
推奨窓: 直近3-6ヶ月（機種入替サイクルより短く保つ）

