# 全台系イベントは平均差枚ベースでは予測不可 — ただし機種×曜日×DD条件で兆候あり

## 背景
2026-06-27の蒲田7で東京喰種全台系イベントが発生。事前の候補台予測はこれを全く捉えられなかった。
- 歴史的DD27における東京喰種のランク: 中位（rank=56/101）— 平均差枚ベースでは上位に来ない
- ただし 土曜×DD27 の東京喰種全台系イベント発生率: 2/3回=67%（全体ベースライン1.7%）
全台系が入ると非参加機種のTop10差枚が圧縮される（3000枚未満が並ぶ異常）。

## アクション
- 平均差枚・過去実績ランキングだけでは全台系イベントを予測できない
- 機種×曜日×DDの組み合わせ条件でフラグを立てる追加チェックが有効
- 土曜×DD27×東京喰種はほぼ全台系フラグ（n=3で過学習リスクあり、継続観察必要）
- 全台系が発生した日はその機種を除いたTop10実績が通常比で圧縮されることに注意

## 例
東京喰種×土曜×DD27 全台系発生率: 67%（2/3件）vs ベースライン1.7%
全台系発生日のTop10: avg 2,500-3,000枚（通常の Top10: avg 5,000枚以上）
全台系フラグ定義: plus率≥70% かつ n≥5台 の機種が出現した日

