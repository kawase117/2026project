# 曜日×イベント日×粗い空間軸(角番/列/台末尾)のEDA設計で詰めるべき論点

## 背景
蒲田七・蒲田一の曜日戦略の法則性を、台番号・台末尾・角番・列・機種名軸で検証したいという
依頼から実装プロンプトを作るまでに、以下の論点が次々と出てきた。
最初の提案(5等幅ビンで列を作る、台末尾を%10の10パターンにする等)は
いずれもユーザーから「既存のCSV/フラグで足りているのでは」と指摘され修正された。

1. **セグメント分割**: jug_flag/bt_flagでA-type/N-typeに分け、さらにフロア(2F/3F)で
   分割する。蒲田七は2F-A/2F-N/3F-A/3F-Nの4グループ、蒲田一(3Fなし)は2グループ。
   混ぜて集計すると軸の信号がセグメント間で打ち消し合う恐れがある。

2. **角番**: 新規に距離計算を作らず、既存 `kamata_corner_mirror_analysis.py` の
   `KAKUBAN_RULES`(メイン通路距離ベースのsection_rules)をそのまま再利用する。
   座標CSVには既に `rank_from_min`/`rank_from_max` も入っているが、
   ユーザーは既存ルール(メイン通路距離)を優先する方針を明示した。

3. **列**: 座標(X,Y)から5等幅ビンを作る案を出したが、座標CSVには既に
   `section`(machine_numberの範囲文字列、例"2001-2010")が島単位のグルーピングとして
   入っており、これをそのまま列カテゴリとして使う方が正確、との指摘を受けた。
   セクションは物理的に縦/横どちらの向きでも「島単位」として扱えば問題ない。

4. **台末尾**: `machine_number % 10` の10パターンだけでは
   `machine_detailed_results.is_zorome`(末尾2桁一致: 00,11,...,99)を表現できない。
   ゾロ目を別カテゴリとして切り出し、非ゾロ目は0-9の10パターン、
   ゾロ目はまとめて1パターン、で合計11パターンとする設計に修正した。

5. **イベント日の月末**: 固定リスト{1,7,11,17,21,27,30}に加えて「月末」をフラグ化する際、
   月によって28/29/30/31と変動するため、calendar.monthrange等でその月の最終日を
   動的に算出してフラグを立てる必要がある(固定の30日扱いにしない)。

6. **曜日 vs イベント日の交互作用**: 曜日とイベント日は独立フラグとして持ち、
   (a)全データでの曜日検定、(b)イベント日除外データでの曜日検定、の両方を実施し、
   イベント日を含めた方/除いた方どちらが信号(effect size, p値)が強いかを
   軸ごとに比較する設計が要求された。

## アクション
- 新規の距離計算・ビン化を提案する前に、既存CSV/既存ルール(KAKUBAN_RULES, section,
  rank_from_min/max, is_zorome, jug_flag/bt_flag)で代替できないかを先に確認する。
- カテゴリ軸の「パターン数」を提案する際は、ドメイン固有のフラグ(ゾロ目など)が
  既存のbinning(%10やN等分ビン)で表現しきれているかをチェックする。
- 日付ベースのイベント日定義は月末を固定値にせず、月ごとの実際の最終日で判定する。
- 多軸×多セグメントのEDAでは、セグメント別に完全に分離して集計し、
  曜日とイベント日のような複数の時間軸要因は独立フラグとして持ち、
  含む/除外の両方で効果量を比較できる設計にする。

## 例
蒲田七3F-Aセグメントで「列=section, 軸値='3341-3362', 曜日=土」の
mean_diffを見る際、is_zorome台がその列に複数含まれていれば
台末尾軸では「ゾロ目」カテゴリとして別集計され、%10の "1" や "2" と
混在しない。イベント日(例: 2026年2月28日=月末)は固定リストの30日とは
別フラグとして扱われ、土曜×イベント日込み/除外の両方でmean_diffを比較する。
