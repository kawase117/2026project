# 抽出メタデータの長期保持設計

## 背景

Wiki運用の規模拡大に伴い、frontmatterに`tags`と`auto_tagged_extracted`の両フィールドを保持すべきかが問題になった。

初期判断：セッションログのみに記録する（ストレージ削減）。しかし記事規模拡大を考慮すると、タグの統一化機会が増加。カテゴリ拡大に伴い、タグ設計の見直し頻度も上昇。

## アクション

**結論：両フィールドを永続的に保持すべき**

理由：
1. 監査証跡として機能 — なぜそのタグが付いているのか、Janomeが抽出したからという根拠が明確
2. 再抽出コスト削減 — セッションログのみだと、後で情報が必要な時に再処理が必要
3. スケーラビリティ — 記事が増えるほど、この情報の価値が指数関数的に増加
4. メンテナンス効率 — タグ統一化時に、複数記事での表記揺れを `git grep` で即座に検出可能

## 例

frontmatterの最終形式：
```yaml
tags: [health, 医療, 検査結果, 血液]
auto_tagged_extracted: [クレアチニン, 基準値, 測定]
```

月次ヘルスチェックでタグ統一化が必要な場合、`auto_tagged_extracted` があると同義語検出が自動化可能。

