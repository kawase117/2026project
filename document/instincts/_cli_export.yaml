# Frontmatter フィールド順序の標準化

## 背景

Wiki記事のfrontmatterが複数フィールドを持つようになり、フィールド順序が統一されていなかった。処理メタデータ、処理履歴、ユーザー操作が混在。

## アクション

**推奨フィールド順序（視認性とグループ化）：**

1. source, compiled（ソース情報）
2. tags（最重要）
3. auto_tagged_date, auto_tagged_extracted（自動処理メタデータ）
4. read（ユーザーメタデータ）

メリット：視認性向上、優先度が明確、新フィールド追加時の位置が決めやすい

## 例

```yaml
source: raw/notes/xxx.md
compiled: 2026-05-18
tags: [health, 医療]
auto_tagged_date: '2026-05-18'
auto_tagged_extracted: [...]
read: false
```

