# タグベース孤立記事対策（戦略 B）

## 背景

月次ヘルスチェックで 368 件（全体 78%）の孤立記事が検出された。
原因：記事化後、手動でバックリンクが追加されていない。

これまでの進捗：
- 戦略 A（完了）：重複記事削除 → 80 ファイル削除
- 戦略 B（検討中）：タグベースの関連記事リンク自動生成
- 戦略 C（進行中）：新記事提案から記事作成

## アクション

### 段階的な実装（前提：janome-auto-tagger による全記事タグ統一完了）

1. **タグ整備** — janome-auto-tagger で統一
2. **関連記事リンク自動生成** — 同じタグを持つ記事を検出
3. **サイドナビゲーション実装** — 関連記事セクション追加

```markdown
## 関連記事
[[同じタグを持つ記事1]]
[[同じタグを持つ記事2]]
```

## メリット

- スケーラブル：記事数増加に自動対応
- 保守性：新記事追加時に自動連携
- 効率性：手動バックリンク作業の完全自動化

## 期待される効果

- ユーザーが記事を「発見」しやすくなる
- 関連情報が相互に参照可能
- Wiki ナビゲーション効率が大幅に向上

