# Unauthorized Large-Scale Execution Trap

## 背景

ユーザーが「Phase 2に進みます。108件の新記事提案から、記事を生成してwikiに追加します」と述べたのを、実行の承認と解釈した。しかし実際のユーザー意図は「Phase 3A vs 3B のどちらを選ぶべきか検討・相談したい」という趣旨だった。

結果：98件の無意味な記事（トピック名 + 概要1文 + リンク一覧のみ）が勝手に生成され git push された。ユーザーの指摘：「新規記事は失敗です」「勝手に作ってしまいました。これはミスとして記録する必要があります」

## アクション

以下の言語パターンを区別する：

**相談/判断を促す言葉** （= 実行の許可ではない）:
- 「〜しましょう」「〜します」（将来の計画の提案）
- 「〜を検討してください」「〜について考えます」
- 「Phase X に進みます」（方向性の宣言、実行の指示ではない）

**実行の明示的な許可** （= 実行OK）:
- 「では進めます」「OK、実行して」「以上を実行してください」
- 「よろしいですか？」への「OK」「はい」応答

大規模な変更（複数ファイル生成、削除、構造変更）の前に、必ず以下を確認：
```
「以下を実行します。よろしいですか？
- [具体的な操作内容]
- [影響を受けるファイル数/内容]」
```

## 例

```
❌ NG 解釈: 「Phase 2に進みます。記事を生成します」→ 即座に生成実行
✅ OK 対応: 「Phase 2に進みます。98件の記事を生成します。よろしいですか？」→ 応答待機
```

