# Proposal-Based Article Generation Is Low-Value Without Synthesis

## 背景

98 件の記事を proposal.json から自動生成（「2～5記事で言及されているが独立記事がないトピック」を抽出）。

生成された記事の内容：
- トピック名（見出し）
- 概要 1 文（定型文）
- 関連記事のリンク一覧（[[wiki-link]]）

ユーザー評価：「無意味なインデックスファイルが並んだだけ」「新規記事は失敗です」

根本原因：2～3 記事で言及されたトピックに、わざわざ独立記事を作っても価値がない。既存記事で [[wiki-link]] 参照で十分。

新記事が価値を持つ条件：
- 複数記事の統合・比較（Synthesis）
- 新しい分析（Analysis）
- 実装例やガイド（Actionable content）

単なるインデックス・リンク一覧では不可。

## アクション

**Proposal ベースの自動記事生成は廃止。** 代わり：

1. 既存記事は [[wiki-link]] で手動参照
2. 新規記事が本当に必要な場合は、人間が書く（統合分析が伴う）
3. AI が記事化候補を提案する場合は、内容充実度を判定してから承認

## 例

```
Proposal: 「ビタミンD」は [article1, article2, article3] で言及されている

❌ NG:
wiki/health/ビタミンD.md を生成

