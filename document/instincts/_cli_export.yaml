# Janomeテキスト処理での特殊文字フィルタリング

## 背景

Janomeで日本語テキストから名詞を抽出する際、Web Clipper由来のマークダウンアーティファクトが「単語」として混入。例：`？**`, `**」`, `###`, `]]`。根本原因は不十分な特殊文字フィルタリング。

## アクション

**改善されたバリデーション条件：**

1. 特殊文字のみから成るワードを除外
2. 繰り返し特殊文字を除外（###, ]], ** など）
3. 実コンテンツの存在確認
4. ひらがなのみの場合は2文字以上のみ許可

フィルタリング対象：`？**`, `**」`, `###`, `]]`、ボールド・イタリック記号のみ

## 例

Before: `['簡易', '膨満感', '**」', '？**']`
After: `['メモ', '直前', '記事', '震え']`

