# Tag-Based Backlinks Without Semantic Validation Are Harmful

## 背景

auto_link_orphans.py はタグマッチングのみでバックリンクを自動追加した。結果：

スマートウォッチ購入ガイド（tech カテゴリ）に以下が接続：
- 「Claude_Code_の_AskUserQuestionTool...」(AI関連)
- 「宇宙の膨張速度...」(物理学)
- 「YouTubeダウンロード...」(ユーティリティ)

タグが偶然共通する単語を持つだけで、内容的には全く関係ない。

害 > 利益：ユーザーが記事をナビゲートする際に、無関係な記事へのリンクは混乱と信頼低下を招く。

## アクション

**タグベースの自動バックリンクは廃止。** 代わりに以下を採用：

1. **セマンティック関連性チェック** — 本文ベクトル類似度を計算し、閾値以上の記事のみリンク
2. **手動キュレーション** — AI提案を受けるが、ユーザー/著者が明示的に承認した記事のみ追加
3. **記事内手動参照** — 著者が [[wiki-link]] を記事本体で明示的に追加（自動化しない）

実装なしで当面は停止。

## 例

```
❌ NG: auto_link_orphans.py が tags[0] 一致度で全記事をスキャン → 無関係な記事も接続
✅ OK: 著者が「このトピックは [[related_article]] で言及されている」と明示的に追記
```

