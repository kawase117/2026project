# 新記事提案の基準と生成方法

## 背景

ヘルスチェック CHECK4 で 43 件の新記事提案が自動抽出された。
これは記事の tags フィールドを分析し、複数記事で言及されているが専用記事がないトピックを検出したもの。

提案対象の例：医療（5記事）、書評（5記事）、サプリメント（4記事）、栄養（4記事）

## アクション

### 生成基準（tag frequency）

```
1 記事で言及  → スキップ（個人メモレベル）
2～5 記事で言及  → 生成候補 ✓
6+ 記事で言及  → 既存記事の統合を検討
```

### 生成フロー

1. 提案トピック確認（言及数 4～5 件を優先）
2. スタブ記事作成（概要 + 関連記事）
3. 参照元への逆リンク追加
4. カテゴリインデックス更新
5. Git commit

### スタブテンプレート

```markdown
(frontmatter)
type: article
tags: [カテゴリ, 主トピック, サブ1, サブ2]
source_articles: [参照元ファイル一覧]
compiled: YYYY-MM-DD
(end frontmatter)

# [提案トピック]

## 概要
このトピックは複数の記事で言及されており、独立した記事が必要と判定されました。

## 関連記事
[[参照元1]]
[[参照元2]]
```

## 期待される効果

- スキルで定義したトピックを効率的に記事化
- ユーザーの関心分野を自動検出
- Wiki 知識体系をバランスよく拡張

