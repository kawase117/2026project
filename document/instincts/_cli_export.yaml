# Janome Auto-Tagger による段階的タグ統一戦略

## 背景

月次ヘルスチェック（2026-05-18）で以下が判明：
- 368 件の孤立記事（全体の 78%）がバックリンク 0
- 重複記事 71 グループが削除され、記事数が 470 → 390 件に削減
- タグベースの孤立記事対策を提案されたが、現在のタグが手動・不完全

手動タグ付けの課題：
- 表記揺れ（「サプリ」vs「サプリメント」）
- 見落とし（記事に含まれるが未タグ化されたキーワード）
- 不統一（タグ数が記事ごとにばらばら）

## アクション

**段階的な自動タグ統一を実施：**

### フェーズ 1: パイロット（小規模テスト）
```bash
/auto-tagger wiki/health/ --dry-run
```
- 1 つのカテゴリ（health: 14 件）のみで事前確認
- 抽出されたタグと統合結果をプレビュー
- タグ増加・削減の傾向を把握

### フェーズ 2: スポット検証
- サンプル 5～10 件を人間が目視確認
- Janome 形態素解析の過剰・不足タグを検出
- stopwords.json を必要に応じて調整

### フェーズ 3: 全カテゴリ処理
```bash
/auto-tagger wiki/ --auto-commit
```
- 全 390 件をバッチ処理
- frontmatter 自動更新
- `auto_tagged_date`, `auto_tagged_extracted` フィールド追加

### フェーズ 4: タグベース孤立記事リンク実装
- 統一されたタグが完成した後
- タグベースの関連記事リンク自動生成
- 孤立記事問題を解決

## 重要な設定

**janome-auto-tagger constraints（config/tag_constraints.json）:**
- health: max_tags 4, stopwords [体, 方, 本, 等]
- slot: max_tags 4, machine_position 1（ホワイトリスト検証）

**マージルール：**
- Category（第1要素）は常に保持
- 重複排除（最初の出現を優先）
- max_tags で上限制限（category + n content tags）

## 期待される効果

- タグの統一性向上（表記揺れ除去）
- 隠れたキーワード発見（記事本文から自動抽出）
- タグベースナビゲーション実装の前提条件整備
- 孤立記事問題の根本解決への道筋

## 例

**Before (health/サプリメント.md):**
```yaml
tags: [health, サプリメント, 睡眠]
```

**After (auto-tagger 実行後):**
```yaml
tags: [health, サプリメント, 睡眠, ビタミンD]
auto_tagged_date: 2026-05-18
auto_tagged_extracted: [ビタミンD, マグネシウム, 栄養]
```

