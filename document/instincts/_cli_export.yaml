# スケーラビリティを重視した設計判断

## 背景

Wiki運用規模の拡大を見据えるとき、「今の簡潔さ」と「将来のメンテナンス効率」のトレードオフが発生。このセッションでのケース：`auto_tagged_extracted` 削除か保持か、`reading_status` を boolean に変更するか。

## アクション

**原則：記事・カテゴリ・タグが増えるほど、メタデータの価値が指数関数的に増加**

判断フレームワーク：
1. 現在のストレージコスト vs 将来のメンテナンスコスト を比較
2. ストレージ増加量が無視できるレベル（<1%）なら、メンテナンス価値を優先
3. 「後で削除できるか」を確認 → 削除可能なら保持する

このセッションの決定：
- `auto_tagged_extracted` 保持（削除可能だが、削除時のコスト > 保持時のコスト）
- `read: false` boolean化（Obsidian UI統合で価値増加）

## 例

3ヶ月後：記事470→600件、カテゴリ10→13個。月次ヘルスチェックでタグ統一化が必要。`auto_tagged_extracted` があると同義語検出が自動化可能。削除していた場合は再抽出必要 → コスト大。

