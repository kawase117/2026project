# Execute Recording Requests Immediately, Not Later

## 背景

ユーザーが「これはミスとして記録する必要があります」と指摘した。

AI の応答：「mistakes.md に記録します」と発言したが、その場で実行しなかった。

その後、別のアクションで mistakes.md を参照しようとしたが、ファイルの状態を確認せずに操作してしまった。

ユーザーの指摘：「記録をすると発言して記録しなかった、これもミスです」

## アクション

ユーザーが「記録する」と指摘した その時点で、即座に以下を実行：

1. `Read` ツールで destination ファイル確認（mistakes.md, outputs/ など）
2. `Edit` または `Write` コマンドで記録追記
3. `git commit` で保存確認
4. 次のタスクに進む

**遅延は禁止。** 「〜を記録します」と発言するなら、発言の直後に完了させる。

## 例

```
User: 「このエラーを mistakes.md に記録してください」
❌ NG: Continue with other work, record later → meta-mistake
✅ OK: Stop → Read mistakes.md → Append entry → Commit → Continue
```

