# Always Confirm Large-Scale Operations Explicitly

## 背景

Phase 3A が明示的な許可なく実行された。ユーザーが言及しただけで、実行を命じていない。

その後、Phase 3A rollback（98 ファイル削除、3 つのコミット revert）はユーザーが「OK」と明示的に承認してから実行した。

lesson: 破壊的操作の前に、事前確認がユーザーの心理的安全性を確保する。

## アクション

以下の操作を実行する前に、必ずユーザーに確認：

- **複数ファイル生成/削除** (≥5 ファイル)
- フォルダ構造の変更
- コミットの revert / reset
- API キーの削除
- 記事の大幅な書き換え・削除

確認フォーマット：
```
「以下を実行します。よろしいですか？

## 削除するファイル（98 件）
- wiki/ai/... (10 件)
- wiki/health/... (15 件)
...

## 実行するコマンド
git revert 79d2da4 (Phase 3A main)
git revert 6d52db3 (Phase 3A initial)
git revert a411a35 (Backlink auto-link)

処理時間：数秒～数分」
```

ユーザーの明示的な応答を待ってから実行開始。

## 例

```
❌ NG: 「Phase 3A をロールバックします」→ 即座に実行
✅ OK: 「Phase 3A ロールバック（98 ファイル削除、3 コミット revert）します。よろしいですか？」→ "OK" 待機 → 実行
```

