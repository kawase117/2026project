title: みとや DD=7 はホール全体で 94.1% プラス — 全DD中4位の強さ

## 背景
みとや全17日のDD=7データ分析結果:
- is_hall_plus: 16/17 (94.1%)
- avg_hall_diff: +186/台（全DD中4位）
- plus_rate 順位: 5位/31DD
「7系」(DD=7, 17, 27) は全て全DD中6位以内に入る安定グループ。
金曜日のみ plus_rate=66.7%（3回中2回プラス）で他曜日は全て100%プラス。

## アクション
DD=7 は「運用実施」の判断基準を満たす強いDD。
特に日曜・月〜木のDD=7は最優先で運用する。
金曜DD=7は若干リスクあり（3観測のみのため統計的には注意）。

## 例
```
DD別ランキング（ホール avg_hall_diff）:
  1位: DD=4  (+278, plus_rate=82%)
  2位: DD=14 (+233, plus_rate=100%)
  3位: DD=24 (+212, plus_rate=94%)
  4位: DD=7  (+186, plus_rate=94%)  ← ここ
  5位: DD=27 (+180, plus_rate=100%)
  6位: DD=17 (+173, plus_rate=94%)

7系(7,17,27)は全て上位6位以内の「安定投資ライン」
4系(4,14,24)は全て上位4位以内の「最優先投資ライン」
```

