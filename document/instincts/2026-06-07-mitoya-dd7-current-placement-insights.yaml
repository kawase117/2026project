title: 同一機種が複数セクションに出現する — n_dates ではなく last_seen で現在配置を判断する

## 背景
ゴッドイーター リザレクションは 501-522 → 523-539 → 574-590 → 557-573 → 624-640 → 608-623
と複数回移動している。機種×セクション単位で集計すると「624-640: n=5」「608-623: n=8」と
両方残り、n_dates が多い 608-623 が現在配置と判断できるが、
n_dates が少ない方が最新の場合もありうるため MAX(date) = last_seen の大小で判断する。

## アクション
機種の現在配置を確定するには MAX(date) が最大のセクションを採用する。
複数セクションに同一機種が出現した場合は必ず移動履歴を確認してから分析に使う。

## 例
```sql
-- 特定機種の配置履歴確認クエリ（last_seen 降順）
SELECT
  machine_name,
  COALESCE(section, 'unknown') as section,
  MIN(date) as first_seen,
  MAX(date) as last_seen,
  COUNT(DISTINCT date) as n_days
FROM machine_detailed_results m
LEFT JOIN machine_layout ml ON m.machine_number = ml.machine_number
WHERE machine_name LIKE '%ゴッドイーター%'
GROUP BY machine_name, section
ORDER BY last_seen DESC;
-- → last_seen が最大のセクションが現在の配置
-- → n_days が多くても last_seen が古ければ旧配置
```

