title: EDA前に現在の機種配置を必ず確認する — 撤去済み機種の成績は運用に使えない

## 背景
DD=7 EDA を実施したところ「スマスロ北斗の拳 (540-556/557-573)」が最優先Aと判定されたが、
実際には 2026/05/10 以前に全て撤去済みで現在は存在しない機種だった。
歴史データ全期間を使った分析では「現在稼働していない機種」も上位に入るため、
運用直前に必ず「現在配置の確認」ステップを挟まないと意思決定に使えない。

## アクション
特定DDのEDAを実施する際は以下の順序を守る:
1. 全期間データで機種×DDパターンを分析（どの機種が強いか）
2. **直近30日 (date >= 'YYYYMM01') で現在稼働中の機種×セクションを抽出**
3. 2のリストで1の結果をフィルタ（is_current フラグ）
4. 撤去済み機種は「参考：旧配置での実績」として分離表示

クエリ例: `WHERE m.date >= '20260501' GROUP BY machine_name, section` で現在配置を確定。
日付比較は YYYYMMDD テキスト形式のため `DATE()` 関数は使えない。文字列比較で行う。

## 例
```python
# ステップ2: 現在稼働中の機種×セクションを取得
q_current = '''
SELECT DISTINCT m.machine_name, COALESCE(ml.section,'unknown') as section
FROM machine_detailed_results m
LEFT JOIN machine_layout ml ON m.machine_number = ml.machine_number
WHERE m.date >= '20260501'
'''
df_current = pd.read_sql_query(q_current, con)
current_keys = set(zip(df_current['machine_name'], df_current['section']))

# ステップ3: DD分析にis_currentフラグを追加
df_dd['is_current'] = df_dd.apply(
    lambda r: (r['machine_name'], r['section']) in current_keys, axis=1
)
df_live = df_dd[df_dd['is_current']]  # 現在有効な分析のみ使う
```

