title: みとや DD=7 現役機種の強パターン（2026-06時点）

## 背景
2026-06時点の現役配置でDD=7に強い機種×末尾を調査した結果。
スマスロ北斗の拳（旧最強機種）は撤去済みで使えない。
現在の主役は ゴッドイーター リザレクション(608-623) と モンキーターンV(591-607)。

## アクション
DD=7（7日・17日・27日）の狙い目（信頼性 n>=6 のみ）:

**優先度A:**
- ゴッドイーター リザレクション (608-623): 末尾1 avg+3903(n=8), 末尾4 avg+4425(n=6)
- モンキーターンV (591-607): 末尾6 avg+1604(n=22), 末尾9 avg+1309(n=17)
- かぐや様は告らせたい (624-640): 末尾4 avg+1333(n=12), 末尾6 avg+875(n=12)

**避けるべき:**
- ゴッドイーター (608-623): 末尾0 avg-1478, 末尾8 avg-1021
- モンキーターンV (591-607): 末尾8 avg-599
- 東京喰種 (574-590): DD=7 全体 lift=-91（DD=4専用機種）
- マギアレコード (501-522): DD=7 全体 lift=-56（DD=17専用機種）
- 戦国乙女4 (608-623): avg-761

**注意:**
2026/05/11以降設置のモンスターハンターライズ(624-640)はDD=7未観測。
旧配置(574-590)では末尾2/5/1が強かったため参考にする。

## 例
```
DD=7 狙い目サマリー（2026-06時点）:
  608-623 ゴッドイーター   末尾1/4 → 最優先（n=8/6）
  591-607 モンキーターンV  末尾6/9 → 最優先（n=22/17 高信頼）
  624-640 かぐや様        末尾4/6 → 優先（n=12）
  624-640 モンハンライズ  末尾2/5/1 → 旧配置参考値・初観測待ち

ホール全体: 17日中16日プラス(94.1%), avg+186/台
金曜のみリスクあり（3回中1回マイナス）、日曜は100%プラス
```

