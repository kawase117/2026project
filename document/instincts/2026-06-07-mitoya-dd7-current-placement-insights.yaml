title: 新設置機種の初DD観測日は旧配置・同機種の実績を参照して期待値を推定する

## 背景
2026/05/11設置のモンスターハンターライズ(624-640)はDD=7のデータが未収集。
同機種が旧配置(574-590)にいた期間のDD=7実績は avg+591(n=9, lift=+526)と強かった。
機種固有の高設定投入パターン（DD×末尾）は配置場所が変わっても継承される可能性があり、
新機種の特定DD初観測前の期待値推定に利用できる。

## アクション
新機種の特定DDデータが不足している場合:
1. 同機種の「別セクション配置時」のDD実績をクエリする
2. 「同機種のDD=Xパターン（旧配置参考）」として信頼度を下げて提示
3. 実際に観測された後は旧データと新データを両方保持して推移を確認
4. 2〜3回の観測後に信頼度を再評価する

## 例
```sql
-- 特定機種の全配置・全DDにわたる実績を取得
SELECT
  COALESCE(ml.section,'unknown') as section,
  CAST(SUBSTR(m.date,7,2) AS INTEGER) as dd,
  AVG(m.diff_coins_normalized) as avg_diff,
  COUNT(DISTINCT m.date) as n_dates
FROM machine_detailed_results m
LEFT JOIN machine_layout ml ON m.machine_number = ml.machine_number
WHERE m.machine_name LIKE '%モンスターハンターライズ%'
GROUP BY section, dd
HAVING n_dates >= 3
ORDER BY section, dd
-- → 旧配置での実績から現在配置での期待値を推定
-- → 初観測後に旧実績との乖離を確認して信頼度を更新
```
