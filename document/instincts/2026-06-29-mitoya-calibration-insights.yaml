# みとやではセクション内の予測シグナルがほぼ存在しない

## 背景
18セクション×5コンポーネントのSpearmanを60日walk-forwardで検証。
主力セクション（641-657, 540-556, 675-691等）は全コンポーネントで非有意。
有意になったのは補助・準主力の一部でc_cornerやc_debut_secの反予測的シグナルのみ。
セクションあたり9〜22台しかなく、セクション内ランキングではサンプル不足で信号を検出できない。
Top5評価でも全18セクションでWilcoxon非有意。

## アクション
- みとやではセクション内の台選びに予測モデルを適用しても統計的改善が期待できない
- セクション横断のhist_metricランキング（全266台からhist上位を選ぶ）が現実的
- セクション選択（主力/補助の判別）はtheoryの優先度テーブルに従う
- セクション内の台選びは現時点ではランダムと同等

## 例
主力セクション（xdays限定、Spearman）:
  501-522: 全コンポーネント ns
  540-556: 全コンポーネント ns
  574-590: 全コンポーネント ns
  641-657: 全コンポーネント ns
  675-691: hist rho=-0.14*, c_corner rho=-0.15* (反予測)

