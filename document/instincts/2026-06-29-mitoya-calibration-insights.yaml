# みとやのセグメントはセクション（島）単位であり、蒲田7のLR×A/Nは適用不適切

## 背景
蒲田7はフロア×LR×A/Nで6セグメントに分割し、セグメント別に戦略を変えることが有効だった。
みとやは全台2F（フロア分割なし）、18セクション（島）が分析の基本粒度。
LR×A/Nで分割（2F_L_A, 2F_L_N, 2F_R_A, 2F_R_N）すると、セクション構造が無視され、
同じ島内でL側とR側で別機種が配置されている構造（section×y分割が必要）と矛盾する。
実際、LR×A/Nで検証したところ全セグメントで全コンポーネントが非有意だった。

## アクション
- みとやではsection（島）を基本セグメントとして使う
- 蒲田7のスコアリングモデル（config.pyのセクション定義やSEGMENT_WEIGHTS）を直接適用しない
- ホールごとにセグメント定義を確立してからモデルを適用する
- mitoya_theory.mdのセクション優先度テーブルが正しい粒度

## 例
蒲田7: 2F_L_N, 2F_R_N, 3F_L_A, 3F_L_N, 3F_R_A, 3F_R_N（フロア×LR×A/N）
みとや: 501-522, 523-539, ..., 805-815（島単位18セクション、主力/準主力/補助の3段階）
変数の有効性もセクションごとに異なる（debut_phase, day_of_week, last_digit, is_zorome）
