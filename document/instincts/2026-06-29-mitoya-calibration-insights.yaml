# xdaysではc_cornerとc_dow_secが反予測的 — ホールが通常パターンを避けている可能性

## 背景
xdays限定（13日、n=3,458）でキャリブレーション検証した結果:
- c_corner: rho=-0.052, p=0.002 (D0=38.2%→D9=30.3%, -7.8pp) — 過去に角番で好成績だった位置ほどxdaysでは当たらない
- c_dow_sec: rho=-0.041, p=0.016 (D0=36.7%→D9=27.3%, -9.5pp) — 曜日パターンも逆
- hist_metric: rho=+0.034, p=0.044 — xdaysでも正方向で有意（台個別の過去成績は日付カテゴリに依存しない）

通常日ではc_cornerは非有意（rho=+0.001）なので、xdays特有の現象。
ホールがxdaysに通常とは異なる設定投入パターンを使っている可能性があるが、xdays=13日しかないためサンプル不足で断定できない。

## アクション
- xdaysに角番位置や曜日パターンを正方向の予測に使ってはならない
- xdaysでもhist_metricは正方向で使える
- この知見はconfidence=0.80（サンプル13日は少ない）。データ蓄積後に再検証が必要

## 例
xdays限定Spearman:
  c_corner:    rho=-0.052 ** (D0=38.2%, D9=30.3%) ← 反予測
  c_dow_sec:   rho=-0.041 *  (D0=36.7%, D9=27.3%) ← 反予測
  hist_metric: rho=+0.034 *  (D0=27.7%, D9=34.0%) ← 正常に機能

通常日:
  c_corner:    rho=+0.001 ns
  hist_metric: rho=+0.047 *** (D0=25.5%, D9=33.6%) ← 通常日の方が強い

