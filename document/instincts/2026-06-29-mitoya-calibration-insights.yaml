# みとやでもhist_metricが最強の予測シグナル（蒲田7と共通）

## 背景
60日walk-forward（n=15,960）でみとやのコンポーネント別キャリブレーションを検証。
hist_metric: rho=+0.042, p<0.0001, D0=26.0%→D9=33.4%（+7.4pp）。
c_dd_sec: rho=+0.017, p=0.036（弱い正）。
c_dow_sec, c_debut_sec, c_corner: 全て非有意。
蒲田7（rho=+0.038, +6.0pp）と同等以上の効果量で、ホール横断的にhist_metricが有効。

## アクション
- みとやでもhist_metric（台個別の過去104%超え率）を予測の中核に使う
- DD構造はグローバルでわずかに有意だが、セクション内では全て非有意 — セクション内台選びには使えない
- 曜日・debut_phase・角番位置はグローバルで予測力なし

## 例
グローバルSpearman（みとや、60日）:
  hist_metric: rho=+0.042 *** (D0=26.0%→D9=33.4%)
  c_dd_sec:    rho=+0.017 *   (D0=29.5%→D9=32.6%)
  c_dow_sec:   rho=+0.001 ns
  c_debut_sec: rho=+0.006 ns
  c_corner:    rho=-0.014 ns

