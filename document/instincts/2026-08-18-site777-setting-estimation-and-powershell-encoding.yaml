# 順序付きカテゴリの信用度は「1位と2位の差」ではなく「高群vs低群の比」で測る

## 背景
site777の設定推定(scraper/site777/setting_estimator.py)で、累計BB・RBの二項尤度から
パチスロ設定1〜6を推定する際、最初は「最尤カテゴリと2位の尤度差」を信用度の指標にした。
実データ78台で検証したところ、全78台が最低ランク「低」に潰れた。原因は、設定が
順序付きカテゴリでスペック値が単調に変化するため、1位と2位は統計的にほぼ必ず隣接する
設定になり、差が構造的に小さくなること。回転数をいくら増やしてもこの差は開かない
(合成2万試行で確認: 8,000G回しても隣接設定同士の尤度差は小さいまま)。

一方、「高設定側グループ(設定5,6)の最大尤度」対「低設定側グループ(設定1〜4)の最大尤度」
の比に置き換えると、実データで 高5/中19/低53 のように意味のある分布に分かれた。
判定できるのは「どちらの群に属するか」であって「どの設定か」ではない、という認識が
指標選択の分かれ目になる。

## アクション
順序があり値が単調に変化するカテゴリ(パチスロ設定、成熟度レベル、リスク段階など)を
尤度・事後確率で推定する実装をレビュー・設計するときは、信用度に
「1位vs2位の差」を使っていないか確認する。使っていれば、意味のある小グループ
(例: 高設定側 vs 低設定側)へまとめてから群間比を取る設計に直す。
群分けの境界(この場合は設定4/5の間)は、スペック表上で実際に判別可能な位置に置く。
単一のピンポイント推定値だけを出さず、「否定できない範囲」も併記する。

## 例
site777の実装(2026-08-17〜18時点):
```python
# 悪い例: 1位と2位の尤度差 -> 実データ78台が全て「低」に潰れた
gap = scores[best] - scores[second]

# 良い例: 高群と低群の最大尤度比
high_low_log_ratio = max(scores[s] for s in (5,6)) - max(scores[s] for s in (1,2,3,4))
```
`ml/experiments/jug_rb_setting_prediction/stage2_daily_posterior.py` は全事後分布の
エントロピーで信用度を出しており同じ罠を踏んでいないが、今後この種の指標を追加する
実装(新規設定推定・段階推定機能)では上記を優先確認する。

