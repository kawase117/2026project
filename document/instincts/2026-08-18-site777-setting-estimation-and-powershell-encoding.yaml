# .ps1に日本語を書くと、構文エラーにならず黙って化けることがある

## 背景
2026-08-17のsite777ライブ実行で、run_site777_complete.ps1内の
`--reference-db (Join-Path $projectRoot 'db\楽園蒲田店.db')` という文字列リテラルが
`db\楽園蒲田庁Edb` に化け、収集26分・グラフ364台を全て終えた最後の解析段階で
FileNotFoundErrorになった。翌日の再実行では、CLI(playwright-cli)の出力に含まれる
機種名(パチスロ 新鬼武者2)が化けてJSON構造が壊れ、ConvertFrom-Jsonが失敗した。

原因はWindows PowerShell 5.1がBOMなしUTF-8の.ps1をコンソールのANSIコードページ
(cp932)として読むこと。pwsh.exe(PowerShell 7)なら正しく読むが、この環境には
pwshが入っておらず、.cmd入口は常にpowershell.exeへフォールバックする。

厄介なのは挙動の非対称性: 日本語**コメント**は数行先で`UnexpectedToken`という
分かりやすい構文エラーになるが、日本語**文字列リテラル**は構文エラーにならず
実行時に黙って別の文字列へ化ける。ネイティブCLIの標準出力も同じ理由で化けるため、
`[Console]::OutputEncoding`と`$OutputEncoding`をUTF-8に固定する処置が要る。
`db/`に残る0バイトの`楽園転田店.db`は、同種の事故が過去にも起きていた痕跡。

## アクション
このプロジェクトの.ps1に日本語を一切書かない。コメントは英語にする。
日本語を含む値(ファイルパス、機種名など)はPS1にリテラルで埋め込まず、
Python側の定数解決やJSON設定ファイル経由で渡す。
ネイティブCLI(playwright-cli等)を呼ぶ.ps1では、呼び出し前に
`[Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)` と
`$OutputEncoding = [System.Text.UTF8Encoding]::new($false)` を設定する。
点検は構文チェックではなく非ASCII行の検出で行う:
`LC_ALL=C grep -an '[^ -~\t]' *.ps1` (0件になるまで直す)。
構文チェック(`[System.Management.Automation.Language.Parser]::ParseFile`)は
文字列リテラルの化けを検出できないため、これだけでは不十分。

## 例
```powershell
# 悪い例: 日本語文字列リテラルが黙って化ける
--reference-db (Join-Path $projectRoot 'db\楽園蒲田店.db')

# 良い例: パスを渡さず、Python側のデフォルト解決に任せる
# (reference.py の DEFAULT_REFERENCE_DB が同じパスを解決する)
--setting-report-output $settingReport
```
```powershell
# CLI出力を受け取る.ps1では起動前に必須
[Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
$OutputEncoding = [System.Text.UTF8Encoding]::new($false)
```
