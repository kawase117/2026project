# 角番(corner number)は「基準点からの距離ランク」一発で自動化できる場合がある

## 背景
蒲田1・蒲田7のフロアで「角番(各セクション内で入口/主通路に最も近い台=角番1、
遠いほど番号が増える)」を定義したい要望があった。
各セクション(島の1列)はmachine_numberの昇順がX(またはY)の昇順/降順どちらにもなり得るため、
最初は「セクションごとに方向フラグを手動指定する」(みとや方式、DELTAS辞書的)
アプローチを想定していた。

しかし実際にユーザーから「このセクションでは機種番号Aが入口に近い」という
アンカー情報をいくつか教えてもらい、それぞれのX,Y座標を基準点候補からの
距離で比較したところ、**蒲田7では `|X - C|`(Cはアイル中心のX、フロアごとに1個の定数)**、
**蒲田1では `(X,Y)から単一の基準点(3,21)へのユークリッド距離`** という
**たった1〜2個の定数だけで全セクションの方向を統一的に説明**できた。
アンカー20点全て(蒲田1)が1つの基準点からの距離ランクで一致するという
強い一致率が、ルールの正しさを裏付ける根拠になった。

セクションが途中でX方向→Y方向に曲がる「BOTH」型(蒲田7の2330-2351, 3341-3362)も、
曲がり部分を除けば距離ランクの順序と`(末尾番号+1)-machine_number`の順序が一致し、
後者の式で代用できることを確認した。

## アクション
1. ユーザーから「このセクションでは台番号Xが基準位置(入口/主通路)に近い」という
   アンカー情報を3〜5個以上集める。
2. 各アンカーについて、セクション内の両端(または複数候補)のX,Y座標を取得。
3. 「Xのみの距離`|X-C|`」と「2点間ユークリッド距離」の両方で、
   Cや基準点をいくつか仮定し、アンカー全てで「近い方=指定された台」が
   成立する定数・基準点を探す。
4. 1つの定数/基準点で大多数(理想は全数)のアンカーが一致したら、
   それを全セクションに適用する一般ルールとして採用してよい。
   一致率が低い場合のみ、セクションごとの方向フラグ方式にフォールバックする。
5. 曲がり区間(BOTH)は、曲がり前後で距離ランクの順序が
   `±(machine_numberのシフト)`と一致するか確認し、一致すれば
   `角番 = (定数) ± machine_number` の単純な式に置き換えてよい。

## 例
```python
# 蒲田7 2F: アイル中心定数1個で左右ブロック両方を統一
kakuban = rank(abs(X - 18))  # 左ブロック(X<=17)はXが大きいほど角番1、右ブロック(X>=19)はXが小さいほど角番1

# 蒲田1 2F: 基準点(3,21)への距離1個で全31セクションを統一
import numpy as np
dist = np.hypot(X - 3, Y - 21)
kakuban = rank(dist)  # セクション内ランク、距離が小さいほど角番1

# 曲がり区間は機種番号の式に置き換え可能
kakuban_2330_2351 = 2352 - machine_number
```
