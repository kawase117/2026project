# 水曜ゾロ目台の成績補正値は台選択の絞り込み根拠として有効

## 背景
特定の曜日（水曜）において特定の末尾のゾロ目台（台番号がXX番）の
平均差枚が高い傾向が観測された。
これはMLモデルが「末尾グループ全体」を評価するのに対し、
「具体的な台番号の補正」を加えることで精度を上げられる可能性を示す。

ただし以下のリスクがある：
- サンプル数が少ない（ゾロ目台は1末尾に1〜数台しかない）
- 過去の観測値から将来への汎化が不確か
- 高設定を入れる「明確な意図」があってゾロ目台に投入されているのか、
  単なる統計的ゆらぎかが区別できない

## アクション
- ゾロ目台補正値はMLモデルのrank判断を上書きする「主証拠」として使わず、
  同等ランクの末尾を選ぶ際の「タイブレーカー」として使う
- 補正値の絶対値が大きい（|diff|>150）場合のみ台選択に反映
- 補正値が負のケース（末尾9: -87）は「避ける証拠」として活用する
- シミュレーションで有効性を検証してから運用に組み込む

## 例
```
タイブレーカーとしての使用例：
- combined rank 1位の末尾が複数エキスパートで割れている場合（例: 3F_Aが7、3F_Nが9）
- 水曜ゾロ目補正: 末尾7=+170, 末尾9=-87
- → 末尾7の台77を選択（正の補正値が決め手）

主証拠として使わないケース：
- combined rank 5位だが水曜ゾロ目補正が+300
- → MLモデルを優先。ゾロ目補正だけで5位末尾を選ばない
```
