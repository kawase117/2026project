# 4エキスパート統合予測 + 水曜ゾロ目補正による台選択戦略

## 背景
4エキスパート（2F_N/3F_N/3F_A/2F_A）の翌日末尾ランキング予測に加え、
「特定の曜日において特定の末尾のゾロ目台（XX番台）が優秀な成績を残す傾向」
という観測が重なった。

水曜日（2026-05-28）の予測例：
- combined top10: 7, 9, 5, 4, 3, 6, 0, 8, 1, 2
- 3F_A（top1ミス率7.1%・最信頼）: 7, 5, 4, 6, 0, 1, 8, 2, 3, 9
- 3F_N（top1ミス率0%・イベント日無敗）: 9, 7, 2, 4, 5, 8, 6, 1, 0, 3
- 2F_N（14.3%・参考値）: 3, 0, 7, 9, 8, 1, 4, 2, 6, 5
- 2F_A（イベント日データなし）: 5, 9, 3, 6, 7, 4, 1, 8, 2, 0

水曜ゾロ目補正値（プラスなら台XX選択を優先）：
- 末尾7: +170（台77優先）
- 末尾4: +195（台44優先）
- 末尾5: +188（台55優先）
- 末尾9: -87（台99を回避→非ゾロ目台を選ぶ）
- 末尾2: +404（台22単体。ただしモデル評価が割れ）

統合判断：
- **末尾7**（全員top5・ゾロ目+170）→ 最優先、台77狙い
- **末尾4**（信頼2モデルtop4以内・ゾロ目+195）→ 安定した第2候補
- **末尾5**（3F_A/2F_Aが強い・ゾロ目+188）→ 第3候補
- **末尾9**（非ゾロ目台を選ぶ。3F_Aが9位）→ 台99は絶対避ける

## アクション
翌日の台選択において以下の優先度付けを行う：
1. combined順位 top3の末尾を候補として特定
2. その末尾のゾロ目補正値を確認
   - 正値の場合：XX番台（ゾロ目台）を最優先
   - 負値の場合：非ゾロ目台から末尾一致台を選ぶ
3. 複数エキスパートで一致する末尾を優先（補助情報として利用）
4. 今日の最信頼エキスパートのrank1と3F_N（イベント日無敗）のrank1が一致する末尾を特別視

## 例
```
水曜日の場合:
Step1: combined top3 = [7, 9, 5]
Step2: ゾロ目補正 → 7:+170, 9:-87, 5:+188
Step3: 末尾7→台77、末尾5→台55、末尾9→非ゾロ目台
Step4: 3F_A(rank1=7) かつ 3F_N(rank2=7) → 末尾7が最も確度高い
→ 選択：台77（3F_Aのゾロ目台リスト：3177/3277）
```

