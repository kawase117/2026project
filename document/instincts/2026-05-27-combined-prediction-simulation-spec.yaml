# 統合戦略 vs 単純末尾予測 比較シミュレーションの仮説

## 背景
「combined順位だけで末尾を選ぶ」戦略と
「combined順位 + ゾロ目補正で具体的な台番号まで絞る」戦略のどちらが
実際に座ったとき効率が良いかを検証する必要がある。

「良い末尾を選ぶ」だけでは不十分で、「どの台番号の台に座るか」まで絞れれば
期待値が上がる可能性がある。ただしゾロ目台は台数が少ないため、
入れなかったとき（他人が先着）のリスクも考慮が必要。

## アクション
比較すべき2つの戦略をシミュレーションで明確に定義する：

**Strategy A（単純末尾予測）**:
- combined rank 1位の末尾グループから1台選ぶ
- 台選択はランダム（その末尾の全台から均等抽出）

**Strategy B（統合予測）**:
- combined rank 1-3位の末尾から最信頼エキスパートのrank1末尾を特定
- 対象末尾のゾロ目台（XX番台）が存在し補正値>0なら → ゾロ目台を選ぶ
- 補正値<0の場合 → 対象末尾の非ゾロ目台からランダム選択

比較指標：
- 平均差枚/日
- 勝率（差枚>0の日の割合）
- 中央値差枚（外れ値の影響を除く）
- シミュレーション期間中のtotal差枚

## 例
```python
# 期待されるシミュレーション関数シグネチャ
def simulate_strategy(df, strategy='combined', n_iter=1000):
    """
    df: 実績データ（date, machine_number, last_digit, diff_coins_normalized）
    strategy: 'simple' or 'combined'
    n_iter: モンテカルロ反復回数
    returns: 日次差枚のリスト
    """
    ...

# 比較方法
results_A = simulate_strategy(df, strategy='simple')
results_B = simulate_strategy(df, strategy='combined')
print(f"A: mean={np.mean(results_A):.0f}, win_rate={np.mean(np.array(results_A)>0):.1%}")
print(f"B: mean={np.mean(results_B):.0f}, win_rate={np.mean(np.array(results_B)>0):.1%}")
```

