# 同じ日の再収集は独立した再現ではない。累積データの入れ子なので、回数を根拠にしない

## 背景
2026-09-19 楽園蒲田で site777 を13:55・14:55・15:55・18:55・21:56に5回収集した。
AT機の角番1の差枚残差は -1.5 → -2.2 → -2.7 → -2.8 → -2.4（z）と一貫して負だったため、
「5回連続で負。最も信頼できるシグナル」と報告した。
しかし各回のデータは同じ日の累積で、後の回は前の回のG数・差枚を丸ごと含む。
z が同じ向きに並ぶのは同じ標本が育っただけで、独立な再現ではない。
5回連続は「1回の観測を5回眺めた」に等しく、証拠の数は増えていない。
実際の証拠は「1日・最終時点の z=-2.4（28〜32台）」1件であり、28検定のうち1つとして扱うのが妥当。

## アクション
1. 同じ日の複数時刻の値を並べて「連続」「安定」「強まっている」と書かない。書くなら「同一標本の推移」と明記する。
2. 再現の根拠は**別の営業日**で数える。角番1の冷遇を確かめるなら、翌日以降の最終データで同じ向きに出るかを見る。
3. 「途中で符号が反転しなかった」ことは、少なくとも途中データの偶然の揺れではないという弱い確認にとどめる。
4. 報告では、最終時点の1回分（z・台数・多重比較の本数）を主に書く。

## 例
NG: 「角番1のzは5回連続で負で、最も安定したシグナル」
OK: 「角番1は最終時点で z=-2.4（32台）。同じ日の時刻違いは同一標本の推移で、再現とは数えない。別の日で同じ向きに出れば再現1件」

