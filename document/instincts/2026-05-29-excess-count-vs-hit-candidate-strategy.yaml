# モデルスコア優先の原則

## 背景
予測モデルから複数の末尾候補が得られた時、「モデルスコア」と「ゾロ目Correction」のどちらを優先するか問題。
- 高モデルスコア × 負のゾロ目Correction
- 低モデルスコア × 正のゾロ目Correction

ゾロ目Correctionは「統計的に証明できない」結果が出ているため、モデルスコア（確信度）を最優先すべき。

## アクション
**原則：モデルスコア > Correction系パラメータ**

優先順位：
1. **モデルスコア** — 機械学習の予測信頼度（最優先）
2. **複数台投入（excess_count）** — 店舗の戦略的意思（次優先）
3. **ゾロ目Correction** — 統計的信頼度不十分（参考程度）

理由：
- モデルスコアは実績ベースで訓練された確信度
- ゾロ目Correctionはパターン観測だが、因果性が証明されていない
- TOP候補を外した場合、Correctionの効果は消滅する（walk-forward検証済み）

## 例
予測が以下の場合：

```
3F_N 末尾1: モデルスコア 0.72, ゾロ目Correction -0.05
3F_N 末尾3: モデルスコア 0.68, ゾロ目Correction +0.12
2F_N 末尾1: モデルスコア 0.65, ゾロ目Correction +0.08
```

**推奨順序：**
1. **3F_N 末尾1**（0.72スコア：最優先）
2. 3F_N 末尾3（0.68スコア × 正Correction）
3. 2F_N 末尾1（0.65スコア × 正Correction）

負のCorrectionは無視（モデルスコアで十分に上回っているため）

