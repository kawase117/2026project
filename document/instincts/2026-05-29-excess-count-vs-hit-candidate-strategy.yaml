# 少数機種 vs 大数機種：「率」と「数」の使い分け

## 背景
蒲田七の日曜分析データ：
- 少数機種（2-5台）：当たり候補率 16.55%（→ 1機種平均 0.5台）
- 大数機種（16-50台）：当たり候補率 12.26%（→ 1機種平均 3.7台）

「率が高い = 選択肢が多い」ではなく「率が高い = 外れた時の損失が大きい」という逆説が存在。
その一方で「絶対数が多い = 統計的に安定」というメリットがある。

## アクション
目的別に戦略を切り替え：

### 目的1：「確実に当たりやすい機種を1台」見つけたい
→ **少数機種を優先**（当たり候補率 16.55%）
- ハズレのリスクは高いが、当たった時の期待値が高い
- 試行機種数が限定されている日は、「厳選」が有効

### 目的2：「複数の選択肢から選びたい」
→ **大数機種を優先**（絶対数 3.7台）
- 当たり候補率は低いが、複数機種から試せる
- 外れた時のリカバリー機会がある

### 目的3：「複数台投入の戦略を活用したい」
→ **少数機種 × excess_count > 0 を最優先**
- 少数機種の当たり候補率 + 店舗の複数台投入
- 期待値が最も高い組み合わせ

## 例
蒲田七で「本日1機種だけ打つ」という制約がある場合：

| シナリオ | 推奨 | 理由 |
|--------|------|------|
| 予測が確実 | 少数機種 | 当たり候補率16.55%で厳選 |
| 予測に不確実性 | 大数機種 | 複数候補から選択可能 |
| excess_count > 0がある | 少数機種 | 複数台投入 × 高当たり率 |
| excess_count = 0のみ | 当たり候補率高い任意機種 | 統計的信頼度で判定 |

