# excess_count と当たり候補数の戦略的区別

## 背景
percentile化により「当たり候補」の定義が明確になったが、機種規模による当たり候補数の分布が異なる。
- 少数機種（2-5台）: 当たり候補率 16.55% だが 絶対数は 0.5台/機種
- 大数機種（16-50台）: 当たり候補率 12.26% だが 絶対数は 3.7台/機種

一見矛盾する結果を統一的に理解することが、効率的な機種選択に不可欠。

## アクション
2つの視点を分離して評価：

### 視点A：当たり候補「割合」を重視（ハズレリスク最小化）
```
少数機種を優先
- 当たり候補率 16.55% > 大数機種 12.26%
- 低設定混在率が低い可能性
- 試行台数が少ないから、統計的ノイズが少ない
```

### 視点B：当たり候補「絶対数」を重視（選択肢最大化）
```
大数機種を優先
- 当たり候補絶対数 3.7台 > 少数機種 0.5台
- 複数の候補を試せる
- 1台外れても他にリトライ機会がある
```

### 最適戦略：2つを組み合わせ
```
第1優先：少数機種 × excess_count > 0
         → 当たり候補率が高い × 複数台投入の確実性

第2優先：大数機種 × excess_count > 0
         → 絶対数が多い × 複数台投入の確実性

第3優先：当たり候補率高い機種を単独投入でも試す
         → 統計的信頼度が十分なら 1台投入でもリスク許容
```

## 例
蒲田七（2026-05-24）での実装：

**ケースA：少数機種 + excess_count > 0（推奨）**
```
かぐや様（10台）
- 当たり候補数: 4台
- excess_count: 3台（複数台投入確定）
- 当たり候補平均差枚: 4,275枚（高い）
→ 少数機種の当たり候補率を活用 × 店舗の複数台戦略
→ 信頼度：最高
```

**ケースB：当たり候補率高いが excess_count = 0（検証段階）**
```
虚構推理（5台）
- 当たり候補数: 2台
- excess_count: 1台（単独投入に近い）
- 当たり候補平均差枚: 1,800枚（中程度）
→ 当たり候補率は高いが、複数台投入の確実性は低い
→ 信頼度：中
```

**ケースC：当たり候補でも負けている（警戒）**
```
スマスロ ハナビ（5台）
- 当たり候補数: 2台
- excess_count: 1台
- 当たり候補平均差枚: 350枚（低い！マイナス回も含む）
→ 高回転だが低差枚 = 不発高設定の可能性
→ 信頼度：低（要検証）
```

