# イベント日は複数末尾が横並び（マルチ投入前提）

## 背景
is_any_event=1の日（全体の42%）は末尾間差枚のCV=2.26で
通常日（2.86）より低い。複数末尾が同時に高い状態を示唆。

日タイプ別CV（末尾間差枚のばらつき）：
- 強ゾロ目(MM=DD): 1.21（最も均一＝全体高の可能性）
- ゾロ目(DD=11/22): 2.06
- イベント日: 2.26
- 通常日: 2.86
- 水曜(非イベント): 3.70（最も格差大＝1〜2末尾が突出）

## アクション
イベント日の低spanは「モデル無力」ではなく「複数末尾が高い」可能性がある。
Top3まで展開する戦略を検討する。
低span + is_any_event=1 の組み合わせでTop3推奨に切り替えるロジックを実装する。

