# pred_span_top12を確信度シグナルとしてポジションサイジングに使う

## 背景
ユーザーの目標は「差枚をプラスにする」であり「ランキング精度」ではない。
hit@2はその代理指標に過ぎない。
pred_span_top12は「モデルがどれだけ確信しているか」を直接表す。

バックテスト実績（2F_N）：
- span > 0.5: top1実diff平均 +30,854、top2 +7,712（差 +23,142）
- span < 0.001: top1 +29,820、top2 +30,260（逆転あり）

## アクション
日タイプ別の3段階ポジションサイジング：

通常日：
- span > 0.2: アグレッシブ（top1末尾を複数台・長時間）
- span 0.05〜0.2: 標準（top1を1〜2台、様子見）
- span < 0.05: スキップ推奨

イベント日の低span: top1+top2を1台ずつ試す（マルチ投入の可能性）
強ゾロ目の低span: 複数末尾を少量試す（全体高の可能性）
水曜: 末尾1・8を優先しつつ、水曜専用モデル完成まで控えめに
