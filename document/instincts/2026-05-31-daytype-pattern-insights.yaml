# 強ゾロ目(MM=DD)は全台系イベントの可能性が高い

## 背景
強ゾロ目（月日が一致する日）はCV=1.21で全日タイプ中最低。
年12回（7/7, 8/8, 9/9...12/12, 1/1, 2/2...）のみ発生。
末尾間差枚がほぼ均一＝ほぼ全末尾に高設定が投入されている可能性。

ゾロ目の定義（DB実装確認済み）：
- is_strong_zorome = 1: MM = DD の日（例：7/7, 11/11, 1/1）
- is_zorome = 1: DD が 11 または 22 の日（毎月2回）
- ※台番号末尾ゾロ目(machine_detailed_results.is_zorome)とは別物

## アクション
強ゾロ目日はTop1集中より複数末尾を幅広く試す戦略が合理的。
pred_span_top12が低くてもスキップする必要はなく、
「低span = 全体的に高い」という解釈でTop3〜5を均等に参照する。

