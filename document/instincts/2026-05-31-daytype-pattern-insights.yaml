# 水曜日は末尾1・8が強く6・7が弱い独自パターン

## 背景
DBの326日分を分析した結果、水曜日（非イベント）は末尾間差枚のCV=3.70で
全日タイプ中最高。「水曜はランダム」ではなく「水曜は別の法則がある」ことが判明。

末尾別の水曜 vs 非水曜 平均差枚差：
- 末尾1: +127（最強）
- 末尾8: +66（強）
- 末尾6: -66（弱）
- 末尾7: -74（最弱）

現在のモデルが水曜に低spanを出す理由：
末尾1・8優位パターンが特徴量に組み込まれていないため。

## アクション
水曜専用特徴量として以下を追加する：
- `wed_digit_historical_rank`: 各末尾の水曜過去平均差枚順位
- `wed_digit_recent_avg`: 直近8水曜の末尾別平均差枚
水曜モデルのmin_train_days_wedを12より増やすことも検討。

## 例
```python
# 水曜専用特徴量の追加例
if day_of_week == 'Wednesday':
    features['wed_hist_rank'] = wednesday_digit_rank_lookup[last_digit]
    features['wed_recent_avg'] = recent_wednesday_avg[last_digit]
```

