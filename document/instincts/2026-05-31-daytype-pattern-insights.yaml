# 二段階モデルより日タイプ別専用モデルが適切

## 背景
「低span → 再学習」という二段階モデルには循環問題がある。
モデル1が低spanを出す理由は特徴量に信号がないから。
同じ特徴量を使うモデル2も同じ結果になる。

真の問題：日タイプごとに異なる法則が存在し、
現行モデルがその違いを特徴量に持っていない。

## アクション
以下のレジーム別モデルを設計する：
1. 通常日: 現行モデル（span > 0.2 なら高信頼）
2. 水曜専用: 末尾1・8優位の特徴量を追加
3. イベント日: マルチ投入前提、Top3展開
4. 強ゾロ目: 最も均一、消極的 or Top5均等参照

低span日専用の二段階設計より、日タイプフラグによる事前分岐の方が
シンプルかつ効果的。

## 例
```python
if is_strong_zorome:
    strategy = 'conservative_multi'  # Top3-5、少量試打
elif is_wednesday and not is_event:
    strategy = 'wed_concentrated'    # 末尾1・8集中
elif is_event:
    strategy = 'event_spread'        # Top3展開
elif pred_span_top12 > 0.2:
    strategy = 'aggressive_top1'     # Top1集中・長時間
else:
    strategy = 'standard_skip'       # スキップ推奨
```

