# 楽園蒲田の7のつく日は、末尾7のジャグラーに設定が寄っている可能性が高い(第一候補。安牌ではない)

## 背景
改装後(2026-07-07〜09-30、86日)、ジャグラー系(ネオアイム、マイジャグラーV、ゴーゴージャグラー3、ハッピージャグラーVIII、ジャグラーガールズ)の台日を、台番号の末尾と日の下一桁で分けて比べた。
- 台日ごとのRB事後確率(スペックのRB確率から)で、設定4以上の平均確率は、7のつく日×末尾7が0.732(11台、99台日、95%区間 0.683〜0.777)。7のつく日×他の末尾は0.436、他の日×末尾7は0.408、他の日×他の末尾は0.430。区間は重ならない。設定4以上が9割超の台日は、末尾7が31%、他の末尾が5%。
- 機械割104.1%、平均差枚+1015、勝率0.70(7のつく日×末尾7)。他の末尾は100.4%、+50、0.41。平均回転数は8206G対4228G(約2倍)。
- 台別では、末尾7のジャグラー11台のうち、O/Eが1を超えるのはほぼ全台(ネオアイム1107/1117/1127/1137/1187、マイジャグラーV1197/1207、ゴーゴージャグラー1157/1167など)。1台だけの突出ではない。ジャグラーガールズ1147(2日のみ)だけ低設定寄り。
- 他区分: 末尾7のBT等は低め(O/E 0.891)、ハナハナ系は平常(1.013)。7のつく日はホール全体では底上げされていない(ノーマル・BT RB O/E 0.993、AT等の機械割は-0.91pt)。
- 始まりは改装前の2026-05-07(2026-10-03の翌月検証で訂正): 5/7〜9/27の15日すべてで、末尾7のジャグラーの平均差枚がプラス(1台日あたり+1118、勝率0.71、約7800G。他の末尾は+65、0.42)。2025/1〜2026/4の48日は、末尾7が-120(勝率0.34、3883G)で、他の末尾(-70)より低めだった。以前の「改装前でも向きは同じ(0.455対0.409)」は、5月以降の月と混ざった平均で、改装前の大半は差がなかった。
- 日付軸・イベント別の総当たり(3726セル)では、補正後に通るのは回転数の集中だけで、RB O/Eの7のつく日×末尾7は q=0.116(補正後は有意でない)。ただし、この組み合わせは、事前に知られていた(旧instinct『楽園蒲田の末尾7仕掛けはRBでしか見えない』、8/17に別期間で確認)。
- 客の側: 「Xのつく日に末尾X」の台は、10通りすべてで回転数が増える(7: +113%、0: +54%)。客が期待している形は確実に出る。設定の優位が出ているのは、そのうち末尾7(ジャグラー)だけ。RBも機械割も、他の対角(0、8を含む)では動かない。

## 方法上の訂正(ユーザー指摘、2026-10-02)
- 初めは「長く回された台はRB確率が高く出る(当たらない台はやめられるため)から、回転数帯で揃えた期待値と比べるべき」と書いた。これは因果の順序を逆に扱っていた。設定が高いから当たりが多く、当たりが多いから打たれ、回転数が増える。
- 台ごとのRB事後確率(RB回数と回転数から設定を推定)は、最後に回った回転数で止まっても有効。回転数帯で揃えた期待値は、設定の高い台ほど長く回される分を「平常」に含めてしまい、設定の効果を打ち消す(回転数は設定の結果でもある媒介変数)。
- 一方、客の集中(予告や慣習で特定の台を選ぶ)は、設定と無関係に回転数を増やす。両方が回転数に効くので、回転数で揃えた比較は設定を過小評価し、揃えない比較は集中による上振れが残りうる。どちらか一方が正解ではなく、両方を並べて示す。

## アクション
- 7のつく日(7、17、27日)の狙い目の第一候補は、末尾7のジャグラー。ただし「安牌」とは書かない(勝率は約0.70で、30%は負ける。改装後9日・11台。補正前の上位セル。事後の推定で、開店前に台ごとの設定は分からない)。
- 末尾7の台は、7のつく日に平均8000G超回る。座れるかが別の問題で、早い時間から埋まる前提で動く。
- 次の7のつく日(2026-10-07、10-17、10-27)で、事前に固定して検証する: 末尾7のジャグラーの設定4以上の確率が、同じ日の他の末尾より高いか(3日で判定が弱いため、累計で見る)。
- 設定の比較は、回転数で揃えた期待値だけでなく、揃えない事後確率とあわせて示す。RB O/E(回転数帯で揃えた期待値との比)は、設定の優位を過小評価しうる。

## 例
7のつく日の末尾7のネオアイム1127は、9日で平均8366G、RB 1/238、設定6以上の近似、平均差枚+561。同じ台の他の日は、RB 1/328、設定3.2相当、-29枚。
