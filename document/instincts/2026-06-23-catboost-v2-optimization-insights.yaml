# Claude Codeバックグラウンドタスクは10分でタイムアウトする

## 背景
CatBoost v2フル実行（257日、推定104分）をClaude Codeのrun_in_backgroundで起動したところ、
70/257日（27%）の時点でタイムアウトにより強制終了された。
Bashツールのrun_in_backgroundパラメータは最大600秒（10分）の制限がある。

## アクション
ML実験など10分超のジョブは:
1. Claude Codeのバックグラウンドタスクを使わない
2. ユーザーにローカルPowerShellで直接実行してもらう
3. --max-days でスモークテスト（10日程度）はClaude Code内で実行可能
4. フル実行のコマンドをユーザーにコピペ可能な形で提示する

## 例
スモーク（OK）: `python -m ml.experiments.gate_ranking_test.run_gate_ranking_test --max-days 10`（242秒）
フル（NG）: 同コマンドmax-daysなし（推定104分）→ タイムアウト
