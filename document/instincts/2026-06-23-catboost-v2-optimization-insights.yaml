# score_dayはsourceに追加したカラムを出力に通さない

## 背景
source DFにmachine_typeを事前mergeしておけば_attach_v2_featuresでmerge不要と考えたが、
score_day内部で_prepare_rows→_build_component_columnsを経由するため、
入力DFに追加したカラム（machine_type等）は出力に含まれない。
結果として_attach_v2_features内でmachine_typesテーブルとの明示的mergeが依然必要。

## アクション
score_dayの出力に追加情報を付与する場合:
1. score_day後に外部テーブルとmerge（machine_name or machine_numberキー）
2. sourceへの事前mergeはrolling_cache等の内部計算用には有効だが、score_day出力には反映されない
3. _attach_v2_featuresのように「列が無ければmerge」のガード条件を入れると安全

## 例
```python
# NG: sourceにmerge済みでもscore_day出力には含まれない
source = source.merge(machine_types, on="machine_name", how="left")
scored = score_day(train, actual, variant)  # scored に machine_type は無い

# OK: score_day後に明示的にmerge
scored = score_day(train, actual, variant)
scored = scored.merge(machine_types, on="machine_name", how="left")
```
