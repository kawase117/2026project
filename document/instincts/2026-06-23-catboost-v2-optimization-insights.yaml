# gate_ranking_testのボトルネックはrolling_diffではなくscore_day×ML_RECENT_DAYS

## 背景
v2で24秒/日かかる原因を調査。rolling_diffのキャッシュ化（_build_rolling_cache）を実装したが
最適化前25.6秒/日→最適化後24.2秒/日でほぼ変わらず。
実際のボトルネックは_build_ml_train_data内のscore_dayループ（257日×ML_RECENT_DAYS=10日=2,570回）。
CatBoost学習自体はGPUで高速。

## アクション
速度改善が必要な場合の優先順位:
1. score_dayの結果キャッシュ（日付×variant単位でメモ化）が最も効果大
2. _build_ml_train_dataの並列化（multiprocessing）
3. ML_RECENT_DAYSの削減（10→5など）— ただし学習データ量とのトレードオフ
4. rolling_diffやmergeの最適化は効果小

## 例
プロファイル概算（24秒/日の内訳）:
- score_day × 10回 ≈ 20秒（ボトルネック）
- CatBoost GPU学習 ≈ 2秒
- rolling_diff × 3窓 ≈ 1秒
- その他（merge, evaluate等）≈ 1秒
