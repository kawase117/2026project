# 蒲田7の取材日は少女☆歌劇(スタァライト)のRBが2回続けて高い(3台、標本2回の監視中)

## Core claim
蒲田7の取材日では、スタァライト(A+AT・3台)のRBが通常日より多い形が2回続いた。標本は2回・3台で、法則ではなく監視中の仮説。次の取材日で再確認する。

## Evidence
- 9/26 MEGA合同取材: RB比1.24(z +2.65)、3台。
- 10/26 クロロ調査隊 ハーフセレクションS VOL.10 来店取材: RB 1/98(通常日1/151)で比1.54(z +3.74)、勝率100%、平均+1,867。2347 は 4,065G・BB26・RB49 で p(5+) 0.95、+4,300。
- 注意: A+AT機のRB列の意味は公表スペックと食い違う可能性がある。比は同じホール内の自己比較。取材日以外(通常日)にも強い日がないかは未確認(通常日の p(5+) は平均0.74と元から高い)。

## アクション
1. 蒲田7の取材・来店日の予測では、スタァライトを候補に入れ、「3台・2回の標本」と書く。
2. 通常日との差が実在するかを、取材日以外の日で確認する(平常の p(5+) が元から高いため、取材日特有かは別問題)。
3. 3回目以降で同じ形が出れば confidence を上げ、出なければ撤回する(失効と撤回を分けて記録する)。
