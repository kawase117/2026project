# 過去回の機種別リプレイは、判別可否を正式判定で決め、1日5台未満でも日をまたいで合算する

## 背景
2026-10-26 の予測で、過去回のリプレイに「ジャグラー|ハナハナ|ディスクアップ|ハナビ|北斗|モンキー」という名前の簡易判定と「1日5台以上」の絞りを使った。ユーザーに「ジャグラー以外のRB判定機種の答え合わせが行われていない」と指摘された。正式判定(`bonus_specs.find_spec(...)['judgeable']`、ホール別は `load_specs(hall=...)`)と食い違う機種が、対象6ホールで38あった。BT・A+AT・ノーマルの判別可機種(サンダーV、アレックスブライト、タコスロ、不二子BT、SHAKE、スタァライト、エウレカ、うみねこ2、喰霊、バーサス、クランキークレストなど)の多くは1ホール1〜4台で、「1日5台以上」の絞りで丸ごと落ちていた。逆に北斗・モンキーターンVは正式判定では判別不可なのに、簡易判定でRB機種に入れていた。
結果、10/26 の主な動き(蒲田7・蒲田1のキングハナハナ-30、蒲田7のスタァライト、ハナビ系・サンダーV・タコスロ)が、予測にも自動RB候補にも載らなかった。

## アクション
1. 判別可否は名前の正規表現で決めない。ホール別に `load_specs(hall=...)` で読み、`find_spec` の `judgeable` で決める(AT機のRB列の意味はホールで違う。`AT_RB_AUDIT.csv`)。
2. 機種の効きは、1日の台数で足切りせず、**イベント日の総G数と総RBを日をまたいで合算**して通常日のRB確率と比べる(RB比とz)。台別は設定5以上の事後確率(`bonus_specs.posterior`)の平常との差で見る。
3. 20〜40機種を同時に見るので、z>2は偶然でも1〜2つ出る。**z>3だけを根拠あり**とする。
4. A+AT機でDBのRBが公表スペックのRBと食い違う機種(エウレカ、スタァライト、マジカルハロウィン8など)は、同じホール内の自己比較の比だけを使い、設定の高低は言わない。
5. 差枚に出ない台がある(10/26 平和島サンダーV 341 は5,614GでRB26・p(5+)0.90 だが差枚+95)。RB判別機種は差枚だけで採点しない。

## 例
- 10/26 蒲田7のキングハナハナ-30(14台)で、3002〜3005 の4台が p(5+) 0.61〜0.67、差枚+2,400〜+3,800。避ける側に置いて外した。蒲田1のキングハナハナ-30(5台)も lift +0.22 で全台プラス。
- 過去の取材日(あかまる、6の付く日)のRB比は1.02/0.97 でほぼ平らだった。過去回の分析からは出ない動きもある。
