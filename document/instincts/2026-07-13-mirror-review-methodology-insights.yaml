# ホール別独立分析はプーリング回避ではなく高検出力設計

## 背景
既存ルール `feedback_no_cross_hall_pooling` は「ホール横断の共通法則はほぼ存在しない」という前提で運用されてきたが、その理由付けを本人が明確化した: ホールを跨いだ普遍法則は事前予測として存在しないと見込まれる一方、ホール別に独立検証する設計そのものが、もし本当に類似の法則性があれば複数ホールで独立に検出できるという、プーリングより検出力の高い方法になっている。

## アクション
「ホールを跨いだ分析をしない」という制約を、単なる近道の禁止ではなく、独立レプリケーションによる高感度検出設計として説明する。もし複数ホールで同じ効果が独立に検出されたら、それは偶然の一致ではなく真にプールしてよい根拠として扱う。

## 例
蒲田1・蒲田7・みとやそれぞれで独立にDD11分析を行い、結果が真逆(蒲田7=negative, みとや=negative, 蒲田1=部分採用)だったことは、プーリングでは見えなかった「ホールごとの真の異質性」を独立検証だからこそ検出できた例。

