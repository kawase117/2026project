# 「精度が上がったら収益化検証に移る」の判定基準が未定義

## 背景
mirror-review(2026-07-13)で、収益化・実運用の損益総括がほぼ無いことを指摘したところ、本人は「まだその段階まで達していない。予測精度を上げることに成功してから取り組む」と回答した。この順序づけ自体は合理的だが、「いつ精度が十分と判定するか」の具体的な基準(閾値・指標)はこの時点でまだ言語化されていない。既存の `prediction-evaluation` スキルにある「30日移動Hit@3が40%超」が流用候補として存在する。

## アクション
次にこの話題に触れる機会があれば、「精度が上がった」を判定する具体的な数値基準(例: 30日移動Hit@3の閾値)をこの時点で確定しているか確認する。確定していなければ、confidence 0.6のまま保留とし、断定的な進捗報告をしない。

## 例
`document/roadmap.md` の「30日後の確認事項」に同じ論点が記載されている。次回の `/mirror-review` 実行時、この基準が言葉になっているかどうかを最優先で確認する。

