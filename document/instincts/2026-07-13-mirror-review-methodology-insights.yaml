# n=1に支えられた有意な結果は「棄却」ではなく「粒度の再帰属」

## 背景
蒲田七角番×3F type Aで p=5.0e-45 という極端に有意な結果が、near/farそれぞれセクション内の1台にのみ支えられていたことが判明した際、「構造的な角番効果としては採用できない」と結論したが、これは結果自体を捨てることを意味しない。ユーザー本人の指摘: 「この場合はより優先度の高い、その一台専用のルール・法則性があると見るべきではないか」。

## アクション
n=1やごく少数の台に支えられた有意な結果に遭遇したら、「広い括り(角番・セクション等の構造効果)としては不採用」だが「個別の台固有ルールの候補としては有効」という二段階評価を行う。棄却ではなく、正しい粒度への再分類を明示する。

## 例
「角番効果」として提案された結果が実は特定の1台(例: 台番号XXXX)の癖だった場合 → 「角番セオリー」からは除外しつつ、「台XXXX個別の法則候補」としてinstinct化を検討する。

