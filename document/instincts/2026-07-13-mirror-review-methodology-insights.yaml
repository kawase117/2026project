# 重大度タグ付き構造化レビューは実装者を問わず適用される普遍基準

## 背景
Codexの実装プランに対して行番号付き・severityタグ付きの構造化批判を繰り返してきたことは、対Codexの警戒・統制手段ではないかという仮説があったが、本人は「自分の成果物に対しても同じレビューを行う」と明言した。「目的遂行が最重要であって、情緒的な部分はあまり考慮しなくて良い」という価値観がその根拠。

## アクション
実装レビューの厳しさを、実装者(Codex/Claude/本人)によって使い分けない。誰が書いたコードであっても、契約の曖昧さ・スキーマ粒度・実運用リスクを同じ基準でチェックする。レビューを簡略化したくなったら、それが「相手への配慮」ではなく「基準の劣化」であることを疑う。

## 例
Codexへのプロンプトレビューでload_hall_daily_frame契約の曖昧さを指摘したのと同じ厳しさで、自分(Claude)が書いたコードの契約定義も事前にセルフチェックする。

