# 「現象が実在するか」と「その現れ方を予測できるか」は別の問い

## 背景
蒲田七の「火曜日は角番基準で設定を入れている」という既知のドメイン事実に対し、統計検証で「どの角番に入れているかは予測できない、ランダムに見える」という非有意な結果が出た。この非有意という結果は、現象そのものへの反証ではなく、「予測可能性」という別の問いへのnoの回答として正しく受理されるべきだった。ClaudeとユーザーがこれをClaude側の言葉の齟齬で一時的に否定と誤読した。

## アクション
非有意/nullな結果が出たとき、まず「この検定は現象の実在を問うているのか、それとも具体的な現れ方の予測可能性を問うているのか」を明示的に切り分ける。ドメイン側で既知の事実(実運用観察・過去実績で確定済み)まで疑わない。予測可能性がnullでも、現象自体の存在は独立して扱う。

## 例
「Xホールの曜日Yは高設定を入れている」は事実として確定済みだが、「どの角番/どの列に入れているか」の統計検定がnullの場合、「Xホールは曜日Yに高設定を入れていない」と結論してはいけない。「入れ方が予測できない(狭く/ランダムに配置している可能性)」とだけ結論する。

