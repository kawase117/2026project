# 楽園の列（section）の持続性は、ほぼ機種効果の言い換え。列で狙うルールは作れない（当日の分解だけ有効）

## 背景
2026-09-16、当日データで「同じ機種でも列で扱いが逆」という現象を観測した
（東京喰種 2058-2070 +4,083 / 2083-2090 -1,687、ネオアイム 1184-1196 +600 / 1170-1183 -688）。
これを狙い目のルールにできるかを、20260401以降・1,000G以上・配置替えを日付ごとに
machine_layout_history の有効期間で引いて測った（69,427行、列×日 8,338ペア）。

| 指標 | そのまま | 機種効果を除去 |
|---|---|---|
| 列の月→翌月 | r=0.458 | **r=0.111** |
| 列の前日→当日 | r=0.045 | **r=-0.032** |
| 翌月の実効幅（月Nの上位25% − 下位25%） | +221 / -180枚 | **+54 / -34枚** |

機種効果の除去は、機種×月の平均残差を各台日から引いてから列×月で平均する方法。
対照として機種の月→翌月は r=0.303。**列そのままの 0.458 は機種の持続（morning.py の「この店で厚い機種」）を
含んだ数字で、位置だけの成分は 0.111 しか残らない。** 日次は符号が反転して実質ゼロ。

## アクション
1. 「列が熱い」を独立の狙い目ルールにしない。列の情報は機種選択にほぼ吸収される。
   ホール・機種選びは従来どおり機種の月次持続（+115枚/台日）で行う。
2. **当日の機種×列の分解は使う。** 当日は同じ機種でも列で逆になるので、
   機種を決めたあとの席選びには効く。ただしその日限りで、翌日に持ち越さない。
3. 当月の列別ランキングを見せるときは、必ず上の数値を添えて「予測力は無い」と明示する。
   `scraper/site777/site777_live_brief.py` の列セクションに固定済み。
4. 蒲田7の「列仕掛け」（月曜）は別の話。あれは予告で当日名指しされる仕掛けで、
   持続性の話ではない。混同しない。

## 例
NG: 「1037-1046 は今月 +1,126枚だから今日もここ」→ 9/16 は 1027-1036 が +1,569 で逆転した
OK: 「今日の東京喰種は 2058-2070 が +4,083、2083-2090 が -1,687。喰種を打つなら 2058-2070 の空き台」
