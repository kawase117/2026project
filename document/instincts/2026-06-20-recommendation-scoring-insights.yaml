# セオリー最適角番ボーナスをスコアリングに組み込むこと

## 背景
蒲田七セオリーではsection_size_group別の最強角番が定義されている:
small(8台以下)=角5, medium(14台以下)=角6(機械割102.27%), large(15台以上)=角11。
しかしセグメント単体のデータ実績と全セグメント横断のセオリーは異なる場合がある。
例: 2F_L_N mediumでは角4が+534で実績最強だが、セオリーはmedium=角6。

## アクション
スコアリングは6コンポーネント構成:
1. セグメント×島サイズ×角番の実績 (40%) — データ主軸
2. セオリー最適角番ボーナス (15%) — 距離減衰: 最適=+200, 距離1ごとに-50
3. **DD個別×角番交互作用 (20%)** — DD-binではなく当日DD単独データを使用（→ scoring-c3-dd-individual-required）
4. 曜日×角番交互作用 (15%)
5. 末尾ボーナス (5%) — 3F_L_Nのみ
6. ゾロ目ボーナス (5%) — 末尾0/5/9/6のみ有効
台個体の直近3ヶ月実績を10%のタイブレーカーとして加算:
composite = struct_score * 0.90 + hist_avg * 0.10

## 例
2F_L_N medium島: 角4(実績+534, bonus+15) vs 角6(実績+495, bonus+30) vs 角8(土曜+670)
セオリーとデータが矛盾する場合、データ主軸(40%)にセオリー補正(15%)で調整。

