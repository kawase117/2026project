# 推奨台リスト生成時は最新日の機種名を使用すること

## 背景
machine_detailed_resultsテーブルには全期間のデータがあり、台番号に紐づく機種名は機種入替で変わる。
蒲田7では全715台中517台(72%)が期間中に機種変更済み。
drop_duplicatesや古い日付からの集計で機種名を取得すると、現在設置されていない旧機種名が表示される。

## アクション
推奨台リスト生成時は、machine_numberごとにMAX(date)の行からmachine_nameを取得する。
latest_namesテーブルを別途作成し、表示用にjoinする。
スコアリング用のセグメント判定（A機/N機）は全期間データで計算してよいが、
ユーザー向け表示は最新機種名を使うこと。

## 例
- 台番号2014: 旧=マギアレコード → 最新=甲鉄城のカバネリ 海門決戦
- 台番号2107: 旧=モンキーターンV → 最新=モンスターハンターライズ
- 台番号2349: 旧=少女歌劇 レヴュースタァライト → 最新=虚構推理

