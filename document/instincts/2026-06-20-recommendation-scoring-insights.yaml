# C3はDD-binではなくDD個別データで計算すること

## 背景
DD18-23をbin集計すると、DD間の角番効果差が平均化されて消える。
DD20の角2は全角番中1位(+384)だが、DD19(金曜最弱)やDD22の低データで薄められ、
bin集計では角2のDD20固有シグナルが完全に消滅していた。

実測データ:
- 角N-1: DD20単独=+233 vs DD18-23bin=+155（差+78が消失）
- 角2:   DD20単独=+384 vs DD18-23bin=+258（差+126が消失）
- DD20角2はbin集計ではTOP50に0台 → DD個別集計で7台出現

## アクション
1. C3コンポーネントは当日のDD値のみでフィルタした実績を使う
2. セグメント×角番で集計し、n>=5ならセグメント値を使用
3. n<5の場合はssg×角番にフォールバック
4. DD-binやDD帯（例: DD18-23）でまとめてはならない

## 例
DD20スコアリング:
- c3 = dd20_data.groupby(['segment', 'kakuban']).agg(avg=('diff_coins_normalized', 'mean'))
- 角2 2F_L_N: c3=+425 (bin集計だと+258に薄められていた)
- 角N-1 2F_R_N: c3=+283 (bin集計だと+155に薄められていた)

