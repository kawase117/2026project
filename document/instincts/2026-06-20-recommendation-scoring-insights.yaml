# 推奨台リストは台番号順・Notionコピー可能なMD形式で出力すること

## 背景
ユーザーは推奨台リストをNotionにコピーして実戦で使用する。
入場時に台番号順に探索し、埋まっていた場合に次の候補を探す運用。

## アクション
出力フォーマット:
1. 台番号昇順（スコア順ではない）
2. 島切替を▸/·で示す
3. MDテーブル形式（Notionペースト対応）
4. カラム: 順位 | 台番 | 機種名（最新）| セグメント | 角 | 末 | スコア | 近3月
5. 島カラム・Zカラムは不要（ゾロ目は台番号から判別可能）
6. 機種名は台番の右隣に配置

## 例
| 順位 | 台番 | 機種名 | セグメント | 角 | 末 | スコア | 近3月 |
|:---:|:---:|:---|:---|:---:|:---:|---:|---:|
