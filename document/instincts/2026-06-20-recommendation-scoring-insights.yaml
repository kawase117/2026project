# 蒲田7の島は交互配置であり、約半数の島で角番が逆転していた

## 背景
蒲田7の島はメイン通路から見て順方向・逆方向が交互に並んでいる。
物理座標（generate_kamata7_coordinates.py）のstep_xで確認:
- step_x=+1の島: 台番号min側が通路側 → rank_from_min = 角番（正しい）
- step_x=-1の島: 台番号min側が奥側 → rank_from_max = 角番（反転が必要）

現行コードのREVERSED定義は3セクションのみ（2330-2351, 3191-3208, 3341-3362）。
実際には26セクション（全53中）が反転必要。3191-3208は縦配置で反転不要だった。
結果、約半数の島で角1と角Nが逆転し、全ての角番分析に影響。

実証:
- 台2030（島2023-2031, step_x=-1）: 物理X=4（通路から2番目）
  → 正しい角番=角2、現在の角番=角8（逆転!）
- 台2033（島2032-2040, step_x=+1）: 物理X=4（通路から2番目）
  → 正しい角番=角2、現在の角番=角2（OK）
- 2030と2033は物理的に同じ奥行き位置だが、現行コードでは角2と角8に分裂

## アクション
1. 角番計算時は必ずstep_xの方向を確認する
2. step_x=-1の島ではrank_from_maxを角番として使用する
3. REVERSEDリストを3→25セクションに拡張する（3191-3208は縦配置のため除外）
4. 修正後、セオリー全体（角番効果、DD×角番、曜日×角番）の再検証が必要
5. 既存のinstinct（scoring-c3-dd-individual-required, scoring-dd20-kakuban2-strongest等）は
   角番修正後に数値が変わるため、再検証まで参考値として扱う

## 例
反転が必要な24セクション（追加分）:
2F: 2023-2031, 2041-2052, 2065-2076, 2089-2101, 2115-2128, 2143-2154,
    2165-2171, 2179-2186, 2196-2212, 2230-2246, 2264-2280, 2298-2313
3F: 3017-3030, 3043-3057, 3073-3087, 3103-3116, 3131-3143, 3156-3167,
    3181-3190, 3218-3233, 3250-3264, 3281-3294, 3310-3324, 3400-3401

不要だったREVERSED: 3191-3208（縦配置、反転不要）

