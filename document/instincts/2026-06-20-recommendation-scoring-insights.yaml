# 直近実績が極端に高い台は鉄台候補として注意喚起すること

## 背景
台個体の直近3ヶ月avg_diffをタイブレーカーに使うと、恒常的に強い鉄台が
構造スコアに関係なく上位に浮上する。構造シグナルと個体効果の区別が必要。

## アクション
1. hist_avg >= +1000 の台には鉄台候補として注記
2. 構造スコアとhist_avg寄与を分離して表示
3. 台番号2026は鉄台確定として常に除外

## 例
- 2274(北斗の拳 転生の章2): hist_avg=+1434 → 鉄台候補
- 2243(モンキーターンV): hist_avg=+1380 → 鉄台候補
