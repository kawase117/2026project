# DD20 TOP50は角番反転バグ修正前の暫定値

## 背景
2026-06-20セッションで出力したDD20 TOP50推奨台リストは、
角番の交互配置反転バグ（kakuban-alternating-section-reversal-bug）修正前のもの。
約半数の島で角番が逆転しているため、角番ベースのスコアリング（C1,C2,C3,C4）が
不正確なデータに基づいている。

## アクション
1. このリストは角番修正前の暫定値として扱う
2. 角番修正後に全コンポーネントを再計算し、TOP50を再生成すること
3. 台番号・機種名・末尾・近3月の値は正確（角番に依存しない）
4. セグメント（2F_L_N等）のLR分割はsection中央値ベースなので角番バグの影響なし

## 例
影響を受けるスコアリングコンポーネント:
- C1(40%): segment×ssg×kakuban → 角番逆転で実績値が入れ替わる
- C2(15%): theory_optimal距離 → 角番逆転で距離計算が逆
- C3(20%): DD20×kakuban → 角番逆転でDD固有効果が入れ替わる
- C4(15%): Saturday×kakuban → 同上
影響を受けないもの:
- C5(5%): 末尾 → 台番号%10で計算、角番無関係
- C6(5%): ゾロ目 → 末尾ベース、角番無関係
- hist_avg(10%): 個体実績 → 角番無関係
