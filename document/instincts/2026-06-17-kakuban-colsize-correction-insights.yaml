# バラエティコーナーでは機種依存の設定投入が角番効果を上書きする

## 背景
2026-06-17: ユーザーのドメイン知識より。
蒲田7 2F の long 列エリアはバラエティコーナー（少数機種が並ぶエリア）。
このエリアでは設定を「機種に入れる」ことが多く、
セクション内の位置（角番）ではなく機種選択が主な設定投入ロジックになる。

## アクション
- バラエティコーナーに該当するエリアでは kakuban 特徴は使わない
- 代わりに machine_type / machine_name ベースの特徴量を優先する

## 判定方法
以下の条件が揃う場合、バラエティコーナーの可能性が高い：
1. セクション内の機種バリエーションが少ない（1〜2機種のみ）
2. 他エリアと比べて mean_abs_mean_residual が著しく低い

