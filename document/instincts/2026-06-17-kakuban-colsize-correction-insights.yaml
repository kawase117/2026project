# support_sections >= 2 フィルタで単列依存ノイズを効果的に除去できる

## 背景
2026-06-17: kamata7_kakuban_colsize_eda.py に --min-support-sections 2 を追加して検証。

3F_long_N セグメントで significant_kakuban が 14 → 4 に激減。
14 個中 10 個は support_sections=1（1列のみから来るシグナル）だった。
残存した 4 個（kakuban=3,4,12,13）は support_sections >= 5 以上で信頼できる。

colsize の定義が誤っていたとしても、このフィルタの有効性自体は
セクション残差計算が正しいため独立して成立する。

## アクション
角番分析スクリプトに --min-support-sections N（デフォルト 1）を追加する。
N=2 を標準フィルタとして推奨。

cross-bin / cross-segment 比較表は同じフィルタ条件で significant を集計する。

## 判断基準
| significant_kakuban 変化 | 解釈 |
|---|---|
| 大幅減少（例: 14→4） | 多くが単列ノイズ。残存分のみ信頼できる |
| わずかな減少（例: 12→11） | 元のシグナルが多セクション分散で堅牢 |
| 変化なし | support_sections が元々 >= 2 だった |

