# colsize ≈ L/R の交絡結論は X集計ベースの誤りで無効 — 再検証が必要

## 背景
2026-06-17: kamata7_colsize_lr_confound_check.py で
「2F/3F の全 bin で特定 side に 80%以上集中（交絡あり）」という結論を出したが、
この分析で使った column_size が X座標集計ベースの誤った定義だった。

正しい section_max - section_min + 1 ベースの colsize で再実行するまで、
「colsize と L/R は同じ空間軸」という結論は使ってはならない。

## アクション
- kamata7_colsize_lr_confound_check.py を section ベースの colsize で修正・再実行する
- 再実行前は「colsize ≈ L/R」という前提を分析に持ち込まない
- L/R 分析（kamata7_kakuban_rl_eda.py）の結果自体は独立して有効
  （L/R 空間分類は正しく、kakuban 残差計算もセクション単位で正しい）

## 注意
「2F short → R 89.5% 集中」などの数値は X集計ベースの誤った colsize から来ており、
正しい colsize では値が変わる可能性が高い。

