# 列（島）の台数は section_max - section_min + 1 で定義する

## 背景
2026-06-17: kamata7_kakuban_colsize_eda.py で column_size を
「同じX座標を持つ台数（coords.groupby("X").size()）」で定義していたが誤り。

例：X=1 に12台いても、2001-2010（10台）と別セクションの2台が
同じX位置にあるだけで「列」は2本存在する。
X座標は物理的な位置情報であり、列（セクション）の単位とは別物。

列（島）= セクション（連続した台番号グループ）。
2298-2313 という列があれば section_min=2298、section_max=2313 で16台の列。

## アクション
座標CSV（floor_coordinates_*.csv）から列サイズを計算する場合：

```python
# 正しい実装
coords["column_size"] = coords["section_max"] - coords["section_min"] + 1

# 誤り（X座標集計）
col_size_map = coords.groupby("X").size()  # これは列サイズではない
```

bin 定義は X集計ベースの分布ではなく、section単位の分布を確認してから設定する：
```python
# 分布確認
for floor, df_f in coords.groupby("floor"):
    sizes = df_f.groupby("section")["column_size"].first()
    print(sizes.value_counts().sort_index())
```

## 影響範囲（2026-06-17時点）
- kamata7_kakuban_colsize_eda.py: 修正対象（column_size計算を1箇所修正）
- kamata7_short_split_eda.py: X集計ベースのため廃棄対象
- kamata7_colsize_lr_confound_check.py: X集計ベースのため廃棄対象
- colsize と L/R の交絡確認は正しい colsize で再実施が必要

