# Type A確定区画のハード除外フィルタ構想（未実装、MLパイプライン実用化まで見送り）

## 背景
baselineモデル（直近90日ローリング窓でセクションスコアリング）が、§8.2・§9で「全期間・split-half両方で一貫してマイナス」と確定した1130-1134を1日だけ誤って推薦した（その日average_diff-1725円）。長期エビデンスと短期ローリング窓の間に矛盾が生じうる。

## アクション
- 対策案: スコア計算とは独立に「確定済みType A区画は候補から機械的に除外する」ブラックリスト方式のフィルタ。`eda/section_lateral_expansion.py`の`HallConfig.exclude_machine`（蒲田7の鉄台2026除外）と同じ発想をセクション単位に拡張したもの
- 2026-07-13時点でユーザー判断により実装は見送り（「MLに関してはまだ実用性に乏しいのでこれはセオリーに記載する程度でOK」）。当面は`rakuen_theory.md` §12の台選びフロー（手動ルール「1106-1115・1130-1134は日を問わず避ける」）で代替
- MLパイプラインが実用段階に進んだ際は、この構想メモを起点に実装すること

## 例
セオリー文書に「未実装だが構想は残す」形で記録するパターン。実装コストが低い改善案でも、上位のML統合自体が実用段階でなければ後回しにしてよい——ドキュメント化だけで十分な場合もある。

