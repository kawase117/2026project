# Codexモデルの愛称指定（Luna/Terra/Sol等）は正確なマッピングを確認できないことがある

## 背景
ユーザーから「Luna XHigh/Max, Terra Max, Sol Maxだけ使う」という指示を受けたが、`~/.codex/config.toml`・プラグインキャッシュ・`codex --help`のいずれにもLuna/Terra/Solの定義が見つからなかった。Codex CLI自身に尋ねても「Sol=軽量ティア、Luna=上位ティア」という、ユーザーの想定（Sol/Terraが重い、Lunaが軽い）と矛盾する回答をし、かつ「最新のCLI定義とは差があるかもしれません」と自ら精度に自信がないことを明言した。

## アクション
- 確信のない`--model`文字列を推測で設定しない。誤ったモデル名を指定するとタスクが即座にエラー終了し、手戻りが発生する
- 代わりに、ユーザーの指示文をそのままCodexへのプロンプトに含め、モデル選択の解釈をCodex側（`codex:gpt-5-4-prompting`スキル等）に委ねる
- ユーザーに対しては、正確なマッピングを確認できなかった旨を正直に伝え、代替方針（指示文の転送）を説明すること

## 例
「Luna XHigh/Maxを基本とし、実装が難航する場合のみTerra Maxへ引き上げる、という判断で進めてほしい（正確なモデル名の解決はそちら側の知識に委ねる）」という形でプロンプトに埋め込んだ。
