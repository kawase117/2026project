# 楽園: sec3+mac10 hybrid（固定候補プール）はbaselineモデル（全セクション自由選択）に劣る——蒲田1と逆

## 背景
蒲田1で有効だった「Event-responsiveな上位3セクション→その中の台を過去成績で上位10台に絞り込む」2段階hybrid手法（sec3+mac10、蒲田1ではlift 1.053→1.212に改善）を楽園に適用したところ逆効果だった。walk-forward比較（評価120日）: all_hall_top3_sec_only（全43セクション自由選択）がイベント日lift=1.193・非イベント日lift=1.225なのに対し、candidate_sec_only（1209-1216/3117-3120に固定）はイベント日lift=1.058・非イベント日lift=0.828（ランダム以下）。

## アクション
- 固定候補プールは市況変化（今どのセクションが強いか）を追えず機会損失が大きい。§1・§8で確立した「頑健な発見」であっても、日々のスコアリングを固定候補に限定すると劣化することがある
- 「他ホールで効いた絞り込み手法をそのまま移植しない」の実例（`hall-analysis-procedure.md`アンチパターン#1）。hybrid手法を適用する前に、必ずbaseline（自由選択モデル）との比較を取ること
- 副産物として、baselineモデル（90日ローリング窓）が既知の恒常マイナス区画（1130-1134）を稀に誤選択することを発見。長期エビデンスとローリング窓スコアの矛盾は起こりうる

## 例
評価軸は必ず「固定候補プール vs 自由選択baseline」の両方を含めること（`hybrid_walkforward_comparison.csv`のように）。片方だけでは「hybridが効くかどうか」を判定できない。

