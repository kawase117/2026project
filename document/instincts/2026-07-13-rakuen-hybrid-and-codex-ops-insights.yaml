# Codexのハングしたジョブは--resumeで直そうとせず--freshで新規依頼し直す

## 背景
`codex-companion.mjs`のジョブが長時間（数時間〜1日以上）「running」のまま進まなくなることがある。`cancel`コマンドはWindows Git Bashの`/PID`パス変換エラー（`taskkill /PID 57444 /T /F`が`C:/Program Files/Git/PID`に誤変換される）で失敗しやすく、`MSYS_NO_PATHCONV=1`を付けても対象PIDが既に消滅していて「プロセスが見つかりません」エラーになることが多い（＝実害はなく単なる状態ファイルの残留）。ジョブの状態JSONファイルを直接編集してstatusを書き換えても、トラッカーがメモリ上に状態をキャッシュしているらしく反映されない。

## アクション
- ハングしたジョブへの`--resume`（前回の確認質問への回答等）は、その古いジョブが「Active jobs」を占有していると失敗する（`Codex Resume`ジョブが数秒でfailedになる）
- 対策: `--resume`を諦め、**元の依頼内容全体（＋回答すべきだった確認事項への回答）を含めた新規`--fresh`タスク**として再依頼する。新規`task`ディスパッチはハングしたジョブの存在下でも成功することが多い（実績: 複数回この方法で回避成功）
- ハング検出の目安: `status`のログタイムスタンプが10分以上更新されない、または同じProgress行が繰り返し表示される
- ハング中でも既に生成済みのファイルがあれば、Codexの最終応答を待たずに自分で該当スクリプトを直接再実行して結果を取得する選択肢もある（前回の分類ロジック修正後の再実行で実施済み）

## 例
`node codex-companion.mjs status task-xxx`のPhaseが同じ内容のまま20分以上変化しない場合、`--resume`せず新規`task`として全文を再送する。

