# 蒲田7 Tail-level When軸（DD/曜日による末尾選択）は複数の独立手法で棄却済み

## 背景
以下4つの独立した手法が同じ結論に収束した（2026-06-16時点）:
1. 単独次元スキャン（曜日・台番号末尾・第N曜日）→ 全ホールでTier A/B皆無
2. カレンダー特徴量をMLに追加 → precision@2 悪化（-0.83〜-2.25pp）
3. DD/曜日ベースの逸脱ルール → 「常に2F_N」より全て損失（-2032〜-9731/日）
4. DD軸deep dive（2179-2186セクション） → stable=trueゼロ、イベント日も非有意

## アクション
- 「末尾選択×DD/曜日」の探索は優先度を最低まで下げる
- 新たな手法を提案されても「この組み合わせは4手法で棄却済み」と明確に答える
- ただしHall-level（どのホールのどの日に行くか）のWhen探索は別問題で未着手

