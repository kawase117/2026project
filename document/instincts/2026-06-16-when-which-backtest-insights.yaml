# 1系日は2F/3Fフロア差が消滅する特異日 — Q5は有効だがフロア縛りは不要

## 背景
`eda/kamata7_ichikei_analysis.py` で walk-forward 3ペア（3ヶ月窓、n_dates=30）を実施（2026-06-17）:

| | Q5 excess | 2F/3F gap |
|---|---:|---:|
| 通常日 | +150 | 135 |
| 7系日 | +301 | 132 |
| 週末 | +144 | 90 |
| **1系日** | **+215** | **19** |

- Q5 excess は +215（通常日 +150 より高く、7系日 +301 より低い）→ Q5機種選択は有効
- 2F/3F gap は **わずか 19**（他の日種と比べて桁違いに小さい）→ フロア縛りが意味をなさない

## セクション逆転パターン（2F）
1系日に通常日最強セクションが大幅悪化し、弱セクションが逆転する:

| section | 通常日 excess | 1系日 delta |
|---|---:|---:|
| 2330-2351 | -146 | +236（逆転） |
| 2077-2088 | -65 | +177（逆転） |
| 2089-2101 | +144 | +147 |
| 2001-2010 | +294 | **-386（大幅悪化）** |
| 2041-2052 | +291 | **-306（大幅悪化）** |
| 2102-2114 | +294 | **-298（大幅悪化）** |

3Fでも同様の逆転が大規模発生（3265-3280: delta +420, 3117-3130: +311）

## アクション
- Q5機種選択は1系日でも継続（excess +215 でプラス）
- **フロア縛りは1系日に限り外す** — 2F/3F gap ≒ 19 なので 3F も選択肢に入る
- セクション戦略は通常日と逆転するため注意（2001-2010, 2041-2052, 2102-2114 を避ける）
- 逆に 2330-2351, 2077-2088 が1系日に浮上する
- まだ3ペアのため「有望」どまり
- 実装: `eda/kamata7_ichikei_analysis.py`、結果: `tmp/kamata7_ichikei_analysis/`

