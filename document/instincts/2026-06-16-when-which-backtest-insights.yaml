# 7系日はWhenとWhichが乗算ではなく代替関係 — 「全体が上がるがQ5の相対優位が縮む」

## 背景
バックテストの7系日オーバーレイ結果（3ペア平均）:
- 7系日 All boost: +26.88（ホール全体が通常日より好調）
- 7系日 Q5 boost: +18.90
- 7系日 Q5 excess boost: -7.98（マイナス）

Q5の絶対値は上がるが、ホール全体も上がるためQ5の「相対優位」は縮む。

## アクション
- 「7系日 × Q5 = ダブル効果」という期待は持たない
- 7系日の正しい読み方: 「Q5以外（Q2〜Q4）でも打つ価値が上がる日」
- Q5戦略は7系日かどうかに関わらず毎日適用するのが合理的
- ⚠️ 旧アクション「Q5縛りを緩めてフロア内の台数を増やす」は誤り（→ 7kei-day-floor-h3-confirmed 参照）

