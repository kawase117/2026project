# 木曜（top1=2, top2=7）と日曜（top1=6, top2=1）はtop1-top2距離=5（最遠）で安定

## 背景
weekday_concentration.csv の top1_top2_distance:
- 月: dist=2（top1=2, top2=4）
- 火: dist=3（top1=6, top2=9）
- 水: dist=3（top1=8, top2=1）
- 木: **dist=5**（top1=2, top2=7）← 正反対
- 金: dist=3（top1=9, top2=6）
- 土: dist=4（top1=6, top2=2）
- 日: **dist=5**（top1=6, top2=1）← 正反対

木・日は他曜日（dist2〜4）と異なり、最遠の末尾に2拠点を配置している。
木曜の「0-1-2クラスタ（leftward）+ 末尾7（孤立強末尾）」というパターンと整合する。

## アクション
木曜: `is_thursday AND last_digit in ["0","1","2","7"]` を特徴量候補に追加。
日曜: `is_sunday AND last_digit in ["6","7","8","1"]` を特徴量候補に追加。
ただし週次単一値のため walk-forward での確認が必須。

## 例
木曜: top1(末尾2=259.3) + top2(末尾7=254.0) → 2拠点、距離5（正反対）
日曜: top1(末尾6=286.6) + top2(末尾1=231.9) → 2拠点、距離5（正反対）
対比: 火曜 top1(末尾6) + top2(末尾9) → 距離3（近い）
