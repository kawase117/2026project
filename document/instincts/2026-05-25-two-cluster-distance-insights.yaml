# 全曜日でクラスタ集中が確認されるが、月曜は唯一の例外（concentration_ratio ≈ 1.04）

## 背景
weekday_concentration.csv より（concentration_ratio = best_cluster_mean / all_digits_mean）:

| 曜日 | all_digits_mean | best_cluster_mean | ratio   | delta |
|------|-----------------|-------------------|---------|-------|
| 月   |      211.15     |      219.40       |  1.039  |  8.25 |
| 火   |      215.32     |      264.65       |  1.229  | 49.32 |
| 水   |      193.03     |      231.65       |  1.200  | 38.62 |
| 木   |      196.48     |      241.50       |  1.229  | 45.02 |
| 金   |      152.23     |      182.06       |  1.196  | 29.83 |
| 土   |      209.26     |      254.11       |  1.214  | 44.85 |
| 日   |      186.12     |      219.43       |  1.179  | 33.31 |

火・木が最強（ratio=1.229）。月曜だけが実質クラスタ集中なし（delta=8.25は誤差レベル）。

## アクション
月曜は「クラスタ末尾特徴量」の信頼度を下げる（or 無効化）。
火〜日はクラスタ集中が有意（delta > 29）なので末尾クラスタ特徴量を活用できる。

## 例
火曜: best_cluster=6-7-8, delta=49.32（クラスタが全体より+49差枚）
月曜: best_cluster=2-3-4, delta=8.25（クラスタと全体の差がほぼない）

