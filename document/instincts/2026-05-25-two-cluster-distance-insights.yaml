# top1-top2の循環距離はほぼ一様分布。ハーフ×2遠距離仮説は弱い支持しかない

## 背景
distance_distribution.csv（n=320日）のランダム期待値との比較:

| 距離 | 実測(%) | 期待値(%) | 差  |
|------|---------|-----------|-----|
|   1  |  20.6   |   22.2    | -1.6|
|   2  |  23.1   |   22.2    | +0.9|
|   3  |  21.6   |   22.2    | -0.6|
|   4  |  21.6   |   22.2    | -0.6|
|   5  |  13.1   |   11.1    | +2.0|

- 期待値: top1固定のとき残り9末尾でランダム選択 → dist1〜4が各22.2%、dist5が11.1%（対角1択のみ）
- 距離4+5合計: 実測34.7% vs 期待値33.3% → **+1.4ppのみ**

「ホールが1と6、8と3のように正反対に分散投入する」仮説はデータで支持されない。
距離5のみわずかに超過（+2.0pp）しているが、サンプル数を考えると誤差範囲の可能性が高い。

## 解釈
「なるべく遠い関係で入れている」という視覚的印象はあるが、データ上は全距離ほぼ等頻度。
曜日別のweekly集計（木曜=dist5, 日曜=dist5）はあくまでその曜日の「典型パターン」であり、
日次レベルでは遠距離選択の戦略的偏りは確認できない。

## アクション
ML特徴量として「top2の位置」を組み込む場合、距離ではなく実際のtop2末尾値を使う方が良い。
「top1から距離4〜5」という抽象的な特徴量は予測寄与が期待できない。
「top2末尾がX（具体値）」の特徴量を検討する。

## 例
dist5の実例: 木曜のtop1=2・top2=7（距離5）、日曜のtop1=6・top2=1（距離5）
これらは曜日固定パターンであり、距離の遠さが戦略的意図とは言い切れない

