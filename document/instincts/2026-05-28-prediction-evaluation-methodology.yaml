# 予測精度の二層構造：末尾別とゾロ目補正は別指標

## 背景
2026-05-27の分析で判明：3F_Aは末尾別Top3で完全的中（3/3）だったが、
ゾロ目補正値の予測では1/3のみ的中。同じモデルでも評価軸によって精度が大きく異なる。

## アクション
- 末尾別精度（全機種）とゾロ目補正精度（ゾロ目台）を別々に報告する
- 「モデルが優秀」と言う際はどの評価軸の話かを明確にする
- 末尾別精度が高くてもゾロ目補正精度が保証されるわけではない

## 例
| 評価軸 | 3F_A（2026-05-27） |
|--------|-------------------|
| 末尾別Top3一致度 | 3/3 完全的中 |
| ゾロ目補正Top3一致度 | 1/3 |

