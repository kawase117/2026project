Heatmap/2F_floor_coordinates_kamata7.csvで確認済み。

## アクション
- machine_number < 3000 → 2F（2001〜2351付近）
- machine_number >= 3000 → 3F（3001〜3401付近）

## 例
```sql
CASE WHEN CAST(machine_number AS INTEGER) < 3000 THEN '2F' ELSE '3F' END as floor
```

