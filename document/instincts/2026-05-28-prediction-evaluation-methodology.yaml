# アノマリー判定は統計検定が必須

## 背景
「火曜日は比較的普通の日」などの直感的な判断は不十分。
ユーザーから「これは適当に行っただけですか？」と指摘を受けた。根拠なき断言は信頼を損なう。

## アクション
- アノマリー判定は過去30日以上のデータとz-score等の統計検定を用いる
- 根拠がない場合は「アノマリー判定未実施」と明記する
- 「普通の日」と断言しない

## 例
```python
z_score = (today_total - historical_avg) / historical_std
is_anomaly = abs(z_score) > 2.0  # 2σ超を異常とする
```
