# セグメント別Top3/Bottom3の正しい比較手法

## 背景
予測精度を評価する際、2F_N/3F_N/3F_A/2F_Aの各セグメント予測を全体の実績と比較していたが誤り。
セグメント別予測はそれぞれのセグメント実績のみと比較すべき。
ゾロ目狙い目意見もゾロ目台限定の実績（is_zorome=1）のみと比較する。

## アクション
- 2F_N予測Top3 → 2F実績Top3（machine_number < 3000）のみと比較
- 3F_N予測Top3 → 3F実績Top3（machine_number >= 3000）のみと比較
- 3F_A予測Top3 → 3F実績Top3と比較
- 2F_A予測Top3 → 2F実績Top3と比較
- ゾロ目意見はセグメント別ゾロ目実績（is_zorome=1）のみと比較する

## 例
```python
df['floor'] = ['2F' if n < 3000 else '3F' for n in df['machine_number'].astype(int)]
for floor in ['2F', '3F']:
    df_floor = df[df['floor'] == floor]
    summary = df_floor.groupby('last_digit')['diff_coins_normalized'].sum()
    actual_top3 = summary.nlargest(3).index.tolist()
    actual_bottom3 = summary.nsmallest(3).index.tolist()
```

