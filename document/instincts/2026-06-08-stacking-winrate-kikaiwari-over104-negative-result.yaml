# win_rate予測値+kikaiwari予測値をメタ特徴量にしたスタッキングは、単独over_104モデルより一貫して劣化する(avg Pearson 0.419→0.403, Top30% 0.519→0.481)

## 背景
ユーザーから「回転数・勝率・機械割をそれぞれ予測し、その予測値を組み合わせて当日の高設定台(over_104)を予測する」という複合モデル構想が出た。

事前調査で以下が判明していた:
- 実測値ベースの相関: over_104_rate vs win_rate = 0.536, vs avg_kikaiwari = 0.099, vs avg_games = 0.030
- avg_games(回転数)は単独では非常に予測しやすい(Pearson 0.78〜0.92)が、over_104_rateとは構造的に無相関 -> 早期に除外
- 過去instinct [[same-latent-variable-threshold-classifiers-do-not-combine-additively]] で「同じ潜在変数(機械割)の閾値射影(over_104/under_100)を単純合成すると劣化する」ことが既に判明していた

そこで「学習型メタモデル(スタッキング)なら単純合成と違って機能するのでは」という仮説のもと、out-of-fold予測でリークを防いだ正式なスタッキング実験を実施した(`ml_island_stacking_winrate_kikaiwari.py`、島x日 walk-forward 2スプリット)。

**実証結果**(avg across 2 splits):
| 指標 | ベースライン(over_104単独) | スタッキング(+win_rate_pred+kikaiwari_pred) | 差分 |
|---|---|---|---|
| Pearson相関 | 0.419 | 0.403 | -0.016 |
| Top30%重複率 | 0.519 | 0.481 | -0.037 |

両スプリットで一貫してスタッキングがベースラインを下回った。特にSplit 1(2026-01)では`kikaiwari`サブモデルが完全に崩壊(Pearson -0.024, RMSE改善-131.6%)し、その劣化ノイズがメタモデルにそのまま伝播してパフォーマンスをさらに押し下げた。

## なぜ学習型メタモデルでも失敗したのか
1. **`over_104_rate`と`win_rate`は同じ潜在因子(「その日全体が好調だったか」=設定投入量・客入りの代理)の異なる射影であり、独立した情報源ではない**。単純合成で起きた問題(相関したノイズの重ね合わせ)が、学習で重みを最適化しても解消されない——メタモデルは「相関した2つの弱い信号」から「1つの強い信号」を合成する魔法の手段ではない。
2. **サブモデルの予測誤差がメタモデルに伝播する**(エラー伝播)。サブモデルが安定して高精度なら問題は緩和されるが、`avg_kikaiwari`のように予測力が時期によって大きく変動する(Pearson 0.374→-0.024)シグナルを組み込むと、不安定さがそのまま下流に伝わる。
3. **`dd, dow, bucket, island`という「予測時点で確定済みの情報」だけで、`over_104_rate`の予測に必要な情報はほぼ尽くされている**。win_rate/kikaiwariの予測値を経由しても、これらの確定情報を超える新規情報は付加されない。

## アクション
- 「複数の個別予測可能なシグナルを組み合わせれば精度が上がる」という直感は、**それらのシグナルが目的変数に対して本当に独立した情報を持つかを実測相関で確認してから採用する**。本ケースのように両方が同程度の相関(0.42〜0.58)を持つ場合、それは「補完しあう2つの強み」ではなく「同じ潜在因子の異なる観測」である可能性が高い。
- 単純合成が失敗した場合に「学習型メタモデル(スタッキング)なら救えるはず」と期待するのは早計。**メタモデルは相関したノイズを独立信号に変換する手段ではない**。むしろサブモデルの誤差伝播という新たなリスクを背負い込む。
- スタッキングを検討する前に、ベースモデル(本ケースでは`dd, dow, bucket, island`のみ)がどこまで強いかを必ず確認する。ベースモデルが既に十分な情報を持っている(理論上限に近い)場合、追加のサブモデル予測値は「ノイズの注入」にしかならない。
- この種の実験は「失敗」ではなく「複合モデル構想に対する重要な反証データ」として記録する。単独over_104モデル(avg Pearson 0.419)をそのまま運用するのが最良という結論を、次回以降の複合モデル構想の検討時に即座に参照できるようにする。

## 例
```python
# 実測相関で「独立した情報源か」を事前チェック(必須)
corr_matrix = grouped[['over_104_rate','win_rate','avg_games','avg_kikaiwari']].corr()
# over_104_rate vs win_rate:      0.536  <- 高相関 = 同じ潜在因子の射影の疑い
# over_104_rate vs avg_kikaiwari: 0.099  <- 弱い
# over_104_rate vs avg_games:     0.030  <- 構造的に無関係(早期除外が正解)

# OOFスタッキングを正式実装しても、相関した信号源では改善しない
# ベースライン: Pearson=0.419, Top30%=0.519
# スタッキング: Pearson=0.403, Top30%=0.481  <- 一貫して劣化

# 結論: 単独 over_104_rate モデル(dd, dow, bucket, island)をそのまま採用
```
