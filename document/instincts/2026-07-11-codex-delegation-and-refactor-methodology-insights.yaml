# pyproject.tomlのtarget-version=py314では except (A, B): が except A, B: に整形される

## 背景
Codexが生成した `database/migrate_add_rank_from_aisle.py` に
`except (TypeError, ValueError):` と書いたところ、コミット時のpre-commit
`ruff-format` フックが自動的に `except TypeError, ValueError:`（括弧なし）に
書き換えた。一見Python 2時代の無効構文に見えたため手動で括弧に戻したが、
`ast.parse`・実行テストの両方で問題なく複数例外を捕捉することを確認した。
`pyproject.toml` の `target-version = "py314"` により、ruffがPython 3.14で
正式にサポートされた括弧省略構文をより短い正規形として採用しているためと判明。
括弧に戻して再コミットしても、次のpre-commit実行で再び括弧なしに戻された。

## アクション
- pre-commitのruff-formatが自分の意図と違う書き方に「直してくる」場合、まず
  それが構文的に壊れているか（`ast.parse`や実際の実行で確認）を検証する。
  壊れていなければ、プロジェクトの `pyproject.toml` の `target-version` 設定に
  従った意図的な整形である可能性が高く、手動で元に戻すのを繰り返さない
  （フォーマッタと戦わず、そのまま受け入れて再ステージ・再コミットする）。
- 見慣れない構文に遭遇したら、まず対象Pythonバージョンの言語仕様変更を疑う
  （本件はPython 3.14でexcept節の複数例外指定の括弧が省略可能になったことが原因）。

## 例
`database/migrate_add_rank_from_aisle.py` の `except TypeError, ValueError:` は
Python 3.14.2環境で `compile()` が成功し、`except (TypeError, ValueError):` と
完全に同じ挙動（両方の例外を捕捉）をすることを直接実行して確認済み。

