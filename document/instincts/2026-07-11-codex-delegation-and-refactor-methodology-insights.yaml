# 概念分離リファクタは「名前の付け替え」ではなく「値の付け替え（セマンティック・スワップ）」

## 背景
蒲田7の「角番」という一語が、theory_engine.pyでは`min(rank_from_min, rank_from_max)`
（両端位置の折りたたみ）を指し、DB/CSVの`rank_from_aisle`（メイン通路からの距離）とは
別概念だった。ユーザーが用語を「角番＝通路距離」「端番＝両端位置」と再定義した際、
単純に`kakuban`という変数名を`hanaban`に一括リネームするだけでは、旧`kakuban`列の
「値」（折りたたみ計算）が新しい`kakuban`という名前の元で本来あるべき`rank_from_aisle`
の値ではなく、古い折りたたみ値のまま残ってしまう危険があった。実装をCodexに委譲する際、
「これは名前の付け替えではなくセマンティック・スワップだ」と明記しなかった場合、
Codexが単純な文字列置換をしてしまうリスクがあったため、仕様書に太字で明記した。

## アクション
- 混同されていた2概念を分離するリファクタでは、まず「旧名の値がどちらの新名に
  移るのか」「新名にはどのデータが入るのか」を表で明示してから着手する。
- 実装を他者（Codex等）に委譲する場合、仕様書に「これは単純なリネームではない」
  ことを明記し、旧変数の計算式がどちらの新変数に移動するかを具体的なコード片で示す。
- 実装後は必ず実データで新旧2つの列の値が実際に異なることを確認する
  （本セッションでは`hanaban`と`kakuban`が蒲田7の同一台で異なる値を持つこと、
  蒲田1では`kakuban`が全NAであることをPythonで直接検証した）。

## 例
蒲田7 台番号2001: `hanaban=1`（旧kakuban値、rank_from_min=1由来）、
`kakuban=10`（新定義、rank_from_aisle=10由来）と、意図通り別値になっていることを
`theory.load_theory_frame()`の実行結果で確認した。

