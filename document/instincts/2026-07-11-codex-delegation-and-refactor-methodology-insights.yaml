# 仕様書ベースの機械的実装タスクは軽量モデルで十分、原因推論タスクは重いモデルが必要

## 背景
角番/端番リファクタは事前にClaude側で全ての判断（新旧概念の対応、具体的な数値、
一字一句のJapanese文言）を確定した「仕様書に従って配線するだけ」のタスクだった。
ユーザーから「GPT5.5はオーバースペックですね。5.4ミニでいいのでは？」という指摘を
受け、確かにこの種のタスクは reasoning より instruction-following の精度が問われる
性質だと合意した。対照的に、以前のmitoyaスコア同期バグ修正では「なぜ2つの実装が
食い違うのか」をコード読解から推論する必要があり、これは軽量モデルでは危険。

## アクション
- Codexへの委譲前に、そのタスクが「判断は済んでいて機械的に反映するだけ」か
  「まだ原因不明で調査・推論が必要」かを見極める。
- 前者（仕様書ベースの配線、決まった文字列のコピー、リネームの横展開等）は
  軽量モデル（例: gpt-5.4-mini相当）で依頼する。
- 後者（バグの原因推論、設計判断が必要な修正、ドキュメント読解からの結論導出）は
  上位モデル（例: gpt-5.5）を使う。
- 判断に迷う場合はユーザーに一声かけて確認する（本セッションでは既に走り出した
  タスクは完走させ、次回以降の運用ルールとして合意した）。

## 例
角番/端番リファクタ（7フェーズ、数値・文言確定済み）→ 次回はgpt-5.4-mini基準。
mitoya `_score_machine` のsection_baseline係数不一致の原因調査・修正 → gpt-5.5等
の上位モデルを使うべきだったタスクの実例。

