# ~/.codex/config.toml のデフォルトmodelが現行CLIで未対応のことがある

## 背景
角番/端番用語分離リファクタをCodexに委譲した際、1回目のタスクが起動20秒程度で
即座に失敗した。ステータス確認（`node codex-companion.mjs status <job-id> --json`）
すると `progressPreview` に "The 'gpt-5.6-luna' model requires a newer version of
Codex. Please upgrade to the latest app or CLI and try again." というエラーが記録
されていた。`~/.codex/config.toml` の `model = "gpt-5.6-luna"` がこの環境の
インストール済みCodex CLIでは未対応で、`--model` を明示指定しない限りこのデフォルト
値が使われて即失敗する。同じ設定ファイル内の他のプロファイル（`workspace-dev.config.toml`
等）は `model = "gpt-5.5"` を使っており、これは実際に動作した。

## アクション
- codex-rescue経由でCodexタスクが「起動直後（1分未満）に failed」した場合、まず
  `status <job-id> --json` の `progressPreview`/`summary` を見てモデル関連の
  エラーメッセージが無いか確認する（サンドボックス書き込み不可の症状とは別種の
  失敗モード）。
- モデルエラーが疑われる場合は、そのリポジトリの他のCodexプロファイル
  （`~/.codex/*.config.toml`）で実際に使われているmodel名を確認し、
  Agent呼び出し時のプロンプト先頭に `--model <確認済みモデル名>` を明示する。
- codex-rescueへの依頼文の先頭に `--write --background --model <name>` の形で
  ルーティングフラグを並べて渡せる（本セッションで実証済み）。

## 例
`--write --background --model gpt-5.5 Implement the terminology refactor...`
という形でcodex-rescueに再依頼し、`task-mrf65vyr-gdtk67` として正常に起動・
完走した（約17分、7フェーズの多ファイル変更）。

