# スキーマ定義スクリプトに書かれた列が、実際のDBファイルに存在するとは限らない

## 背景
`database/db_setup.py`の`machine_layout`テーブル定義には`rank_from_aisle`列が
含まれていたため、真の角番（通路距離）は既にDBに投入済みだろうと想定して分析を
始めたところ、`sqlite3`で`PRAGMA table_info(machine_layout)`を実行すると
実際のDBファイル（`db/*.db`）にはその列が存在しなかった。スキーマ定義ファイルは
更新されていたが、既存のDBファイル自体が`db_setup.py`から再生成されていなかった
（新規列追加時にマイグレーションが走っていなかった）ため、定義と実体が乖離していた。
`Heatmap/*.csv`（座標生成スクリプトの出力）には該当列が既にあり、そちらが
真のデータソースだった。

## アクション
- スキーマ定義ファイル（`db_setup.py`等）に書かれている列の存在を、実データでの
  検証なしに信頼しない。必ず`sqlite3`で対象DBファイルに対して
  `PRAGMA table_info(<table>)`を実行し、実列一覧を確認してから分析コードを書く。
- 定義と実体が乖離している場合は、CSVや他の一次データソースに正しい値が
  既に存在しないか確認してから、一回限りのマイグレーションスクリプトで
  DBへ追加投入する（冪等性を持たせ、対象ホールが限定的な場合はスキップ条件を
  明示する）。

## 例
`db/マルハンメガシティ2000-蒲田7.db`の`machine_layout`は当初
`rank_from_min`/`rank_from_max`のみで`rank_from_aisle`が無かった。
`Heatmap/2F・3F_floor_coordinates_kamata7.csv`から`database/migrate_add_rank_from_aisle.py`
で投入し、715行更新して解消した。
