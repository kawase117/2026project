# 蒲田1 Q5機種名（前3ヶ月上位）は翌3ヶ月もホール平均を+86上回ると検証済み

## 背景
`eda/kamata1_machinename_q5_backtest.py` で3ヶ月窓×5ペアのwalk-forwardを実施:
- 全5ペアでQ5 excess がプラス（+71, +48, +132, +96, +83）
- 平均: Q5 avg_diff=+157.81 vs All=+71.73、excess=+86.08
- 蒲田7（excess=+107）より低いが絶対値はホール全体稼働水準の差

フロア構造:
- 台番号 1631〜2415（全台 < 3000）→ 全台が「2F」扱い
- フロア分割は意味なし（蒲田7の「2F優先」ルールは蒲田1に適用不可）
- 3F列は全NaN（設定ミスではなく台番号が存在しない）

実装:
- バックテスト: `eda/kamata1_machinename_q5_backtest.py`
- 現在Q5リスト: `eda/kamata1_current_q5_list.py`
- 出力: `tmp/kamata1_machinename_q5_backtest/`, `tmp/kamata1_current_q5_list/`

## アクション
- 蒲田1ではフロア縛りなしでQ5機種名全体を同等優先度で扱う
- 3ヶ月ごとに `eda/kamata1_current_q5_list.py` でリストを更新
- [[which-axis-machinename-q5-backtest-confirmed]]（蒲田7版）と比較すると
  蒲田1のexcessは約80%水準（86 vs 107）
- [[kamata1-q5-backtest-not-yet-validated]] は本検証により陳腐化（削除対象）

