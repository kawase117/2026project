# 7系日の「When/Which代替パターン」は蒲田7・蒲田1の両方で独立に再現した

## 背景
2ホール独立検証（各3〜5ペア）で同じ方向の結果が出た:

| ホール | 全体excess | 7系日excess boost |
|---|---:|---:|
| 蒲田7（3ペア） | +107 | -7.98 |
| 蒲田1（5ペア） | +86 | -5.72 |

どちらも「7系日はAll avg_diffが上昇するが、Q5の相対優位（excess）は縮む」パターン。
解釈: 7系日はホールが設定を「広く浅く」入れる可能性が高く、
通常日に不調だった中位機種にも設定が入り、Q5の集中効果が薄れる。

## アクション
- 「7系日 × Q5 = ダブル効果」の期待は2ホールで棄却。他ホールでも否定的な先入観を持つ
- 7系日の正しい読み方: 「Q5以外でも打てる台が増える日」
- Q5リストは7系日かどうかに関わらず毎日適用するのが合理的
- 3ホール目（例: 楽園蒲田）で同様の検証を行えば汎化の確信がさらに上がる
- [[7kei-day-when-which-are-substitutes]]（蒲田7単独版）の上位互換として参照
