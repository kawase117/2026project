# v12b_debut_multiplier_halfモデルは10日間テストでほぼランダム水準

## 背景
2026-06-16〜06-25の10日間でpredict_gated(v12b_debut_multiplier_half)を実行し、
Top50推奨台の実績を検証した。hit@50 rate=8.2%（ランダム期待値≈8.5%）、
勝率=40.8%、平均percentile=53.1%と、統計的にランダム選択と区別不能な結果。
平均lift=+102枚は正だが、中央値は大半の日でマイナス（外れ値依存）。

## アクション
- v12bモデル単体での実運用投入は時期尚早と判断する
- 性能改善なしにTop50リストをそのまま使わない
- liftの平均値だけでなく中央値・分布を必ず確認する

## 例
| 指標 | 実績 | ランダム期待値 |
|------|------|--------------|
| hit@50 rate | 8.2% | ~8.5% |
| 勝率 | 40.8% | ~40-45% |
| percentile | 53.1% | 50% |
| lift平均 | +102枚 | 0枚 |
| lift中央値 | 大半マイナス | 0枚 |

