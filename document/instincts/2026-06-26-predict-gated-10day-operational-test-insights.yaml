# GATED日とNOGATE日で性能に決定的な差がある

## 背景
10日中8日がNOGATE fallback（active segmentが2未満でゲート無効化）。
GATED日（6/17, 6/23）のみlift=+446枚平均、percentile=58.3%と有望な結果。
NOGATE日は実質ランダム選択。MIN_ACTIVE_SEGMENTS=2が厳しすぎて
ゲート機能が80%の日で無効化されている。

## アクション
- ゲート条件（MIN_ACTIVE_SEGMENTS）の緩和を検討する
- GATED日のみの性能を分離評価してモデルの真の能力を測定する
- ゲートが効かない日は「推奨なし」とする運用も検討

## 例
GATED日(2日): lift=+647, +245 → 平均+446枚, percentile=58.3%
NOGATE日(8日): lift平均≈+3枚, percentile≈51.6% → ランダム同等

