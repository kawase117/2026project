# Top50の平均liftがプラスでも中央値がマイナスなら実質無効

## 背景
10日間テストでTop50平均差枚は多くの日でプラスだが、中央値(med_diff_top50)は
-200〜-500枚と大半の日でマイナス。少数の大勝ち台が平均を引き上げているだけで、
50台中の大半は負け台。平均liftだけを見ると「効いている」と誤認するリスクがある。

## アクション
- 予測評価では必ず平均値と中央値の両方を報告する
- 中央値がマイナスの場合、平均liftがプラスでも「実用的でない」と判断する
- 勝率（プラス差枚の台の割合）50%超を最低ラインとする

## 例
6/20: avg_diff_top50=+106枚(プラス) だが med_diff_top50=-500枚(大幅マイナス)
→ 平均だけ見ると「+114枚のlift」だが、実際は50台中33台が負け(勝率34%)
