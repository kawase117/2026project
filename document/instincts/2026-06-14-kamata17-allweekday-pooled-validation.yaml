# 法則①(diff_std>=median & payout_rate>=102%)は曜日限定不要、全曜日pooledで有意かつ直近データでも頑健

## 背景
[[strategy1-9hall-validation]] では蒲田1・蒲田7について「日曜限定で法則①
(diff_std>=median & payout_rate>=102%)がsplit-half頑健」と結論していたが、
これは過去の検証が日曜(target_weekday=6)に限定されていたための副産物で、
曜日限定が計算上必要というわけではなかった
(eda/kamata17_payout102_deepdive.py で再検証)。

### 曜日別Q5-Q1(walk-forward、AT機フィルタ済み)
- 蒲田1: 日曜+0.093, 火曜+0.074, 土曜+0.049が正で強いが、水曜+0.004,
  木曜+0.021, 金曜-0.019と弱い/負の曜日もある(曜日依存性あり)。
- 蒲田7: 月曜+0.100, 火曜+0.068, 水曜+0.083, 木曜+0.061, 金曜+0.045,
  土曜+0.100, 日曜+0.089と**全曜日で正**(曜日依存性が低い)。

### 全曜日pooled検証(walk-forward)
| | n | Q5-Q1 | 95%CI |
|---|---|---|---|
| 蒲田1単独 | 1570 | +0.068 | [+0.038, +0.101] 有意 |
| 蒲田7単独 | 4241 | +0.074 | [+0.052, +0.095] 有意 |
| 蒲田1+蒲田7統合 | 5811 | +0.073 | [+0.054, +0.091] 有意 |

日曜限定(n=302〜689)よりサンプル数が大幅に増え(n=1570〜5811)、それでも
両ホール単独・統合のすべてで95%CIが0を含まず有意。

### 直近25%holdoutでのOOSテスト(全曜日pooled)
- 蒲田1: 全期間+0.068 → 直近+0.046(減衰するが正)
- 蒲田7: 全期間+0.074 → 直近+0.095(むしろ強くなる)
  - 日曜限定の直近holdout(n=14)では-0.071に負転していたが、
    これはサンプル不足が原因と判明(全曜日pooledのn=650では正)。
- 統合・直近holdout: n=1484, Q5-Q1=+0.067, 95%CI=[+0.034, +0.103] 有意

### モンキーターンV(多台数24-29台)依存性の検証
蒲田7では「diff_std>=median & payout>=102%」の候補に上位4機種が
36週中36週(100%)出現する固定的な候補集合があり、特にモンキーターンV
(Q5=0.53/Q1=0.28, Q5-Q1=+0.25)が単独で強い。除外後も効果は残る:
- 全曜日・含む+0.074 → 除外+0.047
- 直近holdout・含む+0.095 → 除外+0.047
- 統合・直近holdout・除外: n=1409, Q5-Q1=+0.046,
  95%CI=[+0.008, +0.084](下限ぎりぎりだが有意)

候補集合自体の週次persistence(蒲田1: 翌週残存率92.6%/Jaccard85.7%,
蒲田7: 94.0%/89.0%)が非常に高く、候補機種は累積統計に基づくため
ローテーションというよりほぼ固定的に推移する。

## アクション
- 蒲田1・蒲田7で法則①を運用する際、**日曜限定は不要**。全曜日pooledの
  方がサンプル数が大幅に増え、有意性も維持される(むしろ蒲田7は
  直近データで全曜日pooledの方が頑健)。
- 蒲田7のように特定の多台数機種(diff_coinsをmachine_name単位で合算する
  実装のため、多台数機種はdiff_stdが構造的に大きくなりやすい)が候補に
  常時含まれる場合、その機種を除外しても効果が残るかを必ず確認する。
  除外後にCI下限が0付近(ぎりぎり有意)になる場合は、運用上のリスクとして
  認識する。
- 新規ホールで法則①を検証する際は、最初から曜日を絞らず全曜日pooledで
  walk-forwardを行い、サンプル数を確保した上で曜日別の偏りを別途確認する
  方が効率的。曜日限定は「予測したい曜日を後で絞り込む」運用上の選択で
  あり、検証段階での制約にすべきではない。

## 例
```python
# eda/kamata17_payout102_deepdive.py
# [5] analyze_all_weekday_pooled(): 全曜日でrun_backtest()し、
#     蒲田1/蒲田7/統合のQ5-Q1とbootstrap CIを算出
# [7] analyze_kamata7_excl_monkeyturn(): run_backtest(..., exclude_machines=(...))
#     で特定機種を候補から除外して効果の依存度を確認
# [8] analyze_all_weekday_recent_oos(): 直近25%をholdoutにして
#     全曜日pooled・モンキーターンV除外版の両方でOOS検証
```
