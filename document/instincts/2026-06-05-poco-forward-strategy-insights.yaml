# 入店後の台選択：G数と差枚が唯一のリアルタイムシグナル

## 背景
ぽこが事後発表である以上、入店時点では「今日どの機種に高設定が入っているか」は不明。
リアルタイムで使える情報はホール内の台データのみ。

高設定台の特徴:
- G数が高い（多くの客に長時間打ってもらえている）
- 差枚がプラス推移
- 複数台が同時に好調（機種単位での全台設定の場合）

発表日の実績データ:
- avg_G: 約5,000〜8,000（高設定台は長く打たれる）
- 勝率: ジャグラー系90%超、AT系60〜80%

## アクション
入店後の判断フロー:
G数 >= 4,000 AND 差枚がプラス -> 高設定の可能性あり -> 着席検討
G数 < 2,000 OR 差枚が大マイナス -> 見送り
複数台が好調 -> 機種全体に設定が入っている可能性 -> より積極的に判断

## 例
木曜訪問 -> からくりサーカスのG数を確認 -> 3台中2台がG数5,000超・プラス差枚
-> 機種全台設定の可能性が高い -> 空き台を打つ判断

