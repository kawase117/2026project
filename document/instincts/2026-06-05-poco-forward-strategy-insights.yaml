# K1は土日集中型：平日の機種全は不明が多く予測精度が下がる

## 背景
K1の高設定発表日割合（通常日）:
- 土曜: 93.9%、日曜: 90.6%
- 平日（月〜金）: 59〜65%（土日の約2/3）

さらにK1平日は kamata1_full_half='不明' の日が多く（火9日・水9日・金9日 /47日）、
どの機種に設定が入っているかの予測が困難。

K1専用の頻出機種（K7より登場率が高い）:
- 戦国乙女4（K1:29回 vs K7:22回）
- 甲鉄城のカバネリ 海門（K1:21回 vs K7:14回）
- 東京喰種（K1:12回 vs K7:3回）

## アクション
- K1への訪問は土日を優先する
- K1専用機種（戦国乙女4・カバネリ海門・東京喰種）は土日に狙う
- 平日K1でどの機種か不明な場合はK7を優先してK1はサブ扱い

## 例
土曜日訪問: K1で戦国乙女4のG数を確認 -> 複数台好調なら着席
平日訪問: K7で候補機種を狙い、K1は現場確認のみで判断
