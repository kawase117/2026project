# 発表回数最多のガルパンが実績最弱：発表頻度と設定質は比例しない

## 背景
K7で発表回数が最多（27回・10ヶ月）のガールズ&パンツァー 最終章が、
全発表機種中で最も低い実績となっている。

ガルパン: avg+1,070 / 勝率52.7% / P<=−5k: 39.2%
全体平均（発表機種）: avg+2,500前後 / 勝率70%前後

## アクション
- 発表回数ランキング上位 ≠ 高実績機種
- 機種を評価する際は必ず「発表回数 × 実績（avg差枚・勝率・std）」で判断
- ガルパンは「形式的に毎回発表される慣例機種」の可能性がある
- 実戦では台数が少なく、高設定が入っていても1〜2台のみの可能性

## 例
発表ランキング1位: ガルパン
実績ランキング上位: L麻雀物語・SAO・アズレン（全く異なる顔ぶれ）
-> 実績ランキングを見て機種を選ぶこと

