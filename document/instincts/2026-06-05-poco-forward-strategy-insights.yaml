# ぽこは事後発表：当日の台選択には使えない

## 背景
ぽこ（poco）のデータは「その日の結果が出た後」に発表される事後記録である。
当日朝にぽこを確認して「今日発表された機種を打ちに行く」という使い方は不可能。

| 用途 | 可否 |
|------|------|
| 当日の台選択 | NG（事後発表のため不可） |
| 過去パターンの統計分析 | OK（11ヶ月分の履歴として活用） |
| 打った台の事後検証 | OK（翌日以降に振り返り可能） |
| 機種・日付の傾向把握 | OK（前向き予測の材料として活用） |

## アクション
ぽこデータの正しい使い方：
1. 「どの日付属性（DD・曜日・イベント日）に高設定が多いか」を統計化
2. 「どの機種が特定の日付条件で登場しやすいか」をパターン化
3. 当日の現場判断はG数・差枚などの観察データに基づく

## 例
誤った使い方：「今日ぽこでガルパンが発表された → 今すぐ打ちに行く」
正しい使い方：「過去のパターンで木曜にからくりが5回登場 → 木曜はからくりを意識して探す」

