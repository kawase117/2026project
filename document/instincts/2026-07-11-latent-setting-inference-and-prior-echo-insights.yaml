# ゼロから設計した潜在変数モデルの枠組みが、既存プロジェクトで既に実装・完走済みだった

## 背景
ユーザーとClaudeで「差枚を教師にせず、設定別BB/RB公称確率からベイズ事後分布を推定し、
walk-forwardで実差枚評価する」という潜在変数モデルの設計を1から議論し、Phase0(データ
実現可能性調査)まで進めたところ、`ml/experiments/jug_rb_setting_prediction/`という
既存プロジェクトが、ほぼ同じ設計（1geki.jp/jugglersnet.comスペック表→EM経験事前→
Binomial尤度→walk-forward実差枚評価→独立検証EDA）を既に実装し、9ホール分完走・
裁定#1〜#30まで進んでいたことが判明した。ユーザーの「以前一撃というサイトから
スクレイピングするProjectがあった」という一言がきっかけで発覚した。

## アクション
- 新しい分析設計（特に「差枚を使わない」「ベイズ推定」「スペック表」等の特徴的な
  キーワードを含む設計）を立てる前に、`document/plans/`・`ml/experiments/`配下を
  該当キーワードでGrepし、類似プロジェクトが既に存在しないか確認する。
- ユーザーが「以前〜というプロジェクトがあった」と言及した場合、それは記憶にない
  未知の情報ではなく、実装が既にある可能性が高いという強いシグナルとして扱い、
  即座にファイル検索で実態を確認する。
- 既存実装が見つかった場合、ゼロから再設計するのではなく、その実装の現在の停止点・
  未解決事項を特定し、そこから継続する方が圧倒的に効率的。

## 例
`ml/experiments/jug_rb_setting_prediction/config.py`の`JUGGLER_FAMILY_SPECS`に
8系統のジャグラー設定別スペックが既に整備済みだったため、Phase0で「スペックデータ
整備」を新規タスクとして計画していた分がそのまま不要になった。

