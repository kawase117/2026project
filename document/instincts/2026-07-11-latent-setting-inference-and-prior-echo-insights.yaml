# 選択ロジックと評価指標が同じ事前分布・スペック表換算を共有すると、自己言及的な偽エッジが生まれる

## 背景
蒲田7ジャグラー日次選択（`jug_rb_setting_prediction`裁定#13）で、B1の評価指標
（p_high・e_payoutという「モデル通貨」）は+2.5ppのエッジを示していたが、これは
選択ロジック（family別の設定事後分布）と評価指標（同じ事後分布からの期待機械割
換算）が同じ計算基盤を共有していたために生じた自己言及的な結果だった。実際の選択は
100%ゴーゴージャグラー3（family事前が最も高い機種）に退化しており、実差枚で検証
すると+2.5ppは消滅（+0.1〜0.3pp、CIはゼロを含む）した。

## アクション
- 選択・推薦ロジックの「良さ」を測る指標が、そのロジック自身が使った変換・事前分布・
  スペック表と同じ計算基盤に依存している場合、その指標は信用しない。
- 必ず、選択ロジックと完全に独立した情報源（この場合は実差枚=DBの生の入出金データ）
  で答え合わせをする。モデル内部の「期待値」だけで運用判断をしない。
- 選択結果が特定の1カテゴリ(機種・商品カテゴリ等)に極端に集中している場合、それは
  「個別の対象を見ている」のではなく「カテゴリレベルの事前分布に支配されている」
  退化のシグナルなので、集中度を必ず確認する。

## 例
`stage4_daily_selections_B1.csv`の549選択が全てゴーゴージャグラー3だったことが
退化の直接証拠。`stage5_rank_daily.py`（スペック表非依存の観測ベースmid-pランク）
に切り替えて選択の多様性を回復させ、実差枚で再評価する対策を取った。

