# 判定ラベルの不一致は、データの矛盾ではなく判定基準（2値↔3値等）の変更による用語ドリフトの可能性を先に確認する

## 背景
`jug_rb_setting_prediction`裁定#17（単一ホール検証時、裁定#14の2値基準:
「CIがゼロをまたいだらnegative result」）では蒲田7を「negative」と記録していたが、
9ホール展開後のmulti_hall_pipeline.pyのverdict判定（3値基準: ci_lower>0=positive、
ci_upper<0=negative、それ以外=neutral）では同じホールが「neutral」と表示されて
いた。点推定・CI自体はほぼ変化していなかった(+0.09pp[−0.88,+1.08]→+0.04pp
[−1.12,+1.27]、両方ゼロをまたぐ)。

## アクション
- ラベルの不一致を見つけたら、まず生の数値（点推定・CI）が実質的に変化しているか
  を先に確認する。数値が安定していてラベルだけ違う場合、判定基準の定義そのものが
  プロジェクトの途中で変わった可能性を疑う（実際にverdict判定コードを
  `Grep`して確認する）。
- 数値が本当に変わっている場合のみ、再実行・スペック修正等の実質的な原因調査に進む。
- 用語ドリフトが原因と判明した場合、コード修正は不要。レポート内の呼称を新しい
  基準に統一する記録だけで解決する。

## 例
`multi_hall_pipeline.py`の`verdict = "positive" if ci_lower > 0 else ("negative"
if ci_upper < 0 else "neutral")`を確認し、蒲田7のCIが当時も今もゼロをまたいで
いることから、コード修正なしで裁定として解消した(裁定#31)。
