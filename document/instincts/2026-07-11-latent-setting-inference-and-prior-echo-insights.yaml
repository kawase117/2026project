# 実力差ゼロの領域で過去の勝ち手を追うランキングは、平均回帰によりランダム選択より系統的に劣る

## 背景
ヒロキホール（事前の分散分解でジャグ台×日シグナル検出限界以下=≈0と確定済み）で、
B1R（過去180日の機種内mid-pランク）による選択がB0（ランダム選択）に対し
実差枚で有意にマイナス（−1.04pp、CI[−2.00,−0.13]）だった。家系echo（事前分布に
支配される退化）や縮小推定不足のアーティファクト（高G台が縮小されず居着く）を
個別に検証したが、いずれも該当しなかった（mean_Gとb_rank_180dの相関はr=0.13と弱く、
最頻選択台の平均G数もホール内で高い方ではなかった）。

## アクション
- 実力差がゼロと既に確定している領域では、「過去に良かった対象」をランキングで
  選び続ける戦略が実差枚・実成果で有意にマイナスになることがあり、これはバグでは
  なく統計的に予想される現象（平均回帰: 過去の好成績は運によるものであり、運は
  持続しないため、その後の成績は平均に戻る。ランダム選択には運による過大評価の
  混入がないため、相対的に有利になる）と理解する。
- 有意なマイナス結果が出た場合、まず「家系echo」（カテゴリ事前分布への支配）と
  「縮小推定不足」（データ量が多い対象が居着くアーティファクト）の2つを個別に
  棄却してから、平均回帰による健全な負け方だと結論する。
- 運用上の教訓: シグナルの存在を確認する前に、後ろ向きランキング手法を実運用に
  投入すると、何もしない(ランダム相当)よりも悪い結果になるリスクがある。

## 例
ヒロキの最頻選択台(machine_number=2008、552枠中143回=26%)は、平均G数が
ホール内で高い方ではなく(2950、75パーセンタイル閾値3691.8未満)、縮小前の
生スコアでも57台中2位と、データ量由来の偏りではなく実際に過去実績が良かった台
だった。それでも将来の実差枚では負けている。

