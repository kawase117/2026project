# is_top_2 はエキスパート内で計算しなければならない

## 背景
末尾別LTRパイプラインでは複数のエキスパート（2F_N / 3F_N / 3F_A / 2F_A）が
それぞれ独立したモデルを持つ。
評価指標 hit@2 は「エキスパート内10アイテム中、予測top2が実績top2を含むか」で定義。
（metrics_ops.py: true_top2 = actual_raw_diff の上位2、エキスパート内のみ）

当初の is_top_2 は全エキスパート統合（40 entity_keys）でのグローバルtop2だった。
これにより：
- 3F_A: グローバルtop2にほぼ入らず → ほぼ全行 is_top_2=0 → 勾配ほぼゼロ
- N型: グローバルtop2を取りやすいため偶然機能 → 設計的には同じ欠陥

## 修正（tail_ltr_split_rule_wf.py）

```python
# 変更前（グローバル）
rk = agg.groupby("date", sort=False)["total_diff_coins"].rank(
    method="first", ascending=False
)

# 変更後（エキスパート内）
rk = agg.groupby(["date", "group_key"], sort=False)["total_diff_coins"].rank(
    method="first", ascending=False
)
agg["is_top_2"] = (rk <= 2).astype(int)
```

## 効果（digit_lag_v1 → digit_lag_v2_withinexpert、testperiod 144日）

| expert | hit@2 変更前 | hit@2 変更後 | 改善幅 |
|--------|------------|------------|--------|
| 2F_N   | 0.958      | 1.000      | +4.2pp |
| 3F_N   | 0.917      | 0.993      | +7.6pp |
| 3F_A   | 0.715      | 0.986      | +27.1pp |

3F_A の大幅改善は「正しい問いを学習させたら正しく答えられた」ことを示す。
モデルの改善ではなくタスク定義の修正。

## 例
NG: groupby("date") → 全40 entity_keys中のtop2 → 3F_Aはほぼ0
OK: groupby(["date", "group_key"]) → 各expert内10アイテム中のtop2 → 毎日2行が正例確定

