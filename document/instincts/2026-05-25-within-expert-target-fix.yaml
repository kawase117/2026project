# 学習ターゲットと評価指標のスコープを必ず揃える

## 背景
hit@2 が 71% に留まっていた原因が「学習スコープ（グローバル）と
評価スコープ（エキスパート内）の不一致」だったことが今回判明した。

## アクション
LTRの学習ターゲットを設計するとき、以下を必ず確認する：
1. 評価指標の group_ids に何を使っているか（date のみ？ date x group_key？）
2. 学習ターゲットのランク計算の groupby が評価の group_ids と一致しているか
3. 各グループ内で positive（is_top_2=1）が十分な頻度で出現しているか
   （全行が0のグループは勾配ゼロ → 学習不能）

## 例
評価: score_top2_prediction_day(rank_df) → rank_df はエキスパート内の10行
学習: is_top_2 = groupby(["date", "group_key"]).rank <= 2  ← 一致させる
