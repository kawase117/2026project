# パラダイム転換：「強いホール当て」から「スパイク日当て」へ

## 背景
従来の問題：候補3ホール（蒲田7・蒲田1・ARROW）で「平均的に強い」ホールを毎日選ぶ。
但し、弱いホール（例：みとや大森町）も月に1回は 200+ の爆発日を持つ。
その日のみとや大森町は、蒲田7の平均より大きく出している可能性がある。

発見：全ホール毎日スコアリングで「各ホール内で上位10%日」「>=200の爆発日」を狙えば、
弱ホールの月1回チャンスを捕捉でき、トータル期待値が向上する。

## アクション
1. 毎日全9ホールをスコアリング（P(>=100), P(>=200), P(>=300)で多元的評価）
2. 日別意思決定を「このホール確率」から「全ホール最大値を当てる」に変更
3. Walk-forward 最適化：
   - Tuning期間で edge × weight(w100, w200, w300) をグリッド探索
   - 期待スコア = 100 × (w100×P100 + w200×P200 + w300×P300)
   - 最適パラメータを holdout に固定適用
4. 評価軸を hit@1/hit@2 から「oracle_daily_max capture rate」（200+日何割拾えたか）に転換

## 例
従来（候補3ホール）：蒲田7=56% 選択率（3ホール内）⇒ みとや大森町の爆発日を逃す
新規（全9ホール）：多閾値スコアで、月1回の弱ホール爆発も組み込み ⇒ スパイク捕捉率向上

