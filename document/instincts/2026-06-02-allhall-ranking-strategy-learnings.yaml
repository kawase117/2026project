# Oracle適合度と運用多様性のトレードオフ

## 背景
現在の最適化（weights=(1,1,2)）：期待値=264.73（oracle）vs 実績=123.18
理由：蒲田7への 70% 集中で、弱ホール爆発日（150日中36日が他ホール最強）をほぼ逃す。

もし max_share=50% 制約を加えれば：
- 期待値は 5-10% 低下するが（～115に低下）、
- 弱ホール爆発日（月1回 200+ スパイク）の捕捉確率が 5-10% 向上
- 結果、年間安定性が向上し、「月1回は大きな成功」という体験が増加

## アクション
目的関数を複合評価に変更：
```
composite_score = 0.7 × (expected_diff) + 0.3 × (spike_capture_rate)
```

純粋な期待値最大化（0.7×expected_diff）から、
スパイク日捕捉度も同時に評価する複合目標へ転換。

## 例
選択肢A（現在）：毎日蒲田7 → 平均123 だが月1回は逃す → 心理的フラストレーション
選択肢B（改善案）：蒲田7 50% + 他 50% → 平均115 だが月1回以上キャッチ → 安定感

