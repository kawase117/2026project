# 全ホール毎日スコアリング機構：実装の詳細

## 背景
機構：各ホール h に対して、各日 d で:
- モデル予測: P_h_d(>=100), P_h_d(>=200), P_h_d(>=300)
- スコア化: score_h_d = edge + w100×P100 + w200×P200 + w300×P300
- ランキング: argmax_h score_h_d でホール h を選択

## アクション
実装ステップ：
1. CatBoost か他の多クラス器で、各ホール × 各閾値の確率予測を出力
2. Walk-forward loop:
   - Tuning: edge, w100, w200, w300 の 4D グリッド探索
   - Holdout: 最適 (edge, weights) を固定使用
3. 出力テーブル:
   - allhall_tune_prediction_table.csv: tuning期の全日全ホールスコア
   - allhall_holdout_prediction_table.csv: holdout期の予測
   - allhall_daily_decision_plan.csv: 日別選択ホール + 成績

## 例
入力モデル出力（1日1ホール）：
```
date=2026-02-15, hall=蒲田7
  P(>=100)=0.75, P(>=200)=0.45, P(>=300)=0.20
```
グリッド最適化結果: edge=0, weights=(1, 1, 2)
スコア = 0 + 1×0.75 + 1×0.45 + 2×0.20 = 1.60

別ホール蒲田1（同日）:
  P(>=100)=0.70, P(>=200)=0.30, P(>=300)=0.10
  スコア = 1×0.70 + 1×0.30 + 2×0.10 = 1.20

⇒ 蒲田7 選択（スコア 1.60 > 1.20）

