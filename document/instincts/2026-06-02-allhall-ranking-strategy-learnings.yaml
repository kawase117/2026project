# ホール偏りペナルティの必須性：過度な集中を検出・修正

## 背景
実装直後の結果（edge=0, weights=(1,1,2)）：
- 蒲田7 70% 選択率（150日中105日）
- だが実績では蒲田7は全ホール中 1位 のみ 24% （36/150日）
- つまり「予測70% vs 実績24%」という過度な偏り

根本原因：期待値最大化は制約なしで「最強ホール」に重力を持つ。
複数ホール評価点が近い場合でも、平均的に強いホールに吸い寄せられる。

## アクション
3つの対策を段階的実装：
1. **Soft constraint**: 同一ホール連続日数ペナルティを目的関数に追加
2. **Hard constraint**: max_share=50% per hall per period（期間内で各ホール最大50%）
3. **Operational shift**: Hit@2 運用（Top2から当日最終判断）で完全自動化を避ける

特に対策3が効果的：Top2（蒲田7＋蒲田1）が確定したら、当日の詳細情報・運営状況で
最終判定 ⇒ 完全ロックイン（単一ホール70%継続）を防ぐ

## 例
❌ 現状：毎日自動で蒲田7を選択 → 爆発日見逃し
✅ 目標：蒲田7 + 蒲田1 Top2 を毎日提示 → オペレーターが当日判断で偏りを回避

