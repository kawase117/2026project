# 楽園蒲田は直近1ヶ月でRB/BBは弱い改善(z=+1.83/+0.80)だが機械割は大幅上昇+分散拡大、「常時設定2固定」説は分散面で不支持

## 背景
うみねこのなく頃に2、楽園蒲田の全期間(導入〜6/20, n=414)vs直近1ヶ月(6/21〜7/20, n=63)比較。RB: games/RB 426.4→401.2(z=+1.83, 旧基準からの期待値843.0に対し実測896)。BB: 387.0→377.2(z=+0.80)。両方とも改善方向だが単独では非有意水準に届かない弱いシグナル。
一方、機械割は101.09%→103.19%と2.1pt上昇し、日次標準偏差は8.08→9.32へ拡大(最大132.4%、最小82.2%)。もし「常時設定2固定」なら分散は縮小して104%付近に収束するはずだが、実際は逆に分散が拡大しており、この仮説は支持されない。
ユーザーからの代替仮説: 「設定2以上投入→強い打ち手(うちて)が集中→完全攻略率が上がる→機械割が設定要因単体の予測より大きく跳ねる」。本機種はA+ARTタイプの技術介入機であり[[juggler-104pct-threshold-meaning-by-model]]と異なりBB/RBだけでは出玉が決まらない。RB/BBの弱い改善と機械割の急改善+分散拡大というギャップは、この仮説と整合的(設定変化だけでは機械割の跳ねと分散拡大の両方を説明しにくい)。
台番号集中度(同じ強い打ち手が同じ台に居着いているか)は未検証。

## アクション
- 技術介入機(A+ARTタイプ)で「特定ホールが高設定を投入し続けている」という疑惑を検証する際は、機械割単体で判断せず、必ずRB/BB(スキル非依存)の月次集計をまず確認する
- 機械割の変化がRB/BBの変化幅より明らかに大きい場合、うちて技術の上乗せ効果を疑い、台番号別の集中度チェック(同じ強い打ち手が居着いていないか)を次の検証ステップとする
- 「常時設定X固定」を検証する際は平均値の変化だけでなく必ず日次分散(std)も確認する。固定投入なら分散縮小、偶発的な高設定混入の増加なら分散拡大という逆の予測になるため、分散の動きだけで両仮説を切り分けられる
- 楽園蒲田の台番号集中度チェックは未実施(次回セッションのTODO)

## 例
楽園蒲田うみねこ2: RB z=+1.83(弱い改善), BB z=+0.80(ほぼ無変化), 機械割101.09%→103.19%(+2.1pt), 日次std 8.08→9.32(拡大)。
「常時設定2固定」なら分散縮小のはずが逆に拡大 → この仮説はデータ非支持。「強い打ち手集中による上乗せ」仮説の方がRB/BBとの乖離を説明しやすい。
