# ベースライン比較は必ずホール別に出す。ホール横断の平均・順位比較は集計方法の実装差を見落とすリスクがある

## 背景
うみねこのなく頃に2、8ホールのRB/BB/合算ベースライン比較で、ベルシティ雑色がRBでは中〜下位(93.9%、公称設定1相当比)なのにBB(97.8%、8ホール中1位)・合算(95.9%)では単独トップという順位の逆転が見つかった。ユーザー指摘: 「データカウンターの集計方法によって、計算が微妙に異なっている可能性がある」。この矛盾はホール横断で平均・範囲だけを見ていては気づけず、ホール別に並べて初めて発見できた。
原因はカウンター実装差(rb_count/bb_count判定ロジックのホール間差異)、サンプル数不足によるブレ、または純粋なホール戦略差のいずれかが考えられるが未特定。

## アクション
- 複数ホールを分析する際は、必ずホール別の実測値を一覧表示し、ホール横断の平均や範囲だけで済ませない
- 指標間(RB/BB/合算等)でホールの順位が入れ替わる箇所を見つけたら、まずそのホールのスクレイパー/DBスキーマが他ホールと同一処理系かを確認する
- 順位矛盾を抱えるホールでの「一致」した高設定シグナル([[umineko2-kamata1-dd23-cross-metric-candidate]]のベルシティ雑色・DD17等)は、他ホールでの同種シグナルより信頼度を一段階下げて扱う

## 例
ベルシティ雑色: RB到達率93.9%(8ホール中中位)だがBB到達率97.8%(8ホール中1位)、合算95.9%。他7ホールはRB/BB/合算の順位がおおむね連動しているのに対し、ベルシティ雑色だけ逆転していた。
