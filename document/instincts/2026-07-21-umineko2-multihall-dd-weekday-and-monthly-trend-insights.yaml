# 蒲田1・蒲田7は最大サンプルホールとして直近1ヶ月も全期間とほぼ同水準、他ホールはホールごとに逆方向のトレンド変化

## 背景
うみねこのなく頃に2、8ホールの全期間→直近1ヶ月(6/21〜7/20)機械割比較。蒲田1: 101.67%→101.74%(n=21、ほぼ横ばい)。蒲田7: 101.08%→100.69%(n=113、最大サンプルで安定)。一方、みとや(100.62%→99.19%, n=26)・ベルシティ雑色(101.10%→98.42%, n=24)・レイトギャップ平和島(101.41%→98.98%, n=18)は明確な悪化、楽園蒲田(101.09%→103.19%, n=63)のみ明確な改善(詳細は[[umineko2-rakuen-kamata-recent-trend-skill-hypothesis]])。ARROW池上・ヒロキ東口はn=2〜7と少なくトレンド判断保留。
サンプル数が最大の2ホール(蒲田1・蒲田7)が安定している一方、中小ホールでホールごとに逆方向のトレンドが出ている点は、機種全体の外部要因(スペック改訂等)ではなく、ホール個別の投入判断が動いていることを示唆する。[[feedback-no-cross-hall-pooling]]の原則と整合。

## アクション
- 複数ホールでトレンド変化を比較する際は、サンプル数が少ないホール(n<10程度)のトレンドは「判断保留」として明示し、安定ホール(蒲田1・蒲田7クラスの大サンプル)の横ばいと同列に扱わない
- ホールごとに逆方向のトレンドが出ている場合、それ自体が「機種要因ではなくホール個別要因」であることの傍証として扱ってよい
- 翌月以降のデータが揃った時点で、みとや・ベルシティ雑色・レイトギャップ平和島の悪化トレンド、楽園蒲田の改善トレンドがそれぞれ継続するか再検証する

## 例
安定(大サンプル): 蒲田1 n=21 101.67%→101.74%、蒲田7 n=113 101.08%→100.69%。
悪化: みとや 100.62%→99.19%、ベルシティ雑色 101.10%→98.42%、レイトギャップ平和島 101.41%→98.98%。
改善: 楽園蒲田 101.09%→103.19%。
判断保留(小サンプル): ARROW池上(n=7)、ヒロキ東口(n=2)。
