# 回転数の残差は稼働/客足パターンを反映するだけで、設定投入シグナルとして扱ってはいけない

## 背景
うみねこのなく頃に2、蒲田7の曜日別回転数z検定で水(z=-3.91)・金(z=-3.41)・木(z=-2.53)が強い負の逸脱を示したが、これは単に平日の来店客数が少ないという稼働構造を反映しているだけで、高設定/低設定投入とは無関係。差枚・機械割・RB・BB・合算の残差分析と回転数の残差分析を同列の「設定シグナル候補」として扱うと、稼働パターンのノイズを設定シグナルと誤読するリスクがある。

## アクション
- DD別・曜日別の残差分析を行う際は、回転数(games)の残差は「客足・稼働量」の指標として別枠で解釈し、差枚・機械割・RB・BB・合算のような設定関連指標とは切り分けて報告する
- 回転数の残差が大きいこと自体を高設定/低設定のエビデンスとして引用しない
- 稼働量の変動が他の指標(差枚等)の分散に与える影響(サンプル数減少によるノイズ増大等)を考慮する際の背景情報としてのみ使う

## 例
蒲田7・水曜 回転数z=-3.91(平日客足減の反映) → これを「水曜は低設定寄り」と解釈するのは誤り。同曜日の差枚z=+0.18、機械割z=-0.18とほぼ無風であることからも、回転数の逸脱が設定シグナルでないことが確認できる。
