# 蒲田1・土曜はRB/合算で低設定寄りが2機種(サンダーV・うみねこ2)で再現、ただし差枚には出ておらず断定は時期尚早

## 背景
うみねこのなく頃に2の3000G以上フィルタで、蒲田1・土曜のRB z=-3.11(games/RB=549.1、全区分中最強の逸脱)、合算 z=-2.38。同じ蒲田1で別機種サンダーV(document/kamata1_theory.md記載)でも土曜のRB確率悪化が既に記録されており、機種横断で同方向のシグナルが再現した。単一機種・多重検定のノイズより信頼度は高いと判断できる。
ただし本機種の差枚(|z|<1.5)・機械割(|z|<1.5)では土曜の顕著な悪化は検出されなかった。RB確率だけが悪化し実際の出玉(差枚)には反映されていない=ボーナス種別選択率の偏りに留まる可能性があり、「蒲田1土曜=低設定」と断定するには材料不足。

## アクション
- 蒲田1で新機種を検証する際は、土曜のRB確率を優先的にチェックし、既知パターンとの整合を確認する
- RB確率が悪化しているのに差枚・機械割に出ていない場合は「低設定投入」と即断せず、ボーナス種別の偏り(RB<->BB振り替わり)や客層変化(稼働集中による分散悪化)の可能性を先に検討する
- 蒲田1の土曜低迷が「ホール全体の稼働戦略」なのか「機種固有」なのかを切り分けるため、稼働中の他機種(ジャグラー系等)でも同様の検証を行う

## 例
うみねこ2: 蒲田1・土曜 RB z=-3.11(games/RB=549.1) / 合算 z=-2.38 / 差枚|z|<1.5 / 機械割|z|<1.5。
サンダーV(前回セッション): 同ホール同曜日でRB確率悪化を確認済み(document/kamata1_theory.md参照)。
