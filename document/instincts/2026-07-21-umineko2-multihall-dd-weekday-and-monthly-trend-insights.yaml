# 技術介入機の機械割はうちて技術で数%変動するため、設定シグナルとしてはRB/BB/合算(スキル非依存)を優先する

## 背景
うみねこのなく頃に2はA+ARTタイプのスマスロ(技術介入機)。ユーザー指摘: 「うちての技術によって機械割が数%増減する」。実際、楽園蒲田の直近1ヶ月分析でRB(z=+1.83)/BB(z=+0.80)という弱い改善に対し、機械割は+2.1ptという大きな上昇を示し、乖離が観測された([[umineko2-rakuen-kamata-recent-trend-skill-hypothesis]]参照)。この乖離は「機械割だけを見て設定変化と判断する」ことの危険性を具体的に示す実例となった。
またベースラインの絶対水準についても、RB/BB/合算はいずれも「公称設定1相当をやや下回る」水準だったが、機械割ベースだと99.5〜101.3%と更に低い実態が見えており、確率面の相対評価と実出玉の評価は別軸で確認する必要がある。

## アクション
- A+ARTタイプ・技術介入機を分析する際は、設定判定の主指標にRB・BB・合算(いずれもボーナス回数ベースでスキル非依存)を用い、機械割は補助指標として扱う
- 機械割の変化幅がRB/BB/合算の変化幅より明らかに大きい場合、うちて技術の上乗せ効果を疑い、単純に「設定が上がった」と結論しない
- 機種を問わず、技術介入の有無(A+ART/ART/AT等のタイプ)を導入前に確認し、技術介入機であれば機械割単体での設定判定を避ける方針をあらかじめ立てる

## 例
楽園蒲田うみねこ2直近1ヶ月: RB改善弱い(z=+1.83)・BB改善ほぼなし(z=+0.80)なのに機械割は+2.1pt上昇、日次std拡大。機械割だけを見れば「大きく改善」と誤読するところだった。
