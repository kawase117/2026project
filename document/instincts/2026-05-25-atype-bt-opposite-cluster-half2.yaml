# A型とBTは水曜を除く全曜日で逆端クラスタを形成。これがハーフ×2の「2本」の実体

## 背景
atype_weekday_cluster.csv と bt_weekday_cluster.csv（mode=normal）の比較:

| 曜日 | A型クラスタ | A型delta | BTクラスタ | BTdelta | 末尾距離 |
|------|-----------|---------|-----------|---------|---------|
| 月   | 2-3-4     |  15.8   | 9-0-1     |  69.5   | ≈4      |
| 火   | 3-4-5     |  31.1   | 7-8-9     |  88.4   | ≈4      |
| 水   | 3-4-5     |  18.7   | 3-4-5     |  60.6   |  0（同）|
| 木   | 0-1-2     |  58.7   | 8-9-0     |  68.0   | ≈4      |
| 金   | 4-5-6     |  24.7   | 0-1-2     |  82.9   | ≈4      |
| 土   | 1-2-3     |  45.6   | 7-8-9     |  71.3   | ≈5      |
| 日   | 6-7-8     |  16.6   | 0-1-2     | 116.7   | ≈4      |

「ホールが設定を2箇所に入れる際、A型とBTで異なる末尾クラスタを割り当てている」パターン。
[[top2-digit-usually-outside-best-cluster]] でtop2がクラスタ外に出やすい発見とも整合する。

水曜のみ例外（両者とも3-4-5）: 「末尾基準」投入日は機種タイプを問わず同一末尾に投入
という方針と整合する。

⚠️ 訂正（2026-05-25 floor_atype分析後）: 上記の「水曜は同じ3-4-5」は2Fと3Fを混在させた粗い集計の結果。
floor × atype の4グループ分割では水曜も全グループ異なるクラスタになる（2F_A: 3-4-5, 2F_N: 9-0-1, 3F_A: 1-2-3, 3F_N: 8-9-0）。
→ [[floor-atype-wednesday-clusters-all-different]] 参照。

## アクション
ML特徴量設計では A型とBTを同一フラグ（is_non_AT）でまとめるのではなく、
曜日×機種タイプの交互作用を別々に設計する必要がある。
水曜の特例を考慮: `is_wednesday` の場合は A型・BT共に同じ末尾特徴量を使用してよい。

## 例
土曜: A型の末尾1-2-3（delta=45.6）と BT の末尾7-8-9（delta=71.3）が同時に設定が入っている
日曜: A型の末尾6-7-8（delta=16.6）と BT の末尾0-1-2（delta=116.7）が逆端に配置

