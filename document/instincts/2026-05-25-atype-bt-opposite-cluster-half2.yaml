# 土曜はpct_low_gini=100%（常に列間で均等分散）。三台並びは列単位でなく末尾連番

## 背景
row_weekday_summary.csv のpct_low_gini（値が高いほど列間均等分散）:
- 土: 100.0%（全46日で均等）
- 金: 97.8%
- 火: 95.7%
- 月・木: 93.5%
- 水: 91.3%
- 日: 90.9%

土曜が全日100%低ジニ = 設定は物理列間で均等に分散している。
土曜「三台並び」が「同列の3台」でなく「末尾連番の3台（末尾6・7・8等）」であることと整合。

注意: row_concentration_ratio（比率）は水曜=-405のような極端値が出るため不安定。
次のステップで row_concentration_delta（差分）への切り替えが必要。

## アクション
土曜の特徴量は row_group ではなく last_digit の連番クラスタを使う。
行パターン分析の ratio 指標を delta に切り替えてから月曜の「一列まるごと」を再検証する。
