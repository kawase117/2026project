# BTはA型より全曜日でconcentration_deltaが大きい。A型は機械割低さでシグナルが薄い

## 背景
全7曜日でBT(normal)のdeltaがA型より大きい:
- BT: delta範囲 60〜117（水曜最小、日曜最大）
- A型: delta範囲 16〜59（月曜最小、木曜最大）

A型の機械割が低いため設定が入っても差枚の絶対値が小さく、
末尾クラスタとしての信号が弱くなっている。

## アクション
A型の末尾クラスタ特徴量はBTより信頼度を下げて使う。
delta < 20 の曜日（月曜=15.8、日曜=16.6）では A型クラスタ特徴量の採用を見送ることを検討。

## 例
木曜A型 delta=58.7（最大）→ 0-1-2クラスタが比較的信頼できる
月曜A型 delta=15.8（最小）→ 2-3-4クラスタは誤差と区別できない可能性

