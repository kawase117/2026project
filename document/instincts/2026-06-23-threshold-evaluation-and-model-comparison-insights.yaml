# v6a/v9b/v9cの特性まとめと使い分け

## 背景
3モデルの256日walk-forward比較結果:
- v6a（固定ウェイト）: イベント日に強い（event avg_diff=+231）。安定したlift@50。全セグメントに満遍なく配分。
- v9b（50:50ブレンド）: 非イベント日に強い（non_event avg_diff=+168）。バランス型。
- v9c（percentile×seg_weight）: avg_diff最大（+200）。2F集中・Aタイプ重視・3F_Nゼロ配分。

2F限定のlift_t指標では v9c > v9b > v6a だが差は小さい（lift_t3500: 1.258 vs 1.238 vs 1.234）。
統計的有意性は未検証。現時点で1モデルに絞る根拠は不十分。

## アクション
- 即座にv6a/v9bを撤廃しない
- 2F中心・非イベント日運用ならv9cが最適候補
- イベント日にはv6aの方が強い可能性あり
- 状況別切り替えまたはアンサンブルを検討

## 例
2F限定 non-event lift_t3500: v9c=1.258, v9b=1.238, v6a=1.234
全体 lift@50: v6a=1.25, v9b=1.25, v9c=0.92（v9cは旧指標では過小評価）
