# v9cのpercentile×seg_weight方式は弱セグメントを構造的に排除する

## 背景
v9cの最終スコア = seg_percentile × seg_weight。
seg_weightは訓練データのセグメント別平均diffから算出（強=1.0, 弱=0.5）。
3F_R_N（avg_diff≈-9）はweight≈0.5なので、セグメント内1位でも
スコア=1.0×0.5=0.5にしかならず、他セグメント中位（例: 0.95×0.85=0.81）に勝てない。
結果、v9cのTop50に3F_L_Nと3F_R_Nは0台配分される。

## アクション
- v9cの配分: 2F=33.9台/日, Aタイプ=16.1台/日, 3F_N=0台/日
- v6aの配分: 2F=31.4台/日, Aタイプ=4.4台/日, 3F_N=14.2台/日
- 3F_R_Nはlift_t4500=1.74で最もliftが高いセグメント。完全排除が最適かは要検討
- ただし3F_R_Nのベース期待値が最悪（ランダムで座ると最も不利）なのも事実

## 例
seg_weight計算: _segment_strength_weights() in scoring_model.py L751-757
0.5 + 0.5 * (seg_avg_diff - min) / (max - min) で 0.5〜1.0 にスケーリング

