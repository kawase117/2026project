# 差枚だけの評価は高設定の下振れ台を見逃す

## 背景
差枚が負けていても高設定である台は存在する（分散の下振れ）。
その台をモデルが選んでいたなら予測は「正解」だが、diff評価では「外れ」になる。
逆に低設定の上振れはdiff評価で「当たり」扱いされ過大評価になる。
回転数（games_normalized）はこの問題の補助指標になりうるが、
AタイプとATでは回転数の意味が根本的に異なる（後述instinct参照）。

## アクション
- 差枚閾値だけでなく、回転数ベースの評価軸を並行して持つ
- ただしAタイプとATで回転数の解釈を分ける
- 将来的にはBB/RB比率など機種固有指標も評価に組み込む検討

## 例
モデルTop50に games>=5000 & diff<0 の台があった場合、
diff評価では外れだが「高設定を正しく選んでいた」可能性がある。

