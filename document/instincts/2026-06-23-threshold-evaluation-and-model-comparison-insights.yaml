# payout_rateは低回転台で極端に歪む

## 背景
現行のpayout_rateは各台の (games×3+diff)/(games×3)×100 を個別計算してから平均。
低回転で負けた台は分母が小さく比率が極端に低くなる（例: games=200, diff=-400 → 33%）。
結果、avg_diffがプラスでもpayout_rateが100%を下回る現象が起きる。
games_normalizedはAT中を除くため、特にATタイプで名目回転数が小さくなりやすく歪みが大きい。

## アクション
- payout_rateの絶対値を信頼しない（特にセグメント間比較で）
- 正確に出すなら加重平均 sum(coins_out)/sum(coins_in) に変更すべき
- avg_diffの方がセグメント間比較には適している

## 例
avg_diff=+200なのにpayout=99.5%になるケースが2F_L_Nで観測済み。

