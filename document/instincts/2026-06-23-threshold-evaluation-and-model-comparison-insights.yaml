# AタイプとATタイプは評価指標を分離すべき

## 背景
ATもAタイプも最高機械割は114.9%で同じ。しかしAタイプは設定6の機械割が低めに設定される
ケースが多く、差枚で+2,500に届きにくい。全体Top50で評価するとATの大当たり台に
正解ラベルが偏り、Aタイプの高設定台を正しく拾っても「外れ」扱いになる。
Aタイプのlift_t指標は全閾値で1.0以下だが、これはモデルの問題ではなく
評価フレームワークの構造的欠陥。

## アクション
- lift@50やlift_t指標はセグメント別（A/AT分離）で評価する
- Aタイプ専用の低い閾値（例: +1,500）を検討する
- 全体lift@50の数字だけでモデルの優劣を判断しない

## 例
3F_L_A（Aタイプ）: lift_t2500=0.46, lift_t4500=0.11 — Aタイプの機械割上限が低いため。
2F_R_N（AT混在）: lift_t2500=1.19, lift_t4500=1.32 — 同じモデルでも適正に評価される。

