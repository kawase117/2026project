# 厳しい閾値ほどliftが高くなるのは正常な挙動

## 背景
lift_t2500 < lift_t3500 < lift_t4500 という結果は直感に反するが正常。
liftはランダム比であり、閾値を上げるとランダム期待hitは比例して減るが、
モデルの当たり台は差枚分布の上位に集中しているため減り方が緩やか。
結果として相対優位（lift）は閾値が厳しいほど拡大する。

## アクション
- lift_t4500が高いことは「最高設定のシグナルを捉えている」と解釈する
- lift_t2500が相対的に低いことは「設定4-5と低設定上振れの分離が困難」と解釈する
- 閾値間のlift差がモデルの予測能力の帯域特性を示す

## 例
v9c N-type: lift_t2500=1.18, lift_t3500=1.26, lift_t4500=1.30
→ 最高設定検出は得意だが、+2500帯の微妙なラインは苦手。

