# 予測なしなら2F_L_Nがベスト

## 背景
セグメント別の平均diff（全台ランダムの期待値）:
2F_L_N=+200, 3F_L_A=+193, 3F_R_A=+173, 2F_R_N=+169, 3F_L_N=+51, 3F_R_N=-9
予測がない日は2F_L_Nに座るのが期待値最大。
3F_R_Nはランダムで座ると最も不利だが、モデルで絞ればliftが最も高い（=選別の価値が最大）。

## アクション
- 予測が使えない日・信頼度が低い日は2F_L_Nをデフォルト選択
- モデル予測がある日は、ベースの悪いセグメント（3F_R_N等）でも上位予測台は検討価値あり

## 例
2F_L_N: ランダム期待+200、lift_t3500=1.24（モデルで+24%上積み）
3F_R_N: ランダム期待-9、lift_t3500=1.61（モデルで+61%上積み、ただしベースが悪い）

