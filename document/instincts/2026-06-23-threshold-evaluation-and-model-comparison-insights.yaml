# Aタイプの高回転は台単位ではなくホール・日単位のシグナル

## 背景
Aタイプ（ジャグラー・ハナハナ）は遊技中の設定示唆がほぼ無い。
個別の台が高回転なのは「その台を高設定と判断した」からではなく、
「この店がAタイプに設定を入れている」という店全体への信頼で打ち続ける人が多いため。
設定判別ができない打ち手のだらだらプレイも回転を押し上げる。
設定が入っていない店のジャグラーの回転が高水準になることはほとんどない。

一方ATタイプは遊技中に設定示唆があるため、高回転の個別台は
「その台を高設定と判断した打ち手がいた」可能性が高い。

## アクション
- Aタイプの台単位 games_normalized を「この台は高設定」の根拠にしない
- Aタイプの回転数はセグメント全体・日単位の集計で「設定投入日かどうか」の判断に使う
- ATタイプの回転数は台単位で高設定の補助シグナルとして使ってよい

## 例
水曜日に末尾3のAタイプ台が全体的に高回転 → 「今日は末尾3に設定が入っている」
（個別台ではなくセグメント・末尾グループ全体の傾向として読む）

