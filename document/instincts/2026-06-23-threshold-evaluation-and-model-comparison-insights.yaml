# Top50ボーダーは設定6の理論上限を超えている

## 背景
実際のTop50ボーダー（50番目に差枚が高い台）は平均+4,100枚、最低日でも+3,100枚。
設定6の最高機械割114.9%で実質8000G回して約+3,500枚が現実的上限。
つまりTop50に入るには「高設定＋上振れ」が必要で、設定6を普通に回しただけでは届かない。
+3,100（最低日）こそ真の設定6ボーダーに近い。

## アクション
- hit@50/lift@50だけでモデルを評価しない
- 差枚の絶対閾値ベース指標（hit_t2500/3500/4500, lift_t2500/3500/4500）を併用する
- 2500は有利区間の壁（低設定では超えにくい）、3500は設定6現実上限、4500は上振れ込みライン

## 例
walk_forward_engine.py の THRESHOLD_CUTS = (2500, 3500, 4500) で実装済み。
v9c: 旧lift@50=0.92（ランダム以下）→ lift_t3500=1.26（2Fセグメント限定）と正当に評価可能に。

