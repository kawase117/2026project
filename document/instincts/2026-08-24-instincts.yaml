# 結果報告ツイートの「末尾X +N/M台」は選ばれた一部であり、全体平均の代用にしてはいけない

## Core claim
結果報告アカウント（予告アカウントとは別）が挙げる「末尾X +N/M台 平均+Y枚」等のリストは、
対象末尾・カテゴリの全台ではなく見栄えの良い台を選んで抜粋したものであることが多い。
残りの台（リストに載らなかった台）を含めた全体平均は、リストの平均と符号が逆転しうる。

## Evidence
- n_observations: 1（2026-08-20 楽園蒲田、アカウント@slokotae7の結果報告）
- data scope: single-hall（楽園蒲田店）、position_rule(last_digit=0)の確定DB値との突き合わせ
- metric scope: diff_coins_normalized
- result summary:
  | 母集団 | 台数 | 平均差枚 |
  |---|---:|---:|
  | ツイート記載の末尾0リスト | 12 | +1,345.7（ツイート記載値+969と近似） |
  | 末尾0 全体（確定DB） | 60 | **-240.9**（勝率35.0%） |
  | ツイート**未記載**の残り48台 | 48 | **-637.5** |

  リスト自体の個別数値は正確（改ざんなし）だが、末尾0全60台のうち12台（20%）のみを
  抜粋しており、残り48台は平均-637.5と大きく沈んでいた。全体で見ると末尾0はむしろ
  負けた末尾で、これは同日登録した予告（rakuen__20260820__kawasakislot）の
  position_rule(末尾0)判定（miss, residual -500.8）と一致する。

## Interpretation
- リスト内の数値自体に誤りがあるわけではない（ここが project-kawasakislot-selfreport-inflated
  の「閾値を変えると水増しが露呈する」パターンとは異なる）。問題は**母集団の切り取り方**
- 「60周年→末尾60」のような、結果を見た後に語呂合わせで意味付けする形の投稿は、
  後知恵バイアスの典型で、選ばれた5台が全体平均を上回っていたかを見ないと評価できない
- 予告アカウント（kawasakislot等）だけでなく、結果報告専門アカウントにも同種の
  選択バイアスが存在する。アカウントの種類を問わず適用すべき教訓

## Action
- 結果報告ツイートの「末尾X +N/M台」を見たら、必ず確定DBで同じ末尾の**全台**平均を
  計算し、リストの平均と比較する。全体平均がリストと逆符号なら、リストは選択的抜粋と
  判断し、仕掛けの証拠として採用しない
- 語呂合わせ・記念日ネタ（周年・記念日→末尾のこじつけ）は、後知恵バイアスの兆候として
  警戒し、母集団全体との比較なしに真に受けない
- 全台リストの投稿（例: 化物語 +3/9台のように機種全台数を分母に含む形式）は選択バイアスが
  無いため、そのまま照合材料として使ってよい

