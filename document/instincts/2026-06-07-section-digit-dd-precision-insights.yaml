# みとや x_day 台選択プレイブック（セクション×DD×lag-1統合版）

## 背景
以下の3段階分析（データ期間: 2025-2026, n_xday=102日）を統合した実運用向けプレイブック。
- Phase A: セクション×末尾×x_day偏差（mitoya_section_digit_xday.py）
- Phase B: DD×セクション×末尾クロス（mitoya_dd_section_digit.py）
- Phase C: lag-1サイクル（mitoya_xday_lag1_cycle.py）

## アクション

### DD別 第一候補・第二候補

| DD | 第一候補 | 偏差 | 第二候補 | 偏差 |
|----|---------|------|---------|------|
| DD=4  | AT島574-590 末尾2 | +2908 | AT島501-522 末尾2 | +1337 |
| DD=7  | バラエティ723-733 末尾7 | +1138 | AT島574-590 末尾2 | +792 |
| DD=14 | ジャグラー658-674 末尾7 | +643 | AT島574-590 末尾2 | +917 |
| DD=17 | AT島574-590 末尾2 | +1754 | ジャグラー675-691 末尾7 | +817 |
| DD=24 | ジャグラー658-674 末尾7 | +842 | AT島501-522 末尾2 | +1048 |
| DD=27 | AT島574-590 末尾2 | +806 | ジャグラー675-691 末尾7 | +261 |

※ DD=27のバラエティ723-733末尾7は避ける（-460）

### lag-1補正（前回x_day結果確認後）
  AT島末尾2が前回Top3  → 第一候補の優先度UP（cont=0.51）
  AT島末尾2が前回Bottom → 第一候補の優先度DOWN、第二候補に切替（recovery=0.21）
  AT島末尾1が前回Bottom → 代替候補にUP（recovery=0.46）

### 新店長（2026/5-）での変更点
  廃止: 658-674×末尾7（崩壊）、745-755×末尾8（崩壊）
  継続確認中（n=6のみ）: 574-590末尾2(+2995)、675-691末尾7(+569)は強化傾向

## 例
```
2026-07-04（DD=4、x_day）の場合:
  前回x_day(2026-06-27): AT島末尾2がTop3だった
  → lag-1補正: 優先度UP
  → DD=4: 574-590末尾2は最強日（+2908）
  → 結論: 台番574〜590のうち末尾2の台（例: 582番）を第一候補とする

2026-07-07（DD=7、x_day）の場合:
  前回x_day(2026-07-04): AT島末尾2がTop3だった
  → lag-1補正: 優先度UP
  → DD=7: バラエティ723-733末尾7が第一候補（+1138）
  → 574-590末尾2も第二候補（+792）
  → lag-1でAT島末尾2強なら第二→第一に格上げも検討
```
