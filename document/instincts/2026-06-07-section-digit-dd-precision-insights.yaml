# AT島×末尾2だけがlag-1継続率0.51を示す（他はbaseline付近）

## 背景
x_day連続ペア（102ペア）を使ったlag-1サイクル分析で、
「前回x_dayでTop3だった末尾が今回x_dayもTop3か」を検証した
（script: ml/last_digit/mitoya_xday_lag1_cycle.py）。

結果（baseline = 0.30）：
  AT島 × 末尾2: continuation_rate=0.513 (+0.213), max_streak=6  ← 突出
  ジャグラー島 × 末尾7: cont=0.387 (+0.087), recovery=0.343     ← 穏やかな持続
  バラエティ島 × 末尾7: cont=0.341 (+0.041), recovery=0.480     ← 外れると回復傾向
  AT島 × 末尾1: cont=0.278 (-0.022), recovery=0.458            ← 持続せず回復型

AT島×末尾2のみbaselineを大きく超える継続性あり。一度外れると連続して外れやすい
（recovery=0.208が低い）という特性も確認済み。

構造上の注意: by_dd_group分析はすべて"inter"になる。
x_dayはDD%10=4グループとDD%10=7グループが必ず交互に来るため、
連続するx_dayペアは常にグループをまたぐ（lag-1では同一グループ内連続は測定不可能）。

## アクション
- 前回x_dayでAT島末尾2がTop3 → 今回も末尾2（574-590/501-522）を優先（cont=0.51）
- 前回x_dayでAT島末尾2がBottom寄り → 末尾2優先度を下げ他候補へ切替（recovery=0.21と低い）
- AT島末尾1は「前回x_dayで弱かった場合の代替」として機能（recovery=0.46）

## 例
```
x_day当日の判断フロー：
  Step1: 前回x_day（3〜10日前）のAT島末尾2の順位を確認
    → Top3だった: 574-590末尾2 優先度A（cont=0.51）
    → Bottom寄りだった: 574-590末尾2 優先度C、ジャグラー675-691末尾7へ切替

  Step2: 今日のDDを確認して台を決定
    → DD=4:  574-590末尾2最優先(+2908)
    → DD=17: 675-691末尾7と並立優先
    → DD=7:  723-733末尾7優先、574-590末尾2次点
    → DD=27: バラエティ末尾7は避ける(-460)
```

