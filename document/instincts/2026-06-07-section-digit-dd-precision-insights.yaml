# x_dayの安定シグナルはセクション単位まで絞ると4セルに集約される

## 背景
island-digit-stability-insights で「AT島→末尾2、ジャグラー島→末尾7」が確認済みだったが、
さらにセクション（machine_layout.section）単位に分解すると島内でも濃淡が大きいことが判明。
3期間（旧店長2025 / 旧店長2026前半 / 新店長2026/5-）すべてで正の偏差を維持し、
かつ強化傾向を持つセルは以下の4つだけだった（script: ml/last_digit/mitoya_section_digit_xday.py）。

偏差（xday_mean - global_mean, period_mean との差ではなく全期間global_meanとの差）：
  AT島 574-590 × 末尾2:       +920 → +1792 → +2995  ← 最強・強化継続
  AT島 501-522 × 末尾2:       +572 → +1254 → +1203  ← 安定高水準
  ジャグラー島 675-691 × 末尾7: +200 → +444  → +569   ← 安定強化
  バラエティ島 723-733 × 末尾7: +453 → +305  → +386   ← 安定維持

## アクション
x_day当日は上記4セルを最優先で確認する。
- 台選択の優先順：574-590の末尾2台 > 501-522の末尾2台 > 675-691の末尾7台 > 723-733の末尾7台
- 「AT島全体で末尾2」ではなく「574-590と501-522」の末尾2台に絞ること
- 「ジャグラー島全体で末尾7」ではなく「675-691」の末尾7台に絞ること

## 例
```
崩壊シグナル（使用禁止）：
  ジャグラー島 658-674 × 末尾7: +478 → -32 → -256  ← 2026前半で崩壊
  バラエティ島 745-755 × 末尾8: +559 → +347 → -873 ← 新店長で崩壊

逆張り指標（x_dayに座らない）：
  バラエティ島 745-755 × 末尾3: -836 → -301 → -204 ← 3期間安定してマイナス
```

