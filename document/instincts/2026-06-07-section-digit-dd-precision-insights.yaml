# ジャグラー島675-691×末尾7のシグナルはDD=17に集中、DD=7はほぼ無効

## 背景
「ジャグラー島×末尾7×x_day」という命題を再検証したところ、
675-691セクションに限ってもDD単位では偏りが大きかった。

DD別偏差：
  DD=17:  +817  ← 突出（全体の約60%を占める）
  DD= 4:  +327
  DD=27:  +261
  DD=24:  +152
  DD=14:  +103
  DD= 7:    +9  ← ほぼゼロ（期待できない）

「ジャグラー島×末尾7」の実態は「DD=17の日だけ顕著」。
DD=7の日は末尾7を選ぶ積極的理由にならない。

また658-674セクションはDD単位で逆転する：
  658-674 × 末尾7: DD=24(+842) > DD=14(+643) > DD=17(+309) > DD=27(-301)

## アクション
- 毎月17日（DD=17）にジャグラー島675-691の末尾7台を最優先に据える
- DD=7の日に「ジャグラー島末尾7」を理由に台を選ぶのはやめる
- 658-674の末尾7はDD=24が強い(+842)が、DD=27はマイナス(-301)のため注意

## 例
```
ジャグラー島 セクション別 最強DD：
  675-691 × 末尾7: DD=17(+817) >> DD=4(+327) > DD=27(+261) > DD=7(+9)
  658-674 × 末尾7: DD=24(+842) > DD=14(+643) > DD=4(+277) > DD=27(-301)

→ 同じ「ジャグラー島末尾7」でも得意DDがセクションで逆転する。
  17日は675-691、24日は658-674を優先。
  7日はどちらのセクションも弱い。
```

