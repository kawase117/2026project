# AT島574-590×末尾2はDD=4が別格、DD=17が次点

## 背景
x_day（DD%10∈{4,7}）をさらにDD単位に分解すると、574-590×末尾2は
すべてのx_day DDでプラスだが階層差が大きい（script: ml/last_digit/mitoya_dd_section_digit.py）。

DD別偏差（deviation_dd = dd_mean - global_mean）：
  DD= 4: +2908  ← 圧倒的最強（次点の1.7倍）
  DD=17: +1754
  DD=14:  +917
  DD=27:  +806
  DD= 7:  +792
  DD=24:  +302  ← 最弱（DD=4の約10分の1）

対照的に501-522×末尾2はDD=4(+1337)とDD=24(+1048)が均等に強く、
セクションによって得意DDが異なる。

## アクション
574-590セクション内の末尾2台を狙う際は日付を確認する：
  - DD=4の日（毎月4日）: 最優先（+2908）
  - DD=17の日（毎月17日）: 優先（+1754）
  - それ以外のx_day: 普通の優先度（+300〜+900の範囲）
501-522の末尾2台はDD=4とDD=24の両方で強いため、4日と24日は両セクションを候補に入れる。

## 例
```
みとやのx_day日程（イベント日 = 4,14,24,7,17,27）別の推奨：
  DD= 4 → 574-590末尾2 最優先(+2908) + 501-522末尾2 優先(+1337)
  DD= 7 → 723-733末尾7 優先(+1138)、574-590末尾2は次点(+792)
  DD=14 → 658-674末尾7 浮上(+643)、574-590末尾2は普通(+917)
  DD=17 → 675-691末尾7 最優先(+817)、574-590末尾2 優先(+1754)
  DD=24 → 501-522末尾2 優先(+1048)、574-590は低(+302)
  DD=27 → バラエティ723-733末尾7は避ける(-460)
```

