# バラエティ島723-733×末尾7はDD=7/DD=24が主役、DD=27は明確なマイナス

## 背景
バラエティ島723-733×末尾7をDD単位で分解すると強弱の差が大きい。

DD別偏差：
  DD= 7: +1138  ← 最強
  DD=24: +1084  ← 同等に強い
  DD=14:  +511
  DD=17:  +177
  DD= 4:   +36  ← ほぼゼロ
  DD=27:  -460  ← マイナス（x_dayでも避けるべき）

「バラエティ島×末尾7×x_day=安定」という命題は均一ではなく、
DD=27の日はむしろ逆張り指標になっている。

## アクション
- DD=7の日（毎月7日）: 723-733末尾7を優先（+1138）
- DD=24の日（毎月24日）: 723-733末尾7を優先（+1084）
- DD=27の日（毎月27日）: 723-733末尾7は避ける（-460）
  → 代わりに675-691末尾7（+261）や574-590末尾2（+806）を検討
- DD=4の日: このセクションはほぼ無効（+36）

## 例
```
7日と24日のバラエティ島優先台：
  723-733 末尾7: +1138 / +1084  ← 優先
  734-744 末尾7: +406            ← 代替

27日のバラエティ島回避対象：
  723-733 末尾7: -460  ← 避ける
  745-755 末尾8: 新店長で-873  ← 避ける
```

