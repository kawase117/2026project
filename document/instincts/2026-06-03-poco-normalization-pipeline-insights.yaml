# ぽこ略称の L = スマスロプレフィックス、S = 旧タイプ

## 背景
ぽこ報告で機種名に付くアルファベットプレフィックスの意味（ユーザー確認済み）：

| プレフィックス | 意味 | 例 |
|------------|------|----|
| `L` | スマスロ（新型AT版） | L炎炎→スマスロ炎炎ノ消防隊、L炎炎2→スマスロ炎炎ノ消防隊2、Lカバネリ→甲鉄城のカバネリ 海門 |
| `S` | 旧タイプ | S炎炎→炎炎ノ消防隊（旧版）、Sこのすば→この素晴らしい世界に祝福を！（旧版） |

注意：旧タイプを「A型」と表現しないこと（ユーザー指摘済み）。

## アクション
新しい `L〇〇` の略称が出たら DB で `スマスロ〇〇` を検索してマッピング。
`S〇〇` は旧版DBを検索。必ずDBの稼働日と照合して確定させること。

## 例
```python
# Sこのすば: DB照合で3日間とも「この素晴らしい世界に祝福を！」が稼働 → 旧版確定
# L炎炎: DB照合で「スマスロ炎炎ノ消防隊」が稼働 → スマスロ版確定
conn = sqlite3.connect(DB_PATH)
df = pd.read_sql_query(
    'SELECT machine_name, avg_diff_coins FROM daily_machine_type_summary WHERE date=?',
    conn, params=[date_str])
```

