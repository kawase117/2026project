# マッピングCSVのdb_matchに短縮名・誤名が入っているケースが複数存在する

## 背景
`poco_machine_mapping_TRULY_FINAL.csv` のdb_matchカラムに不正確な名称が入っている：

| poco_machine | 誤db_match | 正しいDB名 |
|------------|-----------|---------|
| GE | ゴッドイーター | ゴッドイーター リザレクション |
| ガルパン | ガールズ&パンツァー | ガールズ&パンツァー 最終章 |
| マギレコ | マギアレコード | マギアレコード 魔法少女まどか☆マギカ外伝 |
| エウレカART | パチスロ交響詩篇... | 交響詩篇...（パチスロなし・ダッシュの種類が違う） |
| MULTIPLE_MACHINES | / 区切り | \| 区切りを期待していたが実際は / で区切られていた |

## アクション
正規化後に必ず `all_norm - all_db` で未存在名を検出する：
```python
not_in_db = sorted(all_norm - all_db)
# → 0件になるまでPATCH_FOUND / POST_CORRECTで修正
```
PATCH_FOUNDで元マッピングを上書き、POST_CORRECTで正規化後の名称を修正：
```python
POST_CORRECT = {
    'ガールズ&パンツァー': 'ガールズ&パンツァー 最終章',
    'パチスロ交響詩篇エウレカセブン...': '交響詩篇エウレカセブン...',
}
```

