# 括弧内の「、」と「？」セパレータに注意

## 背景
2つのパーシングバグが発見された：

1. **括弧内の読点バグ**: `8にまつわる機種(8台設置、ハッピーVIII、マジハロ8)` を
   単純に `、` で split すると括弧が壊れる

2. **？セパレータ**: `全→ヴヴヴ2？からくり？` の `？` は「どちらかわからない」の
   セパレータとして使われており、`、` と同義

## アクション
```python
def protect_brackets(s: str) -> str:
    """括弧内の「、」をプレースホルダーで保護"""
    result, depth = [], 0
    for ch in s:
        if ch in '(（': depth += 1
        elif ch in ')）': depth -= 1
        result.append('\x00' if ch == '、' and depth > 0 else ch)
    return ''.join(result)

def clean_full_half(text):
    text = text.replace('？', '、')   # ？をセパレータに変換
    text = protect_brackets(text)
    parts = text.split('、')
    for p in parts:
        p = p.replace('\x00', '、')   # 括弧内の読点を復元
        ...
```

