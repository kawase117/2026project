# ぽこMDファイルは3種類のフォーマットが混在する

## 背景
docs/ぽこデータ抽出/ 配下のMDファイルは月によってフォーマットが異なる：
- **Format A（7〜1月）**: CSV形式（カンマ区切り、diff/contentが別カラム）
- **Format B（2〜4月）**: Markdownテーブル（`|`区切り、`**bold**`、diff/contentが`/`で同一セル）
- **Format C（5月〜）**: 3行1セット形式（日付行、K7行、K1行の順）

Format B/Cでは差枚と内容が `±xxx / 内容文字列` で同一セルに入っている。

## アクション
抽出スクリプト（rebuild_poco_pipeline.py）は月番号でフォーマットを自動判定。
新しい月を追加するときは MONTH_MAP への追記と、フォーマット判定の確認が必要。

## 例
```
Format A: 1日(月),+182500,全→ファンキー、新鬼武者3,...
Format B: | **1日(月)** | **+182,500** / 全→ファンキー、新鬼武者3 | ... |
Format C:
  1日(水)
  +204,400 / 全→東リベ、L炎炎2
  +55,300 / 全→ファンキー、アズレン
```

