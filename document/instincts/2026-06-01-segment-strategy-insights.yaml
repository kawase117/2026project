# 狭い探索空間で有意だった発見は全空間探索で消える

## 背景
lag=14 × 2F_N × digit=8 の発見経緯：
1. is_positive autocorr で raw hit → p_raw=0.00066
2. lag=14 に絞った検定 → FDR=0.026 で有意
3. 全 expert × 全 digit × 複数 lag のグリッド探索 → FDR補正後0件

探索空間を広げると多重検定負荷が上がり、有意が消えた。
「狭い仮説空間でFDR有意」は「全空間でも有意」を保証しない。

## アクション
限定探索で有意な発見が出ても、以下の手順で確認する：
1. 探索空間を全組み合わせに広げて再検定
2. 全空間でもFDR後に有意なら「探索的発見」として保持
3. 全空間で消えるなら「多重検定アーティファクト」と判定して棄却

