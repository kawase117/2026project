# 逸脱ルールのコストは「差枚/日」で定量化できる

## 背景
always_yes（常に3F_N）= -9,731/日は：
- 2F_Nを完全に外した場合の1日あたりの期待損失
- 150日合計では約-146万差枚

各ルールのコスト比率：
- dd_topk: -2,032/日 → always_yes の 21%
- weekday_high: -5,975/日 → 61%
- calendar_union: -7,047/日 → 72%

calendar_union はほぼ always_yes 相当のコスト。
これは「全日の約78%に逸脱フラグを立てている」という recall 過剰と一致する。

## アクション
新しい逸脱ルールの評価は必ず uplift（差枚/日）を計算する。
Recall・Precision・Accuracy では実運用コストが見えない。
uplift = 実際に座ったセグメントの diff_coins - 常に2F_Nにいた場合の diff_coins

