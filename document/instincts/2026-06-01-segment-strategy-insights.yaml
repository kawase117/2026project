# 2F_N は勝率だけでなく勝ち幅も大きい

## 背景
2F_N hit率 69.3% のみなら always_yes は約 -3,000/日 程度が期待値。
実際は -9,731/日 と大幅に大きい。

この差は「2F_Nが勝つ日は差枚規模も大きく、
3F_Nが勝つ日は差枚差が小さい」ことを示す。
ホールが 2F_N に高設定を集中するとき、その日の 2F_N の総差枚は他セグメントを大きく引き離す。

## アクション
単純な hit率だけで価値を判断しない。
「2F_N が上位に来た日の差枚優位幅」を可視化して
セグメント別の「勝ち方」の違いを把握することが重要。

