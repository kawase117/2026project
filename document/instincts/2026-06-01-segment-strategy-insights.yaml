# 「常に2F_N」がカレンダールール全てに勝つ（蒲田7）

## 背景
deviation_rule_eval.csv（holdout 150日）の uplift 評価結果：
- always_no（常に2F_N）: 0/日（基準）
- dd_topk: -2,032/日
- weekday_high: -5,975/日
- calendar_union: -7,047/日
- always_yes（常に3F_N）: -9,731/日

2F_N は holdout 150日中 69.3% の日で最上位セグメント。
DD・曜日・イベントを使ったどの逸脱ルールも、常に2F_N にいることより期待値が低い。

## アクション
蒲田7においては：
- セグメント選択 = 常に2F_N が最適戦略（現時点）
- カレンダールールによる逸脱判断は採用しない
- 新しい逸脱ルールを提案されたとき、まず uplift 評価で検証する

