# 異なる経営主体のホールは設定戦略を共有しない

## 背景
「他ホールでもlag=14パターンが再現するか」という検証提案に対して
「系列店でない限り経営戦略を共有する理由がない」という指摘。

同一チェーン/系列店：設定方針が共有される可能性あり（検証価値あり）
異なる経営主体のホール：設定方針の共有を前提にしてはいけない

## アクション
複数ホール横断分析を提案するとき、まず確認する：
1. 対象ホールは同一系列・同一チェーンか？
2. 系列でない場合、pooling は異質データを混ぜてシグナルを薄める可能性がある
3. 単ホールでの null 結果を補強したい場合は同系列店のみ対象にする

