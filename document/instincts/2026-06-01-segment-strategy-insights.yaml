# Recall高・Precision低のルールは差枚期待値でマイナスになりうる

## 背景
calendar_union ルールの評価：
- recall=0.87, precision=0.34, accuracy=44-47%
- mean_uplift_vs_2fn = -7,047/日

recall=0.87 は「良い」に見えるが、全日の78%にフラグを立てており
2F_Nを頻繁に離れるコストが蓄積してマイナスになる。
多数派クラスが明確に優位な問題では分類 accuracy は misleading。

## アクション
実運用に直結する問題では、分類指標より uplift を主評価にする：
- uplift = actual_diff(予測に従った場合) - baseline_diff(常に多数派)
- 分類精度が高くても uplift がマイナスなら採用しない

