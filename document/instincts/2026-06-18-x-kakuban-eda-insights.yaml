# X角番とsection角番は独立した2軸（Spearman r≈0〜−0.14）

## 背景
2026-06-18: `kamata7_x_kakuban_eda.py` Section 5 の結果。

| segment | Spearman r |
|---|---|
| 2F_A | 0.030 |
| 2F_N | 0.008 |
| 3F_A | −0.135 |
| 3F_N | −0.064 |

2F では r≈0（完全独立）。3F では弱い負相関（奥X台は島内の前方台になりやすい傾向）。

## アクション
ML特徴量として `x_kakuban` と `section_kakuban`（rank_from_min）を
独立した2カラムとして両方使える。
3F は r=−0.14 程度の交絡があるが実用上は独立とみなして問題ない。

