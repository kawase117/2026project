# X角番のシグナルはsection角番より弱い — 補助特徴量として使う

## 背景
2026-06-18: `kamata7_x_kakuban_eda.py` Cross-segment comparison。

| segment | significant_x_kakuban | mean_abs_mean_residual |
|---|---|---|
| 2F_A | 0 | 63 |
| 2F_N | 7 | 43 |
| 3F_A | 3 | 22 |
| 3F_N | 14（うち9件はsupport=1ノイズ） | 30 |

section角番分析（`kamata7_kakuban_colsize_eda.py`）では 3F_medium_A が9件の有意
かつ全て support≥9 の堅牢なシグナルだった。X角番は件数は多いがノイズが多い。

## アクション
ML特徴量設計では `section_kakuban` を主特徴量、`x_kakuban` を補助特徴量として扱う。
X角番単体での選台優先度付けは行わない。
x_kakuban 結果は常に support_x_columns >= 2 でフィルタしてから使う。

