# 3F_N の x_kakuban=10〜18 は全て18台X列1本のシグナル — 構造的知見として使えない

## 背景
2026-06-18: `kamata7_x_kakuban_eda.py` の 3F_N セグメント結果。

3F の x_col_size=18 の X列は 1本のみ（Section 2 より）。
x_kakuban=10〜18 は全て support_x_columns=1 → この1列固有の観察。
14件の significant のうち 9件がこのパターン。

support_x_columns >= 2 でフィルタすると実質シグナルは:
- x_kakuban=5（support=17）、x_kakuban=3（support=32）
- x_kakuban=2（support=33）、x_kakuban=6（support=16）

`kakuban-high-position-single-section-trap` と同じ構造問題のX角番版。

## アクション
x_kakuban 分析では常に support_x_columns >= 2 でフィルタしてから解釈する。
3F_N の x_kakuban=10+ のシグナルは使用禁止。
