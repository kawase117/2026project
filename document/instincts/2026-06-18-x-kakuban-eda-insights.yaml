# 2F_N では手前1台目（x_kakuban=1）が support=34 列で有意にマイナス

## 背景
2026-06-18: 台単位ランクで修正後の `kamata7_x_kakuban_eda.py` 結果。

2F_N の significant x_kakuban（support≥2 のもの）:
| x_kakuban | mean_residual | q値 | support |
|---|---|---|---|
| 1 | −28 | 3.9e-3 | 34列 |
| 5 | −16 | 7.3e-5 | 32列 |
| 12 | +87 | 7.3e-5 | 11列（長列のみ） |

x_kakuban=1（入口から最も手前の台）が全34列で有意にマイナス。
section角番=1（島の端台）とは独立した軸で同方向のシグナル。
x_kakuban=5 の効果量（mean=−16）は小さく実用優先度は低い。

## アクション
2F AT 系台を選ぶとき、各X列の入口から1番手前の台（x_kakuban=1）を回避する。
section_kakuban=1 との組み合わせ（両方端）は二重ペナルティになるため最優先で除外。

