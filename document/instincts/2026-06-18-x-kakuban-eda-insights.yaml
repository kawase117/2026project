# x_kakuban の rank() は台単位で先に計算し日次行にマージする

## 背景
2026-06-18: `kamata7_x_kakuban_eda.py` の初版で、1台×342日のフレームに直接
`groupby(["floor","X"])["Y"].rank(method="first")` をかけたことで、
同一台の342行が全て異なるx_kakuban値（1〜342）を持つバグが発生。

さらに `run_analysis` と `_build_segment_run` で `_attach_x_kakuban_frame` を
二重呼び出しして `x_kakuban_x / x_kakuban_y` に列が分裂する副作用も発生。

症状: x_kakuban=29〜180+、各値 n=2 という不自然な分布。

## アクション

```python
def _attach_x_kakuban_frame(frame: pd.DataFrame) -> pd.DataFrame:
    # ① 台単位でrank（日次重複を除去）
    machine_coords = (
        frame[["machine_number", "floor", "X", "Y"]]
        .drop_duplicates(subset=["machine_number"])
        .copy()
    )
    machine_coords["x_kakuban"] = (
        machine_coords.groupby(["floor", "X"])["Y"]
        .rank(method="first", ascending=True)
        .astype("Int64")
    )
    machine_coords["x_col_size"] = (
        machine_coords.groupby(["floor", "X"])["machine_number"]
        .transform("nunique")
        .astype("Int64")
    )
    # ② 全日次行に machine_number 経由でマージ（台ごとに固定値）
    return frame.merge(
        machine_coords[["machine_number", "x_kakuban", "x_col_size"]],
        on="machine_number", how="left"
    )
```

二重 attach を防ぐため、フレームに既に `x_kakuban` 列があれば skip する:
```python
if "x_kakuban" not in base.columns:
    base = _attach_x_kakuban_frame(base)
```

