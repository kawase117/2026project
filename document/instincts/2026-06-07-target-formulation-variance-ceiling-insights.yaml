# 「セクション内ゼロサム（予算の奪い合い）」仮説は誤り。実際は弱い正の共動効果（co-movement）

## 背景

ユーザーから「ホールには予算があり、一つ良ければ他が弱くなるという現象が起きるはず」という
ゼロサム仮説の検証を依頼された。同日同セクション内の対象機と「他の台」の成績の相関を、
全日・X_day限定の両方、生の相関・偏相関（weekday/month/x_day/section/ddで統制）の
両方で検証した。

結果：
```
全日:       raw r=+0.05〜+0.07, partial r=+0.05〜+0.07
X_day限定:  raw r=+0.08〜+0.10, partial r=+0.05〜+0.08
```
全ての切り口で**正の相関**（弱いが統計的に頑健）が確認され、ゼロサム仮説（負の相関を予想）
は明確に否定された。むしろ「セクション全体の地合いが良い日は対象機も良い」という
**共動（co-movement）効果**が存在する。

ただし効果量は小さく（r≈0.05-0.10）、「セクション全体の地合い」自体が
過去から予測可能か検証したところ、ラグ相関はほぼゼロ（X_day限定後も同様）。
→ 共動効果は実在するが、それ自体が予測不能なノイズに近い。

## アクション

セクション内の機械間相互作用に関する仮説を検証する際は：
```python
# 1. 生の相関だけでなく、交絡変数（曜日・月・x_day・セクション・dd）を
#    OLS残差で統制した偏相関も必ず確認する
# 2. 「効果の符号」と「効果の予測可能性」は別問題として両方検証する
#    （符号が分かっても、その値自体が過去から予測できなければ実用的価値は薄い）
# 3. X_day限定での再検証は、効果を弱めるどころかむしろ明確化することがある
#    （[[xday-restriction-sharpens-not-weakens-signal]] 参照）
```

## 例

```
誤った予想: 「予算の奪い合いで負の相関があるはず」
実際の結果: raw r=+0.05〜+0.10（正・弱いが頑健）
解釈:       ゼロサムではなく、地合い（環境要因）による共動が支配的
            ただしその地合い自体はラグ相関≈0で予測不能
```

