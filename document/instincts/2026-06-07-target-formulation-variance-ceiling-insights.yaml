# 「合成確率の下位30%」をグローバル百分位で定義すると、AUC=0.868という見せかけの高精度が出るが、機種内z-score正規化すると0.541まで崩壊する

## 背景

「機械割105%以上の台を予測する」という提案の前段階として、合成確率
（total_probability_decimal、機種ごとに理論値レンジが約1/97%〜6/115%と大きく異なる）
の閾値予測を検証したところ、AUC=0.868という驚異的な数値が出た。

しかし [[cross-segment-aggregation-creates-dominance-artifact]] を踏まえ、
これが「設定検出」ではなく「機種の当てっこ」である可能性を疑い、機種内z-score
（prob_z_within_model = (value - 機種内平均) / 機種内標準偏差）で再検証した：

```
グローバル百分位版（機種混在）:        AUC = 0.868, positive_rate = 0.300
機種内z-score版（within-model normalized）: AUC = 0.541, positive_rate = 0.308
```

決定的な証拠（model_hist_prob = 機種の過去平均確率、実質的に「機種の指紋」）：
```
model_hist_prob と「グローバル下位30%」二値ラベルとの相関:        r = -0.4595
model_hist_prob と「機種内z下位30%」二値ラベルとの相関:           r = -0.0010
```

これは「機種が分かれば、グローバル百分位の閾値を超えるかはほぼ決まってしまう
（機種の理論値レンジの差をなぞっているだけ）」ことを定量的に証明している。
正しく機種内で統制すると、AUCは diff/excess_diff ベースの中央値予測（0.51-0.56）
と同水準（0.541）に収束し、「合成確率の方が本質的に予測しやすい」という期待は
否定された。

## アクション

確率・機械割など「機種固有の理論値レンジを持つ指標」を予測ターゲットにする際は
必ず以下を実施する（[[cross-segment-aggregation-creates-dominance-artifact]] の
具体的な追加検証手順として）：

```python
# 1. 百分位/閾値を計算する前に、機種内z-score化する
df['prob_z_within_model'] = df.groupby('machine_name')['total_probability_decimal']\
    .transform(lambda x: (x - x.mean()) / x.std())

# 2. グローバル版と機種内正規化版のAUCを必ず両方算出し、比較する
#    両者に大きな差（>0.2）がある場合、グローバル版は「機種識別」の
#    アーティファクトである可能性が高い

# 3. スモーキングガン検証：「機種の指紋」となる特徴量
#    （machine_name の過去平均値など）が、グローバル版ターゲットと
#    機種内正規化版ターゲットのそれぞれとどれだけ相関するかを確認する
#    → グローバル版とは強相関、正規化版とはほぼ無相関、なら「識別アーティファクト」確定
fingerprint_corr_global = df['model_hist_prob'].corr(df['target_global_percentile'])
fingerprint_corr_normalized = df['model_hist_prob'].corr(df['target_within_model_z'])
```

## 例

```
誤った報告: 「合成確率の下位30%予測でAUC=0.868、設定検出に使える画期的な指標を発見」
正しい解釈: 機種内z正規化でAUC=0.541に崩壊。model_hist_probとの相関が
            r=-0.46→r=-0.001に消失 → 「機種の当てっこ」であって「設定の当てっこ」ではない
教訓:       「理論的に設定と直結している指標」（合成確率）でも、
            機種間スケール差を統制しなければdiffベースの指標と同じ罠に落ちる
```

