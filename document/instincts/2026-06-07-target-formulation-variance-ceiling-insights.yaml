# ターゲットを「差枚」から「環境調整後の相対差枚」に変えても、分散構造はほぼ変わらない

## 背景

「セクションのTOPXに入るかという間接的な予測ではなく、target = diff_coins_normalized -
section_daily_mean_diff（環境調整後の相対差枚）の方が目的（獲得枚数最大化）に直結するのでは」
という提案を検証した。

分散分解の結果：
```
「環境」（date×section の平均、=baseline）が説明する分散: 8.0%
「個体」（個別機の差枚の環境からの乖離）が説明する分散:    92.0%
```
これは「excess_diff ≈ diff_coins_normalized − (8%程度の定数オフセット)」を意味し、
両者は強く相関する（ほぼ線形従属）。つまり target を diff から excess_diff に
変えても、学習対象の統計的構造（分散の出どころ・予測可能性の上限）はほとんど変化しない。

実際、複数の切り口（セクション内ランキング, excess_diff 中央値分類, 機種内正規化済み
確率の中央値分類）で「正しく統制した場合」のAUCはいずれも 0.51〜0.61 のレンジに収束した
（[[probability-target-cross-segment-artifact-collapse]] 参照）。

## アクション

「ターゲットの再定義で精度が向上するはず」という仮説を検証する前に：
```python
# 1. まず分散分解（environment vs individual）を行い、
#    新旧ターゲットがどれだけ線形従属かを確認する
env_var_share = df.groupby(['date','section'])['target'].transform('mean').var() / df['target'].var()
if env_var_share < 0.15:
    print("環境成分の寄与が小さい → ターゲット再定義による構造変化はわずか")

# 2. 複数のターゲット定義で「正しく統制した」AUCを横並びで比較し、
#    収束するレンジ（このプロジェクトでは概ね0.51-0.61）を「実質的な天井」として認識する
# 3. 「ターゲットの言い換え」より「機種内/セグメント内正規化の正しさ」の方が
#    AUCに与える影響が大きいことを優先的に確認する
```

## 例

```
期待: 「環境を調整したexcess_diffなら、ノイズが減って予測しやすくなるはず」
実際: environment分散寄与は8%のみ → excess_diffはdiffとほぼ線形従属
      AUCは中央値予測でいずれも0.51-0.56に収束（diff/excess_diff/確率で同様）
結論: ターゲットの「言い換え」では分散構造の本質（>99%が個体内ノイズ）は変わらない
```

