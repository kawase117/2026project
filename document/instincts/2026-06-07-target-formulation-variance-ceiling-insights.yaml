# P(excess_diff > T) のAUCは閾値Tが分布の裾（極端な値）に近づくほど単調に上昇する

## 背景

excess_diff（環境調整後の相対差枚）について、閾値 T を中央値付近から両極端に
動かしながら P(excess_diff > T) の予測AUCを計測した：

```
T = -500 (下振れの裾): AUC = 0.538
T =    0 (中央値):     AUC = 0.513
T = +1000 (上振れの裾): AUC = 0.557
```

中央値（プラスかマイナスかの境界）付近ではAUCがほぼチャンス（0.513）だが、
分布の両極端（大勝ち/大負けの境界）に近づくにつれて単調にAUCが上昇する。
これは「弱い構造的シグナルは、平均的な結果ではなく極端な結果（裾）に
集中している」ことを示唆する。

ユーザーの目標（獲得枚数の最大化）は「平均してどちらが優れているか」ではなく
「大勝ちする可能性が高いか/大負けを避けられるか」に近いため、この発見は
目的との整合性が高い、数少ない有望なリードである。

## アクション

連続指標の閾値分類モデルを設計する際は、単一の閾値（中央値など）だけでなく
複数の閾値でAUCをスキャンし、「どの閾値帯にシグナルが集中しているか」を
事前に可視化する：

```python
for T in [-1500, -1000, -500, 0, +500, +1000, +1500]:
    target = (df['excess_diff'] > T).astype(int)
    auc = compute_auc(features, target)
    print(f"T={T}: AUC={auc:.3f}, positive_rate={target.mean():.3f}")
# AUCがTに対して単調に変化する場合、「裾に焦点を当てた多閾値予測」
# （multi-threshold probability framework, [[ml-ranking-learnings-20260602]]）
# の設計に活かす
```

## 例

```
発見: T=0近辺でAUC=0.513（チャンス相当）、T=+1000でAUC=0.557
示唆: 「プラスかマイナスか」を当てるより「大勝ちするか」を当てる方が
      構造的シグナルを多く含む可能性がある
応用: 機種内正規化済みの確率・差枚双方で、複数閾値の期待値合成
      （multi-threshold probability）を試す価値がある
ただし: 閾値を裾に寄せるほどpositive_rateが下がりサンプルが偏るため、
        実用上は適合率・再現率とのトレードオフを別途検証する必要がある
```

