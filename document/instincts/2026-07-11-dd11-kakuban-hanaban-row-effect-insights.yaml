# 「角番」と「端番」を分離した新定義（2026-07-11確定）

## 背景
これまで「角番(kakuban)」という一語で、(a) `rank_from_min`/`rank_from_max`（列の両端からの距離、台1台につき2つの値を持つ）と
(b) メイン通路からの距離、という異なる2概念を混同したまま分析していた。
さらに`dashboard/utils/theory_engine.py`の`kakuban_rule: min_rank`設定下では
`kakuban = min(rank_from_min, rank_from_max)`という第3の合成定義（両端のうち近い方、対称的）が
使われており、`ml/analysis/kamata_corner_mirror_analysis.py`の`assign_kakuban()`（非対称・区画ごとに
min/max側を選択する定義）とも異なっていた。同じ「角番」という言葉が3種類の実装で違う値を返すため、
DD11×角番9-11の検証中に「同じ言葉なのに数値が合わない」混乱が発生した。
この混乱を受け、ユーザーが用語を再定義：
- **角番**：メイン通路からの距離でカウントする番号（新定義、今後導入）
- **端番**：列の両端からカウントする番号、1台が2つ持つ（`rank_from_min`と`rank_from_max`、旧「角番」相当）
2026-07-11時点の検証は主に「端番」（`rank_from_min`/`rank_from_max`、および`theory_engine`の
`min(rank_from_min, rank_from_max)`）を対象にしたものであり、新定義の「角番」（通路距離）はまだ未検証。

## アクション
- 「角番」という言葉が出たら、まずどの実装（`assign_kakuban_fast`风の区画非対称版／
  `theory_engine`の対称`min_rank`版／新定義の通路距離版）を指しているか確認してから数値を出す。
- `dashboard/config/hall_configs/<hall>.yaml`の`kakuban_rule`フィールドを必ず確認する
  （`min_rank`なら対称・全区画プール、それ以外なら非対称の可能性）。
- 新定義「角番＝通路距離」を使った分析はまだ実施していないため、次回セッションでこの軸を使う場合は
  ゼロから座標データ（X座標とメイン通路位置 X≈17-18）を基に再計算が必要。既存の「角番」関連コード・
  theory registryのエントリは全て「端番」相当であることを踏まえて読み替えること。

## 例
蒲田7のメイン通路はX≈17-18（既存メモ`kakuban_three_concepts_definition`参照）。
「端番」は`rank_from_min`/`rank_from_max`（例: 22台区画の中央2台=rank11/12は端番11）。
「角番」（新定義）は例えば「X=17-18から何マス離れているか」で今後定義し直す必要がある。

