# 蒲田7 2Fフロア Y=11・14・15の行はDD=11で通路の左右を問わず一貫して高い

## 背景
DD11×端番9-11の分析で「角9が広く分散した本物の効果、端番10/11は特定台のノイズ」という当初評価が
誤りだったことが判明した後、「端番」という切り口自体がDD11好成績を説明する最適な軸ではない可能性を
検証するため、DD11のリフト（非DD11ベースラインとの差）が大きいセクションを機械的に抽出したところ、
2264-2280(delta+1016)・2089-2101(+725)・2102-2114(+426)・2298-2313(+324)・2314-2329(+373)等、
上位セクションが物理座標上でY=11・14・15という3つの「行」に集中していることが分かった
（通路を挟んだ左右どちらの区画も同じ行なら同程度にリフトしている）。
この3行を合算して検証すると、n=1069（端番分析のn=46-140より桁違いに大きい）、
t統計量=4.69、DD11実績の年間12回中11回がプラス（唯一のマイナスは2026-05-11の-316のみ）という、
端番ベースの分析よりはるかに頑健な結果が得られた。一方、端番9-11分析の主役だった区画2330-2351は
Y=14-19にまたがる区画で、その中の端番9-11該当台（2338-2343）は全てY=17に位置しており、
Y=17行全体の平均リフトは+47と地味だった。つまり2330-2351内の強い数値は「行の一般効果」ではなく
X=28-33という狭い範囲の局所的な現象であり、Y=11/14/15の行レベル効果とは別物と考えられる。
なお行内をX座標（通路距離）で細分すると再び端番同様の激しいノイズが出るため、
「どのX位置が強いか」までは特定できていない。

## アクション
- 蒲田7でDD×物理位置の交互作用を調べる際は、まず端番（rank_from_min/max）ではなく
  Y座標（行）単位で集計し、頑健なセルがないか確認する。行レベルの方がサンプルが桁違いに
  大きく取れるため、統計的な検出力が高い。
- 行レベルで頑健な効果が見つかったら、その中の端番/X座標レベルへの深掘りは
  サンプルが小さくなり再びノイズが支配的になることを踏まえ、過度な一般化をしない。
- 蒲田7以外のホールでも、DD×物理位置の検証をする際は「端番」だけでなく
  「行（Y座標）」「フロア」「セクション」など複数の粒度で機械的にリフトを走査し、
  最もサンプルが大きく効果量が高い粒度を優先して採用する。
- `document/theory_registry/kamata7.yaml`にこの行レベル効果を追加登録する場合、
  `segment`にfloor=2F・y座標範囲での絞り込みを追加できるようスキーマ拡張が必要
  （現状のsegmentはfloor/lr/family/machine_tail/kakuban等のみで、y座標フィルタが無い）。

## 例
2F Y=11,14,15合算（全machine, min_games≥1000）: DD=11 mean=+750 vs 非DD11 mean=+258、
delta+492、t=4.69、n=1069。直近3回（2026-04〜06-11）の平均+568も同水準を維持。
年間12回のDD=11のうち11回がプラス（2025-07〜2026-04, 06は全てプラス、唯一2026-05-11のみ-316）。
