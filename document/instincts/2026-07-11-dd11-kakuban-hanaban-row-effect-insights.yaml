# 「少数台/少数日に集中している」ことと「信頼性が低い」ことを混同してはいけない

## 背景
蒲田7 DD=11×端番11(4台: 2340,2341,3351,3352)の分析で、上位1台の寄与率が高い
（2340の2回の突発的大勝ちが合計差枚の53%を占める）ことを根拠に「ノイズ/偶然で底上げされていた」と
評価したが、ユーザーから「サンプル数の多いものを信頼性が高いと評価するところまでは良いが、
少数台の法則性に関する評価を下げすぎている」と指摘された。実際にt統計量・Cohen's dで
ホール全体ベースライン（mean=211, std=2853）に対する効果量を計算し直すと、端番11
（n=46, t=1.97, d=0.349）はサンプル数が最小の端番10（n=44, t≈0, d≈0）より効果量が明確に高く、
かつ端番9（n=140, t=1.45, d=0.146）よりも効果量では上回っていた。極端値2件を除いても
端番11の実質水準（d=0.140）は端番9と同格だった。「集中している＝弱い」という評価軸は誤りで、
正しくは「ベースラインの分散に対してどれだけ乖離しているか」（t統計量・Cohen's d）で評価すべきだった。

## アクション
- 効果を評価する際、「上位n台の寄与率」のような集中度指標だけで強弱を判断しない。
  必ずホール全体（または適切なベースライン）のmean/stdを求め、対象群のt統計量・Cohen's dを
  算出してから比較する。
- 集中度が高い場合は「なぜ集中しているか」を追加で掘り下げる（例: その台自身の全履歴での
  ジャックポット頻度・イベント日との重なり）。集中＝棄却ではなく、集中＝個別要因の調査対象、と捉える。
- 台ペア（同一区画内の鏡像位置など）で片方が強く片方が弱い場合、両者の「非対象日ベースライン」を
  比較し、地力の差なのか、対象日固有の逆転現象なのかを切り分ける
  （本セッションでは2338(地力+376)がDD11で-891、2343(地力+171)がDD11で+1350という
  地力と真逆の逆転が見つかり、日付固有の現象であることの傍証になった）。

## 例
蒲田7 端番11: 2340の2大勝ち(+14000, +14600)を除いた実質平均+611(d=0.140)は端番9の+629(d=0.146)と
同格。2339単体もDD=11実績n=11でCohen's d=0.723と高い効果量だが、根拠は全履歴でたった2回しかない
ジャックポット（diff≥10000）のうち1回がDD=11だったという薄い証拠であり、2340（全履歴10回中2回、
p≈0.047）ほどの裏付けはまだない、という区別が必要だった。

