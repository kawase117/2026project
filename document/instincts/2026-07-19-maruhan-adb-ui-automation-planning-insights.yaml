# 新規データ取得手段は「取得手段だけ差し替え、保存契約は完全共通化」で設計すると下流が無改修になる

## 背景
マルハンアプリ用ADBスクレイパーの設計時、既存`scraper/anaslo_scraper_auto.py`の
出力JSON契約(`{"date","hall_name","all_data","last_digit_data","url"}`、行内は
日本語キー`機種名`,`台番号`,`G数`,`差枚`,`BB`,`RB`)に完全一致させる方針にした。
これにより`database/json_processor.py`(下流のSQLite投入ロジック)は一切変更不要
になる。同様に`save_to_database`・`load_hall_config`等の既存関数もそのままimportして
再利用し、重複実装を避けた。差分は「データの取得手段」だけに閉じ込め、「保存契約」
は完全共通にする、という設計判断。

## アクション
- 新しいスクレイパー/データ取得手段を追加するときは、まず既存の出力契約(JSON
  構造・キー名・保存先パス規則)を正確に把握し、そこに合わせて出力するよう新規
  コードを設計する。下流の処理(DB投入・集計・ダッシュボード)を変更しないで済む
  ことが最優先の設計目標。
- 保存/設定読み込み等の共通ロジックは新規実装せず、既存モジュールからimportして
  再利用する。
- 収集手段特有のconfig(例: `app_source: {enabled, app_hall_id}`)は既存configの
  構造に**追加フィールドとして**乗せ、既存フィールドは変更しない(後方互換維持)。
  新機能はデフォルト無効(`enabled: false`)にし、検証が取れた対象から段階的に
  有効化する。

## 例
```json
{
  "hall_name": "マルハンメガシティ2000-蒲田1",
  "scraper_url": "https://ana-slo.com/...",
  "app_source": { "enabled": false, "app_hall_id": "TBD" }
}
```
