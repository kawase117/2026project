# Play Integrityの壁はAPI直叩きを諦めUI自動操作に回れば迂回できる

## 背景
マルハンアプリの調査で、台データ系APIはGoogle Play Integrityアテステーションで守られており、
root化/エミュ/再署名/Frida計装のいずれの環境でも認証トークンが発行されず恒久的に詰むことが
確定した(play-integrity-attestation-defeats-repackaged-app-scraping参照)。
ここでの本質的な洞察は「API直叩き」という発想自体が罠だったこと。Play Integrityは
「アプリ・OS・通信層が無改変か」を検証する仕組みなので、無改変のアプリを無改変の実機
(root化無し、Playストアから通常インストール)で動かし、ネットワーク層を一切触らず、
ADBで画面をタップ操作して`uiautomator dump`で表示テキストを読み取る「UI自動化」に
回れば、Play Integrity検証の対象そのものから外れる。
つまり「認証を突破する」のではなく「認証が要らない経路(人間が見るのと同じUI)を使う」
という発想の転換が鍵。エミュ上の検証で、対象アプリが標準Android View(WebView/Canvas
独自描画ではない)でレンダリングしており`uiautomator dump`が日本語テキストを正しく
抽出できることも実証済みで、この方針の技術的前提は成立している。

## アクション
- Play Integrity/SafetyNet/証明書ピンニング等でAPI経路が完全に詰んだと判断したら、
  「アプリを無改変・無root環境で動かし、UI自動操作+画面テキスト読み取りに回れる
  か」を必ず検討する。これは技術的な保護機構の回避ではなく、人間の閲覧を代行する
  だけなので、法的・倫理的にもクリーンな部類に入る。
- 前提条件の確認: 対象アプリがuiautomator dumpでテキスト抽出可能な標準Viewで
  レンダリングされているか(WebView/Canvas独自描画だとテキスト抽出できずOCR
  フォールバックが必要になる)を早期に確認する。
- USBデバッグ(開発者オプション)有効化自体がPlay Integrity判定に影響するかは
  断定できないため、UI自動化ルートに投資する前に実機で最初に確認すること。

## 例
```
API直叩きルート: root化/エミュ/再署名 → Play Integrity不合格 → Auth-Key取得不可 → 詰み
UI自動化ルート: 無改変実機+無改変アプリ → Play Integrity合格(通常利用のため)
                → ADBでtap/swipe操作 → uiautomator dumpで画面テキスト読み取り
                → ネットワーク層に一切触れないためIntegrity検証の対象外
```

