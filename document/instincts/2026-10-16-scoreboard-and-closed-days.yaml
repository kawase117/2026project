# ana-sloは休業日にも全台同値のページを出す。消すだけでは翌朝に戻るので、台帳と再計算をセットで行う

## 背景
楽園蒲田の 2025-04-21(入替)・2026-07-06(改装)は、全台 G数0・BB/RB なし・差枚が全台 -6,142(ホール平均らしき値)のページが取り込まれていて、1日あたり約-350万枚の偽の差枚がホール・機種・末尾の集計に混ざっていた。G数0のフィルタでは差枚が残るので救えない。
増分取り込みは「JSON はあるが DB に無い日」を新規として拾うので、DB から行を消しただけでは翌朝に戻る。また、移動平均(7〜35日窓)と月次トレンドはその日を含んで計算済みなので、消した後に再計算しないと古い値が残る。
2026-10-16 に別々のセッションが同じ削除を並行して行い、片方のバックアップは削除後の状態を写していた(共有の db/ を触る前に、既存の .bak-* と他セッションの状況を確かめる必要がある)。

## アクション
- 新しく見つけたら document/registry/KNOWN_CLOSED_DAYS.csv に hall_name,date,reason(「休業日(改装)」など種類つき),source を追記する。取り込み(incremental_db_updater)と監査(data_audit)がこれを読む。
- DB からの除外は database/migrate_exclude_closed_days.py の CLOSED_DAYS に足して実行する(バックアップ、date列のある全テーブルの削除、移動平均37日分と月次トレンドの再計算、JSON を _excluded/ へ移動、まで一括)。手で DELETE しない。
- 実行前に db/<ホール>.db.bak-* の有無と更新時刻を見て、他のセッションが同じ作業をしていないか確かめる。

## 例
楽園 20250421: 755行削除、20260706: 941行削除(位置・島の集計を含む)。監査では values の「全台G数0」と「9割以上の台で差枚が同じ値」の2検査が同時に発火する。
