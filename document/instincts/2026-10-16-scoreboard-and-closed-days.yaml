# 総合採点表で「有効」のルールは、1台・1機種に支えられている。一般則として引用しない

## 背景
2026-10-16 に backtest/scoreboard.py で forward 26ルールを無作為選択との差で集計したところ、「有効」は3本だった(9/12〜10/15)。
中身を分解すると、k7_at_histdiff_top3(+1505枚/台)は台番号2026を45日すべてで選んでいて、2026単独で+3457枚。2026を除いて選び直す別ルール(k7_at_histdiff_ex2026_top3)は+170で有意ではない。
rakuen/mitoya の model_term60 も、毎日指名しているカバネリ海門(楽園+606、みとや+390)が牽引していて、他の指名機種はマイナスも多い。台の勝率は3本とも40〜56%。
予測文書の「推した機種」の正側(楽園・みとや)も、同じカバネリ海門に支えられていた。

## アクション
- 「有効」ルールを根拠にするときは、picks の台・機種の内訳を見て、1台・1機種への集中を確かめる。集中していれば「ルールが効く」ではなく「その台・機種が強い」と書く。
- 2026・カバネリ海門が撤去や扱い変更で崩れたら、これらのルールの「有効」はまとめて消えると見なす。ルールの数を独立した証拠として数えない。
- 平均は正でも台の勝率は半分前後なので、負けにくさ優先(prefer-low-risk-winrate)の推薦では、主根拠にせず分散先として扱う。

## 例
k7_at_histdiff_top3: 平均+1505 / 2026除外の日平均+530 / ex2026ルール+170(q=0.48)。rakuen_model_term60: +389、うちカバネリ海門の日平均+606。
