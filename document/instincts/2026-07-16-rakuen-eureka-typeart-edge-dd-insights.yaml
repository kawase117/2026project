# machine_layoutのsectionラベルは物理島全体を指し、1機種で島を専有するとは限らない

## 背景
楽園蒲田店3F、`section='3226-3249'`(24台分の物理島)を「エウレカTYPE-ARTの島」として扱っていたが、ユーザー指摘で確認したところ実際は3226-3239(14台)がエウレカ、3240-3249(10台)はソードアート・オンラインIIという別機種だった。`rank_from_min`/`rank_from_max`はsection内の全機種を対象にした物理配置ランクであり、特定機種だけの相対順位ではない。

## アクション
- 機種別に端番分析する前に、対象sectionの`machine_number`範囲全体で実際に何機種が入っているか(`SELECT DISTINCT machine_number, machine_name FROM machine_detailed_results WHERE date=<最新日> AND machine_number BETWEEN section_min AND section_max`)を確認すること
- rank_from_min/maxの値自体は物理的に正しいので再計算不要。ただし「機種内での端」と「島全体での端」は別概念であり、解釈時にどちらを指しているか明示する
- 台の稼働機種は同じ台番号でも入れ替わる(2025年は2F+3Fの49台にエウレカがあったが、2026年1月以降は3F 3215-3239のみに縮小)。分析対象台リストは`machine_detailed_results`の最新日付でフィルタして取得し、DB全期間のDISTINCT machine_numberだけに頼らないこと

## 例
`eda/core.py`の`load_hall_df`後、対象機種名でフィルタしてから`machine_number`のユニーク集合を「最新日付時点」で再確認する一手間を、機種別の端番/DD分析では必ず入れる。

