# Windows環境のBashツールでは日本語print出力がデフォルトで文字化けする

## 背景
`venv/Scripts/python.exe -c "print(japanese_string)"`をBashツール経由で実行すると、コンソールのコードページ(cp932相当)によって日本語が文字化けした状態で返ってくる(例: 機種名`交響詩篇エウレカセブン...`が読めない記号列になる)。`PYTHONIOENCODING=utf-8`と`-X utf8`を付けると正しく表示される。

## アクション
- 日本語を含むワンショットのDB確認は`PYTHONIOENCODING=utf-8 venv/Scripts/python.exe -X utf8 -c "..."`の形にするか、スクリプトファイルにして結果をUTF-8ファイルへ書き出しReadツールで読む(こちらがより確実)
- 複数行にわたる集計結果は特にファイル出力+Read推奨。文字化けしたままだと機種名の突き合わせ(LIKE検索の条件文字列など)も同時に壊れるため、クエリ条件の日本語文字列は必ずファイル経由で確認してから使う

## 例
本セッションでは`scratch/eureka_analysis.py`で集計結果を`scratch/eureka_analysis_output.txt`にUTF-8で書き出し、Readツールで読み込むことで文字化けを回避した。

