# 楽園エウレカ: 7のつく日の効果は「端番なら良い」ではなく特定方向の端のみ

## 背景
3F現行25台(3215-3239)で7のつく日(7/17/27, date_digit=7)を見ると、隣接する2つの物理島の「入口側端(3226-3228, 3226-3249島のmin_side)」は強く伸びる(例: 3227 n=14 avg+1004 勝率71%, 3226 avg+722 勝率62%)一方、もう一方の島の「出口側端(3224-3225, 3200-3225島のmax_side)」はむしろ悪化する(3225 avg-95 勝率38%, 3224 avg-90 勝率33%)。全体の端番相関(Spearman)も弱く(rho=-0.009, p=0.35)、線形の「端=良い」効果は存在しない。

## アクション
- 端番分析では`edge_rank`(min(rank_from_min, rank_from_max))だけでなく`edge_side`(min_side/max_side)も必ず分けて集計する。方向を潰すと相殺されて「効果なし」に見えるが、実際は方向付きの強い効果が隠れている場合がある
- DD=17単体(台あたりn=3〜5)は個別ランキングには使わず、date_digit=7(7/17/27合算、台あたりn=12〜16)の方を判断材料にする。粗い集計→細かい絞り込みの原則([[exploration-coarse-to-fine]])通り、日別ピンポイントの前に下一桁の合算を先に見る
- 3226/3227/3228は本セッション時点で7のつく日の最有力候補として繰り返し確認された。運用推薦時はこの3台を優先し、3224/3225/3219/3233は同条件下で避ける

## 例
`scratch/eureka_dd17_3f.py`のパターン(machine_layoutとload_hall_dfをmerge後、`edge_side`列で層別しつつgroupby)は他機種・他ホールの端番×DD検証にも転用可能。

