# 木曜のみ 3F_A と 3F_N が同じ 0-1-2 クラスタ。フロア内で機種タイプ横断の末尾配置

## 背景
floor_atype_weekday_cluster.csv の木曜行:

| group_key | 木曜クラスタ | delta |
|-----------|------------|-------|
| 2F_A | 7-8-9 | 95.4 |
| 2F_N | 6-7-8 | 37.5 |
| 3F_A | 0-1-2 | 59.4 |
| 3F_N | 0-1-2 | 112.4 |

3F_A（delta=59.4）と 3F_N（delta=112.4）が同一クラスタ。
他の曜日では3F内のAとNが同クラスタになることはない（火曜のみ3-4-5 vs 2-3-4で隣接）。
木曜のイベント「ニブイチ（複数機種の半分が高設定）」は3Fの機種タイプを問わず0-1-2末尾に集中する傾向。
ただし2Fは木曜で2F_A（7-8-9）と2F_N（6-7-8）で異なり、フロア特性が異なる。

## アクション
木曜の特徴量では「3F かつ 末尾0-1-2」を単一の強いシグナルとして扱える（3F_A と 3F_N の両方をカバー）。
水曜（全グループ異なる）との対比で、木曜は「3F全体で0-1-2」という設計判断が可能。
2F木曜は floor_atype 分割が引き続き必要（グループ間でクラスタが異なる）。

## 例
木曜 3F_N delta=112.4 → 3FのAT機種で末尾0-1-2への集中度が最も高い曜日。
木曜の 3F 特徴量: `is_thursday and is_3f and is_digit_012` でA/N問わず共通シグナルとして使える。
