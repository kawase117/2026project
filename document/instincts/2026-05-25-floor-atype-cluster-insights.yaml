# 3F_N は差枚水準が極端に低い（土曜は全体平均マイナス）がクラスタdeltaは全グループ最大級

## 背景
floor_atype_weekday_cluster.csv の 3F_N 行:

| 曜日 | クラスタ | all_group_mean | delta |
|------|---------|---------------|-------|
| 月 | 6-7-8 | 131.4 | 71.6 |
| 火 | 2-3-4 | 123.0 | 40.4 |
| 水 | 8-9-0 | 48.4 | 78.2 |
| 木 | 0-1-2 | 45.2 | 112.4 |
| 金 | 8-9-0 | 19.1 | 106.3 |
| 土 | 4-5-6 | -34.9 | 77.1 |
| 日 | 9-0-1 | -6.3 | 135.3 |

他グループの all_group_mean 範囲: 2F_A=103〜313、2F_N=205〜327、3F_A=167〜287。
3F_N のみ土曜がマイナス。「3FのAT機種は全体的に低設定が多く、Layer A（全台高設定）に選ばれにくい」と整合。
floor_atype_overall_digit.csv（3F_N）: 末尾3の mean_diff=-94.4（全グループ全末尾の中で唯一の大きなマイナス）、末尾8が150.8（最高）。

## アクション
3F_N の末尾特徴量を使う場合:
- 差枚の絶対値が低いため「勝ちやすい台」としての優先度は低い
- ただしdeltaが大きいため「高設定の位置特定」精度は高い
- 末尾3は3F_N では積極的に避けるべき末尾（-94差枚）
ML設計では 3F_N の is_high_setting 閾値を他グループより 100〜200 低く設定する必要がある。

## 例
土曜3F_N: best_cluster=4-5-6（mean=42.2）、それ以外の末尾は平均マイナス。
「3FのAT機種土曜は4-5-6以外は負け確定」という状況でもdeltaで末尾を絞れる。

