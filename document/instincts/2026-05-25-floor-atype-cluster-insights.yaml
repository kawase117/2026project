# 水曜は4グループ（floor × atype）全てで異なる末尾クラスタ。「水曜同一クラスタ」仮説を否定

## 背景
旧instinct [[atype-bt-form-opposite-clusters-half2-mechanism]] では「水曜のみ A型・BT共に3-4-5」と記録していた。
しかし、2F/3F × A/N の4グループ分割（floor_atype_weekday_cluster.csv）では全て異なる:

| group_key | 水曜クラスタ | delta |
|-----------|------------|-------|
| 2F_A | 3-4-5 | 79.0 |
| 2F_N | 9-0-1 | 71.8 |
| 3F_A | 1-2-3 | 26.7 |
| 3F_N | 8-9-0 | 78.2 |

旧分析の「3-4-5一致」は、BTが2F_A中心・A型が2F_A+3F_A混在のため、2F寄りの集計結果として3-4-5が出ていた粗さによるもの。

## アクション
「水曜は末尾基準投入日だから全機種タイプ同一末尾」という仮説は棄却する。
水曜の特徴量設計では floor × atype の4グループを独立したクラスタ特徴量として扱う。
floor_atype分割はA型 vs BT の1次元分割より情報量が多いため、今後の分析は4グループを基本単位とする。

## 例
2F_A（≈BT）の3-4-5 と 3F_N の8-9-0 は循環距離5で最大逆端。水曜でもフロア×機種タイプで逆端配置が成立する。

