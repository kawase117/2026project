# 2F_N（2FのAT系機種）は火・木・金・土・日の5曜日で6-7-8クラスタが固定的

## 背景
floor_atype_weekday_cluster.csv（2F_N行）:

| 曜日 | クラスタ | delta |
|------|---------|-------|
| 月 | 0-1-2 | 23.8 |
| 火 | 6-7-8 | 89.4 |
| 水 | 9-0-1 | 71.8 |
| 木 | 6-7-8 | 37.5 |
| 金 | 6-7-8 | 53.9 |
| 土 | 6-7-8 | 84.3 |
| 日 | 6-7-8 | 81.9 |

7曜日中5曜日（71%）で6-7-8が最高クラスタ。月曜（0-1-2）と水曜（9-0-1）のみ例外。
2F_N の overall_digit ランキングは末尾6が rank=1（mean_diff=330）でグループ最高。

## アクション
2F_N の末尾特徴量では「末尾6-7-8にいるか」を基本フラグとして採用する。
月曜・水曜は例外として独立フラグを検討。deltaが最大の火曜（89.4）が最も信頼できる曜日。
ML特徴量設計では `is_2fn and is_digit_678 and not is_monday and not is_wednesday` が高設定シグナル候補。

## 例
土曜2F_N: all_group_mean=326.9（全グループ中最高水準）、best_cluster=6-7-8、delta=84.3。
2FのAT機種は土曜に強く、かつ6-7-8末尾に集中している。

