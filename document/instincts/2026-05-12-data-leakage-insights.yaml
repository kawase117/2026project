# Rolling Windows Require shift(1) to Prevent Data Leakage

## 背景
Rolling window aggregations (moving averages, rolling std, etc.) automatically include the current observation in their calculation. When these features are used to predict a target for that same observation, current-day performance leaks into the prediction, causing artificially perfect metrics.

**Example of the bug:**
```python
# WRONG - includes day i in calculation of MA[i]
ma_7_diff = df['diff_coins'].rolling(7, min_periods=1).mean().values  # MA[i] includes day i

# CORRECT - excludes day i from calculation of MA[i]
ma_7_diff = df['diff_coins'].rolling(7, min_periods=1).mean().shift(1).fillna(0).values  # MA[i] now uses days i-7 to i-1
```

## アクション
Always add `.shift(1).fillna(0)` after rolling window aggregations when:
1. Using rolling features to predict targets for the same time period
2. Building features in time-series validation
3. Machine learning on temporal data where lookahead bias is possible

The shift moves all values forward by one row, so position i contains data from periods before i, preventing leakage.

## 例
In the pachinko analyzer, Phase 9-10 ML pipeline was producing impossible AUC scores of 1.0 across all models/targets because rolling averages lacked shift(1):

**Before (WRONG):**
```python
ma_14_diff = df_machine['diff_coins_normalized'].rolling(14, min_periods=1).mean().values
ma_7_games = df_machine['games_normalized'].rolling(7, min_periods=1).mean().values
```
Result: AUC 1.0000 (artificial)

**After (CORRECT):**
```python
ma_14_diff = df_machine['diff_coins_normalized'].rolling(14, min_periods=1).mean().shift(1).fillna(0).values
ma_7_games = df_machine['games_normalized'].rolling(7, min_periods=1).mean().shift(1).fillna(0).values
```
Result: AUC 0.79-0.81 (realistic)

