# Time-Series Validation Must Respect Temporal Ordering

## 背景
Standard random train/test splits break temporal assumptions in time-series data. When features depend on historical aggregates (rolling windows, lag features), test data must come strictly after training data to prevent lookahead bias.

Additionally, when computing rolling statistics:
1. Fit rolling window parameters (mean, std) on the full dataset (train + test combined) to maintain temporal continuity
2. Fit scaler statistics only on training data to avoid leakage
3. Use training statistics to normalize test data

## アクション
For time-series ML:
1. Use **TimeSeriesSplitter** or manual chronological split (first 85% train, last 15% test)
2. When computing rolling aggregates on `df_full` (train + test combined):
   - Pass all data through rolling calculations once to compute unbiased statistics
   - Then extract train/test subsets by date
3. Compute normalization statistics (scaler.fit()) only on training data
4. Apply same scaler to both train and test

## 例
In Phase 9-10 pachinko ML:
```python
# Correct approach:
df_full = pd.concat([df_train, df_test])  # Combine for rolling
df_full_sorted = df_full.sort_values(['machine_number', 'date'])

# Compute rolling on full sorted data
ma_7 = df_full_sorted.groupby('machine_number')['value'].rolling(7).mean().shift(1).fillna(0)

# Then extract back to train/test subsets by date
ma_7_train = ma_7[df_train.index]
ma_7_test = ma_7[df_test.index]
```

This prevents lookahead bias while maintaining temporal continuity in rolling calculations.
