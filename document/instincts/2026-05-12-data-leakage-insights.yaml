# Organize ML Experiments by Dataset, Strategy, and Hall

## 背景
As ML experiments accumulate, keeping all scripts in a single ml/experiments/ folder becomes unmaintainable. Trial code, obsolete versions, and active experiments get mixed together, making it:
- Hard to identify which code is valid vs. abandoned
- Difficult to understand the logical flow (hypothesis → implementation → results)
- Easy to accidentally re-run old broken code

Better structure: Group experiments by **dataset → grouping strategy → hall/model**, creating a clear hierarchy.

## アクション
Organize folder structure as:
```
db/experiments/
├── {ホール名}_exp/
│   ├── last_digit/
│   │   ├── phase9_01_feature_engineering.py
│   │   ├── phase9_02_model_comparison.py
│   │   ├── phase10_hyperparameter_tuning.py
│   │   └── results/
│   ├── machine_type/
│   │   ├── phase9_01_feature_engineering.py
│   │   └── results/
│   └── machine_number/
│       └── ...

ml/experiments/  (core utilities only)
├── experiment_runner.py
├── result_format.py
└── results/
```

Delete obsolete trial files immediately when moving to new folder structure.

## 例
In pachinko analyzer:
- **Before:** ml/experiments/ had 37 files (Phase 7 trials, Phase 8 trials, Phase 9 variants, experimental analysis)
- **After:** ml/experiments/ has 5 files (core utilities); Phase 9-10 moved to db/experiments/マルハンメガシティ2000-蒲田7_exp/last_digit/ (7 scripts)
- **Result:** Clear separation, 33 obsolete files deleted, experiments now explicitly tied to hall/strategy

