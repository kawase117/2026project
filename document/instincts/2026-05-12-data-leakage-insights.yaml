# Perfect Metrics Are a Red Flag for Data Leakage

## 背景
Statistically impossible perfect metrics (AUC 1.0, F1 1.0, precision/recall 1.0) almost always indicate data leakage rather than genuinely excellent model performance. In real-world problems with inherent noise and uncertainty, such perfection should trigger immediate investigation.

For pachinko prediction specifically: perfect metrics are impossible because:
- Gambling has inherent randomness (low settings can have lucky runs, high settings can have unlucky ones)
- We're predicting statistical trends, not deterministic outcomes
- Expected realistic performance range is 0.55-0.85 AUC depending on feature quality

## アクション
When you see AUC ≥ 0.98 or other perfect/near-perfect metrics:
1. STOP implementation immediately
2. Audit feature engineering for lookahead bias (especially rolling windows, lag features)
3. Verify train/test split respects temporal ordering
4. Check if target variable information is accidentally included in features
5. Run diagnostic: compare train vs test metrics; large gaps confirm leakage
6. Re-evaluate with corrected features

## 例
Phase 9-10 Rank1 target:
- Before fix: AUC 1.0000 across XGBoost, precision/recall 1.0 (impossible)
- Investigation: Found rolling(7).mean() without shift(1)
- After fix: AUC 0.7910, precision 0.67, recall 0.42 (realistic distribution)

