# Percentile 計算の効率的実装（pandas rank を使用）

## 背景
SQLiteで percentile を計算する場合、ROW_NUMBER()ウィンドウ関数を使う方法もあるが、pandas で機種ごとに rank() を使う方が実装が簡潔で、パイプラインの流れと合致する。23,000+ 個別台レコード × 60機種での groupby percentile 計算も、pandas の vectorized operation により十分高速。

## アクション
```python
# 機種ごとに処理
for machine_name in df_individual["machine_name"].unique():
    df_machine = df_individual[df_individual["machine_name"] == machine_name]

    # rank(method="average") で重複を平均順位として扱う
    diff_ranks = df_machine["diff_coins_normalized"].rank(method="average")
    diff_percentiles = (diff_ranks / len(df_machine) * 100).values
```

パフォーマンス考慮：
- groupby + apply パターンでも可能だが、ループの方が読みやすい
- データが十分な大きさ（>5台/機種）なら、rank() の計算コストは無視できる範囲

## 例
sunday_outlier_analysis.py で23,071台のデータを約0.5秒で処理（ARROW池上店）。

