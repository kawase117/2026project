# excess_count による複数台投入検出

## 背景
店舗側が高設定を投入する際、「1台だけ」と「複数台」では戦略が異なる可能性がある。複数台投入は、その機種が「当たる可能性が高い」ことを店舗が推測している証拠。単純な「突出台の割合」では、この戦略的意思が失われる。

## アクション
excess_count = max(hit_candidate_count - 1, 0) を計算。複数台が当たり候補な機種・期間を識別：
```
hit_candidate_count = 3台 → excess_count = 2台（複数投入）
hit_candidate_count = 1台 → excess_count = 0台（単独投入）
```
excess_count > 0 の機種は、店舗の「複数台戦略」が働いている可能性が高く、単独投入より信頼度が高い。

## 例
ARROW池上店での結果：
- ハッピージャグラーVIII: hit_candidate=2台 → excess_count=1台（複数投入確定）
- スマスロ北斗の拳: hit_candidate=2台 → excess_count=1台（複数投入確定）
これらは店舗が「この機種は当たる」と判断した機種の可能性。

