# Walk-forward Validation の90日標準化

## 背景
「2026年全体をテスト期間」という設計は長すぎる（約5ヶ月）。パチスロ業界には季節性があり、GW（4月下旬～5月上旬）、盆（8月）、年末年始（12月～1月）に特別な設定投入戦略が展開される。また、新台導入や店舗の人異動も特定時期に集中する。2月1日～5月1日のテスト期間（85日→90日）なら、Q2トレンド（GW）を拾いながらも、過度に長くない。

## アクション
テスト期間を以下のように設定：
- train_end: 2026-02-01
- test_start: 2026-02-01
- test_end: 2026-05-01（従来2026-04-26から変更）
- テスト期間: 90日（walk-forward standard）

この設定により、2026年全体データで学習しつつ、Q2（新台、GW）の影響を測定可能。

## 例
データ準備スクリプト（ml/data_preparation.py）で実装。
```python
def prepare_data_by_groupby(
    ...
    test_end: str = "2026-05-01",  # 従来: "2026-04-26"
    ...
)
```

