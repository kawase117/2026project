# Percentile化による固定しきい値問題の解決

## 背景
固定+500枚というしきい値は機種ごとの分散を無視している。Big Dream THE GOLDEN PUSHER のような低設定でも一撃性が高い荒波機では、低設定でも +500～+1000枚の振れが簡単に起こる。一方、ハナハナのような安定機では、+500枚は有意な差を示す。固定値では、荒波機での誤検出率が高い。

## アクション
機種の分散を自動調整するため、固定絶対値ではなく機種内での相対percentile（0-100）を使用する：
```python
diff_ranks = df_machine["diff_coins_normalized"].rank(method="average")
diff_percentiles = (diff_ranks / len(df_machine) * 100)
```
これにより、各機種内での「相対的に高い位置」を測定。Big Dream内での「相対的高さ」とハナハナ内での「相対的高さ」を同じ基準で比較可能。

## 例
ARROW池上店（2026-05-24）での実装結果：
- Big Dream THE GOLDEN PUSHER: 従来50% → percentile化後15%（誤検出3倍削減）
- 東京喰種: 従来50% → percentile化後15%
- 当たり候補の平均差枚: 従来1700枚 → percentile化後3000枚超（より高設定を確実に検出）

