# 判定分離：当たり候補 vs 不発高設定

## 背景
高回転だが低差枚の台は、①本当に低設定で回転数だけ多い、または②高設定でも確率の悪さで負けた、の2パターンある。固定+500枚では両者を区別できず、予測精度が低下。ユーザーの経験則「回転数が突出していれば粘る要因があり、高設定の可能性が高い」と矛盾する場合がある。

## アクション
2つの判定を分離：
- **当たり候補**: games_percentile >= 70 かつ diff_percentile >= 60
  → 本物の高設定（回転＆差枚両立）

- **不発高設定**: games_percentile >= 80 かつ diff_percentile >= 35 かつ当たり候補でない
  → 高設定でも不発（高回転だが低差枚）

不発高設定を分離することで、「回転数が高い＝高設定」という単純仮説の妥当性を検証可能。

## 例
スマスロ炎炎ノ消防隊2（ARROW池上店 2026-05-24）：
- 全体5台、当たり候補2台、不発高設定0台
- 当たり候補の平均差枚: -69.5枚（マイナス！）
→ 当たり候補でも負けている = 本当に高設定か確認が必要。

