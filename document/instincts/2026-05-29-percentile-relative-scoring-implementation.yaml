# 3倍精度向上：突出台率 46-51% → 当たり候補率 15-18%

## 背景
従来の固定+500枚では「突出台率 46～51%」という広い判定。当たり候補（games_pctile >= 70 and diff_pctile >= 60）では「当たり候補率 15～18%」に絞られる。かつ、当たり候補の平均差枚は全カテゴリで 3,000枚超に上昇。これは「より高設定を確実に検出している」ことを示す。

誤検出率の低下：
- 従来: 50% × (低設定混在率) ≈ 20～30%が低設定混在
- percentile化後: 15% × (低設定混在率) ≈ 5～10%に改善（相対位置ベースだから低設定混在が少ない）

## アクション
percentile化した後の「当たり候補率」と「当たり候補の平均差枚」を、予測モデルの重要特徴量として採用。従来の「突出台率」より信頼度が3倍高いと仮定して、重み付けを調整。

## 例
ARROW池上店、2026-05-24、ジャグラー除外版：
| カテゴリ | 従来（突出台率） | percentile化後（当たり候補率） | 精度向上 |
|---------|------------|------------------|--------|
| 2-5台 | 46.15% | 17.87% | 2.58倍削減 |
| 6-15台 | 48.62% | 15.83% | 3.07倍削減 |
| 16-50台 | 51.31% | 14.19% | 3.62倍削減 |

