# 低Span日の本質は「誤り」ではなく「識別不能」

## 背景
span<0.01の121件における top1_actual - top2_actual の分布：
- 中央値: +1,100（top1がわずかに優位）
- Q25: -1,800（25%のケースでtop2がtop1を上回る）
- Q75: +3,700

span>=0.3の200件：
- 中央値: +7,300
- Q25: +2,975（25%タイルでも一貫してtop1が優位）

## アクション
低Span日の評価指標は hit@2 ではなく、
top1_actual_raw_diff - top2_actual_raw_diff の分布（Q25/中央値/Q75）で判断する。
「低Span = モデルが無力」ではなく「top1とtop2の実際の差が小さく識別限界」。
低Span日でも実差枚差が小さいなら「どちらでもほぼ同じ」→消極策が合理的。

