# pred_span と pred_span_top12 はほぼ独立した別指標

## 背景
バックテストCSVには2種類のspan指標が存在する。

- `pred_span`（reliability_daily）: max(pred) - min(pred) → 全10末尾の範囲
- `pred_span_top12`（testperiod_topk）: top1_pred - top2_pred → 1位と2位の差のみ

実測値（蒲田7, 2026-01〜05）：
- pred_span: mean=0.838, median=0.979（ほぼ常に大きい）
- pred_span_top12: mean=0.264, median=0.123（小さく変動）
- 両者の相関: 0.16（ほぼ独立）

## アクション
「低Span日」と語るときは必ずどちらを指すか明示する。
- 運用確信度シグナルとして有意なのは `pred_span_top12` のみ
- `pred_span`（max-min）は全10末尾のどこかに差があるだけで信頼度としては無意味
- reliability_daily の pred_span フィルタはmedian=0.979の分布ではほぼ発動しない

## 例
```python
# 混同パターン（NG）: max-min は低Span判定に不適切
if row['pred_span'] < 0.05:
    skip()

# 正しいパターン（OK）: top1-top2 差を使う
if row['pred_span_top12'] < 0.05:
    label = "スキップ推奨"
```

