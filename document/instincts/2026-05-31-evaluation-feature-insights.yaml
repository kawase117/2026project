# 1日単位のCV推定はノイズが大きすぎてML特徴量には不適

## 背景
DD別CV推定（各DD約11サンプル）の実測：
- DD=17: mean=72.3, std=207.2（stdがmeanの2.9倍）
- DD=11: mean=24.3, std=58.6（stdがmeanの2.4倍）
- 7のつく日グループ: 7日(4.6), 17日(72.3), 27日(5.6) → グループ内分散が巨大

stdがmeanを大きく上回るDDが多数 → DD別グループ化（7のつく日など）も機能しない。

## アクション
CVの利用は2段階に分ける：
1. 【運用表示用】日タイプフラグ（is_zorome, is_event, is_wednesday等）に基づく
   過去集計CVを翌日予測画面に表示 → confidence_band として実装済
2. 【ML特徴量】CVの代理として構造フラグ（dd_value, weekday, is_event,
   is_zorome, is_strong_zorome）を使う。tree-based modelがCV的パターンを学習。
同日CVを翌日予測特徴量に直接使うのは未来情報リークのため不可。

