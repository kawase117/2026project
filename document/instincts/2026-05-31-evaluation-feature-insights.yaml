# 水曜の末尾パターンはホール固有（末尾1/8強は一般則ではない）

## 背景
水曜の末尾別平均差枚（2025-07〜2026-05, n=47水曜）：

金時京急蒲田店: 末尾5(+81) > 末尾2(+34) ... 末尾1(-65) > 末尾8(-83)
蒲田7ホール:    末尾1(+127) > 末尾8(+66) ... 末尾7(-74)

両ホールで末尾1と末尾8の強弱が完全に逆。
「水曜は末尾1/8が強い」は特定ホールの法則であり一般則ではない。

## アクション
水曜専用特徴量 wed_digit_hist_avg はホール別DBで学習するため
自動的にホール固有パターンを捉える。ホール間で共通の水曜ルールを仮定しない。
ホール別モデルの優位性（Phase 5で検証済み +2.44% AUC）がここでも裏付けられる。
