# セグメント間CVはほぼ無相関（-0.04〜+0.001）

## 背景
蒲田7（2F_N, 2F_A, 3F_N, 3F_A）の同一日CV相関行列：全ペアで相関-0.045〜+0.001

高CV日の例（全セグ平均TOP3）：
- 12/18 Thu DD=18: 3F_A=2726, 2F_A=1.8, 2F_N=1.3, 3F_N=16  ← 3F_Aだけ
- 01/30 Fri DD=30: 2F_A=369, 2F_N=1.7, 3F_A=1.4, 3F_N=4.8  ← 2F_Aだけ

店側は機種タイプ（セグメント）単位で集中投入している。
「この日は難しい」はセグメント固有であり、全体CVは無意味。

## アクション
- 日の難易度表示はセグメント別に計算する
- グローバルCVを特徴量に使わない
- dd_value/weekday をセグメント別モデルに入れることで難易度パターンを自動学習

