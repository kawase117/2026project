# 低Span日に高hit@2が出るなら backtest は信頼できない

## 背景
蒲田7バックテスト（2026-01〜05）のspan band別hit@2：
- span < 0.01（121件）: hit@2 = 94.2%  ← 異常（ランダム基準37.8%）
- span 0.01-0.1（157件）: hit@2 = 100%
- span >= 0.3（200件）: hit@2 = 100%

セグメント別: 2F_A=100%, 2F_N=99.3%, 3F_A=96%, 3F_N=100%

モデルが「わからない」（span<0.01）と言いながら94%正解するのは
パラメータ（window/lambda）が評価期間データを参照して選ばれた可能性を示す。
健全なバックテストでは60-75%程度が期待値。

## アクション
このバックテスト結果の上に戦略分析を積み上げない。健全性確認の手順：
1. window/lambda候補を2025-12-31以前のみで選定し直す
2. 2026-01-01以降を完全holdoutとして再評価する
3. 健全なhit@2が出てから特徴量・戦略の議論に進む

