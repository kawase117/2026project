# dd_value(1-31)が完全欠落、weekdayは既存で追加不要

## 背景
add_simple_features()（tail_ltr_split_rule_wf.py line 167）の実際の特徴量：

既存（曜日系、追加不要）:
- weekday（0-6）, weekday_sin, weekday_cos, is_wed
- weekday_prior_top2_rate, weekday_delta_from_mean

完全欠落（DD系、追加必要）:
- dd_value（1-31）← ANOVA eta-sq 8.8%（曜日2.3%より高い）
- dd_sin/cos, is_zorome（DD=11/22）, is_strong_zorome（MM=DD）

## アクション
add_simple_features()に以下を追加する：
```python
out["dd_value"] = out["date"].dt.day.astype(int)
out["dd_sin"]   = np.sin(2.0 * np.pi * out["dd_value"] / 31.0)
out["dd_cos"]   = np.cos(2.0 * np.pi * out["dd_value"] / 31.0)
out["is_zorome"]        = (out["date"].dt.day.isin([11, 22])).astype(int)
out["is_strong_zorome"] = (out["date"].dt.month == out["date"].dt.day).astype(int)
```
weekday_valueの新規追加は不要（weekday 0-6として実装済）。

