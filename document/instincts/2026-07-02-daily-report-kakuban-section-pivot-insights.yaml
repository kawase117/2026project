id: pivot-rectangular-grid-nan-from-uneven-groups
trigger: tidy形式の集計結果を pandas .pivot() で行列化してヒートマップ表示するとき（特にsection/islandのようにグループサイズが不揃いな軸を使う場合）
confidence: 0.85
domain: dashboard-development
source: session-observation
project_id: pachinko-2026project
project_name: 2026project
title: 不揃いなグループサイズの軸を .pivot() すると大量の構造的NaNが発生する — バグと誤認しやすい
background: >
  角番(rank_from_min)×セクション(section)のヒートマップで、セクションサイズが2台〜22台と
  ばらつくため、.pivot() が最大サイズ（22）を基準に長方形グリッド（22行×53列=1166セル）を
  作り、そのうち454セルがNaNになった。tidy frame自体（pivot前の集計結果）はNaN0件で正常
  だったため、これは集計バグではなく「その rank_from_min の位置にその section の台が
  物理的に存在しない」という構造的な空白だった。ユーザーは当初「データ取得が不完全」と
  誤認したが、tidy frame と matrix（pivot後）でNaN件数を比較することで切り分けられた。
action: >
  セクション/島のようにグループサイズが不揃いな軸でヒートマップを作る際は、.pivot() 前に
  各グループの実サイズ分布（min/max）を確認し、NaNセルの意味（データ欠損 vs 物理的に
  存在しない）をUI上で明示する（キャプション追加等）。「NaNが多い=バグ」と早合点せず、
  まず pivot 前の tidy frame にNaNがあるかどうかで原因を切り分ける。
example: >
  蒲田七で section size min=2, max=22 → 22×53グリッドのうち715セルのみ実在、
  451セルは構造的NaN（残りはmin_gamesフィルタ除外分）。tidy pivot_frame のNaN件数(0件)と
  matrix化後のNaN件数(454件)を比較して「集計は正常、pivotの長方形化が原因」と特定した。
