title: 2軸クロス集計は1セル=1台が普通 — 1次元集計用の min_group_size を流用するとセル全滅する
background: >
  page_19 の角番×セクションヒートマップ（build_kakuban_section_pivot）で
  MIN_GROUP_SIZE_FOR_RANKING（=3、1次元集計 summarize_group_performance 用の定数）を
  デフォルトとして流用した結果、蒲田七DB（715台）で全715セルが avg_diff=NaN になった。
  rank_from_min × section の組み合わせは物理的に1台=1セルであり、n>=3 を要求する閾値は
  原理的に満たせない。合成テストデータ（1セルに複数台を仕込んだもの）ではこの構造的欠陥を
  検出できず、テストは green のまま本番相当データで100%欠損というギャップが生じた。
action: >
  2軸クロス集計を新規実装する際は、min_group_size 等の1次元集計向け定数をそのまま流用せず、
  実データで各セルのn分布（groupby(...).size().value_counts()）を先に確認してから
  デフォルト値を決める。物理的に1台1セルになる軸の組み合わせでは DEFAULT_GROUP_MIN_SIZE
  （=1）が正しい。合成テストも実データの分布（1セル1台など）を再現したケースを別途用意する。
example: >
  build_kakuban_section_pivot() のデフォルトを MIN_GROUP_SIZE_FOR_RANKING(=3) から
  DEFAULT_GROUP_MIN_SIZE(=1) に変更して解決。実データ検証:
  pivot_frame の avg_diff NaN行が 715/715 → 0/712 に改善。

