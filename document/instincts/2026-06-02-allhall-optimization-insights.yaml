# spearman_daily_mean=0.33：モデルに実質的な予測力が存在する

## 背景
allhall_daily_decision_summary で spearman_daily_mean = 0.3292 が確認された。
これはモデルの日次ホールランキングと実際のホール順位に
0.33 の Spearman 相関があることを意味する。

これは予測可能なシグナルが存在することの証拠であり、
Stage 1 の signal_detected 結果（7/9ホール）とも一致する。
モデルの問題は予測能力の欠如ではなく、
目的関数・制約の設計にある。

## アクション
spearman_daily_mean を定期的なモニタリング指標に追加する。
現在の 0.33 をベースラインとして記録し、改善施策後に上昇するかを追跡。
0.20 未満に低下したらモデル劣化の警告サインとして扱う。

## 例
spearman=0.33 → 予測力あり（問題はモデルではなく最適化設計）
avg_diff=103 → 目的関数・制約の問題
→ アプローチ：モデル構造の変更ではなく最適化設計の修正を優先

