# カレンダーシグナルの加点は係数探索で。特定ホール固定ブーストは過学習

## 背景
Stage 1 でARROW・楽園・ヒロキが strong_zorome（日==月）で精度100%を示した。
この結果から「ARROW/楽園/ヒロキには strong_zorome 日に固定ブースト」
という実装を提案したが、これは過学習のリスクがある。

Stage 1 の発見は「selection 期間（2025-07〜12）で検出されたシグナル」であり、
特定ホールへの永続ルールとして固定するものではない。
ホール固有ルールは他ホール・他期間に転用できない（hall-independence-principle）。

## アクション
カレンダー信号の加点は以下の形で実装する：
- 特徴量として「このホールのDD-topk日か」「今日は strong_zorome か」を入力
- 係数（α, β, γ）は tuning 期間でグリッド探索
- ホール別固定ブーストではなく、signal_class（detected/undetected）ごとに係数を持つ

## 例
❌ 悪い例：if hall == 'ARROW' and is_strong_zorome: score += 2.0
✅ 良い例：score += tuned_zorome_coeff[signal_class] × is_strong_zorome_today

