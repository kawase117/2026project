# Stage 1: 有意シグナルはカレンダー由来がほぼ全て。時系列lag特徴量の効果は限定的

## 背景
9ホール × 複数テスト（ランク自己相関 lag=1/2/3/7, カレンダー精度）を実施した結果：
- 有意シグナル18件のうち、ほぼ全てが cal_prec_dd_topk または cal_prec_strong_zorome
- ランク自己相関（lag=1/2/3/7）で Bonferroni 後有意は非常に少数
- 時系列的な momentum/anti-momentum は弱い

したがって lag/rolling 特徴量の ROI は低いと予測される。

## アクション
lag/rolling 特徴量を追加する場合のガイドライン：
1. 単純ローリング平均（7d, 14d の avg_diff 生値）→ 追加しない（ノイズ学習リスク）
2. drought_days_since_last_ge200 → 1つだけ試して効果測定してから判断
3. lag > 30d の特徴量 → 追加しない（selection=178日でサンプル大量消失）
4. 必ず shift(1) を適用してリーク防止

## 例
優先度：カレンダー係数最適化 >> drought lag >> rolling平均（採用不推奨）

