# Hard集中制約は目的関数と衝突しavg_diffを下げる

## 背景
蒲田7への70%集中を解消するため max_share=65% の hard cap を導入したところ、
chosen_avg_diff_mean が 123.18 → 105.45 に低下した。
さらに50%に締めると悪化する公算が高い。

理由：hard cap が avg_diff 最大化の目的関数と正面衝突する。
「集中しすぎを避けたい」という意図は正しいが、
cap 値を固定することは「適切な集中度」を仮定することになり、
最適解を制約外に追いやる。

## アクション
集中度の制約は hard cap ではなく tuning パラメータとして扱う。
目的関数に soft penalty として組み込み、
tuning 期間でその係数を最適化させる。

cap 値の候補グリッド例：[0.40, 0.50, 0.60, 0.70, 0.80]（tuning対象）

## 例
❌ 悪い例：max_share=0.50 固定（avg_diff が必ず下がる）
✅ 良い例：penalty = λ × max(0, hall_share - cap)² をgridsearch

