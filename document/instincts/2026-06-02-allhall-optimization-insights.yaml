# regret最適化を主目的にするとavg_diffが悪化する

## 背景
regret（oracle差）を最小化する目的関数を導入したところ、
蒲田7の選択率は70%→47%に是正されたが、
chosen_avg_diff_mean が 123.18 → 102.94 に低下し、
ベースライン（historical_best_fixed=111.8）を下回った。

原因：regret最小化はオラクル日のホールに寄ろうとするが、
オラクル日のホールは事前予測が難しい。
結果として予測可能なシグナルのあるホールではなく
ノイズの多いホールを選ぶ挙動になる。

## アクション
regret_mean は【監視指標】として並行追跡するが、
最適化の主目的には使わない。
主目的 = chosen_avg_diff_mean の最大化。
regret が改善しているのに avg_diff が下がるなら、
それは oracle に近いが弱いホールを選んでいるサイン。

## 例
regret最適化後: chosen_avg_diff=102.9, regret=161.8
前モデル:       chosen_avg_diff=123.2, regret≈141.5
→ regretが増加したうえにavg_diffも悪化という最悪ケース。

