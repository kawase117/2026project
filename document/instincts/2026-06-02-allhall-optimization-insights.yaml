# ランダムホール選択は赤字（-7.2）：どのホールに行くかは非常に重要

## 背景
holdout 150日でベースライン比較を実施した結果（2026-06-02）：
- ランダム選択: chosen_avg_diff = -7.15（赤字）
- historical_best_fixed: 111.8
- 現在モデル: 123.2
- oracle: 264.7

ランダムが赤字の理由：9ホール中の多くが平均的にマイナス差枚。
少数の強いホールが正の平均を持つため、選択が重要。

## アクション
モデル評価では必ずランダムベースライン（avg_diff≈-7）との比較を出す。
historical_best_fixed（avg_diff≈112）を最低限超えることが実用基準。
ランダムを超えるだけでは不十分：hist_best を超えてから初めてMLの価値を主張できる。

## 例
ランダム:-7 / hist_best:112 / 現モデル:123 / oracle:265
現モデルの hist_best に対する改善：+11（holdout 150日）≈ +10%

