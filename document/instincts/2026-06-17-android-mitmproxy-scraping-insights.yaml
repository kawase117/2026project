# mitmwebはPythonモジュールではなくScriptsフォルダの実行ファイル

## 背景
`python -m mitmweb`は`No module named mitmweb`エラーになる。
mitmproxyのエントリーポイントは`Scripts/mitmweb.exe`として提供される。

## アクション
```
# PATHが通っていない場合は直接実行
C:\Users\<user>\AppData\Local\Python\pythoncore-3.14-64\Scripts\mitmweb.exe --listen-port 8080

# または一時的にPATHに追加
$env:PATH += ";C:\Users\<user>\AppData\Local\Python\pythoncore-3.14-64\Scripts"
mitmweb --listen-port 8080
```

## 例
mitmproxy 12.2.3, Python 3.14.2環境で確認。

