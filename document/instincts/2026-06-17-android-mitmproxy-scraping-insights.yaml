# Android 7+はアプリがユーザーCA証明書を信頼しない

## 背景
mitmproxyのCA証明書をAndroidにインストールしてもChromeブラウザの通信しか傍受できない。
Android 7以降、ネイティブアプリはユーザーインストールのCA証明書を無視する仕様になっている。

## アクション
- ブラウザ通信は傍受できるが、アプリは傍受できないと認識する
- 解決策は3択：(1)エミュレーターにシステム証明書として登録 (2)APKにnetwork_security_configを注入 (3)Fridaでランタイムフック
- エミュレーターを使う場合はGoogle APIsイメージ（Google Playではない）を選ぶ→rootが使える

## 例
```
# ブラウザ → mitmwebに流れてくる ✓
# マルハンアプリ → 何も流れてこない ✗（Android 7+の仕様）
```

