# App BundleはSplit APK全部をinstall-multipleで一括インストールする必要がある

## 背景
APK Extractorアプリで抽出したbase.apkのみをインストールすると、
`Resources$NotFoundException: Unable to find resource ID #0x7f080161` でクラッシュする。
モダンなアプリはApp Bundleで複数のSplit APKに分割されており、全部必要。

## アクション
1. 実機のADB経由で全APKパスを取得：
```
adb -s <real_device_serial> shell pm path <package_name>
# → base.apk, split_config.arm64_v8a.apk, split_config.ja.apk, split_config.xxhdpi.apk 等
```
2. 全APKをプル：
```
adb -s <real> pull /data/app/~~xxx==/package-xxx==/base.apk C:\...\base.apk
```
3. エミュレーターに一括インストール：
```
adb -s emulator-5554 install-multiple base.apk split_config.en.apk split_config.ja.apk split_config.xxhdpi.apk
```

## 例
マルハンアプリは5分割：base, arm64_v8a, en, ja, xxhdpi

