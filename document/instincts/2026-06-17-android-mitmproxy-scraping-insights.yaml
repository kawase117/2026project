# SELinuxがtmpfs上の証明書ファイルをアプリから読めなくさせる

## 背景
tmpfsを`/system/etc/security/cacerts/`にマウントすると、
SELinuxコンテキストが`appdomain_tmpfs`になり、アプリが証明書を読めなくなる。
エラー：`avc: denied { open } ... tcontext=u:object_r:appdomain_tmpfs:s0`

## アクション
```
# SELinuxを一時的にPermissiveモードにする（エミュレーターのみ）
adb shell setenforce 0
# 確認
adb shell getenforce  # → Permissive
```
注意：SELinux問題の解決は必要だが、arm64ライブラリ不足などの別問題が存在する場合は十分条件ではない。

## 例
マルハンアプリはSELinux Permissive後も別の原因（arm64ライブラリ不足）でクラッシュ継続。
