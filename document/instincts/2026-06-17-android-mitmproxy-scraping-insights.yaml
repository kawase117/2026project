# x86_64エミュレーターはarm64ネイティブライブラリを実行できない

## 背景
`split_config.arm64_v8a.apk`をx86_64エミュレーターに含めると
`INSTALL_FAILED_NO_MATCHING_ABIS`エラー。
除外すると`GifInfoHandle.<clinit>`でクラッシュ（ネイティブライブラリが見つからない）。

## アクション
- x86_64エミュレーターではarm64ネイティブライブラリを使うアプリは動かないと判断する
- 代替案：(1)ARM64 AVD（非常に遅い） (2)実機でAPKパッチング (3)Frida
- 商用アプリはほぼ確実にarm64ネイティブライブラリを使っているため、x86_64エミュレーターは不向き

## 例
```
arm64スプリット含む → INSTALL_FAILED_NO_MATCHING_ABIS
arm64スプリット除外 → GifInfoHandle UnsatisfiedLinkError
どちらも失敗 → 実機アプローチに切り替える
```

