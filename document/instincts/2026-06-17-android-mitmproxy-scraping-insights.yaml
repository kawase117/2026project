# AVBの無効化とtmpfsオーバーレイでシステム証明書を登録する

## 背景
`adb remount`は`avb_ops_user.cpp: ERROR: Error writing data`で失敗する。
Android Verified Boot (AVB) が /system パーティションへの書き込みをブロックしている。

## アクション
1. エミュレーターを `-writable-system -no-snapshot` フラグで起動
2. `adb root && adb disable-verity && adb reboot`
3. 再起動後も remount が失敗する場合はtmpfsオーバーレイを使う：
```
adb shell mount -t tmpfs tmpfs /system/etc/security/cacerts
# 既存証明書を先にバックアップしてから復元すること
adb shell mkdir /data/local/tmp/cacerts_bak
adb shell "cp /system/etc/security/cacerts/* /data/local/tmp/cacerts_bak/"
adb shell mount -t tmpfs tmpfs /system/etc/security/cacerts
adb shell "cp /data/local/tmp/cacerts_bak/* /system/etc/security/cacerts/"
adb push mitmproxy-ca-cert.pem /system/etc/security/cacerts/<hash>.0
adb shell chmod 644 /system/etc/security/cacerts/<hash>.0
```
4. ハッシュ値はPythonで計算（opensslがない場合）：
```python
from cryptography import x509
import hashlib, struct
cert = x509.load_pem_x509_certificate(open('mitmproxy-ca-cert.pem','rb').read())
md5 = hashlib.md5(cert.subject.public_bytes()).digest()
print(f"{struct.unpack('<I', md5[:4])[0]:08x}")
```

## 例
`/apex/com.android.conscrypt/cacerts/` はAndroid 14以降のパス。Android 10では`/system/etc/security/cacerts/`を使う。

