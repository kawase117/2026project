# 新ハナビ(技術介入機・設定1大半)の曜日別/DD別出現率は統計的非有意でもトレンドとして重視する

## 背景
新ハナビは技術介入機で通常は設定1が大半のため、RB確率が設定5理論値(1/306.2)以上に達すること自体が本来レア。それでも特定の曜日・DDで突出した出現率が観測された。χ²検定は曜日・DDいずれも非有意（DD軸 p=0.242、5の倍数日 p=0.63）だが、DD単位n=10〜13・曜日単位n=45〜57とサンプルが少なく、有意性の欠如を「効果なし」と解釈すべきではない（[[feedback-statistical-certainty-calibration]]と同じ論点）。技術介入機で設定1大半という前提下でのこの突出度は、店側の意図的な設定投入シグナルである可能性が高いとユーザーが判断した。

## アクション
- 曜日別: 土曜(36.8%)>日曜(30.9%)>水曜(28.3%) を優先候補、月・火・木(17%前後)は据え置き警戒
- DD別: 月末25〜30日(45〜55%)が最強シグナル、7日(41.7%)も単独ピーク。9日・10日(0%)、1日・22日・29日(8.3%)は明確に低調
- 複合ルール: 土曜×25〜30日が重なる日を最優先。日曜・水曜・7日は準候補
- 台番号(2302/2303)自体には有意差なし(28.4% vs 30.9%、独立) → 「どの台か」より「いつ行くか」が支配的
- ゾロ目日(MM=DD)は15.4%(2/13)でむしろ低め。ヒロキの他機種で確認済みのゾロ目パターンとは別軸で扱う
- n数が増えた段階（DD単位30件超が目安）で再検定し、トレンドか偶然かを見極める

## 例
DD別上位: 30日54.5%, 26日53.8%, 25日50.0%, 28日45.5%, 7日41.7%
DD別下位: 9日0.0%, 10日0.0%, 1日8.3%, 22日8.3%, 29日8.3%
曜日別: 土36.8% > 日30.9% > 水28.3% > 金21.2% > 月・火・木 約17%
χ²検定: DD軸 p=0.242, 5の倍数日 p=0.63 → いずれも非有意だが、サンプル不足（n=10〜13/日）による非有意であり「効果なし」の証明ではない
