# BBがほぼ設定不問の機種では、合算確率(BB+RB)はRB単体よりむしろ検出力を下げる

## 背景
サンダーVのスペック表で検証: BB確率は設定1(1/277.7)→設定6(1/264.3)で変動幅わずか5.1%、RB確率は設定1(1/434.0)→設定6(1/313.6)で変動幅38.4%。BBはほぼ設定不問(純ノイズに近い)。合算確率(BB+RB)にBBを混ぜることはサンプル数を稼ぐ一方で、本来RBが持つ設定間の分離信号を薄める。ユーザー指摘「Aタイプや介入機はBBよりRBに大きな設定差があるので、RBを基準に設定を見極めるのが一般的」は本セッションのスペック表でも定量的に裏付けられた。

## アクション
- 新機種を分析する際は、まずスペック表のBB確率・RB確率それぞれの設定1→6変動幅(%)を計算し、どちらが設定分離に効くか確認してから指標を選ぶ
- BBの変動幅が小さい機種(目安: 10%未満)では合算確率を使わず、RB確率単体を主指標にする
- ただしRB単体はBBより発生頻度が低い分、DD単位など細かい粒度でサンプル数が3〜9件まで落ち込みやすく、極端な外れ値(games/RB>1000等)が出やすい。粒度を週次以上に上げるか、サンプル数の下限フィルタ(例: bonus>=20)を設けること
- 逆にBBの変動幅が大きい機種(ART機・一部AT機等)では、BBを主指標または合算に含める判断が妥当な場合もあるので、機種ごとにスペック表を都度確認する

## 例
サンダーV: BB変動幅5.1%(ほぼノイズ) vs RB変動幅38.4%(設定差の主戦場)。
合算確率で検出した「有意な」DD(みとや23,楽園6/14,蒲田7 12)は、RB単体でのz検定では別のDDが浮かび上がり(楽園30,蒲田7 3,楽園金曜)、一致しなかった→両指標が一致しないこと自体が、いずれも単なるノイズであることの傍証。
