# サンダーVはDD・曜日単体でもイベント日オフセットでも高設定シグナルなし(4ホール共通、negative確定)

## 背景
みとや・楽園蒲田・蒲田7・蒲田1の4ホール、サンダーV(2026/3/2導入〜7/20、総計789万G)についてRB確率・合算確率(BB+RB)の両方でDD別・曜日別z検定を実施。全152回検定(DD31×4ホール+曜日7×4ホール)で|z|>=2.0となったのは8件、ランダム期待値7.6件(152×0.05)とほぼ完全一致。Bonferroni補正(z目安3.3以上)を適用すると生存する結果はゼロ。ホール間でz>=2.0となったDDも一致せず(みとや23, 楽園6/14/30, 蒲田7 3/12)、[[feedback-no-cross-hall-pooling]]と整合。イベント日(hall_config.json event_digits)前後±1オフセットの仮説も、全DD・全ホールプールのオフセット別集計(-3〜+3)で games/total が163〜172の範囲でフラットであり、系統的な谷は見られず棄却。

## アクション
- サンダーVについて「特定DD/曜日が狙い目」という主張が出た場合、まずこのnegative結果を提示し、再検証を求める前に統計的検出力(サンプル数)を確認する
- 高設定探索は必ずBonferroni等の多重検定補正を適用する。31日×4ホールなど検定回数が多い場合、無補正z>=2.0程度のヒットは偶然でも複数出る(期待値=検定数×0.05)
- ホール間で「一致するDD/曜日」が出ない限り、単一ホールのz>=2.0ヒットを法則として扱わない
- 台数が少ないホール(蒲田1=5延べ台番号、実質2台→1台への配置替え)は、台別ではなく物理台単位で集計し直す。合計サンプルの見かけの少なさだけでなく、台番号の実態(配置替え/リナンバリング)を必ず確認する
- 日次粒度でボーナス回数が20〜30回程度しかない場合、素朴な閾値判定(games/total<=setting5理論値)は「純ノイズだけでのヒット率」を必ず計算して比較する。実測ヒット率が理論ノイズ率と同等以下なら、その閾値ヒットに意味はない

## 例
4ホール合計152回検定でz>=2.0(|z|)ヒット8件、期待値7.6件とほぼ一致(=ノイズ)。
蒲田1の「5台」は実は配置替えで2092/2093(3/2-4/5,2台並行)→2124/2125(4/6-4/19,2台並行)→2128(4/20-7/20,1台のみ89日)という時系列上の単一〜2台の付け替えだった。
台番号2128(89日)の日次「設定5相当」ヒット率23.5%は、その台自身のベースラインを帰無仮説とした純ノイズ理論値33.6%より低く、Bonferroni補正後の有意日数は0日。
