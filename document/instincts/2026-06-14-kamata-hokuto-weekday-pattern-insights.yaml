# [撤回] 「スマスロ北斗の拳が曜日別候補リストを支配する」は先読みバイアスによる過学習だった

## 背景
当初、全期間集計(先読み)で「payout_rate>=100% AND diff_std<median」スクリーニング
を蒲田1/蒲田7の土曜/日曜データに適用したところ、安定候補top8がほぼ
スマスロ北斗の拳で占められた。

しかし eda/kamata_weekday_backtest.py でwalk-forward検証(各日曜より前の
日曜データのみで判定 -> 当日のQuintile到達率を確認)したところ、
**スマスロ北斗の拳はこの条件(diff_std<median & payout>=100%)の候補に
ほぼ一度も入らない**(蒲田1で類似機種「北斗の拳 転生の章2」がn=2のみ)。
さらにこの条件自体のQ5到達率は蒲田1=0.090, 蒲田7=0.111(期待値0.200)で
**予測力なし**。みとやのXgroupでも同条件でQ5到達率=0.107と同様に機能しない
ことが確認された([[mitoya-dd-group-persistence-insights]]参照)。

## アクション
- この知見・confidence=0.6の仮説は撤回。今後「diff_std<median & payout>=100%」
  (法則②)を曜日別/Xgroup別の候補スクリーニングに使わない。
- 代わりに [[kamata-hokuto-strategy1-high-variance-generalizes]] を参照する。

