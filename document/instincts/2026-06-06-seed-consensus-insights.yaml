# x_day の採用条件は margin 閾値のみに一本化する

## 背景
walk-forward の calibration 段階で margin（1位と2位のスコア差）の分位点閾値が最適化されている。
複数 seed の合意度は追加の弁別力を持たなかった（1/19 日しか発火しない上に外れた）。
margin フィルタが played_rate=0.77 を実現している既存設計が正しい。

## アクション
x_day 翌日予測の採用条件：
1. day_bucket == "x_day"
2. margin >= 学習済み閾値（walk-forward で最適化済み）
これ以上の条件追加（合意度、特定 seed）は過剰。
compare_mode の合意度は「表示情報」として維持するが採用ロジックには組み込まない。

## 例
```python
# 採用条件（シンプルに保つ）
should_play = (
    day_bucket == "x_day"
    and margin >= threshold  # walk-forward で calibration 済み
)
# 合意度は出力に記録するだけ
output["seed_agreement_level"] = "3/3" | "2/3" | "1/3"
```

