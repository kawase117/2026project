# 小サンプル holdout で最良 seed を選ぶと Winner's Curse が発生する

## 背景
x_day holdout 19 日で seed 303 の excess は +248.8（8 seed 中最大）だったが、
10 択 × 19 日では統計的に有意な差は示せない。
8 seed の中から事後的に最大値を選ぶと偶然の外れ値が乗りやすい（多重比較問題）。

## アクション
seed の優劣判断には x_day で最低 50 日（約 8〜9 ヶ月）以上の holdout が必要。
それまでは 8-seed 平均（Hit@1=24.3%）を信頼できる推定値として使う。
production はデフォルト seed=42 を維持し、特定 seed を優遇しない。

## 例
```
必要サンプルサイズ（Hit@1 の差 10pp を検出、α=0.05, power=0.80）→ 約 150 日以上
x_day は月 6 日 → 約 25 ヶ月分のデータが理論上必要
現実解: 8-seed 平均で運用し続け、1 年後に再評価
```

