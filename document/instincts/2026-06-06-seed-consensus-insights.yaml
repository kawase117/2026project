# seed 間の合意度は予測精度と相関しない

## 背景
みとや x_day holdout 19 日で seed 42/77/303 の combined_top1 が完全一致したのは
1 日のみ（2026-03-04）。その唯一の高信頼日で実際の予測は外れていた（predicted=9, actual=6）。
「全 seed が同じ digit を選ぶ = 正解」という仮説は実データで否定された。

## アクション
複数 seed の合意度を採用条件（is_high_confidence）として意思決定ルールに含めてはならない。
合意度は参考情報として出力に残してよいが、実際の採用判断は margin 閾値のみで行う。

## 例
```
実績：
  完全一致日 (3/3): 1/19 日 → 0 Hit（当該日外れ）
  2/3 一致日:      15/19 日 → 合意が広すぎてフィルタ機能せず
  全員バラバラ:     4/19 日
結論: 合意度で「良い日 vs 悪い日」は分離できない
```

