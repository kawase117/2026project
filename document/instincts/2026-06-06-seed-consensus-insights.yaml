# x_day の seed 合意率の実測値（みとや holdout 19 日）

## 背景
seed 42/77/303 の 3 seed を x_day 19 日で比較した結果。
合意率の実測値を把握せずに閾値を設計すると実用に耐えない設計になる。

## アクション
閾値設計前に合意率の base rate を必ず確認すること。
3/3 は稀すぎて実用不可、2/3 は広すぎてフィルタにならない。

## 例
```
3/3 完全一致: 1/19 = 5.3%  → 年間約 4 日しか発火しない
2/3 一致:    15/19 = 78.9%  → フィルタにならない
全員バラバラ:  4/19 = 21.1%
唯一の 3/3 一致日（2026-03-04）は予測外れ
→ 合意度フィルタを採用条件に含めるのは推奨しない
```
