# 全期間の集計は3つの意味で嘘をつく。四半期で切り、現存だけを見る

## Core claim
2026-09-11 に蒲田1のA+ATを掘って、全期間の集計が**同時に3つの嘘**をつくと分かった。

1. **レジーム変化を隠す。** レヴュースタァライトの月末は全期間 **+7.78%(4.8σ)** だが、
   四半期では 2025Q3 +16.0% → Q4 +18.5% → **2026Q1 -11.2% → Q2 -7.0%**。
   2026年に入って反転しており、全期間の数字は過去の遺物だった
2. **撤去済みの機種を混ぜる。** 蒲田1のBTは主力2機種（合計4.2M回転）が3月・4月に撤去済み。
   残りは1台ずつの寄せ集めで、全期間の数字はもう存在しない設置構成のもの
3. **前半/後半に割っても足りない。** 後半に2025Q4の好調が含まれるので、上の月末は
   前半後半では生き残って見えた。**四半期まで割って初めて反転が見える**

## Evidence
**直近の確認は「最後のN四半期」ではなく「測れた四半期のうち最後のN個」で行う。**
カレンダー基準で実装したところ、レヴューの月末が「採用」と出た。台数を削られて
直近のセルが埋まらず、失効判定をすり抜けたため。**データが細っている機種こそ
死にかけている**ので、そこを見逃すのがいちばんまずい。

台数の推移: 2025年 2〜6台 → 2026-08以降 **1台**。集計は 1,048台日 あるが、
延べであって同時設置数ではない（これも読み違えた）。

## ユーザーからの2つの訂正（2026-09-11）
**どちらも私の棄却基準が誤っていた。**

- **「符号が反転したから棄却」は誤り。** レジーム変化なら反転して当然。
  レヴューのゾロ目日は四半期で **-8.5% → +10.0% → +12.2% → +22.9%** と単調上昇しており、
  前半後半の符号不一致を理由に捨てるべきではなかった。蒲田1は 2026-08-25 店長交代・
  09-01 投入方針変更があり、実際にレジームが動いている
  （[[feedback-short-lived-regularities-have-value]] / [[project-kamata1-tencho-change-20260825]]）
- **「1台だから狙い対象外」も誤り。** 1台でも法則があれば狙い台であり、
  台が特定できているぶん朝どこに座るかが明確になる。蒲田7の台2026も雑色の固定台も同じ形。
  **台数不足は `判断不能` であって `回避` ではない。**
  なお座れるかどうかの判断はユーザーの持ち場であり、棄却の理由に使ってはいけない

## Interpretation
判定は6状態に分ける。「効果なし」と「分からない」を同じ箱に入れないこと。

| 判定 | 意味 |
|---|---|
| 採用 | 測れた直近2期が反転しておらず σ>=2 かつ絶対差枚プラス |
| **失効** | 全期間はプラスだが直近2期が反転。過去の遺物 |
| **要確認** | 直近を確認できない（回転数が落ちてセルが埋まらない） |
| 回避 | σ<=-2 かつ絶対差枚マイナス |
| 要注意 | ボーナスは増えているが絶対差枚が付いてこない |
| **判断不能** | 回転数・台日が足りない。**「効果なし」ではない** |

## 限界
- 四半期は恣意的な区切り。店長交代など既知の変化点があるならそちらで切るほうが良い
  （[[feedback-hall-regime-needs-external-event-calendar]]）
- 台番号まで割ると、ほとんどのセルが判断不能になる。それは方法の失敗ではなく
  **データ量の限界**であり、隠さずそう出す
- レヴューの現存1台（2139）はゾロ目日8台日・-1.0σ。悪いのではなく測れていない

## Action
- 条件の効果は `backtest/condition_drilldown.py` で見る。四半期推移と現在の設置が出る
- **撤去済みの機種を候補に載せない。** 座れないものは判断に要らない
- 符号の反転を単独の棄却理由にしない。**向きが一貫して動いているか**を見る
- 台数の少なさを棄却理由にしない。足りないなら「判断不能」と書く
- 統計で決着が付かない小標本は、**現場で1日測るほうが速い**ことがある
