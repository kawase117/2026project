# 3F_R_N の角番効果は top2_share=48.5% で台特定シグナル

## 背景
kamata7_theory.md では 3F_R_N を「角番のみ有効(p=0.001)」としていたが、machine_dependency テストで top2_share=48.5%、除外後 p=0.054 と判明。

## アクション
- 3F_R_N の角番効果は特定2台に依存
- 一般ルールとしての「中間台優位」は 3F_R_N では弱い
- 対照: 3F_L_A(top2_share=5.7%), 3F_R_A(6.6%) は除外後も p<0.001 で構造シグナル

## 例
3F_R_N: original_p=0.020, excluded_p=0.054, top2_share=48.5%
3F_R_A: original_p<0.001, excluded_p<0.001, top2_share=6.6% → 構造シグナル

