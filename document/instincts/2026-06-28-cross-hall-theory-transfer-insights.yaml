# みとやでは差枚と104%率が高相関（ρ=0.873）で、104%率への切り替えは不要

## 背景
蒲田7では DD を 104%率で分析して DD18-23 トラフゾーンを発見した手法をみとやに導入。差枚と104%率の Spearman ρ = 0.873 で高い一致。

## アクション
- みとやの分析は差枚ベースで十分。104%率への切り替えは不要
- h_jug の角番×104%率ランキングは差枚と完全一致 → corner1 の信頼性をさらに補強
- mixed_805 のみ差枚と104%率の角番ランキングが大きく乖離（少数台の爆発型）
- non-X_DDS DD の 104%率 KW もホール全体 p=0.130 で非有意

## 例
ホール全体: diff vs rate_104 Spearman ρ=0.873
h_jug 角番: diff_rank = rate104_rank（完全一致）
mixed_805 角番: diff_rank vs rate104_rank が大きく乖離

