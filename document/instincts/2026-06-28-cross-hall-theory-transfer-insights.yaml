# top2_share が高い = 偽シグナルではなく「台特定シグナル」

## 背景
machine_dependency テストで top2_share >= 50% を「偽シグナル」と判定していたが、解釈を修正。top2_share が高いことは「一般ルールとしては無効」だが、「特定の台が一貫して強い」ことを示しており、その台を直接狙う価値がある。鉄台（完全に高設定と長期証明されたもの）とは区別し「強い台」程度の位置づけ。

## アクション
- top2_share >= 50% → 「台特定シグナル」と分類する。一般ルール（末尾8/9は強い）としては使えないが、特定台（台3108, 3048等）として直接狙う価値がある
- 特定台が機種入替を跨いでも一貫してプラスなら、台番号に紐づくホールの設定投入戦略（物理位置への傾斜）を反映している可能性が高い
- みとやの台674（マイジャグ角1）も同じ構造: 末尾 d4 は偽シグナルだが台674を狙うのは有効

## 例
蒲田7 3F_L_N d8: top2_share=54%, top2=台3108/3048
  台3108: 吉宗(+1462), からくりサーカス(+770), アズールレーン(+470), 鉄拳6(+200) → 機種が変わっても一貫プラス
  台3048: 吉宗(+1257), かぐや様(+966), ToLOVE(+935) → 同上
  → 「末尾8は強い」ではなく「台3108/3048は強い台」

