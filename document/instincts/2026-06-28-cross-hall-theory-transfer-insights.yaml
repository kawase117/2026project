# 生存バイアスの有無はホール規模と入替戦略に依存する

## 背景
みとや（小規模、266台）では生存バイアスあり。蒲田7（大規模、535台）ではなし。大規模ホールは機種入替を定期的に行い成績ベースの判断が薄い。小規模ホールは「売れない台を撤去」する判断が成績ベースで行われやすい。

## アクション
- 新ホール分析時、経過日数効果を検出したら必ず survived/removed の debut 期比較を行う
- 小規模ホール（200台以下）は生存バイアスの混入を強く疑う
- 大規模ホール（500台以上）は3フェーズモデルが実際の投入戦略を反映している可能性が高い
- stability_rate（機種安定率）が低いほど生存バイアスが起きにくい

## 例
みとや(266台): survived debut=-17 vs removed=-180 → バイアスあり
蒲田7(535台, stability=0%): survived=-194 vs removed=-124 → なし
