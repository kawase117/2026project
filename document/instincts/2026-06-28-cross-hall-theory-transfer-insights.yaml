# 蒲田7の3フェーズモデルには生存バイアスが混入していない

## 背景
みとやPhase10fで h_nonjug の debut→mature 逆転が生存バイアスと判明（survived debut=-16.7 vs removed debut=-179.9, MWU p=0.003）。蒲田7でも同じ検証を実施したが、結果は対照的だった。

## アクション
- 2F_N: survived debut=-194 vs removed debut=-124。survived の方がむしろ悪い（p=0.60, 非有意）。生存バイアスなし
- 3F_N: survived=-131 vs removed=-134。ほぼ同等（差+3, p=0.04）
- 3フェーズモデル（-358→+132→+157）は生存バイアスではなく、ホールの実際の設定投入戦略を反映している
- 蒲田7 2F の stability=0%（全台入替）は「成績に関係なく定期的に入れ替える」構造。撤去判断が成績ベースではないため、生存バイアスが起きにくい
- みとやとの構造差: みとやは小規模ホールで「売れない台を撤去」する判断が成績ベース → 生存バイアスが強い

## 例
蒲田7 2F_N コホート追跡: 1-14日=-358, 15-60日=-157, 61-180日=+132, 181日+=+157
みとや h_nonjug: survived debut=-16.7 vs removed debut=-179.9 → 生存バイアスあり
蒲田7 2F_N: survived debut=-194 vs removed debut=-124 → 生存バイアスなし

