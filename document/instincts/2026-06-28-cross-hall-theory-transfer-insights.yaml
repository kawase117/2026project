# 3F_L_N d8/d9 は末尾ルールではなく台特定シグナル

## 背景
kamata7_theory.md では d8/d9 を「堅牢（少数台依存注意）」としていたが、machine_dependency テストで top2_share=54%(d8)/75.5%(d9) と判定。top2 除外で d8 p=0.155, d9 p=0.059 に低下。

## アクション
- 「末尾8/9を狙え」ではなく「台3108, 3048, 3109, 3039を直接狙え」
- split-half PASS は台固有性の安定性を反映しているだけ（みとやのアンチパターン3と同じ構造）
- kamata7_theory.md の §2.2 を「台特定シグナル」に更新すべき
- ML特徴量としての last_digit は 3F_L_N でも信頼性が低い。角番のみで選択が安全

## 例
d9 top2: 台3109(吉宗+1636, 鉄拳6+1272), 台3039(アズールレーン+1382, シャーマンキング+652)
top2除外後: d9 p=0.059（境界的非有意）

