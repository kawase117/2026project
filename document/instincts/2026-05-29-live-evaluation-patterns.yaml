# 末尾合計差枚の突出は少数台のノイズが原因のことがある

## 背景
2026-05-29の2F_N末尾9が+15,900で1位だったが、
台2309(+12,600)と台2059(+8,300)の2台で合計の大半を占めていた。
この2台を除くと末尾9の合計は-5,000（実質最下位圏）になる。

台2309の直近15日履歴を確認すると毎日高稼働(6,000〜8,000G)で
通常差枚はほぼマイナス。設定2〜3の固定高稼働台が偶然出た可能性が高く、
設定シグナルとは言えない。

## アクション
特定末尾が突出して1位になった場合：
1. その末尾のTop2〜3台の差枚を個別確認する
2. Top台の直近15日履歴を確認し「通常マイナス→今日だけプラス」なら分散ノイズと判断
3. 上位台を除外した場合の末尾合計を計算し、末尾全体が強いか確認する
4. 2台以下の台が合計の大半を占める場合は「ノイズ末尾」として扱う

## 例
2026-05-29 2F_N末尾9:
  合計: +15,900（1位に見える）
  実態: 台2309(+12,600) + 台2059(+8,300)の2台で+20,900を占有
  除外後: -5,000（実質最下位圏）
  台2309直近: -2,100, -3,800, -2,200, -1,100, -6,200 → 低設定高稼働台と推定

