# 3F_N は実績ベースで最も信頼できるセグメント

## 背景
2026-05-27/28/29の3日間における Hit@2 セグメント別集計：
- 3F_N: 3/6 (50%) — 3日すべてで1件以上一致
- 2F_N: 1/6 (17%) — ランダム期待値(20%)以下
- 3F_A: 1/6 (17%) — 構造的弱点の可能性あり
- 2F_A: 1/6 (17%) — 台数少なく不安定

3F_Nのみがランダムを大きく上回っており、他の3セグメントはほぼランダム水準。
サンプル3日間なので断定はできないが、3F_Nへの信頼度集中は合理的。

## アクション
- combined予測では3F_Nのウェイトを最大にする
- 「最有力末尾」の根拠として3F_Nの予測を最優先で参照する
- 2F_N/3F_A/2F_Aは「参考情報」として扱い、3F_Nと合意した末尾のみ強く推奨する
- 毎月セグメント別Hit@2を集計して優先順位を検証・更新する

## 例
3日間セグメント別Hit@2:
  3F_N: 1/2 → 1/2 → 1/2 = 3/6 (50%)
  2F_N: 0/2 → 0/2 → 1/2 = 1/6 (17%)
  3F_A: 0/2 → 1/2 → 0/2 = 1/6 (17%)
  2F_A: 0/2 → 0/2 → 1/2 = 1/6 (17%)

