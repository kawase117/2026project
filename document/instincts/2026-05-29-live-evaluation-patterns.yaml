# 実運用ではHit@3 > Hit@2（モデル設計と逆）

## 背景
モデルはhit@2でテストされ内部精度は高いとされているが、
3日間の実績では：
- Hit@2: 6/24 (25.0%) — ランダム比+5%
- Hit@3: 14/36 (38.9%) — ランダム比+9%

特に2026-05-27ではh@2=12.5%に対しh@3=41.7%。
3番目の予測が1・2番目より当たることが多い。
「予測上位ほど信頼できる」とは言えない可能性がある。

考えられる原因：
- モデルのバックテスト精度はあくまで統計的期待値
- 1位・2位の予測が強すぎて他の有力末尾を押しのける過剰確信が起きている可能性

## アクション
- 実運用ではTop3を参照する（Top2に絞るとかえって機会損失になる）
- モデルの1位末尾を絶対視しない。2・3位も同等の候補として扱う
- モデル内hit@2と実績hit@2は別指標として管理する

## 例
2026-05-27: h@2=1/8(12.5%) / h@3=5/12(41.7%) ← 3番目予測が多く当たった
2026-05-28: h@2=2/8(25.0%) / h@3=6/12(50.0%)
2026-05-29: h@2=3/8(37.5%) / h@3=3/12(25.0%) ← この日のみh@2>h@3
3日合計: h@2=25.0% / h@3=38.9%

