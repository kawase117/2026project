# 事後チューニングバイアス: 同一期間での決定と検証は楽観バイアスを生む

## 背景
Walk-forward結果からセグメント別ウェイトを決定し、同じWalk-forward期間で検証すると、
リークではないが楽観バイアスが生じる。Codexレビューで指摘された。

## アクション
1. レポートに「事後チューニングを含む」旨を必ず明記
2. テスト期間を前半/後半に分割し、前半の結果で決めたパラメータを後半で検証
3. 前半/後半の両方で改善がプラスなら「真の改善」、片方でもマイナスなら「過学習の疑い」
4. 完全にバイアスフリーにするには、ウェイト決定用のデータを検証用から完全に分離する

## 例
```
# 楽観バイアスの構造:
# 1. v4のWalk-forward全期間の結果を見る
# 2. 「c4は2F_L_Nで1.21だから重みを上げよう」と決定
# 3. 同じ全期間でv6bを走らせて「改善した！」→ 当然改善して見える

# 緩和策:
# テスト日 1-83 (前半) の結果でウェイト決定
# テスト日 84-166 (後半) で検証 → ここでも改善なら信頼できる
```

