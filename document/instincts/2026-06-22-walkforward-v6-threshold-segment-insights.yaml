# 短期ウィンドウのfillna(0)は信号欠損と弱信号を混同する

## 背景
Aセグメント向けに7日/30日の短期ウィンドウでhist特徴量を計算する際、
該当期間にデータがないmachine_numberにfillna(0)を適用すると、
「短期トレンドが弱い（本当に0に近い）」と「履歴不足で計算不能」が区別できない。

## アクション
- `a_seg_hist_coverage`: 短期ウィンドウ内に1日以上データがあるAセグ台の割合を記録
- `a_seg_fallback_count`: fillna(0)でフォールバックしたAセグ台数を記録
- レポートに平均coverage率とfallback率を明記
- coverage率が低すぎる場合(例: <50%)、その短期ウィンドウは信頼性不足と判断

## 例
```python
# 7日ウィンドウの場合、週1-2回しか稼働しない台はデータ0-2件
# → fillna(0) が大量発生し、信号がノイズに埋もれるリスク
# coverage率を見て判断する

a_machines = actual[actual['segment'].str.endswith('_A')]
a_with_hist = a_machines[a_machines['hist_hit_an'] > 0]  # 簡易判定
coverage = len(a_with_hist) / len(a_machines) if len(a_machines) > 0 else 0
```

