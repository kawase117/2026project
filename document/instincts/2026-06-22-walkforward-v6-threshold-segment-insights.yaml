# Payout>=100%はWinrateと数学的に同一

## 背景
`payout >= 100%` は `(games*3 + diff) / (games*3) >= 1.0` すなわち `diff >= 0` と等価。
これは勝率（winrate = (diff > 0).mean()）と同一の指標であり、独立した情報を持たない。

Walk-forwardで hist_winrate が全Nセグメントで逆指標（lift < 1.0）だったことと、
hit100%が同様に全Nセグメントで lift < 1.0 だったことは完全に整合する。

## アクション
payout閾値を検討する際、100%は候補から除外する。
最低でも102%以上から開始すること。

## 例
```python
# NG: winrateと重複
hist_hit100 = (payout >= 100).mean()  # == (diff > 0).mean() == winrate

# OK: 独立した情報を持つ
hist_hit104 = (payout >= 104).mean()  # 設定4以上の出玉パターン
hist_hit106 = (payout >= 106).mean()  # 設定5-6の強い証拠
```

