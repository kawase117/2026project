# Payout閾値はA/Nセグメントで最適値が異なる

## 背景
Walk-forward バックテスト（v4, 90日窓, 166テスト日）で hist_hit の閾値を
100/102/104/106% の4段階で比較した結果、セグメントにより最適閾値が大きく異なることが判明。

Nセグメント（AT機）は一貫して106%が最強。高い閾値ほどリフトが上がる単調傾向。
Aセグメント（ジャグラー等）は104%がベスト（3F_L_Aでlift=1.092）。
3F_R_Aのみ100%が最適だが、100%はhist_winrateと同一指標のため不採用。

## アクション
- Nセグメント: 106%閾値を使用（設定5-6の強い証拠をフィルタ）
- Aセグメント: 104%閾値を使用（設定4の理論機械割と整合）
- 100%閾値は winrate と完全重複するため、独立特徴量として採用しない
- 特徴量名は `hist_hit_an`（A/N family threshold）とし、セグメント単位ではなくA/N分類単位であることを明示

## 例
```
セグメント×閾値 lift@N 実測:
           hit100  hit102  hit104  hit106
2F_L_N     0.841   0.948   1.020   1.116  → 106%
2F_R_N     0.786   0.921   1.013   1.072  → 106%
3F_L_A     1.034   1.039   1.092   1.067  → 104%
3F_L_N     0.855   1.071   1.099   1.157  → 106%
3F_R_A     1.034   0.982   0.979   1.017  → 100%(不採用→104%)
3F_R_N     0.887   1.022   1.072   1.074  → 106%
```

