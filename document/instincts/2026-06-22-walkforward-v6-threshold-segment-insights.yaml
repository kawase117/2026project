# コンポーネント有効性はセグメントにより劇的に異なる

## 背景
v4の166日Walk-forwardでセグメント別にコンポーネント単独リフトを計測した結果、
全セグメント共通のウェイトは次善策であることが判明。

主な発見:
- 2F_L_N: c4(曜日×角番)が突出(1.21)。c2/c5は無効
- 2F_R_N: 全コンポーネント≈1.0。スコアリング自体が効かない
- 3F_L_N: c2(理論最適)が1.12で最強。他では無効
- 3F_R_N: hist_hit104が1.14で最強
- c5(末尾): 全体lift=1.35は3F_L_N限定のセグメント選択効果だった

## アクション
- セグメント別ウェイトの導入を検討する
- ただし事後チューニングバイアスに注意: テスト期間前半/後半分割で検証必須
- 2F_R_Nは均等ウェイト（何をやっても効かない）
- c5の全体リフトが高く見える場合、セグメント効果の混入を疑う

## 例
```
Component  2F_L_N  2F_R_N  3F_L_A  3F_L_N  3F_R_A  3F_R_N
c1          1.13    1.00    1.07    1.02    1.07    1.00
c2          1.00    1.01    1.00    1.12    0.98    1.01
c4          1.21    0.98    1.02    1.04    1.04    1.01
c5          1.02    1.00    1.00    1.00    1.07    0.96
hist_hit104 1.09    1.00    1.05    1.09    0.98    1.14
```

