# 特徴量名は実装の粒度と一致させる

## 背景
`hist_hit_adaptive` という名前で設計したが、実際はセグメント単位の最適化ではなく
A/N family単位の閾値選択だった。Codexから「名前と実装が一致しない」と指摘。
`hist_hit_an` に修正。

## アクション
- "adaptive" は「データから自動的に閾値が変わる」印象を与えるため、
  固定閾値のルックアップには使わない
- 実装粒度を名前に反映: セグメント単位なら `_seg`、A/N単位なら `_an`、全体なら無印
- Codexに渡すプロンプトでは名前と実装仕様の整合性を事前チェック

## 例
```python
# NG: 名前がoverpromise
hist_hit_adaptive  # "adaptive"だが実際は固定辞書ルックアップ

# OK: 名前が実装と一致
hist_hit_an        # A/N family別の閾値 (N=106%, A=104%)
hist_hit_seg       # もしセグメント単位で6種類の閾値を使うなら
```
