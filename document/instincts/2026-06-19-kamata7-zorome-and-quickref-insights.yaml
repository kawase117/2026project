# dd_mod10とゾロ目桁の一致は追加効果なし（-18で微弱逆効果）

## 背景
「3日に33番台」「7日に77番台」のように、DDの下一桁とゾロ目台の桁が一致する場合の追加効果を検証。
一致: diff=+215 (n=2,369)
不一致: diff=+233 (n=21,262)
差=-18。一致による追加効果は存在しない（むしろ微弱に逆効果）。
これはid: kamata7-day-digit-zorome-no-effect（通常台の日ゾロ目効果なし）と整合する。

## アクション
ゾロ目台を選ぶ際に「今日のmod10と桁が合うゾロ目台」を優先する必要はない。
ゾロ目台の選択はmod10/曜日別のゾロ目効果テーブルに基づいて判断する。

## 例
7月7日(mod10=7): 77番台を特別視する必要なし。ゾロ目台全体の+49効果は享受できる。
7月3日(mod10=3): 33番台 ≈ 55番台 ≈ 他のゾロ目台。桁一致の追加ボーナスはない。
