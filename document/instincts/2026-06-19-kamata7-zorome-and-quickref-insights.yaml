# 土曜のゾロ目台効果はdd_mod10によって大きく変動する（+333〜-330）

## 背景
土曜日の曜日×dd_mod10別ゾロ目台効果:
mod10=8: +333（最強）
mod10=6: +308
mod10=3: +271
mod10=4: +187
mod10=0: +134
mod10=7: +52
mod10=1: +94
mod10=2: -155（逆効果）
mod10=5: -241（強い逆効果）
mod10=9: -330（最も逆効果）
水曜はmod10=5で+607の例外的ゾロ目効果がある一方、mod10=0/-2で逆効果。

## アクション
土曜にゾロ目台を優先すべきmod10: 8, 6, 3, 4, 0
土曜にゾロ目台を避けるべきmod10: 9, 5, 2
7月の具体例:
7/6(土) mod10=6 → ゾロ目台を積極的に狙う(+308)
7/13(土) mod10=3 → ゾロ目台を積極的に狙う(+271)
7/20(土) mod10=0 → ゾロ目台を狙う(+134)
7/27(土) mod10=7 → ゾロ目台効果は微弱(+52)、末尾d8優先

## 例
7/13(土) mod10=3: ゾロ目台=+387 vs 非ゾロ目=+116 → 差=+271
7/20(土) mod10=0: ゾロ目台=+417 vs 非ゾロ目=+283 → 差=+134

