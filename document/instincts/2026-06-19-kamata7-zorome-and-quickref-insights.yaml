# DD×曜日×末尾のリファレンスデータ体系を構築済み

## 背景
蒲田7の全データから、dd_mod10(0-9)×曜日(月-日)×台番号末尾(0-9)の全700組み合わせについて
avg_diff, plus_rate, hit104_rate, n, rank を算出し、3つのCSVに保存した。
任意の月のカレンダーと照合すれば、その日のmod10と曜日からTop3/避け末尾を即座に引ける。

## アクション
新しい月の戦略を立てる際は以下のCSVを参照:
1. eda/reports/kamata7_quickref_dow_mod10.csv — 実戦用早見表（Top3/避け/ゾロ目効果）
2. eda/reports/kamata7_dd_mod10_dow_digit_reference.csv — 全700組み合わせの詳細データ
3. eda/reports/kamata7_dd_mod10_dow_zorome_reference.csv — ゾロ目台効果の曜日×mod10別

## 例
8月の水曜日（例: 8/7, 8/14, 8/21, 8/28）の狙い目を知りたい場合:
8/7: dd=7, mod10=7, 水曜 → quickref_dow_mod10.csvの「水,7」行を参照
8/14: dd=14, mod10=4, 水曜 → quickref_dow_mod10.csvの「水,4」行を参照
イベント判定: mod10==1(1のつく日), mod10==7(7のつく日), DD11/22(ゾロ目)等を別途確認

