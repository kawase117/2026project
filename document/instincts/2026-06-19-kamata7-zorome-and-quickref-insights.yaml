# DD11×台末尾ゾロ目で+210の二重ゾロ目効果が発生する

## 背景
DDゾロ目（11日, 22日）に台末尾ゾロ目台を打つと、二重ゾロ目効果が発生する。
DD11: ゾロ目台=+375 vs 非ゾロ目=+165 → 差=+210（今回の分析で最大級の効果量）
DD22: ゾロ目台=+246 vs 非ゾロ目=+163 → 差=+83
DD11の効果量が突出しており、DD22は半分以下。
仮説: ホールが「11日にゾロ目台に高設定を入れる」という意図的パターンを持っている可能性。

## アクション
DD11は最優先でゾロ目台（00,11,22,...,99番台）を確保する。
DD22もゾロ目台を優先するが、DD11ほどの効果は期待しない。

## 例
DD11に末尾3を狙う場合: 33番台(diff≈+375) >>> 非ゾロ目末尾3台(diff≈+165)
差=+210は、セグメントA/Nの差(+90程度)や角2効果(+95)を大幅に上回る最大の選択変数。

