# 台末尾ゾロ目台は全体で+49差の安定的な優位性がある

## 背景
蒲田7の全データ（7/7除外）でゾロ目台（台番号末尾2桁同一: 00,11,22,...,99）vs 非ゾロ目台を比較。
ゾロ目台: diff=+231, plus=41.6%, hit104=33.1% (n=23,631, 全体の9.8%)
非ゾロ目: diff=+182, plus=40.8%, hit104=32.3% (n=217,187)
差=+49。ゾロ目台は一貫して強い。
内訳では00台(+318), 66台(+320), 99台(+322)が特に強く、77台(+120), 88台(+148)は弱め。

## アクション
同じ末尾で台を選ぶ際、ゾロ目台（XX番台）があればそちらを優先する。
ただしmod10やdd_mod10との組み合わせで逆効果になるケースがある（後続instinct参照）。

## 例
末尾5を狙う場合: 55番台(diff=+287) > 非ゾロ目の末尾5台(+182程度)
末尾7を狙う場合: 77番台(+120)は非ゾロ目より弱い可能性あり — 77は例外

