# DBのA型定義と蒲田七（蒲田一）の定義が異なる。2FAは実質BT専用フラグ

## 背景
- DBでは A型（jug_flag/hana_flag）と BT（bt_flag）は別フラグとして管理されている
- 蒲田七・蒲田一の運用上の分類: A型とBTを「非AT（非N）」としてまとめて扱う
- 2FAフラグは実質的にBT専用フラグとして機能している

厳密には異なる機種だが、台数の少なさと「非AT」という共通点から現場では一括で考えられている。

## アクション
ML特徴量設計でA型とBTを別々に扱う場合はDBフラグと現場定義のズレを念頭に置く。
「A型 vs AT系」ではなく「非AT（A型+BT） vs AT系」の切り口も検討する。
蒲田七・蒲田一固有の知見として他ホールへの転用には注意が必要。

## 例
DB定義: A型（jug_flag=1 or hana_flag=1）と BT（bt_flag=1）は別カテゴリ
蒲田七定義: A型+BT = 「非AT」として一括管理 → 2FAが「非AT専用フラグ」として機能

