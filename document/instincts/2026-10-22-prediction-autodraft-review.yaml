# 予測の自動下書きは、予告の原文・日付種別・「避ける」の根拠を毎日読み直す。10/20も10/21も同じ型の誤りがあった

## Core claim
自動下書きは、予告ツイートを読んで機種を並べるが、**ホールの取り違え、日付種別の計算、前日・順位だけの根拠**で誤る。
`announce-wrong-binding-void-never-delete` は台帳の直し方で、これは**予測文書の文章を直す側**の確認項目。

## Evidence
10/20と10/21の2日続けて、下書きが次の誤りをしていた。
- **ホールの取り違え。** 10/20は楽園の予告3件が楽園上永谷の話、10/21は slokotae7 が10/11の楽園町田の結果、sloneko222 が楽園ハッピーロード大山の予告で、楽園蒲田ではなかった。さらに999999Q9Q（マルハンのアカウント）の予告が楽園にも登録され、楽園には「NO取材デー」としか書いていなかった。
- **日付種別の誤り。** 10/21は1の付く日なのに、蒲田1の節に「0の付く日の弱さ」を書いていた。0の付く日の過去実績（−751/台）を持ち込んでいて、結論がぶれる。
- **「避ける」を30日順位だけで書く。** 蒲田7のミリオンゴッドを「過去30日で順位50」で避けにしたが、1の付く日の実測は +536（それ以外 −96）で逆だった。
- **前日の結果を翌日の根拠にする。** 10/20は「前日に負けた機種を避ける」と書いていた。前日の結果は翌日に情報がない。
- **数字の取り違え。** 楽園の「東京喰種は前日 +1810」は、実際はSAO2の数字だった（東京喰種は −161）。

## Action
下書きを直す前に、次の5点を確認する。
1. **予告ファイルの `raw_text` を読み、ホール名を確認する。** 楽園は蒲田のほかに町田・大山・上永谷・立川があるので、本文の店名・フロア名（新館/本館）で判断する。999999Q9Q はマルハンの蒲田1・蒲田7向け（楽園のアカウントではない）。
2. **日付種別（1の付く日・0の付く日・ゾロ目・曜日）は、予告の見出しとカレンダーで決める。** 下書きの種別を信用しない。
3. **「避ける」行は、その日の種別での実測が反対でないかを確認してから残す。** 順位だけでは書かない。根拠が弱ければ消す（「避ける」を含む行は機械的に採点される）。
4. **前日の結果を根拠にした行は消す。**
5. **下書きの数字は、機種名とセットでDBから引き直す。** 機種を取り違えた数字が混ざる。

## 補足
下書きが誤紐付けの予告を登録している場合の台帳の直し方は `announce-wrong-binding-void-never-delete` を使う。本登録は当日中にしかできないので、仮登録のまま見送った分は答え合わせで「未登録」と書く。
