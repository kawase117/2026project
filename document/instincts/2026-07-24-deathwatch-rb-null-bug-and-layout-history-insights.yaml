# 死亡検知は「効果がゼロか」ではなく「効果がbaseline期から変わったか」を検定すべき

## 背景
みとやの角番1シグナルは16か月間+0.327z(RB確率z)で安定し、2026-04-27に一度きり
終わった(店長交代と一致)。これは「2-3ヶ月で入れ替わる循環レジーム」ではなく
「長く効く法則がある日死ぬ」という形。循環モデルなら常時レジーム推定が必要だが
(60日窓でも検出まで時間がかかり、2-3ヶ月のレジームには間に合わない)、
この形なら「安定した法則を使い続け、死んだら事後検知する監視」だけで足りる。
検知が数ヶ月遅れても、16ヶ月効く法則には十分価値がある。したがって
死亡検知の帰無仮説は「効果がゼロ」ではなく「recentの効果==baselineの効果」に
すべき。効果がゼロでないことはbaseline期間で既に確認済みで、知りたいのは
差分だから。UNDERPOWERED(分解能不足で判定不能)をALIVE(変化なしを確認)と
区別することも重要。日次分散が大きい系列ではnullが情報を持たない。

## アクション
既知セオリーの継続監視を作るときは、(1)baseline期とrecent期の日次効果系列を
それぞれ独立にブロックブートストラップし、(2)差の分布のCIがゼロを跨ぐかで
判定する。「baseline期のCIがゼロを跨がない(NO_BASELINE除外)→差が有意なら
DEAD/REVERSED/WEAKENED/STRENGTHENED、有意でなければ検出限界とbaseline効果量を
比較してALIVE/UNDERPOWEREDを判定」という分類が実用的。指標は差枚を避け、
機械割とBB+RB(ボーナス確率)を使う(diff-coins-confounds-setting-with-turnover参照)。
陽性対照(既に死亡が確定している既知ケース)と陰性対照(死亡していないケース)の
両方で仕組みを検証してから運用に載せる。

## 例
```python
# 期間ごとに独立にリサンプルし、差の分布を作る(同じseedで両期間を引くと
# 差の分散を過小評価する)
b_boot = block_bootstrap_means(baseline_daily, seed=A, block=7)
r_boot = block_bootstrap_means(recent_daily, seed=B, block=7)
delta_ci = percentile(r_boot - b_boot, [2.5, 97.5])
status = "DEAD" if delta_ci_significant and not recent_ci_significant else ...
```

