# machine_layoutはmachine_number単独PKの単一スナップショットで、構造上ただ1つの時代しか正しく表現できない

## 背景
machine_layoutは日付次元を持たないため、改装で位置定義が変わると新しい位置が
過去データに遡って適用される。楽園蒲田の2026-07-06の改装でsection定義が
書き換わり(2223-2240→2225-2242等)、技術介入の端番効果が+1.127pp→+0.211pp(ns)に
変化した。これは効果の消滅ではなく測定対象の破壊だったが、一見「セオリーが
死んだ」ように見えるため、死亡検知の仕組みが誤検知を出しかけた。machine_layoutを
参照するコードは約60ファイルあり、いずれもmachine_number単独での単純結合。
テーブル自体を日付次元化すると1台に複数行が対応し全て静かに二重計上になるため、
machine_layoutは現行スナップショットのまま温存し、日付次元を持つ
machine_layout_history(PK: machine_number, valid_from)を正本として別途構築した。

## アクション
過去データに位置を結合する新しいコードは必ずmachine_layout_historyを使う
(database/CLAUDE.mdに結合SQLの書式あり)。改装・島配列変更のニュースを
聞いたら、その時点でmachine_layout_historyに新エポックをinsert-eraで
追加すること(machine_layoutを直接上書きしない)。位置ベースの効果が
「突然消えた」ように見えたら、まずその期間にレイアウト変更が無かったか、
そしてmachine_layoutが最新スナップショットに差し替わっていないかを疑う。
真の効果消失と測定対象の破壊は、実装を切り替えて同じ数値が出るかで
区別できる(このケースでは日付次元化で旧数値が完全に復元した)。

## 例
```sql
-- NG: 単一スナップショット結合(改装をまたぐと過去データが汚染される)
LEFT JOIN machine_layout l ON r.machine_number = l.machine_number

-- OK: 日付でエポックをマッチさせる
LEFT JOIN machine_layout_history l
       ON r.machine_number = l.machine_number
      AND r.date >= l.valid_from
      AND (l.valid_to IS NULL OR r.date <= l.valid_to)
```

