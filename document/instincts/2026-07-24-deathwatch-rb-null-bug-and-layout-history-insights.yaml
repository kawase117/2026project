# 差枚は「機械割×回転数」の積。回転数に効く変数を差枚で評価すると設定差でないものを設定差として計上する

## 背景
diff = 3 * G * (payout - 1) なので、機械割が同じでもG(回転数)が違えば差枚は動く。
蒲田7角番1の検証で、差枚ベースの-162枚のほぼ全部(-124枚が共分散差、-37枚がG数差、
機械割の寄与はわずか-0.5枚)が「角1は+624G多く回されている」という回転数差の
帰結だった。角1は「設定が低い位置」ではなく「他の客に多く回されている位置」で、
ジャグ平均機械割が98.03%(100%未満)なので回るほど負ける。プレイヤーは自分の
回転数を自分で決めるので、この-162枚は座っても継承しない。G数で層別して
効果量を測るのも誤り(コライダーバイアス。位置とG数の両方に影響されるG数で
条件付けると見せかけの関連が生まれる)。

## アクション
位置・人気度など回転数に影響しうる変数の効果を測るときは、差枚ではなく
payout(機械割)とrb_rate/bonus_rate(BB+RB、設定の直接推定量)を主指標にする。
差枚で有意な効果が出た場合は、必ずG数の差も確認し、diff=3G(payout-1)で
機械割の寄与とG数の寄与を分解する。G数で層別した効果量は採用しない
(コライダーバイアスで実際より大きく出る)。BBとRBは必ず両方見る
(設定は両方を同じ向きに動かすため、片方だけだと符号が食い違って
判断を誤る。蒲田7角番1ではBB+0.071/RB-0.053と逆向きで、
これが「設定差なし」の決め手になった)。

## 例
```python
# 差枚の差を機械割とG数の寄与に分解する
total = 3 * (G1 * (P1 - 1) - G0 * (P0 - 1))
games_part = 3 * (G1 - G0) * (P0 - 1)      # G数の差による寄与
payout_part = 3 * G1 * (P1 - P0)            # 機械割の差による寄与
```

