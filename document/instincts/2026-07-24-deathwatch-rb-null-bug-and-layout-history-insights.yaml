# games は設定の下流。games>=N フィルタは低設定の日を選択的に落とし、残った成績を押し上げる

## 背景
「低設定→早く見切られる／高設定→長く回される」という基本法則により、games は
設定の下流にある（独立指標RBで確認: 台レベル相関 ハナ+0.94/ジャグ+0.69、
日レベルでジャグの稼働帯別RBz が -1.33→+0.97 と単調）。したがって
`games >= N` のフィルタは低設定の日を選択的に落とす選択バイアスを生む。
大きさはカテゴリと閾値による（機種内RBzシフト）: ジャグ 400→+0.01 / 2000→+0.21 /
3000→+0.31 / 5000→+0.49、ハナはさらに大、AT一般は小(+0.06〜0.10)。
ジャグでgames>=3000を使うだけで既知の最強シグナル(みとや角番1 +0.327z)と
同オーダーの見かけの効果が作れる。eda/core.py の load_hall_df は MIN_GAMES=400 で
41分析が使うが、400は残存99%でほぼ無害。dashboardの既定1000は+0.10程度。
危険なのは2000+を使う個別分析。フィルタ後の平均は「N回転まで回った日に条件づけた
機械割」という正当な条件付き量であり、誤りになるのは(a)無条件の水準として読む、
(b)カテゴリ構成や稼働分布が違う群の比較に使う、ときに限る。

## アクション
区画・軸の設定シグナルを測るときは games フィルタを集計前にかけない
（追試2以降のharnessはそうしている）。測定精度で回転数の下限が要る場合は、
足切りではなく回転数を尤度の重み/観測分散に入れる（ベイズ事後や加重回帰）。
どうしても閾値が必要なら、(1)結果を「高稼働日に条件づけた率」と明記、
(2)カテゴリ横断で同じ閾値を並べない（残存率で揃えるかカテゴリ内比較に限る）、
(3)閾値なし版と併記して差を確認する。カテゴリ間で比較するときは
ジャグ/ハナをAT一般より過大評価する方向にバイアスが出ることを念頭に置く。

## 例
```python
# NG: 集計前に足切り → 低設定日が非ランダムに脱落
df = df[df.games_normalized >= 2000]
seg_payout = df.groupby("section").payout.mean()   # 膨張＋区画間で差別的

# OK: フィルタせず、回転数を重みにする / 日と機種を統制した残差で測る
# （games を条件に入れたいなら「conditional on games>=N」と明記して報告）
```

