# rb_probability_decimal は rb_count==0 の行でNULLになる。notna()フィルタがRB0回の日を非ランダムに落とす

## 背景
`rb_probability_decimal` は `rb_count / games_normalized` から作られる派生列だが、
`rb_count == 0` の行では NULL になる（9ホール全てでNaN率とRB0回率が完全一致、
rb_count>0でNULLの行は0件）。`bb_probability_decimal`も同様（楽園40.8%、みとや38.0%）。
`notna()` / `IS NOT NULL` / `> 0` フィルタをかけると「RBが1回も出なかった日」が
丸ごと脱落する。脱落は非ランダムで、回転数の少ない台ほどRB0回の日が多いため、
その台だけ「最悪の日」が除かれて平均RB確率が過大評価される（低回転台を優遇する
方向のバイアス）。実測: 蒲田7の角番1検証で汚染版RB差-0.111回/1000Gが修正版-0.053に半減。
NULL率はホールで大きく異なる（蒲田7 2.5% 〜 楽園 24.5%）ため、影響も一様ではない。
既存4スクリプト（eda/kakuban_rb_probability_verification.py等）とみとやの凍結
フォワードplanがこのバグを含んでいた。

## アクション
RB/BB確率は `rb_count / games_normalized`（bb_countも同様）のようにカウントから
直接計算する。`*_probability_decimal`列はフィルタ条件に使わない。既にこの列を
使ったコードを見つけたら、影響率（そのホールのrb_count==0率）を必ず確認する。
影響率が小さくても(蒲田7 2.5%)効果量の半分近くを動かしうるので「小さいから無視」
は禁物。凍結済みフォワードテストがこのバグを含む場合、対象日が未到来なら
INVALIDATED扱いにして修正版で再生成する（結果を見ていないので結果駆動の
書き換えにはならない）。

## 例
```python
# NG: RB0回の日を非ランダムに落とす
df[df["rb_probability_decimal"].notna()]

# OK: カウントから直接計算、ゼロを含む
df["rb_rate"] = np.where(df["games_normalized"] > 0,
                          df["rb_count"] / df["games_normalized"], np.nan)
```

