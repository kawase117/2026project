# hit率(勝率)は平均でなく分布の形に依存する。機種構成が違う区画を比べると設定でなくボラティリティを測る

## 背景
hit率 = P(差枚>0) は平均だけでなく分布の歪みに依存する。AT機は「多くの日は小さく
負け、稀に大きく勝つ」右歪み分布なので、同じ期待値でも P(差枚>0) が低く出る。
ジャグ・ハナハナは対称に近く高く出る。楽園§1のHot/Coldを63列で測り直すと
hit差 vs 差枚SD = -0.490、hit差 vs 機械割 = -0.209（逆相関）。§1のHot上位3件は
機械割ではプラスでなく2列が有意にマイナスだった。つまりhit率ランキングは区画の
機種構成のボラティリティを主に測っていた。この右歪みは「低設定→早く見切られ小さく負け、
高設定→長く回され大きく勝つ」の当然の帰結で、ノイズではない。

## アクション
区画・機種・軸を横断して設定の良さを比較するときは hit率(勝率)を主指標にしない。
日と機種を統制した機械割残差、またはBB+RB(ボーナス確率、設定の直接推定量)を使う。
hit率を出す場合も、比較対象の機種構成（低ボラのジャグ/ハナ vs 高ボラのAT）が
揃っているかを必ず確認する。104%率も同じ分布依存性を持つので同様に扱う。

