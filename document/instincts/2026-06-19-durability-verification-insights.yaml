# 蒲田7理論 耐久性検証結果（6主張の堅牢性判定）

## 背景
kamata7_theory.md の6つの「強い主張」に対して、3つの反証テスト（split-half期間分割、レジーム分割20251222、低稼働日除外）を実施した。台固有性定量化（top_machine_share）も併せて実施。

## アクション
以下の判定に基づき、主張の扱いを変えること:

**堅牢（3テスト一致）:**
- C2: 3F_L_N d8/d9最強 — ただしtop2_machine_share=51%で少数台依存あり。方向は安定だが特定台への注記が必要
- C3: 角番中間台優位 — top1寄与率0.7%で完全な構造シグナル。理論の最強の柱
- C4: AT群×土曜 +1.71pt — top1寄与率2.2%で構造シグナル。後半で+3.6ptに強化
- C6: 台末尾ゾロ目 全体+49 — 全テスト一致、寄与率7.3%で低い

**脆弱（格下げ対象）:**
- C1: 2F_L_N d6最強 (+365) — 3テストすべてで不一致。2F全域がstability=0%で機種入替の影響大
- C5: DD11ゾロ目 +210 — 前半+625.6→後半-173.7で符号反転。20251111（+2626）の1日が支配的

## 例
理論書更新時: C1を「強い主張」→「条件付き・不安定」に格下げ、C5を「少数日依存+レジーム変化」として注記

