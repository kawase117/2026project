# 推奨レジーム分割日20251222が台帳から客観的に確認された

## 背景
機種入替台帳から、20251222は63台入替・12セクション・前後166/176日で最もバランスの良い分割点と確認された。kamata7_theory.mdで以前から言及されていた日付が、データ駆動でも支持された。ただし最大の入替日は20260105（264台）であり、20251222は入替規模としては中程度。

## アクション
- split-half分析のレジーム分割点として20251222を標準採用すること
- 20260105（264台入替）は期間が前寄り（180/162日）でバランスはやや劣るが、入替規模は最大
- 複数分割点を使ったrobustness checkも将来検討の余地あり

## 例
推奨分割日選定ロジック: 入替台数の多さと前後日数バランスの積でスコアリング → 20251222が最良
