# DD11ゾロ目+210は20251111の1日が支配、2026年は逆転傾向

## 背景
DD11ゾロ目の+210効果を日別に分解した結果、20251111（11月11日=日ゾロ目+台末尾ゾロ目の三重ゾロ目）が+2626で全体を支配していた。2026年は6回中5回がマイナス（最悪は20260611の-801）。「少数台依存」ではなく「少数日依存+トレンド変化」が正確な分類。

## アクション
- DD11ゾロ目効果を台選びフローや推薦に使わないこと
- 11/11（三重ゾロ目）は別枠の特殊日として扱う可能性はあるが、n=1なので検証不能
- DD11の全体平均は依然ゾロ目>非ゾロ目（+224）だが、これは2025年後半の残響であり2026年では効いていない

## 例
DD11ゾロ目日別: 20251111=+2626, 20251011=+858, 20260211=+520 vs 20260611=-801, 20250811=-500, 20260111=-278

