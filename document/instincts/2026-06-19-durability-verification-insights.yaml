# 角番中間台優位はtop1寄与率0.7%の完全構造シグナル

## 背景
台固有性定量化で角番中間台優位（C3）のtop1_machine_share=0.7%, top2_machine_share=1.4%であり、6法則中圧倒的に低い。特定台への依存がゼロに近い。かつ3テストすべてで堅牢。前半+130.1、後半+93.1で効果量は縮小しているが方向は一貫。

## アクション
- 角番は蒲田7で最も信頼できる変数として第一優先で使い続けること
- ただし「中間台」は角3〜角N-2の広いバケツなので、実用上の細分化が次の課題
- 細分化の方向: セグメント別の角番ピーク位置特定、DD×角番交互作用の精密化、島サイズ正規化

