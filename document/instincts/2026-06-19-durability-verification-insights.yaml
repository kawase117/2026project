# 2F全域はstability_rate=0% — 機種入替で法則が崩壊しやすい構造

## 背景
機種入替台帳（kamata7_regime_change_ledger）の結果、2Fの全セクション（2001-2351）はstability_rate=0%（全台が少なくとも1回機種入替）。一方、3F A機エリア（3001-3362の大半）はstability_rate=100%で全期間機種固定。

## アクション
- 2Fの法則（特に末尾効果）は機種入替レジームに対して本質的に脆い前提で扱うこと
- 2F_L_N d6最強が「脆弱」判定になったのはこの構造が原因
- 3F A機の法則が安定する構造的理由（機種固定）を理論書に明記すべき
- 今後2Fで新たな法則を主張する際は、レジーム分割テストを必須にすること

## 例
Section stability: 3001-3016=100%, 3117-3130=100%, ..., 2001-2010=0%, 2011-2022=0%, 2F全滅

