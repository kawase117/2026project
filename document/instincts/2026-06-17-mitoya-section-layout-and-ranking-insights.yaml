# 「複雑な計算抜きに計算できるはず」はBashで今すぐ実行せよのシグナル。計画書を書かない

## 背景
section単位のX_DDS lift集計は本質的に以下で完結する:
```python
df.groupby(['section','date','is_xdds'])['payout'].mean()
→ .groupby(['section','is_xdds']).agg(['mean','count'])
→ lift = xdds_mean - non_xdds_mean
```
にもかかわらず、計画書作成→Codex実装→修正指示書→再実装 という多段階を経て
ユーザーを長時間待たせた。groupby+mean+diff の3ステップで完結する計算に計画書は不要。

## アクション
- ユーザーが「複雑な計算抜きに」「一列毎に計算できるはず」と言ったら
  Bashツールで直接SQLまたはPythonを実行して結果を見せる
- 計画書(docs/superpowers/plans/)やCodexへの指示書はMLパイプライン・統計検定など
  実装が複雑な場合のみ使用する
- groupby集計・pivot・単純な差分計算 → 即座にBashで実行
