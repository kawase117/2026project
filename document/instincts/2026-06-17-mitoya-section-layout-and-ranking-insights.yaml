# みとやの `section` 列 = 島(Island)そのものの名前。section×y への分割は誤り

## 背景
`Heatmap/mitoya_omorimachi_floor_coordinates.csv` の `section` 列が分析単位の正解。
各 section は物理的な1島を表す。島内部のY値は行番号であり、section×yに分割すると
「島の片面」または「バラエティ台の縦ペア2台」になってしまう。

みとやの section 一覧:
| section | Y値      | 台数 | 備考 |
|---------|----------|------|------|
| 501-522 | 36のみ   | 22台 | 片面島 |
| 523-556 | 32,33    | 34台 | 両面島 |
| 557-590 | 28,29    | 34台 | 両面島 |
| 591-623 | 24,25    | 33台 | 両面島 |
| 624-657 | 20,21    | 34台 | 両面島 |
| 658-691 | 16,17    | 34台 | 両面島 |
| 692-711 | 3-13     | 20台 | バラエティ(X=1,4の2列) |
| 712-733 | 3-13     | 22台 | バラエティ(X=8,11の2列) |
| 734-755 | 3-13     | 22台 | バラエティ(X=15,18の2列) |
| 805-815 | 1のみ    | 11台 | 片面島 |

## アクション
- section をそのままgroupbyキーとして使用する
- section×y, section×x への分割は「島の内部構造」を見る特定の分析のみで使用
- バラエティ島(Y値が11個ある692-711等)はsection×yで分析不能(1グループ2台になる)
- フロアレイアウトの正規情報源: `Heatmap/mitoya_omorimachi_floor_coordinates.csv`

## 例
```python
# 正しい: section単位で集計
day_sec = df.groupby(['section', 'date', 'is_xdds'])['payout'].mean().reset_index()

# 誤り: バラエティ島で破綻する
df["row_key"] = df["section"] + "_y" + df["y"].astype(str)
```

