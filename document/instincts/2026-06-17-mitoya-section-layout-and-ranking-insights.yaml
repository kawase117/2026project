# 692-711_y5 が non_xdds_mean=169% という異常値を持ちセクション平均を汚染。セクション単位では正常(rank 5, +2.22%)

## 背景
section×y単位ランキングで 692-711_y5 の集計結果:
- xdds_mean=93.47%, non_xdds_mean=169.08%, lift=-75.61

non_xdds_mean=169%はパチスロとして物理的にあり得ない水準。
Branch A で 692-711 セクション全体が「逆方向 -6.2%」と判定された原因はこの異常値が
セクション平均を押し下げていたため。

section単位での正規集計では692-711はrank 5 (lift=+2.22%, xdds_mean=100.14%)で正常。

## アクション
- 692-711 を「X_DDS日に不利なセクション」として除外するのは誤り
- 疑わしい台: 692-711_y5 に含まれる機番(694, 709)の特定期間の稼働記録を確認
- section×y単位の分析で極端な外れ値が出た場合は異常データの有無を先に確認すること

