# Section別X_DDSランキング: 501-522(+4.0%)が首位。557-590・591-623が上位で安定

## 背景
section単位でX_DDS日 vs 通常日の平均payout差を集計した結果。
期間: 2025-01-01〜2026-06-11, MIN_GAMES=500, n_xdds=104, n_non_xdds=421(全section共通)。

| rank | section | xdds_mean | non_xdds_mean | lift  |
|------|---------|-----------|---------------|-------|
| 1    | 501-522 | 103.14%   | 99.12%        | +4.02 |
| 2    | 591-623 | 100.91%   | 97.41%        | +3.49 |
| 3    | 557-590 | 102.84%   | 99.51%        | +3.32 |
| 4    | 523-556 | 100.94%   | 98.43%        | +2.51 |
| 5    | 692-711 | 100.14%   | 97.92%        | +2.22 |
| 6    | 658-691 | 99.32%    | 97.27%        | +2.05 |
| 7    | 624-657 | 98.86%    | 96.93%        | +1.93 |
| 8    | 734-755 | 98.86%    | 96.97%        | +1.89 |
| 9    | 712-733 | 98.75%    | 96.97%        | +1.78 |
| 10   | 805-815 | 98.09%    | 97.16%        | +0.94 |

## アクション
- X_DDS日の第1候補: 501-522 (xdds=103.14%, 期待値プラス)
- 第2候補: 557-590 (xdds=102.84%, Branch A split-half stable確認済み)
- 第3候補: 591-623 (xdds=100.91%, Branch A split-half stable確認済み)
- 501-522はBranch A分析の対象外だったため split-half 安定性未検証。次回優先検証。
- xdds_mean ≥ 100% = 期待値プラスの基準。501-522/557-590/591-623/523-556/692-711が該当。
- 658-691以下はxdds_mean < 100%のため、X_DDS日でも期待値マイナス。

