# ボーナス確率を設定判定に使ってよいかは、機種ごとの相関 r で決まる

## 背景
差枚は「出たか」を測る指標であって「設定が入っていたか」を測る指標ではない。
だから機種のボーナス確率を**その機種自身の直近N日**と比べる2標本比率検定を併走させる
（`python -m backtest.bonus_rate <hall> --date YYYYMMDD`）。ここまでは従来どおり正しい。

**しかしこの手法が有効な機種は限られる。** 2026-08-29 楽園蒲田のマギアレコードで、
現地の正解ラベル（2131 = 朝イチ456確定、店長カスタムのトロフィー示唆）と突き合わせたところ、
2131 の合成確率は **1/521 で12台中最下位**、最良の 2139（1/194.8）は差枚 -2,428 だった。
**ボーナス確率のランキングが正解と真逆を指した。**

判別基準は「AT機かノーマル機か」ではない。AT機の中にも有効な機種がある（邪神ちゃん・ToLOVEる等）。
また当初「`差枚/ボーナス回数` の符号」で分けようとしたが、この量は集計方法で符号が反転するため
使えない（ネオアイムで台日平均 -3 / 合計比 +9）。

## アクション
判定の前に、その機種の直近90日・2,000G以上の台日で
**`合成確率 = (bb_count+rb_count)/games_normalized` と `出率 = 1 + diff/(games*3)` のピアソン相関 r**
を計算し、ゲートする。

- **r > +0.3** → ボーナス確率を主指標にしてよい（自己ベースライン比較を実行）
- **r < -0.2** → ボーナス確率は無効〜逆効果。**出率と差枚分布**で判定する
- **中間(-0.2〜+0.3)** → 判定保留。両方を併記して断定しない

楽園蒲田 2026-06以降の実測 r:

- **有効(r>+0.3)**: ノーマル機全般（ネオアイム +0.890 / マイジャグV +0.919 / サンダーV +0.884 /
  不二子BT +0.978 / ハナビ +0.859）、AT機でも 戦国乙女5 +0.839 / エウレカ +0.758 /
  邪神ちゃん +0.850 / ToLOVEる +0.924 / ヴァルヴレイヴ2 +0.936
- **無効(r<-0.2)**: マギレコ -0.543 / 東京喰種 -0.585 / バンドリ -0.580 / 攻殻 -0.475 /
  海門カバネリ -0.352 / 真打吉宗 -0.348 / モンハンライズ -0.259
- **保留**: 北斗転生2 -0.076 / モンキーターンV -0.136 / 東リベ -0.002

## 例
2026-08-29 楽園蒲田で `bonus_rate` が p<0.05 を付けた3機種
（スーパーリオエース2 p=0.0003 / 邪神ちゃん p=0.0065 / ヴァルヴレイヴ2 p=0.048）は
**全て r>0 群**だった。指標が効く機種でだけ効いていた。

逆に当日の全台系1位・2位（東リベ score 8,202 / 攻殻 2,629）は
**ボーナス確率では平常時より悪い**（z=-1.36 / -1.28）。両機種とも一撃型で、
ボーナス確率を根拠にすれば「投入なし」と誤判定していた。

