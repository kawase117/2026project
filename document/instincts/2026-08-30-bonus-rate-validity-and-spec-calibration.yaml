# スペック表は登録前に実測と照合する。定義がズレていると全台が設定1になる

## 背景
公表スペックの「初当たり確率」と、ana-slo の `bb_count` / `rb_count` が数えている事象は
**同じとは限らない**。CZ経由・直撃・引き戻しのどれが計上されるかが機種ごとに違う。

2026-08-30、戦国乙女5のスペック（AT初当たり 設定1 1/359.5 … 設定6 1/262.9、出玉率 97.9〜114.9%）を
受け取ってそのまま当てはめたところ、**実測が設定1より33%重かった**
（全期間1,566台日・835万Gで 1/477.8）。同期間の出率は 99.88% で設定2〜3相当なのに、
初当たりだけ設定1を下回る。835万Gでこのズレは偶然では起きない。

このまま登録すると**全台が常に設定1と判定される壊れた推定器**になる。
実際 8/29 の22台プールで設定1の尤度 84.0%・高低尤度比 0.00倍という出力を確認した。

## アクション
スペック表を登録する前に、必ずこの照合を行う。

1. その機種の全期間実測 `sum(games)/sum(bb+rb)` を出す
2. スペックの設定1と設定6の範囲に収まるか見る
3. 同時に実測の**出率**も出し、スペックの出玉率のどのあたりかを見る
4. **初当たりと出率が別々の設定を指したら定義ズレ**。そのまま登録しない

ズレていた場合の選択肢は2つ。

- **登録を見送り、台どうしの相対比較だけに使う**（同じズレが全台に等しくかかるため順位は有効）
- **ホール自身の平常時を設定1に対応させて較正**し、スペックの設定間比率だけを使う
  （戦国乙女5なら 1/477.8 を設定1とし、1→6で1.368倍のレンジを張る）。
  この場合は**「較正済みの近似値でメーカー公表値ではない」と必ず明記する**

## 例
戦国乙女5 8/29 の22台は、絶対値では全台が設定1判定になるが、
相対順位は使える: 2225 が初当たり 1/259.9（ホール平常時 1/477.8 の 1.84倍）・差枚 +7,524・
出率 129.2% で22台中1位。一方 2228 は差枚 +11,096・出率 148.6% と最高だが
初当たりは 1/345.9 止まりで、**一撃で伸ばした台**。設定の証拠としては 2225 のほうが強い。

`JUGGLER_FAMILY_SPECS` は14ファミリーしか収録が無く、ハナハナ系・沖ドキ系・
ディスクアップ・パルサー系・不二子BT・クランキークレストが未登録。
埋める価値はあるが、1機種ずつこの照合を通すこと。
