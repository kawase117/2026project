# is_weekendは date.weekday()>=5 の完全決定式——「ほぼ0/100%」ではなく厳密に0/100%

## 背景
`database/date_info_calculator.py`の`_check_weekend()`は`date_obj.weekday() >= 5`という日付から一意に決まる計算式。曜日別のis_weekend平均を取ると月〜金は必ず厳密に0%、土日は必ず厳密に100%になる（祝日等の他要因は混入しない）。「ほぼ」という曖昧な表現を使ったことをユーザーに指摘され訂正した。

## アクション
- 決定的な計算式から派生したフラグの曜日別カバレッジ率を説明するときは「ほぼ」等の曖昧語を使わず、厳密に0/100%であることを明記する
- 「novel」ラベルは「is_weekendという既存フラグで説明できない曜日」という分類であり、月曜=novelは「既存の枠組みでは捉えられない独立した発見」という意味

## 例
言葉を濁さず「is_weekendはdate.weekday()>=5という決定式なので、月〜金は必ず0%、土日は必ず100%」と言い切ること。

