# 「一致率」は常に「residualがプラスだった機種の割合」を指す固定定義

## 背景
`eda/machine_weekday_cross_agreement_scan.py`の`agreement_rate = n_positive / n_machines`は、mean_residualの符号に関わらず常に「プラス方向に動いた機種の割合」を意味する固定定義。「多数派がどちらに一致したか」という可変の意味だと誤解しやすい。楽園の日曜「一致率31%」を「70%がプラス」と誤読しかけた実例あり。

## アクション
- 一致率がX%と報告されている場合、常に「プラスの機種がX%、残り(100-X)%がマイナスまたはゼロ」と読む
- mean_residualがマイナスの曜日/DDでは、一致率が低いほど「多数派がマイナスに強く偏っている」ことを意味する（一致率と多数派の方向は独立に確認する必要がある）
- 同様の分析（DD版cross_agreement_scan等）でも同じ定義が使われているはずなので、他ホール・他軸の分析でも同じ注意が必要

## 例
日一致率31%, mean_residual=-1.49pp → 「プラスの機種は31%だけ、69%がマイナスかゼロ」が正しい読み方。

