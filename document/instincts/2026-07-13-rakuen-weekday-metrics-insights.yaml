# 差枚の単位は「枚」であり「円」ではない

## 背景
`document/rakuen_theory.md`全体で`diff_coins_normalized`由来の数値を「円」と誤記していた（約45箇所）。ユーザー指摘を受けて文書全体を「枚」に一括修正した。

## アクション
- `diff_coins_normalized`・`avg_diff`・`excess_diff`・`diff_excess`等、差枚由来の数値は必ず「枚」単位で記述する
- 新規に差枚の数値を書く前に、単位が「円」になっていないか確認する（他ホールのtheory.mdでも同様のミスがないか横展開で確認する価値がある）

## 例
「+42.6枚/台」であり「+42.6円/台」ではない。

