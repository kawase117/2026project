# 土日は設定不問の客の増加で回転数が底上げされ、差枚の解釈が歪みうる——機械割との併読で検証する

## 背景
ユーザー指摘: 土日は高設定狙いの客だけでなく設定関係なく遊技する客も増えるため、回転数が他の曜日より増加し、低設定の台も回され続ける。差枚は回転数の影響を受ける指標のため、この交絡が混入しうる。実データ検証（楽園）: 土曜平均回転数3,790・日曜3,576 vs 平日2,100〜2,540——土日は平日比+40〜70%の回転数増加を確認。

## アクション
- 差枚だけで曜日/日タイプ別の傾向を語らず、回転数に依存しにくい機械割(hit104率)との併読を必須にする
- 機械割と差枚が同じ方向で一致していれば、回転数交絡だけでは説明できない本物のシグナルと判断できる（楽園の月曜・日曜はこのパターンで両方が一致）
- 一方の指標のみ有意（例: 楽園土曜は機械割非有意・差枚のみ弱マイナス）の場合は、証拠が弱いと明示し、他の曜日と同列に扱わない
- 曜日別平均回転数の確認は`games_normalized`をgroupby weekdayするだけの軽量な検証で実施可能

## 例
楽園の「土日に絞って月曜に出す」という特徴は、機械割・差枚の両指標が一致して支持しているため頑健と判定した（土曜単体は機械割非有意のため確度を落として扱う）。
