# 「広さ×深さ」フレーム: 機械割(hit104)=広さ、差枚(pooled)=深さ

## 背景
ユーザー提案の分析フレーム。機械割の一致率（機種ごとの自己平均比較、%表示）は「何%の機種が動いたか」という広さの指標、差枚のpooled比較（ホール全体プールの平均レベル比較、枚表示）は「平均してどれだけ動いたか」という深さの指標。この2軸を組み合わせることで「広く浅い投入(例: 設定4を広く)」と「狭く深い投入(例: 設定6を狭く)」を区別できる。

## アクション
- 曜日/DD別のパターンを報告する際は、hit104一致率(広さ)とpooled_diff(深さ)の両方を提示し、単独の指標で「投入パターン」を断定しない
- 広さ・深さが同じ方向に動く（広い日はプラスも大きい）場合と、逆行する（一致率は低いのに一部だけ突出してプラス＝狭く深い）場合を区別して報告する
- 楽園の曜日軸では「狭く深いプラス」パターンは観測されなかった（広さ・深さが概ね同方向）。DD軸・イベント日軸の方がこのパターンが出やすい可能性があり、今後の検証候補

## 例
楽園月曜: 広さ60%(広い)×深さ+29.2枚(穏やか)＝広く浅い投入。楽園日曜: 広さ31%(狭い=69%マイナス)×深さ-73.1枚(大きい)＝広く深い抑制。

