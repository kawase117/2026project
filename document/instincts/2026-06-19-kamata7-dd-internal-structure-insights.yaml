# イベント日はA機（ジャグラー/ハナハナ）に高設定が集中投入される

## 背景
蒲田7の全イベントDD(1,7,11,17,22,27,30,31)で、セグメント別にイベント効果を測定。
A機（ジャグ/ハナハナ）: イベント差分 diff=+122, plus=+5.9pp, hit104=+2.3pp
N機（AT系）: イベント差分 diff=+30, plus=+2.3pp, hit104=+1.5pp
A機のイベント効果はN機の約4倍。

## アクション
蒲田7のイベント日はA機を優先的に選択する。
N機はイベント日でも非イベント日と大差ない恩恵しかない。

## 例
Section 6 segment: A event_avg_diff=308 vs non_event=186 (差=+122)
                    N event_avg_diff=198 vs non_event=168 (差=+30)

