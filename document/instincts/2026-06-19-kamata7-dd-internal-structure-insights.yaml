# 日ゾロ目（DDmod10==台末尾）投入パターンは蒲田7に存在しない

## 背景
DDの下一桁と台番号末尾が一致する台に高設定を入れるパターンを検証。
全体: 一致台 diff=+179 vs 不一致台 diff=+187（一致台のほうが弱い）
イベント日限定: 一致台 diff=+221 vs 不一致台 diff=+228（同様）
dd_mod10別に分解しても体系的パターンなし（mod10=0で一致台が-211の大差で敗北）。

## アクション
「今日は7日だから末尾7が強い」という発想は蒲田7では成立しない。
台番号末尾の選択はDD下一桁と独立に判断すべき。
他ホールでは別の結果になる可能性があるため、ホール別に検証が必要。

## 例
mod10=0: 一致 diff=+35 vs 不一致 diff=+246 (差=-211)
mod10=7: 一致 diff=+255 vs 不一致 diff=+231 (差=+24, 小さい)
mod10=9: 一致 diff=+230 vs 不一致 diff=+126 (差=+104, mod10=9だけ強いが単発)
