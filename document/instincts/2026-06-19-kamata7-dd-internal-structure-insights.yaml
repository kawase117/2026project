# イベント日は角2が最も恩恵を受ける（角1より上）

## 背景
角番ポジション別イベント効果:
角2: diff差分=+95, plus=+4.6pp（最強）
角1: diff差分=+62, plus=+3.9pp
中間: diff差分=+54, plus=+3.1pp
角N-1: diff差分=+31
角N: diff差分=+38
角1は「明らかに角」で客に特定されやすい。角2は見えにくいが角のポジション。
通常時ベースラインは角1=43, 角N=20 vs 中間=219で角端は著しく弱い。

## アクション
イベント日に角を狙うなら角2。角1はイベント効果あるが通常時が弱すぎる。
ただしDD30は全角番がプラス乖離で全面投入パターン。

## 例
角2 baseline=192 → event=264 (+95)
角1 baseline=43 → event=89 (+62)
DD30: 角N-1 dev=+250(全データ最強), 角1 dev=+287

