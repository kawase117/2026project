# DD30は全面投入パターン（角番/末尾/セグメント問わず全体強い）

## 背景
DD30は近隣店舗との合同イベントのため、ホールが弱くできない構造的理由がある。
DD×曜日マトリクスでも全曜日プラス乖離(avg_dev=+141)で唯一の全曜日安定イベントDD。
DD×角番でも全ポジションがプラス乖離:
角1=+287, 角2=+241, 中間=+118, 角N-1=+250, 角N=+233
セグメント: A=+234, N=+129（両方プラス）

## アクション
DD30は「どこを打っても恩恵がある」日。セグメント/角番/末尾の選択精度より「DD30に行くこと自体」が重要。
A機×角2がベストだが、他の選択でも十分なプラス効果がある。

## 例
DD30 segment A: avg_diff=450 (baseline 216, dev=+234)
DD30 角N-1: plus_rate_dev=+10.6pp（全データ中最強クラス）

