# 土曜のイベント日は逆効果（ホールが投資しない）

## 背景
DD×曜日の交互作用マトリクスとイベントvs非イベント曜日別集約から:
木曜: イベント差分 diff=+183, plus=+6.7pp（最強）
日曜: diff=+105, plus=+4.2pp
金曜: diff=+95, plus=+3.9pp
水曜: diff=+82, plus=+3.1pp
土曜: diff=-102, plus=+0.1pp（逆効果）
月曜: diff=-25（効果なし）
「イベント日の効果はホールが客を呼ぶ必要性に比例する」仮説と整合。
土曜は黙っていても客が来るので投資不要。

## アクション
蒲田7では土曜のイベントDD（特にDD22,DD31）は避ける。
木曜のイベントDD（DD17,DD27,DD30等）を最優先で狙う。
DD30は曜日不問で安定（合同イベントのため）。

## 例
DD22土曜: dev=-490（全データ中ワースト2位）
DD31土曜: dev=-568（全データ中ワースト1位）
DD17木曜: dev=+417
DD30土曜: dev=+296（DD30は土曜でもプラス）

