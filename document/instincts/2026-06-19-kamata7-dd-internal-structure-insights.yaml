# 末尾7はイベント日でベースラインからの乖離が最大（+113）

## 背景
末尾7は非イベント日では下位（8位/diff=+157）だが、イベント日に+113ジャンプで1位(+270)に浮上。
「7のつく日」交絡を検証済み:
- 7のつく日(DD07,17,27): 末尾7は4位（末尾8=+346が1位）
- 7なしイベント日(DD01,11,22,30,31): 末尾7が1位(+280)だが末尾2とほぼ同値(+279)
DDの下一桁と台番号末尾の相関（日ゾロ目効果）は蒲田7には存在しない（全体で一致台+179 < 不一致台+187）。
ただし絶対値の差は小さく、セグメントや角番ほどの戦略的重みはない。

## アクション
末尾選択の優先度はA機>角2>>>末尾（参考程度）。
末尾を気にするなら7を選び、5は避ける（末尾5はイベント日に唯一沈む: 非イベ+190→イベ+137で-53）。

## 例
非イベ→イベ乖離ランキング:
末尾7: +157→+270 (+113) 最大
末尾3: +104→+202 (+98)
末尾5: +190→+137 (-53) 唯一マイナス

