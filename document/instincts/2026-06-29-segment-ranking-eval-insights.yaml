# セグメント別評価：compositeとhist_metricの最適戦略はセグメントで異なる

## 背景
60日walk-forwardでセグメントごとにcomposite Top10とhist_metric Top10の的中率（104%超え）をベースラインと比較した。
統計的に有意な差があるのは3F_L_Nのみ（hist_only +8.8pp, Wilcoxon p=0.002）。
他5セグメントではcompositeとhist_metricに有意差なし。

## アクション
- 3F_L_N: hist_metricで順位付けすべき（compositeはベースライン以下で害を与える）
- 3F_L_A, 3F_R_A, 3F_R_N: compositeがやや優位だが有意差なし。どちらでも可
- 2F_R_N: hist_metricがやや優位（+3.0pp）だが有意差なし（p=0.32）
- 2F_L_N: 両者同等（差0.2pp）
- 「全セグメントでhist_only」は3F_R_NのTop10で差枚を大きく失う（comp +330 vs hist -12）

## 例
Top10 hit率（60日平均、ベースライン比較）:
  3F_L_N: base=32.0%, comp=29.8%(-2.1pp), hist=38.7%(+6.7pp) → hist *** p=0.002
  2F_R_N: base=32.9%, comp=34.0%(+1.1pp), hist=37.0%(+4.1pp) → hist ns p=0.32
  3F_R_N: base=33.1%, comp=36.5%(+3.4pp), hist=32.5%(-0.6pp) → comp ns p=0.10
  3F_L_A: base=27.5%, comp=30.0%(+2.5pp), hist=28.7%(+1.1pp) → comp ns p=0.82
  3F_R_A: base=26.1%, comp=28.0%(+1.9pp), hist=26.3%(+0.3pp) → comp ns p=0.44
  2F_L_N: base=31.9%, comp=33.7%(+1.7pp), hist=33.5%(+1.6pp) → 同等 ns p=0.89

