# hist_metric単体がcomposite全体より高い予測性能を持つ

## 背景
60日walk-forwardでhist_metric単体ランキングとcompositeランキングを比較:
- hist_only Top50: hit率35.4% (Spearman rho=+0.038, p<0.0001)
- composite Top50: hit率32.1% (Spearman rho=-0.001, p=0.80)
6コンポーネント（c1-c6）を加重合計することで、hist_metricの信号が破壊される。
hist+c2のブレンドでもrhoが+0.025に低下し、c2の追加すら劣化要因。
hist_heavy_80（hist 80% + composite 20%）でもrho=+0.005に低下。

## アクション
- compositeスコアよりhist_metric単体のランキングを優先する
- c1-c6のブレンドはhist_metricの信号を薄めるだけなので、混ぜない
- 例外: 3F_L_A・3F_R_A・3F_R_NではcompositeがTop10で優位だが有意差なし
- モデル改善は「compositeの重みチューニング」ではなく「hist_metricの改善」に集中すべき

## 例
Top50 hit率比較 (60日walk-forward):
  hist_only:     35.4% (rho=+0.038 ***)
  composite:     32.1% (rho=-0.001 ns)
  hist+c2:       32.5% (rho=+0.025 ***)  ← c2追加で劣化
  hist_heavy_80: 33.6% (rho=+0.005 ns)   ← 20%混入で信号消失

