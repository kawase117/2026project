# 3F_L_Nではcompositeスコアがベースライン以下で有害

## 背景
3F_L_NのcompositeスコアTop10のhit率は29.8%で、ベースライン32.0%より低い（-2.1pp）。
一方hist_metric Top10は38.7%でベースラインを+6.7pp上回る。
Wilcoxon検定でhist-comp差は+8.8pp, p=0.002（有意）。
差枚でもcomp=-10/台に対しhist=+116/台と大きな差がある。
compositeのc1-c6がこのセグメントで反予測的に作用している。

## アクション
- 3F_L_Nでは必ずhist_metricで順位付けする
- compositeスコアを3F_L_Nに適用してはならない
- predict_gated.pyの--segment-rankingモードではSEGMENT_RANKING_DEFAULT="hist_metric"でこれを実現済み

## 例
3F_L_N Top10 (60日walk-forward):
  composite:   hit=29.8% (base以下), diff=-10/台
  hist_metric: hit=38.7% (+6.7pp),   diff=+116/台
  Wilcoxon p=0.002 **

