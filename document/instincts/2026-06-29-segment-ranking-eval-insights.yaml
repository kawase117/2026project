# セグメント別予測の評価はセグメント別に行わなければならない

## 背景
セグメント別ランキング（各セグメントTop10を合計60台）をグローバルTop60と比較して「劣る」と誤って結論しかけた。
問題は、セグメント別に予測を出しているのに、評価を全セグメントまとめて行ったこと。
セグメント別に評価すると、3F_L_Nでは+6.7ppの有意な改善が見える。
グローバル評価は弱いセグメント（3F_R_A 26.3%）の枠割り当てによる平均低下を「戦略の失敗」と見なしてしまう。

## アクション
- セグメント別モデルの評価は必ずセグメント別に行う
- グローバル指標（全体hit率）は、セグメント別戦略の評価には不適切
- 各セグメントのベースライン（セグメント内ランダム選択のhit率）との差で評価する
- セグメント間のhit率の違いは戦略の良し悪しではなく、セグメントの性質の違い

## 例
seg_rank_10（60台）をhist_top60（60台）とグローバル比較:
  → seg 33.0% vs hist 35.1%, Wilcoxon p=0.005 → 「seg_rankが劣る」
しかしセグメント別に見ると:
  → 3F_L_N: hist Top10 = 38.7% vs base 32.0% (+6.7pp, p=0.002)
  → 3F_R_A: comp Top10 = 28.0% vs base 26.1% (+1.9pp)
グローバル比較は3F_R_Aの低base率が全体を引き下げているだけ
