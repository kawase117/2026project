# 蒲田1は火曜日に端番へ設定投入するが、対象の端番は週ごとに変動する(蒲田七の月曜パラドックスと同型)

## 背景
ユーザーより、2026-07-14(火曜)の実際の設定投入先は端番10と1だったという情報提供があった。
これは「火曜日イベントで端番に設定を入れる」という構造的な運用方針の一環だが、
「具体的にどの端番が選ばれるか」は週によって変動するとのこと。
検証のため2110-2120セクションを火曜日全78日でプールして端番別平均を見たところ、
端番10はむしろ最弱クラス(mean=-338.8, win=30.6%)、端番1は中程度(mean=+419.4, win=43.3%)と、
「10番が強い」という傾向は平均では全く見えなかった。
これはmonday-paradox-broad-investment(蒲田七・月曜日は複数末尾に分散投資するため
「特定1末尾がベスト」とはシグナルで特定できない)と同型の構造: 投入先の端番が毎週ローテーションするため、
「端番Xの平均diffが高いか」というプール集計テストはこの種のパターンを原理的に検出できない。

## アクション
```python
# 曜日ベースの端番/角番投入ローテーションを検証したいとき
if hypothesis == "曜日Xに端番/角番へ設定投入(対象はローテーション)":
    # NG: 対象曜日でプールした「端番別平均diff」を見て強い端番を探す
    #     → 対象がローテーションする場合、平均では必ず薄まって見えなくなる(月曜パラドックスと同型)
    # OK: 個々の対象日ごとに「その日のセクション内で突出して強い端番はどこか」という
    #     day-level外れ値検出を行い、日によって突出先が変わるかどうかを見る
    action = "曜日ローテーション型の投入パターンは、プール平均ではなくdayごとの外れ値検出で検証する"
```

## 例
```
2026-07-14(火曜)の2110-2120セクション: 端番10と1が事前投入先だったとユーザーから情報提供。
火曜日全78日プール平均: 端番10=-338.8(最弱クラス), 端番1=+419.4(中程度)
→ プール平均では今回投入されたはずの端番10がむしろ最弱に見える
→ 「投入先がローテーションする」仮説と整合(月曜パラドックスと同型構造)
→ 次回検証時はday-level外れ値検出ロジックで再アプローチする(このセッションでは未実施、次回に持ち越し)
```
