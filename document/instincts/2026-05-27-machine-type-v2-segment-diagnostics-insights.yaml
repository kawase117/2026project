# λ=0.5 は過学習の逆：tune では低く holdout では高い最適点

## 背景

combined_lambda パラメータ選択で以下を観測：

| λ | tune hit@1 | holdout hit@1 |
|---|-----------|--------------|
| 0.0 | 0.633 | 0.389 |
| 0.5 | 0.600 | **0.422** |

通常の過学習では tune > holdout となる。ここでは逆：tune では λ=0.0 が優れているが holdout では λ=0.5 が 0.422 に達して目標 0.40 を超える。

## アクション

λ=0.5 を本番設定として採用する。

この挙動パターンは「λ=0.5 の方が汎化性能が高い」ことを示唆。tune スコアを多少犠牲にしても holdout で堅牢に 0.42+ を維持する設定を選ぶべき。

## 例

```python
# 通常の過学習：tune > holdout（悪い兆候）
# tune_λ0 = 0.70, holdout_λ0 = 0.60

# 今回の 2F_A 診断（逆パターン）
# tune_λ0 = 0.633, holdout_λ0 = 0.389  (tune 高いが一般化しない)
# tune_λ05 = 0.600, holdout_λ05 = 0.422 (tune 低いが holdout 良好)

# λ=0.5 の方が正則化が効いており汎化性能が良い
```

