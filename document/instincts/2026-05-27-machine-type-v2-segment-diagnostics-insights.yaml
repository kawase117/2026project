# セグメント機種数の違いが学習難易度を支配する

## 背景

3F_A（16 台）と 2F_A（10 台）の Layer 1 モデルを比較したところ、同じ TOP3 特徴量を使用しているにもかかわらず精度が大きく異なることが判明した。

原因は特徴量ではなく、**セグメントあたりの機種数**の違いである。

- **2F_A：10 台**
  - is_top3 理論値 = 3/10 = 30%
  - 実測 base_rate = 57.4%（非常に高い）
  - 理由：10 台以下の日が多く、3 台のほぼすべてが top3 に入る

- **3F_A：16 台**
  - is_top3 理論値 = 3/16 = 18.8%
  - is_top3 base_rate = 22.3%（理論に近い）
  - 機種数が多いため top3 に入らない台が多く識別タスクが充実

## アクション

同じ特徴量でセグメント間に精度差がある場合、まず**機種数（母数）**を確認する。

2F_A の精度改善を目指す場合は以下を検討：
- `--min-machine-history-days` を 30 → 20 に緩める
- 機種数を 10 → 12-14 に増やす
- learning task の識別難度が上がり学習が安定する可能性

## 例

```python
# セグメント A：10 機種、base_rate 57%
# → 「外れ台 7 つを探す」という簡単な逆向きタスク

# セグメント B：16 機種、base_rate 23%
# → 「高設定 3 つを正確に選ぶ」という難しく充実したタスク

# 同じ特徴量でも母数が違うと学習難度が大きく異なる
```

