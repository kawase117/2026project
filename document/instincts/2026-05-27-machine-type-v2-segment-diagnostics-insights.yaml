# 2F_A ランダム性検定：検出力不足の陥阱

## 背景

2F_A セグメント（A型機種）の順位予測可能性をマン・ホイットニー検定で評価したところ p=0.284（有意差なし）という結果を得た。
しかし同時に ML の lift@1 = 1.256（ランダムより 25% 良い命中率）を観測した。

これは一見矛盾している。正しい解釈は「検定の検出力不足」である。

評価期間 90 日間で、2F_A の平均機種数は 7.57 台。この条件下では 681 サンプルという限定的なサイズでマン・ホイットニー検定は本当の効果を検出できない（Type II エラー）。

## アクション

「マン・ホイットニー検定 p > 0.05 だから 2F_A はランダム」という結論は間違い。

正確な判定：
- **「ランダムである」ではなく「判定できない」**
- lift@1 = 1.256 は信号の存在を示唆
- 2F_A を**除外すべきではない**。弱い予測能があると仮定して継続評価

## 例

```python
# 検定 p値が大きい = 「帰無仮説が正しい」ではなく「検出力が不足」の可能性
# lift@1 = 1.256 = 実際には信号がある

n_samples = 7.57 * 90  # ≈ 681
effect_size = 0.256    # 25% 改善
# statistical_power ≈ 0.40-0.50
# つまり本当の効果があっても見落とす確率が 50% 以上
```

