# 「1/2で勝つ日が多い」は日数を数えるだけでは配分の証拠にならない

## 背景
2026-08-19 楽園蒲田で、異世界かるてっと・クレア・SHAKE（いずれも2台設置）が「また1/2で
大きくカッている」と指摘された。日次の勝敗・差枚では異世界かるてっとの台2165のみ弱い
方向性（p=0.25、非有意）が見えたが、ユーザーはこれを「特定の台が勝つ」ではなく
「2台のうち1台に高確率でニブイチ投入する」という配分メカニズムの主張に修正した。
閾値+1,500枚で「大きく勝った」を定義し、2台のうちちょうど1台だけが到達する頻度を、
各台の個別到達率から計算した独立試行の期待値（p_a(1-p_b)+(1-p_a)p_b）と二項検定で
比較したところ、3機種とも p=0.83〜0.87 で観測は独立仮定と完全に整合し、意図的な
1台限定配分を示す偏りは見つからなかった。一方、個別到達率を直近14日とそれ以前で
比較すると、複数の台で上昇していた（例: SHAKE台2170は11.8%→28.6%）。

## Core claim
「2台のうちちょうど1台だけが大きく勝つ日」の頻度を単純に日数で数えて増減を語っては
いけない。各台の個別到達率から独立試行の期待joint頻度を計算し、観測がそれを有意に
上回るかを二項検定で確認する必要がある。「ニブイチが増えた」という体感は、(a)意図的な
1台限定配分と(b)両台への投入量が単純に全体的に増えたことの、どちらからも生じうるが、
日数を数えるだけでは区別できない。

## Evidence
- n_observations: 3機種×48日（20260701-20260819）
- data scope: single-hall, cross-machine
- metric scope: diff / binomial test
- result summary: 「ちょうど1台到達」頻度は独立仮定に対しp=0.83〜0.87で有意差なし。
  個別到達率は複数台で直近上昇（SHAKE台2170: 11.8%→28.6%）

## Interpretation
- 今回の検定は(a)意図的配分を支持せず、(b)投入量全体の増加を支持する結果だった
- 「両方同時に大きく勝つ」頻度が独立仮定より抑制されている（排他的配分の兆候）かどうかも
  同時に確認したが、こちらも独立仮定と整合しており、抑制の証拠はなかった
- n=48日・直近サブセットは14日とサンプルが小さく、今後データが増えたら再検証が必要

## Action
- 「1/2で勝つ日が多い」という指摘を受けたら、まず各台の個別閾値超え率を算出し、
  独立仮定でのjoint頻度 p_a(1-p_b)+(1-p_a)p_b を計算、観測との二項検定を行う
- 有意差が無ければ「意図的配分の証拠なし」と明記したうえで、個別到達率の時系列変化
  （直近 vs それ以前）を別途確認し、「投入量全体の増加」の可能性を提示する
- 「両方同時到達」の頻度が独立仮定より少ないかも併せて確認する（排他的配分ならここが
  抑制されるはず）

