# 楽園蒲田：末尾ブロックの中に停止台があると、隣まで塊がずれて見えることがある（未検証・n=1）

## Core claim
連続する末尾グループ（例: 末尾7-8-9-0）の中で1台が稼働停止だった場合、その1台を
飛ばして隣の台までブロックが伸びているように見える観測が1件あった。停止台の
有無を確認せずに「並びが崩れている」と判断すると、実際には成立しているブロックを
見逃す可能性がある。

## Evidence
- n_observations: 1（2026-08-20、交響詩篇エウレカセブン HI-EVOLUTION、台番3217-3222）
- data scope: single-hall（楽園蒲田店）、site777速報値（累計差枚・BB確率、17時台収集）
- metric scope: diff（累計差枚）、BB確率（1/G数）
- result summary:
  | 台番 | 末尾 | 状態 | BB確率 | 差枚 |
  |---|---|---|---:|---:|
  | 3217 | 7 | 稼働(586G,母数不足) | 1/195.3 | 未取得 |
  | 3218 | 8 | 稼働 | 1/151.5 | +2,270 |
  | 3219 | 9 | 稼働 | 1/155.9 | +1,700 |
  | 3220 | 0 | **停止** | — | — |
  | 3221 | 1 | 稼働 | 1/160.3 | +530 |
  | 3222 | 2 | 稼働(524G,母数不足) | — | 未取得 |

  3218・3219・3221のBB確率が1/151.5, 1/155.9, 1/160.3とほぼ揃っており、
  停止台3220を飛ばした先の3221まで塊が連続しているように見える。

## Interpretation
- この1件だけでは、(1)停止台を避けて意図的に隣にずらす配置ルール、(2)単に島全体へ
  投入があり3220はたまたま停止していただけ、(3)3221が強いのはよくある頻度で
  隣接とは無関係、の3つを区別できない
- `2026-08-18-rakuen-nanatsuku-physical-neighbor-spillover`（末尾7の物理的隣接効果）
  とは別の現象として扱う。あちらは「予告が名指しした末尾の物理的な隣」、こちらは
  「連続ブロック中の停止台の隣」で、母集団の定義が異なる
- ユーザーの現場感覚（並びが崩れて見えたので座らなかった）と、後から見た数値
  （実際は隣まで塊が伸びていた可能性）が食い違った実例として記録する価値がある

## Action
- 次に楽園蒲田で全台系候補・末尾ブロックの中に停止台を見つけたら、停止台を挟んで
  反対側の隣接台も候補に含めて評価する（除外して終わらせない）
- 本格的な検証には、`database/migrate_machine_layout_history.py`が扱う台配置履歴と
  停止台記録（休止フラグ・長期0G）を突き合わせ、「候補ブロックに停止台を含む日」を
  過去分から洗い出し、隣接台の残差が非隣接台と比べて系統的に高いかを見る必要がある。
  `2026-08-18-rakuen-nanatsuku-physical-neighbor-spillover`と同じ枠組み
  （`backtest/neighbor_effect.py`相当）を「隣接理由＝停止台」に変えて流用できる
- n=1なので、この仮説を根拠に台選びをしない。次回以降の観察材料として使う

