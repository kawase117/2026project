# 突出台は機種単位の現象で、台番号は日替わりでローテーションする

## 背景
2026-08-19-per-table-games-diff-correlation-detects-single-table-decoy（2026-08-19登録）は、
楽園蒲田マギアレコードの台2133が通年でホール平均を上回るG数×差枚相関（r=0.526）を持つと
記録し、「台2133固有のシグナル」という解釈を示した。翌日2026-08-19の実測で、マギアレコードは
2日連続で全台系1位（score+2,678、G比2.02）となったが、突出した台は台2133ではなく
台2131（+8,619）・台2129（+7,000）に入れ替わった。前日1位の台2133自身は当日G1,434・
差枚-1,095と不調だった。4台の通年相関を比較すると 2133(r=0.526) > 2131(r=0.450) >
2130(r=0.285) > 2129(r=0.195、ホール平均0.273並み) で、複数台がホール平均を上回るが、
どの台が「その日のホット台」になるかは日替わりだった。

## Core claim
機種内で突出する台は「特定の台番号に固定されたシグナル」ではなく、「機種内の複数台
（本件では少なくとも2133・2131）に相対的に高いG数×差枚相関が分散していて、その中の
どれか1台が日替わりで光る」という機種レベルの現象である。安定して観測できるのは
機種そのもの（本件ではマギアレコード）が連日高スコアを出す事実であって、個々の台番号
ではない。

## Evidence
- n_observations: 2日（2026-08-18, 2026-08-19）、マギアレコード4台の通年相関比較
- data scope: single-hall, single-machine, per-table, 2日間の縦断観測
- metric scope: games_normalized / diff / correlation
- result summary: 8/18は台2133が1位、8/19は台2131・2129が1位。機種自体は2日連続で
  全台系1位。台2133は8/19に−1,095で不調

## Interpretation
- 前回instinctの「台2133固有」という解釈は、1日分の観測から一般化しすぎていた
- 「機種平均より高い相関を持つ台が複数存在する」こと自体は否定されていないが、
  それらのうちどれが当日光るかを事前に台番号で当てる根拠は無い
- 機種単位（マギアレコード全体）の連日優位は2日分では確定できないが、台番号単位より
  再現性のある観測対象である可能性が高い

## Action
- 機種内の「歴史的に高相関な台」を複数（本件では2133・2131）リストアップしておき、
  当日はその複数台のうちどれが高回転かを確認する。1台に絞って追いかけない
- 機種自体が連日高スコアを出しているかを、台番号ローテーションより優先して記録する
- 3日目以降の観測が増えたら、機種内の「ホット台候補プール」を確定できるか再検証する

