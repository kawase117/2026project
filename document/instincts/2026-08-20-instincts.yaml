# 生存率(参加率)は高設定シグナルになりうるが、必ず新台バイアスを層別してから使う

## 背景
2026-08-19 楽園蒲田のAT機評価で、site777のgraph対象台（累計2,000G到達台）の
「生存率×生存者内平均差枚」を機種間比較に使った。喰霊-零-Reは生存率100%（4台全部が
2,000G到達）なのに生存者内平均差枚-692、勝率25%という結果を「参加率だけでは高設定の
証拠にならない」反証例として提示したが、この機種は初出2026-08-17・台齢2日の新台だった。
announce.py に既に記録済みの新台バイアス（NEW_MACHINE_DAYS=30、導入直後はG比が構造的に
膨らむが平均差枚は平均的にマイナス）と完全に一致するパターンで、「参加率と設定の乖離」を
示す反証例としては不適切だった。一方、比較対象のとある魔術の禁書目録2は台齢15日
（NEW_MACHINE_DAYS=30以内）でありながら生存率37.5%・平均差枚+2,620と、新台の通常
パターン（平均マイナス）に反してプラスだった。

## Core claim
「生存率（累計games閾値到達台の割合）」を客の集合知シグナルとして使う前に、必ず対象機種の
台齢（初出日からの経過日数）を確認し、NEW_MACHINE_DAYS=30以内の新台は別扱いにする。
新台は設定と無関係に生存率が構造的に高くなるため、生存率単体を高設定の証拠にしない。
ただし新台が「新台の通常パターン（平均マイナス）に反してプラス」を示した場合は、
むしろ既存台の同水準のプラスより強いシグナルになりうる。

## Evidence
- n_observations: 1機種（喰霊-零-Re、age_days=2、生存率100%・平均差枚-692）+
  対照1機種（とある魔術の禁書目録2、age_days=15、生存率37.5%・平均差枚+2,620）
- data scope: single-hall, cross-machine, single-day（夕方時点のライブスナップショット）
- metric scope: games_normalized(生存率の分母) / diff / graph_eligible_count
- result summary: 新台(2日)は生存率100%でも平均差枚マイナス。新台(15日)は生存率37.5%で
  平均差枚プラス（新台の通常マイナス傾向に逆行）

## Interpretation
- 生存率が高いことは「客が座り続けた」ことを意味するが、その理由が「高設定だと感じたから」
  なのか「新台の物珍しさ」なのかは台齢を見ないと区別できない
- 新台の生存率が高くて差枚もプラスなら、通常の新台バイアス（平均マイナス）に逆行する分
  むしろ強い証拠になりうる。新台だからといって一律に無視してはならない
- 既存台（30日超）の生存率×平均差枚は、この交絡が無いぶんクリーンな証拠として扱える

## Action
- 機種の生存率・G比を高設定シグナルとして使う分析では、必ず先に台齢を出す
  （`MIN(date) FROM machine_detailed_results WHERE machine_name=?` で初出日を引き、
  対象日との差分をage_daysとする）
- age_days<=30の機種は新台バケットとして分離し、生存率単体でなく
  「新台の通常パターン（平均差枚マイナス）からの乖離の向き」で評価する
- age_days>30の機種同士は生存率×生存者内平均差枚をそのまま比較してよい

