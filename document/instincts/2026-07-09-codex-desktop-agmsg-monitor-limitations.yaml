# Codex Desktop does not satisfy agmsg monitor bridge startup by itself

## Core claim
Setting `agmsg` delivery mode to `monitor` for `codex` is not sufficient when the session is running inside the Codex desktop app. The monitor bridge only becomes active when Codex is launched through the agmsg CLI shim path.

## Evidence
- n_observations: 1
- data scope: cross-agent messaging / Codex runtime startup
- metric scope: bridge startup and near-real-time delivery
- result summary: `delivery.sh set monitor codex` succeeded and `delivery.sh status codex "$(pwd)"` showed `mode: monitor` with `SessionStart` and `SessionEnd` hooks present, but the same status still reported `Codex bridge: main/codex not running` after restarting the desktop app session.

## Interpretation
- `monitor` state in the project settings only means the hooks were configured.
- A desktop-app Codex session can still remain effectively non-monitored if it did not start through the shimmed `codex` launch path.
- For the desktop app, the practical fallback is `turn` delivery or manual `inbox.sh` checks.

## Action
- Do not assume monitor-mode delivery is active merely because the mode says `monitor`.
- Verify `Codex bridge: ... running` before relying on near-real-time delivery.
- Use CLI `codex` via the agmsg shim for true monitor-mode testing.
- Treat the desktop app as `turn`/manual delivery unless bridge status proves otherwise.

