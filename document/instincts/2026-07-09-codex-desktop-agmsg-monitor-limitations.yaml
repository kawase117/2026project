# `history.sh` and `inbox.sh` answer different delivery questions

## Core claim
`inbox.sh` showing `No new messages.` does not mean a message was never sent. Delivery debugging must distinguish unread inbox state from persistent message history.

## Evidence
- n_observations: 1
- data scope: cross-agent messaging
- metric scope: send visibility / receive confirmation
- result summary: a newly sent Codex test message appeared in `history.sh main codex`, while `inbox.sh main codex` still showed no new unread messages afterward.

## Interpretation
- `history.sh` is the correct tool for verifying whether a send reached the shared message store.
- `inbox.sh` only reports unread arrivals for that agent at that moment.
- If `history` contains the message but `inbox` is empty, the problem is not "unsent"; it is state, timing, or already-read behavior.

## Action
- During agmsg debugging, check `history.sh` before concluding that send failed.
- Use `inbox.sh` to detect unread work, not to prove durable send success.
- When reporting delivery issues, state explicitly whether the failure is `history-missing` or `inbox-empty`.

## Status
- status: active
