# 同一の人気機種でも優遇度はホールごとに異なる。機種別Q1/Q5滞在率で信頼度に差がある

## 背景
[[popular-machine-favoritism-4hall-validation]] では「複数ホールで同じ人気機種
(戦国乙女4、モンキーターンV、スマスロ北斗の拳など)が法則①候補に重複する」
ことを「業界レベルでの人気機種優遇」の証拠と解釈した。
今回、蒲田1ではモンキーターンVが候補に入っていない点を深掘りした。

### 蒲田1 vs 蒲田7のモンキーターンV比較
| | payout_rate | diff_std | diff_std>=median | payout>=102%(候補) |
|---|---|---|---|---|
| 蒲田1 | 101.15% | 11038 (112機種中12位) | ✓ | ✗(0.85pt不足) |
| 蒲田7 | 103.38% | 25996 (81機種中4位) | ✓ | ✓ |

両ホールともdiff_std条件(高分散)は満たすが、payout_rateのみ蒲田1が
102%をわずかに下回り非候補。新基準スマスロのスペックはホール間で
共通(設定3≈100.5-101.3%、設定4≈105-108%)なので、この2.2pt差は
スペックではなく**実際の設定配分実績の差**。
→ 蒲田1のモンキーターンVは「設定3弱」相当、蒲田7は「設定3とやや上
(時々設定4が混ざる)」相当と推定できる。

**解釈**: 「人気機種優遇」自体は業界レベルで存在しうるが、優遇の**度合い**
はホールごとに異なる。同じ機種でも「そのホールでの法則①候補入り
ギリギリかどうか(payout_rateが閾値に対してどれだけ近いか)」を見れば、
そのホールがその機種にどの程度設定を入れているかの目安になる。

### [11] 機種別Q1/Q5滞在率(全曜日, payout>=102%候補, n>=20)
法則①候補の中でも、機種によってQ1/Q5滞在率にばらつきがあり、
事前予測の信頼度の目安として使える。

蒲田1 (Q5-Q1上位):
| 機種 | n | Q1 | Q5 | Q5-Q1 |
|---|---|---|---|---|
| 炎炎ノ消防隊 | 89 | 0.056 | 0.258 | +0.202 |
| 甲鉄城のカバネリ | 62 | 0.032 | 0.226 | +0.194 |
| 痛いのは嫌なので防御力に極振りしたいと思います。 | 199 | 0.070 | 0.196 | +0.126 |
| スマスロ北斗の拳 | 152 | 0.289 | 0.408 | +0.118 |
| 戦国乙女4 | 501 | 0.178 | 0.277 | +0.100 |

蒲田7 (Q5-Q1上位):
| 機種 | n | Q1 | Q5 | Q5-Q1 |
|---|---|---|---|---|
| スマスロ北斗の拳 | 328 | 0.091 | 0.509 | +0.418 |
| モンキーターンV | 328 | 0.168 | 0.570 | +0.402 |
| ソードアート・オンライン | 34 | 0.000 | 0.206 | +0.206 |
| マギアレコード | 328 | 0.241 | 0.421 | +0.180 |
| わたしの幸せな結婚 | 53 | 0.245 | 0.340 | +0.094 |

注意: 炎炎ノ消防隊(3バリエーション中1)、甲鉄城のカバネリ・
ソードアート・オンライン(各2バリエーション中1)は、表記が同じでも
machine_name完全一致の単一タイトルのみの集計。フランチャイズ全体
ではない。
わたしの幸せな結婚は少数台かつ現在非設置のため運用上は重視しない
(ユーザー指摘)。

蒲田7のスマスロ北斗の拳・モンキーターンVはQ1が極めて低く(0.09-0.17)
Q5が極めて高い(0.51-0.57)。「設定看破が容易な人気機種は取りこぼしを
防ぎ機械割の底上げに繋がる」という仮説(ユーザー提示)と整合的で、
法則①候補の中でも特に信頼度が高い部類と言える。

## アクション
- 法則①候補に人気機種(戦国乙女4、モンキーターンV、スマスロ北斗の拳等)
  が含まれる場合、そのホールでのpayout_rateが閾値(100-102%)に対して
  どれだけ余裕があるかを確認する。閾値ギリギリ(蒲田1のモンキーターンV
  =101.15%)は優遇度が弱く、閾値を大きく超える(蒲田7=103.38%)は
  優遇度が強いと解釈できる。
- 機種別Q1/Q5滞在率([11])を確認し、Q1が極めて低い(0.05-0.10台)
  かつQ5が高い機種(蒲田7のスマスロ北斗の拳・モンキーターンV、
  蒲田1の炎炎ノ消防隊・甲鉄城のカバネリ)は法則①の中でも
  特に信頼度が高い「優先候補」として扱える。
- 同一表記でも複数machine_nameバリエーションが存在する機種
  (炎炎ノ消防隊、甲鉄城のカバネリ、ソードアート・オンライン等)は、
  run_backtestの結果がどのバリエーション単体を指しているか確認する。
- わたしの幸せな結婚など少数台・非設置機種は、候補に出ても
  運用上は優先度を下げる。

## 例
```python
# eda/kamata17_payout102_deepdive.py
# [11] analyze_machine_level_reliability(): 候補機種ごとにQ1/Q5滞在率を集計
#
# 個別機種のホール間比較:
for hall, db in [('蒲田1','マルハンメガシティ2000-蒲田1'),('蒲田7','マルハンメガシティ2000-蒲田7')]:
    agg = compute_history_agg(load_at_machines(db))
    row = agg.loc['モンキーターンV']
    print(f'{hall}: payout_rate={row.payout_rate:.2f}%')
```
