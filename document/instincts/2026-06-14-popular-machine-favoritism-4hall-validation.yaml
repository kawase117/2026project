# 法則①の候補機種は店長の設定癖ではなく「人気機種への優遇」が示唆される。機種スペック差は原因ではない。4ホール統合でQ5-Q1=+0.061(95%CI有意)

## 背景
[[kamata17-strategy1-allweekday-pooled-generalizes]] の続き。蒲田1・蒲田7・
みとや・楽園蒲田(店長が異なると想定される4ホール)で、各ホールの法則①
(diff_std>=median & payout_rate>=100~102%)候補機種リストを
eda/kamata17_payout102_deepdive.py [9] で比較した。

### 候補機種の重複
- 「戦国乙女4 戦乱に閃く炯眼の軍師」が**4ホール全部**で候補。
- モンスターハンターライズ、わたしの幸せな結婚、マギアレコード、
  スマスロ北斗の拳、モンキーターンVが各3ホールで候補。

### 機種スペック確認(document/machine_master_research/machine_master.csv)
候補機種(マギアレコード、モンキーターンV、スマスロ北斗の拳、いざ！番長)と
僅差で非候補だった機種(東京喰種、北斗の拳転生の章2、かぐや様は告らせたい)を
比較したところ、**全て同じ新基準スマスロのスペックテンプレート**
(設定1≈97.5-97.9%、設定3≈100.5-101.3%、設定4≈105-108%、設定6≈113-115%)
で、機種間のスペック差は0.5%未満。観測payout_rateは99.6%〜104.4%と
ばらつくが、これはスペック差では説明できない。

→ **「機種スペックが高めだから候補に入りやすい」という仮説は棄却**。
観測payout_rateの差は実際の運用(設定配分の実績)の差を反映している。
よって候補機種の重複(戦国乙女4が4ホール全部など)は、スペック起因の
偶然ではなく、**複数の独立した店が同じ人気機種に時々高めの設定を
投入している(業界レベルでの人気機種優遇)**ことを示す証拠と解釈できる。

### 4ホール統合walk-forward(各ホールの推奨ルール)
| ホール | n | Q5-Q1 | 95%CI |
|---|---|---|---|
| 蒲田1(全曜日, payout>=102%) | 1570 | +0.068 | [+0.038, +0.101] 有意 |
| 蒲田7(全曜日, payout>=102%) | 4241 | +0.074 | [+0.052, +0.095] 有意 |
| みとや(Xgroup, payout>=100%) | 1918 | +0.059 | [+0.027, +0.093] 有意 |
| 楽園蒲田(Xgroup, payout>=100%) | 3067 | +0.039 | [+0.012, +0.064] 有意 |
| 4ホール統合 | 10796 | +0.061 | [+0.047, +0.074] 有意 |

4ホール全て個別に符号一致・有意。統合n=10796でCI幅も狭く
([+0.047,+0.074])、+0.06前後という効果量は偶然とは考えにくい確度。
ただし楽園蒲田(+0.039)が最弱で、統合値は強いホール(蒲田7など)に
引き寄せられた加重平均。新規ホールへの期待値としては+0.04〜+0.07の
範囲を想定するのが現実的。

## アクション
- 新規ホールで法則①を検証する際、候補機種に「戦国乙女4」「マギアレコード」
  「モンキーターンV」「スマスロ北斗の拳」「モンスターハンターライズ」
  「わたしの幸せな結婚」などの人気タイトルが含まれているかを先にチェック
  すると、その機種がpayout>=100~102%超えで候補入りしやすい(=法則①が
  機能しやすい)可能性が高い。
- 「候補機種のpayout_rateが僅差で102%を超えている/超えていない」場合、
  機種スペックの違いを疑う必要はない(新基準スマスロはスペックがほぼ
  共通のため)。差は実際の設定配分実績の差として解釈してよい。
- 新規ホールへの展開時、効果量の期待値は+0.04〜+0.07程度(楽園蒲田が
  下限、蒲田7が上限)。+0.06前後を基準値として運用判断する。

## 例
```python
# eda/kamata17_payout102_deepdive.py
# [9] analyze_candidate_overlap(): 4ホールの候補機種setをハッシュ比較
# [10] analyze_4hall_pooled(): 各ホール推奨ルールでrun_backtest()し
#      4ホール統合のQ5-Q1とbootstrap CIを算出
#
# 機種スペック確認:
# document/machine_master_research/machine_master.csv の
# rtp_setting1~6 列で、候補/非候補機種のスペック差を比較する
```
