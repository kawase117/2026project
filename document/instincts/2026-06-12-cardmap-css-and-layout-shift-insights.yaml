# 共有CSSテンプレートは `var(--xxx, calc(...))` のフォールバック付きカスタムプロパティで個別調整する

## 背景
`generate_kamata7_cardmap_html.py` のCSSテンプレートは蒲田1/蒲田7両方から
利用される。「蒲田七は修正不要」という制約のもとで蒲田1だけ
machine-nameのフォントサイズを変えたかった。
最初は `font-size: calc(var(--slot-x) * 0.2)` のように `--slot-x` から
逆算する式にしたが、slot_xを変えるとカード全体のサイズも変わってしまい
副作用が大きかった。

最終的に `_render_map_viewport` 〜 `render_floor_section` 〜
`build_cardmap_html` まで `name_font_size: float | None = None` を
バケツリレーし、`--name-font-size` カスタムプロパティとして
`.floor-map` の inline style に注入する形にした。
CSS側は `font-size: var(--name-font-size, calc(var(--slot-x) * 0.2));`
とし、未指定時は従来式(蒲田7は40*0.2=8pxで完全に不変)にフォールバックする。
最終的には蒲田1も slot_x=40 に揃えたため name_font_size は不要になり
パラメータ自体は削除したが、フォールバック付きCSS変数の仕組み自体は
将来別途必要になった際に再利用できる。

## アクション
1. 共有レンダラーの関数チェーン(`_render_map_viewport` →
   `render_floor_section` → `build_cardmap_html`)全てに
   `Optional[float] = None` のパラメータを追加する。
2. CSSは `var(--custom-prop, <default-expression>)` の形にし、
   デフォルト式は既存の見た目を完全再現する式にする
   (蒲田7のように呼び出し側で指定しない箇所は無変更を保証)。
3. 個別調整が必要な側だけに新パラメータを設定する。不要になったら
   呼び出し側のパラメータだけ削除すればよい(共有テンプレート側の
   フォールバック機構はそのまま残してよい)。

## 例
```python
# generate_kamata7_cardmap_html.py
def _render_map_viewport(..., name_font_size: float | None = None) -> str:
    name_font_style = (
        f" --name-font-size: {name_font_size}px;" if name_font_size is not None else ""
    )
    return f'<div class="floor-map" style="--slot-x: {slot_x}px; ...{name_font_style} ...">'
```
```python
# generate_kamata1_cardmap_html.py
CARD_LAYOUT = {"slot_x": 40, "slot_y": 30, "pad": 8, "fit_mode": "scroll", "min_scale": 0.65}
# slot_x=40なら --name-font-size 不要(8pxフォールバックが蒲田7と同じ比率になる)
```
