# 複数セクションの平行移動量は「行ごとの隙間」のボトルネックで決まる

## 背景
[[floor-layout-rigid-delta-remap-workflow]] の発展形。
「斜め列を左上に動かして2001を2399と同じx軸に揃え、右上の島も
それに合わせて隙間を詰める」という依頼で、ユーザーの目算(7マス)と
実際に詰められる量(4マス)に差が生じた。
理由は、移動対象セクション群(島)を詰められる量は、
y座標(行)ごとに「島の最小x」と「他セクションの最大x」の差の
最小値(ボトルネック行)で決まるため。

その後の追加依頼で「斜め列を1マス上に上げて2001/2399を離す」
「右上の島を2マス右に動かして2120/2121を離す」のように、
一度詰めた隙間を再度開け直す微調整も発生した
(「必要な隙間」と「不要な隙間」を区別する必要がある)。

## アクション
1. 複数セクションをまとめて移動する前に、対象群の各y行について
   `(他セクションの最大x) - (対象群の最小x) - 1` を計算し、
   その最小値を「詰められる最大量」とする。
2. 計算結果をユーザーの目算と比較し、差があれば正直に報告する
   (例: 「目算7マスでしたが実際は4マスでした」)。
3. 平行移動後は必ず cellwise overlap チェック(0件)と
   max_x/max_y/min_x/min_y の変化を報告する。
4. 「隙間を詰める」と「隙間を空ける」は逆方向の同じ計算であり、
   ユーザーが「ここの隙間は必要」と指摘した箇所は
   再度 dy/dx を逆方向に調整して個別に空け直す。

## 例
```python
# 行ごとのボトルネック計算
for y in island.display_y.unique():
    isl_minx = island[island.display_y==y].display_x.min()
    other_maxx = others[others.display_y==y].display_x.max()
    gap = isl_minx - other_maxx - 1  # 0 = 接触, 1 = 1マス空き
    max_n = min(max_n, gap)
```
