# flexアイテムの実効幅は align-items の影響を受けるため、computed style を直接測定する

## 背景
蒲田1カードマップで `.machine-name` に `max-width: 100%; font-size: 8px` を指定しても
4文字中1文字しか表示されない問題が発生した。
`.machine-card` が `display: flex; flex-direction: column; align-items: center;`
であったため、子要素は cross-axis(横方向)で `align-items: center` の影響を受け、
`max-width: 100%` だけでは親の content-box 幅まで広がらず、
fit-content相当のごく狭い幅(実測14.3px)に縮小されていた。
さらに `width: calc(var(--slot-x) - 2px)` の親要素は
`box-sizing: border-box` + `padding: 1px 2px` + `border: 1px solid` のため、
実際のcontent幅は `slot_x - 8px`(=22px@slot_x30)であり、
単純な `slot_x - 2px` 等の見積もりとはズレる。

## アクション
1. CSSの数式だけで幅を見積もらず、`preview_eval` で
   `getComputedStyle(el).width`, `el.scrollWidth`, `el.clientWidth`,
   `el.scrollWidth > el.clientWidth` を実測する。
2. flex子要素を親いっぱいに広げたい場合は `align-self: stretch` と
   `width: 100%` を併用する(片方だけでは効かないケースがあった)。
3. `box-sizing: border-box` のとき、content幅 = `width - padding*2 - border*2`
   であることを念頭に置き、paddingとborderの合計を引いた値で
   「文字数 × フォントサイズ」が収まるか検算する。

## 例
```css
.machine-name {
  font-size: var(--name-font-size, calc(var(--slot-x) * 0.2));
  width: 100%;
  max-width: 100%;
  align-self: stretch;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
```
```js
// preview_eval で実測して確認
const el = document.querySelector('.machine-name');
({fontSize: getComputedStyle(el).fontSize,
  width: getComputedStyle(el).width,
  scrollWidth: el.scrollWidth,
  overflowing: el.scrollWidth > el.clientWidth})
```
