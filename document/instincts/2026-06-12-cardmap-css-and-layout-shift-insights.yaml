# preview_screenshot がタイムアウトする場合は preview_eval のDOM測定で代替検証する

## 背景
レイアウト変更後の最終確認で `preview_screenshot` が3回連続
30秒タイムアウトした(サーバー再起動しても解消せず)。
一方 `preview_eval` でのナビゲーションやDOM取得は正常に動作した。

## アクション
1. `preview_screenshot` がタイムアウトしたら、まず1回サーバーを
   再起動して再試行する。
2. 2回以上失敗する場合は `preview_eval` で対象要素を
   `getBoundingClientRect()` や `style` 属性パースで直接取得し、
   座標・重なり・テキストなどを数値で検証する。
3. pytestのoverlapチェック(0件)とDOM実測値が一致していれば、
   スクリーンショットなしでも「レイアウト崩れなし」と結論してよい。

## 例
```js
// machine-numberのテキストから該当カードを特定し、left/top値を抽出
const cards = [...document.querySelectorAll('.machine-card')];
const find = (num) => {
  const el = cards.find(c => c.querySelector('.machine-number').textContent == num);
  const style = el.getAttribute('style');
  return style.match(/\((\d+) - 1\) \* var\(--slot-x\)\); top: calc\(var\(--pad\) \+ \((\d+) - 1\)/).slice(1,3);
};
```
