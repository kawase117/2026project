# N機×角N-1×d4(+523)が三軸最強。Top20中19件がN機

## 背景
segment × kakuban × digit の全組み合わせ(n>=100)Top5:
1. N × 角N-1 × d4: +523
2. N × 角2 × d3: +356
3. A × 角N-1 × d8: +332
4. N × 角1 × d2: +314
5. A × 角N-1 × d6: +311

Top20中19件がN機。A機がTop20入りするのは角N-1×d8(+332)と角N-1×d6(+311)のみ。
N機はポジション効果が大きく、角番×末尾の選択精度が高設定発見に直結する。

Bottom5:
1. N × 角1 × d4: -195（最弱）
2. N × 角N × d2: -186
3. N × 角1 × d3: -153
角1のd3/d4とN機の組み合わせは致命的に弱い。

## アクション
N機を打つ場合: 角N-1×d4 > 角2×d3 > 角2×d6 の優先順で選択。
A機を打つ場合: 角N-1×d8 or d6。A機は角番効果がN機ほど大きくない。
絶対に避ける組み合わせ: N機×角1×d4(-195)、N機×角N×d2(-186)。

## 例
N機で角N-1×d4を打つ場合: avg_diff=+523, plus_rate=45.8%, hit104_rate=39.9%
N機で角1×d4を打つ場合: avg_diff=-195, plus_rate=37.5%, hit104_rate=32.3%
同じN機×d4でも角番の選択で718の差が生じる。

