# 三軸Top1の70セル中68件がN機。CSVで即参照可能

## 背景
dd_mod10(0-9) × 曜日(月-日)の70セルでsegment×kakuban×digitのTop1を抽出した結果、
68件がN機、A機がTop1になるのは2件のみ（mod10=2日曜、mod10=3日曜）。

角2がTop1最多（特にmod10=0,2,4,6,7,8で頻出）。
角N-1も多数（mod10=1月,2月,5土,7土,8土など）。
差枚+1000超えの組み合わせが頻出するが、n=20-30でサンプル小のため過学習リスクあり。

## アクション
三軸最強組み合わせの確認は以下のCSVを参照:
eda/reports/kamata7_3axis_top_combinations.csv — dd_mod10×曜日別のsegment×kakuban×digit Top1
ただしn<30のセルは参考程度に留め、n>=100の中間ポジションの結果を優先すべき。

## 例
mod10=7 水曜: N × 角N-1 × d7(+2029, n=24) ← 数値は極端だがサンプル小
mod10=7 木曜: N × 中間 × d7(+751, n=226) ← こちらの方が信頼性高い
実運用では後者のようにn>=100の結果をベースにし、角番Top1は「ボーナスチャンス」程度に活用。

