# 角2ではd3がdd_mod10を問わず安定最強（10セル中4回1位）

## 背景
角2のdd_mod10別Top3を集計した結果、d3が10セル中4回で1位:
mod10=0: d3(+887) ← 全角2セル中最高値
mod10=5: d3(+505)
mod10=6: d3(+582)
mod10=7: d3(+490)
それ以外でもmod10=2で2位(+536)、mod10=4で2位(+243)。

角2×d3はセグメント分析のA機Top1(d3=+234)と整合する。
角2にはA機（ジャグラー/ハナハナ）が多く配置されている可能性が高い。

Bottom側: d4が3回最下位(mod10=0,1,3)、d0が2回最下位(mod10=4,9)。

## アクション
角2を狙うと決めた場合、まずd3を検討する。
mod10=1ではd6(+469)が1位でd3は5位(+181)なので例外。
mod10=8ではd8(+564)が1位、mod10=9ではd8(+371)が1位。
d3が弱い条件ではd6またはd8にスイッチ。

## 例
mod10=0の角2: d3(+887) >>> d9(+452) > d5(+432)。d3が2位の倍近い差。
mod10=7の角2: d3(+490) > d9(+393) > d6(+387)。d5(-216)は絶対避ける。

