# 隣接末尾は同じ日に連動して強くなる（全体p=0.006、土曜p=0.007）

## 背景
末尾ペアのPearson相関を日別avg_diffで算出。
全体: 隣接ペア平均r=0.193 vs 非隣接r=0.150、Mann-Whitney p=0.006（有意）。
土曜: 隣接r=0.296 vs 非隣接r=0.147、p=0.007（有意）。
水曜: 隣接r=0.098 vs 非隣接r=0.048、p=0.235（有意でない）。

全体の最強ペア:
2-3: r=0.25（隣接）
5-6: r=0.24（隣接）
3-4: r=0.23（隣接）
2-7: r=0.23（非隣接 — 例外）
4-6: r=0.22（非隣接）
6-7: r=0.22（隣接）

最弱: 5-9: r=0.05、1-5: r=0.06。

## アクション
末尾選択時、Top1の末尾に隣接する末尾もサブターゲットとして考慮する。
特にd2を狙うならd3もチェック（r=0.25）、d5ならd6もチェック（r=0.24）。
この効果は土曜日に最も顕著で、水曜日では無視してよい。

## 例
d3が当日強い場合: d2(r=0.25)とd4(r=0.23)も連動して強い可能性が高い。
d6が強い場合: d5(r=0.24)とd7(r=0.22)も連動。
ただしd5とd9は相関が最弱(r=0.05)なので、d5が強くてもd9への波及は期待できない。

