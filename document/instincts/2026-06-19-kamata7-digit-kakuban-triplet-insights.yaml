# 連番トリプレット（例:4-5-6）の出現率は低い — ペア連動が実態

## 背景
日別にTop3末尾を算出し、3つが連番（リング連番含む）になる確率を検証。
全体: 342日中20日が連番(5.8%)。理論ランダム≈8.3%よりやや低い。
mod10=7で17.6%、mod10=4で14.7%と偏りはあるが、サンプル小（34日中5-6日）。
曜日別: 土曜14.3%、木曜10.2%。水曜0%。

最頻出トリプレット: 6-7-8がmod10=4,7で3回出現。4-5-6が土曜で3回。
しかし342日中最大3回(≈1%)では、特定トリプレットを「狙う」根拠にならない。

70セル(曜日×mod10)中、連番Top3はわずか4件:
土曜mod10=6: 4-5-6、日曜mod10=2: 5-6-7、木曜mod10=3: 9-0-1、金曜mod10=7: 1-9-0

## アクション
「3連番を丸ごと狙う」戦略は蒲田7では根拠不十分。
代わりにペアレベル（2末尾の連動）で戦略を組む方が効果的。
Section 5の並び候補テーブルは「参考」として使い、主軸はセグメント×角番×末尾の早見表に置く。

## 例
「今日は6-7-8が来る」という予測は、342日中3回しか的中しない。
「d6が強い日はd7(r=0.22)も強い傾向がある」というペア連動の方が再現性がある。
