# 角番ポジションによって最適末尾が激変する（角1と角Nで対称的逆転）

## 背景
蒲田7全データで角番位置×末尾の全組み合わせを算出した結果:
角1: d2(+314)が1位、d3(-153)が最下位。差=467。
角2: d3(+356)が1位、d4(+74)が最下位。差=282。
中間: d6(+265)が1位、d3(+157)が最下位。差=108（レンジ小）。
角N-1: d4(+387)が1位、d1(+52)が最下位。差=335。
角N: d4(+186)が1位、d2(-150)が最下位。差=336。

注目すべきパターン:
- 角1でd2が最強(+314) → 角Nでd2が最弱(-150)：完全逆転。
- 角2でd3が最強(+356) → 角1でd3が最弱(-153)：完全逆転。
- 角N-1×d4(+387)が全組み合わせ最強。角2×d3(+356)が2位。

## アクション
角番位置を先に決めてから末尾を選ぶ。位置を無視した末尾選択は効果が打ち消し合う。
角2を狙う場合: d3を最優先（全mod10で安定的上位）。
角N-1を狙う場合: d4を最優先。
中間を狙う場合: d6（セグメントNの影響で安定的1位）。
角1/角Nは通常時ベースラインが弱いため、イベント日以外は避ける。

## 例
角2×d3: avg_diff=+356, plus_rate=40.9%, hit104_rate=34.2% (n=1,008)
角N-1×d4: avg_diff=+387, plus_rate=44.9%, hit104_rate=33.1% (n=661)
角1×d3: avg_diff=-153（最弱） → 同じd3でも角2なら+356、角1なら-153

