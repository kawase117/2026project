# 土曜日はd4-d5-d6-d7-d8-d9が一塊のクラスターを形成する

## 背景
土曜日の末尾ペア相関マトリクスで、d4を中心とした強い連動が確認された:
4-5: r=0.54（全ペア中最強）
5-6: r=0.46
4-6: r=0.45
8-9: r=0.45
2-3: r=0.42
6-7: r=0.39
7-9: r=0.37

d4-d5-d6は三角形状に全ペアr>0.45。d6-d7-d8-d9も連鎖的に相関。
一方、d1は全ペアでr<0.18と孤立している。

水曜日では3-4(r=0.45)以外に強いペアがなく、この構造は土曜特有。

## アクション
土曜日にd4/d5/d6のいずれかがTop末尾に入っている場合、残り2つも候補に含める。
例: d5がTop1なら、d4とd6もターゲットとして追加。
Section 5の実戦用候補でも、土曜mod10=6でTop3が4-5-6（連番）と一致している。
d1は土曜日では他の末尾との連動が期待できない孤立末尾。

## 例
土曜mod10=6: Top3 = d5, d4, d6（連番一致）。4-5-6を一括で狙う戦略が成立。
土曜mod10=4: Top3 = d6, d4, d8。d4-d6(r=0.45)の連動あり、d5も追加検討。
土曜のd1: 全ペアr<0.18。d1が強くても他に波及しない→並び狙いに不向き。

