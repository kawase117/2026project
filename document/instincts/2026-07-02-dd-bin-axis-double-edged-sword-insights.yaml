# DD Binningは単日の鋭い信号を薄める一方、週スケールの信号を新たに発見することもある。機種ごとに効果が逆

## 背景
「DDX単日よりBin(1-7,8-15等)の方が強い信号を掴めるのでは」という仮説を検証した結果、機種によって真逆の結果が出た。
1. **クレアの秘宝伝(みとや)**: dd軸でhit104効果量0.204(有意)だったが、dd_binでは0.086まで低下し非有意に。内訳を見るとdd27だけが62.1%(他日は平均25%)と突出する単日スパイクで、22-28日のBinにまとめると残り6日の平凡な値に薄められて消えた。**単日スパイク型の信号はBinで殺される**。
2. **バイオハザードRE:3(蒲田7)**: dd軸は効果量0.211-0.218だが期待セルの50%が<5で警告付き(信頼度低)。dd_binでは効果量0.171-0.187で警告なし。効果の大きさはほぼ同じままセル数不足の不安が解消された。**Binはノイズの多い結果をクリーンにする**。
3. **バーサスリヴァイズ(金時)**: dd軸単独では完全に非有意(p=0.20, 効果量0.099)だったが、dd_binではp=0.005, 効果量0.132で有意になった。個々の日には出ない週スケールの緩やかな傾向が、束ねることで初めて可視化された。**Binで新規発見できるケースも実在する**。

## アクション
「Binにすれば信号が強まる」という単純な期待は持たない。機種ごとにdd軸とdd_bin軸の両方を必ず比較し、(a)dd軸で有意・dd_binで消える→単日スパイク型、(b)dd軸で有意(警告付き)・dd_binでも有意(警告なし)→Binで信頼性向上、(c)dd軸で非有意・dd_binで有意→週スケール型の新規発見、の3パターンに分類して解釈する。

## 例
eda/results/machine_axis_pattern_scan/みとや_pattern_summary.csv(クレアの秘宝伝、パターンa)、蒲田7_pattern_summary.csv(バイオハザードRE:3、パターンb)、金時_pattern_summary.csv(バーサスリヴァイズ、パターンc)。
