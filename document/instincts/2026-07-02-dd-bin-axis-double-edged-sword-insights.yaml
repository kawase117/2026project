# machine_axis_pattern_scan.pyにdd_bin軸(週単位5区分)を追加済み

## 背景
2026-07-02、既存の`eda/machine_axis_pattern_scan.py`(全機種×dd/day_of_week/is_x_dayの法則性スキャン)に4つ目の軸`dd_bin`(DD1-31を"1-7","8-14","15-21","22-28","29-31"の5区分にまとめたもの)を追加した。`_axis_order`/`_sorted_axis_values`/`_axis_level_order`に加法的にbranchを追加し、既存軸の挙動は変更していない(9個の依存ファイル全てのテスト通過を確認済み)。9ホール全実行済み、出力は既存の`eda/results/machine_axis_pattern_scan/`に同居(`axis`列で判別)。

## アクション
機種単体のDD法則性を調べる際は、`dd`軸だけでなく`dd_bin`軸の結果も必ず併せて確認する。個別DDセルがsparse warning付き(期待セル数<5が多い)の機種は特にdd_bin側で信頼性を検証すべき。

## 例
`eda/results/machine_axis_pattern_scan/{hall}_pattern_summary.csv`の`axis=="dd_bin"`行。既存のkamata7_theory.mdの「DDビン」(DD1-6,DD7-12,...)とは境界が異なる(こちらは7日区切り)点に注意。

