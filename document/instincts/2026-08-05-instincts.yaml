# ある日 games_normalized=0 なのに diff_coins_normalized だけ非ゼロ・全台同一値が入っている不良日がある

## Core claim
machine_detailed_results には、対象日の全台が games_normalized=0（かつ bb_count/rb_count=0）
なのに diff_coins_normalized だけホール平均とみられる同一値が全行に書き込まれている
「不良日」が存在し、games_normalized>0 でフィルタせず機械割・平均差枚を計算すると
分子だけが汚染されて数値が実際より2〜3pp下振れする。

## Evidence
- n_observations: 1（楽園蒲田店 2026-07-06、587台全台が該当。ハナハナ16台は全台 diff=-6142 で一致）
- data scope: single-hall（楽園蒲田のみ確認。全9ホールへの横展開は task_545089b8 で調査中・未完了）
- metric scope: diff（machine_detailed_results 由来の機械割・平均差枚計算全般）
- result summary: フィルタ前後で楽園ハナハナ3F(26日)の実績機械割が 98.42% → 101.24% に変化（+2.8pp）

## Interpretation
- 該当日は games=0 が「未計測」を意味し、diff の値は台単位の実測ではなく代入値の疑いが強い
- daily_hall_summary 経由の集計（avg_diff_per_machine 等）が同じ汚染を受けているかは未確認
- 1ホール1日でしか確認していないため、全ホール・全期間での発生頻度は不明（横展開タスク待ち）

## Action
- machine_detailed_results から直接 payout / diff を集計するコードは
  `df[df.games_normalized > 0]` を先頭で必ず通す（eda/rakuen_hana_3f_verification.load() に実装済み）
- 単日でホール全体の指標が急変した箇所を見たら、その日の games_normalized 分布を先に見る
  （全台 games=0 かつ diff が全台同一値、は機械的に検出できる）
- task_545089b8（全ホール横断のgames=0不良日洗い出し・briefing_common.py へのフィルタ追加・
  スクレイパー側の保存前チェック）の結果が出たら、この instinct を more general な結論で更新する

