# 末尾の強さは並びの巻き添えで作られる。並びの構成台を除いて取り直す

## Core claim
連番の並び（xx2-xx3-xx4 など）は、中心の末尾だけでなく隣の末尾の台も持ち上げる。
並びが仕掛けの日に末尾別の集計をすると、並びの構造が末尾効果に化ける。
**並び（緩い定義: 同一section内の連番3台で、全台がホール中央値超え）の構成台を除いて末尾の順位を取り直し、
除外後も残るものだけを末尾効果とする。**

## Evidence
蒲田1 20260912。外部速報（999999Q9Q）は「3台並びが仕掛けの軸、並びの8割に末尾③」。
AT機の差枚残差（当日ホール平均を引いた値）:

| 末尾 | 全台 | 並び構成台45台を除外 |
|---|---|---|
| 4 | 1位 +1206 | **1位 +639（残る）** |
| 3 | 2位 +683 | **4位 -139（消える）** |

報告された末尾3の強さは並びの構造に乗っていただけで、末尾4は並びの外にも出ていた。
同日、並びを除外した後のAT残差1位は楽園で末尾8、蒲田7で末尾5だった。
蒲田7の外部報告「AT機:共通末尾⑥」とは一致しなかった。

## Interpretation
- [[label-position-must-split-by-granularity]] は、公表ラベルの位置分布が並びの数え方で歪むという話である。
  こちらは、DB の差枚・RB 集計で並びが末尾効果を作るという話で、測っている対象が別。
  どちらも「並びは位置・末尾の集計を構造的に汚す」という同じ根を持つ
- 外部報告の「並びに末尾Xが絡む」は並びの記述であって、末尾単独の効果の証拠ではない
- 単日の測定であり、並び除外で残った末尾4が恒常的な仕掛けかどうかは別に検証が要る

## Action
- 末尾効果を主張する前に、当日の並びを backtest/narabi.py の strict と緩い定義の両方で検出し、構成台を除いた順位を併記する
- 除外後に残らない末尾は「並びの中心」と記録し、末尾仕掛けとは呼ばない
- 除外後も残る末尾は、並びとは別の仕掛けとして扱う
