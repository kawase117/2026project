# Interaction Features Unlock Non-Linear Patterns

## 背景
Phases 8-10 achieved baseline performance (AUC 0.66-0.70) through domain analysis, feature integration, and hyperparameter tuning. Next frontier: interaction features to capture non-linear relationships.

## 提案される相互作用特徴量
- days_since_rank1 × avg_efficiency_7d — Does recency matter more for efficient machines?
- month_progress × avg_diff_7d — Does profit strategy change through month?
- avg_games_7d × avg_efficiency_7d — Does efficiency signal differ for busy vs quiet machines?

Expected improvement: +0.01 to +0.03 AUC (10-50x better than hyperparameter tuning).

## アクション
When baseline plateaus:
1. Create 2-3 high-value interaction terms — not 50+ (curse of dimensionality)
2. Test each interaction independently — measure standalone correlation with target
3. Use domain intuition — interactions should be interpretable
4. Re-validate with time-series split — ensure improvements persist on held-out dates

## 例
High-value interactions: recency_efficiency = days_since_rank1 × avg_efficiency_7d, month_games = month_progress × avg_games_7d, game_efficiency = avg_games_7d × avg_efficiency_7d. Expected Phase 11 approach yields AUC improvement +0.01-0.03 (vs +0.004 from direct features).

