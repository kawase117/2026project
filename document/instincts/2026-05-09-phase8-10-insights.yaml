# Different Imbalance Ratios Require Different Approaches

## 背景
Pachinko rank prediction has three targets with different imbalance levels: rank_1 (1.43%), top_3 (4.28%), top_5 (7.07%). Optimal hyperparameters differed by target: rank_1 required max_depth=4, top_3 required learning_rate=0.02, top_5 remained at baseline.

## インサイト
Severe class imbalance (1-2% positive) requires different feature engineering and model tuning than mild imbalance (7%+). Single "one-size-fits-all" model may not be optimal.

## アクション
When handling multi-target imbalance:
1. Tune per-target — do not apply same hyperparameters to all targets
2. Consider separate models — for extreme imbalance (1-3%), dedicated model may outperform combined approach
3. Evaluate with AUC and AP — not accuracy (meaningless for imbalanced data)
4. Use scale_pos_weight in XGBoost: set to (n_negative / n_positive)

## 例
Phase 10: rank_1 (1.43%) best=(MD=4, LR=0.005) AUC 0.7001. top_3 (4.28%) best=(MD=3, LR=0.020) AUC 0.6895. top_5 (7.07%) best=(MD=3, LR=0.010) AUC 0.6665. No single parameter set optimal for all targets; imbalance severity directly impacts optimal depth/learning_rate.

