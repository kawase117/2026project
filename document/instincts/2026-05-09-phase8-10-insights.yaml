# Not All Domain Hypotheses Require Explicit Feature Engineering

## 背景
Phase 8 tested 4 domain hypotheses: DD (日付), machine_type, 時系列ドリフト, 偽陽性パターン. Only machine_type showed statistical signal, but when integrated into full model, improvement was 94% lower due to multicollinearity.

## 結論
Domain analysis identifies which hypotheses are worth pursuing, but: (1) High standalone effect ≠ high combined effect; (2) Statistically significant ≠ practically useful; (3) Some patterns already captured implicitly by baseline features.

## アクション
When multiple domain hypotheses exist:
1. Test hypotheses independently first — measure standalone effect size
2. Only develop features for highest-value hypotheses — skip those with p>0.05 or redundant signal
3. Expect diminishing returns — mature baselines already capture obvious patterns
4. Pivot to new hypotheses if combined improvement <50% of standalone — indicates multicollinearity

## 例
Phase 8-10 workflow: Phase 8 tests 4 hypotheses (only machine_type significant). Phase 9 integrates machine_type (combined improvement +0.004, 94% reduction). Phase 10 hyperparameter tuning (+0.59% max). Conclusion: Need new hypotheses or interaction features, not better tuning.

