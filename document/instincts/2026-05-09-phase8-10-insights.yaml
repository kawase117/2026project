# Multicollinearity Can Mask True Signal in Multi-Feature Models

## 背景
Phase 8-5 showed machine_type alone provides AUC +0.064-0.068 effect. However, when integrated into 16D baseline (Phase 9), improvement was minimal: +0.004 AUC. This 94% reduction in effect size indicates multicollinearity.

## 分析
1. The 16D baseline features already implicitly capture machine_type signal through rolling averages and efficiency metrics
2. Machine types have different behavioral patterns (avg_diff, avg_games, avg_efficiency) that correlate with rank outcomes
3. One-hot encoding creates multicollinearity rather than new orthogonal signal
4. Rare categories (hana: 1.99%, oki: 1.52%) lack sufficient training samples

## アクション
When adding categorical features to existing numerical baseline:
1. Test standalone effect first — measure target correlation alone
2. If standalone effect is large (>5% AUC delta) but integrated improvement is <10% of standalone, suspect multicollinearity
3. Consider alternatives: target encoding (handles rare categories), simplified binary flag, or skip the feature

## 例
Machine-type alone: AUC +0.0677. Combined with 16D: AUC +0.0042 (94% reduction). Signal largely redundant with existing temporal/efficiency features. One-hot encoding inefficient for rare categories.

