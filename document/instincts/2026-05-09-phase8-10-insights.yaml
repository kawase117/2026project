# Time-Series Validation Essential for Temporal ML

## 背景
Phase 9-3 initially used simple sample-based test split (last 57 samples), producing AUC 0.37-0.57, inconsistent with Phase 9-2's date-based split producing AUC 0.66-0.70. Root cause: sample-based split created data leakage from future dates into training.

## 修正方法
Proper time-series split requires splitting on time/date, not samples:
- Identify unique dates
- Split at date index N-57 (last 57 unique dates)
- Train on all data before split_date, test on data from split_date onward
- Result: Chronological ordering preserved, no leakage

## アクション
For any temporal prediction task (time-series, financial, user behavior):
1. Always split on time/date, never on samples — ensures future data doesn't leak into training
2. Verify temporal ordering — training chronologically earlier than testing
3. Document split ratio and methodology
4. Use date-based validation in cross-validation, not random k-fold

## 例
Sample-based split (WRONG): train_idx = df[:13713], test_idx = df[13713:] → AUC 0.37-0.57 (data leakage). Date-based split (CORRECT): train_dates < 2026-02-08, test_dates >= 2026-02-08 → AUC 0.66-0.70 (realistic).

