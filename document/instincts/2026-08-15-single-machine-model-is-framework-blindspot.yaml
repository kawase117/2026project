# 1台設置機種は全台系フレームワークの構造的死角。ただしクラスとしてのエッジは無いのでフィルタは緩めない

## Core claim
`min_machines=3` により、1〜2台設置の機種は `backtest/announce.py` の
`model_scores` から**恒久的に除外**される。ホール予告も少台数機種を名指ししないため、
**予告にも我々の指標にも一度も現れない台で高設定が入りうる**。

しかし少台数群にクラスとしてのエッジは無い（90日で平均差枚 -83枚 vs 3台以上群 +8枚）。
**したがって `min_machines` を緩めてはならない。** 死角は個別に踏み込んで潰す。

## Evidence
- n_observations: 楽園蒲田店、2026-05-17〜2026-08-14（90日）
- data scope: single-hall
- metric scope: diff_coins_normalized / games_normalized / 設置台数

**(a) 死角の大きさ**

2026-08-14 時点で総120機種のうち **1-2台設置が64機種＝80台 / 587台（13.6%）**。
`announce` 全ファイルを grep しても「ハイパー」の記載は **0件** で、
予告側も一度も名指ししていない。

**(b) クラスとしてのエッジは無い（むしろ負け）**

| 90日 | 台日 | 平均差枚 | 勝率 | 平均G |
|---|---|---|---|---|
| 1-2台設置群 | 6,095 | **-83** | 0.337 | 2,265 |
| 3台以上群 | 44,549 | **+8** | 0.351 | 3,215 |

**(c) それでも個別事例は実在する**

ハイパーラッシュ（3191、1台設置、`bt_flag=1`）は 2026-08-12〜14 に
BB 1/194.0・合算 1/133.9・差枚 +8,763 を記録し、スペック表尤度で
設定6:設定1 = 34.5:1 / P(設定5-6)=0.734。直前34日（78,456G）は BB 1/274.3 で
設定1相当だったので、運用の切り替えと読める。
この台は `min_machines=3` で `model_scores` から除外され、当該期間の
全台系スコアにも announce の採点にも**一切現れていない**。

**(d) 少台数の高設定を見つける代替シグナル: G比**

8/12-14 の G数は 5,973 / 5,121 / 5,782 で、この台の直近30日平均 2,712 の**2倍超**。
同じ3日のホール平均G数は 2,558 / 2,520 / 3,110 と**低い**（gratio 1.86〜2.33）。
**閑散日に1台だけフル稼働**は、常連が設定を読んで張り付いていることを示す。
隣接台（3188-3190 カバネリ、3192-3195）は無連動で、並び施策ではない。

## Interpretation
- これは [[project-kishu-ichi-decoy]]（機種内1台だけ高設定の撒き餌）とは**別物**である。
  撒き餌は機種内に複数台ある中の1台。ここでは機種＝1台なので、
  機種平均を持ち上げて全台系に偽装するという構図自体が成立しない。
- (b) がある以上、「死角に系統的なエッジが眠っている」という読みは誤り。
  `min_machines=3` は少台数機種のスコアが不安定になるのを防ぐ正しい設計で、
  緩めると `gratio_mean_diff` の少台数バイアス（README 参照）がさらに悪化する。
- ⚠️ (d) の G比シグナルは**因果の向きが未分離**。「設定が良いから常連が回している」のか
  「たまたま出たから客が集まった」のかは、この観測だけでは分けられない。
  ボーナス確率（[[2026-08-15-spec-table-picks-main-metric-by-information]]）で
  裏を取ってから使うこと。
- 実務上は G比が高いこと自体が**取れないことの予告**でもある。常連が朝から座っていれば
  抽選番号で勝たない限り確保できない。

## Action
- ユーザーが「あの台が連日出ている」と指摘したら、**まず設置台数を確認する**。
  1〜2台なら全台系スコアには構造上出ていないので、「スコア圏外だから根拠なし」と
  返してはならない。台単位で `bb_count` / `rb_count` / `games_normalized` を直接見る。
- 少台数機種の設定判定は、差枚でも機種スコアでもなく
  **スペック表があればボーナス確率の尤度、無ければ G比の異常**で入る。
- `min_machines` は下げない。死角は個別調査で潰し、フィルタは触らない。
- 少台数機種で高設定を検出しても、**announce では採点できない**（`model_named` は
  `min_machines` 未満で `hit=None` になる）。的中率の分母に入れないこと。
- 定期的に「1-2台設置群の平均差枚 vs 3台以上群」を測り直す。
  (b) が反転したらこの instinct の前提が崩れる。

