## 背景
向き x サイズ x 機種別カクバン残差分析（2026-06-18実施）。

効果なしのグループ
  diagonal_small（4-5台の斜め島）  overall_p=0.29(A), 0.79(N)
    2143-2146, 2147-2150, 2162-2166, 2187-2190 の4セクション
    台数が少なく全台がほぼコーナー相当なので kakuban による差別化不可

  horizontal_large_A（13-14台横向き島のジャグ系）  overall_p=0.27
    2317-2330（14台）, 2256-2268（13台）, 2269-2281（13台）の左エリア
    全 kakuban で median が-121〜-193 の範囲に収まり差が小さい

## アクション
