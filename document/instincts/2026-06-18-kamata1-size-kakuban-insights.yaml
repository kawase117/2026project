# diagonal_medium_A の kakuban=5 が有意に優れる（唯一の積極的選択根拠）

## 背景
向き x サイズ x 機種別カクバン残差分析（2026-06-18実施）。
中型斜め島（11-13台）のA系で2位置が有意。

有意シグナル（q<0.05）
  kakuban=1  q=0,      mean=-118, median=-267  端が最弱（共通ルール）
  kakuban=5  q=0.0018, mean=+78,  median=-108  唯一の正方向シグナル

全 kakuban の median 比較
  kakuban=1  median=-267（最悪）
  kakuban=2  median=-167
  kakuban=3〜4  median=-140〜-170
  kakuban=5  median=-108（最も浅い = 最良）
  kakuban=6〜7  median=-139〜-162

kakuban=5 は median がマイナスだが他の位置と比べて明確に浅い。
mean も+78 と正で全体で最高。構造的な差がある（大型斜め島では同様シグナルなし）。

## 対象セクション（中型斜め島）
  2099-2109  11台（X=16〜26, Y=7〜17 の斜め配置）
  2110-2120  11台（X=16〜26, Y=8〜18 の斜め配置）
  2191-2202  12台（X=20〜31, Y=19〜30 の斜め配置）
  2223-2235  13台（X=20〜32, Y=19〜31 の斜め配置）

11台島では kakuban=5 が両端から5番目・7番目の台に対応。

## アクション
中型斜め島（11-13台）でジャグ系を選ぶとき:
kakuban=5（両端から5番目）を最優先候補とする（q=0.0018, median=-108）。
kakuban=1（コーナー端）を回避する（median=-267）。
大型斜め島（15+台）ではこのシグナルは確認されていないので別ルールを適用する。

