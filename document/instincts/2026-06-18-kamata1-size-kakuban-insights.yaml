# diagonal_large_N の kakuban=1 が median=-600 と全分析中最悪レベル

## 背景
向き x サイズ x 機種別カクバン残差分析（2026-06-18実施）。

diagonal_large_N の kakuban=1
  q≈0, mean=-217, median=-600, n=3001
  median=-600 は全セグメント全kakuban位置で最悪レベル

中型斜め島（diagonal_medium_N）の kakuban=1（median=-464）と比べても明らかに悪い。
大型島ほどコーナー端のAT系台が極端に低成績。

対象セクション（大型斜め島）
  2001-2020  20台（X=3〜22, Y=1〜20 の斜め配置）
  2236-2255  20台（X=20〜39, Y=16〜35 の斜め配置）
  2282-2301  20台（X=20〜39, Y=17〜36 の斜め配置）
  2043-2059  17台（X=9〜25, Y=2〜18 の斜め配置）
  2060-2076  17台（X=9〜25, Y=3〜19 の斜め配置）
  2302-2316  15台（X=24〜38, Y=23〜37 の斜め配置）

## アクション
大型斜め島でAT系を選ぶとき:
