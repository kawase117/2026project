kakuban=2 も mean=-32, median=-471 と悪い傾向（非有意だが要注意）。
端から3台以上内側を選ぶ方が安全。
kakuban=7（mean=+109）やkakuban=10（mean=+212）はmean高いがmedianが-380〜-451でアウトライア駆動のため過信しない。

