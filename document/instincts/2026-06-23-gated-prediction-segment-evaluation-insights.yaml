# 3モデル独立運用：役割分担とConsensus不使用

## 背景
Borda平均によるConsensus統合は6/21: vs_other=-514、6/22: -419と一貫して悪化。
v9b/v9cが3F系の台を引き込み、v6aの2F選択を薄めるため。
独立運用での28日バックテスト結果:
  v6a: イベント日×2F圧倒(+3,728/+662)、非イベント×3F_R_N(+441,71%)
  v9b: 非イベント日バランス型、2F_L_N勝率67%、3F_L_N/3F_R_N安定
  v9c: セット選択は最強(avg_diff+278)だがランキング無意味、N型無配分

## アクション
- Consensus（Borda平均）は使わない — 統合は価値を破壊する
- 3モデルは独立した予測として提示し、ユーザーが状況に応じて選択
- イベント日: v6aの2F推奨を最優先
- 非イベント日: v9bを全体参考、v6aの3F_R_Nも有力
- v9c: Top50 in/outのフィルタとして使用（内部順位は無視）
- 3モデルの重複台（全モデルがTop50に選んだ台）は高信頼度シグナル

## 例
6/22 Consensus Top50: avg_diff=-248（3モデル統合で悪化）
6/22 v6a Top50: avg_diff=+152（単体では正のリフト）
6/22 v9b Top50: avg_diff=+178（単体では正のリフト）
→ 統合すると良いモデルの結果を壊す

