# v9cは50台セット選択は有効だが内部ランキングは無意味

## 背景
28日間バックテストでv9cのTop50全体avg_diff=+278（v6a: +251, v9b: +238より高い）。
しかしTop50内部の層別分析:
  Top5: +210, hit@4.5k=0.7%（最弱）
  31-50位: +393, hit@4.5k=7.5%（最強）
パーセンタイル変換でcompositeが0.8-1.0に圧縮され、ランキング解像度が崩壊。
また3F_L_N/3F_R_Nへの配分が0台（パーセンタイルがN型弱セグメントにスコアを与えない構造）。
lift@t4500ではv9cが全セグメント最強という過去検証データあり。

## アクション
- v9cのTop50に入ったかどうか（in/out）はシグナルとして有効 — 採用すべき
- v9c内の順位（1位 vs 50位）は信用しない — 差がない
- v9cが選ばなかった3F_L_N/3F_R_Nの台はv6a/v9bから補完する
- 「v9cは捨てるべき」ではなく「フィルタとして使う」が正しい運用

## 例
v9c Top50 avg_diff: +278（3モデル中最高）
v9c Top5 hit@4.5k: 0.7%（v6a: 11.4%, v9b: 13.6%と比べ壊滅的）
→ セット選択○、ランキング×

