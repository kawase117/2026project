# セグメント別vs_otherの単純平均は配分0セグメントを持つモデルを不当に低評価する

## 背景
v9cはセグメント別vs_other平均で最悪に見えたが、全体Top50のavg_diffは+278で3モデル中最高。
原因: 3F_L_N/3F_R_Nへの配分が0のため、セグメント別平均にこれらが含まれず、
配分があるセグメント内でのvs_otherだけで評価されていた。
v6a/v9bが3F_L_N/3F_R_Nで+400〜+500のvs_otherを稼いでいる分が
セグメント平均を押し上げていたが、v9cは配分0で参加すらしていない。
全体Top50ベースで見ると、v9cの「配分しないセグメントをスキップする」戦略自体は
avg_diff最高という結果に繋がっている。

## アクション
- セグメント別vs_otherを集計する際は、配分台数で加重平均するか、全体Top50ベースの指標と必ず併用する
- 「配分0セグメント」は弱点ではなく戦略の可能性がある — 弱セグメント回避は合理的
- 複数指標（avg_diff, vs_other, lift@threshold, 勝率）を組み合わせて判断する

## 例
v9c セグメント別vs_other平均: 最悪に見える
v9c 全体Top50 avg_diff: +278（v6a +251, v9b +238より高い）
→ 評価方法の違いで結論が反転する

