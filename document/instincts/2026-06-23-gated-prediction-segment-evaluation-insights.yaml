# ゲートが単一セグメントに絞ると、ランキング品質の低いセグメントに閉じ込められるリスク

## 背景
6/21のゲート付き予測で2F_R_Nのみがactive判定され168台に限定。
結果Top50のvs_other=-591（v6a）と大逆選択。
一方NOGATEで全714台を対象にした場合、同日のv6a Top50はvs_other=+35と改善。
3Fセグメント（3F_L_N: vs=+1115, 3F_R_N: vs=+2111）でのランキング成功が
2Fの逆選択（2F_R_N: vs=-624）を相殺したため。

## アクション
- ゲートがactive=1セグメントのみの場合、NOGATEフォールバックも並行出力して比較する
- セグメント別のランキング品質が均一でないことを前提に、ゲート後も複数セグメントからのTop50構成を維持する
- 単一セグメント閉じ込めはリスクが高い — 最低2セグメント以上のactive判定を安全基準とする

## 例
6/21 gated(2F_R_N only): v6a vs_other = -591
6/21 nogate(全714台):     v6a vs_other = +35
差: +626 — NOGATEの方が大幅に良好（3Fのリフトが寄与）

