# セグメントによってランキング品質が大きく異なる — ホール側の法則が異なる可能性

## 背景
28日間のv6a セグメント別Top50 vs_otherと勝率:
  2F_R_N: +253, std=808, 勝率61% — 最も安定（低分散・高勝率）
  2F_L_N: +1,009, std=3,003, 勝率62% — 平均は高いがDD07(+12,920)等の外れ値依存
  3F_R_N: +374, std=1,869, 勝率70% — 勝率最高だが負け日は-2,700〜-3,900
  3F_L_N: +445, std=1,571, 勝率44% — 負け越し。DD28の+6,126一日が平均を正に見せている
  3F_L_A: -25, 勝率47% — ジャグラー/ハナハナは設定判別困難でランキング不能

6/21の実績でも3F(vs_other正)と2F(逆選択)で明確に分かれた。
ホール側が2Fと3Fで異なる設定投入ルールを使っている可能性が高い。

## アクション
- セグメント横断のランキング比較は慎重に — 同一compositeスコアでもセグメントによる予測精度が異なる
- 3F_L_Nの勝率44%はモデルが法則を捉えていない可能性 — 平均値に騙されない
- 2F_R_Nの安定性（std=808）はモデルとの相性の良さを示唆
- フロア別に異なるウェイトやルールの導入が次の改善候補

## 例
v6a 2F_R_N: mean=+253, std=808, 勝率61%（安定）
v6a 3F_L_N: mean=+445, std=1571, 勝率44%（外れ値依存、負け越し）

