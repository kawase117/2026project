  セットで行うこと。1回の集計で「良い台」が見つかっても、それだけでは
  ノイズと区別できない。
- イベント日でない通常営業日(土曜含む)の台選定は、Xgroup基準で検証済みの
  候補(598番・609番等, mitoya-20260614-final-at-candidate-screening)を
  そのまま使うのが妥当。曜日固有の調整は現時点で根拠なし。
