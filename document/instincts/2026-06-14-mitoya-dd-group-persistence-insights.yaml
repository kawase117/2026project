# 「機種角=高設定」はAT・メイン島に限定しても支持されない。むしろ機種角の方がresidualが低い(逆方向)

## 背景
ユーザーがヒートマップから「メイン島(横列)のXgroup高差枚台は機種角(522,513,512,539,
556,573,574,608,614)に集中している」と指摘。一つ前の配置期間(2026-02-07~05-08,
機種入替前)のXgroup日データで、is_type_edge(同一machine_nameのmachine_number範囲の
min/maxに該当する台)と機械割residual(機種名平均payout_rateを除去した値)の関係を検証した。

- 全体(grp_size>=3, n=243): 機種角 residual平均=+0.065(n=70) vs 非角=-0.026(n=173)
  ほぼゼロ、有意差なし
- AT・メイン島限定(n=133): 機種角 residual平均=**-0.259**(n=44) vs 非角=**+0.128**(n=89)
  Mann-Whitney p=0.505、非有意かつ符号が逆(機種角の方が低い)

ユーザー指摘の9台のうち6台(539,556,522,574,513,608)はresidual+1.0〜+11.5と高いが、
3台(512,573,614)はresidual-1.6〜-10.2と低い。AT・メイン島限定でもこの3台は変わらず
マイナス。573(北斗の拳転生の章2)はAT・メイン島の機種角の中でも最も低いresidual
(-10.2)であり、「機種角だから高い」という説明と正反対の実例。

## アクション
- ヒートマップで「角台が高く見える」という視覚的印象は、機種角という位置属性自体の
  効果ではなく、その機種固有の人気・回転率・導入時期などの要因による可能性が高い。
  機種角を独立した特徴量としてML/台選定に使う優先度は低い。
- 「N台中M台が当てはまる」型の部分的パターンを報告する際は、必ず**当てはまらない
  個体(この場合573,512,614)を明示**し、その個体が何によって説明されるかを
  別途分析すること。当てはまる個体だけを抜き出して法則化しない。
- 次の深掘り方向: 539/556/522/574/513/608(高residual6台)と512/573/614(低residual
  3台)を分ける要因として、x座標(メイン通路距離)、機種の導入時期(新台か否か)、
  機種人気度(games_sum)などを個別に確認する。

