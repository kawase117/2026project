# 差枚合計のQ5(最上位)は分散の大きい"ラッキー台"に汚染されており、day_scoreビニングでQ5の構成が大きく変わる。Q1(最下位)は構成が安定しており持続性が強い

## 背景
mitoya-day-score-binning-doubles-machine-number-persistence の追加検証として、
diff合計ベースのクインタイルとday_score(6分位)ベースのクインタイルで、Q5/Q1の
メンバーシップ重複率と、各クインタイルの日次diff標準偏差(diff_std)を比較した
(Xgroup, 3ヶ月window, 台番号別 n=1330)。

- Q5メンバーシップ重複率(diff-Q5 vs score-Q5): **43.1%** — 半分以上が入れ替わる
- Q1メンバーシップ重複率(diff-Q1 vs score-Q1): **74.4%** — 大部分は同じ台

- diff合計クインタイル別のdiff_std:
  q_diff=1:2188, q_diff=2:1972, q_diff=3:2134, q_diff=4:2341, **q_diff=5:3552**
  → diff合計のQ5だけ突出して分散が大きい(他の約1.6倍)。1〜2回の大勝ち日に
    依存している"ラッキー台"が混在している。

- day_scoreクインタイル別のdiff_std:
  q_score=1:2778 → q_score=5:2093 (単調減少)
  → Q1側は元々分散があまり大きくなく、構成が安定している。

これにより、mitoya-day-score-binning-doubles-machine-number-persistenceで観測した
Q5stay低下(0.328→0.282)・Q1stay上昇(0.307→0.339)の理由が説明できる:
- diff合計のQ5は"たまたま大勝ちした台"を多く含むため、次期にもQ5に残る保証がない
  (実力ベースのQ5に絞っても持続性は0.282程度と高くない)
- diff合計のQ1はもともと"安定して負けている台"の比率が高く、day_scoreでも
  ほぼ同じ集合になるため持続性が強まる

## アクション
- 「次回も大勝ちする台を当てる」予測は、Q5自体の構成が偶然性に汚染されているため
  根拠が弱い。一方「次回も大負けする台を避ける」予測はQ1の構成が安定しており、
  統計的根拠がより強い。台選定の優先度は**下位クインタイル台の回避**を軸にすること。
- diff合計ベースのQ5(最上位)を「強い台」として扱う際は、必ずその台のdiff_std
  (分散)も確認し、分散が他グループの平均より明らかに大きい場合は「1〜2回の
  大勝ちによる見かけ上の上位」である可能性を疑うこと。
- スクリプト: 本検証はアドホックなBash python -c実行(ファイル未作成)。再現する場合は
  eda/mitoya_dd_persistence_binned_diff.py の agg に q_diff/q_score の重複率・
  diff_std集計を追加すること。

## 例
```python
# Q5/Q1のメンバーシップ重複率を確認(period別に集合の積を取る)
q5d = set(g[g["q_diff"] == 5]["machine_number"])
q5s = set(g[g["q_score"] == 5]["machine_number"])
