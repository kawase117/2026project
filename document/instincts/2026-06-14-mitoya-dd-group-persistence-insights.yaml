# RB確率は機種別では持続性が極端に強く出るが、機種スペック差を反映しているだけでトートロジー。機種固定の残差では有意性消失

## 背景
「BBよりRBの方が設定差が大きい」という前提に基づき、rb_rate=sum(rb_count)/sum(games)
をXgroup・3ヶ月windowで台番号別/機種別に持続性検証した
(eda/mitoya_dd_persistence_rb_probability.py)。

- 機種別(n=248): RB確率rho=0.922(Q1stay=100%), BB確率rho=0.854 — 異常に強い
- 台番号別(n=1330): RB確率rho=0.480, BB確率rho=0.428
- 台番号別・機種効果除去後の残差: RB確率rho=0.045(p=0.099, 非有意),
  BB確率rho=0.018(p=0.511, 非有意)。差枚残差(rho=0.017)とほぼ同水準。

機種別rho=0.922は「機種ごとにRB確率の理論スペックが大きく異なる」という
当たり前の事実(トートロジー)であり、設定持続性ではない。機種を固定した残差では
RB確率の優位性は確認できなかった(差枚と同程度)。

## アクション
- RB確率/BB確率で「設定の強さの持続性」を検証する際は、**必ず機種を固定した
  比較**(同一機種内での台番号別比較、または機種固有の理論RB確率からの偏差)
  で行うこと。機種を跨いだ生のRB確率比較は機種スペック差にすぎない。
- ユーザーが「機種スペック一覧表(理論RB確率など)」を作成中。これが揃ったら、
  rb_rate / 機種理論RB確率 のような正規化指標で再検証すると、設定差を捉える
  本来の目的に近づける可能性がある。再検証時はこのyamlとスクリプトを参照。
- スクリプト: eda/mitoya_dd_persistence_rb_probability.py
  (機種スペック表ができたら正規化ロジックを追加して再利用)

