# 台番号別の持続性は機種効果でほぼ説明可能。機種別の持続性が圧倒的に強い

## 背景
mitoya-dd-x-group-persistence-top-stays-top の追加検証として、(1)期間長さの感度、
(2)曜日別グルーピング、(3)機種別(machine_name)集計、(4)機種効果を除去した台番号別
残差、の4パターンをXgroup(DD4/7/14/17/24/27)で検証した。

1. Window長さ感度(台番号別): 1ヶ月rho=0.050 → 2ヶ月0.095 → 3ヶ月0.123 → 4ヶ月0.112
   → 6ヶ月0.232。短期ほど弱く長期ほど強い傾向。6ヶ月は遷移数2と少なく不安定。
   3〜4ヶ月がサンプル数と効果検出のバランスとして妥当(「3ヶ月が最適」の根拠は弱い)。

2. 曜日別グルーピング(3ヶ月window, 台番号別): 全曜日でrho 0.02〜0.07程度、有意は
   金曜のみ(rho=0.071, p=0.010)。Xgroup全体(rho=0.123)より弱く、曜日ベースより
   DD(日付の日)ベースのグルーピングの方が持続性検出に有効。

3. 機種別集計(3ヶ月window, machine_name, 143機種): rho=0.415 (p<0.001),
   Q5stay=60.6%, Q1stay=35.3% — 台番号別(rho=0.123, Q5stay=32.8%)の3倍以上。

4. 機種効果を除去した台番号別残差(period×machine_nameの平均をdiffから引いた値で
   再クインタイル化): rho=0.017 (p=0.544), Q5stay=23.0%, Q1stay=21.9% —
   ほぼランダム(20%)と有意差なし。

→ 台番号別で見えていた持続性(rho=0.123)は、ほぼ全て「同じ機種が同じ台番号に
置かれ続けること」由来であり、台の物理的位置(角・通路側など)自体には持続性が
ほとんどない。

## アクション
- 「次回上がる台」を予測する際は、台番号ベースではなく**機種別の直近クインタイル
  ランク**を主要な特徴量とすること。台番号別特徴量は機種効果の代理変数になっている
  だけの可能性が高い。
- 台の位置効果(角・通路側など)を独立に検証したい場合は、必ず機種効果を除去した
  残差(period×machine_name平均をdiffから引く)で見ること。生のdiffで見ると機種効果
  に汚染されて偽の持続性が出る。
- Window長さは1〜6ヶ月で持続性の強さが単調ではないため、3ヶ月固定を前提にせず、
  複数window(2/3/4/6ヶ月)で頑健性を確認するのが望ましい。
- スクリプト: eda/mitoya_dd_persistence_extensions.py
  (section_window_sizes, section_weekday, section_machine_type,
   section_machine_number_residual)

## 例
```python
# 機種効果除去(period内でmachine_nameの平均をdiffから引く)
type_mean = agg.groupby(["period", "machine_name"])["diff_coins_normalized"].transform("mean")
agg["residual"] = agg["diff_coins_normalized"] - type_mean
# 残差でクインタイル化して再度Spearman/stay-rateを計算
```

