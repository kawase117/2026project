# 法則②スクリーニング(diff_std<median)は当日Q5到達率がランダム期待値を下回り、Q5選定の根拠としては逆効果

## 背景
mitoya-diff-std-machine-name-level-highly-persistentで「diff_std/payout_rateの
持続性は強い(rho=0.6-0.8)」と検証したが、その持続性を実際にQ5(当日上位クインタイル)
選定に使えるかをバックテストした(eda/mitoya_backtest_and_eventday_range.py)。

各Xgroup日について、その日より前の履歴(machine_name単位, n_days>=10)で
payout_rate>=100% & diff_std<medianの候補を選び、当日のクインタイルを確認した結果:
- n=906件(94日分)
- Q5到達率=0.107 (ランダム期待値0.200) ← 期待値の約半分
- Q4+Q5到達率=0.386 (ランダム期待値0.400) ← ほぼ期待値通り

機種別では新鬼武者3(top_rate=0.25)・スーパーブラックジャック(0.67,n=3)が高いが、
カバネリ(0.08)・モンキーターンV系は集計に出てこない(候補から外れているか低頻度)。

## アクション
- diff_std<medianフィルタは「分散が低い=安定」を選ぶため、定義上Q5(高分散側の
  上振れ)になりにくい台を選んでいる。法則②の「持続性が強い」という結果と
  「Q5選定に使える」は別問題であり、混同してはならない。
- 06/14の598/609推薦は「安定して稼働している機種」という保証はあるが、
  「Q5(爆益)になる」根拠としては支持されない。台選定の主目的が
  Q5(爆益)狙いであれば、このスクリーニングロジックは見直しが必要
  (例: diff_std上位かつpayout_rate上位、のような逆方向のフィルタを試すべき)。
- 新しいスクリーニングロジックを提案する際は、必ず本バックテストと
  同様の「事後Q5到達率 vs ランダム期待値」検証を行うこと。
