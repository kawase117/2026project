# Xのつく日(DD4/7/14/17/24/27)では台番号別差枚に弱い持続性があり、上位台が次期も上位に残る傾向

## 背景
2025-01〜2026-06のみとや大森町店データ(266台)を3ヶ月期間ごとに区切り、台番号別
diff_coins_normalized合計をクインタイル(5段階)化して期間間の遷移を確認した。

- 4group(DD4/14/24)単独: 全体Spearman rho=0.047 (p=0.086) — 有意な持続性なし
- 7group(DD7/17/27)単独: 全体Spearman rho=0.014 (p=0.614) — 持続性なし
- Xgroup(両者統合, 104日分): 全体Spearman rho=0.123 (p<0.001, n=1330) — 弱い有意な持続性

Xgroupでの継続率(ランダム期待値20%との比較):
- 前期Q5(最高)→次期Q5: 32.8%
- 前期Q1(最低)→次期Q1: 30.7%

最低クインタイルが次期に上位へ「逆転」する傾向は見られず、逆に上位・下位ともに
やや固定化する(基礎的な台の強弱が3ヶ月スケールで持続する)結果だった。

## アクション
- DD別個別グループ(4group/7groupなど)だけではサンプル日数(約9日/3ヶ月)が薄く
  ノイズに埋もれやすい。複数DDグループを統合(Xgroup)してサンプル数を確保すると
  傾向が検出しやすくなる。
- 「弱い台が次回は浮く」という逆転仮説をホール戦略の前提にする場合は要注意。
  実データでは「強い台は強いまま、弱い台は弱いまま」が優勢なため、台選定では
  直近3ヶ月の上位クインタイル台を継続ウォッチする方が期待値が高い可能性。
- クインタイル(5段階)+Spearman相関+継続率(stay rate)の組み合わせは、サンプルが
  数百件・期間数が5〜6程度の粗いデータでも傾向を検出できる軽量な分析手法として
  再利用可能。スクリプト: eda/mitoya_dd_persistence_analysis.py

## 例
```python
# 期間ごとにクインタイル付与
agg["quintile"] = agg.groupby("period")["diff_coins_normalized"].transform(
    lambda x: pd.qcut(x, 5, labels=False, duplicates="drop") + 1
)
# 継続率(前期Q5が次期もQ5である割合)
stay_rate = (merged.loc[merged["quintile_cur"] == 5, "quintile_next"] == 5).mean()
```

