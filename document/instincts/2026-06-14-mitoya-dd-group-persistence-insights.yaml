Q5回避フィルタとして機能することを確認した後、逆方向の戦略をXgroup94日で
バックテストした(eda/mitoya_backtest_and_eventday_range.py の
section_alternative_strategies)。

- 戦略1: diff_std>=median(高分散) & payout_rate>=100%
  n=1918, Q5到達率=0.306(期待値0.200), Q4+Q5=0.464(期待値0.400),
  Q1到達率=0.246(期待値0.200)
- 戦略2: payout_rate上位20%(分散フィルタ無し)
  n=1212, Q5到達率=0.274, Q4+Q5=0.450, Q1到達率=0.242

両戦略ともQ5到達率は明確に期待値超え、Q4+Q5も期待値超え。一方でQ1到達率も
わずかに期待値超えで、「大勝ちもするが大負けもする」高ボラティリティ型。

## アクション
- Q5(爆益)狙いの台選定では、法則②(低分散フィルタ)とは逆に「高分散かつ
  payout_rate>=100%」の機種を優先する方が有効な可能性が高い。
- ただしこれは事後的な単一バックテストであり、split-half等の頑健性検証は
  未実施。多重検定(法則②否定後に複数の代替戦略を試した)による偽陽性の
  可能性も排除できないため、信頼度は中程度(0.55)に留める。
- 06/14の598/609(法則②通過=低分散側)は、この知見に従えばQ5を狙う上では
  むしろ不利な選択。カバネリ502/506/510(diff_std高め)等の高分散側機種を
  優先する方向性が次の検証候補。
- 次のステップ: 戦略1をsplit-half(前半/後半)で再現性検証し、さらに
  「リスク許容度」をユーザーに確認した上で運用方針(法則②=安定志向 vs
  戦略1=Q5狙い)を選択する。
