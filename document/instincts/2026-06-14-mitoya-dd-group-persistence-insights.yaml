# 直前のentryで報告した「メイン通路側(x=3)ほど機械割が高い」は大部分が機種名効果の交絡

## 背景
直前のentry(mitoya-main-aisle-x-position-payout-effect)で、横列5セクションで
x座標とpayout_rateにrho -0.41〜-0.67(全てp<0.02)の相関を報告したが、
ユーザーから「物理配置より機種名の影響が大きいことは既にEDAで分かっている」との
指摘を受けて再検証した。

各machine_numberのpayout_rateから、同一section内のmachine_name平均を引いた残差
(機種名効果除去後)でx座標との相関を取り直した結果:

| section | n | 機種数 | raw rho | 残差rho | p値(残差) |
|---|---|---|---|---|---|
| 523-556 | 34 | 11 | -0.561 | +0.305 | 0.079 (符号反転・非有意) |
| 557-590 | 34 | 6 | -0.667 | -0.255 | 0.146 (非有意) |
| 591-623 | 33 | 8 | -0.457 | -0.208 | 0.245 (非有意) |
| 624-657 | 34 | 5 | -0.408 | -0.268 | 0.125 (非有意) |
| 658-691 | 34 | 3 | -0.586 | -0.504 | 0.002 (有意のまま) |

7セクション中6セクションで有意性が消失または符号が反転した。唯一658-691
(機種数3=最少)のみ残差でも有意。machine_name平均を除去すると「位置効果」の
大部分が消える=「機械割の高い機種ほど低x側に配置されている」という機種配置の
パターンを位置効果と誤認していた可能性が高い。

マイジャグラーV単独の分析(641-674)についても、674番が属する658-691側は
残差でも有意だが、641番が属する624-657側は残差rho=-0.268(p=0.125)で非有意
となり、当初の「x=3で102.7-102.9% vs x=19で99.5-99.6%」という主張のうち
624-657側は機種名効果込みの見かけ上の差である可能性がある。

## アクション
- machine_layoutの座標(x,y)とpayout_rate/差枚の相関を見る際は、**必ず
  machine_name(または機種カテゴリ)平均を除去した残差で再検証する**こと。
  rawの相関だけで「位置効果」を主張しない。
- 658-691のように機種数が極端に少ない(2-3機種)セクションでは、残差後も
  位置効果が残る可能性があるため、個別に深掘りする価値がある。
- 「メイン通路からの距離」を特徴量としてMLに追加する提案は、この交絡検証が
  終わるまで保留すること。直前entry(mitoya-main-aisle-x-position-payout-effect)
  はconfidenceを下げて参照すること(実質的に否定された)。

## 例
```python
type_mean = merged.groupby(['section','machine_name'])['payout_rate'].transform('mean')
merged['residual'] = merged['payout_rate'] - type_mean
rho, p = spearmanr(merged['x'], merged['residual'])
```

