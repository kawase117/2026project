# mitoya-kabaneri-corner-effect-consistent-512-current-top は誤り。5期間連続正の角効果は初代「甲鉄城のカバネリ」(692-700/813-815, バラエティ島, 2026-04-19撤去済み)についてのものであり、現在の501-512「甲鉄城のカバネリ 海門(うなと)決戦」(2026-03~稼働, メイン島)とは無関係

## 背景
ユーザーから「甲鉄城のカバネリにはスマスロ『海門決戦』と初代があり、混同しないように」
との指摘を受け確認。machine_detailed_resultsでは両者は別のmachine_name文字列
("甲鉄城のカバネリ" vs "甲鉄城のカバネリ 海門(うなと)決戦")として正しく区別されており、
machine_masterでも両方"other"(AT)に正しく分類されていた。

しかし、period別edge_effect検証(mitoya-kabaneri-corner-effect-consistent-512-current-top)
で「甲鉄城のカバネリ」としてn_periods=5・全期間正の角効果を観測したのは、

- 初代「甲鉄城のカバネリ」: 2025-01-01~2026-04-19稼働, 台番号692-700・813-815
  (バラエティ島セクション692-711・805-815) → 約15.5ヶ月=5期間(3ヶ月window)に合致

であり、現在の

- 「甲鉄城のカバネリ 海門(うなと)決戦」: 2026-03-02~現在稼働, 台番号501-514
  (メイン島セクション501-522)

とは**全く別の機種・別の物理位置**。海門決戦は稼働開始から3ヶ月程度のため
n_periods>=4のフィルタを満たさず、そもそもedge_effect検証の対象に含まれて
いなかった可能性が高い。

512番(海門決戦)の直近6ヶ月機械割=115.0%(12台中1位)という実測値自体は有効だが、
「機種固有の角効果が一貫して正だから角台512が強い」という根拠付けは誤り。
512番が現在のグループ内で1位である理由は、稼働開始から約3ヶ月のサンプル
(n_days=36程度)に基づく単一期間の結果であり、法則②(Q5は分散の大きい
ラッキー台に汚染されやすい)の対象になりうる。

## アクション
- machine_nameでgroupby/persistence検証を行う際は、**同一シリーズの初代/スマスロ版
  などで名称が分かれているケースに注意**し、各machine_nameがどの台番号・どの期間
  で稼働していたか(売却/撤去/新規導入のタイミング)を必ず確認すること。
  「同じ機種名だから過去の傾向が引き継がれる」と仮定しない。
- 稼働開始から3ヶ月未満(n_periods<2)の機種については、period別persistence/
  edge_effect検証の対象外とし、その機種の過去傾向を新台に適用しない。
- 512番(海門決戦)を候補とする場合は、mitoya-diff-sum-q5-is-contaminated-by-
  high-variance-lucky-machinesの観点で、単一期間の機械割115.0%が"ラッキー台"
  由来でないか(diff_std等)を別途確認すること。機種固有角効果という根拠は撤回。

