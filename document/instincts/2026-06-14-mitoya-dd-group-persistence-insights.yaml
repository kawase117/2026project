# 「機種角の強弱は機種ごとに異なる」仮説を検証: 甲鉄城のカバネリは5期間連続で角台residualが正(角効果が強い機種)。現在の角(512番)が現役グループ内で機械割1位

## 背景
mitoya-machine-type-corner-effect-not-supported-even-in-main-islands /
mitoya-9-machine-corner-sample-explained-by-individual-variance-not-common-factor
で「機種角」全体としての効果は否定されたが、ユーザーから「機種ごとに角効果の
強弱が違うのでは」との指摘を受け、AT機種ごとにperiod別edge_effect
(角residual平均-非角residual平均)の符号一致率を検証した(n_periods>=4の23機種中
11機種、Xgroup・3ヶ月period)。

- **甲鉄城のカバネリ**: 5期間全てでedge_effectが正 [+1.5,+5.8,+1.8,+2.0,+9.3]
  (二項検定 5/5, p≈0.03) → 角台が一貫して強い
- 東京喰種: 5/6が負 → 角台が一貫して弱い(避けるべき)
- ゴッドイーターリザレクション: 4/5が負
- モンスターハンターライズ: 4/5が負
- かぐや様/からくりサーカス/スマスロ北斗の拳/マギアレコード/モンキーターンV/
  戦国乙女4: 符号一致率50-67%(ランダムと有意差なし)

現在(Xgroup・直近6ヶ月、2026-06-07時点)の甲鉄城のカバネリは501-512の12台。
角(501,512)の平均機械割=108.97% vs 中央(502-511)=102.25%。
**512番は12台中1位(機械割115.0%)で、かつ角台**。501番は6位(102.9%)。

## アクション
- 「機種角」を特徴量として使う際は、機種全体で一律に扱わず**機種別に角効果の
  方向性(正/負/なし)を個別に評価**すること。甲鉄城のカバネリのように一貫して
  正の機種では角台を優先、東京喰種/ゴッドイーター/モンハンライズのように
  一貫して負の機種では角台を避ける。
- 2026/06/14(DD14, Xgroup, イベント日)のAT機候補として、**甲鉄城のカバネリ512番**
  (現役グループ501-512中1位・角台・角効果が一貫して正の機種)を新たな有力候補に
  追加検討すること。
- ただしn_periods=5(甲鉄城のカバネリ)は依然サンプルが少なく、二項検定p≈0.03も
  多重比較(11機種でテスト)を考慮すれば厳密にはボーダーライン。過信せず、
  既存の機種別persistence(法則①)と併用して判断すること。
- 他の機種(東京喰種・ゴッドイーター・モンハンライズ)が稼働中の場合、その角台
  (min/max番号)は避ける方向で検討する。

