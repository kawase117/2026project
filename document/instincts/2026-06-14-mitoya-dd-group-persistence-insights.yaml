# 日次差枚を6分位スコア化してから集計すると、台番号別の持続性が約2倍に向上する

## 背景
ユーザーの指摘(「設定は最大6段階、極端な大勝ち/大負けは偶然の影響が大きい」)に基づき、
Xgroup・3ヶ月windowでdiff_coins_normalizedをそのまま合計する代わりに、日次diffを
全体6分位(day_score=1〜6)に変換してからperiod内平均を取り、持続性を再検証した
(eda/mitoya_dd_persistence_binned_diff.py)。

- 台番号別(n=1330):
  - 差枚合計(従来): rho=0.123
  - day_score平均(6分位): rho=0.241 (約2倍)
  - adjusted_score平均(高回転×最悪ビンを中立化): rho=0.235
  - ただしQ5stay/Q1stayは逆転傾向: Q5stay 0.328→0.282、Q1stay 0.307→0.339
    (「上位継続」より「下位継続」の検出力が強まった)
- 機種別(n=248):
  - 差枚合計: rho=0.415 → day_score平均: rho=0.412 → adjusted_score平均: rho=0.431
  - 機種別では既に248台分の集計で平均化されているため、ビニングの効果は小さい

「高回転(games上位25%)×最悪ビン」への中立化補正(不発高設定仮説)は対象が
27,664日中563日(約2%)と少なく、結果への影響もrho±0.02程度で、この仮説単独の
検証にはサンプル不足。

## アクション
- 台番号別で差枚ベースの持続性が弱く出る場合、生の合計値ではなく日次diffを
  6分位スコア化(pd.qcut, N=6)してからperiod内平均を取る方法を試すこと。
  極端値の影響を抑えることで持続性検出力が大きく向上する可能性がある。
- ビニング後は「上位継続(Q5stay)」より「下位継続(Q1stay)」が強く出る傾向があるため、
  「次回も悪い台を避ける」予測の方が「次回も良い台を当てる」予測より精度が高い
  可能性を検討すること。
- 機種別分析では既に集計効果でノイズが平均化されているため、ビニングの優先度は低い。
- 「不発の高設定」補正(高回転×最悪ビン→中立化)は対象サンプルが少なく(約2%)、
  効果も小さいため、現時点では優先度低。機種スペック表が揃った後に再検証候補。
- スクリプト: eda/mitoya_dd_persistence_binned_diff.py

## 例
```python
# 日次diffを6分位スコア化(設定6段階を意識)
sub["day_score"] = pd.qcut(sub["diff_coins_normalized"], 6, labels=False, duplicates="drop") + 1
# period内で平均を取り、これを従来の合計の代わりにクインタイル化
agg = sub.groupby(["period", "machine_number"])["day_score"].mean().reset_index()
```

