# 高分散・高payout戦略のQ5到達率向上は前半/後半split-halfで再現。単一バックテストの偶然ではない

## 背景
mitoya-high-variance-high-payout-screening-improves-q5-rateで報告した戦略1
(diff_std>=median & payout>=100%)・戦略2(payout_rate上位20%)のQ5到達率向上が、
Xgroup104日を前半52日/後半52日に分割したsplit-halfでも再現するかを検証した
(eda/mitoya_backtest_and_eventday_range.py の section_alt_strategies_split_half)。

結果:
- 戦略1 Q5到達率: 前半0.336(n=755) / 後半0.285(n=1163) (期待値0.200) → 両半期で明確に超過
- 戦略1 Q1到達率: 前半0.269 / 後半0.231 (期待値0.200) → Q1も両半期で超過(ハイリスク性も一貫)
- 戦略2 Q5到達率: 前半0.283(n=459) / 後半0.268(n=753) (期待値0.200) → 両半期で超過
- 戦略2 Q1到達率: 前半0.248 / 後半0.238 (期待値0.200)

戦略1は戦略2よりQ5効果が大きいが、Q1も大きい(高分散フィルタがリスク・リターン
両方を増幅)。

## アクション
- 高分散・高payout戦略のQ5到達率向上(期待値比+30-68%)は単一バックテストの
  偶然ではなく、前半/後半で再現性のある安定したパターンと判断できる
  (信頼度0.55→0.7に上昇)。
- ただしQ1到達率も一貫して期待値超え(ハイリスク・ハイリターン)である点は
  変わらず、ローリスク運用には適さない。
- 法則②(低分散=安定)と本戦略(高分散=Q5狙い)は目的が異なる:
  「大負け回避」なら法則②、「Q5(爆益)期待値最大化、Q1リスク許容」なら
  本戦略(戦略1)を使う、という運用方針の二分化が妥当。
- 06/14の598/609(法則②=低分散側)は安定志向の選択であり、Q5を最優先する
  なら高分散側(カバネリ502/506/510等)を再検討する余地がある。
