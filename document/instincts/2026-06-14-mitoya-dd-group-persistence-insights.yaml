mitoya-machine-type-corner-effect-not-supported-even-in-main-islandsの追加検証。
9台(522,513,512,539,556,573,574,608,614)のうち、高residual6台と低residual3台
(512:-1.6, 573:-10.2, 614:-4.4)を分ける要因として、x座標(メイン通路距離)・
games_sum(稼働量/人気)・直近の機種変更からの経過日数を確認したが、いずれも
単調な関係は見られなかった。

- x座標: 573はx=3(「メイン通路側」)で最も悪い(-10.2)。539/574/608もx=3で
  良い(+1.0〜+11.5)。x=3内で-10.2〜+11.5の幅があり説明力なし。
- games_sum: 512が9台中最大(396,564)なのにresidual=-1.6。614が最小(226,955)でも
  residual=-4.4。573は中の上(336,815)で最悪(-10.2)。
- 機種別diff_std(2000〜4000程度)を考えると、residual ±10程度は1期間内の
  通常の分散範囲内に収まる。

## アクション
- 9台のような小規模(5-10台)サンプルから「共通の位置・属性要因」を探す前に、
  まず機種別diff_stdと比較して、観測されたresidualの幅が「通常の分散の範囲内」か
  どうかを確認すること。範囲内であれば、共通要因探索よりも単純なノイズと
  解釈するのが妥当。
- ヒートマップ上で「高く見える台」のリストアップは、視覚的な閾値(上位N台等)
  によるサンプリングバイアスを含むため、そのリストの中の外れ値(説明できない
  低residual台)を無視せず、リスト全体の説明力を評価すること。
- この系列(機種角・物理配置)の深掘りは、サンプルサイズ不足と一貫した説明変数が
  見つからないため、ここで一旦終了することを推奨。今後は機種別(machine_name)
  レベルの直近実績(mitoya-machine-type-persistence-dominates-machine-number)
  を主軸にした台選定に注力する方が生産的。

