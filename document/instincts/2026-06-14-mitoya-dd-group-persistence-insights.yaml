# 機種別持続性は差枚で最強、機械割では弱まる。差枚の強さは稼働量(人気)効果を含んでいる可能性

## 背景
Xgroup・3ヶ月windowで、台番号別/機種別それぞれに差枚合計・機械割
((games*3+diff)/(games*3)*100)・勝率(diff>0の日の割合)で持続性を比較した。

台番号別(n=1330): 差枚rho=0.123, 機械割rho=0.110, 勝率rho=0.131 — 3指標ほぼ同水準。

機種別(n=248, 143機種): 差枚rho=0.415(Q5stay=60.6%) > 勝率rho=0.360(Q5stay=32.7%)
> 機械割rho=0.242(Q5stay=43.1%)。3指標とも有意だが機械割が最も弱い。

## アクション
- 「機種別の強さの持続性」を主張する際、差枚ベース(rho=0.415)は最も強い結果だが
  人気機種=稼働量(games)が多いことの影響を含んでいる可能性がある。機械割ベース
  (rho=0.242)はより純粋な「設定の入りやすさ」に近い指標として、保守的な裏付けに
  使うこと。
- 台番号別では指標による差がほとんどない(rho 0.11〜0.13)ため、台番号別分析では
  差枚をデフォルト指標として使って問題ない。
- スクリプト: eda/mitoya_dd_persistence_metric_comparison.py
  (section_metric_comparison: machine_number/machine_name x diff_sum/payout_rate/win_rate)

