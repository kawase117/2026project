# 期間合計diff_sumは集計対象日数(約17日)分の積分値であり、1日あたりに換算すると印象より穏当な値になる。機械割に変換して評価すること

## 背景
mitoya-diff-sum-q5-is-contaminated-by-high-variance-lucky-machines の議論で、
Q1(最下位day_scoreクインタイル)のdiff_sum平均=-8707枚を「明らかに異様な大負け」
(高設定だが閉店まで負け続けた/新台で低設定でも常に回された、等の特殊事象)と
解釈する仮説が出た。しかし実際には diff_sum はXgroup・3ヶ月windowの集計対象日数
(n_days平均17.3日)の**合計**であり、1日あたりに換算すると:

q_score別 diff_mean(1日あたり)・games_mean(1日あたり)・払出率相当:
- Q1: diff_mean=-502, games_mean=3953 → payout_rate=95.49%
- Q2: diff_mean=+27,  games_mean=4255 → payout_rate=100.27%
- Q3: diff_mean=+287, games_mean=4747 → payout_rate=102.46%
- Q4: diff_mean=+552, games_mean=5022 → payout_rate=104.42%
- Q5: diff_mean=+844, games_mean=5598 → payout_rate=105.83%

1日あたり-502枚(3953G中)は機械割95.5%相当で、「特殊な異常事象」というより
「穏当な低設定相当」の範囲。Q3〜Q5も102〜106%程度で、「設定6グループ」と
呼べるような極端な分離(機械割114%超など)は確認できない。

また games_mean がQ1→Q5で単調増加(3953→5598)しており、day_scoreクインタイルの
上位ほど稼働量(人気)も高い ─ mitoya-payout-rate-weaker-than-diff-coins-for-machine-type
の知見(差枚の強さは稼働量効果を含む)と整合的。

## アクション
- diff_sum(期間合計)の絶対値だけで「異様な大負け/大勝ち」と判断しないこと。
  必ず n_days で割って1日あたりに換算し、可能ならgames_sumと合わせて
  payout_rate((games*3+diff)/(games*3)*100)に変換してから評価する。
- 「設定Nグループ」のような設定段階の呼称を使う際は、機械割の理論値
  (設定1〜6の理論payout_rate)と対比して、実際にどの設定相当かを確認すること。
  本データではQ1〜Q5の機械割は95.5%〜105.8%の範囲で、設定3〜4相当の差にしか
  見えない。
- 「高設定だが負け続けた」等の特殊シナリオを検出したい場合は、期間集計ではなく
  **日次レベル**でgames_normalizedとdiff_coins_normalizedの散布図・外れ値分析を
  行うこと(期間合計では希釈されて見えなくなる)。

## 例
```python
# 期間合計を1日あたりに変換してから評価する
agg["diff_mean"] = agg["diff_sum"] / agg["n_days"]
agg["games_mean"] = agg["games_sum"] / agg["n_days"]
agg["payout_rate"] = (agg["games_sum"]*3 + agg["diff_sum"]) / (agg["games_sum"]*3) * 100
```

