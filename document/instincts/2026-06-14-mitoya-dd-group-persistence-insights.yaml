# 近隣台番号間の「片方が落ちたらもう片方が上がる」代替効果は検出されない。有意に見えても多重比較の偽陽性に注意

## 背景
522番(マギレコ角台、ユーザーが「長く好成績」と認識していた台)を対象に、近隣台番号
(±5)との差枚クインタイル相関を3パターンで検証した。

- 3ヶ月window(n=6): 全ペア非有意 (検出力不足)
- 1ヶ月window(n=18, Xgroup): 522 vs 521 でrho=-0.517 (p=0.028) ※唯一有意な負の相関
- 日次差枚(n=525, 全日): 522 vs 521 はrho=0.001 (p=0.977) — 1ヶ月windowの結果が
  完全に消失。有意だったのは522 vs 520(rho=0.111, p=0.011), 522 vs 523(rho=0.091,
  p=0.038)で、いずれも**正の相関**(共通要因による同方向の動き)。

また522番自体は1ヶ月windowで Q1〜Q5 まで月によって大きく変動しており
({0:1,1:1,2:3,3:3,4:1,5:4,6:1,7:3,8:4,9:2,10:3,11:1,12:3,13:5,14:2,15:5,16:5,17:1})、
「長く好成績」という印象は直近の好調期間(period15,16)の影響が強い可能性がある。

## アクション
- 近隣台ペアでの代替/シーソー仮説を検証する際は、**複数の時間粒度(月次・日次)で
  整合性を確認**すること。片方のwindowだけで有意(p<0.05)でも、10ペア程度を
  テストすれば多重比較で偶然1つ出る確率は無視できない(期待値0.5)。
- 日次レベルで有意な近隣台相関は、ホールの資源配分(シーソー)ではなく
  曜日・客入り・イベント日などの**共通要因による同方向の動き(正の相関)**として
  現れやすい。負の相関(代替効果)を主張するなら日次レベルでも再現することを
  必須条件とする。
- 「長く好成績」という主観的な印象を検証する際は、必ず**月次/期間別の時系列**で
  実際の変動幅を確認する。直近の好調期間だけが記憶に残りやすいバイアスがある。
- スクリプト: eda/mitoya_522_neighbor_correlation.py

## 例
```python
# 日次ピボットで近隣台との直接相関(代替効果なら負相関が期待される)
pivot = df.pivot_table(index="date", columns="machine_number", values="diff_coins_normalized")
rho, pval = spearmanr(pivot[522].dropna(), pivot[521].dropna())
```

