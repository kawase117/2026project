# メイン島(横列)ではメイン通路側(x=3)の台ほど機械割が高く、バラエティ島(縦列)では位置効果なし

## 背景
machine_layoutテーブルを使い、Xgroup(DD4/7/14/17/24/27)の全期間で台番号別payout_rateを
計算し、section内のx座標(横列=メイン島)・y座標(縦列=バラエティ島)との相関を検証した。

きっかけは、マイジャグラーV(641-674, 624-657と658-691の2セクションに分割配置)で
x=3(641番・674番、ユーザーの言うメイン通路に接する側)の機械割が102.7-102.9%、
x=19(657番・658番、セクション境界側)が99.5-99.6%と明確に分かれていたこと。
これをホール全体に拡張して再現性を確認した。

### 横列(メイン島)6/7セクションで再現
| section | n | x vs payout rho | p値 |
|---|---|---|---|
| 501-522 | 22 | 0.101 | 0.654 (例外、x範囲1-22で他と異なる) |
| 523-556 | 34 | -0.561 | 0.001 |
| 557-590 | 34 | -0.667 | <0.001 |
| 591-623 | 33 | -0.457 | 0.007 |
| 624-657 | 34 | -0.408 | 0.017 |
| 658-691 | 34 | -0.586 | <0.001 |
| 805-815 | 11 | 0.436 | 0.180 (例外、n=11と小さい) |

x座標が小さい(x=3寄り=メイン通路側)ほど機械割が高い、という負の相関が標準的な
x範囲(3-19)を持つ5セクション全てでp<0.02と有意。

### 縦列(バラエティ島)3セクションでは位置効果なし
| section | n | y vs payout rho | p値 |
|---|---|---|---|
| 692-711 | 20 | 0.108 | 0.651 |
| 712-733 | 22 | 0.009 | 0.968 |
| 734-755 | 22 | -0.025 | 0.912 |

### メイン島 vs バラエティ島 全体比較
| group | mean | std | n |
|---|---|---|---|
| メイン(横列) | 101.78% | 2.99 | 202 |
| バラエティ(縦列) | 100.63% | 1.81 | 64 |

バラエティ島は平均機械割が低いだけでなく分散も小さく(std 1.81 vs 2.99)、
台ごとの設定差別化が少ない=高設定投入の優先度が低いゾーンである可能性を示唆。

## アクション
- 台選定モデルの特徴量に「メイン通路からの距離」(x座標、または機種固有のedge_distance
  ではなく、machine_layoutのx座標そのもの)を追加することを検討する。特にメイン島
  (横列, section ∈ {523-556,557-590,591-623,624-657,658-691})ではx座標と機械割に
  rho -0.41〜-0.67の強い相関がある。
- 501-522(x範囲1-22)と805-815(n=11)はこの傾向が見られない例外として扱い、
  x座標のスケール・レイアウト解釈が他セクションと異なる可能性を確認すること
  (要・追加レイアウト調査)。
- バラエティ島(縦列, section ∈ {692-711,712-733,734-755})では位置情報を特徴量に
  使う優先度は低い(rho≈0)。代わりに「バラエティ島か否か」自体が機械割が低めである
  ことを示す弱い特徴量になりうる。

