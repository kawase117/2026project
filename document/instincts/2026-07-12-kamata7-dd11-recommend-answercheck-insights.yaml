# ホール側は複数の候補軸を並べて「その日どれを活性化するか」でランダム性を演出している可能性

## 背景
2026-07-11(DD=11・土曜)の蒲田7で、統計的に独立検証済みの4つのTrack
（Track A: 2F Y=11/14/15行、Track C: 端番11バラエティ島2330-2351、
Track D: 端番9フロア横断12台、Track B: 3F A機イベント日）を推薦し、
DB更新後に答え合わせしたところ、全Trackが本日のホール平均(+148)を上回ったが、
- Track D(端番9)が突出（avg_diff+3389, hit104率66.7%）
- Track Cの「効果量最大」の目玉2340・2341は両方マイナス(-1200ずつ)
- 回避推奨だった2342(+3300)・2238(+4300)が逆に好走
という結果になった。過去データで頑健とされた法則ほど毎日的中するわけではなく、
逆に単発の推測に近かった端番9の方が今回は最も機能した。ユーザーの解釈：
ホールは複数の物理的候補（行・端番グループ・機種島など）を並列に持っており、
どの軸を「今日活性化させるか」を日替わりでランダムに切り替えることで、
客に法則を特定させない戦略を取っている可能性が高い。これは
[[feedback-statistical-certainty-calibration]]（非有意/小サンプルを効果なしと
断定しない）とも整合し、「頑健な法則＝毎回勝てる」という誤解を強める前に
言語化しておく価値がある。

## アクション
- 複数の独立検証済みTrack（行・端番・イベント日等）を持つ場合、単一の「最強」を
  過信せず、全Trackを並行して現地確認する運用を基本とする（今回の4Track推薦が
  結果的に良かった理由：どれか1つに絞っていたら大きく外していた可能性がある）。
- 台選び推薦を出す際は、必ず「効果量が高い法則＝今日も勝つ」ではなく
  「複数の候補軸のうちどれか1つ以上が今日ヒットする可能性が高い」という
  期待値ベースの説明に留める。断定的な「今日はこれが強い」は避ける。
- 答え合わせは推薦直後（同日）に必ず実施し、Track単位でavg_diffとhit104率を
  記録する。複数回の答え合わせが蓄積したら、Trackごとの的中率（月次移動平均）を
  比較し、恒常的に弱いTrackは推薦から外す判断材料にする。
- 「avoid」判定は台数が少ない場合（今回は2338/2342のペアで2台中1台が逆行）
  過信しない。avoidも複数根拠がない限り「弱め推奨」程度に格下げする。

## 例
2026-07-11の答え合わせ: 2272(端番9,+11700)・2343(端番9/端番11重複,+10000)・
2100(Y14行,+13100)・2279(Y11行,+11700)の4台が候補全体の利益の大半を占めた。
この4台は3つの異なるTrack（A/C/D）にまたがっており、単一の法則に絞っていたら
このうち一部しか拾えなかった。複数Trackを並行提示したことで結果的に
広くカバーできたことが、今回の推薦の成功要因だったと考えられる。
