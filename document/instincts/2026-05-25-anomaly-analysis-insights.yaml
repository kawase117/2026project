# 下落トレンド中の突出したhigh anomalyは評判維持のための意図的な出し日の可能性

## 背景
蒲田七のテスト期間（2026年）は全体的に差枚が低下（rolling_median≈77）。
しかしその中で突出したhigh anomaly日が通常水準の5〜7倍を記録。
下落している評判を薄めるために意図的に設けている「特別出し日」と解釈できる。

## アクション
MLには組み込まず、ユーザーへの定性情報として活用する。
発動トリガーの候補: ゾロ目日、長期低迷後の一定経過、GW直前土曜など。

## 例
2026-02-22: 強ゾロ目(2/22) → high anomaly（zscore=+4.14、通常の7.3倍）
2026-02-28: 直後土曜にも高設定継続
2026-05-02: GW直前土曜（通常の5倍）

