# 2%以下のアノマリー日はML特徴量ではなく運用ヒューリスティックとして扱う

## 背景
蒲田七の分析では全321日中9件（2.8%）がアノマリー日。
テスト期間143日中4件。現状hit@2が90%以上の状態で
アノマリー日をすべて正しく予測できても改善幅は1-2%未満。
特徴量として取り込むコストに見合わない。

## アクション
アノマリー日の知見は特徴量化せず以下の用途に使う:
1. 「3〜5週間に一度、高設定大量投入日がある」という定性的な補助情報
2. 予測外れ日の事後分析（なぜ外れたかの説明材料）
3. ユーザーへの「本日はアノマリー級の出し日の可能性」という注記

## 例
NG: is_near_anomaly_interval を ML 特徴量として追加 → サンプル不足で過学習リスク
OK: 「前回 high anomaly から5週間経過」→ ユーザーへの参考情報として表示

