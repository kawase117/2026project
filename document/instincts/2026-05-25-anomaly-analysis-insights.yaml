# アノマリーデータが10件未満の場合、1〜2例のパターンに意味を見出さない

## 背景
セッション内で「low anomaly翌週にhigh anomalyが発生」というパターンを
11/22→11/29の1例から提案してしまい、ユーザーに「再現性が低すぎる」と
正しく指摘された。9件のデータから1例では偶然と区別できない。

## アクション
アノマリーベースのパターン主張は最低5例、できれば10例以上を要件とする。
サンプル不足の場合は「可能性がある」ではなく「判断保留」と明示する。

## 例
NG: 「low翌週high」: 9件中1例 → パターンとして扱わない
OK: 「土曜集中」: 9件中6件（67%）→ 仮説として言及する価値あり

