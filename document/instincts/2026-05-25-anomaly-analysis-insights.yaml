# 探索的分析（EDA）はML特徴量設計の前に実施する

## 背景
今回は walk-forward 評価やモデル比較を先行させ、
アノマリー検出・生存時間分析・カイ二乗検定などの EDA を後回しにした。
EDA 先行なら window サイズ（roll7/14/28）や efficiency 列の除外判断を
より早い段階でデータに基づいて行えた。

## アクション
次回の ML プロジェクト開始時の順序:
1. アノマリー検出（ホール別 rolling IQR）
2. 曜日別・末尾別のカイ二乗検定
3. ACF/PACF で最適 lag/window 確認
4. 生存時間分析（高設定的中の周期性）
5. 以上を踏まえて特徴量設計 → walk-forward

## 例
# 推奨: EDA を先に実行して window_hint を確認する
python run_exploratory_analysis.py --db-glob "db/target_hall.db"
# → periodicity_comment と window_hint を特徴量設計前に参照する
