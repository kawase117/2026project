# 機種別の正答率格差は特徴量改善より信頼度シグナルとして扱う

## 背景
蒲田七の expert 別 hit@2:
- 2F_N: 95.1% (安定)
- 3F_N: 90.2% (安定)
- 3F_A: 76.9% (明らかに低い)
A型機種は大当たり1回で差枚が激変するため差枚ベースランク信号が構造的に弱い可能性。

## アクション
低 hit@2 の expert はまず原因調査（特定機種・台番号への集中か否か）。
構造的問題なら予測信頼度を低く設定してユーザーに明示する方針を選ぶ。

## 例
3F_A hit@2=76.9%:
NG: 全 expert 統合モデルで無理に改善を狙う
OK: UI上で「3F_A は参考予測（信頼度低）」として区別する

