# ローリング窓は下落トレンドに追随するためlow anomalyが検出されにくくなる

## 背景
蒲田七は開業直後から一貫して差枚が下落（rolling_median: 600→77）。
しかしlow anomalyは4件のみ。IQR境界も同時に下落するため
「既に低くなった基準からさらに外れる」ことが難しくなる。
GW月曜(2026-05-04, avg_diff=-280)は下限-299を上回り非検出。

## アクション
ローリング窓ベースのアノマリー検出は「直近baseline比の外れ度」を測る。
長期下落トレンドの絶対的な変化を捉えるには STL 分解などを別途検討する。

## 例
2026-05-04: avg_diff=-280, lower_bound=-299 → 非検出（下限が既に下がっている）
2025-09-01: avg_diff=-351, lower_bound=-149 → 検出（baseline がまだ高い時期）

