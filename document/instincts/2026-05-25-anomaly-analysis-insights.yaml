# アノマリー検出は単一ホールDBを明示指定すること

## 背景
run_exploratory_analysis.py のデフォルト --db-glob は "db/*.db" であり、
db/ 直下の全ホール（9ホール）を統合して分析する。
蒲田七は2025-07-07開業のため、他ホールのデータが混入すると
開業前データやzscoreが-22を超える極端な外れ値が混入し、
分析結果が完全に無意味になる。

## アクション
必ず --db-glob で対象ホールのDBファイルを明示指定する。

```bash
python ml/last_digit/exploratory/run_exploratory_analysis.py \
  --db-glob "db/マルハンメガシティ2000-蒲田7.db" \
  --reports-dir "ml/last_digit/reports" \
  --output-dir "ml/last_digit/exploratory"
```

## 例
誤: --db-glob "db/*.db"  → 9ホール統合、2025-04-21にzscore=-22.34の偽外れ値
正: --db-glob "db/マルハンメガシティ2000-蒲田7.db" → 蒲田七のみ、開業日2025-07-07から正しく開始

