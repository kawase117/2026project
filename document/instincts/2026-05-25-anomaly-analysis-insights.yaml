# 新規開業ホールのアノマリーは土曜日に集中する傾向がある

## 背景
蒲田七（2025-07-07開業）のアノマリー9件中6件（67%）が土曜日。
high/low 両方向とも土曜に集中。
来客数が最も多い土曜が店側の設定戦略の「見せ場」として機能している可能性。

## アクション
土曜日専用特徴量の有効性を複数ホールで横断検証した上で判断する。
蒲田七単独の9件では統計的根拠として不十分。

## 例
蒲田七の土曜アノマリー: 10/11(low,-187), 11/22(low,-251), 11/29(high,+413),
1/31(low,-331), 2/28(high,+516), 5/2(high,+386)

