# OR条件でのシグナル発動率は高すぎる — RB閾値にモンキー設定1が混入していたのが原因

## 背景
`diff_coins > 200 OR rb_prob > 1/300` のOR条件で実行すると発動率83.7%になる根本原因が判明した。
**モンキーターンV設定1のRB確率は 1/299 = 0.003344 であり、閾値 1/300 = 0.003333 をわずかに超える。**
つまり設定1台（最低設定）が毎日シグナル扱いになり、全末尾をシグナル末尾に汚染していた。

RB閾値を 1/258（設定4+）に修正した結果：
- 旧 1/300: signal 2703 / nonsignal 527 = **83.7%**
- 新 1/258: signal 2376 / nonsignal 854 = **73.6%**

それでも73.6%と高い理由は diff_signal（差枚>200）のOR条件が引き続き多くの日を捕捉するため。
diff閾値を上げるかAND条件にしない限り、OR条件での発動率は下がりにくい。

## アクション
```python
# 正しいRB閾値（設定4+を識別）
--rb-threshold 0.003876   # = 1/258

# モンキーターンV 設定別RB確率（設定3なし）
# 設定1: 1/299 = 0.003344  <- 旧閾値(1/300)を突き抜けていた！
# 設定2: 1/295 = 0.003390
# 設定4: 1/258 = 0.003876  <- ここから設定が良い
# 設定5: 1/235 = 0.004255
# 設定6: 1/222 = 0.004505

# 北斗の拳 設定別RB確率
# 設定1: 1/384 = 0.002604
# 設定2: 1/370 = 0.002703
# 設定3: 1/297 = 0.003367  <- 旧閾値で捕捉されていた（設定3は低設定）
# 設定4: 1/258 = 0.003876
# 設定5: 1/235 = 0.004255

# signal_rate チェック（常に確認する）
signal_rate = pair_counts['signal_pairs'] / (pair_counts['signal_pairs'] + pair_counts['nonsignal_pairs'])
if signal_rate > 0.7:
    print(f"WARNING: Signal rate {signal_rate:.1%} is very high -- consider tightening thresholds.")
```

## 例
```
モンキーターンV 設定1 (理論RB=1/299=0.003344) が rb_threshold=1/300=0.003333 を超える
-> 設定1の35台が毎日ほぼ全末尾でシグナル発火
-> nonsignal が全体の16%しか残らない（83.7%発動）

修正後 rb_threshold=1/258:
  signal:    2376 (73.6%)
  nonsignal:  854 (26.4%)
  -> まだ高いが原因の大半は解消
```

