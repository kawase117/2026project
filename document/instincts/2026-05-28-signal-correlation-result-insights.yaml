# 月曜日のみBH補正後有意（p_adj=5.8e-5） -- 木曜ネガティブはノイズだった

## 背景
RB閾値を正しい 1/258 に修正した上での曜日別結果（BH補正後）：

| 曜日 | delta(旧1/300) | delta(新1/258) | p_adj(新) | 有意 |
|------|--------------|--------------|----------|------|
| 月   | +183.5        | +182.1        | 5.8e-5   | YES  |
| 水   | +168.4        | +136.2        | 0.125    | --   |
| 土   | +103.4        | +92.8         | 0.203    | --   |
| 木   | -64.2         | +8.6          | 0.797    | --   |
| 日   | +28.7         | -9.7          | 0.834    | --   |
| 金   | -9.1          | +13.8         | 0.724    | --   |
| 火   | +30.1         | +12.5         | 0.724    | --   |

重大な修正が2つある：
1. **木曜のデルタ -64枚はモンキー設定1/2のノイズだった。**
   1/258 に閾値を上げると木曜は +8.6（ほぼゼロ）に消える。木曜の逆転効果を信じた判断は取り消し。
2. **日曜の +28.7 もノイズ。** 1/258では -9.7 に転落。
   （signal_multi_tail_2fn での日曜60%は別分析なので矛盾しない）

月曜は閾値に関わらず安定して有意（p_adj 0.0017 -> 5.8e-5 とさらに強化）。

## アクション
```python
# 修正済み運用判断ロジック（signal_machine_correlation ベース）
if target_weekday == "月曜日" and signal_active:
    confidence_boost = +20  # 月曜は実証済み（p_adj=5.8e-5, delta+182）
elif target_weekday in ["水曜日", "土曜日"] and signal_active:
    confidence_boost = +5   # 境界的傾向あり、軽微な上乗せのみ
else:
    confidence_boost = 0    # 木曜ネガティブは削除（ノイズだった）

# 廃止された判断（コメントアウトして記録）
# elif target_weekday == "木曜日":
#     confidence_boost = -10  # [廃止] rb_threshold=1/300のモンキーノイズ起因
```

## 例
```
月曜日に末尾2でモンキーターンVが好調:
  -> 末尾2の他機種も平均+182枚期待 (BH補正後 p=5.8e-5)
  -> 非常に信頼性が高い（閾値修正後も結論変わらず）

木曜日に末尾4でスマスロ北斗が好調:
  [旧・誤った解釈] デルタ-64枚の逆転傾向 -> 信号を信じるな
  [新・正しい解釈] ほぼニュートラル（+8.6枚）-> 特別なペナルティ不要
  -> ノイズだったため、木曜のシグナルは他の曜日と同じ扱いでよい
```

