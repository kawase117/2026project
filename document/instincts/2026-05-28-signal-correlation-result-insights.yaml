# RB閾値は 1/300 ではなく 1/258（設定4+）が正しい

## 背景
旧来の `rb_threshold = 1/300 = 0.003333` はモンキーターンVの設定1（1/299）を捕捉してしまう。
北斗の設定3（1/297）も捕捉する。いずれも低設定であり、シグナルとして使いたい設定ではない。

両機種ともに「設定4以上」が意味のある設定で、その閾値が 1/258 = 0.003876 となる。
閾値修正により rb_signal_only の delta が +65.8 から +77.8 に改善し、p値も1桁向上した。

## アクション
```python
# 正しいデフォルト値（signal_machine_correlation_analysis.py の引数）
--rb-threshold 0.003876   # = 1/258 = 設定4+

# さらに絞る場合（設定5+）
--rb-threshold 0.004255   # = 1/235

# 機種別設定目安
MONKEY_SETTINGS = {1: 1/299, 2: 1/295, 4: 1/258, 5: 1/235, 6: 1/222}  # 設定3なし
HOKUTO_SETTINGS = {1: 1/384, 2: 1/370, 3: 1/297, 4: 1/258, 5: 1/235}
THRESHOLD_SETTING4_PLUS = 1 / 258   # 両機種で設定4以上を捕捉

# signal_multi_tail_2fn.py の fixed mode でも同様
--signal-source rb --signal-mode fixed --rb-threshold 0.003876
```

## 例
```
旧閾値 1/300 での結果（蒲田七）:
  rb_signal_only: delta +65.8, p=4.97e-7, signal_n=124,340

新閾値 1/258 での結果:
  rb_signal_only: delta +77.8, p=1.05e-8, signal_n=35,985
  -> deltaが+12枚改善、p値が1桁向上
  -> signal_n が 71% 減（低設定ノイズ除去）
```

