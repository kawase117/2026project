# fake_tail_checkで真正信号かフェイクかを判定できる

## 背景
「ホールが信号機種だけ特定末尾に集中設定し、その末尾を他の末尾と区別している」
（= 真正信号）と、
「信号機種は別の末尾に入れて見せかけだけ良くしている」（= フェイク末尾）
を区別するには `build_fake_tail_check` の delta を見る。

実行結果（蒲田七、rb_threshold=1/258）：
```json
{
  "signal_tail_avg_diff": 189.0,
  "nonsignal_tail_avg_diff": 126.4,
  "delta": 62.6
}
```
signal_tail > nonsignal_tail -> 信号末尾全体に恩恵がある -> **真正信号**。

## アクション
```python
fake_check = payload['fake_tail_check']
delta = fake_check['delta']

if delta > 30:
    interpretation = "真正信号（その末尾全体に設定が入っている）"
elif -30 <= delta <= 30:
    interpretation = "曖昧（フェイクかもしれない）"
else:  # delta < -30
    interpretation = "フェイク末尾の可能性が高い"
```

## 例
```
蒲田七の結果 (rb_threshold=1/258):
  signal_tail_avg_diff:    189.0
  nonsignal_tail_avg_diff: 126.4
  delta: +62.6 -> 真正信号

フェイク末尾シナリオ（仮想）:
  signal_tail_avg_diff:    150.0
  nonsignal_tail_avg_diff: 160.0
  delta: -10.0 -> 信号末尾は特に良くない = フェイクの可能性
```

