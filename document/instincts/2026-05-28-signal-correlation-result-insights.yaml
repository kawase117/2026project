# RB確率シグナルの方が差枚シグナルより統計的に安定（閾値修正後さらに明確）

## 背景
signal_machine_correlation_analysis.py の蒲田七結果（rb_threshold=1/258 で補正済み）：

| シグナル種別 | delta | p値 | signal_n |
|------------|-------|-----|---------|
| diff_signal_only | +71.8 | 8.88e-4 | 149,745 |
| rb_signal_only   | +77.8 | 1.05e-8 | 35,985  |
| signal_or        | +62.8 | 2.88e-3 | 152,799 |

RBシグナルのdeltaが差枚シグナルを上回り（+77.8 vs +71.8）、p値は4桁小さい。
旧閾値(1/300)では rb delta=+65.8 だったが、設定1/2ノイズ除去で+77.8に改善した。

差枚は「その日の短期ノイズ」を反映しやすく日内変動に引きずられる。
RB確率は「設定の直接指標」であり長期的に安定した信号になる。

## アクション
```python
# 優先順位付き評価
if signal_rb:
    priority = "高"
    reason = "RBシグナルあり（設定4+の直接指標、p=1.05e-8）"
elif signal_diff:
    priority = "中"
    reason = "差枚シグナルのみ（短期ノイズの可能性、p=8.88e-4）"
else:
    priority = "低"
    reason = "シグナルなし"

# rb_threshold は必ず 1/258 以上を使う（モンキー設定1ノイズ対策）
RB_THRESHOLD = 1 / 258  # = 0.003876
```
RBシグナルが確認できない日の差枚シグナルは参考値として扱う。

## 例
```
RBシグナル (1/258以上) が出た末尾の他2FN機種: 平均 +77.8枚, p=1.05e-8
差枚シグナルのみ (>200枚) の末尾の他2FN機種: 平均 +71.8枚, p=8.88e-4

-> 差枚は数値が近いが信頼性は4桁低い
-> RBシグナルを優先ターゲットにする
-> 旧閾値1/300では rb=+65.8 だったが、1/258補正で+77.8に向上
```

