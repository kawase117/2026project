# signal_machine_correlation_summary.jsonの正しいキー構造

## 背景
実際の出力JSONのキーは `overall_stats` や `weekday_stats` ではなく、
`signal_or`, `diff_signal_only`, `rb_signal_only`, `fake_tail_check` など。
間違ったキーでアクセスすると None が返って解釈を誤る。
曜日別統計はJSON**ではなく** `signal_machine_weekday_stats.csv` に出力される。

## アクション
```python
import json, pandas as pd

with open("signal_machine_correlation_summary.json", encoding="utf-8") as f:
    d = json.load(f)

# 正しいキー
d['signal_machines']        # ["スマスロ北斗の拳", "モンキーターンV"]
d['signal_condition']       # {"diff_threshold": 200.0, "rb_threshold": 0.003876, "rb_direction": ">"}
d['pair_counts']            # {"signal_pairs": N, "nonsignal_pairs": N}
d['diff_signal_only']       # {signal_mean, nonsignal_mean, delta, p_value, signal_n, ...}
d['rb_signal_only']         # {signal_mean, nonsignal_mean, delta, p_value, signal_n, ...}
d['signal_or']              # {signal_mean, nonsignal_mean, delta, p_value, signal_n, ...}
d['fake_tail_check']        # {signal_tail_avg_diff, nonsignal_tail_avg_diff, delta}

# 曜日別はCSVファイルで別途読む
weekday_df = pd.read_csv("signal_machine_weekday_stats.csv")
# columns: day_of_week, signal_n, nonsignal_n, signal_mean, nonsignal_mean, delta, p_raw, p_adj, reject_fdr_bh
```

## 例
```python
# 間違い（None が返る）
d.get('overall_stats')   # -> None
d.get('weekday_stats')   # -> None
d.get('correlation')     # -> None

# 正しい（rb_threshold=1/258 の結果）
d.get('rb_signal_only')  # -> {'signal_mean': 234.9, 'delta': 77.8, 'p_value': 1.05e-8, ...}
d.get('fake_tail_check') # -> {'delta': 62.6, ...}
```

