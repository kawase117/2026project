# 蒲田7/蒲田1 イベント日定義 — 5カテゴリ完全版

## 背景
`eda/core.py` の `HALL_EVENT_DIGITS` にDD21が欠落、月末がハードコード(30,31)、
強ゾロ目(MM=DD)が `is_x_day` に未統合だった。ユーザーが複数回指摘しても
繰り返し不完全な定義が使われていた。2026-06-19に修正。

正しい定義:
- 7のつく日: DD 7, 17, 27
- 1のつく日: DD 1, 11, 21, 31
- ゾロ目: DD 11, 22
- 強ゾロ目: MM=DD (月==日: 1/1, 2/2, ..., 12/12)
- 月末: 月の最終日（動的計算、28/29/30/31）

`is_x_day` = DDリスト OR is_month_end OR is_mmdd_zorome

## アクション
- イベント日を言及するとき、5カテゴリすべてを確認する
- `eda/core.py` の `is_x_day` 計算が3条件ORであることを前提にする
- 2026-06-19以前のInstinctのイベント日関連数値は不完全な定義で計算されている点に注意
- 蒲田1も同一定義

## 例
修正前: HALL_EVENT_DIGITS["蒲田7"] = [1, 7, 11, 17, 22, 27, 30, 31]  # DD21欠落、月末ハードコード
修正後: HALL_EVENT_DIGITS["蒲田7"] = [1, 7, 11, 17, 21, 22, 27, 31]  # + is_month_end + is_mmdd_zorome

