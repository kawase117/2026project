# 蒲田7理論ドキュメントの設計判断

## 背景
2026-06-19に `document/kamata7_theory.md` を作成。grill-meで以下の設計を確定:
- 目的: 理論理解(B)がメイン、台選びチートシート(A)は副産物
- 構造: 変数の効果と限界を中心軸に、セグメント構造を前提、罠をアンチパターンとして整備
- 確定知見と運営仮説（user-ground-truth由来）を明確に分離
- 否定された仮説はインライン注記+罠セクションの両方に配置(方式C)
- 台選びフローは固定優先順位ではなく条件分岐（通常日/DD11/DD30/イベント日）

Codexレビューで以下を修正:
- 3F_R_N: 「死亡セグメント」→「結論衝突中」に格下げ
- 曜日: EDA再現済み事実と運営仮説を分離
- イベント日: 定義を5カテゴリで固定、過去EDAの不完全定義を警告

## アクション
