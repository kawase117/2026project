# 蒲田7の代表的鉄台 = 台番号2026

## 背景
台番号2026は蒲田7における代表的な鉄台（恒常的に強い台）。
末尾・角番の統計検証では鉄台が偽シグナルの主要因であり、
特に2026は2F_Lの末尾d6シグナルに影響を与えうる位置にある。

## アクション
- 末尾・角番の検証では台番号2026を除外して再検定する
- 鉄台判定基準: pos_rate>=60% or median>=0
- 台番号2026は具体的な個別除外対象としてスクリプトに明示すべき

## 例
df_clean = df[df["machine_number"] != 2026]  # 鉄台除外
# または汎用的に:
tetsu_mask = (df.groupby("machine_number")["plus"].transform("mean") >= 0.6)
df_clean = df[~tetsu_mask]

