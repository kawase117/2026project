# 5日分の滞留変更は「日付」でなく「意味的なまとまり」でコミットを分割する

## 背景
7/11から7/16まで5日分、19ファイルの修正+新規スキル4個+instinct約24本+最終レポート+日次予測記録が未コミットのまま滞留していた。これを1コミットにまとめると、後からgit blame/git logで特定の変更(例: win_rateのNaNバグ修正)を追跡できなくなる。実際には「スキル追加」「dashboardバグ修正」「新ホール設定追加」「EDAスクリプト群」「最終レポート」「セオリー文書更新」「instinct+振り返り」「予測記録」「gitignore整備」「スクレイパー刷新」という10種類の性質の異なる変更が混在していた。

## アクション
1. `git diff --stat`と`git status --porcelain`で全体像を把握した後、ファイルパスの種類・変更の意図でグルーピングする(日付ではなく「機能単位」)
2. pre-commitフックがruff-formatで一部ファイルを自動整形する場合、コミットが一度失敗してstashされることがあるため、失敗後は再度`git add`して同じメッセージでコミットし直す
3. 巨大な一括コミットの前に、ルート直下に紛れた事故ファイル(空ファイル・一時txt・error.log等)がないか`git status`の`??`行を確認し、gitignore対象なら`scratch/`等へ退避してからコミットする
4. コミットメッセージは「何を変更したか」だけでなく、複数ファイルにまたがる場合は代表的な変更内容を箇条書きで残す(後から見て意図が分かるように)

## 例
本セッションでは以下の順でコミットを分割した: スキル追加(f990a22)→dashboardバグ修正(8593e79)→楽園設定追加(448f785)→EDA群(c40be83)→最終レポート(97d6060)→セオリー文書(2f4a76a)→instinct+roadmap(5a3af52)→予測記録(adbe0f9)→gitignore(66aaa84)→スクレイパー刷新(7ab21de)。合計11コミットで意図が追跡可能な状態にした。

