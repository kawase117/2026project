# codex:rescue経由のCodexはread-onlyサンドボックスで動作し、ファイル書き込み・修正適用ができないことがある

## 背景
anasloスクレイパーの静的レビューをCodexに委任したところ、調査自体は正常に完走し高品質な指摘(5点の保守リスク)を返した。しかし続けて同じ指摘に基づく修正実装を依頼したところ、「read-only sandboxで書き込みがアクセス拒否される」というエラーで一切のファイル変更が適用できなかった。調査レポート自体をscratch/へ書き出す指示も同じ理由で失敗し、レポート本文はCodexの応答テキストとして受け取るしかなかった。`--write`フラグを付けても状況は変わらず、`--resume-last --write`で同一スレッドを継続しても同様だった。CLIバージョンやモデルgating([[codex-model-requires-newer-version-error-is-often-account-gating-not-cli-version]])とは別の制約。

## アクション
1. Codexへの委任は「調査・レビュー・診断」に限定し、結果はstdout経由のテキストとして受け取ってからClaude側でファイル化する(Write toolで代行)
2. 修正の実装自体は、Codexが返した具体的な指摘(ファイル・行番号・修正方針)を踏まえてClaude側で直接実装する方が、サンドボックス制約に阻まれず確実
3. 書き込みが必要な場面で最初から失敗するリスクを避けるため、大きな実装をCodexに一括委任する前に、軽量な書き込みテスト(例: 一行だけのファイル作成)で書き込み可否を先に確認するのも一案
4. 恒久対応が必要なら、Codexデスクトップアプリ/CLI側のサンドボックス設定(~/.codex/config.tomlの[windows] sandbox項目やプラグインの実行モード)を見直す必要があるが、本セッションでは未解決のまま

## 例
`document/JUGGLER_SETTING_PREDICTION_FINAL_REPORT.md`相当の詳細調査はCodexが正常に返せたが、`scraper/anaslo_scraper_auto.py`の5点修正依頼は「実装はブロックされました。現在の環境が read-only で...」という応答のみで、実際のコード変更はClaudeが直接Edit toolで行った(7ab21de)。

