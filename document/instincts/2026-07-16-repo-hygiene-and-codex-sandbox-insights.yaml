# UTF-8→cp932誤解釈による文字化けは「UTF-8→cp932エンコード→UTF-8デコード」の再変換で復元できる

## 背景
CLAUDE.mdがセッション開始時に必ず参照される最重要ファイルであるにもかかわらず、日本語部分が「AI繧｢繧ｷ繧ｹ繧ｿ繝ｳ繝医∈」のような記号列に化けていた。git logで履歴を遡ると、7/10の一括コミット(b908bfb)時点で既に化けており、それより前(6/23時点)はクリーンなUTF-8だった。原因は「UTF-8で書かれたファイルをcp932(Shift-JIS系)として誤って読み込み、そのままUTF-8で再保存した」という典型的な二重誤変換。この場合、化けたバイト列を`line.encode("cp932").decode("utf-8")`で再変換すると、化ける前の正しい日本語がほぼ完全に復元できる(本セッションでは全70行中37行が「元から正しい」か「部分破損で再変換不可」でそのまま保持、残りは復元成功)。ただし一部の行はcp932に存在しない文字(半角カナの拡張領域や機種依存文字)を含み、エンコード時にUnicodeEncodeErrorで復元不可だった。

## アクション
1. 文字化けを発見したら、まずgit historyで「いつから化けているか」をコミット単位で特定する(`git show <commit>:<file> | grep -c "繧\|縺\|繝"`のようなマーカー文字カウントで機械的にスキャン可能)
2. 化ける前の直近クリーンなコミットのファイルを土台にし、化けた期間中の意味のある差分(セクション追加等)だけを手動で再適用する方が、バイト単位の逆変換より確実で安全
3. バイト単位の逆変換(`encode("cp932").decode("utf-8")`)を行毎に試す場合、UnicodeEncodeError/DecodeErrorが出た行は「そのまま復元」とみなし、人間が最終確認する
4. .gitattributesやエディタの自動エンコーディング検出に頼らず、UTF-8 with BOMかどうかも含めて`open(path,"rb")`でバイト先頭を確認してから対処する

## 例
`git show 0f7d34f:CLAUDE.md`(6/23、クリーン版)を土台に、7/10以降に追加された「Python実行環境の固定」セクションと削除された「Intermind連携」セクションだけを手動反映し、CLAUDE.mdを復元した(07a0f4d)。

