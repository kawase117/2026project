# フェイク末尾は中間設定(3〜4)を数多く並べ、設定5〜6を入れない。二値フラグ数で末尾を順位づけると本命と取り違える

## Core claim
ホールは本命の末尾だけに高設定を入れると狙いが露骨になり他の台が回らないため、
別の末尾に**中間設定(3〜4)を多めに**入れて狙い所を隠す（ユーザーの現場知識、2026-08-06提示）。
フェイク末尾には設定5〜6が入らない。したがって「設定4以上フラグの台数」で末尾を順位づけると、
**フェイク末尾がしばしば1位になる**。本命は台数が少なくても設定5級の突出台を含む。

## Evidence
- n_observations: 1日（2026-08-05、蒲田1ジャグ 各末尾9〜10台）
- data scope: single-hall（マルハンメガシティ2000-蒲田1）
- metric scope: 設定事後平均 E[s|rb,g]（一様事前、1〜6の連続量）、RB残差（観測RB確率 −
  同ファミリー通期平均、1000Gあたり回数換算）、平均差枚
- result summary: @999999Q9Q は末尾②と末尾⓪を仕掛けと報告。実測は下記。
  - 末尾0: フラグ率0.44 / **設定事後平均3.80(1位)** / RB残差**+0.61** / 差枚+622
  - 末尾2: フラグ率0.50 / 設定事後平均3.63(2位) / RB残差+0.42 / 差枚**+1,000**
  - 末尾3: フラグ率**0.60(最多)** / 設定事後平均3.35(4位) / RB残差**+0.11** / 差枚**+10**
  - 台別（事後平均の上位）: 末尾0 = 2300 **5.36**(RB1/205)・2310 **5.03**(RB1/232)、
    末尾2 = 2202 **5.14**(RB1/221)・2252 4.38、
    末尾3 = 2313 4.39・2283 4.19・以下 3.74/3.72/3.68/3.64 で**設定5級ゼロ**
  - 通期(2026-05-01〜08-05)でも末尾3はフラグ率0.351(10末尾中2位)に対し、フラグが立った台の
    平均差枚は+593.8(下から2番目)。末尾5はフラグ率0.375(1位)で高台差枚+758.9(1位)

## Interpretation
- 「フラグが立った台に限定した事後平均が低い」だけでは根拠にならない。フラグ率が高いほど
  閾値付近の台を多く拾うので**機械的にそうなる**（selection効果）。決定的なのは
  **群全体**のRB残差・事後平均・差枚が低いことと、**設定5級(事後4.5超)が1台も存在しない**こと。
  この2つは selection では説明できない
- ユーザーの明示的な留保: **これはブレがあり、毎回同じ形になるとは限らない**。
  設定4を数台入れただけの末尾がたまたま伸びる日も、本命末尾の設定5が沈む日もある。
  単日のパターンを恒常ルールとして推薦ロジックに組み込まない
  （`kamata1-tail-attribute-split-single-day-caution` と同じ留保）
- `diff-vs-consistency-rank-gap-decoy-diagnostic`（diff順位 vs hit104率/勝率順位のズレ）とは
  診断器が別。あちらは結果指標同士の順位比較、こちらは RB からの設定推定量。
  **RB由来の方が結果のブレに強い**ので、ジャグではこちらを優先する
- ATにはこの診断は使えない。ATには RB スペックがなく、かつハーフ456で設定4主体のため
  別の測り方が要る（`2026-08-06-at-highsetting-needs-multi-threshold-not-hit104`）

## Action
1. 末尾の順位づけに**二値フラグ（設定4以上）の台数を使わない**。設定事後平均 E[s|rb,g] と
   RB残差（観測RB確率 − 同ファミリー通期平均）で並べる
2. フェイク判定の署名は3点。すべて**群全体**の量で見る。
   (a) フラグ率は上位だが RB残差・設定事後平均が中位以下
   (b) 設定5級（事後4.5超）の突出台が存在しない
   (c) 群全体の平均差枚が伴わない
3. 本命末尾は「設定5級が確実に混じっている末尾」として探す。台数の多寡では決めない
4. 単日で確定しない。同じ末尾が複数日にわたって繰り返しフェイク側に出るかを追跡してから
   運用ルール化を検討する。事前登録するなら「フラグ率上位 かつ RB残差が中位以下の末尾は
   フェイク」を判定式にして `backtest/prereg/` に切り、フォワードで検証する

