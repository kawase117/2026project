# 周期性は統計的に検出されないが、ACF lag=4 が微弱シグナル

## 背景
correction テーブルの時系列に対する統計検定：
- Ljung-Box 最小 p値 = 0.1917（有意差なし）
- ランズ検定 p = 0.7047（符号のランダム性を棄却できず）

ただし ACF で |acf| >= 0.2 の有意 lag = [4] が検出。

## アクション
- 「6ヶ月周期」「季節周期」は統計的に **棄却**
- lag=4 は営業日パターン（週4日営業など）の可能性、または偶然
- **結論：ホール側は周期的な大戦略ではなく、短期トレンドの微調整を採用**
- 120日訓練で直近パターンをキャプチャすれば十分

## 例
```
ホール側の行動モデル（推測）：
  「周期的に全戦略を変更」 ← 棄却
  「短期（1～2週間）ごとに末尾別投入を調整」 ← 支持

含意：
  correction テーブルは「過去の偶発」ではなく
  「ホール側の最近の判断パターン」を反映している
```

