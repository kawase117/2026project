# ゾロ目効果は「脆弱なランダムノイズ」ではなく「ホール側の選別的投入」の可能性

## 背景
62日テスト期間で B > A（ゾロ目優先が有効）となった日は **わずか 9日（14.5%）**。

しかし、これらの 9日の勝利幅は極めて大きい：
  合計 +29,269 枚 / 9日 = 平均 +3,252/日

一方、残りの 53日（85.5%）は B ≤ A（効果なし、または逆効果）。

## アクション
解釈は2つある：
1. **ランダムノイズ説**：効果は不安定で信頼性低い
2. **選別的投入説**：ホール側が「いつゾロ目に投入するか」を選別している

**次ステップで判定：** B > A だった 9日の correction_direction を確認
  - prefer_zorome に 7～9日 集中 → 選別的投入説 支持
  - ランダム分布 → ノイズ説 支持

## 例
```
検証方法：
df_win = phase1_daily[phase1_daily['strategy_B_mean'] > phase1_daily['strategy_A_mean']]
print(df_win['correction_direction'].value_counts())

期待値（選別的投入説）：
  prefer_zorome: 7～9
  avoid_zorome: 0～1
  no_data: 0～2
```

