# Correction の符号は「反転」ではなく「持続」する

## 背景
3つの参加条件戦略（同一 expert×digit で参加可否のみ変化）を比較：
- D（correction>0 末尾優先）：mean_diff_per_calendar_day = +690.323, coverage 74.2%
- E（correction<0 末尾回避）：mean_diff_per_calendar_day = +295.161, coverage 74.2%
- F（correction<0 末尾を逆張り）：mean_diff_per_calendar_day = -9.677

D > E > F で明確な順序。特に F がほぼゼロ。

## アクション
- 「ホール側が対策を打つと符号が反転する」という仮説は **棄却**
- correction の符号は「過去」と「未来」で一貫
- **戦略：correction>0 の末尾を積極的に狙う（D）が最有効**
- **非推奨：correction<0 の末尾を狙う（F）は避ける**

## 例
```
過去実績（訓練期間内）：
  末尾0: ゾロ目avg=1200, 非ゾロ目avg=700
  correction = +500 (prefer_zorome)

推奨戦略：
  テスト期間でも末尾0を狙う（符号持続）

非推奨：
  末尾0を避ける（反転期待 → F の失敗で棄却）
```

