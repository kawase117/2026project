# 訓練期間 120日 がゾロ目補正テーブルの最適値

## 背景
複数の訓練期間（60, 90, 120, 180, full）でゾロ目戦略シミュレーションを実行した結果、
B（ゾロ目優先）vs A（ランダム）の期待差枚が、訓練期間に対して ∩ 型（山型）の曲線を示した。

- 60d:  +256.887 枚/機
- 90d:  +230.067 枚/機
- 120d: +286.340 枚/機 ← **最大**
- 180d: +191.779 枚/機
- full: +27.659 枚/機

訓練期間が長すぎると古いホール戦略パターンがノイズになり、
correction テーブルの信号が希薄化する。

## アクション
- 訓練期間は **120日に固定** を推奨
- 月次で更新する際は「テスト開始日より 120日前までのデータ」を使用
- 180日以上の全期間訓練は避ける（最悪パフォーマンス）
- 新規テスト期間でも同じ訓練窓を使用（walk-forward ではなく expanding window の場合）

## 例
```python
# 推奨: 120日 expanding window
test_start = datetime(2026, 5, 27)
train_end = test_start - timedelta(days=1)
train_start = train_end - timedelta(days=120)
df_train = df[(df['date'] >= train_start) & (df['date'] < test_start)]

# 非推奨: full 訓練
df_train = df[df['date'] < test_start]  # 1年以上含む → signal 希薄化
```

