# Correction テーブルの信号強度は訓練期間に依存し、診断が必須

## 背景
weekday × last_digit × group_key の3次元 correction テーブル：
- 訓練期間 60日：セル埋め率が低 → correction==0 が多い
- 訓練期間 120日：最適な埋め率と信号強度
- 訓練期間 180日以上：古いパターンが混在 → 信号希薄化

## アクション
correction テーブル生成時、必ず以下を診断出力：
1. **埋め率**：NA でない correction セルの %
2. **信号強度**：correction 値の分布（平均、std、min、max の絶対値）
3. **データ密度**：各セルあたりの平均観測数（n_zorome + n_nonzorome）

これらの診断がないと、「信号か、ノイズか」の判定ができない。

## 例
```
期待される診断出力（120日訓練時）：
  Correction Table Diagnosis:
    Cell fill rate: 52.1% (146/280 cells)
    Signal strength:
      mean |correction|: 187.5
      std: 125.3
      min: 1.2, max: 687.4
    Data density (per cell):
      avg observations: 7.2
      min: 3, max: 22

解釈：
  埋め率 52% → 適度（高すぎると古パターン混在）
  signal mean 187.5 → 有意な信号あり
  avg obs 7.2 → 最小サンプル数（5, 10）を満たす
```

