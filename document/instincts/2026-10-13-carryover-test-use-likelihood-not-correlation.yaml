# 据え置きの検定は日別相関でなく、BB・RBの尤度を使う隠れマルコフ模型で行う

## Core claim
1台1日のBB・RBは偶然のぶれが大きく、設定の信号に対して信頼度が低い（実測でノイズ分散が全体の97%）。日別の相関（lag1 +0.06）や「前日に強かった台の翌日の平均」では、実在する据え置きを見逃す。BBとRBを別々の証拠に使い、「確率stayで前日と同じ設定、1-stayで事前から引き直し」とする隠れマルコフ模型の尤度比検定が、はるかに検出力が高い。

## Evidence
2026-10-12、みとやのジャグラー84台。
- 日別の相関とその補正は、補正後の持続率が1.88と1を超え、使えなかった。「前日に強い台」の翌日も +0.10 対 +0.03（弱い差）で、一度「一般的な据え置きは確認できない」と誤答した。
- 隠れマルコフ模型でstay=0.20、独立との尤度比 2ΔLL=33.3（約5.8σ）。前半 0.15、後半 0.25 で再現。マイジャグラーVが主。台固定を許しても残る（p=6e-7）。
- ユーザーは据え置きを以前から実務で知っていた。ユーザーの示唆を、検出力の低い検定で否定してはならない。

## Action
1. 据え置き・持ち越しは `stay`（据え置き確率）を持つ隠れマルコフ模型で、独立（stay=0）との尤度比検定を行う。BB・RBは別々に、合算しない。
2. 台ごとの高設定になりやすさθ（台固定）を許した模型でも、stayが残るかを確かめる（日替わりか台固定かの区別）。
3. 結果は前半・後半で再現するかを見る。台ごとの値（θ）は選択の影響を受けて再現しないことがある（ゴーゴー3は誤スペックだったが、台別の定位置は前後半で再現せず）。
4. 「有意でない」「相関が小さい」から「効果なし」と結論しない。検出力が足りない検定は、観察を続ける扱いにする。
