# AT機の据え置き仮説は前日の高設定を確認できず検証不能。蒲田7のSBJで「前日不調→翌日反転」の傾向も過去にない

## 背景
2026-09-18 蒲田7のスーパーブラックジャック（SBJ、2302-2305の4台）で、前日（9/17）に差枚がマイナスだった
2303（-1400）・2304（-1600）・2305（-1900）が翌日に +7900・+7900・+3000 になった。
前日好調の2302（+3700）は -1300 だった。ユーザーは「前日不調だった高設定台が据えで入れられた」可能性を指摘した。

確認できたこと:
- SBJ は AT機で、ボーナス確率では設定を判別できない（`bonus_specs` の judgeable=False）。
  前日に高設定だったことを示す手段がなく、据え置き仮説は検証できない。
- 蒲田7のSBJ過去3,520台日（2025-07〜2026-09、1,500G以上）で、前日差枚 -1000 以下の台の翌日は
  平均 +340・プラス率45%・+3000以上18%。無条件は +392・45%・19%。反転傾向は存在しない。
- 9/18 は島平均 +4375 で、3台以上稼働した402日のうち上から4番目。予告（GALAXYウスイ「全は攻殻機動隊とSBJ」）
  どおり全台系の日だった場合も同じ結果になり、据え仮説と区別できない。

## アクション
1. AT機で前日不調→翌日大勝ちを見ても、据え置きの根拠にしない。前日の設定が分からないので、据えと「その日が全台系だった」を区別できない。
2. 据え仮説を検証するなら、前日のRB確率が判別できる機種（ノーマル・BT・A+AT）で
   「前日RBが強いのに差枚が沈んだ台は、翌日もRBが強いか」を過去全期間で測る。台選びに使うのはその結果が出てから。
3. 「前日不調台は翌日に払い戻される」を一般則として使わない。蒲田7のSBJでは反転も無く無条件と同じで、楽園の台粒度でも継続せず反転寄りと測定済み（`carryover-exists-at-model-level-not-machine-level`）。ホール・機種が違うので数値は統合しない。
4. 単日の島平均が上位の日は「その日に島へ設定が入った」で説明できる。前日との関係を作らない。

## 例
NG: 「前日不調のSBJ 3台が翌日反転した。据えで高設定が入っていた」
OK: 「SBJはAT機で前日の設定が不明。過去3,520台日でも前日不調の翌日は平均+340で無条件と同じ。9/18は島全体が強い日で、据えかどうかは区別できない」

