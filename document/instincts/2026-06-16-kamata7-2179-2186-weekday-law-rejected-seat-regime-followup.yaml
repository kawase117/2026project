# セクション2179-2186の「日曜が強い」曜日法則は機種2180/2182の2台に依存し棄却。「木曜が弱い」のみ残存

## 背景
差枚ベースのEDAで kamata7 2F セクション2179-2186 に「日曜が最良・木曜が最悪」という
曜日効果が見つかり、機械割ベース(hit_rate_104/mean_excess_pct/分布形状)で再検証した。

1. 機械割ベースでも mean_excess_pct / hit_rate_100 で日曜>木曜の順序は再現した
   (Sun mean_excess=-0.93が最良、Thu mean_excess=-7.10が最悪)。
2. 「広く浅く(Sun) vs 狭く深く(Wed)」という分布形状仮説を立てたが、
   share_100_104/share_104_plusの実測では支持されず、Sunは分布全体が
   右シフトしているだけ(レベルシフト、形状シフトではない)。
3. median_payoutrate_pctでSun/Thuともfull_sig(q<0.01)だったが、
   split-halfでは前半non-sig・後半sigのみで stable=false。
4. 機種台数別の集中度チェックで、Sunday効果は機種2182(q=0.007)と
   2180(q=0.010)の2台にほぼ集中(top_machine_share=0.30)。
   この2台を除外するとSun delta=+1.5, q=0.25(non-sig)に低下。
   Thu delta=-2.96, q=0.021(sig)は除外後も残存。

## アクション
1. セクション/フロア全体の曜日法則を主張する前に、必ず台別delta×qの
   表を作り、top1-2台を除外して再検証する。本ケースのように
   「セクション法則」が実は2台の現象であることが多い。
2. 「Thu弱い」は機種除外後も残る唯一の安定成分。今後このセクションで
   曜日を特徴量に使う場合、Thuフラグ単独の弱さ(diff_coins/機械割とも
   negative)として扱い、Sun強さは特徴量化しない。
3. 分布形状仮説(broad-shallow vs narrow-deep)はこのデータでは再現
   しなかった。曜日差は「分布のレベルシフト」として扱う方が単純で
   妥当(p10〜p95が全体的に上下にシフトするだけ)。

## 例
```python
# セクション内の台別曜日deltaを必ず確認してから法則を主張する
per_machine = df.groupby(['machine_number','weekday_label']).agg(
    median_pr=('payoutrate_pct','median'), n=('payoutrate_pct','size'))
# top1-2台を除外して再集計し、qが消えるかを確認
```

