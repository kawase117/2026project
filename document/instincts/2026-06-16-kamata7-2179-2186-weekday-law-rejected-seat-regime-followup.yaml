# 台2180/2182は2025-12-22前後でmachine_nameが変わったが、変更後の2機種(SHAKE BONUS TRIGGER→不二子BT)双方でSundayが突出して強くなる共通パターンが見られた(要追加検証・n小)

## 背景
[[kamata7-2179-2186-weekday-law-rejected-thu-weak-survives]] のSunday法則は
台2180/2182の機種交代(2025-12-22)によるレジーム変化として説明されたが、
詳細を見ると単純な「新機種の特性」では説明しづらい:

- 2180: エヴァ(〜12/21, Sun median=100, share_104+=0.35)
  → SHAKE(12/22〜, Sun median=106.0, share_104+=0.60)
  → 不二子BT(Sun median=105.3, share_104+=0.62)
- 2182: エヴァ(〜12/21, Sun median=100.5, share_104+=0.35)
  → SHAKE(Sun median=104.1, share_104+=0.54)
  → 不二子BT(Sun median=104.3, share_104+=0.50)

エヴァ期はSundayは他曜日と大差ない平凡な値だったが、12/22以降は
**SHAKE→不二子BTという全く異なる2機種の両方で**、同じ台番号(2180/2182)
だけSundayが他曜日(median 87-99)より明確に高い(104-106)。

機種が変わっても座席単位でSunday特性が維持される=「機種の特性」では
なく「この2座席×2025-12-22以降の期間」固有の現象である可能性がある。
ただし各セルn=8-15と小さく、ノイズの可能性も高い。

## アクション
1. 機種交代を含むセクション/台の法則を「機種固有の特性」と結論づける前に、
   交代前後で同じ台番号の曜日パターンが「機種を問わず」共通かどうかを
   確認する。機種を問わず共通なら「座席×期間」の現象として扱う。
2. 2180/2182の「2025-12-22以降のSunday強さ」は n=8-15/セルと薄いため、
   現時点では法則化しない。他の台でも2025-12-22前後でSunday特性が
   変化していないか(ホール全体の運用変化の有無)を確認できれば、
   座席固有か全体傾向かを区別できる。これは次のアクション候補として
   保留する。
3. 全体として、このセクション(2179-2186)の曜日深堀りはROIが低下して
   いるため、これ以上の細分化(weekday×DD、台別除外の繰り返し)は
   避け、他の軸(セクション、DD単独など)に切り替えることを推奨する。
