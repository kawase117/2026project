# 列（島）の台数はセクション単位で定義する

## 背景
2026-06-17: `kamata7_kakuban_colsize_eda.py` で `column_size` を
「同じX座標を持つ台数」（X集計）で定義していたが誤り。
X=1 に12台いても複数セクションが同じX位置にあるだけで列は複数本。

## 正しい定義
`column_size = section_max - section_min + 1`

## アクション
座標CSV（`floor_coordinates_*.csv`）を使って列サイズを計算するときは
`coords["column_size"] = coords["section_max"] - coords["section_min"] + 1`
を使う。`coords.groupby("X").size()` は列サイズではない。

## 影響範囲
- `kamata7_kakuban_colsize_eda.py`: 修正済み（2026-06-17）
- `kamata7_short_split_eda.py`: X集計ベースのため廃棄
- `kamata7_colsize_lr_confound_check.py`: X集計ベースのため廃棄
- colsize と L/R の交絡確認は正しい colsize で再実施が必要

