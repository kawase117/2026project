# 角番分析における列長さコンファウンドとL/R分割の必要性

## 背景
蒲田7の角番分析では、左側フロア（L: X≤17）と右側フロア（R: 2FはX≥19、3FはX≥23）という
空間的な左右分類自体は有効だが、L/R 両側の正確なセクションサイズ分布は再計測が必要。
従来の「左側は7〜14台の不均質列、右側は14〜17台の均質列」という理解は、
column_size を X 集計で定義していた誤りに基づいていた。

## アクション
角番分析を実施する前に座標CSVのX座標でL/R分割を行い、
空間的なR側（右側）とL側（左側）を分けて分析する。
分割後は縦列（section内でX.nunique()==1）を除外してから渡す。

L/R判定のXしきい値（蒲田7）:
- 2F: X ≤ 17 → L、X ≥ 19 → R
- 3F: X ≤ 17 → L、X ≥ 23 → R

除外対象縦列: 2187-2195、3191-3208、3209-3217、3400-3401

## 例
```python
def assign_side(floor: str, x: float) -> str:
    if floor == "2F":
        return "L" if x <= 17 else ("R" if x >= 19 else "E")
    elif floor == "3F":
        return "L" if x <= 17 else ("R" if x >= 23 else "E")
    return "E"

# 縦列除外
sec_x_span = df.groupby("section")["X"].nunique()
vertical_sections = sec_x_span[sec_x_span == 1].index
df = df[~df["section"].isin(vertical_sections)].copy()
```

