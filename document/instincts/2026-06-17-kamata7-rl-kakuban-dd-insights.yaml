# 2F_L_N では角番6が4つのDDビンで繰り返し最強

## 背景
2F_L_N（左側AT系）のDD-bin分析で、5ビンのうち4ビンでtop_kakuban=6:
- DD 1-6: 角番6（q=0.00068）
- DD 7-12: 角番14・末尾（q=0.00038）← 孤立した例外
- DD 13-18: 角番6（q=0.14）← 有意なし
- DD 19-24: 角番6（q=0.00019）
- DD 25-31: 角番6（q=0.00043）
L側最長14台列では角番6＝前半、12台列では中間に相当。

## アクション
2F_L のAT系を見る場合、DD 7-12 を除く月間を通じて各列の6番目台（section_min + 5）を優先候補にする。
DD 7-12 の末尾台（角番14）は孤立パターンで確信度低め。

## 例
section 2115-2128（14台）の6番目台 = 2115 + 5 = 2120（section_min + 5）
