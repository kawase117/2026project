# mean/median逆符号セルは外れ値駆動で実用価値が低い

## 背景
蒲田7 L/R分析のTask 2で確認。以下の2セルでmean正・median負が発生:
- 3F_L_N kakuban=8 × DD18: mean=+936, median=-53, n=145（非負72/負73）
- 3F_L_A kakuban=8 × DD19: mean=+324, median=-92, n=158（非負73/負85）
どちらも特定台・特定日付に集中した少数の大きな正側残差がmeanを引き上げており、
Kruskal-Wallisは有意でも実務的な安定シグナルとして使えない。

## アクション
角番EDAのcell-vs-rest結果で mean_residual と median_residual が逆符号の行は
実用シグナルとして使わず「外れ値駆動の疑い」フラグを付ける。
確認が必要な場合は上位外れ値の台番号・日付を引いて確認する:
```python
suspect = eligible[(eligible["kakuban"]==8) & (eligible["dd"]==18)]
print(suspect.nlargest(5, "residual")[["machine_number","date","residual"]])
print(f"非負: {(suspect['residual']>=0).sum()} / 負: {(suspect['residual']<0).sum()}")
```

## 例
外れ値が特定日付（2025-12-18、2026-04-18等）に集中 → ホール戦略ではなく台固有の大当たり偏りの可能性。

