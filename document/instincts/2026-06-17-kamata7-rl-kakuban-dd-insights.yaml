# 高角番シグナルは22台列1本依存の罠

## 背景
蒲田7では2F・3Fともに22台の大型セクション（2330-2351 / 3341-3362）が各1本だけ存在する。
角番18〜22のサンプルは全てこの1セクションからしか来ない。
「角番19が強い」という結果は「この1列の19番目が強い」と等価で、
構造的な位置シグナルとして使えない。Task 1で実確認済み（sections=1）。

## アクション
角番分析の結果でtop_kakuban ≥ 18が出た場合、必ずセクション分散を確認する。
```python
subset = eligible[eligible["kakuban"].eq(kakuban_val) & eligible["dd_bin"].eq(bin_label)]
print(subset["section"].value_counts())
```
sections=1なら「1列の特定ポジション観測」に格下げし、構造的シグナルと区別して注記する。
R側の均質列でもkakuban=17〜22は22台列1本依存になりやすいので注意。

## 例
3F_R_A で DD 1-6 / 7-12 / 25-31 の top_kakuban=19-20 は全て section=3341-3362 のみ。
同フロアの DD 19-24 の top_kakuban=9 は 5セクションに分散 → こちらが構造的シグナル。

