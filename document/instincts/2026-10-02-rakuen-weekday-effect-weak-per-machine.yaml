# 楽園蒲田の機種×曜日の効果は、機種ごとに直接検定すると弱い。比べる指標は機械割(RBは判別可能機種)

## 背景
旧記録(rakuen-machine-strength-returns-by-weekday)は、機種×曜日の傾向が改装前後で再現する(r=+0.193、全曜日をまとめた相関)と書き、天膳の水曜などを例に挙げた。
その後、ユーザーの指摘で検定の設計を直した(改装後のデータだけで、機種ごとに7曜日それぞれを他の曜日と単純に比べる。最も高い曜日の差を、曜日ラベルの入れ替え3000回で「7曜日のうち最大」として検定し、機種数でBH補正)。
- 機械割(全機種、改装後、40日以上・各曜日5日以上の55機種): p<0.05は2機種(偶然なら約2.8)、補正を通る機種は0。天膳の水曜は+12.0pp、p=0.053。東京喰種の金曜は、曜日を先に選んだ単発の検定でp=0.035だったが、7曜日の最大にするとp=0.31。
- RB確率(ノーマル12機種+BT8機種=20機種、回転数帯を2000G刻みで揃える): 補正を通るのはアレックス ブライトの月曜(+23.1%、p=0.008)とスマスロ サンダーVの水曜(+16.1%、p=0.019)の2機種で、3台と6台。ネオアイム(66台)、マイジャグ(20台)など大型機種は曜日差なし。ノーマル+BT全体のRB確率は曜日でほぼ一定(1/351〜1/364)。
- ホール全体の構造は出ている: 土日は台あたり回転数が多く(土4533G、日3777G。平日は2900〜3300G)、機械割は低い(土100.3%、日100.1%。平日100.8〜101.3%)。
- 設計の教訓(ユーザー指摘): 改装前で強い曜日を選び改装後で検定する設計は、「その機種が特定の曜日に強いか」という問いから外れていた。改装後のデータで、各曜日を単純に比べる。

## アクション
- 機種×曜日を事前確率に使わない。使うなら、補正を通った機種(アレックス月曜、サンダーV水曜)に限り、3〜6台なので台別に確認してから。天膳の水曜、東京喰種の金曜は候補止まり。
- 曜日で比べる指標は、機械割(差枚を回転数の3倍で割った値)。判別可能なノーマル/BTはRB確率(回転数帯を揃える)。差枚で比べない(差枚=3×回転数×(機械割-1)で、回転数が増える土日は低設定ほどマイナスに伸びる)。
- 強い曜日を後から選ぶときは、「7曜日のうち最大の差」を入れ替え検定にして、機種数でBH補正する。単発の検定のpを使わない。
- 2台しかない機種は、「3台以上の日」の条件で落とさない(同時稼働台数の最大に合わせる)。

## 例
backtest/monthly_report_*.py ではなく、探索スクリプトとHTMLレポート(Artifact)で実施。再現するなら、同じ手順(改装後のデータだけ、機械割とRB確率、7曜日の最大で検定)を毎月更新する。
