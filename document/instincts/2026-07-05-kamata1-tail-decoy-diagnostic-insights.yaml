# diff順位とhit104率/勝率順位のズレでdecoy(飾り)台とquiet-strong(地味な本命)を切り分ける

## 背景
2026-07-04蒲田1の1日分析で、ジャグラー/非ジャグラー別に末尾0-9のhit104率・勝率・平均差枚(diff)を算出し、
3指標間の順位を比較した。diffは少数の大勝ち台に引っ張られやすく外れ値駆動になりやすい一方、
hit104率・勝率は広い範囲で一貫した優位性を反映しやすいという性質の違いに着目した診断法。

ユーザーの現場観察（末尾2=ジャグラー起点、末尾7=非ジャグラー起点の三台並び）と突き合わせたところ、
diff順位で目立つ末尾（例: 非ジャグラー末尾9）がhit104率・勝率では下位に沈む一方、
diff順位では地味な末尾（例: 非ジャグラー末尾7・8）がhit104率・勝率では上位という逆転が見られた。

## アクション
- 末尾（または任意の属性軸）ごとにdiff順位とhit104率/勝率順位(平均)を算出する
- ズレ幅 = 平均(hit104率順位, 勝率順位) − diff順位 を計算する
- ズレ幅がマイナスに大きい（diff順位の数値が大きい＝diffでは目立たないのにhit104/勝率では上位）末尾は
  quiet-strong（地味だが本当に効いている）候補として注目する
- ズレ幅がプラスに大きい（diffでは上位なのにhit104/勝率では下位）末尾はdecoy候補とし、
  単日データでは「本当に高設定」と即断しない（少数の大勝ちに引っ張られている可能性が高い）
- 重要な留保: 単日ではdecoy/quiet-strongの判定は成立しない。複数日・複数曜日にわたって
  同じ末尾が繰り返しdecoy側/quiet-strong側に現れるかを追跡して初めて、
  意図的なカムフラージュ戦術なのか単なる分散のブレなのかを識別できる。

## 例
蒲田1 2026-07-04・非ジャグラー系:
- 末尾9: diff順位2位だがhit104率順位7位・勝率順位9.5位 → decoy疑いが最大
- 末尾7: diff順位5位（目立たない）だがhit104率1位・勝率1位 → quiet-strong候補
- 末尾8: diff順位9位（ほぼゼロ差枚）だがhit104率5.5位・勝率2位 → 7よりもさらに地味なquiet-strong候補

