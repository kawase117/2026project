# 蒲田1「ジャグラー0-4/非ジャグラー5-9」末尾分割はその日限りの入れ方であり恒常ルールと確定してはいけない

## 背景
2026-07-04蒲田1で、ジャグラー系末尾0-4・非ジャグラー系末尾5-9に高設定が入っているように見える
パターンが観測された（三台並びの現場観察起点）。上記の[[diff-vs-consistency-rank-gap-decoy-diagnostic]]による
数値検証でも部分的にこの見立てを支持する結果が出た。

しかしユーザーは明確に「これは恒常ルールではなく、この日たまたまこの末尾に設定が入っていただけ」と述べ、
「必ずしもこうなるとは思っていない」と念押しした。decoy検出手法自体は検証価値があるが、
そこから導かれる「その日の傾向」を将来の台選択・推薦ロジックに固定ルールとして組み込むのは誤り。

## アクション
- 単日の末尾×属性(ジャグラー/非ジャグラー等)パターンを、次回以降の推薦ロジックや
  pachinko-session-recommend等の運用スキルに機械的に組み込まない
- decoy-gap指標（diff順位 vs hit104率/勝率順位のズレ）を複数日・複数曜日にわたって蓄積し、
  同じ末尾グループが繰り返し同じ側（decoy/quiet-strong）に出るという再現性を確認して
  初めて運用ルール化を検討する
- 再現性確認が取れるまでは「今回はこう入っていた」という単発の観察事実として扱い、
  ホールの恒常戦略であるかのように断定的に説明しない
