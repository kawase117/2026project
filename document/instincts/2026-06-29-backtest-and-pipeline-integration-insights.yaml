# みとやのセクション×日パイプラインはキャリブレーションは有効だが収支は限定的

## 背景
みとやで蒲田7と同じ2段階パイプラインを60日バックテスト。
セクションスコアのキャリブレーションはrho=+0.205（蒲田7の+0.172より強い）。
しかし収支面では蒲田7ほど強くない:

section_5x5（24台/日）: 累積差枚+80,191、勝率50.0%（蒲田7は+545,700、76.7%）。
原因: みとやは全266台（蒲田7は714台）、セクションあたり9-22台で、
セクション内の台選び（Stage 2）でのノイズが大きい。

みとやの座標ファイルのsection列は既に横列分離済みで、section×y分割は不要。
mitoya_theoryのsection×y注意は旧machine_layoutテーブルへの注意であり、
座標ファイルの18セクション定義は正しい。

## アクション
- みとやではセクション×日パイプラインの収益改善は蒲田7ほど期待できない
- セクションスコア自体は有効（rho=+0.205）なので「どのセクションに行くか」の情報としては価値がある
- 台数が少ないため小規模選択（section_1x3）が安定

## 例
みとやバックテスト（60日）:
  section_1x3 (3台/日):  cum=+17,126
  section_5x5 (24台/日): cum=+80,191, W/L=30/30
  section_10x3 (30台/日): cum=-132,682 ← 大規模はマイナス

