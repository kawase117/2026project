# 蒲田7のセクション×日パイプラインは60日バックテストで累積プラス

## 背景
predict_section.pyの2段階パイプラインを60日walk-forwardでバックテスト。
毎日の推薦に従って打った場合の累積収支をシミュレーションした。

section_5x5（Top5セクション×5台=25台/日）:
- 累積差枚: +545,700枚（60日）
- 勝率: 76.7%（46勝14敗）
- 平均hit率: 39.2%（baseline 33.8%, lift=1.16x）
- 勝ち日平均: +14,611枚 / 負け日平均: -9,029枚
- ベースライン（ランダム25台）: +234,625枚 → パイプラインが+133%超過

グローバルhist Top25との同台数比較:
- section_5x5: +545,700 vs global_hist_top25: +323,700（+68%優位）

## アクション
- 蒲田7の推薦はpredict_section.pyを主力として運用する
- section_5x5（25台/日）が精度と安定性のバランス点
- predict_dailyパイプラインにpredict_sectionを統合済み

## 例
60日バックテスト（section_5x5, 25台/日）:
  累積差枚: +545,700 (baseline +234,625)
  勝率: 46W/14L (76.7%)
  月別: 4月+35,100 / 5月+255,500 / 6月+255,100

