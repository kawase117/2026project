# 104%超えの二値化が連続値指標より優れている

## 背景
7候補を60日walk-forwardで比較。hit_104_rateが台レベル（rho=+0.042）でもセクションレベル（rho=+0.204）でも最強。
104%の二値化はAT機の外れ値ノイズを除去するフィルタとして機能している。
連続値（avg_diff, avg_payout, median等）はノイズに支配され信号が埋もれる。

## アクション
- ターゲット指標は104%超え率を使い続ける
- 連続値への変更は改善をもたらさない
- 改善余地は指標ではなく粒度（セクション×日）の方向

## 例
台レベルSpearman: hit_104_rate +0.042 > avg_payout +0.029 > winsorized_diff +0.011
セクションレベル: section_avg_hit_104_rate +0.204 > section_avg_avg_payout +0.150
パイプライン: hit_104×hit_104 = 40.4% > avg_payout×avg_payout = 37.5%
