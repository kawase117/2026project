# predict_dailyにpredict_sectionを統合済み

## 背景
predict_daily.pyのパイプラインにpredict_sectionを統合。
実行順序: scrape → DB update → predict_section → predict_gated。
predict_sectionが主力、predict_gatedは後方互換。
predict_sectionの失敗はnon-fatal。

## アクション
- 日次予測は `python -m ml.experiments.walkforward_scoring.predict_daily --date YYYYMMDD` で実行
- predict_sectionの出力（results/predict_section_YYYYMMDD.md）を主力として参照
- predict_gatedの出力は参考情報（compositeスコアに予測力なし）

## 例
パイプライン:
  1. scrape → 2. db → 3. predict_section → 4. predict_gated

