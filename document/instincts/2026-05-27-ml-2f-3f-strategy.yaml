id: wiki-reading-status-field-type
trigger: when adding Boolean fields to wiki frontmatter
confidence: 0.95
domain: wiki-maintenance
source: session-observation
project_id: wiki
project_name: wiki
title: reading_status フィールドは Boolean 型であるべき
background: Wiki 記事の frontmatter に reading_status フィールドを追加する際、型の一貫性が重要。ユーザーが手動で True
  に設定した値を誤って上書きする危険がある。
action: 'frontmatter repair時、既存の Boolean 値（True/False）は絶対に変更しない。型変換は String を Boolean
  に正規化する場合のみ。新規記事は reading_status: false をデフォルトとする。'
example: 'repair logic: if ''reading_status'' not in fm_dict: fm_dict[''reading_status'']
  = False elif not isinstance(fm_dict[''reading_status''], bool): # normalize only
  if not already Boolean'

