title: frontmatter フィールド名は複数スキル間で統一する必要がある
background: ingest-v2 スキルが 'read' を使用していたが、frontmatter-repair は 'reading_status' を期待していた。スキル間の
  フィールド名不一致は修復処理を破壊する。
action: 新しい frontmatter フィールドを導入する場合、CLAUDE.md に明記し、関連するすべてのスキル（ingest-v2, frontmatter-repair,
  など）で統一の フィールド名と型を使用する。
example: 'reading_status (Boolean) は全スキルで一貫して使用。ingest.py 1074行目: new_fm[''reading_status'']
  = False'

