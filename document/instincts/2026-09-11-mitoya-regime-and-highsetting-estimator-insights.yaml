# みとやのイベント日効果は店長交代（2026-04末）以降、単調に減衰し 2026-08 以降は検出不能

## 背景

ホール平均差枚で、既知のレジーム境界（店長交代 2026-04末、2026-08 の +11台増設）に沿って
3分割した。イベント日 = DD{4,7,14,17,24,27,30}、通常日は DD1 を除いたもの。

| 期間 | 営業日 | 通常日 | イベント日 | 効果 | p |
|---|---|---|---|---|---|
| A 旧店長（〜2026/04） | 485 | -46枚/37.1% | +211枚/43.2% | **+258** | <0.0001 |
| B 新店長（2026/05-07） | 86 | -33枚/36.6% | +118枚/40.5% | **+151** | 0.0016 |
| C 新店長+増設（2026/08-） | 41 | +38枚/37.7% | +104枚/38.9% | **+67** | **0.331** |

**単調減少で、C期では帰無と区別がつかない。** C期は41日と短く、2026-08 の増設（266→277台、
機種数 54→73）と 2026-09-07 の新台一斉導入が混ざっているため、恒久的な変化か希釈かは
まだ切り分けられていない。ただし B期（増設前・86日）で既に +258→+151 と4割落ちているので、
増設だけでは説明できない。

区分別の出率差（イベント日 − 通常日）も同じ向きに動いている。

| 区分 | A 旧店長 | B 新店長 | C 増設後 |
|---|---|---|---|
| AT | +3.19pp | +2.09pp | +1.55pp |
| A+AT | +1.13pp | **+2.87pp** | +1.87pp |
| ノーマル | +0.85pp | +0.10pp | **-0.27pp** |
| BT | +2.38pp | +1.41pp | **-1.93pp** |

**新店長は A+AT を強化し、ノーマルと BT のイベント日上乗せを消した。**

DD 別（ホール平均差枚）では DD24 が +235 → +72 → **-154** と符号反転、DD30 が +149 → -41 → +21、
DD4 が +298 → +84 → +150 と半減。一方 **DD14（+236/+158/+340）、DD17（+172/+138/+194）、
DD27（+179/+96/+173）は3期とも生存**。DD1 は3期とも一貫してマイナス（-91/-62/-266）で、
イベント日リストに入っているが実際は弱い。

島（section）のイベント日残差でも、**540-556（東京喰種9・とある禁書2・ヴヴヴ2）だけが
3期とも正で増加（+214/+297/+472）**。523-539（ミリオンゴッド17台の単独島）は
3期とも最悪（-169/-310/-468）。

## アクション

1. **みとやのイベント日を「効く前提」で使わない。** 現レジーム（2026-08以降）では
   ホール水準のイベント日効果が有意でない。日取りで期待値を上げる幅は旧店長期の1/4程度。
2. **DD は全部同じではない。DD14 / DD17 / DD27 を優先し、DD24・DD30・DD7 は現レジームで
   死んでいるものとして扱う。DD1 は3期一貫でマイナスなので候補から外す。**
3. **区分は A+AT を優先**。ノーマルと BT のイベント日上乗せは消えている。
   （ノーマルは高設定推定密度こそ 4.8%→6.3% と上がるが、ジャグラーは設定間の機械割の幅が
   狭く出率に乗らない。[[machine-level-highsetting-estimator-validity]] を参照）
4. **既存の x_day プレイブック（`mitoya-xday-comprehensive-playbook`、
   `mitoya-xday-dd4-is-strongest-for-574590`）を使う前に、当該DDが現レジームでも
   生きているか確認する。** ⚠️ これらは section×末尾の偏差を主張しており、本 instinct が
   測ったのはホール水準と section 水準なので、**直接反証したわけではない。閉じない。**
   実際 574-590 の section 残差は A +184 / B +412 / C +179 で崩壊していないし、
   DD24 が 574-590 で最弱という記述は今回の DD24 の反転と整合する。
5. **みとやは予告アカウントが結果報告専門（sloneko222）で事前予告が出ない。**
   予告で当日の温度感を補正することができないので、レジーム判定はデータ側だけで行う。

## 例

```
# 既知の境界で割る。統計的な変化点検出より外部情報を優先する
def per(x):
    if x < '20260501': return 'A:旧店長'
    if x < '20260801': return 'B:新店長'
    return 'C:新店長+増設'
```

⚠️ 2026-09-11 のセッションで、最初は 2025-10 と 2026-08 に境界を置いて分析したが、
**店長交代 2026-04末という既知の事実を instinct から引かずに始めたため**、
B期が旧店長と新店長を混ぜた区間になっていた。正しい境界で割り直すと単調減衰が見えた。
着手前に `instinct-import` でホール名を検索すること。

