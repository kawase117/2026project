# 残差（当日ホール平均比）は高投入日に符号を反転させる。絶対量と必ず併記する

## 背景

当日ホール平均を引いた残差は日効果を消す標準手法だが、**比較の基準線そのものが日によって
動く**ことを見落とすと結論が反転する。

2026-09-11 にみとやで実際に誤読した。イベント日のノーマル機を残差で見ると

- ノーマル 残差: イベント日 -32.5枚 vs 通常日 +57.0枚（差 -89枚、**p<0.0001**）

これを見て「イベント日はノーマルを締めて AT に回している」と結論した。**間違いだった。**
同じデータを高設定推定の絶対数で数えると逆になる。

| ノーマル（判定可能機種） | イベント日 | 通常日 |
|---|---|---|
| 判定台数 | 4,196 | 11,196 |
| 高設定推定 | 266 | 533 |
| 密度 | **6.3%** | **4.8%** |

Fisher片側 **p=0.000**。**イベント日はノーマルにも設定が増えている。**

原因は単純で、イベント日はホール平均差枚が +152枚（通常日 -39枚）まで上がる。
AT機の分散が大きいのでホール平均を押し上げ、**基準線が上がった分だけ各区分の残差が
機械的に下がる**。残差は「ホール内でどの区分に偏って入れたか」を測るには使えるが、
「この区分に設定が入ったか」を測ることはできない。

## アクション

1. **残差で「締められている」と言わない。** 残差がマイナスでも絶対量は増えていることがある。
   結論する前に、同じ切り口で絶対量（高設定推定台数 / 出率 / 絶対勝率）を出す。
2. **ホール全体が動く日（イベント日・取材日・予告日）では特に危険。** 通常日との比較で
   残差を使うなら、ホール平均自体の差を先に報告する。
3. **出率（= 1 + 差枚 / (3×G)）を併記する。** 残差と違いホール平均に依存しない絶対量で、
   区分間・期間間で直接比較できる。みとやのイベント日は AT 101.84% / A+AT 102.00% /
   ノーマル 100.34% / BT 99.99% と、残差では見えない序列が出た。
4. **高設定密度が上がっても出率が動かない区分がある。** ノーマル（ジャグラー）は
   設定間の機械割の幅が狭いので、設定が増えても出率は +0.27pp しか動かない。
   「設定が入っているか」と「打つ価値があるか」は別の問いとして分けて答える。

## 例

```python
# 残差だけで判断しない。必ず3つ並べる
seg = df.groupby(['cat', 'is_event']).agg(
    res   = ('res', 'mean'),                                  # 相対（誤誘導しうる）
    payout= ('df', lambda x: 1 + x.sum()/(3*g.loc[x.index].sum())),  # 絶対
    win   = ('plus', lambda x: x.mean()*100),                 # 絶対
)
# さらに判定可能機種では高設定推定台数（絶対数）を出す
```

