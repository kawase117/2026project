# 台単位の高設定判定は4つの指標が壊れる。判定可能機種に限り、絶対量で数える

## 背景

2026-09-11 に楽園蒲田・蒲田1・みとやで台単位の高設定推定を組むにあたり、
代理指標を4つ試して**全部壊れることを実データで確認した**。

| 指標 | 壊れ方 |
|---|---|
| 勝率（差枚>0） | 設定6のAT機でも4割は負ける。分解能が足りない |
| 絶対差枚 | 名指し機種・人気機種はG数が伸びるので、**効果ゼロでも有意に出る**（楽園の列挙型名指しで +224枚 p=0.003 が出たが、枚/1000G に直すと p=0.24） |
| 出率 >= 1.05 | **4000G以上回った台の40%が該当**。勝っている台ほど長く打たれる生存バイアス |
| ボーナス確率（AT機） | 2026-09-10 楽園の東京喰種は観測 0.00285 / ベースライン 0.00280 とほぼ同値なのに、出率は最大1.447・30台中14台が1.0超。**設定差がAT性能に出る機種ではボーナス回数に情報が無い** |

さらに `backtest.bonus_specs` の事後確率を**一様事前のまま**使うと密度が2〜3倍に膨らむ。
楽園で一様事前だと 15.4%、設定1=55%の現実的な事前に替えると 5.1% になった。

## アクション

1. **台単位の高設定推定は判定可能機種（ノーマル / BT / A+AT）に限る。AT機は台単位では判定できない。**
   AT機は機種単位（`gratio_mean_diff`、`backtest/bonus_rate.py`）までしか降りられない。
2. **事前分布を現実的にする。** `posterior()` の出力に prior を掛け直す:
   ```python
   PRIOR = {1:.55, 2:.15, 3:.12, 4:.08, 5:.05, 6:.05}
   w = {s: pr[s]*PRIOR[s] for s in pr}
   p_high = sum(v for s,v in w.items() if s>=5) / sum(w.values())
   ```
3. **3000G以上に絞る。** `MIN_GAMES_FOR_JUDGEMENT = 2000` は下限であって推奨値ではない。
4. **「差があるか」ではなく「何台あるか」を報告する。** 相対差の検定で終わらせない。
   1日あたりの高設定推定台数と密度（判定台数の何%）を必ず併記する。
   楽園の平常密度は約5.1%、予告日で6.2%、蒲田1の9月は9.9%。この絶対値が判断の基準になる。
5. **差枚がマイナスでも高設定推定が立つ台がある。** 2026-09-10 楽園の 1170 ネオアイム
   （-333枚だが P=0.59）、1130（-571枚だが P=0.54）。差枚で足切りすると取りこぼす。

## 例

```
2026-09-10 楽園蒲田 末尾0 の検証（差枚とボーナス確率の両方で一致した例）
  差枚:   末尾0 60台 +1,095枚/勝率60.0% vs 他476台 +245枚/39.7%（平常時の末尾0効果は -42枚）
  設定推定: 高設定推定7台のうち5台が末尾0。末尾0の高設定率 25.0%(5/20) vs 末尾0以外 2.7%
           （平常はどちらも5.7%前後）。超幾何 p=0.0044
  → 該当台は 1210/1200 マイジャグV、1170/1130 ネオアイム、1160 ゴーゴー3 と
     1100-1200番台のジャグラー島の末尾0に集中していた
```

