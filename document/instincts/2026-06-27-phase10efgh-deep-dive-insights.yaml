# X_DDS×角番 交互作用は水平セグメントのみ有意

## 背景
Phase10e の 2-way ANOVA で X_DDS×corner_bucket 交互作用をセグメント別に検定した。

## アクション
- h_jug (p=0.006) と h_nonjug (p<0.001) で交互作用が有意。X_DDS日に角番への設定傾斜が強まる
- v_jug (p=0.908), v_nonjug (p=0.988), mixed_805 (p=0.145) は交互作用なし
- X_DDS日の角番プレミアムは水平島に限定される。垂直島では角番×イベント日の組み合わせは無効
- h_nonjug の交互作用 F=9.09 は h_jug の F=4.16 より強い。非ジャグラー水平島でのX_DDS角番プレミアムが最大

## 例
h_nonjug Step 1: X_DDS日 corner1 avg_diff=+622.7, corner10+=+139.7 (差=483)。非イベント日 corner1=-163.5, corner10+=-113.3 (差=50)。X_DDS日に角番勾配が 10倍に拡大

