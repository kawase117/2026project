# add_debut_phase の debut_days インデックス不整合バグ（修正済み）

## 背景
mitoya_prompt_common.py line 246 で pd.Series(debut_days, dtype=object) が group のインデックスと不整合を起こし、debut/growth/mature 行の debut_days が全行 NaN になっていた。Phase10e Step 7 の Spearman 相関が全行 n=0 で発覚。

## アクション
- 修正: pd.Series(debut_days, dtype=object, index=group.index) に変更済み
- pd.Series をリストから生成して DataFrame 列に代入する場合、index を明示的に渡すこと
- debut_phase（リスト直接代入）は位置ベースで動くが、pd.Series はインデックス整列されるため挙動が異なる

## 例
修正前: debut/growth/mature 73,623行のうち debut_days notna = 0
修正後: debut/growth/mature 73,623行のうち debut_days notna = 73,623

