# add_debut_phase は _prepare_frame の前に呼ぶこと（順序厳守）

## 背景
phase10._prepare_frame (line 115-116) は machine_name が空の場合に空文字で埋める。add_debut_phase は machine_name の実値（日本語機種名）を必要とする。順序を間違えると全台が pre_existing に分類される。

## アクション
呼び出し順序を厳守:
1. add_debut_phase(df) — machine_name が生きている状態で
2. add_event_category(work)
3. phase10._prepare_frame(work) — games>=1000フィルタ等
4. is_moved 列（bool）で moved を除外

## 例
Phase10e/f/g/h すべてでこの順序を適用。逆順にすると debut_phase が全行 pre_existing になり、debut/growth/mature の分析が不可能になる

