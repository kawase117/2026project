# v_jug には角番効果がない（物理配置が原因、機種構成は無関係）

## 背景
Phase10e で h_jug の corner主効果 F=51.3 (p<0.001) に対し v_jug は F=1.84 (p=0.137)。Phase10h で3仮説を検証した。

## アクション
- 仮説D（物理的可視性）支持: 残差法（機種効果除去後）でも v_jug は p=0.551。角番効果は島の物理構造に起因
- 仮説E（セクションサイズ差）部分支持: v_jug は全セクション11台、corner10+ が 18% のみ。ただし仮説D と同じ構造を別角度から見ているだけ
- 仮説F（機種構成差）棄却: v_jug の機種は5機種に分散するが、残差法で機種効果を除去しても結果は変わらない
- v_jug で角番を台選択の判断材料にしてはならない。他の軸（X_DDS、debut_phase等）を使うこと
- h_jug では corner1 が avg_diff +405 で強いシグナル。h_jug 限定で角番は有効

## 例
- h_jug: corner1=+405 → corner10+=+1.8 (勾配-403, KW residual p<0.001)
- v_jug: corner1=+124 → corner10+=+48 (勾配-76, KW residual p=0.551)

