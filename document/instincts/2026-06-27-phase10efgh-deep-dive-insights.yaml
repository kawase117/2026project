# h_nonjug debut→mature 逆転は生存バイアス + X_DDSプレミアムの複合

## 背景
Phase10e で h_nonjug に debut avg_diff=-89.9 → mature avg_diff=+107.9 の逆転を検出。
3仮説を Phase10f で分離検証した。

## アクション
- 仮説B（生存バイアス）支持: survived群の debut期 avg_diff=-16.7 vs removed群=-179.9 (MWU p=0.003)。mature の高成績は「好成績機種の生き残り」であり、設定変更ではない
- 仮説C（X_DDS限定プレミアム）支持: debut期でも X_DDS日は avg_diff=+52.2 vs 非イベント日=-139.1。X_DDS日なら新台でもプラス
- 「mature台だから高設定」と解釈してはならない。生存バイアスが混入している
- 「新台だから避ける」も不正確。X_DDS日なら debut 台も期待値プラス

## 例
- removed 機種は debut 期から avg_diff=-179.9 で既に悪い → 撤去予兆は初動成績で読める
- h_nonjug 121+ bin の X_DDS日 avg_diff=+548.5 vs 非イベント日=-99.4 → X_DDSプレミアムは経過日数が長いほど拡大

