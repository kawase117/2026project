# v_jug には末尾効果も存在しない（角番効果と同様）

## 背景
Phase10h で v_jug の角番効果不在を確認した後、Phase10 (step4_digit_kw) と Phase10b (nonevent_digit_kw) のデータで末尾効果も検証した。

## アクション
- v_jug 末尾 KW: 全日 p=0.265、非イベント日 p=0.474。いずれも非有意
- 対照: h_jug は全日 p=0.004、非イベント日 p<0.001 で末尾効果が強い
- v_jug では角番も末尾もシグナルにならない。有効な軸は X_DDS主効果 (F=50.1) と debut_phase×X_DDS交互作用 (F=5.55) の2つ
- 垂直島（11台構成）ではホールが末尾・角番で設定を傾斜させるインセンティブが薄い。小さい島で偏らせると客に読まれやすいため

## 例
- v_jug 末尾 KW 全日: stat=11.16, p=0.265, epsilon_sq=0.000
- h_jug 末尾 KW 全日: stat=24.44, p=0.004, epsilon_sq=0.001
- v_jug で有効: X_DDS日の主効果のみ。台選択はイベント日×debut_phase に絞るのが合理的
