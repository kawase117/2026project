# mixed_805 の交互作用は debut×X_DDS と growth×X_DDS の反転が駆動

## 背景
Phase10e で mixed_805 に debut主効果なし (p=0.702) だが debut×X_DDS交互作用が強い (F=10.82, p<0.001) という異常を検出。Phase10g でセル分解した。

## アクション
- 駆動セル: debut × X_DDS = avg_diff +408.6 (z=1.96, 外れセル判定)
- 反転セル: growth × X_DDS = avg_diff -169.2 (z=-1.62, 外れセル判定)
- 主効果がないのは全フェーズ通しで差が小さいが、X_DDS日限定で debut/growth が正反対の振る舞いをするため交互作用だけが浮上した構造
- h_nonjug との違い: h_nonjug は mature×X_DDS が最大 contrast (+501.8)。mixed_805 は debut×X_DDS が最大 (417.8)。セグメントごとにホール戦略が異なる

## 例
mixed_805 のコントラスト: debut=+417.8 > mature=+201.6 > pre_existing=+127.9 > growth=-269.8

