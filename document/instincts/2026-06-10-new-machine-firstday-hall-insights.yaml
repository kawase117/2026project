# ARROW・みとやが新台初日機械割で全ホール最上位（全閾値・全指標で一貫）

## 背景
全9ホール × DBスタート以降の新台 × 初日データ（games_normalized >= 200 フィルタ）
を集計した結果（n=401〜558台×日）。

生平均機械割ランキング:
1. みとや   103.9%（avg差枚+243, plus率43.9%）
2. ARROW   102.9%（avg差枚+499, plus率47.5%）
3. ザシティ  100.2%
4. 金時     98.4%
5. 蒲田7    98.2%
6. 蒲田1    97.3%
7. ヒロキ    97.0%
8. レイトギャップ 96.6%
9. 楽園     95.8% ← 新台最下位

固定効果補正後（同一機種を導入した他ホール平均との差）:
1. みとや   resid=+4.50
2. ARROW   resid=+2.80
3. ザシティ  resid=+1.61
...
9. ヒロキ   resid=-3.20

機種ラインナップの違いを除いても、みとや・ARROWの優位性は揺るがない。

## アクション
新台導入日にホール選択で迷ったら、みとや・ARROWを第一候補とする。
楽園・レイトギャップ・ヒロキは新台初日を特に狙う必要はない。

