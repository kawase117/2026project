# 新台初日分析の実装パターン（eda/hall_firstday_analysis.py）

## 背景
`machine_detailed_results` に導入初日フラグは存在しないため、
「機種ごとの最古date = debut_date」として計算する。
pre_existing（DBスタート日に既に存在した機種）を除外する必要がある。

実装済みファイル: `eda/hall_firstday_analysis.py`

各ホールのdb_start（DBスタート日）:
- 蒲田1・金時・楽園・ARROW・ヒロキ・ザシティ・みとや: 20250101
- レイトギャップ: 20250320
- 蒲田7: 20250707

## アクション
```python
# 1. 機種ごとのデビュー日を取得
debut = df.groupby('machine_name')['date'].min().reset_index()
debut.columns = ['machine_name', 'debut_date']

# 2. DBスタート日より後のみ（pre_existing除外）
new_m = debut[debut['debut_date'] > db_start]

# 3. 初日データだけ抽出
df2 = df.merge(new_m, on='machine_name')
first_day = df2[df2['date'] == df2['debut_date']].copy()

# 4. 機械割の近似（1G=3枚投入想定）
first_day['kaiwari'] = (
    100 + (first_day['diff_coins_normalized']
           / first_day['games_normalized'].clip(lower=1)) / 3 * 100
)
```

固定効果補正（同一機種間のホール比較）:
```python
# 3ホール以上で共通導入された機種のみ
common_m = df_all.groupby('machine_name')['hall'].nunique()
common_m = common_m[common_m >= 3].index

dfc = df_all[df_all['machine_name'].isin(common_m)].copy()
machine_avg = dfc.groupby('machine_name')['kaiwari'].mean().rename('m_avg')
dfc = dfc.join(machine_avg, on='machine_name')
dfc['resid'] = dfc['kaiwari'] - dfc['m_avg']
# resid > 0 = 同機種の他ホールより高い設定
```

## 注意点
- `games_normalized >= 200` フィルタ必須（初日に数Gのみのデータを除去）
- db_startはホールごとに異なる（上記参照）
- 機械割は近似値（1G=3枚仮定）

