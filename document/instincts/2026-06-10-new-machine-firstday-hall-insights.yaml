# 機械割近似式: 100 + (差枚 / G数) / 3 * 100

## 背景
DBには機械割が直接格納されていない。
パチスロの標準的な投入枚数は「1G = 3枚」なので以下で近似:

  機械割(%) = (投入枚数 + 差枚) / 投入枚数 × 100
            = (G数×3 + 差枚) / (G数×3) × 100
            = 100 + (差枚 / G数) / 3 × 100

## アクション
```python
df['kaiwari'] = (
    100 + (df['diff_coins_normalized']
           / df['games_normalized'].clip(lower=1)) / 3 * 100
)
```

## 注意点
- 沖スロ系（1G=2枚）や一部機種では精度が落ちる
- 相対比較（ホール間・機種間の順位付け）には十分有効
- 絶対値としての精度は数%のズレが生じる可能性がある
- ボーナス中の払い出し枚数の違いで実際の機械割と差が出ることがある
