# ホールごとに台予測の有効軸が異なる

## 背景
3ホールのDD30でシグナル強度を比較。末尾spread、セクションTop5再現率、個別台勝率を分析した結果、ホールごとに最適な絞り込み軸が全く異なることが判明。

## アクション
- 蒲田1: 末尾8を軸に絞る（spread=586、末尾8が79%でDD30平均超え）
- みとや: セクション501-522（ミリゴ島）に集中（Top5再現率71%、3店中最高）
- 蒲田7: 個別台を記憶して狙う（末尾/セクション軸は弱いが、個別台で勝率90%の台が存在）

## 例
蒲田1末尾8: 14日中12日プラス、avg +564。セクション再現率は7%で低い。
みとやsec 501-522: Top5が日別Top5と3個以上重複する率71%。
蒲田7 #2237モンキーターンV: 勝率90%（9/10日）だがセクション再現率は10%。

