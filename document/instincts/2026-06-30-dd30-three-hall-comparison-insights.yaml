# 蒲田7 DD30は法則軸がなく個別台記憶型の戦略が必要

## 背景
蒲田7はDD30の店全体出玉が3店中最大（avg +342）だが、末尾spread=356（最小）、セクションTop5再現率=10%（最低）で「どの台に入るか」の予測シグナルが最弱。53セクション中Top1が10日間で9回異なるセクションになる。ただし個別台では#2237モンキーターンV（勝率90%）など高勝率台が存在。

## アクション
蒲田7DD30では事前に候補台リストを覚えて行くスタイルが必要。信頼度重視: #2237(90%), #2123(80%), #2302(80%), #2211(80%), #2279(80%)。期待値重視: #3264(avg+4380, 70%), #2201(avg+3830, 70%)。

## 例
Top候補: #2237 avg+2580(90%), #2123 avg+3420(80%), #2302 avg+3080(80%)
避ける: sec 3234-3249（東京喰種島）3台連続Worst、sec 3088-3102（ヴァルヴレイヴ島）

