# みとや DD30はセクション540-556（ミリゴ島）の末尾2・4・8が最強クラスタ

## 背景
みとやDD30はセクションTop5再現率71%で3店中最高の構造安定性。sec 540-556はミリオンゴッド島で、末尾4×sec 540-556がavg +2,230（全交差中1位）。この島の末尾2・4・8に3台集中すれば効率的。

## アクション
みとやDD30ではsec 540-556の末尾2(#542)・末尾4(#544)・末尾8(#548)を中心に狙う。#548は勝率79%（11/14日）で最も安定。#544はavg +2,580で期待値最大。

## 例
sec 540-556候補: #544(avg+2580, 64%), #542(avg+1877, 64%), #548(avg+1157, 79%)
避ける: #517(avg -1684, 14%), #538(avg -1481, 21%), #636(avg -1346)

