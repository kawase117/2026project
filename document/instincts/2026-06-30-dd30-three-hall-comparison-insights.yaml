# DD候補台ハイライトマップのエクスポートツールが利用可能

## 背景
2026-06-30セッションで設計、Codexが実装。平均差枚（背景色7段階: 赤→グレー→緑→金）×勝率（枠線4段階: 金太枠→緑→なし→赤点線）の二軸でフロアマップ上に候補台をハイライト表示するHTMLを生成する。

## アクション
python Heatmap/export_dd_candidates.py --dd 30 で3ホール分のHTMLを一括生成。html2canvasによるPNG保存ボタン付き。実戦前に毎日実行して候補台を視覚的に確認する。

## 例
python Heatmap/export_dd_candidates.py --dd 30
python Heatmap/export_dd_candidates.py --dd 30 --halls kamata7
python Heatmap/export_dd_candidates.py --dd 7 --output-dir tmp/
設計プロンプト: document/plans/prompt_dd_candidate_heatmap_export.md
