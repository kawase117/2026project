# DD30は蒲田1・蒲田7・みとや全3ホールでプラス圏

## 背景
2026-06-30セッションで3ホールのDD30平均差枚を比較。全ホールがDD30でプラス圏であることを確認。
蒲田7: avg +342（lift +157, 10日中10日プラス）、蒲田1: avg +199（lift +148, 14日中13日プラス）、みとや: avg +148（lift +133, 14日中11日プラス）。

## アクション
DD30はどのホールに行っても全体平均よりプラス期待値が高い。ホール選択は「店全体の強さ」ではなく「台レベルの予測精度」で決めるべき。

## 例
DD30平均差枚ランキング: 蒲田7(+342) > 蒲田1(+199) > みとや(+148)
ただし蒲田7はマイナス日ゼロ、みとやはマイナス3日で信頼度に差がある。

