# 同じ機種のスペックに複数の出所があり約10%食い違う。結論が変わるので、両方で確かめる。4設定機は存在する設定だけで計算する

## 背景
バーサスリヴァイズのBB・RBは、一撃のスペックページ(マスターCSV由来、旧スペック)と、設定判別ページ(/s_versus_rexse/0/)で約10%違う。
設定1→6のBBは、設定判別ページが1/292.6→1/264.3、旧スペックが1/264.3→1/237.4。RBは、1/374.5→1/292.6と、1/344.9→1/277.7。
同じ2288(1,138G、BB6・RB8)のデータが、旧スペックだと設定5〜6が71%、設定判別ページだと、2セッション合算で設定6が5%(設定1〜2寄り)と、結論が変わった。
2026-10-06に、ユーザーが「一撃準拠でよし」と承認し、ml/experiments/jug_rb_setting_prediction/config.py を設定判別ページの値に差し替えた。どちらが実機に合うかは未確認。
加えて、設定1・2・5・6だけの4設定機(新ハナビ、バーサス、ハナビ、サンダーV、アレックス、SHAKE、クランキー)に、設定3・4を補間した6択の平均設定(例: 4.2)を報告していた。存在しない設定の値になる(既存: spec-settings-absent-not-missing)。

## アクション
- 設定推定の前に、機種の設定数(スペックのキー)を確認し、存在する設定だけで事後確率を計算する。補間した「平均設定」を報告しない。
- スペックの出所が複数ある機種は、両方で計算して、結論の安定性を確認する。ユニメモの設定推測と合わないときは、スペック表の出所を疑う。
- 確定設定の台(SETTING_LABELS.jsonl)がたまったら、どちらのスペックが実機に合うかを検証する。

## 例
2288の終日(4,752G、BB12・RB14)を設定判別ページのスペックで計算すると、設定1=31%・2=29%・5=24%・6=17%。台帳は「1〜2寄り」。
