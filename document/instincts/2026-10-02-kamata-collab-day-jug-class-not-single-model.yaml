# コラボ日は「ジャグ系のどれか1機種」が上がる。どの機種かは事前に当てにくい

## Core claim
蒲田1・蒲田7のコラボ/カマタに集合の6日(6/13・6/30・7/25・7/30・8/30・9/19)で、ジャグ系の機種平均+1800超の率は通常日の4.4倍(蒲田1)・8.8倍(蒲田7)。2026-09-30の同種の日では両店とも判別可能なジャグ系8機種中1機種(12.5%)で一致した。ただし事前に挙げた個別機種の的中は低い(9/30 蒲田7は候補6機種中1機種)ので、機種名の断言は避け、当日に台別で見る。

## Evidence
- n_observations: 7(コラボ6日の学習+2026-09-30の前向き確認)
- data scope: 蒲田1・蒲田7、2026-06-01以降
- metric scope: diff(機種平均差枚+1800超)
- result summary:
  - ジャグ系の機種平均+1800超率: 蒲田1 コラボ日6/48=12.5% vs 通常日12/424=2.8%(p=0.006)、蒲田7 4/48=8.3% vs 7/736=1.0%(p=0.003)。非ジャグは蒲田1で0.91倍(差なし)・蒲田7で1.6倍
  - 9/30 蒲田7はファンキージャグラー2が24台中20台超え(平均+3692、最小-400)、蒲田1はジャグラーガールズ4台+3500
  - 事前候補は蒲田7の痛いのは嫌のみ的中(8台平均+3288)、他5機種(SBJ・虚構推理・シャーマンキング等)は外れ。蒲田1のヴヴヴ2(コラボ6日中4日で全台系)は9/30不発で、新店長以降(8/30・9/19・9/30)は8/30のみ

## Interpretation
- 「ジャグ系のうち1機種が上がる」は取れる傾向だが、機種の入れ替わりが大きく、事前の機種名の断言には使えない
- 蒲田1は9/30の総差枚が過去コラボ日の中央の約1/3(+27,700)で、店長交代後はコラボ日の強さが一定しない
- 蒲田7は総差枚+139,900で過去コラボ日の中央(+149,300)並み

## Action
- コラボ日は、ジャグ系機種を台別・機種別に当日見て、機種名は断言しない。非ジャグへの上乗せは蒲田7のみ弱い
- 蒲田1のコラボ日の強さは、新店長以降(8/26〜)の日だけで評価し、それ以前の全台系パターンを引き継がない

