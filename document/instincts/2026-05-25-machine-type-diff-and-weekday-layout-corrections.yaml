# A型（ジャグラー等）は機械割が低いため差枚は低い傾向。AT系高設定時の方が差枚は大きい

## 背景
A型（ジャグラー・ハナハナ等）は機械割が低い機種が多く、高設定でも差枚の絶対値は小さい。
AT系は機械割の振れ幅が大きく、高設定時の差枚は大きくなる。

誤認しやすいポイント:
- digit3_profile_report で A型末尾3のmean_diff=243.0 > AT系末尾3のmean_diff=84.9 に見えるが、
  これは「AT系末尾3には低設定が多く平均を引き下げている」ためであり、
  A型の差枚ポテンシャルが高いことを意味しない。
- A型の243.0はAT系が設定6を入れた場合の期待差枚（≈500-800）より低い。

## アクション
A型とAT系を比較する際は「同設定レベルでの差枚」を意識する。
全体平均でA型がAT系より高く見える場合は「AT系に低設定が多い」という解釈を優先する。
「A型は差枚が大きい」という記述は誤り。削除・修正対象。

## 例
NG: 「A型は差枚が大きく出やすい」
OK: 「A型は機械割が低く差枚は低め。AT系の高設定時の方が差枚は大きい」
OK: 「A型の末尾3がAT系より高く見えるのはAT系の低設定多数による平均引き下げ効果」

