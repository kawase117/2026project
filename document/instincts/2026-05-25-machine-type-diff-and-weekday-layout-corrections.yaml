# 火曜は「角番の日」のため、末尾の「隣接」は台番号末尾での概念であり物理的な隣台ではない

## 背景
火曜日は「角番」（特定の台番号末尾に設定を入れる投入日）として認識されている。
角番日では物理的に隣り合った台に設定を入れるのではなく、
「台番号末尾が同じか隣接する末尾の台」に設定を入れるという末尾依存の投入方式をとる。

これは「クラスタ集中（末尾6-7-8）」という概念と整合する:
- 末尾6の台: ホール全体に散在（06番、16番、26番、106番、…）
- 末尾7の台: 同様にホール全体に散在
- これらが物理的に隣台でなくても「末尾クラスタ」として同時に高設定になっている

## アクション
火曜の分析・特徴量設計では「隣台の物理的実績」ではなく「同末尾・隣接末尾の実績」を使う。
last_digit+1 mod 10 の実績を特徴量にする際、物理配置との混同を避けること。

## 例
火曜 best_cluster=6-7-8: 末尾6の台(06,16,26,…)と末尾7の台(07,17,27,…)が別の列にあっても
同時に高設定が入っている → 「末尾の隣接」が物理的隣接と独立して機能している

