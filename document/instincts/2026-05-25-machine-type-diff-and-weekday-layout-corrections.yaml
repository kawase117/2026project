# 火・木のクラスタ集中度が最強（ratio=1.229）、月曜は実質無効（delta=8.25）

## 背景
weekday_concentration.csv より concentration_ratio・delta の曜日別比較:

| 曜日 | ratio  | delta | 評価       |
|------|--------|-------|------------|
| 月   | 1.039  |  8.25 | 無効（誤差）|
| 火   | 1.229  | 49.32 | 最強       |
| 水   | 1.200  | 38.62 | 強         |
| 木   | 1.229  | 45.02 | 最強       |
| 金   | 1.196  | 29.83 | 中程度     |
| 土   | 1.214  | 44.85 | 強         |
| 日   | 1.179  | 33.31 | 中程度     |

## アクション
クラスタ特徴量（best_cluster_in フラグ等）を使う場合:
- 月曜: クラスタ特徴量を無効化 or 重みを0に近く設定
- 火・木: クラスタ特徴量の重みを最大化
- 水・土: 次点で有効
walk-forwardで各曜日のクラスタ特徴量寄与を確認してから採用する。

## 例
火曜の台選び: 末尾6-7-8クラスタに座ると全体平均+49差枚の期待値
月曜の台選び: クラスタを意識しても全体平均+8差枚にしかならない（意味なし）
