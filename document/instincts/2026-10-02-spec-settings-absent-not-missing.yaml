# 設定3、4が無い機種は、スペックの欠損ではなく、もともと設定が4段階しかない

## 背景
アレックス ブライト、スマスロ サンダーV、新ハナビなどの一部の機種は、設定が1、2、5、6の4段階で、設定3、4がもともと存在しない。
スペック表が欠けているのではない。表現上の違いにすぎない(ユーザーの指摘、2026-10-02)。
楽園の曜日別RB分析で、「スペックに設定3、4がありません」と、データ欠損のような書き方をした。データを補うべき不足があるかのように読める。
また、設定4以上の事後確率は、存在する設定(5、6)の合計になる。設定2と5の間の相当設定(補間)は、あくまで目安で、設定3、4という実在しない段階を指していない。

## アクション
- 「設定3、4が無い」「欠けている」と書かない。「設定1、2、5、6の4段階の機種」と書く。
- 設定4以上の確率は、その機種に存在する設定の合計として出す(設定5以上と書いてよい)。
- 補間した相当設定は、1と2の間、2と5の間を結んだ目安として読む。設定3.5相当などは、実在しない設定の値であることに注意して、表現を選ぶ。
- 欠損警告やカバレッジの判定で、設定の本数が6本未満を、一律にスペック不足として扱わない。

## 例
アレックス ブライトは、RB確率が設定1が1/428、設定2が1/410、設定5が1/366、設定6が1/312。月曜のRB 1/363は、設定5に近い水準、という言い方になる。
