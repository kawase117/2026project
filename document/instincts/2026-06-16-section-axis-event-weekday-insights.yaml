# Section×DD軸はstable結果ゼロ。蒲田7 2F/3F・蒲田1 2F の3ホール全てで確認済み

## 背景
kamata_section_axis_eda_deepdive.py で全セクション×DD(1-31)を検定した結果、
3ホール計でstable=Trueのセルは0件。
machine_category軸でのDD検証でも同様だったことと一致。

## アクション
1. 「DD別に特定列が強い」仮説の検証は現時点では優先度を低くする。
2. DD効果を立ち回りに使うなら、Section軸ではなくホール全体の
   イベント日定義（is_event_day）の精度を上げる方が効果的。
3. データが2年以上になった時点で再検証の余地あり。

