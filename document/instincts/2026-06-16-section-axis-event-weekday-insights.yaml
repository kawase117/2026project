# 蒲田7 2FのSection is_event_day stable率の低さはAT群比率92%で説明可能。2F固有の異常ではない

## 背景
蒲田7 2Fのis_event_day stable率は3/27=11%で、蒲田7 3F(77%)・蒲田1(59%)と比べ低く見えた。
しかし全84セクションのcrosstab（tmp/kamata_section_axis_eda_deepdive/event_day_category_crosstab.csv）で、
A群overall stable率=56%, AT群=22% と明確な差が存在し、
蒲田7 2FはAT群が25/27（92%）を占めるため低くなるのは数学的帰結。

また、蒲田7 2FのA群セクション（2セクション）はBT機を含む可能性があり、
純粋なA群の挙動として解釈できないイレギュラーが存在する（stable=0/2）。

## アクション
1. 新規ホール/フロアでis_event_day stable率が低く見えた場合、
   まず dominant_category × stable率 のcrosstabでカテゴリ構成比の影響を確認する。
2. 「A群はeventに反応しやすい、AT群は反応しにくい」という一般則の例外として
   解釈する前に、カテゴリ比率の確認を必ずはさむ。
3. 蒲田7 2F A群セクション（2155-2164周辺）はBT機混在の疑いがあるため、
   A群の典型挙動として一般化しない。

