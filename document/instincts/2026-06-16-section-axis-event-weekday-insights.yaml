# 蒲田7 2F 2011-2022列はフロア全体AT群×土曜(+1.71pt)の3.8倍に増幅(+6.52pt, 両split-half stable)

## 背景
kamata_section_axis_eda_deepdive.py の split-half 検定で、
蒲田7 2F 2011-2022（AT群100%, 12台）× weekday=Sat:
delta=+6.52pt, q=4.8e-07, 前半q=0.0047, 後半q=0.001 — 両half安定。

machine_breakdown（section_2011_2022_sat_machine_breakdown.csv）では：
- 全12台でdelta正（最小+2.02pt, 最大+11.48pt）→ 列全体の構造的現象
- top_machine_share=0.157 < 0.3 → スパイク依存の偽陽性でない
- **2017台のみsplit-half stable（delta=+10.76pt, hit_104=0.500）**

## アクション
1. 土曜の朝一、蒲田7 2F 2011-2022セクションを最優先確認リストに置く。
2. セクション内では **2017台** を最優先（split-half stable, hit_104=50%）。
   次いで2020(+11.5pt), 2018(+10.3pt)を代替候補とする。
3. 全台delta正の構造なので2017が先客でも2020/2018/2012/2011（全て4pt以上）を選べる。
4. データ蓄積後（n≈30/half超）に他台のstable化を再検証する。

## 例
```
土曜朝一チェック（蒲田7 2F）
最優先列: 2011-2022
 └ 1位台: 2017（stable, hit_104=50%）
 └ 代替: 2020, 2018（高delta、不安定ではなく単純に未安定）
```

