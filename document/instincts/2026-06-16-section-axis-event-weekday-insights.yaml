# A群列はイベント日に安定的に好成績、AT群はstable列が限定的

## 背景
3ホール/フロア（蒲田7 2F/3F・蒲田1 2F）計84セクションについて、
section_axis_split_half.csv の is_event_day=1 × payoutrate_pct の stable列を集計した。

結果:
- A群セクション stable率: 14/25 = **56%**（蒲田1_A=75%, 蒲田7_3F_A=53%）
- AT群セクション stable率: 13/58 = **22%**（蒲田1_AT=36%, 蒲田7_3F_AT=18%, 蒲田7_2F_AT=12%）

A群は全ホールでAT群より一貫してstable率が高い。
AT群のstable率が低い理由は「上がらない」のではなく「1日の差枚分散が大きく
split-half安定性が低い」構造的問題の可能性がある。方向（delta正）自体は
多くのAT群セクションでも出ている。

## アクション
1. イベント日の朝一列選びでは A群列を優先する（stable率56%）。
2. AT群列はstable判定が出た特定列のみを追加候補とする：
   - 蒲田7 2F: 2264-2280(+3.93pt), 2115-2128(+3.69pt), 2230-2246(+1.83pt)
   - 蒲田7 3F: 3234-3249(AT,+3.03pt), 3073-3087(AT,+1.65pt)
   - 蒲田1 2F: 2177-2186(AT,+2.99pt), 2077-2087(AT,+2.51pt), 2060-2076(AT,+2.50pt) など
3. 蒲田1 2F 2001-2020（AT）はis_event_day効果が逆方向stable(-0.78pt)のため優先度を下げる。
4. 簡潔なルール: 「イベント日はA群列優先、AT群は確認済みstable列のみ追加で狙う」

## 例
```python
# イベント日朝一列選び（蒲田7 2F）
# 1. A群列（2155-2164）を最優先
# 2. AT群stableセクション：2264-2280, 2115-2128, 2230-2246
# 蒲田1: 逆方向stable 2001-2020 は後回し
```

