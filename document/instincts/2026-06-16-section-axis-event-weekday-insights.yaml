# 蒲田1 2001-2020は土曜+4.61pt stable、イベント日は-0.78pt stableで逆方向。機種差が大きい

## 背景
section_axis_split_half.csv より：
- weekday=Sat: delta=+4.61pt, q=3.4e-09, stable=True
- is_event_day=1: delta=-0.78pt, q=2.4e-04, stable=True（他列と逆方向）

ユーザーの現場認識「入口に近い目立つ列だが弱い」とis_event_day逆方向が整合。
machine_breakdown（section_2001_2020_sat_machine_breakdown.csv）では：
- Satトップ: 2011(マギアレコード系,+37.6pt), 2004(戦国乙女5系,+15.5pt)
- Sat弱台: 2020(スマスロ北斗2,-2.6pt), 2014(マギアレコード,-3.1pt)
- is_event_day最弱台: 2015(マギア,-7.5pt), 2011(マギア,-6.4pt) — 土曜トップ台がイベント日最弱候補
- split-half stable台は土曜・イベント日どちらもゼロ（n=73/halfで不安定）

## アクション
1. 土曜: 2001-2020を候補に入れる。2011(マギア)・2004(戦国乙女5)を優先確認。
   スマスロ北斗2（2016-2020付近）は土曜でも弱いため優先度低。
2. イベント日: 他に良い列がある場合は 2001-2020 を後回しにする。
3. 土曜×イベント日の交互作用は未検証（現データ量で不安定）。
4. 台番号レベルstable台なし。さらなる確認は次回データ追加時。

