# 日別最尤設定の推移だけから投入法則を読まない

## Core claim
楽園蒲田店の当該16台では、日別のBB・RB確率から選んだ最尤設定は不確実性が大きく、2026-07-07から2026-08-03の範囲で台番号固定・隣接日据え置き／ローテーション・7の付く日のいずれも再現可能な投入法則としては確認できない。

## Evidence
- n_observations: 413 valid machine-days（全416行のうち0Gの3行を尤度計算から除外）
- data scope: single-hall / 2 Hanahana models / 16 machine numbers
- metric scope: BB・RBの多項尤度、最尤設定、設定上位の事後確率、台番号別平均、隣接日順位相関、日付別比較
- result summary: キングは最良設定の事後確率中央値0.216、ニューキングは0.234で、各々88.3%・87.4%の日が0.30未満だった。設定上位確率の台番号差は日付内置換検定でキング p=0.167、ニューキング p=0.435。隣接観測日間の設定上位確率順位相関はキング p=0.932、ニューキング p=0.434。7の付く日のキングの上位確率上昇も試行G数を考慮すると p=0.101 にとどまった。

## Interpretation
- 日別最尤設定の上下は、特に低試行Gで観測ブレの影響が大きく、実設定が日替わりで変わった証拠ではない。
- 0Gは「低設定」の根拠でも「高設定」の根拠でもないため尤度から除外する。一方、RB=0は観測結果なので0回として残す。
- 5000G以上に絞るとキング3171などの候補は見えるが、各台1-8日程度であり探索的な手掛かりに限定する。
- この結論はこのホール・機種・期間に限る。全ハナハナ機種や他ホールの一般則ではない。

## Action
- 表示・判断には最尤設定の整数だけでなく、設定上位の事後確率と試行G数を必ず併記する。
- 台番号法則を主張する前に、日付内の台番号ラベル置換検定と隣接日相関を行い、別期間でも同じ方向を再現する。
- G数の閾値分析は感度分析に留め、G数自体を投入根拠として扱わない。

