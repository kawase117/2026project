# 外部サイトの収集コードは、自作のHTML断片でテストが通っても完了にしない。実HTMLを素材にし、営業時間中の実収集で件数・欠損・失敗を見る

## 背景
2026-10-20〜21、DMM(ヒロキ3店舗)のクイック収集で、AT機の累計回転数が欠損していた。累計回転数は機種ページ(unit_list)にあるので、Codexに機種ページから取る実装を委任した。
Codexのテストは自作のHTML断片で、62→68→72→77件と通り続けたが、実収集では3回続けて失敗した。

1. 貸玉を `ballPrice=21.74` に決め打ちしていた。MAXと西口は21.74だが、東口は21.70と5.40(5円スロット)。機種リンクが0件になり、全機種が欠損した(failures 約110)。
2. 営業日の読み取り位置が実HTMLと違った。実HTMLでは日付プルダウン `select[name="hist_num"]` の value="0" で、自作断片は別の場所を想定していた。112機種が「先頭営業日が見つかりません」で失敗した。
3. 機種名の末尾に空白がある機種(「ひぐらしのなく頃に祭2 」「L 聖闘士星矢 海皇覚醒 」)があり、一覧側は空白を除いていたので、MAXの2機種(10台)が結合できなかった。

加えて、機種ページを並行して取るのに、取得順を固定で比べるテストが、3回中2回失敗した(順序依存のフレーキーなテスト)。
原因はいずれも、Codexの環境が外部ネットワークを拒否して実サイトを見られないことと、テストの素材が自作だったことにある。私がブラウザで確認したのはMAXと西口だけで、東口を渡していなかった。

## アクション
- 外部サイトの収集コードを直す前に、実サイトのHTMLを本番と同じ条件(User-Agent、ホール、貸玉)で保存し、**テストの素材(fixtures)としてCodexに渡す**。自作の断片だけで合格にしない。
- Codexが「実行できなかった(ネットワーク拒否)」と返したら、完了ではなく**未検証**として扱い、こちらで実収集を行う。
- 完了条件に、営業日が一致する営業時間中の実収集を入れる。見るのは次の5点: 取得台数(machine_count)、欠損率(値がNoneの台の割合)、failures=0、complete、ホールごとの差(貸玉、営業日)。**3ホールとも**実行する。
- 営業日の判定は started_at.date() と比べるので、深夜0〜10時の実行は安全側で全滅する(仕様)。夜間に検証したいときは、収集日を固定して実HTMLの当日分で動かす(検証用スクリプトで `collector.datetime.now` を差し替え、`--output-dir` で本番出力を汚さない)。
- ホールごとに違う設定(貸玉、営業時間、機種名の空白)は決め打ちせず、サイトのリンクや表示から発見する。
- 並行処理の取得順に依存するテストは、順序を問わない比較(ソートして比べる)にする。複数回(5〜8回)繰り返して安定を確認する。

## 例
```text
単体テスト 77件 通過  ->  東口の実収集: 台320、total_games あり 0、failures 209(営業日不一致/貸玉)
貸玉を発見する形に直す  ->  実収集: 営業日の読み取り位置が違い、112件失敗
実HTMLを fixtures にして営業日を直す  ->  東口 279台 100% 失敗0、MAX 424台 100% 失敗0
```

