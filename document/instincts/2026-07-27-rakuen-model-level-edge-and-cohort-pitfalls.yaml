# 楽園はホール/カテゴリ粒度では見えない機種粒度のエッジがあるが、コホート分割・少数台依存・位置効果には複数の落とし穴がある

## 核心の主張
楽園蒲田のホール全体・カテゴリ粒度の水準は動いていなくても、機種粒度に下りると
明確な機種別エッジ（ネオアイムジャグラーEX、北斗の拳 転生の章2）が見える。
ただしこの粒度の分析には (1) 設置コホート分割、(2) 少数台依存、(3) 位置効果、
の3点でそれぞれ誤読しやすい罠がある。

## 根拠
- n_observations: 楽園9ヶ月分（2025-09〜2026-07）、機種粒度12,229セル
- data scope: single-hall（楽園蒲田）
- metric scope: games加重機械割・同日同カテゴリ比エッジ(pp)
- result summary:
  1. ネオアイムジャグラーEX: 同日JUG全台比エッジが 2026-03 +0.00pp → 07 +1.08pp
     [+0.78,+1.51] と単調上昇。ただし台番号を見ると2026-07-07新設35台
     （新装減衰: 初日103.9%→直近99〜100%）と既存27台が混在し、混ぜると甘くなる。
  2. 既存27台の中でも、日付でコホートを分けると section 1170-1183 の前半7台
     (edge -0.13pp) と後半7台(edge +1.36pp) で差が出た。これを「設置時期の差」と
     誤読しかけたが、実際は「同じ島を前半/後半で2回に分けて増台しただけ」であり、
     日付コホートが島の位置差を時期差として見せていた。
  3. 楽園全体・年間データで rank_from_min/rank_from_max（端番）による位置効果を
     検証したが、JUG/AT一般ともに端〜中央でほぼフラット（差1pp未満）で、
     section 1170-1183単体・2ヶ月分だけで見えた「中央が強い」傾向は
     母数を広げると消えた。単一セクション・短期間での位置パターンは偶然の可能性が高い。
  4. 北斗の拳 転生の章2: 既存20台のエッジが2026-03から上昇(+1.27pp)し、
     2026-05-29の13台増台後も上昇継続(2026-07 +3.05pp)。ただし増台前後
     [+1.23,+2.33] vs [+1.09,+3.60] はCIが大きく重なり、「増台が原因」は
     支持されない。上昇は増台の3ヶ月前から始まっている。
     さらに2026/06以降、上位5台を除くとエッジがほぼ消える(+2.36pp→+0.39pp)。
     少数台に強く依存している。

## 解釈
- 機種粒度の表（eda/model_monthly_edge.py）が無いと (1) は原理的に発見できない
  （カテゴリ粒度・台粒度どちらの表でも機種単位の傾向は見えなかった）。
- コホートを日付だけで分けると、島の位置差を時期差と誤読するリスクがある。
  machine_number_range 列を必ず確認し、同一セクション内で日付コホートが
  分裂していないか見ること。
- 短期間・少数セクションで見えた位置パターンは、母数を広げて再検証しないと
  偶然と本物の区別がつかない。
- 機種全体のエッジが本物でも、少数台依存が強い場合は「機種を選ぶ」だけでは
  不十分で、機種内の台を絞る追加ロジックが要る。

## Action
- 楽園（および他ホール）の機種別エッジ確認には eda/model_monthly_edge.py を使う。
  実行時に machine_number_range と edge_excl_top1/2/3 を必ず読む。
- 「増台後に強くなった」という報告は、増台前の期間を十分に取ってから
  before/after のCI重なりを確認するまで因果と決めつけない。
- 位置効果（角番回避等）の検証は、単一セクション・短期間ではなく
  ホール全体・年間データで行う。楽園では現時点で位置効果は確認できていない
  （蒲田系ホールの角番回避パターンとは異なる可能性がある）。
- 北斗の拳 転生の章2は事前登録の候補になり得るが、機種選択ルールではなく
  「機種内で直近成績上位の台を選ぶ」形にする必要がある。

