高設定台が存在する確率は十分残る。Instinct確立済みの末尾2・末尾7を優先する。

**ビッグドリーム THE GOLDEN PUSHER（624-640）は無視:**
実績: 全台マイナス（平均-870）、x_day=-1570、DD=7実績ゼロ。
seat_dd_rollの前機種汚染による偽陽性。
