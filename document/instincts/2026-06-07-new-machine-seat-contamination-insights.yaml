# 新機種はseat_dd_rollが前機種の実績を引き継ぎ、ML予測が過大評価される

## 背景
みとや 2026-06-07 予測で「ビッグドリーム THE GOLDEN PUSHER」（2026-05-11設置, 20日）が
ビッグドリーム除外前のML TOP2〜5を独占した。

**実際の実績（全台マイナス）:**
```
台631-635 全期間平均差枚: -587 〜 -1219
勝率: 25〜50%
x_day（DD末尾4,7）限定: -730 〜 -3672（さらに悪化）
DD=7実績: ゼロ件（2026-06-07が初めてのDD=7）
```

**なぜMLが騙されたか: seat_dd_rollの汚染**

`seat_dd_roll`（台番号×DDの過去平均）は機種交換後も前機種のデータを引き継ぐ。
624-640（台631-635）の前機種たちはDD=7に非常に好実績を持っていた:
```
台635 ゴッドイーター   +13,985（DD=7）
台632 いざ！番長       +12,724（DD=7）
台631 かぐや様         +8,121（DD=7）
台634 かぐや様         +9,415（DD=7）
```
→ 新機種に「このシートはDD=7に強い」という誤ったシグナルが渡った。

`machine_avg_diff_wf`, `machine_xday_avg_wf` はマイナスでも、
座席履歴系の特徴量（`seat_dd_roll`, セクション埋め込み）の正シグナルが上回った。

## アクション

**1. 実運用での対処（即時）**
ML上位に入った機種の設置日・実績をDBで直接確認する習慣をつける:
```python
# 機種の設置日（初出日）と経過日数を確認
first_seen = df_raw.groupby("machine_name")["date"].min()
latest = df_raw["date"].max()
days = (pd.to_datetime(latest) - pd.to_datetime(first_seen)).dt.days
# days < 30 の機種は要注意
```

**2. 予測スクリプトへの追加（推奨）**
`machine_sample_n_wf`が閾値未満の機種に警告フラグを出力する:
```python
today["is_new_machine"] = (today["machine_sample_n_wf"] < 30).astype(int)
# 出力時に ※新機種 注記を付与
```

**3. 本質的な修正（将来）**
`seat_dd_roll`を「現機種設置以降のデータのみ」で計算し直す。
機種交換時点でseat履歴をリセットする設計。

## 例
ビッグドリーム THE GOLDEN PUSHER（2026-05-11設置）の誤検知パターン:
```
machine_sample_n_wf = 20  ← 警戒閾値30未満
machine_avg_diff_wf = -870（全期間平均、実績不良）
machine_xday_avg_wf = -1570（x_day平均、さらに不良）
seat_dd_roll       = 高い正値（前機種の好DD=7実績）← 汚染源
pred_diff          = +951   ← 過大評価（実態と大きくかけ離れ）
```

