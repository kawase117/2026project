# adjusted_lift の分母は 10（末尾0-9）、9ではない

## 背景
蒲田七の末尾は 0-9 の10種類（北斗は末尾4欠番で9台だが、末尾数は10）。
summary.json の `baseline_random = 0.1` がこれを示している。
分母を 9 にすると diff・OR が「baseline 以下」に見えるが、10 にすると「baseline 水準」になる。

| 条件 | hit_rate | 9分母baseline | 10分母baseline | 正しい判断 |
|------|----------|--------------|---------------|-----------|
| rb 0.80  | 41.5% | 37.9% (+3.6%pt) | 34.1% (+7.4%pt) | rbは強い |
| diff 0.80 | 35.3% | 38.8% (-3.5%pt) | 34.9% (+0.4%pt) | diffはランダム水準 |
| or 0.80  | 53.9% | 56.3% (-2.4%pt) | 50.7% (+3.2%pt) | orは小さな正のリフト |

## アクション
```python
# 正しい adjusted_lift 計算
N_DIGITS = 10  # 蒲田七は末尾0-9の10種類

def adjusted_lift_multi(hit_rate, avg_signal_tails, n_digits=N_DIGITS):
    baseline = avg_signal_tails / n_digits
    return hit_rate / baseline - 1 if baseline > 0 else float('nan')

def adjusted_lift_single(hit_rate, n_digits=N_DIGITS):
    return hit_rate * n_digits - 1  # = hit_rate / (1/10) - 1

# 蒲田七 rb 0.90 の正しい値
# single: 0.2188 * 10 - 1 = +1.188 → baseline の 2.19倍
# multi:  0.265 / (2.00/10) - 1 = +0.325 → baseline の 1.33倍
```

## 例
```
誤り（9で割った場合）:
  diff 0.80: baseline = 3.49/9 = 38.8%, observed 35.3% → ランダム以下（誤）

正しい（10で割った場合）:
  diff 0.80: baseline = 3.49/10 = 34.9%, observed 35.3% → +0.4%pt（ほぼランダム・正）
```

