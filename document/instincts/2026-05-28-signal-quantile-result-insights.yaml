# 月曜の逆転：相関は強いがシグナルで末尾を特定できない

## 背景
月曜に関して3つの分析が一見矛盾する結果を示した：

| 分析 | 月曜の結果 |
|------|-----------|
| signal_machine_correlation | delta +183.5, p_adj=0.0017（全曜日で最強） |
| signal_accuracy_2fn（北斗ヒット率） | 6.38%（baseline以下） |
| signal_multi_tail single hit_rate | 0.000%（0/5） |

仮説：月曜はホールが複数末尾に分散投資している。
→ 北斗・モンキーも複数末尾に散在 → single条件を満たしにくい
→ 各末尾のシグナル機種はその末尾の他機種と相関する（correlation成立）
→ しかし「どの末尾がTHE BEST」かはランダムに近い

## アクション
```python
# 月曜の運用方針
if day_of_week == "月":
    # signal_machine_correlation の結果（+183枚）は
    # 「シグナルがある末尾はシグナルがない末尾より良い」という意味だが、
    # 「特定1末尾がTHE BEST」とは別。
    # → 月曜: 末尾を1つに絞る根拠なし。RB single が出ても信頼しない（0/5=0%）
    action = "月曜のRB singleは使わない。broad coverage が合理的"
```

## 例
```
月曜日: signal_machine_correlation では最も信頼性が高い曜日
しかし signal_multi_tail single: 0/5 = 0%

解釈: 月曜は投資が広く分散 → どの末尾も「平均的に良い」が、
      1末尾に絞れるほど差がついていない
```

