# signal_machine_correlation と signal_multi_tail は別の問いを測定している

## 背景
2つの分析が異なる問いを立てており、結果が「矛盾するように見える」場合がある。

| 分析 | 問い | 蒲田七の結果 |
|------|------|------------|
| signal_machine_correlation | RBシグナル末尾の他機種は平均的に良いか？ | YES (delta+67, p=4.97e-7) |
| signal_multi_tail_2fn | RBシグナル末尾が2FN単独最優秀末尾か？ | 26.5% (rb 0.90 multi) |

前者はグループ比較（シグナル末尾は平均的に良い）。
後者はピンポイント識別（シグナル末尾がTHE BEST末尾か）。
前者が成立しても後者は難しい——矛盾ではない。

## アクション
```python
# 正しい使い方の区別
# signal_machine_correlation → 「この末尾は平均よりも良い」という確率的優位性の確認
# signal_multi_tail_2fn     → 「この末尾が今日最も良い」というピンポイント選択の検証

# 「RBシグナル末尾を打てば必ず一番当たる」→ 過剰期待（multi hit rate 26.5%）
# 「RBシグナル末尾は打たない末尾より平均的に良い」→ 正しい期待（p=4.97e-7で確認済み）
```

## 例
```
ある日: RBシグナルが末尾2と末尾6に出ている
→ 末尾2と末尾6は他の末尾より平均的に良い（signal_machine_correlation）
→ しかし末尾2が「今日の単独最優秀末尾」かどうかは26.5%しか保証されない
```

