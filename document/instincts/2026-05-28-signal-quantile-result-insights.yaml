# RB quantile 0.90 が最適点。0.85以下は崩壊、0.95は同値

## 背景
蒲田七DBで `signal_multi_tail_2fn.py --signal-source rb --signal-mode quantile` を
複数 quantile で試した結果、single 日数が急崖を持つ：

| quantile | single日 | hit_rate |
|----------|---------|---------|
| 0.85     | 1       | 0.0%    |
| 0.90     | 32      | 21.88%  |
| 0.95     | 32      | 21.88%（同値） |

0.85→0.90 の間に急崖がある。tail-level avg_rb の日次分布が離散的（distinct 値が少ない）ため、
quantile cutpoint が同じ閾値に潰れやすい。0.875 を試しても 0.85 と同様に崩壊する可能性が高い。

## アクション
```python
# 最適設定（蒲田七）
--signal-source rb --signal-mode quantile --rb-quantile 0.90

# 不要な試行
# 0.85:  single 1日のみ（統計的に意味なし）
# 0.875: 崩壊する可能性が高い（試す必要なし）
# 0.95:  0.90 と完全同値（試す意味なし）
```

## 例
```
rb 0.90 の結果:
  single 32日, hit_rate 0.2188 (baseline 0.10)
  adjusted_lift = +118.8% (baseline の 2.2倍)
  水曜: 3/5 = 60%, 日曜: 3/5 = 60%
```

