# hard_miss (hit_at_2==0) は1日のみ。exact_miss を使うべき

## 背景
`nextday_kamata7_20260527_tasks123_verify_...topk.csv` の2F_N（146日）:
- hard_miss（hit_at_2 == 0）: **1日のみ**（99.3%がhit@2）
- exact_miss（予測top1 ≠ 実際rank1）: **44日**（69.86%がexact_hit）

hard_miss はこのモデルには機能しない定義。exact_miss が実用的な「外れ日」。

## アクション
```python
# hard_miss（使わない）
miss_days = df_pred[df_pred["hit_at_2"] == 0]  # → 1日のみ

# exact_miss（使う） - actual_rank1_digit をDBから計算して付加
df_other_day = df_other[df_other["date"] == date]
agg = df_other_day.groupby("last_digit")["diff_coins_normalized"].mean()
actual_rank1_digit = str(agg.idxmax())
exact_miss = (pred_top1_tail != actual_rank1_digit)
# → 44日が対象
```

## 例
```
2F_N の hit@2 rate: 145/146 = 99.3%（hard_miss = 1日のみ）
2F_N の exact hit rate: 102/146 = 69.86%
exact_miss days: 44日 → 分析に使える外れ日

北斗の exact_miss 補正: 3/44 = 6.82%（baseline以下）
→ 北斗は外れ日補正に使えないことが確認された
```

