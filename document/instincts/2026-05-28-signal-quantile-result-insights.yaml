# 水曜・日曜の RB single シグナルは 60%（baseline 10% の6倍）

## 背景
`signal_multi_tail_2fn.py --signal-source rb --rb-quantile 0.90` で
category == "single" の 32日の曜日別 hit_rate:

| 曜日 | n | hit_rate |
|------|---|---------|
| 月   | 5 | 0.000   |
| 火   | 4 | 0.000   |
| 水   | 5 | 0.600   |
| 木   | 2 | 0.000   |
| 金   | 3 | 0.000   |
| 土   | 8 | 0.125   |
| 日   | 5 | 0.600   |

水曜・日曜だけが有意に高い。各 n=5 で確定的ではないが方向性は明確。

ドメイン解釈：
- 水曜: 「末尾重要日」でホールが特定末尾に集中投資 → シグナルも1末尾に収束
- 日曜: 「機種一」イベントで末尾集中 → 同上
- 月/火/木/金: 投資分散 → single条件を満たしにくく、当たらない

## アクション
```python
# 運用判断ロジック
if category == "single" and signal_source == "rb" and day_of_week in ["水", "日"]:
    action = "シグナル末尾を高優先度で選択（60%精度）"
elif category == "single" and day_of_week == "土":
    action = "参考程度（12.5%、baseline 10%とほぼ同等）"
else:
    action = "シグナルは補助情報のみ（multi or 非対象曜日）"
```

## 例
```
水曜: RBシグナルが末尾6に集中（single）→ 末尾6が2FN最優秀末尾である確率60%
月曜: RBシグナルが末尾2/5/6/8に散在（multi）→ 判別力なし
```

