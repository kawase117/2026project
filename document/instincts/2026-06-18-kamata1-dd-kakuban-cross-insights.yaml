# 蒲田1でもコーナー（角番1）は恒常的にマイナス — 蒲田7と共通の汎用法則

## 背景
2026-06-18: 蒲田1 cell_vs_rest 有意（q<0.05）結果:
- 2F_N × kakuban=1 × DD2:  mean=-474, median=-777 (q=0.014)
- 2F_A × kakuban=1 × DD5:  mean=-246, median=-309 (q=0.037)
- 2F_N × kakuban=1 × DD27: mean=-424, median=-719 (q=0.031)

全て mean/median 同方向（ともにマイナス）→ 外れ値ではなく構造的効果。
蒲田7では残差法でも角番1が全セグメントでマイナス [[kakuban-corner-low-setting-structural-bias]] と同じ結果。

## アクション
コーナー台（角番1）は蒲田1でも最後の選択肢とする。
ジャグ系・AT系ともに、訪問日や曜日に関わらずコーナー回避を基本とする。
「コーナー低設定」は蒲田7・蒲田1共通の汎用ルールとして確立。

