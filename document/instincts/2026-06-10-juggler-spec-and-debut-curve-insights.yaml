# 蒲田7アイムジャグラーEX-TPでも機械割104%基準のstreakはほぼゼロ（diffベースstreak=86%とは別現象を再確認）

## 背景
蒲田7アイムジャグラーEX-TP（台番号3325-3362、games_normalized>=1000、n=11,272）について、
機械割104%以上を指標にしたラグ分析:

- baseline hit104率: 30.2%
- 前日hit104→翌日hit104率: 30.8% (streak_pp = +0.6, n=3,392)
- 前日miss→翌日hit104率: 29.8% (rebound_pp = -0.3, n=7,842)

台番号別の内訳でもhit104率は24.8%〜35.1%の範囲で連続的に分布し、
特定の台が突出してstreakを持つわけではない。

これは hit104-lag-no-streak（2026-06-10セッション前半の全ホールスキャン）の
全体結論「機械割104%の前日hit→翌日hit連続性はほぼゼロ」を、
streak=86%が観測された当該機種・当該ホールにおいても再確認する結果。

## アクション
「diffベースstreak=86%」は「特定の台が複数日にわたり高設定で据え置かれている」
現象を捉えているのに対し、「機械割104%以上を達成したか」という二値指標は
日々の確率変動の影響が大きく別の現象である、という解釈を確定情報として扱ってよい。

台選択ロジックでは、翌日も同じ台を狙うかの判断にhit104ベースのlag指標を
使わないこと。diffベースのstreak_rateを優先する。
