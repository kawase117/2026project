# 「機械割104%以上」の閾値が捉える設定レンジは機種ごとに異なる（ジャグラーシリーズ間で公平な比較ではない）

## 背景
juggler-series-bonus-probability-specの出玉率テーブルから、
104%という閾値が各機種の「設定何に相当するか」を整理すると機種間でズレがある。

| 機種 | 設定5出玉率 | 設定6出玉率 | 104%の位置づけ |
|---|---|---|---|
| アイムジャグラーEX | 103.3% | 105.5% | 設定5と6の中間（やや5寄り） |
| マイジャグラーV | 105.3% | 109.4% | 設定5未満（設定4=102.8%〜5の間） |
| ファンキージャグラー2 | 104.3% | 109.0% | 設定5の直下 |
| ゴーゴージャグラー3 | 103.8% | 106.5% | 設定5の直上 |
| ミスタージャグラー | 105.5% | 107.3% | 設定4(102.7%)〜5の間 |
| ジャグラーガールズ | 104.0% | 107.5% | ほぼ設定5そのもの |
| ハッピージャグラー | 105.8% | 108.4% | 設定4(102.9%)〜5の間 |

つまり「機械割104%以上」は、
- アイムジャグラーEX・ゴーゴージャグラー3・ジャグラーガールズでは「設定5以上」を素直に捉える
- マイジャグラーV・ミスタージャグラー・ハッピージャグラーでは「設定4の好調日」も
  混入しやすく、hit104率がやや過大評価されやすい

## アクション
ジャグラー系機種間でhit104率を横比較する場合（機種×ホール固定効果分析など）、
固定の104%ではなく機種ごとに「設定5相当ライン」を個別設定した閾値マップを使うこと。
例: マイジャグラーV/ミスタージャグラー/ハッピージャグラーは閾値を105%程度に上げる、
ファンキージャグラー2/ジャグラーガールズは104%のまま、など。

蒲田7アイムジャグラーEX-TPのbaseline hit104=30.2%は、
6段階均等投入なら設定5+6=33.3%相当なのでほぼ理論値通り
（特別な優遇も冷遇もない）と解釈できる。

