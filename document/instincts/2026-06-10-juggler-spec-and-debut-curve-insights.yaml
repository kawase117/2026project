# 新台導入後day_index別の機械割カーブ：ザシティ/みとや/蒲田7は初日型、ARROWは初日後も高水準が持続（弱いシグナル・要再検証）

## 背景
新台（debut_date > db_start）について、機種ごとにdate昇順でday_index(0=初日)を
振り、day0(初日)とday1-3(2-4日目)平均の機械割を比較した（games_normalized>=200）。

| ホール | day0 | day1-3平均 | 差(day1-3 - day0) |
|---|---|---|---|
| 金時 | 96.4 | 99.8 | +3.4 |
| レイトギャップ | 96.0 | 97.8 | +1.8 |
| ARROW | 100.4 | 100.7 | +0.3（両方高水準） |
| 楽園 | 97.4 | 96.7 | -0.7 |
| ヒロキ | 97.1 | 96.4 | -0.7 |
| 蒲田1 | 98.0 | 96.8 | -1.2 |
| みとや | 103.4 | 101.3 | -2.1 |
| 蒲田7 | 101.7 | 99.5 | -2.2 |
| ザシティ | 103.9 | 98.5 | -5.4 |

day0時点のサンプルサイズはn=54(蒲田7)〜147(楽園)と少なく、kaiwariの標準偏差が
数百%レベルあるため、±1〜5pp程度の差は統計的にノイズの範囲内である可能性が高い。

## 解釈（弱いシグナル）
- ザシティ・みとや・蒲田7は「初日型」（初日が最も高く、2-4日目に機械割が落ちる傾向）
- ARROWは初日からday4まで一貫して100%超で、唯一「初日を逃しても2-4日目まで
  高水準が続く」候補
- 金時・レイトギャップは「2-4日目の方がやや高い」が、両方とも100%未満であり
  実用的な意味は薄い

## アクション
このパターンは確度が低い（confidence=0.55）ため、単独では戦略決定に使わない。
新台を初日に打ち逃した場合のセカンドチャンスとして、ARROWを優先候補にする
程度の弱い参考情報として扱う。サンプル数が増えた段階で再検証すること。

