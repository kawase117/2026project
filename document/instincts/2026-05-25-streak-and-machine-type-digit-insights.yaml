# 日曜はA型・AT系が6-7-8クラスタだがBT機種だけ0-1-2クラスタ（mean=396.9で最高）

## 背景
weekday_machine_top_digits.csv の日曜行:

| 機種タイプ | top1        | top2        | best_cluster | cluster_mean |
|-----------|-------------|-------------|-------------|-------------|
| A型       | 末尾6(348)   | 末尾3(346)   | 6-7-8       |   297.9     |
| AT系      | 末尾6(267)   | 末尾0(199)   | 6-7-8       |   186.0     |
| BT        | 末尾0(446)   | 末尾1(445)   | 0-1-2       |   396.9     |

A型・AT系は揃って6-7-8 → 日曜の末尾6パターンは機種横断的な方針。
BT機種だけ0-1-2クラスタ、かつmean=396.9で日曜全体最高値。

## アクション
日曜のBT台は末尾0-1-2を優先。
ML特徴量: `is_sunday AND is_BT AND last_digit in ["0","1","2"]` の交互作用。
BT台数比率8.6%のため全体順位への影響は小さいが、BT機種限定での選択精度は高い。

## 例
日曜BT best_cluster_mean=396.9 vs 日曜A型 best_cluster_mean=297.9（BT+33%高い）
日曜AT系 best_cluster=6-7-8, mean=186 → A型・AT系は揃って6-7-8方向
