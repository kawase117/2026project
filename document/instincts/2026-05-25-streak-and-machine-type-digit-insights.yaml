# 水曜はstreak≥5が0%。全曜日で最もクリーンな「3末尾局所集中」パターン

## 背景
above_mean_streak_report.csv より水曜のみ pct_streak_ge5=0.0%（46日中0日）。
pct_streak_le3=95.7%（46日中44日）で突出して高い。
concentration_ratio=1.200（delta=38.62）とも整合しており、
水曜は8-9-0クラスタが毎回ほぼ確実に成立する最安定曜日。

## アクション
水曜の `is_wednesday AND last_digit in ["8","9","0"]` 特徴量は他曜日より信頼度が高い。
外れる日がほぼないため precision が高く、過学習リスクも低い。

## 例
水曜46日のうち44日でstreak≤3 → 3末尾クラスタが外れる日は2日のみ
対比: 土曜はpct_streak_le3=69.6%（3末尾クラスタが外れる日が3割）

