# 木曜はA型・AT系が0-1-2クラスタ、BT機種だけ8-9-0クラスタと完全に分離

## 背景
weekday_machine_top_digits.csv の木曜行:

| 機種タイプ | top1       | top2       | best_cluster | cluster_mean |
|-----------|------------|------------|-------------|-------------|
| A型       | 末尾2(308)  | 末尾9(301)  | 0-1-2       |   290.9     |
| AT系      | 末尾7(292)  | 末尾2(248)  | 0-1-2       |   225.5     |
| BT        | 末尾8(283)  | 末尾9(270)  | 8-9-0       |   230.1     |

A型・AT系は共に best_cluster=0-1-2（ホール全体の木曜 leftward パターンと整合）。
BT機種だけ 8-9-0（反対端）のクラスタを形成。
AT系の top1=末尾7 はクラスタ外の孤立強末尾（ニブイチでAT系の末尾7に集中投入仮説）。

## アクション
木曜のクラスタ特徴量を機種タイプで分けて設計:
- A型・AT系: `is_thursday AND last_digit in ["0","1","2"]`
- AT系追加: `is_thursday AND last_digit=="7" AND is_AT`
- BT: `is_thursday AND last_digit in ["8","9","0"]`
BT比率8.6%のため全体特徴量への寄与は限定的だが、BT台限定では有効。

## 例
木曜A型top1=末尾2(308) vs 木曜BT top1=末尾8(283): 同じ木曜でも全く逆のクラスタ

