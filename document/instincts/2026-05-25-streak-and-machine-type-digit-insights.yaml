# ハーフ列（streak≥5）は稀な例外。基本パターンは3末尾局所集中（mean_streak≈2.3〜3.0）

## 背景
above_mean_streak_report.csv（n=46日/曜日）より:

| 曜日 | mean_streak | streak≥5% | streak≤3% |
|------|-------------|-----------|-----------|
| 水   |    2.326    |  0.0%     |   95.7%   |
| 金   |    2.696    |  2.2%     |   78.3%   |
| 火   |    2.783    |  4.3%     |   78.3%   |
| 土   |    2.957    |  6.5%     |   69.6%   |
| 月   |    2.739    |  8.7%     |   76.1%   |
| 日   |    2.795    |  9.1%     |   79.5%   |
| 木   |    2.761    |  10.9%    |   80.4%   |

全曜日でmean_streak=2.3〜3.0であり、基本は「3末尾の島」が分離して現れる。
ハーフ列（5末尾以上連続で全体平均超え）は最多の木曜でも10.9%しか発生しない。

## アクション
ML特徴量は「5末尾連続」フラグではなく「3末尾クラスタ内フラグ」を主軸にする。
streak≥5フラグは木曜・日曜・月曜のみ補助特徴量として検討余地あり（それ以外は情報量ゼロ）。

## 例
水曜: 46日中streak≥5が0日 → 3末尾クラスタのみで水曜の特徴量は完結
木曜: 46日中5日（10.9%）でハーフ列 → ニブイチ日に稀に連続半分が発生する

