# 回転数2000以下の台を除外するとavg_diffが大幅改善

## 背景
直近7日間のTop50で games>2000 フィルタを適用した結果:
- v6a: +133 → +421 (改善+288, 残34.6台)
- v9b: +226 → +443 (改善+217, 残36.7台)
- v9c: -12 → +174 (改善+186, 残37.3台)
低回転台は設定判別に必要な試行数が足りず、ランダムノイズが大きい。

## アクション
実運用時はTop50から games<2000 の台を除外して提示する。
バックテスト評価時も games>=2000 フィルタ後の指標を主要KPIとする。
ただしスコアリング自体には全台を含める（低回転でも高設定の可能性はある）。

## 例
6/15 v6a rank7: 台2330 games=1186 Pay=49.4% diff=-1800 → 低回転で極端な負け、除外対象。
6/15 v6a rank8: 台2030 games=3311 Pay=152.4% diff=+5200 → 十分な回転で高設定確定。

