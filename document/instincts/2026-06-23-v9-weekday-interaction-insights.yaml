# 蒲田7は曜日ごとに異なるコンポーネントが有効

## 背景
Twitter答え合わせから蒲田7の曜日別イベントパターンが確定:
火曜=角番、水曜=末尾、土曜=3台並び、木曜=ニブイチ、金曜=列1台、月曜=列全体、日曜=機種1台。
6/16(火曜)の検証で、AT角6台のc4(曜日)=1079 vs 非角6台=502(差+577)と、
c4が間接的に火曜×角番の交互作用を捉えていることが判明。
一方c5(末尾)はKWゲート(p<0.05)でほぼ全セグメント非有意→0化され、
水曜・土曜の末尾パターンを完全に殺している。

## アクション
1. c5のKWゲートを水曜・土曜のみ緩和(p<0.20)または無効化
2. 火曜日のみc1(角番)ウェイトを増幅（例: 1.5倍）
3. 曜日×コンポーネント交互作用の統計検証をCodexに依頼済み（結果待ち）
4. 全42パラメータ(7曜日×6コンポーネント)の交互作用は過学習リスク高→有意なものだけ採用

## 例
火曜日のv6a Top50: AT角6台5台がrank 1,3,4,11,15に入選。c4寄与が大きい。
土曜日の全バリアント: 末尾7AT=0台、末尾2Norm=0台がTop50。c5=0のため完全に見逃し。

