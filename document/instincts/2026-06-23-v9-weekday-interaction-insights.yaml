# バリアントごとに捕捉できる示唆パターンが異なる

## 背景
6/15-6/21の7日間でTwitter答え合わせとTop50を照合した結果、各バリアントの得意パターンが判明:
- v6a: イベント日に強い（vs_other=81.0）、角番示唆を間接的に捕捉（c4経由）
- v9b: 非イベント日に強い（vs_other=60.6 vs v6aの40.4）、バランス型
- v9c: 3F_L_A(ジャグラー)に偏重するが、結果的にAT角6を多く捕捉（6/16で5台）
全バリアントでActual Top10の2F台を見逃す共通問題あり。

## アクション
単一バリアントでの運用ではなく、3バリアントのアンサンブルまたはイベント日/非イベント日での切り替えを検討する。
加重平均期待値: イベント日v6a + 非イベント日v9b = vs_other 65.9（v6a一本の51.0より+14.9改善）。
v9cは角番示唆日のサブ予測として価値がある。

## 例
6/16(火曜): v6a AT角6=5台, v9c AT角6=9台(v9cが有利)
6/18(木曜): v6a シャーマンキングrank11, ヴァルヴレイヴrank6, 吉宗rank8(v6aが有利)
6/20(土曜): v9b vs_other=542(v9bが圧勝)

