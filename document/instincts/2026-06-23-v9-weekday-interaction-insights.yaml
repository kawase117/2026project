# Twitter答え合わせは差枚ベース評価の盲点を補完する

## 背景
diff_coins_normalizedベースの評価（avg_diff, lift@50）では、
「高設定だが結果が出なかった台」を正しく評価できない。
6/18 真打吉宗(diff=+4100, HIT)は検出できたが、
シャーマンキング(diff=+100)やヴァルヴレイヴ2(diff=-900)は
高設定にも関わらずdiffが低く、差枚評価では「ハズレ」扱い。

## アクション
定期的にTwitter答え合わせとTop50予測を照合し、以下を評価:
1. 示唆機種がTop50に何台入っているか（機種捕捉率）
2. 示唆パターン（角番、末尾、並び等）との一致度
3. 差枚が低い高設定台の見逃し率
バックテストの数値改善だけでなく、この定性評価で方向性を判断する。

## 例
6/18: v6aはシャーマンキング(rank11)、ヴァルヴレイヴ2(rank6)、吉宗(rank8)を全捕捉。
しかしdiffベースでは吉宗のみHIT。示唆ベースでは3/3=100%捕捉率。

