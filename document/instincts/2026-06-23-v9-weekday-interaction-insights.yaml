# パーセンタイル変換はスコア解像度を潰す

## 背景
v9cはセグメント内パーセンタイル(0-1)に変換するため、compositeが0.8-1.0の狭い範囲に集中。
Top10の大半がcomposite=1.0で同値となり、tiebreakがdiff_coins_normalizedに依存。
また特定セグメント(3F_L_A)に偏重し、7日間で同じ台が毎日Top50に出現（x7が大量）。
avg_diff=200.3(全バリアント最高)だが、lift@50=0.920(ランダム以下)。

## アクション
パーセンタイル変換を使う場合は、変換後のスコアに追加の差別化要素を加えて解像度を確保する。
またはパーセンタイルではなくz-score正規化を検討する。
v9cの「avg_diff最高」は強セグメントへの偏重結果であり、分散の欠如が裏にある。

## 例
6/15 v9c Top10: 6台が3F_L_A、全てcomposite=1.0。当たる日(+264)と外れる日(-817)の振れ幅が極端。
v9cの頻出台: カバネリ海門x7日、戦国乙女5x7日、化物語x7日 — 毎日同じ台を推薦。

