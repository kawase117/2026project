# 最小サンプル数フィルタ(min_group_size)は「基本の内訳テーブル」と「ランキング専用テーブル」で別々に適用する

## 背景
単日レポートページで「機種別104%超え率TOP5」等のランキングにノイズ削減用の `min_group_size>=3` を導入した際、共有集計関数のデフォルト値にそのまま設定してしまい、機種別/角番別/Section別の**基本成績テーブル**からも1〜2台しかない機種・角番が無言で消える不具合をコードレビューで指摘された。基本テーブルの目的は「その日何が起きたか漏れなく見る」ことであり、ランキング専用の閾値を巻き込んではいけない。

## アクション
共有集計ヘルパーの`min_group_size`はデフォルトを1（フィルタなし）にし、ノイズ削減が必要なランキング系の呼び出し側だけで明示的に閾値を渡す。「基本表示用の集計」と「ランキング/ハイライト用の集計」は同じ関数を使っていても閾値のスコープを混同しない。

## 例
```python
DEFAULT_GROUP_MIN_SIZE = 1
MIN_GROUP_SIZE_FOR_RANKING = 3

def summarize_group_performance(df, group_column, *, min_group_size=DEFAULT_GROUP_MIN_SIZE):
    ...

# 基本テーブル（全件保持）
machine_summary = summarize_group_performance(daily_df, "machine_name")
# TOP5ランキング（呼び出し側で明示指定）
top5 = summarize_group_performance(daily_df, "machine_name", min_group_size=MIN_GROUP_SIZE_FOR_RANKING)
```

