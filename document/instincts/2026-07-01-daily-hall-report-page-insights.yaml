# 機械割%は「games_normalized×3枚/G」を投入枚数とみなす近似式で計算する

## 背景
機械割(%) = 総払出枚数 ÷ 総投入枚数 × 100、総払出枚数 = 総投入枚数 ± 差枚数。DBには機種ごとの正確なベット数（3枚固定/1〜2枚等）が保存されていないため、現行機の大半を占める3枚ベット固定を前提にした近似式を採用した。1〜2枚ベット機種が混在すると誤差が出る既知の限界がある。

## アクション
機械割・104%超え判定が必要な箇所では `bet = games_normalized * 3`, `payout_rate = (bet + diff_coins_normalized) / bet * 100` を共通関数として一箇所に実装し、`games_normalized`が0またはNaNの行はNaNを返す（0除算回避）。3枚/G近似の限界をdocstringに明記する。同じ式を複数箇所に再実装しない。

## 例
```python
def compute_payout_rate(df: pd.DataFrame) -> pd.Series:
    """3枚/G固定を前提とした近似式。正確なベット数がDBに無いための既知の限界。"""
    games = pd.to_numeric(df["games_normalized"], errors="coerce")
    diff = pd.to_numeric(df["diff_coins_normalized"], errors="coerce")
    bet = games * 3.0
    rate = (bet + diff) / bet * 100.0
    return rate.where((bet > 0) & bet.notna())

# 検証済み: 総投入2100枚・+300枚 → 114.3%
```

