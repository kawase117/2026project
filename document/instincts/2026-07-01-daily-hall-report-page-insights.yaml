# 新規ページは4ファイルへの登録が必要（main_app.pyとdashboard/main.pyは重複コード）

## 背景
ダッシュボードのページルーティングは `dashboard/pages/__init__.py`（import + `__all__`）、`dashboard/config/constants.py`（`PAGES`リスト）、`dashboard/main.py`（import + `PAGE_ROUTER`）、`main_app.py`（`dashboard/main.py`とほぼ同一内容の重複エントリーポイント）の4ファイルに分散している。1つでも漏れるとページがサイドバーに出ない、またはルーティングエラーになる。

なお `constants.py` には `PAGE_REGISTRY` という辞書も存在するが、grepで確認した限りどこからも参照されていない未使用コード（死んだコード）。ページ到達性には無関係。

## アクション
新規ページ追加時は必ず以下4ファイルすべてを更新する。`PAGE_REGISTRY` は触らなくてよい。
1. `dashboard/pages/__init__.py`
2. `dashboard/config/constants.py`（`PAGES`リストのみ）
3. `dashboard/main.py`
4. `main_app.py`

## 例
page_18_daily_report.py 追加時の実際の変更箇所:
- `dashboard/pages/__init__.py`: import + `__all__` に `page_18_daily_report` 追加
- `dashboard/main.py` / `main_app.py`: import + `PAGE_ROUTER["daily_report"] = page_18_daily_report.render`
- `dashboard/config/constants.py`: `PAGES` に `{"icon": "🗒️", "title": "前日レポート", "key": "daily_report"}` 追加

