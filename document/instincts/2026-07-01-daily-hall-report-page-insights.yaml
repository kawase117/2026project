# 角番・Section・セグメント情報は machine_layout / machine_master テーブルから直接JOINできる

## 背景
蒲田1/蒲田7/みとやのホールDBには `machine_layout`（section, rank_from_min, rank_from_max、みとやのみ追加で rank_from_aisle, physical_corner）と `machine_master`（jug_flag/hana_flag/oki_flag/bt_flag）が既に投入済み。EDA側のkakuban関連スクリプトはHeatmap座標CSVを都度パースしているが、ダッシュボード用途ではDBの単純JOINで十分足りる。

確認済みの投入状況:
- `machine_layout`: マルハンメガシティ2000-蒲田1.db(360行), -蒲田7.db(715行), みとや大森町店.db(266行)
- `machine_master`: 上記3ホールいずれも100件超で投入済み

## アクション
角番/Section/セグメント別集計が必要な新規ページでは、まず対象ホールDBに `machine_layout` / `machine_master` テーブルがあるか `sqlite_master` で確認し、あれば `machine_number` でJOINする。座標CSVパースやEDAのkakuban専用モジュール（`eda/kamata7_lastdigit_lr_eda.load_coords()`等）は再利用しない。テーブルが無いホールは該当セクションを非表示にする（try/exceptで握りつぶすのではなく事前にテーブル存在確認で分岐する）。

## 例
```python
def has_table(db_path, table_name) -> bool:
    with sqlite3.connect(db_path) as con:
        row = con.execute(
            "SELECT 1 FROM sqlite_master WHERE type='table' AND name=? LIMIT 1",
            (table_name,),
        ).fetchone()
    return row is not None
```

