# 関数名に「JST」を含めるなら zoneinfo で明示変換する（datetime.now()だけでは名前と実装が乖離する）

## 背景
`_jst_today()` という名前の関数の中身が `datetime.now().date()`（ホストのローカル時刻）だった。開発機がJSTだったため一見問題なく動いていたが、UTC等のサーバー環境で実行すると「前日」のデフォルト値が日付境界（JST深夜〜早朝）でズレる。名前が実装を保証しない典型例で、コードレビューで指摘され`zoneinfo.ZoneInfo("Asia/Tokyo")`による明示変換に修正された。

## アクション
タイムゾーンを名前に明記する関数は必ず`zoneinfo.ZoneInfo`等で明示変換する。`datetime.now()`のみに頼らない。実行環境のローカルタイムゾーンに依存する日付計算（「前日」「今日」のデフォルト値など）は特に注意する。

## 例
```python
from zoneinfo import ZoneInfo

def _jst_today() -> date:
    return datetime.now(ZoneInfo("Asia/Tokyo")).date()
```

