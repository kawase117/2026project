# low_support（n<10）が全バリアントで12〜15件：条件層の分割が細かすぎる

## 背景
ceiling_effect フレームワークの条件層評価（16分割）で
全バリアントが low_support=12〜15/16 件という高い警告率を示した。

これは「n<10 のサブグループが多数ある」ことを意味し、
統計テストの信頼性が低い条件層が多い。

## アクション
low_support が 50%（8/16）を超える場合:
- 条件層を粗くする（quartile → median split、weekday → weekday/weekend）
- または CONDITIONAL vs CONDITIONAL+ の区別を low_support なし条件のみで再計算する

## 例
全11バリアントで low_support=12〜15/16（75〜94%）
→ 現行16分割評価では判定精度が低い
→ 8分割（weekday×2 × half×4）への変更を検討する
