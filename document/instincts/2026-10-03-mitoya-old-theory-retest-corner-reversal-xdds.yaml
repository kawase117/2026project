# みとや: 昔のセオリーを機械割とRB期待比で再検定した(通路角1は4月末で逆転、X_DDSは非ジャグラーに残る)

## 背景
2025-07-08〜2026-10-02(約15か月)のみとや大森町店で、旧セオリーを機械割(差枚÷3G)とジャグラーのRB期待比(O/E)で再検定した。区間は日を別々にブートストラップした95%区間。
- 横島(h_jug)のジャグラーの通路角1は、同じ日の他の台に比べ、2026年4月まで12か月連続で機械割+1.1〜+2.7pt、RB O/E+0.04〜+0.15だった。5月以降は6か月連続で逆転(機械割−0.6〜−2.0pt、RB O/E−0.06〜−0.15)。回転数比は1.46から1.21へ低下。
- X_DDS日の底上げは今も残る(全体 4/26まで+1.87pt[1.50,2.25]、4/27以降+1.33pt[0.80,1.89])。ただし主役は非ジャグラー(横島非ジャグラー+3.24→+2.31pt、縦島非ジャグラー+1.50→+2.44pt)。横島ジャグラーは+0.58→−0.11ptで4/27以降は区間が0をまたぐ。混在805区画は判定不能。
- 日を問わない強さのwalk-forward(前3か月で選び翌月に実行): 島は4月まで7か月中7か月で正(+0.70pt)、5月以降+2.65pt(区間0.46〜5.34)。機種は5月以降+2.80pt(区間0.92〜4.17)、4月まで判定不能。台番号・通路角番・末尾は使えない。
- 注意: 島はほぼ主機種と一対一(501-522=マギアレコード、540-556=北斗、574-590=東京喰種、591-607=モンキーターンV)で、島の効果と機種の効果は分離できていない。2026年10月は2日分だけで、10月の値は参考にしない。
- 5月以降のX_DDS日×非ジャグラーの機種別上位は、マギアレコード+12.6pt(台日155)、ゴッドイーター+11.2pt、スマスロ北斗+5.4pt、化物語+4.4pt、東京喰種+3.9pt。下位は真打吉宗−2.8pt、攻殻機動隊−1.4pt。カバネリ海門は5月以降、全体より+4〜+6pt高い状態が5か月続く(4月以前は±0〜+3)。

- 全軸の総当たり(2026-10-03、`backtest/unit_time_scan.py`): 曜日・D・DD・ゾロ目・月内の週・給料日・祝日・前日の稼働・台帳のイベント日×機種124・島18・タイプ5を、全期間と4/27以降で検定。機種・島の個別セルはBH補正後に4/27以降で残らない。位置(末尾・角番・並び)×時間も4/27以降は補正後0セル。
- **訂正**: ジャグラーの曜日別RB(土日低い・木曜高い)とX_DDS日のRB低下は、回転数帯で揃えたO/Eの偏りによる見かけ。土日は1台平均約6,000G(平日約4,500G)で、高い回転数帯の基準と比べて低く出た。帯補正なしでは全曜日±1%(日曜のみ−1.3%)。X_DDS日のジャグラーは帯補正−2.7%、補正なし(曜日調整後)+2.4%で符号が割れ、判定しない。

## アクション
- みとやの通路角1のジャグラーは、2026年5月以降は狙わない(避ける側)。旧セオリー「h_jug角1最強」は2026-04-26で失効と扱う(測定ミスの撤回ではなく、ホールが変えた可能性)。
- X_DDS日は、非ジャグラー(特にマギアレコード、北斗、東京喰種、化物語)を候補にする。ジャグラーは根拠が無い。
- 日を問わない強さは、機種(直近3か月で機械割が高い機種)を使う。島は機種と分離できていないので、独立の根拠にしない。末尾・台番号・通路角番(全体)は使わない。
- モンキーターンVはボーナス欄の意味が保留のため、機械割だけで見る。
- 未確認: 通路角1の逆転日の厳密な特定、台674の鉄台説、DD24の古いルール、AT初当り(北斗・戦国乙女4・ダンベル)による裏取り。

## 例
2026年6月のh_jug通路角1は、機械割が同日の他の台より−1.6pt、RB O/Eが−0.09だった。2025年12月は+1.9pt、+0.05だった。
