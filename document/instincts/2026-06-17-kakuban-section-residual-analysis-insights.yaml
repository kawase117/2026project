# コーナー台（角番1）は全セグメントで恒常的に低設定 — 選台で避けるべき位置

## 背景
2026-06-17: kamata_kakuban_section_residual_eda.py による残差分析結果。
セクション日次平均を差し引いた残差で検定（セクション効果を除去済み）。

全セグメント共通で 角番1 の平均残差がマイナス:

| セグメント | 角1残差 | q値 |
|---|---:|---|
| 蒲田7 3F A | -140.7 | 1.4e-29（最強） |
| 蒲田7 3F N | -205.9 | 1.2e-7 |
| 蒲田7 2F N | -147.2 | 1.1e-9 |
| 蒲田1 2F A | -80.9 | 3.1e-12 |
| 蒲田1 2F N | -106.5 | 2.4e-5 |

## アクション
- コーナー台（角1）は「目立つ場所だから高設定」という直感は誤り
- ホール側はコーナーに低設定を配置する傾向がある（全ホール・全フロアで一貫）
- 選台においてコーナー台は最後の選択肢とする
- 角15, 16, 17, 18, 20 も多くのセグメントでマイナス残差（深い位置も低い傾向）
- 対して中間ポジション（角5-9）がプラス残差 — 優先候補

