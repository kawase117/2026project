# イベント日×角番・曜日×角番のパターンはセクション効果の混入だった

## 背景
2026-06-17 セクション残差法による検証（Analysis B, C）結果:

旧分析（生diff_coins）では有意だったもの:
- 蒲田7 3F A / イベント日: 角15(+272, q=1.3e-6), 角1(+256, q=2.6e-5)
- 蒲田7 2F A / 非イベント日: 角3,4,8 に曜日パターン
- 蒲田1 2F A / イベント日: 15/20ポジションが有意

残差化後(Analysis B, C): 有意ゼロ行

## アクション
- 「イベント日に角15を狙え」という戦略は誤り。角15はセクション平均以下（残差マイナス）
- 「非イベント日の火曜に角3が強い」という戦略も証拠なし
- イベント日はセクション全体が均等に上がるが、セクション内の角番格差は変わらない
- ホール側の設定戦略はセクション（島）単位で動いており、角番単位では動いていない
- 選台戦略: セクション選択（島の選択）が主軸、角番は「中間を選ぶ」だけで十分

## 方法論的教訓
生diff_coinsでの角番分析はセクション効果とポジション効果が混在する。
残差(diff_coins - section_mean)で分析するとイベント日・曜日パターンが消えた。
ポジション恒常効果（角1が低い、中間が高い）は残る = 真の位置効果。

