# 角番位置効果は実在するが「恒常的な設定傾向」であり、日種や曜日では変化しない

## 背景
2026-06-17 の一連の分析（dual-kakuban 再分析 → 残差分析）により確定。

| 問い | 答え |
|---|---|
| 角番ポジション効果は実在するか? | Yes（残差でも有意, Analysis A） |
| それは特定台番号効果か位置効果か? | 位置効果（残差除去後も有意） |
| イベント日で角番の相対格差が変わるか? | No（残差後に消える） |
| 曜日で角番の相対格差が変わるか? | No（残差後に消える） |
| どのポジションが恒常的に強いか? | 中間（角5-9）がプラス、コーナー（角1）がマイナス |

## アクション
1. 「角番 x イベント日/曜日」の交互作用は生diff_coinsでは偽陽性リスクがある
2. 残差法（セクション平均除去）を必須の検定として位置付ける
3. 残差後に有意なのは「恒常的な位置格差」のみ → これを選台の基盤として使う
4. イベント日の戦略はセクション選択（どの島か）に集中し、角番は「中間を選ぶ」だけ
