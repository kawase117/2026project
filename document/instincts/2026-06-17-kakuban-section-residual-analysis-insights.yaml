# セクション残差法: 島全体効果を除去してポジション効果を純粋に検出する設計パターン

## 背景
2026-06-17: kamata_kakuban_section_residual_eda.py で実装・検証済み。

## アクション
実装パターン:
```python
# Step 1: セクション日次平均（フィルタなし、生データで計算）
section_mean = df.groupby(["date", "section"])["diff_coins_normalized"].transform("mean")

# Step 2: 残差計算（セクション内n>=3の日のみ有効）
df["residual"] = df["diff_coins_normalized"] - section_mean
valid_mask = df.groupby(["date","section"])["machine_number"].transform("count") >= 3
df.loc[~valid_mask, "residual"] = np.nan

# Step 3: 分析フィルタ（games_normalized >= 400）はresidual計算後に適用
df_analysis = df[df["games_normalized"] >= 400].dropna(subset=["residual"])

# Step 4: kakuban双方向展開後にresidualでgroupby検定
expanded = _expand_dual_kakuban(df_analysis)
# Kruskal-Wallis on expanded["residual"] by expanded["kakuban"]
```

適用すべきケース:
- 島ごとの良し悪しが大きく、台レベルのポジション効果を分離したい時
- 旧分析の「ポジション効果」がセクション効果の混入でないかを検証したい時

