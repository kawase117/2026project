# 「機種の初登場日」をホール全体の最古出現日で定義すると、後から増設・入替された台の経過日数を過大評価する

## 背景
`eda/core.py` の `compute_debut_features` は debut_date を
`df.groupby("machine_name")["date"].min()` で計算していた——machine_name(機種名)
単位でホール全体での最古出現日。楽園蒲田店で実測したところ、5台以上ある167機種の
うち152機種（91%）で、台番号ごとの設置開始日がバラバラだった（例: からくりサーカスは
2025-01-01〜2026-06-15まで1年半に渡って台番号ごとに新規設置）。

これは「その機種がホールに初めて現れてから何日か」を測っており、「その台がいつから
そこにあるか」ではない。後から増設・入替された台は実際には新品でも、その機種が
過去に別の台番号で先に登場していれば巨大な経過日数を持つことになる。実測では
旧定義が真の設置日数を平均150日以上（最大537日）過大評価していた。

正しい定義は「台番号単位のrun」: 同じmachine_numberで直前の行と同じmachine_nameが
続く限り同一run、machine_nameが変わればrunをリセットする（`add_slot_tenure`関数）。

この誤りにより、楽園の「経過日数61-180日でプラス転換」という主張は撤回された
（機種内残差・正しい起点で測ると全binが非有意で実質ゼロ。document/rakuen_theory.md §5）。

## アクション
- 「設置経過日数」「新台/古台」を扱う分析では、debut/初登場の起点が machine_name
  単位（機種のホール全体での初出現）なのか machine_number単位のrun（その台番号の
  現在の設置が始まった日）なのかを必ず確認する。前者は「経過日数」として使うには
  不適切
- 同じ機種が複数の台番号・複数の時期に設置される（増設・入替がある）ホールでは、
  machine_name単位の最古出現日は経過日数の代理変数として機能しない
- 修正後は必ず、旧定義とどれだけ乖離するか（過大評価の平均・最大値）を実測して
  報告する。乖離が小さければ許容範囲だが、楽園では150日以上というプロジェクトの
  bin定義（1-14/15-60/61-180/181+日）を軽く超える規模だった

## 例
`eda/rakuen_slot_tenure_recheck.py`の`add_slot_tenure`関数と
`debut_definition_comparison.csv`（旧定義との乖離を定量化）。
document/rakuen_theory.md §5訂正枠を参照。

