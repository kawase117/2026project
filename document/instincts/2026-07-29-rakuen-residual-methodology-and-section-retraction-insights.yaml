# §8のセクション×DD狙い目/避け目ルールは機種内残差での再検証で1つも再現しなかった

## 背景
document/rakuen_theory.md §8（2026-07-12作成）は avg_diff（回転数交絡未処理）と
旧43 section定義に基づき、1130-1134を「31日全てマイナスの恒常回避区画」、
3117-3120を「DD11・DD29・DD30favorable/DD25・DD31・DD14avoid」、1209-1216を
「DD10/11/22/30でリフトするEvent-responsive区画」と結論していた。

2026-07-29、境界が変わっていない4区画を機種内残差（同日×同機種平均からの残差）
で再検証したところ、旧主張は1つも再現しなかった。1130-1134は32.3%がプラスで
DD22有意プラス、3117-3120は該当favorable/avoid日が全て非有意（DD25はむしろ
プラス）、1209-1216は該当4日全て非有意（代わりにDD13・DD21が機械割・BB+RB
両方で有意という新発見）。4区画・31日=124検定中有意は9件で、5%水準の偶然期待値
（約6.2件）をわずかに上回る程度だった。

## アクション
- §8由来の運用ルール（旧Type A/B、旧Event-responsive）は台選びの判断材料に
  使わない。document/rakuen_theory.md §12.5に撤回記録あり
- DD13・DD21×1209-1216（ジャグ、機械割+BB+RB両方有意）は新発見として
  `status: watching`。ただし124検定中の話であり、事前登録・耐久性検証を経るまで
  過信しない
- 同種の「セクション×DD」分析を他ホールで行う際は、最初から機種内残差（同日×
  同機種残差）を主指標にする。avg_diffやhit率から入ると、後から全面撤回する
  コストが発生する（このセッションで実際に発生したコスト）

## 例
`eda/rakuen_section_dd_swing_recheck.py`、
`eda/results/rakuen_section_dd_swing_recheck/dd_swing_by_section.csv`。
document/rakuen_theory.md §8訂正枠・§12.5を参照。
