# 機種内残差は「比較したい単位の外側に、同じ機種の対照群が存在する」場合にしか意味を持たない。対照群が単位内に閉じていると数学的にゼロへ退化する

## 背景
楽園蒲田店で2回、同じ構造のバグ/罠に遭遇した。

(1) 「本館>新館」の建物単位勾配を機種内残差で測ろうとしたところ、ジャグ・ハナハナ・
技術介入はカテゴリ内の全機種が本館↔新館のどちらか一方に完全に閉じ込められており
（複数棟にまたがる機種が0件）、機種内残差では原理的に建物間の差を検出できなかった。
唯一AT一般だけ23機種が両棟にまたがっており、検定可能だった（結果は非有意）。

(2) §8のセクション×DDスイングを機種内残差で再検証する際、SQLクエリで対象4区画
だけに先に絞り込んでから残差を計算したところ、実際は他区画にも設置されている
機種（マイジャグラーVは1197-1208と1209-1216の両方に存在）の残差が「絞り込んだ
4区画内だけ」で計算し直され、モデルがその区画に閉じ込められているかのような
人為的なゼロ退化を生んだ。原因はデータの現実ではなく、クエリ設計のバグだった。

数学的な理由: resid = value - mean(value | date, machine_name) は、その日その機種の
グループ平均をその日その機種のグループ全体から引く。もし「比較したい単位」（フロア・
セクション群等）が、たまたまその機種の全個体を含んでいる（＝機種がその単位に完全に
閉じている）なら、単位内平均は定義上ゼロになる。逆に機種がその単位をまたいで複数
存在するなら、残差は単位間の真の差を反映できる。

## アクション
- 機種内残差で「単位A vs 単位B」を測る前に、必ず「単位Aと単位Bの両方にまたがる
  機種が何機種あるか」を確認する。0件ならその指標では検定不能（有意/非有意ではなく
  未定義）と明記し、無理に結果を報告しない
- SQLで対象範囲を先に絞り込んでから残差を計算するコードは書かない。**必ずホール
  全体（絞り込みなしの母集団）で残差を計算し、絞り込みは残差計算の後に行う**。
  対象を絞ってから計算すると、範囲外に存在する同一機種の対照群が失われ、
  人為的なゼロ退化を生む
- 結果が「ほぼ全ての行でぴったり0.0000」という不自然に整った値になったら、まず
  この退化を疑う。real な効果がゼロ近辺に分散する場合、0.0000という完全な値には
  普通ならない

## 例
`eda/rakuen_building_gradient_recheck.py`（本館/新館比較、ジャグ・ハナハナ・技術介入は
機種の複数棟またぎが0件で検定不能と判明）と `eda/rakuen_section_dd_swing_recheck.py`
（当初の実装ミスでresid_dmが全DDで0.0000になり、SQLの絞り込み順序を修正して解決）。

