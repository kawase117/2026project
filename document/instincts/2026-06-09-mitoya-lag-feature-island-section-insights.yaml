# CatBoost Windows + Python 3.14 "bad allocation" workaround

## 背景
Windows + Python 3.14 環境において、CatBoostRegressor の最初の `.fit()` 呼び出しが
`_catboost.CatBoostError: bad allocation` で必ず失敗する現象が発生した。
- メモリ（9GB空き）・ディスク（177GB空き）・GPU使用率に問題なし
- `allow_writing_files=False` 追加・NaN sentinel 埋め・pipe redirect 変更でも解決せず
- 同一プロセス内で一度でも fit() が成功していれば、それ以降は正常動作する
- 診断：CatBoost 内部スレッドプール/メモリアリーナの遅延初期化が、
  最初の本番 fit() の C++ 側でレースコンディション or バッファ確保失敗を起こすと推測

## アクション
main() の冒頭にダミーウォームアップ fit を1回実行する。
たった10イテレーション・数値特徴量のみで十分。本番 fit の前に CatBoost 内部状態を初期化する。

```python
def _catboost_warmup():
    dummy_X = pd.DataFrame({'a': np.arange(20, dtype=float), 'b': np.arange(20, dtype=float)})
    dummy_y = np.arange(20, dtype=float)
    CatBoostRegressor(iterations=10, depth=2, verbose=0, allow_writing_files=False).fit(dummy_X, dummy_y)

def main():
    _catboost_warmup()  # 必ず最初に呼ぶ
    ...
```

## 例
- 症状: run_split() 内の model.fit() が bad allocation → どこを直しても再現
- 確認: ウォームアップなしで単体 fit を試すと同様に失敗
- 修正後: ウォームアップ1回で全 split の fit が正常完走

