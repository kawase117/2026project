# みとや Island 粒度が Section より優位（lag追加後も）

## 背景
ラグ特徴量込みの最終比較（train_months=6）:
- Island baseline: Pearson=0.280, Top30%=0.444（行数1034、lag追加で悪化）
- Section baseline: Pearson=0.215, Top30%=0.398（行数9306、lag追加でほぼ不変）

Island baseline が依然として最良。ただし行数が少ないため拡張に弱い構造的弱点あり。

## アクション
- Island baseline（dd, dow, bucket, island）が現時点での最良モデル
- is_event / month_progress_rate の単独効果は未検証（lag と bundle だったため分離不可）
  → 次の実験候補: Island baseline + is_event のみ単体追加で効果確認
- train_months=12 の旧ベースライン(0.419)とは直接比較不可（ウィンドウ長が異なる）

## 例
- Island baseline avg Pearson=0.280, avg Top30%=0.444（train_months=6）
- Section+lag avg Pearson=0.213, avg Top30%=0.389（Island に及ばない）

