# みとや大森町店に 'bari' island は存在しない

## 背景
assign_island() の定義: machine_num >= 832 を 'bari' に分類。
みとや大森町店の machine_detailed_results における machine_number の実際の範囲:
- MIN=501, MAX=815, n=266台
→ 815 < 832 のため、みとやには 'bari' カテゴリが1台も存在しない。
exclude_values=['other'] でフィルタすると、実質 main_jug / main_mix の2グループのみ。
「3島モデル」と称するスクリプトが実際には2島で動く状態になっていた。

## アクション
- みとや専用スクリプトでは island カテゴリ数を動的に表示・確認する
- assign_island() のしきい値がホール固有の台番号体系に依存することを常に意識する
- 別ホール（蒲田7番など）では bari が存在する可能性があるため、
  全ホール共用スクリプトでは island の value_counts を必ず出力してから分析する

## 例
- みとや island value_counts: other=72380, main_mix=38775, main_jug=26367, bari=0
- exclude=['other'] 後: 2グループ、1034行（= 2 x 517日）

