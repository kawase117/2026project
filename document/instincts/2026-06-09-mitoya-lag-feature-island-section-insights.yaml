# みとや over_104_rate ラグ特徴量は改善しない

## 背景
Island / Section x {baseline, +lag(N=5)} の 2x2 比較実験を実施。
追加ラグ特徴量（3種、リーク防止済み trailing MA）:
- ma_all_5    : その島/区画の直近5回（全期間）over_104_rate 移動平均
- ma_event_5  : 同上、イベント日のみ
- ma_bucket_5 : 同上、同一 bucket のみ

結果:
- Island: baseline Pearson=0.280 → +lag Pearson=0.233 (Delta=-0.047)
- Section: baseline Pearson=0.215 → +lag Pearson=0.213 (Delta=-0.002)
- Top30%も Island で -0.083、Section で -0.009 と改善なし。

## アクション
- ラグ特徴量（移動平均 3種）は採用しない
- Island の悪化理由は2つの可能性:
  1. 1034行に特徴量3つ追加でオーバーフィット（行数不足）
  2. みとや設定投入に時系列自己相関がそもそも存在しない（ランダム化戦略と整合）
- Section が±0に近いのは、行数多い（9306行）のでオーバーフィットしにくいが
  有用な情報もないことを意味する
- 今後の lag/autocorrelation 系特徴量は、この結果を根拠に優先度を下げる

## 例
- train_months=6, walk-forward, CatBoostRegressor(depth=4, iterations=200)
- NaN sentinel = -1.0（over_104_rate の範囲 [0,1] 外の値でリーク防止）

