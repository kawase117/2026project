# LTR（Learning-to-Rank）で Binary Classification を置き換える

## 背景
日付単位でグループ化したXGBRankerは、Binary Classificationの「クラスアンバランス問題」と「絶対閾値問題」を両方回避できる。
`rank:ndcg` objective は NDCG@K を最大化し、Hit@K と相関が高い。
既存の `ml/last_digit/core_ranking.py` に `fit_ranker()` が実装済みで再利用可能。

## アクション
1. `fit_ranker(X, y, train_dates, objective="rank:ndcg")` を使う
2. グループ化は `train_dates`（日付）単位 → 同日の全機種が1グループ
3. `ltr_relevance = 1 - rank_pct`（高いほど良い機種）をターゲットにする
4. Time-decay: `decay_lambda=0.3` で直近日を重視する
5. 評価は Hit@1, Hit@3, NDCG@3 を使う

## 例
```python
from ml.last_digit.core_ranking import fit_ranker

sorted_df = train_df.sort_values(["date", "machine_name"]).reset_index(drop=True)
ltr_relevance = (1.0 - sorted_df["rank_pct"]).clip(0.0, 1.0)

ranker = fit_ranker(
    sorted_df[feature_columns].fillna(0.0),
    ltr_relevance.to_numpy(dtype=float),
    sorted_df["date"],
    objective="rank:ndcg",
    random_state=42,
    decay_lambda=0.3,
)
scores = ranker.predict(pred_df[feature_columns].fillna(0.0))
```

