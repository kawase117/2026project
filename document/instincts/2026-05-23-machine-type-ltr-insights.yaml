# rank_pct の月別平均でトレンドを捉える

## 背景
`avg_diff_coins` の絶対値は機種間で異なるため、「この機種は最近良くなっている」というトレンドを絶対値では捉えにくい。
`rank_pct`（同日の全機種内でのパーセンタイルランク、0=最良, 1=最悪）を月別ウィンドウで集計することで、
機種のトレンド（上昇・横ばい・下降）を機種間比較可能な形で表現できる。
`_calendar_shift_window_mean()` が machine_type_common.py に実装済みで再利用可能。

## アクション
```python
g["rank_pct_avg_1m"] = _calendar_shift_window_mean(g["date"], g["rank_pct"], lag_days=1,  window_days=30)
g["rank_pct_avg_2m"] = _calendar_shift_window_mean(g["date"], g["rank_pct"], lag_days=31, window_days=30)
g["rank_pct_avg_3m"] = _calendar_shift_window_mean(g["date"], g["rank_pct"], lag_days=61, window_days=30)
g["rank_trend_1m_vs_2m"]     = g["rank_pct_avg_1m"] - g["rank_pct_avg_2m"]  # 負=改善
g["rank_trend_acceleration"]  = g["rank_trend_1m_vs_2m"] - (g["rank_pct_avg_2m"] - g["rank_pct_avg_3m"])
g["rank_trend_1m_available"]  = (g["rank_pct_avg_1m"].notna() & g["rank_pct_avg_2m"].notna()).astype(int)
```

## 例
```
機種A: rank_pct_avg_1m=0.25, rank_pct_avg_2m=0.45 → trend=-0.20（大幅改善）
機種B: rank_pct_avg_1m=0.40, rank_pct_avg_2m=0.38 → trend=+0.02（横ばい）
→ 機種Aに注目すべき
```

