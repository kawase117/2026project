# ステージ式ランキングアーキテクチャ（A案）

## 背景
末尾別・機種別・角番別の予測を単純に加算すると、各モデルのスケール差や信頼度差が無視される。
A案（ステージ式）はそれぞれの角度を「異なる質問に答えるモデル」として役割分担する。
Stage1（同機種内ランキング）が最も強いシグナルで、Stage2（2000枚確率）は信頼度ゲート。

## アクション
1. Stage1: machine_type LTR モデルで同機種内の順位付け（設定投入パターン検出）
2. Stage2: 独立した diff_classifier.py で P(diff_coins >= 2000) を推定（並列開発）
3. Stage3: Stage1スコア × Stage2確率を掛け合わせて最終スコア化
4. A型機種（ジャグラー等）は独立した角度（RB確率等）を使う

## 例
```
朝一台選択フロー：
機種A（AT）: Stage1=0.85, Stage2=0.71 → 最終=0.60
機種B（AT）: Stage1=0.72, Stage2=0.83 → 最終=0.60
機種C（A型）: Stage1=0.65, RB率=0.55 → 参考候補
→ 同スコアならStage1が高い機種Aを優先
```

