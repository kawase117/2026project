# クロスセクション正規化で機種間比較を可能にする

## 背景
機種ごとに差枚の構造的差異がある（ハナハナは元々差枚が少ない、AT機は多いなど）。
絶対値の差枚をそのまま特徴量として使うと、機種間の構造差がシグナルを覆い隠す。
同日の全機種に対して正規化（zscore, rank_pct, vs_mean）を施すことで、
「この機種は今日の平均よりどれだけ高いか」という相対的シグナルを抽出できる。
`add_machine_type_features()` の `cross_cols` タプルに列名を追加するだけで自動生成される。

## アクション
`cross_cols` タプルに対象カラムを列挙する。各カラムに対して3特徴量が自動生成：
- `{col}_vs_mean`: 同日平均との差
- `{col}_zscore`: 同日標準偏差で正規化
- `{col}_rank_pct`: 同日内パーセンタイルランク

対象候補：lag系、rolling系、ewm系、games系すべて。

## 例
```python
cross_cols = (
    "lag_1_avg_diff_coins",
    "rolling_avg_diff_7d",
    "ewm_avg_diff_7d",
    "rolling_avg_games_7d",   # ゲーム数の相対比較も有用
)
# → lag_1_avg_diff_coins_vs_mean, _zscore, _rank_pct が自動生成される
```

