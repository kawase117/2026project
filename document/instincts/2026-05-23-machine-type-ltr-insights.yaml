# F1スコアの構造的上限問題

## 背景
機種別学習で `is_rank_1` を二値分類ターゲットにすると、F1スコアが構造的に低くなる。
機種が N 種ある場合、`is_rank_1` の base_rate = 1/N（10〜20種なら0.05〜0.10）。
このとき F1 の理論的上限 ≈ base_rate × 2 = 0.10〜0.20 程度にとどまる。
F1=0.09 はモデルの性能が低いのではなく、タスク定義の問題である可能性が高い。

## アクション
1. F1 ではなく Hit@1, Hit@3 を主評価指標とする
2. 「ランク1を完璧に当てる」ではなく「上位候補を順序付け」というタスクに再定義
3. XGBRanker（LTR）への転換を検討する
4. ベースライン比較：Hit@1 の理論下限 = base_rate (≈1/N)、Hit@3 = base_rate × 3

## 例
```python
metrics = common.evaluate_prediction_day(
    work, target="is_rank_1", score_col="score", threshold=0.5
)
# hit_at_1, hit_at_3 が base_rate を上回っていれば有意な改善
print(f"Hit@1={metrics['hit_at_1']:.3f}, base_rate={metrics['base_rate']:.3f}")
```

