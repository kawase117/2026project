# 予測粒度シフト: セクション×日は有効、台×週は無効

## 背景
台×日のhist_metric（rho=+0.038, D0→D9=+6.0pp）をベンチマークに2つの粒度シフトを検証:
- セクション×日: section_avg_hist rho=+0.195, D0→D9=+10.1pp → ベンチマークの5倍
- 台×週: hist_metric rho=+0.043, D0→D9=+2.2pp → ベンチマークと同等（改善なし）

セクション集約が有効な理由: N台の平均を取ることでノイズが√N倍縮小する。
週集約が無効な理由: 台単位のままでは7日平均でもノイズ縮小が不十分。

## アクション
- 予測粒度の改善はセクション（空間集約）方向で進める
- 台×週（時間集約）はこれ以上追求しない
- みとや等他ホールでもセクション×日の粒度が有効か検証する価値がある

## 例
ベンチマーク比較:
  台×日 hist_metric:       rho=+0.038, D0→D9=+6.0pp
  セクション×日 section_avg_hist: rho=+0.195, D0→D9=+10.1pp ← 5倍
  台×週 hist_metric:       rho=+0.043, D0→D9=+2.2pp ← 改善なし
