# セクション×日の2段階パイプラインが台×日の5倍の予測力を持つ

## 背景
predict_section.pyの60日walk-forward評価で検証:
- Stage 1（セクション選択）: section_avg_hist rho=+0.172, p<0.0001
- Stage 1+2（セクション選択＋台選び）: Top1sec×5台で104%超え率39.6%（baseline 31.6%, +8.0pp）
- グローバルhist Top5は34.0%（+2.4pp）→ 2段階の方が+5.6pp優位
- 全ての台数（5/15/25/50台）でStage1+2がグローバルhist単体を上回る

台×日のcompositeスコアはrho≈0で予測力ゼロだったが、セクション粒度にすることでrhoが+0.172に。
hist_metricの信号（rho=+0.038）に加え、「好調台が集まるセクション」の構造シグナルが追加される。

## アクション
- 蒲田7の予測はpredict_section.pyの2段階パイプラインを使う
- predict_gated.pyのcomposite Top50は予測根拠がないため、推薦の主力にしない
- セクション選択（Stage 1）が台選び（Stage 2）より大きな信号を持つため、セクション選択を優先する
- 実運用では--top-sections 5 --top-machines-per-section 5（25台）が精度と網羅性のバランス点

## 例
60日walk-forward評価（台数揃え比較）:
  Stage1+2 top1sec×5台:  39.6% (lift=1.25x) vs グローバルhist Top5:  34.0% (lift=1.08x)
  Stage1+2 top5sec×5台:  36.8% (lift=1.16x) vs グローバルhist Top25: 34.4% (lift=1.09x)
  Stage1+2 top10sec×5台: 35.9% (lift=1.14x) vs グローバルhist Top50: 34.7% (lift=1.10x)

