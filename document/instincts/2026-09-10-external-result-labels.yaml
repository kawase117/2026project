# 楽園蒲田: 角1は該当台になりにくく中間角が優位。末尾7は外部ラベルで過剰

## Core claim
ホールが公表した該当台（`external_result_machines`、28日・253グループ・975台）を
設置構成比と比べると、**角1が半分以下・中間角が過剰・末尾7が過剰**。
残差法による既存の知見が、まったく別の情報源で再現した。

## Evidence
グループ（日付×機種）を単位にブートストラップ4,000回。台を独立と数えると
区間が過小になるため（全台系は機種の設置台に一括でラベルが付く）、
再標本化の単位はグループにした。

角番（`min(rank_from_min, rank_from_max)`）:

| 角番 | ラベル構成比 | 設置構成比 | 95%CI | |
|---|---|---|---|---|
| **角1** | **11.6%** | 23.9% | [9.6, 13.8] | 低 |
| 角2 | 17.6% | 22.5% | [15.4, 19.9] | 低 |
| 角3 | 18.9% | 17.5% | [17.0, 20.7] | — |
| 角4 | 19.9% | 13.8% | [18.0, 21.8] | 高 |
| 角5 | 17.3% | 11.4% | [15.2, 19.5] | 高 |
| 角6 | 11.1% | 8.5% | [9.1, 13.2] | 高 |

末尾:

| 末尾 | ラベル構成比 | 設置構成比 | 95%CI | |
|---|---|---|---|---|
| **7** | **15.0%** | 10.1% | [12.9, 17.2] | 高 |
| 2 | 12.2% | 10.1% | [10.6, 13.8] | 高 |
| 4 | 8.3% | 10.1% | [6.8, 9.8] | 低 |
| 5 | 8.0% | 10.1% | [6.6, 9.4] | 低 |

## Interpretation
- 角1劣位・中間角優位は、2026-06-17 に残差法で得ていた結論と一致する。
  **手法も情報源も独立**（あちらは自前の差枚残差、こちらはホールの公表台）
- 末尾7は [[tail7-segment-shifts-between-days]] が「効果はあるが乗るセグメントが日替わり」
  としたもの。28日を通した集計では**配置の偏りとして安定して存在する**。
  差枚残差でほぼゼロ（+123）だったのは指標の問題であって、現象は実在した

## 限界
- **交絡が切れていない。** 角1の台は客が座りにくく回転が伸びないため、それを含む
  機種グループが「結果が出た」として公表されにくい、という間接経路がありうる。
  位置そのものは選ばれていないが、この経路は否定できていない。
  **機種を固定して角1とそれ以外を比べる**のが次の検証
- グループは完全な独立単位ではない（同じ機種が複数日に出る、同じ島に固まる）
- セクション別では `2234-2242` が28.2%と突出するが、8/10の化物語全台系がそのまま
  出ているだけで機種と交絡している。この n ではセクション軸は分離できない

## Action
- 楽園蒲田の候補選定で、角1の台を積極的に選ばない。中間角（4〜6）を優先する
- 末尾7を「差枚に出ないから無い」と切り捨てない。RB確率か公表ラベルで見る
- この知見を運用に載せる前に、機種固定での再検証を通すこと
