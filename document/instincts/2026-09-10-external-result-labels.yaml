# 結果発表アカウントから外部の正解ラベルが取れる。閾値1800は本物の全台系の3割以上を取り逃がす

## Core claim
`slokotae7` は毎日1ホールについて、ホールが公表した該当台を定型で書いている。
これを取り込むと **89ホール・269投稿・機種×日1,333件** の正解ラベルになる。
自前データには `backtest/announce/` の数十件しか正解ラベルが無く、閾値1800は
自分のスコア分布から決めた値なので、取りこぼし率を自分で検算すると循環する。
**外部コーパスはこの循環を断つ唯一の材料である。**

取り込み: `backtest/result_corpus.py`（`build` / `link-machines` / `stats`）
格納先: `db/analysis_results.db` の `external_result_reports` /
`external_result_models` / `external_result_machines`

## Evidence
【全台】と公表された機種386件の平均差枚（当方スケールへ変換後）:
中央 +1,925 / p25 +915 / p10 +192。全粒度1,120件の p05 は **-408枚**。
**本物の全台系の4分の1は平均差枚が+1,000に届かず、5%は負けている。**

`score = G比 × 平均差枚` なので、G比を振ると閾値1800の取りこぼしは:

| G比 | 必要平均差枚 | 取りこぼし |
|---|---|---|
| 1.2 | 1,500 | 40.7% |
| 1.4 | 1,286 | 35.6% |
| 1.6 | 1,125 | 32.3% |
| 2.0 | 900 | 25.4% |

楽園蒲田の自ホール実測（全台系ラベル15件）は 27%（4/15）だが 95%CI 8〜55% で、
単独では何も決められない。**コーパス推定のほうが精度が高い。**

報告値のスケールは実測で解決済み: `実測 = 1.0266 × 報告 + 25.8`
（楽園の台番号付き55件、残差sd 9.2枚）。20260810 化物語9台の独立サンプルでも再現。
同じ突き合わせで **G数・BB・RB は画像とDBが全台完全一致**したので、
ボーナス系の値をOCRで取る必要はない（`rb_count`/`bb_count` の充足率は100%）。

## Interpretation
- [[zentaikei-threshold-is-traffic-dependent]] は「低稼働だと指標が届かない」という
  **機構**を示した。本 instinct はその帰結の**大きさ**を外部データで測ったもの。
  両者は同じ現象の別側面であり、競合しない
- 取りこぼしは低G比・低稼働の少台数機種に集中する。楽園の全台系ラベル15件では
  差枚73% / ボーナス確率40% / どちらか80% / 両方miss 20%。
  [[diff-blind-to-settings-use-bonus-rate-vs-own-baseline]] は正しいが万能ではなく、
  `bonus_rate` の稼働フィルタで**検定対象にすら入らない機種が残る**（4件中2件）

## 限界
- 投稿者は目立つ日を選んで書くので、コーパスは強い日に偏る。
  したがって取りこぼし率は **下限** と読む
- 89ホールは当方の10ホールではない。台の配置則をここからプールしてはいけない
  （[[feedback-no-cross-hall-pooling]] は動かさない）。使ってよいのは事前分布としてだけ
- 構造化できるのは `slokotae7` のみ。`999999Q9Q` / `kawasakislot` / `sloneko222` は
  散文で、このパーサでは構造化率0%。蒲田1・蒲田7のラベルには専用パーサが要る

## Action
- 閾値未達を「仕掛けが無かった」と読まない。3割以上は構造的に届かない
- 予告の的中率を出すときは、この取りこぼしを分母の注記に入れる
- 楽園蒲田の台単位ラベルは `external_result_machines` から引く（1,058台×28日）
- **画像由来の台番号は必ず本文由来のホール・営業日に対して画像単位で存在率を検証する。**
  投稿単位でやると混入を見逃す（`scrape_tweets.py` が画像を別ツイートに紐付けていた事故がある）

