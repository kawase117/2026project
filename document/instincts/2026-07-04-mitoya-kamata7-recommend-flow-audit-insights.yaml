# みとや台選びスクリプトが独自にwalk-forward最適化済みの重みを本番コードに反映していなかった

## 背景
ユーザーから「台選びフローが古い形式になっていないか確認して、更新できるフローがあれば更新して」という依頼を受けた。調査の結果、`eda/mitoya_recommend_optimize.py`によるwalk-forward最適化が既に実行済みで、結果が`eda/results/mitoya_optimize_best.json`（lift@10_avg=255.4）に保存されていたにもかかわらず、本番スクリプト`eda/mitoya_recommend.py`の`_score_machine()`と`eda/mitoya_recommend_backtest.py`の`CURRENT_WEIGHTS`は旧い手動重み（lift@10_avg=185.5相当）のまま放置されていた。

さらに重大なバグとして、`h_nonjug_corner1_nonevent_penalty`という変数名にもかかわらず値が **+50**（ボーナス）になっていた。document/mitoya_theory.mdでは非イベント日のh_nonjug corner1はavg_diff **-160**の「罠」と明記されており、既存の最適化グリッドサーチ（`STAGE2_GRID`）も最初から負の値[-200,-150,-100,-50,0]を探索するよう設計されていた形跡があった（つまり開発者は本来ネガティブになるべきと認識していたが、本番の初期値・現行値には反映し忘れていた）。最適化結果は-100だった。

## アクション
- 「フローが古くないか」「更新できる箇所はあるか」と聞かれたら、理論文書(theory.md)とスコアリングコード(_score_machine等)の数値を1行ずつ突き合わせるだけでなく、**該当ドメインのoptimize/backtestスクリプトの出力ファイル（JSON/CSV）が既に存在しないか確認する**。既に検証済みの改善結果が本番コードに反映されず眠っているケースがある。
- 変数名・辞書キーの命名（`_penalty`, `_bonus`等）だけで符号が正しいと判断しない。必ず実際の値を確認し、理論文書に記載の実測avg_diffの符号と一致するか照合する。
- optimize系スクリプトのグリッド定義（探索範囲）自体が、開発者の「本来あるべき符号」についての手がかりになる場合がある（このケースでは負の値を含むグリッドが定義されていたのに、ベースライン値は正のままだった）。
- 修正は本番CLIスクリプト（`mitoya_recommend.py`の`_score_machine`）と、optimizeの基準値として使われる`mitoya_recommend_backtest.py`の`CURRENT_WEIGHTS`の両方に同期させること。前者だけ直すと「現行=最適化結果」の前提が崩れ、次回の最適化実行時に古い基準と比較してしまう。

## 例
```python
# NG: 変数名は "penalty" だが値が正でボーナスとして機能してしまう
CURRENT_WEIGHTS = {
    "h_nonjug_corner1_nonevent_penalty": 50.0,  # 理論書のavg_diff=-160と矛盾
}

# OK: eda/results/mitoya_optimize_best.jsonの最適化結果(-100)と同期
CURRENT_WEIGHTS = {
    "h_nonjug_corner1_nonevent_penalty": -100.0,
}
```

