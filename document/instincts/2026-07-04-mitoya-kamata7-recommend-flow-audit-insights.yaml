# 蒲田七の角番ルールと冷却ゾーン判定は独立に適用すると衝突する

## 背景
2026/07/04（DD=4, 通常日, 土曜）の台選び予測で、DD1-6ビンの角番ルール「3F_L_A→角5」を機械的に全セクションに適用したところ、候補の1つ（台3135、マイジャグラーV、セクション3131-3143の角5）が、document/kamata7_theory.mdに記載の「構造的冷却ゾーン」（3131-3140、常時回避）に含まれていることが判明した。同様に3F_L_Nの中間台(角番5-11)ルールも、セクション3058-3072・3073-3087の一部が「可変冷却ゾーン」（非イベント日は回避、イベント日のみ回復）と重なっていた。

角番ルールと冷却ゾーンルールは理論文書の別々の節（2.1角番 / 冷却ゾーンの二分法）に記載されており、machine-levelで統合されていない。単純に「DDビン表→最強角番→該当セクション全部」を機械的に適用すると、回避すべき台を推薦してしまう。

## アクション
- 蒲田七の台選定では、角番/末尾ルールで候補を出した後、必ず「その台番号が既知の冷却ゾーンブロック（3061-3070, 3081-3090, 3131-3140等）に含まれないか」を最終チェックとして通すこと。
- 今日が非イベント日なら「可変冷却」も「構造的冷却」も両方回避対象（可変冷却はイベント日のみ回復するため）。イベント日なら可変冷却は候補に戻してよいが構造的冷却は常時回避。
- 同一セクション内で複数の角番が候補になり得る場合（例: 角5とd8/d9末尾台特定シグナルが同じセクションにある場合）、冷却ゾーンに触れていない方の台・セクションを優先する。

## 例
```python
COOLING_ZONES_STRUCTURAL = [(3131, 3140)]  # 常時回避
COOLING_ZONES_VARIABLE = [(3061, 3070), (3081, 3090)]  # 非イベント日のみ回避

def in_cooling_zone(machine_number: int, is_event_day: bool) -> bool:
    if any(lo <= machine_number <= hi for lo, hi in COOLING_ZONES_STRUCTURAL):
        return True
    if not is_event_day and any(lo <= machine_number <= hi for lo, hi in COOLING_ZONES_VARIABLE):
        return True
    return False

candidates = [m for m in corner_rule_candidates if not in_cooling_zone(m, is_event_day)]
```

