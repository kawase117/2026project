# predict_gated.pyはプレイ済みの過去日を評価するツールであり、未実施の当日を事前予測するツールではない

## 背景
蒲田七の2026/07/04（当日）予測でLayer0（GATED/NOGATE判定）を確認しようと`python -m ml.experiments.walkforward_scoring.predict_gated --date 20260704`を実行したところ、`No data for 2026-07-04`のエラーで失敗した。原因を確認すると、このスクリプトは対象日の実績データ（machine_detailed_results等）が既にDBに存在することを前提にした**バックテスト/事後評価ツール**であり、まだプレイされていない当日・翌日には原理的に使えない。

「当日の台選び予測をしてほしい」という依頼に対して、既存のwalk-forward MLパイプラインをそのまま流用しようとすると、この種の失敗が起きる。事前予測には理論文書ベースのルールベース判断（Layer1-4の手動適用）か、専用の「ライブ予測」モードを持つスクリプトが必要。

## アクション
- 当日・未来日の予測を依頼された場合、まず対象スクリプトが「事後評価用」か「事前予測用」かを確認する。DBに対象日の行が存在するかどうかで簡単に判定できる（`SELECT MAX(date) FROM machine_detailed_results`と比較）。
- 事後評価専用ツールしか存在しない場合は、理論文書(theory.md)のルール（Layer0-4等）を手動適用し、DB最新日のレイアウト・実績データで具体的な台番号を特定する運用に切り替える。
- Layer0（GATED/NOGATE）のように「その日にならないと判定できない」項目は、事前予測では「判定不能」と明示し、確信度を標準にとどめる。存在しないデータを無理に埋めない。

## 例
```python
# 事前チェック: 対象日がDBに存在するか確認してから実行方針を決める
latest_date = pd.read_sql_query("SELECT MAX(date) as d FROM machine_detailed_results", conn)["d"].iloc[0]
if target_date > latest_date:
    print("対象日は未プレイ。predict_gated.py等の事後評価ツールは使えない。理論ルールを手動適用する。")
```
