# イベント日はホール別に日付を確定する。同名・同時期のイベントを他店に当てはめない

## 背景
2026-09-19 に蒲田1・蒲田7の「カマタに集合」の開催日平均差枚を比べたとき、過去の開催日を両店に同じ5日で当てはめた。
実際は、カマタに集合は両店同日（6/13・7/25・8/30・9/19）だが、蒲田1の回胴エムワンバトル収録（6/28・7/26）は別イベントで蒲田1のみだった。
収録日を蒲田7の開催日に混ぜたため、両店とも平均が不正確だった（ユーザーの指摘で発覚）。
原因は、日付が予告JSONの自由記述にしか無く、日付で引ける形で残していなかったこと。
同じ構造の誤りは他にもあった。蒲田1の演者来店の投稿（蒲田1の店長アカウント）の演者を、蒲田7にも来たものとして入れかけた。
9/1 の蒲田7には、蒲田1の周年・店長就任とは別に、あしなっくすの来店があった。

## アクション
1. イベントは `backtest/event_days.py`（`document/registry/EVENT_DAYS.jsonl`）に、**ホールごとの行**として日付つきで残す。同日開催は `--related-halls` で結ぶ。
2. 「同日か」「別イベントか」は本文とユーザー確認で決める。推測で他ホールの日に当てはめない。
3. 他店の店長アカウントの投稿にだけ載る演者は、自店にも来たか未確認と書く。
4. 効果を測る前に `event_days.py list --hall` で、そのホールの開催日を確認する。
5. 基準日は同曜日の平常日（イベント日・1/7の付く日・30日・ゾロ目を除く）にする。

## 例
NG: 「6/28と7/26は蒲田のイベント日なので、蒲田1・蒲田7の両方に入れる」
OK: 「6/28・7/26は蒲田1のM1収録のみ。カマタに集合は両店同日（6/13・7/25・8/30・9/19）。台帳でホール別に確認して比べる」

