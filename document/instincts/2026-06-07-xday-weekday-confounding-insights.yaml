# x_day の末尾シグナルは曜日由来ではない — 3つの独立した根拠

## 背景
x_day（day%10 in {4,7}）の末尾選択シグナルが「たまたま特定曜日に偏って当たっていた」という
曜日交絡の可能性を検証した。
x_day DD（4/7/14/17/24/27）はそれぞれ 17 回出現し、7 曜日に std=0.53（min=2, max=3）で均等分散。
さらに土曜という同一曜日で x_day 有無を比較したところ桁違いの差が観察された。

## アクション
x_day の末尾シグナルの独立性は確認済み。曜日交絡の懸念は不要。
新しいバケット候補を検証する際も、曜日分布が均等かどうかを最初に確認する（std < 1.0 が目安）。

## 例
```
根拠1: 曜日分布が完全均等
  x_day DD はそれぞれ 17 回出現、7 曜日に std=0.53（min=2, max=3）で均等分散
  → 特定曜日への偏りがなく、交絡は構造的に発生しない

根拠2: スケールが非x_day日の5〜10倍
  x_day 日の末尾 mean_diff: 100〜460 の範囲
  非x_day 日の末尾 mean_diff: -40〜+80 の範囲

根拠3: 同一曜日（土曜）でのコントロール比較
  x_day 土曜: 末尾4=+447, 末尾7=+284
  非x_day 土曜: 末尾4=+41, 末尾7=-20
  → 同じ土曜でも x_day かどうかで桁違いの差。DD 固有効果と確定
```

