# x_day 内で曜日が「どの末尾が1位か」を変調する — ただし n=2〜3 で未確定

## 背景
x_day 日を曜日別に集計したところ、木曜・日曜では末尾4も末尾7も top3 に入らないという
傾向が観察された。しかし各曜日の観測数は n=2〜3 にすぎず、統計的に不十分。

## アクション
現時点では仮説として記録するにとどめる。
運用上の変更（曜日×x_day 特徴量のモデル追加）は各曜日 n >= 10 になるまで保留。
現在の walk-forward は全曜日まとめた x_day バケットのまま維持する。

## 例
```
x_day 日の曜日別 top3 末尾（みとや, n=2〜3/曜日）:
  月: [7, 1, 2]  → 末尾7 が1位
  火: [1, 4, 7]  → 末尾4, 7 が存在
  水: [6, 3, 7]  → 末尾7 が3位（4は圏外）
  木: [1, 3, 6]  → 末尾4, 7 とも top3 外 ← 仮説として保留
  金: [9, 7, 1]  → 末尾7 が2位
  土: [4, 3, 7]  → 末尾4 が1位、末尾7 が3位
  日: [2, 1, 8]  → 末尾4, 7 とも top3 外 ← 仮説として保留

現時点での安牌: 月・火・水・金・土 → 末尾7
               土・火 → 末尾4 も有力
               木・日 → 判断保留（データ蓄積待ち）
```

