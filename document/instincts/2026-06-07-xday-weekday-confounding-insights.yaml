# 同一曜日でのDD有無比較がDD効果の最も純粋な検証手法

## 背景
「DD=X の日が強い」という観察に対して「その日が特定曜日に偏っているだけでは？」という
交絡を排除するには、同じ曜日でDD有無を比較するのが最も直接的な手法。

## アクション
新しいバケット候補を評価する際は以下を実施する：
1. そのDD の曜日分布を確認（std > 1.5 なら要注意）
2. 同じ曜日の DD有無で mean_diff を比較
3. DD あり >> DD なし なら DD 固有効果と判断
spread 値だけでなく「同一曜日コントロール群との比較」を評価基準に加えること。

## 例
```python
# 土曜コントロール比較（x_day の検証に実施）
# x_day 土曜: 末尾4=+447, 末尾7=+284
# 非x_day 土曜: 末尾4=+41,  末尾7=-20
# → 同一曜日内でDD有無の効果が明確 → DD固有効果と確定

# 応用: 新候補 DD=30 の検証
# DD=30 は月末（30日）のため特定曜日に偏りやすい
# → DD=30 と同じ曜日の非 DD=30 日で比較することでDD効果を分離する
```
