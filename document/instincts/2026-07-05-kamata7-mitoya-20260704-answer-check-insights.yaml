# 蒲田七の土曜「三台並び」は機種タイプ(A/N)で対象末尾が分岐する（2026-07-04で実証）

## 背景
2026/07/04（土曜、DD=4・通常日）の蒲田七の実績データ（DB更新後）で答え合わせを行ったところ、ユーザーから「ノーマル機（ジャグ・ハナハナ＝A機）は末尾4を含む三台並び、AT（A機以外＝N機）は末尾8を含む三台並びだった」という現場情報が提供され、実データでも極めて明確に裏付けられた。

- **N機の8トリオ**: 台3068-3070（ミリオンゴッド‐神々の軌跡‐）平均diff **+10,333**、台3037-3039（ソードアート・オンラインII）平均diff **+9,800**。いずれもホール全体平均(+97.6)を100倍以上上回る突出値。
- **A機の4トリオ**: 台3272-3274（マイジャグラーV）平均diff **+3,966.7**（3273=+5,000, 3272=+4,500がA機全体で当日TOP2）。

既存instinct `kamata7-weekday-investment-pattern-ground-truth`（2026-05-25作成）は「土曜=三台並び、末尾クラスタ6-7-8」とA/N機種タイプを分けずに記載していたが、今回の実データはN機ではこのクラスタと整合する一方、A機は全く別の末尾帯（3-4付近）に投入されていたことを示した。**土曜の三台並びルールは機種タイプで対象末尾帯が分岐する**ことが2026-07-04の1日分だが具体的な数値で確認された。

## アクション
- 蒲田七の土曜の台選びでは、「三台並び」を機種タイプ非依存の単一ルールとして適用しない。**A機（ジャグ・ハナハナ）は末尾4付近、N機（AT系）は末尾8付近の連番3台ブロック**を別々に探索する。
- 角番ルール（中間台優位）で選んだ候補プールの中に、末尾クラスタの中心となる台番号が含まれているかを追加でチェックする。今回、3F_R_Aの「角番5-11中間台」候補プールには実際に当たった3272-3274ブロックが含まれていたが、最終推薦の例示リストでは具体的に明示されていなかった（候補プールに入っているだけでは不十分、明示的な「連番3台ブロック」抽出を推薦ロジックに組み込む必要がある）。
- サンプルはまだ1日分のみ。次回以降の土曜データでも同じA=4/N=8の分岐が再現するか確認し、再現すれば`kamata7-weekday-investment-pattern-ground-truth`本体の表を「土曜: A機=末尾4トリオ, N機=末尾8トリオ」に更新する。

## 例
```python
def find_hot_triplet(df, center_digit, seg_filter):
    """center_digitを含む連番3台ブロックのうち平均diffが最大のものを返す"""
    sub = df[df["seg"] == seg_filter].set_index("machine_number")["diff_coins_normalized"]
    candidates = []
    for m in sub.index:
        if any((m + offset) % 10 == center_digit for offset in (-1, 0, 1)):
            trip = [m - 1, m, m + 1]
            if all(t in sub.index for t in trip):
                candidates.append((trip, sub.loc[trip].mean()))
    return max(candidates, key=lambda x: x[1]) if candidates else None

# 土曜の推薦生成時:
a_hot = find_hot_triplet(df, center_digit=4, seg_filter="A")   # 例: [3272,3273,3274]
n_hot = find_hot_triplet(df, center_digit=8, seg_filter="N")   # 例: [3068,3069,3070]
```

