# 「可変冷却ゾーンは非イベント日に回避」ルールが2026-07-04（非イベント日）に外れた

## 背景
document/kamata7_theory.mdの冷却ゾーンの二分法では、3061-3070は「可変冷却」（DD7等のイベント日のみ回復、非イベント日は回避）に分類されている。2026/07/04はDD=4の非イベント日だったため、このルールに従い3061-3070を推薦候補から除外した。

しかし実績データでは、台3068-3070（ミリオンゴッド‐神々の軌跡‐）が当日+8,800/+13,100/+9,100という蒲田七全体で最大級の値を記録した。これは[[kamata7-saturday-triplet-splits-by-machine-type-digit]]で確認した「土曜×N機×末尾8トリオ」パターンの中心そのものであり、DD由来のイベント回復ではなく、曜日由来（土曜=三台並び）の別の投入ロジックがこのゾーンを一時的に「熱く」した可能性が高い。

## アクション
- 冷却ゾーンの「非イベント日は回避」判定は、**DD由来のイベント日判定のみを見ている**ため、曜日由来の投入パターン（土曜の三台並び等）と衝突しうる。冷却ゾーン判定を適用する前に、当日が「曜日固有の投入イベント」（土曜=三台並び等）に該当しないかを先にチェックすること。
- 該当する場合は、冷却ゾーンの回避判定よりも曜日ベースの末尾トリオ探索（[[kamata7-saturday-triplet-splits-by-machine-type-digit]]参照）を優先する。
- サンプル1日のみのため、次回の非イベント日・非土曜のケースでも3061-3070が冷えたままかを再確認し、再現すれば元の「可変冷却」判定自体は維持してよい（今回はDD由来ルールと曜日由来ルールが競合しただけで、DD側の判定自体が誤りとは断定しない）。

## 例
```python
# NG: DD由来の冷却ゾーン判定だけで機械的に除外
if is_variable_cooling_zone(machine) and not is_event_day(dd):
    exclude(machine)

# OK: 曜日由来の投入イベントを先にチェックしてから冷却ゾーン判定を適用
if weekday == "土" :
    check_saturday_triplet_pattern(machines)  # 該当ブロックは冷却ゾーン判定より優先
elif is_variable_cooling_zone(machine) and not is_event_day(dd):
    exclude(machine)
```
