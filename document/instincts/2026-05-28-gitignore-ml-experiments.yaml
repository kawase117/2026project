# CODEX連携は未追跡ファイル問題の原因ではない

## 背景
.gitignore 設定の不完全さが原因で、新しいファイルが「追跡すべきか除外すべきか」の判定が曖昧な状態になる。
これはCODEX連携（claude-code-guide、skills、MCPサーバー等）とは無関係。

## アクション
未追跡ファイルが増える場合：
1. まず .gitignore の内容を確認
2. 該当ディレクトリが明示的に除外されているか確認
3. 除外されていない場合は、ファイルのカテゴリ（出力/キャッシュ/一時）を判断して追加

## 例
```bash
# 問題を確認
git status --short | grep "^?"

# 原因追跡
git check-ignore <file>
# 出力がなければ .gitignore で除外されていない

# ml/ 下のファイルなら、ml/ 内の .gitignore を確認
find ml -name ".gitignore"
```

