# ML実験出力をgitignoreに追加

## 背景
ml/experiments/ でのML実験実行時に、出力ファイル（JSON、CSV、キャッシュ）が未追跡ファイルとして蓄積される。これにより：
- `git status` が見にくくなる
- `git add -A` で意図しないファイルがコミットされる可能性
- 実験結果の出力ディレクトリ構造がgit追跡対象になってしまう

根本原因：.gitignore に ml/experiments/ の出力ディレクトリが除外されていなかった。

## アクション
pachinko-analyzer プロジェクトの .gitignore に以下を追加：
```
ml/experiments/outputs/
ml/experiments/*.json
ml/experiments/*.csv
ml/**/__pycache__/
ml/**/*.cache
catboost_info/
```

実験スクリプト（.py）はコミット対象だが、実行結果は除外する。

## 例
Before:
```
git status
# On branch main
# Modified: 45 files
# Untracked: 155 files
```

After adding gitignore entries:
```
git status
# On branch main
# nothing to commit
```

実験を実行しても出力ファイルは自動的に無視される。

