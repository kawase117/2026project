# 分析を新規に書く前に既存スキャンを読む。指示の型は「検証」でなく「反証」

## Core claim
機種別・ホール別の強さは `eda/results/briefing/model_monthly_edge.csv` に全9ホール分が既に集計済みで、新規分析を書く前に必ずこれを読む。またユーザーの肌感を検証する型は発見の上限をユーザーの記憶にするため、スキャン上位を先に出して反証する型に変える。

## Evidence
- n_observations: 12,229セル / 9ホール（ARROW・みとや・ザシティ・ヒロキ・レイトギャップ・楽園・蒲田1・蒲田7・金時）、いずれも202607まで収録
- data scope: all-hall（ただしホール横断のプールはせず、ホール別に読む）
- metric scope: edge_pp（同日同カテゴリ比の機械割エッジ、パーセントポイント）
- result summary: 2026-07-31、ユーザーが楽園で挙げた6機種（アイムジャグラー・北斗の拳転生・化物語・Lカバネリ・モンキーターン・東京喰種）のうち5機種が、この既存CSVの楽園202607上位10に既に入っていた。にもかかわらずCodexで2回、ゼロから同じ集計をやり直した。さらに7/27のinstinct `rakuen-model-level-edge-and-cohort-pitfalls` にも同じ発見の一部が記録済みだった。

## Interpretation
- 発見する能力は足りている。**発見が意思決定に届く経路が無い**のが問題。`eda/*.py` 202本、`eda/results/` 86ディレクトリ、instinct 1476件が蓄積される一方、推薦（`pachinko-session-recommend`）にも事前登録（`backtest/forward.py` の7ルール）にも機種粒度の層が存在せず、発見を表現する場所すらなかった
- 直接の原因は「5.2MBのCSVは人間が読める形をしていない」こと。読まれない形式で置かれた発見は存在しないのと同じ
- ユーザーの肌感の精度は高い（6分の5がスキャン上位と一致）。だからこそ「肌感を検証する」作業の情報量は低く、スキャンにしか出ない候補を潰す作業のほうが価値が高い
- edge_pp（機械割ベース）と差枚ベースのbaseline比は、**月次で揃えれば一致する**。楽園アイムジャグラーで両者が食い違って見えたのは、差枚側を全期間平均かつ別機種(EX-TP)と合算して計算していたためで、月次・バリアント別に揃えたら完全に一致した。指標差ではなく集計設計の差だった。機種評価は必ず月次に分解する
- **スキャン上位を鵜呑みにしない。最初に見るべきは稼働率**。`n_machine_days / (n_machines × n_days)` が 0.7 を下回る行は、コホートの一部が月中で撤去され「撤去直前に大きく出た数日」を拾っている疑いが強い。CSVの `active_until_month_end` はコホートの一部でも残っていれば True になるため部分撤去を検出できない。実例: ARROWのビッグドリーム THE GOLDEN PUSHER は202607で edge_pp +10.43・CI下限+8.44・上位3台除外後+9.39 と全ホール最大の値だったが、稼働率0.23。実データを見ると 20260702 を最後に641-660のうち16台が撤去され、残ったのは650-653の4台のみ。上位台(649 +3447, 643 +3328, 647 +3288)はいずれも7/2の1日しかデータが無い撤去済み台だった。同じ検査でヒロキのいざ！番長(+4.77, 稼働率0.36)も偽物と判明した

## Action
1. 機種・ホールの強さを調べる依頼が来たら、**新規スクリプトを書く前に** `venv\Scripts\python.exe eda/model_edge_briefing.py --hall <ホール名>` を実行して読む
2. `pachinko-session-recommend` の Step 0 に必須手順として組み込み済み。ユーザーの指示を待たずに実行する
3. ユーザーが肌感を挙げてきたら、それを検証するだけで終わらせない。スキャン上位を並べて「肌感と一致」「肌感になくスキャンにあり（=新候補）」「肌感にありスキャンになし（=要確認）」の3分類にする
4. `◎ 安定`（CI下限>0かつ上位3台除外後もプラス、かつ稼働率>=0.7）以外を推薦根拠に使わない。`○ 少数台` は機種で選ぶのではなく機種内の台を絞る必要がある
5. 機種評価を報告するときは機械割ベースか差枚ベースかを必ず明記し、**全期間平均ではなく月次推移で述べる**
6. 異常に大きいエッジ（+5pp超）を見たら、まず稼働率と日別の集中度を疑う。`model_edge_briefing.py` は稼働率0.7未満を自動で△に落とすが、0.7以上でも「上位数日で全体の大半」というケースは検出できないため、実弾候補にする前に日別分解を必ず行う

