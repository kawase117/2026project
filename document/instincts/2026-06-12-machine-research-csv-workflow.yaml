# 機種リサーチCSVは repo cleanup でパス変更された

## 背景
リポジトリルート直下にあった旧 `machine_list_for_research.csv` は、2026-06-11のリポジトリ整理で移動され、
2026-08-30に正本名を `document/machine_master_research/machine_master.csv` へ統一した。
セッション圧縮を挟むと旧パスを記憶したまま処理を続けてしまい、FileNotFoundError が発生する。

## アクション
ファイルが見つからない場合、まず `git status --porcelain | grep -i <filename>` や `git log --oneline -- "**/<filename>"` で
過去のリネーム/移動コミットを確認する。`find . -iname "*<filename>*"` で現在地を特定してからパスを更新する。
過去セッションのサマリに記載された絶対パスを鵜呑みにしない。

## 例
`document/machine_master_research/machine_master.csv` — manufacturer/release_date/machine_type/rtp_setting1-6/bb_setting1-6/rb_setting1-6/notes に加え、`source_url` と解決根拠を持つ6列を含む29列CSV（utf-8-sig）。URLは別マップではなくこの正本から読む。
read-modify-write は csv.reader/csv.writer で行い、`row[0]==machine_name` で完全一致検索する。

