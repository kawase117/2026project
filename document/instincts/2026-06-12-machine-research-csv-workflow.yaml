# パチスロ機種スペックリサーチのバッチパターン

## 背景
~300機種のCSVに対し、5機種ずつ並列WebSearchでリサーチし、csv read-modify-write で一括反映するパターンが効率的。
低出現頻度の機種は名前の表記ゆれ（半角/全角!、スペース有無、(スマスロ)サフィックス、(スマスロ)/(SLOT)別バージョン）が多く、
事前に `row[0] == name` での完全一致検索を行い、見つからない場合は grep で候補一覧を出してから対応付ける必要がある。

## アクション
1. 「remaining machines」検出は row[4]=='' and row[10]=='' だけでなく row[9]=='' (rtp_setting6)も確認し、notesに既存データがある false positive を除外する。
2. 名前が見つからない場合は部分一致grepで候補名を列挙し、正確な行を特定する。
3. 同一機種の重複行（表記ゆれ）が複数ある場合は、同じ research 結果を全行にコピーする。
4. "5号機データ割愛"等のスキップ済みnotesは絶対に上書きしない。
5. スマスロ版で機械割の設定別具体値が見つからない場合でも、ボーナス確率・AT初当り確率・設定差要素などのnotesだけでも価値があるので埋める。

## 例
うみねこのなく頃に2、ヨルムンガンド、ゴジラ等で実施した手順：WebSearch(5並列) → 結果から rtp_setting1/6, bb/rb確率, notes をまとめる → csv read-modify-write一括反映 → 次バッチへ。

