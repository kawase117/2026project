# 版権イベント（映画公開初日など）に合わせて、その版権の機種へ全台系が入る

## Core claim
ホールは日付の語呂合わせ（[[feedback-date-pun-event-days]]）だけでなく、
**版権側のイベント日**に合わせて該当機種へ設定を入れる。
アニメ映画の公開初日はその代表例。DD・曜日・ゾロ目のような
ホール内在のカレンダーからは予測できないため、**外部イベント暦が要る**。

## Evidence
2026-08-28 マルハンメガシティ2000-蒲田7 マギアレコード（現場情報で**全6**、
劇場版まどか☆マギカの公開初日に合わせたものとユーザーが説明）:

| 指標 | 8/28 | 直近20日の次点 |
|---|---|---|
| ボーナス確率 | **1/62.9** | 1/76.9 (8/19) |
| 出率 | **131.90%** | 117.28% (8/25) |
| 平均差枚 | **+3,476** | +1,108 (8/25) |
| 勝ち台 | **21/25 (84%)** | 15/25 (8/19) |
| 合計 | 25台 90,802G | |

`backtest/bonus_rate.py` の水準z: **+14.09（p≈0、47機種中1位）**。
差枚score も 4,698 で閾値超え。**両指標が一致**した。

**前日8/27は z=-1.10、62機種中46位** で平常以下。当日単発のイベントであり、
[[carryover-exists-at-model-level-not-machine-level]] の「機種は継続する」とは
別の機構（外部イベント起点）で立ち上がっている。

## Interpretation
- これは既存の全台系検出手法にとって最も明確な陽性対照になった。
  z=+14 は他のどの実例（ToLOVEる【1/2】で +1.99、ファンキージャグラー2【全台】で +2.80）より桁違いに強く、
  **25台という規模と全6という水準が揃うとここまで出る**
- 逆に言えば、8台規模の ToLOVEる【1/2】で z=+1.99、
  ファンキージャグラー2【全台】(8台)で z=+2.80 という値は検出限界のかなり近くにある

## 限界
- **n=1**。版権イベント日の一般則としてはまだ何も言えない
- 「映画公開初日」であることの確認はユーザーの説明のみ。公開日の外部ソースは未照合
- 蒲田7の単一事例。他ホールが同じ日に同じことをしたかは未確認
  （[[feedback-no-cross-hall-pooling]] の通り横断の一般化はしない）

## Action
- 予測セッションの冒頭で、**候補機種の版権に近日イベントが無いかをユーザーに確認する**
  （[[feedback-hall-regime-needs-external-event-calendar]] と同じ構造。統計では
  検出できないが人に聞けば分かる情報）
- 版権イベント日が判明したら、その機種を候補の上位に置き、答え合わせ後に
  `document/registry/HYPOTHESIS_LEDGER.md` へ1件ずつ蓄積する。n=10 程度貯まるまで
  運用ルールにはしない
- アニメ映画・新シリーズ放送開始・周年は事前に分かるので、**予測日の前に
  該当機種を洗い出しておく**のが安い

