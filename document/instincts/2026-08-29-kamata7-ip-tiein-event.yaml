# 過分散χ²は回転数が増えると必ず有意になる。大サンプルの機種では割れの根拠にならない

## Core claim
過分散χ²は「台ごとのボーナス回数がポアソンに従うか」を見るが、
**回転数が増えるほど検出力が上がり、設定以外の微小なばらつき
（打ち手の挙動差・ART中の消化速度差など）でも有意になる**。
サンプルが大きい機種では p値の小ささを「割れている」の根拠にできない。

## Evidence
2026-08-28 蒲田7 マギアレコード。現場情報では**全6**（＝機種内は均一のはず）:

- 25台・合計90,802G・ボーナス1,444回
- 水準z = +14.09（平常時比で圧倒的に高い＝全6と整合）
- しかし **過分散p = 0.000**（＝「割れている」と出る）

一方、同じ検定を小サンプルに当てた 2026-08-28 楽園蒲田 ToLOVEるダークネス
（8台・18,984G）は **過分散p = 0.228** で均一と判定された。
⚠️ただし後に Zeno は同機種を【1/2】8台中4台と発表しており、**割れているのに均一と出た**
可能性がある（下の Action の「高低2群に分ける」代替案も置換検定で機能しなかった。
`nibuichi-not-detectable-by-db-bonus-columns` 参照）。

さらに 2026-08-28 楽園蒲田のジャグラーガールズは、途中経過（15:55時点・4台
6,798G規模）で p=0.0081 と有意な過分散を示し「1台だけ高設定」に見えたが、
**最終確定値では p=0.0956 に弱まり、消えた**。

## Interpretation
- 過分散pは**サンプルサイズに強く依存する**。同じ「割れ具合」でも回転数が
  倍になればpは小さくなる。機種間・日間でpを直接比較してはいけない
- [[nibuichi-detection-by-art-overdispersion]] が有効だったのは
  8〜31台・中規模サンプルの帯域。**その外では校正が必要**
- 途中経過での過分散は特に信用できない（[[intraday-only-narabi-survives-to-final]] と同じ構造）

## Action
- 過分散を根拠にするときは **p値ではなく効果量**（分散比 = χ²/df、または
  台ごとのボーナス確率の変動係数）を併記する。χ²/df が 2 を大きく超えるかで見る
- 合計回転数が数万Gを超える機種では、過分散pを「割れている」の根拠に使わない
- ⚠️**2026-08-30 取り下げ**: 代替案として提案した「台を高低2群に分けて群間比を取る」は
  実際に置換検定(n=20,000)で試したところ**機能しなかった**。均一なはずの【全台】を
  有意と判定し(ToLOVEる8/27 p=0.048、モンハン8/27 p=0.065)、割れているはずの【1/2】を
  見逃した(8/27は0/3、8/28は1/3)。**ボーナス率で台を並べ替えてから分割する統計量は
  使えない。** ニブイチ検出は現状 site777 の ART基準以外に手段が無い
- 途中経過の過分散は確定値で必ず再検証する
