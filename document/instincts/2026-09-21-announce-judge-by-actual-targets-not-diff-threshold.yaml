# 予告の過去実績は「店が実際に対象にした機種・台番号」で見る。差枚の閾値超えは代用品

## 背景
2026-09-20 の楽園蒲田で、予告の過去実績を「差枚が閾値（+1000/+1800）を超えた台の割合」で測っていた。
ユーザーから次の流れが指示された。
1. 予告ツイートが出たら、似た文言の過去予告で**実際に対象となった機種・台番号・角番**を複数軸で評価する。
2. 同じイベント名の過去日についても同様に調べる。
3. 1と2の重なりを当日の候補にする。
差枚は運の成分が大きく（設定6でも勝率は約9割止まり）、対象になったのに出なかった台と、対象でないのに出た台が混ざる。
的中率が上がらなかった原因の一つと考えられるが、因果は未検証（実対象で測った的中率がまだ無い）。

実対象の一次資料は `scraper/twitter_monitor/state.db` の `extraction_entries`（機種・台番号・注記「+3/3台」）。
ただし楽園蒲田は **2026-07-10 以降のみ（4,564行）**で、5/20・6/20は0行、8/20は2機種26行と部分的。
既知の欠陥は、画像の別ツイート誤紐付け19%、引用画像の混入、+1800の取りこぼし32〜36%。

## アクション
1. 過去実績を調べる前に、対象日の `extraction_entries` が入っているかを確認する。無ければ、外部の過去結果リンク（予告本文に載る）から遡及抽出を先に行う。
2. 実対象の記録があるときは、それを優先する。差枚の閾値超えは「実対象が無い日のフォールバック」と明記して併記する。
3. 実対象では、機種・台番号・角番（rank_from_min/max）・並びブロックと前回位置からのずれ・末尾・フロアを、それぞれ「対象件数／出現機会」で基準率と比べる。差枚の大小で対象と断定しない。
4. 台番号の固定した偏りは、差枚ベースでは検出できなかった（カバネリ26台、χ²=27.3／自由度25）。実対象で再検証するまで、台番号の事前予測は使わない。
5. 遡及抽出は Codex CLI（ローカル）で行い、Claude側の5時間枠が50%を超えていれば、抽出は小さいバッチにして枠を確認しながら進める。

## 例
NG: 「炎炎2は過去のハーフテン日に差枚が基準を超えたので候補」（差枚の代用）
OK: 「炎炎2は5/20・6/20・7/20の外部結果で1/2として名指しされた（実対象）。差枚側でも基準超え。ただし平常日の超え率は低く、少台数の選択バイアスに注意」

