# 予告ツイートの台数記述は現ロスターとの完全一致で真偽を裏取りできる

## Core claim
ツイートが機種名とセットで台数（例: 「Lカバネリ18台」）を挙げている場合、DB上の現ロスターの
台数と突き合わせる。完全一致すれば、その情報はクラウドの憶測ではなくホール発（または相当に
正確な内部情報）である可能性が高い。外部の推測がここまで正確に一致するとは考えにくいため。

## Evidence
- n_observations: 1回（2026-08-06、楽園蒲田の8/6予告「Lカバネリ18台・転生20台」）
- data scope: single-hall（楽園蒲田店）
- metric scope: n/a（機種名・台数の突合）
- result summary: 現ロスター(20260805)を機種名で集計すると「甲鉄城のカバネリ 海門(うなと)
  決戦」=18台、「北斗の拳 転生の章2」=20台で、ツイートの記述と完全一致した。ユーザーは
  この投稿が「アンケートの体裁を取っているだけで実際はホール予告」だと訂正した

## Interpretation
- 台数の一致は強い状況証拠だが、それだけでは「投入内容」（何番⑤⑥にするか等）まで
  裏取りできたことにはならない。台数と投入内容は別の主張であり、後者は当日の実測でしか
  検証できない
- 同名の別バージョン機種が存在する場合（今回「甲鉄城のカバネリ」旧作3台 vs 「海門決戦」
  18台）、突合を誤ると存在しない機種を対象にしてしまう。`machine_name` は正規化された
  完全一致で比較し、部分一致(`contains`)は候補列挙にのみ使う
- 「アンケートによると」等の見出しは体裁であり、情報源の実体（クラウド憶測かホール発か）
  を保証しない。文面の見出しだけで信頼度を判断しない

## Action
1. 予告ツイートが機種名+台数を挙げていたら、最初に現ロスター(`(machine_number,
   machine_name)` ペア、games>0で絞らない)と突き合わせて台数一致を確認する
2. 台数が一致しない場合は投稿者の推測混じりと判断し、確度を下げて扱う
3. 台数一致が確認できても、投入内容(番手⑤⑥・全台系か等)は当日の実測(G比・機種FE
   残差)で別途検証する。台数一致は入力データの信頼性であり、予測結果の的中を保証しない

