# 行ごとapply(axis=1)＋関数内pd.Series再構築は約5倍遅い

## 背景
セオリー検証エンジンの一般化（Phase 2）で、YAML駆動のセグメント判定を
`work.apply(lambda row: classify_theory_segment(...), axis=1)` で実装したところ、
蒲田7の実DB（259,545行）で`load_theory_frame`が90秒以上かかった。
旧ハードコード版（単純なif/elif比較、Series構築なし）は同条件で約18秒だった。
原因は `DataFrame.apply(axis=1)` 自体のオーバーヘッドに加え、
呼び出される関数内でさらに `pd.Series({"floor": ..., "lr": ..., "family": ...})` を
毎行構築していたことで、コストが二重にかかっていたため。

## アクション
- 行ごとの分類ロジックをルール（フィールド=値の条件リスト）で表現する場合、
  `DataFrame.apply(axis=1)` ではなく列ごとのブールマスク（`df[col].eq(value)` /
  `df[col].isin(values)`）を組み合わせて実装する。
- 関数内で複数のスカラー値から`pd.Series`を作ってから比較する設計は避ける。
  プレーンな`dict`で十分な場合はdictを使う（Series構築自体がボトルネックになりうる）。
- 大きい実DB（数十万行）を使う機能を実装したら、必ず最大サイズのホールDBで
  実測してから完了報告する。小さいテストデータだけでは性能問題は顕在化しない。

## 例
`_classify_theory_segment_vectorized`（`dashboard/utils/theory_engine.py`）：
ルールごとに`pd.Series(True, index=frame.index)`のマスクを作り、
`mask &= frame[field].isin(expected)`で条件を積み重ねる方式に書き換えたところ、
蒲田7 259,545行で90秒→22秒に改善（旧ハードコード版の18秒とほぼ同等）。

