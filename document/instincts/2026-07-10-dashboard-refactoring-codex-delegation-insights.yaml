# pandas 3.0系では DataFrame.applymap が完全に廃止されている

## 背景
交互作用エクスプローラのヒートマップ描画で`pivot_n.applymap(lambda value: ...)`を
使ったコードが、本プロジェクトの環境（pandas 3.0.3）で
`AttributeError: 'DataFrame' object has no attribute 'applymap'`となった。
`applymap`はpandas 2.1で非推奨化され、後継としてSeries/DataFrame共通の`.map()`が
提供されていたが、3.0系で完全に削除されている。

## アクション
- 新規コードでDataFrame全セルへの関数適用を書く際は`applymap`ではなく`.map()`を使う。
- 既存コードやCodexが生成したコードに`applymap`が残っていないか、
  `grep -rn "applymap"` で確認する習慣を持つ（CLAUDE.mdに明記されたPandas 3.0.2/3.0.3運用のため）。

## 例
`dashboard/pages/page_11b_interaction_explorer.py`：
`text = pivot_n.applymap(lambda value: "" if pd.isna(value) else f"n={int(value)}")`を
`text = pivot_n.map(lambda value: "" if pd.isna(value) else f"n={int(value)}")`に修正。
