# eda CLIスクリプトの内部関数は暗黙の列契約を持ち、部分的な入力フレームでKeyErrorになる

## 背景
横断スクリーニングページで`eda/machine_axis_pattern_scan.py`の`build_hall_outputs`を
ダッシュボード側フレームから直接呼び出す実装で、`day_of_week`と`is_x_day`列が
欠落したままKeyErrorでクラッシュした。原因は、CLIスクリプトが通常`eda/core.py`の
`load_hall_df`経由でDBから読み込まれる前提で、`day_of_week`（日本語曜日ラベル）・
`is_x_day`（ホール別イベント日フラグ）が事前に計算済みである、という暗黙の列契約に
依存していたため。ダッシュボード側で「raw風フレーム」を手作りする際にこの契約が
見落とされた。

## アクション
- eda CLIスクリプトの関数を別経路のデータで呼び出す場合、まず`eda/core.py`の
  `load_hall_df`のdocstring（追加列一覧のコメント）を読み、必要な列を全て列挙してから
  変換関数を書く。「動くまで足す」のではなく最初から契約を確認する。
- ダッシュボード側で既に計算済みの同等概念（例: `theory_engine`の`is_event_day`）が
  あれば、それをリネーム/型変換して渡す方が、独自に再計算するより一貫性が保てる。
- この種の統合バグは、モックデータでのユニットテストでは検出できない
  （モックは通常フル列を用意してしまうため）。実DBを使ったスモークテストが必須。

## 例
`dashboard/pages/page_11c_axis_screening.py`の`_build_raw_like_frame`：
`work["day_of_week"] = work["date_dt"].dt.weekday.map(lambda idx: analysis.WEEKDAY_ORDER[int(idx)])`、
`work["is_x_day"] = frame["is_event_day"].fillna(False).astype(bool).astype(int)`を追加して解消。

