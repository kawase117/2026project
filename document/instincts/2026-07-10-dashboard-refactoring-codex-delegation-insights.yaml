# last_digit_summaryテーブルは0-9以外に「ゾロ目」集計行を持ち、文字化けしていることがある

## 背景
台番号末尾別ページの統合作業で、`last_digit_summary_*`テーブルの`last_digit`列（TEXT型）に
"0"〜"9"の数字文字列に加えて、あらかじめ集計済みの「ゾロ目」行が1件含まれることが判明した。
さらに実際のDBでは、この「ゾロ目」という文字列自体がETL側のエンコード不整合により
文字化けした状態（`ã‚¾ãƒ\xadç›®`のようなバイト列）でそのまま格納されていた。
`int(tail)`や文字列の完全一致比較（`tail != "ゾロ目"`）はこの行に対して失敗する
（前者はValueError、後者は文字化けにより一致しない）。

## アクション
- `last_digit`列を数値に変換するコードは、必ず先に`str(t).isdigit()`等で
  数字行かどうかを判定してから変換する。非数字行を「ゾロ目」として扱う場合、
  DBの生の文字列と一致させようとせず、「数字でない」という条件で頑健に検出し、
  表示は常にコード側で定義したクリーンなラベルに置き換える。
- 手動で機種別ゾロ目統計を`machine_detailed_results`から再計算するのではなく、
  `last_digit_summary_*`テーブルの既存のゾロ目集計行をそのまま使う方が
  `machine_type`フィルタ済みで正確（手動再計算はmachine_typeフィルタを見落としがち）。

## 例
`dashboard/utils/single_axis_viewer.py`の`render_machine_tail`：
`digit_order = sorted((t for t in tail_summary.index if str(t).isdigit()), key=int)`、
`zorome_keys = [t for t in tail_summary.index if not str(t).isdigit()]`で検出し、
表示ラベルは`ZOROME_LABEL = "ゾロ目"`（コード側の定数）に統一。

