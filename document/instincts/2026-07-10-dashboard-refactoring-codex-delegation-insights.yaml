# Codexジョブはクラッシュ後も「running」のままゾンビ化することがある

## 背景
ダッシュボードPhase 3（交互作用エクスプローラ＋横断スクリーニング）実装をCodexに委譲したところ、
タスクがコード内の実バグ（KeyError）で実際には数秒〜数分で異常終了していたにもかかわらず、
`codex-companion.mjs status` は1時間以上「running」を返し続けた。プロセス（pid）は
既に存在しないことを`Get-Process`で確認済みで、ジョブトラッカー側の状態更新漏れだった。
`result`サブコマンドは "No job found" を返し、最終レポートは一切得られなかった。

## アクション
- 長時間「running」のまま進捗ログ（`progressPreview`/ログファイル）が更新されない場合、
  まずOSレベルで実プロセスの生存確認をする（`Get-Process -Id <pid>`）。プロセスが存在しなければ
  ジョブは実質クラッシュ済みなので、`result`取得を待たずに作業ツリーを直接精査する。
- ログファイル（`jobs/<job-id>.log`）の末尾を見て、最後の"Running command"に対応する
  "completed"/"failed"が無ければ、その直前のコマンドで異常終了した可能性が高い。
- Codexの自己申告（"tests passed"等）を鵜呑みにせず、必ず自分でスモークテスト・
  ブラウザ実機確認を行う。今回はCodexが完走したと見せた既存タスクでも、
  テストがバグの実際の実行パス（`_build_raw_like_frame`→`build_hall_outputs`の統合経路）を
  カバーしておらず、モックで迂回していたため検出できていなかった。

## 例
`node codex-companion.mjs status <job-id> --json` が1時間以上同じ`updatedAt`を返し、
`pid`のプロセスが`Get-Process`で見つからない → ジョブは死んでいる。
`result`は"No job found"を返す可能性が高いので、git status で残置ファイルを確認し
自分でレビュー・修正を進める。

