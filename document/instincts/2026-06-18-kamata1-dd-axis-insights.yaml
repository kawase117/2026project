# 蒲田1 2F は A系・N系ともに台番号末尾（last_digit）で有意な差なし --- tail軸は無効

## 背景
kamata1_dd_tail_eda（2026-06-18実施）。games>=400 でフィルタ。

A系（n=59753） Kruskal-Wallis overall p=0.211（非有意）
  全tail位置で median=-200
  BH補正MWU 各tail vs 残り: 全10位置で q > 0.05
  tail=8 の mean=127（最高）も q=0.183 で非有意

N系（n=118472） Kruskal-Wallis overall p=0.177（非有意）
  全tail位置で median=-500
  BH補正MWU 各tail vs 残り: 全10位置で q > 0.05
  tail=3 の mean=75（最高）も q=0.147 で非有意

## アクション
蒲田1 2F では台番号末尾によるフィルタを一切適用しない。
台選択の根拠としては DD軸（A系のみ）、セクション、カクバン、x_kakuban、向き×サイズを使うこと。

