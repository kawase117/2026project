# 蒲田1 A系 DD=30 が全DD中圧倒的最強（mean=390, median=0, q=1.2e-8）

## 背景
kamata1_dd_tail_eda（2026-06-18実施）。A系（ジャグ・ハナハナ）178225行、games>=400 でフィルタ。
BH補正MWU各DD vs 残りの全体分析。

DD=30 のシグナル
  mean=390, median=0, n=1631, q=1.2e-8（全DD中最強）

月末（is_month_end）との関係
  is_month_end=1（30日が実際の月末: 2月・4月・6月・9月・11月）: mean=437, median=+100, n=580
  is_month_end=0（30日が月末でない: 31日がある月）:              mean=364, median=0,   n=1051
  → 月末かどうかに関わらず DD=30 自体がシグナル。蒲田1 は固定イベント日として DD=30 を採用。

有意なDDリスト（BH補正後 q<0.05）
  DD=30  q=1.2e-8  mean=390, median=0    強い（最強）
  DD=1   q=9.8e-5  mean=239, median=0    強い
  DD=9   q=3.5e-3  mean=198, median=-100 強い（現行イベント定義に含まれない日）
  DD=7   q=7.6e-3  mean=216, median=0    強い
  DD=20  q=7.9e-3  mean=-27, median=-200 弱い（有意に低い）
  DD=19  q=1.7e-2  mean=-49, median=-200 弱い（有意に低い）
  DD=29  q=4.4e-2  mean=-17, median=-200 弱い（有意に低い）

## アクション
DD=30 に蒲田1を訪問するとき:
A系（ジャグ・ハナハナ）を最優先候補とする（median=0 で全台の半数超が収支トントン以上）。
月末かどうかを気にする必要はなく、カレンダーの30日であれば適用。
カクバン・セクション等の他フィルタを重ねてさらに絞り込む。

