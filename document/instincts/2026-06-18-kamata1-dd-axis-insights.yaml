# 蒲田1 ゾロ目mm=dd は 1/1・7/7・5/5 が突出して強い（A系のみ、N系は弱い）

## 背景
kamata1_dd_tail_eda（2026-06-18実施）。A系ゾロ目mm=ddを月別に集計。

月別結果（A系 games>=400）
  1/1 元日        n=236, mean=1067, median=750  ← 圧倒的最強（median が大きく正！）
  7/7 七夕        n=127, mean=635,  median=600  ← 次点（非常に強い）
  5/5 こどもの日  n=236, mean=293,  median=100  ← 強い（祝日）
  2/2             n=233, mean=172,  median=0
  12/12           n=108, mean=158,  median=-100
  11/11           n=108, mean=104,  median=-100
  3/3以降         median=-100以下（通常日と大差なし）

上位3日（1/1, 7/7, 5/5）はいずれも祝日または記念日と重なる。
ゾロ目効果 + 特別な日付の合わせ技で蒲田1 が最大限の高設定を投入している可能性。

N系ゾロ目mm=dd: 全月 median=-500〜-600 で構造的シグナルなし。

## アクション
1/1（元日）: 蒲田1 2F A系は年間最強の訪問候補（median=750, n=236）。最優先で検討。
7/7（七夕）: 元日に次ぐ最強候補（median=600）。
5/5（こどもの日）: 祝日ゾロ目（median=100）。訪問価値あり。
2/2: median=0（参考候補）。
3/3以降のゾロ目: median が-100以下であり普通の日扱いでよい。

