# 蒲田1 2F N系（AT/ART）は DD軸で全日非有意 --- DD による選択は根拠なし

## 背景
kamata1_dd_tail_eda（2026-06-18実施）。N系（AT系）118472行。

MWU: イベント日 vs 通常日  p=0.136（非有意）
BH補正MWU 各DD vs 残り: 全31日 q > 0.05（有意なDDなし）

上位DD（meanが高い）でも median は -500 のまま
  DD=11  mean=293, median=-400, q=0.091（BH補正後非有意）
  DD=1   mean=243, median=-500, q=非有意
  DD=30  mean=113, median=-500, q=非有意
  → 全て median が深くマイナスでアウトライア駆動

A系との対比
  A系: イベント日 MWU p=0.000（高有意）
  N系: イベント日 MWU p=0.136（非有意）

## アクション
N系（AT/ART機）の訪問判断に DD を使わないこと。
N系の台選択はセクション・カクバン・x_kakuban・イベント日セクション（[[kamata1-2fn-event-section-hotspot]] 参照）を主軸にする。
N系でDD=11やDD=1の mean が高くても median が-400〜-500であるため過信しないこと。

