# 蒲田1 A系のDD別強弱ランキング（有意なDD一覧）

## 背景
kamata1_dd_tail_eda（2026-06-18実施）。BH補正MWU各DD vs 残り。

強いDD（median >= 0 で構造的シグナル）
  DD=30  median=0,    mean=390  ★最強 （q=1.2e-8）
  DD=1   median=0,    mean=239  （q=9.8e-5）
  DD=7   median=0,    mean=216  （q=7.6e-3）
  DD=9   median=-100, mean=198  （q=3.5e-3）※イベント定義外の日

中程度（mean > 100 だが median -100 以下、非有意）
  DD=21  mean=167, median=-100
  DD=25  mean=144, median=-100
  DD=17  mean=147, median=-100
  DD=27  mean=140, median=-100

弱いDD（有意に低い）
  DD=19  mean=-49,  median=-200 （q=0.017）← 最弱
  DD=20  mean=-27,  median=-200 （q=0.008）
  DD=29  mean=-17,  median=-200 （q=0.044）

DD=9 について
  既存のイベント定義（event_7: {7,17,27}, event_1: {1,11,21,31}）に含まれない。
  weekday別: Sunday(median=100)、Wednesday・Friday・Saturday(median=0) が強く、
  DD=9 のシグナルは部分的に weekday 効果で説明できる可能性がある。
  ただし BH補正後も有意（q=3.5e-3）なため構造的要素も存在する。

## アクション
訪問日の DD で優先順位をつける（A系のみ適用、N系は DD 軸効果なし）:
  最優先: DD=30, DD=1, DD=7（median=0 で確実）
  次点: DD=9（median=-100 だが有意に強い）
  避ける: DD=19, DD=20, DD=29（有意に弱い、mean もマイナス）

