# みとやのHeatmap CSVセクション定義は2列が1セクションにまとまっていた

## 背景
Heatmap/mitoya_omorimachi_floor_coordinates.csv で 557-590 のような34台セクションが、実際には2つの物理列（y=29: 557-573, y=28: 574-590）を1セクションにまとめていた。これにより rank_from_aisle が列単位ではなくセクション通しの1-34になり、角番分析が不可能だった。hall_config.json の reversed_sections は最初から列単位（523-539, 557-573等）で正しく定義されていたが、CSV側が追いついていなかった。

## アクション
- 横列は y で分割、縦列は x で分割して物理列単位のセクションにする
- db_setup.py の rank_from_aisle 計算ロジック自体は正しい（reversed なら rank_from_max, そうでなければ rank_from_min）
- CSV を修正後に DB を再インポートすれば rank_from_aisle は自動で正しくなる
- 他ホールでも同じ問題がないか確認すべき

## 例
旧: section=557-590, rank_from_min=1-34（2列まとめ）
新: section=557-573 (reversed, y=29), section=574-590 (not reversed, y=28), 各17台

