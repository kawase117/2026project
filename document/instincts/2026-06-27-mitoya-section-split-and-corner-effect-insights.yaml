# Shortlistはテスト窓の実在チェックとmin_nフィルタが必須

## 背景
Phase 7 shortlist バックテストで、学習窓の avg_diff 上位機種がテスト窓に存在しないケース（撤去済み機種）が大量発生。犬夜叉2（n=37, pre_existing, 撤去済み）が学習窓で1位を取りテスト窓で空振りし、591-623 で X_DDS=-1017 の壊滅的結果を出した。また n=5 のからくりサーカスが shortlist 1位になるなど、min_n フィルタの不備も発見。

## アクション
- shortlist 候補はテスト窓（または最新日付）に実稼働データがある機種のみに限定
- min_n >= 50 を学習窓の best_n に適用（100は厳しすぎた）
- moved判定（台番号移動）は初出日の台番号セットで判定し、同機種の複数台設置と区別する
- pre_existing 機種は撤去リスクが高いため、最新稼働日の確認を特に厳密にする

## 例
犬夜叉2: 学習窓でavg_diff=840だがテスト窓に台がない → shortlistから除外すべき
からくりサーカス: n=5でavg_diff=1489 → min_nフィルタで除外すべき

