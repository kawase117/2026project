# みとや横列はreversed=0側の角番が一貫して強い

## 背景
物理列単位に分割後のPhase 8分析で、背中合わせの島ペアにおいて reversed=0（台番号昇順）側の通路寄り角番が一貫して高い avg_diff を示した。reversed=1側は逆に角番が弱く奥側が強い。これはホール側が設定を入れる物理位置に偏りがあることを示唆する。

## アクション
- reversed=0 の corner1-4 を優先的に狙う
- 特に 641-657 の corner1（台641, avg_diff=+542, 勝率61.9%, n=535）と 540-556 の corner1（台540, avg_diff=+415, 勝率46.6%, n=519）が突出
- reversed=1 側では奥側（corner10+）が強い傾向があるため、角番を避けて奥を狙う
- この効果が out-of-sample でも持続するかバックテストで検証が必要

## 例
島624-657:
  624-640 (reversed=1): corner1=-306, corner10+=-145（全面弱い）
  641-657 (reversed=0): corner1=+542, corner10+=-20（角番に集中）

