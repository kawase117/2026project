# みとや縦列は島単位で強弱が交互に出る

## 背景
縦列セクション（692-711, 712-733, 734-755）はy方向に台が並ぶ。横列とは異なり、島の片側だけが強いパターンではなく、島ごとに強弱が交互になる傾向がある。692-711は両列マイナス、712-733は両列プラス、734-755は片側プラス片側マイナス。

## アクション
- 縦列では島単位（2列セット）で強弱を判断する
- 712-733（特に723-733のcorner1=+181）が最も安定
- 692-711は全面的に弱いため回避
- Phase 8の build_machine_layout_table では DISTINCT x=1 なら縦列と判定し、y順で角番を振る

## 例
692-711: 692-700(corner1=-283), 701-711(corner1=-258) → 島全体が弱い
712-733: 712-722(corner1=+58), 723-733(corner1=+181) → 島全体が強い

