# みとやの列単位セクションでは top_n による機種厳選は不要

## 背景
みとやの各セクション（物理列単位、9-17台）には同時期に稼働する機種が2-3種しかない。top_n=2で「上位2機種を厳選」しても、実質的にほぼ全機種を残すことになり、フィルタとして機能しない。shortlistの選択力は角番位置やDD条件など別の軸で発揮すべき。

## アクション
- machine_name は最重要シグナルだが、top_n による厳選ではなく、角番・DD・debut_phase との交互作用で台を絞る
- 列単位セクションでは機種数が少ないため、機種名単体での統計検定力も限られる
- バックテストでは top_n ではなく、section × corner × machine_name の組み合わせで候補を生成する方が自然

## 例
557-573に現在稼働中の機種が3種 → top_n=2は「1種だけ落とす」操作でしかない
