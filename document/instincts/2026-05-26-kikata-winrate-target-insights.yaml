# 機種全検知には機種名レベルの win_rate を使う

## 背景

「全台設定」には以下の種類がある：
- **機種全**：特定の機種名に属する全台が高設定
- **末尾全**：特定の末尾番号に属する全台が高設定
- **ホール全台**：ホール全体が高設定（非常に稀）

当初 Layer 0 の target として daily_hall_summary.win_rate（ホール全体の日次勝率）を使用したが、
これは全台 約40% の低い勝率で推移しており、機種全・末尾全の検知には全く機能しない。
ホール全体 win_rate >= 80% は 320 日中わずか 1 日（0.3%）しか存在しなかった。

正しいターゲットは **機種名 x 日ごとの win_rate**：
- `machine_name_winrate = SUM(diff_coins > 0) / COUNT(*)`（同一機種名の全台）
- 機種全イベント発生時 -> この値が高くなる

## アクション

Layer 0 またはイベント検知モデルを設計する際：

1. `daily_hall_summary` ではなく `machine_detailed_results` から集計
2. `GROUP BY machine_name, date` で機種別日次集計を作成
3. `win_rate = SUM(CASE WHEN diff_coins_normalized > 0 THEN 1 ELSE 0 END) * 100.0 / COUNT(*)`
4. `HAVING COUNT(*) >= 3`（1〜2台の機種は除外）

## 例

```sql
-- 正しい集計
SELECT
    machine_name, date,
    COUNT(*) as n_machines,
    ROUND(100.0 * SUM(CASE WHEN diff_coins_normalized > 0 THEN 1 ELSE 0 END) / COUNT(*), 1) as win_rate,
    AVG(diff_coins_normalized) as avg_diff
FROM machine_detailed_results
GROUP BY machine_name, date
HAVING COUNT(*) >= 3

-- 間違い（ホール全体で集計）
-- SELECT date, win_rate FROM daily_hall_summary  <- 機種全検知には無意味
```

