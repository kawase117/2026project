# Layer 0 のスコープは機種名単位（ホール全体ではない）

## 背景

2層アーキテクチャの Layer 0 を「ホール全体の良い日フィルタ」として実装したが誤り。
蒲田七のホール全体 win_rate >= 80% は 320 日中 1 日（0.3%）しか存在せず、
評価期間 30 日間で正例がゼロ、モデルが全て proba=0.0 を出力して機能しなかった。

原因の根本は「全台設定」の定義の誤解：
- ホール全台（hall-wide）: 稀（月に0〜1回程度）
- 機種全（machine_name-wide）: より頻繁（4.2%、月に1〜2回程度/機種）
- 末尾全（last_digit-wide）: 末尾 ML で別途検知

Layer 0 の正しい役割は「今日この機種名は機種全か？」を事前判定し、
高 win_rate 機種を優先推薦することである。

## アクション

Layer 0 を設計・実装する際：

1. 入力スコープ: 機種名 x 日（hall x 日ではない）
2. ターゲット: `is_kikata = (machine_name_winrate >= 80%)`
3. 特徴量候補:
   - `day_of_month`（月内日付）
   - `day_of_week`（曜日）
   - `lag1_winrate`（前日のその機種の win_rate）
   - `roll7_winrate`（直近7日の win_rate 移動平均）
   - `prior_kikata_rate`（過去の機種全発生率）
4. 評価: walk-forward AUC + precision@threshold

## 例

```
誤った実装:
    Layer 0 target = daily_hall_summary.win_rate >= 80%
    -> 評価期間で正例ゼロ、全予測 0.0

正しい実装:
    Layer 0 target = (machine_name x date 集計 win_rate) >= 80%
    -> base_rate 4.2%、avg_diff 最小 220 枚（全件プラス）
    -> 機種全イベント検知として有効
```

