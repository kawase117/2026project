# 機種全の win_rate 閾値は 80% が有効（データで検証済み）

## 背景

蒲田七の機種名別日次 win_rate（17,346 件）を実データで分析：

閾値 >= 70%: 1,455件（8.4%）
閾値 >= 80%: 727件（4.2%）avg_diff 平均 2,474 枚
閾値 >= 90%: 441件（2.5%）
閾値 == 100%: 388件（2.2%）avg_diff 平均 2,661 枚

win_rate >= 80% のケースは：
- 最小 avg_diff = 220 枚（全件でプラス）
- 平均 avg_diff = 2,474 枚（明確な高設定水準）
- 「win_rate が高くても差枚が低い偽陽性」は実データでほぼ存在しない

「機種全 = 80% 以上」という経験則はデータで裏付けられた。
win_rate だけで判定しても差枚との二段階判定は不要。

## アクション

機種全イベントを正例（positive）として学習させる場合：
- 推奨閾値: win_rate >= 80%（base_rate 4.2%、全件で avg_diff > 0）
- 70% は正例が多くなりすぎる（8.4%、通常の良日も混入）
- 100% は少なすぎる（2.2%）が最もクリーンな正解ラベル
- win_rate >= 80% AND avg_diff >= 500 の二段階判定は不要（80% 単独で十分）

## 例

```python
# 機種別日次集計後
df['is_kikata'] = (df['win_rate'] >= 80).astype(int)

# 蒲田七での base_rate
# is_kikata == 1: 727件 / 17,346件 = 4.2%
# -> 訓練データに十分な正例が含まれる水準
```

