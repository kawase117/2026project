# ボーナス回数の過分散比は帰無仮説が1.0ではない。消化不応期で構造的に下振れする

## Core claim
「観測分散 ÷ 二項分布の理論分散」でボーナス回数の設定変動を検出しようとする過分散検定は、
帰無仮説（設定変動なしなら比=1.0）を較正しないまま使ってはいけない。ボーナス消化中は
次のボーナスを引けない不応期があるため、カウント過程は二項分布より規則的になり、比は
構造的に1.0を下回る。

## Evidence
- n_observations: 1件（楽園蒲田店 新ハナビ、2026-08-12、4,104 machine-days）
- data scope: single-hall / single-model
- metric scope: BB/RB回数の標準化残差の分散（観測 ÷ 二項理論）
- result summary: BB比0.94、RB比0.92と、いずれも1.0を下回った。当初これを「設定変動が
  検出できない＝ホールは新ハナビの設定を動かしていない」証拠として書いたが、`games_normalized`
  （＝G数、`database/json_processor.py`でスクレイパーが元サイトの値をそのまま格納。
  BB/RB回数も独立の整数で確率側が導出されており、循環は確認できなかった）に問題は
  なかった一方、不応期による構造的な過小分散という交絡因子が較正されていなかった

## Interpretation
- 1.0を下回った比だけを見て「設定変動が無い」と断定するのは早計。真の帰無分散を
  シミュレーション等で較正しない限り、この検定は方向（増えたか減ったか）の傍証にしか
  使えない
- BB比とRB比の相対比較（どちらがより1.0に近いか）は、消化時間の違いによる不応期の
  効き方も異なるため、これも厳密な根拠にはならない

## Action
1. ボーナス回数の過分散検定を「設定変動なし」の根拠として使う前に、シミュレーションで
   その機種のボーナス消化ゲーム数分布から帰無分散を較正する
2. 較正なしで使う場合は、比較対象間の相対順位（弱い傍証）としてのみ扱い、絶対値1.0との
   比較で結論を出さない
3. 台間・日内の過分散検定（2026-08-05-instincts.yaml、帰無=全台同一設定）とは別の検定
   （こちらは単一台の時系列カウント過程）であることを混同しない

