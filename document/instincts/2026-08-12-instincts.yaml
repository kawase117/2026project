# 機種内残差はG=0(非稼働)日を除外しないと死台が見かけ上プラスになるartifactが出る

## Core claim
台番号別の「機種内残差」（当日差枚 − 同日同機種平均）を計算するとき、稼働停止
（games_normalized=0, diff_coins_normalized=0）の日を除外しないと、非稼働台がその日の
機種平均の符号によって見かけ上プラスまたはマイナスの残差を受け取るartifactが生じる。

## Evidence
- n_observations: 1件（楽園蒲田店 モンキーターンV 台番号3123・3127、2026-07-06〜08-11の35日）
- data scope: single-hall / single-model
- metric scope: 台×日残差（diff_coins_normalized − 同日同機種平均）
- result summary:
  - 3123は35日中32日がG=0連続（稼働日は7/7・7/9・7/10の3日のみ）。全日ベースの残差平均は
    -286だったが、稼働日のみに絞ると+1,427へ符号ごと逆転
  - 同島の3127も35日中17日がG=0（稼働率51%）。全日ベース残差平均+234 → 稼働日のみ+1,047
  - G=0の日はdiff_coins_normalizedも0で記録されるため、残差=0−(その日の機種平均)。
    機種平均が負の日（不調日）が多いほど、死んだ台の残差が見かけ上プラスに積み上がる

## Interpretation
- 稼働日数が少ない台（目安: 全期間の3割未満）は残差の符号自体に意味がない。G=0を残差計算に
  含めるかどうかで結論が逆転しうる
- 稼働停止は「複数日にわたる連続G=0」で判別できる。単発の低回転（体調不良・短時間打ち等）
  とは区別されるべきで、稼働割合で機械的に足切りするのが妥当（連続日数の目視では見落とす）

## Action
1. 機種内残差・台別ランキングを計算する前に、必ず games_normalized>=しきい値（例: 500）で
   フィルタするか、稼働日数の割合（例: 期間の7割未満）で対象から除外する
2. 除外基準は「連続ゼロ日数を目視で探す」ではなく、稼働割合のような機械的な閾値で判定する
3. 除外した台のリストは常に出力し、除外理由（低稼働割合）を明記する。無言で消さない

