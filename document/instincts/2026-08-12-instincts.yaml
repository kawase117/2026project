# SNS結果報告は部分サンプルであり、載っていない機種を「外れた」の根拠に使えない

## Core claim
SNSの結果報告（Zenoタイプ「N/M台 平均+X枚」形式）は投稿者が確認できた台だけのサンプル
報告であり、ホール全体の全台系ランキングを網羅していない。announce.pyのmodel_scores
（全ロスターから計算）と食い違う場合は自前の計算を優先し、報告への不掲載を「外れ」の
証拠にしない。

## Evidence
- n_observations: 1件（2026-08-12 楽園蒲田店、Zeno @slokotae7の結果報告）
- data scope: single-hall
- metric scope: gratio_mean_diff
- result summary: Zenoの報告は35/567台のみを対象にしていた。報告内の「シャーマン3/5
  +1678枚」はannounce.pyのmodel_scores計算（rank3/56, score3585, 5台平均+1753）と符号・
  順位の点で整合していたが、当日ホール最大の全台系だった からくりサーカス2（7台平均
  +4735, rank1/56, score8072）は報告に一切含まれていなかった

## Interpretation
- 部分報告は「載っている機種はおおむね正しい」というプラスの裏付け材料としては使えるが、
  「載っていない機種は当たっていない」というマイナスの結論には使えない。不完全な悉皆調査
  を全数調査と取り違える誤り
- announce.pyのmodel_scoresは全567台をDBから計算しているため、SNS報告と食い違ったら
  自前計算を主に据える。SNS報告はあくまで補助的な裏取りに留める

## Action
1. SNS結果報告を答え合わせに使うときは、報告に載っている機種についてのみannounce
   scoreとの符号・順位一致を確認する裏付け材料として扱う
2. 報告に載っていない機種を「外れた」「対象外だった」と判定しない
3. 可能な限りannounce.py scoreの全ロスター計算を主、SNS報告を補助情報として位置づける

