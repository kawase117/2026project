# 「機種1」判定はセグメント別に行う（ノーマル機=RB確率、AT機=差枚分布）

## Core claim
機種内1台だけ突出する「機種1」撒き餌の判定方法は、セグメントによって使う指標が異なる。
ノーマル機（jug/hana/bt_flag、BBがほぼ設定共通で出玉も大きい）は差枚だけで判定すると
BB引きの誤爆を機種1と誤認する。RB確率・合算まで降りて判定しなければならない。AT機は
ボーナス確率に設定の手掛かりが乗らないため、従来通り台別差枚分布（中央値・プラス率・
top1除外平均）で判定する。

## Evidence
- n_observations: 1件（楽園蒲田店 新ハナビ、2026-08-12、機種通期4,104 machine-days）
- data scope: single-hall / single-model
- metric scope: 台×日のBB/RB回数、機種通期ベースラインからの標準化残差(σ)
- result summary:
  - 2026-08-12 台3267（差枚+2,524、機種内top1）を差枚分布だけで見ると機種1の署名
    （top1除外平均が機種平均を大きく下回る）に該当し、当初「機種1」と判定した
  - 機種通期ベースライン（BB 1/275.2、RB 1/349.9）と比較すると、3267のBB超過は
    +1.9σ（41回/期待30.3）、RB超過は-0.8σ（20回/期待23.8）
  - 出玉係数の実データ回帰（差枚=a*BB+b*RB+c*G+d）はBB +246枚/RB +102枚。差枚超過
    +2,524枚の内訳はBB寄与+2,632枚・RB寄与-392枚で、**RBはマイナス寄与**
  - BB超過+1.9σは単日1台としては通常変動の範囲（6台スキャンの多重比較を考えれば
    証拠なし）。3267の通期26 machine-daysはRB 1/393.6・平均差枚+156で、いずれも
    機種平均（RB1/349.9・平均+216）より弱い
  - 結論: 高設定の証拠はなく、BB引きの誤爆だった。差枚分布だけで機種1と判定した
    当初の評価は誤りで、ユーザーの現場知識（ハナビ系はBBがほぼ設定共通でRBに
    設定差が出る）による指摘で訂正した

## Interpretation
- announce.pyの`gratio_mean_diff`・`model_named`のHIT判定は台数ベースの機種平均を
  使うため、機種1（ノーマル機のBB誤爆含む）を全台系と誤判定しうる構造的な弱点を持つ
- AT機（シャーマンキング・SAO2等）については差枚分布による機種1判定は今回も維持される。
  問題はノーマル機に限定される

## Action
1. ノーマル機（jug/hana/bt_flag=1）の全台系・機種1判定では、差枚だけで結論を出さず、
   必ず機種通期ベースラインからのBB超過σ・RB超過σを計算し、差枚超過をBB寄与とRB寄与に
   分解する
2. AT機は従来通り台別差枚分布（中央値・プラス率・top1除外平均）で判定する。セグメントを
   間違えて逆の指標を適用しない
3. `announce.py`のmodel_named HIT判定はこの区別を実装していない。採点結果を読むときは
   機種フラグ（jug/hana/oki/bt）を確認し、ノーマル機のHITは台別BB/RBまで降りて検証する

