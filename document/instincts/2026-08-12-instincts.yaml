# ヒロキ東口店「末尾6を好む」仮説は全期間検証で棄却（本周年1日の外れ値だった）

## Core claim
ヒロキ東口店で末尾6が恒常的に優遇される仕掛けパターンは、全期間（579日）検証では見つからなかった。
2026-08-11本周年で観測された末尾6の強さ（平均+1,200.2、中央値+783.3、プラス率61.8%）は
単発の外れ値であり、定期イベント日・月別・曜日別のいずれでも再現しない。

## Evidence
- n_observations: 579日（2025-01-01〜2026-08-11、ヒロキ東口店全期間）
- data scope: single-hall
- metric scope: 台×日残差（同日同機種平均を引いた値）の平均/中央値/プラス率
- result summary:
  - 定期イベント日（config event_digits=[6,16,26]、n=58日）: 末尾6 平均-23.3/中央値-30.3/
    プラス率40.1% vs 他末尾 平均+3.2/中央値-13.0/プラス率38.4%。むしろ弱い。
    カイ二乗検定 χ²=2.118 p=0.146（非有意）
  - 58イベント日それぞれで末尾6の日次順位（その日出現した末尾内、1位が最良）を算出
    → 平均順位4.64（無関係な場合の期待値≈4.5とほぼ同水準）。他末尾平均を上回った日は26/58日
  - 末尾6の日次残差平均が高い上位20日を抽出しても、日付・曜日に共通パターンなし
  - 8月への集中に見えたが感度分析で崩壊: 8月全体(n=1,274) 平均+38.2/中央値-5.7 →
    本周年(2026-08-11)1日を除くと 平均+6.3/中央値-19.0（ほぼゼロへ収束）。
    「8月は強い」という見かけは本周年という単一日が平均を持ち上げていただけ
  - 曜日別: 差はいずれも誤差範囲内（平均+42.1〜-22.8、中央値は正負混在で一貫しない）
  - 日次末尾6残差とホール全体平均差枚の相関係数 -0.018（ほぼ無相関。「ホールが好調な日に
    連動する」わけでもない）

## Interpretation
- 8/11本周年の末尾6の強さ（n=1）は今も孤立した観測のまま。「ヒロキは6にまつわる仕掛けを
  好む傾向にある」という一般化は、少なくとも本DBの検証範囲（1.6年・579日）では支持されない
- 「上位20日中5日が8月」のような見かけ上の集中は、外れ値1件が平均を持ち上げているだけの
  典型例だった。感度分析（最大の外れ値を除いた再計算）を行わなければ誤った季節性の主張に
  つながっていた

## Action
1. 今後ヒロキの末尾6について同じ仮説（恒常傾向）が浮上したら、まずこの検証結果を参照する。
   再検証するなら次の本周年（2027-08-11）以降の追加データ、または「蒲田合同イベ」のような
   不定期の一発イベント日を特定してから行うこと
2. 「上位N日リストに月や曜日の偏りが見える」ときは、必ず最大の外れ値を除いた感度分析を
   行ってから季節性・曜日性を主張すること。1点の極端な観測が平均を支配していないか確認する
3. 単発イベント日（周年等、n=1）で見えた効果を、定期イベント日（同一 hall の event_digits等）
   に一般化する前に、必ず定期イベント日側で独立に再検証する

