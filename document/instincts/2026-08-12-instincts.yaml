# 蒲田7は水曜に末尾への設定集中が強い（イベント日統制後も残存、どの末尾かは予測不可）

## Core claim
マルハンメガシティ2000-蒲田7では、水曜日に末尾への設定集中がAT機・ノーマル機の両セグメント
で他曜日より有意に強い。イベント日を統制した通常日限定でもむしろ強まる。ただし当たる末尾
自体は曜日から予測できない（毎回変わる）。この効果は蒲田1には一般化されない。

## Evidence
- n_observations: 397日（AT機・ノーマル機とも）、2025-01-01〜2026-08-12、蒲田7全期間、
  7/7全台設定6日は除外
- data scope: single-hall（マルハンメガシティ2000-蒲田7）
- metric scope: 台×日残差（同日同機種平均を引いた値）の末尾別平均のうち最大値(best)
- result summary:
  - 全日: AT機 水+1,049 vs 他+777（差+273, 4.4σ）、ノーマル機 水+673 vs 他+439
    （差+234, 5.2σ）
  - 通常日のみ（イベント日=7のつく日/1のつく日/ゾロ目/月末を除外）: AT機 差+361（3.7σ）、
    ノーマル機 差+347（5.8σ）。イベント日を統制するとむしろ差が拡大した
  - イベント日のみ: AT機 差+199（2.6σ）、ノーマル機 差+137（2.2σ）と弱まる。ホール全体に
    設定が入るため末尾への集中が相対的に希釈されると解釈できる
  - 水曜57日で最良だった末尾の分布: AT機はχ²=15.1, df=9, p≈0.09（末尾8がやや多い12/57
    だが有意でない）、ノーマル機はほぼ一様。どの末尾が来るかは曜日から予測できない
  - 同一手法を蒲田1で走らせると消える（その他機種 差+30枚/0.6σ、ジャグラー 差+34枚/
    0.8σ）。蒲田1で最強の曜日は土曜（その他機種 +1,114）

## Interpretation
- 999999Q9Qの「水曜のカマタ（蒲田7）は末尾仕掛け」という主張は、末尾への集中度という
  意味では全期間データで支持される。ただし同時に主張された「どの末尾か」は再現しないため、
  事前の決め打ちはできない
- イベント日との交絡ではない。イベント日を除いた通常日のほうが効果が強い
- 蒲田1には一般化されない。ホール横断の共通法則を仮定してはいけない

## Action
1. 蒲田7の水曜は、末尾×AT機/ノーマル機のセグメント別残差を当日午前中から観察する優先度を
   上げる（プールで見ると符号が打ち消し合って消える）
2. どの末尾かは決め打ちしない。当日の早期データで末尾別残差を計算し特定する運用にする
3. 同じ「水曜×末尾集中」の仮説を他ホール（蒲田1含む）に転用しない。転用する場合は必ず
   そのホール単独で同じ検証（全期間・イベント日統制）をやり直す

