# 予告のnamed-listを直近30日の頻度で再ランクしたら、そのまま信じるより悪化した(n=1)

## Core claim
楽園蒲田8/12予告の14機種を直近30日の閾値超え回数・平均scoreで再ランクしたところ、
当日実際に上位を占めた4機種のうち2機種（からくりサーカス2・マギレコ）を下位に格下げし、
逆に閾値超え回数を根拠に最上位へ上げたモンキーターンVは実際には46/56位で外れた。
予告の名指しリストをそのまま（無加工で）信じたほうが今回は成績が良かった。

## Evidence
- n_observations: 1件（rakuen__20260812__kawasakislot）
- data scope: single-hall
- metric scope: gratio_mean_diff
- result summary: 採点結果の上位4機種は候補56機種中すべてが予告のnamed-list（14機種）から
  出た（からくりサーカス2 rank1 score8072、バンドリ！ rank2 score4284、シャーマンキング
  rank3 score3585、マギレコ rank4 score2706）。偶然でこの4つ全部が14機種指定リストから
  出る確率は C(14,4)/C(56,4)≈0.0027。
  一方、私が事前に「直近30日の閾値超え回数・平均score」で作った加重ランキングでは、
  からくりサーカス2を「D: ベースレート並み」、マギレコを「名指し中では下位」に位置づけ、
  モンキーターンV（直近30日 4/30回超え・DD12一致）を最上位Aに置いた。実際のモンキーターンVは
  score -299、rank46/56で外れた。

## Interpretation
- 30日という窓の過去頻度は、少なくとも今回のケースでは当日の投入を予測する情報を
  持っていなかった。予告のnamed-list自体（ホールが名指しする機種選定の精度）のほうが
  強い情報源で、追加の重み付けはノイズを足しただけだった可能性がある
- n=1なので「過去頻度による重み付けは常に悪化する」という一般則には出来ない。ただし
  「無加工の予告リストを上回る」ことを重み付け手法側が証明する責任があり、証明なしに
  重み付け結果を予告より優先してはいけない

## Action
1. 予告のnamed-listを再ランクする作業をするときは、まず「何もせず予告の並び順・全件フラット
   扱い」を採点時のベースラインとして残しておく
2. 過去頻度・score等の加重ランキングを作った場合、それが実際にベースラインを上回るかを
   複数の予告日で確認してから運用に使う。1回の当日予測で加重版を主役にしない
3. 予告本文の見出し（『優遇機種』『増台』『オススメ』等）による優先順位を、裏付けのない
   過去統計だけで格下げしない

