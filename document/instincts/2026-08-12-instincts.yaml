# raw_textに機種名が出たら、文脈のトーンを問わずmodel_namedとして登録する

## Core claim
予告の機種名言及を「予測的な断定か、単なる事実の言及か」というトーンで足切りしてはならない。
名指しされた機種は原則すべてmodel_namedとして登録し、unscored_claimsは機種名を含まない
一般論（連続台ブロック数、DBスコープ外の遊技機種等）に限定する。

## Evidence
- n_observations: 1件（ヒロキ東口店 2026-08-11、hiroki__20260811__kawasakislot）
- data scope: single-hall
- metric scope: gratio_mean_diff / 平均差枚 / 中央値 / プラス率
- result summary: raw_textの「増台してメインBOXにきたLカバネリ」を『設置変更の事実情報であり、
  当否を判定する定量主張ではない』としてunscored_claims送りにした。実績は当日zentaikei
  上位5機種中3位・4位:
  - 甲鉄城のカバネリ（無印）: n=3、平均+2,764、中央値+4,017、プラス率100%
  - 甲鉄城のカバネリ 海門(うなと)決戦: n=12、平均+2,554、中央値+2,137.5、プラス率67%
  どちらもmodel_namedとして登録していれば的中していた。

## Interpretation
- 判断基準を「機種名が名指しされているか」の一点に絞るべきで、「予測の強さ・断定度」という
  発信者の書き方のトーンをフィルタに使ってはいけない
- これは2026-08-11-announce-claim-layers-vs-implementabilityと同型の誤り。あちらは
  「数の主張の無情報を理由に母集団の絞り込みまで捨てた」失敗、今回は「文脈のトーンを理由に
  検証可能な機種名指しを捨てた」失敗で、どちらも実装上の判断基準を情報量の欠如と取り違えている
- 文脈が事実報告であっても、ホールが名指しした機種は依然として反証可能なmodel_named claimに
  変換できる。トーンの強弱は登録の可否ではなく、事後の解釈材料に留めるべき

## Action
1. raw_textをclaimsへ変換する作業では、機種名が一度でも登場したら文脈を問わずmodel_namedの
   候補にする。「事実の言及だから」「過去実績の話だから」という理由だけでunscored_claims送り
   にしない
2. unscored_claimsは、機種名を含まない一般論（例: 連続台ブロック数の主張、パチンコ機種など
   本DBのスコープ外の遊技機）に限定する
3. 迷ったら「登録して外れても失うものはclaim1件、登録し忘れて当たったら見えなくなる証拠」と
   考え、登録側に倒す

