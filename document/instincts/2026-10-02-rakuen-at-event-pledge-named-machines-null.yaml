# 楽園蒲田のAT機は、イベント・公約の日に、予告で名指しされた機種へ客が集まるが、名指し以外で設定の動きは検出できなかった

## 背景
ノーマル・BT以外の116機種(AT、A+ATなど。入替後7日以内の新台は除外)、2026-06-02〜09-30の120日、45,347台日を、イベント・公約の23系列(取材、周年、ゾロ目、並び:3台、機種指名など。ユーザー確認済みの`EVENT_SERIES.jsonl`)で見た。指標は機械割(差枚÷3Gの、回転数帯が同じ台の平均との差)と回転数(機種×曜日の平均との比)。日付ラベルを曜日の中で入れ替える検定(3000回)、系列ごとの最大の機種(族)とセルのBH補正。
- 回転数をそのまま見ると、326/2096セルでp<0.05(偶然なら約105)、補正後に48セルが通る。しかし、その日のAT等全体の客数(取材の日はホール全体が混む)を除くと、111/2096(偶然なら約105)、補正後0。機械割は、そのままでも88/2096(偶然なら約105)、補正後の残りは3台日などの少数台日の大きな値(鉄拳6など)で信用できない。
- タイガーダッシュ取材(9日、改装前2日・改装後7日、客数指数は他の日と同じ0.97対0.99)は、予告で名指しされた機種に客が集まる。カバネリ海門は9日すべて(1/2または1/3のニブイチ・サブイチ)、転生の章2は6/16〜8/26の多くの日、他に化物語(7/26)、エウレカ(9/16)、ヴヴヴ2(9/6)。客数を除いた回転数は、カバネリが改装前+66%・改装後+31%、転生2が+43%・+40%、機械割は他の日と同程度(カバネリ104.2%対102.9%など)。名指しの機種が回るのは、予告の結果。
- 名指しされなかった機種(105機種)では、タイガーダッシュの日に回転数・機械割が上がる機種は偶然の範囲(回転数p<0.05が5機種、偶然なら約5.2。機械割4)。東京リベンジャーズ(8台)は、名指しされていないのに、回転数が+55%(q=0.118)で、機械割の差は+1.43pt[-3.6, +5.0](取材日9日、39台日)。AT機の機械割は1台日の標準偏差が約21ptあり、設定4相当(+5pt)まで否定できないので、「機械割は上がらない(客の集中)」とは言えず、機械割では結論を出せない。一方、6000G以上の台日の割合は、取材日33.3%対他の日18.7%(1.8倍)で、高設定の不発の可能性がある(下の項目)。炎炎ノ消防隊2(19台)は回転数+48%で、機械割は-4.6pt(よく回るが負ける)。
- 少回転の高い機械割は、設定のしるしではない。台2085(東京喰種)は、タイガーダッシュ9日すべてで機械割+8pt以上だったが、9日中7日は150〜350Gで、機械割120〜158%は少回転の当たり。同じ台は他の日も機械割108.2%(月別106〜110%)で、もともと出やすい台。台2028(東京リベンジャーズ)は、取材の日の回転数1.8倍以上が9日中5日だが、機械割は67%〜129%と日により荒れ、9月全体で90.2%と悪い。
- タイガーダッシュ以外(22系列、名指し機種と客数を除く): 機械割は族1/22・セル68/1942(偶然なら約97)、回転数は族0/22・セル91/1942(約97)で、補正後0。繰り返し出る組み合わせ(プリズムナナの公約の日の回転数+54〜67%、マギアレコードの取材の日の機械割+6.6〜8.2%、炎炎ノ消防隊2の取材の日の回転数+18%)も、日数10〜47日で補正後に通らない(最小q=0.65)。
- 検出力は低い。1系列3〜16日。「検出できなかった」であって「ない」ではない。

## アクション
- AT機のイベント・公約の日の強さを、設定の根拠にしない。取材の日に客が集まる(回転数が増える)のは、予告で名指しされた機種と、よく回される人気機種(炎炎ノ消防隊2など)の動きで、機械割は上がらない。
- 取材の日の「予告されていない機種で異常に回っている台・機械割が高い台」を探すときは、(1)その日の名指し機種(`PAST_PROMISES.jsonl`の公約の名指しと`MODEL_ALIASES.csv`の略称)を除く、(2)ホール全体の客数の増減を除く、(3)少回転(目安2000G未満、特に数百G)の機械割は見ない、(4)同じ台の他の日の水準と比べる、の4つを必ずやる。
- 高回転は、設定の手がかり(ユーザー指摘、2026-10-03)。「名指しされていない機種の取材日の高回転」は、客の集中(設定と無関係)ではなく、新台、キャラの誕生日など、何らかの打つ理由があって座った人が、打ち続けた結果で、7000Gのような高回転は、高設定の不発の可能性が高い。楽園は、5000G、6000Gで設定確定のトロフィを出すことが多く、6000G以上回っている台は、さらに高設定の可能性が高い(ユーザーの経験則。トロフィは楽園の傾向で、他のホールは異なる)。トロフィとは別に、6000G回れば、途中で設定を気にする要因があるはず(ユーザー指摘)。ただし、新台は、設定と無関係に高回転になる可能性があるので、新台(導入後7日以内、ユーザー決定)は除いて見る。
- 裏づけ(楽園、AT初当りの列が取れている北斗・戦国乙女4・ダンベル): 回転数の帯ごとのAT初当りの率(機種の平均=1)は、2000G台0.87、4000G台0.98、5000G台1.07、5500G台1.13、6000G台1.17、6500G台1.19と上がり、6000G以上で頭打ち(6000G以上の台日は約16%)。1日の合計のデータでは、5000G、6000Gの前後の段差は見えず、滑らかに上がる(トロフィの時点の前後を見るには、時間ごとのデータが要る)。ただし、この上昇には、「当たりが多いから打ち続けられた」分も混ざる。同じ形は、全ホール(10ホール)で出る: AT初当りの率は、6000G台で1.12〜1.21倍(楽園1.16、みとや1.21、マルハン蒲田1 1.12)、ジャグラーのRBは、6000G台で0.99〜1.10、7000G以上で1.13〜1.23倍。トロフィのないホールでも同じなので、「6000G以上は設定の手がかり」はホール共通。楽園のトロフィの効果は、ホール間の差として目立たない。6000G以上の台日の割合は、ホールで大きく違う(AT機で5〜21%、ジャグラーで15〜42%)。
- タイガーダッシュ取材日の、名指しされていない機種(57機種)で、6000G以上の台日の割合が、その機種の他の日より増えた機種: やじきた道中記(11台、43.5%対13.9%、3.1倍、補正後q=0.031)、戦国コレクション6(1.7倍、q=0.17)、炎炎ノ消防隊2(1.6倍、q=0.19)、東京リベンジャーズ(33.3%対18.7%、1.8倍、q=0.31)。機械割は上がっていない(炎炎ノ消防隊2は-4.6pt、東京リベンジャーズは+1.4pt)ので、「回転数が高いのに機械割が低い」、すなわち高設定の不発の形に当たる。新台の確認: やじきた道中記は導入2026/8/3(取材日の台日は導入後13日以降)、戦国コレクション6は導入7/6(同10日以降)で、1週間(7日)の基準では新台に当たらず、上の結果が有効。参考に、導入後14日以内・30日以内を除くと、やじきた道中記は台日不足で消え、戦国コレクション6(2.5倍 q=0.047)と炎炎ノ消防隊2(1.9倍 q=0.047)は残る。炎炎ノ消防隊2(導入2026/2/3)と東京リベンジャーズ(導入2025/9/8)は、新台ではない。
- AT機の機械割は、1台日の標準偏差が約21ptで、機械割が上がらないことを、「設定が入っていない」根拠にしない。評価の指標は、機械割より、6000G以上(特に7000G以上)の台日の割合と、AT初当りの率に寄せる。回転数4000〜9000Gの台日を、機械割で3群に分けると、不発群もAT初当りは平均より低め(北斗: 不発0.84、中1.03、好調1.12。戦国乙女4: 0.85、0.97、1.16)で、不発の中の高設定は、この精度(1台日の当たり数が少ない)では、分けられない。
- 機種名の照合は、略称(ヴヴヴ2など)をalias表で正式名にしてから行う。照合できないと、名指し機種を除外し損ねる。
- 設定を示すRBが使えるノーマル・BTと違い、AT機は差枚と機械割しかなく、少数台・少回転で揺れる。AT機の「予告されていない機種の高機械割」は、台日数が十分な機種(台数が多く、日数が多い)だけを候補にする。

## 例
台2085(東京喰種)は、タイガーダッシュの日の平均回転数が1493G(他の日は4002G)で、機械割は117.0%(他の日は108.2%)。取材の日に特別なのではなく、少回転の当たりと、もともとの出やすさの両方。
