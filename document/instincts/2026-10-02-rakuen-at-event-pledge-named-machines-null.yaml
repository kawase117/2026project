# 楽園蒲田のAT機は、イベント・公約の日に、予告で名指しされた機種へ客が集まるが、名指し以外で設定の動きは検出できなかった

## 背景
ノーマル・BT以外の116機種(AT、A+ATなど。入替後7日以内の新台は除外)、2026-06-02〜09-30の120日、45,347台日を、イベント・公約の23系列(取材、周年、ゾロ目、並び:3台、機種指名など。ユーザー確認済みの`EVENT_SERIES.jsonl`)で見た。指標は機械割(差枚÷3Gの、回転数帯が同じ台の平均との差)と回転数(機種×曜日の平均との比)。日付ラベルを曜日の中で入れ替える検定(3000回)、系列ごとの最大の機種(族)とセルのBH補正。
- 回転数をそのまま見ると、326/2096セルでp<0.05(偶然なら約105)、補正後に48セルが通る。しかし、その日のAT等全体の客数(取材の日はホール全体が混む)を除くと、111/2096(偶然なら約105)、補正後0。機械割は、そのままでも88/2096(偶然なら約105)、補正後の残りは3台日などの少数台日の大きな値(鉄拳6など)で信用できない。
- タイガーダッシュ取材(9日、改装前2日・改装後7日、客数指数は他の日と同じ0.97対0.99)は、予告で名指しされた機種に客が集まる。カバネリ海門は9日すべて(1/2または1/3のニブイチ・サブイチ)、転生の章2は6/16〜8/26の多くの日、他に化物語(7/26)、エウレカ(9/16)、ヴヴヴ2(9/6)。客数を除いた回転数は、カバネリが改装前+66%・改装後+31%、転生2が+43%・+40%、機械割は他の日と同程度(カバネリ104.2%対102.9%など)。名指しの機種が回るのは、予告の結果。
- 名指しされなかった機種(105機種)では、タイガーダッシュの日に回転数・機械割が上がる機種は偶然の範囲(回転数p<0.05が5機種、偶然なら約5.2。機械割4)。東京リベンジャーズ(8台)は、名指しされていないのに、回転数が+55%(q=0.118)だが、機械割は-0.6pt。炎炎ノ消防隊2(19台)は回転数+48%で、機械割は-4.6pt(よく回るが負ける)。
- 少回転の高い機械割は、設定のしるしではない。台2085(東京喰種)は、タイガーダッシュ9日すべてで機械割+8pt以上だったが、9日中7日は150〜350Gで、機械割120〜158%は少回転の当たり。同じ台は他の日も機械割108.2%(月別106〜110%)で、もともと出やすい台。台2028(東京リベンジャーズ)は、取材の日の回転数1.8倍以上が9日中5日だが、機械割は67%〜129%と日により荒れ、9月全体で90.2%と悪い。
- タイガーダッシュ以外(22系列、名指し機種と客数を除く): 機械割は族1/22・セル68/1942(偶然なら約97)、回転数は族0/22・セル91/1942(約97)で、補正後0。繰り返し出る組み合わせ(プリズムナナの公約の日の回転数+54〜67%、マギアレコードの取材の日の機械割+6.6〜8.2%、炎炎ノ消防隊2の取材の日の回転数+18%)も、日数10〜47日で補正後に通らない(最小q=0.65)。
- 検出力は低い。1系列3〜16日。「検出できなかった」であって「ない」ではない。

## アクション
- AT機のイベント・公約の日の強さを、設定の根拠にしない。取材の日に客が集まる(回転数が増える)のは、予告で名指しされた機種と、よく回される人気機種(炎炎ノ消防隊2など)の動きで、機械割は上がらない。
- 取材の日の「予告されていない機種で異常に回っている台・機械割が高い台」を探すときは、(1)その日の名指し機種(`PAST_PROMISES.jsonl`の公約の名指しと`MODEL_ALIASES.csv`の略称)を除く、(2)ホール全体の客数の増減を除く、(3)少回転(目安2000G未満、特に数百G)の機械割は見ない、(4)同じ台の他の日の水準と比べる、の4つを必ずやる。
- 機種名の照合は、略称(ヴヴヴ2など)をalias表で正式名にしてから行う。照合できないと、名指し機種を除外し損ねる。
- 設定を示すRBが使えるノーマル・BTと違い、AT機は差枚と機械割しかなく、少数台・少回転で揺れる。AT機の「予告されていない機種の高機械割」は、台日数が十分な機種(台数が多く、日数が多い)だけを候補にする。

## 例
台2085(東京喰種)は、タイガーダッシュの日の平均回転数が1493G(他の日は4002G)で、機械割は117.0%(他の日は108.2%)。取材の日に特別なのではなく、少回転の当たりと、もともとの出やすさの両方。
