# Split-half PASS でも machine_dependency FAIL なら末尾効果ではない

## 背景
h_jug の末尾効果は split-half（ρ=0.891）、regime（入替前後で Top3 重複2/3）、corner2-4（ρ=0.607）の3テストで PASS だが、machine_dependency で FAIL（top2_share=96%）。「時間的に安定している」と「構造的シグナルである」は別の概念。特定台が常に強ければ、その台の末尾は split-half でも regime でも常に上位に来る。時間安定性は台固有性の安定性を反映しているだけで、末尾という変数の効果を示すものではない。

## アクション
- split-half PASS だけで「堅牢」と判定しない。必ず machine_dependency テストを組み合わせる
- top2_share >= 50% の場合、split-half と regime の結果は参考程度に扱う
- 蒲田7の 3F_L_N d8/d9 は少数台依存（top2_share=51%）だが方向は安定と判定された。みとやの96%はそれよりはるかに深刻
- 耐久性検証の4テスト体制（split-half, regime, machine_dependency, corner制御）は今後の標準にする

## 例
h_jug 末尾 d4 耐久性:
  split-half: PASS（ρ=0.891）
  regime: PASS（入替前後 Top3 重複）
  machine_dependency: FAIL（top2_share=96.0%、台674が87.3%）
  → 時間的に安定しているが、台674の個体効果。末尾効果とは言えない。
