# みとやに純粋な末尾効果は存在しない

## 背景
Phase 10b で h_jug の非イベント日末尾 KW が p=6.2e-7 と強有意だったが、Phase 10c の耐久性検証で machine_dependency が FAIL（d4 の top2_share=96.0%）。台674（658-674の角番1、マイジャグラーV）が d4 全体の avg_diff の87.3%を担っており、674を除外すると d4 は +135→+17 に崩壊。d2 も台642（641-657の角番2）が55%を占め、top2除外で +124→+39 に低下。末尾に見えるものは全て角番効果または特定台の個体効果だった。

## アクション
- みとやの台選びに末尾を使わない
- 台選びの軸はセグメント → 角番 → machine_name / debut_phase の順
- h_nonjug の全日 p=0.038 も DD 混入の偽陽性（非イベント日限定で p=0.442 に消滅）
- 「末尾が有意」に見えたら、必ず台固有性（top1/top2_share）を確認してから採用判断する

## 例
d4 の台別内訳:
  台674(角番1): avg_diff=+573 → d4全体の87.3%
  台654(角番11): avg_diff=+57
  台664(角番11): avg_diff=+26
  台644(角番14): avg_diff=±0
  → 674除外で d4 avg_diff +135→+17。末尾効果ではなく角番1の個体効果。

