# h_nonjug の末尾有意（p=0.038）は DD 混入の偽陽性

## 背景
Phase 10 で h_nonjug の last_digit KW が p=0.038 で境界的有意、d4 が首位だった。しかし Phase 10b で非イベント日に限定すると p=0.442 で完全に消滅。DD4/14/24（X_DDS日）の全体底上げが d4 の台番号に乗っていただけ。みとやのイベント日定義に DD4 が含まれるため、末尾 d4 の台が恩恵を受ける構造的な交絡が存在する。

## アクション
- 末尾分析では必ず非イベント日限定の再検証を行う
- 特にイベント日定義に含まれる DD の下一桁（みとやでは 4 と 7）は末尾との交絡が起きやすい
- h_nonjug では末尾を使わず角番のみで台選びする

## 例
h_nonjug 末尾 d4:
  全日: avg_diff=+89（首位）→ p=0.038
  非イベント日: avg_diff=-72（下位）→ p=0.442
  差分の原因: DD4(+299), DD14(+236), DD24(+242) の底上げ

