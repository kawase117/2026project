# 差枚の分布は中央値マイナス+少数の大勝ちで平均が決まる。順位ベースのMWUは中央部に引きずられ、裾にしかないエッジを構造的に検出できない

## 背景
2026-07-24、みとや大森町の h_nonjug 角番1（X_DDS日）を post-regime で評価した際、
MWU が p=0.522 で非有意だったため「角番効果は消えた/解像できない」と一度結論した。
これは**誤りだった**。同じデータを分位点と裾確率で測り直すと明確な差が出た。

| X_DDS日 h_nonjug post | corner1 (n=136) | corner2+ (n=2,244) | 判定 |
|---|---|---|---|
| 中央値 | -652 | -547 | 差なし ← MWUはここを見る |
| 75%点 | +3,133 | +1,613 | |
| 90%点 | +7,008 | +5,114 | |
| P(diff>3,000) | 25.7% | 17.6% | 1.46x, Fisher p=0.0215 |
| P(diff>5,000) | 16.9% | 10.2% | 1.66x, Fisher p=0.0202 |

pre でも同じ構造（P>3000 で 1.35x, p=0.0001）で方向が一致し、post はリフトがむしろ拡大。
n=136 でも Fisher で有意になった。**MWU だけを見ていたら実在するエッジを捨てていた**。

## 原理
パチスロの台×日差枚は「中央値マイナス、少数の大勝ちが平均を作る」右に長い裾を持つ分布。
ホールが高設定を入れても、その台が必ず勝つわけではなく「大勝ちする確率が上がる」形で現れる。
つまり**設定シグナルは分布の裾に集中し、中央部にはほとんど現れない**。
順位ベースの MWU は全観測を順位に変換するため、上位数%の大勝ちも「ただの上位」に潰れる。

## 実務ルール
1. 差枚でグループ比較するとき、MWU/KW の p 値**だけ**で採否を決めない
2. 必ず併記する: 分位点（q25/50/75/90）と `P(diff > 閾値)` の Fisher 検定（閾値は 2000/3000/5000）
3. 平均差があるのに MWU が非有意なら、それは「効果なし」ではなく**裾を見ろというサイン**
4. 逆に中央値が同じでも P(大勝ち) に差があれば、それは実戦的に意味のあるエッジ
5. その際「勝率は上がらない」ことを明記する。裾のエッジは試行回数を重ねられる前提でのみ価値を持つ

## 関連する誤り: 「効果なし」と「検出力なし」の混同
同セッションで、post-regime の DD=24 ルールを n=14（DD24は post に2日しか存在しない）で
検定し p=0.342 を得て「現行レジームでは根拠がない」と書いた。これも誤り。
n=14 で p=0.34 は**判定不能**であって否定ではない。
[[feedback-statistical-certainty-calibration]] の通り、非有意は watching であって棄却ではない。

## 関連する誤り: 集計単位のすり替え
同ルールの元の主張は「18日中16日プラス」という**日単位**（その日の対象台の平均が正か）だった。
それに対し**台日単位**（1台1日を1標本）の中央値を持ち出して「中央値マイナスだから怪しい」と書いた。
単位が違うものを比較していた。元ルールの評価形式で見れば post も 2/2 日プラスだった。
**既存ルールを再評価するときは、元の主張と同じ集計単位で測る。**

## 対照を取らない片側提示も同じ罠
「post の corner1 は中央値マイナスで平均は裾依存」と書いたが、corner2+ の中央値も
ほぼ同じ（-652 vs -547）だった。corner1 固有の欠点ではなくホール全体の分布形状。
**ある群の欠点を指摘するときは、必ず対照群の同じ統計量を隣に置く。**

