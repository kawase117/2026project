# 同じ重みを2ファイルにハードコードすると、片方だけ更新したとき「バックテストが通る別物」を検証し続ける

## 背景
`eda/mitoya_recommend.py` の `_score_machine`（if分岐で逐次加算）と
`eda/mitoya_recommend_backtest.py` の `CURRENT_WEIGHTS`（特徴量ベクトル×重みの内積）に
**同じ数値が別々にハードコード**されていた。

実害が2つ出ていた。

1. **検証されていない加点の存在**: recommend.py 側は h_nonjug の corner2-4 に +200、
   corner5-9 に +50 を加点していたが、backtest 側に対応する特徴量が存在しなかった。
   つまりバックテストは**推薦の実際の挙動を測っていなかった**。誰も気づかないまま
   walk-forward 最適化が回り続けていた
2. **除外条件の適用漏れ**: 523-539 セクションの除外は `dd24_boost` にしか書かれておらず、
   通常の X_DDS 角1加点は素通りしていた。弱いセクションの角台が推薦上位に出続けていた

## 実務ルール
1. スコアの重みは**1箇所**（辞書定数）に置き、スコアラは必ずそれを参照する
2. 逐次if分岐版とベクトル内積版の両方が必要なら、**両者が同じスコアを返すことをテストで固定**する。
   今回のテストは2件ともパスしていたが、この不一致を検出できていなかった
3. レジーム変更等で重みを上書きするときは、元の値を消さず
   `PRE_REGIME_WEIGHTS` + `POST_REGIME_OVERRIDES` の形で差分を残す。
   どの値が最適化由来でどれが手動判断かを後から追えるようにする
4. 手動上書きの値は点推定をそのまま使わず保守的に置く。
   今回 h_jug_corner1 の点推定差は -478 だったが n=51 のため -200 に留めた

## in-sample 評価の限界（重要）
上書き後にバックテストを回すと post ウィンドウで lift +504→+1,133 と改善したが、
**-200 という値は post データの検定から導き、同じ post データで評価している**ので完全に in-sample。
「変更が自己矛盾していない」ことの確認どまりで、将来の成績の証拠にはならない。
真の検証は未見データでのみ可能（[[preregistration-breaks-in-sample-self-reference]]）。

## 離散ボーナスのみのスコアは同点を量産する
`section_baseline_scale = 0.0` のため、h_nonjug の X_DDS日角1は
「300(xdds) + 300(corner1) + 200(dd24) = 800」で**全セクション横一列**になる。
実際には post のセクション別平均差枚は 574-590 = +772 から 523-539 = -126 まで開いており、
その情報がスコアに一切入っていない。並び順は実質台番号順で根拠がない。
**Yes/No 条件の加点だけで組んだスコアは、条件を満たす集団内の序列を表現できない。**
連続量（セクション実績等）をスケール項として入れるか、少なくとも同点時の
tie-break を明示的に定義する必要がある。
