# 監視アカウントの大半は広域アカウント。抽出前に本文語で絞らないとクォータが対象外に消える

## Core claim
監視している8アカウントのうち複数は特定ホール専属ではなく**広域アカウント**で、
投稿の大半は対象外ホールを扱っている。抽出を「新しい順」で回すと、
クォータ（Codex 約140枚/日）が対象外の画像に消える。
抽出前に**本文語で絞る**こと。

## Evidence
- data scope: scraper/twitter_monitor/state.db、2026-06-01〜2026-09-07

本文に「蒲田」を含む割合（アカウント全体に対して）:

| アカウント | 蒲田を含む | 総ツイート | 割合 |
|---|---|---|---|
| kawasakislot | 184 | 1,212 | 15.2% |

2026-09-07 に kawasakislot と 999999Q9Q を新しい順400枚で抽出した結果の
対象ホール特定率:

| アカウント | 対象ホール / 抽出済み | 率 |
|---|---|---|
| 999999Q9Q | 83 / 275 | 30.2% |
| slokotae7 | 47 / 315 | 14.9% |
| kawasakislot | 5 / 47 | 10.6% |
| sloneko222 | 0 / 24 | 0% |

kawasakislot が実際に扱っている店舗（同一週内）:
大井ニュー東京、セブンS川崎、ピーアーク新城、楽園溝の口、楽園立川、
プレイスポットドラゴン川崎、キコーナ蒲田、ヒロキ3店舗、金時蒲田東口、
マルハンメガシティ2000蒲田1/7、楽園蒲田。
このうち予告本文が「楽園蒲田」ヘッダを持つのは 59件 + 表記ゆれ 8件。

999999Q9Q は蒲田以外に池袋・亀有・川口も投稿する。

## Interpretation
ホール比率は**アカウント固有の性質**であって、収集や抽出の失敗ではない。
過去に sloneko222 を「対象ホール0%」と報告したのは、新しい順340枚を
取っただけのサンプリング失敗で、実際には対象ホールの画像が231枚存在していた。
5,289枚中280枚（5.3%）という低い比率が本当の姿である。

これが意味しないこと: 広域アカウントの価値が低いということではない。
kawasakislot は楽園蒲田の予告を最も詳しく出す唯一の情報源で、
比率が低いのは分母が大きいからにすぎない。

## Action
1. `extract_answers.py --text-contains 蒲田` のように**必ず絞ってから**
   クォータを使う。絞り込みで 5,012枚の無駄な抽出を回避した実績がある
2. 「新しい順」は広域アカウントに使わない。対象ホールの投稿は
   時間的に散在するので、新しい順は対象外だけを拾う
3. あるアカウントのホール率を報告するときは、**どう抽出対象を選んだか**を
   併記する。選び方を書かない比率は再現できない
4. `run_daily.py` に `--text-contains` を埋め込むかは未決。
   埋め込むなら 999999Q9Q の非蒲田店（池袋・亀有・川口）の扱いを
   ユーザーに確認してからにする

