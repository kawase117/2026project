# G数が多い台ほどRBが良く見える（見切りと期待の重なり）。RB比を稼働の偏りの上振れ込みで読む

## Core claim
同じ日・同じ機種の中で、G数が多い台ほどRB確率が高い。原因は、RBが出ない台は途中でやめられる(見切り)ことと、設定への期待で粘られること(高設定の台が多く回される)の重なりで、この2つはデータからは分けられない。G800以上だけを集計し、分母の機種平均を全台から作るとRB比が約1〜2%上振れする。機種の「RB÷設定1」が1を超える大半は設定の混在だが、稼働の偏りによる上振れ(約+0.04)を差し引いて読む。

## Evidence
- n_observations: 12092台日(楽園蒲田、判別可能機種、8/1〜9/29の最終データ。2026-09-30 20:24の222台も同形)
- data scope: 楽園蒲田の判別可能機種(ノーマル/BT/A+AT)
- metric scope: rb_probability
- result summary:
  - 台のG数帯別のRB比(同日・同機種の全台合算率が期待): 800未満0.49、800〜2000 0.75、2000〜4000 0.92、4000〜6000 1.02、6000以上1.13。G800以上のRB比は1.010
  - 日単位では、稼働(ホール平均G)と日次RB比のSpearman ρ=+0.35(p=0.001、90日)。低稼働日0.974→高稼働日1.020で差は約5%
  - 機種ごとの「RB÷設定1」(判別可能11機種)は中央値1.07。G1000未満を除く選択の偏り+0.017、稼働の多い日に重みが乗る偏り+0.025。日平均で見ても7/12機種が1超(ネオアイム1.25・キングハナハナ-30 1.13・ゴーゴー3 1.15等)

## Interpretation
- G数の多い台のRBが良いことは、設定の証拠にならない(見切りだけでも作れる)。逆に、G数が多い台のRBが悪いことも、設定を否定しない
- 稼働の多い日にRBが良い傾向は実在するが小さく、設定が高い日に稼働が上がる(ユーザー仮説)の影響は約2.5%の上振れ
- 機種が設定1より当たりが良いのは、高い設定が実際に混ざっているため(上振れの半分以上は偏りで説明できない)

## Action
- RB比・自己ベースラインを解釈するときは、G数帯をそろえた台どうしで比べる
- ブリーフの判別可能機種の表(G1000以上のみ)は上振れを含むと注記し、設定1比は日平均版も見る
- 日をまたいでRB比を比べるときは、稼働量で層別する

