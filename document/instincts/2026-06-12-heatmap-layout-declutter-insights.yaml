# st.markdown見出し + iframe内hero + floor-titleの三重タイトルは1つに集約する

## 背景
page_17_heatmap.py の「ヒートマップ」タブ統合後、ユーザーから
「全体のレイアウトが見にくくなってしまった」と指摘された。
原因を調査すると、同じ title 文字列（例: "{hall} {floor} フロアヒートマップ"）が
1) Streamlit側の st.markdown(f"## {title}") + subtitle
2) iframe内の <section class="hero"><h1>{hero_title}</h1>
3) iframe内の <h2 class="floor-title">{floor_title}</h2>
の3箇所に表示され、画面上部が見出しの繰り返しで占有されていた。

## アクション
- components.html で埋め込むHTML自体が hero/タイトル領域を持つ場合、
  呼び出し元のStreamlit側で同じ title/subtitle を再度 st.markdown(f"## ...") しない。
- Streamlit側に残すのは、フィルタ操作に必要な要素（date_input, radio, caption程度）のみとし、
  「見出し」はiframe内デザインに一元化する。
- pytestのモックでは markdown=lambda *args, **kwargs: None としているだけで
  呼び出し有無を検証していないため、削除しても既存テストは通る
  （= 安全に削減できるかどうかは目視 or grep で確認すること）。

## 例
変更前 (render_heatmap_page 冒頭):
  st.markdown(f"## {title}")
  st.markdown(subtitle)
  validated_range = _ensure_date_range(date_range)

変更後:
  validated_range = _ensure_date_range(date_range)
  # title/subtitle は iframe内の hero <h1> / floor-title <h2> に委譲
