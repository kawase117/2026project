# 末尾ハイライトカードは中段の機種名を削除し digit-card クラスで space-between 配置に

## 背景
render_last_digit_card (Heatmap/generate_kamata7_cardmap_html.py) は
.machine-card (flex-column, justify-content: center, gap: 0) の中に
machine-number / machine-name / category chip の3要素を縦積みしていたが、
カードサイズが小さいため machine-name が潰れて視認不能になっていた。
ユーザーから「台番号が上段にあり、機種名が潰れて見えなくなるので不要」と指摘。

## アクション
- 不要になった中段要素(.machine-name)はHTML側から完全に削除する（CSSでhiddenにするだけでは不十分）
- 残った2要素（番号・カテゴリチップ）を「上端・下端」に配置したい場合は、
  専用クラス（例: digit-card）を追加して justify-content: space-between を適用する。
  親の .machine-card 全体のスタイル（center寄せ）を変えると他のカード種別
  （render_machine_card 等）に影響するため、追加クラスでスコープを限定する。
- title属性（ツールチップ）には machine_name を残してよい（視覚要素としては不要でも
  ホバー情報としては有用）。
- テスト側のアサーション（"machine-name" in html）も同時に更新し、
  逆に "machine-name" not in html / "digit-card" in html を確認する。

## 例
変更前:
  <div class="machine-number">{number}</div>
  <div class="machine-name">{name}</div>      <!-- 潰れて読めない -->
  <div style="...category chip...">{category}</div>

変更後:
  class="machine-card digit-card {games_class}"
  <div class="machine-number">{number}</div>
  <div style="...category chip...">{category}</div>

  CSS追加:
  .machine-card.digit-card {
    justify-content: space-between;
    padding: 3px 2px;
  }

