# codex:codex-rescue は単一の Codex task 呼び出しに固定されたラッパーで、指示を送っても新しい行動には移れず、既存タスクの完了を待ち続ける

## 背景
Codexエージェントがバックグラウンドタスクの完了を待つだけで最初の応答を終えたため、SendMessageで「今すぐ自分でファイルを読んでレビューしろ」と再指示したが、「自分はCodex task呼び出し1回に限定されたラッパーであり、リポジトリファイルを直接読むことも自分でレビューすることも指示では変更できない、既存のバックグラウンドタスクの完了を待つしかない」という趣旨の応答が返った。実際には裏で起動していたCodexタスク(bash経由)が別途完了しており、TaskOutputで直接取得することで実質的なレビュー結果を得られた。

## アクション
1. codex:codex-rescue のエージェントが「待っている」旨だけを返してきた場合、SendMessageで指示を上書きしようとしても無駄。裏で起動しているタスクIDを特定し、TaskOutput(task_id, block=true)で直接結果を取得する方が確実。
2. codex:codex-rescue に依頼するときは、最初から「バックグラウンドで実行し完了したら結果を返す」前提で1回で完結する指示を送る。追加の割り込み指示は届かないものとして扱う。
3. [[feedback-codex-readonly-sandbox]] と合わせて、Codexへの委任は「初回に自己完結した指示を送り、裏のtask_idを控えておき、詰まったら直接TaskOutputで取りに行く」運用にする。

## 例
Agent(subagent_type: codex:codex-rescue) 呼び出し後、SendMessage(to: agentId, ...)で再指示しても「待つ」という応答しか返らなかった一方、TaskOutput(task_id: "b0rjkx3kh", block: true)で直接該当のバックグラウンドbashタスクから実質的なレビュー本文(severity付き7件の指摘)を取得できた。

