# 事前登録フォーマットは in-sample の自己参照を断ち切るためのものであり、バックテストは confirmed の根拠にならない

## 背景
document/instincts/ が1400本近くありながら confirmed=0 だった原因は、「過去データを見て見つけたルールを同じ過去データで確認する」自己参照ループから一度も抜けていなかったこと。バックテストは「未来データに効かないルールを実弾の前に落とすフィルタ」としてのみ価値があり、それ自体は in-sample なので confirmed の根拠にはできない。

## アクション
1. ルールをコード化する前に PreRegistration（rule_id, hypothesis, source_instinct, universe, eligibility, score, success_criterion, eval期間）を JSON で書き、freeze_hash で凍結する。
2. バックテストで基準を満たしても「INCONCLUSIVE → フォワードへ」として扱い、バックテストの数値だけでは confirmed にしない。
3. 失敗を見た後に作った変種（バリアント）は、事前登録の success_criterion に「この数値をもって採否を判定しない、フォワードのみで判定する」と明記する。良く出ること自体が garden-of-forking-paths の兆候だと自覚する。
4. status を unverified から confirmed/refuted に動かせるのはフォワードテスト（未来日を凍結し、後から答え合わせ）の結果だけ。

## 例
backtest/prereg.py の PreRegistration.freeze_hash()、backtest/results/VERDICTS.md の判定記録形式（REFUTED/FAILED/INCONCLUSIVE を結果を見た後に基準を変えず記録する）。

