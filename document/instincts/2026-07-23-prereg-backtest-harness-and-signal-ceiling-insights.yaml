# 台×日シグナルの分散が大きいことと、そのシグナルを過去データから予測できることは別物

## 背景
eda/variance_decomposition.py の分散分解で、蒲田7は9ホール中最大の台×日シグナル(2.89pp≈400枚/日相当)を持つのに、その蒲田7で組んだ複数の履歴ベース事前登録ルール(RB確率上位・hit104率上位)はすべて負エッジ(-17.9〜-58.6枚/台、289日・867選択)だった。逆に台×日シグナルが0.00ppの雑色店で「固定台効果を狙う」構造仮説を立てても+47.2枚(CI [-26.4,+128.3])で基準未達。分散分解は「賞金の大きさ」を測るが「取れるかどうか(過去データに痕跡が残るか)」は測らない。蒲田7はホールが毎日大きく設定を動かしており、その動きが過去データに予測可能な痕跡を残していない。

## アクション
1. 分散分解やANOVAでシグナルの分散成分を確認しても、それだけでは「予測できる」根拠にならない。予測可能性は必ず reliability(信頼性: 同一窓内での再現性) と persistence(持続性: 窓をまたいだ再現性) を分離して測ること。両方を混ぜると「なぜ予測できないか」(測定ノイズかホールの組み替えか)が区別できない。
2. 固定台効果のpp値をそのまま期待枚数(エッジ)に読み替えない。台効果には機種スペック差が含まれ、それはbaseline(同カテゴリ全台平均)にも同じく含まれるため相殺される。「baselineに対して何が上乗せか」を必ず問う。
3. シグナルが最大のホール/条件で予測ルールが軒並み負になった場合、それは「まだ良いスコア関数を見つけていない」ではなく「そのホールは日替わりで設定を動かしており過去データに手がかりがない」という構造的な結論である可能性を優先して検討する。

## 例
backtest/results/VERDICTS.md の「分散分解が示した構造」セクション。9ホール比較表(台×日シグナル・固定台効果・暦OOS R^2)と、蒲田7/雑色店それぞれでの検証結果。

