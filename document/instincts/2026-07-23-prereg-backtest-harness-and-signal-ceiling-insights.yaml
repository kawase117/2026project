# 台番号だけで履歴を集計すると、期間中の機種入替で旧機種の成績が現在の台のスコアに混入する

## 背景
Codexレビューで指摘。実データで検証したところ、みとや大森町店で直近30日窓に2機種以上入った台番号が266台中39台、蒲田7で715台中104台存在した。さらにジャグ機同士(スコアリング対象の同一フラグ内)の入替に絞っても、みとや58件・蒲田7 110件(台×窓の延べ数)が確認された。台番号のみのgroupbyでは、入替前の機種の成績が入替後の台のスコアに混じる。

## アクション
1. lookback窓での履歴集計は machine_number 単体ではなく、対象日時点で設置されている machine_name と一致する履歴行のみに制限する。
2. 過去日の集計(バックテスト)では対象日当日の設置機種を基準にできるが、フォワードテスト(target_dateが未来でその日の設置機種が未知)では直近営業日の設置機種を代理として使う。
3. 機種フラグ(jug_flag等)でフィルタしていても油断しない。同カテゴリ内の機種入替(ジャグ→別のジャグ)は普通に起きる。

## 例
backtest/run_backtest.py の restrict_to_current_machine(hist, today)。today(またはforward.pyでは直近営業日)のmachine_number×machine_nameの組でhistをinner joinし、入替前の履歴を除外する。
