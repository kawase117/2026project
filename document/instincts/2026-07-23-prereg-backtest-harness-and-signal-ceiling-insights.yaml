# freeze_hash(ルール定義のハッシュ)だけではplan本体(選択された台リスト)の事後改ざんを検出できない

## 背景
Codexレビューで指摘(HIGH)。PreRegistration.freeze_hash()はルール定義(hypothesis, score, top_n等のパラメータ)の同一性しか保証しない。plan(実際に選ばれた台番号のリスト)を結果を見た後に書き換えても、参照している事前登録ファイル自体が変わっていなければfreeze_hashの検証は通ってしまう。フォワードテストの事前確定性(pre-registration)が実質的に破られる。

## アクション
1. plan生成時に、plan本体(result欄を除く全フィールド)のダイジェスト(plan_digest)を計算し、追記専用の台帳ファイル(JSONL)に別途記録する。
2. 採点(score)実行時は、plan JSON内のplan_digestではなく、台帳に記録された値と突き合わせて検証する(plan JSON自体は書き換え可能な媒体なので、そこに書かれた値を信頼しない)。
3. 台帳への書き込みは追記のみ(上書き・削除禁止)にする。

## 例
backtest/forward.py の plan_digest(), LEDGER(backtest/forward/LEDGER.jsonl), _verify_ledger()。改ざんテストで台番号を書き換えたplanをscoreにかけるとValueErrorで停止することを実測確認済み。

