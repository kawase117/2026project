# baseline に選択した台自身が含まれていると、選択比率が高いほどエッジが実際より小さく観測される

## 背景
角番1回避ルール(k7_jug_kakuban1_avoid、universeの93%を選ぶほぼ全選択)で、baseline(universe平均)に対するedgeは+10.8枚(事前基準+50未達で破棄)だったが、pickされなかった台(角1のみ)との対比であるedge_vs_excludedを計算すると+154.0枚(CI [+104.7,+197.4])で効果自体は大きく確実だった。選択比率が7%程度の小規模選択ルールではこの縮小はほぼ無視できる(k7_jug_rb_top3で-18.2 vs -17.9とほぼ同値)。縮小の大きさはtop_n/pool比で決まる。

## アクション
1. エッジ計算にbaseline=同日母集団平均を使う場合、必ずmean_pick_share(選択が母集団に占める割合)を併記する。
2. pick_shareが大きい(目安30%超)ルールでは、baselineとは別にexcluded集合(非選択台)との対比を計算し、両方を報告する。「実運用の取り分」(vs baseline)と「物理的な効果量」(vs excluded)は別の問いであり、片方だけで判定しない。
3. 効果量が大きくても実運用の取り分が事前基準に届かない場合、その効果は「補助制約」(単独戦略にはならないが他ルールに組み込む価値はある)として記録し、単純に「効果なし」と結論しない。

## 例
backtest/run_backtest.py の summarize() 内、mean_edge_per_pick(baseline対比)とmean_edge_vs_excluded(除外集合対比)を両方算出する実装。backtest/results/VERDICTS.md のk7_jug_kakuban1_avoidの判定。

