# 日次リサンプルのbootstrap CIは、同一台が連日選ばれ続ける系列相関を無視すると実際より狭く出る

## 背景
Codexレビュー(セカンドオピニオン)で指摘。scoreベースのルールでは、履歴が良い台は複数日連続で選ばれやすく、日次エッジの系列には正の相関がある。iidな日単位bootstrapはこの相関を無視して有効サンプル数を過大評価し、CIが実際より狭くなる。7日moving block bootstrapに変更したところ、CI幅は多くのケースでわずかに広がる方向に動いた(例: k7_jug_kakuban1_avoidは[7.8,17.3]→[7.3,13.8]と実際にはほぼ変化なしだったが、理論的なリスクとして残る)。

## アクション
1. 台選択ルールのバックテストでCIを計算する際は、iidリサンプルに加えて必ずblock bootstrap(ブロック長は少なくとも1週間相当)を併記する。
2. 判定にはblock版を使う。iid版はブロック版との乖離を見るための参考値として残す。
3. ブロック長は選択の持続期間(同じ台が何日連続で選ばれ続けるか)より長く取る。

## 例
backtest/run_backtest.py の bootstrap_ci(daily, block=7) 実装。moving block bootstrapでstartsをランダムサンプルしoffsetを加算する方式。

