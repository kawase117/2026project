# 機種横断でRB確率の生値をランキングすると「高設定台」ではなく「ベース確率が高い機種」を選んでしまう

## 背景
mitoya_jug_eventdd_rb_top3(生値でRB確率上位3台を選ぶルール)をバックテストするとedge+63.3枚(CI [-95.1,+219.3])止まりだったが、同一機種内で標準化してから順位付ける版(hist_mean_rb_prob_model_z)に直すとedge+212.5枚(CI [+20.9,+356.4])に改善した。決定的な傍証として、生値版の選択は「ゴーゴージャグラー3の連番3台」という機種偏重だったのに対し、標準化版は機種が分散した(マイジャグラーV/ウルトラミラクル/ゴーゴー3)。ジャグシリーズは機種ごとにRB確率のベース値が異なる(instinct: juggler-104pct-threshold-meaning-by-model)ため、生値ランキングは機種差と設定差を混同する。

## アクション
1. 複数機種を1つのuniverseとして扱いRB確率/BB確率でランキングする際は、必ず同一機種内で標準化(z-score等)してから比較する。生値の機種横断比較は行わない。
2. スコアリングルールの選択結果が特定機種・特定島に偏っていないかを機械的にチェックする。偏っている場合、「設定を捉えている」のではなく「機種やロケーションを捉えている」疑いが強い。
3. 標準化はライブラリの標準学習データではなく、同一lookback窓・同一機種のペアで動的に計算する(グローバルな機種別平均を先に固定しない。台入替や機種構成の変化に対応するため)。

## 例
backtest/run_backtest.py の score_history() 内、hist_mean_rb_prob(生値)と hist_mean_rb_prob_model_z(機種内標準化)の実装比較。z = (rb_probability_decimal - 機種内mean) / 機種内std。

