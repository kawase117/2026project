# みとや×ジャグラーガールズDD9の高RB率は曜日/特定日ではなく投資量(games)との交絡

## 背景
`2026-07-06-juggler-rho-ge-0-4-topdd-setting-equivalent-table.yaml`でみとや×ジャグラーガールズ
DD9(n=80)のRB確率1/297.9(設定4相当)を「有力候補」として記録したが、この高さの原因を
曜日パターン・特定1日への集中・小標本の偶然の3仮説で検証した。

DD9データ(2025-01〜2026-06、18ヶ月分、108レコード=6台×18回)を分析した結果:
- 曜日別RB率: 平日0.0033 > 土日0.0031で、土日が高いわけではない（曜日効果なし）
- 最高日(2025-07-09)の寄与シェアは全体の15.1%のみ（特定1日への集中ではない）
- 回転数区分別RB率: 100-500games=0.0000 → 500-1k=0.0016 → 1k-2k=0.0020 → 2k+=0.0034
  （小標本ほど低い。これは「小標本の偶然で高く出た」の逆で、むしろ大標本(2k+, n=80)側が
  高いRB率を示しており、この値自体はまぐれではなく実測)
- 日付レベルでgames_mean(投資量)とrb_rateの相関係数=0.569(中程度の正相関)。
  上位5日の平均games=5417、下位5日の平均games=2815とほぼ倍の差
- 2025年平均RB率0.00325 → 2026年平均0.00287で約12%低下（経年劣化の兆候）

結論: DD9固有のカレンダー効果ではなく、「ホールがその日そのファミリーに投資した
(games_normalizedが多い)かどうか」という一般的な投資シグナルが、たまたまDD9の
サンプルに複数回乗っていた可能性が高い。真にDD9固有か判定するには、他のDD
(DD5,12,19,26等の非イベント日)でも同じgames-RB相関が出るかの比較が必要。

## アクション
「topDD(n)で設定X相当」という表を見たとき、そのDDの高さがカレンダー効果由来か
投資量交絡かを区別せずに運用候補として採用しない。判定手順:
1. そのDDの日付別詳細(曜日・games_mean・2k+比率)を展開する
2. 曜日別RB率とgames_mean相関(日付レベル)を計算する。相関がr>0.4程度なら
   投資量交絡を強く疑う
3. games_normalizedの区分別RB率が「小標本ほど低い・大標本ほど高い」パターンなら
   まぐれではなく実測値だが、それが「DD固有」なのか「投資日を多く含んだだけ」
   なのかは他DDとの比較なしには判定できない
4. 経年(前半年 vs 後半年)でRB率が大きく変化していないか必ず確認する
   （本件は2025→2026で12%低下しており、設定相当の評価は固定的ではない可能性）

## 例
みとや×ジャグラーガールズ DD9(全体期間n=80、2k+区分)の検証結果:

| 検証軸 | 結果 | 判定 |
|---|---|---|
| 曜日効果 | 平日0.0033 vs 土日0.0031 | 否定 |
| 特定1日集中 | 最高日シェア15.1% | 否定 |
| 小標本偶然 | 100-500games=0.0000, 2k+=0.0034（逆方向） | 否定 |
| 投資量相関 | r=0.569(日付レベル、games_mean vs rb_rate) | 支持（交絡の疑い強） |
| 経年安定性 | 2025年0.00325→2026年0.00287(-12%) | 弱い劣化兆候 |

このパターンは他ホールの「topDD設定相当」候補(ARROW/ザシティ/レイトギャップ/楽園/
蒲田7/金時)にも同様の交絡検証を適用すべき、という一般化仮説につながる。

