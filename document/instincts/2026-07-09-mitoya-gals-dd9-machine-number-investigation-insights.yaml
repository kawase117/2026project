# みとやジャグラーガールズ全6台(739-744)は台番号によるRB確率の恒常的優劣が存在しない

## 背景
蒲田7の台2026のような「鉄台」概念がみとやジャグラーガールズにも存在するか、
全期間データ(2025-01〜2026-07、各台550日分、6台合計3300レコード)で検証した。

全体平均RB率1/326.8に対し、台別RB率は1/319.7(台742・最高)〜1/331.3(台741・最低)
とレンジが極めて狭い。カイ二乗検定でp=0.2444となり統計的有意差なし(p>=0.05)。

さらに前半期間(〜2025-10-04)と後半期間で台番号別順位を比較したところ、
Spearman順位相関rho=0.086(p=0.872)とほぼ無相関だった。前半1位だった台740が
後半では最下位(6位)に転落するなど、順位に一貫性が全くない。

## アクション
少数台(5-6台程度)のジャグラー系ファミリーで「どの台番号が良いか」を検討する際は、
まず(1)全期間プールRB率のレンジが十分広いか(2)カイ二乗検定でp<0.05か
(3)前半/後半で順位のSpearman rhoが再現するか、の3点を確認すること。
いずれも満たさない場合、台番号選びに意味はなく、その家族全体への日次投資量
（`mitoya-gals-dd9-investment-confound-not-calendar-effect`参照）の方が
支配的要因である可能性を優先して検討する。

## 例
みとやジャグラーガールズ6台(739,740,741,742,743,744)の全期間検証:
- RB率レンジ: 1/319.7 〜 1/331.3（差はわずか)
- カイ二乗検定: p=0.2444（有意差なし）
- 前半→後半の順位相関: rho=0.086, p=0.872（無相関、鉄台なし）

蒲田7×台2026(鉄台, pos_rate>=60%)とは対照的な結果であり、
「鉄台の有無」はホール×機種ファミリーごとに個別検証が必要という原則の実例。

