# 差枚ベースのVar(c)推定はG内生性で最大3倍過大になる

## 背景
E[r²]=Var(c)+v/(9G) の1/G回帰でVar(c)を推定する手法(diff法)は、G数が
「その日の実力/運の結果」であり外生変数ではないという内生性を無視している
(好調台は長く回される→G自体がcの関数)。ジャグラーのRB回数は二項分布の
物理的性質(スロットの内部抽選は履歴非依存)によりGの決まり方に依らず不偏推定が
できる(RB法)。実測でdiff法5.5-7.5pp vs RB法0-2.9ppと約2-4倍の乖離があり、
3ホールではdiff法だけが「シグナルあり」と誤検出した。

## アクション
- 台×日の分散推定・シグナル検出は、差枚ではなくRB/BB回数など二項分布に
  従う離散イベントカウントを優先して使う
- 差枚ベースの推定値は「上限」としてのみ解釈し、レポートにその旨明記する
- Gを説明変数・重み・分母として使う既存分析(角番残差法・キャリブレーション等)は
  「Gが外生的」という前提が成立しているか再点検する

## 例
蒲田7ジャグの台×日シグナルSDはdiff法で5.86pp、RB法で2.86ppだった。
ベルシティ・ヒロキ・金時はdiff法で7-8pp検出したが、RB法では検出限界以下(≈0)。

