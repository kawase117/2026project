# モデル通貨での評価は選択ロジックと同じ前提を共有すると幻のエッジを生む

## 背景
台選択ロジック(B1: family priorに基づく事後P(高設定))と評価指標(e_payout: 同じ
family prior・同じスペック表換算)が同じ事後分布に依存していたため、モデル内
評価では+2.5ppの明確なエッジに見えた。しかし実際の差枚(diff_coins_normalized)で
検証すると、549選択が100%特定の1機種(family priorが最も高い機種)に退化しており、
実差枚のエッジはCI[-0.88,+1.08]と検出限界未満だった。これは「事前分布のこだま」
(prior echo)であり、モデルの外にある実測値で検証しない限り発見できない。

## アクション
- 選択ロジックと評価指標が同じ推定パラメータ(prior、スペック表、事後分布)を
  共有するパイプラインでは、必ず外部の実測値(差枚・実際の勝敗)で最終検証する
- モデル内指標(p_high、e_payout等)だけで運用判断を確定しない。運用ツール化の
  前に実差枚ベースの評価を義務化する
- 選択結果が特定の1カテゴリに極端に集中していないか(退化していないか)を
  必ず確認する

## 例
B1のモデル通貨上の+2.5ppは、実差枚検証でG加重+0.1~0.3pp(CIは0を含む)まで縮小、
等重みでは-1.01pp(有意にマイナス)だった。選択549件は全てゴーゴージャグラー3。

