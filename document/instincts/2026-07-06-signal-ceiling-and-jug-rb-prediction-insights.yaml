# 任意停止バイアス下では尤度ベース推論は頑健だがモーメント検算は歪む

## 背景
G数は「途中経過を見てやめる」という任意停止(optional stopping)で決まる観測回数
であり、固定標本サイズではない。等重み平均mean(rb/G)は任意停止バイアスの直撃を
受け観測が真値を系統的に下回る(実測で観測がスペック上の設定1未満になるケースが
発生)。G加重Σrb/ΣGは比推定量としてバイアスがほぼ相殺される。一方、尤度原理により
「停止規則が観測履歴のみに依存する限り尤度は不変」なので、二項尤度に基づく
設定事後分布・πのEM推定は任意停止に対して理論的に頑健。壊れるのは検算の側であって
推論本体ではない。

## アクション
- 観測回数が任意停止で決まるデータでモーメント一致検算をする場合は
  G加重(比推定量)を使う。等重み平均は系統的にバイアスを持つ
- 尤度ベースの推論(EM、事後分布計算)は任意停止に頑健なので優先的に採用する
- 検算が失敗した場合、まず「モデルが壊れている」より「検算の定義が任意停止に
  対して脆弱」を疑う

## 例
family RB sanityチェックでobserved_rb_rateをmean(rb/G)からΣrb/ΣGに変更したところ、
全系統一律+7-13%の乖離から+1.6-2.7%の許容範囲へ改善した。

