# 過去のEDA知見を引用する前に対象populationが一致するか必ず確認する

## 背景
「LRの効果は無視できる(F=0.03)」という過去の蒲田7 EDA知見を、ジャグラー限定の
新しい検証の妥当性根拠として引用した。しかし引用元のF=0.03は「2F」セグメント
(フロア×機種混合区分)のものであり、蒲田7のジャグラー210台は全て3Fに存在し
2Fには1台もなかった。3F全体のLR効果はF=7.65と決して無視できない値で、
存在しないpopulationの数値を根拠に使っていた。ジャグラー限定で再検証した結果
lr_f=0.27と2F水準に近く、3Fの効果は主に非ジャグラー機種が牽引していたことが
判明し、最終的に結論は同じ方向に着地したが、根拠自体は誤っていた。

## アクション
- 過去の分析結果を新しい文脈で引用する前に、セグメント定義(フロア・機種・
  期間)が現在の対象と一致するか必ず確認する
- 「結論が同じ方向に着地しそうだから根拠は検証しなくてよい」という判断はしない。
  根拠の誤りは別の文脈で顕在化する
- 機種混合のセグメント(フロア等)で観測された効果を、その中の特定機種だけに
  一般化する前に、対象機種が実際にそのセグメントに含まれるか・効果がその機種
  由来か個別に検証する

## 例
2Fのlr_f=0.03を根拠に「ジャグラーのLR効果は無視できる」と結論したが、
ジャグラー210台は全て3F(lr_f=7.65)に存在しており、根拠のpopulationが
存在しない集合だった。ジャグラー限定ANOVA(lr_f=0.27)で再検証して初めて
結論の妥当性を確認できた。

