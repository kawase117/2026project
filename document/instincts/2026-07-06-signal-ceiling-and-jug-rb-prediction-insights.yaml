# シグナル上限は個別仮説検証の前に分散分解で確定する

## 背景
DD軸・曜日軸のEDAで「null連発」が続いていたのは探索の粗さの問題ではなく、
説明されるべき分散がそもそも小さいという構造的な理由だった。
台×日の機械割を y = m + a_t(日効果) + b_i(台効果) + c_it(台×日シグナル) + e_it(ノイズ)
に二元固定効果分解し、split-half信頼性(Spearman-Brown補正)で各成分の「真の」分散を
推定したところ、全9ホールで台効果SDは1-3pp、台×日シグナルSDは2-3pp程度に対し、
単日の出玉ノイズSDは9-23ppとシグナルの5-12倍だった。カレンダーで説明できる日効果の
OOS R²も大半のホールで10%未満。

## アクション
- 新規のML/EDA着手前に、対象ホールで分散分解(台効果/日効果/台×日/ノイズ)を実行し、
  各成分のSDを把握してから投資判断する
- カレンダー特徴(DD・曜日・ゾロ目)のOOS R²が低いホールでは、その軸の深堀りを
  優先度の低いタスクとして扱う
- 台×日シグナルが検出限界以下(RB法等で確認)のホール・機種は、日次予測の対象から外す

## 例
蒲田7・蒲田1はジャグ台×日シグナルSD 2.6-2.9ppで実在を確認、金時・ベルシティ・
ヒロキは検出限界以下(≈0)で日次予測対象外と判定した。

