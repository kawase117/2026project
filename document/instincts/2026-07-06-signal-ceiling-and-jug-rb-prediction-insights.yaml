# 蒲田7ジャグの日次台選択は台効果/カレンダー/角番LR/機種内ランクいずれも実差枚エッジなし

## 背景
4種類の独立した予測手法(B1:台の長期実力平均、M:カレンダー+lag、M2:+角番/LR/
セクション、B1R:同日同機種内の二項mid-pランクの縮小推定)を実差枚で評価した。
B1R-B0=+0.09pp[-0.88,+1.08](183日)など、いずれもB0(ランダム選択)を統計的に
有意に上回らなかった。検出限界は約±1ppで、機種内の台効果信頼性は0.49と
機種間の差(信頼性0.87)より弱い。一方、記述EDAでは両端角(kakuban_rank_min=1
および=section_size)の機種内相対ランクが0.42-0.46(帰無0.50、4-7σ相当)と
頑健に低く、角番knowledge「角1は低設定」は再確認された。

## アクション
- 蒲田7のジャグラーで日次の台粒度選択を新たに提案・実装しない
- 運用上の価値提案は「機種島を選ぶ(高RB運用の島がある)」「角台を避ける」の
  2点に留める
- 他ホール・他機種で同種の日次選択予測を試みる場合は、実差枚評価を最初から
  組み込み、モデル通貨だけでの中間判断を避ける

## 例
蒲田7でのGOGO3島は高RB運用(family prior p_high=0.66)が実データで確認されて
いるが、その島内でどの台を選ぶかは機種内信頼性0.49で実差枚エッジに変換できず、
B1Rの改良も奏功しなかった。
