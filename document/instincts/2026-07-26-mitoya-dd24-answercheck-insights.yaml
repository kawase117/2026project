# セグメント全体の実績とtop-N推薦の実績を分けて見ないと、失敗の原因(信号 vs 選択)を誤診する

## 背景
2026-07-24のみとや答え合わせで、推薦TOP7は明確に負けた(lift -1330)。
ここで「h_nonjug角1シグナルは効かない」と結論するのは誤り。
バスケット全体(候補となった8台全部)を見ると平均+402でホール平均+70を上回っており、
**信号自体は機能し、TOP-N絞り込みの銘柄選択だけが外れた**ことが分かった。

区別しないと、正しい信号を誤って廃棄したり(false negative)、
逆に本当に死んだ信号を「たまたま選択が悪かっただけ」と誤ってかばう(false positive)
両方向の間違いを起こしうる。

## アクション
```python
# 推薦結果を答え合わせするとき、必ず2段階で見る
def answercheck(recommended_topN, full_candidate_basket, hall_average):
    basket_lift = full_candidate_basket.mean() - hall_average       # 信号の有無
    topn_lift = recommended_topN.mean() - hall_average              # 選択の精度
    if basket_lift > 0 and topn_lift < 0:
        return "信号は生きている。tie-break/ランキングロジックを疑う"
    if basket_lift <= 0:
        return "信号自体が消えている可能性。セグメント再検定が必要"
```
n=1日では両方とも確定的な結論は出せないが、少なくとも「どちらを疑うべきか」の
仮説を正しく立てられる。

## 例
```
2026-07-24: basket_lift = +402-70 = +332 (信号は機能)
            topn_lift   = -1260-70 = -1330 (選択が失敗)
            → 「信号なし」ではなく「tie-break根拠不足」が正しい診断
```
