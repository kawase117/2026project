# モンキーターンV・北斗の拳のAT確率スペック表（RB確率分析の基準値）

## 背景
2026-06-10セッションでユーザーから提供された、ジャグラーシリーズ以外の
RB確率ベース設定判別が可能な機種のスペック表。

## アクション
以下のスペックをRB確率(1/X)から設定推定する際の基準値として使う。

### モンキーターンV（AT初当り確率）
| 設定 | AT初当り確率 | 出玉率 |
|---|---|---|
| L | ※下パネルが常に点滅 | - |
| 1 | 1/299.8 | 97.9% |
| 2 | 1/295.5 | 98.9% |
| 4 | 1/258.8 | 104.5% |
| 5 | 1/235.7 | 110.2% |
| 6 | 1/222.9 | 114.9% |

### 北斗の拳（AT確率合算・北斗揃い・出玉率）
| 設定 | AT確率（合算） | 北斗揃い | 出玉率 |
|---|---|---|---|
| 1 | 1/383.4 | 1/7274.0 | 約98.0% |
| 2 | 1/370.5 | - | 約98.9% |
| 4 | 1/297.8 | - | 約105.7% |
| 5 | 1/258.7 | - | 約110.0% |
| 6 | 1/235.1 | - | 約113.0% |

## 重要な注意事項（ユーザー提供）
蒲田7のモンキーターンV 台番号2026は、故障などを除く稼働日は
全て設定6（いわゆる「鉄板」台）だった。この影響で蒲田7全体の
RB平均が押し上げられている可能性があるため、台2026を含む/除外の
両方で計算する必要がある。
ただし、台2026を除外しても蒲田7が他ホールより強い傾向は
維持される見込み（ドメイン知識ベースの予想）。

