# ジャグラー6機種のRB確率（high_rb%）は機械割と独立に、機種×ホール固定効果ランキングと一致する

## 背景
games_normalized>=1000でフィルタし、ジャグラー各機種について
「設定4相当のRB確率しきい値」以上の割合(high_rb_pct)をホール別に集計。
（実装: eda/rb_probability_analysis.py）

全ジャグラー機種（アイムジャグラーEX-TP, マイジャグラーV, ファンキージャグラー2,
ゴーゴージャグラー3, ミスタージャグラー, ジャグラーガールズ,
ハッピージャグラーVIII, ウルトラミラクルジャグラー）で共通して：

- **蒲田7・金時が常にhigh_rb_pct上位2位以内**
- **ザシティが常に最下位**

例（マイジャグラーV, n=105489）：
| ホール | high_rb_pct | avg_kaiwari |
|---|---|---|
| 金時 | 21.9% | 98.60 |
| 蒲田7 | 20.6% | 99.22 |
| 蒲田1 | 18.5% | 98.74 |
| みとや | 18.5% | 98.63 |
| ヒロキ | 18.5% | 98.16 |
| ARROW | 15.4% | 98.34 |
| 楽園 | 14.7% | 98.13 |
| ザシティ | 14.1% | 96.91 |
| レイトギャップ | 10.7% | 97.99 |

これは2026-06-10前半に作成した「機種×ホール固定効果ランキング」
（蒲田7 > 蒲田1 > 金時 > みとや > ARROW > 楽園 > レイトギャップ > ヒロキ > ザシティ）
と概ね整合的（特に蒲田7上位・ザシティ最下位は完全一致）。

北斗の拳・スマスロ北斗の拳でも同様の傾向（みとや・蒲田7・楽園が上位、
ザシティ・ARROW・金時が下位）が見られたが、こちらは機種構成の
影響を受けた生の値であり固定効果分析は未実施。

## アクション
- 機械割(kaiwari)ベースの固定効果ランキングが正しいかを検証する際、
  RB確率という独立指標でのhigh_rb%順位を補助的なクロスチェックとして使える。
- 蒲田7・金時を「ジャグラー設定投入が手厚いホール」、ザシティを
  「ジャグラー設定投入が薄いホール」として扱う根拠が一つ増えた。

