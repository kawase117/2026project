# モンキーターンVはホールによってBB/RBの記録方式が非互換であり、RB確率単独でのホール間比較は無効

## 背景
モンキーターンVのRB確率(1/X)をホール別に集計したところ、
蒲田7(1/308.7, 台2026除外後)・みとや(1/314.7)・蒲田1(1/310.8)・
ザシティ(1/317.5)・金時(1/320.9)はAT初当りスペック設定1(1/299.8)
付近に集まる一方、楽園(1/494.7)・ARROW(1/491.7)だけが
スペック上の設定1理論値よりさらに悪い、説明不能な値を示した。

原因を `bb_count`/`bb_probability_decimal` で確認したところ：

| ホール | bb_count | bb_probability_decimal |
|---|---|---|
| 蒲田7 | 常に>0（例: games=5011でrb=22, bb=57） | 値あり |
| 楽園・ARROW・みとや | **常にbb_count=0** | None / `1/0.0` |

蒲田7のみBB/RBを2種類のボーナスとして分けて記録しており、
楽園・ARROW・みとやはBBが一切検出されない。
ユーザーコメント「ホールによってはRB確率を載せないところもある」
が示す通り、スクレイピング元(ana-slo.com)のホールページ表示形式の
違いにより、モンキーターンVのRB集計対象（BB込みかRBのみか）が
ホールごとに異なっている可能性が高い。

なお、北斗の拳・ジャグラー系（マイジャグラーVで確認）は
全ホールでbb_count>0の行が大半（bb_zero=0〜9件/数千〜数万件）であり、
この問題は発生していない。

## アクション
- モンキーターンVに関しては `rb_probability_decimal` 単独での
  ホール間比較を行わない。
- ホール間比較が必要な場合は kaiwari / hit104_pct など
  diff_coins_normalizedベースの指標を使うか、
  `(bb_count + rb_count) / games_normalized` のような
  合算指標を使う前にホールごとのbb_count分布を必ず確認する。
- 新しい機種でRB確率をホール横断比較する前は、
  必ず該当機種のbb_count=0率をホール別に確認するチェックを
  eda/rb_probability_analysis.py のようなスクリプトに含める。
- 北斗の拳・ジャグラー系はこの問題が確認されておらず、
  RB確率ベースのホール比較は引き続き有効。
