# /evolve は460件のinstinctから0スキルクラスタしか検出できなかった

## 背景
instinct-cli.py evolve --generateを460件のプロジェクトinstinctに対して実行したところ、80%以上confidenceの411件があったにもかかわらず、スキルクラスタは0件、コマンド候補は信頼度75%の1件のみで、生成されたcommand fileも本文が空のスタブだった(codex-eda-script-prompt-pitfalls-machine-axisという単一instinctから生成されたcodex-kamata-eda-cre.md、タイトルと信頼度のみで内容3行)。この結果は、蒲田7・蒲田1・楽園・みとや等ホールごと・DD条件ごとに極めて具体的で相互に独立したinstinctが大量にあり、trigger/domainの文字列的な類似度に基づく自動クラスタリングでは意味のあるグルーピングを見つけられないことを示唆する。

## アクション
大量のinstinctから自動でスキル・コマンド・エージェントを生成したい場合、/evolveの自動クラスタリングに頼らず、memory/MEMORY.mdやdocument/instinctsのdomain分布を手動で俯瞰してから、意図的にスキル化したいテーマ(既存のkamata7-data-processing、ltr-pipeline-guide等のように)を選んで手動でSKILL.mdを書く方が確実。/evolveは「クラスタ候補の発見」ではなく「手動で決めたテーマの雛形生成」程度の補助と位置づける。

## 例
2026-07-16実行、460 instincts(project-scoped 460, global 0)、高confidence(>=80%) 411件に対し、skill clusters=0、command candidates=1(confidence 75%)。生成ファイル`~/.claude/homunculus/projects/257beeaeb232/evolved/commands/codex-kamata-eda-cre.md`は見出しと出典行のみで実質的な内容を含まなかった。

