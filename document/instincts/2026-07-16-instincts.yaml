# 文章術・ライティングリズム系スキルはグローバルスコープに置き、プロジェクトのtheory文書には適用しない

## 背景
cognitive-rhythm-writing(緩急・認知モード切替の設計規範)とjapanese-tech-writing(日本語技術文書の整形・論証規範)という2つの文章術スキルを新規作成する際、pachinko-analyzerプロジェクトのtheory文書(kamata1_theory.md、kamata7_theory.md等)向けに使うか検討した。プロジェクトのtheory文書は根拠明示・直接的記述が要求され(CLAUDE.mdの「技術的・統計的な根拠に基づき明確に述べる」原則、および理論文書は手動作成という既存方針)、未回収の緊張を意図的に残す物語的リズム設計とは相性が悪いと判断した。ユーザーもこの判断に同意し、用途を「一般向け解説文」に限定したため、両SKILL.mdは`~/.claude/skills/`(グローバルスコープ)に配置し、プロジェクトの`.claude/skills/`には置かなかった。

## アクション
今後このプロジェクトで文章術・ライティングスタイル系のスキルを追加・適用する際は、対象がtheory文書/分析レポート(直接性・根拠重視、迎合禁止)か、それ以外の一般向け解説文(可読性・リズム重視)かを先に切り分ける。前者にはcognitive-rhythm-writing等の物語的リズム規範を適用しない。後者向けの汎用スキルは原則グローバルスコープに置き、プロジェクトスコープには複製しない。

## 例
`~/.claude/skills/japanese-tech-writing/SKILL.md`と`~/.claude/skills/cognitive-rhythm-writing/SKILL.md`を作成(2026-07-16)。プロジェクトの`C:\Users\apto117\Documents\pachinko-analyzer\src\2026project\.claude\skills\`配下には作成しなかった。

