# 技術介入機の土曜プレミアムは統計的に有意でない

## 背景
新ハナビ・ディスクアップULTRAREMIX・うみねこ・ディスクアップ2の
土曜 vs 平日 avg_diff を Mann-Whitney U検定で検証:

| 機種 | 土曜avg | 平日avg | プレミアム | p値 |
|------|---------|---------|-----------|-----|
| 新ハナビ | +173 | +126 | +47枚 | 0.524 |
| ディスクアップUR | +224 | +179 | +45枚 | 0.258 |
| うみねこ | +48 | +54 | -6枚 | 0.653 |
| ディスクアップ2 | +65 | +94 | -29枚 | 0.749 |

全機種p>0.25で統計的に有意でない。
新ハナビを1000G以上に絞ると土曜プレミアムは+47→+12枚に縮小。

「技術介入機の土曜は技術者が集まるから強い」仮説は統計的に支持されない。

## アクション
機種名×曜日スキャンで「新ハナビ_土 8ホール共通 Tier B」が出ても、
土曜バイアスとして特別視しない。効果量が小さく実用的な意味は薄い。
技術差の理論値（+117枚/1000G for 新ハナビ）に対して実測+12枚は3%以下。

