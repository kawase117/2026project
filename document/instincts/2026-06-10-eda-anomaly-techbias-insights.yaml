# pre_existing判定: DB初日に初登場した機種を除外（grace_days=0で十分）

## 背景
`compute_debut_features(df, db_start_grace_days=0)` で実装済み。

蒲田7の検証結果:
- DB期間: 2025-07-07 〜 2026-06-07
- pre_existing 60機種: 全て debut_date == 2025-07-07（DB初日に集中）
- DB初日から2〜14日目に初登場した機種: 0件
→ grace_days=14 と grace_days=0 は全く同じ結果になる

ホールのデータ特性として「DB収集開始時点で設置中の機種は全て初日に一斉登場」する。
grace_days の猶予期間は必要なく、0で十分。

全ホール規模:
- みとや: pre_existing 47機種 / 新規 98機種
- 蒲田7: 60機種 / 54機種
- 楽園: 96機種 / 151機種（最も入れ替えが活発）

## アクション
