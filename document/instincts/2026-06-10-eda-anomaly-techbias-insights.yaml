# ANOMALYの実用途: 翌日予測ではなく「今日のリアルタイム高設定発見」

## 背景
全検証結果のまとめ:
- ANOMALY翌日は通常日より悪い（平均回帰）
- 逆張り条件では翌日-90（カンフルは1日限り）
- 好baseline×ANOMALYのみ翌日+113で続く

「カンフル注入仮説」への結論:
- カンフルが存在する場合、多くは1日限り
- 翌日予測シグナルとしてのANOMALYは機能しない

## アクション
ANOMALYを「今日・リアルタイム」で使う:
1. 当日データを取得後、anomaly_score ≥ 3.0 かつ games ≥ 1000 の台を抽出
2. その台がまだ打てる状態（閉店まで時間がある）なら打ちに行く
3. baseline≥+200 の台なら翌日も検討可

翌日朝に「昨日ANOMALYだった台」を狙うのは有効でない。
ただし「昨日もANOMATY、かつ baseline が元々高い台」は別途lag_analysisのstreak_rateで評価する。
