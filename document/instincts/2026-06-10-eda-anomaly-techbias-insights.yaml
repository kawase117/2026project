# daily_hall_summary の日付フィーチャーは大半がNULL — JOIN禁止

## 背景
`date_info_calculator.py` は全日付で実行されておらず、`daily_hall_summary` の
`day_of_week`, `last_digit`, `is_x_day` 等は443日中わずか3日分しか入っていない。
例：レイトギャップ 土曜 n=422（修正前）→ 24,850（修正後）で59倍の差が生じた。
この状態でJOINすると「土曜のみ6件」が実際には「6日の土曜3件」と一致した偽の相関を生む。

## アクション
`machine_detailed_results.date` 文字列（YYYYMMDD）から Python で直接計算する。
`daily_hall_summary` のJOINを日付フィーチャー目的で使ってはならない。

```python
dates = pd.to_datetime(df["date"], format="%Y%m%d")
wd    = dates.dt.weekday  # 0=月 … 6=日
df["day_of_week"] = wd.map(lambda x: _WEEKDAY_JP[x])
df["dd"]          = dates.dt.day
df["dd_mod10"]    = df["dd"] % 10
df["is_x_day"]    = df["dd"].isin(event_digits).astype(int)
```

## 例
修正前: レイトギャップ 土曜 avg=+XXX (n=422) → 信頼できない
修正後: レイトギャップ 土曜 avg=正確な値 (n=24,850) → 有効

