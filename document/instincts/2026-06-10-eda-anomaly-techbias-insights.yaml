# ANOMALY翌日は通常日より悪い — 翌日予測には使えない

## 背景
全ホール合算・翌日1000G以上でのANOMATY後続検証:

| 条件 | 翌日avg | 翌日plus率 |
|------|---------|----------|
| ANOMALY日（score≥2） | +43 | 39.8% |
| 通常日（score<2） | +60 | 40.6% |

ANOMALYスコア帯別（スコアが高いほど翌日が悪い）:
- score 2-3: 翌日+52
- score 3-4: 翌日+38
- score 4-5: 翌日+20
- score 5以上: 翌日+5

これは「平均回帰」パターン。多くのANOMALYは低設定台の偶然の上振れであり、
翌日は元の低成績に戻る。

## アクション
ANOMALYを「翌日の台選択シグナル」として使ってはならない。
ANOMALYの実用途は「今日リアルタイムで高設定台を発見する」に限定する。
例: 営業中に「この台がスコア5以上を記録している」情報を使い同日に打ちに行く。

