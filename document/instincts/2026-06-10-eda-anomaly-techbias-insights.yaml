# ANOMALY発生率は導入15-30日が谷（5.2%）で前後が高い U字型

## 背景
蒲田7 pre_existing除外後の導入日数帯別ANOMALY発生率:
- 0-7日: 6.7%（新台直後）
- 8-14日: 5.4%
- 15-30日: 5.2%（最低）
- 31-60日: 5.6%
- 61-90日: 6.3%
- 91-180日: 6.1%
- 181-365日: 6.7%

解釈:
- 0-7日の6.7%: 初日高設定の例外的事例（導入景気）が混在
- 15-30日の5.2%（谷）: 低設定スタートが安定している期間→ベースラインも低くANOMATY出にくい
- 61日以降の上昇: 「回転数が落ちてきたころにカンフル注入」仮説と一致

## アクション
61日〜180日の機種でANOMALYが発生した場合は
「回転数低下後のカンフル注入」として最も確度が高い条件として扱う。

