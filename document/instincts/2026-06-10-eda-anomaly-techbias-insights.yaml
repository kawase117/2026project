# ANOMALYフレームワーク: eda/core.py の anomaly_detection 関数

## 背景
「回転数が落ちた台にホールが設定を投入する」というカンフル仮説の検証と、
「今日突然好調な台の検出」をリアルタイムで行うためのフレームワーク。

実装済み: `eda/core.py`
- `compute_debut_features(df, db_start_grace_days=0)`: 機種初登場日・台数を付与
- `anomaly_detection(hall, baseline_days=30, min_games=1000, anomaly_threshold=2.0)`

アルゴリズム:
1. 台ごとに前日までの30日 rolling_mean/std を計算（shift(1)でリーク防止）
2. anomaly_score = (今日diff - rolling_mean) / rolling_std
3. score ≥ 2.0 かつ games ≥ 1000 を is_anomaly とする

付与される特徴量:
- days_since_debut, days_since_debut_bucket
- pre_existing（DB初日から存在する機種はTrue）
- machine_count（設置台数）

## アクション
```python
from eda.core import anomaly_detection
df = anomaly_detection('蒲田7', baseline_days=30, min_games=1000, anomaly_threshold=2.0)
today = df[df['date'] == df['date'].max() & df['is_anomaly']]
```

