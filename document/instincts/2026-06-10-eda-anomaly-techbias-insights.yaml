# 「好調baseline × ANOMALY」が翌日最も続く（baseline≥+200で翌日+113）

## 背景
逆張り条件の翌日検証（全ホール合算、翌日1000G以上）:

| 条件 | 翌日avg | plus率 |
|------|---------|--------|
| 全ANOMALY | +43 | 39.8% |
| 少台数（≤3台）のANOMALY | +26 | 40.5% |
| 低baseline（≤-500）のANOMALY | -46 | 37.3% |
| 逆張り複合（少台数+低baseline） | **-90** | 37.0% |
| 人気台ANOMALY（≥10台） | **+70** | 40.3% |
| 好baseline（≥+200）のANOMALY | **+113** | 40.9% |

「不人気機種の逆張りカンフル」仮説は否定。逆張り複合条件は翌日-90で最悪。
「既に好成績の機種でのANOMALY」が最も翌日に続く（+113）。
これはlag_analysisのstreak_rateと同じメカニズム（高設定台は複数日継続）。

## アクション
- 逆張り（低baseline+少台数）のANOMALYは翌日打ちに行かない
- baseline≥+200のANOMALYは翌日継続を検討できる唯一の条件
- カンフル注入は1日限りの可能性が高い（低baseline台はすぐ戻る）

