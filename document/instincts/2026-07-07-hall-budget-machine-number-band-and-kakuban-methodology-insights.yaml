# 残差の中心化に使う平均は、後段の集計と同じ重み付けにしないと系統バイアスが出る

## 背景
台番号帯の効果を「各台自身の平均」で残差化する実装で、中心化に単純平均
(`groupby("machine_number")["rate"].transform("mean")`、日次rateの算術平均)を使い、
その後の残差集計をgames加重(`residual * games`を日合計してtotal_gamesで割る)で行ったところ、
23区分中21区分で残差t値が元の符号に関係なくプラス側に系統的に膨張した(最大26倍)。
原因は中心化の重み(単純平均)と集計の重み(games加重)が一致していないこと。
パチスロでは「出玉が良い日ほどgamesも伸びる」という日次相関が普通に起こり得るため、
この不一致は生データの構造上、無視できないバイアスを生む。

## アクション
台・機種単位の基準値(ベースライン)を計算する際は、後段でその残差をどう集計するか
(games加重か単純平均か)を先に決め、**中心化とその後の集計で同じ重み付けを使う**。
games加重で集計するなら、基準値も `total_diff / total_games`(games加重平均)を使うこと。
単純平均で中心化して加重集計する組み合わせは系統バイアスを生むため禁止。
実装後は「各台についてgames加重残差の通期合計がゼロに戻るか」をテストで固定すること。

## 例
修正前: 楽園2131-2140 t_full=+4.02 → 残差t=+12.88(符号維持だが5倍近く膨張、バイアス濃厚)
修正後: 同区分 t_full=+4.02 → 残差t=-2.44(符号反転、元の効果が個体差にほぼ吸収された)
修正後の値の方が、23区分全体で振れ幅・符号のばらつきともに自然な分布になった。

