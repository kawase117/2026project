# kakuban_binとsectionは「どの島か(//10)」と「島内の位置(%10)」に分解すべき、片方に統合してはいけない

## 背景
`eda/hall_budget_allocation_light.py` で、レイアウトCSVが無いホールのkakuban_bin代理指標を
実装する過程で2段階の誤りが起きた。(1) kakuban_bin列がsectionと同じ「台番号10刻みの絶対区間」
(`//10`)を無条件に使うようになり、レイアウトCSVがある蒲田7を含む全ホールでkakuban_binとsectionが
完全に重複した。(2) 修正時も、レイアウトの無い6ホールに対してkakuban_binをsection由来の
decade-labelでそのまま埋めており、位置(%10)の情報を持たなかった。
台番号を`(number-1)//10`(島ID)と`(number-1)%10`(島内位置、0-2/3-5/6-9で角番近似)に分解すれば、
この2つは対立する概念ではなく直交する2軸であり、統合すると角番の情報が完全に失われる。

## アクション
台番号ベースの代理指標を実装するときは、section(島ID、`//10`)とkakuban_bin(島内位置、`%10`)を
必ず別関数・別ロジックで計算し、同じ値を使い回さない。レイアウトCSVがあるホールでは実座標由来の
section+角番ランクを、無いホールでは`//10`/`%10`の分解を、一貫した設計で適用する。
「物理配置(角番)による法則性」と「台番号そのものによる法則性(機種配置ポリシー等)」は
別のメカニズムであり、代理指標で片方しか計算していない場合はその旨を明示すること。

## 例
ARROW(レイアウトCSV無し)で修正前確認: `section`と`kakuban_bin`の全行が完全に同一値
(`541-550`等)だった。蒲田7・蒲田1・みとやはEXACT_LAYOUT_HALLSとして実座標section+
`%10`ランクのkakuban_binを使うよう分離。ただしrank基準(局所ランクの定義)を変えるだけで
「有意」とされるセルが入れ替わる(蒲田7: 旧v2は6-9が正、新v5では0-2が負で有意)ことも確認され、
この種の代理指標は定義のブレに弱く、単独では確定的な結論の根拠にしない方がよい。

