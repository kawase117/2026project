# ホール間で budget_regime を比較するときは絶対閾値ではなくホール内z-scoreを使う

## 背景
`budget_index = total_diff/total_games*100` に固定閾値(±1.0)でunder/balanced/overを
判定したところ、ホール平均水準自体が大きく異なるため(蒲田7 mean=+4.06、蒲田1 mean=+1.04、
みとや mean=-0.38)、蒲田7だけが常時over_budget判定(79%の日)になり、
ホール間比較が破綻した。ホール内z-score(閾値±0.75σ)に変更したところ、
3ホールともunder/balanced/overがほぼ対称な分布になり、初めて比較可能になった。

## アクション
複数ホールを横断して「強い/弱い日」を分類・比較する指標を作るときは、必ずホール内の
平均・標準偏差で標準化(z-score化)してから閾値判定する。絶対値の閾値をそのまま複数ホールに
適用しない。

## 例
蒲田7: 絶対閾値で under=32/balanced=43/over=285(360日中)。
z-score閾値(±0.75σ)に変更後: under=65/balanced=234/over=61。
蒲田1・みとやも同様に対称分布になった。

