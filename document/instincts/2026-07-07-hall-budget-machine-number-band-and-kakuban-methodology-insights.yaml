# 台番号帯効果は「その帯にある個々の台の通期平均」でほぼ完全に説明できる

## 背景
楽園・金時・レイトギャップ・ザシティの4ホールで、台番号10刻み帯ごとの excess_vs_hall_day を
split-half検証したところ、23区分中23区分がsplit-half安定(符号一致・|t|>=1.0)だった。
しかし各台自身の通期平均(games加重: total_diff/total_games)で残差化して再検定すると、
符号一致かつ|t|>=2.0を維持したのは23区分中1区分のみ(楽園1151-1160)で、これは23回検定した場合の
偶然の期待値(約1件)と同水準。つまり「帯効果」の実体は、その帯を構成する個々の台番号自身の
平均的な強さ・弱さでほぼ説明し尽くされる。

さらに機種入れ替え(入替)をまたいだ持続性を見ると、9区分中8区分で入替後も符号が変わらず持続した。
一見「残差で消える」ことと「入替をまたいで持続する」ことは矛盾するように見えるが、
最も整合的な解釈は「特定の台番号スロットには、機種が入れ替わっても毎回似たカテゴリ・人気度の
機種が繰り返し配置される」という運用上の配置パターンがある、というもの。番号そのものにも
1台の筐体の人気にも還元されない。

## アクション
台番号帯・machine_category帯などで有意な偏りを見つけたら、報告前に必ず
「個々の台の通期平均(games加重)で残差化しても残るか」を検証する。残差で消えるなら
「帯の効果」ではなく「たまたまその帯に強い/弱い台が集まっているだけ」として扱う。
入替イベントが観測期間内にあれば、入替前後で符号・大きさが持続するかも合わせて確認し、
「番号スロットの配置ポリシー」なのか「個体の実力」なのかを切り分ける。

## 例
楽園1131-1140: 全期間t=-6.62(強い負の効果)だが、games加重残差ではt=-0.77に縮小し
explained_by_machine_identity。楽園1151-1160のみ残差後もt=-2.78で生存したが、
この帯は観測期間中に機種入替が一度も起きておらず(アイムジャグラーEX-TP/ゴーゴージャグラー3/
ハッピージャグラーVIII固定)、入替検証で追加確認ができないため、23回検定中の偶然の1件である
可能性を否定できない。

