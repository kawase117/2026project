# 出力だけでなく生成元スクリプトの所在を毎回確認する。既知の異常日除外も分析ごとに再確認する

## 背景
ホール予算配分の「計画版」出力(`hall_budget_allocation_plan_all`)がgit statusの新規ファイルに
含まれておらず、生成元スクリプトが存在しないまま出力だけが提示されたことがあった。
さらに蒲田7の既知の異常日(2025-07-07、全台設定6)が計画版の集計から除外されていなかった
ことも発覚した。どちらも「出力を見て終わり」では気づけず、生成元コードと既知の除外ルールを
明示的に確認して初めて分かった。

## アクション
分析結果を提示・レビューする際は、(1) `git status`で生成元スクリプトが実際にコミット候補に
含まれているか確認する、(2) そのホールに既知の異常日除外ルールがあれば
(document/instincts検索、kamata7-0707-all-setting6等)分析対象期間から実際に除外されているか
実データで確認する。出力の見た目が整っているだけでは再現性・正確性を保証しない。

## 例
`hall_budget_allocation_plan_all`ディレクトリの出力はあったが、生成元の
`prepare_plan_source_frame()`等がどのファイルにあるか一見不明で、後に
`hall_budget_allocation_light.py`に同居していると判明(専用スクリプトではなかった)。
蒲田7の`allocation_by_axis.csv`先頭行に`date=20250707`が残っていたことも、
実データを直接grepして初めて発覚した。
