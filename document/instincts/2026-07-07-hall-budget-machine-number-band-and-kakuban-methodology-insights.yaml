# 不均衡クラス+class_weight='balanced'+時系列splitではaccuracyがbaselineより悪化するのが普通、判定はAUC基準にする

## 背景
蒲田7のホール予算配分モデルで、時系列分割(直近30%をtest)によりtest期間に
positiveクラス(over_budget)が極端に少なくなり(baseline_accuracy=0.963)、
class_weight='balanced'で学習したモデルはaccuracy=0.704とbaselineを大きく下回った
(accuracy_delta=-0.259)。しかしroc_auc=0.851と、3ホール中最も強いランキング能力を示していた。
accuracy_deltaだけでmodel_statusを判定すると、実際には最強のシグナルを持つホールが
「trained_below_baseline」と誤ってラベル付けされる。

## アクション
不均衡データ+class_weight='balanced'+時系列分割の組み合わせでモデルの良し悪しを判定する際は、
accuracyやaccuracy_deltaを主指標にしない。閾値に依存しないroc_auc(または balanced_accuracy)を
主指標にし、0.5からの乖離でtrained_above_baseline/below_baseline/near_baselineを判定する。
accuracyは参考値として残してもよいが、レポートには「判定根拠はAUC」であることを明記する。

## 例
蒲田7: baseline_accuracy=0.963, accuracy=0.704(delta=-0.259)だがroc_auc=0.851 → 実際は最強シグナル。
AUC基準(>=0.6=above, <=0.55=below)に切り替えた結果、蒲田7=above、みとや=above、
蒲田1=below(auc=0.548、実際にチャンスレベル)と、実態に即した分類になった。

