# カテゴリ間offset相関は、区分数が少ないほど会計的恒等式で見かけ上強くなる。一致率は偶然一致率で補正する

## 背景
`atype`(2値: A/N)で区切ったexcessのoffset相関が全9ホールで-0.99前後と極端に強かったが、
これは「share_A×excess_A + share_N×excess_N = 0」というシェア加重の恒等式が2値分割で
ほぼ厳密に成り立つために生じる会計的アーティファクトだった。kakuban_bin(3区分)は
相関が-0.2~-0.49に弱まり、machine_category(4-5区分)ではほぼ0になった。区分数が
増えるほど見かけの相関が弱まるという傾向自体が、この現象がアーティファクトであることの
追加証拠になる。同様に、budget_regimeの「同一状態が翌週も続く確率」(same_regime_rate)も、
周辺分布の偏りだけから偶然一致する確率(chance rate = Σp_i²)と大差ない水準だった。

## アクション
2値(または少数値)カテゴリ間のoffset相関・一致率を「持続性の発見」として報告する前に、
(1) 区分数を増やしても同じ傾向が残るか確認する、(2) 一致率は必ず周辺分布から求まる
偶然一致率との差分(uplift)で報告する。

## 例
atype A→N相関: 蒲田7 -0.998、蒲田1 -0.994、みとや -0.989(2値、ほぼアーティファクト)。
kakuban_bin(3値): -0.2~-0.49。machine_category(4-5値): 0.03~0.19(ほぼ実質シグナルなし)。
budget_regimeのsame_regime_rate: 観測値と偶然一致率の差(uplift)は蒲田7+0.079、
蒲田1+0.023、みとや+0.012程度で、蒲田7以外はノイズの範囲内。

