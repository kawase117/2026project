# 角番(物理的な入口からの距離ランク)は、4つの検証手法すべてでresidual_diff/residual_gamesと無相関

## 背景
蒲田1 2F・蒲田7 2F・蒲田7 3F について、`assign_kakuban()` で各フロアの
入口/主通路からの距離ランクを割り当て、residual_diff
(機種平均差枚からの偏差)・residual_games との関係を以下4パターンで検証した:

1. 全期間でのPearson相関 (|r| < 0.07)
2. 2025H2限定でのPearson相関 (|r| < 0.11)
3. 火曜(角番投入日と認識されている曜日)限定 + 機種タイプ別(A型/N型)セグメント分割
   (|r| < 0.09)
4. 火曜限定 + 日次群間分散のpermutation検定(50回スモーク、observed < null が大半)

いずれの手法でも、角番という物理的な位置指標が差枚・稼働の偏差と
線形的にも分散的にも有意な関係を示さなかった。
[[rotation-hypothesis-requires-dispersion-test-not-correlation]] の検定により
「ローテーションのため相関に出ない」という説明も支持されなかった。

## アクション
- 角番(入口からの距離)を新規ML特徴量として追加する優先度は低いと判断する。
- 「火曜=角番の日」という運用認識自体は否定しないが、その効果を
  「物理位置→差枚」という単純な軸で特徴量化するのは筋が悪い可能性が高い。
  [[tuesday-kakuban-means-last-digit-adjacency-not-physical]] の通り、
  むしろ「台番号末尾の隣接」など別の軸で角番投入が表現されている可能性がある。
- 1000回permutationでの本実行は、すでに50回で一貫した方向性(null支持)が
  出ているため、優先度を上げて急ぐ必要はない。

