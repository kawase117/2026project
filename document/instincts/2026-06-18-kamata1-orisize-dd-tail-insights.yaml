# 大型横向き島は DD・tail ともに完全に無効。tail軸は全orientation×sizeで無効

## 背景
kamata1_orisize_dd_tail_eda（2026-06-18実施）。全8グループ（4 ori_size × 2 seg）の分析。

横向き大型（horizontal_large）
  horizontal_large_A（n=6083）: KW_dd_p=0.059（有意DD なし）、KW_tail_p=0.201
  horizontal_large_N（n=13519）: KW_dd_p=0.698（完全非有意）、KW_tail_p=0.615
  → horizontal_large は DD・tail ともに完全に効果なし

tail軸の全グループサマリー
  有意 tail が出たグループ: diagonal_medium_N のみ
    tail=5: mean=404, median=-250（mean/median 乖離 +654 → アウトライア駆動、実用不可）
    tail=0: mean=-45, median=-500（q=0.031、弱い構造信号だが軽微）
  他7グループ: 全て KW_tail_p > 0.10、有意 tail なし

## アクション
horizontal_large（2256-2268, 2269-2281, 2317-2330）:
  DD軸・tail軸を使用しない。カクバン・セクション・機種タイプのみで選択。

全グループ共通:
  蒲田1 2F では tail軸を使用しない。diagonal_medium_N tail=5 の mean は高いがアウトライア駆動。

