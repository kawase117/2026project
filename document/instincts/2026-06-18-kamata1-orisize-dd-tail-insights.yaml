# 大型斜め島×A系: DD=30 が median=+100（全体A系のDD=30よりさらに強い）

## 背景
kamata1_orisize_dd_tail_eda（2026-06-18実施）。diagonal_large_A（n=28199）のDD分析。

DD=30 のシグナル（大型斜め島限定）
  n=769, mean=462.8, median=+100, q=0.0000
  全A系のDD=30（median=0）より中央値がさらに +100 高い

大型斜め島内で有意なDDは DD=30 のみ（KW overall p=0.0000）。
他の全DD: q>0.05（1・7・9日も大型斜め島単体では有意でない）。
→ 大型斜め島のA系は DD=30 専用のイベント投入がある可能性。

対象セクション（diagonal_large）
  2001-2020 (20台), 2043-2059 (17台), 2060-2076 (17台)
  2236-2255 (20台), 2282-2301 (20台), 2302-2316 (15台)

## アクション
DD=30 に蒲田1 2F 大型斜め島のジャグ系を選ぶとき:
kakuban=1（コーナー端）を避けつつ中央部の台を最優先とする（median=+100）。
DD=1 や DD=7 は大型斜め島では有意でない → 他の島タイプとのDD選択戦略が異なる点に注意。

