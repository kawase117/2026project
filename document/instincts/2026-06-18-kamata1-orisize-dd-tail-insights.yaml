# 横向き中型島×A系: DD=7 が median=+200（全分析中最高値）、52.5%が黒字

## 背景
kamata1_orisize_dd_tail_eda（2026-06-18実施）。orientation×size×機種別 BH補正MWU DD分析。
horizontal_medium_A（n=10642）のDD分析で DD=7 が単独で突出。

DD=7 のシグナル
  n=373, mean=447, median=+200, q=0.0030
  百分位: p10=-1480, p25=-800, p50=+200, p75=+1600, p90=+2800
  pct_above_0 = 52.5%（台の半数以上が黒字）

このシグナルの特異性
  全セグメント全DD中で median が +200 を超えた唯一の位置。
  全A系の DD=7 シグナル（median=0）より横向き中型に特化した方が明確に強い。

対象セクション（horizontal_medium）
  右エリア 11台: 2021-2031, 2032-2042, 2077-2087, 2088-2098, 2121-2131, 2132-2142, 2151-2161
  左エリア 10台: 2167-2176, 2177-2186, 2203-2212, 2213-2222

## アクション
DD=7（毎月7日）に蒲田1 2F 横向き中型島のA系を最優先候補とする（median=+200, 52.5%黒字）。
カクバン（kakuban=1 回避 + U字両端回避 [[kamata1-horizontal-n-both-ends-weak]]）を重ねる。
DD=7 以外の日: DD 依存台選択は根拠薄い。セクション・カクバンを主軸に。

