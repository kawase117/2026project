# 中型斜め島×A系: DD=1（最強）・DD=30（強い）、DD=11・DD=19は有意に弱い

## 背景
kamata1_orisize_dd_tail_eda（2026-06-18実施）。diagonal_medium_A（n=12763）のDD分析（4DD有意）。

有意DD一覧（q<0.05）
  DD= 1  mean=418, median=+100, q=0.0000  ← 最強（唯一の q=0.0000）
  DD=30  mean=430, median=+100, q=0.0436  ← 強い
  DD=11  mean=-33, median=-300, q=0.0291  ← 有意に弱い
  DD=19  mean=-121, median=-300, q=0.0426 ← 有意に弱い

全体 A系のDD=11 は非有意だったが、中型斜め島に限ると DD=11 が有意に弱い。
→ 中型斜め島では DD=11（ゾロ目）に高設定を投入していない。

対象セクション（diagonal_medium）
  2099-2109 (11台), 2110-2120 (11台), 2191-2202 (12台), 2223-2235 (13台)

大型斜め島（DD=30 のみ有意）と中型斜め島（DD=1, 30 が強い）でDDパターンが異なる。

## アクション
中型斜め島でA系を狙うとき:
  DD=1: 最優先（median=+100, q=0.0000）
  DD=30: 次点（median=+100）
  DD=11: 避ける（median=-300、全体傾向と逆）← 中型斜め島特有のルール
  DD=19: 避ける（mean=-121, median=-300）

