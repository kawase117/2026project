# diagonal_large_N × DD=11: mean=547 だが median=-200 → アウトライア駆動、実用価値なし

## 背景
kamata1_orisize_dd_tail_eda（2026-06-18実施）。diagonal_large_N（n=26399）のDD分析。

DD=11 のシグナル詳細
  n=964, mean=546.5, median=-200.0, q=0.0025
  mean と median の乖離 = +746 → 一部の大当たりが平均を押し上げているのみ
  median=-200 は N系通常日（全体 median=-500 より浅いが）で構造的優位でない

全体 N系 DD=11（mean=293, median=-400）も非有意だったが、
大型斜め島では mean が 547 まで跳ね上がりさらに誤解を招きやすい。

## アクション
diagonal_large_N で DD=11 の mean が高くても、median=-200 を信頼すること。
N系全グループで DD 軸は実用的な選択根拠にならない [[kamata1-2fn-dd-axis-null]] 参照。

