# 現地のリアルタイム観察は事前予測ではない。採点の問いは「早い段階のシグナルが最終まで持続したか」

## Core claim
「当方がそのホールをリアルタイム取得できない」ことと「観察者が当日の情報を見ていない」ことは別である。
ユーザーは店内で実データ（データ機・台の挙動）を見ている。したがって現地で出た主張は、
盲目の事前予測でも、最終結果を見た後の後知恵でもない中間の性質を持つ。
採点は「当たったか」ではなく「**早い段階で見えたシグナルが最終結果まで持続したか**」で行う。

## Evidence
2026-09-12、ユーザーが「楽園は末尾6、蒲田1は末尾4に仕掛けがある」と提示した。
当方は蒲田1をリアルタイム取得できないことを根拠に、蒲田1末尾4を prospective=true（完全な事前予測）で凍結した。
翌日、ユーザーから「現地でリアルタイムに、最終結果より早い段階で気づいた」と訂正された。
採点の問いを持続性に置き換えると、同日の2件は正反対の結果になった。

- 楽園末尾6: site777 17:25 時点でジャグRB 2位（1/313.2）→ 最終3位（1/340.6）。**減衰**。終日首位は末尾3
- 蒲田1末尾4: 最終データでAT機の差枚残差1位（+1206枚）・ジャグRB 2位。**持続**

並べ替え検定は、末尾4と名指しした場合 p=0.014、10末尾の最大値として p=0.123。
観察が当日の情報にもとづく以上、証拠の強さはこの間にあり、名指しの p は確証として使えない。

## Interpretation
- 持続したシグナルは「その日のうちに行動できた材料」なので、運用上の価値は事前予測より高いこともある
- 単日の持続は「その日そうだった」以上を意味しない。翌日以降への外挿には前向き検証が要る
- site777 のスナップショットがあるホール（楽園）では、観察時点に近い値と最終値を直接比べて持続性を測れる

## Action
- 凍結する前に「いつ・どこで・何を見て気づいたか」をユーザーに確認し、prospective を決める。当方の取得手段の有無で推定しない
- 現地観察は (1) 最終データでの順位 (2) 早い時点のスナップショットがあればそこからの持続/減衰、の2点で採点する
- 名指しの p と多重比較込みの p を両方書き、名指しの p を確証として扱わない
