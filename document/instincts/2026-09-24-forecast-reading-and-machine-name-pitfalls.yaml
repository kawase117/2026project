# 予告本文の"L"略称は液晶タイプの意味とは限らない。同名機種が複数あれば決め打ちしない

## Core claim
予告文中の「L+機種名」という略称は必ずしも液晶ボーナス機を意味せず、アカウント・ホールごとの慣習で別の機種を指すことがある。同ホールに類似名の機種が複数存在する場合、略称だけで1つに決め打ちしてはいけない。

## Evidence
- n_observations: 1（2026-09-24、ユーザーからの訂正）
- data scope: single-hall (楽園蒲田店)
- result summary: 楽園蒲田9/23予告の「L北斗が過去4回連続で対象」を、当初「北斗の拳 転生の章2」の略称と誤読した。ユーザーから「L北斗は通常、スマスロ北斗の拳を指す」と訂正された。楽園蒲田にはスマスロ北斗の拳(3113-3120)と北斗の拳転生の章2(番台は時期により変動)が別機種として同時に存在する。

## Interpretation
- 予告の略称記法は汎用的な業界慣習だけでは確定できない。アカウント・地域の慣習が優先される
- 誤読すると、答え合わせで別機種の実績を引用してしまう実害がある(実際に本セッションで発生した)

## Action
- 予告の機種略称照合で、同ホールに類似名の複数機種が存在する場合、1つに決め打ちせず、named-context等で全候補を並列に確認してからユーザーに確認する
- 略称解釈に確信が持てない場合は、断定せずユーザーに聞く

