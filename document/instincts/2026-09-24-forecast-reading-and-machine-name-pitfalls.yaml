# 999999Q9Qは23時台に翌日の予想、日付が変わった0-2時台に前日の結果速報を投稿する

## Core claim
999999Q9Qアカウントの深夜0-2時台の投稿を機械的に「当日の予告」として扱うと、実際には前日の結果速報を誤読するリスクがある。本命の翌日予告は前日23時台(21-23時台)に投稿される。

## Evidence
- n_observations: 1（2026-09-23、楽園蒲田・蒲田7・蒲田1の予告確認セッション）
- data scope: single-account (999999Q9Q)
- result summary: 9/23 00:27・00:48の投稿は見出しが「〜速報」で内容も「ゾロ目の22日は」のように前日(ゾロ目=9/22)を指す結果速報だった。本命の9/23予告は前日23:51("GALAXYウスイのメガなな予想")と21:25("新章メガいちよこやん予想")の投稿で、見出しが「〜予想」だった。

## Interpretation
- 見出しの「予想」か「速報」かが最も強いシグナル。深夜帯というだけで予告と決め打ちしない
- 本文中の日付言及（「ゾロ目の22日は」等）が過去日を指していないか必ず確認する
- n=1セッションの観察であり、他の日・他アカウントでも同じ投稿リズムかは未検証

## Action
1. 999999Q9Qのツイートを予告として扱う前に、見出しが「予想」か「速報」かを確認する
2. 本文中の日付言及が対象日（今日/明日）を指しているか、過去日（DD・曜日名等）を指していないか確認する
3. 深夜0-2時台の投稿だけで判断せず、前日21-23時台の投稿も必ず遡って確認する

