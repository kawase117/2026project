# 楽園蒲田・蒲田1には「北斗」系の類似機種名が複数同時に存在する。machine_nameの完全一致でも番台移動の混入に注意

## Core claim
楽園蒲田・蒲田1では「スマスロ北斗の拳」「北斗の拳 転生の章2」「北斗の拳 宿命」「スマスロ真・北斗無双」が別機種としてmachine_masterに存在する。machine_name完全一致検索でも、対象期間中に番台移動や機種入替があると意図しない機種の実績を拾う可能性がある。

## Evidence
- n_observations: 1（2026-09-23予告答え合わせセッション）
- data scope: single-hall (楽園蒲田店)
- result summary: 過去の「スロトレインフィニティ取材」(6/23,7/23,8/24)実績をmachine_name='スマスロ北斗の拳'で検索した際、該当番台(1011-1016)が当時本当にその機種名だったか、後の番台移動で「北斗の拳転生の章2」に変わっていた可能性が未検証のまま残った。9/23時点でこの番台は「北斗の拳転生の章2」だった。

## Interpretation
- machine_name完全一致は機種名の表記ゆれには強いが、同名機種が別の時期・別の番台に存在する場合の取り違えには無力
- 楽園蒲田は改装・配置替えが多いホール（7/6改装・9/7配置替え・9/14入替の既往歴あり）で、この種の番台移動が起きやすい

## Action
- 楽園蒲田・蒲田1で「北斗」系機種を分析するときは、まずmachine_masterで正式名称の全候補（スマスロ北斗の拳／北斗の拳転生の章2／北斗の拳宿命／スマスロ真・北斗無双）を洗い出す
- 過去日の実績を引用する際は、対象期間中にmachine_detailed_resultsのmachine_number×dateで機種名が変わっていないか確認してから解釈する

