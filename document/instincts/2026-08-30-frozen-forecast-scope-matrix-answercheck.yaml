# 予測の答え合わせは凍結済み主張を粒度別に採点し、事後診断を的中へ昇格させない

## 背景
イベント予測の答え合わせでは、予測時に明示・凍結した主張だけを、同じ粒度の実績で
個別に採点する。台番号の的中、機種全体の的中、カテゴリ選択の妥当性、末尾の的中は
別の問いであり、一つの好結果で他の粒度まで「的中」としてはならない。

予測後に発見した強い機種・末尾・並びは、次回予測の仮説を作るための**事後診断**であって、
今回の的中率には加えない。予測時に具体的な末尾を固定していなければ、実績で強い末尾が
見つかっても末尾予測は「採点不能」とする。

### 今回の事例
2026-08-29のラスサタ予測をベルシティ雑色の確定DBで答え合わせしたところ、同じ予測内でも
粒度によって評価が分かれた。

- ゴーゴージャグラー3の指定3台は3/3プラス、平均+1,784枚で、機種内455通り中2位だった
- しかしゴーゴージャグラー3全15台のRB最尤は設定3で、機種全体の高設定投入とはいえなかった
- マイジャグラーVの本命789はRB 1/745.3で低設定側だったが、補欠782はRB 1/198.3で強かった
- 指定17台全体は平均-31枚、8/17プラスで、個別の好結果だけを見れば総合評価を過大にできた
- 事後スキャンでは戦国乙女5が4/4プラス、平均+1,450枚だったが、予測外なので的中にはできない
- 予測時に具体的末尾を固定していなかったため、事後の末尾別集計は診断にしか使えなかった

この例では「指定したゴージャグ3台は的中」と「イベント全体の構造予測は外れ寄り」が
同時に成立する。総合の一語に潰すと、何が再利用可能で何が失敗したか分からなくなる。

## アクション
答え合わせは次の順で行う。

1. **採点対象を復元する**
   - announce、prereg、当時の回答などから、対象ホール、対象日、cutoff、候補順位、機種、
     台番号、末尾、全台/1/2などの主張を復元する
   - 対象店舗のDBがなかったため別店舗で代替予測した場合は、代替店舗だけを採点し、
     元の店舗を予測済みとして扱わない
2. **DB完全性を先に確認する**
   - `max(date)`、当日行数、`count(distinct machine_number)`、重複、主要列NULL、
     `games=0 and diff!=0` を確認してから採点する
3. **粒度別スコアカードを作る**
   - 個別台: 差枚、回転数、設定推定指標
   - 指定台セット: 平均、中央値、プラス率、同一機種内での組合せ順位
   - 機種: 平均、中央値、プラス率、上位台除外平均。ノーマル機は機種別RB尤度も併記
   - 全台/1/2: 全台系と部分投入を別判定。ATの部分投入は平均差枚だけで否定しない
   - カテゴリ選択: 推薦カテゴリ全体と、比較対象カテゴリの機会損失を分けて評価
   - 末尾/並び: 予測時に固定したものだけを採点する
4. **実現損益と潜在設定を分離する**
   - 差枚プラスは勝ち結果、RB/BB/ART等の尤度は設定投入の証拠として別列にする
   - ジャグラーは機種マスターの機種別RB確率から
     `max(L5,L6) / max(L1..L4)` を出し、最尤設定だけで断定しない
5. **事後発見を別枠にする**
   - 予測外で最も強かった機種・末尾・並びを「missed opportunity」として報告する
   - 次回仮説には使えるが、今回のhit数・的中率には加えない
6. **総合評価は内訳の後に書く**
   - 「個別台は的中、全台系は外れ、カテゴリ判断は部分的妥当」のように分解して書く
   - 一語の的中/外れや恣意的な総合点だけで終わらせない

## 例
正しい要約:

> ゴージャグ指定3台は機種内組合せで明確な的中。一方、機種全体のRBは設定3相当で
> 全台高設定とはいえず、本命789、サンダーV、SAO IIは外れた。予測外の戦国乙女5を
> 取り逃したため、イベント全体の構造予測は外れ寄り。具体的末尾は事前固定していないので
> 末尾予測は採点不能。

誤った要約:

> ゴージャグが3台ともプラスだったのでラスサタ予測は的中。末尾5も強かったので末尾も的中。

後者は台番号の的中を全台系・イベント全体へ拡張し、予測していない末尾を事後追加している。

