# ぽこ機種の的中率は機種によって大きくばらつく（0%〜100%）

## 背景
n>=5の機種について的中率（Top5内出現率）を計算した結果:
高信頼機種（Top5率80%超）: マイジャグラーV,真一騎当千,かぐや様,マギアレコード,SAO
低信頼機種（Top5率30%未満）: 7つの魔剣,北斗の拳転生の章2,ガールズ最終章,バンドリ！

## アクション
- 機種別信頼スコアを特徴量として追加を検討
- 「7つの魔剣」「北斗の拳 転生の章2」はPARTIALマッピングの精度問題の可能性あり
  → 「北斗の拳 転生の章2」は存在しない機種で、正解は「スマスロ北斗の拳」
- 「ガールズ&パンツァー 最終章」は「ジャグラーガールズ」との混在が原因の可能性

## 例
```
マイジャグラーV     : Top5=100%  avg_rank=2.6（強）
真・一騎当千       : Top5=100%  avg_rank=2.7（強）
7つの魔剣        : Top5=0%    avg_rank=N/A（要調査）
北斗の拳 転生の章2  : Top5=0%    avg_rank=N/A（機種不存在）
```

