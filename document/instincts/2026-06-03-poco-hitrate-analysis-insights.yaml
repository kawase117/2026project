# ぽこ全ハーフ機種の日レベル的中率はTop5で80.6%

## 背景
poco_data_v3.csv（正規化済み）を使いdaily_machine_type_summaryの上位機種と照合した結果。
208日分（グランドオープン除く）で、ぽこが全ハーフとして報告した機種が
実際の当日Top5機種に1つ以上含まれていた割合が80.6%だった。

機種レベル精度: Top3=38.1% / Top5=53.2% / Top10=70.7%

## アクション
ぽこ全ハーフ情報はMLの特徴量として利用価値が高い。
ただし以下の差異に注意して扱うこと：
- K7（86.8%）はK1（73.1%）より13%高精度 → K7優先
- 金曜通常日（68.8%）は最も精度が落ちる
- PARTIALマッピング機種（北斗など）は過剰計上に注意

## 例
