# ぽこのK7情報はK1より13%高精度（86.8% vs 73.1%）

## 背景
Top5日レベル的中率:
- K7（蒲田七）: 86.8%（189日）
- K1（蒲田一）: 73.1%（156日）

差異の原因仮説:
- ぽこの情報源がK7の方が質が高い（内部情報提供者の違い）
- K1は機種ラインナップが異なり、poco表記とDBのマッピング精度が低い

## アクション
- K7を主要分析対象として優先する
- K1の的中率改善にはマッピング精度向上（特にK1固有機種）が必要
- K1のfull_half_normalizedの正規化漏れを確認する

## 例
K7 Top3=73.5%  Top5=86.8%  Top10=94.7%
K1 Top3=60.3%  Top5=73.1%  Top10=85.9%
差異: Top5で13.7ポイント

