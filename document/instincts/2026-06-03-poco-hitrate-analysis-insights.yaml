# イベント日はコンテンツではなく日付で定義する

## 背景
ぽこのコンテンツ内容（全→/発表→/貫通→の有無）でイベント日を判断すると
フォーマット変化（7月は発表→、8月以降は全→）で誤判定が多発する。
正しくは日付の日付で判断する。

イベント日の日: 1, 7, 11, 17, 21, 22, 27, 30, 31
また MM=DD（月と日が一致する強ゾロ目日）もイベント日扱い。
周年などの特別日は別途管理。

## アクション
```python
EVENT_DAY_SET = {1, 7, 11, 17, 21, 22, 27, 30, 31}
def calc_is_event_day(date_str):
    month = int(date_str[4:6])
    day   = int(date_str[6:8])
    return (day in EVENT_DAY_SET) or (month == day)
```

## 例
20250711: day=11 → is_event_day=True
20250808: month=8, day=8 → MM==DD → is_event_day=True
20250713: day=13 → is_event_day=False

