# 貫通→機種 は蒲田7・蒲田1両店が同機種に高設定を入れたことを意味する

## 背景
「貫通」はK7とK1が共同で同一機種に全台系設定を入れるイベントを指す。
検証した全6件（20250711,20250715,20250730,20250801,20250803,20250804）で
K7とK1のコンテンツが同一機種（または同等機種）を示していた。
1のつく日・30日などのイベント日に多く発生。

## アクション
- 「貫通→」をfull_halfの一部として扱う（weekday_strategyに入れない）
- 両ホールの貫通機種が一致するか検証すると品質確認になる
- 貫通日はK1のfull_halfにも同機種が含まれると想定してよい

## 例
20250711: K7=貫通→吉宗, K1=貫通→吉宗 → 両ホール吉宗
20250730: K7=貫通→ハッピー, K1=貫通→ハッピー → 両ホールハッピー

