# ぽこコンテンツは曜日仕掛け + 全ハーフの2層に分離する

## 背景
ぽこの仕掛け内容は「曜日仕掛け（発動条件）」と「全ハーフ（具体機種）」が
1文字列に連結されている。これを分離しないと的中率が3-4%に見えるが、
正しく分離すると80%超になる。

分離ルール:
- 「、全→」「、発表→」「、貫通→」「：全→」の直前 = 曜日仕掛けの終端
- 「貫通→」で始まる場合 = イベント日（weekday_strategy空）
- メガ仕掛け→ / 高配分→ は無視

## アクション
```python
# 分割位置を探す
split_pos = -1
for sep in ['、', '：']:
    for mk in ['全→', '発表→', '貫通→']:
        pos = s.find(sep + mk)
        if pos != -1 and (split_pos == -1 or pos < split_pos):
            split_pos = pos

# 貫通→始まりはイベント日（full_halfのみ）
if s.startswith('貫通→'):
    return '', clean_full_half(s), False
```

## 例
"水曜日→末尾1・8、全→バイオ5、SAO"
→ weekday_strategy="水曜日→末尾1・8"
→ full_half="バイオ5、SAO"

"貫通→吉宗、発表→モンハンライズ"
→ weekday_strategy="" (イベント日)
→ full_half="吉宗、モンハンライズ"

