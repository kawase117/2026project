# 楽園蒲田: 工事後ジャグの少数台機種（<15台）は22日平均で有意にマイナス、メイン機種（アイム/マイジャグ）は非有意

## Core claim
楽園蒲田の工事後（2026-07-07〜07-30、22日）で、ジャグをメイン機種(ネオアイムEX 62台・マイジャグV 20台、計82台)と少数台機種(ゴーゴー3・ハッピー・ファンキー・ガールズ、計35台)に分けると、少数台側だけがホール平均比excess −157枚/台 [95%CI −228, −86]で有意にマイナス。メイン側は+49 [-54, +152]で非有意。

## Evidence
- n_observations: 22日、台入替を除いた現行台のみ
- data scope: hall=楽園蒲田店、category=A_ジャグ
- metric scope: diff_coins_normalized の同日ホール平均比excess、日クラスタCI
- result summary: A_ジャグ|少数台(<15台) -157.1 [-228.2, -85.9]（有意）。A_ジャグ|メイン(>=15台) +49.3 [-53.5, 152.2]（ns）。カテゴリ単位（AT一般/ジャグ/ハナハナ/技術介入の4分類）や5フロア分類は22日平均でいずれも非有意で、この機種規模分割だけが唯一有意だった。

## Interpretation
- 「楽園のジャグはネオアイムに固定投入されている」という以前の見立て（RB確率スコアの機種偏重問題）とは独立の角度から、少数台ジャグが一貫して弱いことが裏付けられた。
- ただし「メイン機種の中でどちらが良いか（アイム vs マイジャグ）」はこの分割では分からない。単日(0730)ではマイジャグの方がアイムよりrateが良かったが、22日平均では未検証。
- 工事後のレジームに限定した集計（0706島配列工事後）。工事前や他ホールへの一般化はしない。

## Action
- 楽園のジャグ台選びでは少数台機種（ゴーゴー・ハッピー・ファンキー・ガールズ）を優先候補から外し、アイム/マイジャグの2機種に絞ることを支持する追加根拠とする。
- `backtest/prereg/rakuen_jug_renovation_rb_top3` のuniverseをメイン2機種に絞る変更を検討する際の材料にする。
- アイム vs マイジャグのどちらが良いかは、複数日のメイン機種内訳を別途集計してから判断する。

