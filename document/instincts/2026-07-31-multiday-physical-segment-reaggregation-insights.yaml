# 蒲田7: 3F_L（2F/3F×L/R 4分割の3F左側）は29日平均で有意にマイナス

## Core claim
蒲田7を2F/3F×L/R（既存の`ml/analysis/kamata7_kakuban_rl_eda.py`のX座標L/R定義）で4物理セグメントに分けると、2026-07-01〜07-30の29日平均で3F_Lだけがホール平均比excess −102枚/台 [95%CI −195, −9]と有意にマイナス。他3セグメント（2F_L +50 / 2F_R +30 / 3F_R +53）はCIが0をまたぎ有意でない。

## Evidence
- n_observations: 29日 × 台入替を除いた現行台のみ（machine_number+machine_name一致で履歴を絞り込み）
- data scope: hall=マルハンメガシティ2000-蒲田7、全カテゴリ横断
- metric scope: diff_coins_normalized の同日ホール平均比excess、日をクラスタとした平均±1.96×SE
- result summary: 3F_L −101.7 [-194.7, -8.7]（有意）。2F_L +49.9 [-24.7, 124.4]／2F_R +29.7 [-20.9, 80.2]／3F_R +52.9 [-55.1, 160.9]（いずれもns）。単日(0730)では逆に2F_Lが最弱・3F_Rが最強に見えたが、これは単日ノイズで29日平均では再現しない。

## Interpretation
- 3F_Lにはハナハナ全16台・ジャグ74台・AT一般119台が混在しており、単一機種の効果ではなく物理位置（フロア×左右）そのものの効果と考えられる。
- ただしハナハナ16台は全て3F_Lにしか設置がなく、「3F_Lが弱い」と「機種固有の弱さ」を完全には分離できていない（confounder）。
- 単日データの符号（0730は2F_L最弱）を鵜呑みにしないこと。物理セグメント軸は日次ノイズが大きく、複数日集計して初めて安定した符号が出る。

## Action
- 蒲田7で台選びの優先順位付けに物理セグメントを使う場合、3F_Lは他3セグメントより一段低く評価する。
- ハナハナとの交絡を切り分けるため、3F_L内でハナハナを除いた場合の再集計をTODOとする（次回蒲田7セグメント分析時に実施）。
- 単日のみでこのセグメント軸を根拠に台を選ばないこと。

