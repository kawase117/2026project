# 単日のカテゴリ/フロア/機種規模別excessは複数日集計でほぼ消える

## Core claim
蒲田7・楽園の単日(0730)データで見えたカテゴリ別・フロア別・機種規模別のexcess差は、29日・22日で日クラスタCIを付けて再集計すると大半が0をまたぎ、有意な差として残るのはごく一部（蒲田7の3F_L、楽園ジャグ少数台機種）だけだった。

## Evidence
- n_observations: 蒲田7 29日 / 楽園 22日
- data scope: hall=蒲田7・楽園、全カテゴリ横断
- metric scope: diff_coins_normalized excess、単日値 vs 日クラスタ平均±CI
- result summary: 単日では蒲田7「2F_L最弱/3F_R最強」・楽園「ハナハナ+380/ジャグ-122」等の大きな差が見えたが、複数日平均ではいずれも符号が変わるか95%CIが0をまたいだ。有意に残ったのはごく一部の軸のみ（[[2026-07-31-kamata7-3fl-segment-negative-excess]] / [[2026-07-31-rakuen-jug-minor-model-negative]]）。

## Interpretation
- 単日データでの「今日はこのカテゴリ/フロアが強かった」という観察は、当日の答え合わせとしては正しいが、次回以降の台選びルールの根拠にはできない。
- カテゴリ数・フロア数・機種規模区分が増えるほど多重比較になり、単日では偶然有意に見える軸が増える。

## Action
- カテゴリ/フロア/機種規模別のexcess比較を台選びルールの根拠にする前に、最低20日程度・日クラスタCIを付けて再集計する。
- 単日の粒度分解は「当日の答え合わせ・告知内容の検証」に留め、翌日以降の運用ルールには昇格させない。

