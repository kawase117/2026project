# 回転数帯で揃えたO/Eは、稼働が違う日を比べる軸で偏る(帯補正なしの版と必ず並べる)

## 背景
2026-10-03のみとや大森町店の全軸総当たりで、ジャグラーのRBに「土日は低く、木曜は高い」「X_DDS日(DD4,7,14,17,24,27)は低い」という結果が出た(`backtest/unit_time_scan.py`のRB当り、機種×回転数帯の基準から出した期待当りとの比)。回転数帯で揃えない版(機種平均の当り率との比)で確かめると、見かけだった。
- 土日はジャグラーの1台平均が約6,000G、平日は約4,500G。高い回転数帯の基準(当りが多い帯)と比べるため、土日の当り率は低く出る。帯補正の曜日別RB比-1は、木+3.3%、土-3.9%、日-3.4%。帯補正なしは、月+0.8%、火+0.8%、水-0.8%、木+0.6%、金-0.2%、土+0.3%、日-1.3%(日曜のみ区間が0を超えて負)。
- X_DDS日のジャグラーは、帯補正で-2.7%(4月27日以降-4.4%)、帯補正なし(曜日調整後)で+2.4%(4月27日以降+0.1%)と、符号が割れた。
- 日の平均回転数とジャグラーRB比の相関は、曜日を揃えて0.48(4月27日以降0.23)。回転数は設定の結果でもあり、客の集中の結果でもある。

## アクション
- 稼働が日で違う軸(曜日、X_DDS日、イベント日、土日祝、前日の稼働)のRB結果は、**帯補正あり・なしを並べる**。符号が割れたら判定しない。
- 同じ日の中の比較(通路角1と同じ日の他の台、同じ機種の同じ日の平均との差)は、この偏りを受けない。
- `unit_time_scan.py` の標準出力は、帯補正あり(`E`を使う版)だけ。帯補正なし版を出力に追加するのが次の改修(未実施)。
- 手順書 `hall-axis-scan` に同じ注意を記載済み。

## 例
みとや大森町店のジャグラー土曜は、帯補正で-3.9%(区間は0を超えず負)だが、帯補正なしは+0.3%(区間-0.6〜+1.2%)。
