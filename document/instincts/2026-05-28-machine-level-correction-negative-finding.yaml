# 台番号レベルの correction は統計的に支持されない

## 背景
蒲田7（323日、ゾロ目台70台）で machine_level_correction_analysis を実施した結果：

- FDR有意台数: 1/70（1.4%）— ランダムなら5%有意で3〜4台出るはず
- 前半/後半の correction 符号一致率: 42/70（60.0%）
- 前半/後半のスピアマン相関: r=0.0884, p=0.4667（相関なし）

同末尾内で平均差枚が大きく異なって見えた台（例: 2233=+489 vs 3233=-420）は
ランダムな分散であり、持続的なシグナルではない。
前半で「強かった台」が後半も強い保証は皆無。

## アクション
- 「台番号3211に必ず座れ」「3233は避けろ」という判断はデータに支持されない
- 台番号レベルの correction テーブルは採用しない（過学習になる）
- 適切な粒度は既存の weekday × last_digit 単位の correction テーブル
- 台番号レベルの分析が有効になる条件：
  - データ期間が3年以上（1000日超）
  - 複数ホールを横断した大規模検証
  - 現時点では実施しない

## 例
```
【誤った判断】
  avg_diff: 2233(末尾3) = +489, 3233(末尾3) = -420
  → 「2233に座れ」「3233は避けろ」← 支持されない

【正しい判断】
  weekday=水曜, last_digit=3 の correction = +280
  → 末尾3のゾロ目台ならどれでもよい（台番号に優劣なし）

【判断の根拠】
  スピアマン r=0.088 ≈ 0 → 前半の強さは後半に引き継がれない
  FDR有意 1/70 → 偶然の範囲
```

