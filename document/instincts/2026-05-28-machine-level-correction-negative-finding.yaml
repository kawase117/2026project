# ゾロ目補正の最適粒度は weekday × last_digit（台番号レベルは過学習）

## 背景
粒度を細かくすると以下のトレードオフが生じる：

- weekday × last_digit: セル数70、1セル観測数~46、安定性中
- weekday × machine_number: セル数490、1セル観測数~46、FDR有意1/70
- machine_number のみ: セル数70、1セル観測数~323、スピアマンr=0.088

台番号レベルにしても観測数が増えるわけではなく、
セル数が増えるだけでノイズが増す。

## アクション
- correction テーブルの粒度は weekday × last_digit × group_key で固定
- 台番号レベルへの細分化はデータ量が10倍以上になるまで試みない
- 「同末尾内で特定の台番号が強い」という観測が出ても、
  前半/後半の安定性とFDR補正を必ず確認してから採用を判断する

## 例
```python
# 現行（適切な粒度）
correction_table = df.groupby(['weekday', 'last_digit', 'group_key']).agg(...)
correction_table['correction'] = zorome_avg - nonzorome_avg

# 過学習（採用しない）
correction_table = df.groupby(['weekday', 'machine_number']).agg(...)
# FDR有意 1/70、スピアマン r≈0 で支持されない
```

