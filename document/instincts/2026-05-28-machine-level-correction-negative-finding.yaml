# 同末尾内の台番号間の avg_diff 差は多くの場合ランダム分散

## 背景
323日のデータで同末尾3のゾロ目台の平均差枚に最大900枚の差が見られたが、
前半/後半スピアマン相関 r=0.088（p=0.467）は相関なしを示す。
diff_coins の標準偏差は数百〜千枚オーダーあり、
46観測（曜日別）では信頼区間が広すぎてこの程度の差は容易に生じる。

## アクション
個別台の成績バラつきを見たとき、シグナルとノイズを区別する最低基準：
1. 前半/後半に分割して同じ順位傾向が続くか確認（符号一致率 ≥70%）
2. Welch's t検定 + FDR補正で有意差があるか確認（p_fdr < 0.05）
3. 効果量 Cohen's d ≥ 0.3
4. 3つすべてクリアしない限り「ランダム分散」と判断して台番号選択には使わない

## 例
```
【要注意パターン（採用しない）】
  台番号77: 過去50回の平均 +800枚
  → 前半25回 vs 後半25回で符号一致を確認
  → 一致しないか、FDR p≥0.05 なら採用しない

【採用できるパターン】
  前半50回: +650枚 / 後半50回: +720枚
  + FDR p<0.05 + Cohen's d≥0.3
  → このホールでは当該台を当該曜日に優先する
```

