# 楽園のsectionは「列」であって「島」ではない。通路(柱)で分断された1本の列を1 sectionにまとめると分析単位が壊れる

## 背景
`Heatmap/generate_rakuen_kamata_coordinates.py`が、1122-1134・1135-1151・2100-2110・
3107-3116・3176-3187の5箇所で、通路(柱)で物理的に分断された1本の列を`section`という
1つのラベルにまとめていた。既存の`machine_layout_history`側は63/64 sectionまで修正済み
だったが、座標CSV側は未修正のまま残っていた。ユーザーの実地確認により、正しい境界は
1122-1129/1130-1134、1135-1138/1139-1144/1145-1151、2100-2105/2106-2110、
3107-3112/3113-3116、3176-3181/3182-3187と確定した。

## アクション
- section定義を変更する前に、座標CSV(`Heatmap/*_rakuen.csv`)・`machine_layout`(現行
  スナップショット)・`machine_layout_history`(全エポック)の3箇所が同期しているか必ず確認する。
  片方だけ直すと定義が食い違ったまま気づかず使われる。
- `database/migrate_split_rakuen_sections.py`のSPLITS辞書は「未適用の分割だけ」を持つ
  設計。既に適用済みのエントリを残したまま再実行すると「section名が存在しない」エラーに
  なる。適用後は該当エントリを辞書から削除する運用にする。
- 修正は必ず両エポック(工事前20250101・工事後20260706)に対して行う。本館2F/3Fは工事で
  台番号が+2シフトするため、同じ物理位置でもエポックでsection名が異なる
  (例: 工事後3176-3187 ↔ 工事前3174-3185)。

## 例
`eda/rakuen_section_classification.py`で座標(X最小/最大, Y最小)から機械的に「外周(frame)」
を判定できるが、内部通路分断(1100-1121のU字島、1122-1134の単列)は座標では見分けられず
外周ではない。3種の区別が必要: frame(外周)/interior_split(内部通路分断)/special(三角形・L字)。

