# gamesは設定の下流(mediator)であり、統制変数として回帰から除くと本物の効果まで消える。BB+RBで反証できる

## 背景
楽園clean列の端番効果を検証中、「端の台はgamesが多い区分に偏っている」ことが分かり、
day×model内でgamesを線形統制(残差化)したところ、機械割ppだけでなくBB+RB(ボーナス確率、
遊技者の継続バイアスの影響を受けない指標)まで同じ大きさで符号反転した。ボーナス確率が
回転数統制で反転する物理的メカニズムは存在しないため、これは「真の反証」ではなく
「mediatorを統制変数にした人工物」と判断した。CLAUDE.mdに既に明記されていた
「回転数は設定の下流(高設定→長く回される)。尤度の重み/観測分散に入れ、統制変数にしない」
という規約に反する分析を自分で行い、自分で反証した形になった。

## アクション
- games(回転数)を「効果を検証したい変数(位置・区画等)」の統制変数として回帰・残差化に
  使わない。gamesはブートストラップの重み(n_days等)としてのみ使う。
- 「gamesで統制すると効果が消える/反転する」という結果が出たら、真の反証と決めつける前に
  必ずBB+RB(ボーナス確率、遊技者行動の影響を受けない指標)で同じ統制を試す。BB+RBも同じ
  大きさで反転するなら、それは「対象の効果が偽物だった」のではなく「gamesがmediatorで
  あることの証拠」と解釈する。
- games帯で層別しても同じ反転が起きる場合(ビニングのスパース性が原因ではない)、
  この結論はより強固になる。

## 例
端(edge)の台はgames 5000+区分の構成比が51.7%(非端33.5%)。games帯ごとに層別すると
どの帯でも端の機械割は非端よりわずかに低いが(Simpson's paradoxのように見える)、
これは「高設定→長く回された」という因果経路そのものであり、統制すべき交絡ではない。

