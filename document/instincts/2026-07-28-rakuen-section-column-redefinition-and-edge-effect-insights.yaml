# 単一ホール・少数機種構成では、機種内残差の連動性から投入単位の境界を同定できない

## 背景
楽園のfram/interior_splitセクションが「柱の分断を投入単位として扱っているか」を、
2列の日次残差(同日×同機種平均からの残差)の相関で判定しようとした。素朴な同日×同機種
残差は、同じ機種が比較対象の2列にしか設置されていない場合、残差のゼロ和制約により
片方が上がればもう片方が必ず下がるという機械的な逆相関を生む(校正用の「同一列を
前半/後半に割ったペア」の相関が-0.60という物理的にありえない値になって発覚)。
そこで「比較対象の2群を除いた台」をベースラインにする方式(leave-out)に直したところ、
今度は共通の参照列(その機種が設置された他の唯一の列)を共有する2区画どうしが人工的な
正の相関を持ってしまい、同じ島の背中合わせペア(真に同一単位のはず)より、別々の島の
隣接ペア(参照が共通なだけ)の方が相関が高くなるという逆転が起きた。

## アクション
- 単一ホール×少数機種構成(楽園は250機種/567台)で、2区画の連動性を機種内残差の相関で
  測ろうとしない。機種が特定の少数区画に集中して設置されているため、ゼロ和制約や
  共通参照によるバイアスを完全には除去できない。
- 投入単位の境界を判定したい場合は、連動性(相関)ではなく、既に確立している「端番効果
  法」をそのピースに直接適用し、期間分割・列除外で頑健性を見る方が信頼できる
  (実際にこの方法でframe/interior_splitの判定ができた)。
- 校正基準(確実に同一単位のペア、確実に無関係なペア)を必ず作り、相関の絶対値ではなく
  校正基準との相対位置で判定する。ただし校正基準自体が同じ機種構成の偏りの影響を
  受けることがあるので、校正基準の妥当性も別途疑うこと。

## 例
1027-1036|1037-1046(別々の島の隣接列、転生が共通参照)の相関が+0.481で最上位、
1017-1026|1027-1036(同じ島の背中合わせ、真に同一単位)の相関が-0.032で最下位、
という物理的に不合理な逆転が発生し、この設計は破棄した。
