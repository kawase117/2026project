# clean列(端の定義が自明な列)の端(depth=1)だけに、ジャグ+1.2pp/技術介入+1.4ppの頑健な設定差がある

## 背景
section定義を「2列facing pair islandの各列・通路breakなしの単列・S字」=clean(38列)、
「外周(frame, 22列)」「内部通路分断(interior_split, 6列)」「三角形・L字(special, 4列)」
に分類し、clean限定・同日×同機種残差・台単位クラスタブートストラップで端番効果を測った。
ジャグ+1.207pp[0.784,1.638]・技術介入+1.403pp[0.914,1.826]で有意、BB+RBも同符号。
6期(3ヶ月区切り)全てで同符号、列を1本ずつ抜いても崩れない。depth(端から何番目)の
omnibus置換検定では、端を含めればp<0.0001で検出されるが端を除くと消える
(p=0.63-0.74、しかも観測分散が帰無分布を下回る=偶然より均一)。つまり勾配ではなく
depth=1だけの階段。DD・曜日・セクション主効果はomnibusで軒並みns。
AT一般は端・DD・曜日・セクションいずれの軸でも位置法則が見つからなかった。

## アクション
- 楽園の端番ルールを運用する場合、対象はclean列のジャグ・技術介入機、位置はdepth=1
  (両端)限定とする。depth2以降やAT一般には根拠がない。
- 効果量の絶対値を報告するときは「clean限定」の値であることを明記する。誤section時代
  (+0.349pp)→列修正後(+0.681pp)→clean限定(+1.207pp)と定義の精緻化のたびに増えている
  ため、定義誤りが効果を作っていた可能性はむしろ低い(逆なら定義修正で消えるはず)。
- ハナハナ25台は全てinterior_splitにのみ設置され、clean列に1台もない。ハナハナの
  端番効果を語るときはclean列の一般則と混同しない。

## 例
frameとinterior_splitのピースに同じ端番効果法を適用したところ、frameは四半期で
符号が反転し有意2/6(cleanは6/6・5/6)で「柱分断は投入単位でない」と判定。
interior_splitはハナハナのみ6期全て同符号(有意2/6)で単位として機能している。

