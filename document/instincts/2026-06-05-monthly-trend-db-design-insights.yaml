# DDとXのつく日は異なる概念

## 背景
「DD別」と「Xのつく日」を混同しやすい。このプロジェクトでの定義：

- **DD** = 日付の日（1〜31の具体的な日番号）
  - 4日、14日、24日はそれぞれ別のDD
  - 月内に**1回だけ**出現する

- **Xのつく日（date_digit）** = 日付末尾の数字（0〜9）
  - 4のつく日 = 4日・14日・24日（月に約3回出現）
  - `daily_hall_summary.last_digit` カラムに格納済み

## アクション
設計文書・コード内で「DD」と書く場合は必ず（1-31）か（末尾0-9）かを明示する。
月次集計の軸として「DD（1-31）」を使う場合、月1回しか出現しないため月次テーブルとしての意味がない。

## 例
monthly_trend_dd（DDを軸） → sample_count=1/月 → 月次集計は意味なし。削除。
monthly_trend_date_digit（日付末尾0-9を軸） → sample_count≈3/月 → 有効。

