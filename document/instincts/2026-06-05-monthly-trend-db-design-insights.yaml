# 月次集計はCalculatorクラスパターンで日次パイプラインに統合する

## 背景
既存パイプライン（`process_new_date()`）は SummaryCalculator / RankCalculator /
DateInfoCalculator を順番に呼ぶ構造。MonthlyTrendCalculatorも同じパターンで追加できる。

パイプライン順序の制約：
- `monthly_trend_machine_digit_*` は `last_digit_summary_*` のランク列を参照する
- RankCalculator.calculate_ranks_for_date() の後に呼ぶこと

## アクション
新しい集計処理を追加するとき：
1. `XxxCalculator(db_path)` クラスを `database/xxx_calculator.py` に新規作成
2. `incremental_db_updater.py` の `__init__` に追加
3. `process_new_date()` の末尾（ランク計算後）に呼び出し追加
4. `main_processor.py` の `DataImporter` にも同様に追加
5. `db_setup.py` の `create_database()` に新テーブルのCREATE文を追加

## 例
```python
# process_new_date() 内、ランク計算の try/except の後
try:
    self.monthly_trend_calc.update_month(date_str)
except Exception as e:
    print(f"[WARN] 月次トレンド更新スキップ: {e}")
return True  # この前に追加
```

