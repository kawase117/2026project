# 月次テーブルにはis_completeとdays_in_monthを必ず含める

## 背景
月次テーブルは月の途中から書き込みが始まり月末に「完成」する。
`days_in_month` があれば `sample_count / days_in_month` で月の進捗率を計算でき、
MLモデルが「50%しか経過していない月のデータ」と判断できる。

## アクション
月次または期間テーブルには必ず以下の3カラムをセットで追加：
- `sample_count INTEGER`  -- この月の実データ日数
- `days_in_month INTEGER` -- その月の暦上の総日数（28/29/30/31）
- `is_complete INTEGER DEFAULT 0` -- 翌月データ投入時に1に更新

翌月の最初のデータが来た時点で前月のis_completeを1に自動更新する。

## 例
```sql
-- MonthlyTrendCalculator._maybe_complete_prev_month() で自動実行
UPDATE monthly_trend_xxx
SET is_complete = 1
WHERE year_month = '202605' AND is_complete = 0;
```
