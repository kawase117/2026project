# 中央値はベース設定・最高設定の読み取りに有用

## 背景
差枚の平均値だけでは分布の形状が分からない。中央値を加えることで：
- median ≈ mean → 設定が均一に分散
- median << mean → 少数の高設定台が平均を引き上げている（最高設定の集中投入）
- median が月ごとに上昇 → ベース設定が上がっている傾向

SQLiteにはMEDIAN()関数がないためPandasで計算してからINSERTする。

## アクション
月次・期間集計テーブルには `avg_diff_per_machine` と `median_diff_per_machine` を
必ずセットで含める。Pandasの `groupby().median()` で計算し avgと同時にINSERT。

## 例
```python
medians = (df.groupby(key_col)['diff_coins_normalized']
           .median()
           .rename('median_diff_per_machine'))
result = result.merge(medians, on=key_col, how='left')
```

