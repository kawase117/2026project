# 投入傾向トレンドは機種タイプ別（all/jug/hana/oki/other）に分割する

## 背景
蒲田七はセグメント別の高設定投入傾向が実証されている（2026-05-27分析）。
月次トレンドを機種タイプ別に分割することで「4のつく日はジャグラー系に集中」等の
仮説検証が可能になる。「全体だけでよい」という判断はセグメント別傾向の見落としリスクがある。

## アクション
投入傾向を追跡するトレンドテーブルは必ず機種タイプ別
（_all, _jug, _hana, _oki, _other）の5バリアントを作成する。
既存の `last_digit_summary_*` と同じパターンに従う。

## 例
monthly_trend_date_digit_all / _jug / _hana / _oki / _other（5テーブル）
monthly_trend_weekday_all / _jug / _hana / _oki / _other（5テーブル）
monthly_trend_machine_digit_all / _jug / _hana / _oki / _other（5テーブル）
計15テーブル

