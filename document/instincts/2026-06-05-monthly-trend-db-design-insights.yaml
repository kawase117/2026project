# 月次集計の有効性は月内サンプル数で判断する

## 背景
月次トレンドDB設計時、どの軸を月次集計する価値があるか検討した。

| 軸 | 月内出現回数 | 有効？ |
|---|---|---|
| DD（日番号1-31） | 1回 | 不要 |
| Xのつく日（末尾0-9） | 約3回 | 低信頼・pre-compute価値あり |
| 曜日（月〜日） | 約4-5回 | 有効 |
| 台末尾（0-9） | 約30日×全台数 | 高信頼 |
| 機種別 | 30日分 | 高信頼 |

台末尾は「末尾が特定の数字の台」が毎日全台存在するため、月30日分の集計になる。
DDの「月1回」と混同しないこと。

## アクション
月次集計軸を新たに追加する場合、まず「その軸の値は月内に何回出現するか」を確認する。
sample_count=1の場合、月次集計は不要。sample_countが3以上あれば集計の意味がある。

## 例
月次テーブルの `sample_count` カラムを必ず入れる。
ML利用時: `sample_count < 3` の行は信頼性が低いとして重みを下げる。

