# 翌日追跡 vs 翌週追跡の使い分け

## 背景
不発高設定台の仮説検証において：
- 翌週追跡: 同曜日イベント再発仮説（週次戦略）
- 翌日追跡: 連日据え置き仮説（日次戦略）
両者で前提が異なり、ホールの戦略タイプを先に仮定して選ぶ必要がある。

## アクション
| ホール戦略の仮定 | 使用手法 |
|---------------|---------|
| 曜日イベント重視（週1回） | unfired_verification.py（翌週） |
| 連日据え置き戦略 | unfired_nextday_verification.py（翌日） |
| 不明 | 両方実行して比較 |

さらに両手法とも相対差枚（日別平均補正）で評価すること。

## 例
蒲田七：
- 翌週: unfired 13.85% vs baseline 15.79% → 翌週戦略なし
- 翌日: unfired relative -62枚 vs baseline +1枚 → 翌日戦略なし
→ 設定継続戦略が確認されないホール

