# 不発高設定の翌日差枚改善は曜日効果バイアス

## 背景
不発高設定台の翌日追跡で、翌日絶対差枚+154枚・改善+691枚（ベースライン+424枚）が見え、
「翌日据え置き戦略あり」という誤った結論を出しかけた。
翌日の全台平均で補正すると：不発台 -62枚、当たり台 +3枚、普通台 +1枚。
「月曜日は強い」という日別効果が全て説明できた。

## アクション
翌日差枚を評価するときは必ず日別平均で補正する：
```python
day_avg_diff_tomorrow = df.groupby("date")["diff_coins_normalized"].mean()
relative_diff_tomorrow = diff_tomorrow - day_avg_diff_tomorrow[date_tomorrow]
```
絶対差枚ではなく `relative_diff_tomorrow` で比較すること。

## 例
蒲田七（232,375台・325営業日）：
- 絶対差枚: 不発台 +691枚改善（誤：据え置きありに見える）
- 相対差枚: 不発台 -62枚（正：普通台より劣位）

