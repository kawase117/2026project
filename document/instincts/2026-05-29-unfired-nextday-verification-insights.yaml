# 当たり台の翌日据え置きも蒲田七では確認されず

## 背景
当たり台（+2,448枚）の翌日相対差枚: +3枚。ベースライン: +1枚。差わずか2枚。
蒲田七は「高設定を連日継続する」戦略も採用していない。

## アクション
据え置き戦略の有無は「当たり台」「不発台」の両方で確認する。
両方ともベースラインと差がなければ、当該ホールは毎日設定をリセットする傾向あり。
その場合、翌日以降への持ち越しは予測に使えない。当日指標に集中すること。

## 例
蒲田七：
- unfired_vs_other_gap: -62.60枚
- hit_candidate_vs_other_gap: +2.09枚
→ 設定は毎日リセットされる可能性が高い

