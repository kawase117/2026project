# ホール別の据え置き戦略は個別検証が必須

## 背景
「不発台は翌日も据え置かれる」戦略はホールによって異なる。
蒲田七では翌日相対差枚 -62枚（不支持）。他ホールでは実在する可能性がある。

## アクション
ホールごとに `unfired_nextday_verification.py` を実行し、
`tomorrow_avg_relative_diff` の符号で判定：

| 結果 | 解釈 |
|------|------|
| relative_diff > +30 | 据え置き戦略あり（活用可） |
| -30 ≦ relative_diff ≦ +30 | 据え置きなし（ノイズ範囲） |
| relative_diff < -30 | 翌日回収傾向（避けるべき） |

## 例
```bash
python ml/experiments/unfired_nextday_verification.py \
  --db-path db/<ホール名>.db \
  --output-dir ml/experiments/results/unfired_nextday_verification/
```
蒲田七: unfired -62枚、hit_candidate +3枚 → 据え置きなし

