# AT機のボーナス率×機械割のrは機械的に高く出る。ゲート通過は設定情報の証明にならない

## 背景
月次レポートの層1でAT機99機種に有効性ゲート（Spearman r の下限>0、n台日>=300）を適用すると10機種が通過した。
ただし r は北斗の拳0.98、沖ドキBLACK0.98、ヴァルヴレイヴ2 0.94など、AT当選数が出玉に直結することによる機械的な相関を含む。
設定と無関係でも高く出るので、通過しても「設定の情報がある」とは言えない。実際、ゲート通過10機種のうち
ボーナス率を自己ベースラインと比べた検定（AT_bonus_p）が p<0.05 なのは2機種で、その2機種は機械割と逆向き
（邪神ちゃん z=-2.2/機械割-3.9pp、ヴァルヴレイヴ2 z=-2.8/機械割+5.0pp）だった。AT機の設定は別の形（ボーナス確率以外）に出るという
既存方針（ボーナス確率で判別できるのはノーマル・BT・A+ATのみ）を裏づける結果。

## アクション
- ATの「相関ゲート通過」を設定推定の根拠にしない。通すなら、自己ベースライン比の検定と機械割が同じ向きかを併せて見る。
- r が0.9超なら機械的相関を疑い、設定情報の判定には使わない（ゲートの閾値に上限を設けるのではなく、解釈を止める）。
- AT機はG比×平均差枚（全台系スコア）や差枚分布で見る既存の扱いに戻す。

## 例
backtest/monthly_report.py の at_effectiveness_gate と層1の出力（AT_bonus_z / AT_bonus_p 列）。
