# x_day（DD末尾4,7）限定学習が全期間学習より全指標で優秀

## 背景
4スコープ × 2重み設定（8実験）を比較（2026-06-07セッション）:
```
スコープ          学習日数  Spearman  hit@3   prec25
x_dayのみ          72日    0.2916   0.067   0.456  ← ベスト
全期間            485日    0.2786   0.044   0.440
7のつく日のみ      30日    0.2697   0.056   0.432
DD=7のみ            2日    データ不足でスキップ
```

volume（全期間485日）より relevance（x_day 72日）の方が有効。
「多いデータで学習すれば良い」は成立しない。
DD=7の当日予測でも、DD=4の日を含むx_day全体で学習した方が良い。

## アクション
みとやの当日予測（DD末尾4,7の日）では **x_dayスコープのみで学習する**。
全期間学習モデルを使う必要はない。

```python
# x_dayのみに絞る
