# is_far_cornerの定義: rank_from_max==1 は reversed_section で誤動作する

## 背景
みとや大森町店の台723-733島は `is_reversed_section=1`（台番号の昇順と通路側の向きが逆）。
この島では台723が壁側角番、台733が通路側角番（rank_from_aisle=1）。

`rank_from_max == 1` で is_far_corner を定義すると、
reversed_section の通路側角番（733）に is_far_corner=1 が立ってしまう誤り。

## アクション
**セクション内 rank_from_aisle の最大値** で is_far_corner を定義する:
```python
# ❌ 誤り（reversed_sectionで通路側に誤フラグが立つ）
df["is_far_corner"] = (df["rank_from_max"] == 1).astype(int)

# ✅ 正しい
section_max_aisle = df.groupby("section")["rank_from_aisle"].transform("max")
df["is_far_corner"] = (df["rank_from_aisle"] == section_max_aisle).astype(int)
```

todayのDataFrameにも同様に適用:
```python
today_sec_max = today.groupby("section")["rank_from_aisle"].transform("max")
today["is_far_corner"] = (today["rank_from_aisle"] == today_sec_max).astype(int)
```

## 例
723-733島（is_reversed_section=1）での比較:
```
台733: rank_from_aisle=1（通路側）, rank_from_max=1 → ❌ is_far_cornerが誤って立つ
台723: rank_from_aisle=17（壁側）, rank_from_max=17 → ✅ is_far_cornerが正しく立つ
```

