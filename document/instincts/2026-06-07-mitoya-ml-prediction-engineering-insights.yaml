# 機種名汚染問題: DBには台番号ごとに時系列で異なる機種名が格納されている

## 背景
みとや大森町店 266台中 **204台（76%）** で機種名が変わっていた（515日分データ）。
例: 台501-522は「ダンベル何キロ持てる？」→「バンドリ！」→「甲鉄城のカバネリ 海門(うなと)決戦」のように変遷。

CatBoostに`machine_name`をCAT_FEATUREとして使うとき、
`df_raw.groupby("machine_number")["machine_name"].first()` や `.last()` を使うと汚染が起きる。

予測用のDataFrame（today）に機種名をマッピングするときは必ず最新日付のデータを使う:
```python
latest_date = df_raw["date"].max()
mn_map = (
    df_raw[df_raw["date"] == latest_date][["machine_number", "machine_name"]]
    .drop_duplicates("machine_number")
)
today = today.merge(mn_map, on="machine_number", how="left")
today["machine_name"] = today["machine_name"].fillna("unknown")
```

## アクション
1. 予測DataFrame（today）の機種名は **必ず `df_raw["date"].max()` の最新日付のみから取得**
2. 学習DataFrame（df）の機種名は各行の歴史的な名前をそのまま使う（混在させない）
3. `groupby("machine_number").first()` や `.last()` は使わない

## 例
```python
# ❌ 古い機種名が混入する（firstは最古、lastは最新だが全期間での最後）
mn_map = df_raw.groupby("machine_number")["machine_name"].first()

# ✅ 最新日付のみを参照
latest_date = df_raw["date"].max()
mn_map = df_raw[df_raw["date"] == latest_date][["machine_number","machine_name"]].drop_duplicates("machine_number")
```

