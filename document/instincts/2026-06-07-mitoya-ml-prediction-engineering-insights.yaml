# B案: 機種名から walk-forward 集約特徴量を生成し数値特徴量として追加

## 背景
- 機種が変わった台は旧機種名の学習データが多く、新機種名の学習データが少ない
- 機種名正規化（全履歴書き換え）は逆効果（別機種のデータが混入）
- 解決策: 各機種名が **実際に稼働していた期間のデータのみ** を使って集約統計を計算し、数値特徴量として追加

追加した特徴量（shift(1)でデータリーク回避）:
- `machine_avg_diff_wf`: 機種の全期間平均差枚（expanding mean）
- `machine_plus_rate_wf`: 機種の勝率（expanding mean of diff > 0）
- `machine_sample_n_wf`: 機種のサンプル数（統計の信頼性を示す）
- `machine_xday_avg_wf`: 機種のx_day（DD末尾4,7）限定平均差枚

**効果（みとや 2026-06-07予測、x_dayスコープ）:**
```
B案（walk-forward集約特徴量）: Spearman=0.2936, hit@3=0.0556, prec25=0.4545  ← ベスト
元の実装（正規化なし）:         Spearman=0.2923, hit@3=0.0556, prec25=0.4505
機種名正規化（全書き換え）:     Spearman=0.2557, hit@3=0.0222, prec25=0.4429
```

## アクション
機種名CAT_FEATUREは残しつつ、以下を NUMERIC_FEATURES に追加:

```python
# 機種別 walk-forward 集約特徴量（特徴量エンジニアリング section）
df_name_sorted = df.sort_values(["machine_name", "date_dt"])
df_name_sorted["machine_avg_diff_wf"] = df_name_sorted.groupby("machine_name")["diff_coins_normalized"].transform(
    lambda x: x.shift(1).expanding(min_periods=1).mean()
)
df_name_sorted["machine_plus_rate_wf"] = df_name_sorted.groupby("machine_name")["diff_coins_normalized"].transform(
    lambda x: (x.shift(1) > 0).expanding(min_periods=1).mean()
)
df_name_sorted["machine_sample_n_wf"] = df_name_sorted.groupby("machine_name")["diff_coins_normalized"].transform(
    lambda x: x.shift(1).expanding(min_periods=1).count()
)
df = df.merge(df_name_sorted[["date","machine_number",
    "machine_avg_diff_wf","machine_plus_rate_wf","machine_sample_n_wf"]],
    on=["date","machine_number"], how="left")

# x_day限定 expanding mean（x_day以外の行は前方補完）
df_xday_sub = df[df["is_xday"] == 1].sort_values(["machine_name", "date_dt"]).copy()
df_xday_sub["machine_xday_avg_wf"] = df_xday_sub.groupby("machine_name")["diff_coins_normalized"].transform(
    lambda x: x.shift(1).expanding(min_periods=1).mean()
)
df = df.merge(df_xday_sub[["date","machine_number","machine_xday_avg_wf"]], on=["date","machine_number"], how="left")
df = df.sort_values(["machine_name","date_dt"])
df["machine_xday_avg_wf"] = df.groupby("machine_name")["machine_xday_avg_wf"].transform(lambda x: x.ffill())
```

予測（今日）用: 全期間集計をそのまま使う（予測時点なのでリークは問題なし）
```python
machine_final_stats = df.groupby("machine_name").agg(
    machine_avg_diff_wf=("diff_coins_normalized", "mean"),
    machine_plus_rate_wf=("diff_coins_normalized", lambda x: (x > 0).mean()),
    machine_sample_n_wf=("diff_coins_normalized", "count"),
).reset_index()
xday_final = df[df["is_xday"]==1].groupby("machine_name")["diff_coins_normalized"].mean().reset_index(name="machine_xday_avg_wf")
machine_final_stats = machine_final_stats.merge(xday_final, on="machine_name", how="left")
machine_final_stats["machine_xday_avg_wf"] = machine_final_stats["machine_xday_avg_wf"].fillna(
    machine_final_stats["machine_avg_diff_wf"])
today = today.merge(machine_final_stats, on="machine_name", how="left")
```

## 例
特徴量重要度での位置づけ（2026-06-07, x_dayスコープ, 36特徴量）:
```
1位: games_normalized      31.4%
2位: machine_avg_diff_wf    6.3%  ← 新特徴量が機種名CATより上位
3位: machine_name（CAT）    6.2%  ← 補完役として有効
4位: machine_roll7_diff     6.1%
7位: machine_sample_n_wf    4.5%  ← モデルが信頼性を自動重みづけ
8位: machine_plus_rate_wf   4.2%
10位: machine_xday_avg_wf   3.1%
```

