# 新店長期間の3x sample_weight は効果ゼロ（データ量が少なすぎる）

## 背景
新店長期間（2026-05以降）のx_dayデータ: 約37日分。
72日の学習データに対して37日（51%）に3x重みをつけても効果なし。

実験で確認: 全スコープで重みあり vs なしの差が0:
```
x_dayのみ / weight無し: Spearman=0.2916
x_dayのみ / weight有り: Spearman=0.2916  ← 変化なし（全スコープで同様）
```

新店長の影響は `is_new_manager` フラグ（数値特徴量）として入れれば十分。
パターンの変化があるとしても37日では統計的に学習できる量でない。

## アクション
**新店長期間 sample_weight は使わない。** train_poolのweightパラメータを削除:
```python
# ❌ 不要かつ無効
train_pool = Pool(..., weight=df_train["sample_weight"])

# ✅ シンプルに
train_pool = Pool(df_train[ALL_FEATURES], label=df_train["diff_coins_normalized"], cat_features=cat_indices)
```

