# 機種名の全履歴書き換えは精度を下げる: 異なる機種のデータが混在する

## 背景
「現在の機種名の埋め込みが薄い」という問題を解決しようとして、
df全行のmachine_nameを最新日付の機種名に書き換える（正規化）を試みた。

結果: **全指標が悪化**
```
正規化あり: Spearman=0.2557, hit@3=0.0222, prec25=0.4429
正規化なし: Spearman=0.2923, hit@3=0.0556, prec25=0.4505
```

悪化の原因: 台501-522の2025年データは「ダンベル何キロ持てる？」の実績なのに
「甲鉄城のカバネリ...」として学習される → 全く異なる機種のデータが混ざる

## アクション
**機種名の全履歴書き換え（正規化）は行わない。**
代わりに、機種名から **walk-forward 集約特徴量** を生成する（B案を参照）。

