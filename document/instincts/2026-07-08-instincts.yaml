# Kamata7 theory tabs must be Japanese, explanatory, and failure-tolerant

## Core claim
The Kamata7 theory page is only useful when each tab explains its purpose in Japanese and falls back gracefully when a sample threshold removes all cells.

## Evidence
- n_observations: 1
- data scope: hall dashboard / theory verification
- metric scope: segment, event-day, dd x kakuban, cooling zone
- result summary: 2F segments should always map to `*_N`, 3F uses A/N, and DD-kind/event-day breakdowns need explicit contribution views.

## Interpretation
- English labels or unlabeled tabs hide the theory being checked.
- A strict `min_n` should not produce an empty dead-end; the page should explain what got filtered and show a lower-threshold reference view when appropriate.

## Action
- Keep tab labels, captions, and table headings in Japanese.
- Show the six physical segments, DD-kind contribution, cooling-zone labels, and refutation notes explicitly.
- If a filter empties a view, offer a reference view with `min_n=1`.

## Status
- status: active
