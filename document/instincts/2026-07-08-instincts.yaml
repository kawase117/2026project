# Kamata7 dashboard routes must be updated in both entrypoints

## Core claim
The Kamata7 dashboard only resolves new page keys reliably when `main_app.py` and `dashboard/main.py` are kept in sync; updating one router alone can still produce page-not-found errors.

## Evidence
- n_observations: 1
- data scope: dashboard routing / page registry
- metric scope: page lookup success
- result summary: `kamata7_event_checks` and `kamata7_segments` were unavailable until the runtime entrypoint router was synced too.

## Interpretation
- `dashboard/main.py` is not the only routing surface in this repo.
- A page can appear registered in one place and still fail at runtime if the other entrypoint is stale.

## Action
- When adding a Kamata7 page, patch both routers together and verify the actual startup path.
- Keep routing tests aligned with the page registry update.

## Status
- status: active
