# Day-level Kamata7 event summaries should be weighted by machine count

## Core claim
Kamata7 event-kind and DD summaries should use `machine_count`-weighted averages for rate-like columns so small cohorts do not distort the aggregate view.

## Evidence
- n_observations: 1
- data scope: hall-day event summaries
- metric scope: `avg_diff` / `avg_hit104_rate`
- result summary: weighting corrected the DD17 count discrepancy and kept larger cohorts from being underrepresented.

## Interpretation
- Simple averaging of per-day rows is too coarse when cohort size varies.
- Keep raw totals and counts visible alongside the weighted aggregate so the underlying volume is still auditable.

## Action
- Use `machine_count` as the weight for summary averages.
- Report day counts and total diff separately from the weighted rates.

## Status
- status: active
