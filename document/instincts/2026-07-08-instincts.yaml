# agmsg on Windows must be driven through Git Bash

## Core claim
Using the WindowsApps `bash.exe` path can route the command into the wrong shell and produce empty or misleading agmsg sends.

## Evidence
- n_observations: 1
- data scope: tooling / cross-agent messaging
- metric scope: delivery reliability
- result summary: Git Bash preserved the expected environment, while the WindowsApps bash path did not.

## Interpretation
- For agmsg on this machine, explicitly invoke Git Bash.
- Do not assume a generic `bash` resolves to the right runtime on Windows.

## Action
- Use the full Git Bash path when sending inbox/reply commands.
- Verify the inbox result if the message body or shell context matters.

## Status
- status: active
