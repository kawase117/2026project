# 月次キャッシュは月初日のtrainに依存する

## 背景
v8の月次キャッシュはWFエンジンが処理する最初の日のlift値をその月全体に適用する。
直接score_day呼び出し（特定日のtrainで計算）とWFエンジン結果（月初のtrainで計算）で
異なるlift値が使われ、評価結果の乖離を引き起こす。

## アクション
月次キャッシュを使う場合:
1. WFエンジン内での処理順序（日付昇順）を確認
2. 直接score_day呼び出しで検証する際はclear_v8_lift_cache()してから月初日から順に処理
3. 乖離調査時はキャッシュの初期化タイミングを最初に疑う

## 例
clear_v8_lift_cache()
for test_date in sorted(all_dates):
    scored = score_day(train, actual, variant, test_date=test_date, ...)

