# セグメント別avg_diff改善と全体avg_diff改善は別問題

## 背景
v8はセグメント別avg_diffで全6セグメントv6aに勝利（+3.0から+17.1）。
しかし全体avg_diff_vs_otherではv6a=51.0 > v8=25.3で敗北。
原因はTop50のセグメント構成比率の変化。セグメント別の勝ちは
そのセグメントに割り当てられた枠内での精度であり、枠の配分自体が変わると全体は悪化する。

## アクション
セグメント別改善を確認したら、必ずTop50のセグメント構成比率を検証する。
弱セグメントへの過剰配分がないか確認。correlation(diff_top50, diff_other) = -1.000は
異なる台を選んでいるだけでゼロサムのシグナル。

## 例
top50 = scored.head(50)
print(top50['segment'].value_counts())
各セグメントのvs_other値と並べて弱セグメント台数増加パターンを確認する。

