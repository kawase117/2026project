# セグメント別動的ウェイトはセグメント間スケール不一致を引き起こす

## 背景
v8はセグメント毎にlift（動的ウェイト）を算出し、セグメント内の台選択精度は全セグメントでv6aを上回った。
しかし全体Top50では、弱セグメント（3F_R_N: vs_other=-131）から+4.8台過剰選出し、
強セグメント（2F_L_N, 2F_R_N）から合計-5.8台不足する結果となった。
全体avg_diff: v8=146.5 vs v6a=170.5（-23.9）。

根本原因: 動的ウェイトはセグメント内の最適化であり、セグメント間のスコアスケールを揃えない。
弱セグメントでliftが高く出ると、そのセグメントの台に不釣り合いに高いcompositeスコアがつく。

## アクション
セグメント別動的ウェイトを使う場合は「監督役」を必ず併設する:
1. 方法A: グローバルスコア（v6a式固定ウェイト）とのブレンド（alpha=0.5-0.7）
2. 方法B: セグメント内パーセンタイル変換 + セグメント強度ウェイト
方法Aが推奨（v6aが実績ある監督役として機能するため）。

## 例
v8のTop50セグメント構成（1日平均）:
- 3F_R_N: v6a=8.6台, v8=13.4台（+4.8、最弱セグメント）
- 2F_L_N: v6a=13.8台, v8=11.5台（-2.3、最強セグメント）
- 2F_R_N: v6a=17.1台, v8=13.6台（-3.5、強セグメント）

