# 固定ウェイトはセグメント間スケール統一の暗黙的メカニズム

## 背景
v6aの固定ウェイト(0.40, 0.15, 0.20, 0.15, 0.05, 0.05)が動的ウェイトv8より
全体性能で勝る理由: 全セグメントに同じウェイトを適用するとcompositeスコアのスケールが
セグメント間で自然に揃い、強セグメントの台が自然にTop50上位に来る。

## アクション
動的ウェイトの導入時は、固定ウェイトが持つ暗黙的なスケール統一効果を代替する
メカニズムを必ず設計すること。ブレンド方式が最も安全。

## 例
v9a設計: composite = alpha * global_score(固定) + (1-alpha) * segment_score(動的)
alpha=0.7で固定ウェイトの安定性を70%維持しつつ動的ウェイトの精度改善を30%取り込む。

