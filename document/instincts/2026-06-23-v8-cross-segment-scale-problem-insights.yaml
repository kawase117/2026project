# Codexプロンプトはファイルとintermindを使い分ける

## 背景
Codexへのプロンプト送信方法として、ファイル(docs/codex_prompts/)とIntermindの2つがある。
ファイルは永続的な記録・git管理・構造化に優れるが双方向やりとりができない。
Intermindは会話的な修正指示・質問応答に優れるが記録が残りにくい。

## アクション
- 設計判断・仕様が複雑 → ファイルに書いてからIntermindで送る
- シンプルな修正・バグ修正 → Intermindで直接送る
- 反復的なやりとり → Intermind

## 例
v9設計プロンプト: ファイル作成後にIntermindで通知。
バグ修正: Intermindで直接「この関数のNaN処理を修正して」と送信。

