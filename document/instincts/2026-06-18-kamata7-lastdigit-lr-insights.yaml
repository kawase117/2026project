# 蒲田7のDD=6/16/26×末尾6演出戦略仮説は否定済み

## 背景
ホールが設定6をイメージさせるため末尾6台にDD=6/16/26で設定を入れるという仮説を検証。
Mann-Whitney検定:
- DD=6/16/26: 末尾6 vs 末尾others → p=0.82（非有意）
- 末尾6: DD=6/16/26 vs DD=other → p=0.93（非有意）
2F_L_Nの末尾6 mean+410も2026台（鉄）1台が原因。2026除外後p=0.207に消滅。

## アクション
蒲田7では末尾6の設定6演出仮説に基づいた台選定を行わない。
末尾6台の優位が見えた場合は鉄台除外検定を必ず実施すること。

