# 3F_L_N × DD7-12 では末尾9が最強・末尾5が最弱（構造的シグナル）

## 背景
3F_L_N（3F左側AT系）のDD-bin別末尾Kruskal-Wallis検定で、DD7-12（月7〜12日）のみp=0.002で有意。
末尾9: mean=+519, pos%=46.4%（AT系平均42%超え）。
末尾5: mean=-200, pos%=35.1%（明確な最弱）。
鉄台候補（3079, 3029）2台除外後もp=0.013で有意残存→分散型の構造的シグナル。
他DD-binでは末尾9の優位は消え、DD13-24では末尾5が末尾9を上回る逆転が発生。

## アクション
DD 7〜12（月7日〜12日）に蒲田7 3F左側AT系を狙う場合:
- 末尾9台を優先候補にする（特に3069, 3049が安定）
- 末尾5台は回避する（pos%=35.1%、mean=-200）
他のDD期間では末尾軸に依存しない。

候補台（DD7-12・特に優秀な末尾9）:
3069（section 3058-3072, mean=+1222）
3079（section 3073-3087, mean=+1007, median=+200 鉄台候補）
3049（section 3043-3057, mean=+839）
3029（section 3017-3030, mean=+531, pos%=59% 鉄台候補）
3059（section 3058-3072, mean=-312 除外対象）

## 例
DD=8のとき → 3F_L_N 末尾9台（3069, 3049など）を優先。末尾5台はスキップ。

