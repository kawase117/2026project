# 末尾シグナルの真偽は鉄台除外再検定で判定する

## 背景
今セッションで検証した末尾シグナルの大半が特定台依存だった:
- 2F_L_N 末尾6: 2026台（鉄）1台除外でp=0.020→p=0.207（消滅）
- 3F_R_N DD19-24 末尾5: 3225・3255の2台除外でp=0.084→p=0.479（消滅）
- 3F_L_A DD19-24 末尾3: 5台除外でp=0.081→p=0.285（消滅）
一方、3F_L_N DD7-12 末尾9は鉄台2台除外後もp=0.013で残存→構造的シグナルと判定。

## アクション
末尾の有意グループが見つかったら以下の手順で真偽判定する:
1. 台番号別集計で pos_rate>=60% または median>=0 の台を鉄台候補とする
2. 鉄台候補を除外して同じグループでKruskal-Wallis再実施
3. p>=0.05に消えたら特定台依存の偽シグナル、p<0.05が残れば構造的シグナル

iron = by_m[(by_m["pos_rate"] >= 60) | (by_m["median"] >= 0)].index.get_level_values(0).tolist()
excl = full_bin[~full_bin["machine_number"].isin(iron)]
stat, p = stats.kruskal(*[g.values for _, g in excl.groupby("last_digit") if len(g)>=10])

## 例
3F_L_N DD7-12 末尾9: 鉄台（3079, 3029）除外後p=0.013→構造シグナル確定。
2F_L_N 末尾6: 2026除外後p=0.207→偽シグナル（2026の高設定が末尾6に滲んだだけ）。

