# DD19-24は3F右AT・3F左ジャグラーで特定台が高設定（末尾ではなく台番号で覚える）

## 背景
3F_R_N・3F_L_A ともにDD19-24がKW最有意ビン（それぞれp=0.084, p=0.081）。
ただし台番号別検証で特定台依存と判明（除外後消滅）。
末尾5・末尾3が構造的に強いのではなく、その末尾を持つ特定台がDD19-24に高設定。

3F_R_N（右側AT系）高設定候補:
- 3225（section 3218-3233, mean=+1465, median=+1000, pos%=58.7%）
- 3255（section 3250-3264, mean=+1263, median=+300, pos%=56.1%）

3F_L_A（左側ジャグラー系）高設定候補:
- 3003（section 3001-3016, mean=+519, median=+350, pos%=54.8%）
- 3183（section 3181-3190, mean=+461, median=+150, pos%=56.5%）
- 3163（section 3156-3167, mean=+571, median=+100, pos%=55.0%）
- 3123（section 3117-3130, mean=+336, median=+100, pos%=52.4%）
- 3153（section 3144-3155, mean=+328, median=0, pos%=56.1%）

## アクション
DD 19〜24（月19日〜24日）に蒲田7 3Fを訪問する場合:
- 3F右AT: 3225・3255を優先確認
- 3F左ジャグラー: 3003・3183・3163・3123・3153を優先確認
- 末尾単体で選ばず台番号で覚える

## 例
DD=21のとき → 3225の回転数と差枚をまず確認。稼働が低ければ高設定の可能性。

