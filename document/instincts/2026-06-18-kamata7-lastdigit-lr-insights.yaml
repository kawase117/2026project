# 末尾分析はL/R分割後に実施する（未分割では信号が埋もれる）

## 背景
蒲田7の2F_N（AT系全体）を未分割でKruskal-Wallis検定するとp=0.254で非有意。
同じデータをL（X<=17）とR（X>=19）に分割すると2F_L_NがKW p=0.020で有意化した。
角番分析と同様、L/R分割が末尾軸でも信号を浮き上がらせる効果がある。

## アクション
末尾×差枚のKruskal-Wallisを実施する前に座標CSVでL/R付与を行う。
L/R判定しきい値（蒲田7）:
- 2F: X<=17→L, X>=19→R（X=18除外）
- 3F: X<=17→L, X>=23→R（X=18〜22除外）
縦列・除外セクションは角番分析と同一（2187-2195, 3191-3208, 3209-3217, 3400-3401）。

## 例
c["side"] = c["X"].apply(lambda x: "L" if x<=17 else ("R" if x>=19 else "E"))
c = c[c["side"] != "E"]
# 2F_L_N: p=0.020（有意）、未分割2F_N: p=0.254（非有意）

