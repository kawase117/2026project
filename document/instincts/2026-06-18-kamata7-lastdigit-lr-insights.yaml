# 3F_R_Aは末尾軸では全DD-binで非有意（角番で見るエリア）

## 背景
3F_R_A（右側ジャグラー系）の末尾×DD-bin分析で全ビンが非有意（p=0.14〜0.65）。
角番分析では3F_R_AがDD19-24でkakuban=9が最強（p=3.6e-6）と判明済み。
末尾軸では信号が出ない。

## アクション
3F_R_Aを狙う場合は末尾ではなく角番（kakuban）を軸に使う。
末尾×L/R分割で3F_R_Aが有意にならなかった場合は分析打ち切りでよい。

