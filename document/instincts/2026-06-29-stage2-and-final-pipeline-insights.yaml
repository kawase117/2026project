# Stage 2の台選びはhist_metricを超える特徴量が存在しない

## 背景
Top5セクション内に限定して、角番・debut_phase・直近トレンド・momentumの予測力を検証した（60日walk-forward）。

特徴量評価（セクション内Spearman）:
- debut_days: rho=+0.030, p=0.084（唯一の弱い信号だが戦略に組み込んでも改善ゼロ）
- kakuban_group/raw: rho≈+0.005, p>0.7（無効）
- trail_7d/14d_hit: rho≈-0.014（負、トレンド追従は逆効果）
- kakuban_edge: rho=-0.038, p=0.028（有意だが負。端台がやや不利）

戦略比較: 全戦略でhit率41.4%±0.3%、diff/台+443〜+490の範囲に収束。

## アクション
- Stage 2はhist_metricのまま変更しない
- セクション内の台選びは現在のDBデータでは限界に達している

## 例
  hist_only: hit=41.4%, diff/台=+481
  kakuban_weighted: hit=41.7%, diff/台=+490 (+8, 誤差)
  trail_weighted: hit=40.7%, diff/台=+443 (-38, 悪化)

