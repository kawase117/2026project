# セクション履歴ランキングの最終仕様

## 背景
セッションで確立した最終仕様:
- Stage 1: section_avg_hist（60日窓）でセクションランキング
- Stage 2: hist_metric（60日窓）でセクション内台ランキング
- 推奨: Top5セクション × 5台 = 25台/日

検証済みパラメータ:
- 窓幅60日（90日より+73枚/台、6期間中4勝2敗）
- N系閾値104%（106%よりrho+0.021改善）
- 曜日補正β=0.1（小さいが安定した改善）
- DD補正/イベント分割/台×週/連続値ターゲット/Stage2追加特徴量 → 全て無効

## アクション
- predict_section.pyに窓幅60日とN系閾値104を反映する
- これ以上のパラメータチューニングは見込みが薄い
- 改善方向は「他ホール横展開」または「新しいデータソースの追加」

## 例
バックテスト（60日窓, section_5x5）:
  diff/台: +570, hit率: 42.7%, 勝率: 78.3%, lift: 1.264x

