# セクション内台選びの改善にはDBにない情報が必要

## 背景
同一機種・同一セクション内でDB上で使える区別情報は:
- hist_metric → 使用中、rho=+0.04
- 台番号末尾 → 効果なし
- 角番位置 → Stage 1に吸収済み
- debut_phase → 信号なし

改善に必要だがDBにない情報:
- 当日のG数推移（常連の設定読み手がかり）
- BIG/REG比率（A系限定、設定推定の直接手がかり）

これらは「ホールに行ってから得られる情報」であり事前予測には使えない。

## アクション
- 事前予測としてのStage 2改善は現在のデータソースでは限界
- 運用上は「セクションまで事前に絞り、台選びは現地判断」が現実的
