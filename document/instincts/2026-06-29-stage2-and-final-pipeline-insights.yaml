# 角番の効果はStage 1のセクション選択に吸収されている

## 背景
全台分析では「角1はコーナー低設定、中間角5-9が最強」だった。
しかしTop5セクション内ではkakuban_edge rho=-0.038、delta_pp=+0.1ppでほぼ差なし。
原因: 角1が悪いセクションはStage 1で既に除外されている。
Top5セクションは設定がランダムに近く分布しているため、端台にも高設定が入ることがある。
角番の効果はsection_avg_histが既に反映しており、Stage 2での追加は情報の二重取り。

## アクション
- 角番情報はStage 2に追加しない
- 角番の効果はStage 1のセクション選択時点で既に活用されている

## 例
  全台: 角1=低設定傾向あり
  Top5セクション内: kakuban_edge rho=-0.038, delta_pp=+0.1pp → 差なし

