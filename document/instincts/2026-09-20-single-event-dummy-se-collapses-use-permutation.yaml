# 少数日のイベントダミーは、HC標準誤差が小さく出る。並べ替え検定で確かめる

## 背景
2026-09-20 に蒲田7のイベント日効果を、曜日・1/7の付く日・30日・ゾロ目を統制した回帰（HC標準誤差）で測った。
周年（7/7の1日）が t=+13.5、新台入替（7/6の1日）が t=-8.3 と出たが、1日だけのダミーは残差がほぼ0になり、標準誤差が構造的に小さくなる。
カマタに集合（4日）も勝率で t=+3.8 と出たが、同じ理由で楽観的だった。
同じ日を並べ替え検定（開催日と同じ曜日構成で、平常日から引き直し5000回）で測ると、次のように穏当な値になった。
蒲田7 カマタ: 差枚+127/日（p<0.001）、蒲田1 カマタ: +169/日（p=0.025）、蒲田1 新台入替（4日）: -209/日（p=0.028）。
n=1のイベントは並べ替えでも検定不能で、単日の観察に過ぎない。

## アクション
1. イベント日が数日のときは、回帰のt値ではなく、同曜日の平常日から引き直す並べ替え検定で p を出す（`eda/event_day_effect_kamata_shuugo.py`）。
2. n=1 のイベント（周年当日など）は効果量を出さず、単日の記録として扱う。
3. 探索で何本も回したときは、Bonferroniの基準（本数で割った p）を併記する。今回は12本前後で p<0.004 を越えたのは蒲田7のカマタのみ。
4. 基準日からは、イベント日・1/7の付く日・30日・ゾロ目を除く。

## 例
NG: 「周年ダミーが t=+13.5、周年は強い」（n=1）
OK: 「周年当日は+651と大きいが n=1 で検定不能。7/7は全台高設定の特殊日（既知）でもある。効果量にはしない」

