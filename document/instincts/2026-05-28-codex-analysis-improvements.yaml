# combined は等重みで混ぜない。信頼度に応じた動的ウェイトを使う

## 背景
CODEXの指摘：「2F_N/2F_Aがノイズになっていてcombinedを崩した。
3F_N/3F_A中心にすれば上位の崩れは小さかった」。
等重みcombinedでは信頼度の低いexpertが予測を歪める。

## アクション
- 各expertのtop1ミス率・直近精度を事前確認しウェイトを調整
- top1ミス率 > 20% のexpertはウェイト0.5倍以下に下げる
- イベント日など特定条件では3F_Nを重視するなど条件付きウェイトを使う
- 使用したウェイトを報告に明記する

## 例
2026-05-27（イベント日）の推奨ウェイト:
- 3F_A（top1ミス7.1%）: 0.40
- 3F_N（イベント日強）: 0.40
- 2F_N（top1ミス14.3%）: 0.15
- 2F_A（イベント日データなし）: 0.05

