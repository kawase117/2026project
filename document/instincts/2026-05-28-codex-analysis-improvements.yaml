# ゾロ目補正はプラスだけでは不十分。3条件を全て満たすとき推奨する

## 背景
CODEXの指摘：「9はcombined 2位だったが3F_Nで-800, 2F_Aで-1200で根拠として弱すぎた。
ゾロ目補正が7と9を押し上げすぎた」。補正値プラスでもサンプルや合意が薄ければ信頼できない。

## アクション
XX台推奨には以下3条件を全て確認する：
1. correction > +150（同末尾非ゾロ目との差が閾値以上）
2. 直近サンプル数 >= 10日（補正値の安定性）
3. 複数expertが同じ末尾に合意している（末尾レベルで合意）
1条件でも欠ける場合は「末尾推奨・XX台にはこだわらない」と明記する

## 例
2026-05-27 末尾9の検証:
- correction: -87 → 条件1 NG
- 3F_N=rank1 vs 3F_A=rank9 → 条件3 NG
→ combined 2位に上げる根拠なし。「末尾9は推奨しない」が正解

