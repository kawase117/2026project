# 蒲田七の27日は2026年から成績トレンドが急落している

## 背景
アノマリー検定（2026-05-28実施）で発見：
- 2025年の27日: +159,000〜+354,800円（一貫して高投資）
- 2026年の27日: -4,600〜+121,800円（急落）
t検定 p=0.004 で「過去27日の平均より有意に低い」と確認。
3F_Nの「27日無敗」仮説は2025年データで学習された可能性が高く、
2026年の戦略変化に未対応かもしれない。

## アクション
- 27日の予測には「2026年の27日限定」の直近精度を優先確認する
- 3F_Nの27日信頼度を相対的に引き下げて考える（無敗仮説は破綻済み）
- アノマリー検定は「全期間参照」と「直近3ヶ月参照」の両方を提示する

## 例
27日時系列 蒲田七:
2025年（7〜12月）: 平均 +245,583円
2026年（2〜4月）: 平均 +55,767円（p=0.004で有意差あり）
