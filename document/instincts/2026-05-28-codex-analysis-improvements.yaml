# 正しいセグメント分類：フロア x A/N型で4分割

## 背景
台番号の先頭桁（2xxx=2F / 3xxx=3F）だけで分類していたのは不正確。
正しい定義は ml/last_digit/tail_ltr_split_rule_wf.py の floor_atype4 モードにあり、
jug_flag/hana_flag/bt_flag を使ってA/N型を判定する。

## アクション
```python
df['floor_bucket'] = df['machine_number'].astype(str).str[0] + 'F'
df['is_a_type'] = ((df['jug_flag']==1) | (df['hana_flag']==1) | (df['bt_flag']==1)).astype(int)
df['atype_bucket'] = np.where(df['is_a_type']==1, 'A', 'N')
df['segment'] = df['floor_bucket'] + '_' + df['atype_bucket']
```
- A型 = ジャグラー(jug_flag) / ハナビ系(hana_flag) / BT系(bt_flag)
- N型 = それ以外（主にAT/ART機）
- machine_detailed_results に LEFT JOIN machine_master が必要

## 例
2026-05-27 蒲田七の内訳: 2F_N=315台, 3F_A=207台, 3F_N=157台, 2F_A=36台

