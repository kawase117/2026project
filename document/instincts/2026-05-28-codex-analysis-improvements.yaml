# 末尾選定とゾロ目台選定は別指標で必ず分離して評価する

## 背景
CODEXの指摘：3F_Nの末尾7はセグメント1位（+13,300円）だったが、
台3077自体は-2,900円（外れ）。強さは非ゾロ目側（+16,200円）に寄っていた。
末尾精度とゾロ目台精度を混在させると「末尾は当たり、XX台は外れ」が見えない。

## アクション
分析レポートで以下を常に分離して報告する：
1. tail hit@3: セグメント別末尾合計差枚によるTop3一致度
2. XX台実績: 当日のゾロ目台（XX番台）の差枚を個別記載
3. 「末尾当たり・XX台外れ」パターンを明示的に検出・フラグを立てる

## 例
3F_N 末尾7（2026-05-27）:
- tail hit: セグメント1位 +13,300 (一致)
- 3077台実績: -2,900 (外れ)
- 原因: 非ゾロ目の末尾7台が+16,200を稼いでいた

