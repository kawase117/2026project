# 【撤回】「末尾交替88-92%」もランダム期待値と区別不可能だった

## 背景
当初「同一DD末尾グループ内で前回最高末尾は88-92%別末尾に遷移する」と報告したが、
末尾は0-9の10種類存在するため、ランダムに選んでも「同じ末尾が連続する」確率は
理論上わずか10%（=「別末尾に遷移」90%）になる。

島内に限定した再検証結果：
4系グループ: AT島14%, ジャグラー島16%
7系グループ: AT島8%,  ジャグラー島10%
→ いずれもランダム期待値10%（誤差±4%）の範囲内で、有意な交替/持続シグナルなし。

「88-92%交替」という数字だけを見ると強いシグナルに思えるが、
カテゴリ数が多い変数では高い「交替率」は当然の帰結であり、
ランダム期待値との比較なしに「アンチパターン」と判定したのが誤りだった。

## アクション
このIDの内容（prev_best_digitへの負の重みづけ）は実装しないこと。
カテゴリ数の多い変数（末尾10種、セクション8-18種）で遷移率を報告する際は、
必ず「1/カテゴリ数」のランダム期待値と比較してから「アンチパターン」と判定する。
[[mitoya-island-digit-pattern-xday]] の島別末尾推奨（静的シグナル）は引き続き有効。

## 例
```python
# 「アンチパターン」と判定する前に必ず実施するチェック
n_categories = df['last_digit'].nunique()  # 例: 10
chance_same_rate = 1 / n_categories         # 例: 10%
observed_same_rate = ...                    # 観測値
# 観測値がchance±2SE の範囲内なら「ランダムと区別不可」と判定し、
# アンチパターンとして報告しない
```

