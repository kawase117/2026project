# 通路側角番は「日替わりの遷移パターン」ではなく「常時優位な静的ポジション」

## 背景
当初「角番は持続率38-48%でランダムに近い」と報告したが、これは
角番を「通路側/奥側」の二値（rank_from_aisle==1 or ==max）でしか見ておらず、
中間台（rank 2〜16等）を無視していたための誤った結論だった。

中間台を含む3カテゴリ（通路側角番／中間／奥側角番）でイベント日の平均差枚を比較すると：

AT島(501-640):
  通路側角番: +637円  中間: +285円  奥側角番: -204円
ジャグラー島(641-691):
  通路側角番: +617円  中間: +159円  奥側角番: +36円

通路側角番は中間の約2-4倍、奥側角番との差は800円以上。
これは日によって入れ替わる「アンチパターン」ではなく、構造的に毎回優位な
固定ポジション効果である（[[main-jug-corner-effect-strengthening]] と整合）。

「持続率38-48%」という低めの数値が出たのは、二値分類が中間台の存在を
無視しており、かつ marginal分布の偏り（通路側角番が単純に最も頻繁に
1位を取る）を「ランダムに近い遷移」と誤認したため。
marginal分布で補正したchance baselineと比較すると、観測persist率との差は
+1.7〜+8.7ptで全て統計誤差範囲内（n=50, ±7%）であり、動的な交替/持続
シグナルは存在しない。

## アクション
角番を「次は変わるかも」という動的特徴量として扱わない。
代わりに rank_from_aisle を**毎回固定的に評価する静的特徴量**として使う：

```python
# OK: 静的ポジション効果として常時加点
position_score = {
    "通路側角番": +1.0,   # rank_from_aisle == 1
    "中間":      +0.4,   # 1 < rank_from_aisle < section_max
    "奥側角番":  -0.3,   # rank_from_aisle == section_max
}
# NG: 「前回通路側が勝ったから今回は変わるはず」という遷移補正は不要
```

## 例
```
AT島での意思決定: 通路側角番の台を毎回優先する（前回の勝敗に関わらず）
  → 中間より平均+352円、奥側より平均+841円のアドバンテージ
ジャグラー島でも同様: 通路側角番を毎回優先（+458円 vs 中間, +581円 vs 奥側）
```

