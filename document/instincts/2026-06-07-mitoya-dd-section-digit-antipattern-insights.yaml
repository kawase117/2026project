# 全島混合でのトップ抽出は「単価の高い島が常勝する」アーティファクトを生む

## 背景
みとやのAT島(main_mix)はジャグラー島(main_jug)の2.35倍の単価を持つ
（[[main-mix-at-different-scale-from-jug]]）。
そのため「日ごとに全島混合で最高平均差枚のセクションを抽出する」と、
102イベント日中82日（80.4%）がAT島から選ばれ、ジャグラー島はわずか1日だった。

この状態で「セクションが日々入れ替わる（90%交替）」と報告すると、実態は
「AT島内の8区画間でのランダムな勝者交代」を見ているに過ぎず、
「ホールが意図的に配置を変えている」という誤った解釈を生む。

## アクション
島ごとに単価が大きく異なるホール（みとやに限らず）で「最高〇〇」を
抽出する分析を行う際は、必ず**島内に限定してから**集計する。
全島混合の集計は「どの島が今日勝ったか」を見る別目的でのみ使う。

## 例
```python
# NG: 全島混合トップ → 単価の高い島が固定的に勝つだけ
df.groupby('date')['diff'].idxmax()

# OK: 島ごとに分離してから島内トップを抽出
for island_name, (lo, hi) in islands.items():
    df[(df.machine_number>=lo)&(df.machine_number<=hi)].groupby('date')['diff'].idxmax()
```
