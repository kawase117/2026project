# 【撤回】「セクション交替90%」は全島混合トップ抽出の方法論的アーティファクトだった

## 背景
当初、102日のイベント日データで「同一DD末尾グループ内で前回最高セクションは90%別セクションに遷移する」と報告したが、これは誤りと判明した。

原因：
1. 「全島混合の最高セクション」を抽出すると、単価が2.35倍高いAT島(main_mix)が
   80.4%（82/102日）を占め、ジャグラー島はわずか1日。つまり「セクション交替」の
   実体はほぼ「AT島内の8区画間でのランダムな勝者交代」だった。
2. 島内に限定して再検証すると、観測された遷移率（AT島14-20%, ジャグラー島36%）は
   各島のセクション数から導かれるランダム期待値（8区画→12.5%, 3区画→33.3%）と
   統計的に区別不可能（誤差±9%以内）だった。

## アクション
このIDの内容（90%セクション交替・prev_best_sectionへの負の重みづけ）は
ML特徴量・運用ルールに**実装しないこと**。
代わりに [[mitoya-corner-static-positional-effect]] の静的角番ルールを使う。

## 例
正しい検証手順（今後の教訓）：
```python
# NG: 全島混合でその日のトップを抽出 → 単価差で島が固定的に勝つだけ
best = df.groupby('date')['diff'].idxmax()

# OK: 島内に限定し、かつカテゴリ数から導いたランダム期待値と比較する
best_within_island = df[df.island=='AT島'].groupby('date')['diff'].idxmax()
chance_baseline = 1 / df[df.island=='AT島']['section'].nunique()
```

