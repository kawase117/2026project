# 蒲田1 A系 台選択 5ステップフロー（全軸統合）

## 背景
2026-06-18 の総合戦略策定で確定した統合フロー。

## アクション（5ステップ）

Step 1: 特別日の確認（最優先）
  ゾロ目mm=dd（1/1・7/7・5/5）→ 全条件より優先。median=+100〜+750。
  該当すれば Step 2-4 の制約をほぼ無視して参入判断してよい。

Step 2: DD評価（通常日）
  強い: DD=30, 1, 7, 9（median=0〜-100 で構造的シグナル、q<0.01）
  弱い: DD=19, 20, 29（有意に平均以下、mean もマイナス）

Step 3: 島タイプ × DD のベスト組み合わせを特定
  DD=7  → horizontal_medium から探す（median=+200）
  DD=30 → diagonal_large から探す（median=+100）
  DD=1  → diagonal_medium から探す（median=+100）

Step 4: カクバン フィルタ（必須）
  全島: kakuban=1 を除外
  diagonal_medium: kakuban=5 を積極選択（唯一の正方向シグナル、q=0.0018）
  horizontal: kakuban=6 を優先

Step 5: X角番 フィルタ（軽微）
  x_kk=8 のみ除外（A系は X角番の影響が小さい）

