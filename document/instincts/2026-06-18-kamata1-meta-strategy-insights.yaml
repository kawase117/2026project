# 蒲田1 N系 台選択フロー（DD軸なし・カクバン・X角番主軸）

## 背景
2026-06-18 の総合戦略策定で確定した統合フロー。N系は DD軸が完全に無効。

## アクション（順序付き）

Step 1: セクション × イベント日の確認
  イベント日（{1,7,11,17,21,27,30}・月末）であれば:
    section 2177-2186（横向き左エリア、premium=+375）を最優先
    section 2099-2109（中型斜め、premium=+353）を次点

Step 2: 島タイプ別カクバン適用
  diagonal_large_N: kakuban=1 AND 2 を除外（各 median=-600, -471）
  diagonal_medium_N: kakuban=1 を除外（median=-464）
  horizontal_medium_N: kakuban=1 AND 7 を除外（U字構造）、kakuban=6 優先
  diagonal_small / horizontal_large: カクバンフィルタ不要

Step 3: X角番 フィルタ（N系は重要）
  x_kk=1 AND x_kk=2 を除外（median=-445〜-476、n=16000超）
  x_kk=6 も避ける（median=-340）
  カクバンと独立情報 → 重ねて適用する

Step 4: DD の消極的活用（回避のみ）
  diagonal_medium × DD=3 のみ避ける（median=-800）
  その他の DD は N系では台選択の根拠にしない（全DD q>0.05）

