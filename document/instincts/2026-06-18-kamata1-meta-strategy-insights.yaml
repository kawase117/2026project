# 蒲田1 島タイプ別「最強DD」マッピング — DD によって狙うべき島タイプが変わる

## 背景
kamata1_orisize_dd_tail_eda（2026-06-18実施）。orientation×size 別 BH補正MWU DD分析。

島タイプ × 最強DD（A系・median が正になる組み合わせ）
  horizontal_medium × DD=7 : median=+200, q=0.003 ← 全組み合わせ中最強
  diagonal_large    × DD=30: median=+100, q~0
  diagonal_medium   × DD=1 : median=+100, q~0
  diagonal_medium   × DD=30: median=+100, q=0.044

避けるべき組み合わせ
  diagonal_medium × A系 × DD=11: median=-300（全体A系では非有意だが中型斜めでは有意弱）
  diagonal_medium × N系 × DD=3 : median=-800（全分析中最悪）

## アクション
DD=7  → 横向き中型（10-11台）のA系を最優先に探す（median=+200）
DD=30 → 大型斜め（15台以上）のA系を優先（median=+100）
DD=1  → 中型斜め（11-13台）のA系を優先（median=+100、大型斜めでは DD=1 は非有意）
他のDD → カクバン・セクション重視で島タイプを問わず探す

