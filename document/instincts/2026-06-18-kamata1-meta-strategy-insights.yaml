# 蒲田1 は「A系特化ホール」— N系は DD軸が完全に無効で蒲田7 と根本的に異なる

## 背景
2026-06-18 の全軸分析（DD軸・tail軸・カクバン・X角番・orientation×size）を通じて確定。

蒲田1 の軸別有効性（A系 vs N系）
  DD軸:
    A系: MWU p=0.0000（高有意）、有意DD=30,1,7,9
    N系: MWU p=0.136（完全非有意）、全31日 q>0.05
  tail軸:
    A系: KW p=0.21（無効）
    N系: KW p=0.18（無効）
  カクバン: 両系統で有効（全島タイプ共通）
  X角番:
    A系: x_kk=8 のみ（軽微）
    N系: x_kk=1,2,6 回避（重要）
  イベント日×セクション: 両系統で有効

## アクション
蒲田1 N系の台選択に DD 値を使わない（全DD q>0.05）。
蒲田1 A系は DD が主軸。ゾロ目 mm=dd（1/1・7/7・5/5）は全優先。
蒲田7 で有効だった軸がそのまま蒲田1 に転移するとは限らない—必ず個別検証する。

