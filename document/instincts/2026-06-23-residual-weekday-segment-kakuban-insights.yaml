# 分析の粒度（A/N vs 6セグメント）で結論が逆転する

## 背景
2026-06-17: A/N 2分割の残差分析 → 「曜日×角番はセクション効果の混入で消える」
2026-06-23: 6セグメント分解の残差分析 → 「3F_L_Aの曜日×角番交互作用は有意に残る(q=1e-13)」
A/N分割では3F_L_Aの強いシグナルが他のA機サブセグメントのノイズで希釈された。

## アクション
- 角番・曜日・イベント日の分析は必ず6セグメント(2F_L_N等)で実施する
- A/N 2分割は初期スクリーニングとしてのみ使い、結論はフルセグメントで確認
- 過去の「非有意」結論もフルセグメントで再検証する価値がある

## 例
木曜A機全体: KW=87.1（有意だが何が効いているか不明）
木曜3F_L_A: KW q=1e-13（極めて有意、中間帯K5-9が+294）
木曜2F_L_A: KW q=0.04（ぎりぎり有意、弱いシグナル）
→ 木曜の角番効果は3F_L_Aが支配的

