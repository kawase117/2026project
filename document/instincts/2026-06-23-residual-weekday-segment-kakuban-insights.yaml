# 6/16火曜N機角6は単日有意だが全火曜では非有意

## 背景
6/16(火曜)のN機角6台(60台)の残差平均=+1441、t=2.58、q=0.025で有意。
しかし曜日固有効果分析では、火曜×N機×角6の系統的効果は検出されず。
6/16は「たまたま角6が当たった火曜」であり、「火曜は常に角6が強い」ではない。
Twitter示唆の「角◯」は毎週異なる角番を指定している可能性が高い。

## アクション
- 火曜N機の角番を固定ルール（常に角6）にするのは誤り
- N機の角番効果は曜日非依存の恒常効果（角6が+108残差）をc1に反映するだけで十分
- 曜日別ブーストはA機(3F_L_A, 3F_R_A)に限定する

## 例
6/16: N機角6残差+1441（この日だけ異常に強い）
全火曜: N機角6の曜日固有効果 → 非有意（系統的パターンなし）

