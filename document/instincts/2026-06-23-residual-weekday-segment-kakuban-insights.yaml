# 土曜×3台連番ATは最も強い新ファクター候補（eta_sq=0.31）

## 背景
土曜の3連番AT分析:
- F=21.0, eta_sq=0.31（大効果量）, Bonferroni p=0.001
- consecutive_without7: diff=+1301 vs non_consecutive=+682（差+473, Cohen's d=1.3）
- 土曜のconsecutive_rate=18%（他曜日の2-3倍、top_triplet=4-5-6）
残差法では土曜の3F_R_Aが弱体化（K10-14: -148, K3-4: -141）。
土曜は3台並びに設定が集中し、角番の通常構造が崩れる。

## アクション
新ファクターc7として「隣接台スコア」を土曜専用に実装:
- score(台X) = 通常composite + alpha * (score(台X-1) + score(台X+1)) / 2
- 土曜のみalpha > 0、他曜日はalpha = 0
- consecutive_with7（末尾7含む）はサンプル不足、まずは全連番で実装

## 例
土曜: 台2105のscore=300、隣接台2104=280、2106=310
→ 隣接平均=295、c7加算後=300 + 0.3*295 = 388.5

