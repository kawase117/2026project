# 残差法でも3F_L_Aの曜日×角番交互作用は有意に残る

## 背景
2026-06-17の残差分析ではA/N 2分割で「曜日×角番はセクション効果の混入」と結論。
しかし6セグメント(2F_L_N等)分解で再検証した結果、残差法でも有意なパターンが残った。
KW検定(Bonferroni補正後):
- 木×3F_L_A: q=1.0e-13（最強）
- 火×3F_L_A: q=2.6e-12
- 金×3F_R_A: q=1.7e-08
- 金×3F_L_A: q=1.1e-06
A/N 2分割では混入で消えたパターンが、6セグメント分解では分離できた。

## アクション
- 2026-06-17のInstinct「イベント日×角番はセクション効果の混入」は6セグメント分解では部分的に覆る
- 3F A機（ジャグラー系）の角番効果には曜日依存性がある → c1に曜日×セグメント別ブースト追加の根拠
- 2F N機（AT機）の曜日×角番は依然として非有意 → ブースト不要
- 分析粒度の教訓: A/Nの2分割と6セグメント分解で結論が変わりうる

## 例
eda/kamata7_dow_segment_kakuban_residual_analysis.py で検証済み。
出力: eda/reports/kamata7_dow_segment_kakuban_residual/

