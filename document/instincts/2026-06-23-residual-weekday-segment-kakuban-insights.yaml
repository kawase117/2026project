# 3F_L_Aの中間帯(K5-9)は木/火曜にブースト、日曜にディスカウント

## 背景
残差法による曜日固有効果(恒常効果を引いた残り)の検定結果:
- 3F_L_A K5-9 木曜: +116 (q=7.9e-05)
- 3F_L_A K5-9 火曜: +104 (q=4.6e-04)
- 3F_L_A K5-9 金曜: +74 (q=0.034)
- 3F_L_A K5-9 日曜: -108 (q=2.7e-05)
恒常効果は+179なので、木曜合計+295、日曜合計+71。
3F_R_Aも土曜に特異パターン:
- 3F_R_A K10-14 土曜: -148 (q=5.3e-08)
- 3F_R_A K3-4 土曜: -141 (q=0.001)

## アクション
c1のセグメント別ウェイトに曜日修正を加える:
- 3F_L_A: 木/火曜は中間帯スコアを+20%程度ブースト
- 3F_L_A: 日曜は中間帯スコアを-15%程度ディスカウント
- 3F_R_A: 土曜はK3-4, K10-14のスコアを下げる
- 2F系・N機系には曜日ブーストを適用しない（非有意のため）

## 例
木曜3F_L_A角7: 恒常残差+179 + 曜日固有+116 = 合計+295（強い推奨）
日曜3F_L_A角7: 恒常残差+179 + 曜日固有-108 = 合計+71（推奨度下がる）

