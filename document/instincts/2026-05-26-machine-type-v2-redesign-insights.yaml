# セグメント内機種数に応じた target 選択

## 背景

セグメントサイズが小さいと、上位K個の threshold が自動的に高くなり学習が簡単になる反面、
予測する価値が低下する（ほぼ全て推薦 = 意味がない）。

蒲田七の場合：
- 2F_A: 15機種 → is_top5 base_rate = 0.543 (random baseline 0.998) → is_top3 推奨
- 2F_N: 33機種 → is_top3 base_rate = 0.092 → is_top5 が学習に向く
- 3F_A: 15機種 → is_top5 base_rate = 0.916 → is_top3 推奨
- 3F_N: 15機種 → is_top3 base_rate = 0.195 → is_top3/top5 両立可

## アクション

セグメント内機種数 N に応じて：
- N < 20: is_top3 のみ（top5 は base_rate > 0.8 で無意味）
- 20 ≤ N < 40: is_top3 主体、is_top5 補助
- N ≥ 40: is_top5 も現実的

base_rate の目安：
- 0.3〜0.6 が最適学習帯域（AUC が 0.6+ 達成しやすい）
- < 0.1 は厳しすぎ、> 0.8 は無意味

## 例

```
2F_A (15機種) is_top3 base_rate=0.326 → AUC 0.604 ✓
2F_A (15機種) is_top5 base_rate=0.543 → AUC 0.533 △ (trivial)
2F_N (33機種) is_top3 base_rate=0.092 → AUC 0.553 △ (sparse)
2F_N (33機種) is_top5 base_rate=0.154 → AUC 0.650 ✓
```

