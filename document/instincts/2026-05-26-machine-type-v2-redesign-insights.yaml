# 2F/3F × A型/非A型 セグメント分割で AUC 向上

## 背景

エンティティレベルの全体ランク予測が失敗した理由は、114機種が1つの競争空間にある非効率性。
前回の末尾ML では floor × atype の4セグメント構造が有効だったので、同じ軸で機種名レベルを分割。

実装結果：
- 全体 rank1 AUC 0.56 → セグメント内 is_top3 AUC 0.6623
- セグメント内 is_top5 AUC 0.6941
- lift@1 = 2.4x（Hit@1 40% vs random 16.6%）

## アクション

機種名予測を設計する際は、必ず以下を検討：
1. machine_master から floor（2F/3F）と atype（A型 vs 非A型）を取得
2. 4セグメントに事前分割：2F_A, 2F_N, 3F_A, 3F_N
3. セグメント内の rank を再計算（グローバルランクではなく）
4. 各セグメントに独立モデルを訓練

## 例

```python
# セグメント定義（machine_master から派生）
segments = {
    '2F_A': (floor=='2F') & (machine_type=='A型'),
    '2F_N': (floor=='2F') & (machine_type!='A型'),
    '3F_A': (floor=='3F') & (machine_type=='A型'),
    '3F_N': (floor=='3F') & (machine_type!='A型'),
}

# セグメント内で rank を再計算
for seg_name, mask in segments.items():
    df_seg = df[mask].copy()
    df_seg['rank_pct_in_seg'] = df_seg.groupby('date')['rank_pct'].rank(pct=True)
    df_seg['is_top3_in_seg'] = df_seg['rank_pct_in_seg'] >= 0.67
```

