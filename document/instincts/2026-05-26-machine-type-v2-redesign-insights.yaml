# Walk-Forward 評価：step_days は十分にとれ

## 背景

eval_days=30, step_days=7 の設定で Layer 1 を評価した結果、n_eval_days = 5（スライドが5回）となった。
この状態での hit@1=0.4（5日中2日）の lift=2.4x は、統計的に有意かどうか不明瞭。
95% CI が非常に広い（最大 0.0～1.0）可能性が高い。

## アクション

walk-forward 評価時：
1. **step_days=1 を使用して最低 30～90 日の評価点を確保**
2. **各日の hit@K を個別記録し、平均と標準誤差を報告**
3. **lift の 95% CI を計算してから「改善した」と判定**

```python
# 評価点が少なすぎる状況
step_days=7, eval_days=30 → n_steps = 4〜5 → 信頼性 ★☆☆

# 改善版
step_days=1, eval_days=90 → n_steps = 30〜60 → 信頼性 ★★★
```

## 例

```
悪い例:
  hit@1=0.4 (5 days, step=7) → "lift=2.4x、改善した！" ← 危険

良い例:
  hit@1=0.35 ± 0.12 (45 days, step=1) → "lift=2.1x, p=0.04" ← 統計的信頼性あり
```

