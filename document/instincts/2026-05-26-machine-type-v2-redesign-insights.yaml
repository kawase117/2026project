# Entity-Level Rank1 は構造的に学習不可

## 背景

蒲田七で machine_name（機種名）レベルの is_rank_1 予測を試みた結果：
- 全特徴量 MI < 0.01（ほぼノイズ）
- モデルが machine_type_encoded（AT系/A型/BT の3値）のみを学習
- Hit@K = 0.0（ランダム以下）
- 機種間の長期平均ランクは有意に異なる（Kruskal p≈10^-79）が、日次予測では無意味
- 評価期間で entity 内の特徴量がドリフト（prior_top1_rate KS p=10^-43）

## アクション

全体 rank1 ではなく、以下への問題再定義を検討：
1. **セグメント内 top-K 予測** — 2F/3F × A型/非A型 で4分割し、各セグメント内で is_top3/top5
2. **日次ホール勝率予測** — 「今日は全台設定か」を先に予測（Layer 0）
3. **回帰（rank_pct分布予測）** — 順位の確率分布を直接予測

## 例

```
is_rank_1（全体）の問題：base_rate = 1.4%、114機種の競争 → AUC 0.56 で打ち止め
is_top3（セグメント内、2F_A）：base_rate = 32.6%、15機種の競争 → AUC 0.60 達成
```

