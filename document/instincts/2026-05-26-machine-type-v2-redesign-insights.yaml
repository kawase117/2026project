# Layer 0: win_rate 閾値の事前キャリブレーション

## 背景

「今日は全台設定か（ホール全体の勝率が高いか）」を予測する Layer 0 を実装したが、
win_rate ≥ 80% という固定閾値では評価期間（2026-04-24 ~ 2026-05-23）で正例がゼロ。
モデルが学習できず、全日で proba = 0.0 となった。

蒲田七の実際の win_rate 分布が不明なため、訓練データに十分な正例が含まれる閾値を動的に選択する必要。

## アクション

Layer 0 実装時に必ず実施：

1. **win_rate 分布をサンプリング調査**
```sql
SELECT
  day_of_month, AVG(win_rate) as mean_wr, COUNT(*) as n,
  SUM(CASE WHEN win_rate >= 80 THEN 1 ELSE 0 END) as days_ge80,
  SUM(CASE WHEN win_rate >= 70 THEN 1 ELSE 0 END) as days_ge70,
  SUM(CASE WHEN win_rate >= 60 THEN 1 ELSE 0 END) as days_ge60
FROM daily_hall_summary
GROUP BY day_of_month
```

2. **「正例（good day）が全訓練日の 5～20%」となる閾値を選択**
   - 少なすぎると（< 5%）モデルが学習困難
   - 多すぎると（> 30%）予測の精度が低下

3. **選定後、step_days=1 で再評価**

## 例

```
蒲田七の場合（推測値）:
- win_rate >= 60: 全日の 30% → 多すぎ
- win_rate >= 70: 全日の 10% → 適正
- win_rate >= 80: 全日の 2% → 少なすぎ → 正例ゼロ
推奨: win_rate >= 70 で再実装
```

