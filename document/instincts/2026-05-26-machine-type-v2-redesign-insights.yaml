# 時系列特徴量のドリフト検知は必須

## 背景

EDA で特徴量ドリフトを検測した結果：
- **prior_top1_rate**: KS p=10^-43（極めて有意）× PSI=0.0193 → 過去の勝利実績が最近無効化
- **roll7_rank_pct**: recent 期間で permutation importance=-0.024（有害）
- **lag7_rank_pct**: recent 期間で permutation importance=-0.052（深刻に有害）

これらは訓練期間では有用だった特徴量だが、評価期間で distribution shift が発生。
単純に時間軸を伸ばして訓練すると、古い・今も有効な信号が薄められる。

## アクション

時系列特徴量を使う際：

1. **PSI / KS 検定で学習期間と評価期間のドリフトを定量化**
```python
from scipy.stats import ks_2samp
train_period = df[df['date'] < cutoff_date]
eval_period = df[df['date'] >= cutoff_date]
ks_stat, p_value = ks_2samp(
    train_period['prior_top1_rate'].dropna(),
    eval_period['prior_top1_rate'].dropna()
)
if p_value < 0.05:
    print(f"Feature {col} has significant drift (KS p={p_value})")
```

2. **ドリフト検出時は rolling window で最近データのみを使用**
```python
# ドリフト検出の場合
df['prior_top1_rate_r90'] = df.groupby('entity')['is_rank_1'].transform(
    lambda x: x.rolling(90, min_periods=10).mean().shift(1)
)
# グローバル平均を使わない
```

3. **Permutation Importance で期間別に特徴量の有効性を追跡**
   - 有効性が劣化した特徴量は削除するか rolling window 化

## 例

```
事前（訓練期間）:
  prior_top1_rate permutation importance: +0.052 ✓

事後（評価期間）:
  prior_top1_rate permutation importance: +0.030 △（劣化）
  lag7_rank_pct permutation importance: -0.052 ✗（有害）

対策:
  prior_top1_rate を rolling 90 日版に置き換え
  lag7_rank_pct を特徴量群から削除
```

