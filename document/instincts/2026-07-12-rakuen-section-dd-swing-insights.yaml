# 楽園3117-3120: DD選択型（符号一致率71%）、イベント日と一部一致

## 背景
3117-3120は符号一致率71%（31DD中約9日だけ逆方向）で、全期間平均のHot/Cold判定では見えない「日によって当たり外れがある」区画。狙い目上位5DDのうち2件（DD11, DD30）が既存の確定イベント日定義（DD∈{10,11,22,30}+強ゾロ目）と一致し、独立検証として整合する。

## アクション
- 狙い目: DD29(+1560.8円,hit38.5%), DD11(+1212.2円,hit55.2%,イベント日), DD30(+745.7円,hit50.0%,イベント日)
- 避けるべき: DD25(-912.4円), DD31(-277.4円), DD14(-263.9円)
- 他のType B候補（DD swing上位）: 新館2F 2000-2003・2004-2007、本館3F 3107-3112、新館1F 1057-1059、本館2F 2111-2113・2171-2172。各区画の狙い目/避けるべきDDは`eda/results/rakuen_section_dd_swing_analysis/type_b_playbook.csv`参照
- 分類手順: (1)セクション内でDD群のKW検定+ε² (2)DD別avg_diffの符号一致率 (3)DDスイング指数(最大-最小) の3点で恒常型/選択型を切り分ける。単一指標(swing幅だけ等)で判断しない

## 例
`document/rakuen_theory.md` §8.1のType A/B分類基準（dominant_sign_rate, dd_swing_index, residual_std, KW検定）は他ホールのセクション×DD分析にも移植可能な汎用フレームワーク。

