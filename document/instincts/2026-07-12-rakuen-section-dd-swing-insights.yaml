# 楽園1106-1115・1130-1134: 31DD全てマイナス、日を選ぶ余地なし常時回避

## 背景
`eda/rakuen_section_dd_swing_analysis.py`でセクション×DD(1-31)のavg_diffを分解した結果、この2区画は31DD全てでマイナス（符号一致率100%）という、Type A(恒常型)の中でも極端な例だった。「強い日だけ狙う」戦略の前提として、まず「日で変わらず常に弱い区画」を除外する必要がある。

## アクション
- 1106-1115: 最良DD=30でも-119.9円、最悪DD=1で-951.4円
- 1130-1134: 最良DD=7でも-267.6円、最悪DD=8で-1763.7円
- どちらも「最良の日」ですらマイナス。DDタイミングでは救えない
- この2区画は日付・イベント日に関わらず常時回避対象とする

## 例
台選びフロー: 「今日は何のDDか」を見る前に、まず「そもそも常時マイナスの区画（1106-1115, 1130-1134等）に入っていないか」を確認する。

