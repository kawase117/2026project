# 楽園3113-3116: 符号一致率51.6%(ほぼランダム)でもノイズと即断せず、プラス・マイナス両方向をセオリーとして記録する

## 背景
3113-3116は全43セクション中最大のDDスイング幅(+2885)を持つが、符号一致率51.6%・KW検定p=0.816と統計的パターンは検出できない。ユーザー指摘（2026-07-12）: 「Swing幅だけで見るのは危険ですが、定期的に高設定を投入しているという見方もできます」——統計的確実性を求めすぎない姿勢の具体適用。

## アクション
- 符号がランダムに見えること自体を「断続的な高設定投入」の可能性として肯定的に解釈する選択肢を持つ（固定カレンダー化はできないが、動きが大きいこと自体がシグナル）
- プラス方向: DD19(+1957.1円,hit54.5%), DD12(+1483.4円,hit57.1%), DD4(+491.2円,hit61.5%)
- マイナス方向: DD18(-928.2円,hit25.0%), DD22(-765.7円,hit25.7%——イベント日なのにマイナス、他区画の「イベント日底上げ」原則の例外), DD6(-664.3円)
- 運用: 固定DDルールではなく、当日のライブ回転数・機械割を見る短期モニタリング対象として`status: watching`のまま記録する
- 「符号一致率もKW検定も非有意→無視」という単純な二分判定をせず、両極端な値が両方向に存在すること自体を記録に残す

## 例
`document/rakuen_theory.md` §8.4は「効果なし」ではなく「プラス方向のセオリー」「マイナス方向のセオリー」を両方明記する形式を採用。単一の結論に丸めず両論併記することで、将来データが増えた際にどちらの解釈が支持されるか再評価できる。
