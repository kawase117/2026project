# 店は全台を少し上げるのではなく、一部を高設定にする。平均で見ると消える

## Core claim
条件日に動くのは**平均ではなく分布**である。ボーナス確率から台日ごとの設定事後分布を
出すと、平均設定はほとんど動かないのに**高設定の台数が1.25〜1.67倍**になる。

| ホール | 条件 | 平均設定の差 | 高設定率 | 差 | 倍率 |
|---|---|---|---|---|---|
| ベルシティ雑色 | 強ゾロ目 | +0.19 | 22.1% | +8.9pp | **1.67倍** |
| 蒲田7 | 強ゾロ目 | **+0.24** | **26.9%** | +9.0pp | **1.50倍** |
| 蒲田1 | 強ゾロ目 | +0.12 | 20.0% | +5.0pp | 1.33倍 |
| 楽園蒲田 | 強ゾロ目 | +0.06 | 19.5% | +3.9pp | 1.25倍 |

差枚も同じ形で動く（蒲田7・強ゾロ目、ノーマル機）。

| | 条件日 | 他の日 | 差 |
|---|---|---|---|
| 平均 | +116 | +60 | +56 |
| 中央値 | -128 | -197 | +69 |
| ばらつき | 1,565 | 1,385 | +13% |
| **上位10%** | **+2,294** | +1,973 | **+321** |
| 上位25% | +974 | +822 | +152 |

**上位10%は平均の6倍動く。** 平均だけを見ると効果を1/6に見誤る。

## Interpretation
- ユーザーの見立て（2026-09-11）「2台あって一台高設定でもう一方の低設定が足を引っ張る」
  が正しかった。**希釈である。**
- 実戦上の含意が大きい。**当たり外れが混在する日なので、設定判別とやめどきが効く。**
  高設定率が1.5倍になる日に、ボーナス確率で判別できる機種（ノーマル/BT/A+AT、設置の36%）を
  打ち、違えば降りる。`backtest/bonus_specs.py judge` が2,000G以降で使える
- 「強ゾロ目の蒲田7でノーマルを打つと平均 +350枚」は**適当に座って閉店まで打った場合**の
  数字である。高設定はおよそ4台に1台。判別して降りればこれより良く、
  外して打ち切ればこれより悪い
- [[project-kishu-ichi-decoy]]（機種内1台だけ高設定の撒き餌）と同じ構造を、
  イベント日の側から見たもの。単位を1つ下げて分布で見る、という点で共通

## 限界
- 設定の事後分布は一撃マスターのスペックに依存する。スペックが実測とずれている機種では
  壊れる（戦国乙女5 は全台が設定1と判定される、と HYPOTHESIS_LEDGER に記録あり）
- 蒲田1の A+AT は通常日でも高設定率 51% と出る。6設定中2つが「高」なので
  無情報なら33%であり、51%は事後分布が効いていないことを示す。**カテゴリによっては
  この指標自体が使えない**。差分（条件日 − 通常日）で見るぶんには影響が小さい
- AT機（設置の64%）は対象外。ホールのメインが測れていない穴は残る

## Action
- 条件日の効き幅を伝えるときは、**平均と上位帯の両方**を出す。平均だけだと過小評価になる
- 高設定率は `backtest/condition_drilldown.py` が「通常日→条件日」の形で出す
- 高設定率が上がる日は、**設定判別が最も価値を持つ日**として扱う
- 平均差枚が動かないことを「効果がない」と読まない。分布を見てから言う
