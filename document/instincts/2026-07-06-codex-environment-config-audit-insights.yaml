# `continue-on-error: true` にコメント付き解除条件がある場合は「弱いゲート」と即断しない

## 背景
`.github/workflows/tests.yml`のpytestジョブに`continue-on-error: true`があり、外部レビュー(Codex)はこれを「品質ゲートとして弱い」とP2課題に分類した。しかし実際にはワークフロー内に「ローカルDB依存のテストが安定するまで非ブロッキング。全テストがCIでグリーンになったら`continue-on-error`を削除すること」という明示コメントがあり、意図的な暫定措置として既に追跡されていた。実際にローカルで`pytest test/`をフル実行したところ、`test/heatmap/test_floor_coordinates.py`の2件のassertion失敗と、Windows特有の`.pytest-tmp`クリーンアップが`hall7.db`をロックすることによる42件のsetup/runtimeエラーが確認され、「まだ緑ではない」ため解除は時期尚早と判断した。

## アクション
CI設定の`continue-on-error`等の緩和設定を指摘する際は、まずコメント・commit historyに解除条件が明記されていないか確認する。条件が明記されていれば「放置」ではなく「意図的な暫定運用」として扱い、対応の要否は該当条件(ローカルでの全テストパス)が満たされているかどうかで判断する。満たされていなければ、それを解除する提案自体が誤り。

## 例
`python -m pytest test/ -q`をローカルフル実行し、`test/heatmap/test_floor_coordinates.py`のassertion失敗2件とWindows上のDBファイルロックによるteardownエラー42件を確認。これが解消するまで`continue-on-error: true`は維持が正しい判断。
