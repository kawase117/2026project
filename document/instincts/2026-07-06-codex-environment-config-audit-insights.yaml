# Codex CLIのprofileは独立ファイル方式(`[profiles.name]`テーブルではない)

## 背景
Codex環境監査で `~/.codex/audit-readonly.config.toml` のようなstandaloneファイルを`--profile audit-readonly`で読ませる設計にした際、レビュー側は「Codexのprofileは`config.toml`内の`[profiles.<name>]`テーブル方式のはず」と誤って指摘した。公式ドキュメント(developers.openai.com/codex/config-basic, config-advanced)で確認した結果、実際は`~/.codex/<profile-name>.config.toml`という独立ファイルを`--profile`で直接読む仕組みが正しい。CLIバイナリがローカルPATHに無く実行テストでの検証はできなかったため、設計の仕様整合性はドキュメントでの確認どまり。

## アクション
Codexのprofile設定を扱うときは、`[profiles.name]`テーブル方式を仮定せず、`~/.codex/<profile-name>.config.toml`という独立ファイルとして作成する。ファイルは既存のbase `~/.codex/config.toml`の値の上に重なる(overlay)ため、profile内で明示しなかったキー(例: `[windows] sandbox`、`trust_level`)はbase側の値がそのまま残る点に注意。read-only監査などbaseと逆方向の値にしたい設定は、profileファイル自身に明示的に書く必要がある。

## 例
`codex --profile audit-readonly` は `model_reasoning_effort = "high"` / `[windows] sandbox = "elevated"` のbase configに対し、`~/.codex/audit-readonly.config.toml`に書かれた `model_reasoning_effort = "medium"`, `sandbox_mode = "read-only"`, `approval_policy = "untrusted"` だけを上書きする。`[windows] sandbox`は明示していないため`elevated`のままになる。

