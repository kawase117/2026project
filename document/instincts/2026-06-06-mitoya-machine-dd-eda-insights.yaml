title: みとやのDD強弱は3グループ構造 — 4系・7系・月末系

## 背景
34件の信頼パターン（lift≥500, n_dates≥8）を機種数と平均lift でDD別に集計した結果
3つのDDグループが浮かび上がった。
- 4系 (DD=4,14,24): 最多7機種、平均lift=+1009、最大lift=+1703（最強）
- 7系 (DD=7,17,27): 3〜5機種、平均lift=+600〜+780
- 月末系 (DD=28,30): 2〜3機種、平均lift=+538〜+820
DD=4 は特に突出しており「7機種にまたがって全て lift≥+500」を達成する唯一のDD。

## アクション
みとやでの運用優先度: DD=4 > DD=4/14/24（4系）> DD=7/17/27（7系）> DD=28/30
「今日は何の日か」の判定は 4系 と 7系 を最初にチェックする。
セクション横断で複数機種が同時に強くなるDDを最優先とする。

## 例
```
DD別 信頼パターン集計（2026-06-06時点）:
  DD=4:  7機種 平均lift=+1009  max=+1703 → 最優先日
  DD=14: 1機種 平均lift=+1012              → 4系の延長
  DD=24: 4機種 平均lift=+897              → 4系（機種数多い）
  DD=27: 5機種 平均lift=+779              → 7系（機種数多い）
  DD=30: 3機種 平均lift=+820              → 月末系
  DD=17: 3機種 平均lift=+762              → 7系
  DD=7:  3機種 平均lift=+600              → 7系

「4系」「7系」「月末系」の3グループで投資リズムを把握する
```

