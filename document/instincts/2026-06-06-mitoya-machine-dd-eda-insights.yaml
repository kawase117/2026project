title: みとやの「セクション×DD効果」は「機種×DD効果」の代理変数にすぎない

## 背景
section_by_dd.csv で 574-590 が DD=4 に平均 +1200 超と突出して強かったが、
同じセクション内の機種別DD分析を実施したところ以下の事実が判明した。
- 強い機種（モンキーターン）: DD=4 が 31DD中1位（avg +1720）
- 弱い機種（別機種）: DD=4 が 18DD中18位（avg -2584）
同じ物理セクションに置かれているのに、DD=4への高設定投入が機種を選んで行われている。
これはセクション全体への均一投資ではなく「特定機種 × 特定DD」への選択的投資を示す。
DD=17/501-522 の強さもマギアレコードという特定機種の配置（2024-09以降）で説明できた。

## アクション
セクション×DDルールを使う場合は「そのセクションの主力機種が変わると無効化するリスク」を認識する。
より正確な予測軸は「機種名 × DD」であり、機種の配置追跡と組み合わせて運用する。
機種配置が変わった時点でセクション×DDルールは再検証必須。

## 例
```
574-590 の DD=4 機種別分解:
  機種X (モンキーターン):    avg +1720  31DD中 1位  ← 高設定投入対象
  機種Y (モンスターハンター): avg +966   31DD中 2位  ← 高設定投入対象
  機種A (弱い機種):          avg -1279  3DD中  3位  ← 高設定なし
  機種B (弱い機種):          avg -2584  18DD中18位  ← 明確に低設定傾向

→ セクション全体の DD=4 強さ = 強機種の平均が高く弱機種を上回るため
→ 機種を区別しないセクション集計では「セクションが強い」と誤認する
```

