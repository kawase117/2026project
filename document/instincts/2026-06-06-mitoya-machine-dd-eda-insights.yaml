title: セクション×DDルールは機種配置変更で無効化する — 定期的な再検証が必須

## 背景
501-522 (マギアレコード) の DD=17 強さを年別で分析したところ
2024-09以前は DD=17/501-522 は平凡な成績だったが
2024-09以降はマギアレコード設置により突出して強くなった（avg +1130）。
セクション×DDルールをそのまま使い続けると「なぜ当たらなくなったのか」が分からなくなる。
機種名ベースのルール（「マギアレコード × DD=17」）なら機種移動後も追跡できる。

## アクション
セクション×DDルールを使う場合は必ず以下を実施する:
1. 半年〜1年ごとにセクション成績の推移を確認し急変がないかチェック
2. 急変があった場合は「機種配置が変わった可能性」を最初に疑う
3. 原則として「機種名 × DD」ルールを優先し、セクションは現在の配置情報として補完利用

## 例
```
501-522 の DD=17 成績（年別）:
  〜2024-08: avg_diff ≈ +200〜+400（普通）
  2024-09〜: avg_diff ≈ +1130（突出）← マギアレコード設置と一致

セクションルール「501-522 は DD=17 に強い」
  → 機種が変わると崩壊するリスクあり

機種ルール「マギアレコード は DD=17 に強い」
  → 機種追跡で長期利用可能（場所が変わっても追える）
```

