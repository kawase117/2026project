title: 位置特徴量は hit@1 を微減させるが mean_diff を3倍超改善する — 運用上は採用すべき

## 背景
tail_ltr_mitoya_wf.py で walk-forward アブレーション実験（with/without_position_features）を実施した。
- without_position: hit@1=24.5%, mean_diff=+5.55,  p_gt_0=63.8%
- with_position:    hit@1=23.1%, mean_diff=+21.57, p_gt_0=92.6%
hit@1 は -1.4pp 低下したが mean_diff は +288%（5.55→21.57）、p_gt_0 は +28.8pp 改善。
hit@1 の低下は「モデルが好みにくい末尾でも位置が強ければ上位選択する挙動変化」であり
実際の差枚期待値は大幅に向上している。

## アクション
評価指標の優先順位: mean_diff > p_gt_0 > hit@1（実運用上の収益性ベース）
hit@1 の単純比較で位置特徴量の価値を否定しないこと。
位置特徴量は採用する。mean_diff と p_gt_0 が運用KPIとして正しい指標。

## 例
```
評価指標     without_position  with_position  改善幅
hit@1        24.5%             23.1%          -1.4pp  ← 微減（許容）
mean_diff    +5.55             +21.57         +288%   ← 3倍超
p_gt_0       63.8%             92.6%          +28.8pp ← 大幅改善
```

