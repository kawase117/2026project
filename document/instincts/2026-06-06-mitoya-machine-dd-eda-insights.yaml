title: 同じセクション内でもDD選好が正反対の機種が共存する — セクション単位集計は情報を損失する

## 背景
574-590 セクションの DD=4 成績を機種別に分解したところ
- 機種X: dd4_avg=+1720、全31DD中 1位（高設定投入対象）
- 機種Y: dd4_avg=+966、 全31DD中 2位（高設定投入対象）
- 機種A: dd4_avg=-1279、全3DD中  3位（低設定）
- 機種B: dd4_avg=-2584、全18DD中18位（明確に低設定）
と正反対の機種が混在していた。
セクション単位の avg_diff はこれらを混合平均してしまい機種間の差異を隠す。

## アクション
セクション×DD の平均 diff が高くても「全機種が均等に強い」とは限らない。
機種別に分解してから「どの機種がそのDDに強いか」を確認する。
EDA の順序: セクション×DD（粗い探索）→ 機種×DD（精密分析）

## 例
```python
# セクション集計（粗い）
# 574-590, DD=4: avg_diff = +850 （強く見える）

# 機種別分解（精密）
q = '''
SELECT machine_name, AVG(diff_coins_normalized) as avg_diff,
       COUNT(DISTINCT date) as n_dates
FROM machine_detailed_results m
JOIN machine_layout ml ON m.machine_number = ml.machine_number
WHERE ml.section = '574-590'
  AND CAST(SUBSTR(m.date, 7, 2) AS INTEGER) = 4
GROUP BY machine_name
ORDER BY avg_diff DESC
'''
# → 強機種と弱機種が混在していることを確認してから
#    機種名レベルでルールを構築する
```
