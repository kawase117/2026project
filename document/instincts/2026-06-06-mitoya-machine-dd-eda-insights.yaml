title: 機種×DD パターンの信頼基準 — lift≥500 かつ n_dates≥8、機種は total_dates≥80

## 背景
みとや全機種×DD のマトリクス分析で、機種レベルの baseline（全DD平均）からの
lift を算出し 34 件の信頼パターン（lift≥500, n_dates≥8）を特定した。
機種の選定基準（total_dates≥80, n_dd≥8）は「少数出現機種の偶発的外れ値除外」のため。
n_dates=4 で lift=+3000 超のパターンは高く見えるが偶発性が高く採用不可。

## アクション
機種×DDパターンの採用基準:
1. 機種フィルタ: total_dates >= 80 かつ n_dd >= 8（年間を通じて安定出現する機種）
2. パターンフィルタ: lift >= 500 かつ n_dates >= 8（そのDD組み合わせで8回以上確認）
3. lift は「機種の全DD平均 diff」からの偏差（グローバルバイアスを除去）
4. 出力: data/mitoya_corner_section_analysis/machine_dd_patterns.csv（UTF-8-sig）

## 例
```python
# 機種別全体平均を計算
machine_global = df.groupby('machine_name').agg(
    global_avg=('avg_diff', 'mean'),
    total_dates=('n_dates', 'sum'),
    n_dd=('dd', 'count')
).reset_index()

# 信頼できる機種に絞る
reliable = machine_global[
    (machine_global['total_dates'] >= 80) & (machine_global['n_dd'] >= 8)
]['machine_name']

# lift を計算してフィルタ
df_r['lift'] = df_r['avg_diff'] - df_r['global_avg']
strong = df_r[(df_r['lift'] >= 500) & (df_r['n_dates'] >= 8)]
# → みとやで34件（2026-06-06時点）
```

