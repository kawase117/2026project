# 個別台予測はセクション別に分割すべき（全台統一ではなく）

## 背景

個別台の「その日の差枚が+か-か」を分類予測するモデルを実装した際、
全台を統一モデルで学習したAUC 0.685は、セクション別に分割すると
セクション別で大きなばらつき（AUC 0.52～0.82）を示した。

セクション別の結果：
```
高性能（AUC > 0.80）:
  734-744（バラエティ）: 0.8273
  723-733（バラエティ）: 0.8254
  712-722（バラエティ）: 0.8213
  675-691（ジャグラー）: 0.8031

中程度（0.60-0.70）:
  574-590（AT）: 0.6270
  608-623: 0.6514
  その他: 0.60-0.69

低性能（< 0.60）:
  692-700: 0.5247
  540-556: 0.6034
  624-640: 0.5708
```

この差異は「店側の設定投入戦略がセクション別に異なる」ことを示唆。

## アクション

個別台分類モデルは必ずセクション別に独立したモデルを構築：

```python
# ❌ 避けるべき
model = CatBoostClassifier(X=全台データ, y=target)  # AUC 0.685（不安定）

# ✅ 正しいアプローチ
models = {}
for section in all_sections:
    section_data = df[df['section'] == section]
    models[section] = CatBoostClassifier(X=section_data, y=target)
    # 各セクションで独立した walk-forward validation
```

利点：
1. セクション固有の機種構成・設定戦略を捕捉
2. 予測精度がセクションごとに最適化される
3. 高性能セクション（AUC 0.80+）と低性能セクション（AUC 0.52）を事前に識別可能
4. 実運用時に「推奨セクション」と「非推奨セクション」を明確に分離

## 例

セクション 734-744（AUC 0.827）vs セクション 692-700（AUC 0.525）：
```
734-744: モデルが台ごと・日ごとに予測値に幅を持たせる
         pred_std = 0.2668 → 信号が豊富

692-700: モデルが常に同じ確率を予測（決め打ち）
         pred_std = 0.0106 → 店側戦略が固定
```

