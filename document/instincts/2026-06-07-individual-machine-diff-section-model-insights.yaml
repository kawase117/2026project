# 「決め打ち予測」（constant pred）はモデルバグではなく、店側の固定戦略を反映

## 背景

セクション 692-700, 540-556, 624-640, 574-590 で、
予測値の標準偏差が 0.01～0.02（ほぼ全て同じ値を予測）となった。

一見モデルの学習失敗に見えるが、詳細分析で以下が判明：

```
692-700:
  実績プラス率: 37.4%
  モデル予測: 常に 0.497（ほぼ-推奨）
  正解率: 62.6%（常に-を予測で実現）

理由：
  店側が「このセクションには常に低設定のみ投入」
  → 日別でプラス率がほぼ変わらない
  → モデルが「セクション内に差別化シグナルがない」と正しく判定
  → 結果：予測値を分化させる必要がない
```

## アクション

決め打ち予測セクションの処置：

1. **pred_std を診断指標として使用**
   ```
   pred_std > 0.20: 高シグナル（使用推奨）
   pred_std 0.10-0.20: 中シグナル（参考情報）
   pred_std < 0.05: 低シグナル（除外推奨）
   ```

2. **実績分布を確認**
   ```python
   if section_plus_rate < 0.40:  # 常にマイナス傾向
       → 店側の「常に低設定投入」と判定
       → 予測対象外（既知の店側戦略）
   ```

3. **実運用で除外**
   - AUC が低い理由は「予測困難」ではなく「パターンが固定」
   - この場合、ML予測は不要（店側戦略として既に確定）

## 例

```
セクション 692-700（AUC 0.525）:
  常に低設定（プラス率 37%）
  → モデル：「全台に確率 0.497 を割り当て」
  → 実績：「約62%がマイナス」なので、常に-予測は合理的
  → 解釈：店側戦略が「このセクションは低設定オンリー」

結論：ML予測が弱いのではなく、
     店側の戦略が「セクション内で均一」だから予測の余地がない
```

