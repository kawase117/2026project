# 個別台予測の運用対象は AUC > 0.70 のセクション（7セクション）に限定

## 背景

セクション別個別台分類モデル（36特徴量, walk-forward validation, CatBoost）の結果：

```
全18セクション平均AUC: 0.6854
セクション別AUC分布:
  0.80+:   4セクション（734-744, 723-733, 712-722, 675-691）
  0.70-0.79: 3セクション（641-657, 701-711, 805-815）
  0.60-0.69: 7セクション
  <0.60:   4セクション
```

高AUC（0.80+）セクションは「バラエティ島」「ジャグラー島」に集中。
これは機械割の日単位変動が大きい機種特性を反映。

低AUC（<0.60）セクションは「店側の固定低設定戦略」が原因（決め打ち予測）。

## アクション

実運用では AUC > 0.70 セクションのみを使用：

```
推奨セクション（運用対象）:
  ✅ 734-744（AUC 0.8273） - バラエティ島最高
  ✅ 723-733（AUC 0.8254） - バラエティ島
  ✅ 712-722（AUC 0.8213） - バラエティ島
  ✅ 675-691（AUC 0.8031） - ジャグラー島
  ✅ 641-657（AUC 0.7981） - 角番台効果
  ✅ 701-711（AUC 0.6975） - 境界ケース（参考情報のみ）
  ✅ 805-815（AUC 0.7693） - その他

非推奨セクション（除外）:
  ❌ 574-590（AUC 0.6270） - AT島（複雑さで予測困難）
  ❌ 608-623, 501-522, 745-755, etc. - AUC < 0.70
  ❌ 692-700, 540-556, 624-640 - 決め打ち（店側戦略固定）
```

除外セクションについては「ML予測では信頼度不足」と明記。

## 例

運用プロセス：
```python
USABLE_SECTIONS = [
    '734-744', '723-733', '712-722', '675-691',
    '641-657', '701-711', '805-815'
]

for section in all_sections:
    if section not in USABLE_SECTIONS:
        predictions[section] = None  # スキップ
    else:
        predictions[section] = model[section].predict(...)
```

セクション 574-590（AT島）が除外される理由：
- AT機の複雑な設定→挙動対応
- 日単位の機械割差が小さく、ML予測根拠が弱い
- 実績もプラス率 46% で、「常に-」戦略ではない
- だが予測シグナルが少ないため AUC 0.627 に留まる
