# _hier_lookupにparent-aware hierarchical shrinkageを導入し少数台暴走を抑制

## 背景
c3コンポーネントで「1台x2日のグループ平均がそのままスコアになる」問題が発覚。
例: #2188 化物語がc3=+7,200で常にTop1に居座っていた（seg=2F_R_N, kb=2, DD=26、
該当台1台のみ、訓練日2日のみ）。

Top50選出グループの50-67%がdistinct_machines<=2で、問題は広範。

対策として_hier_lookupに再帰的shrinkageを導入:
- 各階層(exact->fallback1->fallback2)で上から下へ(n*local + k*parent)/(n+k)をブレンド
- n_effective = machine_days * distinct_machines / (distinct_machines + m) で
  台多様性が低いグループのnを割引（m=2, k=5）
- 閾値なし、連続的にself-weightが増加

## アクション
- 新しい台やセグメントでスコアが異常に高い場合、n_effectiveを確認する
- k, mの値は将来コンポーネント別に分離可能（SHRINKAGE_K_PER_COMPONENT）
- shrinkage_k=0で従来動作に戻せる（後方互換）

## 例
#2188 化物語: c3 = 7200 -> 1681（-77%圧縮）、順位 1位->6位
#3216 東京喰種: c3 = 138 -> 176（多台数グループのため影響小）、順位 5位->1位

