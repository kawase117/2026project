# 品質ゲート(good_ok)は従来ゲート(count>=2)よりEVが高い

## 背景
260日バックテストで5戦略を比較。セグメントを品質tier（good/ok/bad）で
分類し、activeセグメントの品質でゲート発動を判断する方式が最良。

good: 3F_L_A, 3F_R_A, 2F_L_N（lift高・中央値マシ・勝率47-48%）
ok: 3F_R_N（lift正だが高分散）
bad: 2F_R_N, 3F_L_N（lift負~ゼロ・スコア解像度低）

| 戦略 | lift | 発動率 | EV/日 | lift>0率 |
|------|------|--------|-------|---------|
| NOGATE毎日 | +60 | 100% | +60 | 53% |
| 従来(active>=2) | +213 | 44% | +93 | 69% |
| good_only | +215 | 47% | +100 | 74% |
| good_ok(採用) | +187 | 60% | +111 | 69% |

## アクション
- predict_gatedのデフォルトgate_modeをgood_okに設定（実装済み）
- 2F_R_Nのみactiveの日は推奨を出さない（bad tierで自動fallback）
- --gate-mode countで従来動作にも戻せる

## 例
config.py GATE_QUALITY_TIERS で定義。predict_gated.py _apply_gate_mode()で適用。

