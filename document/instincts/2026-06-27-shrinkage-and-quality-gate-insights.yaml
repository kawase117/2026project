# セグメントの実運用価値はスコア解像度（SD・c1ユニーク率）で決まる

## 背景
10日間テストでセグメント別の実績を分析した結果、
compositeスコアのSD（セグメント内の台間差異）が高いセグメントほど実績が良い。

| セグメント | スコアSD | c1ユニーク率 | 平均差枚 | 勝率 |
|-----------|---------|------------|---------|------|
| 3F_R_N | 329 | 88% | +834 | 52% |
| 2F_R_N | 124 | 26% | +20 | 35% |
| 3F_L_A | 79 | 31% | +294 | 48% |

2F_R_Nは1日平均23台を選出するがc1のユニーク値が6種しかなく、
同じ角番グループの台が同一スコアになりhist_metricの微差でランキングされるだけ。

## アクション
- セグメントの品質評価にスコアSD/c1ユニーク率を使う
- スコア解像度が低いセグメント(2F_R_N等)は推奨台数を絞るか除外する
- 解像度向上には角番以外の台差別化特徴量（機種特性、位置情報等）が必要
