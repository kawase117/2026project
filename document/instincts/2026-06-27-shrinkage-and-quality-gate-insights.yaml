# 3F_R_Nは「死亡セグメント」ではなく実運用で最強セグメント

## 背景
過去EDA(2026-06-19)で3F_R_NはKruskal H=9.3, p=0.410で「死亡セグメント」と判定。
しかし10日間実運用テストで平均差枚+834、勝率52%と全セグメント中最強だった。

過去の「死亡」判定は末尾効果のKruskal-Wallis検定に基づいており、
「末尾軸での予測力がない」ことを意味するだけで「セグメント自体の実力が低い」わけではない。
3F_R_Nは東京喰種(3211-3216)を中心に台の地力が高く、c4(角番xDD交互作用)の
スコア解像度が88%と他セグメントより圧倒的に高い。

逆に3F_L_Nはp=0.013の「構造的シグナル」があったが実績は-157枚で最弱。
統計的有意性と実用的な予測力は別物。

## アクション
- 3F_R_Nを品質ゲートの「ok」tierに分類（実装済み）
- EDAの「死亡」判定を「末尾軸限定の非有意」に限定解釈する
- 過去instinct(2026-06-19 kamata7-segment-baseline)の「3F_R_N除外」は撤回

## 例
セグメント別10日間実績:
3F_R_N: +834枚, 勝率52%, スコアSD=329（解像度高）
3F_L_N: -157枚, 勝率35%, スコアSD=89（解像度低）

