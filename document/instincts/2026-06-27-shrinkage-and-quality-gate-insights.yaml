# shrinkage+品質ゲートの組み合わせでlift +102->+236枚（+131%改善）

## 背景
2026-06-16〜25の10日間で、shrinkage前（gate_mode=count）と
shrinkage後（gate_mode=good_ok）を比較。

| 指標 | 前 | 後 | 変化 |
|------|-----|-----|------|
| lift | +102 | +236 | +134(+131%) |
| 中央値 | -250 | -190 | +60改善 |
| 5回以上常連 | 18台 | 5台 | -72%（居座り解消） |
| ユニーク台数 | 131 | 278 | 2.1倍（多様性改善） |
| GATED日 | 2日 | 5日 | +3日（発動率向上） |

特に6/18 lift +29->+509, 6/20 lift +114->+448と大幅改善。
NOGATE日もlift +3->+82に改善（shrinkageの波及効果）。

## アクション
- shrinkage+品質ゲートをデフォルト運用とする
- 中央値は依然マイナス(-190)。liftがプラスでも過信しない
- 次の改善候補: c3のDD individual modeの見直し、n_effectiveへのdistinct_dates反映

## 例
GATED日のlift平均: +389枚（5日間）
NOGATE日のlift平均: +82枚（5日間）

