# 設定が入っていても引けなければ差枚はゼロ。ボーナス確率を自機の平常時と比べる

## Core claim
差枚は「出たか」を測る指標であって「設定が入っていたか」を測る指標ではない。
**機種のボーナス確率を、その機種自身の直近N日と比較する2標本比率検定**を
併走させると、差枚が沈んだ日の投入を検出できる。
実装は `backtest/bonus_rate.py`（`python -m backtest.bonus_rate <hall> --date YYYYMMDD`）。

比較対象を「その機種自身」にするのが要点。ボーナス確率の絶対値は機種ごとに桁違いで
横断比較は無意味であり、スペック表(`JUGGLER_FAMILY_SPECS`)は14ファミリーしか
収録が無くハナハナ系すら入っていない。自己ベースラインなら全機種に適用できる。

## Evidence
楽園蒲田 ToLOVEるダークネス（Zeno発表: 8/27【全台】/ 8/28【1/2】8台中4台）:

| 日 | 台 | 合計G | ボーナス確率 | 出率 | 平均差枚 | 差枚score | 水準z |
|---|---|---|---|---|---|---|---|
| 8/27 | 8 | 29,648 | 1/136.0 | 96.90% | **-345** | **-306 (miss)** | +1.63 (p=0.102) |
| 8/28 | 8 | 18,984 | 1/127.4 | 111.30% | +804 | **915 (miss)** | **+1.99 (p=0.046)** |
| 8月の非対象26日 | | 225,894 | 1/154.7 | 96.50% | | | |

- 8/27 vs 8/28 のボーナス確率に**有意差なし**（z=-0.62, p=0.538）＝両日とも同じ設定帯
- 8/28 vs 非対象日は **z=+2.27 (p=0.023) で有意に高い**
- **差枚は -345 → +804 と真逆なのに、ボーナス確率はほぼ同じ。** 8/27の-345は
  設定が無かったからではなく引けなかっただけ

既知ラベル6件（Zeno 8/27発表）での比較:

| 機種 | ラベル | 差枚 | 水準z順位 |
|---|---|---|---|
| モンハンライズ | 全台 | 7,844 超え | 6/49 |
| ToLOVEる | 全台 | -306 miss | **5/49** |
| マギレコ | 1/2 | 309 miss | 13/49 |
| からくり2 | 1/2 | 6,075 超え | 24/49 |
| スト6 | 1/2 | -590 miss | 28/49 |
| かぐや様 | 1/2 | 102 miss | 31/49 |

**全台系2機種は水準zで5位・6位/49。差枚は2機種中1機種しか拾えていない。**

## 限界（重要）
- **ニブイチ(1/2)は水準zでは検出できない**（4機種とも13位以下）。機種の半分だけ設定6なら
  機種全体の水準は半分しか上がらない。ニブイチは
  [[nibuichi-detection-by-art-overdispersion]] のART過分散が担当で、役割が違う
- 逆に差枚が勝つ場面もある（からくり2 8/27: 差枚6,075 vs 水準z 24位）。
  **置き換えではなく併走させること**
- スト6・かぐや様の【1/2】は差枚・水準z・過分散の**3指標すべてが反応しなかった**。
  現状どの指標でも取れないケースが存在する
- 正解ラベルは Zeno発表6件 + 現場情報2件のみ。単一ホール2日分で、検証は薄い

## Action
- announce の答え合わせでは `announce score`（差枚）と `bonus_rate`（水準）を**両方走らせる**
- 差枚 miss かつ 水準z 上位の機種は「投入はあったが出なかった」として別枠で記録し、
  miss と同列に扱わない
- ニブイチが疑われる機種はさらにART過分散を通す（3段構え）

