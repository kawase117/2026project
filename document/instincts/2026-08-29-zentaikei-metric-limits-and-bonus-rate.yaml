# 楽園蒲田の末尾7は、乗るセグメント(JUG/AT)が日替わりで移る

## Core claim
末尾7効果は存在するが、**どのセグメントに乗るかが日によって入れ替わる**。
ホール全体でプールすると打ち消し合って見えなくなる。

## Evidence
2026-08-28（DD28。7のつく日ではない）末尾別、1,000G以上・島×機種内残差で統制（n=366）:

| 末尾 | n | 生平均差枚 | 残差 | 勝率 |
|---|---|---|---|---|
| **7** | 32 | **+752** | **+290** | **56.2%** |
| 6 | 39 | +428 | +283 | 46.2% |
| 9 | 36 | -125 | -269 | 30.6% |

セグメント別:

| セグメント | 末尾7残差 | 他 | 差 |
|---|---|---|---|
| **AT** | +706 (n=18) | -64 | **+770** |
| JUG | +48 (n=5) | -3 | +52 |
| BT | -261 (n=8) | +42 | -303 |

**2026-08-07 の観測は逆で、JUG末尾7 +1,140 / AT末尾7 -593 だった**（既存記録）。
同じホール・同じ末尾7で、乗るセグメントが反転している。

過去86日（2026-06-01以降）の分布に置くと:

- 末尾7効果(全体) 8/28 = +318枚 → 分位点 **68.6%**（平均+87, sd 434）。よくある範囲
- 末尾7効果(AT限定) 8/28 = +770枚 → 分位点 **82.6%**
- 上位日は 7/07(+1,613)・6/17(+1,306)・6/27(+1,025)・7/17(+710) と **DD7系が独占**

末尾7効果の日次自己相関は **r=-0.139 (p=0.205)** で、前日から引き継がれない。

## 限界
- セグメント反転の観測は 8/07 と 8/28 の2点のみ。**日替わりで移ると言い切るには弱い**
- 8/28の全体分位点は68.6%で、単独では「末尾7の日だった」と主張できる水準ではない
- [[project-rakuen-lastdigit7-rb-only]]（末尾7はRB確率でしか見えない・差枚残差ほぼゼロ）は
  JUG側の話。今回のAT側 +706 はそれと矛盾しない（JUGは +48 でほぼゼロのまま）

## Action
- 末尾7を狙うときは**必ずセグメントを指定する**。「末尾7が強い」だけでは運用できない
- 末尾効果はホール全体プールで評価しない。JUG/HANA/OKI/BT/AT に分けてから見る
  （[[feedback-lastdigit-kakuban-segment-split]]）
- 前日の末尾7効果を翌日の根拠にしない（自己相関 r=-0.139, p=0.21）
- 特定台の継続（例: 2026-08-28 の転生1037が両日プラス）を根拠にするときは、
  **同じ末尾の反例**（1027は109.71%→83.51%）を必ず併記する。結果を見てから
  継続した台だけを選ぶのは後知恵

