# 継続は機種では起きるが台では起きない。ただし前日情報に増分価値は無い

## Core claim
粒度を分けると結論が変わる。

- **機種**: 継続する（モンハン・攻殻・ToLOVEるが 8/27→8/28 で実際に継続）
- **機種（前日情報の増分）**: **無い**。機種の直近30日平均を統制すると前日scoreの寄与は消える
- **台**: **継続しない。むしろ反転する**

「前日出したから今日も」ではなく「もともとよく出す機種だから今日も」が正しい説明。

## Evidence
楽園蒲田 2026-08-27 → 08-28:

| 機種 | 8/27 score / 出率 | 8/28 score / 出率 |
|---|---|---|
| モンスターハンターライズ | 7,844 / 118.17% | 3,700 / 107.69%（両日閾値超え） |
| 攻殻機動隊 | 1,477 / 105.24% | 1,973 / 103.44%（両日プラス） |
| ToLOVEるダークネス | -306 / 96.90% | 915 / 111.30%（ボーナス確率では両日同水準・Zeno両日【全台】） |

**連続スコア版の検定（機種×日 n=10,554、2026-03以降）**

    素の相関 前日score vs 当日score : r=+0.028 (p=0.0045)
    OLS  当日score ~ 機種の30日平均score + 前日score
       30日平均  係数 +0.401  (p=1.1e-23)   ← 本体
       前日score 係数 +0.0039 (p=0.693)     ← 実質ゼロ（前日+5,000枚で当日+20枚分）
    低稼働日 +0.0128 (p=0.30) / 高稼働日 -0.0062 (p=0.70)

**台単位（両日1,000G以上、n=333台）**

    出率の相関 Pearson r=-0.072 (p=0.19) / Spearman -0.061 (p=0.27)
    8/27に出率110%以上だった49台 → 8/28平均出率 99.41%
    それ以外284台                → 8/28平均出率 99.40%   （p=0.9997）

台番号レベルの実例:

| 攻殻機動隊 | 8/27 | 8/28 |
|---|---|---|
| 2126 | -2,000 | **+2,810** |
| 2127 | **+6,953** | **-2,571** |
| 2128 | -2,000 | +1,715 |

**3台とも符号が反転。** モンハンも 8/27最高の2031(+13,953)が8/28は+1,096の3番手。

## Interpretation
- ホールは**機種を継続させつつ機種内で台を入れ替えている**と読める。
  [[project-narabi-block-slide-rule]]（並びを前回位置から±1〜2台ずらす）と整合
- **二値(閾値超えか否か)での検定は取りこぼす。** 攻殻は8/27が1,477で閾値未達のため
  「前日超えていない」に分類され、継続として数えられなかった。連続値で検定すること
- [[feedback-prevday-exceed-carries-no-info]] の「情報ゼロ」は、増分価値については正しいが
  「継続が起きない」という意味に読むと誤り

## Action
- 前日良かった**機種**を候補に残すのは正しい。ただし「前日出した」を根拠に上積みしない。
  機種の30日実力で並べれば十分
- **前日良かった台には座らない。** 攻殻2127（+6,953 → -2,571）が典型
- 継続性の検定は必ず連続スコアで行い、機種と台を分ける

