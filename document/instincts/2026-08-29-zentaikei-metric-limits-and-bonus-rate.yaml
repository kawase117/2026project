# 沖ドキ系は、よほどのことがない限り高設定判別ができない

## Core claim
**沖ドキ系は結果データからの設定判別が事実上不可能**（ユーザー、2026-08-30）。
差枚・ボーナス確率・出率のいずれでも判定できない。
発表で名指しされていても、我々の指標が反応しないのは正常な挙動であり、
**指標の失敗ではなく機種特性**として扱う。

## Evidence
2026-08-28 楽園蒲田。Zenoが **【1/2】沖ドキ!BLACK 11台中6台** と発表した日:

| 指標 | 値 | 判定 |
|---|---|---|
| 差枚score | -131 | miss |
| 水準z（ボーナス確率 vs 自機30日） | **-1.18 (32/37位)** | 反応なし（むしろ平常時以下） |
| 出率 | **92.30%** | 低い |
| 勝ち台 | 2/11 | 低い |

**11台中6台に設定を入れて出率92.30%というのは、結果指標から見れば投入の痕跡が無い。**
同日のZeno発表5機種のうち、3指標すべてが外したのは沖ドキだけだった
（攻殻は差枚で、ファンキー・ToLOVEるは水準zで検出できた）。

## Interpretation
- 沖ドキ系は天井・モード管理型で、設定差がボーナス確率にも短期の出率にも
  素直に出にくい機種と考えられる（機構の詳細は未検証）
- `JUGGLER_FAMILY_SPECS` にも未登録なのでスペック表からの尤度比も出せない
- ジャグラー・ハナハナのように「RB確率を見れば分かる」類の機種と**同じ扱いをしてはいけない**

## 限界
- n=1（2026-08-28の1日のみ）。ユーザーの経験則が主たる根拠で、
  データ側は「その1日は検出できなかった」ことしか示していない
- 「よほどのこと」が何かは未定義。長期集計や差枚の分布形状なら見えるかは未検証

## Action
- **沖ドキ系を高設定候補として推薦しない。** 発表で名指しされていても、
  結果データで裏を取る手段が無いので狙い順に載せない
- 沖ドキが発表に載っていて我々の指標が反応しない場合、**指標の偽陰性として
  記録しない**。検出可能性の外にある機種として除外して集計する
- ノーマル機のRB確率判定の対象からも外す（`jug`/`hana` と同列に扱わない）
