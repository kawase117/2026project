# AT機は bb_count / rb_count のどちらに入るかが機種依存。ARTはさらに別物

## Core claim
「ノーマル機は bb/rb 両方、AT機は bb_count」という決め打ちは**誤り**。
AT機は **機種によって bb_count 側か rb_count 側のどちらか一方にしか値が入らない**。
片方だけを見る実装は、もう片方に入る機種のベースラインをゼロにして
**黙って除外**する。合計を取れば列の入り方に依存しない。

さらに **site777 の `art_count` は DB の bb_count/rb_count とは別イベント**であり、
互換ではない。

## Evidence
楽園蒲田 2026-08-27（DB `machine_detailed_results`）:

| 機種 | bb_count | rb_count |
|---|---|---|
| ToLOVEるダークネス | **218** | 0 |
| モンスターハンターライズ | 0 | **79** |
| からくりサーカス2 | 0 | **122** |
| ストリートファイター6 | 0 | **43** |

`backtest/bonus_rate.py` の初版は AT機に bb_count を決め打ち、
モンハン・からくり2・スト6 が `k_base <= 0` で無言除外され、
対象機種が 49→27 に減っていた（実装時に発見・修正済み）。

site777 と DB の対比（2026-08-28）:

| 機種 | site777 ART | DB BB+RB | ART確率 | DB確率 |
|---|---|---|---|---|
| 北斗 転生の章2 | 503 | 117 | 1/98.6 | 1/423.9 |
| モンスターハンターライズ | 180 | 50 | 1/128.5 | 1/462.6 |
| 東京喰種 | 267 | 170 | 1/189.7 | 1/297.9 |
| ToLOVEるダークネス | 58 | **149** | 1/327.3 | 1/127.4 |

ToLOVEるだけ ART < BB+RB で、他は逆。**同一の量ではない。**

## Interpretation
- [[nibuichi-detection-by-art-overdispersion]] が使ったのは site777 の `art_count`。
  DBの bb/rb で同じ過分散検定をしても再現しない（2026-08-27の【1/2】4機種で
  割れp = 0.711/0.574/0.995/0.596 と全て非有意）。**あの知見は否定されていない。
  列が違うだけ**
- ART基準のほうがAT機の設定差を捉えている可能性が高いが、**site777はART回数の
  日次履歴を保存していない**（スナップショットのみ）ため、自機ベースラインとの
  比較ができない

## Action
- AT機のボーナス回数は必ず `bb_count + rb_count` で取る
- 集計から機種が落ちたときは**理由を出力する**。「対象外」と「該当なし」を混同しない
  （`bonus_rate.py` は `df.attrs["excluded"]` に理由付きで返す）
- **site777のART回数を日次で蓄積すること**を検討する。実現すればAT機に対しても
  「自機の平常時と比較」ができ、ニブイチと全台系を同じ枠組みで扱える

