# min_machines だけでは足りない。「実際に回った台数」でフィルタしないと低稼働日に偽陽性が出る

## Core claim
`min_machines`（設置台数）は満たしていても、**当日ほとんど回っていない台が
分母に入っているだけ**の機種がある。低稼働日ほど発生し、残った少数台の
大勝ちが機種平均を押し上げて全台系に見える。
**「一定回転数以上回った台が何台あるか」を別途フィルタする必要がある。**

## Evidence
2026-08-28 楽園蒲田 うみねこのなく頃に2（現場情報では**低設定**）:

| 台番 | G | 差枚 | 出率 |
|---|---|---|---|
| 2243 | **7,867** | +5,762 | 124.41% |
| 2244 | **202** | -238 | 60.73% |
| 2245 | **212** | -285 | 55.19% |
| 2246 | 3,712 | +1,619 | 114.54% |

- 4台設置で `min_machines=3` を通過、gratio_mean_diff **2,466 で全台系HIT判定**
- しかし1,000G以上回ったのは**2台だけ**。出率119.06%は回転数加重なので
  2243 の7,867Gがほぼ単独で作った数字
- `bonus_rate.py` に `min_live=3`（1,000G以上の台が3台以上）を入れると**除外される**

これは [[project-kishu-ichi-decoy]]（機種内1台だけ高設定の撒き餌）と結果は似るが
機構が違う。**ホールの意図ではなく、低稼働による分母不足**で起きている。

## Action
- 機種スコアを出すときは `n_live`（例: 1,000G以上の台数）を必ず併記する
- `n_live < 3` の機種は全台系候補から外す。`backtest/bonus_rate.py` は既定でそうする
- `announce.py` の `model_scores` には稼働台数フィルタが無い。採点結果を読むときは
  手動で `n_live` を確認すること（2026-08-28 のうみねこは実際に誤HITしている）

