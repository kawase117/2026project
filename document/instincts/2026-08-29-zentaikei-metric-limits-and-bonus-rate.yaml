# 全台系スコアは稼働量の2乗に比例する。閾値1800は暗黙に高稼働日を前提している

## Core claim
`gratio_mean_diff` = G比 × 平均差枚 だが、平均差枚は
`≒ 3 × (機械割 - 1) × 回転数` なので、展開すると

    score ≒ 出率エッジ × G² / pool

**同じ設定・同じ出率でも、回転数が減ればスコアは2乗で落ちる。**
低稼働日に閾値1800を当てると、真の全設定6でも構造的に未達になる。

## Evidence
2026-08-28 楽園蒲田 ToLOVEるダークネス（Zeno発表【1/2】8台中4台。⚠️2026-08-29時点では「全六」という現場の噂を確定ラベルとして扱っていたが、2026-08-30のZeno結果報告で【1/2】と判明したため訂正した）:

- プール出率 111.30%（8台 18,984G）→ 1Gあたり期待差枚 +0.339枚
- 実際の平均回転数 2,373G/台 → 平均差枚 +804 → score 915（**閾値1800に未達**）
- 閾値1800に到達するのに必要な回転数 = **3,327G/台**（954G不足）
- 同じ出率111.3%・同じG比1.14でも、前日8/27の稼働水準(pool=4,177)なら
  **score 1,835 で閾値超えだった**

当日のホール稼働は pool平均 2,084G で、8/27の 4,177G の **50%**。

## Interpretation
- [[feedback-stratify-by-hall-traffic]] に記録した「低稼働日は閾値超えが1.04機種
  （高稼働2.86）」という現象の**機構がこれ**。ホールが設定を入れないからではなく、
  **指標が届かないから**という説明が成り立つ。両者は観測上区別できていない
- 閾値を固定したまま低稼働日の的中率を出すと、予告アカウントの評価が不当に低く出る

## 限界
- 「ホールが低稼働日に設定を入れない」効果と「指標が届かない」効果は
  今回のデータでは分離できていない。ToLOVEるの1例は後者を示すが、両方あり得る
- 出率エッジの推定自体が1日分の差枚に依存するので、AT機では分散が大きい

## Action
- 低稼働日の採点では、閾値未達を「仕掛けが無かった」と読まない
- 予測時は低稼働／高稼働の**両シナリオの期待機種数を併記**する
- 採点結果を集計するときは必ず稼働量の層を明示する。全期間プールの的中率を単独で出さない
- 閾値の稼働量正規化（`score × pool / pool_baseline` 等）は未実装。導入するなら
  **凍結済みannounceの閾値は動かせない**ので、新しい指標として並走させること

