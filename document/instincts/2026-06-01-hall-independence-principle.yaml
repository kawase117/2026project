# ホール固有の発見は他ホールに転用してはいけない

## 背景
ユーザーから繰り返し指摘された最重要ルール（2026-06-01 確立）：

「ホール固有ルールが強い。他ホールと比較することに意味がない。」

パチンコホールは独立した経営主体であり、設定投入戦略を共有する理由がない。
他業種でも経営戦略は共有しない（例：A社の販売戦略がB社でも有効とは限らない）。

蒲田7で確認された発見（hall-specific、他ホールに適用不可の例）：
- 2F_N が 69.3% の日で最上位セグメント
- always-2F_N の uplift が全ルールに勝つ（-9,731/日の差）
- カレンダールール全てがマイナス uplift
- lag=14 digit=8 の一時的なFDR有意（全グリッド探索では消えた）

これらは「蒲田7における2025-07〜2026-05の実測値」であって、
他ホールに同じパターンがあることを示唆しない。

## 転用の可否（重要な区別）

| カテゴリ | 転用可否 | 例 |
|---|---|---|
| 設定投入パターン・数値 | ❌ 不可 | 2F_N 69.3%、-9,731/日の uplift |
| カレンダールールの有効性 | ❌ 不可 | 蒲田7でDD/曜日がマイナス uplift |
| 分析アプローチ・スクリプト | ✅ 可 | signal_existence_plan.py の手順 |
| 機種固有のクセ | ✅ 可（可能性あり） | 天井・ボーナス確率はメーカー仕様で共通 |

機種固有のクセの注意点：
- 機械の挙動（確率・天井）→ メーカー仕様で全ホール共通
- 「その機種に高設定を入れる頻度・タイミング」→ ホール固有（転用不可）

## アクション
別ホールの分析を開始するとき：
1. 蒲田7の数値・パターン（セグメント比率・uplift値等）をそのまま適用しない
2. 「蒲田7では2F_Nが強いから、このホールも2F系が強いはず」と推論しない
3. 新ホールでは signal_existence_plan.py を最初から実行する
4. セグメント構成・支配パターンを新ホールで独立に確認する

複数ホール横断の提案をする前に必ず確認する：
1. 同一系列・同一チェーンか？（系列なら戦略共有の可能性あり）
2. 系列でなければ pooling は設定戦略の観点では原則無効

## 要注意フレーズ（文脈で判断する）
これらは文脈によって正しい場合も誤りの場合もある：
- 「蒲田7と同じアプローチを使えば」
  → 分析手順の再利用 ✅ / 蒲田7の発見をそのまま適用 ❌
- 「他ホールでも同様のパターンが見られるはずです」
  → 機種挙動（メーカー仕様） ✅ / 設定投入パターン ❌
- 「複数ホールで確認すれば検出力が上がります」
  → 同系列店 ✅ / 異なる経営主体のpooling ❌
- 「一般的にパチスロでは〇〇が強い傾向があります」
  → 機種仕様の話 ✅ / ホール設定戦略の話 ❌

