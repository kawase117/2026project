# instinctにはscope/hallフィールドを必ず付与する

## 背景
ホール固有の発見と普遍的な方法論が混在することで、
別ホール分析時に誤った前提が持ち込まれる問題が発生した（2026-06-01）。
add_instinct_scope.py で既存70件に一括追加済み。

## アクション
新しいinstinctを作成するとき、必ず以下のフィールドを追加する：

```yaml
confidence: 0.XX
scope: <methodology|domain-general|hall-specific>
hall: <kamata7|...>   # scope が hall-specific のときのみ
```

scope の定義：
- methodology   : 普遍的な手順的知識（リーク検出・統計手順・ML評価等）
                  全ホール・全プロジェクトで常に適用
- domain-general: パチスロ業界全般の原則
                  ホールが異なっても適用（独立経営主体は戦略を共有しない、等）
- hall-specific : 特定ホールの定量的発見
                  hall フィールドで明示。他ホールには絶対に適用しない

判断に迷う場合は hall-specific + hall: kamata7 を選ぶ（保守的に）。
後から scope を緩和するほうが、誤った転用より安全。

