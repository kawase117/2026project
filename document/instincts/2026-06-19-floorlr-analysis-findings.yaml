# LR 効果がセグメント・セクションサイズに強く依存

## 背景
2F, 3F, AT セグメント別に LR 分割の peak rank 分布を調査したところ、セグメントごとに最強角番の L/R 側が異なり、セクションサイズ層でも変動する。

## 観測事実
最強角番の最頻値：
- 2F: L側→角2/7/3、R側→角13/4/5（R側外寄り傾向）
- 3F: L側→角2/13/11、R側→角1/8/7（L側両極端）
- AT: L側→角2/6/3、R側→角5/7/6（ほぼ類似）

セクションサイズ別：
- 2F large: L=7.2, R=9.8 (R側外寄り)
- 3F small: L=2.0, R=1.0 (両者中央)
- 3F large: L=8.3, R=6.6 (L側外寄り)

## アクション
LR分割を単独で解釈しない。必ず (segment, section_size, lr_side) の3軸で検証。

## 例
「R側が外寄り」は2F largeの話。3F smallでは両者中央寄り。セグメント固有の効果が dominant。

