# イベント日のピークシフトが L側と R側で非対称

## 背景
イベント日（1,4,7,11,14,17,21,22,25,28,30,31）と通常日で peak rank を比較したところ、L側と R側で変動パターンが異なる。

## 観測事実
- 2F L側: イベント日 rank +1.47 外寄り（強いシフト）
- 2F R側: イベント日 rank -0.47 （ほぼ不変）
- 3F: 両側 ±0.6 以下（微弱）

## アクション
イベント日戦略は L/R 側で区別して検証。2F L側のシフトは意図的な設定投入の証拠の可能性。

## 例
2F: イベント日には L側で中央→外寄りへのシフト（+1.47）があり、R側は不変。

