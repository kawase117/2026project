# セクションサイズ×LR の交互作用分析が必須

## 背景
セクションサイズ分割と LR分割の両者を実装・分析したところ、効果が単独ではなく交互作用している。単軸での解釈は不十分。

## 観測事実
- LR分割の効果（±0.5pp）がセクションサイズ層内で変動
- セクションサイズの効果（1-2pp）が LR側で変動
- → 両者の交互作用が無視できない大きさ

## アクション
1. セクションサイズ × LR × セグメント の3軸クロス集計を実施
2. F検定で主効果と交互作用の有意性を比較
3. 「最も有意な分割軸」を複合軸で定義

## 例
2F large R側 vs 2F medium L側 では、単純に「large > medium」ではなく交互作用で大きく変わる

