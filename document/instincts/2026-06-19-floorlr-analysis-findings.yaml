# Floor/LR 分割の効果がセクションサイズ分割より弱い

## 背景
前回の分析では「Floor/LR 分割が最有意」という既存知見を再検証するため、2F/3F × Left/Right の分割を実装した。結果、機械割の L/R 差異が予想より微小であることが判明。

## 観測事実
- 2F: L側 101.61% vs R側 102.07% (差: -0.46pp)
- 3F: L側 101.26% vs R側 101.25% (差: +0.01pp)
- セクションサイズ分割では small/medium/large で 1-2pp の差が見えた
- → LR分割の効果は±0.5pp 以下（微細）

## アクション
1. セクションサイズ分割 vs LR分割の効果を定量比較（F値・相関係数）
2. 既存知見「LR分割が最有意」を要検証
3. LR分割は補助的軸として再位置付け

## 例
2F large: LR差は +1.27pp だが、セクションサイズ層内での rank_from_min の変動（7→9）がより強い信号

