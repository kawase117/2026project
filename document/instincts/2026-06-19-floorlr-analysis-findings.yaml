# セクションサイズ分割がメイン軸として機能

## 背景
2F/3F/LR分割と前回のセクションサイズ分割を比較したところ、セクションサイズ（small/medium/large）の方が機械割差が大きく、より区別性が高い。

## 観測事実
セクションサイズ分割：
- small/medium/large で 1-2pp の機械割差が見える
- 各層内での peak rank が一貫性がある

LR分割：
- 機械割差 ±0.5pp（微細）
- peak rank が最頻値で異なるが、セグメント依存性が高い

## アクション
- メイン分割軸をセクションサイズに戻す
- LR分割は交互作用項として 2次解析に用いる
- 「最も有意な分割軸」の定義を明確化（効果量、信頼区間）

## 例
2F: セクションサイズ別の pay_rate が顕著な段差、LR別は -0.46pp で微細

