# 残差の結論を出す前に「期間分割」と「手法二重化」を必ず通す

## Core claim
全期間平均の残差ランキングは、直近のレジーム変化を消し、かつ集計手法を変えると再現しない。結論を書く前に (1) 四半期などで期間分割する (2) 基準点の異なる2手法で計算する、の2つを必ず通す。

## Evidence
- n_observations: 2026-08-01の1セッション中に同じ失敗が3回発生（9ホール×全DD×カテゴリのスキャン、楽園ネオアイムジャグラーEX、蒲田1のDD1）
- data scope: 全9ホール
- metric scope: 機械割残差pp / 差枚baseline比
- result summary:
  1. **期間分割**: 楽園ネオアイムジャグラーEXを全期間平均すると delta≈0（不支持）だったが、月次に割ると 202602 +11.0 → 202607 +178.9 の単調上昇だった。蒲田1のDD1はAT一般で2025年 +3.5〜+5.0pp → 2026年 -2.78〜-3.83pp と符号反転しており、全期間平均では打ち消し合って上位にも下位にも現れなかった（ユーザーの実地観察「蒲田1のイベント日が1に偏りつつある」が起点で発覚）
  2. **手法二重化**: 蒲田7のDD残差を機種内残差法（基準=各機種の全期間平均）で出すと JUG上位 {1,31,30,14} / AT上位 {6,30,8,16} だったが、カテゴリ平均残差法（基準=同期間の同カテゴリ平均）で前後半に分けると JUG {1,7,11,17,21,27,30,31} / AT {7,8,11,16,17,27,30} となり再現しなかった。前者に基づいて「現行のHALL_EVENT_DIGITSは半分以上マイナス」と9ホール分のtheory文書に書いた後、後者で覆った

## Interpretation
- 機種内残差法は機種入替の交絡を除ける反面、在籍の短い機種でDD別セルが薄くノイズを拾う。蒲田7は期間中に72%の台が機種変更されており影響が大きい。カテゴリ平均残差法はその逆。どちらが正しいかは一般には決まらない
- したがって「片方の手法で出た順位」は結論ではなく候補。両手法で生き残ったものだけが候補として扱える
- 期間分割については、ユーザーの方針は「両期間共通を重視するより直近トレンドを重視」。安定性より鮮度を優先する。ただし直近だけを見ると小標本になるため、四半期の推移として符号と大きさの動きを見るのが実務的
- これは `feedback-short-lived-regularities-have-value`（短期法則にも価値がある、判定に期間を付す）の実装面での帰結でもある

## Action
1. 残差ランキングを出したら、結論を書く前に必ず四半期（または半期）別に割り直して推移を見る。単調に増えている/減っているものと、平均だけ高いものを区別する
2. 基準点の異なる2手法（機種内残差 / カテゴリ平均残差）で計算し、両方で生存したものだけを候補にする
3. theory文書やinstinctに書くときは「どの手法・どの期間の集計か」を必ず明記する。手法名を書かずに数値だけ書かない
4. ユーザーから実地の観察（「最近○○に偏っている」等）が出たら、全期間平均では見えない可能性が高いので、必ず期間分割で追試する

