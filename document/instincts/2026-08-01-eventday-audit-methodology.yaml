# イベント日は個別DDより先に店の告知体系で当てる。カテゴリ別カレンダーの成否はホール依存

## Core claim
イベント日の実測は、個別DDの残差ランキングを上から取るのではなく、店の告知体系（7のつく日・1のつく日・ゾロ目・強ゾロ目・月末）という既知の枠組みに乗るかを先に確認する。またカテゴリ別に別カレンダーを持つかどうかはホールによって異なり、一般化できない。

## Evidence
- n_observations: 蒲田7・蒲田1・楽園の3ホール、四半期別（2025Q3〜2026Q3）
- data scope: single-hall × 3、ホール横断のプールはしていない
- metric scope: 機械割 − 同四半期同カテゴリ平均（pp）
- result summary:
  - **蒲田7**: AT一般で7系{7,17,27}が全5四半期プラス（+1.08〜+2.84）、1系{1,11,21,31}はほぼゼロ〜マイナス。店名どおり7のつく日が主軸で、**カテゴリ別カレンダーは成立しない**（JUG・AT一般とも7系が優位）。個別DD残差の上位として拾った DD8・DD16 は告知体系に乗らず、機種入替周期などのノイズの可能性が高い
  - **蒲田1**: JUGで7系が単調減衰（2025Q3 +2.07 → 2026Q3 +1.20）する一方、1系が上昇（+0.68 → 2026Q1 +2.07 → 2026Q3 +1.62）して2026年に逆転。店名「メガシティ2000-蒲田1」のブランドに沿った1のつく日への移行と読める。ATはまだ判定不能
  - **楽園**: `rakuen_theory.md`§3.1a のとおり**カテゴリ別カレンダーが成立する**（ジャグ{22,5,11,25,15} / AT一般{30,22,11,10} / ハナハナ{7,17,27}）。特にDD{5,15,25}は「ジャグのみ+5.56pp、他4カテゴリはマイナス、回転数も増えない=客に気づかれていない」という独立した型

## Interpretation
- 店名・ブランドが手がかりになる（蒲田7→7のつく日、蒲田1→1のつく日）。個別DDを残差順に上から取ると、体系に乗らないDDを拾ってノイズを候補にしてしまう
- 「カテゴリ別カレンダー」は楽園で確立された構造だが、蒲田7では成立しなかった。ホール別戦略が前提という原則（`feedback-no-cross-hall-pooling`）どおりで、楽園の構造を他ホールに持ち込まない
- 蒲田7の告知体系には既存instinct `kamata7-event-day-complete-definition` のとおり1のつく日も含まれるが、**実測の効果量では7のつく日のほうが明確に強い**。告知されていることと効果があることは別で、体系を出発点にしつつ効果量で重み付けする
- イベント日は時間とともに動く（蒲田1が実例）。定期的に四半期別で組み直す前提で扱う

## Action
1. 新しいホールのイベント日を導出するときは、まず7系/1系/ゾロ目/強ゾロ目/月末という体系ごとにまとめて残差を出す。個別DDのランキングはその後
2. 店名・ブランドから体系の当たりをつける
3. カテゴリ別に分けるべきかは、ホールごとに検証してから決める。楽園で成立したから他でも、とはしない
4. 体系に乗らないDDが上位に出たら、機種入替周期・特定機種の在籍期間などの交絡を疑う
5. 蒲田1の1のつく日移行は事前登録済み（`backtest/prereg/k1_jug_dd1kei_rbz_top3.json`、freeze_hash=5c176bc76465f438、対照は `k1_jug_plain_rbz_top3.json`）。判定はフォワードのみ

