# イベント日定義は3箇所に分裂しており、briefing_common の is_event_dd は劣化版

## Core claim
`eda/briefing_common.py` の `is_event_dd` 列はDDリストしか見ておらず、月末と強ゾロ目を落とす。さらに参照元の `HALL_EVENT_DIGITS` 自体がみとや・楽園で欠落がある。イベント日別の集計にこの列を使ってはならない。

## Evidence
- n_observations: 楽園1ホールで誤った結論が1件発生、9ホール分の集計が影響を受けうる
- data scope: 全9ホール（`briefing_common.load_hall_frame` を使う全分析）
- metric scope: イベント日 vs 非イベント日の hit104率・差枚
- result summary: 定義の所在が3箇所に分裂している。
  1. `eda/core.py` の `is_x_day` = DDリスト OR 月末 OR 強ゾロ目（3条件OR、暦を見た動的な月末判定）
  2. `eda/section_lateral_expansion.py` の `HALL_CONFIGS[*].event_dds` + `strong_zorome`（4ホールのみ収録）
  3. `eda/briefing_common.py:175` の `is_event_dd = df["dd"].isin(event_digits)` ← **DDリストのみ。月末も強ゾロ目も落ちる**

  加えて `HALL_EVENT_DIGITS` 自体の欠落: みとやは `{4,7,14,17,24,27}` で運用定義の `1,30` が欠落、楽園は `{11,22}` で確定定義の `10,30` と強ゾロ目が欠落。
  この結果、楽園でDD10・DD30・強ゾロ目・月末がすべて非イベント日側に混入し、「楽園はイベント日にJUG/HANA/AT一般の全カテゴリで9〜13pp弱い」という**誤った結論**が出た。正しい定義で再計算すると全カテゴリ +2.0〜+2.8pp のプラスに反転した

## Interpretation
- 楽園のDD30は最強イベント日（技術介入+2.50・AT一般+2.41で1位）なので、これが非イベント日側に入ると非イベント日の水準が押し上がり、差が逆符号に見える
- `eda/core.py` の `is_x_day` は3条件ORで正しく作られているのに、`briefing_common` がそれを使わず独自に劣化版を作っていた。正しい実装が存在しても、それを使わない経路が並存すると意味がない
- ただし `is_x_day` の「月末・強ゾロ目を全ホール一律にORする」設計も実測では支持されない。両軸の残差はほぼゼロ（±1pp）のホール×カテゴリが大半で、一律加算はむしろ対比を薄める。効くのは みとやOKI（月末+6.04/強ゾロ目+5.57）・ザシティAT一般（月末+3.70）等の一部セルのみ。**一律統合も一律除外も誤りで、ホール×カテゴリ別に取捨選択すべき**
- 2026-06-19の `kamata7-event-day-complete-definition` で同種の不完全定義が既に指摘・修正されているが、別経路（briefing_common）で同じ問題が再発した

## Action
1. イベント日別の集計をするときは `briefing_common` の `is_event_dd` 列を使わない。`date` 列から自前で判定し直すか、`eda/section_lateral_expansion.py` の `HALL_CONFIGS` から判定する
2. 月末は必ず `calendar.monthrange` で暦を見て判定する。30/31のハードコードはしない（2月・4月・6月・9月・11月で外れる）
3. 月末・強ゾロ目をイベント日に含めるかは、ホール×カテゴリごとに残差を見て決める。一律にORしない
4. 過去の分析結果でイベント日を扱っているものは、どの経路で判定していたかを確認してから信用する

