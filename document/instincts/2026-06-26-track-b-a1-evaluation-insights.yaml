# games_relative（機種別相対回転数）は弱いが一貫した正シグナル — compositeには入れない

## 背景
2026-06-26 Track B実装 + 分析。`games_relative = games_normalized / machine_name当日平均` を52日サンプルで検証。

## 発見
| 指標 | 値 | 評価 |
|------|-----|------|
| Spearman rho | +0.143 ± 0.052 | 100%の日でプラス。一貫性あり |
| lift@50 | 1.170 ± 0.816 | c2(1.04)やc5(1.05)より強い |
| lift_diff | 9.6 ± 16.0 | 分散が平均の1.7倍。不安定 |
| segment別lift std | 全セグメントで平均の数倍 | 信頼区間がゼロを跨ぐ |

## アクション
- compositeスコアに組み込まない
- component_analysisとcorrelation_matrixにdiagnostic指標として残す
- Track D（セグメント別法則）フェーズでリランキング限定で再検討
- データ量倍増後に再評価の余地あり

