# Track A1確定: V12b（base, scale=0.5）がV11に対し統計的有意に改善 — 正式推奨バリアント

## 背景
2026-06-26 Track A1。Track Bで修正した評価指標でsignificance_test.pyを実行。
V11 vs V12b、paired bootstrap + Wilcoxon signed-rank + sign test、segment×event_type別。

## 発見（非イベント日, n=254）

### V12b が V11 を有意に上回るセグメント（Wilcoxon p < 0.05）
| Segment | Mean diff | 95% CI | Win % |
|---------|----------|--------|-------|
| 2F_R_N | +44 | [+15, +73] | 61% |
| 2F_L_N | +18 | [+3, +33] | 56% |
| 3F_L_N | +10 | [+2, +19] | 62% |

### 最重要発見: 2F_R_N の ns → USEFUL 昇格
- V11単体: 2F_R_N は「ランダムと区別不能」(p=0.17, +41枚)
- V12b: 「統計的に有用」(p=0.002, +85枚)

## アクション
- V12b（base, scale=0.5）を正式推奨バリアントとして確定
- イベント日の検定はn=88で検出力不足 — データ蓄積後に再検定

