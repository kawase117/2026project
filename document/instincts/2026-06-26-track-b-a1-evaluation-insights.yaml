# payout_rateは加重平均（sum/sum）で計算すること — 台別meanは構造的に歪む

## 背景
2026-06-26 Track B実装。従来のpayout_rate計算は台別に `(games*3+diff)/(games*3)*100` を計算してから `.mean()` を取っていた。
これはgames=100の台（payout 200%）とgames=8000の台（payout 101%）を同じ重みで平均するため、低回転台が過大に歪む。

## 発見
修正前: `((top["games_normalized"] * 3 + top["diff_coins_normalized"]) / (top["games_normalized"] * 3) * 100).mean()`
修正後: `sum(games*3+diff) / sum(games*3) * 100` — コイン総量ベースの加重平均

変更箇所: `walk_forward_engine.py:_summarize_metrics()` L182-190

## アクション
- payout_rateの計算は常に `sum(coins_out) / sum(coins_in) * 100` で行う
- 台別meanを使ってはいけない
- ゼロ除算ガード: `if payout_denominator > 0` を必ず入れる

