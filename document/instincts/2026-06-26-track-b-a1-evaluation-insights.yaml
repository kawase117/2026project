# payout_rate修正はモデル比較結論に影響しない — avg_diff_vs_otherとhit_t/lift_tが主要検定指標

## 背景
2026-06-26 Track A1。payout_rateを加重平均に修正後、significance_testを再実行。

## 発見
significance_test.pyが検定する主要指標（avg_diff_vs_other, hit_t/lift_t）は
payout_rate計算の影響を受けない。payout_rate差は全セグメントで ±0.3% 以内（非有意）。

## アクション
- 「KPI修正で結論が変わるかもしれない」という懸念は解消済み
- モデル比較の主要指標はavg_diff_vs_otherとlift@50で十分

