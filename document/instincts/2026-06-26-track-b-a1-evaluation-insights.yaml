# walk-forward backtestはscored_pool蓄積でメモリ枯渇する

## 背景
2026-06-26 Track A1実行時。V11+V12b（2バリアント, window=90, 260日）のwalk-forwardが
100タスク目付近でMemoryError。scored_poolがDataFrameリストとして蓄積される。

## 対策案
1. scored_pool を都度CSVに追記し、メモリから解放する（推奨）
2. scored_pool の蓄積を無効化するオプションを追加
3. 1日ずつSQLiteから読む軽量スクリプトで代替分析が可能

## アクション
- 3バリアント以上×全日実行時は `--resume` を前提にする
- scored_pool蓄積の改善は別タスクとして対応
