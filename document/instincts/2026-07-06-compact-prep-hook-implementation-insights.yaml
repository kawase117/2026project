# Windows環境でのPython呼び出しは`python`ではなく`py`ランチャーを使う

## 背景
Git Bash環境で`python`および`python3`コマンドは、いずれも
`C:\Users\apto117\AppData\Local\Microsoft\WindowsApps\python(3)`という
Microsoft Store誘導用の壊れたstub(実行すると"Python"とだけ出力し終了コード49で終わる)を
指していた。一方`py`(Python Launcher for Windows、
`C:\Users\apto117\AppData\Local\Programs\Python\Launcher\py.exe`)は正しくPython 3.14.2を
起動できた。この問題は`extract_session_summaries.py`実行時にも一度発生し、
その時は明示的なフルパス指定で回避したが、hookスクリプトのような繰り返し実行される
軽量処理では`py`コマンドの方が簡潔で保守しやすい。

## アクション
このマシン上でbashスクリプトからPythonを呼ぶ場合は、`python`/`python3`ではなく
`py`コマンドを使う。事前に`command -v py`で存在確認してから採用する。

## 例
`~/.claude/hooks/compaction-recovery.sh`等、compact-prep関連の全hookスクリプトで
JSON parse/構築に`py -c "..."`を使用し、pipe-testで正常動作を確認した。

