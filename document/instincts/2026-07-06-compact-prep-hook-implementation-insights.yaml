# コミュニティ発のhook設定はコピペ前に環境検証が必須

## 背景
「Claude Codeのcompactの問題点と対策」という記事のhook/skill設定一式(compact-prep skill、
PostCompact/UserPromptSubmit連鎖hook、60%通知用statusline拡張)を実装する依頼を受けた。
記事の実装コードは`jq`・`~/.claude/scripts/get-session-id.sh`・既存の`~/.claude/hooks/statusline.sh`
の存在を前提にしていたが、このマシンには3つとも存在しなかった(`jq`未インストール、
`get-session-id.sh`は記事著者の環境にのみ存在する未公開ヘルパー、`statusline.sh`はそもそも
statusLine自体が未設定)。「実物はそのままコピペで動く」という記事の主張を鵜呑みにせず、
先に`command -v jq`、対象ファイルの`test -f`を行ってから着手したことで、素の実装が
サイレントに壊れる事態を防げた。

## アクション
外部記事・他人の設定例をhook/skillとして導入する際は、実装前に必ず
「本文が前提にしている外部コマンド・補助スクリプト・既存ファイルが、このマシンに実在するか」
を`command -v`・`test -f`で確認する。存在しない場合は代替手段(pythonでのJSON処理、
新規ヘルパースクリプトの作成など)に置き換える判断をし、それを実装報告に明記する。

## 例
`jq`が無かったため全hookで`py -c "import json; ..."`に置換。`get-session-id.sh`は
「最終更新のtranscript(*.jsonl)をsession_idとみなす(agent-*.jsonl除外)」という
独自実装で代替し、実際に現在のセッションIDと一致することをpipe-testで検証した。

