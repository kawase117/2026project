# statusLineのstdin JSONにはcontext_window.used_percentageが直接含まれる

## 背景
60%通知の実装のため、statusLineコマンドのstdin JSONスキーマを推測で実装しかけたが、
先にclaude-code-guideエージェントに公式ドキュメント(https://code.claude.com/docs/en/statusline.md)
を調査させたところ、`context_window.used_percentage`(0-100、input+cacheトークンのみで
outputトークンは含まない)と`exceeds_200k_tokens`が既に提供されていることが分かった。
自前でトークン数から使用率を計算するロジックは一切不要だった。

## アクション
statusLine/hookの実装で「値をどう計算するか」を悩む前に、まずstdinで
何が既に提供されているかを公式ドキュメントで確認する。推測でロジックを組んでから
後で「実は直接提供されていた」と気づくと手戻りが大きい。

## 例
`~/.claude/hooks/statusline.sh`は`d['context_window']['used_percentage']`を
そのまま閾値判定に使うだけで実装でき、pipe-testで65%入力時に正しくwarn markerが
書かれることを確認した。

