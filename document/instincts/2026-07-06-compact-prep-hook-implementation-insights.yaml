# marker/pointerファイルで連携するhook群は、読む側だけでなく書く側も全て揃っているか確認する

## 背景
記事のUserPromptSubmit復旧hookは`${TMPDIR}/claude-active-plan/<session_id>`という
pointerファイルを読んで「Active Plan」を案内する設計だったが、記事本文にはこの
pointerファイルを実際に書き込むhookが含まれていなかった(著者の環境では別の仕組みが
既に存在していたと推測される)。実装直後の報告でこの欠落に気づき、ユーザーに
明示的に伝えた上で、別途`~/.claude/plans/`へのWrite/Editを検知してpointerを書く
PostToolUse hookを追加実装した。

## アクション
複数hookがファイル経由で連携する設計を実装するときは、各hookが「読むだけ」か
「書くだけ」かを一覧化し、読む側があるのに書く側が存在しない(またはその逆)
ペアが無いかを完了報告前に確認する。片方だけ実装して「動くはず」と報告すると、
実際には何も起きない機能を「実装済み」と誤解させてしまう。

## 例
`userpromptsubmit-compaction-recovery.sh`(読む側)に対して
`posttooluse-plan-pointer.sh`(書く側、PostToolUse matcher: Write|Edit)を
追加し、pipe-testで実際にplanファイルパスがpointerに記録されることを確認した。

