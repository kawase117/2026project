# 角番効果はorientation依存：水平島のみ有効、縦島では無効

## 背景
Phase 10cの全セグメント分析により、角番効果はorientation（水平/垂直）で根本的に異なることが確定。水平島（h_jug: ε²=0.007, h_nonjug: ε²小だがイベント日交互作用大）では有意、縦島（v_jug/v_nonjug）では無効またはcorner1が最低値。mixed_805はp=0.227で効果なし。

## アクション
- corner_bucket特徴量にはorientation条件を必ず付与する
- h系: corner_bucket（またはrank_from_aisle binned）を特徴量に含める
- v系/mixed: corner関連特徴量を除外するか、ゼロ埋めする
- h_nonjugではイベント日交互作用が必須（非イベント日で逆効果のため）

## 例
feature_engineering:
  h_jug: corner_bucket (standalone OK)
  h_nonjug: corner_bucket × is_event_day (interaction required)
  v_jug: DO NOT USE corner features
  v_nonjug: DO NOT USE corner features
  mixed_805: DO NOT USE corner features

