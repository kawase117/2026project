# h_nonjugのrank偶奇パターンはノイズ（検証済み）

## 背景
Phase 10dでh_nonjug X_DDS日のfine rank分析でrank2,4がrank1,3,5を上回る偶奇パターンが見えたが、追加検証でノイズと確定。Odd vs Even MWU p=0.258。11セクション個別にdelta(even-odd)を計算すると+539～-209で符号がバラバラ。物理配置もy=定数の1列配置で、左右交互という構造は存在しない。

## アクション
- rank偶奇の区別は特徴量にもルールにも使わない
- Phase 10dの少量サンプル（rank1つあたりn≈820）が作った偶然の偏り
- 今後同様の「綺麗すぎるパターン」が出たら、セクション別分解で再現性を確認してからアクションする

## 例
h_nonjug X_DDS Odd vs Even: MWU p=0.258
Section-level delta(even-odd):
  501-522: +539, 523-539: -68, 540-556: -76, 557-573: +273
  574-590: -209, 591-607: +62, 608-623: +43, 624-640: -69
  → 符号がバラバラ、セクション横断の構造的パターンではない

