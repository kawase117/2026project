# DD個別の角番フラグは過学習リスクが高く作るべきではない

## 背景
Phase 10dでDD別corner1 vs restのMWU検定を5セグメント×6DD=30回実施。有意(p<0.05)は8件だがBonferroni補正(α=0.0017)後はh_jug DD=7,14の2件のみ。各セルn=51-54と極めて薄い。DD=7ではh_jug corner1が+643だがh_nonjugは-222、DD=24ではh_nonjug corner1が+895だがh_jugは+175(n.s.)と、DDごとにセグメント間で挙動が逆転する。「DD=7,14,24だけ角番有効日」というフラグ化は、ノイズからパターンを切り出すリスクが高い。

## アクション
- DD個別の角番フラグは作らない
- 特徴量は `corner1 × is_xdds × jug_flag` の粒度に留める（Phase 10cの知見を維持）
- DD個別の差は「存在するかもしれないが現データ量では確定不能」として保留
- ホール側が「14日はジャグ角1、24日はAT角1」という日替わり戦略を取る合理的理由もない

## 例
Bonferroni補正後に有意なDD×segment:
  h_jug DD=7: delta=+643, MWU p=0.001 (survives)
  h_jug DD=14: delta=+696, MWU p=0.001 (survives)
  h_nonjug DD=24: delta=+895, MWU p=0.003 (DOES NOT survive α=0.0017)
30回中2件のみ→特定DDフラグではなく is_xdds 一括が安全

