# DD=24はh_nonjug corner1に高設定投入の再現性が高い（ルールベース補正向き）

## 背景
DD=7 vs DD=24の日別データ深掘りにより、h_nonjug corner1の投入パターンが質的に異なることが判明。DD=24は18日中16日がプラス（平均+1147）で安定。DD=7は18日中8日がマイナス（平均+73）で日ごとのブレが大きい。全体平均（corner1以外含む）はDD=7とDD=24で差なし（MWU p=0.37）→角1だけの投入戦略差。h_jugは逆にDD=7で角1が強い（+747, p=0.001）。ただしn=143（DD=24 h_nonjug corner1全体）、n=8/日と薄く、ML特徴量としての3重交互作用（dd==24 × h_nonjug × corner1）は過学習リスクが高い。

## アクション
- ML特徴量にはしない（過学習リスク）
- 推薦ロジックのルールベース補正として保持: DD=24のh_nonjug corner1を+1段階ブースト
- DD=7ではh_jug corner1をブースト、h_nonjug corner1はニュートラルまたは減点
- セクション523-539のDD=24 corner1は-770で例外（この列だけDD=24に角1を入れない）
- 月次で再現性をモニタリングし、パターン崩壊を検知する仕組みが必要

## 例
DD=24 h_nonjug corner1 日別: 18日中16日プラス, avg=+1147
  高い日: 20250724(+4005), 20260324(+3643), 20250924(+1986)
  低い日: 20250224(-2125), 20250324(-466) のみマイナス
DD=7 h_nonjug corner1 日別: 18日中10日プラス, avg=+73
  ブレ幅: +2229 ~ -1139
DD=7 h_jug corner1: avg=+747, 安定（MWU p=0.001）

推薦ルール案:
  if dd==24 and segment==h_nonjug and rank_from_aisle==1 and section!='523-539':
    boost += 1
  if dd==7 and segment==h_jug and rank_from_aisle<=3:
    boost += 1

