# X_DDS日のfine rank分析は単調減少ではない

## 背景
Phase 10dでX_DDS日のrank 1-5を精密検証。h_jugはrank1=+566が最高だがrank5=+370, rank3=+379と非単調（rank4=+83だけ急落）。h_nonjugではrank2=+669, rank4=+674がrank1=+639を上回り、奇数rankが低い周期的パターンが見える。v系・mixed_805はKW非有意(p>0.2)。

## アクション
- rank_from_aisleの生値を連続特徴量として使うのは不適切（非単調のため）
- corner_bucket（1, 2-4, 5-9, 10+）のバケット化が妥当
- h_nonjugの偶奇パターンは追加検証でノイズ確定（MWU p=0.258、セクション間で符号バラバラ、物理配置も1列で左右交互なし）
- mixed_805のみrank1→5の単調減少が成立するがn=106/rank、統計的に弱い

## 例
h_jug X_DDS fine rank: 1→+566, 2→+351, 3→+379, 4→+83, 5→+370 (非単調)
h_nonjug X_DDS fine rank: 1→+639, 2→+669, 3→+185, 4→+674, 5→+302 (偶数rank優位に見えたがノイズ)
v_jug X_DDS fine rank KW: p=0.617 (no structure)

