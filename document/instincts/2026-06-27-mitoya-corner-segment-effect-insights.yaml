# 縦島では角番効果が存在しない

## 背景
v_jugはKW p=0.123（全日）/ p=0.153（非イベント日）、v_nonjugは全日p=0.001だがcorner1が最低値（-282）という逆パターン。イベントカテゴリ別でもv系は全カテゴリでKW p>0.2（v_nonjug非イベント日のp=0.003のみ例外）。通路から見える位置関係が水平島と根本的に異なり、角番という概念自体が縦島では機能していない。

## アクション
- v_jug/v_nonjugではcorner_bucketやrank_from_aisleを特徴量として使わない
- 縦島には別の位置シグナル（上下端、中央等）の探索が必要かもしれないが、現データでは有意な構造は見えない
- v_nonjugのcorner1は-358（非イベント日）と顕著にマイナス→低設定配置の可能性

## 例
v_jug corner KW: p=0.123 (all_day), p=0.153 (nonevent)
v_nonjug corner1 all_day: avg_diff=-282, n=1410
v_nonjug corner1 nonevent: avg_diff=-358, n=927
v_jug X_DDS corner KW: p=0.644 (no effect even on event days)

