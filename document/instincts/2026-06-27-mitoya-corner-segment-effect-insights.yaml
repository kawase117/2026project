# h_nonjugのcorner1は非イベント日で罠、イベント日のみ有効

## 背景
h_nonjug（水平非ジャグ＝AT機等）のcorner1は全日で+67と弱プラスだが、非イベント日では-160と全バケット最悪。一方X_DDSでは+639、月末では+729と爆発的にプラスになる。ホール側の戦略として「イベント日だけAT機の通路端に高設定を投入し、非イベント日は低設定で回転率を稼ぐ」パターンが推測される。

## アクション
- h_nonjugのcorner1は必ずイベント日フラグとの交互作用項として使う（単体使用は逆効果）
- 非イベント日のcorner1は「避けるべき台」のシグナルになりうる
- Phase 10dで検証済み: DD個別の角番効果はn=54で不安定。DD=7ではdelta=-222（逆効果）、DD=24のみdelta=+895(p=0.003)だが多重比較補正後は境界的。DD個別フラグは作らず is_xdds レベルに留める

## 例
h_nonjug corner1 X_DDS: avg_diff=+639, n=843
h_nonjug corner1 月末: avg_diff=+729, n=121
h_nonjug corner1 非イベント日: avg_diff=-160, n=2593
h_nonjug corner10+ 非イベント日: avg_diff=-117, n=18111

