# h_jugのcorner1は構造的プレミアム（イベント日非依存）

## 背景
Phase 10cで水平ジャグラー（h_jug）のcorner1（rank_from_aisle=1）が全日+463、非イベント日+407、plus_rate 57-59%と、イベント日に依存せず常時プラスであることが判明。rank1→4で+463→+259→+135→+6の単調減少グラデーションが確認された。KW p<0.001だがε²=0.007と効果量は小さい。

## アクション
- h_jugのcorner1（rank_from_aisle=1-3）は「角番ゾーン」として特徴量に組み込む価値がある
- 非イベント日でも有効なため、全日モデルに適用可能
- ただしε²が小さいため、単独特徴量としては弱い。他の軸（DD、末尾）との組み合わせで増幅を検証すべき

## 例
h_jug corner1 all_day: avg_diff=+463, plus_rate=59.1%, n=1610
h_jug corner1 nonevent: avg_diff=+407, plus_rate=57.3%, n=1091
h_jug corner2-4 all_day: avg_diff=+134, n=4710
h_jug corner5-9 all_day: avg_diff=+54, n=7744

