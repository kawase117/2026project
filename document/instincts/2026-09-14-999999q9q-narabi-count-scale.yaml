# 999999Q9Qの「並び◯箇所」は当方の閾値と別スケール。箇所数の一致で採点しない

## Core claim
この発信者は、1台の大勝ちと残りのマイナスで構成される連番も並びとして数える。
当方の strict 定義（全台がホール中央値超え かつ ブロック平均+1800）では、その多くが成立しない。
箇所数を当方の閾値でそのまま採点すると、構造的に外れ判定になる。

## Evidence
- 蒲田1 20260906 の速報「6台並びが5箇所」: strict 2 / 全台がホール中央値超えのみ 4 / 全台プラス 0。
  6月以降100日で、strict の6台並びが5箇所以上あった日は0日
- 蒲田1 20260912 の速報の3台並び10箇所（画像のフッター表記で台番号を確定）: strict で検出 4/10、全台が中央値超え 7/10。
  2048-2050（-1100 / +200 / +13300）、2193-2195（-700 / -600 / +2000）、2311-2313（+2200 / +2600 / -800）のように、
  1台に依存するブロックを含む。30台合計 +76,700枚・勝25/30 で、並びそのものは実在した
- 末尾のラベルも当方の指標と食い違うことがある: 蒲田7 20260912「AT機:共通末尾⑥」は当方のAT残差で7位（ノーマル機の共通末尾①は整合）

## Interpretation
- 発信者は差枚グラフの見た目で並びを数えていると考えられ、strict 閾値は構造的に過少になる
- 「並びが仕掛けの軸だった」という定性的な主張は、当方の本数が平常並みでも否定されない。低稼働日には本数が伸びない（20260912 蒲田1は平均G 3997で、土曜平常4834を大きく下回った）

## Action
- この発信者の並びの箇所数は、strict / 全台が中央値超え / 全台プラス の3定義で数え、換算を記録する。報告に最も近い定義をこの発信者のスケールとして扱う
- 採点の主軸は箇所数の一致ではなく、稼働とホール平均差枚で統制した回帰の予測値との比較にする（backtest/announce/*20260912*.scoring.json の手順）
- 報告の台番号を正解ラベルに使うときは、自動抽出を信用せず、画像のフッター表記とDBの機種名で照合する（20260912 の速報では3箇所を誤読していた）
