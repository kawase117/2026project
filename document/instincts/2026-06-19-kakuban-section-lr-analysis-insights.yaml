# 3軸クロス集計と交互作用分析

## 背景

DD × section_size × LR の 3軸集計を実施時、交互作用（main effect からの乖離）を定量化。

交互作用が小さければ各軸が独立に作用し、細粒度分析は不要。

## アクション

1. 交互作用を計算: observed - (section_effect + lr_effect - grand_mean)
2. 交互作用の std が < 0.2pp なら main effect が支配的
3. この場合、「large島の右側」のような組み合わせは不要

## 例

蒲田7 交互作用範囲: -7.12pp ～ +7.12pp（ノイズレベル）

