# セグメント正規化（dd, rank_from_min, section_size_group 生成）

## 背景

蒲田7分析時、_build_segment_views() で返すフレームに `dd` カラムが存在せず、後続処理で KeyError が発生。

_normalize_segment_frame() を呼び出して、日付から dd を生成し、section_size から section_size_group を導出する必要。

## アクション

1. _normalize_segment_frame() を呼び出し（date → dd, section_size → section_size_group）
2. フロア別フレーム構築後に normalize を呼び出し
3. 必須カラム: date, rank_from_min, section_size, pay_rate

## 例

dd = date.dt.day（日付から日を抽出）
section_size_group = section_size.map(_section_size_group)（small/medium/large）

