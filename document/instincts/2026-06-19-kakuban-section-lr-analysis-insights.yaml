# section_size (実値) vs section_size_group (カテゴリ)

## 背景

section_size（島内の機械台数、数値） と section_size_group（small/medium/large、カテゴリ）が混在。

前回実装で section_size_group に対して section_size_order（カテゴリ）でフィルタしようとして型不一致エラー。

## アクション

1. カラム名で明示的に役割を区別（_size = int, _size_group = str）
2. groupby キーを明示的に指定（section_size_group で filter）
3. テストデータに両カラムを含める

## 例

df[df["section_size_group"].isin(["small", "medium", "large"])]（正解）
NOT df[df["section_size"].isin(["small", "medium", "large"])]（型不一致）

