# フロア座標から LR分割を自動判定

## 背景

蒲田7 の 2F/3F フロア座標 CSV（kakuban, x, y, section）から、各台の左右位置を自動判定。

島内での X座標中央値を基準に「左」「右」を分類し、角番の物理的位置と分類の相関を検証。

## アクション

1. CSV の X カラムを読み込み（rank_from_min をキーに）
2. セクション内 X座標の中央値を計算
3. 各 kakuban について x < x_median なら L, else R

## 例

島「2187-2195」(medium):
- kakuban 1-5: x=38.0 → LR=R
- kakuban 6-9: x=33.0-36.0 → LR=L

