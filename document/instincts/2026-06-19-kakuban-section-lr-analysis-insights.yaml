# セクションサイズ分割 >> LR分割（F値で1000倍差）

## 背景

蒲田7で角番×DD分析を実施時、2つの分割戦略（セクションサイズ vs LR）の有効性を比較。

前提として「Large島の角番11が外側だから高設定」という仮説があったが、実装で物理検証と統計検証を同時に行った結果、**島の左右方向（LR）より、島全体のサイズ（台数）の方が重要**だことが判明。

## アクション

1. 分割戦略比較時は F値を必ず計算（stats.f_oneway で H0 検定）
2. 交互作用分析で「組み合わせ効果」を検証（交互作用 < 0.2pp なら独立）
3. 物理検証で「分類の正確性」を確認（F値が低い理由を区別）

## 例

セクションサイズ F値 vs LR F値（蒲田7, 2F）
- section_size_group: 32.41
- lr_split: 0.03
→ section_size が 1000倍有効

