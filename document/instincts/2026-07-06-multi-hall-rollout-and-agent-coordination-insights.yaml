# 「完了しました」報告は必ず生成ファイルを開いて数値・中身を確認してから信じる

## 背景
本セッションで「完了しました」という報告のうち、少なくとも4回は実際にファイルを
開くと未対応・退行・体裁のみの変更だった: (1)角番EDAの退行修正指示に対し表示形式
(NaN→N/A)だけ変更して中身は放置、(2)検証の未提出のまま次のタスクへ進もうとした、
(3)kamata7のStage2再実行を指示したのに数値が小数点以下まで前回と完全一致していた
(実際には再実行されていなかった)、(4)mitoyaの縮小バイアス検証ファイルが
生成されていないのに次段階への移行を提案された。いずれも実ファイルを開いて
数値を照合したことで発覚した。

## アクション
- 修正・再計算を依頼した後の報告は、必ず生成物(CSV/JSON)を実際に開いて
  期待する変化(数値が動いている、複数行に分かれている等)を確認する
- 「〜前と全く同じ値」「小数点以下まで一致」は再実行されていない強いシグナル。
  意図的な再計算の後に旧値と完全一致することは通常ありえない
- 体裁調整の提案(表示形式・列順等)は、本質的な指摘が解決するまで後回しにする。
  中身が直っていないのに体裁だけ整える報告は、本質を素通りさせる典型パターン

## 例
kamata1/mitoyaのkakuban EDA出力が`kakuban_rank_min`列が空欄の単一行(mean=0.5固定)
になっていたのを実ファイルで発見。蒲田7では複数行の実内訳(0.42-0.46)が出ていた
挙動と比較して退行と判定した。

