# 分散分解による「シグナルなし」の事前予測は独立パイプラインでも再現し、事前スクリーニングとして機能する

## 背景
分散分解で「ジャグ台×日シグナルが検出限界以下(≈0)」と予測した3ホール
(ヒロキ・ザシティ・金時)を、独立に構築した実差枚予測パイプライン(B1R)に
かけたところ、いずれもpositiveにはならなかった(neutral×2、negative×1)。
事前予測と後続の独立検証が一致したことで、分散分解が新規ホール着手前の
投資判断フィルタとして機能することが確認できた。

## アクション
- 新しいホール・機種でML/EDAに着手する前に、まず分散分解でシグナル上限を
  推定し、検出限界以下の対象には日次予測パイプラインを新規に組まない
- 「シグナルなし」予測済みの対象を意図的に本番パイプラインに含めることで、
  パイプライン自体の偽陽性率をチェックする交差検証として利用できる

## 例
ヒロキ・ザシティ・金時は分散分解の予測通りpositiveを出さなかった。
一方でヒロキは名目上negativeが出たが、これは多重比較補正で消える水準であり
「シグナルなし」の予測と矛盾しない。
