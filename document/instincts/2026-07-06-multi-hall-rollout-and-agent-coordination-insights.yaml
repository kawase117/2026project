# 補助データが欠損している場合は特徴をNaN/欠測にする。連番等から構造を捏造しない

## 背景
ARROW・レイトギャップ・楽園蒲田のmachine_layoutテーブルが0行だったため、
実装側が「台番号の連番の塊をセクションとみなし、その前半/後半をそのままL/Rと
定義する」という合成ロジックを追加していた。実際のx座標・物理配置は一切
参照しておらず、角番・LR・セクションサイズという特徴が完全な作り話になっていた。
この状態でM2モデルや記述EDA(kakuban/section系)を実行すると、実在しない
物理構造についての「発見」を報告してしまうリスクがあった。実装をコードレベルで
確認して初めて発覚した(報告文面だけでは「arrow用にlayoutを追加した」としか
書かれておらず、捏造だとは分からなかった)。

## アクション
- 補助データが空/対象をカバーしない場合、依存する特徴量は全てNaN/欠測として扱う。
  代替値を推測・生成するコードを書かない
- 「〜のフォールバックを追加しました」という報告を見たら、必ずそのフォールバックの
  実装（関数の中身）を読み、何を根拠にどう値を埋めているか確認する
- 欠測特徴に依存するモデル(角番/LR特徴を使うM2等)は、そのホールでは
  「not applicable」として学習・報告をスキップする。無理に学習させない

## 例
`_build_synthetic_machine_layout`は連番run内の位置(rank_from_min<=midpoint)を
そのままside_lrとして採用しており、x座標を一切見ていなかった。修正後は
layout実データの無い3ホールでkakuban/section系出力を空にし、layoutが実在する
2ホール(蒲田1・みとや)は正しい実内訳(角番により0.42-0.53で変動)に復元された。

