# N個の独立検定のうちどこかが有意になる確率はNが増えるほど上がる。多重比較補正を必ず併記する

## 背景
9ホールに同一パイプライン(B1R−B0の95%CI検定)を適用した結果、1ホール(みとや)が
名目有意にプラス、1ホール(ヒロキ)が名目有意にマイナスとなった。9回独立に
95%CI検定を行うと、全て真に帰無でも「どこかが偶然有意になる」確率は
1-0.95^9≈37%に達する。みとやの名目p≈0.014はBonferroni補正(×9)後p≈0.126で
非有意に転落し、単独では「発見」と断定できない状態だった。

## アクション
- 複数ホール・複数セグメントに同一検定を反復する設計をした時点で、
  結果表には名目p値だけでなくBonferroni等の補正後水準も併記する
- 「1つだけ有意」という結果は、まず補正後も有意かを計算してから解釈する。
  補正で消える場合は「フォワードテストで再現するまで確定不可」として扱う
- 分散分解等の事前予測で「シグナルなし」と分かっている対象群を意図的に含めて
  比較群として使うと、多重検定パイプライン自体の妥当性を交差検証できる

## 例
9ホール中みとやのみpositive・ヒロキのみnegativeだったが、Bonferroni補正後は
共に非有意。みとやは候補5台を凍結し2026-07-07以降のフォワードテストで
確定させる運用にした。

