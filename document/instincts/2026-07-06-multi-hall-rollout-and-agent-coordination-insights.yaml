# ログファイルの「最新セクションを読んで」という指示は信頼できない。毎回全文自己完結で書く

## 背景
Codexとの連携をintermind(MCP)からログファイル経由に切り替えた後、「このログの
最新セクションを読んで着手してください」という指示を繰り返していた。ユーザーが
Codexに直接「本当にログを確認していますか」と尋ねたところ、Codexは古い版の
セクション(2つ前の裁定)を根拠に挙げ、直近2回分の裁定(退行修正指示・検証未提出の
指摘)には一切言及しなかった。「読んでいる」という自己申告と実際の参照範囲が
食い違っていることが判明した。

## アクション
- サブエージェントへの指示をログファイル蓄積方式で運用する場合、「読んで」に
  依存せず、実行すべき内容を**毎回そのセクションだけで完結するよう全文書く**
  （前提・データ規約・対象ファイル一覧まで再掲する）
- 「ログを確認しましたか」と直接尋ね、返ってきた根拠が直近の指示内容と
  一致するかを照合する。一致しなければ連携方式自体を疑う
- 長時間の反復作業では、連携チャネルの信頼性を時々検査する（本当に最新を
  参照しているかの確認テストを挟む）

## 例
裁定#24以降、指示は「前提の全文再掲＋タスク内容の完全自己完結」形式に切り替えた。
過去のセクションを一切読まなくても、その回の指示文だけで再現できるようにした。

