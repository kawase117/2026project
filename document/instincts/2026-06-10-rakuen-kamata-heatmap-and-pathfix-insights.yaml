# PAGESリストとPAGE_ROUTERは別々に定義されており両方の同期が必要

## 背景
dashboard/config/constants.py の PAGES リストにページが追加されていても、
実際の起動エントリーポイント（main_app.py）の PAGE_ROUTER dict に
対応する import と key:render のマッピングが追加されていないと、
メニューには表示されるがクリック時に「ページ 'X' が見つかりません」になる。
さらに main_app.py と dashboard/main.py の2箇所にPAGE_ROUTERが
重複定義されているため、片方だけ更新すると同様の問題が再発する。

加えて dashboard/pages/__init__.py の import リストにモジュールが
含まれていないと、main.py側のimportそのものが失敗する別経路の
エラーにもなり得る（page_05_last_digit が抜けていたケース）。

## アクション
新しいページを追加する際は以下の3箇所を必ず同期する:
1. dashboard/config/constants.py の PAGES（メニュー表示）
2. dashboard/pages/__init__.py の import / __all__
3. main_app.py と dashboard/main.py 両方の PAGE_ROUTER（importとdict key）

## 例
page_17_heatmap を追加する際、constants.PAGESには登録済みだったが
main_app.py のPAGE_ROUTERにimportとdict entryが無く、
"ページ 'heatmap' が見つかりません" エラーになっていた。
