# フロアマップ画像から座標CSVを生成する手順とU字島の扱い

## 背景
楽園蒲田店 本館3F（machine_number 3107-3266, 160台）の座標生成で確立した手順。
既存の generate_kamata1_coordinates.py / generate_kamata7_coordinates.py と
同じパターンを踏襲しつつ、U字型・並行2列型の島を1セクションとして扱う方法を整理した。

## アクション
1. フロア画像から「物理的な run（連続した行/列の機種番号レンジ）」を抽出する
2. 各 run を (machines, start_x, start_y, step_x, step_y) で表現し add_run() で座標化
3. U字島・2列並行ブロックなど、1つの数値レンジが複数runに分かれる場合は
   add_run() に section=(min,max) を明示的に渡し、rank_from_min/max が
   レンジ全体基準になるようにする（個別runのmin/maxで計算しない）
4. 連続したバンク（同じ物理列）が機種違いで複数あっても、numeric range が
   連続していれば1セクションにマージしてよい（例: 3174-3185を1セクションに統合）
5. validate_rows() で機種番号セット完全一致 + 座標重複なしを必ず検証
   - expected = set(range(start, end+1)) をDB実データ件数と事前に突合
6. 生成後は ASCII グリッド（display_x/yをキーに last_two_digits を表示）で
   視覚的に元画像のレイアウトと一致するか確認する
7. hall_name/floor を正しく設定すれば find_floor_csvs() が自動検出するため、
   page_17_heatmap.py 側のコード変更は不要

## 例
```python
add_run(rows, floor, list(range(3121, 3131)), 6, 1, 0, 1, section=(3121, 3141))
add_run(rows, floor, list(range(3141, 3131, -1)), 7, 1, 0, 1, section=(3121, 3141))
add_run(rows, floor, [3131], 6, 11, 0, 0, section=(3121, 3141))
```
U字島（左列下り→右列上り→底辺1台）を1セクション(3121-3141)として扱う例。

