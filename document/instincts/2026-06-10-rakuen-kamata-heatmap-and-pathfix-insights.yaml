# heatmap_common.py の db_path 解決はHeatmap/ではなくproject_root基準にする

## 背景
render_heatmap_page / render_last_digit_highlight 内の _resolve_path() が
coords_file と db_path を両方 script_dir（Heatmap/フォルダ）基準で解決していた。
しかし db_path は main_app.py/dashboard/main.py で
`Path('./db') / f"{hall}.db"` というプロジェクトルート相対パスとして渡されるため、
"Heatmap/db/{hall}.db" という存在しないパスになりエラーが発生していた。
coords_file（CSV）はHeatmap/直下に置くファイル名なのでscript_dir基準が正しいが、
db_pathだけは project_root = os.path.dirname(script_dir) 基準にする必要がある。

## アクション
heatmap_common.py の両関数で以下のように分岐する:
```python
script_dir = os.path.dirname(os.path.abspath(__file__))
project_root = os.path.dirname(script_dir)
coords_path = _resolve_path(coords_file, script_dir)
db_path = _resolve_path(db_path, project_root)
```
修正後は test/heatmap の全テスト（絶対パス使用のため影響なし）で確認すること。

## 例
修正前: db_path="db/楽園蒲田店.db" → 解決後 "Heatmap/db/楽園蒲田店.db" (存在しない)
修正後: db_path="db/楽園蒲田店.db" → 解決後 "db/楽園蒲田店.db" (project_root基準で正しい)

