# 楽園イベント日定義: DD∈{10,11,22,30} + 強ゾロ目（旧定義は誤り）

## 背景
`document/rakuen_theory.md`の旧記載は「HALL_EVENT_DIGITS=[11,22]」、`eda/section_lateral_expansion.py`のHALL_CONFIGSは「{1,4,7,14,17,24,27,30}」（みとやの定義を誤って転用）と、2つの矛盾する定義が存在していた。DD別の実測スキャン（avg_diff/hit104率/avg_games、全期間2025-01-01〜2026-07-10）でどちらも不正確と判明。

## アクション
```python
event_dds = {10, 11, 22, 30}
strong_zorome = True  # 月=日（例1/1〜12/12）を独立イベント軸として扱う
is_event_day = (date.day in event_dds) or (strong_zorome and date.month == date.day)
```
- DD=22(+188.2), DD=30(+168.5), DD=11(+138.3), DD=10(+147.5)がavg_diffで突出（全体平均+34.5）
- 強ゾロ目は avg_diff +29.2→+174.3、avg_games 2950→4410（+50%）と楽園最強の単一シグナル
- 他ホールのイベント日定義（みとや式{1,4,7,14,17,24,27,30}等）を検証なしに転用しないこと。DD=4/14/24は楽園では平均以下

## 例
`eda/section_lateral_expansion.py`のHallConfigに`strong_zorome: bool`フィールドを追加し`is_event_day()`ヘルパーで判定する実装パターンは他ホールにも展開可能（デフォルトFalseなので既存ホールの動作は変わらない）。

