# 統計的確実性を求めすぎない: watchingステータスでの継続観察を選択肢にする

## 背景
ユーザー指摘（2026-07-12）: 「あなたは確実性を求めすぎに思います。スロットの設定投入にはある程度のランダム性があり、またスロット自体にも引きのブレ、そして投入傾向のトレンドがあります。サンプル数の多さは大事ですが、あまりそればかりを見ても傾向が読めなくなるのではと思います」

## アクション
- p値非有意・ε²閾値未満のセル/変数を「効果なし」と即断せず、`status: watching`として観察継続の選択肢を残す
- 判断材料をp値/ε²だけでなく複数角度に広げる: (1)古典的検定 (2)イベント日/非イベント日間でのランキング入れ替わり(Spearman順位相関) (3)セグメント間の方向一貫性。この3点が揃えば単独のp値が非有意でも「watching」候補として記録する
- ただし小サンプル(n<20程度)由来の極端な効果量は引き続き警戒する（両者のバランスが必要）

## 例
楽園のDD×末尾/端番分析で、`report.md`に「watching候補」セクションを設け、統計的有意性の有無に関わらず差分上位/下位を機械的にリストアップする形式を採用した（`eda/results/rakuen_event_vs_nonevent_tail_hanaban/watching_candidates.csv`）。
