# 楽園: DD×末尾/端番の「強いセル」の大半は周辺効果（DDの強さ）の重ね合わせ

## 背景
ダッシュボード「交互作用エクスプローラ」でDD×hanaban_min、DD×machine_tailの目立つセル（例: DD30×hanaban_min16 n=233 avg_diff+856.5、DD10×末尾1 n=781 avg_diff+456.9）をユーザーが発見。DD限定でのKW検定（そのDD内で軸の水準間に差があるか）を実施したところ、いずれも非有意（p=0.32〜0.49、ε²≈0）だった。

## アクション
- DD30の全hanaban_min水準はほぼ全てプラス、DD10の全末尾水準もほぼ全てプラス——「そのDD自体が強い日」という既知効果が軸全体に一様に乗っているだけ
- 末尾で見ると10桁中6桁で「avg_diffトップ4のDD」が確定イベント日{10,11,22,30}で埋まる——「特定の軸水準がそのDDで特別」ではなく「イベント日はほぼ全水準を底上げする」ことの確認
- 検証手順: (1)そのDD限定で軸内KW検定 (2)軸の全水準でそのセルが浮くか俯瞰 (3)複数の軸水準で「強い日トップN」が同じDD群に支配されるか確認、の3点セットで「真の交互作用」と「周辺効果の重ね合わせ」を切り分ける
- 全体でのDD×hanaban_min検定はp=6.8e-16と有意だがε²=0.0012と極小——n=31万の大標本では些細な効果でも有意になるため、ε²を必ず併記すること

## 例
`dashboard/utils/interaction_analysis.py`の`run_pairwise_axis_test`/`summarize_cells`を直接呼び出せば、この種の検証はCodex委譲不要でメインループから数分で実行できる。

