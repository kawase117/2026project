# 楽園: 本館1FをN家系セグメントに混ぜるとSimpson's Paradoxが発生

## 背景
`dashboard/config/hall_configs/rakuen.yaml`のsegment_scheme初版は「本館_N」として本館1F/2F/3Fを1セグメントに統合していた。実データでは本館1F(N)だけ極端に悪く(avg_diff -997.9円, hit率26.2%)、本館2F/3F(N)は良い(avg_diff +290〜325円, hit率48-50%)。1200円超の差を平均化すると本館フロアの真の差が見えなくなる。

## アクション
- KW検定（本館フロア間、Nセグメント内）: n_groups=3, n_obs=74,434, p=4.5e-235, **ε²=0.0145**——本セッションの他の効果量(0.001〜0.005)より5〜10倍大きい本物の構造シグナル
- `document/plans/hall-analysis-procedure.md`が「フロア分割はA/N分割より優先」と定めている理由の実例。セグメント設計は必ず軸ごとにKW検定で検証してから決めること（仮定で丸めない）
- 新館1F vs 2Fは差が小さく(+328.6円 vs +304.7円)、統合維持は許容範囲

## 例
セグメント設計時のチェックリスト: 「まとめる前に、まとめる候補同士でKW検定+ε²を必ず取る」。ε²が他の変数の判定閾値(このプロジェクトでは概ね0.003〜0.005が「ボーダーライン」)を超えたら分離必須。

