# 楽園: イベント/非イベント分割学習(splitモデル)はbaselineに劣る（蒲田1と逆）

## 背景
蒲田1で有効だった「イベント日はイベント日履歴のみ、非イベント日は非イベント日履歴のみで学習するsplitモデル」を楽園にそのまま適用（event_dds={10,11,22,30}+強ゾロ目、window=90日、min_games=2000、評価120日）したところ、baseline（全履歴混合学習）に一貫して劣った。

## アクション
- イベント日(n=20日)でsplitはbaseline比 precision -1.9〜-2.8pp、差枚excess最大-90.1円（マイナス転落）
- 非イベント日(n=100日)はほぼ互角
- 原因推定: 楽園はセクション構造が本館/新館の建物勾配に支配されており、全履歴学習の方が安定。イベント日サンプルが少ない(n=20日)ためsplit学習がノイズに弱い
- 「他ホールで効いた手法をそのまま移植しない」の実例。`hall-analysis-procedure.md`アンチパターン#1に該当

## 例
運用: 楽園はbaselineモデル（全履歴混合、window=90日、min_games=2000）+ top_k=3〜5のセクション推薦を採用する。イベント/非イベント分割は使わない。

