# 「交替率X%」を主張する前に必ずランダム期待値（chance baseline）と比較する

## 背景
本日、みとやで「セクション交替90%」「末尾交替88-92%」という強いアンチパターンを
発見したと報告したが、後の検証で完全な誤りと判明した。

理由：カテゴリ数が k 個ある変数で、毎回ランダムに「最高カテゴリ」が選ばれる場合でも
「同じカテゴリが連続する」確率は理論上 1/k になる。つまり：
- 末尾（10種類）→ ランダムでも「別末尾に遷移」する確率は90%
- セクション（8-18区画）→ ランダムでも「別セクションに遷移」する確率は86-94%

実際に島内に限定して観測した遷移率は、各カテゴリ数から導かれるランダム期待値と
誤差範囲内（n=50, 標準誤差±4-9%）で一致しており、ホール側の意図的な交替戦略の
証拠にはならなかった。

「○○%が交替する」という数字だけでは、それが「設計された配置転換」なのか
「カテゴリ数が多いだけの当然の帰結」なのか区別できない。

## アクション
日次遷移の規則性（持続率・交替率）を報告する前に、必ず以下を実施する：

```python
n_categories = df[key_col].nunique()
chance_persist_rate = 1 / n_categories  # 一様分布を仮定した最も単純な基準
# より厳密には観測された marginal 分布から chance baseline を導出:
marginal = best_df[key_col].value_counts(normalize=True)
chance_persist_rate_corrected = (marginal ** 2).sum()

observed_persist_rate = ...  # 実測値
se = (chance_persist_rate * (1 - chance_persist_rate) / n_samples) ** 0.5
# 観測値が chance ± 2*SE の範囲内なら「ランダムと区別不可」と判定し、
# 「アンチパターン」「規則性」として報告しない
```

判定基準：観測値とchance baselineの差が標準誤差の2倍を超えない場合、
「規則性なし（ランダム）」と結論し、運用ルールやML特徴量に組み込まない。

## 例
```
誤った報告: 「末尾は88-92%の確率で交替する → 強いアンチパターン」
正しい解釈: 末尾は10種類あるため、ランダムでも90%は「別の値」になる。
            観測値88-92%はランダム期待値90%の誤差範囲内 → 規則性なし。

誤った報告: 「セクションは90%交替する → 意図的な配置転換」
正しい解釈: 8区画のAT島ではランダムでも87.5%は別区画。
            観測値86-90%は誤差範囲内 → 規則性なし。
```

