# 順序変数を二値分類すると「中間」の情報が失われ、誤った結論を導くことがある

## 背景
みとやの角番分析で「rank_from_aisle == 1（通路側）」と「rank_from_aisle == max
（奥側）」の二値だけで分類した結果、「角番の持続率は38-48%でほぼランダム」と
誤った結論に至った。

実際には rank_from_aisle は1〜22の連続的な順序変数であり、各セクションの大半
（約80%）は「中間」のランクに位置する。3カテゴリ（通路側角番／中間／奥側角番）
に分けて平均差枚を比較すると：

AT島:      通路側角番 +637円 > 中間 +285円 > 奥側角番 -204円
ジャグラー島: 通路側角番 +617円 > 中間 +159円 > 奥側角番  +36円

通路側角番は中間の2-4倍の成績であり、これは強い構造的ポジション効果である。
二値分類では「通路側 vs 奥側」の僅差にしか見えなかったが、実際には
「通路側 vs それ以外全部」という圧倒的な差が存在していた。

## アクション
順序変数（ランク・位置・段階等）を分析する際は、まず以下を確認する：
1. 二値分類する前に、各カテゴリにどれだけのデータが含まれるかを可視化する
2. 「両端」だけでなく「中間」を独立したカテゴリとして含めて比較する
3. 二値分類の結果が直感に反する（弱いシグナルしか出ない）場合は、
   分類方法自体を疑い、より細かい粒度で再検証する

## 例
```python
# NG: 両端だけを二値比較 → 中間の情報が失われる
df['is_aisle_corner'] = (df['rank_from_aisle'] == 1)
df['is_far_corner'] = (df['rank_from_aisle'] == section_max)
# → 「通路側 vs 奥側」の比較しかできず、構造的な優位性を見逃す

# OK: 中間を含む3カテゴリで比較してから判断する
df['pos3'] = np.select(
    [df['rank_from_aisle']==1, df['rank_from_aisle']==section_max],
    ['通路側角番', '奥側角番'],
    default='中間'
)
df.groupby('pos3')['diff_coins_normalized'].mean()
```
