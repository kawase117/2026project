# 単価が異なるセグメントを混合した「トップ抽出」は、単価の高いセグメントが常勝するアーティファクトを生む

## 背景
みとやのAT島は ジャグラー島の2.35倍の単価を持つ。「全島混合で日ごとの最高平均差枚
セクションを抽出する」と、102日中82日（80.4%）がAT島から選ばれ、ジャグラー島は
わずか1日だった。

この状態で「セクションが日々入れ替わる」と報告すると、実態は「単価の高いAT島の
内部の区画間でのランダムな勝者交代」を見ているに過ぎず、「ホールが意図的に
配置パターンを変えている」という誤った解釈につながる。

これはみとやに限らず、規模・単価・サンプル数が異なるセグメントを比較する分析
全般に当てはまる一般的な落とし穴である（例：機種別分析で大型機種と小型機種を
混在させてトップ抽出する、ホール別分析で来店客数が大きく異なるホールを混在させる等）。

## アクション
セグメント間で規模・単価・出現頻度に大きな差がある場合：
1. まずセグメントごとの基本統計（平均・分散・出現割合）を確認する
2. 「トップ抽出」は必ずセグメント内で行う（セグメントを跨いだ比較はしない）
3. セグメントを跨いだ比較をしたい場合は正規化（z-score化、ランク変換等）してから行う
4. 「全体でのトップの所属セグメント分布」を必ず事前にチェックし、
   一つのセグメントに極端に偏っていないか確認する

## 例
```python
# NG: セグメントを混合してトップ抽出 → 規模の大きいセグメントが常勝
df.groupby('date')['diff'].idxmax()

# OK 1: セグメント内で完結させる
for segment in segments:
    df[df.segment == segment].groupby('date')['diff'].idxmax()

# OK 2: 事前に「トップの所属セグメント分布」を確認してから判断する
winner_segment_dist = df.loc[df.groupby('date')['diff'].idxmax()]['segment'].value_counts()
# → 一方のセグメントに80%以上偏っていれば、混合トップ抽出は無意味と判断する
```

