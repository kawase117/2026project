# 並びブロックはブロック内で均一と仮定せず、端の台を必ず個別確認する

## 背景
2026-08-24 楽園蒲田、カバネリ(旧筐体)〜超電磁砲の物理的に連続する5台ブロック
（3188-3192、3188-3190がカバネリ・3191がハイパーラッシュ・3192が超電磁砲）で、
カバネリ3台とハイパーラッシュがsite777の途中経過で揃ってプラスだったのを見て
「ブロック全体が強い」と読んだ。ハイパーラッシュを打って-300枚程度で撤退したのは
結果的に正解の判断だったが、ブロック末端の超電磁砲(3192)があまり出ていない点への
注目が不足していた。

## Core claim
機種をまたいだ物理的に連続するブロックが強く見えても、ブロックの端（最初と最後の台）
まで同じ強さとは限らない。中央が強い＝全部強いという前提を置くと、端の台で読み違える。

## Evidence
- n_observations: 1（2026-08-24、カバネリ〜超電磁砲ブロック）
- data scope: single-hall(楽園蒲田), single-day, single-block(5台)
- metric scope: diff(site777速報値)
- result summary: 3188-3191は プラス寄り(site777途中経過)、末端3192(超電磁砲)は
  出玉が弱かった

## Interpretation
- narabi-block-slide-rule等、並びは前回位置からずれることもあり「ブロック内均一」を
  前提にすると外側の台で誤読する
- 単日1ブロックの観察であり一般化はできない。今後同様のブロックで再現するか確認が必要

## Action
- 連続ブロックを評価するときは、ブロックの最初と最後の台を必ず個別に確認する
- 中央が強くても端が弱ければ「ブロック全部が仕掛け対象」と即断しない

