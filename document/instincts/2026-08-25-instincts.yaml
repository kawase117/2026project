# site777分析ではホール平均比で回転数が突出した台を差枚の値に関わらず報告する

## 背景
2026-08-24、ユーザーが「差枚がついていなくても明確に回転数が多い場合は、なんらかの
設定示唆が出ていて回っている場合がある」と指摘し、その後「差枚が横ばいが重要なのでは
なく、回転数が突出して多いことが重要」と訂正した。実例: 台2003(かぐや様は告らせたい)
G=5,123・diff+40（ホール平均G 1,998の2.6倍）、台1040(北斗の拳転生の章2)
G=6,020・diff-160（平均の3倍）。

## Core claim
回転数(games)がホール平均を大きく上回っている台（目安: 平均の2倍以上）は、差枚が
プラスでもマイナスでも横ばいでも構わず、設定示唆に気づいた客の滞在を示す間接シグナル
として報告する。差枚の値でフィルタしてはいけない。

## Evidence
- n_observations: 2（2026-08-24 18:47時点、台2003・台1040）
- data scope: single-hall(楽園蒲田), single-day
- metric scope: games / diff
- result summary: 両台ともホール平均Gの2.5〜3倍。差枚はほぼ横ばい〜微減だったが、
  「差枚が横ばい」は結果的な共通点であって条件そのものではない

## Interpretation
- project-kishu-ichi-decoy（機種内1台だけ高設定で機種平均を持ち上げる撒き餌）とは
  別軸。あちらは差枚が動くシグナル、こちらは客の滞在＝回転数そのものが動くシグナル
  として区別する
- まだ2事例のみ。今後site777分析のたびに機械的にチェックし、事例を蓄積する

## Action
- site777スクレイピング結果を分析するたびに、対象台(graph_eligible)をgames降順で
  ソートし、ホール平均G数の2倍以上の台を機械的に抽出する
- 抽出した台は差枚の値（プラス・マイナス・横ばいいずれも）に関わらず個別に報告する。
  機種全体の評価が弱くても、この台だけは別枠で言及する

