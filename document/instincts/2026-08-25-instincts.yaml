# 攻殻機動隊・化物語・バンドリ！は差枚・回転数が低くても全台系にされていることが多い

## 背景
2026-08-24、ユーザーが実地判断の振り返りで「攻殻機動隊、化物語、バンドリの3つは
差枚と回転数が低くても全にしてあることが多い」と指摘した。これは楽園蒲田での
経験則で、n数・観測期間は未記録。

## Core claim
この3機種（攻殻機動隊・化物語・バンドリ！）は、差枚や回転数といった表面的な
シグナルが弱くても、実際には全台系として高設定が投入されていることが多い。
他の候補機種のように「静かだから今日は対象外」という判断基準が通用しにくい。

## Evidence
- n_observations: 0（ユーザーの経験則としての申告。定量検証はまだ行っていない）
- data scope: 未検証
- metric scope: 未検証
- result summary: なし（今後の観測で検証すること）

## Interpretation
- confidence を低く設定しているのは、この主張がまだ統計的に検証されていない
  ユーザーの経験則であるため。次回以降、実際にこの3機種が低シグナルで全台系
  だった日を記録し、頻度を確認する必要がある
- feedback-statistical-certainty-calibrationと同様、否定も肯定もせず観測を継続する
  対象として扱う

## Action
- 攻殻機動隊・化物語・バンドリ！の当日データが弱くても、候補リストから早期に
  除外しない
- この3機種が低シグナル（差枚・回転数とも低い）で全台系だった/なかった日を
  今後記録し、経験則の妥当性を検証する

