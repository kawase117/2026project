# 「全体では見えにくかったDD」比較テーブルによるセグメント再検証ワークフロー

## 背景
楽園の末尾・端番×DD検定で、全体プールのKW検定結果とセグメント別KW検定結果を横並びで比較する「DD別の勝ちセグメント」テーブル（best_segment, best_p_value, best_epsilon_sq, all_p_value, all_epsilon_sq, epsilon_gap, epsilon_ratio列）を使うことで、「セグメント分割で新規に浮上したDD」を機械的に抽出できた（`eda/rakuen_dd_lastdigit_hanaban_interaction.py`のreport.md §8.1/8.2）。

## アクション
- 全セグメント+全体の計6区分でKW検定+ε²を計算し、DDごとに「最良セグメントのε² / 全体プールのε²」の比（epsilon_ratio）を算出する
- epsilon_ratioが大きい（例: 20倍以上）DDは、全体プールでは薄まって見えなかった可能性が高い候補として優先的に確認する
- sig_segment_count（複数セグメントで独立にp<0.05を達成した回数）が2以上のDDは、単発の偶然ではなく構造的な傾向として信頼度を上げる
- 末尾のようにセグメント分割しても何も出ないケースと、端番のように4件浮上するケースの両方があり得るため、「セグメント分割すれば必ず何か見つかる」という期待は持たないこと

## 例
このワークフローは他ホール（蒲田7/蒲田1/みとや）の変数×DD再検証にも移植可能。既存のsegment_scheme定義があるホールであれば、同じ「6区分KW検定+epsilon_ratio比較」パターンをそのまま適用できる。
