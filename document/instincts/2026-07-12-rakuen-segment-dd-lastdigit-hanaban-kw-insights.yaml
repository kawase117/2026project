# 楽園: 端番×DDのセグメント分割で4件の本物のセグメント固有パターンを発見

## 背景
§7.1の全体プールでの端番×DD検定はDD=30のみ有意(ε²=0.0037)だった。5セグメント別にKW検定+ε²を再計算したところ、全体プールでは見えなかった/薄かったパターンが複数浮上した。

## アクション
| DD | 発見の性質 | 最強セグメント | p/ε² | 全体プールでの値 |
|---|---|---|---|---|
| DD4 | 全体でも境界線上だが本館1F_Nに強く集中 | 本館1F_N | p=0.003, ε²=0.059（本セッション最強） | p=0.007, ε²=0.003（22倍薄い） |
| DD24 | **全体プールでは完全に非有意(p=0.31)なのに本館_A限定だと浮上** | 本館_A | p=0.048, ε²=0.012 | p=0.312（見えていなかった） |
| DD25 | 全体でも境界線上だが本館2F_Nに集中 | 本館2F_N | p=0.030, ε²=0.009 | p=0.041 |
| DD27 | 2セグメントで再現（本館_A含む） | 本館_A | p=0.010, ε²=0.015 | p=0.039 |

DD3も新館_Nと本館2F_Nの2セグメントで独立に有意再現（sig_segment_count=2）。
DD4の結果は§1.1「本館1Fだけ極端に異なる挙動」という発見と端番の面でも整合する。ただし本館1F_Nは21台の少数セグメントなので「参考」扱いで運用する。

## 例
DD24のように「全体プールでは非有意→特定セグメントでは有意」というケースこそがセグメント分割の価値。全体p値だけで変数を切り捨てず、セグメント別に再検証する価値がある（特に本セッションで確立した本館1F_N/2F_N/3F_N/新館_N/本館_Aのフロア別segment_schemeのように、既にSimpson's Paradoxが実証されているセグメント構造がある場合）。

