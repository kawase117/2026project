# 楽園: 末尾×DDはセグメント分割しても新規シグナルなし（本館1F_Nの小サンプルε²のみ目立つがp<0.05に届かない）

## 背景
§7.1の全体プールでの末尾×DD検定は弱かったが、Simpson's Paradoxの可能性を疑い5セグメント（本館1F_N/2F_N/3F_N/新館_N/本館_A）別にKW検定+ε²を再計算した（`eda/rakuen_dd_lastdigit_hanaban_interaction.py`拡張）。

## アクション
- セグメント別トップ5はいずれも本館1F_N（21台の小規模セグメント）が独占するが、最良のDD31でもp=0.081, ε²=0.068とp<0.05に届かない
- 他の4セグメント（本館2F_N/3F_N/新館_N/本館_A）はε²が0.004〜0.009程度でさらに弱い
- 「全体プールでは見えにくかったが分割で浮上したDD」は該当なし（No rows）
- 結論: 末尾は全体でもセグメントでも楽園では使えない変数。この検証を再度繰り返す必要はない

## 例
セグメント分割による再検証は「常に新しい発見がある」わけではなく、「既存の非有意判定が正しかった」ことを確認する場合もある。両方の結果を等しく記録する。

