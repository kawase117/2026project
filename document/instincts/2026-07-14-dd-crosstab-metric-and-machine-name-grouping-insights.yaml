# 部分文字列マッチによる機種グルーピングは、スペックの異なる別機種を1カテゴリに混ぜてしまう

## 背景
eda/dd_crosstab_analysis.py の detect_machine_type() で `"北斗" in name_str` のような部分一致判定を使い、「スマスロ北斗の拳」「北斗の拳 転生の章2」「スマスロ真・北斗無双」「北斗の拳 宿命」という4つの別機種（旧筐体とスマスロ機は確率・払い出し設計が根本的に異なる）を "北斗" という1カテゴリに統合していた。同様に "ジャグラー" というキーワードでも、マイジャグラーV・アイムジャグラーEX-TP・ゴーゴージャグラー3・ジャグラーガールズ・ウルトラミラクルジャグラー・ファンキージャグラー2・ミスタージャグラー・ネオアイムジャグラーEX・ハッピージャグラーVIIIという8〜9種の別機種（それぞれ設定判別要素や機械割レンジが異なる）が1カテゴリに混在していた。ユーザーから「machine_typeは機種名ではないか。似た名前の別機種があるので略し方はやめてほしい」と指摘された。

## アクション
機種別の分析カテゴリを作る際は、部分文字列マッチによる略称グルーピングをせず、machine_name列の値をそのまま（完全一致で）カテゴリとして使う。同一シリーズでも筐体世代（スマスロ/旧規則等）や副題（転生の章2/宿命等）が違えば別機種として扱う。もし意図的に機種ファミリーでグルーピングしたい場合は、実際の distinct machine_name一覧をSQLで確認してから、ユーザーに正式なグルーピング定義（どれとどれを同一視してよいか）を確認した上で実装する。「それっぽいキーワード」だけで自己判断でグルーピングしない。

## 例
NG: `if "北斗" in name_str: return "北斗"` → スマスロ北斗の拳(新世代機)と北斗の拳 転生の章2(旧規則機)が同一視され、差枚・104%超え率が意味をなさない平均値になる。
OK: category列に machine_name の値をそのまま使う（例："スマスロ北斗の拳" と "北斗の拳 転生の章2" は別々の行としてDD別集計される）。SQLで `SELECT DISTINCT machine_name FROM machine_detailed_results WHERE machine_name LIKE '%北斗%'` を実行し、実際に何種類の機種が混在しているかを必ず事前確認する。

