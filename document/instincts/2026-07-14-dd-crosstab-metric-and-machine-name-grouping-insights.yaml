# ホール全体の日次集計値を個別台に merge して「個別台の指標」として使うと、カテゴリ別の差が消える

## 背景
eda/dd_crosstab_analysis.py の初版で、machine_detailed_results（個別台×日）に daily_hall_summary.win_rate（ホール全体の日次勝率）を date キーで merge し、その値をそのままカテゴリ別の hit104_rate 判定（win_rate >= 104）に使っていた。同じ日の台は全て同じホール全体勝率を持つため、カテゴリ（section・machine_tail等）でグループ化しても意味のある差が出ず、ホール全体勝率が104%を超えることはほぼ無いため hit104_rate が常に0.0になった。ユーザーから「機械割104%超えの台が無いなんてありえない」「win_rateはカテゴリ別に算出するもの」と指摘され、既存コード（dashboard/utils/daily_report.py:52-66, eda/hit104_scan.py:58-62）に個別台ベースの正しい実装が既にあることを確認した。

## アクション
「個別台の機械割」は `bet = games_normalized * 3.0; payout_rate = (bet + diff_coins_normalized) / bet * 100.0` で個別台×個別日ごとに計算し、hit104 フラグは `payout_rate >= 104.0` を個別レコード単位で立ててからカテゴリでgroupby.mean()する。「カテゴリ別win_rate」は `diff_coins_normalized > 0`（プラス収支だった台の割合）を個別レコード単位で判定してから平均する。ホール全体の日次サマリーテーブル（daily_hall_summary等）の集計済み値を個別レコードに横展開してカテゴリ別集計の母数に使ってはならない。同種の指標計算スクリプトを書く前に、既存の dashboard/utils/ や eda/ 配下に同じ指標の実装がないか grep で必ず確認する。

## 例
NG: `daily.merge(machine, on="date")` してから `(merged["win_rate"] >= 104).mean()` per category → 全カテゴリで同じホール全体日次値を見ているだけなのでhit104_rateが常に0近辺になる。
OK: `bet = games_normalized*3; payout_rate = (bet+diff_coins_normalized)/bet*100; hit104 = payout_rate>=104` を個別台×日で計算してからカテゴリでgroupby → hit104_rateがホールごとに26.9%〜32.0%の妥当な分布になり、avg_diffとの相関もr=0.76〜0.97と直感的な関係が確認できた。

