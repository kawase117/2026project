# 回転数が少ない大差枚は低設定のマグレ寄り。ただし回転数は結果に影響される

## 背景
ユーザーの見方: 大量の差枚が出ても回転数が少ない(例えば2000G以下)なら、低設定のマグレの可能性が高い。差枚の散らばりは回転数に比例するので、
回転数が少ない台日は大差枚が偶然で出やすい。月次レポートの結果発表の突き合わせで、この見方が入っておらず、1台・低回転の行（例: +105pp）が
「上側の発見」として並んでいた。差枚を回転数と無関係に通常日の分布と比べていたため。
実測(楽園蒲田 7/6〜9/30、48,767台日): 差枚+1000超の確率は G<2000で4.7%、2000〜3999Gで13.5%、4000G以上で38.9%。
機械割は G<2000で-9.8pp、4000G以上で+4.0pp。回転数は結果と独立ではなく、勝てば打ち続け・負ければ早くやめるので、
高回転自体が「勝った」結果を含む(生存バイアス)。

## アクション
- 台日の差枚を通常日と比べるときは、同機種・同じ回転数帯(G<2000 / 2000〜3999 / 4000以上)の通常日と比べる(実装: monthly_report_layer2.g_stratified_ranks)。素の分位は高回転の台日を過大評価する。
- 2000Gは足切りではなく目安。足切り(min_games)は選択バイアスを作るので、「帯を揃えて比べる」「回転数の注記を付ける」で扱う。
- 回転数で揃えても、回転数自体が結果に影響される(ヤメ)ことは残る。低回転=低設定と短絡せず、機械割+信頼区間とボーナス確率も並べる。
- 低回転の大差枚だけを根拠に「入った」と報告しない。
- 差枚=3×回転数×(機械割-1)（ユーザー指摘2026-10-02）。機械割100%未満の設定1・2は、回転数が増える土日ほど差枚がマイナスに伸びる。「回転数が多いと差枚が大きく出やすい」は不正確で、方向は機械割で決まる。回転数の違う日・曜日の強さは、差枚でなく機械割（差枚÷回転数の3倍）で比べる。差枚と回転数は、機械割一定の線（95%、100%、105%、110%）を引いた散布図で見る。
- 予告で指定された台（末尾X・名指し機種）には人が集まり回転数が増える（楽園蒲田の末尾請求: 指定末尾の台は平均5924G、同日同機種のその他の台は3832G）。
  回転数の多い台はRB率・出率が高く見える（当たらなければやめる偏り）。RB率や P(設定4以上)で指定台とその他を比べるときは、
  回転数帯を細かく（2000G刻み）揃える。粗い3帯(2000/4000)だと偏りが残り、RB差は+0.348(見かけ有意)、2000G刻みで+0.123(p=0.12・補正後0.36)に縮んだ。
  P(設定4以上)は回転数に依存するので、指定台とその他の比較には使わない。無関係な末尾のプラセボは人が集まらないので、この偏りを再現できない。

## 例
結果発表の突き合わせ(層2)で、G帯を揃えた分位と素の分位を並べると、G>=4000の台日で素0.871→揃えた0.663に下がる。
