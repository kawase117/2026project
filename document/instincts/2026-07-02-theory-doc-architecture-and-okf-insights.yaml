# OKFはmarkdown+YAML frontmatter+クロスリンクの軽量フォーマットで、専用グラフDBではない

## 背景
kamata7_theory.md の未探索ロードマップにあった「OKFフォーマットへの移行」の実体が不明だったため、
参照先(github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/okf)を実際にfetchして確認した。
OKFは「plain markdown files with YAML frontmatter」であり、markdownのクロスリンクからノード/エッジの有向グラフを導出する。
専用のグラフDBやAPIは不要で、git管理下（ファイルベース）で完結する。

## アクション
OKF移行を検討する際は「重いグラフDB導入」ではなく「frontmatter付きmarkdownファイル＋相互リンク」という軽量な変更として計画する。
既存のInstinct YAML（id/trigger/confidence等のフィールド＋prose本文）は既にOKFのfrontmatter+bodyパターンに近く、大規模な作り直しは不要。
全1231件の一括移行は避け、新規に作る個別台信号レジストリ等から試験導入するのが妥当（project-okf-migration-decision memory参照）。

## 例
OKF構成要素 = bundles/(完成品コレクション) + samples/(recipe+bundle対) + SPEC.md + reference_agent/。
frontmatter必須/推奨フィールド: type, resource, tags, timestamp（+カスタムキー許容）。

