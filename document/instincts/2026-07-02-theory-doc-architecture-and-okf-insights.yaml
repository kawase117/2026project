# theory文書の生成は生データ連結スクリプトで自動化してはならない

## 背景
eda/mitoya_phase5b_theory.py の build_theory_document() がPhase3-8の生データを _read_text() で連結するだけの実装で、
矛盾の調停・耐久性格付け・否定仮説カタログという「有機的判断」を要する作業を代替できていなかった。
この部分だけ他ホール（kamata7/kamata1）のtheory文書と品質が乖離していた。

## アクション
theory文書の新規作成・更新は必ずセッション内での分析者判断（Claude）が行う。
生データの自動集約自体は有用なので、それは別ファイル（例: document/<hall>_evidence_bundle.md）に出力し、theory本体には混ぜない。
eda/mitoya_phase5b_theory.py の OUTPUT_PATH は2026-07-02に document/mitoya_evidence_bundle.md へ変更済み
（ただしスクリプト自体はまだ再実行しておらず、bundleファイルは未生成）。

## 例
kamata7_theory.md / kamata1_theory.md は「なぜ全体集計は信用できないか」「3F_R_Nの結論衝突→解消済み」のような
矛盾調停セクションを持つ。これを生成スクリプトに実装するのは非現実的。
