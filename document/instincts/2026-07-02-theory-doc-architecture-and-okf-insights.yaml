# theory文書が「一部だけ自動生成」の場合、全文を読まずに判断すると誤診断する

## 背景
document/mitoya_theory.md を調査した際、最初の100行程度（Phase3の生データ羅列部分）だけを見て「ファイル全体が自動生成の産物」と誤判断した。
実際には eda/mitoya_phase5b_theory.py の build_theory_document() が生成するのはPhase3〜8（旧ファイルの約1〜1085行目）のみで、
Phase10以降（1087〜1695行目）には否定された仮説カタログ・アンチパターン7類型・ホール間比較・実運用フローという、
既に手作業品質の内容が同居していた。
Readツールが25000トークン超でtruncateされた際、続きをoffsetパラメータで読み切らずに結論を出したことが誤りの直接の原因。

## アクション
長大なdocument/*.mdファイルの生成元（自動 vs 手動）を判断する際は、
(1) 生成スクリプトの出力範囲（output_path、build関数に渡しているPhase番号等の引数）を確認する、
(2) ファイル全体をoffset+limitで最後まで読み切る、
の両方を行ってから結論を出す。truncate通知が出た時点では絶対に判断を確定させない。

## 例
eda/mitoya_phase5b_theory.py の build_theory_document() は phase3_path〜phase8_path のみを引数に取り、Phase9以降は一切扱わない。
main()の呼び出し引数を見れば自動生成の範囲は正確に特定できる。

