# みとやには「hit_rate_104≈0%」と「DD別rate_104=27-34%」という矛盾する2つの数値がInstinctに存在する

## 背景
mitoya-hallwide-low-ceiling-near-zero-hit104 Instinctは「median payout 99.3-100.7%, hit_rate_104≈0%」としている一方、
104%率分析（蒲田7手法をみとやに導入した検証）ではDD別rate_104が27〜34%の範囲で観測されている。
指標定義（ホール平均payoutの閾値判定 vs 台単位でpayout_rate>=104%となった比率）が異なる可能性が高いが、未確認のまま。

## アクション
みとやの104%系指標を使う前に、まずこの2つの数値の算出ロジック（集計単位・分母）を突き合わせて確認する。
確認が取れるまでは差枚(avg_diff)ベースの分析を優先する — 差枚と104%率はSpearman rho=0.873で高相関のため代替可能。

## 例
document/mitoya_theory.md 1章「低天井構造 — 評価軸に未解決の齟齬あり」および7章の未探索ロードマップ#1に記載。

