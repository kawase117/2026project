# 火曜イベント日はゾロ目効果が突出して強い

## 背景
曜日×イベント日の interaction correction（全末尾平均）：
- 火曜・非イベント: +91
- 火曜・イベント: +458（差 +367）

他の曜日と比べて火曜イベント日の上昇幅が最も大きい。
ホール側が火曜のイベント日に特定の末尾ゾロ目台へ集中投入している可能性。

## アクション
- 火曜かつイベント日（7/17/27、1/11/31、22、30、月末、月=日）に該当する場合：
  correction 値がそれほど高くなくてもゾロ目台を積極的に優先する
- 火曜・非イベント日の+91は平均的な水準。特別扱いは不要

## 例
```
今日=火曜・17日（type7イベント）・末尾5: correction=+100（中立帯）
→ 通常なら threshold < 150 でゾロ目を迷うが、火曜+イベント日のため積極的にゾロ目台優先
```

