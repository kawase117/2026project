# イベント日は多くの末尾でゾロ目効果を増幅するが末尾1は逆転

## 背景
イベント日 vs 非イベント日の末尾別 correction 比較（全曜日平均）：

増幅（イベント日 > 非イベント日）:
  末尾6: イベント+434 vs 非イベント-9（差+443）
  末尾8: イベント+159 vs 非イベント-194（差+353）
  末尾4: イベント+93 vs 非イベント-211（差+304）
  末尾3: イベント+152 vs 非イベント-96（差+248）

逆転（非イベント日の方が良い）:
  末尾1: イベント-28 vs 非イベント+144（差-172）← 注意

差なし: 末尾5・末尾9

## アクション
- 末尾4/6/8/3はイベント日にゾロ目を積極的に狙う
- 末尾1はイベント日にゾロ目を避け非ゾロ目台を選ぶ
- 末尾5・9はイベント日かどうかで方針を変えない

## 例
```
今日=イベント日・末尾6: correction=+100（中立帯）
→ イベント日の末尾6増幅効果（+443差）を考慮してゾロ目台優先

今日=イベント日・末尾1: correction=+200（正値）
→ イベント日の末尾1逆転（-172差）を考慮してゾロ目台を避ける
```

