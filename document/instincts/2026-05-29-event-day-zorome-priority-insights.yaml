# 木曜イベント日はゾロ目効果が逆転して不利になる

## 背景
曜日×イベント日の interaction correction（全末尾平均）：
- 木曜・非イベント: +33
- 木曜・イベント: -151（差 -184）

木曜のイベント日に限りゾロ目台が非ゾロ目台より平均151枚悪い。
ホール側が木曜イベント日はゾロ目台以外に高設定を集中させている可能性。

## アクション
- 木曜かつイベント日に該当する場合：
  correction が正の値を示していてもゾロ目台は避け、非ゾロ目台から選ぶ
- 木曜・非イベント日（+33）は弱い正のシグナル。通常どおり correction の符号に従う

## 例
```
今日=木曜・7日（type7イベント）・末尾9: correction=+303（通常なら狙い判定）
→ 木曜+イベント日のため非ゾロ目の末尾9台を選ぶ（correction正でも逆転）
```

