# 曜日 vs イベント日の優先ルール（矛盾日対応）

## 背景
曜日×イベント日の矛盾日（n=3792）での実現値分析：

- 曜日－ かつ イベント＋: 実現値平均 -190、曜日正解率 58.7% vs イベント 41.3%
- 曜日＋ かつ イベント－: 実現値平均 +133、曜日正解率 47.6% vs イベント 52.4%

「曜日がマイナス」のときは過半数の日で実際にゾロ目が不利だった。
「曜日がプラス」のとき、典型的な日（頻度）はイベント信号が正しかった
（ただし外れ値により平均は正）。

注意：全データでシグナルを構築し同データで評価しているため過学習の可能性あり。
方向性の参考として使い、確信を強める補助情報にとどめること。

## アクション
4段階の優先ルール：

1. 曜日correction < 0 → イベント日であっても曜日優先でゾロ目を避ける
2. 曜日correction > 0 かつ イベントcorrection < 0 → イベント信号を優先してゾロ目を避ける
3. 曜日correction > 0 かつ イベントcorrection > 0 → ゾロ目優先（両シグナル一致）
4. 火曜＋イベント日 → 特別に強い（+458）、積極的にゾロ目優先

## 例
```
今日=木曜・イベント日・末尾5（木曜correction(末尾5)=-81、イベントcorrection=+149）
→ ルール1：曜日がマイナスなのでゾロ目を避ける（イベント日でも曜日優先）

今日=水曜・イベント日・末尾2（曜日correction=+404、イベントcorrection=-49）
→ ルール2：曜日はプラスだがイベントがマイナス → イベント優先でゾロ目を避ける

今日=火曜・イベント日・末尾0（曜日correction=+170、イベントcorrection=+294）
→ ルール3+4：両方プラス、かつ火曜イベント日 → 最強のゾロ目優先
```

