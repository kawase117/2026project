# 月=日（例: 5/5、7/7）はゾロ目全末尾で極めて高い correction（要継続観測）

## 背景
月=日（month == day）イベント11日間の correction（全末尾平均）が突出して高い：
  末尾5: +1285、末尾6: +1160、末尾7: +893、末尾8: +953、末尾2: +841

ただし11日のみのサンプルのため統計的信頼性は低い。

## アクション
- 月=日に該当する日は全末尾でゾロ目台を優先する方向で検討
- ただし11日サンプルのため確定判断は保留。継続観測が必要
- 該当日の末尾と台番号が一致する場合（例: 7/7の台77）は特に優先度高い

## 例
```
今日=7/7（月=日イベント）・末尾7: correction=-50（通常なら非ゾロ目）
→ 月=日イベントの特別効果を考慮し、ゾロ目台優先を検討（慎重に）
```

