# 1日予測スクリプト(predict_day.py)をWFエンジンと並行して用意する

## 背景
WFエンジン(walk_forward_engine.py)は全日のバックテスト用で、1日の予測出力には不向き。
実運用では「明日のTOP50を出せ」が必要であり、以下の違いがある:
- WF: 複数日×複数バリアント×複数windowを回す → CSV出力
- predict_day: 1日×1バリアント×全期間train → コンソール+CSV出力

predict_day.pyは score_day() を1回呼ぶだけのシンプルなスクリプトだが、
コマンドライン引数(--date, --db-path)とTOP50テーブル出力を備える必要がある。

## アクション
- `predict_day.py` を `ml/experiments/walkforward_scoring/` に配置
- `python -m ml.experiments.walkforward_scoring.predict_day --date YYYYMMDD` で実行
- trainは全期間（WFの90日窓ではなく）
- コンポーネント個別値もデバッグ列として出力
- スモークテスト（classify_seg健全性、除外セグメント確認、ウェイト合計）を組み込む

## 例
```bash
# 実運用
python -m ml.experiments.walkforward_scoring.predict_day --date 20260622

# 出力: TOP50テーブル + results/predict_20260622.csv
```
