# Lift値からウェイトへの変換は excess=max(0, lift-1.0) の正規化で行う

## 背景
WF166日バックテストで得られたコンポーネント別lift値（例: c4@2F_L_N=1.21）を
そのままウェイトに使うと、lift=1.0（無効）のコンポーネントにも大きなウェイトが配分される。
excess = max(0, lift - 1.0) とすることで:
- lift<1.0（逆効果）は0にクランプされる
- lift=1.0（無効）も0になる
- lift>1.0の超過分のみがウェイトに反映される

lift実測値がないコンポーネント（c3, c6_new）には小さなデフォルトexcess（0.03, 0.02）を設定し、
完全にゼロにはしない。

## アクション
- `excess_i = max(0, lift_i - 1.0)` を全コンポーネントに適用
- `weight_i = excess_i / sum(all_excess) * struct_ratio` で正規化
- lift実測値がないコンポーネントにはドメイン知識に基づく小さなデフォルトexcessを使用
- 全excessが0のセグメントは均等配分にフォールバック

## 例
```
2F_L_N の場合:
  c1: max(0, 1.13-1.0) = 0.13
  c2: max(0, 1.00-1.0) = 0.00  ← 無効なので0
  c3: 0.03 (デフォルト)
  c4: max(0, 1.21-1.0) = 0.21  ← 最大
  c5: max(0, 1.02-1.0) = 0.02
  c6: 0.02 (デフォルト)
  total_excess = 0.41
  → c4のウェイト = 0.21/0.41 * 0.80 = 0.41 (struct_ratio=0.80の場合)
```

