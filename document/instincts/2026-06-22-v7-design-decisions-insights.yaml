# 新ロジックは既存バリアントを変更せず、新バリアント追加で実装する

## 背景
v1-v6dは各々独立した検証結果を持っており、後方互換性が重要。
v7のセグメント別ウェイトを既存の `_score_from_components()` に組み込むと、
v6bの `SEGMENT_WEIGHTS_V6B` と競合し、過去のバックテスト結果が再現不能になる。

v7では:
- `_score_from_components_v7()` を新関数として追加
- `VariantConfig` に `use_v7_weights` フィールドを追加
- `score_day()` 内でフラグに応じて呼び分け
- 既存のv1-v6dは一切変更しない

## アクション
- 新しいスコアリングロジックは常に新関数として追加する
- 既存関数のシグネチャや動作は変更しない
- VariantConfigにboolフィールドを追加してdispatchする
- build_variant_configs()に新エントリを追加するだけ

