# hist比率はhist_hit104のlift値から直接導出する

## 背景
現行モデルではstruct*0.90+hist*0.10が全セグメント共通。
しかしhist_hit104のliftはセグメントごとに0.98〜1.14と大きく異なる:
- 3F_R_N: 1.14（最強）→ hist=0.25
- 2F_L_N/3F_L_N: 1.09 → hist=0.20
- 3F_L_A: 1.05 → hist=0.15
- 3F_R_A: 0.98（逆効果）→ hist=0.05

histが逆効果のセグメント（3F_R_A）でhist比率を高くすると予測が悪化する。
逆にhistが最強のセグメント（3F_R_N）では構造スコアよりhist重視が合理的。

## アクション
- hist_hit104のlift値に応じてhist比率を段階的に設定（0.05〜0.25）
- lift<1.0のセグメントはhist最小（0.05）
- lift>1.10のセグメントはhist大（0.20-0.25）
- struct_ratio = 1.0 - hist_ratio で自動決定

## 例
```python
SEGMENT_HIST_RATIO_V7 = {
    "2F_L_N": 0.20,   # lift=1.09
    "3F_L_A": 0.15,   # lift=1.05
    "3F_L_N": 0.20,   # lift=1.09
    "3F_R_A": 0.05,   # lift=0.98 → ほぼ使わない
    "3F_R_N": 0.25,   # lift=1.14 → 最大配分
}
```

