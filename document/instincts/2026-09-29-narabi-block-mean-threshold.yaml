# 並びブロックの基準は「連続3台の平均+1,000以上」（ユーザー決定）。1台の突出を併記する

## Core claim
並びブロックは、同一列（section）で台番号が連続する3台の平均差枚が+1,000以上、で数える。各台+1,800以上は厳しすぎる（ユーザー決定 2026-09-29）。

## Evidence
- n_observations: 1日（2026-09-29、4ホール）
- data scope: 楽園蒲田・蒲田1・蒲田7・みとや（各1日）
- metric scope: diff
- result summary: 基準ごとの件数（楽園/蒲田1/蒲田7/みとや）
  - A 平均+1,000以上（ご指定）: 22 / 13 / 39 / 13
  - B Aかつ3台中2台以上プラス: 21 / 10 / 33 / 10
  - C Aかつ3台とも0超: 8 / 1 / 13 / 4
  - D 3台とも+1,800以上（従来）: 3 / 0 / 3 / 0

## Interpretation
- 平均基準は1台の大勝ちが2台の負けを隠す。例: 攻殻機動隊2126-2128は [334, 286, +6,858] で平均+2,493、楽園2221-2223は [+4,905, -1,952, +10,477]。「機種1」型の撒き餌が並びに見える。
- 連続する窓は1か所にまとめるため、実際は4〜9台に伸びた区間が多い。
- Aで数えると楽園は22か所で、媒体の「20か所以上」を超える。ただし通常日のAの件数（基準値）は未計測で、22か所が予告の効果なのか日常なのかは分からない。
- 予告の主張は媒体の緩い数え方（`project-media-narabi-count-is-loose`）と混同しない。

## Action
- 答え合わせは **A を主指標にして、B の件数と内訳（各台の差枚）を併記**する。攻殻型の「1台だけ突出」は撒き餌として注記。
- 「◯か所以上が成立」と言う前に、同ホールの通常日のAの件数（直近30日の分布）と比べる。
- `backtest/announce.py` の narabi 採点は未変更（従来基準）。変更する場合は基準の定義を凍結してから、Codexに実装を委任する。

