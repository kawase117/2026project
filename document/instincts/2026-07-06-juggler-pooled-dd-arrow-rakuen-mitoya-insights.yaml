# みとや×ジャグラーガールズはSection的に弱い配置でもDD24だけ設定5〜6級のRB確率が出る

## 背景
みとやのジャグラーガールズは縦島配置で「弱い」Sectionに置かれている機種だが、
DD別RB確率スキャンでは直近60日のDD24だけ突出して高い値(rb_rate_pooled≈1/263.9,
n=12)を示した。ジャグラーガールズSSの設定別RB確率スペック
(ml/experiments/jug_rb_setting_prediction/config.py の "GALS" エントリ)では
設定5=1/270.8、設定6=1/252.1であり、観測値1/263.9はちょうどこの間に入る。
つまりSectionとしては弱い置かれ方をしている機種でも、DD24限定で設定5〜6級の
挙動が出ている可能性がある。ただしn=12は`min_cell_n_for_dd`(5)は満たすが
かなり薄いサンプルで、単発の当たりで確定視するのは早い。

## アクション
- 機種のSection配置の強弱(縦島/横島、角番など)だけで機種のポテンシャルを
  判断せず、DD別に薄いサンプルでも局所的なスパイクがあるかを必ず確認する。
- RB確率の実測値を評価する際は、ml/experiments/jug_rb_setting_prediction/config.py
  の設定別スペック表(rb_probability/bb_probability/payout_rate)と対比して
  「設定何番相当か」で語ると説得力が増す。rb_probability_analysis.py の
  TARGETS辞書(設定4相当のみ)より config.py の方が全設定(1-6)をカバーしており
  詳細な比較にはこちらを使う。
- n=12のような薄いセルは、複数期(次の60日ウィンドウなど)で再現するかを
  確認してから instinct の確信度を上げること。

## 例
`eda/results/juggler_dd_rb_trend/all_halls_dd_profile.csv` の
(hall=みとや, machine_name=ジャグラーガールズ, period=recent60d, dd=24)行:
n=12, rb_rate_pooled=0.003789(=1/263.9)。
config.py: GALS設定5={rb_probability: 1/270.8}, 設定6={rb_probability: 1/252.1}。

