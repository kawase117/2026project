# 蒲田1は全体期間effect_sizeが軒並み閾値未満なのに直近60日は6/9機種で閾値超え：短周期切替の仮説だが未証明

## 背景
蒲田1はジャグラー9機種全てで全体期間のKruskal effect_sizeが0.02未満
(最大0.0121)とほぼ信号ゼロだが、直近60日だけ見ると6/9機種
(ウルトラミラクル/ゴーゴー3/ジャグラーガールズ/ハッピー/ファンキー2/マイジャグ)
でeffect_size>=0.02の信号が出る。これは「長期平均では均されて消えるが、
どの60日窓を切っても中では強い偏りがある(戦略を頻繁に切り替えている)」
という仮説と整合するが、全体期間 vs 直近60日の2点比較だけでは
「一度だけ変わって今の状態が続いている」のか「数週間おきに切り替わっている」
のかを区別できない。

## アクション
- 蒲田1で短周期切替仮説を検証したい場合、直近1年を60日窓4〜6個程度に
  分割し、各窓でtop_ddが窓ごとに入れ替わるか(連続する窓同士のrhoが低いか)
  を確認する連続ウィンドウ分析が必要。既存の`build_hall_pooled_dd_profile`/
  `analyze_machine`はwindow_index=0(直近)/1(全体)の2値設計なので、
  複数窓対応には`machine_dd_recent_window_scan.py`の
  `_window_bounds(window_index=0,1,2,...)`パターンを拡張する。
- 「全体期間で信号なし・直近だけ信号あり」を即座に「戦略変更」と解釈しない。
  同じ理屈は蒲田7・楽園・金時の一部機種にも当てはまるため、蒲田1固有の
  現象と主張する前に他ホールとの発生率比較が必要。

## 例
蒲田1サマリー(game>=2000): ゴーゴージャグラー3 full_effect=0.0081→
recent_effect=0.0210、ジャグラーガールズ full_effect=0.0089→recent_effect=0.0442、
ファンキージャグラー2 full_effect=0.0056→recent_effect=0.0336。
