# 全ジャグラー機種をホール内で合算したDD別RB確率スキャン：ARROW・楽園に5系日パターン、金時は非該当

## 背景
「ゴーゴージャグラーはDD別に上振れる」仮説を機種別に検証すると効果量が小さく閾値
未満のものが多かったが、機種別ではなく**ホール内の全ジャグラー機種を合算**して
DD別RB確率を見ると、ARROWと楽園でだけ明確な「5のつく日(5,15,25系)」パターンが
浮き上がった。ホール横断でのプールは行わず、あくまでhall内でmachine_nameを
横断して合算している(feedback-no-cross-hall-pooling とは矛盾しない)。

具体的な結果(eda/juggler_all_hall_dd_rb_trend_scan.py の
build_hall_pooled_dd_profile、game>=2000フィルタ):
- ARROW: 全体期間top3={15,5,25}、直近60日top3={5,15,25} → 両期間で完全に同じ
  集合(順位のみ入れ替わり)。rho=0.620。effect_sizeは全体0.0135/直近0.0296で
  直近側のみ閾値0.02を超える。
- 楽園: 全体期間top3={25,22,15}、直近60日top3={5,25,11} → 5・15・25・22が
  両期間に散らばって出現し方向性は一致するが、effect_sizeは両期間とも0.02未満
  (0.0059/0.0184)でギリギリ閾値割れ。rho=0.417。
- 金時: 全体期間top3={9,13,23}、直近60日top3={16,26,11} → 5・15・25は
  どちらにも一切出現しない。ユーザーの当初仮説「楽園・ARROW・金時が5のつく日
  傾向」のうち、金時はホール合算で見ても機種別で見ても支持されない。
- その他(みとや/蒲田7/蒲田1/レイトギャップ/ヒロキ/ザシティ)は5系日パターンは
  見られない。

## アクション
- 「5のつく日」戦略はARROW・楽園に限定した仮説として扱い、他ホールや金時には
  適用しないこと。
- 機種別のKruskal-Wallis effect_size(閾値0.02)だけで判定すると弱い信号を
  見逃すため、「ホール内で全機種のtop3 DDが同じ集合に収束するか」を
  補助的な検証軸として併用する。単一機種では閾値割れでも、ホール全体で
  一貫していれば実在する可能性が高い(ARROWは9機種中9機種が5系にヒット、
  金時は2/9で偶然の範囲内だった)。
- 機種別分析からホール合算分析へ切り替える際は、既存の`load_jug_frame`の
  出力(dd, rb_prob, rb_count, games列)をmachine_nameでgroupbyせず全体で
  集計すればよく、`_dd_profile`/`_kruskal_on_rb`/`_format_range`は
  そのまま再利用できる。

## 例
`eda/results/juggler_dd_rb_trend/all_halls_pooled_summary.csv` の
ARROW行: full_top3_dd=[15,5,25], recent_top3_dd=[5,15,25], spearman_rho=0.620。
金時行: full_top3_dd=[9,13,23], recent_top3_dd=[16,26,11]（5系皆無）。

