# Worktree と Main ブランチの同期意識

## 背景
このセッションは worktree（claude/nice-cray-7682e2）で実行されており、main ブランチは別の worktree で使用されていた。編集ツールで修正を加えても、git status がクリーンに見えた理由は、worktree と main が分離されていたから。

## アクション
1. Worktree の現在位置を常に意識する
   ```bash
   git status  # ブランチ名で worktree / main を確認
   ```
2. Worktree でのコミット後、main worktree に移動してマージ
   ```bash
   cd /c/Users/apto117/Documents/pachinko-analyzer/src/2026project
   git merge <worktree-branch>
   ```
3. Main に切り替えたい場合は別の worktree から実行

## 注意点
- 同一ブランチを複数の worktree で使用不可（git error）
- Worktree 内から他の worktree のブランチに切り替えられない
- Push は main worktree からのみ実行可能

## チェックリスト
- [ ] 現在の worktree / ブランチを確認
- [ ] 編集後はコミットを忘れない
- [ ] Main への反映は main worktree で実行
- [ ] Push 前に merge が完了したことを確認

