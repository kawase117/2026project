# グローバルフィルタパターン - Page 16 クロス検索一括

## 背景
複数のクロス検索ブロック（attribute1 × attribute2）を同時表示する場合、各ブロック内で独立してフィルタを提供すると、UIが複雑になり、一括管理ができない。

## アクション
1. ページ冒頭に グローバルフィルタセクション を配置
2. 主要な属性（DD別、曜日別など）の multiselect を用意
3. フィルタ後のデータを各ブロックに渡す
4. 各ブロック内の個別フィルタ UI は削除
5. 空データ時の警告メッセージを用意

## 例
```python
# ページ冒頭
dd_filter = st.multiselect("DD別（日付）で絞り込み", dd_options)
weekday_filter = st.multiselect("曜日で絞り込み", weekday_options)

# フィルタ後のデータ
df_dd_filtered = apply_global_filter(df_prepared, 'DD別', dd_filter)

# ブロックに渡す
render_cross_search_block(df_dd_filtered, "DD別", "台番号末尾", "bulk16_dd_lastdigit")
```

## メリット
- ユーザーが一度のフィルタ選択で全テーブルが更新される
- UIが簡潔で直感的
- 関連データ間の一貫性が保証される

