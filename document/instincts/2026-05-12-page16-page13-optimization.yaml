# Page 13 キャッシング戦略 - パフォーマンス最適化

## 背景
page_13 では8つのタブがあり、タブを切り替えるたびに全ホール DB を再読み込みしていた。DB 読み込み関数に @st.cache_data がなかったため、同じデータが何度も読み込まれていた。

## アクション
1. DB読み込み関数に @st.cache_data(ttl=3600) をデコレータとして追加
   ```python
   @st.cache_data(ttl=3600)
   def load_daily_hall_summary_all(db_path: str) -> pd.DataFrame:
       ...
   ```
2. TTL は 1時間（3600秒）を推奨
3. キャッシュキー自動生成（関数の引数から）

## 効果
- タブ切り替え時の読み込み時間が劇的に短縮
- ネットワークI/O削減
- ユーザーUX向上

