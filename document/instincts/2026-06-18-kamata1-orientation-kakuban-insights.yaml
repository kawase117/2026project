# 斜め島のAT系は全体的に kakuban 効果が弱い --- コーナー回避のみ有効

## 背景
diagonal_N の全 kakuban 分析（2026-06-18）。
全体 Kruskal p=0.15（非有意）。個別検定では kakuban=1 のみ有意（q=0.011）。

全 kakuban の mean/median
  全位置で median は -370〜-451 と深くマイナス
  kakuban=7 (+109) や kakuban=10 (+212) は mean が高いが median は全て負 → アウトライア駆動
  唯一の構造的シグナルは kakuban=1（mean=-130, median=-436）の弱さのみ

## アクション
斜め島でAT系を選ぶとき:
kakuban=1（コーナー端）を回避する。それ以外の位置は統計的に差がない。
高い mean を持つ位置（kakuban=7,10）は median が深くマイナスなので過信しない。
セクション選択（イベント日 x section 2177-2186 など）を主軸とし、kakuban は kakuban=1 回避のみ。

