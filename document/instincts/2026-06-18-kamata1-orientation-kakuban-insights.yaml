# 蒲田1 2F は斜め島・横向き島ともに kakuban=1 が構造的に最弱 --- 島タイプ横断の共通ルール

## 背景
蒲田1 2F 座標を斜め（diagonal）横向き（horizontal）縦（vertical）に分類し
kakuban x 残差分析を島タイプ別に実施（2026-06-18）。

分類方法
  diagonal (斜め島)    x_span>0 and y_span>0  14セクション、173台
  horizontal (横向き島) y_span=0               15セクション、160台
  vertical (縦向き島)  x_span=0               2セクション、27台（サンプル少）

kakuban=1 の全グループ結果
  diagonal_A   overall_p=0.0000, mean=-80,  median=-223, q≈0
  diagonal_N   overall_p=0.1505, mean=-130, median=-436, q=0.011
  horizontal_A overall_p=0.0002, mean=-86,  median=-243, q≈0
  horizontal_N overall_p=0.0001, mean=-99,  median=-400, q=0.0004

全4グループで kakuban=1 が有意（BH補正後）かつ median が深くマイナス。
median が-200〜-436 の範囲で全て負 → アウトライア駆動ではなく構造的シグナル。

## アクション
島タイプを気にせず、kakuban=1（セクション端）を全日回避する。
horizontal_A / horizontal_N / diagonal_A / diagonal_N の全てで一貫して有効。
縦向き島（vertical）は全体p=0.49 で有意差なし → kakuban 制約を適用しない。

