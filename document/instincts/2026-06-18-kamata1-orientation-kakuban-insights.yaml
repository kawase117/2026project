# 横向き島のAT系は両端（kakuban=1 AND kakuban=7）が弱い --- U字構造

## 背景
horizontal_N の全 kakuban 分析（2026-06-18）。
横向き島のAT系では kakuban=1 だけでなく kakuban=7（反対側の端）も低成績。

有意シグナル（q<0.05）
  kakuban=1  q=0.0004, mean=-99,  median=-400, n=11931  端1（明確な最弱）
  kakuban=2  q=0.019,  mean=+69,  median=-330, n=11209  端1隣（mean正）
  kakuban=6  q=0.019,  mean=+118, median=-280, n=4588   最高mean（端2の隣）

kakuban=7（反対端）は有意ではないが mean=-94, median=-426（n=1458）と端1並みに悪い。
kakuban=6（端2の隣）が最高mean (+118) かつ最も median が浅い (-280)。

斜め島（diagonal）は片端（kakuban=1）のみが有意で、反対端は効果なし。

横向き島の主要セクション（Nセグメント）
  右エリア（X=29-39）: 2021-2031, 2032-2042, 2077-2087, 2088-2098, 2121-2131, 2132-2142, 2151-2161 11台島×7本
  左エリア（X=5-18, Y=29-38）: 2167-2176, 2177-2186, 2203-2212, 2213-2222, 2256-2268, 2269-2281, 2317-2330

## アクション
横向き島でAT系を選ぶとき:
kakuban=1（左端または右端）を回避する（n=11931, median=-400）。
kakuban=7（反対端）も避けることを強く推奨（median=-426）。
kakuban=6 を最優先候補とする（mean=+118, median=-280 で最も成績が良い）。
kakuban=2,3 を次点候補とする（mean正）。
斜め島は kakuban=1 のみ回避すれば十分。横向き島だけ両端回避ルールを適用する。

