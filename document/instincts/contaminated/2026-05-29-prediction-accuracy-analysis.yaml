# 3F_Aはモデル相関が特に低い可能性がある

## 背景
2026-05-29の評価で3F_Aが0/3（完全外れ）だった。
- 予測Top3: 末尾7, 9, 3
- 実績Top3: 末尾8, 6, 2（予測と全く重ならない）

3F_AはジャグラーやハナビなどのA型機で構成されるセグメント。
A型機は設定差が出にくく差枚のランダム性が大きい。
また台数が多いため（207台）、末尾別合計差枚にノイズが多い。

## アクション
- 3F_Aの予測Topには「信頼度低め」を付記する
- 3F_Aのみで末尾を強く推奨することは避ける
- combined予測で3F_Aのウェイトを相対的に低く設定することを検討する
- 3F_AのTop3一致率を別途蓄積し、他セグメントとの信頼度差を定量化する

## 例
2026-05-29 3F_A:
  予測: 末尾7(+16中立), 末尾9(-29中立), 末尾3(+190[狙い])
  実績1位 末尾8: +15,200（予測Top5に入っていない）
  実績2位 末尾6: +12,900
  実績3位 末尾2: +11,300
  予測Top3は全て実績6〜8位圏（+500〜+4,100）

