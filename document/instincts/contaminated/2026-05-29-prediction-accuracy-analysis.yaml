# 2F_Nで末尾9がモデルに過小評価されている可能性がある

## 背景
2026-05-29で2F_N末尾9が+15,900（1位）だったが予測Top5に含まれていなかった。
モデルが特定の末尾を系統的に過小評価しているなら、直近実績の確認で補完できる。

## アクション
- 2F_Nの予測Top5外の末尾について直近3〜5日の実績ランキングを確認する
- 直近で連続して上位に入っている末尾は「注目末尾」として付記する
- 末尾9については2F_Nで過小評価されていないか定期的にチェックする

## 例
2026-05-29 2F_N末尾9:
  モデル: Top5外（予測リストに含まれず）
  実績: +15,900（1位、2位の+4,400の約3.6倍）

