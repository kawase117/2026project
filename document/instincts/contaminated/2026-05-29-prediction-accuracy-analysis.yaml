# 単日の精度評価は分散が大きく、モデル評価には使えない

## 背景
2026-05-28の精度: 6/12（50%）
2026-05-29の精度: 3/12（25%）
同じモデルで1日で2倍の差が出た。

末尾Top3の的中はランダム期待値約30%（10末尾からTop3を3個当てる）に対して
1日の試行数は4セグメント=4試行しかない。信頼区間が非常に広い。
モデルの優劣判断には少なくとも20〜30日の蓄積が必要。

## アクション
- 単日の「当たった/外れた」評価は「現象の記録」に留める
- モデル評価は月次（20日以上）のHit@3移動平均で行う
- 単日評価を使う場合は「参考値・1サンプル」と明記する
- 30日移動Hit@3が40%を継続して超えるかを評価閾値とする

## 例
誤った評価: 「28日50%→29日25%。精度が落ちた」→ 1日の差は分散内
正しい評価: 「直近10日間のHit@3平均が35%。ランダム基準（30%）を有意に上回っているか要確認」

