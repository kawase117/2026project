# ゾロ目高補正値[狙い]は不安定。外れる確率が無視できない

## 背景
2026-05-29で[狙い]判定だった末尾の実績：
- 2F_N末尾3: 予測+467 → 実績補正-1,177（全ゾロ目台がマイナス）
- 3F_N末尾5: 予測+360 → 実績補正-1,000（全ゾロ目台がマイナス）
- 3F_N末尾0: 予測+483 → 実績補正+121（方向は合うが微小）

高補正値は長期統計値であり、1日単位では大きく乖離することが多い。
「[狙い]＝当日も高い」とは言えない。

## アクション
- [狙い]判定でも「最有力候補」と断言しない
- 末尾はモデルスコアで選び、ゾロ目補正は「非ゾロ目優先かの判断材料」に留める
- 高補正値に依存したゾロ目台推奨は長期集計が安定するまで行わない

## 例
2026-05-29の[狙い]外れケース:
  3F_N末尾5 補正+360 → 台3055=-900, 台3255=-2,200
  2F_N末尾3 補正+467 → 台2033=-600, 台2133=-400, 台2233=-2,600, 台2333=-1,700

当たったケース（参考）:
  3F_A末尾3 補正+190 → 実績補正+417
  3F_A末尾4 補正+268 → 実績補正+315

