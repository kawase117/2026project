# Feature Set and Model Architecture Are Coupled

## 背景
Phase 9-10 grid search across 4 feature sets × 3 models revealed non-obvious interactions:

| Feature Set | Best Model | AUC | Runner-up | Runner-up AUC |
|---|---|---|---|---|
| all_31d | **XGBoost** | 0.8131 | LightGBM | 0.8021 |
| top_10_only | **XGBoost** | 0.8119 | LightGBM | 0.8110 |
| top_15 | **XGBoost** | 0.8121 | LightGBM | 0.8110 |
| hybrid_antipattern | **LightGBM** | 0.8140 | XGBoost | 0.8102 |

**Insight**: Raw features prefer XGBoost (splits on feature values), but engineered features prefer LightGBM (captures interactions better).

## アクション
1. Don't assume one model is universally best — test multiple models with your feature set
2. For raw/numerical features: XGBoost often performs well
3. For engineered/categorical features: LightGBM's gradient approach may excel
4. Always grid-search across both feature sets AND model families
5. Recognize feature-model coupling: the best feature set + model is not additive

## 例
```python
# Testing feature-model coupling
for feature_set_name, feature_set in [
    ('raw_features', df[raw_cols]),
    ('engineered_features', df[engineered_cols])
]:
    for ModelClass, params in [
        (XGBClassifier, xgb_params),
        (lgb.LGBMClassifier, lgb_params),
        (RandomForestClassifier, rf_params)
    ]:
        model = ModelClass(**params)
        model.fit(feature_set[train_idx], y_train)
        auc = roc_auc_score(y_test, model.predict_proba(feature_set[test_idx])[:, 1])
        print(f"{feature_set_name} + {ModelClass.__name__}: {auc:.4f}")
        # Result: Different feature sets may prefer different models!
```

