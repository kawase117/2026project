# Rank1 AUC Breakthrough: Phase Progression and What Worked

## 背景
Rank1 AUC progression across Phase 9 (台番号末尾別 learning):

| Phase | Method | AUC | Improvement |
|---|---|---|---|
| 9-3 | Individual Models | 0.7920 | Baseline |
| 9-4 | Hyperparameter Tuning | 0.7920 | 0% |
| 9-7 | Ensemble (Voting) | 0.7920 | 0% |
| 9-8 | Stacking + Cascading | 0.7920 | 0% |
| 9-9 | MoE + Calibration | 0.7940 | +0.25% |
| **9-10** | **Feature Selection + Grid Search** | **0.8140** | **+2.78%** |

**What didn't work**: Simple ensembling, stacking, cascading, probability calibration
**What worked**: Careful feature engineering + exhaustive hyperparameter search + model selection

## アクション
1. When facing AUC plateau, try feature engineering before more complex ensembles
2. Grid search across feature sets + models simultaneously (not sequentially)
3. Test domain-engineered features alongside importance-based selection
4. Conservative hyperparameters win on imbalanced data
5. LightGBM may outperform XGBoost on engineered features

## 例
```python
# What to do when single-model and simple ensemble plateau:

# STEP 1: Engineer domain-specific features
domain_features = engineer_features_from_domain_knowledge()

# STEP 2: Grid search across feature sets AND models
best_auc = 0.0
for feature_set in [raw_features, top_k_features, domain_features]:
    for ModelClass in [XGBClassifier, LGBMClassifier, RandomForestClassifier]:
        for params in hyperparameter_grid:
            model = ModelClass(**params)
            model.fit(feature_set[train], y_train)
            auc = evaluate(model, feature_set[test], y_test)
            if auc > best_auc:
                best_auc = auc
                best_config = (feature_set, ModelClass, params)

# STEP 3: Return winner (typically: domain_features + LightGBM + conservative_params)
return best_config
```

