# Conservative Hyperparameters Often Beat Aggressive Tuning

## 背景
Phase 9-10 tested 2836+ hyperparameter combinations. The winning model used surprisingly conservative settings:

**Winning Configuration** (hybrid_antipattern + LightGBM):
```
max_depth: 5 (shallow)
learning_rate: 0.01 (very conservative)
n_estimators: 150 (moderate)
num_leaves: 16 (limited leaf count)
AUC: 0.8140
```

**Aggressive Alternative** (tested in grid):
```
max_depth: 10 (deep)
learning_rate: 0.1 (aggressive)
n_estimators: 300 (many estimators)
num_leaves: 127 (no leaf restriction)
AUC: 0.74-0.77 (worse)
```

**Pattern**: As depth increased and learning_rate increased, performance degraded. Regularization (shallow trees, low LR, leaf limits) prevents overfitting on imbalanced data.

## アクション
1. Start with conservative hyperparameters for imbalanced problems
2. Prioritize regularization over model capacity:
   - Use max_depth 3-7, not 8-20
   - Use learning_rate 0.001-0.1, not 0.1-0.5
   - Limit num_leaves in LightGBM (16-32 often better than 127+)
3. Deeper trees and faster learning rates often hurt on imbalanced data
4. Test the full grid, but expect conservative settings to win

## 例
```python
# Imbalanced classification hyperparameter strategy
param_grid = {
    'max_depth': [3, 5, 7],           # Conservative (not 10-20)
    'learning_rate': [0.001, 0.01, 0.05],  # Low (not 0.1-0.5)
    'n_estimators': [100, 150, 200],  # Moderate (not 500+)
    'num_leaves': [8, 16, 32],        # Restricted (not 127+)
}
# Grid search will likely show: shallow, slow learning beats deep, fast learning
```

