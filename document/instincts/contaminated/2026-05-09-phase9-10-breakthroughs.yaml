# Engineered Features Outperform Raw Features (Even With 75% Fewer)

## 背景
Phase 9-10 tested 4 feature set strategies for Rank1 prediction:
- all_31d: 31 raw/derived features
- top_10_only: 10 features by importance
- top_15: 15 features selected heuristically
- hybrid_antipattern: 8 engineered features (anti-pattern, same_weekday, rolling_rank, weekday-based)

Result: **hybrid_antipattern (8 features) + LightGBM achieved 0.8140 AUC**, beating all_31d (31 features) + XGBoost (0.8131 AUC).

**Critical insight**: Fewer, carefully-engineered features beat more raw features by +9 AUC points.

## アクション
1. Before adding more raw features, invest in feature engineering
2. Design features that capture domain-specific patterns (e.g., anti-pattern, periodicity, momentum)
3. Feature selection often yields better results than feature expansion
4. Consider domain knowledge when designing features, not just statistical importance

## 例
```python
# BAD: Rely on raw features and let model find patterns
features = df[[col for col in df.columns if col.startswith('raw_')]]  # 31 features
model = XGBClassifier(max_depth=3, learning_rate=0.05, n_estimators=150)
auc = 0.8131  # Good, but not optimal

# GOOD: Engineer domain-specific features first
features = pd.DataFrame({
    'anti_pattern_rank1_rate': df['anti_pattern_rank1_count'] / df['anti_pattern_total'],
    'same_weekday_rolling_rank_sum_3': df['same_weekday_rolling_rank_sum_3'],
    'rolling_rank_sum_14d': df['rolling_rank_sum_14d'],
    # ... 5 more engineered features
})  # 8 features
model = lgb.LGBMClassifier(max_depth=5, learning_rate=0.01, n_estimators=150, num_leaves=16)
auc = 0.8140  # BETTER: +0.9 AUC improvement
```

