# Feature Selection: Importance-Based vs Domain-Based Engineering

## 背景
Phase 9-10 tested two feature selection strategies:

**Importance-Based** (top_10_only, top_15):
- Select features by XGBoost importance ranking
- top_10: AUC 0.8119
- top_15: AUC 0.8121
- Result: Moderate improvement, but not optimal

**Domain-Based Engineering** (hybrid_antipattern):
- Select features based on domain theory (anti-pattern, periodicity, same_weekday)
- Ignores importance rankings
- Result: **AUC 0.8140** ← Best

**Key insight**: Domain knowledge sometimes beats statistical feature importance.

## アクション
1. Don't rely solely on importance-based feature selection
2. Combine two approaches:
   a) Statistical importance (what does XGBoost find useful?)
   b) Domain knowledge (what should be useful theoretically?)
3. Features with high theoretical importance might have lower statistical importance (due to poor threshold, interactions, etc.)
4. Engineered features capturing domain patterns often outperform selected raw features

## 例
```python
# Feature Selection Strategy
# Approach 1: Importance-based (fast, but misses patterns)
feature_importance = model.feature_importances_
selected_features_v1 = top_k_by_importance(importance, k=10)
# Result: AUC 0.8119

# Approach 2: Domain-based (requires domain knowledge)
domain_features = [
    'anti_pattern_rank1_rate',      # Behavioral anomaly
    'same_weekday_rolling_rank_sum_3',  # Temporal pattern
    'rolling_rank_sum_14d',         # Momentum
    # ... 5 more engineered features
]
# Result: AUC 0.8140 ← BETTER

# Approach 3: Hybrid (best of both)
importance_features = top_k_by_importance(importance, k=5)
hybrid_features = domain_features + importance_features
# Result: AUC 0.8135+ (excellent)
```

