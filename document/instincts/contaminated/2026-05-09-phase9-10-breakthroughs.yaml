# Grid Search ROI: 2800+ Evaluations for +2.5% Improvement

## 背景
Phase 9-10 conducted exhaustive grid search:
- **2,836 model evaluations** (across 4 feature sets × 3 models)
- **Runtime**: ~60 minutes
- **Improvement**: Phase 9-9 baseline (0.7940) → Phase 9-10 best (0.8140) = **+2.51%**

**Cost-benefit analysis**:
- Phase 9-7 (simple voting): 0 cost, 0% improvement
- Phase 9-8 (stacking): Medium cost, 0% improvement
- Phase 9-9 (MoE + calibration): Medium cost, +0.25% improvement
- Phase 9-10 (grid search): High cost, **+2.51% improvement** ← Best ROI

## アクション
1. For imbalanced classification where small AUC gains matter: grid search pays off
2. 2800+ evaluations for +2.5% is justifiable if:
   - AUC is business-critical
   - Previous phases showed diminishing returns
   - Simple ensembling didn't work
3. Grid search often outperforms heuristic ensemble methods
4. Invest in compute when heuristics stall

## 例
```python
# ROI Comparison: Ensemble vs Grid Search
# Phase 9-7: Ensemble voting (fast, free)
ensemble_auc = 0.7920  # No improvement

# Phase 9-10: Grid search (expensive, effective)
grid_auc = 0.8140  # +2.51% improvement

# For most tasks: ensemble is enough
# For critical tasks: grid search justified
if auc_improvement_needed > 2.0:
    use_grid_search = True
    compute_budget = "1 hour GPU"
else:
    use_ensemble = True
    compute_budget = "5 minutes CPU"
```

