# EDA forward selection の順位 ≠ XGBRanker walk-forward での有効性

## 背景
lag15 は EDA forward selection で rank2 に選ばれた（D3モデルが微増）。
しかし univariate cv_auc=0.4984（負のシグナル）であり、
walk-forward で digit_lag_v5 を試したところ 2F_N hit@2 -0.0069 と劣化。
EDA の「相互作用込みの forward 選択効果」が XGBRanker では再現されなかった。

## アクション
EDA forward selection の結果は候補スクリーニングにのみ使う。
最終的な特徴量の採否は必ず walk-forward 実測で確認すること。
univariate cv_auc が 0.50 を下回る特徴量は採用しない（原則）。

## 例
```
lag15: cv_auc=0.4984 (<0.50) → 危険シグナル
  → forward selection でも rank2 → 相互作用の可能性あり
  → walk-forward digit_lag_v5 → 2F_N hit@2 -0.0069 → 棄却確定

採用基準: univariate cv_auc > 0.50 かつ walk-forward で改善
```

