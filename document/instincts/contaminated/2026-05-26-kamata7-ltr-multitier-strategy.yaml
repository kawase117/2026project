# 多段評価指標セットを標準化：hit@k→topN + cluster23 + sensitivity

## 背景
単純な hit@2（top2命中率）だけでは立ち回り戦略全体を評価できない。
運用は「rank1固定→rank2移行→rank3移行」の多段構造なので、
各ステップで意味のある指標を設計した。

## アクション
以下の指標を標準評価セットとして使用する：
- hit@1→top1: rank1が実際1位になる率（朝一戦略の直接評価）
- hit@1→top2: rank1が実際top2に入る率
- cluster23→top2: rank2/3クラスタがtop2を網羅する率
- cluster23→top3: rank2/3クラスタがtop3を網羅する率
- hit@3→top3: rank1〜3が実際top3を網羅する率（クラスタカバレッジ）
- sensitivity_10pct / 50pct: 抽選シェア別期待差枚

## 例
```python
metrics = {
    "hit_at1_top1": ...,
    "hit_at1_top2": ...,
    "cluster23_top2": ...,
    "cluster23_top3": ...,
    "hit_at3_top3": ...,
    "sensitivity_10pct_A": ...,  # rank1固定
    "sensitivity_10pct_B": ...,  # rank1→rank2移行
    "sensitivity_50pct_oracle": ...,
}
```

