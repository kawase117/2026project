# rank1ミスの47%は重大ミス：ミス質の分解が必須

## 背景
rank1 miss は全体17件。「外れ」と一括りにするのではなく質を分解：
- rank2 外れ（rank1は的中、rank2が外れ）: 95件（軽微）
- rank1 外れ: 17件
  - rank1が実際top2内（微差ハズレ）: 10件（52.9%）
  - rank1が著しく下位（|gap|≥5000枚）: 8件（47.1%）→ 重大ミス
重大ミス（rank1が著しく下位）は全体の約1.9%にすぎない。

## アクション
ミス分析では以下の4カテゴリで分解すること：
1. 2/2 hit（両方的中）: 314件
2. 1/2 hit - rank2外れ（rank1は正しい）: 95件
3. 1/2 hit - rank1微差ハズレ（rank1はtop2内）: 10件
4. 0/2 hit または rank1重大ミス: 3〜8件
モデル改善の目標は「カテゴリ4を減らす」こと。

## 例
```python
def classify_miss(rank1_actual_rank, gap_coins):
    if rank1_actual_rank <= 2:
        return "minor_miss"          # top2内 → 許容
    elif abs(gap_coins) < 5000:
        return "moderate_miss"       # 差小さい → 許容
    else:
        return "critical_miss"       # 重大 → 要因分析対象
```

