# rank2 >> rank3：微差仮説は否定された

## 背景
当初 rank2 と rank3 の差枚は微差であるという仮説が立てられていた。
もしそうなら「rank1 or rank2/3」という束ね戦略が有効になる。
strategy_eval_multitier.txt での検証（ndcg_v2、n=429日）で否定された。

## アクション
rank2 と rank3 は厳密に順序付けること。束ねて扱ってはならない。
- rank2 median 差枚: +11,900枚
- rank3 median 差枚: +7,700枚
- Mann-Whitney U p = 1.15e-34（有意差確実）
立ち回り優先順位: rank1 → rank2 → rank3 → それ以下

## 例
```
# 正しい立ち回り
priority = [rank1, rank2, rank3]  # 順に試みる

# 誤った束ね戦略（棄却）
cluster_23 = [rank2, rank3]  # 微差とみなして同等扱い → NG
```

