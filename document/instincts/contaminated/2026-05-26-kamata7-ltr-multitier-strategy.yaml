# rank1朝一戦略：97.9%は的中または微差

## 背景
rank1 miss (hit@1→top1 外れ) が全体の21.2%。
しかし外れたときに rank1 がどれだけ悪かったかを評価すると、
「的中（78.8%）」＋「微差ハズレ（予測rank1が実際top2に入る 16.5%）」＝ 97.9%。
完全ハズレ（rank1が著しく下位）は約2.1%にすぎない。
Oracle（完全情報）との期待差枚ギャップは約1,000枚/日と小さい。

## アクション
- rank1 朝一戦略を基本方針として採用する
- rank1 を取れなかった場合のみ rank2 → rank3 の順に移行
- hit@1→top2 = 95.3%：rank1 が外れても top2 に含まれる確率が高い
- Oracle ギャップが小さいためモデルによる機会損失は最小限

## 例
```
# 運用シナリオ（抽選結果に応じて）
if rank1_available:
    sit(rank1)      # 78.8% で最高台
elif rank2_available:
    sit(rank2)      # rank1ハズレ時の次善策（gap=11900枚）
else:
    sit(rank3)      # 最終手段（rank2との差=4200枚/日）
```

