# 信頼帯 Case A：undefined<0.001, low<0.10 を採用

## 背景
pred_span_top12（top1予測スコア − top2予測スコア）を信頼度指標として使用。
v2 の3件のミス日すべてで span が低かった。
- 2026-01-04: span=0.000521（undefined）
- 2026-01-11: span=0.000892（undefined）
- 2026-05-21: span=0.001128（low）
Case B の追加閾値0.15 は span 分布の確認から不要と判定。
undefined バンドで overall miss の 8.7% をフラグ化できる。

## アクション
post_rerank.py の build_confidence_band 関数に Case A を実装：
```python
def build_confidence_band(pred_span: float) -> str:
    if pred_span < 0.001:
        return "undefined"   # モデル判断不能 → ユーザーへ警告
    elif pred_span < 0.10:
        return "low"
    elif pred_span < 0.30:
        return "medium"
    else:
        return "high"
```
undefined が出た日は「本日の予測は信頼性が低い」と表示する。

## 例
```
pred_span=0.0005 → undefined → 警告表示
pred_span=0.05   → low       → rank1 推薦・確信度低
pred_span=0.35   → high      → rank1 推薦・確信度高
```

