# 浅いツリー + 保守的な学習率で過学習防止

## 背景
XGBoostなどでデフォルトハイパーパラメータ（max_depth=6, learning_rate=0.3）を使うと、中程度のサイズ（4000-5000サンプル）のデータセットで過学習しやすい。

## アクション
Phase 6BではPCで以下を採用：
- max_depth=3: ツリーの複雑さを制限
- learning_rate=0.01: 保守的な更新（勾配をゆっくり適用）
- early_stopping=10 rounds: 検証指標がプラトーしたら停止

これにより汎化性能が向上し、テストセットでの一貫した性能改善を実現。

