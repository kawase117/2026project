# ターゲットエンコーディングで次元を削減しながら信号を保持

## 背景
ワンホットエンコーディングは高カーディナリティ特徴（機種数など）で3000+次元に膨張し、計算コスト増加・過学習リスク上昇につながる。

## アクション
ターゲットエンコーディング（各カテゴリの目的変数平均）を使うことで：
- 次元削減: 3100+ → 10 次元
- 信号保持: 目的変数との関係を数値化
- 相互作用生成: エンコード値の掛け算で交互作用特徴を作成

Phase 6B実装では +5.6% AUC改善を達成。

## 設計パラメータ
- smoothing=1.0: グローバル平均への正則化強度

