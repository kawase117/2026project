# ツリーベースモデルは特徴量エンジニアリングで初めて力を発揮する

## 背景
XGBoostなどのツリーベースモデルは、ワンホットエンコーディングのような単純な二値特徴では線形モデル（ロジスティック回帰）と同等の性能にとどまる（Δ +0%）。

## アクション
相互作用特徴（interactions）や非線形関係を明示的に特徴量として追加することで、ツリーが効率的に分割でき、大幅な性能改善が実現される。

Phase 6B実装では、複合特徴量（target encoding + interactions）により +5.9% AUC改善を達成。

## 例
- ❌ ワンホットのみ: XGBoost AUC = 0.4908（ロジスティック同等）
- ✅ 複合特徴量: XGBoost AUC = 0.5494（+5.9%改善）

