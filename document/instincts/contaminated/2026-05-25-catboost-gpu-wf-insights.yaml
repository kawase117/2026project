# total_diff_coins_deficit による低迷蓄積シグナル

## 背景
SHAP 分析で 2F_N の miss 日を調査した結果、
efficiency_focus と total_diff_coins_focus が「低迷の見落とし」を引き起こしていた。
miss 日は hit 日よりも efficiency_focus が低く（=低迷台）、
モデルはスコアを下げる方向に動くが、ホールは低迷台に高設定を投入している可能性がある。
total_diff_coins_deficit（7日の差枚実績 vs 28日平均から期待される7日分の差枚）は
Phase A 統計検定（t検定）で p=0.027 となり唯一有意な新特徴量として残った。

## アクション
```python
# tail_ltr_split_rule_wf.py の add_simple_features() 末尾に追加
out["total_diff_coins_deficit"] = (
    out["roll7_total_diff_coins_focus"]
    - out["roll28_total_diff_coins_focus"] / 28.0 * 7.0
).fillna(0.0)
# 注: roll7/roll28 はすでに shift(1) 済みなので追加 shift 不要
# 負の大きな値 = 累積出玉不足 = ホールが仕込む候補シグナル
```

## 例
Phase A 検定結果（2F_N miss vs hit 日比較）:
- total_diff_coins_deficit: p=0.027 ✅ 有意
- efficiency_focus_drought_7d: p=0.31 非有意
- consecutive_below_avg_days: p=0.19 非有意
- relative_efficiency_vs_peers: p=0.44 非有意（横比較は無効）

