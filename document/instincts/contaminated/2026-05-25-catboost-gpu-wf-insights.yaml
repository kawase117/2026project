# CatBoost walk-forward の所要時間見積もり

## 背景
tail_ltr_split_rule_nextday_gpu.py の walk-forward は
testperiod 143日 × expert数（2F_N / 3F_A / 3F_N）= 約430回の再学習を行う。
CatBoost PairLogit は GPU を使っても1ステップあたり数十秒かかるため、
トータルで 2〜4 時間程度の実行時間になる。
GPU を複数プロセスで共有すると倍以上に延伸する。

## アクション
- GPU 独占状態で実行した場合の目安: 2〜3 時間
- 進捗ログが無い場合は出力ディレクトリを定期確認（30分ごと）
  ```powershell
  Get-Item "db\experiments\model_comparison\tail_ltr_catboost_pairlogit_v2*" -ErrorAction SilentlyContinue
  ```
- 出力ファイルが生成され始めたら正常稼働中

## 例
完了後に生成されるファイル例:
- tail_ltr_catboost_pairlogit_v2_testperiod_daily_2F_N.csv
- tail_ltr_catboost_pairlogit_v2_testperiod_daily_3F_A.csv
- tail_ltr_catboost_pairlogit_v2_testperiod_daily_3F_N.csv
- tail_ltr_catboost_pairlogit_v2_comparison_summary.csv

