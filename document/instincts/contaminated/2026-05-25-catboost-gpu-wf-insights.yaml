# CatBoost PairLogit の eval_metric は PairLogit に統一する

## 背景
CatBoostRanker で loss_function="PairLogit" を使う場合、
eval_metric に "QueryRMSE" や "NDCG" を指定すると互換性エラーが発生する。
eval_metric も "PairLogit" に揃える必要がある。

## アクション
```python
# CatBoostRanker 設定
CatBoostRanker(
    loss_function="PairLogit",
    eval_metric="PairLogit",  # QueryRMSE や NDCG は NG
    task_type="GPU",
    devices="0",
    iterations=500,
)
```

## 例
エラーメッセージ例:
```
CatBoostError: Metric PairLogit is not compatible with loss function QueryRMSE
```
eval_metric="PairLogit" に変更して解決。
