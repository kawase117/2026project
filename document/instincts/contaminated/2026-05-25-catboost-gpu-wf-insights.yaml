# CatBoost GPU 有効化の設定方法

## 背景
tail_ltr_split_rule_nextday_gpu.py では model_params をモデル名で分岐させる。
当初 xgb_ モデルにしか GPU 設定が適用されておらず、
catboost_ranker_pairlogit は CPU で動作していた。
CatBoost は task_type="GPU", devices="0" を model_params に渡すことで GPU 利用になる。
なお tail_ltr_full_walkforward_ops.py 側で "device" キーはポップされるが
"task_type" は CatBoostRanker コンストラクタにそのまま渡される。

## アクション
```python
# tail_ltr_split_rule_nextday_gpu.py (line ~482)
if model_name.startswith("xgb_"):
    model_params = _gpu_model_params(args.gpu_backend)
elif model_name == "catboost_ranker_pairlogit":
    model_params = {"task_type": "GPU", "devices": "0"}
else:
    model_params = {}
```

## 例
GPU 使用確認:
```
Warning: less than 75% GPU memory available for training.
Free: 2214.347656 Total: 8187.5
```
この警告は GPU が利用されている証拠（かつ他プロセスとの競合シグナル）。

