# バックグラウンドプロセス重複起動の検出

## 背景
CatBoost walk-forward などの長時間ジョブをバックグラウンド実行する際、
前回のプロセスが終了していないまま再度コマンドを発行すると、
同一コマンドが複数並列起動され GPU リソースを奪い合う状態になる。
本セッションでは4プロセスが同時稼働し、それぞれが GPU を競合させた。
GPU メモリ警告（less than 75% available）はこの兆候のひとつ。

## アクション
1. 新たな学習ジョブを起動する前に必ずプロセスリストを確認する
   ```powershell
   Get-WmiObject Win32_Process | Where-Object {$_.CommandLine -like "*tail_ltr*"} | Select-Object ProcessId, CommandLine
   ```
2. 重複が確認された場合は古いプロセスを1つ残して残りをkill
   ```powershell
   Stop-Process -Id <pid1>, <pid2>, <pid3> -Force
   ```
3. GPU メモリ警告が出たら即座に重複プロセスを疑う

## 例
```
PID 24776 — 開始 20:19, CPU 14565秒, RAM 566MB  ← 最古、残す
PID 31932 — 開始 20:29, CPU 14281秒, RAM 807MB  ← kill
PID 34368 — 開始 20:58, CPU 9603秒,  RAM 2042MB ← kill
PID 30396 — 開始 21:20, CPU 10623秒, RAM 1415MB ← kill
```
Stop-Process -Id 30396, 31932, 34368 -Force

