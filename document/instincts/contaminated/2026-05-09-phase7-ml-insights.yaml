# Moving Average Features Dominate, Temporal Encoding is Redundant

## 背景
Feature importance analysis on 28D set (14D temporal + 15D rolling averages) showed moving averages capture 88-89% of predictive importance. Day-of-week, payday, composite features only 0.4-4.2%. Rolling windows implicitly encode temporal patterns.

## アクション
1. Engineer rolling average features (7/14/21/28/35-day windows) for: diff, games, efficiency
2. Include month_progress only
3. Do NOT engineer explicit temporal features (day-of-week, payday flags)
4. Result: 16D vs 28D, better generalization, no overfitting

## 例
28D → 16D optimization: rank_1 AUC 0.5938 → 0.6114 (+2.96%), simpler model

