# days_since_last_rank1: Target-Dependent Utility

## 背景
days_since_last_rank1 helps top_3/top_5 but hurts rank_1. Not all features are universally beneficial.

## アクション
1. Test new features against ALL targets
2. Accept target-specific feature sets if AUC gains > 1%
3. For rank_1: use 16D (without days_since_last_rank1)
4. For top_3/top_5: use 18D (with days_since_last_rank1)

## 例
18D vs 16D: rank_1 -0.09%, top_3 +3.28%, top_5 +1.17%

