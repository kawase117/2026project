# Use ECE (Expected Calibration Error) for Imbalanced Data

## 背景
Standard practice uses AUC alone for imbalanced classification. But AUC doesn't capture probability calibration. For deployment (e.g., "recommend if P > 0.8"), calibration matters more than discrimination.

## アクション
1. Always measure ECE alongside AUC
2. ECE = |P_predicted - P_actual| across bins
3. Prefer lower ECE even if AUC slightly lower
4. Weight ECE improvements heavily (16.5x-52x transformative)
5. Use Brier score as tiebreaker

## 例
Balanced vs Calibrated: AUC +4.74%, but ECE 52x better (0.1663 → 0.0032)
Trustworthy probabilities matter more for real-world deployment

