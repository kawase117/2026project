# Calibrated Strategy Beats Class Rebalancing

## 背景
Imbalanced binary classification typically uses class rebalancing (scale_pos_weight = neg_count / pos_count) to maximize AUC. However, this destroys probability calibration. In pachinko rank prediction (rank_1: 1.6% positive, top_3: 4.8% positive), testing shows the opposite is true.

## アクション
1. Do NOT use scale_pos_weight rebalancing on imbalanced data
2. Instead, use scale_pos_weight = 1.0 (no reweighting)
3. This preserves probability calibration: P(pred=1) = actual probability
4. Measure success via AUC + ECE (Expected Calibration Error), not just AUC
5. Use predicted probabilities directly as confidence thresholds in deployment

## 例
16D XGBoost rank_1: Balanced AUC 0.6114 → Calibrated AUC 0.6588 (+4.74%), ECE 52x better
18D XGBoost top_3: Balanced AUC 0.6246 → Calibrated AUC 0.6671 (+4.26%), ECE 24.6x better

