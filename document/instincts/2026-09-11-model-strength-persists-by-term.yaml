# 機種の強さは日では読めないがタームでは持続する。恒常的な強さは交絡ではなく本体

## Core claim
「前のタームで強かった機種は次のタームでも強いか」は、**粒度で答えが正反対になる**。

| 粒度 | 相関 |
|---|---|
| 昨日 → 今日 | **0.03**（機種の恒常差を除くと負） |
| 週 → 翌週 | 0.15〜0.51 |
| **月 → 翌月** | **0.20〜0.62** |

日次で測って「読めない」と結論するのは**測る粒度を間違えている**。
2026-09-11 にこの誤りを実際に犯し、「履歴から選ぶ型は店じまい」と提案しかけた。

そして **機種の恒常的な強さは除去すべき交絡ではない。** 約半分はその店の方針であり、
ボーナス確率で確かめると設定が実際に入っている。**それ自体が使える情報である。**

## Evidence
**運用ルールとして回した結果**（先読みなし、選んだ後に当月データを見ない）:

月初に前月上位3機種を選び1か月持つ — 112ホール月、**+117枚/台日 [+86, +149]、月勝率76%、6ホール全部プラス**。
毎日選び直す形は窓の長さで変わる: 30日 +74 / 60日 +115 / 90日 +131 / 120日 +118（いずれも95%CI下限>0）。
**窓を長くするほど良くなり60〜120日で頭打ち。** 日次成分は当たらないので均すほど良い。

順位づけは **出率ではなく平均差枚** で行う（差枚選び +117 / 出率選び +87）。
出率を台日で単純平均すると少回転台の分母が小さく暴れ、その振れを拾う。

選ばれる機種の回転数はホール平均の **0.8倍前後**。空いている機種が選ばれる。
[[feedback-scoring-must-separate-setting-from-pnl]] の G比×差枚とは向きが逆で、
あちらは「その日全台系が入ったか」、こちらは「恒常的に厚いか」を答える別指標。

**強さの中身（8ホール、4店以上にある70機種）:** 約52%がスペック、約48%が店の方針。
店によって扱いが正反対の機種がある:

| 機種 | 上位 | 下位 |
|---|---|---|
| からくりサーカス2 | みとや99% / 雑色96% | 蒲田7 10% / ヒロキ3% |
| 沖ドキ!DUO アンコール | 平和島87% | 楽園4% |
| やじきた道中記参る！ | ARROW 100% | 平和島3% |

**本当に設定が入っているか:** ボーナス確率で判別できる機種に限り、同一機種の中で
月を比べると、出た月はボーナスも自分の平均を上回る。**8ホール全部で相関0.58〜0.66**
（n=2,591機種月）。引きや客付きではない。

## Interpretation
- [[feedback-prevday-exceed-carries-no-info]]（前日の閾値超えは情報ゼロ、絞り込みは
  直近30日の超え率で）と整合する。あちらが日次を否定し窓を推したのと同じ構造
- 店は月ごとに設定1と6を激しく振っているのではない。月ごとのボーナスの振れは
  **運の1.3倍どまり**（蒲田7・蒲田1・みとやが1.6〜1.7倍、ARROW 0.9・ヒロキ1.1は
  運と区別つかず）。**控えめだが継続的な厚み**であり、だからこそ前月が翌月を当てる
- 日次が当たらないこと自体は [[increase-not-new-and-only-seven-days]] と両立する。
  イベント（増台）は日次で効き、恒常的な厚みはタームで効く。別の層である

## 限界
- ボーナス相関0.61は一部が機械的。ノーマル機は差枚がほぼボーナス回数で決まる。
  独立の確認は上の過分散（運の1.3倍）で、こちらは控えめ
- 60日窓の選択は 60〜120日の横ばい区間から選んだもので、最大値（90日）ではない。
  方針変更への追随を優先した（蒲田1は 2026-08-25 店長交代・09-01 投入方針変更）
- 運用ルールの数字はすべて過去データ。フォワードは 2026-09-12 開始
  （`*_model_term60_top3`、6ホール）
- 機種平均であって、その機種のどの台に座るかは別問題

## Action
- 持続性を測るときは **必ず日・週・月の3粒度で出す。** 日次だけを見て結論しない
- 機種の恒常的な強さを交絡として除去する前に、**それ自体が答えでないかを疑う**
- 機種選択は `hist_model_mean_edge`（同日ホール平均との差枚差）で、窓60日以上
- 「この機種はこの店では打たない」をホール別に持つ。沖ドキDUOは平和島なら打つが
  楽園では打たない。スペック表からは出てこない
