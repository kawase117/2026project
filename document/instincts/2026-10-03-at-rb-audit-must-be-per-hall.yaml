# AT機のbb/rb列がAT初当りかどうかは、ホールごとに監査する(全ホールをまとめた平均で判定しない)

## 背景
2026-10-03に、AT機98機種の、DBのbb/rb/bb+rb列が、マスターのAT初当り確率(設定別、またはnotesの範囲)に合うかを監査した。最初は、全ホール(10ホール、約49万台日)をまとめた平均が、設定1〜6の範囲(余裕15%)に入る列で判定し、10機種をAにした。ユーザーの質問(マギアレコード、戦国乙女4、真打吉宗の値は、マスターと近いのか)で、ホール別に見直し、誤りが分かった。
- 全ホールの平均では範囲に入っても、ホール別には入らない。マギアレコードは、マスターの設定1が1/241、設定6が1/184だが、楽園・ARROW・ヒロキ・レイトギャップのbb列は約1/350(設定1より遅く、AT初当りではない)、みとや・ザシティ・マルハン蒲田・金時は1/230〜1/240(合う)。真打吉宗のrb列は、みとや・マルハン・金時が約1/305(設定6の1/355より速い)、楽園・ARROW・ヒロキは1/437〜1/461(範囲内)。つまり、**bb/rbに入る意味(何を数えているか)が、ホールで違う機種がある。**
- ホール間の最大÷最小は、既知の判別可能機種(ジャグラーのRB)で1.05〜1.18。AT機で約1.5になるもの(マギアレコード1.53、新鬼武者3 1.55、真打吉宗1.53、アズールレーン1.51、からくりサーカス2 1.44)は、ホールで列の意味が違う疑いがある。
- bb列(またはrb列)が常に0のホールが多い(楽園の多くのAT機)。このとき、bb+rbはrbと同じ値で、列が2つ範囲に入ったと数えると、判定が不当にBに落ちる。
- 楽園で使えるAT機(ホール別の監査でA、ホール間のばらつき1.3以下): スマスロ北斗の拳(rb、実測1/369)、戦国乙女4(bb、1/223)、ダンベル何キロ持てる?(rb)、盾の勇者の成り上がり(bb+rb、台日524)、邪神ちゃんドロップキック(rb、台日369)。東京喰種、からくりサーカス、真打吉宗などは、楽園では範囲内でも、ホール間のばらつきが大きく保留。マギアレコード、新鬼武者2/3は、楽園では範囲外。モンキーターンVは、列の意味がユーザー確認待ち(保留)。
- 訂正: 「戦国乙女4は、ホール間でほぼ同じ値(1/213〜1/229)なので、設定を反映していない疑い」と指摘したが、既知のジャグラーも1.05〜1.18で同じ範囲で、根拠がなかった。取り下げた。

## アクション
- AT機の列の監査は、**ホール単独の実測**で行う。ホールが違えば、bb/rbに入る意味が違うことがある。`backtest/at_rb_audit.py` と `document/registry/AT_RB_AUDIT.csv`(ホール別)。
- 判定の基準: そのホールの実測が、マスターの設定1〜6の範囲(余裕5%)に入る列が1つだけ、台日300以上、分散比5以下。bbかrbが常に0なら、bb+rbは別の列として数えない。ホール間の最大÷最小が1.3を超える機種は、使わない(確認待ち)。
- `load_specs(hall="楽園蒲田店")` のように、**ホールを渡したときだけ**AT機の判別が有効になる。ホール未指定では有効にしない。
- 「全ホールをまとめた平均が範囲内」は、列の意味が合っている証拠にならない。複数ホールをまとめて確認するときは、必ずホール別の値も並べる。
- 新しいホール・新しい機種を監査するときは、ユーザーに、bb/rbの意味(何を数えているか)を確認する。

## 例
マギアレコードは、全ホールをまとめるとbbが1/267で、設定1(1/241)の近くに見える。楽園だけだと1/350で、設定1より遅く、AT初当りの数として成り立たない。
