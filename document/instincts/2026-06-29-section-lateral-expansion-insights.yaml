# みとやはTop2セクションが固定（予測不要）

## 背景
みとや大森町店のセクション予測 walk-forward 評価で、Top1セクションが60日中2種類のみ（501-522が33日、574-590が27日）、Top3セットは3パターンだけ。セクション間の序列がほぼ固定されている。

## アクション
みとやでは walk-forward モデルを回す必要がない。501-522（22台）を第一候補、574-590（17台）を第二候補として固定運用する。ただし機種入替でセクション構成が変わった場合は再評価が必要。

## 例
Top1分布: 501-522 (33/60日) vs 574-590 (27/60日)
Top3 unique sets: 3パターン / 60日
section_lift: 1.25x (top_k=1)

