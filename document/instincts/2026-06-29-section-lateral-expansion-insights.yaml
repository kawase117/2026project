# 楽園はフロア統合ではなくフロア別分析が必要

## 背景
楽園蒲田店は5フロア（本館3F+新館2F）に569台が分散。全フロア統合でのセクション予測は lift=1.33x と高いが、rho=0.15 (p=0.41) で有意性なし。Top5入替が57/60日とほぼ毎日変動し不安定。フロア別では本館1Fのみ lift=1.37x で有望、本館2Fは lift=0.89x で逆効果。

## アクション
楽園でセクション予測を本番化する場合:
1. フロア統合モデルは使わない
2. 本館1Fのみに絞って再検証
3. ミニセクション（2-3台が9個）の除外を検討
4. 新館2Fの2004-2007セクションは個別深掘り済み（別instinct参照）

## 例
全体統合: lift=1.33x, rho=0.15, Top5 sets=57/60 → 不安定
本館1F: lift=1.37x → 有望
本館2F: lift=0.89x → 逆効果

