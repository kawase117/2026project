# セクション予測のホール類型化

## 背景
蒲田7・蒲田1・みとや・楽園の4ホールでセクション予測を walk-forward 評価した結果、3つの類型が判明した。

## アクション
新ホールにセクション予測を適用する際は、まず60日 walk-forward の Top3 unique sets 数で類型を判定する:
- 固定効果型 (Top3 sets <= 5): みとや型。予測モデル不要、決め打ちで十分
- 有効型 (Top3 sets 10-20, rho > 0.1): 蒲田7型。walk-forward モデルに価値がある
- ランダム型 (rho <= 0, Top1が3種以下でも lift > 1.0): 蒲田1型。上位セクション決め打ちは有効だが順位予測力なし

## 例
みとや: Top3 sets=3/60, rho=0.20(k=5), lift=1.25x → 501-522に行くだけでOK
蒲田7: Top3 sets=13/60, rho=0.19(k=5), lift=1.24x → walk-forward が有効
蒲田1: Top3 sets=9/60, rho=-0.06(k=3), lift=1.17x → 上位決め打ちのみ有効、順位予測は無意味

