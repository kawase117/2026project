# ミニセクション（4台以下）のスコア不安定性

## 背景
蒲田1の1631-1633（3台セクション）がスコア最高（0.366）・hit_rate 44.9%でTop1を25/60日占有。しかしDD別分析でhit104率が11.1%-50.0%と変動しており、サンプルサイズ不足による見かけの強さの可能性が高い。

## アクション
section_size <= 4 のセクションがランキング上位に来た場合:
1. mini_section_audit.csv の section_score_std を確認（std > 0.015 なら不安定）
2. DD別・曜日別の分布が均一かチェック（特定条件だけで稼いでいないか）
3. 可能であればミニセクション除外後に rho を再計算し、ランキング歪みの影響を測定

## 例
蒲田1 1631-1633: section_score_std=0.010だが3台x18日=54試行のDD分析は信頼性不足
蒲田7 3400-3401: 2台セクション、std=0.014、56日出現 → 同様に不安定

