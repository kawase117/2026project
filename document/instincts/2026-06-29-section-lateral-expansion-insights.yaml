# 蒲田1はセクション予測が効かない

## 背景
蒲田1は360台・31セクション・529日のデータで walk-forward 評価を実施。rho は全 top_k でほぼゼロか負（-0.06〜0.02）。lift > 1.0 は上位セクション決め打ち効果であり、順位予測力ではない。min_games を 3000 に上げても rho=0.085 で有意水準に達しない。イベント日限定にしても改善なし。

## アクション
蒲田1では:
- セクション予測パイプラインの投入は見送る
- 代替として DD×角番、機種別分析を検討
- 上位セクション（2167-2176, 1631-1633）への決め打ちは有効（lift 1.17x）だが予測モデルの価値は低い

## 例
min_games=1000, top_k=3: rho=-0.063, lift=1.167
min_games=3000, top_k=10: rho=0.085, lift=1.044
event_only, top_k=3: rho=-0.102, lift=1.146

