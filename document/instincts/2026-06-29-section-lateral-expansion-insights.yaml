# 蒲田1・楽園のイベント日定義は未精査

## 背景
蒲田1のEVENT_DDSは蒲田7と同じ{1,7,11,17,21,22,27,31}を仮定で流用。楽園は{1,4,7,14,17,24,27,30}をみとやから流用。いずれもホール固有のイベント日精査は行っていない。蒲田1のDD=27がhit104=11.8%と異常に弱い（蒲田7ではイベント日扱い）という矛盾が出ている。

## アクション
蒲田1・楽園で EVENT_DDS を分析に使う前に:
1. DD別の機械割分布からイベント日候補を独自に特定する（みとやで実施済みの手法を適用）
2. 蒲田7のイベント日定義をそのまま流用しない
3. 特に蒲田1のDD=27は「7のつく日」だが実績が弱く、蒲田1固有の定義が必要

## 例
蒲田1 DD=27: hit104=11.8% (全DD中最弱) ← 蒲田7のイベント日定義では「7のつく日」
みとやのイベント日精査手法: DD別hit104率の分布からbreakpointを検出
