# 蒲田1 1631-1633は土日に偏った3台ミニセクション

## 背景
Codex深掘り分析で蒲田1の1631-1633（3台セクション、現行HEY!鏡）を DD別・曜日別・台別に分析。土日の hit104 が 39.5%/36.8% と平日（25-32%）を大きく上回る。avg_games=1474で低稼働寄り。DD別ではDD=11(50%), DD=2/9(44.4%)が強いが、3台x18日=54試行でサンプル不足。

## アクション
1631-1633を狙う場合:
- 土日に限定する（hit104: 39.5%/36.8%）
- DD=11, 2, 9, 21 が強DDだが統計的信頼性は低い
- 1631が最安定、1633は差枚が弱め
- 3台セクションのため、セクションスコアの安定性は inherently 低い

## 例
曜日別hit104: Mon=29.3, Sat=39.5, Sun=36.8
DD別hit104: DD11=50.0, DD27=11.8 (極端な差はサンプルサイズ由来の可能性)
台別: 1631=安定, 1632=土曜特化, 1633=金曜14.7%で極弱

