# 入替の有無は「率」ではなく「同一個体か」で確認する

## Core claim
ある集団（例: カテゴリで絞った端番の台）の入替を調べるとき、月次の入替率
（前月から機種名が変わった割合）だけを見ると誤判定する。カテゴリでフィルタした
後の集団は、フィルタ前の対象がカテゴリ自体をまたいで出入りするため、入替率が
低くても対象個体の顔ぶれは大きく変わりうる。実際に「同じ個体か」を月次リストの
差分で直接突き合わせる必要がある。

## Evidence
- n_observations: 1（楽園蒲田・技術介入clean列端番の失効原因調査、2026-07-31）
- data scope: single-hall
- metric scope: 台番号ロスターの月次差分
- result summary: 「技術介入かつclean列端」という集団で月次入替率を計算すると
  0%だったため一度は「同一個体のまま効果が消えた」と結論したが、実際には
  対象自体が別カテゴリ（AT一般）へ入れ替わって集団から抜けており、
  月次の実台番号リストを直接比較して初めて誤りだと分かった

## Interpretation
- 「カテゴリXの中での入替率」は、カテゴリの境界をまたぐ出入り（Xから消える／Xに現れる）
  を検出できない。分母（対象数）自体が変わるとレートは意味を失う
- 対象数が一桁〜十数台の小集団では、この種の境界またぎの出入りが結果を
  丸ごと反転させるほどの影響を持つ

## Action
- 「効果はアーティファクトではない」と結論する前に、月次（または該当期間ごと）の
  実個体リストを並べて直接差分を取る。率の一致だけで済ませない
- 特に「カテゴリで絞った後の位置系集団」を扱うときは、絞り込み前のカテゴリ変化も
  合わせて確認する

