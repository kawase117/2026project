# 3F_R_Nはkakuban+dow*kakubanの2コンポーネント等配分が最適

## 背景
3F_R_Nでは個別コンポーネント（hist+155, kakuban+133, dow+122）がそれぞれ「maybe」だが、6コンポーネント合成(composite=+62)でnsに劣化する問題があった。2-3コンポーネント組み合わせを網羅検証し、kaku+dow(50:50)が+170(p=0.004)で最強と判明。4-fold temporal CVでも+140(p=0.022, 4/4 fold一貫)で確認。

## アクション
v11のSEGMENT_WEIGHTS_V11で3F_R_Nは(0.50, 0.00, 0.00, 0.50, 0.00, 0.00)を使用。c2(hist), c3(DD*kakuban), c5(digit), c6(zorome)は全てゼロ。walk-forward検証でv6a比+55/日(p<0.05)の有意改善を達成。

## 例
3F_R_N非イベント日:
- composite(v6a 6comp): +62 (ns, p=0.37)
- hist単体: +155 (maybe, p=0.011)
- kaku+dow(50:50): +170 (p=0.004) ← 最強
- v11実装後walk-forward: v6a -127 → v11b -72 (WORSE幅43%縮小)
