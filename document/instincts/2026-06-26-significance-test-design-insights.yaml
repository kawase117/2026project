# インサンプル検証は過学習を見逃す: 4-fold temporal CVが必須

## 背景
セグメント別重みをインサンプルで検証したところ、2F_R_N非イベント日が+114(p=0.008)で「ADOPT」判定。しかし4-fold temporal CVでは-2に崩壊し、完全な過学習だった。3F_L_Nイベント日も+208(in-sample) → -38(CV)で同様。

## アクション
重み最適化は必ず4-fold temporal CV（2ヶ月ブロック×4、3ブロックで設計→1ブロックで検証）で検証する。ADOPTの基準: (1) p<0.05, (2) 4foldのうち3fold以上で改善方向。差枚の減少トレンドがあるため単純な前半/後半分割は避ける。

## 例
2F_R_N: in-sample p=0.008(+114) → CV fold deltas: +46/-31/-37/+15 → 不安定、棄却
3F_R_A: in-sample p=0.001(+46) → CV fold deltas: +63/+50/+52/+31 → 4/4一貫、採用

