# 全セグメント一括の重みは情報を破壊する

## 背景
デフォルト重み(c1=0.40,c2=0.15,c3=0.20,c4=0.15,c5=0.05,c6=0.05)は全セグメント共通。コンポーネント分解で、セグメントごとに有効なコンポーネントが全く異なることが判明。特に3F_R_Nでは個別コンポーネント（hist+155, kakuban+133, dow+122）がそれぞれ「maybe」だが、composite=+62(ns)に落ちる「合成劣化」が発生。

## アクション
v11ではセグメント別重みを実装。4-fold temporal CVで検証し、out-of-sampleで有意(p<0.05)だった3件のみ採用:
- 3F_R_A: (.28,.39,.03,.00,.30,.00) → p=0.001, 4/4 fold一貫
- 3F_R_N: (.30,.35,.00,.28,.04,.02) → p=0.046, 3/4 fold一貫
- 2F_L_N: (.34,.47,.05,.00,.07,.07) → p=0.094, 4/4 fold一貫

## 例
3F_R_A非イベント日: default +79 → v11 +128 (+49改善, p=0.001)
3F_R_N非イベント日: default +30 → v11 +135 (+105改善, p=0.046)
2F_R_N非イベント日: in-sample +114(p=0.008) → CV後 -2 → 過学習で棄却

