# モデル vs ランダム検定でセグメント別の実用性が大きく異なる

## 背景
v6a/v9cの有意性検定で、モデル間比較（v6a vs v9c）よりも本質的な問いとして「そもそもモデルはランダムより良い台を選べているか」を検定した。結果、セグメントごとにモデルの実用性が劇的に異なることが判明。

## アクション
モデル評価では必ず vs ランダム検定（H0: avg_diff_vs_other = 0）をセグメント×イベント日/非イベント日で実施する。全セグメント一括の評価は誤解を招く。

## 例
非イベント日 v9c:
- 3F_L_A: +60/日, p=0.0007 → USEFUL
- 3F_R_A: +65/日, p=0.0009 → USEFUL
- 2F_L_N: +89/日, p=0.0023 → USEFUL
- 3F_R_N: -114/日, p=0.0015 → WORSE（ランダム以下）
- 3F_L_N: -21/日, p=0.36 → ns（シグナルなし）

