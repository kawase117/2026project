# 3F_L_Nと3F_R_Nの機種構成が根本的に異なり、N機セグメント内の異質性がモデル失敗の原因

## 背景
3F_L_Nでモデルが機能しない原因を調査。3F_L_Nと3F_R_Nの機種構成を比較した結果、決定的な構造差が判明。

## アクション
3F_L_Nでのモデル改善は、セグメント内の機種異質性を解消する方向で行うべき。選択肢:
1. 沖ドキ/GODをサブセグメントとして分離し、別ルールを適用
2. 機種サブタイプをスコアリング特徴量として追加
3. 沖ドキ/GODをスコアリング対象から除外（平均-375で推薦対象として不適）

3F_R_NではA-like-N(21%)が安定高性能(mean=+303, std=1287)。これらは実質的にA機と同じ挙動をしており、A機セグメントに移すか独立セグメントにする検討が有効。

## 例
3F_L_N (100台/日):
- Standard-AT: 71% | mean=+159 | std=4026 | 勝率39%
- OkiDoki: 13% | mean=-226 | std=3134 | 勝率37%（低G数3499）
- GOD: 5% | mean=-797 | std=4102 | 勝率31%（最悪）
- A-like-N: 5% | mean=+291 | std=1678 | 勝率49%
→ OkiDoki+GOD(18.5%): mean=-375 が全体を汚染

3F_R_N (74台/日):
- Standard-AT: 65% | mean=+48 | std=3774
- A-like-N: 21% | mean=+303 | std=1287（低ボラ・高勝率）
- Yoshimune: 14% | mean=-59
→ 沖ドキ/GODが一切ない。A-like-Nが安定要素

