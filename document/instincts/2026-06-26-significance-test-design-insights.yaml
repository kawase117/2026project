# イベント日は全コンポーネントの予測力が崩壊する

## 背景
コンポーネント分解（c1-c6を個別にランキング基準として使い、セグメント×イベント日別にvs ランダム検定）で、非イベント日にUSEFULなコンポーネントがイベント日で全滅することを発見。

## アクション
イベント日の重み変更は4-fold CVで全て失敗した。イベント日はデフォルト重みを維持し、重み最適化は非イベント日に限定する。イベント日のA機（3F_L_A, 3F_R_A）はTop50もBottom50も両方プラスなので、台選択よりセグメント選択が重要。

## 例
3F_L_A非イベント日: hist(+98,USEFUL), kakuban(+85,USEFUL), digit(+83,USEFUL), dow(+76,USEFUL)
3F_L_Aイベント日: hist(+6,ns), kakuban(+51,ns), digit(+37,ns), dow(-7,ns) → 全滅
3F_L_Nイベント日: DD*kakuban=-235(bad?) → イベント日にDD×角番パターンが反転

