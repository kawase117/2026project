# Bottom50逆張り戦略は3F_L_N/3F_R_Nで成立しない

## 背景
モデルのTop50が逆効果（勝率30-40%）なら、Bottom50を避けて「中間層」を選べばプラスになるのでは？という仮説を検証。walk_forward_engineにBottom50記録を追加し、Top50/Bottom50/残り台の3層分析を実施。

## アクション
3F_L_N（100台）と3F_R_N（74台）はTop50+Bottom50で全台をカバーしてしまうため、「中間層」が物理的に存在しない。逆張り戦略は台数が十分なセグメント（2F_L_N 178台、2F_R_N 173台）でのみ検討可能。

## 例
3F_R_N (74台): Top50=-45, Bottom50=-70, 重複26台 → Middle=0台
3F_L_N (100台): Top50=-35, Bottom50=-110 → 両方マイナス、Bottom50はさらに悪い
3F_R_A (108台): Top50=+86, Bottom50=-53 → 理想的な分離。モデルが正しく台を区別

