# v11 walk-forward検証: 3F_R_Aで有意改善、2F_L_NがUSEFUL昇格

## 背景
v11_seg_weights（非イベント日のみ3セグメントで重みを変更）をwalk-forwardで検証。v6aとのペア比較+vsランダム検定を実施。

## アクション
v11は非イベント日の3F_R_Aで統計的に有意な改善（p<0.05）を達成。2F_L_NはvsランダムでUSEFULに昇格。イベント日はv6aと同一動作（設計通り）。3F_R_Nは改善したがまだWORSE。次のステップは3F_R_Nの構造的問題の解決（重みだけでは不十分）。

## 例
v11 vs v6a ペア比較（非イベント日）:
- 3F_R_A: +22/日 (p<0.05, 勝率63%) → 有意改善
- 2F_L_N: +33/日 (ns, 勝率56%) → 改善傾向
- 3F_R_N: +35/日 (ns, 勝率54%) → 改善傾向

vs ランダム昇格:
- 2F_L_N: maybe(+79) → USEFUL(+112)
- 3F_R_A: maybe(+47) → USEFUL(+69)
- 3F_R_N: WORSE(-127) → WORSE(-72) ← v11b(kaku+dow)で43%縮小

