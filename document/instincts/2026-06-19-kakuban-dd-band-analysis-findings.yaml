# DD帯の効果は medium セクションのみ有意（large では無視可能）

## 背景

蒲田7で section_size × dd_band × segment の日別 ANOVA を実施。

前提仮説：「large島で給料日以降（late帯）に高設定投入」

実装結果：ANOVA 有意だったのは 2F medium と AT medium のみ。large島では帯による差なし（p > 0.22）。

## アクション

1. ANOVA 有意性判定（p < 0.05）
   - 2F medium: p=0.0137 ✓
   - AT medium: p=0.0023 ✓
   - large 全て: p > 0.22 ✗

2. Large島の帯別機械割（有意差なし）
   - 2F: early 102.09% vs late 101.53% = 0.56pp
   - 3F: early 100.96% vs late 100.98% = -0.02pp
   - AT: early 101.33% vs late 101.06% = 0.27pp

3. ホール戦略推測
   - Large島：DD帯を問わずランダム投入
   - Medium島：early に優遇傾向

## 例

ANOVA 結果の有意性:
- 2F medium: F=3.557, p=0.0137 → early > late で 0.95pp差
- 2F large: F=1.460, p=0.223 → 帯による差なし

