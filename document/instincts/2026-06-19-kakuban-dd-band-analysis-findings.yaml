# DD帯の優先順位付け（event > early > mid > late）

## 背景

dd_band 分類で event（1, 10, 20, 30）が他帯と重複。

集計キーの一意性のため、優先順位で単一ラベル化。

## アクション

1. 優先順位の定義
   - Tier 1: event（dd in [1, 10, 20, 30]）
   - Tier 2: early（dd in 1-10）
   - Tier 3: mid（dd in 11-20）
   - Tier 4: late（dd in 21-31）

2. 実装（if-elif 連鎖）
   - dd=1 → "event"（not "early"）
   - dd=10 → "event"（not "early"）
   - dd=15 → "mid"（不重複）
   - dd=25 → "late"（不重複）

3. 結果：各 dd が単一ラベルを持つ

## 例

優先順位適用:
```
dd=1 (Tier 1, 2): → event（Tier 1優先）
dd=10 (Tier 1, 2): → event（Tier 1優先）
dd=15 (Tier 3): → mid
dd=25 (Tier 4): → late
```

