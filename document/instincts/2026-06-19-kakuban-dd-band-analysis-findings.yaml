# Section × DD帯の効果は限定的（large では 0）

## 背景

セクションサイズ分割が LR分割を圧倒（F値 32-23）。

section_size 内での dd_band による細分化の効果を検証。

結果：medium で限定的（0.95～1.07pp）、large で無視可能（p > 0.22）。

## アクション

1. ML 特徴量の優先度
   - 必須: section_size_group（F値 32-23）
   - 補助: dd_band（有意な効果は medium のみ）
   - 不要: section_size × dd_band の交互作用

2. 予測モデルの粒度
   - large島: section_size のみ
   - medium島: section_size + dd_band（early boost +1pp）

3. ホール別の一般化確認が必要

## 例

効果の大きさ（p値基準）:
- 2F medium: 0.95pp（p=0.0137 有意）
- AT medium: 1.07pp（p=0.0023 有意）
- large全て: p > 0.22（有意差なし）

→ ML では section_size が主軸、dd_band は補助的
