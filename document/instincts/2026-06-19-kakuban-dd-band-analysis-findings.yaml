# 日別粒度の ANOVA で台数バイアスを回避

## 背景

セクションサイズ × DD帯の ANOVA を machine 単位で実施するとバイアスが生じる。

Large島（~70台）が small島（~8台）を過剰に支配。

代わりに日別の pay_rate で実施して等価性を確保。

## アクション

1. 集計粒度の選定
   - ×: machine 単位（不均衡）
   - ○: 日別集計（等価）

2. 日別 pay_rate 計算
   - グループ化キー: (segment, section_size_group, dd_band, date)
   - 各日の games_sum, diff_sum から pay_rate 計算

3. ANOVA 実施（日別データで）
   - グループ: (segment, section_size_group, dd_band)
   - 検定対象: 各グループの日別 pay_rate リスト

## 例

Large島の観測数:
- machine レベル: 59,731台（不均衡）
- 日別: 91日（均衡）

