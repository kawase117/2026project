# 反転仮説：Large はランダム → Medium で early 優遇

## 背景

初期仮説「Large島で late に高設定」が支持されず。

代わりに ANOVA で検出：「Medium島で early に高い」という逆パターン。

## アクション

1. 帯別機械割の確認（Medium島）
   - 各セグメントで early が consistently high か検証

2. ホール戦略の再解釈
   - Large: 回避戦略（ランダム化）
   - Medium: 初期投入戦略（月初の来店客向け）

3. ML 特徴量の優先度再調整
   - Large: section_size のみ
   - Medium: section_size + dd_band

## 例

2F medium: DD帯別機械割
- event: 102.50%
- early: 102.89%（最高）
- mid: 102.06%
- late: 101.94%（最低）
→ early が他帯より +0.95pp 高い（p=0.0137）

