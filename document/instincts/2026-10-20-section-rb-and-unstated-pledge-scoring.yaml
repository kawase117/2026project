# 基準が書かれていない公約は、差枚の閾値で切らず、プラスの割合・中央値・機種区分でも見て、現場を知るユーザーの読みと突き合わせる

## 背景
2026-10-19、10/18の東口の答え合わせで、予告の「半列優秀以上×4箇所」を、私は「6台中5台以上が+1,000以上、台番号順に連続6台」という自分の基準で判定し、マイジャグラーVの列とリコリスしか見つけられず、「4箇所を特定できず」と書いた。

ユーザーは「バラエティ列の半分(BT)と、技術介入機列(新ハナビ〜ディスクアップ2)が全でした」と指摘した。データでは、技術介入機の島(9台)は8台がプラスで平均+1,647、バラエティ列の前半(2331〜2338、7台)は6台がプラスで中央値+942だった。+1,000以上の基準では、+275・+294・+442のような小さなプラスの台で「全」から外れていた。さらに、DBの機種区分(ノーマル・A+ART・A+AT)は、BTや技術介入機のまとまりとして束ねない。

「優秀以上」の基準自体も不明(差枚か機械割か)だった。

## アクション
- 公約の基準が書かれていないときは、閾値(+1,000など)を独断で置かない。**プラスの台の割合(差枚>0)・中央値・平均を並べて**出す。平均は大当たりの1台で動く(バラエティ列の2338ローティスは+9,442)ので、中央値とプラス割合で見る。
- 並びの候補は、台番号の連続や同一機種だけでなく、**機種区分(BT、技術介入機、ノーマル)と物理的な列・島(`machine_layout.section`)**でも見る。機種混在の列は、ノイズ扱いしない。
- ユーザーの現場の読み(「明らかに」「全でした」)は、先に聞いて、データで裏づける。裏づけられなければ、そのまま「申告」として残す。答え合わせ文書では、**ユーザー申告(現場)とDBの裏づけを分けて書く**(`feedback_separate_user_claims_from_derived_hypotheses`)。
- 「特定できず」と書く前に、自分の基準が厳しすぎないか(閾値、連続性、機種の同一性)を疑う。

## 例
```text
技術介入機の島(2283〜2303、9台): プラス8/9、平均+1,647、中央値+942  -> 閾値+1,000では4/9で落ちるが、プラス割合では「全」
バラエティ列の前半(2331〜2338、7台): プラス6/7、中央値+942(平均+2,185はローティス+9,442に引っ張られる)
```

