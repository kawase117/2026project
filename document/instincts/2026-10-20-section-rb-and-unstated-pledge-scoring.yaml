# 営業中は、台ごとの確率より先に、列・島ごとにRB判別できる台のRBを合算して、偶然の確率を見る

## 背景
2026-10-18(日)のヒロキ東口(割／切リサーチ来店取材)で、13:31の最初のスキャンに答えが出ていたのに、見落とした。

- マイジャグラーVの列(2053〜2067、12台): 合算23,184GでRB113(1/205)。設定平均なら期待約75回で、偶然に起きる確率は3.4×10⁻⁵。台ごとの事後確率は0.16〜0.64で、東口のマイV事前(設定5以上8.2%)に押し下げられ、列としての異常さが見えなかった。
- 技術介入機の島(2283〜2303): RB判別できる5台(バーサスリヴァイズ2、クランキークレスト、新ハナビ2)がそろって設定6のスペック値より良く、合算8,231GでRB34(1/242)。偶然の確率は設定平均で約5%、最低設定で約1%。台ごとは0.52〜0.66(補正なし)で目立たず、機種混在の列全体の合算(1/329)では、判別できない機種に薄められた。
- バラエティ列のBT半列(2331〜2338)は、13:31のRBでは見えなかった(6台合算1/318、他の台と同程度)。最終では、クレアの秘宝伝1/198、不二子BT1/219と強かった。**回転数が積み上がってから見える列もある。**

最終結果は、マイV列が12台中11台で+1,000以上、技術介入機の島が9台中8台プラスで、ユーザーの現場の読みと一致した。

## アクション
- 営業中のスキャンでは、台ごとの順位表の前に、`scraper/realtime/section_rb.py`(`build_ranking` の `section_rb`、総合ランキングの末尾の節)で、列・島(section)と隣り合う6台の窓ごとの合算RBを見る。
- 合算の対象は、`estimate()` と同じ基準でRB判別できる台だけ(判別力high、RB確率が4設定以上)。機種混在の列でも、判別できる機種だけを集める。判別できない機種を混ぜた平均で薄めない。
- 偶然の確率は、設定平均とともに最低設定でも見る。最高設定のスペック値より良い台の割合(例: 5/6)も併記する。
- 回転数が少ない列(BTなど)は、昼に否定しない。夕方に再確認する。
- 「補正なしの表は割り引いて、順位に混ぜない」で終えない。補正の有無に関係なく、列単位の合算を必ず別に見る。
- 予告の公約(列全体、半列、12台以上の機種)と照らして、営業中に「今日は強い日か」を判断する。東口は、普段は弱く、強い日(日平均+300以上)が月1回程度という申告があり、強い日は昼に検出できる。

## 例
```text
13:31 ヒロキ東口店(section_rbの出力)
台番号範囲 | 台数 | 機種 | 合算G | 合算RB | 1/x | 最高設定超 | p(最低設定) | p(設定平均)
2053〜2067 | 12 | マイジャグラーV | 23184 | 113 | 1/205 | 7/12 | 2.7e-11 | 3.4e-05
2287〜2303 | 6 | ファミスタ回胴版!!・バーサスリヴァイズ・クランキークレスト・新ハナビ | 10168 | 37 | 1/275 | 5/6 | 0.029 | 0.12
```

