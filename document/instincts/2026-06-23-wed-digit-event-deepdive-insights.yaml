# 水曜末尾にローテーション・リバランスは存在しない

## 背景
「累積差枚が高い末尾は次週避けられる」仮説を検証。
リピート率、Spearman相関、4週窓翌週順位の全てがランダムと一致。

## アクション
- 累積差枚に基づく末尾予測は無効
- リピート率: 0.110（ランダム期待0.100）
- 累積vs翌週 Spearman rho: -0.003（有意セグメント0/8）
- 4週窓→翌週順位: 5.54（ランダム期待5.50）、Top3率31.8%（期待30%）
- 木曜コントロールと差なし

## 例
ホール側は毎週独立にトップ末尾を選択しており、過去の累積を考慮していない。
あるいは観測できない外部変数（機種入替、客足、店長判断）で決定。

