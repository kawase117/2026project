# 水曜末尾イベント：「どの末尾か」ではなく「gap」で評価すべき

## 背景
水曜日は末尾に高設定を集中させるイベント日。先行分析でBonferroni後に非有意という結論が出たが、
これは「特定末尾がトップか」を検定していたため。正しい問いは「トップ末尾と他の差（gap）が水曜に大きいか」。

## アクション
- 末尾イベントの評価は、Mann-Whitney U で「水曜のgap > 他曜日のgap」を検定する
- 全体pooledでp=0.009、Cohen's d=+0.078で有意（ただし効果量は小さい）
- セグメント別では3F AT機（3F_L_A d=+0.68, 3F_R_A d=+0.77）で中〜大効果
- N機では2F_L_N (d=+0.33)のみ有意
- 「どの末尾がトップか」はセグメント間で完全分散（8セグメント8種類）し予測不可能

## 例
水曜日の末尾gap（トップ末尾avg_diff - 残りavg_diff）= 1807
他曜日のgap = 1727、差 = +80、MW p=0.009

