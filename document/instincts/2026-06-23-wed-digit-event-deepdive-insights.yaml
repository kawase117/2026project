# 火曜K5-9の優位性は火曜固有ではなく恒常的な構造バイアス

## 背景
火曜日の角番イベントをセクション別×角番グループ別にMann-Whitney U検定した結果、
AT機左側（2F_L_A, 3F_L_A）でK5-9が有意だった。しかし既存Instinct
（kakuban-middle-position-positive-residual, 2026-06-17）で「中間ポジション角5-9は
恒常的にプラス残差」「イベント日/曜日で角番の相対格差は変わらない（残差後に消える）」
と結論済み。今回の検定は恒常効果の再検出であり、火曜固有のイベント効果ではない。

## アクション
- 火曜の角番gap（全体）はp=0.29で非有意 → 火曜に角番集中度が上がる証拠なし
- K5-9の優位性は全曜日で存在する構造バイアス（[[kakuban-middle-position-positive-residual]]参照）
- 火曜「角◯イベント」の効果は、恒常的K5-9優位を超える追加ブーストとしては検出されなかった
- N機は全セグメントで角番グループ間差が非有意（全曜日共通）

## 例
3F_L_A K5-9の残差法による曜日固有効果（2026-06-23 別セッション分析）:
木+116, 火+104, 金+74, 日-108 → 恒常効果+179に対する変動であり、火曜だけが特別ではない。

