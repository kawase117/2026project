# 土日が末尾・角番の両方で設定集中度が最大

## 背景
曜日別のgap分析で、土曜・日曜が末尾gap・角番gapの両方で最も高い値を示した。

## アクション
- 末尾gap: 土(1885, d=+0.17)、日(1920, d=+0.21) — 水(1807, d=+0.08)より大
- 角番gap: 土(1390, d=+0.18)、日(1296, d=+0.05)
- digit spread: 土(993, d=+0.27)、日(964, d=+0.19)
- 土曜「3台並び」イベントが末尾連番に設定を集中させ、gapを増幅している可能性
- 週末の設定配分は平日より偏りが大きく、予測シグナルが強い

## 例
曜日別digit gap ranking: 日(1920) > 土(1885) > 水(1807) > 火(1713) > 月(1636) > 金(1612) > 木(1598)
