# 水曜のトップ末尾は毎週ランダムに選択される

## 背景
346日のカイ二乗検定で2F_L_A（末尾7, p<0.0001）と2F_R_A（末尾4, p=0.001）に偏りがあるが、
これはAT機の物理的配置要因であり、水曜固有ではない。
水曜限定の前半vs後半安定性は0/8（完全不一致）。

## アクション
- 水曜のトップ末尾を事前予測するモデルは構築しない
- 全体avg_diffでのトップは8セグメントで8種の末尾に完全分散
- 当日の途中経過（開店後の出玉速報）でトップ末尾を推定する戦略のみ有効

## 例
全体avg_diffトップ: 2F_L_A=7, 2F_L_N=9, 2F_R_A=1, 2F_R_N=0, 3F_L_A=3, 3F_L_N=2, 3F_R_A=4, 3F_R_N=8
→ 0-9の10種中8種が登場、完全分散

