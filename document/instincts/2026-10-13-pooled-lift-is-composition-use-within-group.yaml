# 機種を混ぜた全体比の上乗せは、機種の組成効果。機種・島自身の平均との差（自群比）で見る

## Core claim
高設定が入りやすい機種（ホールによってゴーゴー3やネオアイム）に「前日RB良」の台日が多く含まれる。機種を混ぜて「前日RB良の翌日は高設定確率が上がる」と集計すると、持ち越しではなく機種の高設定水準の差を拾う。条件の上乗せは、その条件が属する機種（または島）自身の翌日平均との差で測る。

## Evidence
2026-10-13、4ホールのジャグラーを `juggler_carryover groups` で集計。
- 全体比（前日RB良の翌日 − 全体平均）: 蒲田7 +0.063、蒲田1 +0.072、楽園 +0.016、金時 +0.038。
- 機種ごとの自群比に直すと、ほぼすべて0付近に消える。残ったのはみとやのマイジャグラーV（+0.034）と、蒲田7のハッピー8（7日低調後 +0.083、台日は少ない）だけ。
- 同様に、ネオアイムが「全体比 -0.080」と出たのは、もともとの高設定が極小（0.007）なだけで、前日の条件に反応していない。

## Action
1. 条件別の翌日の平均は、まず機種別・島別に分けてから、機種自身の平均との差（自群比）で報告する。全体比はホール横断で使わない。
2. 機種を混ぜた集計を示すときは、機種の組成（その条件に含まれる機種の内訳）を併記する。
3. 機種の水準そのもの（絶対水準）は、スペックの誤り・事前分布・稼働の影響を受けるので、相対比較に使うか、先に水準の妥当性を確かめる（スペックの機械割の突き合わせ）。
