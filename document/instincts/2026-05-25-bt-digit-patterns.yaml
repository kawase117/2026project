# BT機種の全台高設定日は320日中3日（0.9%）。Layer A の影響はほぼ無視できる

## 背景
bt_mode_classification.csv より all_high 判定日:
- 2025-07-07（月）、2025-07-09（水）、2025-10-30（木）の3日のみ（全期間の0.9%）

ユーザーの「BT機種が全台に選ばれることは稀」という認識と完全に一致。
BT機種のML予測困難の原因は「all_high/normal の2モード混在」ではなく別の要因。

## アクション
BT分析においてモード分離フィルタは不要（3日しかないため統計的に無意味）。
BT末尾パターンは全期間を通じた曜日別集計で直接分析できる。

## 例
BT全台高設定日 2025-10-30(木): bt_mean=841.8, min=333.3 → 全末尾が高い状態
BT通常日の典型: bt_mean=300〜400, min=-1000〜-300 → 末尾間の差が大きい

