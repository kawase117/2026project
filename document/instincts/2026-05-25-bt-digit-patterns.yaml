# BT機種の曜日別best_cluster: 日曜=0-1-2(delta=116.7最強)、木曜=8-9-0、火土=7-8-9

## 背景
bt_weekday_cluster.csv（mode=normal、全7曜日）:

| 曜日 | best_cluster | top1    | delta  | 備考                 |
|------|-------------|---------|--------|----------------------|
| 月   | 9-0-1       | 末尾0(290) | 69.5 |                      |
| 火   | 7-8-9       | 末尾9(490) | 88.4 | 強い                 |
| 水   | 3-4-5       | 末尾3(386) | 60.6 | ホール全体(8-9-0)と逆！|
| 木   | 8-9-0       | 末尾8(273) | 68.0 |                      |
| 金   | 0-1-2       | 末尾1(447) | 82.9 | 強い                 |
| 土   | 7-8-9       | 末尾9(246) | 71.3 |                      |
| 日   | 0-1-2       | 末尾0(446) | 116.7| 全曜日最強           |

日曜delta=116.7は全曜日で突出して高い。金・日は同じ0-1-2クラスタ。火・土は同じ7-8-9クラスタ。

水曜BTはホール全体（8-9-0）と逆の3-4-5クラスタ:
Layer Bの水曜「末尾基準投入」でBT機種には異なる末尾が割り当てられている可能性。
水曜BT台を選ぶ場合は末尾8-9-0ではなく3-4-5を狙う。

## アクション
ML特徴量候補（BT機種限定の交互作用）優先度順:
1. `is_sunday AND is_BT AND last_digit in ["0","1","2"]` （delta=116.7、最優先）
2. `is_friday AND is_BT AND last_digit in ["0","1","2"]` （delta=82.9）
3. `is_tuesday AND is_BT AND last_digit in ["7","8","9"]` （delta=88.4）
4. `is_saturday AND is_BT AND last_digit in ["7","8","9"]` （delta=71.3）
5. `is_thursday AND is_BT AND last_digit in ["8","9","0"]` （delta=68.0）
6. `is_wednesday AND is_BT AND last_digit in ["3","4","5"]` （ホール全体と逆）

BT台数比率8.6%のため全体順位への影響は小さいが、BT台限定での選択精度は高い。

## 例
日曜BT 0-1-2クラスタ: cluster_mean=396.9 vs BT全体mean=280.3（+42%）
水曜BT 3-4-5クラスタ vs ホール全体 8-9-0: 同じ水曜でBT台と非BT台の狙いが分離
