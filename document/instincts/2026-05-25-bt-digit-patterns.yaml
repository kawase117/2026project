# BT機種の台番号は末尾1に偏り（13.2%）だが、曜日別クラスタは物理配置で説明できない

## 背景
bt_overall_digit.csv より:
- 末尾1: pct_rows=13.23%（期待値10%より+3.2pp、最多）
- 末尾2-4: 10.4〜11.3%（やや多め）
- 末尾0・7・8・9: 8.3〜8.5%（少なめ）

反証: 木曜 best_cluster=8-9-0（台数が少ない末尾が強い）
もし物理配置バイアスが原因なら末尾1-2-3-4が強くなるはずだが、木曜は逆の末尾が強い。
→ BTの曜日別末尾パターンは物理配置ではなく戦略的な末尾選択を反映している可能性。

## アクション
曜日別クラスタが物理配置（末尾1-4）と逆の場合（木曜=8-9-0）は戦略的選択と見なす。

## 例
末尾1(13.23%)が mean_diff 1位(332.5) → 台数が多いためとも解釈できる
木曜 best_cluster=8-9-0（pct_rows=8.3〜8.5%の少数末尾）→ 物理バイアスに逆らった配置

