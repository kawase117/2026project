# 演者の好みの機種は予告アカウントの推測。1回では判断せず、DBで突き合わせて蓄積する

## 背景
ユーザーは「演者によっては演者の好みの台に設定を入れることもある」と指摘した。
2026-09-20 に蒲田1の演者来店日4日で、予告アカウントが挙げた好み・関連機種を DB と突き合わせた。

| 日 | 演者 | 推測 | DBの結果 |
|---|---|---|---|
| 8/5 | コウタロー | ジャグラーが配分高め | ジャグラー全体のRB比 約1.03（ネオアイムEXのみ1.13、z+2.3）。SBJは差枚+1175（機種順位5/39） |
| 9/3 | 鉄人4名（しのけん他） | 全:スマスロ北斗・吉宗・アズレン | 北斗7台が+3600で順位1/43。真打吉宗は-2625で最下位 |
| 9/6 | 紅羽ちぇり | 記載なし | ジャグラーガールズがRB比1.19（z+1.8）・差枚順位3/44 |

好みが当たったと言えるのは9/3の北斗だけで、その北斗を演者が好むかどうかも推測だった。
ジャグラーの「配分高め」は、RBで見ると支持されなかった（差枚は機種内でばらつく）。

## アクション
1. 演者ごとに、名前・@ID・好み/関連機種のメモを台帳に残す（`event_days.py --performers`）。好みが推測なら『推測』と書く。
2. 来店日の結果は区分で指標を分けて確認する。ジャグラー・ハナハナ系はRB確率（自機種の45日ベース）、AT機は差枚と回転数。
3. 1回の当たり外れで好みを決めない。演者ごとに来店日を重ね、成績の良い機種が繰り返し出てから参考にする（ユーザーの方針: データを重ねる中で成績の良いものを参考にする）。
4. 予告アカウントの文中の「全」の機種を、演者の好みの根拠にしない（店側の通常の仕掛けと混ざる）。

## 例
NG: 「コウタローの収録日はジャグラーに設定が入る」（予告アカウントの推測をそのまま採用）
OK: 「コウタロー 8/5: ジャグラー全体RB比1.03で推測を支持せず。SBJのみ差枚+1175。1回目として記録」

