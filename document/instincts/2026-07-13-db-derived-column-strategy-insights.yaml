# DBカラム化 vs 共通関数化の判断基準

## 背景
「毎回計算せずDBにカラムとして持たせたい」という要望が出た際、機種内RANK・機種台数・所属セクションは実は既にDB（machine_detailed_results.machine_rank_in_type, daily_machine_type_summary.machine_count, machine_layout.section）に存在していた。一方で section_size は定義がスクリプト間でズレており実害があった。Codex（codex:codex-rescue）に相談したところ、経過日数系（新台日/増減台日/機種変更日からのカウント）はDBカラム化を推奨しない判断が出た。理由は database/incremental_db_updater.py がappend専用（新規日付のみ流す）構成で、過去に遡って再計算する仕組みがないため、バックフィルが発生した瞬間に固定カラムが事故る、というもの。

## アクション
新規カラム要望が出たら以下の順でチェックする。
1. 既存テーブルに同義カラムが無いか確認する（database/CLAUDE.md・db_setup.pyのCREATE TABLEをgrep）。あれば「再周知」で済み、追加不要。
2. 値がほぼ不変（物理配置など）かつ計算式が1行程度で済むなら、DBカラムではなく共通関数（eda/core.py等）に寄せる。
3. 日次バッチ増分更新（incremental_db_updater.py）のappend専用構成と衝突しないか確認する。過去に遡って再計算が必要な系（経過日数カウント等）はDBカラム化するとバックフィル事故のリスクが高いため、まずSQLのLAG()ウィンドウ関数でクエリ時計算し、信号が強いと確認できたものだけ後から専用の履歴テーブルへ昇格させる二段階アプローチを取る。

## 例
section_size（セクション実台数）とedge_side（端番の向き）はDBカラム化せずeda/core.pyの共通関数（compute_section_size, compute_edge_side）として実装した。経過日数系（新台日/増減台日/機種変更日カウント）はDBカラム化せず、SQLのLAG()ウィンドウ関数でクエリ時計算する方針とした（ml/analysis/kamata_corner_mirror_analysis.pyにLAG(machine_name)の実装例あり）。

