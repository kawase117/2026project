# physical_cornerは「端からの距離」のみで「どちら側の端か」は持たない

## 背景
machine_layout.physical_corner = min(rank_from_min, rank_from_max) という定義（db_setup.py:378）。rank_from_min/rank_from_maxという生の距離データは両方ともDBに保存済みだが、physical_corner自体は距離の最小値（片側だけ）しか表さず、min側の端かmax側の端かという「向き」の情報を単体からは判定できない。角番(kakuban)ともsection末端(touches_edge)とも別概念。

## アクション
「どちらの端か」が必要な分析ではphysical_cornerだけを見るのではなく、rank_from_minとrank_from_maxを直接比較するか、eda/core.pyのcompute_edge_side()を使う。新規の距離用DBカラムは不要（rank_from_min/rank_from_maxで足りる）。

## 例
compute_edge_side(layout_df) は rank_from_min < rank_from_max なら 'min_side'、rank_from_max < rank_from_min なら 'max_side' を返す（np.selectで実装、同値・欠損時はNone）。

