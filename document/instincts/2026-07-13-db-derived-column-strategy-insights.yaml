# section_sizeの定義がスクリプト間で2通り混在し実際にズレていた

## 背景
section_max - section_min + 1（範囲ベース、欠番を考慮しない）と groupby("section")["machine_number"].transform("nunique")（実台数カウント）の2通りの実装がeda/スクリプト間で混在していることが判明した（eda/kamata7_kakuban_concept_experiment.py:77 vs eda/section_lateral_expansion.py:236-238）。範囲ベースの計算は台番号に欠番があるセクションで台数を過大評価する。

## アクション
section_sizeが必要な箇所では自前でsection_max-section_min+1やnuniqueを書かず、eda/core.pyのcompute_section_size(layout_df)を使う。台配置はほぼ不変なのでDBカラム化は不要（改装が起きた時だけ再生成すれば良い）。

## 例
compute_section_size(layout_df) は df.groupby("section")["machine_number"].transform("nunique") で実台数を返す（machine_layoutテーブル読み込み結果に対して使用）。動作確認: セクション内の台番号がmachine_number=[2001,2002,2004]（2003が欠番）の場合、section_size=3（範囲計算だと4になり過大評価）。

