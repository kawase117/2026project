# 「4のつく日」はDD=4/14/24で推奨台が異なる。一括りにしない

## 背景
みとやのイベント日はDD%10∈{4,7}で「4のつく日」(DD=4,14,24)はひとまとめに
扱われがちだが、セクション×末尾単位では推奨台が大きく異なる。

DD=4 の最強セル:
  AT島 574-590 × 末尾2: +2908 (rank 1)
  AT島 501-522 × 末尾2: +1337 (rank 2)
  ※ 608-623×末尾4 は -578(rank 157) ← 罠

DD=14 の主要セル:
  ジャグラー島 658-674 × 末尾7: +643
  AT島 574-590 × 末尾2: +917

DD=24 の主要セル:
  ジャグラー島 658-674 × 末尾7: +842 (rank 1)
  AT島 608-623 × 末尾4: +1217 (rank 4)
  バラエティ島 723-733 × 末尾7: +1084 (rank 3)
  AT島 501-522 × 末尾2: +1048

## アクション
DDごとに台を分けて選ぶ：
- DD=4:  AT島574-590末尾2を第1候補、501-522末尾2を第2候補に固定
- DD=14: ジャグラー658-674末尾7を優先、次点574-590末尾2
- DD=24: 658-674末尾7 / 608-623末尾4 / 723-733末尾7 の3択（埋まり具合で判断）

## 例
```
2026年7月「4のつく日」の推奨台：
  7/4  → 574-590末尾2(+2908)、501-522末尾2(+1337)
  7/14 → 658-674末尾7(+643)、574-590末尾2(+917)
  7/24 → 658-674末尾7(+842)、608-623末尾4(+1217)、723-733末尾7(+1084)

DD=4は迷ったら574-590末尾2一択。
DD=24は候補3つが並立するため当日の台の埋まり具合で判断。
```
