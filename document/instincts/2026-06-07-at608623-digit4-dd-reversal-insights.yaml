# AT島608-623×末尾4はDD=7/17/24専用台。DD=4だけ逆転して最悪クラス

## 背景
DD=7全体ランキングで2位(+1675)だったAT島608-623×末尾4について、
全DDに展開したところDD=4だけ完全に逆転することが判明した
（script: ml/last_digit/mitoya_dd_section_digit.py）。

x_day DD別偏差と全169セル中の順位：
  DD= 4:  -578  rank=157/169  ← 最悪クラス
  DD= 7: +1675  rank=  2/169  ← 最強クラス
  DD=14:   +22  rank=109/169  ← ほぼゼロ
  DD=17:  +924  rank= 11/169  ← 強い
  DD=24: +1217  rank=  4/169  ← 非常に強い
  DD=27:  -263  rank=137/169  ← 弱い

期間別偏差（x_day全体）：+497(旧店長2025) → +393(旧店長2026前半) → +989(新店長2026/5-)
3期間安定かつ新店長期間で強化傾向。台番号: 614番（608-623セクションの末尾4）。

## アクション
- DD=7（毎月7日）:  608-623末尾4を第1候補（+1675, rank 2）
- DD=17（毎月17日）: 608-623末尾4を候補に加える（+924, rank 11）
- DD=24（毎月24日）: 608-623末尾4を候補に加える（+1217, rank 4）
- DD=4（毎月4日）:  608-623末尾4は絶対に避ける（-578, rank 157）
  → DD=4の日は574-590末尾2（+2908）に集中する
- DD=27（毎月27日）: 608-623末尾4は避ける（-263, rank 137）

## 例
