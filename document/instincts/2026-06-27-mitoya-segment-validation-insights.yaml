# 縦列×非ジャグラー（v_nonjug）は全面マイナスの回避セグメント

## 背景
v_nonjug（692-700, 701-711, 745-755）はavg_diff=-119で全角番帯マイナス（corner1=-282, corner2-4=-107, corner5-9=-115, corner10+=-32）。バラエティ島で設定投入が薄い。5セグメント分割の交互作用検証でこのセグメントの分離が有意差の主因（横では jug/non_jug 差が41だが縦では202に拡大）。

## アクション
- 推薦リストから v_nonjug セクションを除外する
- 692-700, 701-711, 745-755 の台は原則打たない
- v_nonjug の中で唯一プラスの角番帯もないため、条件付きで拾う余地もない

## 例
v_nonjug 角番別: corner1=-282, corner2-4=-107, corner5-9=-115, corner10+=-32
（参考）v_jug: corner1=+124, corner2-4=+100, corner5-9=+78, corner10+=+48 → 全角番プラス

