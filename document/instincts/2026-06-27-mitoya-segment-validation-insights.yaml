# h_jug の角番1（corner1）はavg_diff=+405で全セグメント・全角番帯の最大値

## 背景
横列ジャグラー（h_jug: 641-657, 658-674, 675-691）の corner1 は avg_diff=+405, plus_rate=56.9% で、全5セグメント×4角番帯の中で最も高い。Phase 8 のセクション別分析では 641-657 の corner1=+542 が最強だったが、h_jug 全体でも+405を維持しており、641-657 単独の特殊効果ではなくジャグラー島共通の構造。

## アクション
- ジャグラー島では corner1（通路端の台）を最優先で選ぶ
- 641（corner1 of 641-657, +542）、674（corner1 of 658-674, +580）、675（corner1 of 675-691, +266）が具体的な最有力台
- h_nonjug の corner1 は+59と控えめなので、角番1狙いはジャグラー島に集中すべき
- ただし Phase 8 バックテストでは CornerRule が Period 3→4 で崩れた（-6.4）ので、時系列安定性の確認は必要

## 例
h_jug corner別: corner1=+405, corner2-4=+133, corner5-9=+55, corner10+=+2
h_nonjug corner別: corner1=+59, corner2-4=+131, corner5-9=+72, corner10+=-37
