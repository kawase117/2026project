# みとやの5セグメント分割が統計的に支持された

## 背景
orientation（横列/縦列）× jug_flag（ジャグラー/非ジャグラー）の交互作用がANOVAで有意（F=26.05, p=3.3e-7）。単体軸では jug_flag の ε²=0.018 が最大で、機種タイプが最も強い分割軸。805-815 は唯一の混在セクションで内部分割も有意（KW p=7.6e-4）だが台数が少ないため独立セグメントとして扱う。

## アクション
- 5セグメントで分析を進める: h_jug, h_nonjug, v_jug, v_nonjug, mixed_805
- セクション（列）単位の分析は5セグメントの下位粒度として維持する
- 末尾・DD・角番の分析はセグメント単位で実施し、全体集計は参考値にとどめる
- v_nonjug は全面マイナス（avg_diff=-119）の回避セグメント

## 例
h_jug: 641-657, 658-674, 675-691（横列ジャグラー、51台、n≈28,000）
h_nonjug: 501-622, 624-640（横列非ジャグラー、139台、n≈63,000）
v_jug: 712-722, 723-733, 734-744（縦列ジャグラー、33台、n≈16,000）
v_nonjug: 692-700, 701-711, 745-755（縦列非ジャグラー、30台、n≈13,000）→回避
mixed_805: 805-815（混在、19台、n≈5,000）

