# みとやの末尾効果は横列セグメントでのみ検出される

## 背景
5セグメントで last_digit の Kruskal-Wallis 検定を実施した結果、h_jug（p=0.0037）と h_nonjug（p=0.038）でのみ有意。縦列（v_jug, v_nonjug）と mixed_805 は非有意。両横列セグメントで d4 が首位だが、DD4/14/24（X_DDS日）の全体底上げが混入している可能性がある。蒲田7のような Simpson's Paradox（jug/non_jug で末尾ランキング逆転）はみとやでは発生していない。

## アクション
- 末尾ルールは横列セグメント（h_jug, h_nonjug）でのみ検討する
- 縦列で末尾を使うのは無意味
- d4 首位がDD混入か純粋な末尾効果かは非イベント日限定の再検証が必要
- h_jug ε²=0.0005 と効果量は小さいので、末尾を主軸にするのは危険。角番の補助として使う

## 例
h_jug 末尾ランキング: d4(+150) > d2(+123) > d3(+107) > d1(+87)
h_nonjug 末尾ランキング: d4(+89) > d2(+66) > d1(+62) > d3(+42)
v_jug: KW p=0.265（非有意）
v_nonjug: KW p=0.149（非有意）

