# セグメント分割は単体軸→交互作用の段階的検証で進める

## 背景
みとやの分析で、いきなり複合セグメント（横jug/横nonjug/縦jug/縦nonjug）を定義するのではなく、単体軸の効果を先に確認してから組み合わせの交互作用を検証する手順が有効だった。蒲田7でも同じ手順で6セグメントに到達している。

## アクション
1. 単体軸の検証: 列（section）、N/A（機種タイプ）、縦列/横列（orientation）それぞれ単独の KW 検定
2. 2軸の交互作用検証: ANOVA の交互作用項で追加情報があるか統計検定
3. 交互作用が有意なら組み合わせセグメントを採用、非有意なら単体軸で十分
4. 確定したセグメント単位で末尾・DD・角番の分析を再実行
- いきなり組み合わせを作ると、効果のない軸で分割してデータを薄めるリスクがある

## 例
みとや: 列(18分割) → N/A(2分割) → 縦横(2分割) → 交互作用有意 → 5セグメント確定
蒲田7: フロア(2F/3F) → L/R(左右) → A/N(機種) → 6セグメント確定

