# 楽園蒲田の月次行動は、「前3か月で勝っているXのつく日×末尾Xのジャグラー」に従う方法は翌月も勝ち、機種×曜日を自動で選ぶ方法は勝てなかった

## 背景
2025年1月〜2026年9月(21か月)の台日で、各月より前の3か月のデータだけで候補を決め、その月に実行する検証(ウォークフォワード)をした。差枚は、その台の1日の全員の結果で、実際の損益ではない。
- (C) Xのつく日×末尾Xのジャグラー(RB側): 前3か月で、同じ日の他の末尾のジャグラーより機械割が最も高かった数字を1つ選び、翌月の同じ数字の日に実行(機械割=差枚÷3G。回転数に左右されない指標)。2026年4月までの13か月で、機械割は他の末尾より+0.84pt[95%区間 +0.25, +1.37](10/13か月でプラス、約+25枚/1000G、10通りの平均は+0.12pt)。RB比で数字を選ぶと、同じ期間は-0.16pt[-1.25, +0.77]で優位なし。2026年6月以降の4か月は+2.3〜+5.7pt(1000Gあたり+69〜+171枚)で、桁が違う。選ばれた数字は、2(4か月)、1、0(4か月)、3、7と、3〜4か月ごとに入れ替わった。
- 型の比較(5つの型×4区分、前3か月で上位1つを選び、翌月の機械割の差=同日の他の台との差、2026年4月までの13か月): 区間が0より上だったのは、「Xのつく日×末尾X」のジャグラー系(+0.84pt[+0.27, +1.37])と、同じ型のスマスロ北斗の拳(9か月、+4.37pt[+0.31, +9.05]、7/9か月でプラス、選ばれた数字は8、0、5、1)の2つだけ。北斗以外のRB側は+1.53pt[-0.61, +3.52]で、0をまたぐ。曜日×末尾、曜日×角番、Xのつく日×角番、Xのつく日×任意の末尾は、どの区分も区間が0をまたぐ(ハナハナ系の曜日×末尾は-1.72ptで、むしろ低い)。2026年5月以降は、ジャグラー系の「Xのつく日×任意の末尾」(7×7を選ぶ)が+3.04pt[+1.68, +4.42]、AT等の「Xのつく日×角番(角3以上)」が+2.29pt[+1.46, +3.29]で、いずれも5か月分だけ。型は19通りを試したので、偶然で1〜2つ出る数。同じ型(Xのつく日×末尾X)が、ジャグラーと北斗の2つの区分で出た点が、偶然より信用できる。
- 設定差への換算: ジャグラーの機械割は、設定1が96〜97%、設定6が105.5〜109.4%(1→6の差は8.5〜12.4pt、隣の設定との差は平均1.7〜2.5pt)。+0.84ptは、設定1と2の間(設定6の台が約7〜10%多い)で、実戦で見分けられない大きさ。+2.3ptは設定3の手前、+3.8ptは設定3相当、+5.7ptは設定4相当で、末尾7の11台のうち半分近くが高設定という配分に当たる。北斗の+4.4ptは、設定1→6の差(約15pt)の約3割。
- 「9のつく日×末尾9」(北斗以外のRB側、2026年7〜9月、+5.02pt)は、機種別に見ると、マギアレコード(2台、109.6%)とからくりサーカス2(6台、105.5%)に支えられ、上位3機種を除くと-0.51ptに消える。ルールではなく、特定の機種の特定の台。マギアレコードは、楽園ではAT初当りの列が取れていない機種(別のinstinct at-rb-audit-must-be-per-hall)。
- 注意(訂正): 1台日の差枚の差(全期間で+340枚[+160, +544]、16/18か月)は、客の集中で回転数が増えた分を含み、過大。勝っている台ほど打ち続けられるので、回転数が多い台日の差枚はプラスに出やすい。1人の実際の損益は機械割×遊技回数なので、差枚の差は使わず、機械割で見る。
- 末尾7の始まりは改装前の2026-05-07: 5/7〜9/27の15日すべてで、末尾7のジャグラーの平均差枚がプラス(1台日+1118、勝率0.71、約7800G。他の末尾は+65、0.42)。2025/1〜2026/4の48日は、末尾7が-120(勝率0.34)で他の末尾(-70)より低め。ウォークフォワードでは、5月の翌月の6月に7を選べた(前3か月の差+245)。
- (A) 機種×曜日: 前3か月で、RBが+10%以上高い機種×曜日の上位3つを選び、翌月に実行。14か月で、選んだセル−ランダム選択は-45枚/台日[-225, +125]、−同機種の他曜日は-31枚[-235, +157]。1か月の台日は6〜90で、優位は検出できない。
- アレックス月曜(個別): データは2025/7から。RB比は、改装前の12か月は-30%〜+5%(2026/4〜6は-30%、-20%、-11%)で、月曜が高いのは改装後の7月(+42%)、8月(+16%)、9月(+13%)だけ。全期間15か月の月曜は、差枚-85、勝率0.373、機械割99.1%(他の曜日は+58、0.415、100.5%)。(A)の「優位なし」は選び方の話で、アレックス月曜を否定するものではないが、弱まった。
- 注意: 区間は、訓練の期間が月どうしで重なるため、少し狭い(独立な月は18よりずっと少ない)。「Xのつく日×末尾Xのジャグ」という型は、改装後の7を見たあとで選んだので、型の選び方は事後。他のホールには当てはまらない。

## アクション
- 月次の行動メモの第一候補は、毎月の月初に、前3か月で最も勝っていた「Xのつく日×末尾Xのジャグラー」の数字へ選び直す(固定の数字を長く使わない)。10月は7。
- 勝つ数字は3〜4か月ごとに入れ替わる前提で、毎月、前3か月で選び直す。入れ替わりの直後の1か月は外れる(5月は7の始まりで、直前の数字が負けた)。
- 行動メモの型は、「Xのつく日×末尾X」(ジャグラー系、北斗)を主にする。曜日×末尾、曜日×角番、角番、任意の末尾の組み合わせは、前期に残らなかったので、根拠にしない。第二候補は、ジャグラー系で、前3か月の訓練で2位だった数字(10月は0のつく日×末尾0、+2.71pt)。
- 機種を絞らない区分(例: 北斗以外のRB側)で、ある日×末尾が高く出たときは、機種別に内訳を見て、上位の機種を除いても残るかを確認する(「9のつく日×末尾9」は、除くと消えた)。
- 機種×曜日を、毎月自動で選ぶ方法は、行動メモの根拠にしない。個別の機種×曜日(アレックス月曜など)は、台帳の事前登録で、新規データから判定する。
- アレックス月曜は「様子見」に下げる(改装前の12か月は強くなかった)。台帳の累計12日の判定は続ける。
- 「勝てた」を見るときは、差枚だけでなく、座れるか(末尾7は約7800G回され埋まりやすい)、途中でやめられる実際の損益との違い、勝率(約0.71で、約3割は負ける)を並べる。

## 例
2026年6月は、前3か月(3〜5月)で、7が差+245と最大だったため、7のつく日の末尾7のジャグラーを選べた。結果は、機械割が他の末尾より+5.69pt(勝率0.71)。同じ方法で、5月は数字1を選び、結果は-1.52pt(7の始まりの月で、前の数字は外れた)。
