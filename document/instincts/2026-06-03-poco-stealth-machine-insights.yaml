# 戦国乙女4の設定投入日はぽこ報告日とずれている可能性

## 背景
戦国乙女4は二重の矛盾を示している:
1. ぽこが報告した日（23回言及）→ Top3命中率が低い（設定4水準）
2. ぽこが報告しない日 → ステルスTop3に11回出現（+3,280差枚）

台数: 平均7.5台（大型機種）、K1に73%集中

## アクション
- 戦国乙女がぽこ報告日: 設定4〜5と割り引いて読む
- ぽこ非報告日の戦国乙女の差枚を個別に確認する価値あり
- ホールがぽこの報告サイクルを把握してタイミングをずらしている可能性

## 例
ぽこ報告日の戦国乙女: 平均差枚 +設定4水準
ぽこ非報告日の戦国乙女: ステルスTop3に11回、差枚+3,280

