# K1のアズールレーン・シャーマンキングは継続的なステルス高設定機種

## 背景
色物台・台数<3台を除外した精製ステルス分析（ぽこMiss日のTop3非報告機種）：

アズールレーン THE ANIMATION:
- K1で15/18回（83%がK1）、日曜に7回集中
- 平均差枚: +3,647（設定6水準に近い）
- 四半期別: Q3(5)→Q4(10)→Q1(3)、Q4に増加

シャーマンキング:
- K1:5回, K7:7回（両ホール）
- 平均差枚: +3,875（最高水準）
- 2026Q1でも5回出現（継続中）

## アクション
- K1の日曜日にアズールレーンを独自チェックリストに追加
- シャーマンキングは両ホールで継続的にステルス → 現地観察の価値あり
- 四半期ごとにステルス機種の継続性を再確認すること

## 例
K1の日曜: アズールレーン出現率7/18 = 38.9%（ぽこ非報告日のTop3）
両ホール: シャーマンキング 2026Q1でも5回継続

