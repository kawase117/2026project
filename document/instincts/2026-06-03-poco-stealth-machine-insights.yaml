# ステルス機種はホール側に認知されると投入パターンが変わる可能性

## 背景
いざ！番長のステルス出現推移: Q3(6回)→Q4(3回)→Q1(0回)
DMC5: Q3(2回)→Q4(7回)→Q1(0回)
→ Q4にピークを迎えた後、2026Q1に突然消滅

仮説: ぽこ（または観察者）が認知し始めると、
ホール側がその機種への設定投入パターンを変える。

## アクション
- ステルス機種リストは四半期毎（3ヶ月）に更新・検証する
- 急に消えた機種は「認知されて変更された」可能性を疑う
- 新しく出現し始めた機種に注目する（継続的監視が重要）
- 現時点で継続中: アズールレーン（Q1:3）、シャーマンキング（Q1:5）

## 例
いざ！番長: Q3→Q4→Q1 = 6→3→0（消滅）
シャーマンキング: Q3→Q4→Q1 = 4→3→5（継続・安定）

