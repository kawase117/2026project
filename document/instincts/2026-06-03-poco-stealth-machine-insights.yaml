# 色物台・低台数機種はステルス分析から除外する

## 背景
スーパービンゴネオ等の「色物台」は前後日の稼働がほぼゼロで、
マグレの大差枚を1回出すことで分析を歪める。
ユーザーの指摘：「ここに注目しすぎると見え方が歪んでしまう」

除外基準:
- machine_count < 3（台数が少なすぎる）
- 色物台リスト: スーパービンゴネオ, ネオプラネット, チバリヨ2プラス

## アクション
ステルス機種分析の前処理として以下をフィルタリング：
```python
COLOR_MACHINES = {'スーパービンゴネオ', 'ネオプラネット', 'チバリヨ2プラス'}
MIN_COUNT = 3
# get_detailの結果から: r['count'] < MIN_COUNT or m in COLOR_MACHINES → 除外
```

## 例
スーパービンゴネオ除外前: ステルスTop3に登場（13回）
スーパービンゴネオ除外後: リストから消え、本質的なステルス機種が浮かび上がる

