# SBJミス日はバラエティカテゴリ複数機種への分散設定投入の可能性

## 背景
SBJ報告＆Top3ミス日(21日)の同日機種差枚:
- SBJ: 平均9.5台, +1354（設定4水準）
- ToLOVEる: 平均7.5台, +771
- バイオ5: 平均5.4台, +1403
- DMC5: 平均5.3台, +737

台数に差があるため単純な「同一投入」ではない。
「SBJに設定4、バイオ5に設定5」という分散配置の可能性が高い。

## アクション
- SBJがぽこ報告→Top3ミスの日は、設定4混在日として割り引く
- 同日のバイオ5・DMC5の差枚も確認する（より高い場合は分散配置）
- SBJの台数（平均9.5台）vs DMC（5.3台）の比率から設定配分を推測可能

## 例
SBJミス典型日: SBJ=+1354(9.5台) / バイオ5=+1403(5.4台)
→ 台数多いSBJに設定4、台数少ないバイオ5に設定5という分散配置を示唆

