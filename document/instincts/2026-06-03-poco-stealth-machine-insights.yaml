# ぽこ「ミス」は完全なハズレではなく設定4水準が多い

## 背景
ぽこ報告機種がTop3に入らなかった日（495件）の差枚分布を分析：
- 平均差枚: +1,387  中央値: +1,483
- 分布: <-1000が5.1%のみ、54.9%が+1000〜+3000（設定4〜5水準）
- 対してヒット時の平均: +4,208

設定4が入っているが設定6ではない状態が主流。
ホール側が「設定4の情報を意図的にリークしている」可能性も含む。

## アクション
- ぽこ「ミス」日を「外れ」と断定しない
- 差枚+1000〜+3000の機種はぽこ情報を割り引いて「設定4〜5」と読む
- ぽこ報告機種の差枚が-1000以下の場合のみ「情報が誤り」と判断する

## 例
SBJ報告ミス日の平均差枚: +1354 → 設定4水準（高設定ではあるが6ではない）
ヒット機種平均: +4208 → 設定6水準

