# バックテスト99〜100%は過剰適合の証拠

## 背景
新バックテスト（backtest_topk_full）：3F_N=100%、2F_A=100%、2F_N=99.3%（miss=1件）。
旧バックテスト（tmp_phaseabc_eval）：3F_N=89%、2F_N=95%。
ライブ評価（3日間）：3F_N precision≈50%。

ウォークフォワード構造自体は正しいが、ウィンドウ/λパラメータが
テスト期間データを見た後に選定されている可能性が高い（間接リーク）。

## アクション
- バックテスト精度95%超は「参考値」のみとして扱う
- 真の汎化性能 = ライブ評価の蓄積（20日以上必要）
- クリーンな再評価：2025年12月以前データのみでパラメータ確定後、
  2026年データで完全holdout評価を実施する

