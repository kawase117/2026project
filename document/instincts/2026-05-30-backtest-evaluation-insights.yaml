# pred_span_top12 が予測品質の決定因子

## 背景
600ステップのウォークフォワードバックテスト（2026-01-01〜05-30）で、
top1とtop2の予測スコア差（pred_span_top12）が精度の最強予測因子と判明。

span別の実際差枚格差（2F_N）：
- < 0.001：top1=29,820 vs top2=30,260（top2が上の場合あり）→ 推奨不可
- > 0.5：top1=30,854 vs top2=7,712（差 +23,142）→ 高信頼

## アクション
- pred_span_top12 < 0.05：「推奨なし」として出力する
- pred_span_top12 > 0.2：高信頼予測として採用
- 予測出力スクリプトにspan閾値フィルタを組み込む

## 例
```python
if row['pred_span_top12'] < 0.05:
    label = "推奨なし（確信度不足）"
elif row['pred_span_top12'] > 0.2:
    label = f"高信頼: 末尾{row['top1_tail']}"
else:
    label = f"参考: 末尾{row['top1_tail']}（中程度）"
```

