# hit@2のバイナリ指標とprecision指標を混同しない

## 背景
コードの `hit_at_2` はバイナリ（1件でも一致したら1.0）だが、
ユーザーの手動評価は precision（一致数/2）。この違いで
「コード89%」vs「手動50%」という見かけ矛盾が生じた。

ランダム基準値：
- バイナリhit@2：37.8% （= 1 - C(8,2)/C(10,2)）
- precision：20% （= 2×2/10 / 2）

月次CSVの `precision` 列 = |pred∩actual|/2 = 手動評価と同定義。

## アクション
報告時は必ず指標の種別とランダム基準を併記する。
手動評価との比較には月次CSVの `precision` 列を使用する。

