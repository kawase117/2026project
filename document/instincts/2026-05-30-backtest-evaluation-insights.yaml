# 予測末尾の翌日持続性はゼロ（反持続性の傾向あり）

## 背景
150日ペアのバックテストで翌日一致率を検証：
- 今日top1末尾 = 明日top1末尾：6〜12%（ランダム10%と同等）
- 今日の高diff末尾が翌日も高diff：p値0.47〜0.72（有意差なし）
- 3F_N/3F_A：6〜7%でランダム以下（反持続性）

## アクション
「昨日良かった末尾を今日も狙う」戦略は採用しない。
各日完全独立として予測を更新する。
反持続性は「同じ末尾を連続投入しない店側意図」の特徴量として検討可能。

