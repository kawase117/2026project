# hit@3での救済はランダムノイズ（3位固有シグナルではない）

## 背景
バックテスト141日：
- 3位救済日（hit@2=0 but hit@3=1）のpred_span：
  - 2F_N=0.003、3F_N=0.149、3F_A=0.057（全て低〜中）
- hit@2成功日のpred_span：0.725/0.582/0.464（高）

3位が当たるのは「低span日にランダムで当たる」ケース。
Top3まで広げても統計的シグナルは存在しない。

## アクション
- 実践ではTop2を基本とし、Top3は使わない
- 低span日はTop3でも推奨しない
- hit@3はモデル評価指標として使用不可
