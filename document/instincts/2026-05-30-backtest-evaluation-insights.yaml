# 水曜日は全セグメントで予測精度が構造的に低い

## 背景
バックテスト141日の曜日別分析で水曜日のみ精度が急落。
水曜専用モデルは学習データ不足（週1回）で汎化失敗。

低span発生率（pred_span < 0.1）：
- 3F_N：水曜75% vs 火曜10%
- 3F_A：水曜70% vs 火曜35%
- 2F_N：水曜25% vs 火曜0%

水曜のprecision：3F_N=37.5%（ランダム20%に近い）、3F_A=42.5%

## アクション
水曜日は「推奨なし」または警告付きで出力する。
水曜専用モデルのmin_train_days_wedを増やすか、
水曜は非水曜モデルにフォールバックする実験を検討する。

