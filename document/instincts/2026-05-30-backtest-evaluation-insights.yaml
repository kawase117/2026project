# 3F_N が実践で最も安定したセグメント

## 背景
3日間のライブ評価：3F_N h@2=3/6（50%）が唯一ランダムを明確に上回った。
バックテストでも3F_Nは非水曜・高span条件でprecision=80%。
2F_Nはバックテスト78%だが実践では乖離が大きい（モデル選択バイアスの影響が強い可能性）。

## アクション
実践での優先順位：3F_N > 3F_A > 2F_N > 2F_A
2F_Nの高バックテスト精度を実践に期待しすぎない。

