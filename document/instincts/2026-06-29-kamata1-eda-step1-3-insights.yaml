# 蒲田1セクション履歴ランキング: イベント/非イベント分割で大幅改善

## 背景
section_lateral_expansionの全日混合walk-forwardでは蒲田1のrho≈0.018（4ホール中最弱）だった。
原因はイベント日と非イベント日でセクション順位が入れ替わるため、全日混合するとキャンセルし合う構造。
イベント/非イベントで訓練データを分割するsplitモデルを検証。

## アクション
**splitモデル**: 評価日がイベント日→イベント日のみの履歴で訓練、非イベント日→非イベント日のみの履歴で訓練

walk-forward結果（60日評価、top_k=5）:
- all→all (baseline): rho=0.169, sec_lift=1.118, mac_lift=1.139
- nonevent→nonevent: rho=0.181, sec_lift=**1.248**, mac_lift=**1.266** (top5 hit=40.2%)
- event→event: rho=0.133, sec_lift=1.117, mac_lift=1.126
- all→event: sec_lift=**0.995** (1.0以下=ランダム以下)

**非イベント日に限定すれば予測力が大幅改善。イベント日は全日混合では予測不可。**

## 例
```python
# splitモデルの実装
is_event_day = target_dt.day in EVENT_DDS
if is_event_day:
    train = train[train['is_event'] == 1]
else:
    train = train[train['is_event'] == 0]
section_scores = train.groupby('section')['hit'].mean()
```

