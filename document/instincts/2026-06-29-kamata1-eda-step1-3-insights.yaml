# 蒲田1 イベント日台レベル予測: hybrid sec3+mac10 が有効

## 背景
Event-responsive 3セクション（2143-2146, 2099-2109, 2060-2076）計32台の中で、
イベント日に台レベルの絞り込みが可能かを検証。
セクション単独（sec_only k=5）ではlift 1.053に対し、
セクション→台の2段階絞り込みで大幅改善。

## アクション
**walk-forward比較（イベント日33日評価）:**
| 方式 | lift | precision | 差枚優位 | 候補台数 |
|------|------|-----------|---------|---------|
| sec_only k=5 | 1.053 | 36.3% | +93 | 28 |
| sec_only k=3 | 1.111 | 38.5% | +242 | 13 |
| **sec3+mac10 (hybrid)** | **1.212** | **41.7%** | **+378** | **9** |
| resp内 top3 | 1.331 | 47.5% | +263 | 3 |

**推奨: sec3+mac10**（top3セクション→その中のtop10台、候補≈9台）

**角番効果（Event-responsive × イベント日限定）:**
全体の残差法では角番効果3pp未満だが、条件限定で差枚に明確な信号あり:
- 角番7: hit 46.0%, 差枚+970 — 台2066(hit53.1%,diff+1056) + 台2070(hit38.5%,diff+878)
- 角番5-6: hit 40%, 差枚+481
- 角番1: hit 35.1%, 差枚+75（最弱）

**2066を除外しても角番7（台2070単独）の差枚+878は全角番中トップクラス。**
hit率だけで見ると+1.7ppに落ちるが、差枚で評価すれば角番7は明確に最強位置。
→ 優先順位は2066→2070。hit率と差枚の両面で評価すべき。

## 例
イベント日の運用フロー:
1. イベント日履歴でセクションスコア算出 → top3セクション選出
2. top3セクション内の台をイベント日履歴でスコア → top10台を候補
3. 候補≈9台の中から、角番5-7を優先、角1は避ける
4. 台2066/2070が候補に入っていれば最優先

