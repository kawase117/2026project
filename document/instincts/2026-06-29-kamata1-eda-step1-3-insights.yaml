# 評価指標の教訓: hit率と差枚の乖離に注意

## 背景
蒲田1の角番7分析で、台2066を除外すると角番7のhit率は46.0%→38.5%（delta +1.7pp）に落ち、
hit率ベースでは角番5-6（+3pp）より弱く見える。
しかし差枚ベースでは台2070単独でも+878で全角番中圧倒的トップ。

## アクション
- hit率が高くなくても差枚が大きい台は「勝つ時に大きく勝つ」パターン
- 特に少数台（n=122程度）ではhit率の分散が大きいため、差枚での補完評価が必要
- 「hit率ではシグナルが薄い→見せかけ」と即断してはいけない
- 効果量の評価にはhit率(precision)と差枚(profit)の両面を使うこと

## 例
角番7: hit +1.7pp（弱い）だが差枚+878（圧倒的）→ 差枚で見れば最強位置
