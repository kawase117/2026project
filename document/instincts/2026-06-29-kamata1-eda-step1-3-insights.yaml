# 蒲田1: games_normalizedは当日設定の同時シグナル（リード信号ではない）

## 背景
min_games=3000で性能が大きく向上する理由を調査。回転数が高設定の信号なのか、
単なるノイズ除去なのかを5つの検証で切り分けた。

## アクション
**発見1: 当日の同時相関は巨大**
- 同日同セクション比較: >=3000G hit=35.7% vs <3000G hit=23.2% (gap=+12.5pp)
- 高設定台は回される（因果: 設定→回転数）

**発見2: 前日回転数は翌日hitを予測しない**
- 前日>=3000G → 翌日hit=31.6% vs 前日<3000G → 翌日hit=32.8% (gap=-1.1pp)
- むしろ逆方向。前日高設定→翌日は下げるホール行動と整合

**発見3: 強セクションほど低稼働（逆相関rho=-0.510, p=0.004）**
- 2399-2415（常時HOT, hit=37.9%）: 3000G+比率=56.8%（最低）
- 2187-2190（COLD, hit=25.3%）: 3000G+比率=84.8%（最高）
- 穴場セクション構造: 客が少ないが設定は入っている

**結論: min_gamesフィルタの効果はノイズ除去が主因。**
ただし3000Gまで上げると穴場HOTセクションのデータが半減するリスクあり。
2000Gが安全な妥協点。

**注意: 新台は設定不問で高回転するため、次回以降の分析では新台を除外して
計算する方がgames_normalizedの信号をより正確に捉えられる。**

