# 蒲田1 バックテスト結果: splitモデル top_k=5 が最良

## 背景
Step 5バックテスト（120日評価）で、splitモデル（イベント/非イベント分割訓練）と
baseline（全日混合訓練）を比較。

## アクション
**全体（120日）**:
| モデル | top_k | precision | lift | 差枚優位/日 |
|--------|-------|-----------|------|------------|
| split | 5 | 38.0% | 1.182 | +247 |
| baseline | 5 | 36.5% | 1.135 | +176 |
| split | 10 | 36.0% | 1.119 | +140 |
| split | 20 | 34.2% | 1.064 | +27 |

**内訳**:
- 非イベント日(87日): split precision=38.3%, lift=1.202, 差枚優位+274
- イベント日(33日): split precision=37.2%, lift=1.128, 差枚優位+173

**推薦枠**: top_k=5（~27台/日）が推奨。top_k=10でliftが1.119に急落。
**差枚換算**: top5選択で1日あたり+247枚優位 → 月20日で約+4,940枚

**Lift drop-off**: K=5→10で急落するため、推薦枠を広げすぎないこと。

## 例
運用フロー:
1. 当日のDDを確認 → EVENT_DDS該当ならイベント日モード
2. 過去90日の同モード（event/nonevent）履歴でセクションスコア計算
3. top5セクション内の台から選択（~27台が候補）
4. 1日1台を上から順に確認する運用

