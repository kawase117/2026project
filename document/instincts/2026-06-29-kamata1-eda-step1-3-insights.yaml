  - 2000→3000: lift +0.022、差枚+178改善、台数23→17（候補が狭すぎるリスク）
  - **2000を採用**
- top_k: K=5がバランス最良。K=3はlift 1.149でK=5より低い。K=7以上でlift急落

**最終パラメータ:**
| パラメータ | 値 | 変更 |
|-----------|-----|------|
| window_days | 90 | 変更なし |
| min_games | 2000 | 1500→2000 |
| top_k | 5 | 変更なし |
| EVENT_DDS | {1,7,11,17,21,22,27,30,31} | 30追加 |

