# Aは推薦面から分離、分析面では維持

## 背景
Aタイプ（ジャグラー等）は以下の理由でAT機より推薦優先度が低い:
- 機械割の絶対値がATより低い（設定6でも109%程度）
- 打ちながらの設定判別が困難で、低設定を長時間打つリスク
- Top50に入りにくく、差枚ベースの評価で不利

しかしAを分析面から外すのは危険:
- Aの設定投入パターンはATの投入パターンと相関する可能性
- 「3F_L_Aの角番が熱い → 3F_L_Nでも角番が熱い可能性」
- ホール全体の投入構造を読む「センサー」としての価値

## アクション
- Aを推薦のMainランキングからは外す（Contextに回す）
- 第1層gate、第2層rankingの学習にはA込みのデータを使う
- 第3層配信でAT優先に並べ替える
- 「Aをランキングから外す」と「Aを推薦面から分離する」は異なる操作

## 例
```
NG: A台を学習データから除外 → A由来の投入パターン情報を喪失
OK: A込みで学習、配信時にAT優先で出力
    Main: AT Top10 (pure score order)
    Context: "3F_L_A角番活性 → 3F_L_Nでも角番に注目"
```

