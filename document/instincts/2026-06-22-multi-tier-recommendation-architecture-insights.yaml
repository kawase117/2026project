# ゲートはabsolute判定、ランキングはrelative。ANDで単一ラベル化しない

## 背景
ゲートの教師ラベル候補として3案が議論された:
1. segment内Top20%のみ → 全台低設定日でも正例が出る問題
2. hit_an閾値超えのみ → セグメント間で閾値が異なる問題
3. Top20% AND hit_an閾値 → 正例が減りすぎる問題（Codex指摘）

Codexの推奨は「ANDの一発固定ではなく2段階」:
- absolute（hit_an閾値）はゲート用の日/セグメント活性判定に使う
- relative（segment内Top20%）は第2層ランキングの教師に使う
- 両者を混ぜて単一ラベルにしない

蒲田七は平日にも設定を入れるホールなので、absolute gateを厳格にしすぎると
有用な日まで落としてしまうリスクがある。

## アクション
- 第1層: absolute指標で「そのセグメントが戦える日か」を判定
- 第2層: 活性セグメント内でrelative rankingを作る
- absolute AND relativeの単一ラベル化は避ける
- ゲート閾値（N=1 vs 2 vs 3）は実データ分布で決定する

## 例
```
第1層 gate_positive(日, セグメント):
  そのセグメントで hit_an閾値超え かつ G>=400 の台が N台以上
  → N の値は segment_daily_counts.csv の分布から決定

第2層 ranking_target(台):
  活性セグメント内でのTop20%か否か（relative）
```

