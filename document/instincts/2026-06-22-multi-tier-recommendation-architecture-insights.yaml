# 3層構造: gate(absolute) + ranking(relative) + delivery(運用)

## 背景
蒲田7の推薦システムは3つの異なる目的を同時に達成する必要がある:
1. 投入検知: 今日このセグメントに高設定が入っているか
2. 台選択: どの台が高設定候補か
3. 運用対応: 取られた場合の代替、Aを構造シグナルとして活用

これらを単一モデルで処理するのは無理があり、層を分けるべき。

## アクション
第1層(gate): absoluteな閾値で日×セグメントの活性/非活性を判定
  - 入力: 過去N日のhit_an率、イベント日フラグ等
  - 出力: 活性/非活性の二値
  - 全台低設定の日はここで推薦を抑制

第2層(ranking): 活性セグメント内でのrelativeな台順位
  - 教師ラベル: segment内Top20%（relative target）
  - absoluteは第1層で処理済みなので、ここはrelativeに集中

第3層(delivery): 運用向けの最終出力
  - Main: AT純粋スコア順Top10（制約なし）
  - Backup: 機種被りを軽く崩した次点5-8
  - Context: Aセグメントの構造情報（角番傾向、島活性度）

## 例
```
朝のチートシート出力:
  [Gate] 3F_L_N: 活性 / 3F_R_A: 非活性 / 2F_L_N: 活性 ...
  [Main] 1. 台3045(3F_L_N) 2. 台2015(2F_L_N) ... 10. 台3280(3F_R_N)
  [Backup] 11. 台2105(2F_R_N) ... 18. 台3310(3F_R_N)
  [Context] 3F_L_A: 角番台が活性日に強い傾向
```

