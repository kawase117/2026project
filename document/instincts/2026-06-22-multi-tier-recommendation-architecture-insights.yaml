# ルールベース先行、MLはshadow modeで並走

## 背景
過去のML挑戦は「ラベルと特徴量の未整備」で失敗していた。
今回segment分解等の新知識が増えたがすぐにML本番化するのは危険。
改善したのか複雑化しただけなのか判定しづらくなる。

3者合意で選択肢3（並走だが主系はルール）を採用:
- 本線: ルールベースで第1層-第3層を完成
- 並走: 第2層だけMLベンチを作る（shadow mode）
- 判定: MLがルールを安定して上回った時だけ昇格

## アクション
- まずルールベースで全層を動かし、失敗箇所を可視化する
- 同一ラベル・同一特徴量でCatBoost二値分類をshadow実行
- ML昇格条件は3条件同時達成:
  1. Main Top10のprecision: ML > Rule + 5pp以上
  2. 非活性日での偽陽性率: Rule以下
  3. Front/Back安定性: 前半/後半の両方でRule超え

## 例
```
本番配信: ルールベーススコアで Main Top10 を出す
shadow: 同じデータでCatBoostスコアも計算
比較ダッシュボード: rule_precision vs ml_precision, 日別の差分
昇格判定: 3条件を90日以上の期間で安定達成したらMLに切り替え
```
