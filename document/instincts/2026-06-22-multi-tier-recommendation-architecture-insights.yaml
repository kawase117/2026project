# Top50は配信フォーマットであって学習ターゲットではない

## 背景
Walk-forward scoringのTop50は元々朝一チートシート用の候補生成だった。
しかし「全台を差枚で一列に並べてTop50を切る」ことを学習ターゲットにしていたため、
ATの高ボラ台がAの高設定を飲み込み、セグメント間の公平な評価ができなかった。

3者（ユーザー・Claude・Codex）の議論で以下が合意:
- Top50は「候補生成の母集団」としてはまだ使える
- 捨てるべきは「全台差枚で切る単一ターゲット設計」
- この問題は投入検知・台選択・代替候補・A構造シグナルが混在しており、単一ターゲットでは解決しない

## アクション
- 予測ターゲットを多段構造に分離する（第1層gate + 第2層ranking + 第3層配信）
- 「新しい単一ターゲットを1つ決めれば解決する」という発想を避ける
- Top50は配信の母集団として残すが、学習ターゲットからは外す

## 例
```
NG: target = 全台差枚Top50に入るか (単一ターゲット)
OK:
  第1層: 日×セグメント活性判定 (absolute gate)
  第2層: 活性セグメント内Top20% (relative ranking)
  第3層: AT優先Top10 + Backup + Context A (配信)
```

