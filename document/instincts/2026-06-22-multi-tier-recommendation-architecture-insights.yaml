# Mainは純粋スコア順、制約はBackupのみ

## 背景
「セグメント被りを制御すべき」という提案に対し、ユーザーから反論があった:
- 実際に埋まるのはセグメント単位ではなく機種単位
- 予測スコアが高い台を制約で落とすと予測の方向性を歪める
- セグメント分散より機種被りの制御が実運用に近い

Codexも「予測と運用を分けるべき」と同意:
- 予測スコアにはセグメント分散制約を入れない
- 配信ルール側でだけ、必要なら軽い多様化を入れる
- 本命まで分散させると、当てにいく力を落とす

## アクション
- Main Top10は純粋スコア順で出す（制約なし）
- 機種被りの軽い制御はBackupだけに入れる
- セグメント分散はハード制約にしない

## 例
```
NG: Main = 各セグメントから最大3台（分散制約）
OK: Main = 純粋スコア順Top10（たとえ8台が同セグメントでもOK）
    Backup = Mainと機種が被らない次点を5-8台
```

