# sectionは「特定の列（島）」1つを指す。フロアの広い区画だと誤解されないよう、報告時に物理的な範囲を明示する

## 背景
DD14ホール横断スキャンで「セクション2269-2281が有望」と報告した際、ユーザーから「Sectionというのは特定の列の台しか見ていないということですか？」と問われた。Heatmap/2F_floor_coordinates_kamata1.csvの実座標(X,Y)を確認したところ、セクション"2269-2281"の13台は全てY=36で共通し、X座標(5〜16、+17)だけが異なっていた。つまりsectionは物理的に横一列（1島）に並んだ連番台の集合であり、rank_from_min/rank_from_maxはその列の両端からの位置を表す。ただし全sectionが単純な水平列とは限らず、例えば"2001-2020"はX,Y両方が変化する斜めの島だった（フロアの実形状に応じて島が斜めに配置される場合がある）。

## アクション
「セクションX-Yが有望」のような報告をする際は、それが13〜20台程度の1つの物理的な島（列）を指しているのであって、フロアの広い区画ではないことを明示する。sectionの物理的な向き（水平か斜めか）を精緻に確認したい場合は、machine_number範囲やsection名だけで推測せず、必ずHeatmap/{hall}_floor_coordinates_*.csvのX,Y列を実際に確認する。

## 例
NG: 「セクション2269-2281が有望」とだけ報告し、フロアの広い区画であるかのような誤解を残す。
OK: Heatmap CSVでX,Y座標を確認 → セクション2269-2281は全13台がY=36の1列（水平）、セクション2001-2020はX,Y共に変化する斜めの1島、と物理的な範囲を明示した上で報告する。

