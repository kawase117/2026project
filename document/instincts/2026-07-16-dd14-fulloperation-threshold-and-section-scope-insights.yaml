# 「フル稼働」の閾値をG数で決め打ちせず、必ずそのホールの実分布(パーセンタイル)で確認する

## 背景
蒲田1セクション2269-2281のDD14データを分析した際、games_normalized>=1000を「フル稼働日」と呼んで低ゲーム数グループと比較する分解を行った。ユーザーから「1000Gでは足りません。フル稼働は5～6000Gほどになります」と指摘され、蒲田1全体のgames_normalizedパーセンタイルを実際に計算したところ p10=830, p25=1852, p50=3663, p75=5378, p90=6875, max=10503 であり、1000Gは全体の25パーセンタイル程度に過ぎなかった。この誤った閾値のまま「フル稼働日」とラベル付けして集計すると、実際には稼働時間が短い途中稼働台まで「フル稼働」に混入してしまう。

## アクション
「フル稼働」「full day」のような稼働完了を意味するラベルをG数閾値で表現する前に、必ず対象ホールのgames_normalizedの実際のパーセンタイル分布（p10/p25/p50/p75/p90/max）をSQLで確認する。ホールごとに営業時間・集客力・台数が異なるため、汎用的な閾値（1000G等）を他のホールやプロジェクト全体に流用しない。閾値の妥当性に確信が持てない場合は、ラベルを付ける前にユーザーに実分布を提示して確認を仰ぐ。

## 例
NG: `games_normalized >= 1000` を「フル稼働日」とラベル付け → 実際は25パーセンタイル相当で、大半の途中稼働台を含んでしまう。
OK: 事前に `SELECT games_normalized の percentile分布` を確認（p50=3663, p75=5378, p90=6875）した上で、5000G以上を「フル稼働」の閾値として採用。同じ蒲田1セクションの5000G以上グループ(n=41)は平均差枚-663.4・104%超え率36.6%という、より正確な実態を示した。

