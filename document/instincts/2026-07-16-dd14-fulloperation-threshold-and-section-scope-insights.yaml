# instance_startがDB記録開始日と一致する行は「導入日不明」であり、新台か否かの判定に使ってはならない

## 背景
「セクション2269-2281は平均差枚がマイナスなのに104%超え率が高い」という乖離について、ユーザーが「新台（リリース直後）は設定不問で高回転になりやすく、それが低設定でも混ざっているのでは」という仮説を提示した。検証のため machine_name の変化を LAG/window関数で検出し、各レコードの instance_start（現在の機種名になった開始日）から days_since_install を計算した。しかし多くのinstanceのinstance_startがDB記録の最古日(2025-01-01)と一致しており、これは「その日から導入された」のではなく「記録開始時点で既に稼働していた（真の導入日は不明）」ことを意味する左検閲(left-censoring)だった。この左検閲行を除外すると、games>=5000の41件中17件しか判定可能な行が残らず、さらに104%超えを記録した15件全てが除外された（判定不能な）側に集中しており、新台仮説は「確認も否定もできない」という結論になった。

## アクション
LAG/window関数でmachine_nameの変化点からinstance_start（導入日相当）を計算する際は、必ず `instance_start = MIN(date) across the whole table` に一致する行を検出し、それらを「導入日不明（左検閲）」として新台判定から除外またはフラグ立てする。除外せずに全instanceの経過日数をそのまま「新台か否か」の根拠にすると、記録期間より前から稼働している長期在籍台を誤って「起源不明の巨大サンプル」として結果に混入させ、因果関係の誤った結論（またはその逆の過度な否定）を招く。データの制約で判定不能な場合は、断定せず「このデータでは検証も反証もできない」とユーザーに正直に報告する。

## 例
NG: 全てのinstance_startをそのまま信頼し、`days_since_install <= 14`だけで新台フラグを立てる → DB記録開始日(2025-01-01)由来の左検閲instanceも「導入から〇〇日」と誤ってラベル付けされる。
OK: `WHERE instance_start <> (SELECT MIN(date) FROM machine_detailed_results)` で左検閲instanceを明示的に除外してから新台判定を行い、除外後のサンプル数が十分か（この事例ではn=17に激減）を必ず確認・報告する。

