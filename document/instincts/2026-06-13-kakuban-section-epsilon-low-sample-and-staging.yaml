# カクバン×セクション効果量分析でlow_sample=Trueが大量発生する原因と対処

## 背景
kamata_corner_mirror_analysis.py の summarize_section_kakuban_epsilon /
cat3 / fixed_effects は、load_hall_frame()（台番号1台=1行の集計フレーム）
に assign_kakuban() を適用したフレームを入力としていた。
_compute_kakuban_group_effect() は section×kakuban でグルーピングするが、
1台=1行フレームでは各グループが常にちょうど1行になり
（n_groups == n_rows）、Kruskal-Wallis検定の前提（各グループ
min_group_size>=2）を満たせず、ほぼ全セクションがlow_sample=Trueになった
（約70セクション中68）。

## アクション
セクション/カテゴリ単位でのKruskal-Wallis効果量検定（epsilon-squared等）を
行う際は、入力フレームが「グループ内に複数行あるか」を必ず確認する。
1台=1行の集計フレームでは不可能なので、load_hall_daily_frame()
（台×日で複数行を持つ日次フレーム）など、グループ内にバリエーションを
持つ粒度のフレームを別途用意して渡す。既存の集計版出力は変更せず、
ファイル名に_dailyサフィックスを付けて並行出力すると後方互換を保てる。

## 例
kamata_section_kakuban_epsilon_{file_slug}_{floor}.csv（既存・1台1行版、
ほぼlow_sample=True）に対し、
kamata_section_kakuban_epsilon_daily_{file_slug}_{floor}.csv（新規・
load_hall_daily_frame由来、台×日の複数行）を追加することで
min_group_size>=2を満たせる可能性が上がる。

