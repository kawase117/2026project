# epsilon検定を診断ゲートとして先行させ、cat3/fixed_effectsは結果を見てから追加する

## 背景
セクション粒度のカクバン分析を拡張する際、(a)全曜日＋日次フレーム化、
(b)フロア全体をA/N区分の大ブロックに集約、という2軸の拡張を計画していた。
当初プランではepsilon/cat3/fixed_effectsの全組み合わせ（daily×floor_segment）
を一括実装する想定だったが、ユーザーから「まずepsilonのみに絞るべきでは」
という指摘があり、見送る判断をした。

## アクション
epsilon（Kruskal-Wallis効果量）は「その粒度・グルーピングで見る価値が
あるか」を判定するゲート役。新しい粒度（daily化、ブロック集約など）を
試す際は、まずepsilonのみを全パターンで出力し、low_sample=Falseかつ
効果量が出た対象を確認してから、その対象に限定してcat3（near/mid/far等の
記述統計）やfixed_effects（機種集中度などの確認分析）を後追いで実装する。
こうすることで、信号がない組み合わせに対する診断コードの量産を避けられる。
[[exploration-coarse-to-fine]]の方針と同じ考え方。

## 例
4種類のepsilon出力（既存1台1行版、daily版、floor_segment版、
daily×floor_segment版）を先に生成・確認 → low_sample=Falseの対象が
判明した時点で、その対象だけにcat3/fixed_effectsをfloor_segment粒度で
追加するかどうかを判断する、という二段階の実装計画にした。

