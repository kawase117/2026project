# 「使えない変数」は最低3種類に分けて記録する。混ぜると短期法則を失う

## Core claim
検証で不成立になった仮説は、原因ごとに区別して記録しないと再利用できない。
最低でも「撤回（測定・定義が誤っていた）」「失効（当時は本物で、対象が変えた）」
「棄却（実用閾値を挟まないほど小さい）」の3種は分ける必要がある。特に撤回と失効を
同じ「使えない変数」に混ぜると、失効日という情報（環境側の変化点の手がかり）が
記録から失われる。

## Evidence
- n_observations: 1（`document/registry/HYPOTHESIS_LEDGER.md` の新設、楽園蒲田37行、2026-07-31）
- data scope: single-hall（設計自体はホール非依存）
- metric scope: other（記録方式の設計）
- result summary: 撤回9件・失効2件・検定不能3件など判定を分けて記録した結果、
  失効2件（技術介入clean列端番・ジャグclean列端番）が近い時期に集中しているという
  パターンが可視化できた。これは撤回と同じ箱に入れていたら見えなかった

## Interpretation
- 全期間プールでの「効果なし」判定は定常性を暗黙に仮定しており、数ヶ月だけ実在して
  消えた短期法則を必ず取りこぼす。しかも決着がついたように見えるため質問が誤って閉じる
- 判定には必ず有効期間を付す。期間の無い判定は「全期間」ではなく「未記入」として扱う
- 複数の独立した法則が同時期に失効していれば、それは環境側（店舗の方針変更等）の
  サインになりうる。個々の失効を見るだけでは分からない

## Action
- 仮説・検証結果を記録するときは判定を単純な二値（効くか効かないか）にせず、
  「撤回/失効/棄却/検出力不足/検定不能/期間限定成立」等に分けて残す
- 記録は1件1行の索引形式にし、詳細は別ファイルに逃がす。全件を俯瞰できる形を優先する
- 失効の記録には可能な限り変化のタイミングを付し、他の失効と時期が重なっていないか
  定期的に確認する

