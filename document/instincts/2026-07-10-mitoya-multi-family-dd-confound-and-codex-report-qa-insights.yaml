# みとやDD19・DD29の「仕掛け」仮説はホール横断8機種で支持されず

## 背景
ユーザー仮説「DD19やDD29に何か仕掛けがあるかもしれない」を、みとや大森町店の主要
ジャグラー系8機種(マイジャグラーV, アイムジャグラーEX-TP, ネオアイムジャグラーEX,
ファンキージャグラー2, ゴーゴージャグラー3, ミスタージャグラー, ウルトラミラクルジャグラー,
ジャグラーガールズ)×DD19/DD29の全16パターンで検証した(Codex委任、
`eda/mitoya_dd19_dd29_hallwide_check.py`)。

全16パターンとも「overall否定」。多くはtarget rate < rest rateとなり、
むしろDD19/29はやや低めのRB率を示す機種も複数あった(例: アイムジャグラーEX-TP DD29は
diff -0.013pp, p=0.0382)。曜日別交絡チェックでは一部(アイムジャグラーEX-TP DD19/29、
ネオアイムジャグラーEX DD29)で統計的に有意な曜日差が検出されたが、これはDD自体の
効果ではなく曜日側の変動が大きいことを示すのみで、pooled overall判定を覆さない。

## アクション
みとやでDD19/DD29を「高設定投入日」として運用候補に含めない。今後同様の
「特定DD(1桁固有ではない2桁DD)に仕掛けがあるかも」という仮説が出た場合は、
本件のスクリプト(`eda/mitoya_dd19_dd29_hallwide_check.py`, `eda/mitoya_umj_mister_common.py`)
を再利用し、単一機種でなく主要機種横断でoverall判定を確認すること。1機種だけの
検証では標本不足で誤判定しやすい。

## 例
DD19/DD29×8機種=16パターンの overall 判定はすべて「否定」。
diffが最大でもファンキージャグラー2 DD29の-0.032pp(p=0.0021、DD29の方が低い)で、
DD19/29が高設定投入日である根拠は一切見られなかった。

