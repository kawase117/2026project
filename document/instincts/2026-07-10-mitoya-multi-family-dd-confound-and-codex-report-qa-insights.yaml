# みとやの少数台ジャグラー系はDD9(Gals)以外でも「上位DD→投資量交絡」パターンが一般化する

## 背景
[[mitoya-gals-dd9-investment-confound-not-calendar-effect]]でジャグラーガールズDD9の
高RB率が投資量交絡(games-RB相関r=0.569)であって曜日/特定日/小標本偶然のいずれでも
ないことを確認した。この検証メソッド(vs rest検定・曜日/週末比較・単日集中シェア・
games水準別RB率+日付レベル相関・前半/後半期間比較)をウルトラミラクルジャグラー(5台)と
ミスタージャグラー(10台)に展開した結果(Codex委任、`eda/mitoya_umj_mister_dd_screening.py`):

- ウルトラミラクルジャグラー上位DD(24,27,7)は全て否定。games相関r=0.65〜0.76と
  Gals DD9(r=0.569)よりさらに強い投資交絡
- ミスタージャグラー上位DD(7,11)は否定。DD21のみ境界線で支持(vs rest p=0.046、
  games r=0.458 p=0.056でギリギリ非有意)だが年次で-3.1pp低下傾向
- さらにDD21を直近3ヶ月(2026-04/05/06)の日付別・台番号別に展開すると、
  設定4ライン(1/291.3=RB率0.00343)を超えたのは3回中1回(4/21の台723のみ)で、
  「境界線の支持」判定も個別日で見ると再現性が弱い

結論: DD9で発見した「上位DDに見えても大抵は投資量交絡」という法則は、Gals固有の
現象ではなくみとやの少数台ジャグラー系全体に一般化する。ただしミスタージャグラーDD21だけは
完全な否定にはならず、境界線上の弱いシグナルとして経過観察の余地がある。

## アクション
みとやの少数台機種で「topDD」候補が出た場合、まずGals DD9で確立した4軸チェック
(曜日/週末・単日集中シェア・games水準別+日付レベル相関・前後半期間比較)を必ず適用する。
vs rest p<0.05を満たしても、games相関のp値が0.05近辺(0.05-0.10)にある場合は
「ほぼ有意」として交絡を疑い続けること。pooled集計だけで支持/否定を判断せず、
可能なら直近の個別日付に分解して再現性を確認する(本件のDD21のように、pooled判定が
境界線の場合は個別日で大きくばらつくことがある)。

## 例
| 機種 | 上位DD | vs rest p | games相関r | 判定 |
|---|---|---|---|---|
| ウルトラミラクルジャグラー | DD24 | 0.0000 | 0.741 | 否定 |
| ウルトラミラクルジャグラー | DD27 | 0.0076 | 0.649 | 否定 |
| ミスタージャグラー | DD7 | 0.0028 | 0.796 | 否定 |
| ミスタージャグラー | DD21 | 0.0458 | 0.458(p=0.056) | 境界線(弱い支持) |

