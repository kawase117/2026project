# 委任先が生成したレポートのヘッドライン結論は行レベルデータと矛盾することがある

## 背景
Codex(codex-rescue経由)に委任したみとやUMJ/ミスタージャグラー検証タスクで、
生成された`eda/results/mitoya_umj_mister_dd_investigation.md`の末尾
「## Conclusion」セクションが「Overall verdict: **支持**」と書かれていたが、
直後の説明文3行(「明確なDDシグナルは見られない」「hot/coldパターンは安定しない」
「DD19/29仮説は支持されない」)はすべて否定的な内容で、行レベルの個別判定
(タスクA/B/C/Dほぼ全て「否定」)とも矛盾していた。さらにCodex自身のチャット返信
(codex-rescue結果)では「overallは否定です」と明言しており、Markdownファイル内の
ラベルだけが誤っていた(おそらく「否定」と書くべきところの取り違え)。

個別データ(行レベルのoverall列、pooled rate、p値)自体は一貫しており信頼できたため、
最終的にはそちらを元に否定の結論をユーザーに報告した。

## アクション
委任先(Codex/他エージェント)が生成した分析レポートを受け取ったら、末尾の
ヘッドライン結論(Overall verdict等の一言サマリー)を鵜呑みにせず、必ず
(1)行レベルの個別判定列、(2)委任先自身のチャット/口頭サマリー、の2つと
突き合わせて矛盾がないか確認すること。3者(ヘッドライン・行データ・口頭サマリー)が
一致しない場合は行データと口頭サマリーを優先し、ヘッドラインのラベル付けミスとして
ユーザーに明示的に指摘する。自分で代替分析を組み立てて「訂正」するのではなく、
既存データの中で信頼できる部分を特定して報告するに留める。

## 例
ヘッドライン「Overall verdict: 支持」 vs 行データ(タスクA/B/C/D計22行中支持は
1行のみ、境界線) vs Codexチャット「いずれも否定です」「支持できるものは
ありませんでした」→ 行データとチャットサマリーが一致していたため、
ヘッドラインのみを「ラベル付けミスの疑い」としてユーザーに報告した。

