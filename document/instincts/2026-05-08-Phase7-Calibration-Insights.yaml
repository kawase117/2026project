# 閾値最適化による Precision/Recall トレードオフ

## 背景
確率予測モデルの実用性は「どの確度の予測を使うか」で大きく変わる。

top_5 ターゲットでの例：
- 閾値 0.01: Precision 0.0702, データ数 4061
- 閾値 0.50: Precision 0.1014, データ数 1193
- 閾値 0.60: Precision 0.1192, データ数 604

## アクション
F1スコアを最適化せよ（precision と recall の調和平均）
1. 複数の閾値での「Precision・Recall・F1」を計算
2. F1が最大となる閾値を採用
3. ビジネス要件に応じて、F1最適値の前後 ±5-10% で調整

## 例
- 最適F1閾値: 0.4696 (F1=0.1645)
- 実務的な50%基準: Precision 0.1014 (F1=0.1637)
- 高精度60%: Precision 0.1192 (F1=0.1620)

