# 高確度サブセット戦略による精度向上

## 背景
確率が「50%以上」の予測だけを使うことで、precision を約 40-50% 向上させられる。

top_5 ターゲット例：
- 全データ（1%以上確度）: Precision 0.0702
- 50%以上確度のみ: Precision 0.1014 (+44%改善)
- 60%以上確度のみ: Precision 0.1192 (+70%改善)

## アクション
精度が重視される場面では：
1. 全データを使わず、高確度サブセットを選別する
2. 使用するデータ数と精度のバランスをビジネス要件に応じて調整
3. 「50%以上確度」が実用的な基準値

