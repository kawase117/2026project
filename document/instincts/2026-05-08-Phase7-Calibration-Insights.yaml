# ノイズの多い連続値特徴量のブロック化

## 背景
差枚・ゲーム数などの累積特徴量は非常に大きなばらつきを持つ：
- 差枚: -6000 ～ 19000（広すぎる範囲）
- ゲーム数: 0 ～ 3000（同様に広い）

このままでは、モデルが「±100円の違い」にまで反応してしまい、過学習につながる。

## アクション
高ばらつき連続値特徴量に対しては：
1. 固定幅ブロック化（pd.cut）を適用
   - 差枚: 500単位ブロック
   - ゲーム数: 500単位ブロック
2. バイニング後、ブロックIDをカテゴリ特徴として使用
3. 効率・ランク差など相対的な指標は「連続値のまま」保持

## 例
- 19500円 と 19800円 → 同じブロック ID
- 19800円 と 20300円 → 異なるブロック ID

