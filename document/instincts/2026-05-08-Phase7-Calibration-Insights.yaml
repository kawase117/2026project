# 閾値設定の前に確率分布を分析する

## 背景
適切な閾値を設定する前に、モデルが出す確率のレンジと分布を理解することが重要。

Phase 7 確認事実：
- rank_1: 0.003 ～ 0.888, 中央値 0.183
- top_5: 0.013 ～ 0.869, 中央値 0.403

## アクション
モデル構築後、必ず以下を確認：
1. 最小・最大確率を把握（モデルの出力範囲）
2. 中央値・パーセンタイル（75%, 90%, 95%）を確認
3. 目的のデータ比率に対応する確度を選定

## 例
- top_5 25パーセンタイル: 0.262
- top_5 50パーセンタイル: 0.403
- top_5 75パーセンタイル: 0.524
- top_5 95パーセンタイル: 0.673

