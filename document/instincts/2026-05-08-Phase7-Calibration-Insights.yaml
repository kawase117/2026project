# ECE（確率キャリブレーション）の重要性

## 背景
XGBoost の scale_pos_weight パラメータには2つの使い方がある：
- **Balanced（adjusted）**: precision/recall のバランスを取る（daily_hit_rate が高い）
- **Calibrated（=1.0）**: 確率スコアを信頼できるものにする（ECE が低い）

Phase 7 で両方を試したところ、Calibrated アプローチが ECE を 96-99% 削減した。

## アクション
XGBoost の確率予測モデルを構築する際は：
1. **Balanced モデルで基本性能を検証**（daily_hit_rate で確認）
2. **Calibrated モデルを本番採用**（ECE < 2% を目指す）
3. 確率スコアは「信頼できる」と見なす（リスク判断に使用可能）

Precision/Recall のトレードオフより「確率の信頼性」を優先せよ。

## 例
- rank_1: Balanced ECE 0.2065 vs Calibrated ECE 0.0018 → 99.1% 削減
- top_5: Balanced ECE 0.3232 vs Calibrated ECE 0.0118 → 96.4% 削減
- Calibrated 50%確度予測 → 実際に約50%の的中率

