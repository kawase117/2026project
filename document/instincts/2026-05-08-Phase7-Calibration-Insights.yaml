# キャリブレーション後の確率は信頼できるリスク指標になる

## 背景
Calibrated モデル（ECE < 0.02）を使えば、確率スコアをそのまま「リスク」または「確信度」として使用できる。

Calibrated top_5 モデル例：
- 「50%確度」の予測 → 実際に 50% の確率で的中
- 「60%確度」の予測 → 実際に 60% の確率で的中

## アクション
Calibrated モデルの確率スコアはビジネス判断に使用できる
1. 確度 0.70 以上 → 「高確度」（優先度 HIGH）
2. 確度 0.50-0.70 → 「中確度」（優先度 MEDIUM）
3. 確度 0.30-0.50 → 「低確度」（優先度 LOW）
4. 確度 < 0.30 → 無視（ノイズレベル）

## 例
- Balanced 0.50確度予測 → 実際 0.10 的中（大損失）
- Calibrated 0.50確度予測 → 実際 0.50 的中（期待通り）
