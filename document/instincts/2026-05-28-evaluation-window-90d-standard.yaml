# 評価ウィンドウの変更は予測Top3を即座には変えない場合がある

## 背景
90日標準化後に2026-05-27の再予測を実行したところ、全4セグメントで
旧予測と新予測のTop3が完全に一致した。
評価ウィンドウは「モデルを選ぶ基準」であり、選ばれたモデルが同じなら
予測Top3も同じになる。効果は長期的な蓄積で現れる。

## アクション
- 評価ウィンドウ変更の即日改善を期待しない
- 変化の有無はモデル選択（recent_60d vs full_2025）が変わったかどうかで確認する
- 効果検証は翌日予測と実績の継続突き合わせで蓄積する
- 2026-05-28の翌日予測（combined: 0,4,7,9,1）がその最初の検証対象

## 例
2026-05-27 再予測結果（変化なし）:
旧: 2F_N=3,0,7 / 3F_N=9,7,2 / 3F_A=7,5,4 / 2F_A=5,9,3
新: 2F_N=3,0,7 / 3F_N=9,7,2 / 3F_A=7,5,4 / 2F_A=5,9,3

