# テスト期間の評価標準は90日（recent_90d_standard）

## 背景
2026年全期間をテスト期間としていたため、2026年の最新トレンドが埋もれていた。
CODEXとの検討で60日・90日・全期間の比較を実施した結果、90日が採用された。
- full period(147日): Precision/F1=0.858, Hit@2=0.993
- last 90d: Precision/F1=0.865, Hit@2=0.992
- last 60d: Precision/F1=0.871, Hit@2=0.992
Hit@2が90d/60dで同点のため、expert間バランス（振れ幅の小ささ）で90日を選択。

## アクション
- 運用判断の主評価指標: recent_90d_standard を使用する
- 60日は補助指標（ドリフト検知用）として併用する
- 全期間は回帰監視用として保持するが主判断には使わない
- 実装場所: tail_ltr_split_rule_nextday_gpu.py / tail_time_adaptive_ltr_poc_improved.py
  --test-period-split-name のデフォルトを recent_90d_standard に変更済み

## 例
expert別F1の比較（90日を選んだ理由）:
| expert | full | 90d  | 60d  |
|--------|------|------|------|
| 2F_A   | 0.857| 0.878| 0.867|
| 2F_N   | 0.827| 0.839| 0.867|
| 3F_A   | 0.854| 0.844| 0.842|
| 3F_N   | 0.895| 0.900| 0.908|
60日は2F_N/3F_Nは良いが3F_Aが落ちる。90日がexpert間バランス最良。

