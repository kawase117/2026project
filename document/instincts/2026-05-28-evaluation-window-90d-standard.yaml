# 遡及比較は「分母（セグメント数）を揃えてから」行う

## 背景
2026-05-24の旧予測は2F_Aが旧版のため除外（3セグメント・分母9）だったが、
新予測は4セグメント（分母12）で比較してしまい、公平な比較にならなかった。
分母が異なると一致率の比較自体が意味を失う。

## アクション
遡及比較（retroactive comparison）の手順：
1. 旧予測と新予測で「使用セグメント数が同じか」を確認する
2. 異なる場合は「共通セグメントのみ」で比較する
3. 除外理由（旧版制約など）を明記する
4. 分母が異なる比較は「参考値」として別扱いする

## 例
2026-05-24 正しい比較（共通3セグメント: 2F_N/3F_N/3F_A）:
旧（9分母）: 5/9
新（9分母に揃えた場合）: 1/9（2F_Aを除外）
→ 旧が優れていた（4→9分母の不公平比較を修正した結果）
