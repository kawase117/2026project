# 蒲田七の3台並びクラスタは「番号増加方向（rightward）」が5/7曜日で支配的

## 背景
weekday_cluster_analysis.csv より:
- rightward（top1+1, top1+2方向にクラスタが伸びる）: 月・火・水・土・日（5曜日）
- leftward: 木曜のみ（0-1-2、top1=末尾2）
- centered: 金曜のみ（8-9-0、top1=末尾9が中央）

「強い末尾からみて番号が増える方向に高設定が並ぶ」傾向がホール全体に存在する可能性。
ただし循環（末尾9→0）を含む集計のため、物理的配置との対応確認が必要。

## アクション
ML特徴量設計では「top1の右隣（last_digit+1 mod 10）の実績」を追加候補として検討する。
right_neighbor_mean が left_neighbor_mean を上回る日は rightward クラスタが期待できる。

## 例
土曜: top1=6, right=7(224.3) > left=5(209.2) → rightward → 6-7-8クラスタ確認
水曜: top1=8, right=9(236.0) > left=7(139.6) → rightward → 8-9-0クラスタ確認

