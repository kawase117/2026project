# 2番目に強い末尾（top2）は6/7曜日でbest_clusterの外にある

## 背景
weekday_cluster_analysis.csv で top2 が best_cluster 内にある曜日は月曜のみ（top2=4 in 2-3-4）。
残り6曜日はすべてクラスタ外:
- 火: top2=9、cluster=6-7-8
- 水: top2=1、cluster=8-9-0
- 木: top2=7、cluster=0-1-2
- 金: top2=6、cluster=8-9-0
- 土: top2=2、cluster=6-7-8
- 日: top2=1、cluster=6-7-8

「ホールは1箇所まとめてではなく2拠点に分散して高設定を投入する」可能性を示唆。

## アクション
台選び戦略: 最強クラスタ（top1周辺3台）に加え、top2末尾も別途モニタリングする。
MLでは「クラスタ内末尾」と「孤立強末尾（top2）」を別特徴量として扱うことを検討。

## 例
土曜: best_cluster=6-7-8(mean=254.1) + top2=末尾2(mean=266.1) が別拠点
→ 6・7・8 と 2 が同時に出るなら2拠点に高設定が入っている可能性がある
