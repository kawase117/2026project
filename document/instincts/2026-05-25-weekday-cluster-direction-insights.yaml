# 末尾6は火・土・日で最強かつ常に6-7-8クラスタを形成する

## 背景
weekday_cluster_analysis.csv より:

| 曜日 | top1 | best_cluster | best_cluster_mean |
|------|------|-------------|------------------|
| 火   |  6   |   6-7-8     |      264.6        |
| 土   |  6   |   6-7-8     |      254.1        |
| 日   |  6   |   6-7-8     |      219.4        |

3曜日すべてで top1=末尾6、best_cluster=6-7-8 で一致。
土曜の末尾6(307.8)は全データ（全曜日・全末尾）の中で最高値。

## アクション
「火曜・土曜・日曜の朝一台選びでは 6-7-8 クラスタを最優先」という運用ルールとして利用できる。
LTR特徴量: `is_fire_or_sat_or_sun AND last_digit in ["6","7","8"]` の交互作用を検討。

## 例
土曜 6-7-8 cluster_mean=254.1（土曜全末尾平均≈209比 +22%）
日曜 6-7-8 cluster_mean=219.4（日曜全末尾平均≈186比 +18%）

