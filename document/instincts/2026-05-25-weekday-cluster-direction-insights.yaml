# 木曜は唯一の leftward クラスタ（0-1-2）。他曜日と対照的な低番号帯パターン

## 背景
weekday_cluster_analysis.csv より:
- 木曜: top1=末尾2(259.3), best_cluster=0-1-2(241.5), direction=leftward
- 他5曜日はrightwardまたはcentered

木曜だけが低番号帯（末尾0〜2）に設定を集中させており、
末尾7(254.0)も木曜では2番目に強いがクラスタ外の別拠点にある。

## アクション
木曜専用の特徴量: `is_thursday AND last_digit in ["0","1","2"]` を検討。
信頼度0.75（原因不明・サンプル46日）のため walk-forward での確認必須。

## 例
木曜 mean_diff 上位: 末尾2=259.3, 末尾7=254.0, 末尾0=247.3（非連続な2拠点）
best_cluster=0-1-2 が leftward → 木曜のみ番号減少方向にクラスタが伸びる

