# 楽園蒲田「外した末尾の隣に入れる」は未確認。向きは正だが、緩い判定では原理的に検出できない

## Core claim
予告が名指しした末尾が外れたとき、その隣（末尾±1）に設定が寄る、という規則は
**現時点で確認できていない**。否定でもない。効果があるとしても、いまの検出力では
捉えられない。

⚠️ **「隣が他より強かったか」という判定を使ってはいけない。** 隣は9個の非名指し末尾の
うち2つなので、「2つのうち少なくとも一方が残り7つの平均を上回る」確率は
**無情報でも約75%** ある。この判定で高い成功率が出ても、それは規則の証拠にならない。

## Evidence
楽園蒲田、予告が末尾を名指しした25日・41件（2026-06-06〜09-09）:

| | 件数 | 割合 |
|---|---|---|
| 名指しの末尾が当たった | 25 | 61% |
| 外れたが隣が他より強かった | 13 | 32% |
| 名指しも隣も外れ | 3 | 7% |

名指しが外れた16件のうち隣が強かったのは **81%**。だが上記のとおり帰無が約75%なので
z≈0.58 で偶然と区別できない。連続量で見ると隣の残差は他より平均 +155枚だが、
2件（6/17末尾6 +1,226、7/17末尾6 +742）が引っ張っており中央値 +138枚。

別の切り口（「その日いちばん弱かった末尾」の隣、98日）でも
隣 +54枚 vs それ以外 +40枚（差+14枚, t=0.66)、隣が当日最強は30%（偶然期待22%）。

2026-09-09 の実例（名指し末尾9が外れた日）は **片側だけ** 成立した:
末尾9の台の物理的な隣で `n+1`(末尾0) 残差 +92 / `n-1`(末尾8) 残差 **-352**。
末尾別全体でも末尾0 +176 / 末尾8 -278。

## Interpretation
- 副産物として、**名指し本体のほうが隣より直接的**だった（41件中25件=61%、無情報50%、
  z≈1.41）。隣を探す前に名指しそのものを評価するほうが筋がよい
- 「隣に入れる」が実在するとしても、**片側だけ**という形かもしれない。
  2026-09-09 は上位側（+1）だけが成立した。左右を合算すると打ち消し合う

## 限界
- n=16（名指しが外れた件数）。この領域で有意差が出るサンプルは通常そろわない
- 検出力を上げるには予告の末尾名指しを蓄積するしかなく、時間でしか買えない

## Action
- **watching として扱う。** 「未確認」であって「効果なし」ではない
- 検証するなら判定を変える: 「隣が強かったか」の二値ではなく **隣の残差の大きさ**を
  連続量で見る。二値では帰無が75%あって何も分からない
- 左右を合算せず、`n-1` と `n+1` を分けて記録する
- 運用で隣を狙うなら、名指し本体を評価したうえでの二番手として扱う
