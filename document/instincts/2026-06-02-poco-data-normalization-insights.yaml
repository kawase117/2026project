# ぽこ仕掛けは3層構造：曜日→末尾→機種

## 背景
ぽこの「仕掛け内容」は単なる機種リストではなく、3段階の階層構造を持つ。（1）曜日別戦略、（2）末尾別配置、（3）具体的機種選定

## アクション
仕掛け内容を解析する際は、矢印（→）の順序を尊重し、各層を分離して分析する。複合記載や「仕掛け→末尾」のような説明的記載は、動的フィルタまたはメタ情報として扱う

## 例
「水曜日→末尾1,3→SBJ,SAO」では、（1）曜日：水曜日、（2）末尾：1または3の台、（3）機種：SBJまたはSAO

