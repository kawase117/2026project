# ホール別で機種在庫が大きく異なる - ぽこ予測もホール別

## 背景
蒲田7と蒲田1で在庫機種が異なる（例：緑ドン、沖ドキBLACKは蒲田1のみ）。ぽこの仕掛け内容もホール別に異なる可能性が高い。

## アクション
マッピング適用時にはホール別に分離する。蒲田7にない機種を参考にしても精度向上に寄与しない。ホール別モデルの構築を検討

## 例
緋弾ドン→スマスロ 緑ドン（蒲田1のみ登録）、沖ドキBLACK（蒲田1のみ登録）

