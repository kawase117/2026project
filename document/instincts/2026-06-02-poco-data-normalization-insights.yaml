# OCR誤認識は大量発生 - 手動確認必須

## 背景
ぽこの仕掛け内容をOCRで抽出すると、大量の誤認識が発生する。特に漢字・特殊文字が誤認識されやすい。

## アクション
OCR出力の機種名は自動信頼せず、常にユーザーに手動確認を依頼すること。特に以下パターンが危険：（1）音が似た漢字の誤認識（緋弾→緑）、（2）複合記載が単一機種と誤解釈、（3）括弧やマークの誤検出

## 例
緋弾ドン（実：緑ドン）、いざ審判（実：いざ！番長）、末尾ルーレット（実：記載なし）

