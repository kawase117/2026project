# ぽこ仕掛けと実績は完全一致しない - 期待値調整が必須

## 背景
ぽこが「仕掛けた」機種と実際の高差枚台が100%一致しない。理由：（1）未報告の高設定台、（2）高設定の不発、（3）報告タイミングのズレ（翌日報告）

## アクション
的中率分析では完全一致を目指さず、部分一致（Top-3, Top-5）や傾向の相関を見る。3-5%の的中率でも意味あり

## 例
ぽこが「この台高設定」と報告 → 実績では Top-5 高差枚に入っていなくても、他の関連台が Top-5 に入っていることがある

