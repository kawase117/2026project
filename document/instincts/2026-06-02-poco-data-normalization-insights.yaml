# ぽこデータに複数の情報タイプが混在 - 分類が必須

## 背景
ぽこの「機種」欄には、実機種名だけでなく以下が混在：（1）台指定（台番号範囲）、（2）動的フィルタ（台数条件）、（3）仕掛け説明、（4）複合記載、（5）曖昧記載

## アクション
マッピング時に各記載を以下のカテゴリに分類：FOUND（DB一致）、DYNAMIC_FILTER（台数条件）、WEEKDAY_STRATEGY（曜日仕掛け）、MACHINE_SPECIFICATION（台指定）、MULTIPLE_MACHINES（複合）、DELETE（エラー・情報なし）

## 例
1台設置機種→[動的フィルタ machine_count=1]、1列ピックアップ→ハナ横の壁1列→[台指定 2399-2415]

