# 楽園の工事後レジームでは「機種は選べ、台は選ぶな」。台粒度の追走は無価値〜有害

## Core claim
楽園蒲田の工事後23日(20260707-20260731、587台)で推奨ルールをウォークフォワード採点した結果、
**機種粒度の選択は +2〜3pp で再現するが、機種内の台粒度の選択は 0〜マイナスで再現しない。**
併用(機種で絞ってさらに台で絞る)は機種単独より劣化する。

## Evidence
- data scope: single-hall(楽園蒲田)、工事後23営業日、20260731時点の(台番号,機種名)ペアに限定
- metric scope: 選択台集合の**総和ベース**機械割 − 同日同カテゴリ非選択台の総和ベース機械割(pp)
- 機種粒度 R2(直近N日エッジ上位k機種の全台):
  - win=7,k=3: **+3.26pp [+0.96,+5.55]** 勝率77.8%
  - win=21,k=3: +2.83 [+0.32,+5.35] / LOO(長期安定エッジ),k=2: +2.91 [+0.47,+5.35] 勝率69.6%
  - 試した全設定(win×k 9通り)で符号がプラスに一貫
- 台粒度 R1(直近N日の台残差top-k): -0.4 〜 -6.6pp、**全設定でCIが0を跨ぐか負**。LOO k=5 は -6.63
- 併用 R3: +0.44〜+1.54pp と R2 単独(+2.8〜+3.3)より劣化
- split-half(奇数日 vs 偶数日、機種内残差)と整合:
  - 台粒度: 加重平均 spearman **+0.030**(37機種)、全台プール +0.107(p=0.009)と実質ゼロ
  - モンキーターンV **-0.594(p=0.042)**、マイジャグラーV **-0.546(p=0.013)** と有意に**負**
    = ホールが機種内でどの台に入れるかを日替わりで回している
  - 機種粒度: n台>=3では spearman -0.064(符号一致29/57=偶然並み)だが、
    **n台>=9に絞ると +0.397(符号一致13/16)**、n台>=12で +0.420。少数台機種のノイズが全体を殺していた

## Interpretation
- 楽園は既に位置軸(端番・セクション)が全滅している(HYPOTHESIS_LEDGER `rk-clean-edge1-*`, `rk-section-omnibus`)。
  今回、**台の過去成績という時系列軸も死んでいる**ことが分かった。楽園で生きているのは
  日付軸(`rakuen_dd_*` 4カレンダーALIVE)と**機種軸**の2本だけ。
- 機種エッジを使うときは必ず **n台>=9** で足切りする。3〜8台の機種のエッジは再現しない。
- モンキーターンVの台粒度が有意に負というのは「強い台を当てにいくと外れる」という意味であり、
  機種内では席を選ばず空いている台に座るのが正しい。

## ⚠️ 採点指標の罠（今回これで結論が符号反転した）
台ごとの機械割を出してから**単純平均**すると、低回転台が外れ値を作り
**系統的に -4〜-6pp 下振れする**。この誤りで当初「全ルールが有意にマイナス」という
逆の結論を出しかけた。`eda/briefing_common` の契約と HYPOTHESIS_LEDGER の
「行平均 -4.73pp vs 総和ベース +0.35pp」が同じ罠を明記している。
**推奨ルールの採点は必ず総和ベース(Σgames*3+Σdiff)/(Σgames*3) で行い、
比較相手も同日同カテゴリの総和ベースにする。**

## 予告・肌感に対する検定（同じ23日）
- **全台系は予測できない**: 「n>=3機種で全台payout>=104」を同日同カテゴリ順列nullと比較すると
  観測10回 / 期待10.8回 → **lift 0.93**。台数を考慮すると偶然の範囲。
  ただし23日・厳しめ閾値なので「無い」ではなく**検出力不足**として扱う
  ([[feedback-statistical-certainty-calibration]])
- **3台並びも予測できない**: 同機種の連番3台がそろって104超えるブロックは
  観測286件 / 順列期待271.4件 → **lift 1.05**。同じ開始台番号の再現も最大6回で大台数機種に偏るだけ
- → 「3台並び多数」「全台系2機種」は事後には必ず見つかるが、**事前に場所を当てる根拠は無い**
  ([[zenki-event-unpredictable-from-avg-diff]] と同じ結論に独立に到達)

## ⚠️ 20260801 フォワード結果（20260803 追記）
本instinctは [[2026-08-03-rakuen-zentai-regime-invalidates-model-edge]] により
「失効（ホールが並び→全台形へ配分方式を変更）」として閉じられている。
以下は 20260801 の結果で、**その失効判定を1日ぶん補強する**もの。

**R2（機種エッジ）は 20260801 の時点で既に外れていた。**
| 機種 | 直近14日エッジ（予測時） | 20260801 実績 | |
|---|---|---|---|
| モンキーターンV | +5.14pp（R2 1位） | **-3.09pp** | 外れ |
| 甲鉄城のカバネリ海門 | +1.95pp | -0.49pp | 外れ |
| 北斗の拳 転生の章2 | +2.39pp | +2.96pp | 凡庸(20台中9台プラス) |
| 東京喰種 | +0.86pp（**中位**） | **+8.98pp** | 当たり |

**当たった東京喰種は R2 由来ではない**（R2順位は中位）。予告(先バレ)と
DD1での直近2回の反転(+5.38→+7.67pp)から選んだもの。
→ 20260801・20260802 の2日連続で R2 は機能せず、失効判定と整合する。

**一方「機種は選べ、台は選ぶな」の部分は検証された。**
東京喰種31台のうち18台プラス・17台が104%超え。機種を当てれば機種内のどの台でも期待値プラス。
壊れたのは「どの機種か」を直近実績で当てる部分だけ。

**Action 2 の「n台>=9 足切り」は誤りだった。** 20260801 の楽園の全台系は
**鉄拳6(5台)** と **化物語(9台)**。n台>=9 は鉄拳6(+25.66pp / 5台全プラス / 平均+3,791枚)を
**構造的に除外していた**。全台系は小規模機種に落ちるため、この足切りは全台系を必ず取り逃がす。
さらに「全台系は予測できない(順列 lift 0.93)」も、本文で自ら「検出力不足として扱う」と
書きながら Action では「当てにいかない」と運用してしまった誤り。

## Action
1. 楽園の当日推奨は **機種を指定し、機種内の台は指定しない**（20260801で検証済み・生存）
2. ~~機種エッジは n台>=9 で足切り~~ → **誤り**。足切りは「エッジの再現性を検定する」用途にだけ使い、
   **当日の候補集合からは 3〜8台の小規模機種を除外しない**。2つの用途を分ける
3. 推奨ルールを採点するときは総和ベース。台ごとの機械割の単純平均は使わない
4. 3台並びの**場所**は事前に当てにいかない（順列 lift 1.05、20260801も追認）。
   ただし**全台系は別枠**。小規模機種を候補に残し、検出は
   [[2026-08-01-answer-check-metric-hit104-over-mean-diff]] の G比×平均差枚 で行う
5. ~~直近N日の機種エッジ(R2)を推奨に使う~~ → [[2026-08-03-rakuen-zentai-regime-invalidates-model-edge]]
   に従い、配分方式の切替日を特定して再検定するまで使わない

