# 楽園は今月(2026-08)から並び→全台形に変更。直近実績ベースの機種エッジ(R2)は失効した

## Core claim
2026-08-01-rakuen-post-reno-model-not-machine が示した「機種粒度R2は+2〜3ppで有効」は
**並び中心の配分レジームでの測定**であり、ユーザー観測により楽園は今月から**全台形**へ
変更している。8/2に直近21日のR2上位3機種（モンキーターンV/北斗の拳転生の章2/マギアレコード）
を指名した結果、指名39台の実績は**ホール平均より59枚/台悪化**（指名-251枚/台 vs ホール平均-192枚/台）
し、逆に実際に強かったのは直近エッジで無印だった真打吉宗(5台, +2,505枚/台, プラス率80%)だった。

## Evidence
- n_observations: 1日(20260802)、楽園蒲田579台、R2指名39台
- data scope: single-hall（楽園蒲田、単日・工事後レジーム内の二次レジーム変化）
- metric scope: games加重機械割・平均差枚
- result summary:
  - R2指名3機種(モンキーV/北斗転生2/マギレコ)実績: 91.8%/96.3%/100.6%、
    合計-9,795枚(-251枚/台)。ホール全体は98.04%(-192枚/台)
  - 全台系で実際に強かった機種: 真打吉宗5台 機械割112.6% +2,505枚/台 プラス率80%、
    ヤバチバ3台 134.5% +1,968枚/台。どちらもR2の直近21日エッジには入っていなかった
  - 化物語(9台)は「全台」と噂されたが実績は101.8% +127枚/台・プラス率33.3%で
    R2非採用の判断（打たなかった）は結果的に正しかった

## Interpretation
- 全台形（ある機種の設置台数ぶん全部に入れる方式）では、**直近実績が翌日の対象機種予測に
  ならない**どころか、「最近やった機種は当面来ない」というローテーション的な負の相関に
  なり得る。R2ルールの前提（直近エッジが翌日も継続する）はレジーム依存であり、
  配分方式が変わった時点で無効化される
- 楽園の「化物語は高設定でも出づらい」という定性判断（機種特性）はレジームに依らず
  生きている。壊れたのは「機種の中でどれが当たるか」という**時系列予測**の部分
- 元の 2026-08-01-rakuen-post-reno-model-not-machine の評価期間(20260707-20260731)は
  並び中心の配分だった可能性が高く、その測定自体は当時のレジームでは正しかったと考えられる。
  「撤回（測定ミス）」ではなく「失効（ホールが配分方式を変えた）」として扱う

## Action
1. 楽園の当日推奨でR2（直近N日機種エッジ）をそのまま使わない。全台系レジームが
   続く間は「直近好調機種」より「その日の全台対象になりやすい機種」を別の軸で探す必要がある
2. 配分方式（並び/全台形）の切替日を特定し、切替後のデータで機種エッジの再現性を
   再度split-halfで検定すること。切替日未特定のままR2を使わない
3. 全台系の対象機種を事前に当てる根拠は現状ない
   （2026-08-01-rakuen-post-reno-model-not-machine の「全台系lift 0.93、偶然の範囲」は
   全台形レジーム移行後も再検証が必要）
4. 真打吉宗・ヤバチバなど、直近エッジには出ないが全台形で当たった機種の共通点
   （導入時期・設置台数）を次回スキャン時に確認する

