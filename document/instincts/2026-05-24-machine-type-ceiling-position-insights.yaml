# 台の物理位置（角番・島位置・視認性）が欠落している重要固定特徴量

## 背景
高設定の投入位置はホールの「集客戦略」と密接に関係する。
入口付近・角番など視認性の高い位置に高設定を入れると集客効果が高い。
この「位置属性」は台番号に紐づく固定値だが、現在のデータに存在しない。
rolling平均では絶対に捉えられない信号であり、次のフェーズの優先候補。

## アクション
1. 台番号と物理位置のマッピングテーブルを作成する（フロア・島番号・角番フラグ）
2. 台番号が連番でフロアレイアウトと対応している場合は番号範囲から推定可能
3. 手動でフロアマップを記録してCSVに落とし、machine_masterテーブルに列追加する
4. 位置特徴量（is_corner, floor, island_id, position_in_island）をML特徴量として追加する
5. 位置×曜日の交互作用特徴量も有望

## 例
```
推定する位置属性:
- is_corner: 島の両端（角番）か (0/1)
- floor: 2F / 3F
- island_id: 何番島か
- position_in_island: 島内での端からの距離（0.0=端, 0.5=中央）

台番号マッピング例:
1001〜1020 → 2F 1島 (1001=左端角番, 1020=右端角番)
```

