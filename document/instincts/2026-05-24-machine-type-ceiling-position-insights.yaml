# 採用特徴量セット: no_smooth_ewm + no_rank_trend (135特徴量)

## 背景
Ablation eval30 および eval60 分割評価の結果、smooth_ewm はノイズ、
rank_trend は寄与ゼロと判定。cross_section は除外で悪化するため必須。

## アクション
machine_type XGBoost の本番特徴量:
`ml/machine_type/reports/_keep_no_smooth_ewm_no_rank_trend.txt`（135特徴量）

設定:
- model_type: xgb, segment_mode: global, alpha: 5.0
- gpu_backend: auto, margin: 0.00（見送りなし）
- floor2+blend0.7 は eval30 のみ確認（+0.005差）のため global を本番採用

## 例
```
xgb_default eval60:                  score=0.1848（改善前）
xgb_global_noSmoothEwmNoRank eval60: score=0.2145（+16%改善、採用）
xgb_floor2_b07 eval30:               score=0.2166（eval60未確認、保留）
```

