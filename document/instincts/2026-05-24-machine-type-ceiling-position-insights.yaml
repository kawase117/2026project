# 木曜専用閾値分離は予測数を激減させ全指標が悪化

## 背景
木曜日は非木曜と比べてF1・Hit@3が高い傾向があった。
この差を活かすために閾値分離を実装して eval20 で比較した結果、
閾値が上昇して予測数が激減し、全ターゲットで F1・Hit@3 が悪化した。

## アクション
- 木曜専用閾値分離は採用しない（スモーク eval3 と eval20 の両方で悪化確認）
- 木曜フラグを特徴量として学習させる方向を検討する（モデル内で自動対応）

## 例
```
eval20（floor2_b07_noSmoothEwmNoRank）:
  分離なし: is_top_5 F1=0.181/0.216, is_top_3 F1=0.136/0.198
  分離あり: is_top_5 F1=0.100/0.121, is_top_3 F1=0.067/0.148
→ 全指標で悪化。予測数が1/5以下に激減。
```

