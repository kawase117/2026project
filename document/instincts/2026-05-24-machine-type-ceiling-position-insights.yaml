# Rolling特徴量はホールの逆張り戦略により天井が低い

## 背景
rolling平均・EWM・lagなどの「過去成績ベース」特徴量を用いたXGBoostモデルが、
eval60で Hit@3 ≈ 2× ランダム、rank_1 Hit@1 = 0.000 という結果に留まった。
ホール側は「最近出した台には次回入れない」逆張り戦略を採るため、
短期rolling特徴量とターゲットが逆相関している可能性が高い。
長期rolling（rank_trend: 月別rank_pct平均）はAblationで寄与ゼロと判定済み。

## アクション
1. rolling特徴量だけでの改善追求は優先度を下げる
2. 「過去成績」ではなく「ホールの意思決定パターン」を直接モデル化する方向に転換を検討する
3. 位置情報（角番・島位置・入口距離）などの固定属性特徴量を追加することを優先する
4. 長期rolling（rank_trend）はAblationで寄与ゼロ確認済み → 除外して良い

## 例
```
xgb_default_eval60:              score=0.1848, rank1_hit@1=0.000
xgb_global_noSmoothEwmNoRank:   score=0.2145, rank1_hit@1=0.000
→ 特徴量改善で+16%改善できたが、rank_1の絶対予測は依然ゼロ
→ 2× ランダム程度が現アーキテクチャの実用上限の可能性
```

