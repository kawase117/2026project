# 評価実行は段階的チェックポイント制で時間を制御する

## 背景
14時間連続実行（eval60 × 複数設定 × バッチ分割）は検証粒度が粗くなり、
途中の判断ミスが後半全体を無駄にするリスクがある。

## アクション
以下の段階的基準を守る：
- **eval3〜5**: 動作確認・スモーク（新機能の疎通確認のみ）
- **eval20〜30**: 設定比較の主戦場。複数設定の優劣判定はここで行う
- **eval60**: eval30で+0.01以上改善した設定のみ走らせる
- **差が+0.005未満**: eval30の結果で採用決定し、eval60はスキップする
- 1ステップ終わるごとに結果を確認し、次ステップの指示を出す（自律実行させない）

## 例
```
floor2_b07 eval30: score=0.2166（global=0.2113より+0.005差）
→ 差が+0.01未満のためeval60はスキップ、global eval60(0.2145)を採用設定とする
```

