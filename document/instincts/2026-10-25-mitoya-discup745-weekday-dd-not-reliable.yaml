# みとやのディスクアップUR 745番は、曜日・DDで「強い日」を絞れない（機種としてはホール平均より高い）

## Core claim
745番は390日の平均差枚が+243で、みとやのホール平均より1日あたり約+224枚高いが、曜日別・DD別に強い日を統計的に絞れていない。DD27・DD24の強さも、DD単独では偶然の範囲。

## Evidence
- n_observations: 390日（2025-07-07〜2026-10-23、745番のみ。701〜704・746・749などの別台は除く）
- data scope: みとや大森町店、ディスクアップ ULTRAREMIX 745番
- metric scope: 日次差枚、ホール平均との差、勝率
- result summary:
  - 曜日: 日+745（55日、勝率60%）、木+538、月+388、水+173、金+50、火-38、土-151（55日、勝率42%）。曜日の最大差896は、入れ替えて偶然を調べると約9%（p≈0.09）で、5%基準に届かない。直近（2026年4月以降）は土+524、火+533、木+748で、全期間で弱い曜日が崩れる。
  - DD（31区分）: 27日+1,007（13日）、24日+957（13日）、9日+913（13日）が上位、30日-664（勝率8%）、6日-598が下位。最大差1,671は偶然でもほぼ毎回出る（p≈0.87）。
  - 日ごとの差枚のSDは約1,745枚で、13日の平均の標準誤差は約480枚。
  - 前日の差枚との相関は-0.04。
  - 10/24（土・DD24）は3,763Gで-1,292、RB 1/941。

## Interpretation
- 差枚のばらつきが大きく、1日あたりの標本が少ないため、1,000枚前後の差は偶然で出る。
- 条件を細かく割る（曜日×イベントDDなど）ほど、日数が減って偶然の余地が増える。
- DD27の強さ（過去n=12で平均+742）は別の記録にあるが、DD単独の統計は支持しない。10/27に直接確認するまで確定扱いにしない。

## Action
- 745番を「曜日」や「DD」で推す理由にしない。座る判断は開店後の回転数・RB確率で行う。
- 標本が増えたら、DD27だけを事前に決めて（多重比較を避けて）追試する。
- 条件を割った集計を見せるときは、日数と偶然の確率を一緒に書く。

