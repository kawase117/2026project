# 少数台機種での再現性はホール側の個別管理を示唆する可能性がある

## 背景
ジャグラーガールズ（ジャグラーシリーズの中では二番手・三番手、少数台機種）が、みとや(plus rho=0.337, p=0.064)・蒲田7(plus rho=0.412, p=0.021)の2ホールで独立にプラスの持続性を示した。台数が少ない機種は通常サンプルが薄くノイズに埋もれやすいはずだが、それでも再現したのは、少数台だからこそホール側の個別管理（角番判断・特定台への手動投入判断）が反映されやすいという仮説を支持する。

## アクション
少数台機種で法則性を発見した場合、多数台機種より軽視せず、むしろホールの個別管理が反映されやすい対象として注目する。ただしサンプル数自体は少ないため、スパースセルの警告と合わせて評価すること。

## 例
persistence_check.csv。ジャグラーガールズはマイジャグラーV等の主力ジャグラー機種と異なり設置台数が少ないにもかかわらず持続性が確認された。

