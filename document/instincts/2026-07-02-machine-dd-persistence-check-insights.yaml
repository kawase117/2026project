# ホールの運用スタイルの実地知識は、統計未検証のシグナルへの信頼度判断に使ってよい

## 背景
みとやのクレアの秘宝伝はDD27で勝率72.4%・hit104率62.1%・平均+1,176枚という極端な数値を示したが、機種の設置が新しく、期間分割による再現性検証では「skip: empty period after split」となり統計的に検証不能だった。ユーザーの実地知識によれば、みとやは「設定を入れる時は全台ガッツリ入れる」運用スタイルであり、これは極端な数値が出やすい入れ方と整合する。

## アクション
統計的再現性検証ができない（サンプル不足・期間不足）シグナルについて、ホールの運用スタイルに関する実地知識と整合するかを判断材料に加えてよい。ただし「統計的に未検証」であることは変わらないため、実運用に使う前にデータが十分溜まった時点で改めて再検証する。

## 例
eda/results/machine_axis_pattern_scan/{hall}_top_signal_breakdown.csv でクレアの秘宝伝dd27の値を確認。半年程度データが溜まれば eda/machine_dd_persistence_check.py で再検証可能。

