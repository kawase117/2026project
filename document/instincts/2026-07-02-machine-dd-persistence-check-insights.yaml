# 機種×DDパターンの期間分割・再現性チェックツールが利用可能

## 背景
2026-07-02セッションで設計、Codexが実装。eda/machine_axis_pattern_scan.pyのtop_signals.csvを候補として読み込み、ホールの日付範囲の中央日で前半・後半に分割し、機種のDD別成績（勝率・104%超え率）のSpearman順位相関で再現性を評価する。実行の結果、TOP20候補の大半が非有意〜低相関で、in-sample検定で見えた法則性のほとんどが再現しないことが判明した（大サンプルのスマスロ北斗の拳もrho≈0）。

## アクション
python eda/machine_dd_persistence_check.py で3ホール一括実行。出力はeda/results/machine_axis_pattern_scan/persistence_check.csv。spearman_rhoが低い候補はtop_signals.csvのランキングから除外する根拠にする。ただし新しく設置された機種は期間分割で片側が空になり検証不能（note: skip: empty period after split）になる点に注意。

## 例
python eda/machine_dd_persistence_check.py
