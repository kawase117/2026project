# 持続性チェックのrho低下は「法則性がない」と「投入戦略が変化した」を区別できない

## 背景
スマスロ北斗の拳(蒲田1, n=9617)は前半・後半のDD別hit104率のSpearman rhoが0.015とほぼ完全にゼロだった。当初「大サンプルでも再現しない＝元々ノイズだった」と解釈したが、ユーザーの実地知識により、2026年に後継機種が登場し北斗の拳が「旬を終えた」状態になったことが判明。後継機種が不評で現有台数は多いままだが、ホール側の設定投入戦略自体が変化したと推測される。単純な2期間分割によるrhoは「元々法則性がなかった」場合と「法則性はあったが外的要因(新台入替、機種の人気度変化)で戦略が変わった」場合を統計的に見分けられない。

## アクション
rho低下を「法則性なし」と即断する前に、その機種のライフサイクル（後継機種の登場時期、人気度の変化、新台入替時期）を確認する。疑わしい場合は、外的要因の発生時期を境に再分割し、「変化前だけで安定していたか」を別途検証する。`compute_debut_features`のdebut_dateで後継機種名の初出日を特定できる。

## 例
eda/machine_dd_persistence_check.py の2分割はホール単位の中央日で固定されているため、機種固有のライフサイクル変化点とは一致しない場合がある。

