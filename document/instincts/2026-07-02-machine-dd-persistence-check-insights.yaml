# 市場変化を跨いで再現した機種のDDパターンは、跨がない場合より信頼度を上げてよい

## 背景
甲鉄城のカバネリは蒲田1(plus rho=0.364, p=0.044)・蒲田7(plus rho=0.339, p=0.062)の2ホールで独立に中程度の正の持続性を示した。スマスロ北斗の拳より古い機種でありながら、北斗の拳が旬を終える(後継機種投入・投資配分変化)期間を跨いでも再現しており、単なる偶然にしては出来すぎている。

## アクション
機種のDD/軸パターンの信頼度を評価する際、単一ホールでの再現性だけでなく「ホールの機種構成・市場環境が変化した期間を跨いでいるか」も評価軸に加える。跨いで再現した機種は、外的要因に左右されない構造的な法則性を持つ可能性が高いとして優先的に注目する。

## 例
eda/results/machine_axis_pattern_scan/persistence_check.csv。甲鉄城のカバネリはplus outcomeで2ホール一致、hit104は非有意（勝率軸に限定した弱いクセの可能性）。

