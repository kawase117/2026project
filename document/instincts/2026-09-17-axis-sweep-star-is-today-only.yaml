# 軸スイープの★は当日限定。どの軸も翌日への持ち越し価値はゼロ（自己平均で統制すると消える）

## 背景
2026-09-17、楽園蒲田の88日（20260617〜20260915、1,000G以上、配置替えは日付ごとに
machine_layout_history で解決）に対し、軸スイープ（機種/列/末尾/角番/フロア＋機種×各軸、
指標は差枚残差・差枚ホール比・回転数残差、最大統計量の並べ替え検定200回）を全日に当てた。
実装は `backtest/axis_sweep_baserate.py`、結果は `backtest/results/axis_sweep/rakuen_20260917.md`。

**★(p<0.05)の日次ベースレート**（5%想定より明らかに高い軸がある）:

| 指標 | 軸 | ★率 |
|---|---|---|
| 回転数残差 | 末尾 | **24%** (21/88) |
| 回転数残差 | 機種×末尾 | 15% |
| 差枚ホール比 | 列 | 12% |
| 差枚ホール比 | 機種 | 11% |
| 差枚残差 | 角番 | 8% |
| 差枚残差 | 列 | 6% |

**翌日への持ち越し**（前日の最強グループが翌日どうなるか）:

| 軸 | 翌日も最強 | 偶然なら | p | 翌日の値 | そのグループの30日平均で統制後 |
|---|---|---|---|---|---|
| 列 | 7% (5/70) | 2% | 0.007 | +395枚 | **-195枚 (p=0.23)** |
| 機種 | 6% (4/65) | 2% | 0.066 | +286枚 | **-153枚 (p=0.41)** |
| 角番 | 23% (20/87) | 14% | 0.020 | +531枚 | **+63枚 (p=0.21)** |

列と角番は「翌日も最強になりやすい」が偶然を超える。しかし統制後はゼロかマイナス。
つまり再現しているのは**そのグループがもともと強いこと**（機種の月次持続）だけで、
前日★であること自体の上乗せは無い。[[feedback-prevday-exceed-carries-no-info]] と同じ構造。

## アクション
1. ★は**当日の席選び専用**として使う。翌日の予測・ルール化には使わない。
   「昨日は末尾5だったから今日も」は根拠ゼロ。
2. ★を読むときは軸ごとのベースレートと比べる。**回転数残差×末尾の★は24%の日常**で、
   出ても何も言っていない（末尾が島内位置と対応するため帰無が不完全。位置の自己相関が残る）。
   差枚ホール比×列（12%）・機種（11%）も同様に割り引く。
   相対的に珍しいのは 差枚残差の 機種×列(2%)・フロア(1%)・機種×角番(5%)。
3. 軸スイープから prereg に上げるなら、**当日の★ではなく「軸そのものの持続性」を先に測る**。
   楽園では全軸が失格だったので、現時点で prereg に上げる候補は無い。
4. 他ホール（蒲田7・蒲田1・みとや等）は未測定。同じスクリプトを `--all-halls` で回してから判断する。
   ホール横断で流用しない（[[feedback-no-cross-hall-pooling]]）。

## 例
NG: 「今日はカバネリ×角4が p=0.045。角4は狙い目」→ 角番の翌日持ち越しは統制後 +63枚(p=0.21)
OK: 「今日カバネリを打つなら角4の台。ただし明日には持ち越さない」
