# 楽園蒲田7つく取材日：末尾7の台の物理的な隣接席は、本命末尾のグループ効果とは別の量として上振れる

## Core claim
末尾グループ全体（ホール全体の末尾6・末尾8）ではなく、**末尾7の台そのものの物理的な両隣
（machine_number±1、多くは同一機種）** を見ると、7つく取材日は隣接台の残差が非隣接台を
系統的に上回る。取材日平均gap（隣接残差−非隣接残差）+149.4 は90日ベースレート（平均-25.1,
sd198.2, n=88）に対しz=2.49・片側p=0.0064で、通常日とは異なる現象だと言える。

「本命末尾が弱い日ほど隣接gapが大きい」という比例関係も8日すべて同じ向き
（相関 r=-0.607, 片側p=0.055）だが、境界線上で n=8 ではまだ確証と言えない。

## Evidence
- n_observations: 8日（2026-06-07 / 06-17 / 06-27 / 07-07 / 07-17 / 07-27 / 08-07 / 08-17。
  いずれも「7つく」取材が結果報告等で言及した日。8-17は事前登録済みの予告に基づく初の
  out-of-sample）
- data scope: 楽園蒲田店、target_digit=7、対象は末尾7の台の machine_number±1（同末尾以外）
- metric scope: 残差（台の差枚−同日同機種平均）を隣接群と非隣接群で比較したgap
- result summary:

  | 日 | 本命(末尾7)残差 | 隣接gap |
  |---|---|---|
  | 06-07 | -73.0 | +140.7 |
  | 06-17 | **+1309.5** | **-320.5** |
  | 06-27 | +1054.6 | +68.9 |
  | 07-07 | +1493.0 | +158.3 |
  | 07-17 | +734.7 | +112.5 |
  | 07-27 | +466.1 | -27.5 |
  | 08-07 | -31.6 | +401.7 |
  | 08-17 | +96.6 | +660.9 |

  隣接gapが正の日は6/8（二項検定 vs 90日ベースレート0.477: 片側p=0.116、単独では弱いが
  平均で見ると上のz検定で有意）。08-07・08-17（直近2回、本命が弱かった日）は90日で
  一度も観測されていない大きさの正のgap。06-17（本命が最強だった日）はgapが最も沈んでいる
  — これは「本命が強ければ隣接は要らない」という向きと矛盾しない観測であり、反例ではない
  （前回セッションで誤って反例と呼んだのを訂正）。

## Interpretation
- 末尾グループ効果（[[feedback-lastdigit-kakuban-segment-split]] や
  2026-08-11-rakuen-lastdigit-announce-segment-split の「AT では D+1 が本命」）とは
  **別の現象**である。あちらはホール全体の末尾ラベル集団を比べる分析、こちらは
  対象末尾の台1台1台の物理的な隣接席（多くは同一機種）を比べる分析。両方とも
  「予告末尾±1」を主張しているように見えるが、母集団が違うので混同しないこと。
- 実務的な含意（ユーザーの動機）: 朝の入場で対象末尾の台に座れなかった場合、
  隣の座席には一定の価値がある可能性がある。特に本命が弱い日（取材はあるが
  仕掛けが薄い日）ほど隣の価値が相対的に上がる、という向きは8日とも一貫している。
- ⚠️ n=8で、主張2（本命の弱さと隣接gapの比例関係）はまだ統計的に確証と言えない
  （Pearson片側p=0.055、境界線）。主張1（取材日は隣接が通常日より系統的に強い）は
  平均でz=2.49と比較的強い。
- ⚠️ 台番号±1は同一機種であることが多い（2026-08-17実測で75.4%）。したがって
  この現象の一部は「その機種自体が強かった」ことの残り香である可能性があり、
  純粋な「席の物理的位置」効果と「機種の強さ」効果を完全には分離できていない。

## Action
- 次回7つく取材日（目安2026-08-27前後、10日周期）で `backtest/neighbor_effect.py` を
  再実行し、n=9での再現性を確認する:
  `venv\Scripts\python.exe -m backtest.neighbor_effect 楽園蒲田店 --target-digit 7 --event-days 20260607,20260617,20260627,20260707,20260717,20260727,20260807,20260817,20260827 --baseline-before 20260827 --baseline-days 90`
- 別の末尾Dが予告されたときも同じスクリプトを `--target-digit D` で使い、汎化する
  （例: 末尾3の予告なら隣接は自動的に2・4になる）。
- announce.py の CLAIM_TYPES にはこの型が無いので、当面は本スクリプトの手動実行で
  answer-check する。unscored_claims に記録し、`gogo_rokuroku_baseline` /
  `lastdigit7_baseline` と同じ位置づけで announce JSON に凍結すること。

