# ルールの成績は台別に分解してから読む。1台の固定台が全部を作っていることがある

## Core claim
`k7_at_histdiff_top3` はフォワード11日で **+1,275枚/勝率73%** と、スコアボードで
突出していた。台別に割ると:

| | n | 超過差枚 | 中央値 | 勝率 |
|---|---|---|---|---|
| ルール全体 | 33台日 | +1,275 | +330 | 61% |
| 台2026 のみ | 11 | **+3,363** | +2,245 | 73% |
| **台2026 を除く** | 22 | **+231** | +34 | 55% |

**台2026は13プラン全部で選ばれている。** 毎回選ばれる台は選択ではなく定数であり、
その台の成績はルールの成績ではない。除くと中位の凡庸なルールと区別がつかない。

## Evidence
台2026そのものは本物で、しかも大きい。同じ日・同じ機種の他の台と比べた出率差
（設置3台以上の日、387台日）:

| 月 | n | 出率差 | 勝率 | 回転数比 |
|---|---|---|---|---|
| 2025-11 | 26 | +3.16pp | 38% | 0.97 |
| **2025-12** | 28 | **-0.04pp** | 36% | 1.01 |
| **2026-01** | 31 | **+39.03pp** | 87% | 1.54 |
| 2026-05 | 30 | +29.86pp | 87% | 1.76 |
| 2026-09 | 9 | +29.24pp | 67% | 1.35 |

2025年12月から2026年1月にかけて切り替わり、9か月続いている。フォワードが止まって
いた 8/13 以降も +3,698枚/75%（n=24）。隣接台は全滅（台2022〜2030 のうち2026以外は
すべて中央値 -350〜-730、勝率35〜43%）。設置機種はマギレコ→モンキーターンV→
カバネリと入れ替わっているので、**機種ではなく座席に付いている**。

**他ホールには無い。** 蒲田1 +2.88 / 楽園 +0.30 / ヒロキ -0.14pp。蒲田7固有。

## Interpretation
- 台番号2026が2026年に光る、という説明は魅力的だが、**台2025は2025年に光っていない**
  （-1.95pp、勝率38%、n=173）。1例だけなので毎年ローテーションするとも、
  2027年1月に死ぬとも言えない
- 回転数が同機種の他台の 1.3〜2.0倍。**周知されている。** 座れるかどうかは
  入場順の問題で、統計の側からは扱えない。EVとして計上しない
- ユーザー判断（2026-09-11）: 今年一杯の鉄台として扱い、特に労力を割かない

## 限界
- 台2026の n=218（2026年）は台日であって独立ではない。同じ台の連日を数えている
- 出率差 +30pp は同機種内比較なので、その機種が何かに依存する。
  設置機種が3回替わっているぶん、機種効果は平均化されている方向

## Action
- **フォワードのスコアを台別に割ってから読む。** 平均だけを見て順位づけしない。
  毎回同じ台が入っているルールは、その台を抜いた数字を併記する
- 蒲田7のAT系は `k7_at_histdiff_ex2026_top3`（台2026を母集団から除外した版）で運用する。
  元ルールは凍結ハッシュを守るため書き換えない。両方走らせて対照にする
- 除外は `eligibility` の `{"exclude": [..]}` で書く（2026-09-11 追加）
- 同じ形の疑いは [[feedback-scoring-must-separate-setting-from-pnl]] の
  「1台が機種平均を持ち上げる」（撒き餌）と構造が同じ。単位を1つ下げて見る
