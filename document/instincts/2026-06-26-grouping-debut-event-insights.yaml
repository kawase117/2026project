# 蒲田7 DD種別×経過日数: 月末と強ゾロ目が定番台で突出（+420〜+511）

## 背景
2026-06-26 蒲田7 EDA。debut_phase × DD種別（7系/1系/ゾロ目/強ゾロ目/月末/その他）
の層別クロス集計。

## 発見

### 61-180日（安定期）
| DD種別 | avg_diff | n |
|--------|----------|---|
| 月末   | **+511** | 359 |
| 7系    | +188 | 2,937 |
| ゾロ目  | +100 | 1,976 |
| その他  | +95 | 20,022 |
| 1系    | +62 | 2,222 |
| 強ゾロ目 | +61 | 1,020 |

安定期では**7系が最強（+188）**。月末が+511だがn=359で要注意。

### 181日+（定番期）
| DD種別 | avg_diff | n |
|--------|----------|---|
| 月末   | **+473** | 88 |
| 強ゾロ目 | **+420** | 275 |
| ゾロ目  | +196 | 682 |
| 1系    | +104 | 669 |
| その他  | +91 | 6,120 |
| 7系    | +48 | 865 |

定番期では**強ゾロ目（+420, n=275）とゾロ目（+196, n=682）が顕著に強い**。
7系は+48まで低下。フェーズによってDD種別の効果が逆転する。

### 新台期の特殊パターン
1-14日 × 1系 = **-663**。新台のイベント日（1のつく日）は最もマイナスが大きい。
イベントの集客力を利用して新台を積極回収している可能性。
1-14日 × 強ゾロ目 = -8（ほぼゼロ）は例外的に優遇されているか、サンプル不足（n=220）。

## アクション
- 蒲田7でイベント日×定番台を狙う場合、月末と強ゾロ目が最有望
- debut_phase ごとにDD種別の効果が異なるため、交互作用としてモデル化すべき
- 月末（181日+, n=88）は統計的に不安定。データ蓄積後に結論を固める
- 7系の効果がフェーズで逆転する理由の仮説検証が必要

