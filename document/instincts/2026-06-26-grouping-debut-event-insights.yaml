# 181日+「定番台」の定義上の注意: pre_existing除外済みのため真の長期定番は含まない

## 背景
2026-06-26 セッションで確認。debut_phase分析ではpre_existing=Trueの機種を除外している。

## 定義
- 181日+ = DB開始日（蒲田7: 2025-07-07）以降に導入され、181日以上経過した機種
- pre_existing（DB開始日に既に存在していた機種）は除外済み
- 蒲田7の場合、2026-06-22時点で181日+に入れるのは2025-12-23以前に導入された機種のみ

## 含まれない機種の例
- マイジャグラーV（pre_existing、57台）
- その他DB開始前から設置されていた長期定番機種

## アクション
- 181日+の結果を「定番台」と呼ぶ場合、この制約を明記する
- 真の定番台（pre_existing含む）でのイベントプレミアム検証は別途必要
- pre_existingにはdays_since_debutがNaNなので、別の定義（設置台数L/XLなど）で代用する
