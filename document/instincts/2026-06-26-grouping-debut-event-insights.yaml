# イベントプレミアムは定番台（181日+）にのみ集中する（蒲田7実証）

## 背景
2026-06-26 蒲田7 EDA。debut_phase × is_any_event の層別クロス集計。
pre_existing機種を除外し、新規導入機種のみで分析。n=62,894。

## 発見
イベント日プレミアム（イベント日avg_diff - 通常日avg_diff）:

| フェーズ | 通常日 | イベント日 | プレミアム |
|----------|--------|-----------|-----------|
| 1-14日   | -353   | -352      | **+2（ゼロ）** |
| 15-60日  | -145   | -157      | **-12（逆効果）** |
| 61-180日 | +94    | +120      | +26 |
| 181日+   | +37    | +182      | **+145** |

新台（1-60日）にはイベント日でも設定を入れない。
イベントプレミアムは181日+の定番台に集中（+145枚差）。

## 因果メカニズム
イベント日に集客力を最大化するなら、認知度の高い定番台に高設定を入れるのが最も効率的。
新台は話題性で客が来るのでイベント日でも設定投入の必要がない。

## 注意点
- 181日+の「定番台」はpre_existing除外後なので、DB開始（2025-07-07）以降に
  導入され半年以上生き残った機種。本当の長期定番（ジャグラー等）はpre_existingとして除外済み。
- pre_existingを含めた場合のイベントプレミアムは未検証
- 蒲田7のみで検証。蒲田7特化方針のため当面は他ホール検証不要

## アクション
- 蒲田7のイベント日に打つなら181日+の定番台を優先
- ML特徴量として debut_phase × is_any_event の交互作用項を追加する価値あり
- pre_existingを含めた再検証を推奨（本当の定番台のイベントプレミアムはさらに大きい可能性）

