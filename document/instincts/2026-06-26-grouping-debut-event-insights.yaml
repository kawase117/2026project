# ホール間の戦略異質性が実証済み: 汎化法則よりホール特化が有効

## 背景
2026-06-26 全9ホール横断EDA（経過日数/設置台数/区間成績の3軸検証）。

## 発見

### 共通パターン（全ホール）
- 経過日数が進むほどavg_diffが改善する単調パターンは全9ホールで再現
- 全ホールでKruskal-Wallis p<0.01

### ホール間で異なるパターン
1. **プラス圏到達**: 好設定ホール（蒲田7/蒲田1/楽園/ARROW/みとや）は61-180日でプラス圏。
   渋いホール（ヒロキ/ザシティ/金時/レイトギャップ）は全フェーズマイナス。
2. **設置台数の凹型パターン**: 蒲田7固有。他ホールでは再現せず（単調増加や不明確）。
3. **看板台の新台優遇**: ARROW/レイトギャップのみ。蒲田7/蒲田1/みとやでは不在。

## アクション
- 全ホール共通の汎化法則を追うのは非効率 → **蒲田7特化の深堀りに集中**
- 他ホールへの適用は蒲田7の知見を転用する際に個別調整
- ML特徴量設計もホール別に最適化すべき

