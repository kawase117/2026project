# 2243のhit_110シグナルはsplit-half両期間で安定(2252も同様)。隣接クラスタ説・角台説・他ホール横展開説は全て棄却

## 背景
[[machine-2243-hit110-frequency-elevated-vs-floor-baseline]] で、蒲田7 2Fの
machine 2243 がhit_110(機械割110%+到達頻度)で全351台中上位4.3%(z=+1.44)
であることを確認し、以下3つの仮説を次のアクションとして残した。

1. 2240-2243クラスタの位置起因説
2. 角台(セクション端)理論
3. 他ホール(蒲田1)への横展開

この3つをすべて検証した結果、**全て棄却**された。

### 1. 2240-2243クラスタ説 → 棄却
蒲田7 2F全338日を前半169日/後半169日に分割し、各半期ごとのbaseline
(half内でn>=50日の全台でmean/std再計算。half内サンプリング誤差により
std=0.09前後と全期間stdの約2倍に拡大)に対するz-scoreを比較した。

| machine | 前半 hit_110(z) | 後半 hit_110(z) | 判定 |
|---|---|---|---|
| 2243 | 0.331 (z=+1.18) | 0.315 (z=+1.24) | stable |
| 2240 | 0.355 (z=+1.44) | 0.266 (z=+0.67) | 前半のみ |
| 2241 | 0.361 (z=+1.51) | 0.225 (z=+0.20) | 前半のみ、後半は完全に平均 |
| 2242 | 0.355 (z=+1.44) | 0.272 (z=+0.74) | 前半のみ |
| 2244 | 0.278 (z=+0.59) | 0.266 (z=+0.67) | 常に平均的 |
| 2252 | 0.343 (z=+1.31) | 0.302 (z=+1.08) | stable(2243と同様) |
| 2258 | 0.249 (z=+0.26) | 0.396 (z=+2.18) | 後半のみ急騰 |
| 2026 | 0.345 (z=+1.34) | 0.692 (z=+5.59) | 後半で異常急騰(median 102→122%) |

2240-2242は前半だけ高く後半は平均回帰=不安定。2243だけが両期間で
z≈+1.2を維持=本物の安定シグナル。隣接する2252も同様に両期間安定だが
2243とは別セクション(2247-2263)に属し位置的に隣接していないため、
「2240-2243が隣接しているから高い」という地理的クラスタ説は支持されない。

### 2. 角台(セクション端)理論 → 棄却
蒲田7top15・蒲田1top15のいずれもrank_from_min/max=1(セクション端)の
台が0台(0%)。むしろ全体平均の角台率(15-17%)より低い。
2243もrank_from_max=4でセクション端ではない。

### 3. 他ホール横展開(蒲田1) → 棄却(ユーザー指摘により当然の帰結と確認)
蒲田1のmachine 2243はhit_110=0.0643で、蒲田1フロアbaseline
(mean=0.2016, std=0.0813)に対しz=-1.69、2236-2255ブロック内最下位タイ。
蒲田1と蒲田7は配置・機種が全く異なるため、台番号自体に普遍的な意味はない
(ユーザー指摘で確認済み)。

## アクション
1. 「全期間で高いhit_110」が見つかった場合、必ずsplit-half(前半/後半)で
   再計算し、両期間でz-scoreが同程度かを確認する。前半のみ/後半のみ高い
   台は不安定(回帰待ち)として扱い、法則化しない。
2. 隣接台クラスタの「地理的な帯」が見えても、split-half安定性を
   個別に確認するまでは位置効果と断定しない。安定なのは2243と2252のみで、
   隣接する2240-2242は不安定だった。
3. 角台理論は本データセット(蒲田1/蒲田7 2F)では支持されない。今後
   「角台が強い」という仮説をMLや分析に投入する前に同様のedge_rate
   チェックを行う。
4. 台番号ベースの他ホール横展開は無意味(ホール別戦略の多様性、
   CLAUDE.md記載の既知事実と整合)。横展開する場合は座席の物理的な
   役割(島端/通路側/壁側など)で揃えるべきで、台番号の数値一致では
   揃わない。
5. 2243・2252は「蒲田7 2Fでsplit-half stableなhit_110上振れ台」として
   今後の検証対象リストに残すが、背景説明(visibility/客の回転/設置後
   差枚管理など)はデータからは特定できないため、これ以上の深堀りは
   ROIが低い可能性が高い。

## 例
```python
# split-half baseline比較
dates = sorted(df['date'].unique())
mid = dates[len(dates)//2]
df['half'] = df['date'].apply(lambda d: 'first' if d < mid else 'second')
per_half = df.groupby(['machine_number','half']).apply(
    lambda g: pd.Series({'hit_110': (g['payoutrate']>=110).mean(), 'n': len(g)})
).reset_index()
piv = per_half.pivot(index='machine_number', columns='half', values='hit_110')
# 各halfごとにmean/stdを再計算してz-scoreを比較する
```
