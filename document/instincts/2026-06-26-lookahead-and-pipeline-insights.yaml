# 蒲田7は開店ブースト（2025年7月）から12ヶ月かけて正常化 — 全期間均質ではない

## 背景
2026-06-26 レジーム変化調査。月次payout推移と個別台hit104率を分析。

## 発見
### ホール全体加重平均payout
- 2025-07: 103.70% → 2025-09: 101.67% → 2026-06: 100.68%
- 12ヶ月にわたる連続的下降。特定日付の急変はなし

### 個別台hit104率
- 2025-07: 282台/日(39.5%) → 2025-09以降: 215-234台/日(30-32%)で横ばい
- 104%超え台数は安定しているが、超え幅が縮小

### 台数
- 全期間で714台一定

## アクション
- 全期間をflatに扱う分析は前半バイアスに注意
- window=90は蒲田7のトレンドに対して適切なサイズと確認
- 将来的に安定期のみで再検証する価値あり

