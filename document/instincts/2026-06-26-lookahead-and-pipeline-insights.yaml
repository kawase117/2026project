# ルックアヘッド検出法: 同じロジックを別実装で走らせて結果が再現するか確認する

## 背景
2026-06-26 Track D。seg_percentileリランキングの初回検証で+108枚/日（p=0.000003）という
高度に有意な結果が出た。しかしpool_n sweepで別実装を走らせたところ結果が再現せず、
原因を追ったらstrength_weightの計算に当日の `diff_coins_normalized`（実績値）を
使っていたルックアヘッドが発覚した。

## ルックアヘッドが起きやすいパターン
1. `scored` DataFrameには当日の `diff_coins_normalized`（実績）が含まれている
2. score_day()の出力を後処理するとき、compositeやc1-c6はtrain由来だが、
   diff_coins_normalizedやgames_normalizedは当日のactualから来ている
3. groupby("segment")["diff_coins_normalized"].mean() のような集計は
   「今日どのセグメントが勝ったか」を見ているのでルックアヘッド

## 安全な列（ルックアヘッドなし）
- composite, c1-c6: train期間の統計から算出
- hist_diff, hist_payout, hist_winrate, hist_hit_an: train期間の台別履歴
- segment, floor, lr, kakuban: 固定属性
- debut_phase, debut_multiplier: train期間のdebut_date計算

## 危険な列（ルックアヘッドの可能性）
- diff_coins_normalized: 当日実績
- games_normalized: 当日の実稼働（当日の人気度を反映）
- machine_payout, hist_payout_row: 当日実績から算出

## アクション
- 有望な結果が出たら、別実装で再現を確認する（特にp < 0.01の場合）
- scored DataFrameの列を後処理で使うとき、その列がtrain由来かactual由来かを確認する
- strength_weightやフィルタ条件にはcompositeかtrain期間の集計値のみを使う

