# scored_poolはCSV追記方式に修正済み — メモリ蓄積は直近10日分のみ

## 背景
2026-06-26 修正。walk-forward backtestがscored_poolをリスト蓄積してメモリ枯渇していた問題を修正。

## 修正内容
- scored_poolの各DataFrameを scored_pool.csv に都度追記（mode="a"）
- メモリには直近10日分（scored_pool_tail）のみ保持
- correlation_matrix / island_clustering / adjacency_effectは直近10日分から計算

## アクション
- 3バリアント以上×全日実行でもメモリ枯渇しない
- --resume時はCSVにヘッダーを重複書き込みしない
