# predict_daily.py で scrape → DB → predict_gated を一気通貫実行可能

## 背景
2026-06-26 実装。3ステップの手動実行を1コマンドに統合。

## 使い方
```bash
# DBに昨日のデータがある場合
python -m ml.experiments.walkforward_scoring.predict_daily --skip-scrape --skip-db

# 特定日付を指定
python -m ml.experiments.walkforward_scoring.predict_daily --date 20260625 --skip-scrape --skip-db
```

## 注意
- スクレイパーは --date/--hall CLI引数未対応のため --skip-scrape が必須
- JSONなし + --skip-scrape → エラー終了（安全ガード）
- DBに当日データなし + --skip-db → エラー終了（安全ガード）

