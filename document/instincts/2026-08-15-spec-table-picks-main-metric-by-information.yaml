# RB主義はジャグラー限定。スペック表がある機種は KL情報量で主指標を選び、較正を先に確認する

## Core claim
メーカー公表スペック表がある機種の設定推定では、**BB と RB のどちらを主指標にするかを
スペック表の KL情報量から決める**。ジャグラー由来の「設定判定はRB確率」を他機種へ
そのまま持ち込むと、使える情報の一部しか使わないか、較正のずれた指標に賭けることになる。

手順は3つ。

1. **主指標を情報量で選ぶ** — 設定6を真としたときの1日あたり期待対数尤度比
   `λ6·ln(λ6/λ1) − (λ6−λ1)` を BB と RB で比べる。設定差の**比**が大きいほうが
   勝つとは限らない。事象数が効く。
2. **較正を先に確認する** — 全履歴（十万G〜百万Gオーダー）の実測を **設定1の理論値**と
   突き合わせる。設定1は下限なので、実測が設定1理論値を**下回る**指標は
   計測側が疑わしい。較正の取れていない指標を主指標にしない。
3. **BB単独・RB単独・両方の3通りで事後を出し、内訳を報告する。** 片方だけで
   結論が立たない場合、それは結論の頑健性に対する留保として明示する。

## Evidence
- n_observations: 楽園蒲田店 ハイパーラッシュ（SEVEN LEAGUE / 6.5号機 AT擬似ボーナス /
  導入2024-09-17 / 天井非搭載 / ベース約34G per 50枚）全履歴 2,740,793G（1,098日）
- data scope: single-hall / single-model（台番号は 2177-2178 → 3168,3174 → 2145-2147 →
  3159 → 3191 と移設を繰り返し、現在1台設置）
- metric scope: bb_count / rb_count / games_normalized / diff_coins_normalized
- スペック表（ユーザー提供）: 設定1 BB 1/259.3・RB 1/527.3・合算 1/173.8・出玉率 98.9%(完全攻略100.5%)
  … 設定6 BB 1/216.5・RB 1/430.5・合算 1/144.0・出玉率 108.1%(完全攻略111.0%)

**(a) 判別力は BB が RB の1.6倍**

設定差の比は RB のほうが大きい（BB 259.3/216.5 = 1.198 倍 vs RB 527.3/430.5 = **1.225 倍**）。
それでも BB が勝つのは事象数が約2倍あるため。

| G数 | BB寄与(KL) | RB寄与(KL) | 比 |
|---|---|---|---|
| 5,000 | 0.35 | 0.22 | BB は RB の 1.6倍 |
| 16,876 | 1.20 | 0.75 | BB は RB の 1.6倍 |

**(b) 較正: BB は理論一致、RB は設定1理論値を下回る**

全履歴 2,740,793G を設定1理論値と突き合わせ（設定1は下限なので下振れは物理的にありえない向き）:

| | 観測 | 設定1期待 | 乖離 | z | 両側p | 実測 vs 設定1理論 |
|---|---|---|---|---|---|---|
| BB | 10,601 | 10,570 | +31 | +0.30 | 0.763 | 1/258.5 vs 1/259.3 |
| RB | 5,054 | 5,198 | **-144** | **-1.99** | **0.046** | 1/542.3 vs 1/527.3 |

RB のみ理論より 2.8% 少ない。候補は (i) スクレイピング元の RB カウント欠落、
(ii) スペック表の RB 値の相違、(iii) チャレンジBB(平均230枚)が BB/RB どちらに
計上されるかの表示仕様差。274万Gで z=-1.99 なので効果量は小さく断定はできないが、
**RB を主指標に据えると設定を系統的に低く見積もる向きにバイアスがかかる**。

**(c) 実データでの内訳（2026-08-12〜14、16,876G、BB=87、RB=39）**

| 使う指標 | 設定6:設定1 | P(設定5-6) | 最尤 |
|---|---|---|---|
| BB のみ | **16.91 : 1** | 0.686 | 設定6 |
| RB のみ | **2.04 : 1** | 0.419 | 設定6（事後はほぼ平坦: 設定1 10% / 設定6 21%） |
| BB×RB | **34.53 : 1** | 0.734 | 設定6 |

**RB 単独では「判別不能」で終わっていた。** 結論を支えているのは主に BB。

**(d) 副産物: 全履歴が設定1理論値と一致することは低設定運用の直接観測になる**

全履歴 BB 1/258.5・合算 1/175.1・実測出玉率 100.5% が、設定1の
1/259.3・1/173.8・完全攻略100.5% に三つとも重なる。274万Gあれば誤差は潰れているので
「このホールはこの機種を一貫して設定1で回してきた」と読める。
そこからの乖離（8/12以降）は分布の裾ではなく**運用の切り替え**と解釈できる。
7/6-8/11（同一台3191、78,456G）は BB 1/274.3・出玉率98.5% で設定1事後47%/設定2 39%。

## Interpretation
- 「ノーマル機の設定判定はRB確率」は **ジャグラーファミリー限定の規則**である。
  ジャグラーは BB にほぼ設定差がなく RB に全設定差が乗る設計なので RB を見る。
  BB/RB 両方に設定差が乗る機種では成立しない。
  既存の `ml/experiments/jug_rb_setting_prediction/` が `match_family()` で
  ファミリーを絞っているのは設計として正しく、他機種を流し込んではならない。
- ⚠️ **単一機種・単一ホールの検証である。** (a) の情報量比較はスペック表さえあれば
  どの機種でも計算できる純粋な算術なので一般に成り立つが、(b) の RB 下振れが
  ana-slo 側の計測バイアスなのかこの機種固有なのかは未分離。
  他機種でも同じ向きのズレが出るか確認するまで一般化しない。
- 出玉率の突き合わせも忘れないこと。8/12-14 の実測出玉率は 117.3% で、
  設定6の完全攻略値 111.0% を超えている。ボーナス確率が設定6相当でも、
  差枚の一部（この例では約3,200枚）は純粋な上振れであり、翌日の期待値にしてはならない。

## Action
- スペック表が手に入る機種を評価するときは、**まず KL情報量で BB/RB の主従を決める**。
  比が大きいほうではなく、`λ6·ln(λ6/λ1) − (λ6−λ1)` が大きいほうを主指標にする。
- **全履歴実測を設定1理論値と突き合わせてから**事後分布を報告する。
  設定1を下回る指標が見つかったら、その指標を主指標にしない。
- 事後は **BB単独・RB単独・両方の3通り**を出し、内訳を報告する。
  片方だけで結論が立たないなら、その旨を留保として明示する。
- ⚠️ **パーセンタイル（「過去N窓中の順位」）を判定の主軸にしない。**
  スペック表を得る前、同じデータを3日窓のBB確率パーセンタイルで見て
  「上位3.5%だが断定できない」と評価したが、尤度で見ると
  966窓中1位・設定6:設定1 = 34.5:1 だった。パーセンタイルは分散の大きい窓を
  同列に扱うため、判別力を系統的に過小評価する。
- 実務ルール: 設定差が小さい機種（この例は BB で1.198倍）は**単日では見切れない**。
  単日5,000Gでの尤度比は 2.2〜5.7 にとどまり、3日16,876Gでようやく34.5。
  「途中まで打って当日データで降りる」判断は成立しないので、
  据え置き仮説に賭けて閉店まで回すか打たないかの二択にする。

