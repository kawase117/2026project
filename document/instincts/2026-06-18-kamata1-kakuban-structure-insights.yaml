# 蒲田1 2F_N は kakuban 効果が全期間・全時系列で非有意（通常日は位置で差別化できない）

## 背景
kamata_kakuban_section_residual_eda/kamata1_2F_N_kakuban_residual_all.csv と
kamata_kakuban_temporal_species_eda/kamata1_2F_N_temporal_summary.csv を読解（2026-06-18実施）。

全期間残差（7 sig rows あり）
  kakuban=1   q=2.4e-5, mean=-106, median=-450（コーナーは弱い）
  kakuban=20  mean=-182, median=-650（大型列の奥端も弱い）
  kakuban=3,2,12  mean わずかに正だが median は全て負（アウトライア駆動）

時系列検定
  2025  kruskal_p=0.70（非有意）, middle_minus_corner=+25.0
  2026  kruskal_p=0.34（非有意）, middle_minus_corner=+33.2
  どの年も非有意。中間台の有利性を示す数値はあるが統計的に支持されない

## アクション
通常日に蒲田1 2F AT系を選ぶ場合:
kakuban 位置による絞り込みは統計的根拠が薄い（kakuban=1,20 を避ける程度で十分）。
イベント日は例外（[[kamata1-2fn-event-section-hotspot]] の通り section で絞る）。
台選択の主軸は DD 軸・セクション（イベント日）を使うこと。

