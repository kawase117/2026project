# 蒲田1 2F_A kakuban=1（コーナー）は構造的に最弱、中間帯はアウトライア駆動で実質フラット

## 背景
kamata_kakuban_section_residual_eda/kamata1_2F_A_kakuban_residual_all.csv 読解（2026-06-18実施）。
セクション平均を除いた残差（residual = diff_coins - section_mean）でポジション効果を分離。

結果
  8 sig rows
  kakuban=1（コーナー端）  q=3e-12, mean=-81, median=-225  --- 圧倒的最弱、median が深くマイナス
  中間帯（kakuban=8,9,10）  mean はわずかに正だが median は負  --- アウトライア駆動、構造的優位ではない

## 種別別（kamata1_2F_A_species_summary.csv）
  ジャグラー  p=7.7e-5（高有意）, middle_minus_corner=+26.4（n_corner=32362, n_middle=49786）
  ハナハナ    p=0.024（有意）,    middle_minus_corner=+52.7（ハナハナで効果が最大）
  BT機        p=0.52（非有意）--- BT では kakuban 効果なし

## 時系列変化（kamata1_2F_A_temporal_summary.csv）
  2025  kruskal_p=4e-6（高有意）, middle_minus_corner=+35.6
  2026  kruskal_p=0.086（限界外）, middle_minus_corner=+19.5
  中間台優位は 2025 に強く確認、2026 で弱体化傾向あり

## アクション
通常日に蒲田1 2F ジャグ系を選ぶ場合:
kakuban=1（コーナー端）は最も避けるべき位置（median=-225, p=3e-12）。
中間帯（kakuban=8〜10）は統計的には有意な優位を持つが median が負なので過信しないこと。
ハナハナ機種がある列では中間帯の効果がより大きい（+52.7 vs +26.4）。
BT機は kakuban 効果が認められないため、他の軸（DD、tail など）で選択する。
2026 年は 2025 より中間帯優位が弱まっているため、強い台選択根拠がない場合はセクション軸を優先。

