# 「1ゾロ」は日付の11日。1の付く日に混ぜると外す

## Core claim
予告の「ゾロ」は、まず**日付のゾロ目(11日・22日・MM=DDの月ゾロ)**として読む。「1ゾロ=1の付く日」と読むと外した。

## Evidence
2026-10-11(11日)の蒲田7予告「1ゾロの日」を1の付く日と解釈して本命にしたが、ホール平均-69(95日中85位)。
台番号が末尾ゾロ目の台の差枚残差(同日・同機種平均を引いた値、7/9〜10/11)は、日付の区分で別物だった。
- 蒲田7: 11日 +3,422/+615/+584/+525(4/4プラス)、他の1の日(1・21・31日)は+3(効果なし)。
- 楽園: 22日 +673/+711/+671(3/3)、11日 4/4プラス、他の1の日 +62。
- 蒲田1: 11日 3/4、22日 3/3プラス、他の1の日 -79。
- ヒロキ東口は逆(11日 -321)。みとやは混在。ホールごとに違うのでプールしない。
- 蒲田7のジャグ系RB比は11日ゾロ目台で4日合算1.172だが、10/11当日は0.947で再現しなかった。差枚は再現、RBは再現せず。
- 11日の過去3回のデータは予測時点で見られた。1の日に混ぜて層別しなかったのが失敗。

## Action
- 「ゾロ」の語は台番号ゾロ目と日付ゾロ目の両方で読み、日付は1の日・11/22日・月ゾロを別々に層別する。
- 次の日付ゾロ目は10/22(木)・11/11・11/22。蒲田7・楽園・蒲田1のゾロ目台を事前に見て、結果を記録する。
- **事後に見つけた軸なので、前向きに確認するまで効果は確定扱いにしない。** 11日4日・22日3日では少なく、7/11(+3,422)が平均を引く。
