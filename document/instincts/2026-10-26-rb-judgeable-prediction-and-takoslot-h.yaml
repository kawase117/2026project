# 少数日のRB平均は、日別に分解し、無作為に取り直した偶然率を一緒に出す

## Core claim
数日分をまとめたRB率（例: 5日で1/297）は、1日の突出（10/18の35RB）で引き上げられていることが多い。強いと言う前に、日別の設定5以上の確率に分解し、同じ台の別の日から無作為に取り直して「どれかが出る確率」を併記する。

## Evidence
- n_observations: 楽園タコスロ3台×約42日、8のつく日5日。
- result summary:
  - 3214の8のつく日: RB88/26,175G（設定1比1.18、設定6の期待87回とほぼ同じ）。日別に分解すると、設定5以上の確率は0.39、0.59、0.39、0.45、0.82（10/18）で、2日は設定1並み。
  - 事前を設定1・2・5・6の等確率にすると0.5が「情報なし」。0.7以上の日だけが強い。
  - 無作為5日で1.18以上になる確率は3214単独12%、3台のどれかなら25%。

## Interpretation
- 後から台・条件を選んで一番良いものを見れば、偶然でも4回に1回は出る。
- 数日をまとめた平均は、設定が日替わりである前提と合わない。

## Action
- 「強い」と言う前に、日別の設定5以上の確率（等確率事前）と、無作為5日で同じ水準になる割合を出す。
- 台数・日数が少ない（数台・数日）ときは、候補の条件を事前に決め、フォワードで追試する。
- 多重比較（台×曜日×末尾）を割った分だけ、偶然の余地が増えると書く。

