# タコスロ: 設定はRBで読み、BB0回の台日は「設定H（ユーザー申告）」と欠損の区別をフォワードで付ける

## Core claim
タコスロはBT機でBB欄が当てにならないため、設定はRBの設定1比で読む。3,000G以上でBB0回の台日（4件、ヒロキ東口2337と西口206のみ）はHの確率（BIG 1/40408・RB 1/308、ユーザー申告）と合計RBが一致するが、BB欄の欠損とは今のデータでは区別できない。8のつく日・曜日・交互の法則は、現時点では確認されていない。

## Evidence
- n_observations: タコスロの2,000G以上の台日1,007件（13ホール、2026-09-07〜10-26）。うち8のつく日102台日。
- data scope: 全ホールDB、BBが0回の行（3,000G以上）は4件のみ。
- metric scope: RBの設定1比（スペック1/352.3）、ポアソン、BB補完（1/310）後の差枚残差。
- result summary:
  - スペックは設定1・2・5・6の4段階。機械割は目押しなし98.7/100.5/103.3/106.2%、完全攻略100.7/102.6/105.5/108.5%（ユーザー提供）。実測は攻略率で変わる。
  - 差枚の約83%はBB確率の差で説明（回帰: −1.22枚/G、+303枚/BB、+112枚/RB、R²=0.78）。BB欄はスペックと合わず、RB欄は13ホール中12で範囲内。
  - BB0回の4件: 東口9/7（6,419G・RB22・+2,611）、9/8（3,123G・RB3・+75）、西口9/18（8,375G・RB36・+3,486）、10/9（9,915G・RB29・+2,744）。BB0回のままなら差枚は期待より3,500〜11,600枚多く、BBをスペック確率で補えば残差は+500〜1,900枚。
  - Hの確率で見ると4件の合計RBは90回で期待90.4回に一致（9/8のRB3は約1%の下振れ）。
  - 曜日は月・火・金・金。台帳のイベント登録は東口・西口にない。9/8は山佐の8のつく日（dechauKanto）とのユーザー申告。
  - 8のつく日の全ホール比較: 設定1比1.03対1.01（差+0.025、区間−0.041〜+0.087）。楽園は台別で3212が1.11、3214が1.18だが、3214は10/18の35RB（1/200、設定5以上0.82）が主因で、無作為5日で1.18以上になるのは単独12%、3台のどれかなら25%。
  - 楽園の3212と3214は交互ではない（同日相関r=0.03、優位の切替16/36）。曜日別・周期・日末尾の差も区間が全体をまたぐ（末尾7・8・9のみ1.12〜1.15、後付けの可能性）。
  - 追試1回目（10/28、2026-10-29に集計）: 楽園3212は5,060G・RB22（1/230、設定1比1.53、設定5以上の確率0.68、+3,143）、3214は3,917G・RB13（1/301、1.17、0.53、−1,381）、3213は302Gで判定不能。0.7以上の強い日はなかった。8のつく日6日・18台日の合計は1/307で、ほかの日（45日・135台日）の1/353より良い（期待約220回に対し253回）。ただし13ホールを同時に見ており、ほかの12ホールは1/287〜1/573に散らばる（全ホール合計は8のつく日1/343対ほかの日1/357）。偶然と区別できない。

## Interpretation
- BB0回の台日はスペックの通常設定ではほぼ起きない。HかBB欄の欠損のどちらかで、補完すると差枚は普通の範囲に入り、Hの確率を当てるとRB合計は完全に合う。両方が成り立つため、決め手は元データの確認か、フォワードでBB0回が連続するかになる。
- 5日をまとめて「設定6相当」と読むと、1日の強い日（10/18）が全体を引き上げる。日ごとの設定が違う前提で、1日単位に分解する。
- 台・曜日・日末尾を割ってから一番良い所を見ると、偶然でも約4回に1回は出る。

## Action
- タコスロの設定はRBの設定1比で読む。BB欄・BB+RB合算・差枚だけでは読まない。攻略率の幅（50〜100%）をつけて機械割を比べる。
- 3,000G以上・BB0回・RBが期待どおりの台日を毎朝拾い、BB0が複数日続くか、元データ（ana-slo）でBB欄が0かを確認する。
- 「8のつく日」「3212・3214」の効果は、10/28・11/8・11/18のデータで事前に決めた1指標（RBの設定1比）で追試する。10/28は済み（強い日なし、判定保留）。残りは11/8・11/18。楽園以外のホールは追試の対象にしない（後から一番良いホールを選ぶことになる）。
- ユーザー申告（設定Hの確率、山佐の8のつく日）は出所つきで台帳に残し、データの読みと混ぜない。

