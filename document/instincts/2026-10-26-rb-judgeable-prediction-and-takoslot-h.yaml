# RB判別機種は差枚ではなく「RBの設定1比」で採点し、比較できる機種だけで機種・台を選ぶ（効果は小さく、判定はフォワードのみ）

## Core claim
RB判別機種は最低設定の機械割が100%前後で、最高設定も104%程度と差が小さく、差枚ランキングでは設定の差が埋もれる。機種・台の候補はRBの設定1比（Σrb ÷ Σ(G×設定1のRB確率)）で作り、採点も同じ指標で別系列にする。台の固定性や機種の強さは統計的に実在するが小さく、採用の可否はフォワードの成功基準で決める。

## Evidence
- n_observations: 楽園・みとや・蒲田7・平和島・BIGディッパー・ARROW・蒲田1などの2026-01〜10-24。判別機種はbonus_specsの72機種（ノーマル27・BT18・A+AT27）。
- data scope: 比較可能な機種＝ホールごとに100台日以上・ホールのRB率が[設定1×0.95, 最高設定×1.05]に入るもの。
- metric scope: z=(RB率−設定1)/(最高設定−設定1)、機種ごとの全ホール平均オフセットを引いたadj、edge=選んだ台−選ばなかった台（同日・同ホール・同機種）、7日ブロックのブートストラップ95%区間。
- result summary:
  - 台単位の持続性は実在するが小さい（+0.014〜0.018、機械割で約+0.4%）。長窓ほど翌日を予測（90日0.34、180日0.45）。
  - 機種単位はホール固有の90日zが+0.06。水準の約2/3は機種ごとのオフセットだった。日単位は同曜日が最も強い（傾き+0.42、効果約+0.03z）。
  - イベント固有の上乗せは、厳密な定義では再現しなかった。
  - 低成績の台が上がる「上げ狙い」は平均では存在しない。長期が強い台の直近7日の凹みの戻りは、蒲田7（+0.035、対照+0.005）と楽園（+0.035、対照+0.017）で見え、みとやでは逆向き（勢いが続く）。
  - 採用ホールは楽園・みとや・蒲田7・平和島・BIGディッパー・ARROW。蒲田1は上位群の区間下限が−0.003で不採用。
  - 実装: backtest/rb_candidates.py（毎朝rbauto・rbdip・rbdipctrlを自動凍結）、台帳は別系列、採点表にrbm_top/rbm_bottom/rbauto_units/rbdip_*。

## Interpretation
- 差枚は技術介入・出玉の運が混ざり、RB判別機種では設定の証拠にならない。RB単独で測る（BB+RB合算は使わない）。
- 持続性は「台の固定」と「機種×ホールの選び方」の両方に出るが、どちらも効果量は小さく、全ホール共通の法則ではない。
- 凹み戻りと連続日数は、ホール・条件を結果を見て選んだ探索結果であり、フォワードが済むまで確定扱いにしない。

## Action
- RB判別機種の予測・採点は、RB設定1比（ホール内の比較できる機種）で行う。差枚は補助に置く。
- 台を挙げるときは、機種内で相対化した長窓（90〜180日）の設定1比を使い、直近7日の1日単位の高RBは根拠にしない。
- 凹み戻りは蒲田7・楽園だけで、成功基準（H1: 90エントリー日でAのedge≥+0.02かつ区間下限>0、H2: 180日でA−B>0かつ区間下限>0）を満たすまで採用しない。
- 満たさなければ打ち切り、記録する。みとやに凹み戻りを広げない。

