# ヒロキ東口のD6は『ホール全体が強い日』だけが使え、機種・台番号の事前順位には予測力がない

## 背景
ヒロキ東口のD6(6・16・26日)は、直近3か月の台平均差枚が+320(他の日は-31)で、2026-10-06も+231(順位9/93)と、ホール全体の強さは再現した。
一方、営業前(DBは10/5まで)に出したD6の機種順位・台順位・ジャグのRB底上げは、同日の結果と対応しなかった。
- 機種順位(18機種): ρ=-0.04。
- 台順位(D6台日6以上、199台): ρ=-0.03、回帰の傾き0.03。上位13台の平均-502、全台+252(並べ替えp≈0.08)。
- ジャグのRB比は予測と逆向き: マイジャグV 1.14→0.99、ネオアイム1.06→0.72、ファンキー2・ミスターは0.88→1.17・1.18。
7/6〜10/5を前半・後半に分けた台別D6平均の相関も-0.035で、事前に予測力が無いことは分かっていた。D6上位台は、9日分の平均が高い台を選ぶので、最大値選択による偶然の上振れを拾っている。
単日の前向き検証が1件なので、機種・台の予測力ゼロを断定はしない(観察を続ける)。

## アクション
- ヒロキ東口で営業前に推奨を出すときは、D6(や6の付く日)のホール全体の強さだけを根拠にする。機種・台番号の事前ランキングは出さないか、予測力なしと明記して参考にとどめる。
- 台は当日の回転数・RB・前任者の履歴から事後確率で選ぶ。D6のジャグRB底上げは、2026-10-06で外れたので見立てを下げる。
- 次のD6(10/16・26)で、同じ検証(台順位・機種順位・RB比の相関)を繰り返し、日数を貯める。

## 例
10/6の営業前に挙げたD6上位台(2203カバネリ、2317喰霊、2388ライズ、2385モンキーV、2161喰種、2383モンキーV…)は、今日動いた13台の平均-502で、プラスは2台だけだった。
