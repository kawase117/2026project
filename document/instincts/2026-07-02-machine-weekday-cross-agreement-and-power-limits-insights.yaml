# 機種単体one-vs-rest+FDRは小サンプル×大きい検定家族で構造的に却下されやすい

## 背景
機種横断一致度スキャンの機種名レベル深堀りで、ホールレベルでは明確に有意だった(hall, dd/weekday)でも、その日にいた全機種(70〜180台)を一斉にFDR補正すると、個体として有意になる機種はごく僅か(DD版で2/多数、曜日版repeat_contributorsで0/4)になった。原因は2つの複合: (1)機種×日のセルはn=10〜50程度で二項検定自体の検出力が元々低い、(2)同じ(hall, dd/weekday)内の全機種を検定対象にするためFDRの家族サイズが大きく(70〜180)、生き残るための閾値が厳しくなる。実例: 蒲田7のミリオンゴッド‐神々の軌跡‐はdd30で+25.7pt(q=0.003、有意)だったが、レイトギャップでは同じdd30・同じ方向・ほぼ同じ大きさ(+24.5pt)なのにn=30(蒲田7はn=50)というだけでq=0.080と非有意に落ちた。

## アクション
「個体として非有意」を「効果なし」と読み替えない。特に、複数の有意日/複数ホールで同じ機種・同じ方向・近い効果量が繰り返し出ているのに個別検定では落ちるケースは、検出力不足による見逃しの可能性が高いと考える。改善するなら(a)同一機種の複数機会をプールして1つの検定にまとめる(ホール内限定、feedback-no-cross-hall-pooling参照)、(b)Fisherの結合p値で複数回の弱い有意を積み上げる、(c)順位ベースで候補を先に絞ってからFDRの家族サイズを縮小する、のいずれかを検討する。現状のパイプラインはどれも未実装。

## 例
eda/machine_dd_cross_agreement_machine_deepdive.py, eda/machine_weekday_cross_agreement_machine_deepdive.py。ミリオンゴッド‐神々の軌跡‐: 蒲田7 dd30 q=0.003(有意) vs レイトギャップ dd30 q=0.080(非有意、効果量はほぼ同じ)。

