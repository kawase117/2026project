# 機種横断DD一致度スキャンの曜日版が利用可能

## 背景
[dd-cross-machine-agreement-tool-available](2026-07-02-machine-dd-cross-agreement-insights.yaml)のDD(1〜31日)版と同じ設計を軸だけ曜日に変えて実装。`eda/machine_weekday_cross_agreement_scan.py`（ホール×曜日の機種横断一致度、FDR、is_weekendベースの既知/新規判定、プール絶対水準、machine_masterカテゴリ支配度ロバストネス）と`eda/machine_weekday_cross_agreement_machine_deepdive.py`（機種名フルランキング、機種単体one-vs-rest検定、ホール内常連、ホール横断一致）の2本。`load_machine_categories`/`attach_machine_category`はDD版から直接importして再利用(軸非依存)。9ホール全実行済み(2026-07-02)。

## アクション
曜日軸で機種横断投入日を検出したいときは`python eda/machine_weekday_cross_agreement_scan.py --all-halls`→`python eda/machine_weekday_cross_agreement_machine_deepdive.py --all-halls`の順で実行する。出力は`eda/results/machine_weekday_cross_agreement/`と`eda/results/machine_weekday_cross_agreement_deepdive/`。

## 例
2026-07-02の9ホール実行結果: 有意な曜日を持つホールは3つのみ(蒲田7=3曜日, 楽園=2曜日, みとや=1曜日)。残り6ホール(蒲田1・レイトギャップ・ARROW・ヒロキ・ザシティ・金時)は有意な曜日がゼロだった。DD軸(31水準)と比べて曜日軸(7水準)は水準数が少ない分、機種横断一致が検出されるホール自体が少ない傾向。

