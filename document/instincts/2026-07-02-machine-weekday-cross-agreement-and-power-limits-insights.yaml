# 蒲田7の水・金の曜日横断一致度マイナスは、既知の「個別機種狙い撃ち型」曜日と方向が一致

## 背景
蒲田7の曜日別機種横断一致度スキャン(2026-07-02)で、水曜(-1.7pt, novel)と金曜(-42.3pt, novel)が有意なマイナス方向として検出された。これはClaude側メモリの`kamata7_weekday_event_pattern`(火=角番、水=末尾、土=3台並び、木=ニブイチ、金=列1台、月=列全体、日=機種1台)で、水=末尾・金=列1台という「特定の少数機種だけを狙い撃ちする投入タイプ」と記録されている曜日と一致する。少数機種だけに投入が偏ると、残りの大多数の機種は相対的に平均を下回るため、機種横断の広範囲一致度スキャンではマイナス方向として現れる、という解釈が整合的。日曜(+、既知の「機種1台」型ではなく広範囲型)はプラス方向で有意、こちらも整合。

## アクション
is_weekend=0の曜日が機種横断一致度スキャンで有意になっても、機械的に「新規発見」と呼ばない。まず該当ホールに既存の曜日別投入タイプの知見がないか(Claude側メモリ、`document/instincts/`のkamata7関連ファイル)を確認し、狙い撃ち型(個別機種)の曜日はマイナス方向の広範囲シグナルとして現れうる、という解釈を優先的に検討する。

## 例
蒲田7: 水(-1.7pt novel), 金(-42.3pt novel) — ともに「列1台/末尾」型の狙い撃ち曜日と整合。日(+0.8pt, known-weekend) — 「機種1台」型だが広範囲プラスとして出ている点は今後要検証。
