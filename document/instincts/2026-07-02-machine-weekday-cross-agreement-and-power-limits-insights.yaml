# 「現存機種フィルタ」はDD版・曜日版どちらでも同じ撤去済み機種を正しく検出した

## 背景
各ホールの最新日付(2026-07-01または2026-06-29)に存在する機種名だけを残すフィルタを、DD版のcross_hall_consistency/repeat_contributorsと曜日版のrepeat_contributorsの両方に独立に適用した。どちらでも`回胴黙示録カイジ 狂宴`(蒲田7)が正しく除外され、既に「ほぼ撤去済み」と分かっていた機種と整合した。DD版のcross_hall_consistency(55件)は現存フィルタで16件に、曜日版のrepeat_contributors(14件)は4件まで絞られた。

## アクション
機種横断分析で見つかった候補機種リストを実運用推奨に転用する前は必ず、各ホールの最新日付における設置有無で足切りする。フィルタ前の候補数と比べて大きく減る(今回は55→16、14→4)のが通常なので、フィルタ前の件数だけを見て「たくさん見つかった」と早合点しない。

## 例
eda/results/machine_dd_cross_agreement_deepdive/, eda/results/machine_weekday_cross_agreement_deepdive/のrepeat_contributors.csv/cross_hall_consistency.csv。

