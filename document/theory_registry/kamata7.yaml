  - id: k7-event-a-concentration
    title: イベント日はA機の方がN機よりリフトが大きい（差枚+94.7 vs +69.6、104%率+1.46pp vs +1.49pp）
    status: robust
    segment:
      family: A
      event_day: true
    metric: hit104_rate
    direction: up
    baseline: segment_non_event
    min_n: 5
    note: baselineをhall_all（N機込みの全体平均33.3%）からsegment_non_event（同一family内のイベント日vs非イベント日）に修正。hall_allと比較するとA機は104%率自体が構造的に低い（機械割ブレが小さいため）ため見かけ上マイナスになっていたが、正しい比較（同一family内での前後差）ではA機+1.46pp/N機+1.49ppで104%率の伸びはほぼ同水準。ただし差枚（avg_diff）で見るとA機+94.7 vs N機+69.6でA機の方が伸び幅が大きく、「A機に集中」の主張はavg_diff側で成立する。
    source: document/kamata7_theory.md#2-5-イベント日（A機に集中）
    last_reviewed: 2026-07-10
