# 複数フェーズ ADR 実装パターン

## 背景
大規模な ADR を複数フェーズに分割することで、各フェーズの独立性を保ちながら段階的に実装できる。各フェーズは異なるコンポーネント（外部スキル、既存システム改修、新規スキル）に対応。

## アクション
1. Phase 1: 既存システム（ingest-v2）を除外ルールで改修
2. Phase 2: 新規スキル（weekly-notes-aggregator）を完全に独立実装
3. Phase 3: 別の既存システム（monthly-healthcheck）に新機能追加
4. 各フェーズ完成後に git commit で区切る
5. ドキュメンテーション（spec、SKILL.md）を最後にまとめて作成

## 例
ADR 0004: 3層パイプライン
- Phase 1: ingest-v2 ← `raw/notes/` 除外ルール
- Phase 2: weekly-notes-aggregator ← 新規スキル（8ファイル、11テスト）
- Phase 3: monthly-healthcheck ← CHECK7 統合機能

