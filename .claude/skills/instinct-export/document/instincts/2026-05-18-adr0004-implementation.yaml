# YAML フロントマッター抽出パターン

## 背景
Markdown ファイルの frontmatter（`---` で囲まれた YAML）を安全に解析するには、分割と例外処理が必要。存在しない frontmatter や形式エラーに対応する必要がある。

## アクション
- ファイル先頭が `---` で始まるかチェック
- `content.split("---", 2)` で3部に分割（frontmatter, separator, body）
- `yaml.safe_load()` で frontmatter を解析（失敗時は空 dict）
- body は `.strip()` で前後空白を削除

## 例
```python
def parse_frontmatter(file_path: Path) -> Tuple[Dict, str]:
    with open(file_path, 'r', encoding='utf-8') as f:
        content = f.read()

    if not content.startswith("---"):
        return {}, content

    parts = content.split("---", 2)
    if len(parts) < 3:
        return {}, content

    fm = yaml.safe_load(parts[1]) or {}
    body = parts[2].strip()
    return fm, body
```

