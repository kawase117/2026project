# Pytest フィクスチャ：合成データパターン

## 背景
ファイル I/O テストは、実際の wiki 構造を複製した一時ディレクトリ上で実行する必要がある。各テストが独立した環境で動作するよう、pytest fixture で合成データを構築・クリーンアップ。

## アクション
1. `@pytest.fixture` で temp directory, config, sample notes, scratch pad を作成
2. conftest.py で共通 fixture を定義（全テストで再利用）
3. sample notes は複数日（7日）のデータを含む（日付パターン: YYYY-MM-DD*.md）
4. scratch pad は `## 📝 先週のメモ集約` セクションを含む template として初期化
5. テスト後は自動クリーンアップ（tmp_pytest, 一時ファイル）

## 例
```python
@pytest.fixture
def temp_wiki(tmp_path):
    """Create temporary wiki structure"""
    wiki_root = tmp_path / "wiki"
    wiki_root.mkdir()
    (wiki_root / "raw" / "notes").mkdir(parents=True)
    (wiki_root / "wiki" / "life").mkdir(parents=True)
    return wiki_root

@pytest.fixture
def sample_notes(temp_wiki):
    """Create 7 days of sample notes"""
    base_date = datetime.now() - timedelta(days=6)
    for i in range(7):
        date = base_date + timedelta(days=i)
        file_path = temp_wiki / "raw" / "notes" / f"{date.strftime('%Y-%m-%d')}.md"
        file_path.write_text("Sample content", encoding='utf-8')
    return temp_wiki / "raw" / "notes"
```

