# Windows日本語ファイル名のUTF-8エンコーディング

## 背景
Windows のデフォルト エンコーディングは cp932（Shift-JIS）。日本語ファイル名を含むテストは、明示的に UTF-8 を指定しないと デコード失敗（UnicodeDecodeError）が発生する。

## アクション
- `Path.read_text()`, `open()` 呼び出しで常に `encoding='utf-8'` を指定
- テスト環境でも同様に指定（pytest fixtures を含む）
- JSON ファイル、markdown ファイル、ログファイルすべてに適用

## 例
```python
# 正しい
content = file.read_text(encoding='utf-8')
with open(path, 'r', encoding='utf-8') as f:
    data = f.read()

# 間違い（失敗する）
content = file.read_text()  # cp932 で解析、日本語でエラー
```

