# ファクト・フォーシング・ゲート プレゼンテーション

## 背景
複雑なシステムファイル（SKILL.md、実装ファイル）の編集前に、gate が必要な事実をリスト化するよう要求する。これにより編集の正当性と影響範囲が明確になる。

## アクション
1. **参照ファイル** — 当該ファイルをインポート/参照するファイルを Grep で列挙
2. **公開インターフェース** — 変更の影響を受ける関数/クラス/定数をリスト化
3. **データ構造** — 入力/出力形式、frontmatter フィールド、ファイルパス
4. **ユーザー指示** — 変更を要求したユーザーの指示を verbatim で引用
5. 提示後に元の編集操作を再実行

## 例
- **Files that reference**: `.claude/skills/monthly-healthcheck/SKILL.md`
- **Public functions**: `extract_weekly_digest_links()`, `consolidate_weekly_to_monthly()`, `reset_scratch_pad_digest_section()`
- **Data structures**: `week_ids: List[str]`, `year_month: str`, frontmatter fields
- **User instruction**: "ドキュメントを作成してください"

