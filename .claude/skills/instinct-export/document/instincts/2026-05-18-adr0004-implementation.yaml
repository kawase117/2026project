# ドキュメンテーション・ファースト仕様設計

## 背景
複数フェーズの機能実装では、実装前に仕様書（spec.md）を詳細に設計することで、実装漏れやインターフェース矛盾を事前に防ぐことができる。仕様書は関連スキル間の依存関係も明確にする。

## アクション
1. **ファイルフォーマット** — ファイル名、frontmatter、内容構造を詳細に定義
2. **世代フロー** — 各フェーズの処理ステップを箇条書きで記載
3. **データ構造** — 入出力フォーマット、日付形式、フィールド名を表で整理
4. **エラーハンドリング** — 各エラーケースの動作を明示
5. **関連スキル** — 依存するスキル、連携パターンを明記
6. 実装時はこの仕様書を reference として参照

## 例
wiki/_system/weekly-digest-spec.md:
- File Naming Convention （YYYY-WXX 形式）
- Frontmatter Structure （type, week, date_range, tags, compiled）
- Content Format （Daily sections with Japanese day names）
- Generation Flow （6 phases: Validate, Date Range, Scan, Aggregate, Write, Update Pad）
- Error Handling Table （各エラーケースの挙動）
- References （関連スキル、関連 ADR）
