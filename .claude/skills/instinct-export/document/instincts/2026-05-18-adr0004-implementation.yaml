# 相対/絶対インポート ハイブリッドパターン

## 背景
テストファイルが `sys.path.insert(0, parent)` で親ディレクトリを追加する場合、モジュール内の相対インポートは失敗する。テスト実行時のパスと実際の運用環境のパスが異なるため。

## アクション
- モジュール内で try/except でインポート方式を2つ定義
- 相対インポート (`from . import`) が失敗したら、絶対インポート (`from module import`) に fallback
- テストと運用コード両方の実行パスに対応

## 例
```python
try:
    from . import setup_logging, parse_frontmatter, git_add_commit
except ImportError:
    from __init__ import setup_logging, parse_frontmatter, git_add_commit
```

