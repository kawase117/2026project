# ISO Week計算パターン

## 背景
複数の日時を週単位で管理する際、ISO 8601 週番号を使用することで国際標準の日付範囲を確保できる。Monday-Sunday の統一された範囲計算が重要。

## アクション
- `datetime.now()` から `weekday()` で月曜日（0）を基準に計算
- 先週の範囲は `current_monday - timedelta(weeks=1)` で取得
- `isocalendar()` で ISO year, week_num を取得
- フォーマット: `f"{iso_year}-W{week_num:02d}"` で YYYY-WXX 形式に統一

## 例
```python
today = datetime.now()
current_monday = today - timedelta(days=today.weekday())
last_monday = current_monday - timedelta(weeks=1)
last_sunday = current_monday - timedelta(days=1)

iso_year, week_num, _ = last_monday.isocalendar()
week_id = f"{iso_year}-W{week_num:02d}"  # "2026-W19"
```

